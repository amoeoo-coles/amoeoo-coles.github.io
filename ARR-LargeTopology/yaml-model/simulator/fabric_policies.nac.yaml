# Network-as-Code (nac-aci data model, apic: root)
# Environment: ARR (Simulator APIC)
# Source: Saved read-only export of the reservable DevNet APIC simulator (10.10.20.14) at /workspace/nac-test-private-run/baseline-2/raw. Live aaaLogin failed (no answer within 12 s); the DevNet reservation VPN is probably not connected.
# Collected: 2026-10-28 22:16 AEDT
# Method: converted from a saved read-only APIC export (live login was not available)
# Built-in system-* interface policies are omitted. System tenants (common, infra, mgmt) are included.
# SNMP communities and SNMPv3 users are omitted from the published files.
---
apic:
  fabric_policies:
    pod_policies:
      date_time_policies:
      - name: default
        ntp_admin_state: true
        ntp_auth_state: false
        apic_ntp_server_state: false
        apic_ntp_server_master_mode: false
      snmp_policies:
      - name: default
        admin_state: false
    date_time_format:
      display_format: local
      timezone: p0_UTC
      show_offset: true
    dns_policies:
    - name: default
    pod_profiles:
    - name: default
      selectors:
      - name: default
        type: all
    pod_profile_name: default
    config_exports:
    - name: DailyAutoBackup
      format: json
      snapshot: true
      scheduler: EveryEightHours
    schedulers:
    - name: EveryEightHours
      recurring_windows:
      - name: first
        day: every-day
        hour: 1
        minute: 0
      - name: third
        day: every-day
        hour: 17
        minute: 0
      - name: second
        day: every-day
        hour: 9
        minute: 0
    coop_group_policy: compatible
    ep_loop_protection:
      action: port-disable
      admin_state: false
      detection_interval: 60
      detection_multiplier: 4
    global_settings:
      domain_validation: false
      enforce_subnet_check: true
      opflex_authentication: true
      disable_remote_endpoint_learn: false
      overlapping_vlan_validation: false
      remote_leaf_direct: true
      reallocate_gipo: false
    infra_dscp_translation_policy:
      admin_state: false
      control_plane: CS0
      policy_plane: CS4
      span: CS5
      traceroute: CS6
      level_1: CS1
      level_2: CS2
      level_3: CS3
      level_4: AF11
      level_5: AF21
      level_6: AF31
    ip_aging: false
    fabric_isis_redistribute_metric: 32
    port_tracking:
      admin_state: false
      delay: 120
      min_links: 0
    rogue_ep_control:
      admin_state: false
      hold_interval: 1800
      detection_interval: 60
      detection_multiplier: 6
