    filters:
    - name: flt-app-to-db
      entries:
      - name: mssql
        ether_type: ip
        protocol: tcp
        destination_from_port: 1433
        destination_to_port: 1433
      - name: mysql
        ether_type: ip
        protocol: tcp
        destination_from_port: 3306
        destination_to_port: 3306
      - name: postgres
        ether_type: ip
        protocol: tcp
        destination_from_port: 5432
        destination_to_port: 5432
    - name: flt-http-https
      entries:
      - name: http
        ether_type: ip
        protocol: tcp
        destination_from_port: 80
        destination_to_port: 80
      - name: https
        ether_type: ip
        protocol: tcp
        destination_from_port: 443
        destination_to_port: 443
    - name: flt-web-to-app
      entries:
      - name: http-alt
        ether_type: ip
        protocol: tcp
        destination_from_port: 8080
        destination_to_port: 8080
      - name: https
        ether_type: ip
        protocol: tcp
        destination_from_port: 443
        destination_to_port: 443
    contracts:
    - name: app-to-db
      scope: context
      subjects:
      - name: subj
        apply_both_directions: true
        reverse_filter_ports: true
        filters:
        - filter: flt-app-to-db
          action: permit
          apply_direction: both
    - name: dmz-to-web
      scope: context
      subjects:
      - name: subj
        apply_both_directions: true
        reverse_filter_ports: true
        filters:
        - filter: flt-http-https
          action: permit
          apply_direction: both
    - name: web-to-app
      scope: context
      subjects:
      - name: subj
        apply_both_directions: true
        reverse_filter_ports: true
        filters:
        - filter: flt-web-to-app
          action: permit
          apply_direction: both
    application_profiles:
    - name: cursor5_ap
      description: Three-tier application (web app db)
      endpoint_groups:
      - name: app
        description: App servers - reached from Web via FW
        bridge_domain: cursor5_app_bd
        preferred_group: false
        flood_in_encap: false
        intra_epg_isolation: false
        proxy_arp: false
        contracts:
          providers:
          - web-to-app
          consumers:
          - app-to-db
      - name: db
        description: DB servers - reached from App via FW
        bridge_domain: cursor5_db_bd
        preferred_group: false
        flood_in_encap: false
        intra_epg_isolation: false
        proxy_arp: false
        contracts:
          providers:
          - app-to-db
      - name: web
        description: Web servers - reached from DMZ via FW
        bridge_domain: cursor5_web_bd
        preferred_group: false
        flood_in_encap: false
        intra_epg_isolation: false
        proxy_arp: false
        contracts:
          providers:
          - dmz-to-web
          consumers:
          - web-to-app
    l3outs:
    - name: DMZ_L3Out
      description: DMZ L3Out on LEAF-101 eth1/3 VLAN 3051 (198.51.100.1/30, rtrId 198.51.100.101)
      vrf: cursor5_vrf
      domain: cursor5_l3_dom
      export_route_control: true
      import_route_control: false
      external_endpoint_groups:
      - name: DMZ_ExtEPG
        description: External EPG for DMZ (0.0.0.0/0 import-security), consumes dmz-to-web
        preferred_group: false
        subnets:
        - name: default
          prefix: 0.0.0.0/0
          description: Default external subnet 0.0.0.0/0 (import-security)
          import_route_control: false
          export_route_control: false
          shared_route_control: false
          import_security: true
          shared_security: false
          aggregate_import_route_control: false
          aggregate_export_route_control: false
          aggregate_shared_route_control: false
        contracts:
          consumers:
          - dmz-to-web
