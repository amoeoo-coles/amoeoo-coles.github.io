# Generated from the ACI Lab Guide policy page
# https://amoeoo-coles.github.io/aci-policy/aci-lab-guide-policy/
# Cisco Live LTRDCN-2143 pod1 tenant model. Not NetBox/ARR SSoT.
# Documentation only — must not be pushed to ARR.
# Placeholders only; no lab passwords.
apic:
  tenants:
  - name: aci_p01_tenant
    vrfs:
    - name: aci_p01_vrf
    l3outs:
    - name: aci_p01_L3out
      vrf: aci_p01_vrf
      l3_domain: aci_p01_extrtdom
      ospf:
        enabled: true
        area: 0.0.0.1
        area_type: regular
      node_profiles:
      - name: node203
        nodes:
        - node_id: 203
          router_id: 198.51.100.1
        interface_profiles:
        - name: eth1-1
          interfaces:
          - path: 203/1/1
            ip: 198.51.100.0/31
            mtu: 1500
      external_epgs:
      - name: aci_p01_l3outepg
        contracts:
          consumed:
          - common/web-ltraci-2143
    bridge_domains:
    - name: aci_p01_bd_web
      vrf: aci_p01_vrf
      unicast_routing: true
      subnets:
      - ip: 198.51.100.1/29
        public: true
        private: false
        shared: false
      l3outs:
      - aci_p01_L3out
    - name: aci_p01_bd_app
      vrf: aci_p01_vrf
      unicast_routing: true
      subnets:
      - ip: 203.0.113.1/24
        public: false
        private: true
        shared: false
    - name: aci_p01_bd_mgmt
      vrf: k8s_vrf
      unicast_routing: true
      subnets:
      - ip: 198.51.100.1/29
        public: true
        private: false
      l3outs:
      - k8s
      dhcp_relay_labels:
      - scope: tenant
        policy: aci_p01_dhcp
    - name: aci_p01_bd_l2
      vrf: aci_p01_vrf
      unicast_routing: false
      arp_flooding: true
      unknown_unicast: flood
    dhcp_relay_policies:
    - name: aci_p01_dhcp
      providers:
      - epg_type: l3out
        tenant: common
        l3out: k8s
        external_epg: k8s-epg
        dhcp_server: 198.51.100.7
    application_profiles:
    - name: aci_p01_ap_mgmt
      endpoint_groups:
      - name: aci_p01_epg_mgmt
        bridge_domain: aci_p01_bd_mgmt
        vmware_vmm_domains:
        - name: aci_p01_dc3_vds
        contracts:
          providers:
          - common/mgmt-ltraci-2143
    - name: aci_p01_ap
      endpoint_groups:
      - name: aci_p01_epg_web
        bridge_domain: aci_p01_bd_web
        vmware_vmm_domains:
        - name: aci_p01_dc3_vds
          allow_micro_segmentation: true
        contracts:
          providers:
          - common/web-ltraci-2143
          consumers:
          - aci_p01_con
        intra_epg_isolation: unenforced
      - name: aci_p01_epg_app
        bridge_domain: aci_p01_bd_app
        vmware_vmm_domains:
        - name: aci_p01_dc3_vds
        contracts:
          providers:
          - aci_p01_con
      endpoint_security_groups:
      - name: aci_p01_esg
        vrf: aci_p01_vrf
        selectors:
        - type: ip
          ip: 198.51.100.1/29
        - type: ip
          ip: 203.0.113.1/24
      useg_epgs:
      - name: aci_p01_useg_web
        bridge_domain: aci_p01_bd_web
        vmware_vmm_domains:
        - name: aci_p01_dc3_vds
          deployment_immediacy: immediate
        attributes:
        - type: vm-name
          operator: contains
          value: '02'
    - name: aci_p01_ap_L2
      endpoint_groups:
      - name: aci_p01_epg_L2
        bridge_domain: aci_p01_bd_l2
        physical_domains:
        - aci_p01_physdom
        static_ports:
        - path_type: pc
          path: aci_p01_intpolg_pc
          encap: vlan-100
    filters:
    - name: aci_p01_fil
      entries:
      - name: icmp
        ethertype: ip
        protocol: icmp
      - name: ssh
        ethertype: ip
        protocol: tcp
        destination_from: 22
        destination_to: 22
    contracts:
    - name: aci_p01_con
      subjects:
      - name: aci_p01_sub
        filters:
        - aci_p01_fil
