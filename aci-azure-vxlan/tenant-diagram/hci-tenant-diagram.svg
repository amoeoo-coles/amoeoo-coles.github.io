96" fill="#0f172a" font-size="13" font-weight="700" font-family="system-ui,Segoe UI,Arial">Web</text><text x="616" y="514" fill="#334155" font-size="11" font-family="system-ui,Segoe UI,Arial">VLAN 1611 · AP1</text></a><a href="/aci-policy/endpoint-group/" class="nbd-obj"><rect class="box nbd-box" x="800" y="460" width="180" height="76" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="800" y="460" width="7" height="76" rx="2" fill="#0f766e"/><text x="816" y="478" fill="#0f766e" font-size="10" font-weight="700" font-family="system-ui,Segoe UI,Arial">EPG</text><text x="816" y="496" fill="#0f172a" font-size="13" font-weight="700" font-family="system-ui,Segoe UI,Arial">App</text><text x="816" y="514" fill="#334155" font-size="11" font-family="system-ui,Segoe UI,Arial">VLAN 1612 · AP1</text></a><a href="/aci-policy/outside-network/" class="nbd-obj"><rect class="box nbd-box" x="1000" y="460" width="230" height="76" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2"/><rect x="1000" y="460" width="7" height="76" rx="2" fill="#4338ca"/><text x="1016" y="478" fill="#4338ca" font-size="10" font-weight="700" font-family="system-ui,Segoe UI,Arial">L3Out EPG</text><text x="1016" y="496" fill="#0f172a" font-size="13" font-weight="700" font-family="system-ui,Segoe UI,Arial">Shared_L3Out</text><text x="1016" y="514" fill="#334155" font-size="11" font-family="system-ui,Segoe UI,Arial">common tenant</text></a><a href="/aci-policy/contract/" class="nbd-obj"><rect class="box nbd-box" x="430" y="600" width="220" height="70" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="430" y="600" width="7" height="70" rx="2" fill="#dc2626"/><text x="446" y="618" fill="#dc2626" font-size="10" font-weight="700" font-family="system-ui,Segoe UI,Arial">CONTRACT</text><text x="446" y="636" fill="#0f172a" font-size="13" font-weight="700" font-family="system-ui,Segoe UI,Arial">Allow-Shared-L3Out</text><text x="446" y="654" fill="#334155" font-size="11" font-family="system-ui,Segoe UI,Arial">provided by common</text></a><a href="/aci-policy/contract/" class="nbd-obj"><rect class="box nbd-box" x="690" y="600" width="220" height="70" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="690" y="600" width="7" height="70" rx="2" fill="#dc2626"/><text x="706" y="618" fill="#dc2626" font-size="10" font-weight="700" font-family="system-ui,Segoe UI,Arial">CONTRACT</text><text x="706" y="636" fill="#0f172a" font-size="13" font-weight="700" font-family="system-ui,Segoe UI,Arial">Web-to-App</text><text x="706" y="654" fill="#334155" font-size="11" font-family="system-ui,Segoe UI,Arial">scope VRF</text></a><path d="M 495 536 C 495 568.0, 520 568.0, 520 600" fill="none" stroke="#2563eb" stroke-width="1.6"/><path d="M 690 536 C 690 568.0, 540 568.0, 540 600" fill="none" stroke="#0f766e" stroke-width="1.6"/><path d="M 890 536 C 890 568.0, 540 568.0, 540 600" fill="none" stroke="#0f766e" stroke-width="1.6"/><path d="M 1115 536 C 1115 568.0, 540 568.0, 540 600" fill="none" stroke="#4338ca" stroke-width="1.6"/><path d="M 690 536 C 690 568.0, 800 568.0, 800 600" fill="none" stroke="#dc2626" stroke-width="1.6"/><path d="M 890 536 C 890 568.0, 800 568.0, 800 600" fill="none" stroke="#dc2626" stroke-width="1.6"/><text x="24" y="720" fill="#334155" font-size="12" font-family="system-ui,Segoe UI,Arial">Storage-A and Storage-B have no contract with another EPG: the paper says storage traffic stays inside its segment (BD).</text><text x="24" y="742" fill="#64748b" font-size="11" font-family="system-ui,Segoe UI,Arial">VLANs 1600/1601/1602/1611/1612 and subnets 10.1.1.254/24 and 192.168.1.254/24 are the paper’s Table 5 and Table 6 examples. The procedure later also cites vlan-107 and vlan-207 for storage.</text><text x="24" y="764" fill="#64748b" font-size="11" font-family="system-ui,Segoe UI,Arial">Optional BGW stretch of VRF1/BD1 toward a remote NX-OS EVPN site is shown on the YAML and logical pages, not as extra tenant objects here.</text></svg>