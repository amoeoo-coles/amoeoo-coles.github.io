<!-- theme-boot v2 -->
<script id="tt-boot">(function(){
  var t;
  try{t=localStorage.getItem('siteTheme')}catch(e){t=null}
  if(t!=='light'&&t!=='dark'){
    t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  var h=document.documentElement;
  h.setAttribute('data-theme',t);
  h.style.colorScheme=t;
})();</script>
<style id="tt-theme">
/* Site-wide light/dark theme. Driven by html[data-theme], set early in <head>. */
:root,
html[data-theme="light"]{
  color-scheme:light;
  --site-content-max:1200px;
  --site-content-pad:20px;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e2e8f0;
  --bg:#f8fafc;
  --card:#ffffff;
  --code:#0b1220;
  --code-fg:#e2e8f0;
  --link:#1d4ed8;
  --menu-bg:#f1f5f9;
  --menu-fg:#0f172a;
  --menu-pill:#ffffff;
  --menu-pill-bd:#cbd5e1;
  --menu-pill-fg:#0f172a;
  --menu-hover:#e2e8f0;
  --menu-on:#2563eb;
  --menu-on-fg:#ffffff;
  --menu-sub:#e8eef7;
  --btn-bg:#ffffff;
  --btn-fg:#0f172a;
  --btn-bd:#94a3b8;
  --th-bg:#f1f5f9;
  --chip:#e2e8f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#e2e8f0;
    --muted:#94a3b8;
    --line:#334155;
    --bg:#0f172a;
    --card:#1e293b;
    --code:#020617;
    --code-fg:#e2e8f0;
    --link:#93c5fd;
    --menu-bg:#020617;
    --menu-fg:#cbd5e1;
    --menu-pill:#1e293b;
    --menu-pill-bd:#334155;
    --menu-pill-fg:#e2e8f0;
    --menu-hover:#334155;
    --menu-on:#2563eb;
    --menu-on-fg:#ffffff;
    --menu-sub:#0b1a33;
    --btn-bg:#1e293b;
    --btn-fg:#e2e8f0;
    --btn-bd:#475569;
    --th-bg:#163056;
    --chip:#334155;
  }
}
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e2e8f0;
  --muted:#94a3b8;
  --line:#334155;
  --bg:#0f172a;
  --card:#1e293b;
  --code:#020617;
  --code-fg:#e2e8f0;
  --link:#93c5fd;
  --menu-bg:#020617;
  --menu-fg:#cbd5e1;
  --menu-pill:#1e293b;
  --menu-pill-bd:#334155;
  --menu-pill-fg:#e2e8f0;
  --menu-hover:#334155;
  --menu-on:#2563eb;
  --menu-on-fg:#ffffff;
  --menu-sub:#0b1a33;
  --btn-bg:#1e293b;
  --btn-fg:#e2e8f0;
  --btn-bd:#475569;
  --th-bg:#163056;
  --chip:#334155;
}

html,body{
  background:var(--bg);
  color:var(--ink);
}


/* Shared content column. Every public page uses one centred max width.
   Per-generator max-widths are overridden here so a missed rebuild cannot
   reopen the narrow/wide mismatch. Wide tables and diagrams scroll inside
   their card (overflow-x:auto) instead of stretching the page.
   A documented wider variant is not used: diagrams already sit in .diag /
   .treewrap / .scroll cards. */
html{
  overflow-x:hidden;
}
body{
  max-width:var(--site-content-max) !important;
  width:100% !important;
  margin-left:auto !important;
  margin-right:auto !important;
  padding-left:var(--site-content-pad) !important;
  padding-right:var(--site-content-pad) !important;
  box-sizing:border-box;
  overflow-x:hidden;
  min-width:0;
}
main,
main.wide,
main.art{
  max-width:none !important;
  width:100%;
  margin-left:0 !important;
  margin-right:0 !important;
  padding-left:0 !important;
  padding-right:0 !important;
  box-sizing:border-box;
  min-width:0;
  overflow-x:auto;
}
.wrapx{
  max-width:none !important;
  width:100%;
  box-sizing:border-box;
  min-width:0;
  overflow-x:auto;
}
nav.site.im{
  width:100%;
  max-width:none;
  box-sizing:border-box;
  padding-left:0 !important;
  padding-right:0 !important;
}
.treewrap,
.diag,
.tblwrap,
.scroll,
.wrapt,
#pagehist .wrapt,
.codebox,
pre,
.shot-wide{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  overflow-x:auto;
}
img{
  max-width:100%;
  height:auto;
}
figure{
  max-width:100%;
  box-sizing:border-box;
}
#mrtg,
#mrtg .g,
#pagehist{
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}
#mrtg .g{overflow-x:auto}
#mrtg svg{
  display:block;
  width:100%;
  max-width:100%;
  height:auto;
  overflow:hidden;
}


/* Force the chosen theme over pages that hard-code #111 / #eee or #fff. */
html[data-theme="light"],
html[data-theme="light"] body{
  background:var(--bg)!important;
  color:var(--ink)!important;
}
html[data-theme="dark"],
html[data-theme="dark"] body{
  background:var(--bg)!important;
  color:var(--ink)!important;
}

html[data-theme="light"] main,
html[data-theme="dark"] main,
html[data-theme="light"] header,
html[data-theme="dark"] header,
html[data-theme="light"] footer,
html[data-theme="dark"] footer{
  background-color:transparent;
  color:var(--ink);
}

html[data-theme="light"] a:not(.mi):not(.sl):not(.sg-link):not(#sg-link):not(#mm-link):not(.kicker),
html[data-theme="dark"] a:not(.mi):not(.sl):not(.sg-link):not(#sg-link):not(#mm-link):not(.kicker){
  color:var(--link);
}

/* Cards, tables, code, notes — follow the theme */
html[data-theme="light"] table,
html[data-theme="dark"] table,
html[data-theme="light"] .card,
html[data-theme="dark"] .card,
html[data-theme="light"] .pbox,
html[data-theme="dark"] .pbox,
html[data-theme="light"] .group,
html[data-theme="dark"] .group,
html[data-theme="light"] .kpi,
html[data-theme="dark"] .kpi,
html[data-theme="light"] .wrap,
html[data-theme="dark"] .wrap,
html[data-theme="light"] .treewrap,
html[data-theme="dark"] .treewrap,
html[data-theme="light"] .lab-sec,
html[data-theme="dark"] .lab-sec,
html[data-theme="light"] .lab-break,
html[data-theme="dark"] .lab-break,
html[data-theme="light"] .related a,
html[data-theme="dark"] .related a,
html[data-theme="light"] .pn a,
html[data-theme="dark"] .pn a,
html[data-theme="light"] input,
html[data-theme="dark"] input,
html[data-theme="light"] select,
html[data-theme="dark"] select,
html[data-theme="light"] textarea,
html[data-theme="dark"] textarea{
  background-color:var(--card)!important;
  color:var(--ink)!important;
  border-color:var(--line)!important;
}
html[data-theme="light"] th,
html[data-theme="dark"] th{
  background:var(--th-bg)!important;
  color:var(--ink)!important;
  border-color:var(--line)!important;
}
html[data-theme="light"] td,
html[data-theme="dark"] td{
  border-color:var(--line)!important;
  color:var(--ink)!important;
}
html[data-theme="light"] pre,
html[data-theme="dark"] pre,
html[data-theme="light"] .codebox,
html[data-theme="dark"] .codebox,
html[data-theme="light"] .codebox pre,
html[data-theme="dark"] .codebox pre{
  background:var(--code)!important;
  color:var(--code-fg)!important;
  border-color:var(--line)!important;
}
html[data-theme="light"] .dn,
html[data-theme="dark"] .dn,
html[data-theme="light"] .dn-chip,
html[data-theme="dark"] .dn-chip,
html[data-theme="light"] code,
html[data-theme="dark"] code{
  background:var(--chip)!important;
  color:var(--ink)!important;
}
html[data-theme="light"] pre code,
html[data-theme="dark"] pre code,
html[data-theme="light"] .codebox code,
html[data-theme="dark"] .codebox code{
  background:transparent!important;
  color:inherit!important;
}
html[data-theme="light"] h1,
html[data-theme="dark"] h1,
html[data-theme="light"] h2,
html[data-theme="dark"] h2,
html[data-theme="light"] h3,
html[data-theme="dark"] h3,
html[data-theme="light"] h4,
html[data-theme="dark"] h4,
html[data-theme="light"] p,
html[data-theme="dark"] p,
html[data-theme="light"] li,
html[data-theme="dark"] li,
html[data-theme="light"] dt,
html[data-theme="dark"] dt,
html[data-theme="light"] dd,
html[data-theme="dark"] dd,
html[data-theme="light"] label,
html[data-theme="dark"] label,
html[data-theme="light"] figcaption,
html[data-theme="dark"] figcaption{
  color:var(--ink);
}
html[data-theme="light"] .lede,
html[data-theme="dark"] .lede,
html[data-theme="light"] .crumb,
html[data-theme="dark"] .crumb,
html[data-theme="light"] .field-help,
html[data-theme="dark"] .field-help,
html[data-theme="light"] .muted,
html[data-theme="dark"] .muted,
html[data-theme="light"] .tr17,
html[data-theme="dark"] .tr17,
html[data-theme="light"] .hint,
html[data-theme="dark"] .hint,
html[data-theme="light"] .lead,
html[data-theme="dark"] .lead{
  color:var(--muted)!important;
}
html[data-theme="light"] .note,
html[data-theme="dark"] .note,
html[data-theme="light"] .warn,
html[data-theme="dark"] .warn,
html[data-theme="light"] .example-flag,
html[data-theme="dark"] .example-flag{
  background-color:var(--card)!important;
  color:var(--ink)!important;
  border-color:var(--line)!important;
}
html[data-theme="dark"] .note{background:#163056!important;border-left-color:#3b82f6!important}
html[data-theme="dark"] .warn{background:#3b2a12!important;border-left-color:#f59e0b!important}
html[data-theme="dark"] .example-flag{background:#3b1515!important;border-left-color:#ef4444!important}
html[data-theme="light"] .kicker,
html[data-theme="dark"] .kicker{color:#fff}

/* Menu follows the same theme (overrides the old inline #111 panel).
   Full-width equal grid: 6 columns on wide screens (11 items + Suggest/Dark
   fill two even rows), 4 columns on mid widths, 2 columns on mobile. */
nav.site,
nav.site.im{
  display:flex!important;
  flex-direction:column;
  align-items:stretch;
  box-sizing:border-box;
  width:100%;
  margin:0!important;
  padding:8px 12px 10px;
  gap:8px;
  background:var(--menu-bg)!important;
  color:var(--menu-fg)!important;
  border-bottom:1px solid var(--line)!important;
  font:600 12.5px/1 system-ui,Arial,sans-serif;
}
nav.site.im .im-main,
nav.site.im .im-sub-pills{
  display:grid!important;
  width:100%;
  gap:6px;
  grid-template-columns:repeat(6,minmax(0,1fr));
  align-items:stretch;
}
nav.site.im .im-sub{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  width:100%;
  box-sizing:border-box;
  gap:6px;
  margin:0;
  padding:8px;
  border-left:3px solid var(--menu-on)!important;
  background:var(--menu-sub)!important;
  border-radius:8px;
}
nav.site.im a.sl{
  color:var(--link)!important;
  font-size:12px;
  font-weight:700;
  text-decoration:none;
  padding:0 2px;
}
nav.site.im a.mi{
  display:flex!important;
  align-items:center;
  gap:6px;
  box-sizing:border-box;
  width:100%;
  height:auto;
  min-height:44px;
  min-width:0;
  padding:8px 10px;
  border-radius:18px;
  border:1px solid var(--menu-pill-bd)!important;
  background:var(--menu-pill)!important;
  color:var(--menu-pill-fg)!important;
  text-decoration:none!important;
  transition:background .12s;
}
nav.site.im a.mi:hover{background:var(--menu-hover)!important}
nav.site.im a.mi.on{
  background:var(--menu-on)!important;
  border-color:var(--menu-on)!important;
  color:var(--menu-on-fg)!important;
}
nav.site.im a.mi.sm{font-size:12px;height:auto;min-height:44px}
nav.site.im a.mi.sm.on{background:#1d4ed8!important;border-color:#1d4ed8!important;color:#fff!important}
nav.site.im a.mi .ic{font-size:15px;line-height:1;flex:none}
nav.site.im a.mi .im-l{
  flex:1 1 auto;
  min-width:0;
  overflow:visible;
  text-overflow:unset;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-height:1.25;
  text-align:left;
}
nav.site.im a.mi .im-n{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  margin-left:auto;
  min-width:16px;
  height:16px;
  padding:0 5px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1;
  background:#93c5fd;
  color:#0f172a;
}
nav.site.im a.mi.on .im-n{background:#fff;color:#1d4ed8}
nav.site.im a.mi .im-seq{
  display:inline-flex!important;
  align-items:center;
  justify-content:center;
  flex:none;
  min-width:22px;
  height:22px;
  padding:0 5px;
  border-radius:999px;
  font-size:16px!important;
  font-weight:800;
  line-height:1;
  background:#0f172a!important;
  color:#fff!important;
}
html[data-theme="dark"] nav.site.im a.mi .im-seq{
  background:#f8fafc!important;
  color:#0f172a!important;
}
nav.site.im a.mi.on .im-seq{
  background:#fff!important;
  color:#1d4ed8!important;
}

/* Suggest + Dark sit on a right-aligned toolbar row above the menu grid, not in a pill cell. */
#tt-wrap{
  position:static!important;
  z-index:auto;
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  align-items:center;
  justify-content:flex-end;
  box-sizing:border-box;
  width:100%;
  height:36px;
  padding:0;
  flex:none;
}
#sg-link,#tt-btn,#mm-link{
  font:600 12px/1 system-ui,Arial,sans-serif;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:36px;
  padding:0 12px;
  border-radius:18px;
  border:1px solid var(--btn-bd);
  background:var(--btn-bg);
  color:var(--btn-fg);
  cursor:pointer;
  opacity:.92;
  text-decoration:none;
  white-space:nowrap;
  flex:none;
}
#sg-link:hover,#tt-btn:hover,#mm-link:hover{opacity:1}
#mm-link{width:36px;padding:0}
#mm-link svg{display:block;flex:none}
#sg-link .sg-short{display:none}
@media (max-width:1099px){
  nav.site.im .im-main,
  nav.site.im .im-sub-pills{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:720px){
  nav.site.im .im-main,
  nav.site.im .im-sub-pills{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tt-wrap{flex-wrap:nowrap;width:100%;height:36px}
  #sg-link .sg-wide{display:none}
  #sg-link .sg-short{display:inline}
  #sg-link,#tt-btn,#mm-link{height:36px;padding:0 10px}
}

/* SVG labels on themed canvases: dark text on light, light text on dark.
   Coloured strokes/fills on the boxes themselves are left alone. */
html[data-theme="dark"] .treewrap svg rect.box,
html[data-theme="dark"] .treewrap svg rect[fill="#fff"],
html[data-theme="dark"] .treewrap svg rect[fill="#ffffff"],
html[data-theme="dark"] svg.arch rect[fill="#fff"]{
  fill:var(--card);
}
html[data-theme="dark"] .treewrap svg text,
html[data-theme="dark"] svg.arch text[fill="#0f172a"],
html[data-theme="dark"] svg.arch text[fill="#475569"]{
  fill:var(--ink);
}
html[data-theme="light"] .treewrap{background:var(--card)!important}

/* APIC dialog replicas: keep the form chrome readable in both themes. */
html[data-theme="dark"] .apic{
  background:#1e293b!important;color:#e2e8f0!important;border-color:#475569!important;
}
html[data-theme="dark"] .apic .fake-input,
html[data-theme="dark"] .apic input,
html[data-theme="dark"] .apic select{
  background:#0f172a!important;color:#e2e8f0!important;border-color:#475569!important;
}

/* Copy buttons and chips */
html[data-theme="dark"] .copy,
html[data-theme="dark"] .copy-dn{
  background:var(--btn-bg)!important;color:var(--btn-fg)!important;border-color:var(--btn-bd)!important;
}
html[data-theme="dark"] a.dn-chip:hover{background:#1e3a5f!important;color:#93c5fd!important}

/* Visitor badge stays green; don't force ink on it. */
.uv,.uvc{color:#fff!important}

</style>
