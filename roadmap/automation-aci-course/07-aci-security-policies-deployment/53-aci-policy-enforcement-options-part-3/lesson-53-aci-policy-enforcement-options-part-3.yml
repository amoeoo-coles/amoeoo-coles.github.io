# Lesson 53 — intra-EPG isolation (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 53 — intra-EPG isolation (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Enable intra-EPG isolation on EPG WEB
      cisco.aci.aci_epg:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        epg: WEB
        intra_epg_isolation: enforced
        state: present
    - name: Return isolation to unenforced
      cisco.aci.aci_epg:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        epg: WEB
        intra_epg_isolation: unenforced
        state: present
