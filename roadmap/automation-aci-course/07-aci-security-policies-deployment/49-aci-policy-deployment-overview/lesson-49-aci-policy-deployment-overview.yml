# Lesson 49 — query contract deployment objects (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 49 — query contract deployment objects (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query contracts
      cisco.aci.aci_contract:
        <<: *aci_login
        state: query
    - name: Query EPG-to-contract attachments
      cisco.aci.aci_epg_to_contract:
        <<: *aci_login
        contract_type: provider
        state: query
