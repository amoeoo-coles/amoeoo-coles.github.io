# Lesson 11 — obtain a distinguished name (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 11 — obtain a distinguished name (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query one tenant and inspect its DN in the result
      cisco.aci.aci_tenant:
        <<: *aci_login
        tenant: Example-Tenant
        state: query
    - name: Fetch the same object by DN
      cisco.aci.aci_rest:
        <<: *aci_login
        path: /api/mo/uni/tn-Example-Tenant.json?query-target=self
        method: get
