# Lesson 14 — moquery equivalent via aci_rest (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 14 — moquery equivalent via aci_rest (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Class query with a name filter, equivalent to moquery -c fvAEPg
      cisco.aci.aci_rest:
        <<: *aci_login
        path: /api/class/fvAEPg.json?query-target-filter=eq(fvAEPg.name,"WEB")
        method: get
