# Lesson 63 — query L3Out logical interfaces (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 63 — query L3Out logical interfaces (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query L3Out routed/SVI/sub-interface objects
      cisco.aci.aci_l3out_interface:
        <<: *aci_login
        state: query
