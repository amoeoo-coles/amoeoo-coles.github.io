# Lesson 69 — L3Out OSPF lab (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 69 — L3Out OSPF lab (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create an OSPF L3Out
      cisco.aci.aci_l3out:
        <<: *aci_login
        tenant: Example-Tenant
        l3out: Example-OSPF-L3Out
        vrf: Example-VRF
        domain: Example-L3Dom
        l3protocol:
          - ospf
        state: present
    - name: Remove the example OSPF L3Out (cleanup)
      cisco.aci.aci_l3out:
        <<: *aci_login
        tenant: Example-Tenant
        l3out: Example-OSPF-L3Out
        state: absent
