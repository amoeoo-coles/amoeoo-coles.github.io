# Lesson 73 — route-control lab part 2, shared-rtctrl (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 73 — route-control lab part 2, shared-rtctrl (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Add a shared-rtctrl subnet
      cisco.aci.aci_l3out_extsubnet:
        <<: *aci_login
        tenant: Example-Tenant
        l3out: Example-L3Out
        extepg: Example-ExtEPG
        network: 10.100.0.0/16
        scope:
          - import-security
          - shared-rtctrl
          - shared-security
        state: present
