# Lesson 05 — query controller and management objects (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 05 — query controller and management objects (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query APIC system information
      cisco.aci.aci_system:
        <<: *aci_login
        state: query
    - name: Get the top-level management tenant
      cisco.aci.aci_rest:
        <<: *aci_login
        path: /api/mo/uni/tn-mgmt.json?query-target=self
        method: get
