# Lesson 41 — query VLAN pools and EPG encaps (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 41 — query VLAN pools and EPG encaps (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query VLAN pools
      cisco.aci.aci_vlan_pool:
        <<: *aci_login
        state: query
    - name: Class query for EPG static path encaps
      cisco.aci.aci_rest:
        <<: *aci_login
        path: /api/class/fvRsPathAtt.json?page-size=20
        method: get
