# Lesson 40 — query interface policy groups used with NIC teaming (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 40 — query interface policy groups used with NIC teaming (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query interface policy groups (access, PC, vPC)
      cisco.aci.aci_interface_policy_leaf_policy_group:
        <<: *aci_login
        state: query
