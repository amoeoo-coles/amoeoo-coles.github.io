# Lesson 78 — bridge-domain and EPG subnet shared-between-VRFs flags (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 78 — bridge-domain and EPG subnet shared-between-VRFs flags (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Set Shared between VRFs on a BD subnet in tenant common (example)
      cisco.aci.aci_bd_subnet:
        <<: *aci_login
        tenant: common
        bd: Shared-BD
        gateway: 10.2.2.1
        mask: 24
        scope:
          - public
          - shared
        state: present
    - name: For inter-VRF shared services, also place the provider subnet under the EPG
      cisco.aci.aci_epg_subnet:
        <<: *aci_login
        tenant: Example-Provider
        ap: Prov-AP
        epg: Prov-EPG
        gateway: 10.2.2.1
        mask: 24
        scope:
          - public
          - shared
        state: present
