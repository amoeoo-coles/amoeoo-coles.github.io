# Lesson 79 — query L4-7 devices and service graph templates (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 79 — query L4-7 devices and service graph templates (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query L4-7 device clusters
      cisco.aci.aci_l4l7_device:
        <<: *aci_login
        state: query
    - name: Query L4-7 service graph templates
      cisco.aci.aci_l4l7_service_graph_template:
        <<: *aci_login
        state: query
