# Lesson 16 — query access-policy containers (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 16 — query access-policy containers (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Get the infra access-policy root
      cisco.aci.aci_rest:
        <<: *aci_login
        path: /api/mo/uni/infra.json?query-target=self
        method: get
    - name: Query VLAN pools
      cisco.aci.aci_vlan_pool:
        <<: *aci_login
        state: query
