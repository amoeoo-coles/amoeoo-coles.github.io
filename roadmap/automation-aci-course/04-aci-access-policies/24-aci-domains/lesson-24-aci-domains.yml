# Lesson 24 — physical domain (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 24 — physical domain (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create a physical domain
      cisco.aci.aci_domain:
        <<: *aci_login
        domain: Example-PhysDom
        domain_type: phys
        state: present
    - name: Remove the example domain (cleanup)
      cisco.aci.aci_domain:
        <<: *aci_login
        domain: Example-PhysDom
        domain_type: phys
        state: absent
