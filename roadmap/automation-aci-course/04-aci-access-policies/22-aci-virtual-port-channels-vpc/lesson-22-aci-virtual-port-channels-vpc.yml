# Lesson 22 — vPC protection group and vPC IPG (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 22 — vPC protection group and vPC IPG (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create a vPC protection group for leaves 101 and 102
      cisco.aci.aci_switch_policy_vpc_protection_group:
        <<: *aci_login
        protection_group: Example-VPC-Pair
        protection_group_id: 101
        pod_id: 1
        switch_1_id: 101
        switch_2_id: 102
        state: present
    - name: Create a vPC interface policy group
      cisco.aci.aci_interface_policy_leaf_policy_group:
        <<: *aci_login
        policy_group: Example-VPC-IPG
        lag_type: node
        description: Example vPC Interface Policy Group
        state: present
    - name: Remove the example vPC IPG (cleanup)
      cisco.aci.aci_interface_policy_leaf_policy_group:
        <<: *aci_login
        policy_group: Example-VPC-IPG
        lag_type: node
        state: absent
    - name: Remove the example protection group (cleanup)
      cisco.aci.aci_switch_policy_vpc_protection_group:
        <<: *aci_login
        protection_group: Example-VPC-Pair
        state: absent
