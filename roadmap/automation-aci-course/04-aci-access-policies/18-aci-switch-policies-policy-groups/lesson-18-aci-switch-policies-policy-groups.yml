# Lesson 18 — query switch profiles and policy groups (read-only)
# Read-only example. It only queries the APIC; it does not change fabric policy.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 18 — query switch profiles and policy groups (read-only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Query leaf switch profiles
      cisco.aci.aci_switch_policy_leaf_profile:
        <<: *aci_login
        state: query
    - name: Query vPC protection groups
      cisco.aci.aci_switch_policy_vpc_protection_group:
        <<: *aci_login
        state: query
