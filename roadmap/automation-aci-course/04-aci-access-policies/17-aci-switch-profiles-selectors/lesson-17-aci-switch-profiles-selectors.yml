# Lesson 17 — switch profile and leaf selector (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 17 — switch profile and leaf selector (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create an example leaf profile
      cisco.aci.aci_switch_policy_leaf_profile:
        <<: *aci_login
        leaf_profile: Example-Leaf-Profile
        description: Example switch profile
        state: present
    - name: Add a selector for leaf 101
      cisco.aci.aci_switch_leaf_selector:
        <<: *aci_login
        leaf_profile: Example-Leaf-Profile
        leaf: LEAF101
        from: 101
        to: 101
        state: present
    - name: Remove the example profile (cleanup)
      cisco.aci.aci_switch_policy_leaf_profile:
        <<: *aci_login
        leaf_profile: Example-Leaf-Profile
        state: absent
