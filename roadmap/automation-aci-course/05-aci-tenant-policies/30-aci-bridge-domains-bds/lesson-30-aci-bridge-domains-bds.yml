# Lesson 30 — bridge domain (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 30 — bridge domain (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create a routed bridge domain
      cisco.aci.aci_bd:
        <<: *aci_login
        tenant: Example-Tenant
        bd: Example-BD
        vrf: Example-VRF
        enable_routing: true
        arp_flooding: true
        l2_unknown_unicast: proxy
        state: present
    - name: Remove the example BD (cleanup)
      cisco.aci.aci_bd:
        <<: *aci_login
        tenant: Example-Tenant
        bd: Example-BD
        state: absent
