# Lesson 34 — attach an EPG to a physical domain (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 34 — attach an EPG to a physical domain (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Bind EPG WEB to a physical domain and VLAN 201
      cisco.aci.aci_epg_to_domain:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        epg: WEB
        domain: Example-PhysDom
        domain_type: phys
        encap: vlan-201
        state: present
    - name: Remove the example domain binding (cleanup)
      cisco.aci.aci_epg_to_domain:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        epg: WEB
        domain: Example-PhysDom
        domain_type: phys
        state: absent
