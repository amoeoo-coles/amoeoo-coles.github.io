# Lesson 29 — VRF (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 29 — VRF (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Ensure the example tenant exists
      cisco.aci.aci_tenant:
        <<: *aci_login
        tenant: Example-Tenant
        state: present
    - name: Create a VRF with policy enforcement enabled
      cisco.aci.aci_vrf:
        <<: *aci_login
        tenant: Example-Tenant
        vrf: Example-VRF
        policy_control_preference: enforced
        state: present
    - name: Remove the example VRF (cleanup)
      cisco.aci.aci_vrf:
        <<: *aci_login
        tenant: Example-Tenant
        vrf: Example-VRF
        state: absent
