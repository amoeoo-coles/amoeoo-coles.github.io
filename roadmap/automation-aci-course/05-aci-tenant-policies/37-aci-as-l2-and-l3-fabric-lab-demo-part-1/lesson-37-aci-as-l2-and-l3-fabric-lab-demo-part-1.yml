# Lesson 37 — L2/L3 fabric lab, tenant + VRF + BD (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 37 — L2/L3 fabric lab, tenant + VRF + BD (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create the lab tenant
      cisco.aci.aci_tenant:
        <<: *aci_login
        tenant: Example-Tenant
        state: present
    - name: Create the lab VRF
      cisco.aci.aci_vrf:
        <<: *aci_login
        tenant: Example-Tenant
        vrf: Example-VRF
        state: present
    - name: Create a routed BD
      cisco.aci.aci_bd:
        <<: *aci_login
        tenant: Example-Tenant
        bd: Example-BD
        vrf: Example-VRF
        enable_routing: true
        state: present
