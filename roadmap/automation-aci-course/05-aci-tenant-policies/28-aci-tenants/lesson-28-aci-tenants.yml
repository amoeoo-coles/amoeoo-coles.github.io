# Lesson 28 — tenant (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 28 — tenant (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create Example-Tenant
      cisco.aci.aci_tenant:
        <<: *aci_login
        tenant: Example-Tenant
        description: Example tenant for this course
        state: present
    - name: Remove Example-Tenant (cleanup)
      cisco.aci.aci_tenant:
        <<: *aci_login
        tenant: Example-Tenant
        state: absent
