# Lesson 33 — endpoint group (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 33 — endpoint group (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create an EPG bound to the example BD
      cisco.aci.aci_epg:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        epg: WEB
        bd: Example-BD
        description: Example web EPG
        state: present
    - name: Remove the example EPG (cleanup)
      cisco.aci.aci_epg:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        epg: WEB
        state: absent
