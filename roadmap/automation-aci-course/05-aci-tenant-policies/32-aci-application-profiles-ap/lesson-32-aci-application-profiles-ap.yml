# Lesson 32 — application profile (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 32 — application profile (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create an application profile
      cisco.aci.aci_ap:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        description: Example application profile
        state: present
    - name: Remove the example application profile (cleanup)
      cisco.aci.aci_ap:
        <<: *aci_login
        tenant: Example-Tenant
        ap: Example-AP
        state: absent
