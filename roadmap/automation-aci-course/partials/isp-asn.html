<!-- isp-asn v1 -->
<script id="isp-asn">(function(){
try{if(sessionStorage.getItem('ispAsnSent'))return}catch(e){}
function asnOf(v){var s=String(v||'').toUpperCase().replace(/^AS/,'');return /^\d+$/.test(s)?'AS'+s:''}
function pick(d){
  if(!d||typeof d!=='object')return null;
  var cc=String(d.country_code||d.countryCode||'').toUpperCase();
  if(!/^[A-Z]{2}$/.test(cc)) cc='XX';
  var asn='',org='';
  if(d.connection&&typeof d.connection==='object'){
    asn=d.connection.asn;org=d.connection.org||d.connection.isp||'';
  }
  asn=asnOf(asn||d.asn||d.as);
  if(!asn)return null;
  org=String(org||d.organization_name||d.organization||d.org||d.isp||d.asn_organization||'').replace(/^AS\d+\s*/i,'').trim()||asn;
  return {cc:cc,asn:asn,org:org.slice(0,120)};
}
function get(url){return fetch(url,{credentials:'omit',cache:'no-store',mode:'cors'}).then(function(r){return r.ok?r.json():Promise.reject()})}
function send(x){
  function go(){
    try{
      if(!window.goatcounter||typeof window.goatcounter.count!=='function')return false;
      window.goatcounter.count({path:'isp/'+x.cc+'/'+x.asn,title:x.org,event:true});
      try{sessionStorage.setItem('ispAsnSent','1')}catch(e){}
      return true;
    }catch(e){return true}
  }
  if(go())return;
  var n=0,t=setInterval(function(){if(go()||++n>40)clearInterval(t)},250);
}
get('https://get.geojs.io/v1/ip/geo.json').then(pick).catch(function(){return null}).then(function(x){
  if(x)return x;
  return get('https://ipwho.is/').then(pick);
}).then(function(x){if(x)send(x)}).catch(function(){});
})();</script>
