# Lesson 61 — MCP interface policy (lab only)
# Lab only. Do not run this playbook against a production APIC.
# Credentials are placeholders. Never put a real password, token, or APIC address in this file.
---
- name: Lesson 61 — MCP interface policy (lab only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aci_login: &aci_login
      host: "{{ apic_host }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: false  # lab only; do not disable certificate verification in production
  tasks:
    - name: Create an MCP policy with MCP enabled
      cisco.aci.aci_interface_policy_mcp:
        <<: *aci_login
        mcp: Example-MCP-Enable
        admin_state: true
        description: Example Mis-Cabling Protocol policy
        state: present
    - name: Remove the example MCP policy (cleanup)
      cisco.aci.aci_interface_policy_mcp:
        <<: *aci_login
        mcp: Example-MCP-Enable
        state: absent
