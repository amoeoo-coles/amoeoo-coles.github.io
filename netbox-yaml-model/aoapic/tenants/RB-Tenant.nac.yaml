# Network-as-Code (nac-aci data model, apic: root)
# Environment: AOAPIC — complete ACI model
# Source: Live read-only collection from the Cisco DevNet Always-On APIC sandbox (sandboxapicdc.cisco.com)
# Collected: 10 Nov 2026 08:04:03 AEDT
# Method: read-only aaaLogin + GET class/mo queries + aaaLogout
# Built-in system-* interface policies are omitted. System tenants (common, infra, mgmt) are included.
# SNMP communities and SNMPv3 users are omitted from the published files.
---
apic:
  tenants:
  - name: RB-Tenant
    vrfs:
    - name: RB-VRF
      data_plane_learning: true
      enforcement_direction: ingress
      enforcement_preference: enforced
      preferred_group: false
    bridge_domains:
    - name: RB-BD
      vrf: RB-VRF
      arp_flooding: true
      advertise_host_routes: false
      ip_dataplane_learning: true
      limit_ip_learn_to_subnets: true
      unicast_routing: false
      unknown_unicast: proxy
      unknown_ipv4_multicast: flood
      unknown_ipv6_multicast: flood
      l3_multicast: false
      multi_destination_flooding: bd-flood
      clear_remote_mac_entries: false
      mac: 00:22:BD:F8:19:FF
      subnets:
      - ip: 10.10.10.1/24
        public: true
        private: false
        shared: false
        primary_ip: false
        virtual: false
        nd_ra_prefix: false
        no_default_gateway: false
        igmp_querier: false
    application_profiles:
    - name: FTP
      endpoint_groups:
      - name: FTP-EPG
        bridge_domain: default
        flood_in_encap: false
        intra_epg_isolation: false
        proxy_arp: false
        preferred_group: false
        qos_class: level3
        static_ports:
        - vlan: 100
          deployment_immediacy: lazy
          mode: untagged
          pod_id: 1
          node_id: 101
          module: 1
          port: 1
        - vlan: 101
          deployment_immediacy: lazy
          mode: untagged
          pod_id: 1
          node_id: 101
          module: 1
          port: 2
        contracts:
          providers:
          - FTP
          consumers:
          - HTTPS
    - name: WWW
      endpoint_groups:
      - name: WWW
        bridge_domain: default
        flood_in_encap: false
        intra_epg_isolation: false
        proxy_arp: false
        preferred_group: false
        qos_class: level3
        contracts:
          providers:
          - HTTPS
          consumers:
          - FTP
    contracts:
    - name: HTTPS
      scope: context
    - name: FTP
      scope: context
    filters:
    - name: https
      entries:
      - name: https
        ethertype: ip
        protocol: tcp
        source_from_port: 0
        source_to_port: 0
        destination_from_port: 443
        destination_to_port: 443
        stateful: false
    - name: FTP
      entries:
      - name: ftp
        ethertype: ip
        protocol: tcp
        source_from_port: 0
        source_to_port: 0
        destination_from_port: 20
        destination_to_port: 21
        stateful: false
