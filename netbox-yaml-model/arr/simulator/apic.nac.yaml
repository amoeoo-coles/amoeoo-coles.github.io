      timezone: p0_UTC
      show_offset: true
    dns_policies:
    - name: default
    pod_profiles:
    - name: default
      selectors:
      - name: default
        type: all
    pod_profile_name: default
    config_exports:
    - name: DailyAutoBackup
      format: json
      snapshot: true
      scheduler: EveryEightHours
    schedulers:
    - name: EveryEightHours
      recurring_windows:
      - name: first
        day: every-day
        hour: 1
        minute: 0
      - name: third
        day: every-day
        hour: 17
        minute: 0
      - name: second
        day: every-day
        hour: 9
        minute: 0
    coop_group_policy: compatible
    ep_loop_protection:
      action: port-disable
      admin_state: false
      detection_interval: 60
      detection_multiplier: 4
    global_settings:
      domain_validation: false
      enforce_subnet_check: true
      opflex_authentication: true
      disable_remote_endpoint_learn: false
      overlapping_vlan_validation: false
      remote_leaf_direct: true
      reallocate_gipo: false
