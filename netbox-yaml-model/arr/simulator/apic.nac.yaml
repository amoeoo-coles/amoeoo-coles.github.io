      admin_state: false
      control_plane: CS0
      policy_plane: CS4
      span: CS5
      traceroute: CS6
      level_1: CS1
      level_2: CS2
      level_3: CS3
      level_4: AF11
      level_5: AF21
      level_6: AF31
    ip_aging: false
    fabric_isis_redistribute_metric: 32
    port_tracking:
      admin_state: false
      delay: 120
      min_links: 0
    rogue_ep_control:
      admin_state: false
      hold_interval: 1800
      detection_interval: 60
