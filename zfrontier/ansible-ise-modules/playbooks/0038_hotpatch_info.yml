---
# Sample playbook for cisco.ise.hotpatch_info (cisco.ise 3.3.0)
# Build order: 38
# Information module for Hotpatch
# Reads ../models/hotpatch_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/hotpatch_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0038 hotpatch_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/hotpatch_info.yml
  tasks:
    - name: Run hotpatch_info from its model
      cisco.ise.hotpatch_info:
        ise_client_cert: "{{ hotpatch_info.ise_client_cert if hotpatch_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ hotpatch_info.ise_client_key if hotpatch_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ hotpatch_info.ise_debug if hotpatch_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ hotpatch_info.ise_hostname if hotpatch_info.ise_hostname is not none else omit }}"
        ise_password: "{{ hotpatch_info.ise_password if hotpatch_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ hotpatch_info.ise_single_request_timeout if hotpatch_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ hotpatch_info.ise_username if hotpatch_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ hotpatch_info.ise_uses_api_gateway if hotpatch_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ hotpatch_info.ise_uses_csrf_token if hotpatch_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ hotpatch_info.ise_verify if hotpatch_info.ise_verify is not none else omit }}"
        ise_version: "{{ hotpatch_info.ise_version if hotpatch_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ hotpatch_info.ise_wait_on_rate_limit if hotpatch_info.ise_wait_on_rate_limit is not none else omit }}"
      register: hotpatch_info_result
