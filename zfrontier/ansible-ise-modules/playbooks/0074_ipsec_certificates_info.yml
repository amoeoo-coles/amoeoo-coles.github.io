---
# Sample playbook for cisco.ise.ipsec_certificates_info (cisco.ise 3.3.0)
# Build order: 74
# Information module for Ipsec Certificates Info
# Reads ../models/ipsec_certificates_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ipsec_certificates_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0074 ipsec_certificates_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipsec_certificates_info.yml
  tasks:
    - name: Run ipsec_certificates_info from its model
      cisco.ise.ipsec_certificates_info:
        ise_client_cert: "{{ ipsec_certificates_info.ise_client_cert if ipsec_certificates_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ ipsec_certificates_info.ise_client_key if ipsec_certificates_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ ipsec_certificates_info.ise_debug if ipsec_certificates_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ ipsec_certificates_info.ise_hostname if ipsec_certificates_info.ise_hostname is not none else omit }}"
        ise_password: "{{ ipsec_certificates_info.ise_password if ipsec_certificates_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ ipsec_certificates_info.ise_single_request_timeout if ipsec_certificates_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ ipsec_certificates_info.ise_username if ipsec_certificates_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ ipsec_certificates_info.ise_uses_api_gateway if ipsec_certificates_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ ipsec_certificates_info.ise_uses_csrf_token if ipsec_certificates_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ ipsec_certificates_info.ise_verify if ipsec_certificates_info.ise_verify is not none else omit }}"
        ise_version: "{{ ipsec_certificates_info.ise_version if ipsec_certificates_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ ipsec_certificates_info.ise_wait_on_rate_limit if ipsec_certificates_info.ise_wait_on_rate_limit is not none else omit }}"
      register: ipsec_certificates_info_result
