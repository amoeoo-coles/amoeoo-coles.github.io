---
# Sample playbook for cisco.ise.tasks_info (cisco.ise 3.3.0)
# Build order: 250
# Information module for Tasks
# Reads ../models/tasks_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/tasks_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0250 tasks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tasks_info.yml
  tasks:
    - name: Run tasks_info from its model
      cisco.ise.tasks_info:
        ise_client_cert: "{{ tasks_info.ise_client_cert if tasks_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ tasks_info.ise_client_key if tasks_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ tasks_info.ise_debug if tasks_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ tasks_info.ise_hostname if tasks_info.ise_hostname is not none else omit }}"
        ise_password: "{{ tasks_info.ise_password if tasks_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ tasks_info.ise_single_request_timeout if tasks_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ tasks_info.ise_username if tasks_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ tasks_info.ise_uses_api_gateway if tasks_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ tasks_info.ise_uses_csrf_token if tasks_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ tasks_info.ise_verify if tasks_info.ise_verify is not none else omit }}"
        ise_version: "{{ tasks_info.ise_version if tasks_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ tasks_info.ise_wait_on_rate_limit if tasks_info.ise_wait_on_rate_limit is not none else omit }}"
        taskId: "{{ tasks_info.taskId if tasks_info.taskId is not none else omit }}"
      register: tasks_info_result
