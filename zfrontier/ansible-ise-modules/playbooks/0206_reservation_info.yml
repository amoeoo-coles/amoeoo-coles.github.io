---
# Sample playbook for cisco.ise.reservation_info (cisco.ise 3.3.0)
# Build order: 206
# Information module for Reservation Info
# Reads ../models/reservation_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/reservation_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0206 reservation_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reservation_info.yml
  tasks:
    - name: Run reservation_info from its model
      cisco.ise.reservation_info:
        clientID: "{{ reservation_info.clientID if reservation_info.clientID is not none else omit }}"
        ise_client_cert: "{{ reservation_info.ise_client_cert if reservation_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ reservation_info.ise_client_key if reservation_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ reservation_info.ise_debug if reservation_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ reservation_info.ise_hostname if reservation_info.ise_hostname is not none else omit }}"
        ise_password: "{{ reservation_info.ise_password if reservation_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ reservation_info.ise_single_request_timeout if reservation_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ reservation_info.ise_username if reservation_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ reservation_info.ise_uses_api_gateway if reservation_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ reservation_info.ise_uses_csrf_token if reservation_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ reservation_info.ise_verify if reservation_info.ise_verify is not none else omit }}"
        ise_version: "{{ reservation_info.ise_version if reservation_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ reservation_info.ise_wait_on_rate_limit if reservation_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ reservation_info.page if reservation_info.page is not none else omit }}"
        size: "{{ reservation_info.size if reservation_info.size is not none else omit }}"
      register: reservation_info_result
