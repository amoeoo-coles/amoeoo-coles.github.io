---
# Sample playbook for cisco.ise.support_bundle_status_info (cisco.ise 3.3.0)
# Build order: 48
# Information module for Supportbundlestatus
# Reads ../models/support_bundle_status_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/support_bundle_status_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0048 support_bundle_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/support_bundle_status_info.yml
  tasks:
    - name: Run support_bundle_status_info from its model
      cisco.ise.support_bundle_status_info:
        filterType: "{{ support_bundle_status_info.filterType if support_bundle_status_info.filterType is not none else omit }}"
        ise_client_cert: "{{ support_bundle_status_info.ise_client_cert if support_bundle_status_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ support_bundle_status_info.ise_client_key if support_bundle_status_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ support_bundle_status_info.ise_debug if support_bundle_status_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ support_bundle_status_info.ise_hostname if support_bundle_status_info.ise_hostname is not none else omit }}"
        ise_password: "{{ support_bundle_status_info.ise_password if support_bundle_status_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ support_bundle_status_info.ise_single_request_timeout if support_bundle_status_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ support_bundle_status_info.ise_username if support_bundle_status_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ support_bundle_status_info.ise_uses_api_gateway if support_bundle_status_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ support_bundle_status_info.ise_uses_csrf_token if support_bundle_status_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ support_bundle_status_info.ise_verify if support_bundle_status_info.ise_verify is not none else omit }}"
        ise_version: "{{ support_bundle_status_info.ise_version if support_bundle_status_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ support_bundle_status_info.ise_wait_on_rate_limit if support_bundle_status_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ support_bundle_status_info.page if support_bundle_status_info.page is not none else omit }}"
        size: "{{ support_bundle_status_info.size if support_bundle_status_info.size is not none else omit }}"
      register: support_bundle_status_info_result
