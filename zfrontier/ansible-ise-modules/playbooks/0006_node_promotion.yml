---
# Sample playbook for cisco.ise.node_promotion (cisco.ise 3.3.0)
# Build order: 6
# Resource module for Node Promotion
# Reads ../models/node_promotion.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/node_promotion_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags node_promotion.

- name: "0006 node_promotion"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/node_promotion.yml
  tasks:
    - name: Run node_promotion from its model
      cisco.ise.node_promotion:
        ise_client_cert: "{{ node_promotion.ise_client_cert if node_promotion.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ node_promotion.ise_client_key if node_promotion.ise_client_key is not none else omit }}"
        ise_debug: "{{ node_promotion.ise_debug if node_promotion.ise_debug is not none else omit }}"
        ise_hostname: "{{ node_promotion.ise_hostname if node_promotion.ise_hostname is not none else omit }}"
        ise_password: "{{ node_promotion.ise_password if node_promotion.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ node_promotion.ise_single_request_timeout if node_promotion.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ node_promotion.ise_username if node_promotion.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ node_promotion.ise_uses_api_gateway if node_promotion.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ node_promotion.ise_uses_csrf_token if node_promotion.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ node_promotion.ise_verify if node_promotion.ise_verify is not none else omit }}"
        ise_version: "{{ node_promotion.ise_version if node_promotion.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ node_promotion.ise_wait_on_rate_limit if node_promotion.ise_wait_on_rate_limit is not none else omit }}"
        promotionType: "{{ node_promotion.promotionType if node_promotion.promotionType is not none else omit }}"
      register: node_promotion_result
      tags:
        - never
        - node_promotion
