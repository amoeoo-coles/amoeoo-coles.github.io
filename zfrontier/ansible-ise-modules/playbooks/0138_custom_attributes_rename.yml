---
# Sample playbook for cisco.ise.custom_attributes_rename (cisco.ise 3.3.0)
# Build order: 138
# Resource module for Custom Attributes Rename
# Reads ../models/custom_attributes_rename.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/custom_attributes_rename_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags custom_attributes_rename.

- name: "0138 custom_attributes_rename"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/custom_attributes_rename.yml
  tasks:
    - name: Run custom_attributes_rename from its model
      cisco.ise.custom_attributes_rename:
        currentName: "{{ custom_attributes_rename.currentName if custom_attributes_rename.currentName is not none else omit }}"
        ise_client_cert: "{{ custom_attributes_rename.ise_client_cert if custom_attributes_rename.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ custom_attributes_rename.ise_client_key if custom_attributes_rename.ise_client_key is not none else omit }}"
        ise_debug: "{{ custom_attributes_rename.ise_debug if custom_attributes_rename.ise_debug is not none else omit }}"
        ise_hostname: "{{ custom_attributes_rename.ise_hostname if custom_attributes_rename.ise_hostname is not none else omit }}"
        ise_password: "{{ custom_attributes_rename.ise_password if custom_attributes_rename.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ custom_attributes_rename.ise_single_request_timeout if custom_attributes_rename.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ custom_attributes_rename.ise_username if custom_attributes_rename.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ custom_attributes_rename.ise_uses_api_gateway if custom_attributes_rename.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ custom_attributes_rename.ise_uses_csrf_token if custom_attributes_rename.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ custom_attributes_rename.ise_verify if custom_attributes_rename.ise_verify is not none else omit }}"
        ise_version: "{{ custom_attributes_rename.ise_version if custom_attributes_rename.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ custom_attributes_rename.ise_wait_on_rate_limit if custom_attributes_rename.ise_wait_on_rate_limit is not none else omit }}"
        newName: "{{ custom_attributes_rename.newName if custom_attributes_rename.newName is not none else omit }}"
      register: custom_attributes_rename_result
      tags:
        - never
        - custom_attributes_rename
