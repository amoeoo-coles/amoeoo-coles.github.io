---
# Sample playbook for cisco.ise.endpoints_info (cisco.ise 3.3.0)
# Build order: 133
# Information module for Endpoints Info
# Reads ../models/endpoints_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/endpoints_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0133 endpoints_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoints_info.yml
  tasks:
    - name: Run endpoints_info from its model
      cisco.ise.endpoints_info:
        filter: "{{ endpoints_info.filter if endpoints_info.filter is not none else omit }}"
        filterType: "{{ endpoints_info.filterType if endpoints_info.filterType is not none else omit }}"
        ise_client_cert: "{{ endpoints_info.ise_client_cert if endpoints_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ endpoints_info.ise_client_key if endpoints_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ endpoints_info.ise_debug if endpoints_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ endpoints_info.ise_hostname if endpoints_info.ise_hostname is not none else omit }}"
        ise_password: "{{ endpoints_info.ise_password if endpoints_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ endpoints_info.ise_single_request_timeout if endpoints_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ endpoints_info.ise_username if endpoints_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ endpoints_info.ise_uses_api_gateway if endpoints_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ endpoints_info.ise_uses_csrf_token if endpoints_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ endpoints_info.ise_verify if endpoints_info.ise_verify is not none else omit }}"
        ise_version: "{{ endpoints_info.ise_version if endpoints_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ endpoints_info.ise_wait_on_rate_limit if endpoints_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ endpoints_info.page if endpoints_info.page is not none else omit }}"
        size: "{{ endpoints_info.size if endpoints_info.size is not none else omit }}"
        sort: "{{ endpoints_info.sort if endpoints_info.sort is not none else omit }}"
        sortBy: "{{ endpoints_info.sortBy if endpoints_info.sortBy is not none else omit }}"
        value: "{{ endpoints_info.value if endpoints_info.value is not none else omit }}"
      register: endpoints_info_result
