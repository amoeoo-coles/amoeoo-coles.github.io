---
# Sample playbook for cisco.ise.active_directory_leave_domain (cisco.ise 3.3.0)
# Build order: 81
# Resource module for Active Directory Leave Domain
# Reads ../models/active_directory_leave_domain.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/active_directory_leave_domain_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags active_directory_leave_domain.

- name: "0081 active_directory_leave_domain"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/active_directory_leave_domain.yml
  tasks:
    - name: Run active_directory_leave_domain from its model
      cisco.ise.active_directory_leave_domain:
        ERSActiveDirectoryDomains: "{{ active_directory_leave_domain.ERSActiveDirectoryDomains if active_directory_leave_domain.ERSActiveDirectoryDomains is not none else omit }}"
        adAttributes: "{{ active_directory_leave_domain.adAttributes if active_directory_leave_domain.adAttributes is not none else omit }}"
        adScopesNames: "{{ active_directory_leave_domain.adScopesNames if active_directory_leave_domain.adScopesNames is not none else omit }}"
        adgroups: "{{ active_directory_leave_domain.adgroups if active_directory_leave_domain.adgroups is not none else omit }}"
        advancedSettings: "{{ active_directory_leave_domain.advancedSettings if active_directory_leave_domain.advancedSettings is not none else omit }}"
        description: "{{ active_directory_leave_domain.description if active_directory_leave_domain.description is not none else omit }}"
        domain: "{{ active_directory_leave_domain.domain if active_directory_leave_domain.domain is not none else omit }}"
        enableDomainAllowedList: "{{ active_directory_leave_domain.enableDomainAllowedList if active_directory_leave_domain.enableDomainAllowedList is not none else omit }}"
        id: "{{ active_directory_leave_domain.id if active_directory_leave_domain.id is not none else omit }}"
        ise_client_cert: "{{ active_directory_leave_domain.ise_client_cert if active_directory_leave_domain.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ active_directory_leave_domain.ise_client_key if active_directory_leave_domain.ise_client_key is not none else omit }}"
        ise_debug: "{{ active_directory_leave_domain.ise_debug if active_directory_leave_domain.ise_debug is not none else omit }}"
        ise_hostname: "{{ active_directory_leave_domain.ise_hostname if active_directory_leave_domain.ise_hostname is not none else omit }}"
        ise_password: "{{ active_directory_leave_domain.ise_password if active_directory_leave_domain.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ active_directory_leave_domain.ise_single_request_timeout if active_directory_leave_domain.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ active_directory_leave_domain.ise_username if active_directory_leave_domain.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ active_directory_leave_domain.ise_uses_api_gateway if active_directory_leave_domain.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ active_directory_leave_domain.ise_uses_csrf_token if active_directory_leave_domain.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ active_directory_leave_domain.ise_verify if active_directory_leave_domain.ise_verify is not none else omit }}"
        ise_version: "{{ active_directory_leave_domain.ise_version if active_directory_leave_domain.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ active_directory_leave_domain.ise_wait_on_rate_limit if active_directory_leave_domain.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ active_directory_leave_domain.name if active_directory_leave_domain.name is not none else omit }}"
      register: active_directory_leave_domain_result
      tags:
        - never
        - active_directory_leave_domain
