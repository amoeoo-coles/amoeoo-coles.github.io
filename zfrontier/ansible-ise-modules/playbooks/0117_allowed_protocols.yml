---
# Sample playbook for cisco.ise.allowed_protocols (cisco.ise 3.3.0)
# Build order: 117
# Resource module for Allowedprotocols
# Reads ../models/allowed_protocols.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/allowed_protocols_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags allowed_protocols.

- name: "0117 allowed_protocols"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/allowed_protocols.yml
  tasks:
    - name: Run allowed_protocols from its model
      cisco.ise.allowed_protocols:
        allowChap: "{{ allowed_protocols.allowChap if allowed_protocols.allowChap is not none else omit }}"
        allowEapFast: "{{ allowed_protocols.allowEapFast if allowed_protocols.allowEapFast is not none else omit }}"
        allowEapMd5: "{{ allowed_protocols.allowEapMd5 if allowed_protocols.allowEapMd5 is not none else omit }}"
        allowEapTls: "{{ allowed_protocols.allowEapTls if allowed_protocols.allowEapTls is not none else omit }}"
        allowEapTtls: "{{ allowed_protocols.allowEapTtls if allowed_protocols.allowEapTtls is not none else omit }}"
        allowLeap: "{{ allowed_protocols.allowLeap if allowed_protocols.allowLeap is not none else omit }}"
        allowMsChapV1: "{{ allowed_protocols.allowMsChapV1 if allowed_protocols.allowMsChapV1 is not none else omit }}"
        allowMsChapV2: "{{ allowed_protocols.allowMsChapV2 if allowed_protocols.allowMsChapV2 is not none else omit }}"
        allowPapAscii: "{{ allowed_protocols.allowPapAscii if allowed_protocols.allowPapAscii is not none else omit }}"
        allowPeap: "{{ allowed_protocols.allowPeap if allowed_protocols.allowPeap is not none else omit }}"
        allowPreferredEapProtocol: "{{ allowed_protocols.allowPreferredEapProtocol if allowed_protocols.allowPreferredEapProtocol is not none else omit }}"
        allowTeap: "{{ allowed_protocols.allowTeap if allowed_protocols.allowTeap is not none else omit }}"
        allowWeakCiphersForEap: "{{ allowed_protocols.allowWeakCiphersForEap if allowed_protocols.allowWeakCiphersForEap is not none else omit }}"
        description: "{{ allowed_protocols.description if allowed_protocols.description is not none else omit }}"
        displayAdditionalTLSParams: "{{ allowed_protocols.displayAdditionalTLSParams if allowed_protocols.displayAdditionalTLSParams is not none else omit }}"
        eapFast: "{{ (allowed_protocols.eapFast | cat_strip_nulls) if (allowed_protocols.eapFast | cat_strip_nulls) is not none else omit }}"
        eapTls: "{{ (allowed_protocols.eapTls | cat_strip_nulls) if (allowed_protocols.eapTls | cat_strip_nulls) is not none else omit }}"
        eapTlsLBit: "{{ allowed_protocols.eapTlsLBit if allowed_protocols.eapTlsLBit is not none else omit }}"
        eapTtls: "{{ (allowed_protocols.eapTtls | cat_strip_nulls) if (allowed_protocols.eapTtls | cat_strip_nulls) is not none else omit }}"
        fiveG: "{{ allowed_protocols.fiveG if allowed_protocols.fiveG is not none else omit }}"
        id: "{{ allowed_protocols.id if allowed_protocols.id is not none else omit }}"
        ise_client_cert: "{{ allowed_protocols.ise_client_cert if allowed_protocols.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ allowed_protocols.ise_client_key if allowed_protocols.ise_client_key is not none else omit }}"
        ise_debug: "{{ allowed_protocols.ise_debug if allowed_protocols.ise_debug is not none else omit }}"
        ise_hostname: "{{ allowed_protocols.ise_hostname if allowed_protocols.ise_hostname is not none else omit }}"
        ise_password: "{{ allowed_protocols.ise_password if allowed_protocols.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ allowed_protocols.ise_single_request_timeout if allowed_protocols.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ allowed_protocols.ise_username if allowed_protocols.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ allowed_protocols.ise_uses_api_gateway if allowed_protocols.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ allowed_protocols.ise_uses_csrf_token if allowed_protocols.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ allowed_protocols.ise_verify if allowed_protocols.ise_verify is not none else omit }}"
        ise_version: "{{ allowed_protocols.ise_version if allowed_protocols.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ allowed_protocols.ise_wait_on_rate_limit if allowed_protocols.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ allowed_protocols.name if allowed_protocols.name is not none else omit }}"
        peap: "{{ (allowed_protocols.peap | cat_strip_nulls) if (allowed_protocols.peap | cat_strip_nulls) is not none else omit }}"
        preferredEapProtocol: "{{ allowed_protocols.preferredEapProtocol if allowed_protocols.preferredEapProtocol is not none else omit }}"
        processHostLookup: "{{ allowed_protocols.processHostLookup if allowed_protocols.processHostLookup is not none else omit }}"
        requireMessageAuth: "{{ allowed_protocols.requireMessageAuth if allowed_protocols.requireMessageAuth is not none else omit }}"
        rsaPss: "{{ allowed_protocols.rsaPss if allowed_protocols.rsaPss is not none else omit }}"
        teap: "{{ (allowed_protocols.teap | cat_strip_nulls) if (allowed_protocols.teap | cat_strip_nulls) is not none else omit }}"
      register: allowed_protocols_result
      tags:
        - never
        - allowed_protocols
