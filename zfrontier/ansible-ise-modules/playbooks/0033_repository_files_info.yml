---
# Sample playbook for cisco.ise.repository_files_info (cisco.ise 3.3.0)
# Build order: 33
# Information module for Repository Files
# Reads ../models/repository_files_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/repository_files_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0033 repository_files_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/repository_files_info.yml
  tasks:
    - name: Run repository_files_info from its model
      cisco.ise.repository_files_info:
        ise_client_cert: "{{ repository_files_info.ise_client_cert if repository_files_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ repository_files_info.ise_client_key if repository_files_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ repository_files_info.ise_debug if repository_files_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ repository_files_info.ise_hostname if repository_files_info.ise_hostname is not none else omit }}"
        ise_password: "{{ repository_files_info.ise_password if repository_files_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ repository_files_info.ise_single_request_timeout if repository_files_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ repository_files_info.ise_username if repository_files_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ repository_files_info.ise_uses_api_gateway if repository_files_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ repository_files_info.ise_uses_csrf_token if repository_files_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ repository_files_info.ise_verify if repository_files_info.ise_verify is not none else omit }}"
        ise_version: "{{ repository_files_info.ise_version if repository_files_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ repository_files_info.ise_wait_on_rate_limit if repository_files_info.ise_wait_on_rate_limit is not none else omit }}"
        repositoryName: "{{ repository_files_info.repositoryName if repository_files_info.repositoryName is not none else omit }}"
      register: repository_files_info_result
