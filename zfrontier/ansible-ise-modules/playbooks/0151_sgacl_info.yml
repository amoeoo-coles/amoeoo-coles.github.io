---
# Sample playbook for cisco.ise.sgacl_info (cisco.ise 3.3.0)
# Build order: 151
# Information module for SGacl
# Reads ../models/sgacl_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgacl_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0151 sgacl_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgacl_info.yml
  tasks:
    - name: Run sgacl_info from its model
      cisco.ise.sgacl_info:
        filter: "{{ sgacl_info.filter if sgacl_info.filter is not none else omit }}"
        filterType: "{{ sgacl_info.filterType if sgacl_info.filterType is not none else omit }}"
        id: "{{ sgacl_info.id if sgacl_info.id is not none else omit }}"
        ise_client_cert: "{{ sgacl_info.ise_client_cert if sgacl_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgacl_info.ise_client_key if sgacl_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgacl_info.ise_debug if sgacl_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgacl_info.ise_hostname if sgacl_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sgacl_info.ise_password if sgacl_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgacl_info.ise_single_request_timeout if sgacl_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgacl_info.ise_username if sgacl_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgacl_info.ise_uses_api_gateway if sgacl_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgacl_info.ise_uses_csrf_token if sgacl_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgacl_info.ise_verify if sgacl_info.ise_verify is not none else omit }}"
        ise_version: "{{ sgacl_info.ise_version if sgacl_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgacl_info.ise_wait_on_rate_limit if sgacl_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgacl_info.name if sgacl_info.name is not none else omit }}"
        page: "{{ sgacl_info.page if sgacl_info.page is not none else omit }}"
        size: "{{ sgacl_info.size if sgacl_info.size is not none else omit }}"
        sortasc: "{{ sgacl_info.sortasc if sgacl_info.sortasc is not none else omit }}"
        sortdsc: "{{ sgacl_info.sortdsc if sgacl_info.sortdsc is not none else omit }}"
      register: sgacl_info_result
