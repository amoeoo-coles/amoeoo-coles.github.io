---
# Sample playbook for cisco.ise.transport_gateway_settings (cisco.ise 3.3.0)
# Build order: 236
# Resource module for Transport Gateway Settings
# Reads ../models/transport_gateway_settings.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/transport_gateway_settings_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags transport_gateway_settings.

- name: "0236 transport_gateway_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/transport_gateway_settings.yml
  tasks:
    - name: Run transport_gateway_settings from its model
      cisco.ise.transport_gateway_settings:
        enableTransportGateway: "{{ transport_gateway_settings.enableTransportGateway if transport_gateway_settings.enableTransportGateway is not none else omit }}"
        ise_client_cert: "{{ transport_gateway_settings.ise_client_cert if transport_gateway_settings.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ transport_gateway_settings.ise_client_key if transport_gateway_settings.ise_client_key is not none else omit }}"
        ise_debug: "{{ transport_gateway_settings.ise_debug if transport_gateway_settings.ise_debug is not none else omit }}"
        ise_hostname: "{{ transport_gateway_settings.ise_hostname if transport_gateway_settings.ise_hostname is not none else omit }}"
        ise_password: "{{ transport_gateway_settings.ise_password if transport_gateway_settings.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ transport_gateway_settings.ise_single_request_timeout if transport_gateway_settings.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ transport_gateway_settings.ise_username if transport_gateway_settings.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ transport_gateway_settings.ise_uses_api_gateway if transport_gateway_settings.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ transport_gateway_settings.ise_uses_csrf_token if transport_gateway_settings.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ transport_gateway_settings.ise_verify if transport_gateway_settings.ise_verify is not none else omit }}"
        ise_version: "{{ transport_gateway_settings.ise_version if transport_gateway_settings.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ transport_gateway_settings.ise_wait_on_rate_limit if transport_gateway_settings.ise_wait_on_rate_limit is not none else omit }}"
        url: "{{ transport_gateway_settings.url if transport_gateway_settings.url is not none else omit }}"
      register: transport_gateway_settings_result
      tags:
        - never
        - transport_gateway_settings
