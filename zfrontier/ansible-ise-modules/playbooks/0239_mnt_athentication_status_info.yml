---
# Sample playbook for cisco.ise.mnt_athentication_status_info (cisco.ise 3.3.0)
# Build order: 239
# Information module for Mnt Athentication Status
# Reads ../models/mnt_athentication_status_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/mnt_athentication_status_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0239 mnt_athentication_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/mnt_athentication_status_info.yml
  tasks:
    - name: Run mnt_athentication_status_info from its model
      cisco.ise.mnt_athentication_status_info:
        MAC: "{{ mnt_athentication_status_info.MAC if mnt_athentication_status_info.MAC is not none else omit }}"
        RECORDS: "{{ mnt_athentication_status_info.RECORDS if mnt_athentication_status_info.RECORDS is not none else omit }}"
        SECONDS: "{{ mnt_athentication_status_info.SECONDS if mnt_athentication_status_info.SECONDS is not none else omit }}"
        ise_client_cert: "{{ mnt_athentication_status_info.ise_client_cert if mnt_athentication_status_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ mnt_athentication_status_info.ise_client_key if mnt_athentication_status_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ mnt_athentication_status_info.ise_debug if mnt_athentication_status_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ mnt_athentication_status_info.ise_hostname if mnt_athentication_status_info.ise_hostname is not none else omit }}"
        ise_password: "{{ mnt_athentication_status_info.ise_password if mnt_athentication_status_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ mnt_athentication_status_info.ise_single_request_timeout if mnt_athentication_status_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ mnt_athentication_status_info.ise_username if mnt_athentication_status_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ mnt_athentication_status_info.ise_uses_api_gateway if mnt_athentication_status_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ mnt_athentication_status_info.ise_uses_csrf_token if mnt_athentication_status_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ mnt_athentication_status_info.ise_verify if mnt_athentication_status_info.ise_verify is not none else omit }}"
        ise_version: "{{ mnt_athentication_status_info.ise_version if mnt_athentication_status_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ mnt_athentication_status_info.ise_wait_on_rate_limit if mnt_athentication_status_info.ise_wait_on_rate_limit is not none else omit }}"
      register: mnt_athentication_status_info_result
