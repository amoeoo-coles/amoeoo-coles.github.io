---
# Sample playbook for cisco.ise.sgt (cisco.ise 3.3.0)
# Build order: 148
# Resource module for SGt
# Reads ../models/sgt.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgt_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sgt.

- name: "0148 sgt"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgt.yml
  tasks:
    - name: Run sgt from its model
      cisco.ise.sgt:
        defaultSGACLs: "{{ (sgt.defaultSGACLs | cat_strip_nulls) if (sgt.defaultSGACLs | cat_strip_nulls) is not none else omit }}"
        description: "{{ sgt.description if sgt.description is not none else omit }}"
        id: "{{ sgt.id if sgt.id is not none else omit }}"
        isReadOnly: "{{ sgt.isReadOnly if sgt.isReadOnly is not none else omit }}"
        ise_client_cert: "{{ sgt.ise_client_cert if sgt.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgt.ise_client_key if sgt.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgt.ise_debug if sgt.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgt.ise_hostname if sgt.ise_hostname is not none else omit }}"
        ise_password: "{{ sgt.ise_password if sgt.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgt.ise_single_request_timeout if sgt.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgt.ise_username if sgt.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgt.ise_uses_api_gateway if sgt.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgt.ise_uses_csrf_token if sgt.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgt.ise_verify if sgt.ise_verify is not none else omit }}"
        ise_version: "{{ sgt.ise_version if sgt.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgt.ise_wait_on_rate_limit if sgt.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgt.name if sgt.name is not none else omit }}"
        propogateToApic: "{{ sgt.propogateToApic if sgt.propogateToApic is not none else omit }}"
        value: "{{ sgt.value if sgt.value is not none else omit }}"
      register: sgt_result
      tags:
        - never
        - sgt
