---
# Sample playbook for cisco.ise.sxp_connections_info (cisco.ise 3.3.0)
# Build order: 162
# Information module for SXPconnections
# Reads ../models/sxp_connections_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sxp_connections_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0162 sxp_connections_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sxp_connections_info.yml
  tasks:
    - name: Run sxp_connections_info from its model
      cisco.ise.sxp_connections_info:
        filter: "{{ sxp_connections_info.filter if sxp_connections_info.filter is not none else omit }}"
        filterType: "{{ sxp_connections_info.filterType if sxp_connections_info.filterType is not none else omit }}"
        id: "{{ sxp_connections_info.id if sxp_connections_info.id is not none else omit }}"
        ise_client_cert: "{{ sxp_connections_info.ise_client_cert if sxp_connections_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sxp_connections_info.ise_client_key if sxp_connections_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sxp_connections_info.ise_debug if sxp_connections_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sxp_connections_info.ise_hostname if sxp_connections_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sxp_connections_info.ise_password if sxp_connections_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sxp_connections_info.ise_single_request_timeout if sxp_connections_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sxp_connections_info.ise_username if sxp_connections_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sxp_connections_info.ise_uses_api_gateway if sxp_connections_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sxp_connections_info.ise_uses_csrf_token if sxp_connections_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sxp_connections_info.ise_verify if sxp_connections_info.ise_verify is not none else omit }}"
        ise_version: "{{ sxp_connections_info.ise_version if sxp_connections_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sxp_connections_info.ise_wait_on_rate_limit if sxp_connections_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sxp_connections_info.name if sxp_connections_info.name is not none else omit }}"
        page: "{{ sxp_connections_info.page if sxp_connections_info.page is not none else omit }}"
        size: "{{ sxp_connections_info.size if sxp_connections_info.size is not none else omit }}"
        sortasc: "{{ sxp_connections_info.sortasc if sxp_connections_info.sortasc is not none else omit }}"
        sortdsc: "{{ sxp_connections_info.sortdsc if sxp_connections_info.sortdsc is not none else omit }}"
      register: sxp_connections_info_result
