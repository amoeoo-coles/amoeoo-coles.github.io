---
# Sample playbook for cisco.ise.duo_mfainfo_info (cisco.ise 3.3.0)
# Build order: 227
# Information module for Duo Mfa Info
# Reads ../models/duo_mfainfo_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/duo_mfainfo_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0227 duo_mfainfo_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/duo_mfainfo_info.yml
  tasks:
    - name: Run duo_mfainfo_info from its model
      cisco.ise.duo_mfainfo_info:
        connectionName: "{{ duo_mfainfo_info.connectionName if duo_mfainfo_info.connectionName is not none else omit }}"
        ise_client_cert: "{{ duo_mfainfo_info.ise_client_cert if duo_mfainfo_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ duo_mfainfo_info.ise_client_key if duo_mfainfo_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ duo_mfainfo_info.ise_debug if duo_mfainfo_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ duo_mfainfo_info.ise_hostname if duo_mfainfo_info.ise_hostname is not none else omit }}"
        ise_password: "{{ duo_mfainfo_info.ise_password if duo_mfainfo_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ duo_mfainfo_info.ise_single_request_timeout if duo_mfainfo_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ duo_mfainfo_info.ise_username if duo_mfainfo_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ duo_mfainfo_info.ise_uses_api_gateway if duo_mfainfo_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ duo_mfainfo_info.ise_uses_csrf_token if duo_mfainfo_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ duo_mfainfo_info.ise_verify if duo_mfainfo_info.ise_verify is not none else omit }}"
        ise_version: "{{ duo_mfainfo_info.ise_version if duo_mfainfo_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ duo_mfainfo_info.ise_wait_on_rate_limit if duo_mfainfo_info.ise_wait_on_rate_limit is not none else omit }}"
      register: duo_mfainfo_info_result
