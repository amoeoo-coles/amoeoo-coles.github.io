---
# Sample playbook for cisco.ise.px_grid_direct (cisco.ise 3.3.0)
# Build order: 212
# Resource module for Px Grid Direct
# Reads ../models/px_grid_direct.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/px_grid_direct_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags px_grid_direct.

- name: "0212 px_grid_direct"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/px_grid_direct.yml
  tasks:
    - name: Run px_grid_direct from its model
      cisco.ise.px_grid_direct:
        additionalProperties: "{{ (px_grid_direct.additionalProperties | cat_strip_nulls) if (px_grid_direct.additionalProperties | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (px_grid_direct.attributes | cat_strip_nulls) if (px_grid_direct.attributes | cat_strip_nulls) is not none else omit }}"
        coaType: "{{ px_grid_direct.coaType if px_grid_direct.coaType is not none else omit }}"
        connectorName: "{{ px_grid_direct.connectorName if px_grid_direct.connectorName is not none else omit }}"
        connectorType: "{{ px_grid_direct.connectorType if px_grid_direct.connectorType is not none else omit }}"
        deltasyncSchedule: "{{ (px_grid_direct.deltasyncSchedule | cat_strip_nulls) if (px_grid_direct.deltasyncSchedule | cat_strip_nulls) is not none else omit }}"
        description: "{{ px_grid_direct.description if px_grid_direct.description is not none else omit }}"
        enabled: "{{ px_grid_direct.enabled if px_grid_direct.enabled is not none else omit }}"
        flexibleUrl: "{{ (px_grid_direct.flexibleUrl | cat_strip_nulls) if (px_grid_direct.flexibleUrl | cat_strip_nulls) is not none else omit }}"
        fullsyncSchedule: "{{ (px_grid_direct.fullsyncSchedule | cat_strip_nulls) if (px_grid_direct.fullsyncSchedule | cat_strip_nulls) is not none else omit }}"
        groupArray: "{{ (px_grid_direct.groupArray | cat_strip_nulls) if (px_grid_direct.groupArray | cat_strip_nulls) is not none else omit }}"
        ise_client_cert: "{{ px_grid_direct.ise_client_cert if px_grid_direct.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ px_grid_direct.ise_client_key if px_grid_direct.ise_client_key is not none else omit }}"
        ise_debug: "{{ px_grid_direct.ise_debug if px_grid_direct.ise_debug is not none else omit }}"
        ise_hostname: "{{ px_grid_direct.ise_hostname if px_grid_direct.ise_hostname is not none else omit }}"
        ise_password: "{{ px_grid_direct.ise_password if px_grid_direct.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ px_grid_direct.ise_single_request_timeout if px_grid_direct.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ px_grid_direct.ise_username if px_grid_direct.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ px_grid_direct.ise_uses_api_gateway if px_grid_direct.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ px_grid_direct.ise_uses_csrf_token if px_grid_direct.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ px_grid_direct.ise_verify if px_grid_direct.ise_verify is not none else omit }}"
        ise_version: "{{ px_grid_direct.ise_version if px_grid_direct.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ px_grid_direct.ise_wait_on_rate_limit if px_grid_direct.ise_wait_on_rate_limit is not none else omit }}"
        protocol: "{{ px_grid_direct.protocol if px_grid_direct.protocol is not none else omit }}"
        skipCertificateValidations: "{{ px_grid_direct.skipCertificateValidations if px_grid_direct.skipCertificateValidations is not none else omit }}"
        url: "{{ (px_grid_direct.url | cat_strip_nulls) if (px_grid_direct.url | cat_strip_nulls) is not none else omit }}"
      register: px_grid_direct_result
      tags:
        - never
        - px_grid_direct
