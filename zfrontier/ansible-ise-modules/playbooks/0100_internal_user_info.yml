---
# Sample playbook for cisco.ise.internal_user_info (cisco.ise 3.3.0)
# Build order: 100
# Information module for Internaluser
# Reads ../models/internal_user_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/internal_user_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0100 internal_user_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/internal_user_info.yml
  tasks:
    - name: Run internal_user_info from its model
      cisco.ise.internal_user_info:
        filter: "{{ internal_user_info.filter if internal_user_info.filter is not none else omit }}"
        filterType: "{{ internal_user_info.filterType if internal_user_info.filterType is not none else omit }}"
        id: "{{ internal_user_info.id if internal_user_info.id is not none else omit }}"
        ise_client_cert: "{{ internal_user_info.ise_client_cert if internal_user_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ internal_user_info.ise_client_key if internal_user_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ internal_user_info.ise_debug if internal_user_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ internal_user_info.ise_hostname if internal_user_info.ise_hostname is not none else omit }}"
        ise_password: "{{ internal_user_info.ise_password if internal_user_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ internal_user_info.ise_single_request_timeout if internal_user_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ internal_user_info.ise_username if internal_user_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ internal_user_info.ise_uses_api_gateway if internal_user_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ internal_user_info.ise_uses_csrf_token if internal_user_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ internal_user_info.ise_verify if internal_user_info.ise_verify is not none else omit }}"
        ise_version: "{{ internal_user_info.ise_version if internal_user_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ internal_user_info.ise_wait_on_rate_limit if internal_user_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ internal_user_info.name if internal_user_info.name is not none else omit }}"
        page: "{{ internal_user_info.page if internal_user_info.page is not none else omit }}"
        size: "{{ internal_user_info.size if internal_user_info.size is not none else omit }}"
        sortasc: "{{ internal_user_info.sortasc if internal_user_info.sortasc is not none else omit }}"
        sortdsc: "{{ internal_user_info.sortdsc if internal_user_info.sortdsc is not none else omit }}"
      register: internal_user_info_result
