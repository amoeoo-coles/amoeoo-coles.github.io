---
# Sample playbook for cisco.ise.tacacs_external_servers (cisco.ise 3.3.0)
# Build order: 142
# Resource module for TACACSexternalservers
# Reads ../models/tacacs_external_servers.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/tacacs_external_servers_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags tacacs_external_servers.

- name: "0142 tacacs_external_servers"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tacacs_external_servers.yml
  tasks:
    - name: Run tacacs_external_servers from its model
      cisco.ise.tacacs_external_servers:
        connectionPort: "{{ tacacs_external_servers.connectionPort if tacacs_external_servers.connectionPort is not none else omit }}"
        description: "{{ tacacs_external_servers.description if tacacs_external_servers.description is not none else omit }}"
        hostIP: "{{ tacacs_external_servers.hostIP if tacacs_external_servers.hostIP is not none else omit }}"
        id: "{{ tacacs_external_servers.id if tacacs_external_servers.id is not none else omit }}"
        ise_client_cert: "{{ tacacs_external_servers.ise_client_cert if tacacs_external_servers.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ tacacs_external_servers.ise_client_key if tacacs_external_servers.ise_client_key is not none else omit }}"
        ise_debug: "{{ tacacs_external_servers.ise_debug if tacacs_external_servers.ise_debug is not none else omit }}"
        ise_hostname: "{{ tacacs_external_servers.ise_hostname if tacacs_external_servers.ise_hostname is not none else omit }}"
        ise_password: "{{ tacacs_external_servers.ise_password if tacacs_external_servers.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ tacacs_external_servers.ise_single_request_timeout if tacacs_external_servers.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ tacacs_external_servers.ise_username if tacacs_external_servers.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ tacacs_external_servers.ise_uses_api_gateway if tacacs_external_servers.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ tacacs_external_servers.ise_uses_csrf_token if tacacs_external_servers.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ tacacs_external_servers.ise_verify if tacacs_external_servers.ise_verify is not none else omit }}"
        ise_version: "{{ tacacs_external_servers.ise_version if tacacs_external_servers.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ tacacs_external_servers.ise_wait_on_rate_limit if tacacs_external_servers.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ tacacs_external_servers.name if tacacs_external_servers.name is not none else omit }}"
        sharedSecret: "{{ tacacs_external_servers.sharedSecret if tacacs_external_servers.sharedSecret is not none else omit }}"
        singleConnect: "{{ tacacs_external_servers.singleConnect if tacacs_external_servers.singleConnect is not none else omit }}"
        timeout: "{{ tacacs_external_servers.timeout if tacacs_external_servers.timeout is not none else omit }}"
      register: tacacs_external_servers_result
      tags:
        - never
        - tacacs_external_servers
