---
# Sample playbook for cisco.ise.certificate_profile (cisco.ise 3.3.0)
# Build order: 69
# Resource module for Certificateprofile
# Reads ../models/certificate_profile.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/certificate_profile_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags certificate_profile.

- name: "0069 certificate_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/certificate_profile.yml
  tasks:
    - name: Run certificate_profile from its model
      cisco.ise.certificate_profile:
        allowedAsUserName: "{{ certificate_profile.allowedAsUserName if certificate_profile.allowedAsUserName is not none else omit }}"
        certificateAttributeName: "{{ certificate_profile.certificateAttributeName if certificate_profile.certificateAttributeName is not none else omit }}"
        description: "{{ certificate_profile.description if certificate_profile.description is not none else omit }}"
        externalIdentityStoreName: "{{ certificate_profile.externalIdentityStoreName if certificate_profile.externalIdentityStoreName is not none else omit }}"
        id: "{{ certificate_profile.id if certificate_profile.id is not none else omit }}"
        ise_client_cert: "{{ certificate_profile.ise_client_cert if certificate_profile.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ certificate_profile.ise_client_key if certificate_profile.ise_client_key is not none else omit }}"
        ise_debug: "{{ certificate_profile.ise_debug if certificate_profile.ise_debug is not none else omit }}"
        ise_hostname: "{{ certificate_profile.ise_hostname if certificate_profile.ise_hostname is not none else omit }}"
        ise_password: "{{ certificate_profile.ise_password if certificate_profile.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ certificate_profile.ise_single_request_timeout if certificate_profile.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ certificate_profile.ise_username if certificate_profile.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ certificate_profile.ise_uses_api_gateway if certificate_profile.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ certificate_profile.ise_uses_csrf_token if certificate_profile.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ certificate_profile.ise_verify if certificate_profile.ise_verify is not none else omit }}"
        ise_version: "{{ certificate_profile.ise_version if certificate_profile.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ certificate_profile.ise_wait_on_rate_limit if certificate_profile.ise_wait_on_rate_limit is not none else omit }}"
        matchMode: "{{ certificate_profile.matchMode if certificate_profile.matchMode is not none else omit }}"
        name: "{{ certificate_profile.name if certificate_profile.name is not none else omit }}"
        usernameFrom: "{{ certificate_profile.usernameFrom if certificate_profile.usernameFrom is not none else omit }}"
      register: certificate_profile_result
      tags:
        - never
        - certificate_profile
