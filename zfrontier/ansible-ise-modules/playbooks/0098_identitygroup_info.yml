---
# Sample playbook for cisco.ise.identitygroup_info (cisco.ise 3.3.0)
# Build order: 98
# Information module for Identitygroup
# Reads ../models/identitygroup_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/identitygroup_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0098 identitygroup_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/identitygroup_info.yml
  tasks:
    - name: Run identitygroup_info from its model
      cisco.ise.identitygroup_info:
        filter: "{{ identitygroup_info.filter if identitygroup_info.filter is not none else omit }}"
        filterType: "{{ identitygroup_info.filterType if identitygroup_info.filterType is not none else omit }}"
        id: "{{ identitygroup_info.id if identitygroup_info.id is not none else omit }}"
        ise_client_cert: "{{ identitygroup_info.ise_client_cert if identitygroup_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ identitygroup_info.ise_client_key if identitygroup_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ identitygroup_info.ise_debug if identitygroup_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ identitygroup_info.ise_hostname if identitygroup_info.ise_hostname is not none else omit }}"
        ise_password: "{{ identitygroup_info.ise_password if identitygroup_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ identitygroup_info.ise_single_request_timeout if identitygroup_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ identitygroup_info.ise_username if identitygroup_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ identitygroup_info.ise_uses_api_gateway if identitygroup_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ identitygroup_info.ise_uses_csrf_token if identitygroup_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ identitygroup_info.ise_verify if identitygroup_info.ise_verify is not none else omit }}"
        ise_version: "{{ identitygroup_info.ise_version if identitygroup_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ identitygroup_info.ise_wait_on_rate_limit if identitygroup_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ identitygroup_info.name if identitygroup_info.name is not none else omit }}"
        page: "{{ identitygroup_info.page if identitygroup_info.page is not none else omit }}"
        size: "{{ identitygroup_info.size if identitygroup_info.size is not none else omit }}"
        sortasc: "{{ identitygroup_info.sortasc if identitygroup_info.sortasc is not none else omit }}"
        sortdsc: "{{ identitygroup_info.sortdsc if identitygroup_info.sortdsc is not none else omit }}"
      register: identitygroup_info_result
