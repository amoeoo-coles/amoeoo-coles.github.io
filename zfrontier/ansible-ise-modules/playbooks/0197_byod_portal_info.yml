---
# Sample playbook for cisco.ise.byod_portal_info (cisco.ise 3.3.0)
# Build order: 197
# Information module for BYODportal
# Reads ../models/byod_portal_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/byod_portal_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0197 byod_portal_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/byod_portal_info.yml
  tasks:
    - name: Run byod_portal_info from its model
      cisco.ise.byod_portal_info:
        filter: "{{ byod_portal_info.filter if byod_portal_info.filter is not none else omit }}"
        filterType: "{{ byod_portal_info.filterType if byod_portal_info.filterType is not none else omit }}"
        id: "{{ byod_portal_info.id if byod_portal_info.id is not none else omit }}"
        ise_client_cert: "{{ byod_portal_info.ise_client_cert if byod_portal_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ byod_portal_info.ise_client_key if byod_portal_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ byod_portal_info.ise_debug if byod_portal_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ byod_portal_info.ise_hostname if byod_portal_info.ise_hostname is not none else omit }}"
        ise_password: "{{ byod_portal_info.ise_password if byod_portal_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ byod_portal_info.ise_single_request_timeout if byod_portal_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ byod_portal_info.ise_username if byod_portal_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ byod_portal_info.ise_uses_api_gateway if byod_portal_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ byod_portal_info.ise_uses_csrf_token if byod_portal_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ byod_portal_info.ise_verify if byod_portal_info.ise_verify is not none else omit }}"
        ise_version: "{{ byod_portal_info.ise_version if byod_portal_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ byod_portal_info.ise_wait_on_rate_limit if byod_portal_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ byod_portal_info.name if byod_portal_info.name is not none else omit }}"
        page: "{{ byod_portal_info.page if byod_portal_info.page is not none else omit }}"
        size: "{{ byod_portal_info.size if byod_portal_info.size is not none else omit }}"
        sortasc: "{{ byod_portal_info.sortasc if byod_portal_info.sortasc is not none else omit }}"
        sortdsc: "{{ byod_portal_info.sortdsc if byod_portal_info.sortdsc is not none else omit }}"
      register: byod_portal_info_result
