---
# Sample playbook for cisco.ise.active_directory_info (cisco.ise 3.3.0)
# Build order: 79
# Information module for Activedirectory
# Reads ../models/active_directory_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/active_directory_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0079 active_directory_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/active_directory_info.yml
  tasks:
    - name: Run active_directory_info from its model
      cisco.ise.active_directory_info:
        filter: "{{ active_directory_info.filter if active_directory_info.filter is not none else omit }}"
        ise_client_cert: "{{ active_directory_info.ise_client_cert if active_directory_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ active_directory_info.ise_client_key if active_directory_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ active_directory_info.ise_debug if active_directory_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ active_directory_info.ise_hostname if active_directory_info.ise_hostname is not none else omit }}"
        ise_password: "{{ active_directory_info.ise_password if active_directory_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ active_directory_info.ise_single_request_timeout if active_directory_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ active_directory_info.ise_username if active_directory_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ active_directory_info.ise_uses_api_gateway if active_directory_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ active_directory_info.ise_uses_csrf_token if active_directory_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ active_directory_info.ise_verify if active_directory_info.ise_verify is not none else omit }}"
        ise_version: "{{ active_directory_info.ise_version if active_directory_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ active_directory_info.ise_wait_on_rate_limit if active_directory_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ active_directory_info.page if active_directory_info.page is not none else omit }}"
        size: "{{ active_directory_info.size if active_directory_info.size is not none else omit }}"
        sortasc: "{{ active_directory_info.sortasc if active_directory_info.sortasc is not none else omit }}"
        sortdsc: "{{ active_directory_info.sortdsc if active_directory_info.sortdsc is not none else omit }}"
      register: active_directory_info_result
