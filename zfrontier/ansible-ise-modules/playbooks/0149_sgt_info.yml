---
# Sample playbook for cisco.ise.sgt_info (cisco.ise 3.3.0)
# Build order: 149
# Information module for SGt
# Reads ../models/sgt_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgt_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0149 sgt_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgt_info.yml
  tasks:
    - name: Run sgt_info from its model
      cisco.ise.sgt_info:
        filter: "{{ sgt_info.filter if sgt_info.filter is not none else omit }}"
        filterType: "{{ sgt_info.filterType if sgt_info.filterType is not none else omit }}"
        id: "{{ sgt_info.id if sgt_info.id is not none else omit }}"
        ise_client_cert: "{{ sgt_info.ise_client_cert if sgt_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgt_info.ise_client_key if sgt_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgt_info.ise_debug if sgt_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgt_info.ise_hostname if sgt_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sgt_info.ise_password if sgt_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgt_info.ise_single_request_timeout if sgt_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgt_info.ise_username if sgt_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgt_info.ise_uses_api_gateway if sgt_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgt_info.ise_uses_csrf_token if sgt_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgt_info.ise_verify if sgt_info.ise_verify is not none else omit }}"
        ise_version: "{{ sgt_info.ise_version if sgt_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgt_info.ise_wait_on_rate_limit if sgt_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgt_info.name if sgt_info.name is not none else omit }}"
        page: "{{ sgt_info.page if sgt_info.page is not none else omit }}"
        size: "{{ sgt_info.size if sgt_info.size is not none else omit }}"
        sortasc: "{{ sgt_info.sortasc if sgt_info.sortasc is not none else omit }}"
        sortdsc: "{{ sgt_info.sortdsc if sgt_info.sortdsc is not none else omit }}"
      register: sgt_info_result
