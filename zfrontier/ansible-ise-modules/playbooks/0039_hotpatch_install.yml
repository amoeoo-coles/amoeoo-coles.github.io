---
# Sample playbook for cisco.ise.hotpatch_install (cisco.ise 3.3.0)
# Build order: 39
# Resource module for Hotpatch Install
# Reads ../models/hotpatch_install.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/hotpatch_install_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags hotpatch_install.

- name: "0039 hotpatch_install"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/hotpatch_install.yml
  tasks:
    - name: Run hotpatch_install from its model
      cisco.ise.hotpatch_install:
        hotpatchName: "{{ hotpatch_install.hotpatchName if hotpatch_install.hotpatchName is not none else omit }}"
        isDirectoryListed: "{{ hotpatch_install.isDirectoryListed if hotpatch_install.isDirectoryListed is not none else omit }}"
        ise_client_cert: "{{ hotpatch_install.ise_client_cert if hotpatch_install.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ hotpatch_install.ise_client_key if hotpatch_install.ise_client_key is not none else omit }}"
        ise_debug: "{{ hotpatch_install.ise_debug if hotpatch_install.ise_debug is not none else omit }}"
        ise_hostname: "{{ hotpatch_install.ise_hostname if hotpatch_install.ise_hostname is not none else omit }}"
        ise_password: "{{ hotpatch_install.ise_password if hotpatch_install.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ hotpatch_install.ise_single_request_timeout if hotpatch_install.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ hotpatch_install.ise_username if hotpatch_install.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ hotpatch_install.ise_uses_api_gateway if hotpatch_install.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ hotpatch_install.ise_uses_csrf_token if hotpatch_install.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ hotpatch_install.ise_verify if hotpatch_install.ise_verify is not none else omit }}"
        ise_version: "{{ hotpatch_install.ise_version if hotpatch_install.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ hotpatch_install.ise_wait_on_rate_limit if hotpatch_install.ise_wait_on_rate_limit is not none else omit }}"
        repositoryName: "{{ hotpatch_install.repositoryName if hotpatch_install.repositoryName is not none else omit }}"
      register: hotpatch_install_result
      tags:
        - never
        - hotpatch_install
