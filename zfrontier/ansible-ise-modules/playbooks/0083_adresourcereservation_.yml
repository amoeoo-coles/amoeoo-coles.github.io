---
# Sample playbook for cisco.ise.adresourcereservation_ (cisco.ise 3.3.0)
# Build order: 83
# Resource module for Adresourcereservation
# Reads ../models/adresourcereservation_.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/adresourcereservation__module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags adresourcereservation_.

- name: "0083 adresourcereservation_"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/adresourcereservation_.yml
  tasks:
    - name: Run adresourcereservation_ from its model
      cisco.ise.adresourcereservation_:
        description: "{{ adresourcereservation_.description if adresourcereservation_.description is not none else omit }}"
        id: "{{ adresourcereservation_.id if adresourcereservation_.id is not none else omit }}"
        ise_client_cert: "{{ adresourcereservation_.ise_client_cert if adresourcereservation_.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ adresourcereservation_.ise_client_key if adresourcereservation_.ise_client_key is not none else omit }}"
        ise_debug: "{{ adresourcereservation_.ise_debug if adresourcereservation_.ise_debug is not none else omit }}"
        ise_hostname: "{{ adresourcereservation_.ise_hostname if adresourcereservation_.ise_hostname is not none else omit }}"
        ise_password: "{{ adresourcereservation_.ise_password if adresourcereservation_.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ adresourcereservation_.ise_single_request_timeout if adresourcereservation_.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ adresourcereservation_.ise_username if adresourcereservation_.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ adresourcereservation_.ise_uses_api_gateway if adresourcereservation_.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ adresourcereservation_.ise_uses_csrf_token if adresourcereservation_.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ adresourcereservation_.ise_verify if adresourcereservation_.ise_verify is not none else omit }}"
        ise_version: "{{ adresourcereservation_.ise_version if adresourcereservation_.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ adresourcereservation_.ise_wait_on_rate_limit if adresourcereservation_.ise_wait_on_rate_limit is not none else omit }}"
        joinPointNames: "{{ adresourcereservation_.joinPointNames if adresourcereservation_.joinPointNames is not none else omit }}"
        name: "{{ adresourcereservation_.name if adresourcereservation_.name is not none else omit }}"
        node: "{{ adresourcereservation_.node if adresourcereservation_.node is not none else omit }}"
      register: adresourcereservation__result
      tags:
        - never
        - adresourcereservation_
