---
# Sample playbook for cisco.ise.trusted_certificate_info (cisco.ise 3.3.0)
# Build order: 68
# Information module for Trusted Certificate
# Reads ../models/trusted_certificate_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/trusted_certificate_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0068 trusted_certificate_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/trusted_certificate_info.yml
  tasks:
    - name: Run trusted_certificate_info from its model
      cisco.ise.trusted_certificate_info:
        filter: "{{ trusted_certificate_info.filter if trusted_certificate_info.filter is not none else omit }}"
        filterType: "{{ trusted_certificate_info.filterType if trusted_certificate_info.filterType is not none else omit }}"
        id: "{{ trusted_certificate_info.id if trusted_certificate_info.id is not none else omit }}"
        ise_client_cert: "{{ trusted_certificate_info.ise_client_cert if trusted_certificate_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ trusted_certificate_info.ise_client_key if trusted_certificate_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ trusted_certificate_info.ise_debug if trusted_certificate_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ trusted_certificate_info.ise_hostname if trusted_certificate_info.ise_hostname is not none else omit }}"
        ise_password: "{{ trusted_certificate_info.ise_password if trusted_certificate_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ trusted_certificate_info.ise_single_request_timeout if trusted_certificate_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ trusted_certificate_info.ise_username if trusted_certificate_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ trusted_certificate_info.ise_uses_api_gateway if trusted_certificate_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ trusted_certificate_info.ise_uses_csrf_token if trusted_certificate_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ trusted_certificate_info.ise_verify if trusted_certificate_info.ise_verify is not none else omit }}"
        ise_version: "{{ trusted_certificate_info.ise_version if trusted_certificate_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ trusted_certificate_info.ise_wait_on_rate_limit if trusted_certificate_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ trusted_certificate_info.page if trusted_certificate_info.page is not none else omit }}"
        size: "{{ trusted_certificate_info.size if trusted_certificate_info.size is not none else omit }}"
        sort: "{{ trusted_certificate_info.sort if trusted_certificate_info.sort is not none else omit }}"
        sortBy: "{{ trusted_certificate_info.sortBy if trusted_certificate_info.sortBy is not none else omit }}"
      register: trusted_certificate_info_result
