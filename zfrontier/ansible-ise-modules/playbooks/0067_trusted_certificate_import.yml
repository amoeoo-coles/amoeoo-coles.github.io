---
# Sample playbook for cisco.ise.trusted_certificate_import (cisco.ise 3.3.0)
# Build order: 67
# Resource module for Trusted Certificate Import
# Reads ../models/trusted_certificate_import.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/trusted_certificate_import_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags trusted_certificate_import.

- name: "0067 trusted_certificate_import"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/trusted_certificate_import.yml
  tasks:
    - name: Run trusted_certificate_import from its model
      cisco.ise.trusted_certificate_import:
        allowBasicConstraintCAFalse: "{{ trusted_certificate_import.allowBasicConstraintCAFalse if trusted_certificate_import.allowBasicConstraintCAFalse is not none else omit }}"
        allowOutOfDateCert: "{{ trusted_certificate_import.allowOutOfDateCert if trusted_certificate_import.allowOutOfDateCert is not none else omit }}"
        allowSHA1Certificates: "{{ trusted_certificate_import.allowSHA1Certificates if trusted_certificate_import.allowSHA1Certificates is not none else omit }}"
        data: "{{ trusted_certificate_import.data if trusted_certificate_import.data is not none else omit }}"
        description: "{{ trusted_certificate_import.description if trusted_certificate_import.description is not none else omit }}"
        ise_client_cert: "{{ trusted_certificate_import.ise_client_cert if trusted_certificate_import.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ trusted_certificate_import.ise_client_key if trusted_certificate_import.ise_client_key is not none else omit }}"
        ise_debug: "{{ trusted_certificate_import.ise_debug if trusted_certificate_import.ise_debug is not none else omit }}"
        ise_hostname: "{{ trusted_certificate_import.ise_hostname if trusted_certificate_import.ise_hostname is not none else omit }}"
        ise_password: "{{ trusted_certificate_import.ise_password if trusted_certificate_import.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ trusted_certificate_import.ise_single_request_timeout if trusted_certificate_import.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ trusted_certificate_import.ise_username if trusted_certificate_import.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ trusted_certificate_import.ise_uses_api_gateway if trusted_certificate_import.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ trusted_certificate_import.ise_uses_csrf_token if trusted_certificate_import.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ trusted_certificate_import.ise_verify if trusted_certificate_import.ise_verify is not none else omit }}"
        ise_version: "{{ trusted_certificate_import.ise_version if trusted_certificate_import.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ trusted_certificate_import.ise_wait_on_rate_limit if trusted_certificate_import.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ trusted_certificate_import.name if trusted_certificate_import.name is not none else omit }}"
        trustForCertificateBasedAdminAuth: "{{ trusted_certificate_import.trustForCertificateBasedAdminAuth if trusted_certificate_import.trustForCertificateBasedAdminAuth is not none else omit }}"
        trustForCiscoServicesAuth: "{{ trusted_certificate_import.trustForCiscoServicesAuth if trusted_certificate_import.trustForCiscoServicesAuth is not none else omit }}"
        trustForClientAuth: "{{ trusted_certificate_import.trustForClientAuth if trusted_certificate_import.trustForClientAuth is not none else omit }}"
        trustForIseAuth: "{{ trusted_certificate_import.trustForIseAuth if trusted_certificate_import.trustForIseAuth is not none else omit }}"
        validateCertificateExtensions: "{{ trusted_certificate_import.validateCertificateExtensions if trusted_certificate_import.validateCertificateExtensions is not none else omit }}"
      register: trusted_certificate_import_result
      tags:
        - never
        - trusted_certificate_import
