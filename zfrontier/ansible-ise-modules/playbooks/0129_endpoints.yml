---
# Sample playbook for cisco.ise.endpoints (cisco.ise 3.3.0)
# Build order: 129
# Resource module for Endpoints
# Reads ../models/endpoints.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/endpoints_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags endpoints.

- name: "0129 endpoints"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoints.yml
  tasks:
    - name: Run endpoints from its model
      cisco.ise.endpoints:
        connectedLinks: "{{ (endpoints.connectedLinks | cat_strip_nulls) if (endpoints.connectedLinks | cat_strip_nulls) is not none else omit }}"
        customAttributes: "{{ (endpoints.customAttributes | cat_strip_nulls) if (endpoints.customAttributes | cat_strip_nulls) is not none else omit }}"
        description: "{{ endpoints.description if endpoints.description is not none else omit }}"
        deviceType: "{{ endpoints.deviceType if endpoints.deviceType is not none else omit }}"
        groupId: "{{ endpoints.groupId if endpoints.groupId is not none else omit }}"
        hardwareRevision: "{{ endpoints.hardwareRevision if endpoints.hardwareRevision is not none else omit }}"
        id: "{{ endpoints.id if endpoints.id is not none else omit }}"
        identityStore: "{{ endpoints.identityStore if endpoints.identityStore is not none else omit }}"
        identityStoreId: "{{ endpoints.identityStoreId if endpoints.identityStoreId is not none else omit }}"
        ipAddress: "{{ endpoints.ipAddress if endpoints.ipAddress is not none else omit }}"
        ise_client_cert: "{{ endpoints.ise_client_cert if endpoints.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ endpoints.ise_client_key if endpoints.ise_client_key is not none else omit }}"
        ise_debug: "{{ endpoints.ise_debug if endpoints.ise_debug is not none else omit }}"
        ise_hostname: "{{ endpoints.ise_hostname if endpoints.ise_hostname is not none else omit }}"
        ise_password: "{{ endpoints.ise_password if endpoints.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ endpoints.ise_single_request_timeout if endpoints.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ endpoints.ise_username if endpoints.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ endpoints.ise_uses_api_gateway if endpoints.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ endpoints.ise_uses_csrf_token if endpoints.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ endpoints.ise_verify if endpoints.ise_verify is not none else omit }}"
        ise_version: "{{ endpoints.ise_version if endpoints.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ endpoints.ise_wait_on_rate_limit if endpoints.ise_wait_on_rate_limit is not none else omit }}"
        mac: "{{ endpoints.mac if endpoints.mac is not none else omit }}"
        mdmAttributes: "{{ (endpoints.mdmAttributes | cat_strip_nulls) if (endpoints.mdmAttributes | cat_strip_nulls) is not none else omit }}"
        name: "{{ endpoints.name if endpoints.name is not none else omit }}"
        portalUser: "{{ endpoints.portalUser if endpoints.portalUser is not none else omit }}"
        productId: "{{ endpoints.productId if endpoints.productId is not none else omit }}"
        profileId: "{{ endpoints.profileId if endpoints.profileId is not none else omit }}"
        protocol: "{{ endpoints.protocol if endpoints.protocol is not none else omit }}"
        serialNumber: "{{ endpoints.serialNumber if endpoints.serialNumber is not none else omit }}"
        softwareRevision: "{{ endpoints.softwareRevision if endpoints.softwareRevision is not none else omit }}"
        staticGroupAssignment: "{{ endpoints.staticGroupAssignment if endpoints.staticGroupAssignment is not none else omit }}"
        staticProfileAssignment: "{{ endpoints.staticProfileAssignment if endpoints.staticProfileAssignment is not none else omit }}"
        value: "{{ endpoints.value if endpoints.value is not none else omit }}"
        vendor: "{{ endpoints.vendor if endpoints.vendor is not none else omit }}"
      register: endpoints_result
      tags:
        - never
        - endpoints
