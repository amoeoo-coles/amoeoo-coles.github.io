---
# Sample playbook for cisco.ise.anc_endpoint_apply (cisco.ise 3.3.0)
# Build order: 207
# Resource module for ANCendpoint Apply
# Reads ../models/anc_endpoint_apply.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/anc_endpoint_apply_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags anc_endpoint_apply.

- name: "0207 anc_endpoint_apply"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/anc_endpoint_apply.yml
  tasks:
    - name: Run anc_endpoint_apply from its model
      cisco.ise.anc_endpoint_apply:
        description: "{{ anc_endpoint_apply.description if anc_endpoint_apply.description is not none else omit }}"
        id: "{{ anc_endpoint_apply.id if anc_endpoint_apply.id is not none else omit }}"
        ise_client_cert: "{{ anc_endpoint_apply.ise_client_cert if anc_endpoint_apply.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ anc_endpoint_apply.ise_client_key if anc_endpoint_apply.ise_client_key is not none else omit }}"
        ise_debug: "{{ anc_endpoint_apply.ise_debug if anc_endpoint_apply.ise_debug is not none else omit }}"
        ise_hostname: "{{ anc_endpoint_apply.ise_hostname if anc_endpoint_apply.ise_hostname is not none else omit }}"
        ise_password: "{{ anc_endpoint_apply.ise_password if anc_endpoint_apply.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ anc_endpoint_apply.ise_single_request_timeout if anc_endpoint_apply.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ anc_endpoint_apply.ise_username if anc_endpoint_apply.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ anc_endpoint_apply.ise_uses_api_gateway if anc_endpoint_apply.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ anc_endpoint_apply.ise_uses_csrf_token if anc_endpoint_apply.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ anc_endpoint_apply.ise_verify if anc_endpoint_apply.ise_verify is not none else omit }}"
        ise_version: "{{ anc_endpoint_apply.ise_version if anc_endpoint_apply.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ anc_endpoint_apply.ise_wait_on_rate_limit if anc_endpoint_apply.ise_wait_on_rate_limit is not none else omit }}"
        macAddress: "{{ anc_endpoint_apply.macAddress if anc_endpoint_apply.macAddress is not none else omit }}"
        name: "{{ anc_endpoint_apply.name if anc_endpoint_apply.name is not none else omit }}"
        policyName: "{{ anc_endpoint_apply.policyName if anc_endpoint_apply.policyName is not none else omit }}"
      register: anc_endpoint_apply_result
      tags:
        - never
        - anc_endpoint_apply
