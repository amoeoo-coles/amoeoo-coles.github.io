---
# Sample playbook for cisco.ise.trusted_certificate (cisco.ise 3.3.0)
# Build order: 65
# Resource module for Trusted Certificate
# Reads ../models/trusted_certificate.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/trusted_certificate_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags trusted_certificate.

- name: "0065 trusted_certificate"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/trusted_certificate.yml
  tasks:
    - name: Run trusted_certificate from its model
      cisco.ise.trusted_certificate:
        authenticateBeforeCRLReceived: "{{ trusted_certificate.authenticateBeforeCRLReceived if trusted_certificate.authenticateBeforeCRLReceived is not none else omit }}"
        automaticCRLUpdate: "{{ trusted_certificate.automaticCRLUpdate if trusted_certificate.automaticCRLUpdate is not none else omit }}"
        automaticCRLUpdatePeriod: "{{ trusted_certificate.automaticCRLUpdatePeriod if trusted_certificate.automaticCRLUpdatePeriod is not none else omit }}"
        automaticCRLUpdateUnits: "{{ trusted_certificate.automaticCRLUpdateUnits if trusted_certificate.automaticCRLUpdateUnits is not none else omit }}"
        crlDistributionUrl: "{{ trusted_certificate.crlDistributionUrl if trusted_certificate.crlDistributionUrl is not none else omit }}"
        crlDownloadFailureRetries: "{{ trusted_certificate.crlDownloadFailureRetries if trusted_certificate.crlDownloadFailureRetries is not none else omit }}"
        crlDownloadFailureRetriesUnits: "{{ trusted_certificate.crlDownloadFailureRetriesUnits if trusted_certificate.crlDownloadFailureRetriesUnits is not none else omit }}"
        description: "{{ trusted_certificate.description if trusted_certificate.description is not none else omit }}"
        downloadCRL: "{{ trusted_certificate.downloadCRL if trusted_certificate.downloadCRL is not none else omit }}"
        enableOCSPValidation: "{{ trusted_certificate.enableOCSPValidation if trusted_certificate.enableOCSPValidation is not none else omit }}"
        enableServerIdentityCheck: "{{ trusted_certificate.enableServerIdentityCheck if trusted_certificate.enableServerIdentityCheck is not none else omit }}"
        id: "{{ trusted_certificate.id if trusted_certificate.id is not none else omit }}"
        ignoreCRLExpiration: "{{ trusted_certificate.ignoreCRLExpiration if trusted_certificate.ignoreCRLExpiration is not none else omit }}"
        ise_client_cert: "{{ trusted_certificate.ise_client_cert if trusted_certificate.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ trusted_certificate.ise_client_key if trusted_certificate.ise_client_key is not none else omit }}"
        ise_debug: "{{ trusted_certificate.ise_debug if trusted_certificate.ise_debug is not none else omit }}"
        ise_hostname: "{{ trusted_certificate.ise_hostname if trusted_certificate.ise_hostname is not none else omit }}"
        ise_password: "{{ trusted_certificate.ise_password if trusted_certificate.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ trusted_certificate.ise_single_request_timeout if trusted_certificate.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ trusted_certificate.ise_username if trusted_certificate.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ trusted_certificate.ise_uses_api_gateway if trusted_certificate.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ trusted_certificate.ise_uses_csrf_token if trusted_certificate.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ trusted_certificate.ise_verify if trusted_certificate.ise_verify is not none else omit }}"
        ise_version: "{{ trusted_certificate.ise_version if trusted_certificate.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ trusted_certificate.ise_wait_on_rate_limit if trusted_certificate.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ trusted_certificate.name if trusted_certificate.name is not none else omit }}"
        nonAutomaticCRLUpdatePeriod: "{{ trusted_certificate.nonAutomaticCRLUpdatePeriod if trusted_certificate.nonAutomaticCRLUpdatePeriod is not none else omit }}"
        nonAutomaticCRLUpdateUnits: "{{ trusted_certificate.nonAutomaticCRLUpdateUnits if trusted_certificate.nonAutomaticCRLUpdateUnits is not none else omit }}"
        rejectIfNoStatusFromOCSP: "{{ trusted_certificate.rejectIfNoStatusFromOCSP if trusted_certificate.rejectIfNoStatusFromOCSP is not none else omit }}"
        rejectIfUnreachableFromOCSP: "{{ trusted_certificate.rejectIfUnreachableFromOCSP if trusted_certificate.rejectIfUnreachableFromOCSP is not none else omit }}"
        selectedOCSPService: "{{ trusted_certificate.selectedOCSPService if trusted_certificate.selectedOCSPService is not none else omit }}"
        status: "{{ trusted_certificate.status if trusted_certificate.status is not none else omit }}"
        trustForCertificateBasedAdminAuth: "{{ trusted_certificate.trustForCertificateBasedAdminAuth if trusted_certificate.trustForCertificateBasedAdminAuth is not none else omit }}"
        trustForCiscoServicesAuth: "{{ trusted_certificate.trustForCiscoServicesAuth if trusted_certificate.trustForCiscoServicesAuth is not none else omit }}"
        trustForClientAuth: "{{ trusted_certificate.trustForClientAuth if trusted_certificate.trustForClientAuth is not none else omit }}"
        trustForIseAuth: "{{ trusted_certificate.trustForIseAuth if trusted_certificate.trustForIseAuth is not none else omit }}"
      register: trusted_certificate_result
      tags:
        - never
        - trusted_certificate
