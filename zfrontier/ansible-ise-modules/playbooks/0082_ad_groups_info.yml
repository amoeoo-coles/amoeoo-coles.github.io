---
# Sample playbook for cisco.ise.ad_groups_info (cisco.ise 3.3.0)
# Build order: 82
# Information module for Ad Groups Info
# Reads ../models/ad_groups_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ad_groups_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0082 ad_groups_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ad_groups_info.yml
  tasks:
    - name: Run ad_groups_info from its model
      cisco.ise.ad_groups_info:
        activeDirectory: "{{ ad_groups_info.activeDirectory if ad_groups_info.activeDirectory is not none else omit }}"
        ise_client_cert: "{{ ad_groups_info.ise_client_cert if ad_groups_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ ad_groups_info.ise_client_key if ad_groups_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ ad_groups_info.ise_debug if ad_groups_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ ad_groups_info.ise_hostname if ad_groups_info.ise_hostname is not none else omit }}"
        ise_password: "{{ ad_groups_info.ise_password if ad_groups_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ ad_groups_info.ise_single_request_timeout if ad_groups_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ ad_groups_info.ise_username if ad_groups_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ ad_groups_info.ise_uses_api_gateway if ad_groups_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ ad_groups_info.ise_uses_csrf_token if ad_groups_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ ad_groups_info.ise_verify if ad_groups_info.ise_verify is not none else omit }}"
        ise_version: "{{ ad_groups_info.ise_version if ad_groups_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ ad_groups_info.ise_wait_on_rate_limit if ad_groups_info.ise_wait_on_rate_limit is not none else omit }}"
      register: ad_groups_info_result
