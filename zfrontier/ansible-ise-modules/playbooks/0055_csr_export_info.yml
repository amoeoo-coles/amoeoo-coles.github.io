---
# Sample playbook for cisco.ise.csr_export_info (cisco.ise 3.3.0)
# Build order: 55
# Information module for CSR Export
# Reads ../models/csr_export_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/csr_export_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0055 csr_export_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/csr_export_info.yml
  tasks:
    - name: Run csr_export_info from its model
      cisco.ise.csr_export_info:
        dirPath: "{{ csr_export_info.dirPath if csr_export_info.dirPath is not none else omit }}"
        filename: "{{ csr_export_info.filename if csr_export_info.filename is not none else omit }}"
        hostname: "{{ csr_export_info.hostname if csr_export_info.hostname is not none else omit }}"
        id: "{{ csr_export_info.id if csr_export_info.id is not none else omit }}"
        ise_client_cert: "{{ csr_export_info.ise_client_cert if csr_export_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ csr_export_info.ise_client_key if csr_export_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ csr_export_info.ise_debug if csr_export_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ csr_export_info.ise_hostname if csr_export_info.ise_hostname is not none else omit }}"
        ise_password: "{{ csr_export_info.ise_password if csr_export_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ csr_export_info.ise_single_request_timeout if csr_export_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ csr_export_info.ise_username if csr_export_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ csr_export_info.ise_uses_api_gateway if csr_export_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ csr_export_info.ise_uses_csrf_token if csr_export_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ csr_export_info.ise_verify if csr_export_info.ise_verify is not none else omit }}"
        ise_version: "{{ csr_export_info.ise_version if csr_export_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ csr_export_info.ise_wait_on_rate_limit if csr_export_info.ise_wait_on_rate_limit is not none else omit }}"
        saveFile: "{{ csr_export_info.saveFile if csr_export_info.saveFile is not none else omit }}"
      register: csr_export_info_result
