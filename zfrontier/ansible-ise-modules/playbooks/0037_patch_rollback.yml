---
# Sample playbook for cisco.ise.patch_rollback (cisco.ise 3.3.0)
# Build order: 37
# Resource module for Patch Rollback
# Reads ../models/patch_rollback.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/patch_rollback_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags patch_rollback.

- name: "0037 patch_rollback"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/patch_rollback.yml
  tasks:
    - name: Run patch_rollback from its model
      cisco.ise.patch_rollback:
        ise_client_cert: "{{ patch_rollback.ise_client_cert if patch_rollback.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ patch_rollback.ise_client_key if patch_rollback.ise_client_key is not none else omit }}"
        ise_debug: "{{ patch_rollback.ise_debug if patch_rollback.ise_debug is not none else omit }}"
        ise_hostname: "{{ patch_rollback.ise_hostname if patch_rollback.ise_hostname is not none else omit }}"
        ise_password: "{{ patch_rollback.ise_password if patch_rollback.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ patch_rollback.ise_single_request_timeout if patch_rollback.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ patch_rollback.ise_username if patch_rollback.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ patch_rollback.ise_uses_api_gateway if patch_rollback.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ patch_rollback.ise_uses_csrf_token if patch_rollback.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ patch_rollback.ise_verify if patch_rollback.ise_verify is not none else omit }}"
        ise_version: "{{ patch_rollback.ise_version if patch_rollback.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ patch_rollback.ise_wait_on_rate_limit if patch_rollback.ise_wait_on_rate_limit is not none else omit }}"
        patchNumber: "{{ patch_rollback.patchNumber if patch_rollback.patchNumber is not none else omit }}"
      register: patch_rollback_result
      tags:
        - never
        - patch_rollback
