---
# Sample playbook for cisco.ise.system_certificate_info (cisco.ise 3.3.0)
# Build order: 64
# Information module for System Certificate
# Reads ../models/system_certificate_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/system_certificate_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0064 system_certificate_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_certificate_info.yml
  tasks:
    - name: Run system_certificate_info from its model
      cisco.ise.system_certificate_info:
        filter: "{{ system_certificate_info.filter if system_certificate_info.filter is not none else omit }}"
        filterType: "{{ system_certificate_info.filterType if system_certificate_info.filterType is not none else omit }}"
        hostName: "{{ system_certificate_info.hostName if system_certificate_info.hostName is not none else omit }}"
        id: "{{ system_certificate_info.id if system_certificate_info.id is not none else omit }}"
        ise_client_cert: "{{ system_certificate_info.ise_client_cert if system_certificate_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ system_certificate_info.ise_client_key if system_certificate_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ system_certificate_info.ise_debug if system_certificate_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ system_certificate_info.ise_hostname if system_certificate_info.ise_hostname is not none else omit }}"
        ise_password: "{{ system_certificate_info.ise_password if system_certificate_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ system_certificate_info.ise_single_request_timeout if system_certificate_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ system_certificate_info.ise_username if system_certificate_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ system_certificate_info.ise_uses_api_gateway if system_certificate_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ system_certificate_info.ise_uses_csrf_token if system_certificate_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ system_certificate_info.ise_verify if system_certificate_info.ise_verify is not none else omit }}"
        ise_version: "{{ system_certificate_info.ise_version if system_certificate_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ system_certificate_info.ise_wait_on_rate_limit if system_certificate_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ system_certificate_info.page if system_certificate_info.page is not none else omit }}"
        size: "{{ system_certificate_info.size if system_certificate_info.size is not none else omit }}"
        sort: "{{ system_certificate_info.sort if system_certificate_info.sort is not none else omit }}"
        sortBy: "{{ system_certificate_info.sortBy if system_certificate_info.sortBy is not none else omit }}"
      register: system_certificate_info_result
