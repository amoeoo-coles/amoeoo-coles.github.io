---
# Sample playbook for cisco.ise.system_certificate_export_info (cisco.ise 3.3.0)
# Build order: 62
# Information module for System Certificate Export Info
# Reads ../models/system_certificate_export_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/system_certificate_export_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0062 system_certificate_export_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_certificate_export_info.yml
  tasks:
    - name: Run system_certificate_export_info from its model
      cisco.ise.system_certificate_export_info:
        dirPath: "{{ system_certificate_export_info.dirPath if system_certificate_export_info.dirPath is not none else omit }}"
        export: "{{ system_certificate_export_info.export if system_certificate_export_info.export is not none else omit }}"
        filename: "{{ system_certificate_export_info.filename if system_certificate_export_info.filename is not none else omit }}"
        hostName: "{{ system_certificate_export_info.hostName if system_certificate_export_info.hostName is not none else omit }}"
        id: "{{ system_certificate_export_info.id if system_certificate_export_info.id is not none else omit }}"
        ise_client_cert: "{{ system_certificate_export_info.ise_client_cert if system_certificate_export_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ system_certificate_export_info.ise_client_key if system_certificate_export_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ system_certificate_export_info.ise_debug if system_certificate_export_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ system_certificate_export_info.ise_hostname if system_certificate_export_info.ise_hostname is not none else omit }}"
        ise_password: "{{ system_certificate_export_info.ise_password if system_certificate_export_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ system_certificate_export_info.ise_single_request_timeout if system_certificate_export_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ system_certificate_export_info.ise_username if system_certificate_export_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ system_certificate_export_info.ise_uses_api_gateway if system_certificate_export_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ system_certificate_export_info.ise_uses_csrf_token if system_certificate_export_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ system_certificate_export_info.ise_verify if system_certificate_export_info.ise_verify is not none else omit }}"
        ise_version: "{{ system_certificate_export_info.ise_version if system_certificate_export_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ system_certificate_export_info.ise_wait_on_rate_limit if system_certificate_export_info.ise_wait_on_rate_limit is not none else omit }}"
        password: "{{ system_certificate_export_info.password if system_certificate_export_info.password is not none else omit }}"
        saveFile: "{{ system_certificate_export_info.saveFile if system_certificate_export_info.saveFile is not none else omit }}"
      register: system_certificate_export_info_result
