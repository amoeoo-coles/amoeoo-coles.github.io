---
# Sample playbook for cisco.ise.active_directories_info (cisco.ise 3.3.0)
# Build order: 75
# Information module for Active Directories Info
# Reads ../models/active_directories_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/active_directories_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0075 active_directories_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/active_directories_info.yml
  tasks:
    - name: Run active_directories_info from its model
      cisco.ise.active_directories_info:
        ise_client_cert: "{{ active_directories_info.ise_client_cert if active_directories_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ active_directories_info.ise_client_key if active_directories_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ active_directories_info.ise_debug if active_directories_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ active_directories_info.ise_hostname if active_directories_info.ise_hostname is not none else omit }}"
        ise_password: "{{ active_directories_info.ise_password if active_directories_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ active_directories_info.ise_single_request_timeout if active_directories_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ active_directories_info.ise_username if active_directories_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ active_directories_info.ise_uses_api_gateway if active_directories_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ active_directories_info.ise_uses_csrf_token if active_directories_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ active_directories_info.ise_verify if active_directories_info.ise_verify is not none else omit }}"
        ise_version: "{{ active_directories_info.ise_version if active_directories_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ active_directories_info.ise_wait_on_rate_limit if active_directories_info.ise_wait_on_rate_limit is not none else omit }}"
      register: active_directories_info_result
