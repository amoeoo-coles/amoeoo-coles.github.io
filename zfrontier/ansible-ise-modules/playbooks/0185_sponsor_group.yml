---
# Sample playbook for cisco.ise.sponsor_group (cisco.ise 3.3.0)
# Build order: 185
# Resource module for Sponsorgroup
# Reads ../models/sponsor_group.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sponsor_group_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sponsor_group.

- name: "0185 sponsor_group"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sponsor_group.yml
  tasks:
    - name: Run sponsor_group from its model
      cisco.ise.sponsor_group:
        autoNotification: "{{ sponsor_group.autoNotification if sponsor_group.autoNotification is not none else omit }}"
        createPermissions: "{{ (sponsor_group.createPermissions | cat_strip_nulls) if (sponsor_group.createPermissions | cat_strip_nulls) is not none else omit }}"
        description: "{{ sponsor_group.description if sponsor_group.description is not none else omit }}"
        guestTypes: "{{ (sponsor_group.guestTypes | cat_strip_nulls) if (sponsor_group.guestTypes | cat_strip_nulls) is not none else omit }}"
        id: "{{ sponsor_group.id if sponsor_group.id is not none else omit }}"
        isDefaultGroup: "{{ sponsor_group.isDefaultGroup if sponsor_group.isDefaultGroup is not none else omit }}"
        isEnabled: "{{ sponsor_group.isEnabled if sponsor_group.isEnabled is not none else omit }}"
        ise_client_cert: "{{ sponsor_group.ise_client_cert if sponsor_group.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sponsor_group.ise_client_key if sponsor_group.ise_client_key is not none else omit }}"
        ise_debug: "{{ sponsor_group.ise_debug if sponsor_group.ise_debug is not none else omit }}"
        ise_hostname: "{{ sponsor_group.ise_hostname if sponsor_group.ise_hostname is not none else omit }}"
        ise_password: "{{ sponsor_group.ise_password if sponsor_group.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sponsor_group.ise_single_request_timeout if sponsor_group.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sponsor_group.ise_username if sponsor_group.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sponsor_group.ise_uses_api_gateway if sponsor_group.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sponsor_group.ise_uses_csrf_token if sponsor_group.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sponsor_group.ise_verify if sponsor_group.ise_verify is not none else omit }}"
        ise_version: "{{ sponsor_group.ise_version if sponsor_group.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sponsor_group.ise_wait_on_rate_limit if sponsor_group.ise_wait_on_rate_limit is not none else omit }}"
        locations: "{{ (sponsor_group.locations | cat_strip_nulls) if (sponsor_group.locations | cat_strip_nulls) is not none else omit }}"
        managePermission: "{{ sponsor_group.managePermission if sponsor_group.managePermission is not none else omit }}"
        memberGroups: "{{ (sponsor_group.memberGroups | cat_strip_nulls) if (sponsor_group.memberGroups | cat_strip_nulls) is not none else omit }}"
        name: "{{ sponsor_group.name if sponsor_group.name is not none else omit }}"
        otherPermissions: "{{ (sponsor_group.otherPermissions | cat_strip_nulls) if (sponsor_group.otherPermissions | cat_strip_nulls) is not none else omit }}"
      register: sponsor_group_result
      tags:
        - never
        - sponsor_group
