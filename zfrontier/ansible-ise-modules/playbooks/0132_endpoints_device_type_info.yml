---
# Sample playbook for cisco.ise.endpoints_device_type_info (cisco.ise 3.3.0)
# Build order: 132
# Information module for Endpoints Device Type Info
# Reads ../models/endpoints_device_type_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/endpoints_device_type_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0132 endpoints_device_type_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoints_device_type_info.yml
  tasks:
    - name: Run endpoints_device_type_info from its model
      cisco.ise.endpoints_device_type_info:
        ise_client_cert: "{{ endpoints_device_type_info.ise_client_cert if endpoints_device_type_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ endpoints_device_type_info.ise_client_key if endpoints_device_type_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ endpoints_device_type_info.ise_debug if endpoints_device_type_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ endpoints_device_type_info.ise_hostname if endpoints_device_type_info.ise_hostname is not none else omit }}"
        ise_password: "{{ endpoints_device_type_info.ise_password if endpoints_device_type_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ endpoints_device_type_info.ise_single_request_timeout if endpoints_device_type_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ endpoints_device_type_info.ise_username if endpoints_device_type_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ endpoints_device_type_info.ise_uses_api_gateway if endpoints_device_type_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ endpoints_device_type_info.ise_uses_csrf_token if endpoints_device_type_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ endpoints_device_type_info.ise_verify if endpoints_device_type_info.ise_verify is not none else omit }}"
        ise_version: "{{ endpoints_device_type_info.ise_version if endpoints_device_type_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ endpoints_device_type_info.ise_wait_on_rate_limit if endpoints_device_type_info.ise_wait_on_rate_limit is not none else omit }}"
      register: endpoints_device_type_info_result
