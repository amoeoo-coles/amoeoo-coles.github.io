---
# Sample playbook for cisco.ise.egress_matrix_cell_info (cisco.ise 3.3.0)
# Build order: 154
# Information module for Egressmatrixcell
# Reads ../models/egress_matrix_cell_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/egress_matrix_cell_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0154 egress_matrix_cell_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/egress_matrix_cell_info.yml
  tasks:
    - name: Run egress_matrix_cell_info from its model
      cisco.ise.egress_matrix_cell_info:
        filter: "{{ egress_matrix_cell_info.filter if egress_matrix_cell_info.filter is not none else omit }}"
        filterType: "{{ egress_matrix_cell_info.filterType if egress_matrix_cell_info.filterType is not none else omit }}"
        id: "{{ egress_matrix_cell_info.id if egress_matrix_cell_info.id is not none else omit }}"
        ise_client_cert: "{{ egress_matrix_cell_info.ise_client_cert if egress_matrix_cell_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ egress_matrix_cell_info.ise_client_key if egress_matrix_cell_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ egress_matrix_cell_info.ise_debug if egress_matrix_cell_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ egress_matrix_cell_info.ise_hostname if egress_matrix_cell_info.ise_hostname is not none else omit }}"
        ise_password: "{{ egress_matrix_cell_info.ise_password if egress_matrix_cell_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ egress_matrix_cell_info.ise_single_request_timeout if egress_matrix_cell_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ egress_matrix_cell_info.ise_username if egress_matrix_cell_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ egress_matrix_cell_info.ise_uses_api_gateway if egress_matrix_cell_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ egress_matrix_cell_info.ise_uses_csrf_token if egress_matrix_cell_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ egress_matrix_cell_info.ise_verify if egress_matrix_cell_info.ise_verify is not none else omit }}"
        ise_version: "{{ egress_matrix_cell_info.ise_version if egress_matrix_cell_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ egress_matrix_cell_info.ise_wait_on_rate_limit if egress_matrix_cell_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ egress_matrix_cell_info.name if egress_matrix_cell_info.name is not none else omit }}"
        page: "{{ egress_matrix_cell_info.page if egress_matrix_cell_info.page is not none else omit }}"
        size: "{{ egress_matrix_cell_info.size if egress_matrix_cell_info.size is not none else omit }}"
        sortasc: "{{ egress_matrix_cell_info.sortasc if egress_matrix_cell_info.sortasc is not none else omit }}"
        sortdsc: "{{ egress_matrix_cell_info.sortdsc if egress_matrix_cell_info.sortdsc is not none else omit }}"
      register: egress_matrix_cell_info_result
