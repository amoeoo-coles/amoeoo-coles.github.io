---
# Sample playbook for cisco.ise.endpoints_task (cisco.ise 3.3.0)
# Build order: 134
# Resource module for Endpoints Task
# Reads ../models/endpoints_task.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/endpoints_task_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags endpoints_task.

- name: "0134 endpoints_task"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoints_task.yml
  tasks:
    - name: Run endpoints_task from its model
      cisco.ise.endpoints_task:
        connectedLinks: "{{ (endpoints_task.connectedLinks | cat_strip_nulls) if (endpoints_task.connectedLinks | cat_strip_nulls) is not none else omit }}"
        customAttributes: "{{ (endpoints_task.customAttributes | cat_strip_nulls) if (endpoints_task.customAttributes | cat_strip_nulls) is not none else omit }}"
        description: "{{ endpoints_task.description if endpoints_task.description is not none else omit }}"
        deviceType: "{{ endpoints_task.deviceType if endpoints_task.deviceType is not none else omit }}"
        groupId: "{{ endpoints_task.groupId if endpoints_task.groupId is not none else omit }}"
        hardwareRevision: "{{ endpoints_task.hardwareRevision if endpoints_task.hardwareRevision is not none else omit }}"
        id: "{{ endpoints_task.id if endpoints_task.id is not none else omit }}"
        identityStore: "{{ endpoints_task.identityStore if endpoints_task.identityStore is not none else omit }}"
        identityStoreId: "{{ endpoints_task.identityStoreId if endpoints_task.identityStoreId is not none else omit }}"
        ipAddress: "{{ endpoints_task.ipAddress if endpoints_task.ipAddress is not none else omit }}"
        ise_client_cert: "{{ endpoints_task.ise_client_cert if endpoints_task.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ endpoints_task.ise_client_key if endpoints_task.ise_client_key is not none else omit }}"
        ise_debug: "{{ endpoints_task.ise_debug if endpoints_task.ise_debug is not none else omit }}"
        ise_hostname: "{{ endpoints_task.ise_hostname if endpoints_task.ise_hostname is not none else omit }}"
        ise_password: "{{ endpoints_task.ise_password if endpoints_task.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ endpoints_task.ise_single_request_timeout if endpoints_task.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ endpoints_task.ise_username if endpoints_task.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ endpoints_task.ise_uses_api_gateway if endpoints_task.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ endpoints_task.ise_uses_csrf_token if endpoints_task.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ endpoints_task.ise_verify if endpoints_task.ise_verify is not none else omit }}"
        ise_version: "{{ endpoints_task.ise_version if endpoints_task.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ endpoints_task.ise_wait_on_rate_limit if endpoints_task.ise_wait_on_rate_limit is not none else omit }}"
        mac: "{{ endpoints_task.mac if endpoints_task.mac is not none else omit }}"
        mdmAttributes: "{{ (endpoints_task.mdmAttributes | cat_strip_nulls) if (endpoints_task.mdmAttributes | cat_strip_nulls) is not none else omit }}"
        name: "{{ endpoints_task.name if endpoints_task.name is not none else omit }}"
        portalUser: "{{ endpoints_task.portalUser if endpoints_task.portalUser is not none else omit }}"
        productId: "{{ endpoints_task.productId if endpoints_task.productId is not none else omit }}"
        profileId: "{{ endpoints_task.profileId if endpoints_task.profileId is not none else omit }}"
        protocol: "{{ endpoints_task.protocol if endpoints_task.protocol is not none else omit }}"
        serialNumber: "{{ endpoints_task.serialNumber if endpoints_task.serialNumber is not none else omit }}"
        softwareRevision: "{{ endpoints_task.softwareRevision if endpoints_task.softwareRevision is not none else omit }}"
        staticGroupAssignment: "{{ endpoints_task.staticGroupAssignment if endpoints_task.staticGroupAssignment is not none else omit }}"
        staticProfileAssignment: "{{ endpoints_task.staticProfileAssignment if endpoints_task.staticProfileAssignment is not none else omit }}"
        vendor: "{{ endpoints_task.vendor if endpoints_task.vendor is not none else omit }}"
      register: endpoints_task_result
      tags:
        - never
        - endpoints_task
