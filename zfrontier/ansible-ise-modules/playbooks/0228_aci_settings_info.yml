---
# Sample playbook for cisco.ise.aci_settings_info (cisco.ise 3.3.0)
# Build order: 228
# Information module for ACIsettings
# Reads ../models/aci_settings_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/aci_settings_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0228 aci_settings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/aci_settings_info.yml
  tasks:
    - name: Run aci_settings_info from its model
      cisco.ise.aci_settings_info:
        ise_client_cert: "{{ aci_settings_info.ise_client_cert if aci_settings_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ aci_settings_info.ise_client_key if aci_settings_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ aci_settings_info.ise_debug if aci_settings_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ aci_settings_info.ise_hostname if aci_settings_info.ise_hostname is not none else omit }}"
        ise_password: "{{ aci_settings_info.ise_password if aci_settings_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ aci_settings_info.ise_single_request_timeout if aci_settings_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ aci_settings_info.ise_username if aci_settings_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ aci_settings_info.ise_uses_api_gateway if aci_settings_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ aci_settings_info.ise_uses_csrf_token if aci_settings_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ aci_settings_info.ise_verify if aci_settings_info.ise_verify is not none else omit }}"
        ise_version: "{{ aci_settings_info.ise_version if aci_settings_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ aci_settings_info.ise_wait_on_rate_limit if aci_settings_info.ise_wait_on_rate_limit is not none else omit }}"
      register: aci_settings_info_result
