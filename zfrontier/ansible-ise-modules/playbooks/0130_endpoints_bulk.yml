---
# Sample playbook for cisco.ise.endpoints_bulk (cisco.ise 3.3.0)
# Build order: 130
# Resource module for Endpoints Bulk
# Reads ../models/endpoints_bulk.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/endpoints_bulk_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags endpoints_bulk.

- name: "0130 endpoints_bulk"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoints_bulk.yml
  tasks:
    - name: Run endpoints_bulk from its model
      cisco.ise.endpoints_bulk:
        connectedLinks: "{{ endpoints_bulk.connectedLinks if endpoints_bulk.connectedLinks is not none else omit }}"
        customAttributes: "{{ endpoints_bulk.customAttributes if endpoints_bulk.customAttributes is not none else omit }}"
        description: "{{ endpoints_bulk.description if endpoints_bulk.description is not none else omit }}"
        deviceType: "{{ endpoints_bulk.deviceType if endpoints_bulk.deviceType is not none else omit }}"
        groupId: "{{ endpoints_bulk.groupId if endpoints_bulk.groupId is not none else omit }}"
        hardwareRevision: "{{ endpoints_bulk.hardwareRevision if endpoints_bulk.hardwareRevision is not none else omit }}"
        id: "{{ endpoints_bulk.id if endpoints_bulk.id is not none else omit }}"
        identityStore: "{{ endpoints_bulk.identityStore if endpoints_bulk.identityStore is not none else omit }}"
        identityStoreId: "{{ endpoints_bulk.identityStoreId if endpoints_bulk.identityStoreId is not none else omit }}"
        ipAddress: "{{ endpoints_bulk.ipAddress if endpoints_bulk.ipAddress is not none else omit }}"
        ise_client_cert: "{{ endpoints_bulk.ise_client_cert if endpoints_bulk.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ endpoints_bulk.ise_client_key if endpoints_bulk.ise_client_key is not none else omit }}"
        ise_debug: "{{ endpoints_bulk.ise_debug if endpoints_bulk.ise_debug is not none else omit }}"
        ise_hostname: "{{ endpoints_bulk.ise_hostname if endpoints_bulk.ise_hostname is not none else omit }}"
        ise_password: "{{ endpoints_bulk.ise_password if endpoints_bulk.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ endpoints_bulk.ise_single_request_timeout if endpoints_bulk.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ endpoints_bulk.ise_username if endpoints_bulk.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ endpoints_bulk.ise_uses_api_gateway if endpoints_bulk.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ endpoints_bulk.ise_uses_csrf_token if endpoints_bulk.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ endpoints_bulk.ise_verify if endpoints_bulk.ise_verify is not none else omit }}"
        ise_version: "{{ endpoints_bulk.ise_version if endpoints_bulk.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ endpoints_bulk.ise_wait_on_rate_limit if endpoints_bulk.ise_wait_on_rate_limit is not none else omit }}"
        mac: "{{ endpoints_bulk.mac if endpoints_bulk.mac is not none else omit }}"
        mdmAttributes: "{{ endpoints_bulk.mdmAttributes if endpoints_bulk.mdmAttributes is not none else omit }}"
        name: "{{ endpoints_bulk.name if endpoints_bulk.name is not none else omit }}"
        payload: "{{ (endpoints_bulk.payload | cat_strip_nulls) if (endpoints_bulk.payload | cat_strip_nulls) is not none else omit }}"
        portalUser: "{{ endpoints_bulk.portalUser if endpoints_bulk.portalUser is not none else omit }}"
        productId: "{{ endpoints_bulk.productId if endpoints_bulk.productId is not none else omit }}"
        profileId: "{{ endpoints_bulk.profileId if endpoints_bulk.profileId is not none else omit }}"
        protocol: "{{ endpoints_bulk.protocol if endpoints_bulk.protocol is not none else omit }}"
        serialNumber: "{{ endpoints_bulk.serialNumber if endpoints_bulk.serialNumber is not none else omit }}"
        softwareRevision: "{{ endpoints_bulk.softwareRevision if endpoints_bulk.softwareRevision is not none else omit }}"
        staticGroupAssignment: "{{ endpoints_bulk.staticGroupAssignment if endpoints_bulk.staticGroupAssignment is not none else omit }}"
        staticProfileAssignment: "{{ endpoints_bulk.staticProfileAssignment if endpoints_bulk.staticProfileAssignment is not none else omit }}"
        value: "{{ endpoints_bulk.value if endpoints_bulk.value is not none else omit }}"
        vendor: "{{ endpoints_bulk.vendor if endpoints_bulk.vendor is not none else omit }}"
      register: endpoints_bulk_result
      tags:
        - never
        - endpoints_bulk
