---
# Sample playbook for cisco.ise.selfsigned_certificate_generate (cisco.ise 3.3.0)
# Build order: 60
# Resource module for Selfsigned Certificate Generate
# Reads ../models/selfsigned_certificate_generate.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/selfsigned_certificate_generate_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags selfsigned_certificate_generate.

- name: "0060 selfsigned_certificate_generate"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/selfsigned_certificate_generate.yml
  tasks:
    - name: Run selfsigned_certificate_generate from its model
      cisco.ise.selfsigned_certificate_generate:
        admin: "{{ selfsigned_certificate_generate.admin if selfsigned_certificate_generate.admin is not none else omit }}"
        allowExtendedValidity: "{{ selfsigned_certificate_generate.allowExtendedValidity if selfsigned_certificate_generate.allowExtendedValidity is not none else omit }}"
        allowPortalTagTransferForSameSubject: "{{ selfsigned_certificate_generate.allowPortalTagTransferForSameSubject if selfsigned_certificate_generate.allowPortalTagTransferForSameSubject is not none else omit }}"
        allowReplacementOfCertificates: "{{ selfsigned_certificate_generate.allowReplacementOfCertificates if selfsigned_certificate_generate.allowReplacementOfCertificates is not none else omit }}"
        allowReplacementOfPortalGroupTag: "{{ selfsigned_certificate_generate.allowReplacementOfPortalGroupTag if selfsigned_certificate_generate.allowReplacementOfPortalGroupTag is not none else omit }}"
        allowRoleTransferForSameSubject: "{{ selfsigned_certificate_generate.allowRoleTransferForSameSubject if selfsigned_certificate_generate.allowRoleTransferForSameSubject is not none else omit }}"
        allowSanDnsBadName: "{{ selfsigned_certificate_generate.allowSanDnsBadName if selfsigned_certificate_generate.allowSanDnsBadName is not none else omit }}"
        allowSanDnsNonResolvable: "{{ selfsigned_certificate_generate.allowSanDnsNonResolvable if selfsigned_certificate_generate.allowSanDnsNonResolvable is not none else omit }}"
        allowWildCardCertificates: "{{ selfsigned_certificate_generate.allowWildCardCertificates if selfsigned_certificate_generate.allowWildCardCertificates is not none else omit }}"
        certificatePolicies: "{{ selfsigned_certificate_generate.certificatePolicies if selfsigned_certificate_generate.certificatePolicies is not none else omit }}"
        digestType: "{{ selfsigned_certificate_generate.digestType if selfsigned_certificate_generate.digestType is not none else omit }}"
        eap: "{{ selfsigned_certificate_generate.eap if selfsigned_certificate_generate.eap is not none else omit }}"
        expirationTTL: "{{ selfsigned_certificate_generate.expirationTTL if selfsigned_certificate_generate.expirationTTL is not none else omit }}"
        expirationTTLUnit: "{{ selfsigned_certificate_generate.expirationTTLUnit if selfsigned_certificate_generate.expirationTTLUnit is not none else omit }}"
        hostName: "{{ selfsigned_certificate_generate.hostName if selfsigned_certificate_generate.hostName is not none else omit }}"
        ise_client_cert: "{{ selfsigned_certificate_generate.ise_client_cert if selfsigned_certificate_generate.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ selfsigned_certificate_generate.ise_client_key if selfsigned_certificate_generate.ise_client_key is not none else omit }}"
        ise_debug: "{{ selfsigned_certificate_generate.ise_debug if selfsigned_certificate_generate.ise_debug is not none else omit }}"
        ise_hostname: "{{ selfsigned_certificate_generate.ise_hostname if selfsigned_certificate_generate.ise_hostname is not none else omit }}"
        ise_password: "{{ selfsigned_certificate_generate.ise_password if selfsigned_certificate_generate.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ selfsigned_certificate_generate.ise_single_request_timeout if selfsigned_certificate_generate.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ selfsigned_certificate_generate.ise_username if selfsigned_certificate_generate.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ selfsigned_certificate_generate.ise_uses_api_gateway if selfsigned_certificate_generate.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ selfsigned_certificate_generate.ise_uses_csrf_token if selfsigned_certificate_generate.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ selfsigned_certificate_generate.ise_verify if selfsigned_certificate_generate.ise_verify is not none else omit }}"
        ise_version: "{{ selfsigned_certificate_generate.ise_version if selfsigned_certificate_generate.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ selfsigned_certificate_generate.ise_wait_on_rate_limit if selfsigned_certificate_generate.ise_wait_on_rate_limit is not none else omit }}"
        keyLength: "{{ selfsigned_certificate_generate.keyLength if selfsigned_certificate_generate.keyLength is not none else omit }}"
        keyType: "{{ selfsigned_certificate_generate.keyType if selfsigned_certificate_generate.keyType is not none else omit }}"
        name: "{{ selfsigned_certificate_generate.name if selfsigned_certificate_generate.name is not none else omit }}"
        portal: "{{ selfsigned_certificate_generate.portal if selfsigned_certificate_generate.portal is not none else omit }}"
        portalGroupTag: "{{ selfsigned_certificate_generate.portalGroupTag if selfsigned_certificate_generate.portalGroupTag is not none else omit }}"
        pxgrid: "{{ selfsigned_certificate_generate.pxgrid if selfsigned_certificate_generate.pxgrid is not none else omit }}"
        radius: "{{ selfsigned_certificate_generate.radius if selfsigned_certificate_generate.radius is not none else omit }}"
        saml: "{{ selfsigned_certificate_generate.saml if selfsigned_certificate_generate.saml is not none else omit }}"
        sanDNS: "{{ (selfsigned_certificate_generate.sanDNS | cat_strip_nulls) if (selfsigned_certificate_generate.sanDNS | cat_strip_nulls) is not none else omit }}"
        sanIP: "{{ (selfsigned_certificate_generate.sanIP | cat_strip_nulls) if (selfsigned_certificate_generate.sanIP | cat_strip_nulls) is not none else omit }}"
        sanURI: "{{ (selfsigned_certificate_generate.sanURI | cat_strip_nulls) if (selfsigned_certificate_generate.sanURI | cat_strip_nulls) is not none else omit }}"
        subjectCity: "{{ selfsigned_certificate_generate.subjectCity if selfsigned_certificate_generate.subjectCity is not none else omit }}"
        subjectCommonName: "{{ selfsigned_certificate_generate.subjectCommonName if selfsigned_certificate_generate.subjectCommonName is not none else omit }}"
        subjectCountry: "{{ selfsigned_certificate_generate.subjectCountry if selfsigned_certificate_generate.subjectCountry is not none else omit }}"
        subjectOrg: "{{ selfsigned_certificate_generate.subjectOrg if selfsigned_certificate_generate.subjectOrg is not none else omit }}"
        subjectOrgUnit: "{{ selfsigned_certificate_generate.subjectOrgUnit if selfsigned_certificate_generate.subjectOrgUnit is not none else omit }}"
        subjectState: "{{ selfsigned_certificate_generate.subjectState if selfsigned_certificate_generate.subjectState is not none else omit }}"
      register: selfsigned_certificate_generate_result
      tags:
        - never
        - selfsigned_certificate_generate
