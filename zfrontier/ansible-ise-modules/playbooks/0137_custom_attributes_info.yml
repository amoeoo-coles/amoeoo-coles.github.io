---
# Sample playbook for cisco.ise.custom_attributes_info (cisco.ise 3.3.0)
# Build order: 137
# Information module for Custom Attributes Info
# Reads ../models/custom_attributes_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/custom_attributes_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0137 custom_attributes_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/custom_attributes_info.yml
  tasks:
    - name: Run custom_attributes_info from its model
      cisco.ise.custom_attributes_info:
        ise_client_cert: "{{ custom_attributes_info.ise_client_cert if custom_attributes_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ custom_attributes_info.ise_client_key if custom_attributes_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ custom_attributes_info.ise_debug if custom_attributes_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ custom_attributes_info.ise_hostname if custom_attributes_info.ise_hostname is not none else omit }}"
        ise_password: "{{ custom_attributes_info.ise_password if custom_attributes_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ custom_attributes_info.ise_single_request_timeout if custom_attributes_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ custom_attributes_info.ise_username if custom_attributes_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ custom_attributes_info.ise_uses_api_gateway if custom_attributes_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ custom_attributes_info.ise_uses_csrf_token if custom_attributes_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ custom_attributes_info.ise_verify if custom_attributes_info.ise_verify is not none else omit }}"
        ise_version: "{{ custom_attributes_info.ise_version if custom_attributes_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ custom_attributes_info.ise_wait_on_rate_limit if custom_attributes_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ custom_attributes_info.name if custom_attributes_info.name is not none else omit }}"
      register: custom_attributes_info_result
