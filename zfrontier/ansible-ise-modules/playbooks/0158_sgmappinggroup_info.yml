---
# Sample playbook for cisco.ise.sgmappinggroup_info (cisco.ise 3.3.0)
# Build order: 158
# Information module for SGmappinggroup
# Reads ../models/sgmappinggroup_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgmappinggroup_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0158 sgmappinggroup_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgmappinggroup_info.yml
  tasks:
    - name: Run sgmappinggroup_info from its model
      cisco.ise.sgmappinggroup_info:
        filter: "{{ sgmappinggroup_info.filter if sgmappinggroup_info.filter is not none else omit }}"
        filterType: "{{ sgmappinggroup_info.filterType if sgmappinggroup_info.filterType is not none else omit }}"
        id: "{{ sgmappinggroup_info.id if sgmappinggroup_info.id is not none else omit }}"
        ise_client_cert: "{{ sgmappinggroup_info.ise_client_cert if sgmappinggroup_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgmappinggroup_info.ise_client_key if sgmappinggroup_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgmappinggroup_info.ise_debug if sgmappinggroup_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgmappinggroup_info.ise_hostname if sgmappinggroup_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sgmappinggroup_info.ise_password if sgmappinggroup_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgmappinggroup_info.ise_single_request_timeout if sgmappinggroup_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgmappinggroup_info.ise_username if sgmappinggroup_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgmappinggroup_info.ise_uses_api_gateway if sgmappinggroup_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgmappinggroup_info.ise_uses_csrf_token if sgmappinggroup_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgmappinggroup_info.ise_verify if sgmappinggroup_info.ise_verify is not none else omit }}"
        ise_version: "{{ sgmappinggroup_info.ise_version if sgmappinggroup_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgmappinggroup_info.ise_wait_on_rate_limit if sgmappinggroup_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgmappinggroup_info.name if sgmappinggroup_info.name is not none else omit }}"
        page: "{{ sgmappinggroup_info.page if sgmappinggroup_info.page is not none else omit }}"
        size: "{{ sgmappinggroup_info.size if sgmappinggroup_info.size is not none else omit }}"
        sortasc: "{{ sgmappinggroup_info.sortasc if sgmappinggroup_info.sortasc is not none else omit }}"
        sortdsc: "{{ sgmappinggroup_info.sortdsc if sgmappinggroup_info.sortdsc is not none else omit }}"
      register: sgmappinggroup_info_result
