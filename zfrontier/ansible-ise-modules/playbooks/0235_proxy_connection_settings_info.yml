---
# Sample playbook for cisco.ise.proxy_connection_settings_info (cisco.ise 3.3.0)
# Build order: 235
# Information module for Proxy Connection Settings
# Reads ../models/proxy_connection_settings_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/proxy_connection_settings_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0235 proxy_connection_settings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/proxy_connection_settings_info.yml
  tasks:
    - name: Run proxy_connection_settings_info from its model
      cisco.ise.proxy_connection_settings_info:
        ise_client_cert: "{{ proxy_connection_settings_info.ise_client_cert if proxy_connection_settings_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ proxy_connection_settings_info.ise_client_key if proxy_connection_settings_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ proxy_connection_settings_info.ise_debug if proxy_connection_settings_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ proxy_connection_settings_info.ise_hostname if proxy_connection_settings_info.ise_hostname is not none else omit }}"
        ise_password: "{{ proxy_connection_settings_info.ise_password if proxy_connection_settings_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ proxy_connection_settings_info.ise_single_request_timeout if proxy_connection_settings_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ proxy_connection_settings_info.ise_username if proxy_connection_settings_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ proxy_connection_settings_info.ise_uses_api_gateway if proxy_connection_settings_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ proxy_connection_settings_info.ise_uses_csrf_token if proxy_connection_settings_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ proxy_connection_settings_info.ise_verify if proxy_connection_settings_info.ise_verify is not none else omit }}"
        ise_version: "{{ proxy_connection_settings_info.ise_version if proxy_connection_settings_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ proxy_connection_settings_info.ise_wait_on_rate_limit if proxy_connection_settings_info.ise_wait_on_rate_limit is not none else omit }}"
      register: proxy_connection_settings_info_result
