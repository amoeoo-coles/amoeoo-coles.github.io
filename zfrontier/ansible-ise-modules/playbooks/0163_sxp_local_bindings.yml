---
# Sample playbook for cisco.ise.sxp_local_bindings (cisco.ise 3.3.0)
# Build order: 163
# Resource module for SXPlocalbindings
# Reads ../models/sxp_local_bindings.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sxp_local_bindings_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sxp_local_bindings.

- name: "0163 sxp_local_bindings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sxp_local_bindings.yml
  tasks:
    - name: Run sxp_local_bindings from its model
      cisco.ise.sxp_local_bindings:
        bindingName: "{{ sxp_local_bindings.bindingName if sxp_local_bindings.bindingName is not none else omit }}"
        description: "{{ sxp_local_bindings.description if sxp_local_bindings.description is not none else omit }}"
        id: "{{ sxp_local_bindings.id if sxp_local_bindings.id is not none else omit }}"
        ipAddressOrHost: "{{ sxp_local_bindings.ipAddressOrHost if sxp_local_bindings.ipAddressOrHost is not none else omit }}"
        ise_client_cert: "{{ sxp_local_bindings.ise_client_cert if sxp_local_bindings.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sxp_local_bindings.ise_client_key if sxp_local_bindings.ise_client_key is not none else omit }}"
        ise_debug: "{{ sxp_local_bindings.ise_debug if sxp_local_bindings.ise_debug is not none else omit }}"
        ise_hostname: "{{ sxp_local_bindings.ise_hostname if sxp_local_bindings.ise_hostname is not none else omit }}"
        ise_password: "{{ sxp_local_bindings.ise_password if sxp_local_bindings.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sxp_local_bindings.ise_single_request_timeout if sxp_local_bindings.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sxp_local_bindings.ise_username if sxp_local_bindings.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sxp_local_bindings.ise_uses_api_gateway if sxp_local_bindings.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sxp_local_bindings.ise_uses_csrf_token if sxp_local_bindings.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sxp_local_bindings.ise_verify if sxp_local_bindings.ise_verify is not none else omit }}"
        ise_version: "{{ sxp_local_bindings.ise_version if sxp_local_bindings.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sxp_local_bindings.ise_wait_on_rate_limit if sxp_local_bindings.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sxp_local_bindings.name if sxp_local_bindings.name is not none else omit }}"
        sgt: "{{ sxp_local_bindings.sgt if sxp_local_bindings.sgt is not none else omit }}"
        sxpVpn: "{{ sxp_local_bindings.sxpVpn if sxp_local_bindings.sxpVpn is not none else omit }}"
        vns: "{{ sxp_local_bindings.vns if sxp_local_bindings.vns is not none else omit }}"
      register: sxp_local_bindings_result
      tags:
        - never
        - sxp_local_bindings
