---
# Sample playbook for cisco.ise.renew_certificate (cisco.ise 3.3.0)
# Build order: 72
# Resource module for Renew Certificate
# Reads ../models/renew_certificate.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/renew_certificate_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags renew_certificate.

- name: "0072 renew_certificate"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/renew_certificate.yml
  tasks:
    - name: Run renew_certificate from its model
      cisco.ise.renew_certificate:
        certType: "{{ renew_certificate.certType if renew_certificate.certType is not none else omit }}"
        ise_client_cert: "{{ renew_certificate.ise_client_cert if renew_certificate.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ renew_certificate.ise_client_key if renew_certificate.ise_client_key is not none else omit }}"
        ise_debug: "{{ renew_certificate.ise_debug if renew_certificate.ise_debug is not none else omit }}"
        ise_hostname: "{{ renew_certificate.ise_hostname if renew_certificate.ise_hostname is not none else omit }}"
        ise_password: "{{ renew_certificate.ise_password if renew_certificate.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ renew_certificate.ise_single_request_timeout if renew_certificate.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ renew_certificate.ise_username if renew_certificate.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ renew_certificate.ise_uses_api_gateway if renew_certificate.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ renew_certificate.ise_uses_csrf_token if renew_certificate.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ renew_certificate.ise_verify if renew_certificate.ise_verify is not none else omit }}"
        ise_version: "{{ renew_certificate.ise_version if renew_certificate.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ renew_certificate.ise_wait_on_rate_limit if renew_certificate.ise_wait_on_rate_limit is not none else omit }}"
      register: renew_certificate_result
      tags:
        - never
        - renew_certificate
