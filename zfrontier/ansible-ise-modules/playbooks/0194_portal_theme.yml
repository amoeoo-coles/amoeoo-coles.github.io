---
# Sample playbook for cisco.ise.portal_theme (cisco.ise 3.3.0)
# Build order: 194
# Resource module for Portaltheme
# Reads ../models/portal_theme.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/portal_theme_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags portal_theme.

- name: "0194 portal_theme"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/portal_theme.yml
  tasks:
    - name: Run portal_theme from its model
      cisco.ise.portal_theme:
        description: "{{ portal_theme.description if portal_theme.description is not none else omit }}"
        id: "{{ portal_theme.id if portal_theme.id is not none else omit }}"
        ise_client_cert: "{{ portal_theme.ise_client_cert if portal_theme.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ portal_theme.ise_client_key if portal_theme.ise_client_key is not none else omit }}"
        ise_debug: "{{ portal_theme.ise_debug if portal_theme.ise_debug is not none else omit }}"
        ise_hostname: "{{ portal_theme.ise_hostname if portal_theme.ise_hostname is not none else omit }}"
        ise_password: "{{ portal_theme.ise_password if portal_theme.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ portal_theme.ise_single_request_timeout if portal_theme.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ portal_theme.ise_username if portal_theme.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ portal_theme.ise_uses_api_gateway if portal_theme.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ portal_theme.ise_uses_csrf_token if portal_theme.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ portal_theme.ise_verify if portal_theme.ise_verify is not none else omit }}"
        ise_version: "{{ portal_theme.ise_version if portal_theme.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ portal_theme.ise_wait_on_rate_limit if portal_theme.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ portal_theme.name if portal_theme.name is not none else omit }}"
        themeData: "{{ portal_theme.themeData if portal_theme.themeData is not none else omit }}"
      register: portal_theme_result
      tags:
        - never
        - portal_theme
