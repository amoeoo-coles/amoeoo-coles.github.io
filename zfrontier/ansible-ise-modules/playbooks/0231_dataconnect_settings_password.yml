---
# Sample playbook for cisco.ise.dataconnect_settings_password (cisco.ise 3.3.0)
# Build order: 231
# Resource module for Dataconnect Settings Password
# Reads ../models/dataconnect_settings_password.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/dataconnect_settings_password_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dataconnect_settings_password.

- name: "0231 dataconnect_settings_password"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dataconnect_settings_password.yml
  tasks:
    - name: Run dataconnect_settings_password from its model
      cisco.ise.dataconnect_settings_password:
        ise_client_cert: "{{ dataconnect_settings_password.ise_client_cert if dataconnect_settings_password.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ dataconnect_settings_password.ise_client_key if dataconnect_settings_password.ise_client_key is not none else omit }}"
        ise_debug: "{{ dataconnect_settings_password.ise_debug if dataconnect_settings_password.ise_debug is not none else omit }}"
        ise_hostname: "{{ dataconnect_settings_password.ise_hostname if dataconnect_settings_password.ise_hostname is not none else omit }}"
        ise_password: "{{ dataconnect_settings_password.ise_password if dataconnect_settings_password.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ dataconnect_settings_password.ise_single_request_timeout if dataconnect_settings_password.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ dataconnect_settings_password.ise_username if dataconnect_settings_password.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ dataconnect_settings_password.ise_uses_api_gateway if dataconnect_settings_password.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ dataconnect_settings_password.ise_uses_csrf_token if dataconnect_settings_password.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ dataconnect_settings_password.ise_verify if dataconnect_settings_password.ise_verify is not none else omit }}"
        ise_version: "{{ dataconnect_settings_password.ise_version if dataconnect_settings_password.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ dataconnect_settings_password.ise_wait_on_rate_limit if dataconnect_settings_password.ise_wait_on_rate_limit is not none else omit }}"
        password: "{{ dataconnect_settings_password.password if dataconnect_settings_password.password is not none else omit }}"
      register: dataconnect_settings_password_result
      tags:
        - never
        - dataconnect_settings_password
