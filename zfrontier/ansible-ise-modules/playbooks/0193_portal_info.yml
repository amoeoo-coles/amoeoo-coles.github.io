---
# Sample playbook for cisco.ise.portal_info (cisco.ise 3.3.0)
# Build order: 193
# Information module for Portal
# Reads ../models/portal_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/portal_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0193 portal_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/portal_info.yml
  tasks:
    - name: Run portal_info from its model
      cisco.ise.portal_info:
        filter: "{{ portal_info.filter if portal_info.filter is not none else omit }}"
        filterType: "{{ portal_info.filterType if portal_info.filterType is not none else omit }}"
        id: "{{ portal_info.id if portal_info.id is not none else omit }}"
        ise_client_cert: "{{ portal_info.ise_client_cert if portal_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ portal_info.ise_client_key if portal_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ portal_info.ise_debug if portal_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ portal_info.ise_hostname if portal_info.ise_hostname is not none else omit }}"
        ise_password: "{{ portal_info.ise_password if portal_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ portal_info.ise_single_request_timeout if portal_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ portal_info.ise_username if portal_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ portal_info.ise_uses_api_gateway if portal_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ portal_info.ise_uses_csrf_token if portal_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ portal_info.ise_verify if portal_info.ise_verify is not none else omit }}"
        ise_version: "{{ portal_info.ise_version if portal_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ portal_info.ise_wait_on_rate_limit if portal_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ portal_info.name if portal_info.name is not none else omit }}"
        page: "{{ portal_info.page if portal_info.page is not none else omit }}"
        size: "{{ portal_info.size if portal_info.size is not none else omit }}"
        sortasc: "{{ portal_info.sortasc if portal_info.sortasc is not none else omit }}"
        sortdsc: "{{ portal_info.sortdsc if portal_info.sortdsc is not none else omit }}"
      register: portal_info_result
