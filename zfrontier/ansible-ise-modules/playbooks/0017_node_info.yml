---
# Sample playbook for cisco.ise.node_info (cisco.ise 3.3.0)
# Build order: 17
# Information module for Node
# Reads ../models/node_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/node_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0017 node_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/node_info.yml
  tasks:
    - name: Run node_info from its model
      cisco.ise.node_info:
        filter: "{{ node_info.filter if node_info.filter is not none else omit }}"
        filterType: "{{ node_info.filterType if node_info.filterType is not none else omit }}"
        id: "{{ node_info.id if node_info.id is not none else omit }}"
        ise_client_cert: "{{ node_info.ise_client_cert if node_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ node_info.ise_client_key if node_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ node_info.ise_debug if node_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ node_info.ise_hostname if node_info.ise_hostname is not none else omit }}"
        ise_password: "{{ node_info.ise_password if node_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ node_info.ise_single_request_timeout if node_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ node_info.ise_username if node_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ node_info.ise_uses_api_gateway if node_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ node_info.ise_uses_csrf_token if node_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ node_info.ise_verify if node_info.ise_verify is not none else omit }}"
        ise_version: "{{ node_info.ise_version if node_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ node_info.ise_wait_on_rate_limit if node_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ node_info.name if node_info.name is not none else omit }}"
        page: "{{ node_info.page if node_info.page is not none else omit }}"
        size: "{{ node_info.size if node_info.size is not none else omit }}"
      register: node_info_result
