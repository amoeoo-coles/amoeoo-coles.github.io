---
# Sample playbook for cisco.ise.backup_last_status_info (cisco.ise 3.3.0)
# Build order: 43
# Information module for Backup Last Status
# Reads ../models/backup_last_status_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/backup_last_status_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0043 backup_last_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backup_last_status_info.yml
  tasks:
    - name: Run backup_last_status_info from its model
      cisco.ise.backup_last_status_info:
        ise_client_cert: "{{ backup_last_status_info.ise_client_cert if backup_last_status_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ backup_last_status_info.ise_client_key if backup_last_status_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ backup_last_status_info.ise_debug if backup_last_status_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ backup_last_status_info.ise_hostname if backup_last_status_info.ise_hostname is not none else omit }}"
        ise_password: "{{ backup_last_status_info.ise_password if backup_last_status_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ backup_last_status_info.ise_single_request_timeout if backup_last_status_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ backup_last_status_info.ise_username if backup_last_status_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ backup_last_status_info.ise_uses_api_gateway if backup_last_status_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ backup_last_status_info.ise_uses_csrf_token if backup_last_status_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ backup_last_status_info.ise_verify if backup_last_status_info.ise_verify is not none else omit }}"
        ise_version: "{{ backup_last_status_info.ise_version if backup_last_status_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ backup_last_status_info.ise_wait_on_rate_limit if backup_last_status_info.ise_wait_on_rate_limit is not none else omit }}"
      register: backup_last_status_info_result
