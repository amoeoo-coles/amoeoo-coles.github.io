---
# Sample playbook for cisco.ise.node_group_info (cisco.ise 3.3.0)
# Build order: 13
# Information module for Node Group
# Reads ../models/node_group_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/node_group_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0013 node_group_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/node_group_info.yml
  tasks:
    - name: Run node_group_info from its model
      cisco.ise.node_group_info:
        ise_client_cert: "{{ node_group_info.ise_client_cert if node_group_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ node_group_info.ise_client_key if node_group_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ node_group_info.ise_debug if node_group_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ node_group_info.ise_hostname if node_group_info.ise_hostname is not none else omit }}"
        ise_password: "{{ node_group_info.ise_password if node_group_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ node_group_info.ise_single_request_timeout if node_group_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ node_group_info.ise_username if node_group_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ node_group_info.ise_uses_api_gateway if node_group_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ node_group_info.ise_uses_csrf_token if node_group_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ node_group_info.ise_verify if node_group_info.ise_verify is not none else omit }}"
        ise_version: "{{ node_group_info.ise_version if node_group_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ node_group_info.ise_wait_on_rate_limit if node_group_info.ise_wait_on_rate_limit is not none else omit }}"
        nodeGroupName: "{{ node_group_info.nodeGroupName if node_group_info.nodeGroupName is not none else omit }}"
      register: node_group_info_result
