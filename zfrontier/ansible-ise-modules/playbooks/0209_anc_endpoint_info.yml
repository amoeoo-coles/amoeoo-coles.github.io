---
# Sample playbook for cisco.ise.anc_endpoint_info (cisco.ise 3.3.0)
# Build order: 209
# Information module for ANCendpoint
# Reads ../models/anc_endpoint_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/anc_endpoint_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0209 anc_endpoint_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/anc_endpoint_info.yml
  tasks:
    - name: Run anc_endpoint_info from its model
      cisco.ise.anc_endpoint_info:
        filter: "{{ anc_endpoint_info.filter if anc_endpoint_info.filter is not none else omit }}"
        filterType: "{{ anc_endpoint_info.filterType if anc_endpoint_info.filterType is not none else omit }}"
        id: "{{ anc_endpoint_info.id if anc_endpoint_info.id is not none else omit }}"
        ise_client_cert: "{{ anc_endpoint_info.ise_client_cert if anc_endpoint_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ anc_endpoint_info.ise_client_key if anc_endpoint_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ anc_endpoint_info.ise_debug if anc_endpoint_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ anc_endpoint_info.ise_hostname if anc_endpoint_info.ise_hostname is not none else omit }}"
        ise_password: "{{ anc_endpoint_info.ise_password if anc_endpoint_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ anc_endpoint_info.ise_single_request_timeout if anc_endpoint_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ anc_endpoint_info.ise_username if anc_endpoint_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ anc_endpoint_info.ise_uses_api_gateway if anc_endpoint_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ anc_endpoint_info.ise_uses_csrf_token if anc_endpoint_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ anc_endpoint_info.ise_verify if anc_endpoint_info.ise_verify is not none else omit }}"
        ise_version: "{{ anc_endpoint_info.ise_version if anc_endpoint_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ anc_endpoint_info.ise_wait_on_rate_limit if anc_endpoint_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ anc_endpoint_info.name if anc_endpoint_info.name is not none else omit }}"
        page: "{{ anc_endpoint_info.page if anc_endpoint_info.page is not none else omit }}"
        size: "{{ anc_endpoint_info.size if anc_endpoint_info.size is not none else omit }}"
        sortasc: "{{ anc_endpoint_info.sortasc if anc_endpoint_info.sortasc is not none else omit }}"
        sortdsc: "{{ anc_endpoint_info.sortdsc if anc_endpoint_info.sortdsc is not none else omit }}"
      register: anc_endpoint_info_result
