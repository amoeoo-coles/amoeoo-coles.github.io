---
# Sample playbook for cisco.ise.hotspot_portal_info (cisco.ise 3.3.0)
# Build order: 199
# Information module for Hotspotportal
# Reads ../models/hotspot_portal_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/hotspot_portal_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0199 hotspot_portal_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/hotspot_portal_info.yml
  tasks:
    - name: Run hotspot_portal_info from its model
      cisco.ise.hotspot_portal_info:
        filter: "{{ hotspot_portal_info.filter if hotspot_portal_info.filter is not none else omit }}"
        filterType: "{{ hotspot_portal_info.filterType if hotspot_portal_info.filterType is not none else omit }}"
        id: "{{ hotspot_portal_info.id if hotspot_portal_info.id is not none else omit }}"
        ise_client_cert: "{{ hotspot_portal_info.ise_client_cert if hotspot_portal_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ hotspot_portal_info.ise_client_key if hotspot_portal_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ hotspot_portal_info.ise_debug if hotspot_portal_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ hotspot_portal_info.ise_hostname if hotspot_portal_info.ise_hostname is not none else omit }}"
        ise_password: "{{ hotspot_portal_info.ise_password if hotspot_portal_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ hotspot_portal_info.ise_single_request_timeout if hotspot_portal_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ hotspot_portal_info.ise_username if hotspot_portal_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ hotspot_portal_info.ise_uses_api_gateway if hotspot_portal_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ hotspot_portal_info.ise_uses_csrf_token if hotspot_portal_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ hotspot_portal_info.ise_verify if hotspot_portal_info.ise_verify is not none else omit }}"
        ise_version: "{{ hotspot_portal_info.ise_version if hotspot_portal_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ hotspot_portal_info.ise_wait_on_rate_limit if hotspot_portal_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ hotspot_portal_info.name if hotspot_portal_info.name is not none else omit }}"
        page: "{{ hotspot_portal_info.page if hotspot_portal_info.page is not none else omit }}"
        size: "{{ hotspot_portal_info.size if hotspot_portal_info.size is not none else omit }}"
        sortasc: "{{ hotspot_portal_info.sortasc if hotspot_portal_info.sortasc is not none else omit }}"
        sortdsc: "{{ hotspot_portal_info.sortdsc if hotspot_portal_info.sortdsc is not none else omit }}"
      register: hotspot_portal_info_result
