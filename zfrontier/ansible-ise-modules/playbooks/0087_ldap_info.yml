---
# Sample playbook for cisco.ise.ldap_info (cisco.ise 3.3.0)
# Build order: 87
# Information module for Ldap
# Reads ../models/ldap_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ldap_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0087 ldap_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ldap_info.yml
  tasks:
    - name: Run ldap_info from its model
      cisco.ise.ldap_info:
        filterType: "{{ ldap_info.filterType if ldap_info.filterType is not none else omit }}"
        ise_client_cert: "{{ ldap_info.ise_client_cert if ldap_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ ldap_info.ise_client_key if ldap_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ ldap_info.ise_debug if ldap_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ ldap_info.ise_hostname if ldap_info.ise_hostname is not none else omit }}"
        ise_password: "{{ ldap_info.ise_password if ldap_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ ldap_info.ise_single_request_timeout if ldap_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ ldap_info.ise_username if ldap_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ ldap_info.ise_uses_api_gateway if ldap_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ ldap_info.ise_uses_csrf_token if ldap_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ ldap_info.ise_verify if ldap_info.ise_verify is not none else omit }}"
        ise_version: "{{ ldap_info.ise_version if ldap_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ ldap_info.ise_wait_on_rate_limit if ldap_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ ldap_info.page if ldap_info.page is not none else omit }}"
        size: "{{ ldap_info.size if ldap_info.size is not none else omit }}"
      register: ldap_info_result
