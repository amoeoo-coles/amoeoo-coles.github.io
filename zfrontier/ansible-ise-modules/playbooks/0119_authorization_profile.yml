---
# Sample playbook for cisco.ise.authorization_profile (cisco.ise 3.3.0)
# Build order: 119
# Resource module for Authorizationprofile
# Reads ../models/authorization_profile.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/authorization_profile_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags authorization_profile.

- name: "0119 authorization_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/authorization_profile.yml
  tasks:
    - name: Run authorization_profile from its model
      cisco.ise.authorization_profile:
        accessType: "{{ authorization_profile.accessType if authorization_profile.accessType is not none else omit }}"
        acl: "{{ authorization_profile.acl if authorization_profile.acl is not none else omit }}"
        advancedAttributes: "{{ (authorization_profile.advancedAttributes | cat_strip_nulls) if (authorization_profile.advancedAttributes | cat_strip_nulls) is not none else omit }}"
        agentlessPosture: "{{ authorization_profile.agentlessPosture if authorization_profile.agentlessPosture is not none else omit }}"
        airespaceACL: "{{ authorization_profile.airespaceACL if authorization_profile.airespaceACL is not none else omit }}"
        airespaceIPv6ACL: "{{ authorization_profile.airespaceIPv6ACL if authorization_profile.airespaceIPv6ACL is not none else omit }}"
        asaVpn: "{{ authorization_profile.asaVpn if authorization_profile.asaVpn is not none else omit }}"
        authzProfileType: "{{ authorization_profile.authzProfileType if authorization_profile.authzProfileType is not none else omit }}"
        autoSmartPort: "{{ authorization_profile.autoSmartPort if authorization_profile.autoSmartPort is not none else omit }}"
        avcProfile: "{{ authorization_profile.avcProfile if authorization_profile.avcProfile is not none else omit }}"
        daclName: "{{ authorization_profile.daclName if authorization_profile.daclName is not none else omit }}"
        description: "{{ authorization_profile.description if authorization_profile.description is not none else omit }}"
        easywiredSessionCandidate: "{{ authorization_profile.easywiredSessionCandidate if authorization_profile.easywiredSessionCandidate is not none else omit }}"
        id: "{{ authorization_profile.id if authorization_profile.id is not none else omit }}"
        interfaceTemplate: "{{ authorization_profile.interfaceTemplate if authorization_profile.interfaceTemplate is not none else omit }}"
        ipv6ACLFilter: "{{ authorization_profile.ipv6ACLFilter if authorization_profile.ipv6ACLFilter is not none else omit }}"
        ipv6DaclName: "{{ authorization_profile.ipv6DaclName if authorization_profile.ipv6DaclName is not none else omit }}"
        ise_client_cert: "{{ authorization_profile.ise_client_cert if authorization_profile.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ authorization_profile.ise_client_key if authorization_profile.ise_client_key is not none else omit }}"
        ise_debug: "{{ authorization_profile.ise_debug if authorization_profile.ise_debug is not none else omit }}"
        ise_hostname: "{{ authorization_profile.ise_hostname if authorization_profile.ise_hostname is not none else omit }}"
        ise_password: "{{ authorization_profile.ise_password if authorization_profile.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ authorization_profile.ise_single_request_timeout if authorization_profile.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ authorization_profile.ise_username if authorization_profile.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ authorization_profile.ise_uses_api_gateway if authorization_profile.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ authorization_profile.ise_uses_csrf_token if authorization_profile.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ authorization_profile.ise_verify if authorization_profile.ise_verify is not none else omit }}"
        ise_version: "{{ authorization_profile.ise_version if authorization_profile.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ authorization_profile.ise_wait_on_rate_limit if authorization_profile.ise_wait_on_rate_limit is not none else omit }}"
        macSecPolicy: "{{ authorization_profile.macSecPolicy if authorization_profile.macSecPolicy is not none else omit }}"
        name: "{{ authorization_profile.name if authorization_profile.name is not none else omit }}"
        neat: "{{ authorization_profile.neat if authorization_profile.neat is not none else omit }}"
        profileName: "{{ authorization_profile.profileName if authorization_profile.profileName is not none else omit }}"
        reauth: "{{ (authorization_profile.reauth | cat_strip_nulls) if (authorization_profile.reauth | cat_strip_nulls) is not none else omit }}"
        serviceTemplate: "{{ authorization_profile.serviceTemplate if authorization_profile.serviceTemplate is not none else omit }}"
        trackMovement: "{{ authorization_profile.trackMovement if authorization_profile.trackMovement is not none else omit }}"
        uniqueIdentifier: "{{ authorization_profile.uniqueIdentifier if authorization_profile.uniqueIdentifier is not none else omit }}"
        vlan: "{{ (authorization_profile.vlan | cat_strip_nulls) if (authorization_profile.vlan | cat_strip_nulls) is not none else omit }}"
        voiceDomainPermission: "{{ authorization_profile.voiceDomainPermission if authorization_profile.voiceDomainPermission is not none else omit }}"
        webAuth: "{{ authorization_profile.webAuth if authorization_profile.webAuth is not none else omit }}"
        webRedirection: "{{ (authorization_profile.webRedirection | cat_strip_nulls) if (authorization_profile.webRedirection | cat_strip_nulls) is not none else omit }}"
      register: authorization_profile_result
      tags:
        - never
        - authorization_profile
