---
# Sample playbook for cisco.ise.allowed_protocols_info (cisco.ise 3.3.0)
# Build order: 118
# Information module for Allowedprotocols
# Reads ../models/allowed_protocols_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/allowed_protocols_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0118 allowed_protocols_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/allowed_protocols_info.yml
  tasks:
    - name: Run allowed_protocols_info from its model
      cisco.ise.allowed_protocols_info:
        filterType: "{{ allowed_protocols_info.filterType if allowed_protocols_info.filterType is not none else omit }}"
        ise_client_cert: "{{ allowed_protocols_info.ise_client_cert if allowed_protocols_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ allowed_protocols_info.ise_client_key if allowed_protocols_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ allowed_protocols_info.ise_debug if allowed_protocols_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ allowed_protocols_info.ise_hostname if allowed_protocols_info.ise_hostname is not none else omit }}"
        ise_password: "{{ allowed_protocols_info.ise_password if allowed_protocols_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ allowed_protocols_info.ise_single_request_timeout if allowed_protocols_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ allowed_protocols_info.ise_username if allowed_protocols_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ allowed_protocols_info.ise_uses_api_gateway if allowed_protocols_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ allowed_protocols_info.ise_uses_csrf_token if allowed_protocols_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ allowed_protocols_info.ise_verify if allowed_protocols_info.ise_verify is not none else omit }}"
        ise_version: "{{ allowed_protocols_info.ise_version if allowed_protocols_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ allowed_protocols_info.ise_wait_on_rate_limit if allowed_protocols_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ allowed_protocols_info.page if allowed_protocols_info.page is not none else omit }}"
        size: "{{ allowed_protocols_info.size if allowed_protocols_info.size is not none else omit }}"
      register: allowed_protocols_info_result
