---
# Sample playbook for cisco.ise.px_grid_direct_test_connector (cisco.ise 3.3.0)
# Build order: 217
# Resource module for Px Grid Direct Test Connector
# Reads ../models/px_grid_direct_test_connector.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/px_grid_direct_test_connector_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags px_grid_direct_test_connector.

- name: "0217 px_grid_direct_test_connector"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/px_grid_direct_test_connector.yml
  tasks:
    - name: Run px_grid_direct_test_connector from its model
      cisco.ise.px_grid_direct_test_connector:
        authType: "{{ px_grid_direct_test_connector.authType if px_grid_direct_test_connector.authType is not none else omit }}"
        authValues: "{{ (px_grid_direct_test_connector.authValues | cat_strip_nulls) if (px_grid_direct_test_connector.authValues | cat_strip_nulls) is not none else omit }}"
        connectorName: "{{ px_grid_direct_test_connector.connectorName if px_grid_direct_test_connector.connectorName is not none else omit }}"
        flexibleUrl: "{{ (px_grid_direct_test_connector.flexibleUrl | cat_strip_nulls) if (px_grid_direct_test_connector.flexibleUrl | cat_strip_nulls) is not none else omit }}"
        incrementalUrl: "{{ px_grid_direct_test_connector.incrementalUrl if px_grid_direct_test_connector.incrementalUrl is not none else omit }}"
        ise_client_cert: "{{ px_grid_direct_test_connector.ise_client_cert if px_grid_direct_test_connector.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ px_grid_direct_test_connector.ise_client_key if px_grid_direct_test_connector.ise_client_key is not none else omit }}"
        ise_debug: "{{ px_grid_direct_test_connector.ise_debug if px_grid_direct_test_connector.ise_debug is not none else omit }}"
        ise_hostname: "{{ px_grid_direct_test_connector.ise_hostname if px_grid_direct_test_connector.ise_hostname is not none else omit }}"
        ise_password: "{{ px_grid_direct_test_connector.ise_password if px_grid_direct_test_connector.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ px_grid_direct_test_connector.ise_single_request_timeout if px_grid_direct_test_connector.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ px_grid_direct_test_connector.ise_username if px_grid_direct_test_connector.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ px_grid_direct_test_connector.ise_uses_api_gateway if px_grid_direct_test_connector.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ px_grid_direct_test_connector.ise_uses_csrf_token if px_grid_direct_test_connector.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ px_grid_direct_test_connector.ise_verify if px_grid_direct_test_connector.ise_verify is not none else omit }}"
        ise_version: "{{ px_grid_direct_test_connector.ise_version if px_grid_direct_test_connector.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ px_grid_direct_test_connector.ise_wait_on_rate_limit if px_grid_direct_test_connector.ise_wait_on_rate_limit is not none else omit }}"
        responseParsing: "{{ px_grid_direct_test_connector.responseParsing if px_grid_direct_test_connector.responseParsing is not none else omit }}"
        skipCertificateValidations: "{{ px_grid_direct_test_connector.skipCertificateValidations if px_grid_direct_test_connector.skipCertificateValidations is not none else omit }}"
        uniqueID: "{{ px_grid_direct_test_connector.uniqueID if px_grid_direct_test_connector.uniqueID is not none else omit }}"
        url: "{{ px_grid_direct_test_connector.url if px_grid_direct_test_connector.url is not none else omit }}"
      register: px_grid_direct_test_connector_result
      tags:
        - never
        - px_grid_direct_test_connector
