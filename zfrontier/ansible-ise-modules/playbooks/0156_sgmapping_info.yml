---
# Sample playbook for cisco.ise.sgmapping_info (cisco.ise 3.3.0)
# Build order: 156
# Information module for SGmapping
# Reads ../models/sgmapping_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgmapping_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0156 sgmapping_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgmapping_info.yml
  tasks:
    - name: Run sgmapping_info from its model
      cisco.ise.sgmapping_info:
        filter: "{{ sgmapping_info.filter if sgmapping_info.filter is not none else omit }}"
        filterType: "{{ sgmapping_info.filterType if sgmapping_info.filterType is not none else omit }}"
        id: "{{ sgmapping_info.id if sgmapping_info.id is not none else omit }}"
        ise_client_cert: "{{ sgmapping_info.ise_client_cert if sgmapping_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgmapping_info.ise_client_key if sgmapping_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgmapping_info.ise_debug if sgmapping_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgmapping_info.ise_hostname if sgmapping_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sgmapping_info.ise_password if sgmapping_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgmapping_info.ise_single_request_timeout if sgmapping_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgmapping_info.ise_username if sgmapping_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgmapping_info.ise_uses_api_gateway if sgmapping_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgmapping_info.ise_uses_csrf_token if sgmapping_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgmapping_info.ise_verify if sgmapping_info.ise_verify is not none else omit }}"
        ise_version: "{{ sgmapping_info.ise_version if sgmapping_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgmapping_info.ise_wait_on_rate_limit if sgmapping_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgmapping_info.name if sgmapping_info.name is not none else omit }}"
        page: "{{ sgmapping_info.page if sgmapping_info.page is not none else omit }}"
        size: "{{ sgmapping_info.size if sgmapping_info.size is not none else omit }}"
        sortasc: "{{ sgmapping_info.sortasc if sgmapping_info.sortasc is not none else omit }}"
        sortdsc: "{{ sgmapping_info.sortdsc if sgmapping_info.sortdsc is not none else omit }}"
      register: sgmapping_info_result
