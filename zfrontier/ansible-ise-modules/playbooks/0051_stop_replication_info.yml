---
# Sample playbook for cisco.ise.stop_replication_info (cisco.ise 3.3.0)
# Build order: 51
# Information module for Stop Replication Info
# Reads ../models/stop_replication_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/stop_replication_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0051 stop_replication_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/stop_replication_info.yml
  tasks:
    - name: Run stop_replication_info from its model
      cisco.ise.stop_replication_info:
        ise_client_cert: "{{ stop_replication_info.ise_client_cert if stop_replication_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ stop_replication_info.ise_client_key if stop_replication_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ stop_replication_info.ise_debug if stop_replication_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ stop_replication_info.ise_hostname if stop_replication_info.ise_hostname is not none else omit }}"
        ise_password: "{{ stop_replication_info.ise_password if stop_replication_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ stop_replication_info.ise_single_request_timeout if stop_replication_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ stop_replication_info.ise_username if stop_replication_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ stop_replication_info.ise_uses_api_gateway if stop_replication_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ stop_replication_info.ise_uses_csrf_token if stop_replication_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ stop_replication_info.ise_verify if stop_replication_info.ise_verify is not none else omit }}"
        ise_version: "{{ stop_replication_info.ise_version if stop_replication_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ stop_replication_info.ise_wait_on_rate_limit if stop_replication_info.ise_wait_on_rate_limit is not none else omit }}"
      register: stop_replication_info_result
