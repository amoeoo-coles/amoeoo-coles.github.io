---
# Sample playbook for cisco.ise.trustsec_vn_info (cisco.ise 3.3.0)
# Build order: 173
# Information module for Trustsec VN
# Reads ../models/trustsec_vn_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/trustsec_vn_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0173 trustsec_vn_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/trustsec_vn_info.yml
  tasks:
    - name: Run trustsec_vn_info from its model
      cisco.ise.trustsec_vn_info:
        filter: "{{ trustsec_vn_info.filter if trustsec_vn_info.filter is not none else omit }}"
        filterType: "{{ trustsec_vn_info.filterType if trustsec_vn_info.filterType is not none else omit }}"
        id: "{{ trustsec_vn_info.id if trustsec_vn_info.id is not none else omit }}"
        ise_client_cert: "{{ trustsec_vn_info.ise_client_cert if trustsec_vn_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ trustsec_vn_info.ise_client_key if trustsec_vn_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ trustsec_vn_info.ise_debug if trustsec_vn_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ trustsec_vn_info.ise_hostname if trustsec_vn_info.ise_hostname is not none else omit }}"
        ise_password: "{{ trustsec_vn_info.ise_password if trustsec_vn_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ trustsec_vn_info.ise_single_request_timeout if trustsec_vn_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ trustsec_vn_info.ise_username if trustsec_vn_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ trustsec_vn_info.ise_uses_api_gateway if trustsec_vn_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ trustsec_vn_info.ise_uses_csrf_token if trustsec_vn_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ trustsec_vn_info.ise_verify if trustsec_vn_info.ise_verify is not none else omit }}"
        ise_version: "{{ trustsec_vn_info.ise_version if trustsec_vn_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ trustsec_vn_info.ise_wait_on_rate_limit if trustsec_vn_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ trustsec_vn_info.page if trustsec_vn_info.page is not none else omit }}"
        size: "{{ trustsec_vn_info.size if trustsec_vn_info.size is not none else omit }}"
        sort: "{{ trustsec_vn_info.sort if trustsec_vn_info.sort is not none else omit }}"
        sortBy: "{{ trustsec_vn_info.sortBy if trustsec_vn_info.sortBy is not none else omit }}"
      register: trustsec_vn_info_result
