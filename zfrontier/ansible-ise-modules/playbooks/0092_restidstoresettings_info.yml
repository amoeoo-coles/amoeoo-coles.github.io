---
# Sample playbook for cisco.ise.restidstoresettings_info (cisco.ise 3.3.0)
# Build order: 92
# Information module for RESTidstoresettings
# Reads ../models/restidstoresettings_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/restidstoresettings_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0092 restidstoresettings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/restidstoresettings_info.yml
  tasks:
    - name: Run restidstoresettings_info from its model
      cisco.ise.restidstoresettings_info:
        ise_client_cert: "{{ restidstoresettings_info.ise_client_cert if restidstoresettings_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ restidstoresettings_info.ise_client_key if restidstoresettings_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ restidstoresettings_info.ise_debug if restidstoresettings_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ restidstoresettings_info.ise_hostname if restidstoresettings_info.ise_hostname is not none else omit }}"
        ise_password: "{{ restidstoresettings_info.ise_password if restidstoresettings_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ restidstoresettings_info.ise_single_request_timeout if restidstoresettings_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ restidstoresettings_info.ise_username if restidstoresettings_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ restidstoresettings_info.ise_uses_api_gateway if restidstoresettings_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ restidstoresettings_info.ise_uses_csrf_token if restidstoresettings_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ restidstoresettings_info.ise_verify if restidstoresettings_info.ise_verify is not none else omit }}"
        ise_version: "{{ restidstoresettings_info.ise_version if restidstoresettings_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ restidstoresettings_info.ise_wait_on_rate_limit if restidstoresettings_info.ise_wait_on_rate_limit is not none else omit }}"
      register: restidstoresettings_info_result
