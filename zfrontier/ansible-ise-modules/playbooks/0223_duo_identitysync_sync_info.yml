---
# Sample playbook for cisco.ise.duo_identitysync_sync_info (cisco.ise 3.3.0)
# Build order: 223
# Information module for Duo Identitysync Sync Info
# Reads ../models/duo_identitysync_sync_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/duo_identitysync_sync_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0223 duo_identitysync_sync_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/duo_identitysync_sync_info.yml
  tasks:
    - name: Run duo_identitysync_sync_info from its model
      cisco.ise.duo_identitysync_sync_info:
        ise_client_cert: "{{ duo_identitysync_sync_info.ise_client_cert if duo_identitysync_sync_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ duo_identitysync_sync_info.ise_client_key if duo_identitysync_sync_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ duo_identitysync_sync_info.ise_debug if duo_identitysync_sync_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ duo_identitysync_sync_info.ise_hostname if duo_identitysync_sync_info.ise_hostname is not none else omit }}"
        ise_password: "{{ duo_identitysync_sync_info.ise_password if duo_identitysync_sync_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ duo_identitysync_sync_info.ise_single_request_timeout if duo_identitysync_sync_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ duo_identitysync_sync_info.ise_username if duo_identitysync_sync_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ duo_identitysync_sync_info.ise_uses_api_gateway if duo_identitysync_sync_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ duo_identitysync_sync_info.ise_uses_csrf_token if duo_identitysync_sync_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ duo_identitysync_sync_info.ise_verify if duo_identitysync_sync_info.ise_verify is not none else omit }}"
        ise_version: "{{ duo_identitysync_sync_info.ise_version if duo_identitysync_sync_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ duo_identitysync_sync_info.ise_wait_on_rate_limit if duo_identitysync_sync_info.ise_wait_on_rate_limit is not none else omit }}"
        syncName: "{{ duo_identitysync_sync_info.syncName if duo_identitysync_sync_info.syncName is not none else omit }}"
      register: duo_identitysync_sync_info_result
