---
# Sample playbook for cisco.ise.sgtvnvlan_info (cisco.ise 3.3.0)
# Build order: 160
# Information module for SGtvnvlan
# Reads ../models/sgtvnvlan_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgtvnvlan_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0160 sgtvnvlan_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgtvnvlan_info.yml
  tasks:
    - name: Run sgtvnvlan_info from its model
      cisco.ise.sgtvnvlan_info:
        filter: "{{ sgtvnvlan_info.filter if sgtvnvlan_info.filter is not none else omit }}"
        filterType: "{{ sgtvnvlan_info.filterType if sgtvnvlan_info.filterType is not none else omit }}"
        id: "{{ sgtvnvlan_info.id if sgtvnvlan_info.id is not none else omit }}"
        ise_client_cert: "{{ sgtvnvlan_info.ise_client_cert if sgtvnvlan_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgtvnvlan_info.ise_client_key if sgtvnvlan_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgtvnvlan_info.ise_debug if sgtvnvlan_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgtvnvlan_info.ise_hostname if sgtvnvlan_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sgtvnvlan_info.ise_password if sgtvnvlan_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgtvnvlan_info.ise_single_request_timeout if sgtvnvlan_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgtvnvlan_info.ise_username if sgtvnvlan_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgtvnvlan_info.ise_uses_api_gateway if sgtvnvlan_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgtvnvlan_info.ise_uses_csrf_token if sgtvnvlan_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgtvnvlan_info.ise_verify if sgtvnvlan_info.ise_verify is not none else omit }}"
        ise_version: "{{ sgtvnvlan_info.ise_version if sgtvnvlan_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgtvnvlan_info.ise_wait_on_rate_limit if sgtvnvlan_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgtvnvlan_info.name if sgtvnvlan_info.name is not none else omit }}"
        page: "{{ sgtvnvlan_info.page if sgtvnvlan_info.page is not none else omit }}"
        size: "{{ sgtvnvlan_info.size if sgtvnvlan_info.size is not none else omit }}"
      register: sgtvnvlan_info_result
