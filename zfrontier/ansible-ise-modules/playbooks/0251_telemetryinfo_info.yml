---
# Sample playbook for cisco.ise.telemetryinfo_info (cisco.ise 3.3.0)
# Build order: 251
# Information module for Telemetryinfo
# Reads ../models/telemetryinfo_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/telemetryinfo_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0251 telemetryinfo_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/telemetryinfo_info.yml
  tasks:
    - name: Run telemetryinfo_info from its model
      cisco.ise.telemetryinfo_info:
        filter: "{{ telemetryinfo_info.filter if telemetryinfo_info.filter is not none else omit }}"
        filterType: "{{ telemetryinfo_info.filterType if telemetryinfo_info.filterType is not none else omit }}"
        id: "{{ telemetryinfo_info.id if telemetryinfo_info.id is not none else omit }}"
        ise_client_cert: "{{ telemetryinfo_info.ise_client_cert if telemetryinfo_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ telemetryinfo_info.ise_client_key if telemetryinfo_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ telemetryinfo_info.ise_debug if telemetryinfo_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ telemetryinfo_info.ise_hostname if telemetryinfo_info.ise_hostname is not none else omit }}"
        ise_password: "{{ telemetryinfo_info.ise_password if telemetryinfo_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ telemetryinfo_info.ise_single_request_timeout if telemetryinfo_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ telemetryinfo_info.ise_username if telemetryinfo_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ telemetryinfo_info.ise_uses_api_gateway if telemetryinfo_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ telemetryinfo_info.ise_uses_csrf_token if telemetryinfo_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ telemetryinfo_info.ise_verify if telemetryinfo_info.ise_verify is not none else omit }}"
        ise_version: "{{ telemetryinfo_info.ise_version if telemetryinfo_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ telemetryinfo_info.ise_wait_on_rate_limit if telemetryinfo_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ telemetryinfo_info.name if telemetryinfo_info.name is not none else omit }}"
        page: "{{ telemetryinfo_info.page if telemetryinfo_info.page is not none else omit }}"
        size: "{{ telemetryinfo_info.size if telemetryinfo_info.size is not none else omit }}"
      register: telemetryinfo_info_result
