---
# Sample playbook for cisco.ise.selfregportal_info (cisco.ise 3.3.0)
# Build order: 201
# Information module for Selfregportal
# Reads ../models/selfregportal_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/selfregportal_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0201 selfregportal_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/selfregportal_info.yml
  tasks:
    - name: Run selfregportal_info from its model
      cisco.ise.selfregportal_info:
        filter: "{{ selfregportal_info.filter if selfregportal_info.filter is not none else omit }}"
        filterType: "{{ selfregportal_info.filterType if selfregportal_info.filterType is not none else omit }}"
        id: "{{ selfregportal_info.id if selfregportal_info.id is not none else omit }}"
        ise_client_cert: "{{ selfregportal_info.ise_client_cert if selfregportal_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ selfregportal_info.ise_client_key if selfregportal_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ selfregportal_info.ise_debug if selfregportal_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ selfregportal_info.ise_hostname if selfregportal_info.ise_hostname is not none else omit }}"
        ise_password: "{{ selfregportal_info.ise_password if selfregportal_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ selfregportal_info.ise_single_request_timeout if selfregportal_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ selfregportal_info.ise_username if selfregportal_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ selfregportal_info.ise_uses_api_gateway if selfregportal_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ selfregportal_info.ise_uses_csrf_token if selfregportal_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ selfregportal_info.ise_verify if selfregportal_info.ise_verify is not none else omit }}"
        ise_version: "{{ selfregportal_info.ise_version if selfregportal_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ selfregportal_info.ise_wait_on_rate_limit if selfregportal_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ selfregportal_info.name if selfregportal_info.name is not none else omit }}"
        page: "{{ selfregportal_info.page if selfregportal_info.page is not none else omit }}"
        size: "{{ selfregportal_info.size if selfregportal_info.size is not none else omit }}"
        sortasc: "{{ selfregportal_info.sortasc if selfregportal_info.sortasc is not none else omit }}"
        sortdsc: "{{ selfregportal_info.sortdsc if selfregportal_info.sortdsc is not none else omit }}"
      register: selfregportal_info_result
