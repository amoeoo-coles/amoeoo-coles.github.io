---
# Sample playbook for cisco.ise.backup_schedule_config_update (cisco.ise 3.3.0)
# Build order: 46
# Resource module for Backup Schedule Config Update
# Reads ../models/backup_schedule_config_update.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/backup_schedule_config_update_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags backup_schedule_config_update.

- name: "0046 backup_schedule_config_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backup_schedule_config_update.yml
  tasks:
    - name: Run backup_schedule_config_update from its model
      cisco.ise.backup_schedule_config_update:
        backupDescription: "{{ backup_schedule_config_update.backupDescription if backup_schedule_config_update.backupDescription is not none else omit }}"
        backupEncryptionKey: "{{ backup_schedule_config_update.backupEncryptionKey if backup_schedule_config_update.backupEncryptionKey is not none else omit }}"
        backupName: "{{ backup_schedule_config_update.backupName if backup_schedule_config_update.backupName is not none else omit }}"
        endDate: "{{ backup_schedule_config_update.endDate if backup_schedule_config_update.endDate is not none else omit }}"
        frequency: "{{ backup_schedule_config_update.frequency if backup_schedule_config_update.frequency is not none else omit }}"
        ise_client_cert: "{{ backup_schedule_config_update.ise_client_cert if backup_schedule_config_update.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ backup_schedule_config_update.ise_client_key if backup_schedule_config_update.ise_client_key is not none else omit }}"
        ise_debug: "{{ backup_schedule_config_update.ise_debug if backup_schedule_config_update.ise_debug is not none else omit }}"
        ise_hostname: "{{ backup_schedule_config_update.ise_hostname if backup_schedule_config_update.ise_hostname is not none else omit }}"
        ise_password: "{{ backup_schedule_config_update.ise_password if backup_schedule_config_update.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ backup_schedule_config_update.ise_single_request_timeout if backup_schedule_config_update.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ backup_schedule_config_update.ise_username if backup_schedule_config_update.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ backup_schedule_config_update.ise_uses_api_gateway if backup_schedule_config_update.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ backup_schedule_config_update.ise_uses_csrf_token if backup_schedule_config_update.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ backup_schedule_config_update.ise_verify if backup_schedule_config_update.ise_verify is not none else omit }}"
        ise_version: "{{ backup_schedule_config_update.ise_version if backup_schedule_config_update.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ backup_schedule_config_update.ise_wait_on_rate_limit if backup_schedule_config_update.ise_wait_on_rate_limit is not none else omit }}"
        monthDay: "{{ backup_schedule_config_update.monthDay if backup_schedule_config_update.monthDay is not none else omit }}"
        repositoryName: "{{ backup_schedule_config_update.repositoryName if backup_schedule_config_update.repositoryName is not none else omit }}"
        startDate: "{{ backup_schedule_config_update.startDate if backup_schedule_config_update.startDate is not none else omit }}"
        status: "{{ backup_schedule_config_update.status if backup_schedule_config_update.status is not none else omit }}"
        time: "{{ backup_schedule_config_update.time if backup_schedule_config_update.time is not none else omit }}"
        weekDay: "{{ backup_schedule_config_update.weekDay if backup_schedule_config_update.weekDay is not none else omit }}"
      register: backup_schedule_config_update_result
      tags:
        - never
        - backup_schedule_config_update
