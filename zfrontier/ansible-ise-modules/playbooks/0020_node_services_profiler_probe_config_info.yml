        ise_password: "{{ node_services_profiler_probe_config_info.ise_password if node_services_profiler_probe_config_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ node_services_profiler_probe_config_info.ise_single_request_timeout if node_services_profiler_probe_config_info.ise_single_request_timeout is not none else omit }}"
