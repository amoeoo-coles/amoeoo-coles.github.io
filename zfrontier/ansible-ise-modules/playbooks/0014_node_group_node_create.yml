---
# Sample playbook for cisco.ise.node_group_node_create (cisco.ise 3.3.0)
# Build order: 14
# Resource module for Node Group Node Create
# Reads ../models/node_group_node_create.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/node_group_node_create_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags node_group_node_create.

- name: "0014 node_group_node_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/node_group_node_create.yml
  tasks:
    - name: Run node_group_node_create from its model
      cisco.ise.node_group_node_create:
        hostname: "{{ node_group_node_create.hostname if node_group_node_create.hostname is not none else omit }}"
        ise_client_cert: "{{ node_group_node_create.ise_client_cert if node_group_node_create.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ node_group_node_create.ise_client_key if node_group_node_create.ise_client_key is not none else omit }}"
        ise_debug: "{{ node_group_node_create.ise_debug if node_group_node_create.ise_debug is not none else omit }}"
        ise_hostname: "{{ node_group_node_create.ise_hostname if node_group_node_create.ise_hostname is not none else omit }}"
        ise_password: "{{ node_group_node_create.ise_password if node_group_node_create.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ node_group_node_create.ise_single_request_timeout if node_group_node_create.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ node_group_node_create.ise_username if node_group_node_create.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ node_group_node_create.ise_uses_api_gateway if node_group_node_create.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ node_group_node_create.ise_uses_csrf_token if node_group_node_create.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ node_group_node_create.ise_verify if node_group_node_create.ise_verify is not none else omit }}"
        ise_version: "{{ node_group_node_create.ise_version if node_group_node_create.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ node_group_node_create.ise_wait_on_rate_limit if node_group_node_create.ise_wait_on_rate_limit is not none else omit }}"
        nodeGroupName: "{{ node_group_node_create.nodeGroupName if node_group_node_create.nodeGroupName is not none else omit }}"
      register: node_group_node_create_result
      tags:
        - never
        - node_group_node_create
