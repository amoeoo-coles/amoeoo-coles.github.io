---
# Sample playbook for cisco.ise.tacacs_command_sets (cisco.ise 3.3.0)
# Build order: 140
# Resource module for TACACScommandsets
# Reads ../models/tacacs_command_sets.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/tacacs_command_sets_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags tacacs_command_sets.

- name: "0140 tacacs_command_sets"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tacacs_command_sets.yml
  tasks:
    - name: Run tacacs_command_sets from its model
      cisco.ise.tacacs_command_sets:
        commands: "{{ (tacacs_command_sets.commands | cat_strip_nulls) if (tacacs_command_sets.commands | cat_strip_nulls) is not none else omit }}"
        description: "{{ tacacs_command_sets.description if tacacs_command_sets.description is not none else omit }}"
        id: "{{ tacacs_command_sets.id if tacacs_command_sets.id is not none else omit }}"
        ise_client_cert: "{{ tacacs_command_sets.ise_client_cert if tacacs_command_sets.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ tacacs_command_sets.ise_client_key if tacacs_command_sets.ise_client_key is not none else omit }}"
        ise_debug: "{{ tacacs_command_sets.ise_debug if tacacs_command_sets.ise_debug is not none else omit }}"
        ise_hostname: "{{ tacacs_command_sets.ise_hostname if tacacs_command_sets.ise_hostname is not none else omit }}"
        ise_password: "{{ tacacs_command_sets.ise_password if tacacs_command_sets.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ tacacs_command_sets.ise_single_request_timeout if tacacs_command_sets.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ tacacs_command_sets.ise_username if tacacs_command_sets.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ tacacs_command_sets.ise_uses_api_gateway if tacacs_command_sets.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ tacacs_command_sets.ise_uses_csrf_token if tacacs_command_sets.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ tacacs_command_sets.ise_verify if tacacs_command_sets.ise_verify is not none else omit }}"
        ise_version: "{{ tacacs_command_sets.ise_version if tacacs_command_sets.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ tacacs_command_sets.ise_wait_on_rate_limit if tacacs_command_sets.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ tacacs_command_sets.name if tacacs_command_sets.name is not none else omit }}"
        permitUnmatched: "{{ tacacs_command_sets.permitUnmatched if tacacs_command_sets.permitUnmatched is not none else omit }}"
      register: tacacs_command_sets_result
      tags:
        - never
        - tacacs_command_sets
