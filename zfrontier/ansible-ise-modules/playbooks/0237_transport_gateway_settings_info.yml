---
# Sample playbook for cisco.ise.transport_gateway_settings_info (cisco.ise 3.3.0)
# Build order: 237
# Information module for Transport Gateway Settings
# Reads ../models/transport_gateway_settings_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/transport_gateway_settings_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0237 transport_gateway_settings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/transport_gateway_settings_info.yml
  tasks:
    - name: Run transport_gateway_settings_info from its model
      cisco.ise.transport_gateway_settings_info:
        ise_client_cert: "{{ transport_gateway_settings_info.ise_client_cert if transport_gateway_settings_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ transport_gateway_settings_info.ise_client_key if transport_gateway_settings_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ transport_gateway_settings_info.ise_debug if transport_gateway_settings_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ transport_gateway_settings_info.ise_hostname if transport_gateway_settings_info.ise_hostname is not none else omit }}"
        ise_password: "{{ transport_gateway_settings_info.ise_password if transport_gateway_settings_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ transport_gateway_settings_info.ise_single_request_timeout if transport_gateway_settings_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ transport_gateway_settings_info.ise_username if transport_gateway_settings_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ transport_gateway_settings_info.ise_uses_api_gateway if transport_gateway_settings_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ transport_gateway_settings_info.ise_uses_csrf_token if transport_gateway_settings_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ transport_gateway_settings_info.ise_verify if transport_gateway_settings_info.ise_verify is not none else omit }}"
        ise_version: "{{ transport_gateway_settings_info.ise_version if transport_gateway_settings_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ transport_gateway_settings_info.ise_wait_on_rate_limit if transport_gateway_settings_info.ise_wait_on_rate_limit is not none else omit }}"
      register: transport_gateway_settings_info_result
