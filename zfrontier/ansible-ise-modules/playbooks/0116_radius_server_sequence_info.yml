---
# Sample playbook for cisco.ise.radius_server_sequence_info (cisco.ise 3.3.0)
# Build order: 116
# Information module for RADIUSserversequence
# Reads ../models/radius_server_sequence_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/radius_server_sequence_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0116 radius_server_sequence_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/radius_server_sequence_info.yml
  tasks:
    - name: Run radius_server_sequence_info from its model
      cisco.ise.radius_server_sequence_info:
        filterType: "{{ radius_server_sequence_info.filterType if radius_server_sequence_info.filterType is not none else omit }}"
        ise_client_cert: "{{ radius_server_sequence_info.ise_client_cert if radius_server_sequence_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ radius_server_sequence_info.ise_client_key if radius_server_sequence_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ radius_server_sequence_info.ise_debug if radius_server_sequence_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ radius_server_sequence_info.ise_hostname if radius_server_sequence_info.ise_hostname is not none else omit }}"
        ise_password: "{{ radius_server_sequence_info.ise_password if radius_server_sequence_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ radius_server_sequence_info.ise_single_request_timeout if radius_server_sequence_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ radius_server_sequence_info.ise_username if radius_server_sequence_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ radius_server_sequence_info.ise_uses_api_gateway if radius_server_sequence_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ radius_server_sequence_info.ise_uses_csrf_token if radius_server_sequence_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ radius_server_sequence_info.ise_verify if radius_server_sequence_info.ise_verify is not none else omit }}"
        ise_version: "{{ radius_server_sequence_info.ise_version if radius_server_sequence_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ radius_server_sequence_info.ise_wait_on_rate_limit if radius_server_sequence_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ radius_server_sequence_info.page if radius_server_sequence_info.page is not none else omit }}"
        size: "{{ radius_server_sequence_info.size if radius_server_sequence_info.size is not none else omit }}"
      register: radius_server_sequence_info_result
