---
# Sample playbook for cisco.ise.external_radius_server (cisco.ise 3.3.0)
# Build order: 93
# Resource module for Externalradiusserver
# Reads ../models/external_radius_server.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/external_radius_server_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags external_radius_server.

- name: "0093 external_radius_server"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/external_radius_server.yml
  tasks:
    - name: Run external_radius_server from its model
      cisco.ise.external_radius_server:
        accountingPort: "{{ external_radius_server.accountingPort if external_radius_server.accountingPort is not none else omit }}"
        authenticationPort: "{{ external_radius_server.authenticationPort if external_radius_server.authenticationPort is not none else omit }}"
        authenticatorKey: "{{ external_radius_server.authenticatorKey if external_radius_server.authenticatorKey is not none else omit }}"
        description: "{{ external_radius_server.description if external_radius_server.description is not none else omit }}"
        enableKeyWrap: "{{ external_radius_server.enableKeyWrap if external_radius_server.enableKeyWrap is not none else omit }}"
        encryptionKey: "{{ external_radius_server.encryptionKey if external_radius_server.encryptionKey is not none else omit }}"
        hostIP: "{{ external_radius_server.hostIP if external_radius_server.hostIP is not none else omit }}"
        id: "{{ external_radius_server.id if external_radius_server.id is not none else omit }}"
        ise_client_cert: "{{ external_radius_server.ise_client_cert if external_radius_server.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ external_radius_server.ise_client_key if external_radius_server.ise_client_key is not none else omit }}"
        ise_debug: "{{ external_radius_server.ise_debug if external_radius_server.ise_debug is not none else omit }}"
        ise_hostname: "{{ external_radius_server.ise_hostname if external_radius_server.ise_hostname is not none else omit }}"
        ise_password: "{{ external_radius_server.ise_password if external_radius_server.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ external_radius_server.ise_single_request_timeout if external_radius_server.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ external_radius_server.ise_username if external_radius_server.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ external_radius_server.ise_uses_api_gateway if external_radius_server.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ external_radius_server.ise_uses_csrf_token if external_radius_server.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ external_radius_server.ise_verify if external_radius_server.ise_verify is not none else omit }}"
        ise_version: "{{ external_radius_server.ise_version if external_radius_server.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ external_radius_server.ise_wait_on_rate_limit if external_radius_server.ise_wait_on_rate_limit is not none else omit }}"
        keyInputFormat: "{{ external_radius_server.keyInputFormat if external_radius_server.keyInputFormat is not none else omit }}"
        msgAuthIsRequiredOnResponse: "{{ external_radius_server.msgAuthIsRequiredOnResponse if external_radius_server.msgAuthIsRequiredOnResponse is not none else omit }}"
        name: "{{ external_radius_server.name if external_radius_server.name is not none else omit }}"
        proxyTimeout: "{{ external_radius_server.proxyTimeout if external_radius_server.proxyTimeout is not none else omit }}"
        retries: "{{ external_radius_server.retries if external_radius_server.retries is not none else omit }}"
        sharedSecret: "{{ external_radius_server.sharedSecret if external_radius_server.sharedSecret is not none else omit }}"
        timeout: "{{ external_radius_server.timeout if external_radius_server.timeout is not none else omit }}"
      register: external_radius_server_result
      tags:
        - never
        - external_radius_server
