---
# Sample playbook for cisco.ise.licensing_registration_create (cisco.ise 3.3.0)
# Build order: 26
# Resource module for Licensing Registration Create
# Reads ../models/licensing_registration_create.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/licensing_registration_create_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags licensing_registration_create.

- name: "0026 licensing_registration_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/licensing_registration_create.yml
  tasks:
    - name: Run licensing_registration_create from its model
      cisco.ise.licensing_registration_create:
        connectionType: "{{ licensing_registration_create.connectionType if licensing_registration_create.connectionType is not none else omit }}"
        ise_client_cert: "{{ licensing_registration_create.ise_client_cert if licensing_registration_create.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ licensing_registration_create.ise_client_key if licensing_registration_create.ise_client_key is not none else omit }}"
        ise_debug: "{{ licensing_registration_create.ise_debug if licensing_registration_create.ise_debug is not none else omit }}"
        ise_hostname: "{{ licensing_registration_create.ise_hostname if licensing_registration_create.ise_hostname is not none else omit }}"
        ise_password: "{{ licensing_registration_create.ise_password if licensing_registration_create.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ licensing_registration_create.ise_single_request_timeout if licensing_registration_create.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ licensing_registration_create.ise_username if licensing_registration_create.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ licensing_registration_create.ise_uses_api_gateway if licensing_registration_create.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ licensing_registration_create.ise_uses_csrf_token if licensing_registration_create.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ licensing_registration_create.ise_verify if licensing_registration_create.ise_verify is not none else omit }}"
        ise_version: "{{ licensing_registration_create.ise_version if licensing_registration_create.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ licensing_registration_create.ise_wait_on_rate_limit if licensing_registration_create.ise_wait_on_rate_limit is not none else omit }}"
        registrationType: "{{ licensing_registration_create.registrationType if licensing_registration_create.registrationType is not none else omit }}"
        ssmOnPremServer: "{{ licensing_registration_create.ssmOnPremServer if licensing_registration_create.ssmOnPremServer is not none else omit }}"
        tier: "{{ (licensing_registration_create.tier | cat_strip_nulls) if (licensing_registration_create.tier | cat_strip_nulls) is not none else omit }}"
        token: "{{ licensing_registration_create.token if licensing_registration_create.token is not none else omit }}"
      register: licensing_registration_create_result
      tags:
        - never
        - licensing_registration_create
