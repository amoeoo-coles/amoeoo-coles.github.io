---
# Sample playbook for cisco.ise.profiler_profile_info (cisco.ise 3.3.0)
# Build order: 135
# Information module for Profilerprofile
# Reads ../models/profiler_profile_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/profiler_profile_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0135 profiler_profile_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/profiler_profile_info.yml
  tasks:
    - name: Run profiler_profile_info from its model
      cisco.ise.profiler_profile_info:
        filter: "{{ profiler_profile_info.filter if profiler_profile_info.filter is not none else omit }}"
        filterType: "{{ profiler_profile_info.filterType if profiler_profile_info.filterType is not none else omit }}"
        id: "{{ profiler_profile_info.id if profiler_profile_info.id is not none else omit }}"
        ise_client_cert: "{{ profiler_profile_info.ise_client_cert if profiler_profile_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ profiler_profile_info.ise_client_key if profiler_profile_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ profiler_profile_info.ise_debug if profiler_profile_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ profiler_profile_info.ise_hostname if profiler_profile_info.ise_hostname is not none else omit }}"
        ise_password: "{{ profiler_profile_info.ise_password if profiler_profile_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ profiler_profile_info.ise_single_request_timeout if profiler_profile_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ profiler_profile_info.ise_username if profiler_profile_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ profiler_profile_info.ise_uses_api_gateway if profiler_profile_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ profiler_profile_info.ise_uses_csrf_token if profiler_profile_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ profiler_profile_info.ise_verify if profiler_profile_info.ise_verify is not none else omit }}"
        ise_version: "{{ profiler_profile_info.ise_version if profiler_profile_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ profiler_profile_info.ise_wait_on_rate_limit if profiler_profile_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ profiler_profile_info.name if profiler_profile_info.name is not none else omit }}"
        page: "{{ profiler_profile_info.page if profiler_profile_info.page is not none else omit }}"
        size: "{{ profiler_profile_info.size if profiler_profile_info.size is not none else omit }}"
        sortasc: "{{ profiler_profile_info.sortasc if profiler_profile_info.sortasc is not none else omit }}"
        sortdsc: "{{ profiler_profile_info.sortdsc if profiler_profile_info.sortdsc is not none else omit }}"
      register: profiler_profile_info_result
