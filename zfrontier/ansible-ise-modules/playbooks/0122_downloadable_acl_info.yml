---
# Sample playbook for cisco.ise.downloadable_acl_info (cisco.ise 3.3.0)
# Build order: 122
# Information module for Downloadableacl
# Reads ../models/downloadable_acl_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/downloadable_acl_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0122 downloadable_acl_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/downloadable_acl_info.yml
  tasks:
    - name: Run downloadable_acl_info from its model
      cisco.ise.downloadable_acl_info:
        filter: "{{ downloadable_acl_info.filter if downloadable_acl_info.filter is not none else omit }}"
        filterType: "{{ downloadable_acl_info.filterType if downloadable_acl_info.filterType is not none else omit }}"
        id: "{{ downloadable_acl_info.id if downloadable_acl_info.id is not none else omit }}"
        ise_client_cert: "{{ downloadable_acl_info.ise_client_cert if downloadable_acl_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ downloadable_acl_info.ise_client_key if downloadable_acl_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ downloadable_acl_info.ise_debug if downloadable_acl_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ downloadable_acl_info.ise_hostname if downloadable_acl_info.ise_hostname is not none else omit }}"
        ise_password: "{{ downloadable_acl_info.ise_password if downloadable_acl_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ downloadable_acl_info.ise_single_request_timeout if downloadable_acl_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ downloadable_acl_info.ise_username if downloadable_acl_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ downloadable_acl_info.ise_uses_api_gateway if downloadable_acl_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ downloadable_acl_info.ise_uses_csrf_token if downloadable_acl_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ downloadable_acl_info.ise_verify if downloadable_acl_info.ise_verify is not none else omit }}"
        ise_version: "{{ downloadable_acl_info.ise_version if downloadable_acl_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ downloadable_acl_info.ise_wait_on_rate_limit if downloadable_acl_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ downloadable_acl_info.name if downloadable_acl_info.name is not none else omit }}"
        page: "{{ downloadable_acl_info.page if downloadable_acl_info.page is not none else omit }}"
        size: "{{ downloadable_acl_info.size if downloadable_acl_info.size is not none else omit }}"
      register: downloadable_acl_info_result
