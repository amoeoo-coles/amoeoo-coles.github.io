---
# Sample playbook for cisco.ise.idstoresequence_info (cisco.ise 3.3.0)
# Build order: 96
# Information module for Idstoresequence
# Reads ../models/idstoresequence_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/idstoresequence_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0096 idstoresequence_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/idstoresequence_info.yml
  tasks:
    - name: Run idstoresequence_info from its model
      cisco.ise.idstoresequence_info:
        filterType: "{{ idstoresequence_info.filterType if idstoresequence_info.filterType is not none else omit }}"
        ise_client_cert: "{{ idstoresequence_info.ise_client_cert if idstoresequence_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ idstoresequence_info.ise_client_key if idstoresequence_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ idstoresequence_info.ise_debug if idstoresequence_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ idstoresequence_info.ise_hostname if idstoresequence_info.ise_hostname is not none else omit }}"
        ise_password: "{{ idstoresequence_info.ise_password if idstoresequence_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ idstoresequence_info.ise_single_request_timeout if idstoresequence_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ idstoresequence_info.ise_username if idstoresequence_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ idstoresequence_info.ise_uses_api_gateway if idstoresequence_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ idstoresequence_info.ise_uses_csrf_token if idstoresequence_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ idstoresequence_info.ise_verify if idstoresequence_info.ise_verify is not none else omit }}"
        ise_version: "{{ idstoresequence_info.ise_version if idstoresequence_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ idstoresequence_info.ise_wait_on_rate_limit if idstoresequence_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ idstoresequence_info.page if idstoresequence_info.page is not none else omit }}"
        size: "{{ idstoresequence_info.size if idstoresequence_info.size is not none else omit }}"
      register: idstoresequence_info_result
