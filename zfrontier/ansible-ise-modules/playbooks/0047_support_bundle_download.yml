---
# Sample playbook for cisco.ise.support_bundle_download (cisco.ise 3.3.0)
# Build order: 47
# Resource module for Supportbundledownload
# Reads ../models/support_bundle_download.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/support_bundle_download_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags support_bundle_download.

- name: "0047 support_bundle_download"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/support_bundle_download.yml
  tasks:
    - name: Run support_bundle_download from its model
      cisco.ise.support_bundle_download:
        description: "{{ support_bundle_download.description if support_bundle_download.description is not none else omit }}"
        fileName: "{{ support_bundle_download.fileName if support_bundle_download.fileName is not none else omit }}"
        id: "{{ support_bundle_download.id if support_bundle_download.id is not none else omit }}"
        ise_client_cert: "{{ support_bundle_download.ise_client_cert if support_bundle_download.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ support_bundle_download.ise_client_key if support_bundle_download.ise_client_key is not none else omit }}"
        ise_debug: "{{ support_bundle_download.ise_debug if support_bundle_download.ise_debug is not none else omit }}"
        ise_hostname: "{{ support_bundle_download.ise_hostname if support_bundle_download.ise_hostname is not none else omit }}"
        ise_password: "{{ support_bundle_download.ise_password if support_bundle_download.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ support_bundle_download.ise_single_request_timeout if support_bundle_download.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ support_bundle_download.ise_username if support_bundle_download.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ support_bundle_download.ise_uses_api_gateway if support_bundle_download.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ support_bundle_download.ise_uses_csrf_token if support_bundle_download.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ support_bundle_download.ise_verify if support_bundle_download.ise_verify is not none else omit }}"
        ise_version: "{{ support_bundle_download.ise_version if support_bundle_download.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ support_bundle_download.ise_wait_on_rate_limit if support_bundle_download.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ support_bundle_download.name if support_bundle_download.name is not none else omit }}"
      register: support_bundle_download_result
      tags:
        - never
        - support_bundle_download
