---
# Sample playbook for cisco.ise.node_services_profiler_probe_config (cisco.ise 3.3.0)
# Build order: 19
# Resource module for Node Services Profiler Probe Config
# Reads ../models/node_services_profiler_probe_config.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/node_services_profiler_probe_config_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags node_services_profiler_probe_config.

- name: "0019 node_services_profiler_probe_config"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/node_services_profiler_probe_config.yml
  tasks:
    - name: Run node_services_profiler_probe_config from its model
      cisco.ise.node_services_profiler_probe_config:
        activeDirectory: "{{ node_services_profiler_probe_config.activeDirectory if node_services_profiler_probe_config.activeDirectory is not none else omit }}"
        dhcp: "{{ (node_services_profiler_probe_config.dhcp | cat_strip_nulls) if (node_services_profiler_probe_config.dhcp | cat_strip_nulls) is not none else omit }}"
        dhcpSpan: "{{ node_services_profiler_probe_config.dhcpSpan if node_services_profiler_probe_config.dhcpSpan is not none else omit }}"
        dns: "{{ (node_services_profiler_probe_config.dns | cat_strip_nulls) if (node_services_profiler_probe_config.dns | cat_strip_nulls) is not none else omit }}"
        hostname: "{{ node_services_profiler_probe_config.hostname if node_services_profiler_probe_config.hostname is not none else omit }}"
        http: "{{ node_services_profiler_probe_config.http if node_services_profiler_probe_config.http is not none else omit }}"
        ise_client_cert: "{{ node_services_profiler_probe_config.ise_client_cert if node_services_profiler_probe_config.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ node_services_profiler_probe_config.ise_client_key if node_services_profiler_probe_config.ise_client_key is not none else omit }}"
        ise_debug: "{{ node_services_profiler_probe_config.ise_debug if node_services_profiler_probe_config.ise_debug is not none else omit }}"
        ise_hostname: "{{ node_services_profiler_probe_config.ise_hostname if node_services_profiler_probe_config.ise_hostname is not none else omit }}"
        ise_password: "{{ node_services_profiler_probe_config.ise_password if node_services_profiler_probe_config.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ node_services_profiler_probe_config.ise_single_request_timeout if node_services_profiler_probe_config.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ node_services_profiler_probe_config.ise_username if node_services_profiler_probe_config.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ node_services_profiler_probe_config.ise_uses_api_gateway if node_services_profiler_probe_config.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ node_services_profiler_probe_config.ise_uses_csrf_token if node_services_profiler_probe_config.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ node_services_profiler_probe_config.ise_verify if node_services_profiler_probe_config.ise_verify is not none else omit }}"
        ise_version: "{{ node_services_profiler_probe_config.ise_version if node_services_profiler_probe_config.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ node_services_profiler_probe_config.ise_wait_on_rate_limit if node_services_profiler_probe_config.ise_wait_on_rate_limit is not none else omit }}"
        netflow: "{{ node_services_profiler_probe_config.netflow if node_services_profiler_probe_config.netflow is not none else omit }}"
        nmap: "{{ node_services_profiler_probe_config.nmap if node_services_profiler_probe_config.nmap is not none else omit }}"
        pxgrid: "{{ node_services_profiler_probe_config.pxgrid if node_services_profiler_probe_config.pxgrid is not none else omit }}"
        radius: "{{ node_services_profiler_probe_config.radius if node_services_profiler_probe_config.radius is not none else omit }}"
        snmpQuery: "{{ node_services_profiler_probe_config.snmpQuery if node_services_profiler_probe_config.snmpQuery is not none else omit }}"
        snmpTrap: "{{ node_services_profiler_probe_config.snmpTrap if node_services_profiler_probe_config.snmpTrap is not none else omit }}"
        state: "{{ node_services_profiler_probe_config.state if node_services_profiler_probe_config.state is not none else omit }}"
      register: node_services_profiler_probe_config_result
      tags:
        - never
        - node_services_profiler_probe_config
