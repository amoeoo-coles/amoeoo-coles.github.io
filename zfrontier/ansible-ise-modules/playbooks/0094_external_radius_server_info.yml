---
# Sample playbook for cisco.ise.external_radius_server_info (cisco.ise 3.3.0)
# Build order: 94
# Information module for Externalradiusserver
# Reads ../models/external_radius_server_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/external_radius_server_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0094 external_radius_server_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/external_radius_server_info.yml
  tasks:
    - name: Run external_radius_server_info from its model
      cisco.ise.external_radius_server_info:
        filterType: "{{ external_radius_server_info.filterType if external_radius_server_info.filterType is not none else omit }}"
        ise_client_cert: "{{ external_radius_server_info.ise_client_cert if external_radius_server_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ external_radius_server_info.ise_client_key if external_radius_server_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ external_radius_server_info.ise_debug if external_radius_server_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ external_radius_server_info.ise_hostname if external_radius_server_info.ise_hostname is not none else omit }}"
        ise_password: "{{ external_radius_server_info.ise_password if external_radius_server_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ external_radius_server_info.ise_single_request_timeout if external_radius_server_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ external_radius_server_info.ise_username if external_radius_server_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ external_radius_server_info.ise_uses_api_gateway if external_radius_server_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ external_radius_server_info.ise_uses_csrf_token if external_radius_server_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ external_radius_server_info.ise_verify if external_radius_server_info.ise_verify is not none else omit }}"
        ise_version: "{{ external_radius_server_info.ise_version if external_radius_server_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ external_radius_server_info.ise_wait_on_rate_limit if external_radius_server_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ external_radius_server_info.page if external_radius_server_info.page is not none else omit }}"
        size: "{{ external_radius_server_info.size if external_radius_server_info.size is not none else omit }}"
      register: external_radius_server_info_result
