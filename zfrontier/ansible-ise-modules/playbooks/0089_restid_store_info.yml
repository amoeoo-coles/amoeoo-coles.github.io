---
# Sample playbook for cisco.ise.restid_store_info (cisco.ise 3.3.0)
# Build order: 89
# Information module for RESTidstore
# Reads ../models/restid_store_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/restid_store_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0089 restid_store_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/restid_store_info.yml
  tasks:
    - name: Run restid_store_info from its model
      cisco.ise.restid_store_info:
        filter: "{{ restid_store_info.filter if restid_store_info.filter is not none else omit }}"
        filterType: "{{ restid_store_info.filterType if restid_store_info.filterType is not none else omit }}"
        id: "{{ restid_store_info.id if restid_store_info.id is not none else omit }}"
        ise_client_cert: "{{ restid_store_info.ise_client_cert if restid_store_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ restid_store_info.ise_client_key if restid_store_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ restid_store_info.ise_debug if restid_store_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ restid_store_info.ise_hostname if restid_store_info.ise_hostname is not none else omit }}"
        ise_password: "{{ restid_store_info.ise_password if restid_store_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ restid_store_info.ise_single_request_timeout if restid_store_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ restid_store_info.ise_username if restid_store_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ restid_store_info.ise_uses_api_gateway if restid_store_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ restid_store_info.ise_uses_csrf_token if restid_store_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ restid_store_info.ise_verify if restid_store_info.ise_verify is not none else omit }}"
        ise_version: "{{ restid_store_info.ise_version if restid_store_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ restid_store_info.ise_wait_on_rate_limit if restid_store_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ restid_store_info.name if restid_store_info.name is not none else omit }}"
        page: "{{ restid_store_info.page if restid_store_info.page is not none else omit }}"
        size: "{{ restid_store_info.size if restid_store_info.size is not none else omit }}"
        sortasc: "{{ restid_store_info.sortasc if restid_store_info.sortasc is not none else omit }}"
        sortdsc: "{{ restid_store_info.sortdsc if restid_store_info.sortdsc is not none else omit }}"
      register: restid_store_info_result
