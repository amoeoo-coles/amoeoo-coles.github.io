---
# Sample playbook for cisco.ise.active_directory (cisco.ise 3.3.0)
# Build order: 76
# Resource module for Activedirectory
# Reads ../models/active_directory.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/active_directory_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags active_directory.

- name: "0076 active_directory"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/active_directory.yml
  tasks:
    - name: Run active_directory from its model
      cisco.ise.active_directory:
        ERSActiveDirectoryDomains: "{{ (active_directory.ERSActiveDirectoryDomains | cat_strip_nulls) if (active_directory.ERSActiveDirectoryDomains | cat_strip_nulls) is not none else omit }}"
        adAttributes: "{{ (active_directory.adAttributes | cat_strip_nulls) if (active_directory.adAttributes | cat_strip_nulls) is not none else omit }}"
        adScopesNames: "{{ active_directory.adScopesNames if active_directory.adScopesNames is not none else omit }}"
        adgroups: "{{ (active_directory.adgroups | cat_strip_nulls) if (active_directory.adgroups | cat_strip_nulls) is not none else omit }}"
        advancedSettings: "{{ (active_directory.advancedSettings | cat_strip_nulls) if (active_directory.advancedSettings | cat_strip_nulls) is not none else omit }}"
        description: "{{ active_directory.description if active_directory.description is not none else omit }}"
        domain: "{{ active_directory.domain if active_directory.domain is not none else omit }}"
        enableDomainAllowedList: "{{ active_directory.enableDomainAllowedList if active_directory.enableDomainAllowedList is not none else omit }}"
        id: "{{ active_directory.id if active_directory.id is not none else omit }}"
        ise_client_cert: "{{ active_directory.ise_client_cert if active_directory.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ active_directory.ise_client_key if active_directory.ise_client_key is not none else omit }}"
        ise_debug: "{{ active_directory.ise_debug if active_directory.ise_debug is not none else omit }}"
        ise_hostname: "{{ active_directory.ise_hostname if active_directory.ise_hostname is not none else omit }}"
        ise_password: "{{ active_directory.ise_password if active_directory.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ active_directory.ise_single_request_timeout if active_directory.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ active_directory.ise_username if active_directory.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ active_directory.ise_uses_api_gateway if active_directory.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ active_directory.ise_uses_csrf_token if active_directory.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ active_directory.ise_verify if active_directory.ise_verify is not none else omit }}"
        ise_version: "{{ active_directory.ise_version if active_directory.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ active_directory.ise_wait_on_rate_limit if active_directory.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ active_directory.name if active_directory.name is not none else omit }}"
      register: active_directory_result
      tags:
        - never
        - active_directory
