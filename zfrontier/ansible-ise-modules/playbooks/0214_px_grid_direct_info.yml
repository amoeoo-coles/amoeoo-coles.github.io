---
# Sample playbook for cisco.ise.px_grid_direct_info (cisco.ise 3.3.0)
# Build order: 214
# Information module for Px Grid Direct Info
# Reads ../models/px_grid_direct_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/px_grid_direct_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0214 px_grid_direct_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/px_grid_direct_info.yml
  tasks:
    - name: Run px_grid_direct_info from its model
      cisco.ise.px_grid_direct_info:
        connectorName: "{{ px_grid_direct_info.connectorName if px_grid_direct_info.connectorName is not none else omit }}"
        ise_client_cert: "{{ px_grid_direct_info.ise_client_cert if px_grid_direct_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ px_grid_direct_info.ise_client_key if px_grid_direct_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ px_grid_direct_info.ise_debug if px_grid_direct_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ px_grid_direct_info.ise_hostname if px_grid_direct_info.ise_hostname is not none else omit }}"
        ise_password: "{{ px_grid_direct_info.ise_password if px_grid_direct_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ px_grid_direct_info.ise_single_request_timeout if px_grid_direct_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ px_grid_direct_info.ise_username if px_grid_direct_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ px_grid_direct_info.ise_uses_api_gateway if px_grid_direct_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ px_grid_direct_info.ise_uses_csrf_token if px_grid_direct_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ px_grid_direct_info.ise_verify if px_grid_direct_info.ise_verify is not none else omit }}"
        ise_version: "{{ px_grid_direct_info.ise_version if px_grid_direct_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ px_grid_direct_info.ise_wait_on_rate_limit if px_grid_direct_info.ise_wait_on_rate_limit is not none else omit }}"
      register: px_grid_direct_info_result
