---
# Sample playbook for cisco.ise.tacacs_server_sequence (cisco.ise 3.3.0)
# Build order: 146
# Resource module for TACACSserversequence
# Reads ../models/tacacs_server_sequence.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/tacacs_server_sequence_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags tacacs_server_sequence.

- name: "0146 tacacs_server_sequence"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tacacs_server_sequence.yml
  tasks:
    - name: Run tacacs_server_sequence from its model
      cisco.ise.tacacs_server_sequence:
        description: "{{ tacacs_server_sequence.description if tacacs_server_sequence.description is not none else omit }}"
        id: "{{ tacacs_server_sequence.id if tacacs_server_sequence.id is not none else omit }}"
        ise_client_cert: "{{ tacacs_server_sequence.ise_client_cert if tacacs_server_sequence.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ tacacs_server_sequence.ise_client_key if tacacs_server_sequence.ise_client_key is not none else omit }}"
        ise_debug: "{{ tacacs_server_sequence.ise_debug if tacacs_server_sequence.ise_debug is not none else omit }}"
        ise_hostname: "{{ tacacs_server_sequence.ise_hostname if tacacs_server_sequence.ise_hostname is not none else omit }}"
        ise_password: "{{ tacacs_server_sequence.ise_password if tacacs_server_sequence.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ tacacs_server_sequence.ise_single_request_timeout if tacacs_server_sequence.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ tacacs_server_sequence.ise_username if tacacs_server_sequence.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ tacacs_server_sequence.ise_uses_api_gateway if tacacs_server_sequence.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ tacacs_server_sequence.ise_uses_csrf_token if tacacs_server_sequence.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ tacacs_server_sequence.ise_verify if tacacs_server_sequence.ise_verify is not none else omit }}"
        ise_version: "{{ tacacs_server_sequence.ise_version if tacacs_server_sequence.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ tacacs_server_sequence.ise_wait_on_rate_limit if tacacs_server_sequence.ise_wait_on_rate_limit is not none else omit }}"
        localAccounting: "{{ tacacs_server_sequence.localAccounting if tacacs_server_sequence.localAccounting is not none else omit }}"
        name: "{{ tacacs_server_sequence.name if tacacs_server_sequence.name is not none else omit }}"
        prefixDelimiter: "{{ tacacs_server_sequence.prefixDelimiter if tacacs_server_sequence.prefixDelimiter is not none else omit }}"
        prefixStrip: "{{ tacacs_server_sequence.prefixStrip if tacacs_server_sequence.prefixStrip is not none else omit }}"
        remoteAccounting: "{{ tacacs_server_sequence.remoteAccounting if tacacs_server_sequence.remoteAccounting is not none else omit }}"
        serverList: "{{ tacacs_server_sequence.serverList if tacacs_server_sequence.serverList is not none else omit }}"
        suffixDelimiter: "{{ tacacs_server_sequence.suffixDelimiter if tacacs_server_sequence.suffixDelimiter is not none else omit }}"
        suffixStrip: "{{ tacacs_server_sequence.suffixStrip if tacacs_server_sequence.suffixStrip is not none else omit }}"
      register: tacacs_server_sequence_result
      tags:
        - never
        - tacacs_server_sequence
