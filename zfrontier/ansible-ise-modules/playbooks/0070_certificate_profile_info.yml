---
# Sample playbook for cisco.ise.certificate_profile_info (cisco.ise 3.3.0)
# Build order: 70
# Information module for Certificateprofile
# Reads ../models/certificate_profile_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/certificate_profile_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0070 certificate_profile_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/certificate_profile_info.yml
  tasks:
    - name: Run certificate_profile_info from its model
      cisco.ise.certificate_profile_info:
        filterType: "{{ certificate_profile_info.filterType if certificate_profile_info.filterType is not none else omit }}"
        ise_client_cert: "{{ certificate_profile_info.ise_client_cert if certificate_profile_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ certificate_profile_info.ise_client_key if certificate_profile_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ certificate_profile_info.ise_debug if certificate_profile_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ certificate_profile_info.ise_hostname if certificate_profile_info.ise_hostname is not none else omit }}"
        ise_password: "{{ certificate_profile_info.ise_password if certificate_profile_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ certificate_profile_info.ise_single_request_timeout if certificate_profile_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ certificate_profile_info.ise_username if certificate_profile_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ certificate_profile_info.ise_uses_api_gateway if certificate_profile_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ certificate_profile_info.ise_uses_csrf_token if certificate_profile_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ certificate_profile_info.ise_verify if certificate_profile_info.ise_verify is not none else omit }}"
        ise_version: "{{ certificate_profile_info.ise_version if certificate_profile_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ certificate_profile_info.ise_wait_on_rate_limit if certificate_profile_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ certificate_profile_info.page if certificate_profile_info.page is not none else omit }}"
        size: "{{ certificate_profile_info.size if certificate_profile_info.size is not none else omit }}"
      register: certificate_profile_info_result
