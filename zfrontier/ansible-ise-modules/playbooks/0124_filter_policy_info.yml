---
# Sample playbook for cisco.ise.filter_policy_info (cisco.ise 3.3.0)
# Build order: 124
# Information module for Filterpolicy
# Reads ../models/filter_policy_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/filter_policy_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0124 filter_policy_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/filter_policy_info.yml
  tasks:
    - name: Run filter_policy_info from its model
      cisco.ise.filter_policy_info:
        filterType: "{{ filter_policy_info.filterType if filter_policy_info.filterType is not none else omit }}"
        ise_client_cert: "{{ filter_policy_info.ise_client_cert if filter_policy_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ filter_policy_info.ise_client_key if filter_policy_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ filter_policy_info.ise_debug if filter_policy_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ filter_policy_info.ise_hostname if filter_policy_info.ise_hostname is not none else omit }}"
        ise_password: "{{ filter_policy_info.ise_password if filter_policy_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ filter_policy_info.ise_single_request_timeout if filter_policy_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ filter_policy_info.ise_username if filter_policy_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ filter_policy_info.ise_uses_api_gateway if filter_policy_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ filter_policy_info.ise_uses_csrf_token if filter_policy_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ filter_policy_info.ise_verify if filter_policy_info.ise_verify is not none else omit }}"
        ise_version: "{{ filter_policy_info.ise_version if filter_policy_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ filter_policy_info.ise_wait_on_rate_limit if filter_policy_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ filter_policy_info.page if filter_policy_info.page is not none else omit }}"
        size: "{{ filter_policy_info.size if filter_policy_info.size is not none else omit }}"
      register: filter_policy_info_result
