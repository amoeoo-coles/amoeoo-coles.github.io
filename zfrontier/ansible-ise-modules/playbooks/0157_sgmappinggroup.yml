---
# Sample playbook for cisco.ise.sgmappinggroup (cisco.ise 3.3.0)
# Build order: 157
# Resource module for SGmappinggroup
# Reads ../models/sgmappinggroup.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sgmappinggroup_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sgmappinggroup.

- name: "0157 sgmappinggroup"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sgmappinggroup.yml
  tasks:
    - name: Run sgmappinggroup from its model
      cisco.ise.sgmappinggroup:
        deployTo: "{{ sgmappinggroup.deployTo if sgmappinggroup.deployTo is not none else omit }}"
        deployType: "{{ sgmappinggroup.deployType if sgmappinggroup.deployType is not none else omit }}"
        description: "{{ sgmappinggroup.description if sgmappinggroup.description is not none else omit }}"
        id: "{{ sgmappinggroup.id if sgmappinggroup.id is not none else omit }}"
        ise_client_cert: "{{ sgmappinggroup.ise_client_cert if sgmappinggroup.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sgmappinggroup.ise_client_key if sgmappinggroup.ise_client_key is not none else omit }}"
        ise_debug: "{{ sgmappinggroup.ise_debug if sgmappinggroup.ise_debug is not none else omit }}"
        ise_hostname: "{{ sgmappinggroup.ise_hostname if sgmappinggroup.ise_hostname is not none else omit }}"
        ise_password: "{{ sgmappinggroup.ise_password if sgmappinggroup.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sgmappinggroup.ise_single_request_timeout if sgmappinggroup.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sgmappinggroup.ise_username if sgmappinggroup.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sgmappinggroup.ise_uses_api_gateway if sgmappinggroup.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sgmappinggroup.ise_uses_csrf_token if sgmappinggroup.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sgmappinggroup.ise_verify if sgmappinggroup.ise_verify is not none else omit }}"
        ise_version: "{{ sgmappinggroup.ise_version if sgmappinggroup.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sgmappinggroup.ise_wait_on_rate_limit if sgmappinggroup.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sgmappinggroup.name if sgmappinggroup.name is not none else omit }}"
        sgt: "{{ sgmappinggroup.sgt if sgmappinggroup.sgt is not none else omit }}"
        sgtDomain: "{{ (sgmappinggroup.sgtDomain | cat_strip_nulls) if (sgmappinggroup.sgtDomain | cat_strip_nulls) is not none else omit }}"
      register: sgmappinggroup_result
      tags:
        - never
        - sgmappinggroup
