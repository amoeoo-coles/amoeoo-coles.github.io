---
# Sample playbook for cisco.ise.portal_theme_info (cisco.ise 3.3.0)
# Build order: 195
# Information module for Portaltheme
# Reads ../models/portal_theme_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/portal_theme_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0195 portal_theme_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/portal_theme_info.yml
  tasks:
    - name: Run portal_theme_info from its model
      cisco.ise.portal_theme_info:
        filter: "{{ portal_theme_info.filter if portal_theme_info.filter is not none else omit }}"
        filterType: "{{ portal_theme_info.filterType if portal_theme_info.filterType is not none else omit }}"
        id: "{{ portal_theme_info.id if portal_theme_info.id is not none else omit }}"
        ise_client_cert: "{{ portal_theme_info.ise_client_cert if portal_theme_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ portal_theme_info.ise_client_key if portal_theme_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ portal_theme_info.ise_debug if portal_theme_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ portal_theme_info.ise_hostname if portal_theme_info.ise_hostname is not none else omit }}"
        ise_password: "{{ portal_theme_info.ise_password if portal_theme_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ portal_theme_info.ise_single_request_timeout if portal_theme_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ portal_theme_info.ise_username if portal_theme_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ portal_theme_info.ise_uses_api_gateway if portal_theme_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ portal_theme_info.ise_uses_csrf_token if portal_theme_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ portal_theme_info.ise_verify if portal_theme_info.ise_verify is not none else omit }}"
        ise_version: "{{ portal_theme_info.ise_version if portal_theme_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ portal_theme_info.ise_wait_on_rate_limit if portal_theme_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ portal_theme_info.name if portal_theme_info.name is not none else omit }}"
        page: "{{ portal_theme_info.page if portal_theme_info.page is not none else omit }}"
        size: "{{ portal_theme_info.size if portal_theme_info.size is not none else omit }}"
        sortasc: "{{ portal_theme_info.sortasc if portal_theme_info.sortasc is not none else omit }}"
        sortdsc: "{{ portal_theme_info.sortdsc if portal_theme_info.sortdsc is not none else omit }}"
      register: portal_theme_info_result
