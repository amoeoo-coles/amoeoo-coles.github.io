---
# Sample playbook for cisco.ise.endpointgroup_info (cisco.ise 3.3.0)
# Build order: 126
# Information module for Endpointgroup
# Reads ../models/endpointgroup_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/endpointgroup_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0126 endpointgroup_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpointgroup_info.yml
  tasks:
    - name: Run endpointgroup_info from its model
      cisco.ise.endpointgroup_info:
        filter: "{{ endpointgroup_info.filter if endpointgroup_info.filter is not none else omit }}"
        filterType: "{{ endpointgroup_info.filterType if endpointgroup_info.filterType is not none else omit }}"
        id: "{{ endpointgroup_info.id if endpointgroup_info.id is not none else omit }}"
        ise_client_cert: "{{ endpointgroup_info.ise_client_cert if endpointgroup_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ endpointgroup_info.ise_client_key if endpointgroup_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ endpointgroup_info.ise_debug if endpointgroup_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ endpointgroup_info.ise_hostname if endpointgroup_info.ise_hostname is not none else omit }}"
        ise_password: "{{ endpointgroup_info.ise_password if endpointgroup_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ endpointgroup_info.ise_single_request_timeout if endpointgroup_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ endpointgroup_info.ise_username if endpointgroup_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ endpointgroup_info.ise_uses_api_gateway if endpointgroup_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ endpointgroup_info.ise_uses_csrf_token if endpointgroup_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ endpointgroup_info.ise_verify if endpointgroup_info.ise_verify is not none else omit }}"
        ise_version: "{{ endpointgroup_info.ise_version if endpointgroup_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ endpointgroup_info.ise_wait_on_rate_limit if endpointgroup_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ endpointgroup_info.name if endpointgroup_info.name is not none else omit }}"
        page: "{{ endpointgroup_info.page if endpointgroup_info.page is not none else omit }}"
        size: "{{ endpointgroup_info.size if endpointgroup_info.size is not none else omit }}"
        sortasc: "{{ endpointgroup_info.sortasc if endpointgroup_info.sortasc is not none else omit }}"
        sortdsc: "{{ endpointgroup_info.sortdsc if endpointgroup_info.sortdsc is not none else omit }}"
      register: endpointgroup_info_result
