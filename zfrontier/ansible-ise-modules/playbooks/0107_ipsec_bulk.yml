---
# Sample playbook for cisco.ise.ipsec_bulk (cisco.ise 3.3.0)
# Build order: 107
# Resource module for Ipsec Bulk
# Reads ../models/ipsec_bulk.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ipsec_bulk_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags ipsec_bulk.

- name: "0107 ipsec_bulk"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipsec_bulk.yml
  tasks:
    - name: Run ipsec_bulk from its model
      cisco.ise.ipsec_bulk:
        ItemList: "{{ (ipsec_bulk.ItemList | cat_strip_nulls) if (ipsec_bulk.ItemList | cat_strip_nulls) is not none else omit }}"
        ise_client_cert: "{{ ipsec_bulk.ise_client_cert if ipsec_bulk.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ ipsec_bulk.ise_client_key if ipsec_bulk.ise_client_key is not none else omit }}"
        ise_debug: "{{ ipsec_bulk.ise_debug if ipsec_bulk.ise_debug is not none else omit }}"
        ise_hostname: "{{ ipsec_bulk.ise_hostname if ipsec_bulk.ise_hostname is not none else omit }}"
        ise_password: "{{ ipsec_bulk.ise_password if ipsec_bulk.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ ipsec_bulk.ise_single_request_timeout if ipsec_bulk.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ ipsec_bulk.ise_username if ipsec_bulk.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ ipsec_bulk.ise_uses_api_gateway if ipsec_bulk.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ ipsec_bulk.ise_uses_csrf_token if ipsec_bulk.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ ipsec_bulk.ise_verify if ipsec_bulk.ise_verify is not none else omit }}"
        ise_version: "{{ ipsec_bulk.ise_version if ipsec_bulk.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ ipsec_bulk.ise_wait_on_rate_limit if ipsec_bulk.ise_wait_on_rate_limit is not none else omit }}"
        operation: "{{ ipsec_bulk.operation if ipsec_bulk.operation is not none else omit }}"
      register: ipsec_bulk_result
      tags:
        - never
        - ipsec_bulk
