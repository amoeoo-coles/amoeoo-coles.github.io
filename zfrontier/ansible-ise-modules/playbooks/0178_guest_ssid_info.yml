---
# Sample playbook for cisco.ise.guest_ssid_info (cisco.ise 3.3.0)
# Build order: 178
# Information module for Guestssid
# Reads ../models/guest_ssid_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/guest_ssid_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0178 guest_ssid_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/guest_ssid_info.yml
  tasks:
    - name: Run guest_ssid_info from its model
      cisco.ise.guest_ssid_info:
        filter: "{{ guest_ssid_info.filter if guest_ssid_info.filter is not none else omit }}"
        filterType: "{{ guest_ssid_info.filterType if guest_ssid_info.filterType is not none else omit }}"
        id: "{{ guest_ssid_info.id if guest_ssid_info.id is not none else omit }}"
        ise_client_cert: "{{ guest_ssid_info.ise_client_cert if guest_ssid_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ guest_ssid_info.ise_client_key if guest_ssid_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ guest_ssid_info.ise_debug if guest_ssid_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ guest_ssid_info.ise_hostname if guest_ssid_info.ise_hostname is not none else omit }}"
        ise_password: "{{ guest_ssid_info.ise_password if guest_ssid_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ guest_ssid_info.ise_single_request_timeout if guest_ssid_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ guest_ssid_info.ise_username if guest_ssid_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ guest_ssid_info.ise_uses_api_gateway if guest_ssid_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ guest_ssid_info.ise_uses_csrf_token if guest_ssid_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ guest_ssid_info.ise_verify if guest_ssid_info.ise_verify is not none else omit }}"
        ise_version: "{{ guest_ssid_info.ise_version if guest_ssid_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ guest_ssid_info.ise_wait_on_rate_limit if guest_ssid_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ guest_ssid_info.name if guest_ssid_info.name is not none else omit }}"
        page: "{{ guest_ssid_info.page if guest_ssid_info.page is not none else omit }}"
        size: "{{ guest_ssid_info.size if guest_ssid_info.size is not none else omit }}"
        sortasc: "{{ guest_ssid_info.sortasc if guest_ssid_info.sortasc is not none else omit }}"
        sortdsc: "{{ guest_ssid_info.sortdsc if guest_ssid_info.sortdsc is not none else omit }}"
      register: guest_ssid_info_result
