---
# Sample playbook for cisco.ise.guestsmtpnotificationsettings (cisco.ise 3.3.0)
# Build order: 183
# Resource module for Guestsmtpnotificationsettings
# Reads ../models/guestsmtpnotificationsettings.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/guestsmtpnotificationsettings_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags guestsmtpnotificationsettings.

- name: "0183 guestsmtpnotificationsettings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/guestsmtpnotificationsettings.yml
  tasks:
    - name: Run guestsmtpnotificationsettings from its model
      cisco.ise.guestsmtpnotificationsettings:
        connectionTimeout: "{{ guestsmtpnotificationsettings.connectionTimeout if guestsmtpnotificationsettings.connectionTimeout is not none else omit }}"
        defaultFromAddress: "{{ guestsmtpnotificationsettings.defaultFromAddress if guestsmtpnotificationsettings.defaultFromAddress is not none else omit }}"
        description: "{{ guestsmtpnotificationsettings.description if guestsmtpnotificationsettings.description is not none else omit }}"
        id: "{{ guestsmtpnotificationsettings.id if guestsmtpnotificationsettings.id is not none else omit }}"
        ise_client_cert: "{{ guestsmtpnotificationsettings.ise_client_cert if guestsmtpnotificationsettings.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ guestsmtpnotificationsettings.ise_client_key if guestsmtpnotificationsettings.ise_client_key is not none else omit }}"
        ise_debug: "{{ guestsmtpnotificationsettings.ise_debug if guestsmtpnotificationsettings.ise_debug is not none else omit }}"
        ise_hostname: "{{ guestsmtpnotificationsettings.ise_hostname if guestsmtpnotificationsettings.ise_hostname is not none else omit }}"
        ise_password: "{{ guestsmtpnotificationsettings.ise_password if guestsmtpnotificationsettings.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ guestsmtpnotificationsettings.ise_single_request_timeout if guestsmtpnotificationsettings.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ guestsmtpnotificationsettings.ise_username if guestsmtpnotificationsettings.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ guestsmtpnotificationsettings.ise_uses_api_gateway if guestsmtpnotificationsettings.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ guestsmtpnotificationsettings.ise_uses_csrf_token if guestsmtpnotificationsettings.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ guestsmtpnotificationsettings.ise_verify if guestsmtpnotificationsettings.ise_verify is not none else omit }}"
        ise_version: "{{ guestsmtpnotificationsettings.ise_version if guestsmtpnotificationsettings.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ guestsmtpnotificationsettings.ise_wait_on_rate_limit if guestsmtpnotificationsettings.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ guestsmtpnotificationsettings.name if guestsmtpnotificationsettings.name is not none else omit }}"
        notificationEnabled: "{{ guestsmtpnotificationsettings.notificationEnabled if guestsmtpnotificationsettings.notificationEnabled is not none else omit }}"
        password: "{{ guestsmtpnotificationsettings.password if guestsmtpnotificationsettings.password is not none else omit }}"
        smtpPort: "{{ guestsmtpnotificationsettings.smtpPort if guestsmtpnotificationsettings.smtpPort is not none else omit }}"
        smtpServer: "{{ guestsmtpnotificationsettings.smtpServer if guestsmtpnotificationsettings.smtpServer is not none else omit }}"
        useDefaultFromAddress: "{{ guestsmtpnotificationsettings.useDefaultFromAddress if guestsmtpnotificationsettings.useDefaultFromAddress is not none else omit }}"
        usePasswordAuthentication: "{{ guestsmtpnotificationsettings.usePasswordAuthentication if guestsmtpnotificationsettings.usePasswordAuthentication is not none else omit }}"
        useTLSorSSLEncryption: "{{ guestsmtpnotificationsettings.useTLSorSSLEncryption if guestsmtpnotificationsettings.useTLSorSSLEncryption is not none else omit }}"
        userName: "{{ guestsmtpnotificationsettings.userName if guestsmtpnotificationsettings.userName is not none else omit }}"
      register: guestsmtpnotificationsettings_result
      tags:
        - never
        - guestsmtpnotificationsettings
