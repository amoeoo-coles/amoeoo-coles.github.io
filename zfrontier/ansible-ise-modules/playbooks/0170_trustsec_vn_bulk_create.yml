---
# Sample playbook for cisco.ise.trustsec_vn_bulk_create (cisco.ise 3.3.0)
# Build order: 170
# Resource module for Trustsec VN Bulk Create
# Reads ../models/trustsec_vn_bulk_create.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/trustsec_vn_bulk_create_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags trustsec_vn_bulk_create.

- name: "0170 trustsec_vn_bulk_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/trustsec_vn_bulk_create.yml
  tasks:
    - name: Run trustsec_vn_bulk_create from its model
      cisco.ise.trustsec_vn_bulk_create:
        ise_client_cert: "{{ trustsec_vn_bulk_create.ise_client_cert if trustsec_vn_bulk_create.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ trustsec_vn_bulk_create.ise_client_key if trustsec_vn_bulk_create.ise_client_key is not none else omit }}"
        ise_debug: "{{ trustsec_vn_bulk_create.ise_debug if trustsec_vn_bulk_create.ise_debug is not none else omit }}"
        ise_hostname: "{{ trustsec_vn_bulk_create.ise_hostname if trustsec_vn_bulk_create.ise_hostname is not none else omit }}"
        ise_password: "{{ trustsec_vn_bulk_create.ise_password if trustsec_vn_bulk_create.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ trustsec_vn_bulk_create.ise_single_request_timeout if trustsec_vn_bulk_create.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ trustsec_vn_bulk_create.ise_username if trustsec_vn_bulk_create.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ trustsec_vn_bulk_create.ise_uses_api_gateway if trustsec_vn_bulk_create.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ trustsec_vn_bulk_create.ise_uses_csrf_token if trustsec_vn_bulk_create.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ trustsec_vn_bulk_create.ise_verify if trustsec_vn_bulk_create.ise_verify is not none else omit }}"
        ise_version: "{{ trustsec_vn_bulk_create.ise_version if trustsec_vn_bulk_create.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ trustsec_vn_bulk_create.ise_wait_on_rate_limit if trustsec_vn_bulk_create.ise_wait_on_rate_limit is not none else omit }}"
        payload: "{{ (trustsec_vn_bulk_create.payload | cat_strip_nulls) if (trustsec_vn_bulk_create.payload | cat_strip_nulls) is not none else omit }}"
      register: trustsec_vn_bulk_create_result
      tags:
        - never
        - trustsec_vn_bulk_create
