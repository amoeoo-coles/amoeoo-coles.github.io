---
# Sample playbook for cisco.ise.identitygroup (cisco.ise 3.3.0)
# Build order: 97
# Resource module for Identitygroup
# Reads ../models/identitygroup.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/identitygroup_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags identitygroup.

- name: "0097 identitygroup"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/identitygroup.yml
  tasks:
    - name: Run identitygroup from its model
      cisco.ise.identitygroup:
        description: "{{ identitygroup.description if identitygroup.description is not none else omit }}"
        id: "{{ identitygroup.id if identitygroup.id is not none else omit }}"
        ise_client_cert: "{{ identitygroup.ise_client_cert if identitygroup.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ identitygroup.ise_client_key if identitygroup.ise_client_key is not none else omit }}"
        ise_debug: "{{ identitygroup.ise_debug if identitygroup.ise_debug is not none else omit }}"
        ise_hostname: "{{ identitygroup.ise_hostname if identitygroup.ise_hostname is not none else omit }}"
        ise_password: "{{ identitygroup.ise_password if identitygroup.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ identitygroup.ise_single_request_timeout if identitygroup.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ identitygroup.ise_username if identitygroup.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ identitygroup.ise_uses_api_gateway if identitygroup.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ identitygroup.ise_uses_csrf_token if identitygroup.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ identitygroup.ise_verify if identitygroup.ise_verify is not none else omit }}"
        ise_version: "{{ identitygroup.ise_version if identitygroup.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ identitygroup.ise_wait_on_rate_limit if identitygroup.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ identitygroup.name if identitygroup.name is not none else omit }}"
        parent: "{{ identitygroup.parent if identitygroup.parent is not none else omit }}"
      register: identitygroup_result
      tags:
        - never
        - identitygroup
