---
# Sample playbook for cisco.ise.stop_replication (cisco.ise 3.3.0)
# Build order: 50
# Resource module for Stop Replication
# Reads ../models/stop_replication.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/stop_replication_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags stop_replication.

- name: "0050 stop_replication"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/stop_replication.yml
  tasks:
    - name: Run stop_replication from its model
      cisco.ise.stop_replication:
        isEnabled: "{{ stop_replication.isEnabled if stop_replication.isEnabled is not none else omit }}"
        ise_client_cert: "{{ stop_replication.ise_client_cert if stop_replication.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ stop_replication.ise_client_key if stop_replication.ise_client_key is not none else omit }}"
        ise_debug: "{{ stop_replication.ise_debug if stop_replication.ise_debug is not none else omit }}"
        ise_hostname: "{{ stop_replication.ise_hostname if stop_replication.ise_hostname is not none else omit }}"
        ise_password: "{{ stop_replication.ise_password if stop_replication.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ stop_replication.ise_single_request_timeout if stop_replication.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ stop_replication.ise_username if stop_replication.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ stop_replication.ise_uses_api_gateway if stop_replication.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ stop_replication.ise_uses_csrf_token if stop_replication.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ stop_replication.ise_verify if stop_replication.ise_verify is not none else omit }}"
        ise_version: "{{ stop_replication.ise_version if stop_replication.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ stop_replication.ise_wait_on_rate_limit if stop_replication.ise_wait_on_rate_limit is not none else omit }}"
      register: stop_replication_result
      tags:
        - never
        - stop_replication
