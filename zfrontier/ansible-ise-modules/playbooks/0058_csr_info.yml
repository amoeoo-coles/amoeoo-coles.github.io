---
# Sample playbook for cisco.ise.csr_info (cisco.ise 3.3.0)
# Build order: 58
# Information module for CSR
# Reads ../models/csr_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/csr_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0058 csr_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/csr_info.yml
  tasks:
    - name: Run csr_info from its model
      cisco.ise.csr_info:
        filter: "{{ csr_info.filter if csr_info.filter is not none else omit }}"
        filterType: "{{ csr_info.filterType if csr_info.filterType is not none else omit }}"
        hostName: "{{ csr_info.hostName if csr_info.hostName is not none else omit }}"
        id: "{{ csr_info.id if csr_info.id is not none else omit }}"
        ise_client_cert: "{{ csr_info.ise_client_cert if csr_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ csr_info.ise_client_key if csr_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ csr_info.ise_debug if csr_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ csr_info.ise_hostname if csr_info.ise_hostname is not none else omit }}"
        ise_password: "{{ csr_info.ise_password if csr_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ csr_info.ise_single_request_timeout if csr_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ csr_info.ise_username if csr_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ csr_info.ise_uses_api_gateway if csr_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ csr_info.ise_uses_csrf_token if csr_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ csr_info.ise_verify if csr_info.ise_verify is not none else omit }}"
        ise_version: "{{ csr_info.ise_version if csr_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ csr_info.ise_wait_on_rate_limit if csr_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ csr_info.page if csr_info.page is not none else omit }}"
        size: "{{ csr_info.size if csr_info.size is not none else omit }}"
        sort: "{{ csr_info.sort if csr_info.sort is not none else omit }}"
        sortBy: "{{ csr_info.sortBy if csr_info.sortBy is not none else omit }}"
      register: csr_info_result
