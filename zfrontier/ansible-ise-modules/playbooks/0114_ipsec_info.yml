---
# Sample playbook for cisco.ise.ipsec_info (cisco.ise 3.3.0)
# Build order: 114
# Information module for Ipsec Info
# Reads ../models/ipsec_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ipsec_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0114 ipsec_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipsec_info.yml
  tasks:
    - name: Run ipsec_info from its model
      cisco.ise.ipsec_info:
        filter: "{{ ipsec_info.filter if ipsec_info.filter is not none else omit }}"
        filterType: "{{ ipsec_info.filterType if ipsec_info.filterType is not none else omit }}"
        hostName: "{{ ipsec_info.hostName if ipsec_info.hostName is not none else omit }}"
        ise_client_cert: "{{ ipsec_info.ise_client_cert if ipsec_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ ipsec_info.ise_client_key if ipsec_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ ipsec_info.ise_debug if ipsec_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ ipsec_info.ise_hostname if ipsec_info.ise_hostname is not none else omit }}"
        ise_password: "{{ ipsec_info.ise_password if ipsec_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ ipsec_info.ise_single_request_timeout if ipsec_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ ipsec_info.ise_username if ipsec_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ ipsec_info.ise_uses_api_gateway if ipsec_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ ipsec_info.ise_uses_csrf_token if ipsec_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ ipsec_info.ise_verify if ipsec_info.ise_verify is not none else omit }}"
        ise_version: "{{ ipsec_info.ise_version if ipsec_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ ipsec_info.ise_wait_on_rate_limit if ipsec_info.ise_wait_on_rate_limit is not none else omit }}"
        nadIp: "{{ ipsec_info.nadIp if ipsec_info.nadIp is not none else omit }}"
        page: "{{ ipsec_info.page if ipsec_info.page is not none else omit }}"
        size: "{{ ipsec_info.size if ipsec_info.size is not none else omit }}"
        sort: "{{ ipsec_info.sort if ipsec_info.sort is not none else omit }}"
        sortBy: "{{ ipsec_info.sortBy if ipsec_info.sortBy is not none else omit }}"
      register: ipsec_info_result
