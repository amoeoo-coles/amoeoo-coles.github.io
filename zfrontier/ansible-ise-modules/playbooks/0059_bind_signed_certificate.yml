---
# Sample playbook for cisco.ise.bind_signed_certificate (cisco.ise 3.3.0)
# Build order: 59
# Resource module for Bind Signed Certificate
# Reads ../models/bind_signed_certificate.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/bind_signed_certificate_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags bind_signed_certificate.

- name: "0059 bind_signed_certificate"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/bind_signed_certificate.yml
  tasks:
    - name: Run bind_signed_certificate from its model
      cisco.ise.bind_signed_certificate:
        admin: "{{ bind_signed_certificate.admin if bind_signed_certificate.admin is not none else omit }}"
        allowExtendedValidity: "{{ bind_signed_certificate.allowExtendedValidity if bind_signed_certificate.allowExtendedValidity is not none else omit }}"
        allowOutOfDateCert: "{{ bind_signed_certificate.allowOutOfDateCert if bind_signed_certificate.allowOutOfDateCert is not none else omit }}"
        allowReplacementOfCertificates: "{{ bind_signed_certificate.allowReplacementOfCertificates if bind_signed_certificate.allowReplacementOfCertificates is not none else omit }}"
        allowReplacementOfPortalGroupTag: "{{ bind_signed_certificate.allowReplacementOfPortalGroupTag if bind_signed_certificate.allowReplacementOfPortalGroupTag is not none else omit }}"
        data: "{{ bind_signed_certificate.data if bind_signed_certificate.data is not none else omit }}"
        eap: "{{ bind_signed_certificate.eap if bind_signed_certificate.eap is not none else omit }}"
        hostName: "{{ bind_signed_certificate.hostName if bind_signed_certificate.hostName is not none else omit }}"
        id: "{{ bind_signed_certificate.id if bind_signed_certificate.id is not none else omit }}"
        ims: "{{ bind_signed_certificate.ims if bind_signed_certificate.ims is not none else omit }}"
        ise_client_cert: "{{ bind_signed_certificate.ise_client_cert if bind_signed_certificate.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ bind_signed_certificate.ise_client_key if bind_signed_certificate.ise_client_key is not none else omit }}"
        ise_debug: "{{ bind_signed_certificate.ise_debug if bind_signed_certificate.ise_debug is not none else omit }}"
        ise_hostname: "{{ bind_signed_certificate.ise_hostname if bind_signed_certificate.ise_hostname is not none else omit }}"
        ise_password: "{{ bind_signed_certificate.ise_password if bind_signed_certificate.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ bind_signed_certificate.ise_single_request_timeout if bind_signed_certificate.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ bind_signed_certificate.ise_username if bind_signed_certificate.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ bind_signed_certificate.ise_uses_api_gateway if bind_signed_certificate.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ bind_signed_certificate.ise_uses_csrf_token if bind_signed_certificate.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ bind_signed_certificate.ise_verify if bind_signed_certificate.ise_verify is not none else omit }}"
        ise_version: "{{ bind_signed_certificate.ise_version if bind_signed_certificate.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ bind_signed_certificate.ise_wait_on_rate_limit if bind_signed_certificate.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ bind_signed_certificate.name if bind_signed_certificate.name is not none else omit }}"
        portal: "{{ bind_signed_certificate.portal if bind_signed_certificate.portal is not none else omit }}"
        portalGroupTag: "{{ bind_signed_certificate.portalGroupTag if bind_signed_certificate.portalGroupTag is not none else omit }}"
        pxgrid: "{{ bind_signed_certificate.pxgrid if bind_signed_certificate.pxgrid is not none else omit }}"
        radius: "{{ bind_signed_certificate.radius if bind_signed_certificate.radius is not none else omit }}"
        saml: "{{ bind_signed_certificate.saml if bind_signed_certificate.saml is not none else omit }}"
        validateCertificateExtensions: "{{ bind_signed_certificate.validateCertificateExtensions if bind_signed_certificate.validateCertificateExtensions is not none else omit }}"
      register: bind_signed_certificate_result
      tags:
        - never
        - bind_signed_certificate
