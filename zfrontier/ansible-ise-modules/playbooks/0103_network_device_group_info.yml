        ise_password: "{{ network_device_group_info.ise_password if network_device_group_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ network_device_group_info.ise_single_request_timeout if network_device_group_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ network_device_group_info.ise_username if network_device_group_info.ise_username is not none else omit }}"
