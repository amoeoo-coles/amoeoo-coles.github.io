---
# Sample playbook for cisco.ise.my_device_portal_info (cisco.ise 3.3.0)
# Build order: 203
# Information module for Mydeviceportal
# Reads ../models/my_device_portal_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/my_device_portal_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0203 my_device_portal_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/my_device_portal_info.yml
  tasks:
    - name: Run my_device_portal_info from its model
      cisco.ise.my_device_portal_info:
        filter: "{{ my_device_portal_info.filter if my_device_portal_info.filter is not none else omit }}"
        filterType: "{{ my_device_portal_info.filterType if my_device_portal_info.filterType is not none else omit }}"
        id: "{{ my_device_portal_info.id if my_device_portal_info.id is not none else omit }}"
        ise_client_cert: "{{ my_device_portal_info.ise_client_cert if my_device_portal_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ my_device_portal_info.ise_client_key if my_device_portal_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ my_device_portal_info.ise_debug if my_device_portal_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ my_device_portal_info.ise_hostname if my_device_portal_info.ise_hostname is not none else omit }}"
        ise_password: "{{ my_device_portal_info.ise_password if my_device_portal_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ my_device_portal_info.ise_single_request_timeout if my_device_portal_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ my_device_portal_info.ise_username if my_device_portal_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ my_device_portal_info.ise_uses_api_gateway if my_device_portal_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ my_device_portal_info.ise_uses_csrf_token if my_device_portal_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ my_device_portal_info.ise_verify if my_device_portal_info.ise_verify is not none else omit }}"
        ise_version: "{{ my_device_portal_info.ise_version if my_device_portal_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ my_device_portal_info.ise_wait_on_rate_limit if my_device_portal_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ my_device_portal_info.name if my_device_portal_info.name is not none else omit }}"
        page: "{{ my_device_portal_info.page if my_device_portal_info.page is not none else omit }}"
        size: "{{ my_device_portal_info.size if my_device_portal_info.size is not none else omit }}"
        sortasc: "{{ my_device_portal_info.sortasc if my_device_portal_info.sortasc is not none else omit }}"
        sortdsc: "{{ my_device_portal_info.sortdsc if my_device_portal_info.sortdsc is not none else omit }}"
      register: my_device_portal_info_result
