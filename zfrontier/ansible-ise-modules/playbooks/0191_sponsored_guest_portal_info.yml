---
# Sample playbook for cisco.ise.sponsored_guest_portal_info (cisco.ise 3.3.0)
# Build order: 191
# Information module for Sponsoredguestportal
# Reads ../models/sponsored_guest_portal_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sponsored_guest_portal_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0191 sponsored_guest_portal_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sponsored_guest_portal_info.yml
  tasks:
    - name: Run sponsored_guest_portal_info from its model
      cisco.ise.sponsored_guest_portal_info:
        filter: "{{ sponsored_guest_portal_info.filter if sponsored_guest_portal_info.filter is not none else omit }}"
        filterType: "{{ sponsored_guest_portal_info.filterType if sponsored_guest_portal_info.filterType is not none else omit }}"
        id: "{{ sponsored_guest_portal_info.id if sponsored_guest_portal_info.id is not none else omit }}"
        ise_client_cert: "{{ sponsored_guest_portal_info.ise_client_cert if sponsored_guest_portal_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sponsored_guest_portal_info.ise_client_key if sponsored_guest_portal_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sponsored_guest_portal_info.ise_debug if sponsored_guest_portal_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sponsored_guest_portal_info.ise_hostname if sponsored_guest_portal_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sponsored_guest_portal_info.ise_password if sponsored_guest_portal_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sponsored_guest_portal_info.ise_single_request_timeout if sponsored_guest_portal_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sponsored_guest_portal_info.ise_username if sponsored_guest_portal_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sponsored_guest_portal_info.ise_uses_api_gateway if sponsored_guest_portal_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sponsored_guest_portal_info.ise_uses_csrf_token if sponsored_guest_portal_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sponsored_guest_portal_info.ise_verify if sponsored_guest_portal_info.ise_verify is not none else omit }}"
        ise_version: "{{ sponsored_guest_portal_info.ise_version if sponsored_guest_portal_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sponsored_guest_portal_info.ise_wait_on_rate_limit if sponsored_guest_portal_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sponsored_guest_portal_info.name if sponsored_guest_portal_info.name is not none else omit }}"
        page: "{{ sponsored_guest_portal_info.page if sponsored_guest_portal_info.page is not none else omit }}"
        size: "{{ sponsored_guest_portal_info.size if sponsored_guest_portal_info.size is not none else omit }}"
        sortasc: "{{ sponsored_guest_portal_info.sortasc if sponsored_guest_portal_info.sortasc is not none else omit }}"
        sortdsc: "{{ sponsored_guest_portal_info.sortdsc if sponsored_guest_portal_info.sortdsc is not none else omit }}"
      register: sponsored_guest_portal_info_result
