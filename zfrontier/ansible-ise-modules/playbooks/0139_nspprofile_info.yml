---
# Sample playbook for cisco.ise.nspprofile_info (cisco.ise 3.3.0)
# Build order: 139
# Information module for Nspprofile
# Reads ../models/nspprofile_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/nspprofile_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0139 nspprofile_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/nspprofile_info.yml
  tasks:
    - name: Run nspprofile_info from its model
      cisco.ise.nspprofile_info:
        filterType: "{{ nspprofile_info.filterType if nspprofile_info.filterType is not none else omit }}"
        ise_client_cert: "{{ nspprofile_info.ise_client_cert if nspprofile_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ nspprofile_info.ise_client_key if nspprofile_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ nspprofile_info.ise_debug if nspprofile_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ nspprofile_info.ise_hostname if nspprofile_info.ise_hostname is not none else omit }}"
        ise_password: "{{ nspprofile_info.ise_password if nspprofile_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ nspprofile_info.ise_single_request_timeout if nspprofile_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ nspprofile_info.ise_username if nspprofile_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ nspprofile_info.ise_uses_api_gateway if nspprofile_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ nspprofile_info.ise_uses_csrf_token if nspprofile_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ nspprofile_info.ise_verify if nspprofile_info.ise_verify is not none else omit }}"
        ise_version: "{{ nspprofile_info.ise_version if nspprofile_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ nspprofile_info.ise_wait_on_rate_limit if nspprofile_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ nspprofile_info.page if nspprofile_info.page is not none else omit }}"
        size: "{{ nspprofile_info.size if nspprofile_info.size is not none else omit }}"
      register: nspprofile_info_result
