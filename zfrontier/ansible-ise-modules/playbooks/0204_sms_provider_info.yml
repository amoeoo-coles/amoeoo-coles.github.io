---
# Sample playbook for cisco.ise.sms_provider_info (cisco.ise 3.3.0)
# Build order: 204
# Information module for SMSprovider
# Reads ../models/sms_provider_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sms_provider_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0204 sms_provider_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sms_provider_info.yml
  tasks:
    - name: Run sms_provider_info from its model
      cisco.ise.sms_provider_info:
        filter: "{{ sms_provider_info.filter if sms_provider_info.filter is not none else omit }}"
        filterType: "{{ sms_provider_info.filterType if sms_provider_info.filterType is not none else omit }}"
        id: "{{ sms_provider_info.id if sms_provider_info.id is not none else omit }}"
        ise_client_cert: "{{ sms_provider_info.ise_client_cert if sms_provider_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sms_provider_info.ise_client_key if sms_provider_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sms_provider_info.ise_debug if sms_provider_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sms_provider_info.ise_hostname if sms_provider_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sms_provider_info.ise_password if sms_provider_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sms_provider_info.ise_single_request_timeout if sms_provider_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sms_provider_info.ise_username if sms_provider_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sms_provider_info.ise_uses_api_gateway if sms_provider_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sms_provider_info.ise_uses_csrf_token if sms_provider_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sms_provider_info.ise_verify if sms_provider_info.ise_verify is not none else omit }}"
        ise_version: "{{ sms_provider_info.ise_version if sms_provider_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sms_provider_info.ise_wait_on_rate_limit if sms_provider_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ sms_provider_info.name if sms_provider_info.name is not none else omit }}"
        page: "{{ sms_provider_info.page if sms_provider_info.page is not none else omit }}"
        size: "{{ sms_provider_info.size if sms_provider_info.size is not none else omit }}"
        sortasc: "{{ sms_provider_info.sortasc if sms_provider_info.sortasc is not none else omit }}"
        sortdsc: "{{ sms_provider_info.sortdsc if sms_provider_info.sortdsc is not none else omit }}"
      register: sms_provider_info_result
