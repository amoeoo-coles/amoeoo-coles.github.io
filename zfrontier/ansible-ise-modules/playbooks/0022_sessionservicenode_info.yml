---
# Sample playbook for cisco.ise.sessionservicenode_info (cisco.ise 3.3.0)
# Build order: 22
# Information module for Sessionservicenode
# Reads ../models/sessionservicenode_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sessionservicenode_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0022 sessionservicenode_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sessionservicenode_info.yml
  tasks:
    - name: Run sessionservicenode_info from its model
      cisco.ise.sessionservicenode_info:
        filterType: "{{ sessionservicenode_info.filterType if sessionservicenode_info.filterType is not none else omit }}"
        ise_client_cert: "{{ sessionservicenode_info.ise_client_cert if sessionservicenode_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ sessionservicenode_info.ise_client_key if sessionservicenode_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ sessionservicenode_info.ise_debug if sessionservicenode_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ sessionservicenode_info.ise_hostname if sessionservicenode_info.ise_hostname is not none else omit }}"
        ise_password: "{{ sessionservicenode_info.ise_password if sessionservicenode_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ sessionservicenode_info.ise_single_request_timeout if sessionservicenode_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ sessionservicenode_info.ise_username if sessionservicenode_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ sessionservicenode_info.ise_uses_api_gateway if sessionservicenode_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ sessionservicenode_info.ise_uses_csrf_token if sessionservicenode_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ sessionservicenode_info.ise_verify if sessionservicenode_info.ise_verify is not none else omit }}"
        ise_version: "{{ sessionservicenode_info.ise_version if sessionservicenode_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ sessionservicenode_info.ise_wait_on_rate_limit if sessionservicenode_info.ise_wait_on_rate_limit is not none else omit }}"
        page: "{{ sessionservicenode_info.page if sessionservicenode_info.page is not none else omit }}"
        size: "{{ sessionservicenode_info.size if sessionservicenode_info.size is not none else omit }}"
      register: sessionservicenode_info_result
