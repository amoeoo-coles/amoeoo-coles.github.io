---
# Sample playbook for cisco.ise.admin_user_info (cisco.ise 3.3.0)
# Build order: 101
# Information module for Adminuser
# Reads ../models/admin_user_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/admin_user_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0101 admin_user_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/admin_user_info.yml
  tasks:
    - name: Run admin_user_info from its model
      cisco.ise.admin_user_info:
        filter: "{{ admin_user_info.filter if admin_user_info.filter is not none else omit }}"
        filterType: "{{ admin_user_info.filterType if admin_user_info.filterType is not none else omit }}"
        id: "{{ admin_user_info.id if admin_user_info.id is not none else omit }}"
        ise_client_cert: "{{ admin_user_info.ise_client_cert if admin_user_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ admin_user_info.ise_client_key if admin_user_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ admin_user_info.ise_debug if admin_user_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ admin_user_info.ise_hostname if admin_user_info.ise_hostname is not none else omit }}"
        ise_password: "{{ admin_user_info.ise_password if admin_user_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ admin_user_info.ise_single_request_timeout if admin_user_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ admin_user_info.ise_username if admin_user_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ admin_user_info.ise_uses_api_gateway if admin_user_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ admin_user_info.ise_uses_csrf_token if admin_user_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ admin_user_info.ise_verify if admin_user_info.ise_verify is not none else omit }}"
        ise_version: "{{ admin_user_info.ise_version if admin_user_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ admin_user_info.ise_wait_on_rate_limit if admin_user_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ admin_user_info.name if admin_user_info.name is not none else omit }}"
        page: "{{ admin_user_info.page if admin_user_info.page is not none else omit }}"
        size: "{{ admin_user_info.size if admin_user_info.size is not none else omit }}"
        sortasc: "{{ admin_user_info.sortasc if admin_user_info.sortasc is not none else omit }}"
        sortdsc: "{{ admin_user_info.sortdsc if admin_user_info.sortdsc is not none else omit }}"
      register: admin_user_info_result
