---
# Sample playbook for cisco.ise.authorization_profile_info (cisco.ise 3.3.0)
# Build order: 120
# Information module for Authorizationprofile
# Reads ../models/authorization_profile_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/authorization_profile_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0120 authorization_profile_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/authorization_profile_info.yml
  tasks:
    - name: Run authorization_profile_info from its model
      cisco.ise.authorization_profile_info:
        filterType: "{{ authorization_profile_info.filterType if authorization_profile_info.filterType is not none else omit }}"
        id: "{{ authorization_profile_info.id if authorization_profile_info.id is not none else omit }}"
        ise_client_cert: "{{ authorization_profile_info.ise_client_cert if authorization_profile_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ authorization_profile_info.ise_client_key if authorization_profile_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ authorization_profile_info.ise_debug if authorization_profile_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ authorization_profile_info.ise_hostname if authorization_profile_info.ise_hostname is not none else omit }}"
        ise_password: "{{ authorization_profile_info.ise_password if authorization_profile_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ authorization_profile_info.ise_single_request_timeout if authorization_profile_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ authorization_profile_info.ise_username if authorization_profile_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ authorization_profile_info.ise_uses_api_gateway if authorization_profile_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ authorization_profile_info.ise_uses_csrf_token if authorization_profile_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ authorization_profile_info.ise_verify if authorization_profile_info.ise_verify is not none else omit }}"
        ise_version: "{{ authorization_profile_info.ise_version if authorization_profile_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ authorization_profile_info.ise_wait_on_rate_limit if authorization_profile_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ authorization_profile_info.name if authorization_profile_info.name is not none else omit }}"
        page: "{{ authorization_profile_info.page if authorization_profile_info.page is not none else omit }}"
        size: "{{ authorization_profile_info.size if authorization_profile_info.size is not none else omit }}"
      register: authorization_profile_info_result
