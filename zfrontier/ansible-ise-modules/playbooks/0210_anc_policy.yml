---
# Sample playbook for cisco.ise.anc_policy (cisco.ise 3.3.0)
# Build order: 210
# Resource module for ANCpolicy
# Reads ../models/anc_policy.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/anc_policy_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags anc_policy.

- name: "0210 anc_policy"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/anc_policy.yml
  tasks:
    - name: Run anc_policy from its model
      cisco.ise.anc_policy:
        actions: "{{ (anc_policy.actions | cat_strip_nulls) if (anc_policy.actions | cat_strip_nulls) is not none else omit }}"
        description: "{{ anc_policy.description if anc_policy.description is not none else omit }}"
        id: "{{ anc_policy.id if anc_policy.id is not none else omit }}"
        ise_client_cert: "{{ anc_policy.ise_client_cert if anc_policy.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ anc_policy.ise_client_key if anc_policy.ise_client_key is not none else omit }}"
        ise_debug: "{{ anc_policy.ise_debug if anc_policy.ise_debug is not none else omit }}"
        ise_hostname: "{{ anc_policy.ise_hostname if anc_policy.ise_hostname is not none else omit }}"
        ise_password: "{{ anc_policy.ise_password if anc_policy.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ anc_policy.ise_single_request_timeout if anc_policy.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ anc_policy.ise_username if anc_policy.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ anc_policy.ise_uses_api_gateway if anc_policy.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ anc_policy.ise_uses_csrf_token if anc_policy.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ anc_policy.ise_verify if anc_policy.ise_verify is not none else omit }}"
        ise_version: "{{ anc_policy.ise_version if anc_policy.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ anc_policy.ise_wait_on_rate_limit if anc_policy.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ anc_policy.name if anc_policy.name is not none else omit }}"
      register: anc_policy_result
      tags:
        - never
        - anc_policy
