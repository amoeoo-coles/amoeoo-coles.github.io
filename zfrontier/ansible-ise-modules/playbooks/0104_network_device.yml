---
# Sample playbook for cisco.ise.network_device (cisco.ise 3.3.0)
# Build order: 104
# Resource module for Networkdevice
# Reads ../models/network_device.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/network_device_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device.

- name: "0104 network_device"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device.yml
  tasks:
    - name: Run network_device from its model
      cisco.ise.network_device:
        NetworkDeviceGroupList: "{{ (network_device.NetworkDeviceGroupList | cat_strip_nulls) if (network_device.NetworkDeviceGroupList | cat_strip_nulls) is not none else omit }}"
        NetworkDeviceIPList: "{{ (network_device.NetworkDeviceIPList | cat_strip_nulls) if (network_device.NetworkDeviceIPList | cat_strip_nulls) is not none else omit }}"
        authenticationSettings: "{{ (network_device.authenticationSettings | cat_strip_nulls) if (network_device.authenticationSettings | cat_strip_nulls) is not none else omit }}"
        coaPort: "{{ network_device.coaPort if network_device.coaPort is not none else omit }}"
        description: "{{ network_device.description if network_device.description is not none else omit }}"
        dtlsDnsName: "{{ network_device.dtlsDnsName if network_device.dtlsDnsName is not none else omit }}"
        id: "{{ network_device.id if network_device.id is not none else omit }}"
        ise_client_cert: "{{ network_device.ise_client_cert if network_device.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ network_device.ise_client_key if network_device.ise_client_key is not none else omit }}"
        ise_debug: "{{ network_device.ise_debug if network_device.ise_debug is not none else omit }}"
        ise_hostname: "{{ network_device.ise_hostname if network_device.ise_hostname is not none else omit }}"
        ise_password: "{{ network_device.ise_password if network_device.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ network_device.ise_single_request_timeout if network_device.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ network_device.ise_username if network_device.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ network_device.ise_uses_api_gateway if network_device.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ network_device.ise_uses_csrf_token if network_device.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ network_device.ise_verify if network_device.ise_verify is not none else omit }}"
        ise_version: "{{ network_device.ise_version if network_device.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ network_device.ise_wait_on_rate_limit if network_device.ise_wait_on_rate_limit is not none else omit }}"
        modelName: "{{ network_device.modelName if network_device.modelName is not none else omit }}"
        name: "{{ network_device.name if network_device.name is not none else omit }}"
        profileName: "{{ network_device.profileName if network_device.profileName is not none else omit }}"
        snmpsettings: "{{ (network_device.snmpsettings | cat_strip_nulls) if (network_device.snmpsettings | cat_strip_nulls) is not none else omit }}"
        softwareVersion: "{{ network_device.softwareVersion if network_device.softwareVersion is not none else omit }}"
        tacacsSettings: "{{ (network_device.tacacsSettings | cat_strip_nulls) if (network_device.tacacsSettings | cat_strip_nulls) is not none else omit }}"
        tacacsTlsSettings: "{{ (network_device.tacacsTlsSettings | cat_strip_nulls) if (network_device.tacacsTlsSettings | cat_strip_nulls) is not none else omit }}"
        trustsecsettings: "{{ (network_device.trustsecsettings | cat_strip_nulls) if (network_device.trustsecsettings | cat_strip_nulls) is not none else omit }}"
      register: network_device_result
      tags:
        - never
        - network_device
