---
# Sample playbook for cisco.ise.repository (cisco.ise 3.3.0)
# Build order: 32
# Resource module for Repository
# Reads ../models/repository.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/repository_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags repository.

- name: "0032 repository"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/repository.yml
  tasks:
    - name: Run repository from its model
      cisco.ise.repository:
        enablePki: "{{ repository.enablePki if repository.enablePki is not none else omit }}"
        ise_client_cert: "{{ repository.ise_client_cert if repository.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ repository.ise_client_key if repository.ise_client_key is not none else omit }}"
        ise_debug: "{{ repository.ise_debug if repository.ise_debug is not none else omit }}"
        ise_hostname: "{{ repository.ise_hostname if repository.ise_hostname is not none else omit }}"
        ise_password: "{{ repository.ise_password if repository.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ repository.ise_single_request_timeout if repository.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ repository.ise_username if repository.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ repository.ise_uses_api_gateway if repository.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ repository.ise_uses_csrf_token if repository.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ repository.ise_verify if repository.ise_verify is not none else omit }}"
        ise_version: "{{ repository.ise_version if repository.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ repository.ise_wait_on_rate_limit if repository.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ repository.name if repository.name is not none else omit }}"
        password: "{{ repository.password if repository.password is not none else omit }}"
        path: "{{ repository.path if repository.path is not none else omit }}"
        protocol: "{{ repository.protocol if repository.protocol is not none else omit }}"
        repositoryName: "{{ repository.repositoryName if repository.repositoryName is not none else omit }}"
        serverName: "{{ repository.serverName if repository.serverName is not none else omit }}"
        userName: "{{ repository.userName if repository.userName is not none else omit }}"
      register: repository_result
      tags:
        - never
        - repository
