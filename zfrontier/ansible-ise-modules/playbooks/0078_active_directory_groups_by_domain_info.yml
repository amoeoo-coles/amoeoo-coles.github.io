---
# Sample playbook for cisco.ise.active_directory_groups_by_domain_info (cisco.ise 3.3.0)
# Build order: 78
# Information module for Active Directory Groups By Domain
# Reads ../models/active_directory_groups_by_domain_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/active_directory_groups_by_domain_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0078 active_directory_groups_by_domain_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/active_directory_groups_by_domain_info.yml
  tasks:
    - name: Run active_directory_groups_by_domain_info from its model
      cisco.ise.active_directory_groups_by_domain_info:
        additionalData: "{{ (active_directory_groups_by_domain_info.additionalData | cat_strip_nulls) if (active_directory_groups_by_domain_info.additionalData | cat_strip_nulls) is not none else omit }}"
        id: "{{ active_directory_groups_by_domain_info.id if active_directory_groups_by_domain_info.id is not none else omit }}"
        ise_client_cert: "{{ active_directory_groups_by_domain_info.ise_client_cert if active_directory_groups_by_domain_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ active_directory_groups_by_domain_info.ise_client_key if active_directory_groups_by_domain_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ active_directory_groups_by_domain_info.ise_debug if active_directory_groups_by_domain_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ active_directory_groups_by_domain_info.ise_hostname if active_directory_groups_by_domain_info.ise_hostname is not none else omit }}"
        ise_password: "{{ active_directory_groups_by_domain_info.ise_password if active_directory_groups_by_domain_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ active_directory_groups_by_domain_info.ise_single_request_timeout if active_directory_groups_by_domain_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ active_directory_groups_by_domain_info.ise_username if active_directory_groups_by_domain_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ active_directory_groups_by_domain_info.ise_uses_api_gateway if active_directory_groups_by_domain_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ active_directory_groups_by_domain_info.ise_uses_csrf_token if active_directory_groups_by_domain_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ active_directory_groups_by_domain_info.ise_verify if active_directory_groups_by_domain_info.ise_verify is not none else omit }}"
        ise_version: "{{ active_directory_groups_by_domain_info.ise_version if active_directory_groups_by_domain_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ active_directory_groups_by_domain_info.ise_wait_on_rate_limit if active_directory_groups_by_domain_info.ise_wait_on_rate_limit is not none else omit }}"
      register: active_directory_groups_by_domain_info_result
