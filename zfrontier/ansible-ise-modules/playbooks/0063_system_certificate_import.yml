---
# Sample playbook for cisco.ise.system_certificate_import (cisco.ise 3.3.0)
# Build order: 63
# Resource module for System Certificate Import
# Reads ../models/system_certificate_import.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/system_certificate_import_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags system_certificate_import.

- name: "0063 system_certificate_import"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_certificate_import.yml
  tasks:
    - name: Run system_certificate_import from its model
      cisco.ise.system_certificate_import:
        admin: "{{ system_certificate_import.admin if system_certificate_import.admin is not none else omit }}"
        allowExtendedValidity: "{{ system_certificate_import.allowExtendedValidity if system_certificate_import.allowExtendedValidity is not none else omit }}"
        allowOutOfDateCert: "{{ system_certificate_import.allowOutOfDateCert if system_certificate_import.allowOutOfDateCert is not none else omit }}"
        allowPortalTagTransferForSameSubject: "{{ system_certificate_import.allowPortalTagTransferForSameSubject if system_certificate_import.allowPortalTagTransferForSameSubject is not none else omit }}"
        allowReplacementOfCertificates: "{{ system_certificate_import.allowReplacementOfCertificates if system_certificate_import.allowReplacementOfCertificates is not none else omit }}"
        allowReplacementOfPortalGroupTag: "{{ system_certificate_import.allowReplacementOfPortalGroupTag if system_certificate_import.allowReplacementOfPortalGroupTag is not none else omit }}"
        allowRoleTransferForSameSubject: "{{ system_certificate_import.allowRoleTransferForSameSubject if system_certificate_import.allowRoleTransferForSameSubject is not none else omit }}"
        allowSHA1Certificates: "{{ system_certificate_import.allowSHA1Certificates if system_certificate_import.allowSHA1Certificates is not none else omit }}"
        allowWildCardCertificates: "{{ system_certificate_import.allowWildCardCertificates if system_certificate_import.allowWildCardCertificates is not none else omit }}"
        data: "{{ system_certificate_import.data if system_certificate_import.data is not none else omit }}"
        eap: "{{ system_certificate_import.eap if system_certificate_import.eap is not none else omit }}"
        ims: "{{ system_certificate_import.ims if system_certificate_import.ims is not none else omit }}"
        ise_client_cert: "{{ system_certificate_import.ise_client_cert if system_certificate_import.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ system_certificate_import.ise_client_key if system_certificate_import.ise_client_key is not none else omit }}"
        ise_debug: "{{ system_certificate_import.ise_debug if system_certificate_import.ise_debug is not none else omit }}"
        ise_hostname: "{{ system_certificate_import.ise_hostname if system_certificate_import.ise_hostname is not none else omit }}"
        ise_password: "{{ system_certificate_import.ise_password if system_certificate_import.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ system_certificate_import.ise_single_request_timeout if system_certificate_import.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ system_certificate_import.ise_username if system_certificate_import.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ system_certificate_import.ise_uses_api_gateway if system_certificate_import.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ system_certificate_import.ise_uses_csrf_token if system_certificate_import.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ system_certificate_import.ise_verify if system_certificate_import.ise_verify is not none else omit }}"
        ise_version: "{{ system_certificate_import.ise_version if system_certificate_import.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ system_certificate_import.ise_wait_on_rate_limit if system_certificate_import.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ system_certificate_import.name if system_certificate_import.name is not none else omit }}"
        password: "{{ system_certificate_import.password if system_certificate_import.password is not none else omit }}"
        portal: "{{ system_certificate_import.portal if system_certificate_import.portal is not none else omit }}"
        portalGroupTag: "{{ system_certificate_import.portalGroupTag if system_certificate_import.portalGroupTag is not none else omit }}"
        privateKeyData: "{{ system_certificate_import.privateKeyData if system_certificate_import.privateKeyData is not none else omit }}"
        pxgrid: "{{ system_certificate_import.pxgrid if system_certificate_import.pxgrid is not none else omit }}"
        radius: "{{ system_certificate_import.radius if system_certificate_import.radius is not none else omit }}"
        saml: "{{ system_certificate_import.saml if system_certificate_import.saml is not none else omit }}"
        validateCertificateExtensions: "{{ system_certificate_import.validateCertificateExtensions if system_certificate_import.validateCertificateExtensions is not none else omit }}"
      register: system_certificate_import_result
      tags:
        - never
        - system_certificate_import
