---
# Sample playbook for cisco.ise.ise_root_ca_regenerate (cisco.ise 3.3.0)
# Build order: 73
# Resource module for Ise Root CA Regenerate
# Reads ../models/ise_root_ca_regenerate.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ise_root_ca_regenerate_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags ise_root_ca_regenerate.

- name: "0073 ise_root_ca_regenerate"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ise_root_ca_regenerate.yml
  tasks:
    - name: Run ise_root_ca_regenerate from its model
      cisco.ise.ise_root_ca_regenerate:
        ise_client_cert: "{{ ise_root_ca_regenerate.ise_client_cert if ise_root_ca_regenerate.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ ise_root_ca_regenerate.ise_client_key if ise_root_ca_regenerate.ise_client_key is not none else omit }}"
        ise_debug: "{{ ise_root_ca_regenerate.ise_debug if ise_root_ca_regenerate.ise_debug is not none else omit }}"
        ise_hostname: "{{ ise_root_ca_regenerate.ise_hostname if ise_root_ca_regenerate.ise_hostname is not none else omit }}"
        ise_password: "{{ ise_root_ca_regenerate.ise_password if ise_root_ca_regenerate.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ ise_root_ca_regenerate.ise_single_request_timeout if ise_root_ca_regenerate.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ ise_root_ca_regenerate.ise_username if ise_root_ca_regenerate.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ ise_root_ca_regenerate.ise_uses_api_gateway if ise_root_ca_regenerate.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ ise_root_ca_regenerate.ise_uses_csrf_token if ise_root_ca_regenerate.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ ise_root_ca_regenerate.ise_verify if ise_root_ca_regenerate.ise_verify is not none else omit }}"
        ise_version: "{{ ise_root_ca_regenerate.ise_version if ise_root_ca_regenerate.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ ise_root_ca_regenerate.ise_wait_on_rate_limit if ise_root_ca_regenerate.ise_wait_on_rate_limit is not none else omit }}"
        removeExistingISEIntermediateCSR: "{{ ise_root_ca_regenerate.removeExistingISEIntermediateCSR if ise_root_ca_regenerate.removeExistingISEIntermediateCSR is not none else omit }}"
      register: ise_root_ca_regenerate_result
      tags:
        - never
        - ise_root_ca_regenerate
