---
# Sample playbook for cisco.ise.egress_matrix_cell (cisco.ise 3.3.0)
# Build order: 153
# Resource module for Egressmatrixcell
# Reads ../models/egress_matrix_cell.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/egress_matrix_cell_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags egress_matrix_cell.

- name: "0153 egress_matrix_cell"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/egress_matrix_cell.yml
  tasks:
    - name: Run egress_matrix_cell from its model
      cisco.ise.egress_matrix_cell:
        defaultRule: "{{ egress_matrix_cell.defaultRule if egress_matrix_cell.defaultRule is not none else omit }}"
        description: "{{ egress_matrix_cell.description if egress_matrix_cell.description is not none else omit }}"
        destinationSGtId: "{{ egress_matrix_cell.destinationSGtId if egress_matrix_cell.destinationSGtId is not none else omit }}"
        id: "{{ egress_matrix_cell.id if egress_matrix_cell.id is not none else omit }}"
        ise_client_cert: "{{ egress_matrix_cell.ise_client_cert if egress_matrix_cell.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ egress_matrix_cell.ise_client_key if egress_matrix_cell.ise_client_key is not none else omit }}"
        ise_debug: "{{ egress_matrix_cell.ise_debug if egress_matrix_cell.ise_debug is not none else omit }}"
        ise_hostname: "{{ egress_matrix_cell.ise_hostname if egress_matrix_cell.ise_hostname is not none else omit }}"
        ise_password: "{{ egress_matrix_cell.ise_password if egress_matrix_cell.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ egress_matrix_cell.ise_single_request_timeout if egress_matrix_cell.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ egress_matrix_cell.ise_username if egress_matrix_cell.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ egress_matrix_cell.ise_uses_api_gateway if egress_matrix_cell.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ egress_matrix_cell.ise_uses_csrf_token if egress_matrix_cell.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ egress_matrix_cell.ise_verify if egress_matrix_cell.ise_verify is not none else omit }}"
        ise_version: "{{ egress_matrix_cell.ise_version if egress_matrix_cell.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ egress_matrix_cell.ise_wait_on_rate_limit if egress_matrix_cell.ise_wait_on_rate_limit is not none else omit }}"
        matrixCellStatus: "{{ egress_matrix_cell.matrixCellStatus if egress_matrix_cell.matrixCellStatus is not none else omit }}"
        matrixId: "{{ egress_matrix_cell.matrixId if egress_matrix_cell.matrixId is not none else omit }}"
        name: "{{ egress_matrix_cell.name if egress_matrix_cell.name is not none else omit }}"
        sgacls: "{{ (egress_matrix_cell.sgacls | cat_strip_nulls) if (egress_matrix_cell.sgacls | cat_strip_nulls) is not none else omit }}"
        sourceSGtId: "{{ egress_matrix_cell.sourceSGtId if egress_matrix_cell.sourceSGtId is not none else omit }}"
      register: egress_matrix_cell_result
      tags:
        - never
        - egress_matrix_cell
