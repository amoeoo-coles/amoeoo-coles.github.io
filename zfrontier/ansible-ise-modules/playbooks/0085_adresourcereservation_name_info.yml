---
# Sample playbook for cisco.ise.adresourcereservation_name_info (cisco.ise 3.3.0)
# Build order: 85
# Information module for Adresourcereservation Name
# Reads ../models/adresourcereservation_name_info.yml (vars_files). Docs: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/adresourcereservation_name_info_module.html
# Connection placeholders come from inventory.yml: {{ ise_hostname }} {{ ise_username }} {{ ise_password }}.

- name: "0085 adresourcereservation_name_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/adresourcereservation_name_info.yml
  tasks:
    - name: Run adresourcereservation_name_info from its model
      cisco.ise.adresourcereservation_name_info:
        ise_client_cert: "{{ adresourcereservation_name_info.ise_client_cert if adresourcereservation_name_info.ise_client_cert is not none else omit }}"
        ise_client_key: "{{ adresourcereservation_name_info.ise_client_key if adresourcereservation_name_info.ise_client_key is not none else omit }}"
        ise_debug: "{{ adresourcereservation_name_info.ise_debug if adresourcereservation_name_info.ise_debug is not none else omit }}"
        ise_hostname: "{{ adresourcereservation_name_info.ise_hostname if adresourcereservation_name_info.ise_hostname is not none else omit }}"
        ise_password: "{{ adresourcereservation_name_info.ise_password if adresourcereservation_name_info.ise_password is not none else omit }}"
        ise_single_request_timeout: "{{ adresourcereservation_name_info.ise_single_request_timeout if adresourcereservation_name_info.ise_single_request_timeout is not none else omit }}"
        ise_username: "{{ adresourcereservation_name_info.ise_username if adresourcereservation_name_info.ise_username is not none else omit }}"
        ise_uses_api_gateway: "{{ adresourcereservation_name_info.ise_uses_api_gateway if adresourcereservation_name_info.ise_uses_api_gateway is not none else omit }}"
        ise_uses_csrf_token: "{{ adresourcereservation_name_info.ise_uses_csrf_token if adresourcereservation_name_info.ise_uses_csrf_token is not none else omit }}"
        ise_verify: "{{ adresourcereservation_name_info.ise_verify if adresourcereservation_name_info.ise_verify is not none else omit }}"
        ise_version: "{{ adresourcereservation_name_info.ise_version if adresourcereservation_name_info.ise_version is not none else omit }}"
        ise_wait_on_rate_limit: "{{ adresourcereservation_name_info.ise_wait_on_rate_limit if adresourcereservation_name_info.ise_wait_on_rate_limit is not none else omit }}"
        name: "{{ adresourcereservation_name_info.name if adresourcereservation_name_info.name is not none else omit }}"
      register: adresourcereservation_name_info_result
