---
# Example inventory for the cisco.ise 3.3.0 catalogue. Placeholders only.
#   ansible-playbook -i inventory.yml site.yml -e ise_hostname=ise.example.net \
#     -e ise_username=admin -e ise_password='***'
all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    ise_hostname: "{{ ise_hostname }}"
    ise_verify: true
    ise_version: "3.3_patch_1"
    ise_debug: false
