---
# Data model for cisco.ise.guest_type (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.guest_type
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/guest_type_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/guest_type.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 179
  group: 8. Guest, sponsor and portals
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

guest_type:
  accessTime:
    allowAccessOnSpecificDaysTimes: false
    dayTimeLimits:
      - days:
          - Sunday
          - Tuesday
        endTime: '16:00'
        startTime: '12:00'
    defaultDuration: 90
    durationTimeUnit: DAYS
    fromFirstLogin: true
    maxAccountDuration: 365
  allowDynamicIdentityGroups: true
  description: Description
  dynamicGroups:
    - endpointIdentityGroupId: generatedID
      externalGroupName: ExternalServerName:GroupName
  expirationNotification:
    advanceNotificationDuration: 3
    advanceNotificationUnits: DAYS
    enableNotification: false
    sendEmailNotification: false
    sendSMSNotification: null
  id: f75760e7-a4f9-40ef-93bb-88a97e9fb171
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  loginOptions:
    allowGuestPortalBypass: false
    failureAction: Disconnect_Oldest_Connection
    identityGroupId: generatedID
    limitSimultaneousLogins: true
    maxRegisteredDevices: 5
    maxSimultaneousLogins: 3
  name: Name
  sponsorGroups:
    - Group1
    - Group2
