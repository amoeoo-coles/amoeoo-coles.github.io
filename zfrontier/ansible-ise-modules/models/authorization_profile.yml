---
# Data model for cisco.ise.authorization_profile (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.authorization_profile
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/authorization_profile_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/authorization_profile.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 119
  group: 5. Policy elements
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

authorization_profile:
  accessType: ACCESS_ACCEPT
  acl: aclfilter
  advancedAttributes:
    - leftHandSideDictionaryAttribue:
        AdvancedAttributeValueType: AdvancedDictionaryAttribute
        attributeName: cisco-call-filter
        dictionaryName: Cisco
      rightHandSideAttribueValue:
        AdvancedAttributeValueType: AttributeValue
        value: '23'
  agentlessPosture: false
  airespaceACL: ACL
  airespaceIPv6ACL: ACL6
  asaVpn: Cisco:cisco-call-type
  authzProfileType: SWITCH
  autoSmartPort: autoSmartPort
  avcProfile: avcProfile
  daclName: PERMIT_ALL_IPV4_TRAFFIC
  description: description
  easywiredSessionCandidate: false
  id: f75760e7-a4f9-40ef-93bb-88a97e9fb171
  interfaceTemplate: interfaceTemplate
  ipv6ACLFilter: ipv6ACLFilter
  ipv6DaclName: PERMIT_ALL_IPV6_TRAFFIC
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  macSecPolicy: MUST_SECURE
  name: name
  neat: false
  profileName: Cisco
  reauth:
    attributeName: null
    connectivity: RADIUS_REQUEST
    dictionaryName: null
    reauthType: TIMER
    timer: 1800
  serviceTemplate: false
  trackMovement: false
  uniqueIdentifier: CERTIFICATE:Subject Alternative Name - URI
  vlan:
    nameID: vlanName
    tagID: 1
  voiceDomainPermission: false
  webAuth: false
  webRedirection:
    ACL: null
    WebRedirectionType: CentralizedWebAuth
    displayCertificatesRenewalMessages: true
    portalName: Sponsored Guest Portal (default)
    staticIPHostNameFQDN: 198.51.100.200
