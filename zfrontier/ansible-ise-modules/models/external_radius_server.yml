# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.external_radius_server
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/external_radius_server_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/external_radius_server.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 93
  group: 3. Identity stores and users
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

external_radius_server:
  accountingPort: 1813
  authenticationPort: 1812
  authenticatorKey: '{{ vault_authenticatorkey }}'
  description: example external radius server
  enableKeyWrap: true
  encryptionKey: '{{ vault_encryptionkey }}'
  hostIP: 192.0.2.1
  id: f75760e7-a4f9-40ef-93bb-88a97e9fb171
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  keyInputFormat: ASCII
  msgAuthIsRequiredOnResponse: true
  name: externalRadiusServer1
  proxyTimeout: 300
  retries: 3
  sharedSecret: '{{ vault_sharedsecret }}'
  timeout: 5
