  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  locations:
    - San Jose
  managePermission: ALLACCOUNTS
  memberGroups:
    - ALL_ACCOUNTS (default)
  name: name
  otherPermissions:
    canAccessViaREST: null
    canApproveSelfregGuests: false
    canDeleteGuestAccounts: false
    canExtendGuestAccounts: false
    canReinstateSuspendedAccounts: false
    canResetGuestPasswords: false
    canSendSMSNotifications: null
    canSuspendGuestAccounts: false
