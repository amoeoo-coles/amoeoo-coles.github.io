  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/sponsor_group_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/sponsor_group.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 185
  group: 8. Guest, sponsor and portals
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

sponsor_group:
  autoNotification: false
  createPermissions:
    canCreateRandomAccounts: true
    canImportMultipleAccounts: true
    canSetFutureStartDate: false
    canSpecifyUsernamePrefix: false
    defaultUsernamePrefix: ''
