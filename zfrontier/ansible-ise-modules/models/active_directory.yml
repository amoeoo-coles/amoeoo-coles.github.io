---
# Data model for cisco.ise.active_directory (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.active_directory
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/active_directory_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/active_directory.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 76
  group: 3. Identity stores and users
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

active_directory:
  ERSActiveDirectoryDomains:
    domains: null
  adAttributes:
    attributes:
      - defaultValue: defaultString
        internalName: internalName1
        name: name1
        type: STRING
      - defaultValue: 192.0.2.1
        internalName: internalName2
        name: name2
        type: IP
      - defaultValue: 'true'
        internalName: internalName3
        name: name3
        type: BOOLEAN
      - defaultValue: '5'
        internalName: internalName4
        name: name4
        type: INT
      - defaultValue: defaultOctetString
        internalName: internalName5
        name: name5
        type: OCTET_STRING
  adScopesNames: Default_Scope
  adgroups:
    groups:
      - name: cisco.com/operators
        sid: S-1-5-32-548
        type: GLOBAL
      - name: cisco.com/office users
        sid: S-1-5-33-326
        type: DOMAIN LOCAL
  advancedSettings:
    agingTime: 5
    authProtectionType: WIRELESS
    country: co
    department: department
    email: mail
    enableCallbackForDialinClient: false
    enableDialinPermissionCheck: false
    enableFailedAuthProtection: false
    enableMachineAccess: true
    enableMachineAuth: true
    enablePassChange: true
    enableRewrites: false
    failedAuthThreshold: 5
    firstName: givenName
    identityNotInAdBehaviour: SEARCH_JOINED_FOREST
    jobTitle: title
    lastName: sn
    locality: l
    organizationalUnit: company
    plaintextAuth: false
    rewriteRules:
      - rewriteMatch: exampleMatch0
        rewriteResult: exampleResult0
        rowId: 0
      - rewriteMatch: exampleMatch1
        rewriteResult: exampleResult1
        rowId: 1
      - rewriteMatch: exampleMatch2
        rewriteResult: exampleResult2
        rowId: 2
      - rewriteMatch: exampleMatch3
        rewriteResult: exampleResult3
        rowId: 3
    schema: ACTIVE_DIRECTORY
    stateOrProvince: st
    streetAddress: streetAddress
    telephone: telephoneNumber
    unreachableDomainsBehaviour: PROCEED
  description: Group of Active company users
  domain: cisco.com
  enableDomainAllowedList: true
  id: f75760e7-a4f9-40ef-93bb-88a97e9fb171
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  name: Company_users
