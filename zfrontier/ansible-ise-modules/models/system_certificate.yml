---
# Data model for cisco.ise.system_certificate (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.system_certificate
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/system_certificate_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/system_certificate.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 61
  group: 2. Certificates
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

system_certificate:
  description: null
  ersLocalCertStub:
    allowWildcardCerts: on OR off
    certificatePolicies: certificate policies
    certificateSanDns: cisco.com
    certificateSanIp: <<IP-ADDRESS>>
    certificateSanUri: <<URI>>
    digest: SHA-256 OR SHA-384 OR SHA-512
    expirationTTL: '2'
    friendlyName: HCL
    groupTagDD: add-group-tag
    keyLength: 512 OR 1024 OR 2048 OR 4096
    keyType: RSA OR ECDSA
    samlCertificate: on OR off
    selectedExpirationTTLUnit: days OR weeks OR months OR years
    subjectStub:
      commonName: null
      countryName: null
      localityName: null
      organizationName: null
      organizationalUnitName: null
      stateOrProvinceName: null
    xgridCertificate: on OR off
  id: null
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  name: null
  nodeId: ISE-01
