---
# Data model for cisco.ise.personas_export_certs (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.personas_export_certs
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/personas_export_certs_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/personas_export_certs.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 8
  group: 1. Deployment, nodes and system
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

personas_export_certs:
  ip: '{{ item.ip }}'
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  name: '{{ item.name }}'
  password: '{{ vault_password }}'
  primary_ip: 198.51.100.1
  primary_password: '{{ vault_primary_password }}'
  primary_username: admin
  username: admin
