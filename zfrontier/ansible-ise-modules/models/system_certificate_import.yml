---
# Data model for cisco.ise.system_certificate_import (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.system_certificate_import
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/system_certificate_import_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/system_certificate_import.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 63
  group: 2. Certificates
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

system_certificate_import:
  admin: true
  allowExtendedValidity: true
  allowOutOfDateCert: true
  allowPortalTagTransferForSameSubject: true
  allowReplacementOfCertificates: true
  allowReplacementOfPortalGroupTag: true
  allowRoleTransferForSameSubject: true
  allowSHA1Certificates: true
  allowWildCardCertificates: true
  data: string
  eap: true
  ims: true
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  name: string
  password: '{{ vault_password }}'
  portal: true
  portalGroupTag: string
  privateKeyData: '{{ vault_privatekeydata }}'
  pxgrid: true
  radius: true
  saml: true
  validateCertificateExtensions: true
