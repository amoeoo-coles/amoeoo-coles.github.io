---
# Data model for cisco.ise.hotspot_portal (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.hotspot_portal
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/hotspot_portal_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/hotspot_portal.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 198
  group: 8. Guest, sponsor and portals
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

hotspot_portal:
  customizations:
    globalCustomizations:
      backgroundImage:
        data: null
      bannerImage:
        data: base 64 encoded value of image
      bannerTitle: Banner Title
      contactText: 'Contact Information '
      footerElement: Footer Element
      mobileLogoImage:
        data: base 64 encoded value of image
    language:
      viewLanguage: English
    pageCustomizations:
      data:
        - key: '{{ vault_key }}'
          value: Contact Support
    portalTheme:
      id: themeId
      name: ThemeName
      themeData: Base 64 encoded string of Theme CSS file
    portalTweakSettings:
      banneColor: null
      bannerTextColor: Banner Text color code from GUI
      pageBackgroundColor: Color code from GUI
      pageLabelAndTextColor: Label and Text color from GUI
  description: description
  id: f75760e7-a4f9-40ef-93bb-88a97e9fb171
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  name: name
  portalTestUrl: null
  portalType: HOTSPOTGUEST
  settings:
    aupSettings:
      accessCode: null
      includeAup: false
      requireAccessCode: false
      requireAupScrolling: null
    authSuccessSettings:
      redirectUrl: www.cisco.com
      successRedirect: AUTHSUCCESSPAGE
    portalSettings:
      allowedInterfaces:
        - eth0
        - bond0
      alwaysUsedLanguage: English
      certificateGroupTag: Default Portal Certificate Group
      coaType: COAREAUTHENTICATE
      displayLang: USEBROWSERLOCALE
      endpointIdentityGroup: f14227b0-6e5c-11e6-8f6a-005056873bd0
      fallbackLanguage: English
      httpsPort: 8443
    postLoginBannerSettings:
      includePostAccessBanner: null
    supportInfoSettings:
      defaultEmptyFieldValue: null
      emptyFieldDisplay: HIDE
      includeBrowserUserAgent: true
      includeFailureCode: true
      includeIpAddress: true
      includeMacAddr: true
      includePolicyServer: true
      includeSupportInfoPage: false
