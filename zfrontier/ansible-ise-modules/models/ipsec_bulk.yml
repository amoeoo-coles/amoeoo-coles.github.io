---
# Data model for cisco.ise.ipsec_bulk (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.ipsec_bulk
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ipsec_bulk_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/ipsec_bulk.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 107
  group: 4. Network resources
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

ipsec_bulk:
  ItemList:
    - authType: string
      certId: string
      configureVti: true
      espAhProtocol: string
      hostName: string
      iface: string
      ikeReAuthTime: 0
      ikeVersion: string
      localInternalIp: string
      modeOption: string
      nadIp: string
      phaseOneDHGroup: string
      phaseOneEncryptionAlgo: string
      phaseOneHashAlgo: string
      phaseOneLifeTime: 0
      phaseTwoDHGroup: string
      phaseTwoEncryptionAlgo: string
      phaseTwoHashAlgo: string
      phaseTwoLifeTime: 0
      psk: '{{ vault_psk }}'
      remotePeerInternalIp: string
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  operation: string
