---
# Data model for cisco.ise.ldap (cisco.ise 3.3.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.ise.ldap
  collection: cisco.ise
  collection_version: 3.3.0
  doc_url: https://ciscoise.github.io/ansible-ise/v3.3.0/plugins/ldap_module.html
  source_url: https://github.com/CiscoISE/ansible-ise/blob/v3.3.0/plugins/modules/ldap.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/ise/
  module_type: action
  build_order: 86
  group: 3. Identity stores and users
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

ldap:
  attributes:
    attributes:
      - defaultValue: ' '
        internalName: whenChanged
        name: whenChanged
        type: STRING
  connectionSettings:
    alwaysAccessPrimaryFirst: true
    failbackRetryDelay: 5
    failoverToSecondary: true
    ldapNodeData:
      - name: ise222
        primaryHostname: ipAddress
        primaryPort: 389
        secondaryHostname: ipAddress
        secondaryPort: 389
      - name: ise223
        primaryHostname: ipAddress
        primaryPort: 389
        secondaryHostname: ipAddress
        secondaryPort: 389
    primaryServer:
      adminDN: null
      adminPassword: null
      enableForceReconnect: null
      enableSecureConnection: null
      enableServerIdentityCheck: null
      forceReconnectTime: null
      hostName: null
      issuerCACertificate: null
      maxConnections: null
      port: null
      serverTimeout: null
      trustCertificate: null
      useAdminAccess: null
    secondaryServer:
      adminDN: null
      adminPassword: null
      enableForceReconnect: null
      enableSecureConnection: null
      enableServerIdentityCheck: null
      forceReconnectTime: null
      hostName: null
      issuerCACertificate: null
      maxConnections: null
      port: null
      serverTimeout: null
      trustCertificate: null
      useAdminAccess: null
    specifyServerForEachISENode: null
  description: Description
  directoryOrganization:
    groupDirectorySubtree: groupDirectorySubtree
    macFormat: DASH
    prefixSeparator: \
    stripPrefix: false
    stripSuffix: false
    suffixSeparator: ' '
    userDirectorySubtree: userDirectorySubtree
  enablePasswordChangeLDAP: false
  generalSettings:
    certificate: userCertificate
    groupMapAttributeName: memberOf
    groupMemberReference: USERNAME
    groupNameAttribute: dn
    groupObjectClass: Group
    schema: ACTIVE_DIRECTORY
    userInfoAttributes:
      additionalAttribute: null
      country: co
      department: department
      email: email
      firstName: givenName
      jobTitle: null
      lastName: sn
      locality: l
      organizationalUnit: company
      stateOrProvince: st
      streetAddress: streetAddress
      telephone: telephoneNumber
    userNameAttribute: userPrincipalName
    userObjectClass: Person
  groups:
    groupsNames:
      - CN=TestLDAP,CN=Users,DC=ISE,DC=COM
  id: null
  ise_client_cert: null
  ise_client_key: null
  ise_debug: '{{ ise_debug }}'
  ise_hostname: '{{ ise_hostname }}'
  ise_password: '{{ ise_password }}'
  ise_single_request_timeout: null
  ise_username: '{{ ise_username }}'
  ise_uses_api_gateway: null
  ise_uses_csrf_token: null
  ise_verify: '{{ ise_verify }}'
  ise_version: '{{ ise_version }}'
  ise_wait_on_rate_limit: null
  name: null
