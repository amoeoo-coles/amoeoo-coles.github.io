# Data model structure for sdwan.scopes (netascode nac-sdwan, nac/schema.yaml @ 5c49bbf).
# Each value is the yamale rule; _fields expands include() two levels deep.

sdwan_scopes:
  scopes:
    _rule: list(include("scope"), required=False, primary_key="name")
    _fields:
      name: regex('^[^&<>! \"]{1,128}$')
      description: str(required=False)
      configuration_groups: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      edge_device_templates: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      edge_feature_templates: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      feature_profiles: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      localized_policies: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      network_hierarchy_nodes: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      security_policies: list(regex('^[^&<>! \"]{1,128}$'), required=False)
      users: list(regex('^[^&<>! \"]{1,128}$'), required=False)
