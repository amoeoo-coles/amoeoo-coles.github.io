# Data model structure for sdwan.topology_groups (netascode nac-sdwan, nac/schema.yaml @ 5c49bbf).
# Each value is the yamale rule; _fields expands include() two levels deep.

sdwan_topology_groups:
  topology_groups:
    _rule: list(include("topology_group"), required=False, primary_key="name")
    _fields:
      name: regex('^[^&<>! \"]{1,128}$')
      description: str(required=False)
      activate: bool(required=False)
      topology_profile: regex('^[^&<>! \"]{1,128}$')
