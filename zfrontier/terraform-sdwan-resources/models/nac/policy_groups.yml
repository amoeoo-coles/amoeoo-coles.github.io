# Data model structure for sdwan.policy_groups (netascode nac-sdwan, nac/schema.yaml @ 5c49bbf).
# Each value is the yamale rule; _fields expands include() two levels deep.

sdwan_policy_groups:
  policy_groups:
    _rule: list(include("policy_group"), required=False, primary_key="name")
    _fields:
      name: regex('^[^&<>! \"]{1,128}$')
      description: str(required=False)
      application_priority: regex('^[^&<>! \"]{1,128}$', required=False)
      ngfw_security: regex('^[^&<>! \"]{1,128}$', required=False)
      sse: regex('^[^&<>! \"]{1,128}$', required=False)
