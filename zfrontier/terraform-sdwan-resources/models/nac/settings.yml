# Data model structure for sdwan.settings (netascode nac-sdwan, nac/schema.yaml @ 5c49bbf).
# Each value is the yamale rule; _fields expands include() two levels deep.

sdwan_settings:
  settings:
    _rule: include("settings", required=False)
    _fields:
      cloud_provider_settings:
        _rule: include("settings_cloud_provider_settings", required=False)
        _fields:
          cisco_sse_auth_key: str(required=False)
          cisco_sse_auth_secret: str(starts_with="$CRYPT_CLUSTER$", min=1, max=128, required=False)
          cisco_sse_context_sharing: bool(required=False)
          cisco_sse_org_id: regex('^[0-9]+$', required=False)
          umbrella_auth_key_v2: str(required=False)
          umbrella_auth_secret_v2: str(starts_with="$CRYPT_CLUSTER$", min=1, max=128, required=False)
          umbrella_dns_auth_key: str(required=False)
          umbrella_dns_auth_secret: str(required=False)
          umbrella_org_id: regex('^[0-9]+$', required=False)
          umbrella_sig_auth_key: str(required=False)
          umbrella_sig_auth_secret: str(required=False)
          zscaler_organization: str(required=False)
          zscaler_partner_base_uri: str(required=False)
          zscaler_partner_key: str(required=False)
          zscaler_password: str(required=False)
          zscaler_username: str(required=False)
      wan_edge_list:
        _rule: include("settings_wan_edge_list", required=False)
        _fields:
          send_to_controllers: bool(required=False)
