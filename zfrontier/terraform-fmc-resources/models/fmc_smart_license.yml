# YAML data model for resource fmc_smart_license
# Provider: CiscoDevNet/fmc 2.8.0 · Build order: 003 · 1. System information and licences
# Docs subcategory: Licenses
# Registry docs: https://registry.terraform.io/providers/CiscoDevNet/fmc/2.8.0/docs/resources/smart_license
# Keys are exactly the schema inputs (terraform providers schema -json).
# Values: docs Example Usage. null = omit (provider default). REPLACE_ME = set it,
# usually to the id of a referenced object. Secrets are never written in models.
# Required: registration_type
# Read by: tf/003_fmc_smart_license.tf
# Exported (computed) attributes: id, registration_status
# Secrets never set here: top-level ones are null and the .tf reads var.secrets["<model>.<key>"] (TF_VAR_secrets); nested required ones are REPLACE_ME: token
# Note: provider 2.8.0 ValidateConfig rejects an unknown token when registration_type is REGISTER, so `terraform validate` reports it until TF_VAR_secrets is known; plan/apply with the secret supplied pass this check.

fmc_smart_license:
  registration_type: REGISTER
  force: false
  retain_registration: false
  token: null
