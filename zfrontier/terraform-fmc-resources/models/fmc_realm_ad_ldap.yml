# YAML data model for resource fmc_realm_ad_ldap
# Provider: CiscoDevNet/fmc 2.8.0 · Build order: 444 · 6. Integrations
# Docs subcategory: Integrations
# Registry docs: https://registry.terraform.io/providers/CiscoDevNet/fmc/2.8.0/docs/resources/realm_ad_ldap
# Keys are exactly the schema inputs (terraform providers schema -json).
# Values: docs Example Usage. null = omit (provider default). REPLACE_ME = set it,
# usually to the id of a referenced object. Secrets are never written in models.
# Required: base_dn, directory_password, directory_servers, directory_username, group_dn, name, realm_type
# Read by: tf/444_fmc_realm_ad_ldap.tf
# Exported (computed) attributes: id, type, version
# Secrets never set here: top-level ones are null and the .tf reads var.secrets["<model>.<key>"] (TF_VAR_secrets); nested required ones are REPLACE_ME: directory_password

fmc_realm_ad_ldap:
  base_dn: DC=example,DC=com
  directory_password: null
  directory_servers:
    - ca_certificate_id: 12345678-1234-1234-1234-123456789012
      encryption_protocol: LDAPS
      hostname: ldap.example.com
      interface_group_id: null
      port: 389
      use_routing_to_select_interface: false
  directory_username: user@example.com
  group_dn: CN=users,DC=example,DC=com
  name: my_ldap_realm
  realm_type: LDAP
  description: My realm
  enabled: true
  excluded_groups:
    - group2
  excluded_users:
    - user2
  group_attribute: member
  included_groups:
    - group1
  included_users:
    - user1
  timeout_captive_portal_users: 1440
  timeout_failed_captive_portal_users: 1440
  timeout_guest_captive_portal_users: 1440
  timeout_ise_and_passive_indentity_users: 1440
  timeout_terminal_server_agent_users: 1440
  update_hour: 2
  update_interval: '4'
  ad_join_password: null
  ad_join_username: null
  ad_primary_domain: null
  domain: null
