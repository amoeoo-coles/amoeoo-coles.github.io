  custom_detection_list: true
  description: My file policy
  file_rules:
    - action: DETECT
      application_protocol: ANY
      direction_of_transfer: ANY
      file_categories:
        - id: '5'
          name: PDF files
          type: null
      file_types:
        - id: '19'
          name: 7Z
          type: null
      store_files: null
  first_time_file_analysis: true
  inspect_archives: false
  max_archive_depth: 2
  threat_score: DISABLED
  domain: null
