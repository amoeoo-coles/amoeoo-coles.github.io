      authentication_password_encryption: UN_ENCRYPTED
      authentication_type: MD5
      echo: ENABLED
      hop_type: SINGLE_HOP
      interval_type: MILLISECONDS
      minimum_receive: 300
      minimum_transmit: 300
      multiplier: 3
  domain: null
