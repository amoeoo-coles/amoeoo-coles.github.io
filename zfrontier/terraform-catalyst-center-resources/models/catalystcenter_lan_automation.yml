# YAML data model for resource catalystcenter_lan_automation
# Provider: CiscoDevNet/catalystcenter 0.6.9 · Build order: 109 · 6. Templates, profiles and LAN automation
# Docs subcategory: LAN Automation
# Registry docs: https://registry.terraform.io/providers/CiscoDevNet/catalystcenter/0.6.9/docs/resources/lan_automation
# Keys are exactly the schema inputs (terraform providers schema -json).
# Values: docs Example Usage. null = omit (provider default). REPLACE_ME = set it,
# usually to the id of a referenced object. Secrets are never written in models.
# Required: discovered_device_site_name_hierarchy, ip_pools, primary_device_interface_names, primary_device_management_ip_address
# Read by: tf/109_catalystcenter_lan_automation.tf
# Exported (computed) attributes: id
# Secrets never set here: top-level ones are null and the .tf reads var.secrets["<model>.<key>"] (TF_VAR_secrets); nested required ones are REPLACE_ME: isis_domain_password_wo

catalystcenter_lan_automation:
  discovered_device_site_name_hierarchy: Global/Area1/Area2
  ip_pools:
    - ip_pool_name: POOL1
      ip_pool_role: MAIN_POOL
  primary_device_interface_names:
    - HundredGigE1/0/1
  primary_device_management_ip_address: 192.0.2.4
  discovery_devices:
    - device_host_name: EDGE01
      device_management_ip_address: 198.51.100.1
      device_serial_number: FOC12345678
      device_site_name_hierarchy: Global/Area1/Area2
  discovery_level: 2
  discovery_timeout: 20
  host_name_prefix: TEST
  isis_domain_password_wo: null
  isis_domain_password_wo_version: 1
  multicast_enabled: true
  redistribute_isis_to_bgp: true
  host_name_file_id: null
  isis_domain_password: null
  peer_device_management_ip_address: null
