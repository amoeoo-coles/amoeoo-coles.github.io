# YAML data model for resource catalystcenter_device
# Provider: CiscoDevNet/catalystcenter 0.6.9 · Build order: 077 · 4. Discovery, inventory and PnP
# Docs subcategory: Inventory
# Registry docs: https://registry.terraform.io/providers/CiscoDevNet/catalystcenter/0.6.9/docs/resources/device
# Keys are exactly the schema inputs (terraform providers schema -json).
# Values: docs Example Usage. null = omit (provider default). REPLACE_ME = set it,
# usually to the id of a referenced object. Secrets are never written in models.
# Required: ip_address
# Read by: tf/077_catalystcenter_device.tf
# Exported (computed) attributes: id
# Secrets never set here: top-level ones are null and the .tf reads var.secrets["<model>.<key>"] (TF_VAR_secrets); nested required ones are REPLACE_ME: enable_password, http_password, password, snmp_auth_passphrase, snmp_priv_passphrase, snmp_ro_community, snmp_rw_community

catalystcenter_device:
  ip_address: 192.0.2.4
  cli_transport: ssh
  compute_device: false
  enable_password: null
  extended_discovery_info: DISCOVER_WITH_CANNED_DATA
  http_password: null
  http_port: '80'
  http_secure: true
  http_user_name: admin
  meraki_org_ids:
    - '12345678901234567890'
  netconf_port: '830'
  password: null
  serial_number: FOC12345678
  snmp_auth_passphrase: null
  snmp_auth_protocol: sha
  snmp_mode: authPriv
  snmp_priv_passphrase: null
  snmp_priv_protocol: AES128
  snmp_retry: 3
  snmp_ro_community: null
  snmp_rw_community: null
  snmp_timeout: 10
  snmp_user_name: admin
  snmp_version: v3
  type: NETWORK_DEVICE
  user_name: admin
  update_mgmt_ip_addresses: null
