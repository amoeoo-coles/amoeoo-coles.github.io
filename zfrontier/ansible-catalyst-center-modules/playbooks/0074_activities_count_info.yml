---
# Sample playbook for cisco.catalystcenter.activities_count_info (cisco.catalystcenter 2.15.0)
# Build order: 74
# Information module for Activities Count
# Reads ../models/activities_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/activities_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0074 activities_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/activities_count_info.yml
  tasks:
    - name: Run activities_count_info from its model
      cisco.catalystcenter.activities_count_info:
        catalystcenter_debug: "{{ activities_count_info.catalystcenter_debug if activities_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ activities_count_info.catalystcenter_host if activities_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ activities_count_info.catalystcenter_password if activities_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ activities_count_info.catalystcenter_port if activities_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ activities_count_info.catalystcenter_username if activities_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ activities_count_info.catalystcenter_verify if activities_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ activities_count_info.catalystcenter_version if activities_count_info.catalystcenter_version is not none else omit }}"
        description: "{{ activities_count_info.description if activities_count_info.description is not none else omit }}"
        endTime: "{{ activities_count_info.endTime if activities_count_info.endTime is not none else omit }}"
        headers: "{{ activities_count_info.headers if activities_count_info.headers is not none else omit }}"
        recurring: "{{ activities_count_info.recurring if activities_count_info.recurring is not none else omit }}"
        startTime: "{{ activities_count_info.startTime if activities_count_info.startTime is not none else omit }}"
        status: "{{ activities_count_info.status if activities_count_info.status is not none else omit }}"
        type: "{{ activities_count_info.type if activities_count_info.type is not none else omit }}"
        validate_response_schema: "{{ activities_count_info.validate_response_schema if activities_count_info.validate_response_schema is not none else omit }}"
      register: activities_count_info_result
