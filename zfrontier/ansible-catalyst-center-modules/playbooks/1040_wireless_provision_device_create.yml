---
# Sample playbook for cisco.catalystcenter.wireless_provision_device_create (cisco.catalystcenter 2.15.0)
# Build order: 1040
# Resource module for Wireless Provision Device Create
# Reads ../models/wireless_provision_device_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_provision_device_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_provision_device_create.

- name: "1040 wireless_provision_device_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_provision_device_create.yml
  tasks:
    - name: Run wireless_provision_device_create from its model
      cisco.catalystcenter.wireless_provision_device_create:
        catalystcenter_debug: "{{ wireless_provision_device_create.catalystcenter_debug if wireless_provision_device_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_provision_device_create.catalystcenter_host if wireless_provision_device_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_provision_device_create.catalystcenter_password if wireless_provision_device_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_provision_device_create.catalystcenter_port if wireless_provision_device_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_provision_device_create.catalystcenter_username if wireless_provision_device_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_provision_device_create.catalystcenter_verify if wireless_provision_device_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_provision_device_create.catalystcenter_version if wireless_provision_device_create.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_provision_device_create.headers if wireless_provision_device_create.headers is not none else omit }}"
        payload: "{{ (wireless_provision_device_create.payload | cat_strip_nulls) if (wireless_provision_device_create.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_provision_device_create.validate_response_schema if wireless_provision_device_create.validate_response_schema is not none else omit }}"
      register: wireless_provision_device_create_result
      tags:
        - never
        - wireless_provision_device_create
