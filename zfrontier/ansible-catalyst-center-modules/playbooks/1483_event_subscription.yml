---
# Sample playbook for cisco.catalystcenter.event_subscription (cisco.catalystcenter 2.15.0)
# Build order: 1483
# Resource module for Event Subscription
# Reads ../models/event_subscription.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_subscription_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_subscription.

- name: "1483 event_subscription"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_subscription.yml
  tasks:
    - name: Run event_subscription from its model
      cisco.catalystcenter.event_subscription:
        catalystcenter_debug: "{{ event_subscription.catalystcenter_debug if event_subscription.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_subscription.catalystcenter_host if event_subscription.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_subscription.catalystcenter_password if event_subscription.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_subscription.catalystcenter_port if event_subscription.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_subscription.catalystcenter_username if event_subscription.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_subscription.catalystcenter_verify if event_subscription.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_subscription.catalystcenter_version if event_subscription.catalystcenter_version is not none else omit }}"
        payload: "{{ (event_subscription.payload | cat_strip_nulls) if (event_subscription.payload | cat_strip_nulls) is not none else omit }}"
        subscriptions: "{{ event_subscription.subscriptions if event_subscription.subscriptions is not none else omit }}"
        validate_response_schema: "{{ event_subscription.validate_response_schema if event_subscription.validate_response_schema is not none else omit }}"
      register: event_subscription_result
      tags:
        - never
        - event_subscription
