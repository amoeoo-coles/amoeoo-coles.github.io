---
# Sample playbook for cisco.catalystcenter.traffic_steering_contracts (cisco.catalystcenter 2.15.0)
# Build order: 1520
# Resource module for Traffic Steering Contracts
# Reads ../models/traffic_steering_contracts.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/traffic_steering_contracts_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags traffic_steering_contracts.

- name: "1520 traffic_steering_contracts"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/traffic_steering_contracts.yml
  tasks:
    - name: Run traffic_steering_contracts from its model
      cisco.catalystcenter.traffic_steering_contracts:
        catalystcenter_debug: "{{ traffic_steering_contracts.catalystcenter_debug if traffic_steering_contracts.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ traffic_steering_contracts.catalystcenter_host if traffic_steering_contracts.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ traffic_steering_contracts.catalystcenter_password if traffic_steering_contracts.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ traffic_steering_contracts.catalystcenter_port if traffic_steering_contracts.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ traffic_steering_contracts.catalystcenter_username if traffic_steering_contracts.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ traffic_steering_contracts.catalystcenter_verify if traffic_steering_contracts.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ traffic_steering_contracts.catalystcenter_version if traffic_steering_contracts.catalystcenter_version is not none else omit }}"
        createdTime: "{{ traffic_steering_contracts.createdTime if traffic_steering_contracts.createdTime is not none else omit }}"
        description: "{{ traffic_steering_contracts.description if traffic_steering_contracts.description is not none else omit }}"
        id: "{{ traffic_steering_contracts.id if traffic_steering_contracts.id is not none else omit }}"
        lastUpdatedTime: "{{ traffic_steering_contracts.lastUpdatedTime if traffic_steering_contracts.lastUpdatedTime is not none else omit }}"
        name: "{{ traffic_steering_contracts.name if traffic_steering_contracts.name is not none else omit }}"
        policyReferenceCount: "{{ traffic_steering_contracts.policyReferenceCount if traffic_steering_contracts.policyReferenceCount is not none else omit }}"
        ruleCount: "{{ traffic_steering_contracts.ruleCount if traffic_steering_contracts.ruleCount is not none else omit }}"
        rules: "{{ (traffic_steering_contracts.rules | cat_strip_nulls) if (traffic_steering_contracts.rules | cat_strip_nulls) is not none else omit }}"
        siteReferenceCount: "{{ traffic_steering_contracts.siteReferenceCount if traffic_steering_contracts.siteReferenceCount is not none else omit }}"
        validate_response_schema: "{{ traffic_steering_contracts.validate_response_schema if traffic_steering_contracts.validate_response_schema is not none else omit }}"
      register: traffic_steering_contracts_result
      tags:
        - never
        - traffic_steering_contracts
