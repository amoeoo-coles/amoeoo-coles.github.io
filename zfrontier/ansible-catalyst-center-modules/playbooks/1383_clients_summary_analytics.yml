---
# Sample playbook for cisco.catalystcenter.clients_summary_analytics (cisco.catalystcenter 2.15.0)
# Build order: 1383
# Resource module for Clients Summary Analytics
# Reads ../models/clients_summary_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/clients_summary_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags clients_summary_analytics.

- name: "1383 clients_summary_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/clients_summary_analytics.yml
  tasks:
    - name: Run clients_summary_analytics from its model
      cisco.catalystcenter.clients_summary_analytics:
        aggregateAttributes: "{{ (clients_summary_analytics.aggregateAttributes | cat_strip_nulls) if (clients_summary_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (clients_summary_analytics.attributes | cat_strip_nulls) if (clients_summary_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ clients_summary_analytics.catalystcenter_debug if clients_summary_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ clients_summary_analytics.catalystcenter_host if clients_summary_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ clients_summary_analytics.catalystcenter_password if clients_summary_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ clients_summary_analytics.catalystcenter_port if clients_summary_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ clients_summary_analytics.catalystcenter_username if clients_summary_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ clients_summary_analytics.catalystcenter_verify if clients_summary_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ clients_summary_analytics.catalystcenter_version if clients_summary_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ clients_summary_analytics.endTime if clients_summary_analytics.endTime is not none else omit }}"
        filters: "{{ (clients_summary_analytics.filters | cat_strip_nulls) if (clients_summary_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (clients_summary_analytics.groupBy | cat_strip_nulls) if (clients_summary_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        headers: "{{ clients_summary_analytics.headers if clients_summary_analytics.headers is not none else omit }}"
        page: "{{ (clients_summary_analytics.page | cat_strip_nulls) if (clients_summary_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ clients_summary_analytics.startTime if clients_summary_analytics.startTime is not none else omit }}"
        validate_response_schema: "{{ clients_summary_analytics.validate_response_schema if clients_summary_analytics.validate_response_schema is not none else omit }}"
      register: clients_summary_analytics_result
      tags:
        - never
        - clients_summary_analytics
