---
# Sample playbook for cisco.catalystcenter.event_subscription_syslog_info (cisco.catalystcenter 2.15.0)
# Build order: 1510
# Information module for Event Subscription Syslog
# Reads ../models/event_subscription_syslog_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_subscription_syslog_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1510 event_subscription_syslog_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_subscription_syslog_info.yml
  tasks:
    - name: Run event_subscription_syslog_info from its model
      cisco.catalystcenter.event_subscription_syslog_info:
        catalystcenter_debug: "{{ event_subscription_syslog_info.catalystcenter_debug if event_subscription_syslog_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_subscription_syslog_info.catalystcenter_host if event_subscription_syslog_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_subscription_syslog_info.catalystcenter_password if event_subscription_syslog_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_subscription_syslog_info.catalystcenter_port if event_subscription_syslog_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_subscription_syslog_info.catalystcenter_username if event_subscription_syslog_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_subscription_syslog_info.catalystcenter_verify if event_subscription_syslog_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_subscription_syslog_info.catalystcenter_version if event_subscription_syslog_info.catalystcenter_version is not none else omit }}"
        category: "{{ event_subscription_syslog_info.category if event_subscription_syslog_info.category is not none else omit }}"
        domain: "{{ event_subscription_syslog_info.domain if event_subscription_syslog_info.domain is not none else omit }}"
        eventIds: "{{ event_subscription_syslog_info.eventIds if event_subscription_syslog_info.eventIds is not none else omit }}"
        headers: "{{ event_subscription_syslog_info.headers if event_subscription_syslog_info.headers is not none else omit }}"
        limit: "{{ event_subscription_syslog_info.limit if event_subscription_syslog_info.limit is not none else omit }}"
        name: "{{ event_subscription_syslog_info.name if event_subscription_syslog_info.name is not none else omit }}"
        offset: "{{ event_subscription_syslog_info.offset if event_subscription_syslog_info.offset is not none else omit }}"
        order: "{{ event_subscription_syslog_info.order if event_subscription_syslog_info.order is not none else omit }}"
        sortBy: "{{ event_subscription_syslog_info.sortBy if event_subscription_syslog_info.sortBy is not none else omit }}"
        subDomain: "{{ event_subscription_syslog_info.subDomain if event_subscription_syslog_info.subDomain is not none else omit }}"
        type: "{{ event_subscription_syslog_info.type if event_subscription_syslog_info.type is not none else omit }}"
        validate_response_schema: "{{ event_subscription_syslog_info.validate_response_schema if event_subscription_syslog_info.validate_response_schema is not none else omit }}"
      register: event_subscription_syslog_info_result
