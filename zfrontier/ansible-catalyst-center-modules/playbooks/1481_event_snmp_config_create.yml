---
# Sample playbook for cisco.catalystcenter.event_snmp_config_create (cisco.catalystcenter 2.15.0)
# Build order: 1481
# Resource module for Event Snmp Config Create
# Reads ../models/event_snmp_config_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_snmp_config_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_snmp_config_create.

- name: "1481 event_snmp_config_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_snmp_config_create.yml
  tasks:
    - name: Run event_snmp_config_create from its model
      cisco.catalystcenter.event_snmp_config_create:
        authPassword: "{{ event_snmp_config_create.authPassword if event_snmp_config_create.authPassword is not none else omit }}"
        catalystcenter_debug: "{{ event_snmp_config_create.catalystcenter_debug if event_snmp_config_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_snmp_config_create.catalystcenter_host if event_snmp_config_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_snmp_config_create.catalystcenter_password if event_snmp_config_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_snmp_config_create.catalystcenter_port if event_snmp_config_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_snmp_config_create.catalystcenter_username if event_snmp_config_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_snmp_config_create.catalystcenter_verify if event_snmp_config_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_snmp_config_create.catalystcenter_version if event_snmp_config_create.catalystcenter_version is not none else omit }}"
        community: "{{ event_snmp_config_create.community if event_snmp_config_create.community is not none else omit }}"
        description: "{{ event_snmp_config_create.description if event_snmp_config_create.description is not none else omit }}"
        ipAddress: "{{ event_snmp_config_create.ipAddress if event_snmp_config_create.ipAddress is not none else omit }}"
        name: "{{ event_snmp_config_create.name if event_snmp_config_create.name is not none else omit }}"
        port: "{{ event_snmp_config_create.port if event_snmp_config_create.port is not none else omit }}"
        privacyPassword: "{{ event_snmp_config_create.privacyPassword if event_snmp_config_create.privacyPassword is not none else omit }}"
        snmpAuthType: "{{ event_snmp_config_create.snmpAuthType if event_snmp_config_create.snmpAuthType is not none else omit }}"
        snmpMode: "{{ event_snmp_config_create.snmpMode if event_snmp_config_create.snmpMode is not none else omit }}"
        snmpPrivacyType: "{{ event_snmp_config_create.snmpPrivacyType if event_snmp_config_create.snmpPrivacyType is not none else omit }}"
        snmpVersion: "{{ event_snmp_config_create.snmpVersion if event_snmp_config_create.snmpVersion is not none else omit }}"
        userName: "{{ event_snmp_config_create.userName if event_snmp_config_create.userName is not none else omit }}"
        validate_response_schema: "{{ event_snmp_config_create.validate_response_schema if event_snmp_config_create.validate_response_schema is not none else omit }}"
      register: event_snmp_config_create_result
      tags:
        - never
        - event_snmp_config_create
