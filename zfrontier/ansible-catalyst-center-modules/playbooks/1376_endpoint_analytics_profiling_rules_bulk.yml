---
# Sample playbook for cisco.catalystcenter.endpoint_analytics_profiling_rules_bulk (cisco.catalystcenter 2.15.0)
# Build order: 1376
# Resource module for Endpoint Analytics Profiling Rules Bulk
# Reads ../models/endpoint_analytics_profiling_rules_bulk.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/endpoint_analytics_profiling_rules_bulk_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags endpoint_analytics_profiling_rules_bulk.

- name: "1376 endpoint_analytics_profiling_rules_bulk"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoint_analytics_profiling_rules_bulk.yml
  tasks:
    - name: Run endpoint_analytics_profiling_rules_bulk from its model
      cisco.catalystcenter.endpoint_analytics_profiling_rules_bulk:
        catalystcenter_debug: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_debug if endpoint_analytics_profiling_rules_bulk.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_host if endpoint_analytics_profiling_rules_bulk.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_password if endpoint_analytics_profiling_rules_bulk.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_port if endpoint_analytics_profiling_rules_bulk.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_username if endpoint_analytics_profiling_rules_bulk.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_verify if endpoint_analytics_profiling_rules_bulk.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ endpoint_analytics_profiling_rules_bulk.catalystcenter_version if endpoint_analytics_profiling_rules_bulk.catalystcenter_version is not none else omit }}"
        profilingRules: "{{ (endpoint_analytics_profiling_rules_bulk.profilingRules | cat_strip_nulls) if (endpoint_analytics_profiling_rules_bulk.profilingRules | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ endpoint_analytics_profiling_rules_bulk.validate_response_schema if endpoint_analytics_profiling_rules_bulk.validate_response_schema is not none else omit }}"
      register: endpoint_analytics_profiling_rules_bulk_result
      tags:
        - never
        - endpoint_analytics_profiling_rules_bulk
