---
# Sample playbook for cisco.catalystcenter.excluded_wireless_clients_info (cisco.catalystcenter 2.15.0)
# Build order: 1060
# Information module for Excluded Wireless Clients
# Reads ../models/excluded_wireless_clients_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/excluded_wireless_clients_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1060 excluded_wireless_clients_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/excluded_wireless_clients_info.yml
  tasks:
    - name: Run excluded_wireless_clients_info from its model
      cisco.catalystcenter.excluded_wireless_clients_info:
        catalystcenter_debug: "{{ excluded_wireless_clients_info.catalystcenter_debug if excluded_wireless_clients_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ excluded_wireless_clients_info.catalystcenter_host if excluded_wireless_clients_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ excluded_wireless_clients_info.catalystcenter_password if excluded_wireless_clients_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ excluded_wireless_clients_info.catalystcenter_port if excluded_wireless_clients_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ excluded_wireless_clients_info.catalystcenter_username if excluded_wireless_clients_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ excluded_wireless_clients_info.catalystcenter_verify if excluded_wireless_clients_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ excluded_wireless_clients_info.catalystcenter_version if excluded_wireless_clients_info.catalystcenter_version is not none else omit }}"
        headers: "{{ excluded_wireless_clients_info.headers if excluded_wireless_clients_info.headers is not none else omit }}"
        id: "{{ excluded_wireless_clients_info.id if excluded_wireless_clients_info.id is not none else omit }}"
        limit: "{{ excluded_wireless_clients_info.limit if excluded_wireless_clients_info.limit is not none else omit }}"
        macAddress: "{{ excluded_wireless_clients_info.macAddress if excluded_wireless_clients_info.macAddress is not none else omit }}"
        networkDeviceId: "{{ excluded_wireless_clients_info.networkDeviceId if excluded_wireless_clients_info.networkDeviceId is not none else omit }}"
        offset: "{{ excluded_wireless_clients_info.offset if excluded_wireless_clients_info.offset is not none else omit }}"
        validate_response_schema: "{{ excluded_wireless_clients_info.validate_response_schema if excluded_wireless_clients_info.validate_response_schema is not none else omit }}"
      register: excluded_wireless_clients_info_result
