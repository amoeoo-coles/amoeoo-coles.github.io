---
# Sample playbook for cisco.catalystcenter.energy_sites_query_info (cisco.catalystcenter 2.15.0)
# Build order: 124
# Information module for Energy Sites Query
# Reads ../models/energy_sites_query_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_sites_query_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0124 energy_sites_query_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_sites_query_info.yml
  tasks:
    - name: Run energy_sites_query_info from its model
      cisco.catalystcenter.energy_sites_query_info:
        catalystcenter_debug: "{{ energy_sites_query_info.catalystcenter_debug if energy_sites_query_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_sites_query_info.catalystcenter_host if energy_sites_query_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_sites_query_info.catalystcenter_password if energy_sites_query_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_sites_query_info.catalystcenter_port if energy_sites_query_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_sites_query_info.catalystcenter_username if energy_sites_query_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_sites_query_info.catalystcenter_verify if energy_sites_query_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_sites_query_info.catalystcenter_version if energy_sites_query_info.catalystcenter_version is not none else omit }}"
        headers: "{{ energy_sites_query_info.headers if energy_sites_query_info.headers is not none else omit }}"
        taskId: "{{ energy_sites_query_info.taskId if energy_sites_query_info.taskId is not none else omit }}"
        validate_response_schema: "{{ energy_sites_query_info.validate_response_schema if energy_sites_query_info.validate_response_schema is not none else omit }}"
      register: energy_sites_query_info_result
