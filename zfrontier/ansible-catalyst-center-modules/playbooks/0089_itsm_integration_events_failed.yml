---
# Sample playbook for cisco.catalystcenter.itsm_integration_events_failed (cisco.catalystcenter 2.15.0)
# Build order: 89
# Resource module for Itsm Integration Events Failed
# Reads ../models/itsm_integration_events_failed.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/itsm_integration_events_failed_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags itsm_integration_events_failed.

- name: "0089 itsm_integration_events_failed"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/itsm_integration_events_failed.yml
  tasks:
    - name: Run itsm_integration_events_failed from its model
      cisco.catalystcenter.itsm_integration_events_failed:
        catalystcenter_debug: "{{ itsm_integration_events_failed.catalystcenter_debug if itsm_integration_events_failed.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ itsm_integration_events_failed.catalystcenter_host if itsm_integration_events_failed.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ itsm_integration_events_failed.catalystcenter_password if itsm_integration_events_failed.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ itsm_integration_events_failed.catalystcenter_port if itsm_integration_events_failed.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ itsm_integration_events_failed.catalystcenter_username if itsm_integration_events_failed.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ itsm_integration_events_failed.catalystcenter_verify if itsm_integration_events_failed.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ itsm_integration_events_failed.catalystcenter_version if itsm_integration_events_failed.catalystcenter_version is not none else omit }}"
        payload: "{{ (itsm_integration_events_failed.payload | cat_strip_nulls) if (itsm_integration_events_failed.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ itsm_integration_events_failed.validate_response_schema if itsm_integration_events_failed.validate_response_schema is not none else omit }}"
      register: itsm_integration_events_failed_result
      tags:
        - never
        - itsm_integration_events_failed
