---
# Sample playbook for cisco.catalystcenter.tracked_clients_info (cisco.catalystcenter 2.15.0)
# Build order: 1404
# Information module for Tracked Clients
# Reads ../models/tracked_clients_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tracked_clients_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1404 tracked_clients_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tracked_clients_info.yml
  tasks:
    - name: Run tracked_clients_info from its model
      cisco.catalystcenter.tracked_clients_info:
        catalystcenter_debug: "{{ tracked_clients_info.catalystcenter_debug if tracked_clients_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tracked_clients_info.catalystcenter_host if tracked_clients_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tracked_clients_info.catalystcenter_password if tracked_clients_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tracked_clients_info.catalystcenter_port if tracked_clients_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tracked_clients_info.catalystcenter_username if tracked_clients_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tracked_clients_info.catalystcenter_verify if tracked_clients_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tracked_clients_info.catalystcenter_version if tracked_clients_info.catalystcenter_version is not none else omit }}"
        clientMacAddress: "{{ (tracked_clients_info.clientMacAddress | cat_strip_nulls) if (tracked_clients_info.clientMacAddress | cat_strip_nulls) is not none else omit }}"
        description: "{{ tracked_clients_info.description if tracked_clients_info.description is not none else omit }}"
        duid: "{{ (tracked_clients_info.duid | cat_strip_nulls) if (tracked_clients_info.duid | cat_strip_nulls) is not none else omit }}"
        headers: "{{ tracked_clients_info.headers if tracked_clients_info.headers is not none else omit }}"
        id: "{{ tracked_clients_info.id if tracked_clients_info.id is not none else omit }}"
        isPresentOnNetwork: "{{ tracked_clients_info.isPresentOnNetwork if tracked_clients_info.isPresentOnNetwork is not none else omit }}"
        limit: "{{ tracked_clients_info.limit if tracked_clients_info.limit is not none else omit }}"
        notificationModes: "{{ (tracked_clients_info.notificationModes | cat_strip_nulls) if (tracked_clients_info.notificationModes | cat_strip_nulls) is not none else omit }}"
        offset: "{{ tracked_clients_info.offset if tracked_clients_info.offset is not none else omit }}"
        randomizedMacAddresses: "{{ (tracked_clients_info.randomizedMacAddresses | cat_strip_nulls) if (tracked_clients_info.randomizedMacAddresses | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ tracked_clients_info.validate_response_schema if tracked_clients_info.validate_response_schema is not none else omit }}"
      register: tracked_clients_info_result
