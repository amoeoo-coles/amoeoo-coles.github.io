---
# Sample playbook for cisco.catalystcenter.sda_authentication_profiles_info (cisco.catalystcenter 2.15.0)
# Build order: 772
# Information module for Sda Authentication Profiles
# Reads ../models/sda_authentication_profiles_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_authentication_profiles_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0772 sda_authentication_profiles_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_authentication_profiles_info.yml
  tasks:
    - name: Run sda_authentication_profiles_info from its model
      cisco.catalystcenter.sda_authentication_profiles_info:
        authenticationProfileName: "{{ sda_authentication_profiles_info.authenticationProfileName if sda_authentication_profiles_info.authenticationProfileName is not none else omit }}"
        catalystcenter_debug: "{{ sda_authentication_profiles_info.catalystcenter_debug if sda_authentication_profiles_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_authentication_profiles_info.catalystcenter_host if sda_authentication_profiles_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_authentication_profiles_info.catalystcenter_password if sda_authentication_profiles_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_authentication_profiles_info.catalystcenter_port if sda_authentication_profiles_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_authentication_profiles_info.catalystcenter_username if sda_authentication_profiles_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_authentication_profiles_info.catalystcenter_verify if sda_authentication_profiles_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_authentication_profiles_info.catalystcenter_version if sda_authentication_profiles_info.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_authentication_profiles_info.fabricId if sda_authentication_profiles_info.fabricId is not none else omit }}"
        headers: "{{ sda_authentication_profiles_info.headers if sda_authentication_profiles_info.headers is not none else omit }}"
        isGlobalAuthenticationProfile: "{{ sda_authentication_profiles_info.isGlobalAuthenticationProfile if sda_authentication_profiles_info.isGlobalAuthenticationProfile is not none else omit }}"
        limit: "{{ sda_authentication_profiles_info.limit if sda_authentication_profiles_info.limit is not none else omit }}"
        offset: "{{ sda_authentication_profiles_info.offset if sda_authentication_profiles_info.offset is not none else omit }}"
        validate_response_schema: "{{ sda_authentication_profiles_info.validate_response_schema if sda_authentication_profiles_info.validate_response_schema is not none else omit }}"
      register: sda_authentication_profiles_info_result
