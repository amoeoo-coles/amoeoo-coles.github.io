---
# Sample playbook for cisco.catalystcenter.application_policy_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 1378
# Resource module for managing queuing profiles, applications, application sets and application policies for wired and wireless in Cisco Catalyst Center.
# Reads ../models/application_policy_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/application_policy_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags application_policy_workflow_manager.

- name: "1378 application_policy_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/application_policy_workflow_manager.yml
  tasks:
    - name: Run application_policy_workflow_manager from its model
      cisco.catalystcenter.application_policy_workflow_manager:
        catalystcenter_api_task_timeout: "{{ application_policy_workflow_manager.catalystcenter_api_task_timeout if application_policy_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ application_policy_workflow_manager.catalystcenter_debug if application_policy_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ application_policy_workflow_manager.catalystcenter_host if application_policy_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ application_policy_workflow_manager.catalystcenter_log if application_policy_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ application_policy_workflow_manager.catalystcenter_log_append if application_policy_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ application_policy_workflow_manager.catalystcenter_log_file_path if application_policy_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ application_policy_workflow_manager.catalystcenter_log_level if application_policy_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ application_policy_workflow_manager.catalystcenter_password if application_policy_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ application_policy_workflow_manager.catalystcenter_port if application_policy_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ application_policy_workflow_manager.catalystcenter_task_poll_interval if application_policy_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ application_policy_workflow_manager.catalystcenter_username if application_policy_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ application_policy_workflow_manager.catalystcenter_verify if application_policy_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ application_policy_workflow_manager.catalystcenter_version if application_policy_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (application_policy_workflow_manager.config | cat_strip_nulls) if (application_policy_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ application_policy_workflow_manager.config_verify if application_policy_workflow_manager.config_verify is not none else omit }}"
        state: "{{ application_policy_workflow_manager.state if application_policy_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ application_policy_workflow_manager.validate_response_schema if application_policy_workflow_manager.validate_response_schema is not none else omit }}"
      register: application_policy_workflow_manager_result
      tags:
        - never
        - application_policy_workflow_manager
