---
# Sample playbook for cisco.catalystcenter.wireless_settings_power_profiles (cisco.catalystcenter 2.15.0)
# Build order: 1053
# Resource module for Wireless Settings Power Profiles
# Reads ../models/wireless_settings_power_profiles.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_power_profiles_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_power_profiles.

- name: "1053 wireless_settings_power_profiles"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_power_profiles.yml
  tasks:
    - name: Run wireless_settings_power_profiles from its model
      cisco.catalystcenter.wireless_settings_power_profiles:
        catalystcenter_debug: "{{ wireless_settings_power_profiles.catalystcenter_debug if wireless_settings_power_profiles.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_power_profiles.catalystcenter_host if wireless_settings_power_profiles.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_power_profiles.catalystcenter_password if wireless_settings_power_profiles.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_power_profiles.catalystcenter_port if wireless_settings_power_profiles.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_power_profiles.catalystcenter_username if wireless_settings_power_profiles.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_power_profiles.catalystcenter_verify if wireless_settings_power_profiles.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_power_profiles.catalystcenter_version if wireless_settings_power_profiles.catalystcenter_version is not none else omit }}"
        description: "{{ wireless_settings_power_profiles.description if wireless_settings_power_profiles.description is not none else omit }}"
        id: "{{ wireless_settings_power_profiles.id if wireless_settings_power_profiles.id is not none else omit }}"
        profileName: "{{ wireless_settings_power_profiles.profileName if wireless_settings_power_profiles.profileName is not none else omit }}"
        rules: "{{ (wireless_settings_power_profiles.rules | cat_strip_nulls) if (wireless_settings_power_profiles.rules | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_power_profiles.validate_response_schema if wireless_settings_power_profiles.validate_response_schema is not none else omit }}"
      register: wireless_settings_power_profiles_result
      tags:
        - never
        - wireless_settings_power_profiles
