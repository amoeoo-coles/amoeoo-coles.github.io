---
# Sample playbook for cisco.catalystcenter.clients_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1400
# Information module for Clients Count
# Reads ../models/clients_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/clients_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1400 clients_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/clients_count_info.yml
  tasks:
    - name: Run clients_count_info from its model
      cisco.catalystcenter.clients_count_info:
        band: "{{ clients_count_info.band if clients_count_info.band is not none else omit }}"
        catalystcenter_debug: "{{ clients_count_info.catalystcenter_debug if clients_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ clients_count_info.catalystcenter_host if clients_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ clients_count_info.catalystcenter_password if clients_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ clients_count_info.catalystcenter_port if clients_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ clients_count_info.catalystcenter_username if clients_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ clients_count_info.catalystcenter_verify if clients_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ clients_count_info.catalystcenter_version if clients_count_info.catalystcenter_version is not none else omit }}"
        connectedNetworkDeviceName: "{{ clients_count_info.connectedNetworkDeviceName if clients_count_info.connectedNetworkDeviceName is not none else omit }}"
        endTime: "{{ clients_count_info.endTime if clients_count_info.endTime is not none else omit }}"
        headers: "{{ clients_count_info.headers if clients_count_info.headers is not none else omit }}"
        ipv4Address: "{{ clients_count_info.ipv4Address if clients_count_info.ipv4Address is not none else omit }}"
        ipv6Address: "{{ clients_count_info.ipv6Address if clients_count_info.ipv6Address is not none else omit }}"
        macAddress: "{{ clients_count_info.macAddress if clients_count_info.macAddress is not none else omit }}"
        osType: "{{ clients_count_info.osType if clients_count_info.osType is not none else omit }}"
        osVersion: "{{ clients_count_info.osVersion if clients_count_info.osVersion is not none else omit }}"
        siteHierarchy: "{{ clients_count_info.siteHierarchy if clients_count_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ clients_count_info.siteHierarchyId if clients_count_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ clients_count_info.siteId if clients_count_info.siteId is not none else omit }}"
        ssid: "{{ clients_count_info.ssid if clients_count_info.ssid is not none else omit }}"
        startTime: "{{ clients_count_info.startTime if clients_count_info.startTime is not none else omit }}"
        type: "{{ clients_count_info.type if clients_count_info.type is not none else omit }}"
        validate_response_schema: "{{ clients_count_info.validate_response_schema if clients_count_info.validate_response_schema is not none else omit }}"
        wlcName: "{{ clients_count_info.wlcName if clients_count_info.wlcName is not none else omit }}"
      register: clients_count_info_result
