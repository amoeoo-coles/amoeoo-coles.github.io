---
# Sample playbook for cisco.catalystcenter.app_policy_queuing_profile (cisco.catalystcenter 2.15.0)
# Build order: 1321
# Resource module for App Policy Queuing Profile
# Reads ../models/app_policy_queuing_profile.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/app_policy_queuing_profile_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags app_policy_queuing_profile.

- name: "1321 app_policy_queuing_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/app_policy_queuing_profile.yml
  tasks:
    - name: Run app_policy_queuing_profile from its model
      cisco.catalystcenter.app_policy_queuing_profile:
        catalystcenter_debug: "{{ app_policy_queuing_profile.catalystcenter_debug if app_policy_queuing_profile.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ app_policy_queuing_profile.catalystcenter_host if app_policy_queuing_profile.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ app_policy_queuing_profile.catalystcenter_password if app_policy_queuing_profile.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ app_policy_queuing_profile.catalystcenter_port if app_policy_queuing_profile.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ app_policy_queuing_profile.catalystcenter_username if app_policy_queuing_profile.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ app_policy_queuing_profile.catalystcenter_verify if app_policy_queuing_profile.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ app_policy_queuing_profile.catalystcenter_version if app_policy_queuing_profile.catalystcenter_version is not none else omit }}"
        id: "{{ app_policy_queuing_profile.id if app_policy_queuing_profile.id is not none else omit }}"
        payload: "{{ (app_policy_queuing_profile.payload | cat_strip_nulls) if (app_policy_queuing_profile.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ app_policy_queuing_profile.validate_response_schema if app_policy_queuing_profile.validate_response_schema is not none else omit }}"
      register: app_policy_queuing_profile_result
      tags:
        - never
        - app_policy_queuing_profile
