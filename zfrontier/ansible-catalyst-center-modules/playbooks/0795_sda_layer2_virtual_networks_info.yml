---
# Sample playbook for cisco.catalystcenter.sda_layer2_virtual_networks_info (cisco.catalystcenter 2.15.0)
# Build order: 795
# Information module for Sda Layer2 Virtual Networks
# Reads ../models/sda_layer2_virtual_networks_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_layer2_virtual_networks_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0795 sda_layer2_virtual_networks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_layer2_virtual_networks_info.yml
  tasks:
    - name: Run sda_layer2_virtual_networks_info from its model
      cisco.catalystcenter.sda_layer2_virtual_networks_info:
        associatedLayer3VirtualNetworkName: "{{ sda_layer2_virtual_networks_info.associatedLayer3VirtualNetworkName if sda_layer2_virtual_networks_info.associatedLayer3VirtualNetworkName is not none else omit }}"
        catalystcenter_debug: "{{ sda_layer2_virtual_networks_info.catalystcenter_debug if sda_layer2_virtual_networks_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_layer2_virtual_networks_info.catalystcenter_host if sda_layer2_virtual_networks_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_layer2_virtual_networks_info.catalystcenter_password if sda_layer2_virtual_networks_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_layer2_virtual_networks_info.catalystcenter_port if sda_layer2_virtual_networks_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_layer2_virtual_networks_info.catalystcenter_username if sda_layer2_virtual_networks_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_layer2_virtual_networks_info.catalystcenter_verify if sda_layer2_virtual_networks_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_layer2_virtual_networks_info.catalystcenter_version if sda_layer2_virtual_networks_info.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_layer2_virtual_networks_info.fabricId if sda_layer2_virtual_networks_info.fabricId is not none else omit }}"
        headers: "{{ sda_layer2_virtual_networks_info.headers if sda_layer2_virtual_networks_info.headers is not none else omit }}"
        id: "{{ sda_layer2_virtual_networks_info.id if sda_layer2_virtual_networks_info.id is not none else omit }}"
        limit: "{{ sda_layer2_virtual_networks_info.limit if sda_layer2_virtual_networks_info.limit is not none else omit }}"
        offset: "{{ sda_layer2_virtual_networks_info.offset if sda_layer2_virtual_networks_info.offset is not none else omit }}"
        trafficType: "{{ sda_layer2_virtual_networks_info.trafficType if sda_layer2_virtual_networks_info.trafficType is not none else omit }}"
        validate_response_schema: "{{ sda_layer2_virtual_networks_info.validate_response_schema if sda_layer2_virtual_networks_info.validate_response_schema is not none else omit }}"
        vlanId: "{{ sda_layer2_virtual_networks_info.vlanId if sda_layer2_virtual_networks_info.vlanId is not none else omit }}"
        vlanName: "{{ sda_layer2_virtual_networks_info.vlanName if sda_layer2_virtual_networks_info.vlanName is not none else omit }}"
      register: sda_layer2_virtual_networks_info_result
