---
# Sample playbook for cisco.catalystcenter.site_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 187
# Manage hierarchical sites in Cisco Catalyst Center
# Reads ../models/site_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags site_workflow_manager.

- name: "0187 site_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_workflow_manager.yml
  tasks:
    - name: Run site_workflow_manager from its model
      cisco.catalystcenter.site_workflow_manager:
        catalystcenter_api_task_timeout: "{{ site_workflow_manager.catalystcenter_api_task_timeout if site_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ site_workflow_manager.catalystcenter_debug if site_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_workflow_manager.catalystcenter_host if site_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ site_workflow_manager.catalystcenter_log if site_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ site_workflow_manager.catalystcenter_log_append if site_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ site_workflow_manager.catalystcenter_log_file_path if site_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ site_workflow_manager.catalystcenter_log_level if site_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ site_workflow_manager.catalystcenter_password if site_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_workflow_manager.catalystcenter_port if site_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ site_workflow_manager.catalystcenter_task_poll_interval if site_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ site_workflow_manager.catalystcenter_username if site_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_workflow_manager.catalystcenter_verify if site_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_workflow_manager.catalystcenter_version if site_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (site_workflow_manager.config | cat_strip_nulls) if (site_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ site_workflow_manager.config_verify if site_workflow_manager.config_verify is not none else omit }}"
        state: "{{ site_workflow_manager.state if site_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ site_workflow_manager.validate_response_schema if site_workflow_manager.validate_response_schema is not none else omit }}"
      register: site_workflow_manager_result
      tags:
        - never
        - site_workflow_manager
