---
# Sample playbook for cisco.catalystcenter.dns_services_query (cisco.catalystcenter 2.15.0)
# Build order: 319
# Resource module for Dns Services Query
# Reads ../models/dns_services_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dns_services_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dns_services_query.

- name: "0319 dns_services_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dns_services_query.yml
  tasks:
    - name: Run dns_services_query from its model
      cisco.catalystcenter.dns_services_query:
        catalystcenter_debug: "{{ dns_services_query.catalystcenter_debug if dns_services_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dns_services_query.catalystcenter_host if dns_services_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dns_services_query.catalystcenter_password if dns_services_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dns_services_query.catalystcenter_port if dns_services_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dns_services_query.catalystcenter_username if dns_services_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dns_services_query.catalystcenter_verify if dns_services_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dns_services_query.catalystcenter_version if dns_services_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ dns_services_query.endTime if dns_services_query.endTime is not none else omit }}"
        filters: "{{ (dns_services_query.filters | cat_strip_nulls) if (dns_services_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ dns_services_query.headers if dns_services_query.headers is not none else omit }}"
        page: "{{ (dns_services_query.page | cat_strip_nulls) if (dns_services_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ dns_services_query.startTime if dns_services_query.startTime is not none else omit }}"
        validate_response_schema: "{{ dns_services_query.validate_response_schema if dns_services_query.validate_response_schema is not none else omit }}"
      register: dns_services_query_result
      tags:
        - never
        - dns_services_query
