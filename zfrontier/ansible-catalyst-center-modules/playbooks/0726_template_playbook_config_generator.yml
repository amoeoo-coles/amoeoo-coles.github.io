---
# Sample playbook for cisco.catalystcenter.template_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 726
# Generate YAML playbook for template_workflow_manager module.
# Reads ../models/template_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/template_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags template_playbook_config_generator.

- name: "0726 template_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/template_playbook_config_generator.yml
  tasks:
    - name: Run template_playbook_config_generator from its model
      cisco.catalystcenter.template_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ template_playbook_config_generator.catalystcenter_api_task_timeout if template_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ template_playbook_config_generator.catalystcenter_debug if template_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ template_playbook_config_generator.catalystcenter_host if template_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ template_playbook_config_generator.catalystcenter_log if template_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ template_playbook_config_generator.catalystcenter_log_append if template_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ template_playbook_config_generator.catalystcenter_log_file_path if template_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ template_playbook_config_generator.catalystcenter_log_level if template_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ template_playbook_config_generator.catalystcenter_password if template_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ template_playbook_config_generator.catalystcenter_port if template_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ template_playbook_config_generator.catalystcenter_task_poll_interval if template_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ template_playbook_config_generator.catalystcenter_username if template_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ template_playbook_config_generator.catalystcenter_verify if template_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ template_playbook_config_generator.catalystcenter_version if template_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (template_playbook_config_generator.config | cat_strip_nulls) if (template_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ template_playbook_config_generator.file_mode if template_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ template_playbook_config_generator.file_path if template_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ template_playbook_config_generator.state if template_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ template_playbook_config_generator.validate_response_schema if template_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: template_playbook_config_generator_result
      tags:
        - never
        - template_playbook_config_generator
