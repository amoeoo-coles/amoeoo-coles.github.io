---
# Sample playbook for cisco.catalystcenter.tasks_detail_info (cisco.catalystcenter 2.15.0)
# Build order: 85
# Information module for Tasks Detail
# Reads ../models/tasks_detail_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tasks_detail_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0085 tasks_detail_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tasks_detail_info.yml
  tasks:
    - name: Run tasks_detail_info from its model
      cisco.catalystcenter.tasks_detail_info:
        catalystcenter_debug: "{{ tasks_detail_info.catalystcenter_debug if tasks_detail_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tasks_detail_info.catalystcenter_host if tasks_detail_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tasks_detail_info.catalystcenter_password if tasks_detail_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tasks_detail_info.catalystcenter_port if tasks_detail_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tasks_detail_info.catalystcenter_username if tasks_detail_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tasks_detail_info.catalystcenter_verify if tasks_detail_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tasks_detail_info.catalystcenter_version if tasks_detail_info.catalystcenter_version is not none else omit }}"
        headers: "{{ tasks_detail_info.headers if tasks_detail_info.headers is not none else omit }}"
        id: "{{ tasks_detail_info.id if tasks_detail_info.id is not none else omit }}"
        validate_response_schema: "{{ tasks_detail_info.validate_response_schema if tasks_detail_info.validate_response_schema is not none else omit }}"
      register: tasks_detail_info_result
