---
# Sample playbook for cisco.catalystcenter.lan_automation_update_device (cisco.catalystcenter 2.15.0)
# Build order: 632
# Resource module for Lan Automation Update Device
# Reads ../models/lan_automation_update_device.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_update_device_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags lan_automation_update_device.

- name: "0632 lan_automation_update_device"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_update_device.yml
  tasks:
    - name: Run lan_automation_update_device from its model
      cisco.catalystcenter.lan_automation_update_device:
        catalystcenter_debug: "{{ lan_automation_update_device.catalystcenter_debug if lan_automation_update_device.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_update_device.catalystcenter_host if lan_automation_update_device.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_update_device.catalystcenter_password if lan_automation_update_device.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_update_device.catalystcenter_port if lan_automation_update_device.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_update_device.catalystcenter_username if lan_automation_update_device.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_update_device.catalystcenter_verify if lan_automation_update_device.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_update_device.catalystcenter_version if lan_automation_update_device.catalystcenter_version is not none else omit }}"
        feature: "{{ lan_automation_update_device.feature if lan_automation_update_device.feature is not none else omit }}"
        hostnameUpdateDevices: "{{ (lan_automation_update_device.hostnameUpdateDevices | cat_strip_nulls) if (lan_automation_update_device.hostnameUpdateDevices | cat_strip_nulls) is not none else omit }}"
        linkUpdate: "{{ (lan_automation_update_device.linkUpdate | cat_strip_nulls) if (lan_automation_update_device.linkUpdate | cat_strip_nulls) is not none else omit }}"
        loopbackUpdateDeviceList: "{{ (lan_automation_update_device.loopbackUpdateDeviceList | cat_strip_nulls) if (lan_automation_update_device.loopbackUpdateDeviceList | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ lan_automation_update_device.validate_response_schema if lan_automation_update_device.validate_response_schema is not none else omit }}"
      register: lan_automation_update_device_result
      tags:
        - never
        - lan_automation_update_device
