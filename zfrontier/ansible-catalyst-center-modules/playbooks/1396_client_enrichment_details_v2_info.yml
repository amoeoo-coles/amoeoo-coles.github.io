---
# Sample playbook for cisco.catalystcenter.client_enrichment_details_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 1396
# Information module for Client Enrichment Details V2
# Reads ../models/client_enrichment_details_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/client_enrichment_details_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1396 client_enrichment_details_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/client_enrichment_details_v2_info.yml
  tasks:
    - name: Run client_enrichment_details_v2_info from its model
      cisco.catalystcenter.client_enrichment_details_v2_info:
        catalystcenter_debug: "{{ client_enrichment_details_v2_info.catalystcenter_debug if client_enrichment_details_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ client_enrichment_details_v2_info.catalystcenter_host if client_enrichment_details_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ client_enrichment_details_v2_info.catalystcenter_password if client_enrichment_details_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ client_enrichment_details_v2_info.catalystcenter_port if client_enrichment_details_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ client_enrichment_details_v2_info.catalystcenter_username if client_enrichment_details_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ client_enrichment_details_v2_info.catalystcenter_verify if client_enrichment_details_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ client_enrichment_details_v2_info.catalystcenter_version if client_enrichment_details_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ client_enrichment_details_v2_info.headers if client_enrichment_details_v2_info.headers is not none else omit }}"
        validate_response_schema: "{{ client_enrichment_details_v2_info.validate_response_schema if client_enrichment_details_v2_info.validate_response_schema is not none else omit }}"
      register: client_enrichment_details_v2_info_result
