---
# Sample playbook for cisco.catalystcenter.golden_tag_image_delete (cisco.catalystcenter 2.15.0)
# Build order: 544
# Resource module for Golden Tag Image Delete
# Reads ../models/golden_tag_image_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/golden_tag_image_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags golden_tag_image_delete.

- name: "0544 golden_tag_image_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/golden_tag_image_delete.yml
  tasks:
    - name: Run golden_tag_image_delete from its model
      cisco.catalystcenter.golden_tag_image_delete:
        catalystcenter_debug: "{{ golden_tag_image_delete.catalystcenter_debug if golden_tag_image_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ golden_tag_image_delete.catalystcenter_host if golden_tag_image_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ golden_tag_image_delete.catalystcenter_password if golden_tag_image_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ golden_tag_image_delete.catalystcenter_port if golden_tag_image_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ golden_tag_image_delete.catalystcenter_username if golden_tag_image_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ golden_tag_image_delete.catalystcenter_verify if golden_tag_image_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ golden_tag_image_delete.catalystcenter_version if golden_tag_image_delete.catalystcenter_version is not none else omit }}"
        deviceFamilyIdentifier: "{{ golden_tag_image_delete.deviceFamilyIdentifier if golden_tag_image_delete.deviceFamilyIdentifier is not none else omit }}"
        deviceRole: "{{ golden_tag_image_delete.deviceRole if golden_tag_image_delete.deviceRole is not none else omit }}"
        imageId: "{{ golden_tag_image_delete.imageId if golden_tag_image_delete.imageId is not none else omit }}"
        siteId: "{{ golden_tag_image_delete.siteId if golden_tag_image_delete.siteId is not none else omit }}"
        validate_response_schema: "{{ golden_tag_image_delete.validate_response_schema if golden_tag_image_delete.validate_response_schema is not none else omit }}"
      register: golden_tag_image_delete_result
      tags:
        - never
        - golden_tag_image_delete
