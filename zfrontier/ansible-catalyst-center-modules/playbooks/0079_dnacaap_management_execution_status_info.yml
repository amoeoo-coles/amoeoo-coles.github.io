---
# Sample playbook for cisco.catalystcenter.dnacaap_management_execution_status_info (cisco.catalystcenter 2.15.0)
# Build order: 79
# Information module for Dnacaap Management Execution Status
# Reads ../models/dnacaap_management_execution_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dnacaap_management_execution_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0079 dnacaap_management_execution_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dnacaap_management_execution_status_info.yml
  tasks:
    - name: Run dnacaap_management_execution_status_info from its model
      cisco.catalystcenter.dnacaap_management_execution_status_info:
        catalystcenter_debug: "{{ dnacaap_management_execution_status_info.catalystcenter_debug if dnacaap_management_execution_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dnacaap_management_execution_status_info.catalystcenter_host if dnacaap_management_execution_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dnacaap_management_execution_status_info.catalystcenter_password if dnacaap_management_execution_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dnacaap_management_execution_status_info.catalystcenter_port if dnacaap_management_execution_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dnacaap_management_execution_status_info.catalystcenter_username if dnacaap_management_execution_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dnacaap_management_execution_status_info.catalystcenter_verify if dnacaap_management_execution_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dnacaap_management_execution_status_info.catalystcenter_version if dnacaap_management_execution_status_info.catalystcenter_version is not none else omit }}"
        executionId: "{{ dnacaap_management_execution_status_info.executionId if dnacaap_management_execution_status_info.executionId is not none else omit }}"
        headers: "{{ dnacaap_management_execution_status_info.headers if dnacaap_management_execution_status_info.headers is not none else omit }}"
        validate_response_schema: "{{ dnacaap_management_execution_status_info.validate_response_schema if dnacaap_management_execution_status_info.validate_response_schema is not none else omit }}"
      register: dnacaap_management_execution_status_info_result
