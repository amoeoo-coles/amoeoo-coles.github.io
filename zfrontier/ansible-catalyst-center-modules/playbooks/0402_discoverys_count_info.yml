---
# Sample playbook for cisco.catalystcenter.discoverys_count_info (cisco.catalystcenter 2.15.0)
# Build order: 402
# Information module for Discoverys Count
# Reads ../models/discoverys_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discoverys_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0402 discoverys_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discoverys_count_info.yml
  tasks:
    - name: Run discoverys_count_info from its model
      cisco.catalystcenter.discoverys_count_info:
        catalystcenter_debug: "{{ discoverys_count_info.catalystcenter_debug if discoverys_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discoverys_count_info.catalystcenter_host if discoverys_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discoverys_count_info.catalystcenter_password if discoverys_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discoverys_count_info.catalystcenter_port if discoverys_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discoverys_count_info.catalystcenter_username if discoverys_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discoverys_count_info.catalystcenter_verify if discoverys_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discoverys_count_info.catalystcenter_version if discoverys_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ discoverys_count_info.headers if discoverys_count_info.headers is not none else omit }}"
        id: "{{ (discoverys_count_info.id | cat_strip_nulls) if (discoverys_count_info.id | cat_strip_nulls) is not none else omit }}"
        name: "{{ discoverys_count_info.name if discoverys_count_info.name is not none else omit }}"
        validate_response_schema: "{{ discoverys_count_info.validate_response_schema if discoverys_count_info.validate_response_schema is not none else omit }}"
      register: discoverys_count_info_result
