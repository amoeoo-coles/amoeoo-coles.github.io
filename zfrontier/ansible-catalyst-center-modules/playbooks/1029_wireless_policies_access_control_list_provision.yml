---
# Sample playbook for cisco.catalystcenter.wireless_policies_access_control_list_provision (cisco.catalystcenter 2.15.0)
# Build order: 1029
# Resource module for Wireless Policies Access Control List Provision
# Reads ../models/wireless_policies_access_control_list_provision.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_policies_access_control_list_provision_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_policies_access_control_list_provision.

- name: "1029 wireless_policies_access_control_list_provision"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_policies_access_control_list_provision.yml
  tasks:
    - name: Run wireless_policies_access_control_list_provision from its model
      cisco.catalystcenter.wireless_policies_access_control_list_provision:
        basicUrls: "{{ (wireless_policies_access_control_list_provision.basicUrls | cat_strip_nulls) if (wireless_policies_access_control_list_provision.basicUrls | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ wireless_policies_access_control_list_provision.catalystcenter_debug if wireless_policies_access_control_list_provision.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_policies_access_control_list_provision.catalystcenter_host if wireless_policies_access_control_list_provision.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_policies_access_control_list_provision.catalystcenter_password if wireless_policies_access_control_list_provision.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_policies_access_control_list_provision.catalystcenter_port if wireless_policies_access_control_list_provision.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_policies_access_control_list_provision.catalystcenter_username if wireless_policies_access_control_list_provision.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_policies_access_control_list_provision.catalystcenter_verify if wireless_policies_access_control_list_provision.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_policies_access_control_list_provision.catalystcenter_version if wireless_policies_access_control_list_provision.catalystcenter_version is not none else omit }}"
        description: "{{ wireless_policies_access_control_list_provision.description if wireless_policies_access_control_list_provision.description is not none else omit }}"
        deviceIds: "{{ (wireless_policies_access_control_list_provision.deviceIds | cat_strip_nulls) if (wireless_policies_access_control_list_provision.deviceIds | cat_strip_nulls) is not none else omit }}"
        enhancedUrls: "{{ (wireless_policies_access_control_list_provision.enhancedUrls | cat_strip_nulls) if (wireless_policies_access_control_list_provision.enhancedUrls | cat_strip_nulls) is not none else omit }}"
        flexOrFabricSsids: "{{ (wireless_policies_access_control_list_provision.flexOrFabricSsids | cat_strip_nulls) if (wireless_policies_access_control_list_provision.flexOrFabricSsids | cat_strip_nulls) is not none else omit }}"
        id: "{{ wireless_policies_access_control_list_provision.id if wireless_policies_access_control_list_provision.id is not none else omit }}"
        ipAclRules: "{{ (wireless_policies_access_control_list_provision.ipAclRules | cat_strip_nulls) if (wireless_policies_access_control_list_provision.ipAclRules | cat_strip_nulls) is not none else omit }}"
        localSsids: "{{ (wireless_policies_access_control_list_provision.localSsids | cat_strip_nulls) if (wireless_policies_access_control_list_provision.localSsids | cat_strip_nulls) is not none else omit }}"
        name: "{{ wireless_policies_access_control_list_provision.name if wireless_policies_access_control_list_provision.name is not none else omit }}"
        validate_response_schema: "{{ wireless_policies_access_control_list_provision.validate_response_schema if wireless_policies_access_control_list_provision.validate_response_schema is not none else omit }}"
      register: wireless_policies_access_control_list_provision_result
      tags:
        - never
        - wireless_policies_access_control_list_provision
