---
# Sample playbook for cisco.catalystcenter.qos_device_interface_info_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1347
# Information module for Qos Device Interface Info Count
# Reads ../models/qos_device_interface_info_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/qos_device_interface_info_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1347 qos_device_interface_info_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/qos_device_interface_info_count_info.yml
  tasks:
    - name: Run qos_device_interface_info_count_info from its model
      cisco.catalystcenter.qos_device_interface_info_count_info:
        catalystcenter_debug: "{{ qos_device_interface_info_count_info.catalystcenter_debug if qos_device_interface_info_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ qos_device_interface_info_count_info.catalystcenter_host if qos_device_interface_info_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ qos_device_interface_info_count_info.catalystcenter_password if qos_device_interface_info_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ qos_device_interface_info_count_info.catalystcenter_port if qos_device_interface_info_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ qos_device_interface_info_count_info.catalystcenter_username if qos_device_interface_info_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ qos_device_interface_info_count_info.catalystcenter_verify if qos_device_interface_info_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ qos_device_interface_info_count_info.catalystcenter_version if qos_device_interface_info_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ qos_device_interface_info_count_info.headers if qos_device_interface_info_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ qos_device_interface_info_count_info.validate_response_schema if qos_device_interface_info_count_info.validate_response_schema is not none else omit }}"
      register: qos_device_interface_info_count_info_result
