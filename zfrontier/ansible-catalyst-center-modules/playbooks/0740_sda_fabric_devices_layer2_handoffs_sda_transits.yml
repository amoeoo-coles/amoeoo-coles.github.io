---
# Sample playbook for cisco.catalystcenter.sda_fabric_devices_layer2_handoffs_sda_transits (cisco.catalystcenter 2.15.0)
# Build order: 740
# Resource module for Sda Fabric Devices Layer2 Handoffs Sda Transits
# Reads ../models/sda_fabric_devices_layer2_handoffs_sda_transits.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabric_devices_layer2_handoffs_sda_transits_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_fabric_devices_layer2_handoffs_sda_transits.

- name: "0740 sda_fabric_devices_layer2_handoffs_sda_transits"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabric_devices_layer2_handoffs_sda_transits.yml
  tasks:
    - name: Run sda_fabric_devices_layer2_handoffs_sda_transits from its model
      cisco.catalystcenter.sda_fabric_devices_layer2_handoffs_sda_transits:
        catalystcenter_debug: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_debug if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_host if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_password if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_port if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_username if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_verify if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_version if sda_fabric_devices_layer2_handoffs_sda_transits.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.fabricId if sda_fabric_devices_layer2_handoffs_sda_transits.fabricId is not none else omit }}"
        networkDeviceId: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.networkDeviceId if sda_fabric_devices_layer2_handoffs_sda_transits.networkDeviceId is not none else omit }}"
        payload: "{{ (sda_fabric_devices_layer2_handoffs_sda_transits.payload | cat_strip_nulls) if (sda_fabric_devices_layer2_handoffs_sda_transits.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_fabric_devices_layer2_handoffs_sda_transits.validate_response_schema if sda_fabric_devices_layer2_handoffs_sda_transits.validate_response_schema is not none else omit }}"
      register: sda_fabric_devices_layer2_handoffs_sda_transits_result
      tags:
        - never
        - sda_fabric_devices_layer2_handoffs_sda_transits
