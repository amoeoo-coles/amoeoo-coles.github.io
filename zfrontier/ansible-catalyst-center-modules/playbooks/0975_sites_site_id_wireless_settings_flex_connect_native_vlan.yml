        siteId: "{{ sites_site_id_wireless_settings_flex_connect_native_vlan.siteId if sites_site_id_wireless_settings_flex_connect_native_vlan.siteId is not none else omit }}"
        validate_response_schema: "{{ sites_site_id_wireless_settings_flex_connect_native_vlan.validate_response_schema if sites_site_id_wireless_settings_flex_connect_native_vlan.validate_response_schema is not none else omit }}"
