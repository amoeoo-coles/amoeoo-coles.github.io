---
# Sample playbook for cisco.catalystcenter.dns_services_query_count (cisco.catalystcenter 2.15.0)
# Build order: 320
# Resource module for Dns Services Query Count
# Reads ../models/dns_services_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dns_services_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dns_services_query_count.

- name: "0320 dns_services_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dns_services_query_count.yml
  tasks:
    - name: Run dns_services_query_count from its model
      cisco.catalystcenter.dns_services_query_count:
        catalystcenter_debug: "{{ dns_services_query_count.catalystcenter_debug if dns_services_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dns_services_query_count.catalystcenter_host if dns_services_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dns_services_query_count.catalystcenter_password if dns_services_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dns_services_query_count.catalystcenter_port if dns_services_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dns_services_query_count.catalystcenter_username if dns_services_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dns_services_query_count.catalystcenter_verify if dns_services_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dns_services_query_count.catalystcenter_version if dns_services_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ dns_services_query_count.endTime if dns_services_query_count.endTime is not none else omit }}"
        filters: "{{ (dns_services_query_count.filters | cat_strip_nulls) if (dns_services_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ dns_services_query_count.headers if dns_services_query_count.headers is not none else omit }}"
        startTime: "{{ dns_services_query_count.startTime if dns_services_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ dns_services_query_count.validate_response_schema if dns_services_query_count.validate_response_schema is not none else omit }}"
      register: dns_services_query_count_result
      tags:
        - never
        - dns_services_query_count
