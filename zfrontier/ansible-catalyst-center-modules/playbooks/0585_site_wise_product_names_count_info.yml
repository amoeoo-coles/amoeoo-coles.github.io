---
# Sample playbook for cisco.catalystcenter.site_wise_product_names_count_info (cisco.catalystcenter 2.15.0)
# Build order: 585
# Information module for Site Wise Product Names Count
# Reads ../models/site_wise_product_names_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_wise_product_names_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0585 site_wise_product_names_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_wise_product_names_count_info.yml
  tasks:
    - name: Run site_wise_product_names_count_info from its model
      cisco.catalystcenter.site_wise_product_names_count_info:
        catalystcenter_debug: "{{ site_wise_product_names_count_info.catalystcenter_debug if site_wise_product_names_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_wise_product_names_count_info.catalystcenter_host if site_wise_product_names_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_wise_product_names_count_info.catalystcenter_password if site_wise_product_names_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_wise_product_names_count_info.catalystcenter_port if site_wise_product_names_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_wise_product_names_count_info.catalystcenter_username if site_wise_product_names_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_wise_product_names_count_info.catalystcenter_verify if site_wise_product_names_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_wise_product_names_count_info.catalystcenter_version if site_wise_product_names_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ site_wise_product_names_count_info.headers if site_wise_product_names_count_info.headers is not none else omit }}"
        productName: "{{ site_wise_product_names_count_info.productName if site_wise_product_names_count_info.productName is not none else omit }}"
        siteId: "{{ site_wise_product_names_count_info.siteId if site_wise_product_names_count_info.siteId is not none else omit }}"
        validate_response_schema: "{{ site_wise_product_names_count_info.validate_response_schema if site_wise_product_names_count_info.validate_response_schema is not none else omit }}"
      register: site_wise_product_names_count_info_result
