---
# Sample playbook for cisco.catalystcenter.swim_image_details_info (cisco.catalystcenter 2.15.0)
# Build order: 587
# Information module for Swim Image Details
# Reads ../models/swim_image_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/swim_image_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0587 swim_image_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/swim_image_details_info.yml
  tasks:
    - name: Run swim_image_details_info from its model
      cisco.catalystcenter.swim_image_details_info:
        applicationType: "{{ swim_image_details_info.applicationType if swim_image_details_info.applicationType is not none else omit }}"
        catalystcenter_debug: "{{ swim_image_details_info.catalystcenter_debug if swim_image_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ swim_image_details_info.catalystcenter_host if swim_image_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ swim_image_details_info.catalystcenter_password if swim_image_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ swim_image_details_info.catalystcenter_port if swim_image_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ swim_image_details_info.catalystcenter_username if swim_image_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ swim_image_details_info.catalystcenter_verify if swim_image_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ swim_image_details_info.catalystcenter_version if swim_image_details_info.catalystcenter_version is not none else omit }}"
        createdTime: "{{ swim_image_details_info.createdTime if swim_image_details_info.createdTime is not none else omit }}"
        family: "{{ swim_image_details_info.family if swim_image_details_info.family is not none else omit }}"
        headers: "{{ swim_image_details_info.headers if swim_image_details_info.headers is not none else omit }}"
        imageIntegrityStatus: "{{ swim_image_details_info.imageIntegrityStatus if swim_image_details_info.imageIntegrityStatus is not none else omit }}"
        imageName: "{{ swim_image_details_info.imageName if swim_image_details_info.imageName is not none else omit }}"
        imageSeries: "{{ swim_image_details_info.imageSeries if swim_image_details_info.imageSeries is not none else omit }}"
        imageSizeGreaterThan: "{{ swim_image_details_info.imageSizeGreaterThan if swim_image_details_info.imageSizeGreaterThan is not none else omit }}"
        imageSizeLesserThan: "{{ swim_image_details_info.imageSizeLesserThan if swim_image_details_info.imageSizeLesserThan is not none else omit }}"
        imageUuid: "{{ swim_image_details_info.imageUuid if swim_image_details_info.imageUuid is not none else omit }}"
        isCCOLatest: "{{ swim_image_details_info.isCCOLatest if swim_image_details_info.isCCOLatest is not none else omit }}"
        isCCORecommended: "{{ swim_image_details_info.isCCORecommended if swim_image_details_info.isCCORecommended is not none else omit }}"
        isTaggedGolden: "{{ swim_image_details_info.isTaggedGolden if swim_image_details_info.isTaggedGolden is not none else omit }}"
        limit: "{{ swim_image_details_info.limit if swim_image_details_info.limit is not none else omit }}"
        name: "{{ swim_image_details_info.name if swim_image_details_info.name is not none else omit }}"
        offset: "{{ swim_image_details_info.offset if swim_image_details_info.offset is not none else omit }}"
        sortBy: "{{ swim_image_details_info.sortBy if swim_image_details_info.sortBy is not none else omit }}"
        sortOrder: "{{ swim_image_details_info.sortOrder if swim_image_details_info.sortOrder is not none else omit }}"
        validate_response_schema: "{{ swim_image_details_info.validate_response_schema if swim_image_details_info.validate_response_schema is not none else omit }}"
        version: "{{ swim_image_details_info.version if swim_image_details_info.version is not none else omit }}"
      register: swim_image_details_info_result
