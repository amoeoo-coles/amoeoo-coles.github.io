---
# Sample playbook for cisco.catalystcenter.dhcp_services_query_count (cisco.catalystcenter 2.15.0)
# Build order: 311
# Resource module for Dhcp Services Query Count
# Reads ../models/dhcp_services_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dhcp_services_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dhcp_services_query_count.

- name: "0311 dhcp_services_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dhcp_services_query_count.yml
  tasks:
    - name: Run dhcp_services_query_count from its model
      cisco.catalystcenter.dhcp_services_query_count:
        catalystcenter_debug: "{{ dhcp_services_query_count.catalystcenter_debug if dhcp_services_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dhcp_services_query_count.catalystcenter_host if dhcp_services_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dhcp_services_query_count.catalystcenter_password if dhcp_services_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dhcp_services_query_count.catalystcenter_port if dhcp_services_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dhcp_services_query_count.catalystcenter_username if dhcp_services_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dhcp_services_query_count.catalystcenter_verify if dhcp_services_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dhcp_services_query_count.catalystcenter_version if dhcp_services_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ dhcp_services_query_count.endTime if dhcp_services_query_count.endTime is not none else omit }}"
        filters: "{{ (dhcp_services_query_count.filters | cat_strip_nulls) if (dhcp_services_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ dhcp_services_query_count.headers if dhcp_services_query_count.headers is not none else omit }}"
        startTime: "{{ dhcp_services_query_count.startTime if dhcp_services_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ dhcp_services_query_count.validate_response_schema if dhcp_services_query_count.validate_response_schema is not none else omit }}"
      register: dhcp_services_query_count_result
      tags:
        - never
        - dhcp_services_query_count
