---
# Sample playbook for cisco.catalystcenter.application_visibility_network_devices_disable_app_telemetry (cisco.catalystcenter 2.15.0)
# Build order: 1324
# Resource module for Application Visibility Network Devices Disable App Telemetry
# Reads ../models/application_visibility_network_devices_disable_app_telemetry.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/application_visibility_network_devices_disable_app_telemetry_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags application_visibility_network_devices_disable_app_telemetry.

- name: "1324 application_visibility_network_devices_disable_app_telemetry"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/application_visibility_network_devices_disable_app_telemetry.yml
  tasks:
    - name: Run application_visibility_network_devices_disable_app_telemetry from its model
      cisco.catalystcenter.application_visibility_network_devices_disable_app_telemetry:
        catalystcenter_debug: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_debug if application_visibility_network_devices_disable_app_telemetry.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_host if application_visibility_network_devices_disable_app_telemetry.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_password if application_visibility_network_devices_disable_app_telemetry.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_port if application_visibility_network_devices_disable_app_telemetry.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_username if application_visibility_network_devices_disable_app_telemetry.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_verify if application_visibility_network_devices_disable_app_telemetry.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ application_visibility_network_devices_disable_app_telemetry.catalystcenter_version if application_visibility_network_devices_disable_app_telemetry.catalystcenter_version is not none else omit }}"
        networkDeviceIds: "{{ (application_visibility_network_devices_disable_app_telemetry.networkDeviceIds | cat_strip_nulls) if (application_visibility_network_devices_disable_app_telemetry.networkDeviceIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ application_visibility_network_devices_disable_app_telemetry.validate_response_schema if application_visibility_network_devices_disable_app_telemetry.validate_response_schema is not none else omit }}"
      register: application_visibility_network_devices_disable_app_telemetry_result
      tags:
        - never
        - application_visibility_network_devices_disable_app_telemetry
