---
# Sample playbook for cisco.catalystcenter.transit_peer_network_info (cisco.catalystcenter 2.15.0)
# Build order: 827
# Information module for Transit Peer Network
# Reads ../models/transit_peer_network_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/transit_peer_network_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0827 transit_peer_network_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/transit_peer_network_info.yml
  tasks:
    - name: Run transit_peer_network_info from its model
      cisco.catalystcenter.transit_peer_network_info:
        catalystcenter_debug: "{{ transit_peer_network_info.catalystcenter_debug if transit_peer_network_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ transit_peer_network_info.catalystcenter_host if transit_peer_network_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ transit_peer_network_info.catalystcenter_password if transit_peer_network_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ transit_peer_network_info.catalystcenter_port if transit_peer_network_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ transit_peer_network_info.catalystcenter_username if transit_peer_network_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ transit_peer_network_info.catalystcenter_verify if transit_peer_network_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ transit_peer_network_info.catalystcenter_version if transit_peer_network_info.catalystcenter_version is not none else omit }}"
        headers: "{{ transit_peer_network_info.headers if transit_peer_network_info.headers is not none else omit }}"
        transitPeerNetworkName: "{{ transit_peer_network_info.transitPeerNetworkName if transit_peer_network_info.transitPeerNetworkName is not none else omit }}"
        validate_response_schema: "{{ transit_peer_network_info.validate_response_schema if transit_peer_network_info.validate_response_schema is not none else omit }}"
      register: transit_peer_network_info_result
