---
# Sample playbook for cisco.catalystcenter.wireless_dynamic_interface_info (cisco.catalystcenter 2.15.0)
# Build order: 1272
# Information module for Wireless Dynamic Interface
# Reads ../models/wireless_dynamic_interface_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_dynamic_interface_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1272 wireless_dynamic_interface_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_dynamic_interface_info.yml
  tasks:
    - name: Run wireless_dynamic_interface_info from its model
      cisco.catalystcenter.wireless_dynamic_interface_info:
        catalystcenter_debug: "{{ wireless_dynamic_interface_info.catalystcenter_debug if wireless_dynamic_interface_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_dynamic_interface_info.catalystcenter_host if wireless_dynamic_interface_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_dynamic_interface_info.catalystcenter_password if wireless_dynamic_interface_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_dynamic_interface_info.catalystcenter_port if wireless_dynamic_interface_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_dynamic_interface_info.catalystcenter_username if wireless_dynamic_interface_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_dynamic_interface_info.catalystcenter_verify if wireless_dynamic_interface_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_dynamic_interface_info.catalystcenter_version if wireless_dynamic_interface_info.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_dynamic_interface_info.headers if wireless_dynamic_interface_info.headers is not none else omit }}"
        interface_name: "{{ wireless_dynamic_interface_info.interface_name if wireless_dynamic_interface_info.interface_name is not none else omit }}"
        validate_response_schema: "{{ wireless_dynamic_interface_info.validate_response_schema if wireless_dynamic_interface_info.validate_response_schema is not none else omit }}"
      register: wireless_dynamic_interface_info_result
