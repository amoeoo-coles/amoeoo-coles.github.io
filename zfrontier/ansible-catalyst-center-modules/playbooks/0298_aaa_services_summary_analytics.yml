---
# Sample playbook for cisco.catalystcenter.aaa_services_summary_analytics (cisco.catalystcenter 2.15.0)
# Build order: 298
# Resource module for Aaa Services Summary Analytics
# Reads ../models/aaa_services_summary_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/aaa_services_summary_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags aaa_services_summary_analytics.

- name: "0298 aaa_services_summary_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/aaa_services_summary_analytics.yml
  tasks:
    - name: Run aaa_services_summary_analytics from its model
      cisco.catalystcenter.aaa_services_summary_analytics:
        aggregateAttributes: "{{ (aaa_services_summary_analytics.aggregateAttributes | cat_strip_nulls) if (aaa_services_summary_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (aaa_services_summary_analytics.attributes | cat_strip_nulls) if (aaa_services_summary_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ aaa_services_summary_analytics.catalystcenter_debug if aaa_services_summary_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ aaa_services_summary_analytics.catalystcenter_host if aaa_services_summary_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ aaa_services_summary_analytics.catalystcenter_password if aaa_services_summary_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ aaa_services_summary_analytics.catalystcenter_port if aaa_services_summary_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ aaa_services_summary_analytics.catalystcenter_username if aaa_services_summary_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ aaa_services_summary_analytics.catalystcenter_verify if aaa_services_summary_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ aaa_services_summary_analytics.catalystcenter_version if aaa_services_summary_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ aaa_services_summary_analytics.endTime if aaa_services_summary_analytics.endTime is not none else omit }}"
        filters: "{{ (aaa_services_summary_analytics.filters | cat_strip_nulls) if (aaa_services_summary_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (aaa_services_summary_analytics.groupBy | cat_strip_nulls) if (aaa_services_summary_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        headers: "{{ aaa_services_summary_analytics.headers if aaa_services_summary_analytics.headers is not none else omit }}"
        page: "{{ (aaa_services_summary_analytics.page | cat_strip_nulls) if (aaa_services_summary_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ aaa_services_summary_analytics.startTime if aaa_services_summary_analytics.startTime is not none else omit }}"
        validate_response_schema: "{{ aaa_services_summary_analytics.validate_response_schema if aaa_services_summary_analytics.validate_response_schema is not none else omit }}"
      register: aaa_services_summary_analytics_result
      tags:
        - never
        - aaa_services_summary_analytics
