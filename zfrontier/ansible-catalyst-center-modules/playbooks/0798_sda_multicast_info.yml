---
# Sample playbook for cisco.catalystcenter.sda_multicast_info (cisco.catalystcenter 2.15.0)
# Build order: 798
# Information module for Sda Multicast
# Reads ../models/sda_multicast_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_multicast_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0798 sda_multicast_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_multicast_info.yml
  tasks:
    - name: Run sda_multicast_info from its model
      cisco.catalystcenter.sda_multicast_info:
        catalystcenter_debug: "{{ sda_multicast_info.catalystcenter_debug if sda_multicast_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_multicast_info.catalystcenter_host if sda_multicast_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_multicast_info.catalystcenter_password if sda_multicast_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_multicast_info.catalystcenter_port if sda_multicast_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_multicast_info.catalystcenter_username if sda_multicast_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_multicast_info.catalystcenter_verify if sda_multicast_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_multicast_info.catalystcenter_version if sda_multicast_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_multicast_info.headers if sda_multicast_info.headers is not none else omit }}"
        siteNameHierarchy: "{{ sda_multicast_info.siteNameHierarchy if sda_multicast_info.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ sda_multicast_info.validate_response_schema if sda_multicast_info.validate_response_schema is not none else omit }}"
      register: sda_multicast_info_result
