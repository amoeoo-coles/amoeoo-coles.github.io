---
# Sample playbook for cisco.catalystcenter.interface_operation_create (cisco.catalystcenter 2.15.0)
# Build order: 334
# Resource module for Interface Operation Create
# Reads ../models/interface_operation_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/interface_operation_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags interface_operation_create.

- name: "0334 interface_operation_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/interface_operation_create.yml
  tasks:
    - name: Run interface_operation_create from its model
      cisco.catalystcenter.interface_operation_create:
        catalystcenter_debug: "{{ interface_operation_create.catalystcenter_debug if interface_operation_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ interface_operation_create.catalystcenter_host if interface_operation_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ interface_operation_create.catalystcenter_password if interface_operation_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ interface_operation_create.catalystcenter_port if interface_operation_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ interface_operation_create.catalystcenter_username if interface_operation_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ interface_operation_create.catalystcenter_verify if interface_operation_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ interface_operation_create.catalystcenter_version if interface_operation_create.catalystcenter_version is not none else omit }}"
        deploymentMode: "{{ interface_operation_create.deploymentMode if interface_operation_create.deploymentMode is not none else omit }}"
        interfaceUuid: "{{ interface_operation_create.interfaceUuid if interface_operation_create.interfaceUuid is not none else omit }}"
        operation: "{{ interface_operation_create.operation if interface_operation_create.operation is not none else omit }}"
        payload: "{{ (interface_operation_create.payload | cat_strip_nulls) if (interface_operation_create.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ interface_operation_create.validate_response_schema if interface_operation_create.validate_response_schema is not none else omit }}"
      register: interface_operation_create_result
      tags:
        - never
        - interface_operation_create
