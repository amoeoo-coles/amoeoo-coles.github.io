---
# Sample playbook for cisco.catalystcenter.service_provider_v2 (cisco.catalystcenter 2.15.0)
# Build order: 200
# Resource module for Service Provider V2
# Reads ../models/service_provider_v2.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/service_provider_v2_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags service_provider_v2.

- name: "0200 service_provider_v2"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/service_provider_v2.yml
  tasks:
    - name: Run service_provider_v2 from its model
      cisco.catalystcenter.service_provider_v2:
        catalystcenter_debug: "{{ service_provider_v2.catalystcenter_debug if service_provider_v2.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ service_provider_v2.catalystcenter_host if service_provider_v2.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ service_provider_v2.catalystcenter_password if service_provider_v2.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ service_provider_v2.catalystcenter_port if service_provider_v2.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ service_provider_v2.catalystcenter_username if service_provider_v2.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ service_provider_v2.catalystcenter_verify if service_provider_v2.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ service_provider_v2.catalystcenter_version if service_provider_v2.catalystcenter_version is not none else omit }}"
        settings: "{{ (service_provider_v2.settings | cat_strip_nulls) if (service_provider_v2.settings | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ service_provider_v2.validate_response_schema if service_provider_v2.validate_response_schema is not none else omit }}"
      register: service_provider_v2_result
      tags:
        - never
        - service_provider_v2
