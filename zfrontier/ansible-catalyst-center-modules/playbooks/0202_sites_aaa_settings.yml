---
# Sample playbook for cisco.catalystcenter.sites_aaa_settings (cisco.catalystcenter 2.15.0)
# Build order: 202
# Resource module for Sites Aaa Settings
# Reads ../models/sites_aaa_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_aaa_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sites_aaa_settings.

- name: "0202 sites_aaa_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_aaa_settings.yml
  tasks:
    - name: Run sites_aaa_settings from its model
      cisco.catalystcenter.sites_aaa_settings:
        aaaClient: "{{ (sites_aaa_settings.aaaClient | cat_strip_nulls) if (sites_aaa_settings.aaaClient | cat_strip_nulls) is not none else omit }}"
        aaaNetwork: "{{ (sites_aaa_settings.aaaNetwork | cat_strip_nulls) if (sites_aaa_settings.aaaNetwork | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ sites_aaa_settings.catalystcenter_debug if sites_aaa_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_aaa_settings.catalystcenter_host if sites_aaa_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_aaa_settings.catalystcenter_password if sites_aaa_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_aaa_settings.catalystcenter_port if sites_aaa_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_aaa_settings.catalystcenter_username if sites_aaa_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_aaa_settings.catalystcenter_verify if sites_aaa_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_aaa_settings.catalystcenter_version if sites_aaa_settings.catalystcenter_version is not none else omit }}"
        id: "{{ sites_aaa_settings.id if sites_aaa_settings.id is not none else omit }}"
        validate_response_schema: "{{ sites_aaa_settings.validate_response_schema if sites_aaa_settings.validate_response_schema is not none else omit }}"
      register: sites_aaa_settings_result
      tags:
        - never
        - sites_aaa_settings
