---
# Sample playbook for cisco.catalystcenter.event_syslog_config_info (cisco.catalystcenter 2.15.0)
# Build order: 1511
# Information module for Event Syslog Config
# Reads ../models/event_syslog_config_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_syslog_config_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1511 event_syslog_config_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_syslog_config_info.yml
  tasks:
    - name: Run event_syslog_config_info from its model
      cisco.catalystcenter.event_syslog_config_info:
        catalystcenter_debug: "{{ event_syslog_config_info.catalystcenter_debug if event_syslog_config_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_syslog_config_info.catalystcenter_host if event_syslog_config_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_syslog_config_info.catalystcenter_password if event_syslog_config_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_syslog_config_info.catalystcenter_port if event_syslog_config_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_syslog_config_info.catalystcenter_username if event_syslog_config_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_syslog_config_info.catalystcenter_verify if event_syslog_config_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_syslog_config_info.catalystcenter_version if event_syslog_config_info.catalystcenter_version is not none else omit }}"
        configId: "{{ event_syslog_config_info.configId if event_syslog_config_info.configId is not none else omit }}"
        headers: "{{ event_syslog_config_info.headers if event_syslog_config_info.headers is not none else omit }}"
        limit: "{{ event_syslog_config_info.limit if event_syslog_config_info.limit is not none else omit }}"
        name: "{{ event_syslog_config_info.name if event_syslog_config_info.name is not none else omit }}"
        offset: "{{ event_syslog_config_info.offset if event_syslog_config_info.offset is not none else omit }}"
        order: "{{ event_syslog_config_info.order if event_syslog_config_info.order is not none else omit }}"
        protocol: "{{ event_syslog_config_info.protocol if event_syslog_config_info.protocol is not none else omit }}"
        sortBy: "{{ event_syslog_config_info.sortBy if event_syslog_config_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ event_syslog_config_info.validate_response_schema if event_syslog_config_info.validate_response_schema is not none else omit }}"
      register: event_syslog_config_info_result
