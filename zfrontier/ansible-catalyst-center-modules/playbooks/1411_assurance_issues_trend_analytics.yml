---
# Sample playbook for cisco.catalystcenter.assurance_issues_trend_analytics (cisco.catalystcenter 2.15.0)
# Build order: 1411
# Resource module for Assurance Issues Trend Analytics
# Reads ../models/assurance_issues_trend_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_issues_trend_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assurance_issues_trend_analytics.

- name: "1411 assurance_issues_trend_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_issues_trend_analytics.yml
  tasks:
    - name: Run assurance_issues_trend_analytics from its model
      cisco.catalystcenter.assurance_issues_trend_analytics:
        aggregateAttributes: "{{ (assurance_issues_trend_analytics.aggregateAttributes | cat_strip_nulls) if (assurance_issues_trend_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (assurance_issues_trend_analytics.attributes | cat_strip_nulls) if (assurance_issues_trend_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ assurance_issues_trend_analytics.catalystcenter_debug if assurance_issues_trend_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_issues_trend_analytics.catalystcenter_host if assurance_issues_trend_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_issues_trend_analytics.catalystcenter_password if assurance_issues_trend_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_issues_trend_analytics.catalystcenter_port if assurance_issues_trend_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_issues_trend_analytics.catalystcenter_username if assurance_issues_trend_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_issues_trend_analytics.catalystcenter_verify if assurance_issues_trend_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_issues_trend_analytics.catalystcenter_version if assurance_issues_trend_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ assurance_issues_trend_analytics.endTime if assurance_issues_trend_analytics.endTime is not none else omit }}"
        filters: "{{ (assurance_issues_trend_analytics.filters | cat_strip_nulls) if (assurance_issues_trend_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (assurance_issues_trend_analytics.groupBy | cat_strip_nulls) if (assurance_issues_trend_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        headers: "{{ assurance_issues_trend_analytics.headers if assurance_issues_trend_analytics.headers is not none else omit }}"
        page: "{{ (assurance_issues_trend_analytics.page | cat_strip_nulls) if (assurance_issues_trend_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ assurance_issues_trend_analytics.startTime if assurance_issues_trend_analytics.startTime is not none else omit }}"
        trendInterval: "{{ assurance_issues_trend_analytics.trendInterval if assurance_issues_trend_analytics.trendInterval is not none else omit }}"
        validate_response_schema: "{{ assurance_issues_trend_analytics.validate_response_schema if assurance_issues_trend_analytics.validate_response_schema is not none else omit }}"
      register: assurance_issues_trend_analytics_result
      tags:
        - never
        - assurance_issues_trend_analytics
