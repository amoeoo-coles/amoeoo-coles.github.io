---
# Sample playbook for cisco.catalystcenter.sites_time_zone_settings_info (cisco.catalystcenter 2.15.0)
# Build order: 242
# Information module for Sites Time Zone Settings
# Reads ../models/sites_time_zone_settings_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_time_zone_settings_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0242 sites_time_zone_settings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_time_zone_settings_info.yml
  tasks:
    - name: Run sites_time_zone_settings_info from its model
      cisco.catalystcenter.sites_time_zone_settings_info:
        _inherited: "{{ sites_time_zone_settings_info._inherited if sites_time_zone_settings_info._inherited is not none else omit }}"
        catalystcenter_debug: "{{ sites_time_zone_settings_info.catalystcenter_debug if sites_time_zone_settings_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_time_zone_settings_info.catalystcenter_host if sites_time_zone_settings_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_time_zone_settings_info.catalystcenter_password if sites_time_zone_settings_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_time_zone_settings_info.catalystcenter_port if sites_time_zone_settings_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_time_zone_settings_info.catalystcenter_username if sites_time_zone_settings_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_time_zone_settings_info.catalystcenter_verify if sites_time_zone_settings_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_time_zone_settings_info.catalystcenter_version if sites_time_zone_settings_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sites_time_zone_settings_info.headers if sites_time_zone_settings_info.headers is not none else omit }}"
        id: "{{ sites_time_zone_settings_info.id if sites_time_zone_settings_info.id is not none else omit }}"
        validate_response_schema: "{{ sites_time_zone_settings_info.validate_response_schema if sites_time_zone_settings_info.validate_response_schema is not none else omit }}"
      register: sites_time_zone_settings_info_result
