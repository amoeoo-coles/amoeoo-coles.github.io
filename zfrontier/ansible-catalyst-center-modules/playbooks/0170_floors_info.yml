---
# Sample playbook for cisco.catalystcenter.floors_info (cisco.catalystcenter 2.15.0)
# Build order: 170
# Information module for Floors
# Reads ../models/floors_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/floors_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0170 floors_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/floors_info.yml
  tasks:
    - name: Run floors_info from its model
      cisco.catalystcenter.floors_info:
        _unitsOfMeasure: "{{ floors_info._unitsOfMeasure if floors_info._unitsOfMeasure is not none else omit }}"
        catalystcenter_debug: "{{ floors_info.catalystcenter_debug if floors_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ floors_info.catalystcenter_host if floors_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ floors_info.catalystcenter_password if floors_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ floors_info.catalystcenter_port if floors_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ floors_info.catalystcenter_username if floors_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ floors_info.catalystcenter_verify if floors_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ floors_info.catalystcenter_version if floors_info.catalystcenter_version is not none else omit }}"
        headers: "{{ floors_info.headers if floors_info.headers is not none else omit }}"
        id: "{{ floors_info.id if floors_info.id is not none else omit }}"
        validate_response_schema: "{{ floors_info.validate_response_schema if floors_info.validate_response_schema is not none else omit }}"
      register: floors_info_result
