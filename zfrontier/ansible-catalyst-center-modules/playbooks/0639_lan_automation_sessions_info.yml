---
# Sample playbook for cisco.catalystcenter.lan_automation_sessions_info (cisco.catalystcenter 2.15.0)
# Build order: 639
# Information module for Lan Automation Sessions
# Reads ../models/lan_automation_sessions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_sessions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0639 lan_automation_sessions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_sessions_info.yml
  tasks:
    - name: Run lan_automation_sessions_info from its model
      cisco.catalystcenter.lan_automation_sessions_info:
        catalystcenter_debug: "{{ lan_automation_sessions_info.catalystcenter_debug if lan_automation_sessions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_sessions_info.catalystcenter_host if lan_automation_sessions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_sessions_info.catalystcenter_password if lan_automation_sessions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_sessions_info.catalystcenter_port if lan_automation_sessions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_sessions_info.catalystcenter_username if lan_automation_sessions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_sessions_info.catalystcenter_verify if lan_automation_sessions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_sessions_info.catalystcenter_version if lan_automation_sessions_info.catalystcenter_version is not none else omit }}"
        headers: "{{ lan_automation_sessions_info.headers if lan_automation_sessions_info.headers is not none else omit }}"
        validate_response_schema: "{{ lan_automation_sessions_info.validate_response_schema if lan_automation_sessions_info.validate_response_schema is not none else omit }}"
      register: lan_automation_sessions_info_result
