---
# Sample playbook for cisco.catalystcenter.wireless_controllers_mesh_ap_neighbours_info (cisco.catalystcenter 2.15.0)
# Build order: 1261
# Information module for Wireless Controllers Mesh Ap Neighbours
# Reads ../models/wireless_controllers_mesh_ap_neighbours_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_mesh_ap_neighbours_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1261 wireless_controllers_mesh_ap_neighbours_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_mesh_ap_neighbours_info.yml
  tasks:
    - name: Run wireless_controllers_mesh_ap_neighbours_info from its model
      cisco.catalystcenter.wireless_controllers_mesh_ap_neighbours_info:
        apName: "{{ wireless_controllers_mesh_ap_neighbours_info.apName if wireless_controllers_mesh_ap_neighbours_info.apName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_debug if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_host if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_password if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_port if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_username if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_verify if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_mesh_ap_neighbours_info.catalystcenter_version if wireless_controllers_mesh_ap_neighbours_info.catalystcenter_version is not none else omit }}"
        ethernetMacAddress: "{{ wireless_controllers_mesh_ap_neighbours_info.ethernetMacAddress if wireless_controllers_mesh_ap_neighbours_info.ethernetMacAddress is not none else omit }}"
        headers: "{{ wireless_controllers_mesh_ap_neighbours_info.headers if wireless_controllers_mesh_ap_neighbours_info.headers is not none else omit }}"
        meshRole: "{{ wireless_controllers_mesh_ap_neighbours_info.meshRole if wireless_controllers_mesh_ap_neighbours_info.meshRole is not none else omit }}"
        neighbourType: "{{ wireless_controllers_mesh_ap_neighbours_info.neighbourType if wireless_controllers_mesh_ap_neighbours_info.neighbourType is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_mesh_ap_neighbours_info.validate_response_schema if wireless_controllers_mesh_ap_neighbours_info.validate_response_schema is not none else omit }}"
        wlcIpAddress: "{{ wireless_controllers_mesh_ap_neighbours_info.wlcIpAddress if wireless_controllers_mesh_ap_neighbours_info.wlcIpAddress is not none else omit }}"
      register: wireless_controllers_mesh_ap_neighbours_info_result
