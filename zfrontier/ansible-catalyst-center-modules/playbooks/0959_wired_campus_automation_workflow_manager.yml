        catalystcenter_username: "{{ wired_campus_automation_workflow_manager.catalystcenter_username if wired_campus_automation_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wired_campus_automation_workflow_manager.catalystcenter_verify if wired_campus_automation_workflow_manager.catalystcenter_verify is not none else omit }}"
