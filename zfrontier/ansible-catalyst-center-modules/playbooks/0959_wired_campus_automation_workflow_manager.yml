        catalystcenter_log_append: "{{ wired_campus_automation_workflow_manager.catalystcenter_log_append if wired_campus_automation_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ wired_campus_automation_workflow_manager.catalystcenter_log_file_path if wired_campus_automation_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ wired_campus_automation_workflow_manager.catalystcenter_log_level if wired_campus_automation_workflow_manager.catalystcenter_log_level is not none else omit }}"
