---
# Sample playbook for cisco.catalystcenter.swim_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 588
# Module to manage SWIM (Software Image Management) operations in Cisco Catalyst Center
# Reads ../models/swim_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/swim_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags swim_workflow_manager.

- name: "0588 swim_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/swim_workflow_manager.yml
  tasks:
    - name: Run swim_workflow_manager from its model
      cisco.catalystcenter.swim_workflow_manager:
        activation_batch_size: "{{ swim_workflow_manager.activation_batch_size if swim_workflow_manager.activation_batch_size is not none else omit }}"
        activation_poll_interval: "{{ swim_workflow_manager.activation_poll_interval if swim_workflow_manager.activation_poll_interval is not none else omit }}"
        catalystcenter_api_task_timeout: "{{ swim_workflow_manager.catalystcenter_api_task_timeout if swim_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ swim_workflow_manager.catalystcenter_debug if swim_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ swim_workflow_manager.catalystcenter_host if swim_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ swim_workflow_manager.catalystcenter_log if swim_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ swim_workflow_manager.catalystcenter_log_append if swim_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ swim_workflow_manager.catalystcenter_log_file_path if swim_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ swim_workflow_manager.catalystcenter_log_level if swim_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ swim_workflow_manager.catalystcenter_password if swim_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ swim_workflow_manager.catalystcenter_port if swim_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ swim_workflow_manager.catalystcenter_task_poll_interval if swim_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ swim_workflow_manager.catalystcenter_username if swim_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ swim_workflow_manager.catalystcenter_verify if swim_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ swim_workflow_manager.catalystcenter_version if swim_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (swim_workflow_manager.config | cat_strip_nulls) if (swim_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ swim_workflow_manager.config_verify if swim_workflow_manager.config_verify is not none else omit }}"
        distribution_batch_size: "{{ swim_workflow_manager.distribution_batch_size if swim_workflow_manager.distribution_batch_size is not none else omit }}"
        distribution_poll_interval: "{{ swim_workflow_manager.distribution_poll_interval if swim_workflow_manager.distribution_poll_interval is not none else omit }}"
        state: "{{ swim_workflow_manager.state if swim_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ swim_workflow_manager.validate_response_schema if swim_workflow_manager.validate_response_schema is not none else omit }}"
      register: swim_workflow_manager_result
      tags:
        - never
        - swim_workflow_manager
