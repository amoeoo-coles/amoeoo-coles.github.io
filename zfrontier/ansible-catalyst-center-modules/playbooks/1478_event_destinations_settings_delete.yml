---
# Sample playbook for cisco.catalystcenter.event_destinations_settings_delete (cisco.catalystcenter 2.15.0)
# Build order: 1478
# Resource module for Event Destinations Settings Delete
# Reads ../models/event_destinations_settings_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_destinations_settings_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_destinations_settings_delete.

- name: "1478 event_destinations_settings_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_destinations_settings_delete.yml
  tasks:
    - name: Run event_destinations_settings_delete from its model
      cisco.catalystcenter.event_destinations_settings_delete:
        catalystcenter_debug: "{{ event_destinations_settings_delete.catalystcenter_debug if event_destinations_settings_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_destinations_settings_delete.catalystcenter_host if event_destinations_settings_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_destinations_settings_delete.catalystcenter_password if event_destinations_settings_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_destinations_settings_delete.catalystcenter_port if event_destinations_settings_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_destinations_settings_delete.catalystcenter_username if event_destinations_settings_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_destinations_settings_delete.catalystcenter_verify if event_destinations_settings_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_destinations_settings_delete.catalystcenter_version if event_destinations_settings_delete.catalystcenter_version is not none else omit }}"
        destinationType: "{{ event_destinations_settings_delete.destinationType if event_destinations_settings_delete.destinationType is not none else omit }}"
        id: "{{ event_destinations_settings_delete.id if event_destinations_settings_delete.id is not none else omit }}"
        validate_response_schema: "{{ event_destinations_settings_delete.validate_response_schema if event_destinations_settings_delete.validate_response_schema is not none else omit }}"
      register: event_destinations_settings_delete_result
      tags:
        - never
        - event_destinations_settings_delete
