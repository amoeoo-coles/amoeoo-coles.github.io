---
# Sample playbook for cisco.catalystcenter.provisioning_settings (cisco.catalystcenter 2.15.0)
# Build order: 10
# Resource module for Provisioning Settings
# Reads ../models/provisioning_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/provisioning_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags provisioning_settings.

- name: "0010 provisioning_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/provisioning_settings.yml
  tasks:
    - name: Run provisioning_settings from its model
      cisco.catalystcenter.provisioning_settings:
        catalystcenter_debug: "{{ provisioning_settings.catalystcenter_debug if provisioning_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ provisioning_settings.catalystcenter_host if provisioning_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ provisioning_settings.catalystcenter_password if provisioning_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ provisioning_settings.catalystcenter_port if provisioning_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ provisioning_settings.catalystcenter_username if provisioning_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ provisioning_settings.catalystcenter_verify if provisioning_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ provisioning_settings.catalystcenter_version if provisioning_settings.catalystcenter_version is not none else omit }}"
        requireItsmApproval: "{{ provisioning_settings.requireItsmApproval if provisioning_settings.requireItsmApproval is not none else omit }}"
        requirePreview: "{{ provisioning_settings.requirePreview if provisioning_settings.requirePreview is not none else omit }}"
        validate_response_schema: "{{ provisioning_settings.validate_response_schema if provisioning_settings.validate_response_schema is not none else omit }}"
      register: provisioning_settings_result
      tags:
        - never
        - provisioning_settings
