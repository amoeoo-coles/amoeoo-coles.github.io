---
# Sample playbook for cisco.catalystcenter.settings_ap_pnp_location_info (cisco.catalystcenter 2.15.0)
# Build order: 1072
# Information module for Settings Ap Pnp Location
# Reads ../models/settings_ap_pnp_location_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/settings_ap_pnp_location_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1072 settings_ap_pnp_location_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/settings_ap_pnp_location_info.yml
  tasks:
    - name: Run settings_ap_pnp_location_info from its model
      cisco.catalystcenter.settings_ap_pnp_location_info:
        catalystcenter_debug: "{{ settings_ap_pnp_location_info.catalystcenter_debug if settings_ap_pnp_location_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ settings_ap_pnp_location_info.catalystcenter_host if settings_ap_pnp_location_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ settings_ap_pnp_location_info.catalystcenter_password if settings_ap_pnp_location_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ settings_ap_pnp_location_info.catalystcenter_port if settings_ap_pnp_location_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ settings_ap_pnp_location_info.catalystcenter_username if settings_ap_pnp_location_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ settings_ap_pnp_location_info.catalystcenter_verify if settings_ap_pnp_location_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ settings_ap_pnp_location_info.catalystcenter_version if settings_ap_pnp_location_info.catalystcenter_version is not none else omit }}"
        headers: "{{ settings_ap_pnp_location_info.headers if settings_ap_pnp_location_info.headers is not none else omit }}"
        validate_response_schema: "{{ settings_ap_pnp_location_info.validate_response_schema if settings_ap_pnp_location_info.validate_response_schema is not none else omit }}"
      register: settings_ap_pnp_location_info_result
