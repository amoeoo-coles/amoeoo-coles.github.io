---
# Sample playbook for cisco.catalystcenter.projects_info (cisco.catalystcenter 2.15.0)
# Build order: 612
# Information module for Projects
# Reads ../models/projects_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/projects_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0612 projects_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/projects_info.yml
  tasks:
    - name: Run projects_info from its model
      cisco.catalystcenter.projects_info:
        catalystcenter_debug: "{{ projects_info.catalystcenter_debug if projects_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ projects_info.catalystcenter_host if projects_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ projects_info.catalystcenter_password if projects_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ projects_info.catalystcenter_port if projects_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ projects_info.catalystcenter_username if projects_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ projects_info.catalystcenter_verify if projects_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ projects_info.catalystcenter_version if projects_info.catalystcenter_version is not none else omit }}"
        headers: "{{ projects_info.headers if projects_info.headers is not none else omit }}"
        limit: "{{ projects_info.limit if projects_info.limit is not none else omit }}"
        name: "{{ projects_info.name if projects_info.name is not none else omit }}"
        offset: "{{ projects_info.offset if projects_info.offset is not none else omit }}"
        projectId: "{{ projects_info.projectId if projects_info.projectId is not none else omit }}"
        validate_response_schema: "{{ projects_info.validate_response_schema if projects_info.validate_response_schema is not none else omit }}"
      register: projects_info_result
