---
# Sample playbook for cisco.catalystcenter.wireless_settings_interfaces (cisco.catalystcenter 2.15.0)
# Build order: 1051
# Resource module for Wireless Settings Interfaces
# Reads ../models/wireless_settings_interfaces.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_interfaces_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_interfaces.

- name: "1051 wireless_settings_interfaces"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_interfaces.yml
  tasks:
    - name: Run wireless_settings_interfaces from its model
      cisco.catalystcenter.wireless_settings_interfaces:
        catalystcenter_debug: "{{ wireless_settings_interfaces.catalystcenter_debug if wireless_settings_interfaces.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_interfaces.catalystcenter_host if wireless_settings_interfaces.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_interfaces.catalystcenter_password if wireless_settings_interfaces.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_interfaces.catalystcenter_port if wireless_settings_interfaces.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_interfaces.catalystcenter_username if wireless_settings_interfaces.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_interfaces.catalystcenter_verify if wireless_settings_interfaces.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_interfaces.catalystcenter_version if wireless_settings_interfaces.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_settings_interfaces.id if wireless_settings_interfaces.id is not none else omit }}"
        interfaceName: "{{ wireless_settings_interfaces.interfaceName if wireless_settings_interfaces.interfaceName is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_interfaces.validate_response_schema if wireless_settings_interfaces.validate_response_schema is not none else omit }}"
        vlanId: "{{ wireless_settings_interfaces.vlanId if wireless_settings_interfaces.vlanId is not none else omit }}"
      register: wireless_settings_interfaces_result
      tags:
        - never
        - wireless_settings_interfaces
