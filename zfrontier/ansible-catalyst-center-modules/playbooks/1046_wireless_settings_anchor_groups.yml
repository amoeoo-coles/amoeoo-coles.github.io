---
# Sample playbook for cisco.catalystcenter.wireless_settings_anchor_groups (cisco.catalystcenter 2.15.0)
# Build order: 1046
# Resource module for Wireless Settings Anchor Groups
# Reads ../models/wireless_settings_anchor_groups.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_anchor_groups_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_anchor_groups.

- name: "1046 wireless_settings_anchor_groups"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_anchor_groups.yml
  tasks:
    - name: Run wireless_settings_anchor_groups from its model
      cisco.catalystcenter.wireless_settings_anchor_groups:
        anchorGroupName: "{{ wireless_settings_anchor_groups.anchorGroupName if wireless_settings_anchor_groups.anchorGroupName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_settings_anchor_groups.catalystcenter_debug if wireless_settings_anchor_groups.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_anchor_groups.catalystcenter_host if wireless_settings_anchor_groups.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_anchor_groups.catalystcenter_password if wireless_settings_anchor_groups.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_anchor_groups.catalystcenter_port if wireless_settings_anchor_groups.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_anchor_groups.catalystcenter_username if wireless_settings_anchor_groups.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_anchor_groups.catalystcenter_verify if wireless_settings_anchor_groups.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_anchor_groups.catalystcenter_version if wireless_settings_anchor_groups.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_settings_anchor_groups.id if wireless_settings_anchor_groups.id is not none else omit }}"
        mobilityAnchors: "{{ (wireless_settings_anchor_groups.mobilityAnchors | cat_strip_nulls) if (wireless_settings_anchor_groups.mobilityAnchors | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_anchor_groups.validate_response_schema if wireless_settings_anchor_groups.validate_response_schema is not none else omit }}"
      register: wireless_settings_anchor_groups_result
      tags:
        - never
        - wireless_settings_anchor_groups
