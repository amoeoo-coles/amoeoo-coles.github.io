---
# Sample playbook for cisco.catalystcenter.device_replacement_info (cisco.catalystcenter 2.15.0)
# Build order: 506
# Information module for Device Replacement
# Reads ../models/device_replacement_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_replacement_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0506 device_replacement_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_replacement_info.yml
  tasks:
    - name: Run device_replacement_info from its model
      cisco.catalystcenter.device_replacement_info:
        catalystcenter_debug: "{{ device_replacement_info.catalystcenter_debug if device_replacement_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_replacement_info.catalystcenter_host if device_replacement_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_replacement_info.catalystcenter_password if device_replacement_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_replacement_info.catalystcenter_port if device_replacement_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_replacement_info.catalystcenter_username if device_replacement_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_replacement_info.catalystcenter_verify if device_replacement_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_replacement_info.catalystcenter_version if device_replacement_info.catalystcenter_version is not none else omit }}"
        family: "{{ (device_replacement_info.family | cat_strip_nulls) if (device_replacement_info.family | cat_strip_nulls) is not none else omit }}"
        faultyDeviceName: "{{ device_replacement_info.faultyDeviceName if device_replacement_info.faultyDeviceName is not none else omit }}"
        faultyDevicePlatform: "{{ device_replacement_info.faultyDevicePlatform if device_replacement_info.faultyDevicePlatform is not none else omit }}"
        faultyDeviceSerialNumber: "{{ device_replacement_info.faultyDeviceSerialNumber if device_replacement_info.faultyDeviceSerialNumber is not none else omit }}"
        headers: "{{ device_replacement_info.headers if device_replacement_info.headers is not none else omit }}"
        limit: "{{ device_replacement_info.limit if device_replacement_info.limit is not none else omit }}"
        offset: "{{ device_replacement_info.offset if device_replacement_info.offset is not none else omit }}"
        replacementDevicePlatform: "{{ device_replacement_info.replacementDevicePlatform if device_replacement_info.replacementDevicePlatform is not none else omit }}"
        replacementDeviceSerialNumber: "{{ device_replacement_info.replacementDeviceSerialNumber if device_replacement_info.replacementDeviceSerialNumber is not none else omit }}"
        replacementStatus: "{{ (device_replacement_info.replacementStatus | cat_strip_nulls) if (device_replacement_info.replacementStatus | cat_strip_nulls) is not none else omit }}"
        sortBy: "{{ device_replacement_info.sortBy if device_replacement_info.sortBy is not none else omit }}"
        sortOrder: "{{ device_replacement_info.sortOrder if device_replacement_info.sortOrder is not none else omit }}"
        validate_response_schema: "{{ device_replacement_info.validate_response_schema if device_replacement_info.validate_response_schema is not none else omit }}"
      register: device_replacement_info_result
