---
# Sample playbook for cisco.catalystcenter.security_rogue_wireless_containment_start (cisco.catalystcenter 2.15.0)
# Build order: 373
# Resource module for Security Rogue Wireless Containment Start
# Reads ../models/security_rogue_wireless_containment_start.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_rogue_wireless_containment_start_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_rogue_wireless_containment_start.

- name: "0373 security_rogue_wireless_containment_start"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_rogue_wireless_containment_start.yml
  tasks:
    - name: Run security_rogue_wireless_containment_start from its model
      cisco.catalystcenter.security_rogue_wireless_containment_start:
        catalystcenter_debug: "{{ security_rogue_wireless_containment_start.catalystcenter_debug if security_rogue_wireless_containment_start.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_rogue_wireless_containment_start.catalystcenter_host if security_rogue_wireless_containment_start.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_rogue_wireless_containment_start.catalystcenter_password if security_rogue_wireless_containment_start.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_rogue_wireless_containment_start.catalystcenter_port if security_rogue_wireless_containment_start.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_rogue_wireless_containment_start.catalystcenter_username if security_rogue_wireless_containment_start.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_rogue_wireless_containment_start.catalystcenter_verify if security_rogue_wireless_containment_start.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_rogue_wireless_containment_start.catalystcenter_version if security_rogue_wireless_containment_start.catalystcenter_version is not none else omit }}"
        macAddress: "{{ security_rogue_wireless_containment_start.macAddress if security_rogue_wireless_containment_start.macAddress is not none else omit }}"
        type: "{{ security_rogue_wireless_containment_start.type if security_rogue_wireless_containment_start.type is not none else omit }}"
        validate_response_schema: "{{ security_rogue_wireless_containment_start.validate_response_schema if security_rogue_wireless_containment_start.validate_response_schema is not none else omit }}"
      register: security_rogue_wireless_containment_start_result
      tags:
        - never
        - security_rogue_wireless_containment_start
