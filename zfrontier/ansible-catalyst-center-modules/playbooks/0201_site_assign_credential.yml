---
# Sample playbook for cisco.catalystcenter.site_assign_credential (cisco.catalystcenter 2.15.0)
# Build order: 201
# Resource module for Site Assign Credential
# Reads ../models/site_assign_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_assign_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags site_assign_credential.

- name: "0201 site_assign_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_assign_credential.yml
  tasks:
    - name: Run site_assign_credential from its model
      cisco.catalystcenter.site_assign_credential:
        catalystcenter_debug: "{{ site_assign_credential.catalystcenter_debug if site_assign_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_assign_credential.catalystcenter_host if site_assign_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_assign_credential.catalystcenter_password if site_assign_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_assign_credential.catalystcenter_port if site_assign_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_assign_credential.catalystcenter_username if site_assign_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_assign_credential.catalystcenter_verify if site_assign_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_assign_credential.catalystcenter_version if site_assign_credential.catalystcenter_version is not none else omit }}"
        cliId: "{{ site_assign_credential.cliId if site_assign_credential.cliId is not none else omit }}"
        headers: "{{ site_assign_credential.headers if site_assign_credential.headers is not none else omit }}"
        httpRead: "{{ site_assign_credential.httpRead if site_assign_credential.httpRead is not none else omit }}"
        httpWrite: "{{ site_assign_credential.httpWrite if site_assign_credential.httpWrite is not none else omit }}"
        siteId: "{{ site_assign_credential.siteId if site_assign_credential.siteId is not none else omit }}"
        snmpV2ReadId: "{{ site_assign_credential.snmpV2ReadId if site_assign_credential.snmpV2ReadId is not none else omit }}"
        snmpV2WriteId: "{{ site_assign_credential.snmpV2WriteId if site_assign_credential.snmpV2WriteId is not none else omit }}"
        snmpV3Id: "{{ site_assign_credential.snmpV3Id if site_assign_credential.snmpV3Id is not none else omit }}"
        validate_response_schema: "{{ site_assign_credential.validate_response_schema if site_assign_credential.validate_response_schema is not none else omit }}"
      register: site_assign_credential_result
      tags:
        - never
        - site_assign_credential
