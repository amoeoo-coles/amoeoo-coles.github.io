---
# Sample playbook for cisco.catalystcenter.sda_multicast_virtual_networks_info (cisco.catalystcenter 2.15.0)
# Build order: 801
# Information module for Sda Multicast Virtual Networks
# Reads ../models/sda_multicast_virtual_networks_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_multicast_virtual_networks_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0801 sda_multicast_virtual_networks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_multicast_virtual_networks_info.yml
  tasks:
    - name: Run sda_multicast_virtual_networks_info from its model
      cisco.catalystcenter.sda_multicast_virtual_networks_info:
        catalystcenter_debug: "{{ sda_multicast_virtual_networks_info.catalystcenter_debug if sda_multicast_virtual_networks_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_multicast_virtual_networks_info.catalystcenter_host if sda_multicast_virtual_networks_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_multicast_virtual_networks_info.catalystcenter_password if sda_multicast_virtual_networks_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_multicast_virtual_networks_info.catalystcenter_port if sda_multicast_virtual_networks_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_multicast_virtual_networks_info.catalystcenter_username if sda_multicast_virtual_networks_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_multicast_virtual_networks_info.catalystcenter_verify if sda_multicast_virtual_networks_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_multicast_virtual_networks_info.catalystcenter_version if sda_multicast_virtual_networks_info.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_multicast_virtual_networks_info.fabricId if sda_multicast_virtual_networks_info.fabricId is not none else omit }}"
        headers: "{{ sda_multicast_virtual_networks_info.headers if sda_multicast_virtual_networks_info.headers is not none else omit }}"
        limit: "{{ sda_multicast_virtual_networks_info.limit if sda_multicast_virtual_networks_info.limit is not none else omit }}"
        offset: "{{ sda_multicast_virtual_networks_info.offset if sda_multicast_virtual_networks_info.offset is not none else omit }}"
        validate_response_schema: "{{ sda_multicast_virtual_networks_info.validate_response_schema if sda_multicast_virtual_networks_info.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_multicast_virtual_networks_info.virtualNetworkName if sda_multicast_virtual_networks_info.virtualNetworkName is not none else omit }}"
      register: sda_multicast_virtual_networks_info_result
