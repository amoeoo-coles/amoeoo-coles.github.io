---
# Sample playbook for cisco.catalystcenter.event_info (cisco.catalystcenter 2.15.0)
# Build order: 1496
# Information module for Event
# Reads ../models/event_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1496 event_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_info.yml
  tasks:
    - name: Run event_info from its model
      cisco.catalystcenter.event_info:
        catalystcenter_debug: "{{ event_info.catalystcenter_debug if event_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_info.catalystcenter_host if event_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_info.catalystcenter_password if event_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_info.catalystcenter_port if event_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_info.catalystcenter_username if event_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_info.catalystcenter_verify if event_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_info.catalystcenter_version if event_info.catalystcenter_version is not none else omit }}"
        eventId: "{{ event_info.eventId if event_info.eventId is not none else omit }}"
        headers: "{{ event_info.headers if event_info.headers is not none else omit }}"
        limit: "{{ event_info.limit if event_info.limit is not none else omit }}"
        offset: "{{ event_info.offset if event_info.offset is not none else omit }}"
        order: "{{ event_info.order if event_info.order is not none else omit }}"
        sortBy: "{{ event_info.sortBy if event_info.sortBy is not none else omit }}"
        tags: "{{ event_info.tags if event_info.tags is not none else omit }}"
        validate_response_schema: "{{ event_info.validate_response_schema if event_info.validate_response_schema is not none else omit }}"
      register: event_info_result
