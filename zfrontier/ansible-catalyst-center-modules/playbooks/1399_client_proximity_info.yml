---
# Sample playbook for cisco.catalystcenter.client_proximity_info (cisco.catalystcenter 2.15.0)
# Build order: 1399
# Information module for Client Proximity
# Reads ../models/client_proximity_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/client_proximity_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1399 client_proximity_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/client_proximity_info.yml
  tasks:
    - name: Run client_proximity_info from its model
      cisco.catalystcenter.client_proximity_info:
        catalystcenter_debug: "{{ client_proximity_info.catalystcenter_debug if client_proximity_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ client_proximity_info.catalystcenter_host if client_proximity_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ client_proximity_info.catalystcenter_password if client_proximity_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ client_proximity_info.catalystcenter_port if client_proximity_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ client_proximity_info.catalystcenter_username if client_proximity_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ client_proximity_info.catalystcenter_verify if client_proximity_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ client_proximity_info.catalystcenter_version if client_proximity_info.catalystcenter_version is not none else omit }}"
        headers: "{{ client_proximity_info.headers if client_proximity_info.headers is not none else omit }}"
        number_days: "{{ client_proximity_info.number_days if client_proximity_info.number_days is not none else omit }}"
        time_resolution: "{{ client_proximity_info.time_resolution if client_proximity_info.time_resolution is not none else omit }}"
        username: "{{ client_proximity_info.username if client_proximity_info.username is not none else omit }}"
        validate_response_schema: "{{ client_proximity_info.validate_response_schema if client_proximity_info.validate_response_schema is not none else omit }}"
      register: client_proximity_info_result
