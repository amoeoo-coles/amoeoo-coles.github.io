---
# Sample playbook for cisco.catalystcenter.iot_fabric_rep_rings (cisco.catalystcenter 2.15.0)
# Build order: 939
# Resource module for Iot Fabric Rep Rings
# Reads ../models/iot_fabric_rep_rings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_fabric_rep_rings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_fabric_rep_rings.

- name: "0939 iot_fabric_rep_rings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_fabric_rep_rings.yml
  tasks:
    - name: Run iot_fabric_rep_rings from its model
      cisco.catalystcenter.iot_fabric_rep_rings:
        catalystcenter_debug: "{{ iot_fabric_rep_rings.catalystcenter_debug if iot_fabric_rep_rings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_fabric_rep_rings.catalystcenter_host if iot_fabric_rep_rings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_fabric_rep_rings.catalystcenter_password if iot_fabric_rep_rings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_fabric_rep_rings.catalystcenter_port if iot_fabric_rep_rings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_fabric_rep_rings.catalystcenter_username if iot_fabric_rep_rings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_fabric_rep_rings.catalystcenter_verify if iot_fabric_rep_rings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_fabric_rep_rings.catalystcenter_version if iot_fabric_rep_rings.catalystcenter_version is not none else omit }}"
        deploymentMode: "{{ iot_fabric_rep_rings.deploymentMode if iot_fabric_rep_rings.deploymentMode is not none else omit }}"
        id: "{{ iot_fabric_rep_rings.id if iot_fabric_rep_rings.id is not none else omit }}"
        macsecConfig: "{{ (iot_fabric_rep_rings.macsecConfig | cat_strip_nulls) if (iot_fabric_rep_rings.macsecConfig | cat_strip_nulls) is not none else omit }}"
        networkDeviceId: "{{ iot_fabric_rep_rings.networkDeviceId if iot_fabric_rep_rings.networkDeviceId is not none else omit }}"
        repSegmentId: "{{ iot_fabric_rep_rings.repSegmentId if iot_fabric_rep_rings.repSegmentId is not none else omit }}"
        repZtpMsg: "{{ iot_fabric_rep_rings.repZtpMsg if iot_fabric_rep_rings.repZtpMsg is not none else omit }}"
        ringMembers: "{{ (iot_fabric_rep_rings.ringMembers | cat_strip_nulls) if (iot_fabric_rep_rings.ringMembers | cat_strip_nulls) is not none else omit }}"
        ringName: "{{ iot_fabric_rep_rings.ringName if iot_fabric_rep_rings.ringName is not none else omit }}"
        rootNeighbourNetworkDeviceIds: "{{ (iot_fabric_rep_rings.rootNeighbourNetworkDeviceIds | cat_strip_nulls) if (iot_fabric_rep_rings.rootNeighbourNetworkDeviceIds | cat_strip_nulls) is not none else omit }}"
        rootNetworkDeviceId: "{{ iot_fabric_rep_rings.rootNetworkDeviceId if iot_fabric_rep_rings.rootNetworkDeviceId is not none else omit }}"
        status: "{{ iot_fabric_rep_rings.status if iot_fabric_rep_rings.status is not none else omit }}"
        validate_response_schema: "{{ iot_fabric_rep_rings.validate_response_schema if iot_fabric_rep_rings.validate_response_schema is not none else omit }}"
      register: iot_fabric_rep_rings_result
      tags:
        - never
        - iot_fabric_rep_rings
