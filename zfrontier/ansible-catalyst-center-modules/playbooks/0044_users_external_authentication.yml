---
# Sample playbook for cisco.catalystcenter.users_external_authentication (cisco.catalystcenter 2.15.0)
# Build order: 44
# Resource module for Users External Authentication
# Reads ../models/users_external_authentication.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/users_external_authentication_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags users_external_authentication.

- name: "0044 users_external_authentication"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/users_external_authentication.yml
  tasks:
    - name: Run users_external_authentication from its model
      cisco.catalystcenter.users_external_authentication:
        catalystcenter_debug: "{{ users_external_authentication.catalystcenter_debug if users_external_authentication.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ users_external_authentication.catalystcenter_host if users_external_authentication.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ users_external_authentication.catalystcenter_password if users_external_authentication.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ users_external_authentication.catalystcenter_port if users_external_authentication.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ users_external_authentication.catalystcenter_username if users_external_authentication.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ users_external_authentication.catalystcenter_verify if users_external_authentication.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ users_external_authentication.catalystcenter_version if users_external_authentication.catalystcenter_version is not none else omit }}"
        enable: "{{ users_external_authentication.enable if users_external_authentication.enable is not none else omit }}"
        validate_response_schema: "{{ users_external_authentication.validate_response_schema if users_external_authentication.validate_response_schema is not none else omit }}"
      register: users_external_authentication_result
      tags:
        - never
        - users_external_authentication
