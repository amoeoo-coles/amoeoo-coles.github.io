---
# Sample playbook for cisco.catalystcenter.inventory_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 536
# Generate YAML playbook for inventory_workflow_manager module.
# Reads ../models/inventory_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/inventory_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags inventory_playbook_config_generator.

- name: "0536 inventory_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/inventory_playbook_config_generator.yml
  tasks:
    - name: Run inventory_playbook_config_generator from its model
      cisco.catalystcenter.inventory_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ inventory_playbook_config_generator.catalystcenter_api_task_timeout if inventory_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ inventory_playbook_config_generator.catalystcenter_debug if inventory_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ inventory_playbook_config_generator.catalystcenter_host if inventory_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ inventory_playbook_config_generator.catalystcenter_log if inventory_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ inventory_playbook_config_generator.catalystcenter_log_append if inventory_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ inventory_playbook_config_generator.catalystcenter_log_file_path if inventory_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ inventory_playbook_config_generator.catalystcenter_log_level if inventory_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ inventory_playbook_config_generator.catalystcenter_password if inventory_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ inventory_playbook_config_generator.catalystcenter_port if inventory_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ inventory_playbook_config_generator.catalystcenter_task_poll_interval if inventory_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ inventory_playbook_config_generator.catalystcenter_username if inventory_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ inventory_playbook_config_generator.catalystcenter_verify if inventory_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ inventory_playbook_config_generator.catalystcenter_version if inventory_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (inventory_playbook_config_generator.config | cat_strip_nulls) if (inventory_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ inventory_playbook_config_generator.file_mode if inventory_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ inventory_playbook_config_generator.file_path if inventory_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ inventory_playbook_config_generator.state if inventory_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ inventory_playbook_config_generator.validate_response_schema if inventory_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: inventory_playbook_config_generator_result
      tags:
        - never
        - inventory_playbook_config_generator
