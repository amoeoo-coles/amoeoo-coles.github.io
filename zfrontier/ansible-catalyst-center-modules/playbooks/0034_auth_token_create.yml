---
# Sample playbook for cisco.catalystcenter.auth_token_create (cisco.catalystcenter 2.15.0)
# Build order: 34
# Resource module for Auth Token Create
# Reads ../models/auth_token_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/auth_token_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags auth_token_create.

- name: "0034 auth_token_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/auth_token_create.yml
  tasks:
    - name: Run auth_token_create from its model
      cisco.catalystcenter.auth_token_create:
        catalystcenter_debug: "{{ auth_token_create.catalystcenter_debug if auth_token_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ auth_token_create.catalystcenter_host if auth_token_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ auth_token_create.catalystcenter_password if auth_token_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ auth_token_create.catalystcenter_port if auth_token_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ auth_token_create.catalystcenter_username if auth_token_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ auth_token_create.catalystcenter_verify if auth_token_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ auth_token_create.catalystcenter_version if auth_token_create.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ auth_token_create.validate_response_schema if auth_token_create.validate_response_schema is not none else omit }}"
      register: auth_token_create_result
      tags:
        - never
        - auth_token_create
