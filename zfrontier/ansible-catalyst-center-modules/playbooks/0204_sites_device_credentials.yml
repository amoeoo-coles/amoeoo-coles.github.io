---
# Sample playbook for cisco.catalystcenter.sites_device_credentials (cisco.catalystcenter 2.15.0)
# Build order: 204
# Resource module for Sites Device Credentials
# Reads ../models/sites_device_credentials.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_device_credentials_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sites_device_credentials.

- name: "0204 sites_device_credentials"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_device_credentials.yml
  tasks:
    - name: Run sites_device_credentials from its model
      cisco.catalystcenter.sites_device_credentials:
        catalystcenter_debug: "{{ sites_device_credentials.catalystcenter_debug if sites_device_credentials.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_device_credentials.catalystcenter_host if sites_device_credentials.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_device_credentials.catalystcenter_password if sites_device_credentials.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_device_credentials.catalystcenter_port if sites_device_credentials.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_device_credentials.catalystcenter_username if sites_device_credentials.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_device_credentials.catalystcenter_verify if sites_device_credentials.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_device_credentials.catalystcenter_version if sites_device_credentials.catalystcenter_version is not none else omit }}"
        cliCredentialsId: "{{ (sites_device_credentials.cliCredentialsId | cat_strip_nulls) if (sites_device_credentials.cliCredentialsId | cat_strip_nulls) is not none else omit }}"
        httpReadCredentialsId: "{{ (sites_device_credentials.httpReadCredentialsId | cat_strip_nulls) if (sites_device_credentials.httpReadCredentialsId | cat_strip_nulls) is not none else omit }}"
        httpWriteCredentialsId: "{{ (sites_device_credentials.httpWriteCredentialsId | cat_strip_nulls) if (sites_device_credentials.httpWriteCredentialsId | cat_strip_nulls) is not none else omit }}"
        id: "{{ sites_device_credentials.id if sites_device_credentials.id is not none else omit }}"
        snmpv2cReadCredentialsId: "{{ (sites_device_credentials.snmpv2cReadCredentialsId | cat_strip_nulls) if (sites_device_credentials.snmpv2cReadCredentialsId | cat_strip_nulls) is not none else omit }}"
        snmpv2cWriteCredentialsId: "{{ (sites_device_credentials.snmpv2cWriteCredentialsId | cat_strip_nulls) if (sites_device_credentials.snmpv2cWriteCredentialsId | cat_strip_nulls) is not none else omit }}"
        snmpv3CredentialsId: "{{ (sites_device_credentials.snmpv3CredentialsId | cat_strip_nulls) if (sites_device_credentials.snmpv3CredentialsId | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sites_device_credentials.validate_response_schema if sites_device_credentials.validate_response_schema is not none else omit }}"
      register: sites_device_credentials_result
      tags:
        - never
        - sites_device_credentials
