---
# Sample playbook for cisco.catalystcenter.configuration_template_deploy_v2 (cisco.catalystcenter 2.15.0)
# Build order: 593
# Resource module for Configuration Template Deploy V2
# Reads ../models/configuration_template_deploy_v2.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_deploy_v2_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_deploy_v2.

- name: "0593 configuration_template_deploy_v2"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_deploy_v2.yml
  tasks:
    - name: Run configuration_template_deploy_v2 from its model
      cisco.catalystcenter.configuration_template_deploy_v2:
        catalystcenter_debug: "{{ configuration_template_deploy_v2.catalystcenter_debug if configuration_template_deploy_v2.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_deploy_v2.catalystcenter_host if configuration_template_deploy_v2.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_deploy_v2.catalystcenter_password if configuration_template_deploy_v2.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_deploy_v2.catalystcenter_port if configuration_template_deploy_v2.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_deploy_v2.catalystcenter_username if configuration_template_deploy_v2.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_deploy_v2.catalystcenter_verify if configuration_template_deploy_v2.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_deploy_v2.catalystcenter_version if configuration_template_deploy_v2.catalystcenter_version is not none else omit }}"
        forcePushTemplate: "{{ configuration_template_deploy_v2.forcePushTemplate if configuration_template_deploy_v2.forcePushTemplate is not none else omit }}"
        isComposite: "{{ configuration_template_deploy_v2.isComposite if configuration_template_deploy_v2.isComposite is not none else omit }}"
        mainTemplateId: "{{ configuration_template_deploy_v2.mainTemplateId if configuration_template_deploy_v2.mainTemplateId is not none else omit }}"
        memberTemplateDeploymentInfo: "{{ (configuration_template_deploy_v2.memberTemplateDeploymentInfo | cat_strip_nulls) if (configuration_template_deploy_v2.memberTemplateDeploymentInfo | cat_strip_nulls) is not none else omit }}"
        targetInfo: "{{ (configuration_template_deploy_v2.targetInfo | cat_strip_nulls) if (configuration_template_deploy_v2.targetInfo | cat_strip_nulls) is not none else omit }}"
        templateId: "{{ configuration_template_deploy_v2.templateId if configuration_template_deploy_v2.templateId is not none else omit }}"
        validate_response_schema: "{{ configuration_template_deploy_v2.validate_response_schema if configuration_template_deploy_v2.validate_response_schema is not none else omit }}"
      register: configuration_template_deploy_v2_result
      tags:
        - never
        - configuration_template_deploy_v2
