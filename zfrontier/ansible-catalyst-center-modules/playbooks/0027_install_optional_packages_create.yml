---
# Sample playbook for cisco.catalystcenter.install_optional_packages_create (cisco.catalystcenter 2.15.0)
# Build order: 27
# Resource module for Install Optional Packages Create
# Reads ../models/install_optional_packages_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/install_optional_packages_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags install_optional_packages_create.

- name: "0027 install_optional_packages_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/install_optional_packages_create.yml
  tasks:
    - name: Run install_optional_packages_create from its model
      cisco.catalystcenter.install_optional_packages_create:
        catalystcenter_debug: "{{ install_optional_packages_create.catalystcenter_debug if install_optional_packages_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ install_optional_packages_create.catalystcenter_host if install_optional_packages_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ install_optional_packages_create.catalystcenter_password if install_optional_packages_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ install_optional_packages_create.catalystcenter_port if install_optional_packages_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ install_optional_packages_create.catalystcenter_username if install_optional_packages_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ install_optional_packages_create.catalystcenter_verify if install_optional_packages_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ install_optional_packages_create.catalystcenter_version if install_optional_packages_create.catalystcenter_version is not none else omit }}"
        optionalPackages: "{{ (install_optional_packages_create.optionalPackages | cat_strip_nulls) if (install_optional_packages_create.optionalPackages | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ install_optional_packages_create.validate_response_schema if install_optional_packages_create.validate_response_schema is not none else omit }}"
      register: install_optional_packages_create_result
      tags:
        - never
        - install_optional_packages_create
