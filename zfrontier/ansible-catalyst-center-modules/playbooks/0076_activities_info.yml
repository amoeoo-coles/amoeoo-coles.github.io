---
# Sample playbook for cisco.catalystcenter.activities_info (cisco.catalystcenter 2.15.0)
# Build order: 76
# Information module for Activities
# Reads ../models/activities_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/activities_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0076 activities_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/activities_info.yml
  tasks:
    - name: Run activities_info from its model
      cisco.catalystcenter.activities_info:
        catalystcenter_debug: "{{ activities_info.catalystcenter_debug if activities_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ activities_info.catalystcenter_host if activities_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ activities_info.catalystcenter_password if activities_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ activities_info.catalystcenter_port if activities_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ activities_info.catalystcenter_username if activities_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ activities_info.catalystcenter_verify if activities_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ activities_info.catalystcenter_version if activities_info.catalystcenter_version is not none else omit }}"
        description: "{{ activities_info.description if activities_info.description is not none else omit }}"
        endTime: "{{ activities_info.endTime if activities_info.endTime is not none else omit }}"
        headers: "{{ activities_info.headers if activities_info.headers is not none else omit }}"
        id: "{{ activities_info.id if activities_info.id is not none else omit }}"
        limit: "{{ activities_info.limit if activities_info.limit is not none else omit }}"
        offset: "{{ activities_info.offset if activities_info.offset is not none else omit }}"
        order: "{{ activities_info.order if activities_info.order is not none else omit }}"
        recurring: "{{ activities_info.recurring if activities_info.recurring is not none else omit }}"
        sortBy: "{{ activities_info.sortBy if activities_info.sortBy is not none else omit }}"
        startTime: "{{ activities_info.startTime if activities_info.startTime is not none else omit }}"
        status: "{{ activities_info.status if activities_info.status is not none else omit }}"
        type: "{{ activities_info.type if activities_info.type is not none else omit }}"
        validate_response_schema: "{{ activities_info.validate_response_schema if activities_info.validate_response_schema is not none else omit }}"
      register: activities_info_result
