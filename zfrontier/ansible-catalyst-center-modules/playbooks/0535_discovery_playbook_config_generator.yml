---
# Sample playbook for cisco.catalystcenter.discovery_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 535
# Generate YAML configurations playbook for 'discovery_workflow_manager' module.
# Reads ../models/discovery_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags discovery_playbook_config_generator.

- name: "0535 discovery_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_playbook_config_generator.yml
  tasks:
    - name: Run discovery_playbook_config_generator from its model
      cisco.catalystcenter.discovery_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ discovery_playbook_config_generator.catalystcenter_api_task_timeout if discovery_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ discovery_playbook_config_generator.catalystcenter_debug if discovery_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_playbook_config_generator.catalystcenter_host if discovery_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ discovery_playbook_config_generator.catalystcenter_log if discovery_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ discovery_playbook_config_generator.catalystcenter_log_append if discovery_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ discovery_playbook_config_generator.catalystcenter_log_file_path if discovery_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ discovery_playbook_config_generator.catalystcenter_log_level if discovery_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ discovery_playbook_config_generator.catalystcenter_password if discovery_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_playbook_config_generator.catalystcenter_port if discovery_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ discovery_playbook_config_generator.catalystcenter_task_poll_interval if discovery_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ discovery_playbook_config_generator.catalystcenter_username if discovery_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_playbook_config_generator.catalystcenter_verify if discovery_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_playbook_config_generator.catalystcenter_version if discovery_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (discovery_playbook_config_generator.config | cat_strip_nulls) if (discovery_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ discovery_playbook_config_generator.file_mode if discovery_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ discovery_playbook_config_generator.file_path if discovery_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ discovery_playbook_config_generator.state if discovery_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ discovery_playbook_config_generator.validate_response_schema if discovery_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: discovery_playbook_config_generator_result
      tags:
        - never
        - discovery_playbook_config_generator
