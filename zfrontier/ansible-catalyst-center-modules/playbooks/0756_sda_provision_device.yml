---
# Sample playbook for cisco.catalystcenter.sda_provision_device (cisco.catalystcenter 2.15.0)
# Build order: 756
# Resource module for Sda Provision Device
# Reads ../models/sda_provision_device.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_provision_device_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_provision_device.

- name: "0756 sda_provision_device"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_provision_device.yml
  tasks:
    - name: Run sda_provision_device from its model
      cisco.catalystcenter.sda_provision_device:
        catalystcenter_debug: "{{ sda_provision_device.catalystcenter_debug if sda_provision_device.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_provision_device.catalystcenter_host if sda_provision_device.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_provision_device.catalystcenter_password if sda_provision_device.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_provision_device.catalystcenter_port if sda_provision_device.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_provision_device.catalystcenter_username if sda_provision_device.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_provision_device.catalystcenter_verify if sda_provision_device.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_provision_device.catalystcenter_version if sda_provision_device.catalystcenter_version is not none else omit }}"
        deviceManagementIpAddress: "{{ sda_provision_device.deviceManagementIpAddress if sda_provision_device.deviceManagementIpAddress is not none else omit }}"
        siteNameHierarchy: "{{ sda_provision_device.siteNameHierarchy if sda_provision_device.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ sda_provision_device.validate_response_schema if sda_provision_device.validate_response_schema is not none else omit }}"
      register: sda_provision_device_result
      tags:
        - never
        - sda_provision_device
