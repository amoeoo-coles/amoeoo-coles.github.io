---
# Sample playbook for cisco.catalystcenter.images_info (cisco.catalystcenter 2.15.0)
# Build order: 568
# Information module for Images
# Reads ../models/images_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0568 images_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_info.yml
  tasks:
    - name: Run images_info from its model
      cisco.catalystcenter.images_info:
        catalystcenter_debug: "{{ images_info.catalystcenter_debug if images_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_info.catalystcenter_host if images_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_info.catalystcenter_password if images_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_info.catalystcenter_port if images_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_info.catalystcenter_username if images_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_info.catalystcenter_verify if images_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_info.catalystcenter_version if images_info.catalystcenter_version is not none else omit }}"
        golden: "{{ images_info.golden if images_info.golden is not none else omit }}"
        hasAddonImages: "{{ images_info.hasAddonImages if images_info.hasAddonImages is not none else omit }}"
        headers: "{{ images_info.headers if images_info.headers is not none else omit }}"
        imported: "{{ images_info.imported if images_info.imported is not none else omit }}"
        integrity: "{{ images_info.integrity if images_info.integrity is not none else omit }}"
        isAddonImages: "{{ images_info.isAddonImages if images_info.isAddonImages is not none else omit }}"
        limit: "{{ images_info.limit if images_info.limit is not none else omit }}"
        name: "{{ images_info.name if images_info.name is not none else omit }}"
        offset: "{{ images_info.offset if images_info.offset is not none else omit }}"
        productNameOrdinal: "{{ images_info.productNameOrdinal if images_info.productNameOrdinal is not none else omit }}"
        siteId: "{{ images_info.siteId if images_info.siteId is not none else omit }}"
        supervisorProductNameOrdinal: "{{ images_info.supervisorProductNameOrdinal if images_info.supervisorProductNameOrdinal is not none else omit }}"
        validate_response_schema: "{{ images_info.validate_response_schema if images_info.validate_response_schema is not none else omit }}"
        version: "{{ images_info.version if images_info.version is not none else omit }}"
      register: images_info_result
