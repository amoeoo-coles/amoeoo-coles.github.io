---
# Sample playbook for cisco.catalystcenter.discoverys_jobs (cisco.catalystcenter 2.15.0)
# Build order: 316
# Resource module for Discoverys Jobs
# Reads ../models/discoverys_jobs.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discoverys_jobs_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags discoverys_jobs.

- name: "0316 discoverys_jobs"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discoverys_jobs.yml
  tasks:
    - name: Run discoverys_jobs from its model
      cisco.catalystcenter.discoverys_jobs:
        catalystcenter_debug: "{{ discoverys_jobs.catalystcenter_debug if discoverys_jobs.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discoverys_jobs.catalystcenter_host if discoverys_jobs.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discoverys_jobs.catalystcenter_password if discoverys_jobs.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discoverys_jobs.catalystcenter_port if discoverys_jobs.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discoverys_jobs.catalystcenter_username if discoverys_jobs.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discoverys_jobs.catalystcenter_verify if discoverys_jobs.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discoverys_jobs.catalystcenter_version if discoverys_jobs.catalystcenter_version is not none else omit }}"
        id: "{{ discoverys_jobs.id if discoverys_jobs.id is not none else omit }}"
        validate_response_schema: "{{ discoverys_jobs.validate_response_schema if discoverys_jobs.validate_response_schema is not none else omit }}"
      register: discoverys_jobs_result
      tags:
        - never
        - discoverys_jobs
