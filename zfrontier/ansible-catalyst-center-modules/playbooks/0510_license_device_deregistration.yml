---
# Sample playbook for cisco.catalystcenter.license_device_deregistration (cisco.catalystcenter 2.15.0)
# Build order: 510
# Resource module for License Device Deregistration
# Reads ../models/license_device_deregistration.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/license_device_deregistration_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags license_device_deregistration.

- name: "0510 license_device_deregistration"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/license_device_deregistration.yml
  tasks:
    - name: Run license_device_deregistration from its model
      cisco.catalystcenter.license_device_deregistration:
        catalystcenter_debug: "{{ license_device_deregistration.catalystcenter_debug if license_device_deregistration.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ license_device_deregistration.catalystcenter_host if license_device_deregistration.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ license_device_deregistration.catalystcenter_password if license_device_deregistration.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ license_device_deregistration.catalystcenter_port if license_device_deregistration.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ license_device_deregistration.catalystcenter_username if license_device_deregistration.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ license_device_deregistration.catalystcenter_verify if license_device_deregistration.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ license_device_deregistration.catalystcenter_version if license_device_deregistration.catalystcenter_version is not none else omit }}"
        device_uuids: "{{ (license_device_deregistration.device_uuids | cat_strip_nulls) if (license_device_deregistration.device_uuids | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ license_device_deregistration.validate_response_schema if license_device_deregistration.validate_response_schema is not none else omit }}"
      register: license_device_deregistration_result
      tags:
        - never
        - license_device_deregistration
