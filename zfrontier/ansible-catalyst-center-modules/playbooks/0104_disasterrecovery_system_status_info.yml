---
# Sample playbook for cisco.catalystcenter.disasterrecovery_system_status_info (cisco.catalystcenter 2.15.0)
# Build order: 104
# Information module for Disasterrecovery System Status
# Reads ../models/disasterrecovery_system_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/disasterrecovery_system_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0104 disasterrecovery_system_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/disasterrecovery_system_status_info.yml
  tasks:
    - name: Run disasterrecovery_system_status_info from its model
      cisco.catalystcenter.disasterrecovery_system_status_info:
        catalystcenter_debug: "{{ disasterrecovery_system_status_info.catalystcenter_debug if disasterrecovery_system_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ disasterrecovery_system_status_info.catalystcenter_host if disasterrecovery_system_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ disasterrecovery_system_status_info.catalystcenter_password if disasterrecovery_system_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ disasterrecovery_system_status_info.catalystcenter_port if disasterrecovery_system_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ disasterrecovery_system_status_info.catalystcenter_username if disasterrecovery_system_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ disasterrecovery_system_status_info.catalystcenter_verify if disasterrecovery_system_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ disasterrecovery_system_status_info.catalystcenter_version if disasterrecovery_system_status_info.catalystcenter_version is not none else omit }}"
        headers: "{{ disasterrecovery_system_status_info.headers if disasterrecovery_system_status_info.headers is not none else omit }}"
        validate_response_schema: "{{ disasterrecovery_system_status_info.validate_response_schema if disasterrecovery_system_status_info.validate_response_schema is not none else omit }}"
      register: disasterrecovery_system_status_info_result
