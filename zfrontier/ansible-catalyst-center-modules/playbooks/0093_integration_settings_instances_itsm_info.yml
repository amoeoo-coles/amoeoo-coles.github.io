---
# Sample playbook for cisco.catalystcenter.integration_settings_instances_itsm_info (cisco.catalystcenter 2.15.0)
# Build order: 93
# Information module for Integration Settings Instances Itsm
# Reads ../models/integration_settings_instances_itsm_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/integration_settings_instances_itsm_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0093 integration_settings_instances_itsm_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/integration_settings_instances_itsm_info.yml
  tasks:
    - name: Run integration_settings_instances_itsm_info from its model
      cisco.catalystcenter.integration_settings_instances_itsm_info:
        catalystcenter_debug: "{{ integration_settings_instances_itsm_info.catalystcenter_debug if integration_settings_instances_itsm_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ integration_settings_instances_itsm_info.catalystcenter_host if integration_settings_instances_itsm_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ integration_settings_instances_itsm_info.catalystcenter_password if integration_settings_instances_itsm_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ integration_settings_instances_itsm_info.catalystcenter_port if integration_settings_instances_itsm_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ integration_settings_instances_itsm_info.catalystcenter_username if integration_settings_instances_itsm_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ integration_settings_instances_itsm_info.catalystcenter_verify if integration_settings_instances_itsm_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ integration_settings_instances_itsm_info.catalystcenter_version if integration_settings_instances_itsm_info.catalystcenter_version is not none else omit }}"
        headers: "{{ integration_settings_instances_itsm_info.headers if integration_settings_instances_itsm_info.headers is not none else omit }}"
        instanceId: "{{ integration_settings_instances_itsm_info.instanceId if integration_settings_instances_itsm_info.instanceId is not none else omit }}"
        validate_response_schema: "{{ integration_settings_instances_itsm_info.validate_response_schema if integration_settings_instances_itsm_info.validate_response_schema is not none else omit }}"
      register: integration_settings_instances_itsm_info_result
