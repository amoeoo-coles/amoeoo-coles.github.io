---
# Sample playbook for cisco.catalystcenter.compliance_policys_sites_rules_variables (cisco.catalystcenter 2.15.0)
# Build order: 647
# Resource module for Compliance Policys Sites Rules Variables
# Reads ../models/compliance_policys_sites_rules_variables.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_policys_sites_rules_variables_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_policys_sites_rules_variables.

- name: "0647 compliance_policys_sites_rules_variables"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_policys_sites_rules_variables.yml
  tasks:
    - name: Run compliance_policys_sites_rules_variables from its model
      cisco.catalystcenter.compliance_policys_sites_rules_variables:
        catalystcenter_debug: "{{ compliance_policys_sites_rules_variables.catalystcenter_debug if compliance_policys_sites_rules_variables.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_policys_sites_rules_variables.catalystcenter_host if compliance_policys_sites_rules_variables.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_policys_sites_rules_variables.catalystcenter_password if compliance_policys_sites_rules_variables.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_policys_sites_rules_variables.catalystcenter_port if compliance_policys_sites_rules_variables.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_policys_sites_rules_variables.catalystcenter_username if compliance_policys_sites_rules_variables.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_policys_sites_rules_variables.catalystcenter_verify if compliance_policys_sites_rules_variables.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_policys_sites_rules_variables.catalystcenter_version if compliance_policys_sites_rules_variables.catalystcenter_version is not none else omit }}"
        inheritedSiteId: "{{ compliance_policys_sites_rules_variables.inheritedSiteId if compliance_policys_sites_rules_variables.inheritedSiteId is not none else omit }}"
        inheritedSiteName: "{{ compliance_policys_sites_rules_variables.inheritedSiteName if compliance_policys_sites_rules_variables.inheritedSiteName is not none else omit }}"
        policyId: "{{ compliance_policys_sites_rules_variables.policyId if compliance_policys_sites_rules_variables.policyId is not none else omit }}"
        ruleId: "{{ compliance_policys_sites_rules_variables.ruleId if compliance_policys_sites_rules_variables.ruleId is not none else omit }}"
        siteId: "{{ compliance_policys_sites_rules_variables.siteId if compliance_policys_sites_rules_variables.siteId is not none else omit }}"
        validate_response_schema: "{{ compliance_policys_sites_rules_variables.validate_response_schema if compliance_policys_sites_rules_variables.validate_response_schema is not none else omit }}"
        variableValues: "{{ (compliance_policys_sites_rules_variables.variableValues | cat_strip_nulls) if (compliance_policys_sites_rules_variables.variableValues | cat_strip_nulls) is not none else omit }}"
      register: compliance_policys_sites_rules_variables_result
      tags:
        - never
        - compliance_policys_sites_rules_variables
