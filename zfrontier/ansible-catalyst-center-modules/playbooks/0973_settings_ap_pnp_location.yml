---
# Sample playbook for cisco.catalystcenter.settings_ap_pnp_location (cisco.catalystcenter 2.15.0)
# Build order: 973
# Resource module for Settings Ap Pnp Location
# Reads ../models/settings_ap_pnp_location.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/settings_ap_pnp_location_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags settings_ap_pnp_location.

- name: "0973 settings_ap_pnp_location"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/settings_ap_pnp_location.yml
  tasks:
    - name: Run settings_ap_pnp_location from its model
      cisco.catalystcenter.settings_ap_pnp_location:
        apPnPLocation: "{{ settings_ap_pnp_location.apPnPLocation if settings_ap_pnp_location.apPnPLocation is not none else omit }}"
        catalystcenter_debug: "{{ settings_ap_pnp_location.catalystcenter_debug if settings_ap_pnp_location.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ settings_ap_pnp_location.catalystcenter_host if settings_ap_pnp_location.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ settings_ap_pnp_location.catalystcenter_password if settings_ap_pnp_location.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ settings_ap_pnp_location.catalystcenter_port if settings_ap_pnp_location.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ settings_ap_pnp_location.catalystcenter_username if settings_ap_pnp_location.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ settings_ap_pnp_location.catalystcenter_verify if settings_ap_pnp_location.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ settings_ap_pnp_location.catalystcenter_version if settings_ap_pnp_location.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ settings_ap_pnp_location.validate_response_schema if settings_ap_pnp_location.validate_response_schema is not none else omit }}"
      register: settings_ap_pnp_location_result
      tags:
        - never
        - settings_ap_pnp_location
