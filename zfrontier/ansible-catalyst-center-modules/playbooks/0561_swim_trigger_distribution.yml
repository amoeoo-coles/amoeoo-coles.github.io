---
# Sample playbook for cisco.catalystcenter.swim_trigger_distribution (cisco.catalystcenter 2.15.0)
# Build order: 561
# Resource module for Swim Trigger Distribution
# Reads ../models/swim_trigger_distribution.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/swim_trigger_distribution_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags swim_trigger_distribution.

- name: "0561 swim_trigger_distribution"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/swim_trigger_distribution.yml
  tasks:
    - name: Run swim_trigger_distribution from its model
      cisco.catalystcenter.swim_trigger_distribution:
        catalystcenter_debug: "{{ swim_trigger_distribution.catalystcenter_debug if swim_trigger_distribution.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ swim_trigger_distribution.catalystcenter_host if swim_trigger_distribution.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ swim_trigger_distribution.catalystcenter_password if swim_trigger_distribution.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ swim_trigger_distribution.catalystcenter_port if swim_trigger_distribution.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ swim_trigger_distribution.catalystcenter_username if swim_trigger_distribution.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ swim_trigger_distribution.catalystcenter_verify if swim_trigger_distribution.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ swim_trigger_distribution.catalystcenter_version if swim_trigger_distribution.catalystcenter_version is not none else omit }}"
        payload: "{{ (swim_trigger_distribution.payload | cat_strip_nulls) if (swim_trigger_distribution.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ swim_trigger_distribution.validate_response_schema if swim_trigger_distribution.validate_response_schema is not none else omit }}"
      register: swim_trigger_distribution_result
      tags:
        - never
        - swim_trigger_distribution
