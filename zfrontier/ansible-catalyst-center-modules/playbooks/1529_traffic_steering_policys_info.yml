---
# Sample playbook for cisco.catalystcenter.traffic_steering_policys_info (cisco.catalystcenter 2.15.0)
# Build order: 1529
# Information module for Traffic Steering Policys
# Reads ../models/traffic_steering_policys_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/traffic_steering_policys_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1529 traffic_steering_policys_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/traffic_steering_policys_info.yml
  tasks:
    - name: Run traffic_steering_policys_info from its model
      cisco.catalystcenter.traffic_steering_policys_info:
        catalystcenter_debug: "{{ traffic_steering_policys_info.catalystcenter_debug if traffic_steering_policys_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ traffic_steering_policys_info.catalystcenter_host if traffic_steering_policys_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ traffic_steering_policys_info.catalystcenter_password if traffic_steering_policys_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ traffic_steering_policys_info.catalystcenter_port if traffic_steering_policys_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ traffic_steering_policys_info.catalystcenter_username if traffic_steering_policys_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ traffic_steering_policys_info.catalystcenter_verify if traffic_steering_policys_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ traffic_steering_policys_info.catalystcenter_version if traffic_steering_policys_info.catalystcenter_version is not none else omit }}"
        contractName: "{{ traffic_steering_policys_info.contractName if traffic_steering_policys_info.contractName is not none else omit }}"
        destinationName: "{{ traffic_steering_policys_info.destinationName if traffic_steering_policys_info.destinationName is not none else omit }}"
        headers: "{{ traffic_steering_policys_info.headers if traffic_steering_policys_info.headers is not none else omit }}"
        id: "{{ traffic_steering_policys_info.id if traffic_steering_policys_info.id is not none else omit }}"
        limit: "{{ traffic_steering_policys_info.limit if traffic_steering_policys_info.limit is not none else omit }}"
        offset: "{{ traffic_steering_policys_info.offset if traffic_steering_policys_info.offset is not none else omit }}"
        order: "{{ traffic_steering_policys_info.order if traffic_steering_policys_info.order is not none else omit }}"
        siteId: "{{ traffic_steering_policys_info.siteId if traffic_steering_policys_info.siteId is not none else omit }}"
        sortBy: "{{ traffic_steering_policys_info.sortBy if traffic_steering_policys_info.sortBy is not none else omit }}"
        sourceName: "{{ traffic_steering_policys_info.sourceName if traffic_steering_policys_info.sourceName is not none else omit }}"
        validate_response_schema: "{{ traffic_steering_policys_info.validate_response_schema if traffic_steering_policys_info.validate_response_schema is not none else omit }}"
        views: "{{ traffic_steering_policys_info.views if traffic_steering_policys_info.views is not none else omit }}"
      register: traffic_steering_policys_info_result
