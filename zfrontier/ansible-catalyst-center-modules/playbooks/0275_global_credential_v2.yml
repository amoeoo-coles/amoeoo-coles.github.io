---
# Sample playbook for cisco.catalystcenter.global_credential_v2 (cisco.catalystcenter 2.15.0)
# Build order: 275
# Resource module for Global Credential V2
# Reads ../models/global_credential_v2.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/global_credential_v2_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags global_credential_v2.

- name: "0275 global_credential_v2"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/global_credential_v2.yml
  tasks:
    - name: Run global_credential_v2 from its model
      cisco.catalystcenter.global_credential_v2:
        catalystcenter_debug: "{{ global_credential_v2.catalystcenter_debug if global_credential_v2.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ global_credential_v2.catalystcenter_host if global_credential_v2.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ global_credential_v2.catalystcenter_password if global_credential_v2.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ global_credential_v2.catalystcenter_port if global_credential_v2.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ global_credential_v2.catalystcenter_username if global_credential_v2.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ global_credential_v2.catalystcenter_verify if global_credential_v2.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ global_credential_v2.catalystcenter_version if global_credential_v2.catalystcenter_version is not none else omit }}"
        cliCredential: "{{ (global_credential_v2.cliCredential | cat_strip_nulls) if (global_credential_v2.cliCredential | cat_strip_nulls) is not none else omit }}"
        httpsRead: "{{ (global_credential_v2.httpsRead | cat_strip_nulls) if (global_credential_v2.httpsRead | cat_strip_nulls) is not none else omit }}"
        httpsWrite: "{{ (global_credential_v2.httpsWrite | cat_strip_nulls) if (global_credential_v2.httpsWrite | cat_strip_nulls) is not none else omit }}"
        id: "{{ global_credential_v2.id if global_credential_v2.id is not none else omit }}"
        snmpV2cRead: "{{ (global_credential_v2.snmpV2cRead | cat_strip_nulls) if (global_credential_v2.snmpV2cRead | cat_strip_nulls) is not none else omit }}"
        snmpV2cWrite: "{{ (global_credential_v2.snmpV2cWrite | cat_strip_nulls) if (global_credential_v2.snmpV2cWrite | cat_strip_nulls) is not none else omit }}"
        snmpV3: "{{ (global_credential_v2.snmpV3 | cat_strip_nulls) if (global_credential_v2.snmpV3 | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ global_credential_v2.validate_response_schema if global_credential_v2.validate_response_schema is not none else omit }}"
      register: global_credential_v2_result
      tags:
        - never
        - global_credential_v2
