---
# Sample playbook for cisco.catalystcenter.cli_credential (cisco.catalystcenter 2.15.0)
# Build order: 270
# Resource module for Cli Credential
# Reads ../models/cli_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/cli_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags cli_credential.

- name: "0270 cli_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/cli_credential.yml
  tasks:
    - name: Run cli_credential from its model
      cisco.catalystcenter.cli_credential:
        catalystcenter_debug: "{{ cli_credential.catalystcenter_debug if cli_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ cli_credential.catalystcenter_host if cli_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ cli_credential.catalystcenter_password if cli_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ cli_credential.catalystcenter_port if cli_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ cli_credential.catalystcenter_username if cli_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ cli_credential.catalystcenter_verify if cli_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ cli_credential.catalystcenter_version if cli_credential.catalystcenter_version is not none else omit }}"
        comments: "{{ cli_credential.comments if cli_credential.comments is not none else omit }}"
        credentialType: "{{ cli_credential.credentialType if cli_credential.credentialType is not none else omit }}"
        description: "{{ cli_credential.description if cli_credential.description is not none else omit }}"
        enablePassword: "{{ cli_credential.enablePassword if cli_credential.enablePassword is not none else omit }}"
        id: "{{ cli_credential.id if cli_credential.id is not none else omit }}"
        instanceTenantId: "{{ cli_credential.instanceTenantId if cli_credential.instanceTenantId is not none else omit }}"
        instanceUuid: "{{ cli_credential.instanceUuid if cli_credential.instanceUuid is not none else omit }}"
        password: "{{ cli_credential.password if cli_credential.password is not none else omit }}"
        username: "{{ cli_credential.username if cli_credential.username is not none else omit }}"
        validate_response_schema: "{{ cli_credential.validate_response_schema if cli_credential.validate_response_schema is not none else omit }}"
      register: cli_credential_result
      tags:
        - never
        - cli_credential
