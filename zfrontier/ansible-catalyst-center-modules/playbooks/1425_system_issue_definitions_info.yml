---
# Sample playbook for cisco.catalystcenter.system_issue_definitions_info (cisco.catalystcenter 2.15.0)
# Build order: 1425
# Information module for System Issue Definitions
# Reads ../models/system_issue_definitions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/system_issue_definitions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1425 system_issue_definitions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_issue_definitions_info.yml
  tasks:
    - name: Run system_issue_definitions_info from its model
      cisco.catalystcenter.system_issue_definitions_info:
        attribute: "{{ system_issue_definitions_info.attribute if system_issue_definitions_info.attribute is not none else omit }}"
        catalystcenter_debug: "{{ system_issue_definitions_info.catalystcenter_debug if system_issue_definitions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ system_issue_definitions_info.catalystcenter_host if system_issue_definitions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ system_issue_definitions_info.catalystcenter_password if system_issue_definitions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ system_issue_definitions_info.catalystcenter_port if system_issue_definitions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ system_issue_definitions_info.catalystcenter_username if system_issue_definitions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ system_issue_definitions_info.catalystcenter_verify if system_issue_definitions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ system_issue_definitions_info.catalystcenter_version if system_issue_definitions_info.catalystcenter_version is not none else omit }}"
        deviceType: "{{ system_issue_definitions_info.deviceType if system_issue_definitions_info.deviceType is not none else omit }}"
        headers: "{{ system_issue_definitions_info.headers if system_issue_definitions_info.headers is not none else omit }}"
        id: "{{ system_issue_definitions_info.id if system_issue_definitions_info.id is not none else omit }}"
        issueEnabled: "{{ system_issue_definitions_info.issueEnabled if system_issue_definitions_info.issueEnabled is not none else omit }}"
        limit: "{{ system_issue_definitions_info.limit if system_issue_definitions_info.limit is not none else omit }}"
        name: "{{ system_issue_definitions_info.name if system_issue_definitions_info.name is not none else omit }}"
        offset: "{{ system_issue_definitions_info.offset if system_issue_definitions_info.offset is not none else omit }}"
        order: "{{ system_issue_definitions_info.order if system_issue_definitions_info.order is not none else omit }}"
        priority: "{{ system_issue_definitions_info.priority if system_issue_definitions_info.priority is not none else omit }}"
        profileId: "{{ system_issue_definitions_info.profileId if system_issue_definitions_info.profileId is not none else omit }}"
        sortBy: "{{ system_issue_definitions_info.sortBy if system_issue_definitions_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ system_issue_definitions_info.validate_response_schema if system_issue_definitions_info.validate_response_schema is not none else omit }}"
      register: system_issue_definitions_info_result
