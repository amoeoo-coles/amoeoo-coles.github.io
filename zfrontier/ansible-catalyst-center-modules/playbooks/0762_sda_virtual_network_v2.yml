---
# Sample playbook for cisco.catalystcenter.sda_virtual_network_v2 (cisco.catalystcenter 2.15.0)
# Build order: 762
# Resource module for Sda Virtual Network V2
# Reads ../models/sda_virtual_network_v2.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_virtual_network_v2_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_virtual_network_v2.

- name: "0762 sda_virtual_network_v2"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_virtual_network_v2.yml
  tasks:
    - name: Run sda_virtual_network_v2 from its model
      cisco.catalystcenter.sda_virtual_network_v2:
        catalystcenter_debug: "{{ sda_virtual_network_v2.catalystcenter_debug if sda_virtual_network_v2.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_virtual_network_v2.catalystcenter_host if sda_virtual_network_v2.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_virtual_network_v2.catalystcenter_password if sda_virtual_network_v2.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_virtual_network_v2.catalystcenter_port if sda_virtual_network_v2.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_virtual_network_v2.catalystcenter_username if sda_virtual_network_v2.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_virtual_network_v2.catalystcenter_verify if sda_virtual_network_v2.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_virtual_network_v2.catalystcenter_version if sda_virtual_network_v2.catalystcenter_version is not none else omit }}"
        isGuestVirtualNetwork: "{{ sda_virtual_network_v2.isGuestVirtualNetwork if sda_virtual_network_v2.isGuestVirtualNetwork is not none else omit }}"
        scalableGroupNames: "{{ (sda_virtual_network_v2.scalableGroupNames | cat_strip_nulls) if (sda_virtual_network_v2.scalableGroupNames | cat_strip_nulls) is not none else omit }}"
        vManageVpnId: "{{ sda_virtual_network_v2.vManageVpnId if sda_virtual_network_v2.vManageVpnId is not none else omit }}"
        validate_response_schema: "{{ sda_virtual_network_v2.validate_response_schema if sda_virtual_network_v2.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_virtual_network_v2.virtualNetworkName if sda_virtual_network_v2.virtualNetworkName is not none else omit }}"
      register: sda_virtual_network_v2_result
      tags:
        - never
        - sda_virtual_network_v2
