---
# Sample playbook for cisco.catalystcenter.system_settings_ap_pnp_location_info (cisco.catalystcenter 2.15.0)
# Build order: 1077
# Information module for System Settings Ap Pnp Location
# Reads ../models/system_settings_ap_pnp_location_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/system_settings_ap_pnp_location_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1077 system_settings_ap_pnp_location_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_settings_ap_pnp_location_info.yml
  tasks:
    - name: Run system_settings_ap_pnp_location_info from its model
      cisco.catalystcenter.system_settings_ap_pnp_location_info:
        catalystcenter_debug: "{{ system_settings_ap_pnp_location_info.catalystcenter_debug if system_settings_ap_pnp_location_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ system_settings_ap_pnp_location_info.catalystcenter_host if system_settings_ap_pnp_location_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ system_settings_ap_pnp_location_info.catalystcenter_password if system_settings_ap_pnp_location_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ system_settings_ap_pnp_location_info.catalystcenter_port if system_settings_ap_pnp_location_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ system_settings_ap_pnp_location_info.catalystcenter_username if system_settings_ap_pnp_location_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ system_settings_ap_pnp_location_info.catalystcenter_verify if system_settings_ap_pnp_location_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ system_settings_ap_pnp_location_info.catalystcenter_version if system_settings_ap_pnp_location_info.catalystcenter_version is not none else omit }}"
        headers: "{{ system_settings_ap_pnp_location_info.headers if system_settings_ap_pnp_location_info.headers is not none else omit }}"
        validate_response_schema: "{{ system_settings_ap_pnp_location_info.validate_response_schema if system_settings_ap_pnp_location_info.validate_response_schema is not none else omit }}"
      register: system_settings_ap_pnp_location_info_result
