---
# Sample playbook for cisco.catalystcenter.site_kpi_summaries_query_count (cisco.catalystcenter 2.15.0)
# Build order: 116
# Resource module for Site Kpi Summaries Query Count
# Reads ../models/site_kpi_summaries_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_kpi_summaries_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags site_kpi_summaries_query_count.

- name: "0116 site_kpi_summaries_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_kpi_summaries_query_count.yml
  tasks:
    - name: Run site_kpi_summaries_query_count from its model
      cisco.catalystcenter.site_kpi_summaries_query_count:
        catalystcenter_debug: "{{ site_kpi_summaries_query_count.catalystcenter_debug if site_kpi_summaries_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_kpi_summaries_query_count.catalystcenter_host if site_kpi_summaries_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_kpi_summaries_query_count.catalystcenter_password if site_kpi_summaries_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_kpi_summaries_query_count.catalystcenter_port if site_kpi_summaries_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_kpi_summaries_query_count.catalystcenter_username if site_kpi_summaries_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_kpi_summaries_query_count.catalystcenter_verify if site_kpi_summaries_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_kpi_summaries_query_count.catalystcenter_version if site_kpi_summaries_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ site_kpi_summaries_query_count.endTime if site_kpi_summaries_query_count.endTime is not none else omit }}"
        filters: "{{ (site_kpi_summaries_query_count.filters | cat_strip_nulls) if (site_kpi_summaries_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ site_kpi_summaries_query_count.headers if site_kpi_summaries_query_count.headers is not none else omit }}"
        startTime: "{{ site_kpi_summaries_query_count.startTime if site_kpi_summaries_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ site_kpi_summaries_query_count.validate_response_schema if site_kpi_summaries_query_count.validate_response_schema is not none else omit }}"
      register: site_kpi_summaries_query_count_result
      tags:
        - never
        - site_kpi_summaries_query_count
