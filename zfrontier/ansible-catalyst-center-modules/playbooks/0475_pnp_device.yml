---
# Sample playbook for cisco.catalystcenter.pnp_device (cisco.catalystcenter 2.15.0)
# Build order: 475
# Resource module for Pnp Device
# Reads ../models/pnp_device.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_device.

- name: "0475 pnp_device"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_device.yml
  tasks:
    - name: Run pnp_device from its model
      cisco.catalystcenter.pnp_device:
        catalystcenter_debug: "{{ pnp_device.catalystcenter_debug if pnp_device.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_device.catalystcenter_host if pnp_device.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_device.catalystcenter_password if pnp_device.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_device.catalystcenter_port if pnp_device.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_device.catalystcenter_username if pnp_device.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_device.catalystcenter_verify if pnp_device.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_device.catalystcenter_version if pnp_device.catalystcenter_version is not none else omit }}"
        deviceInfo: "{{ (pnp_device.deviceInfo | cat_strip_nulls) if (pnp_device.deviceInfo | cat_strip_nulls) is not none else omit }}"
        id: "{{ pnp_device.id if pnp_device.id is not none else omit }}"
        validate_response_schema: "{{ pnp_device.validate_response_schema if pnp_device.validate_response_schema is not none else omit }}"
      register: pnp_device_result
      tags:
        - never
        - pnp_device
