---
# Sample playbook for cisco.catalystcenter.ipam_site_ip_address_pools (cisco.catalystcenter 2.15.0)
# Build order: 193
# Resource module for Ipam Site Ip Address Pools
# Reads ../models/ipam_site_ip_address_pools.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ipam_site_ip_address_pools_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags ipam_site_ip_address_pools.

- name: "0193 ipam_site_ip_address_pools"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipam_site_ip_address_pools.yml
  tasks:
    - name: Run ipam_site_ip_address_pools from its model
      cisco.catalystcenter.ipam_site_ip_address_pools:
        catalystcenter_debug: "{{ ipam_site_ip_address_pools.catalystcenter_debug if ipam_site_ip_address_pools.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ipam_site_ip_address_pools.catalystcenter_host if ipam_site_ip_address_pools.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ ipam_site_ip_address_pools.catalystcenter_password if ipam_site_ip_address_pools.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ipam_site_ip_address_pools.catalystcenter_port if ipam_site_ip_address_pools.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ ipam_site_ip_address_pools.catalystcenter_username if ipam_site_ip_address_pools.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ipam_site_ip_address_pools.catalystcenter_verify if ipam_site_ip_address_pools.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ipam_site_ip_address_pools.catalystcenter_version if ipam_site_ip_address_pools.catalystcenter_version is not none else omit }}"
        id: "{{ ipam_site_ip_address_pools.id if ipam_site_ip_address_pools.id is not none else omit }}"
        ipV4AddressSpace: "{{ (ipam_site_ip_address_pools.ipV4AddressSpace | cat_strip_nulls) if (ipam_site_ip_address_pools.ipV4AddressSpace | cat_strip_nulls) is not none else omit }}"
        ipV6AddressSpace: "{{ (ipam_site_ip_address_pools.ipV6AddressSpace | cat_strip_nulls) if (ipam_site_ip_address_pools.ipV6AddressSpace | cat_strip_nulls) is not none else omit }}"
        name: "{{ (ipam_site_ip_address_pools.name | cat_strip_nulls) if (ipam_site_ip_address_pools.name | cat_strip_nulls) is not none else omit }}"
        poolType: "{{ ipam_site_ip_address_pools.poolType if ipam_site_ip_address_pools.poolType is not none else omit }}"
        siteId: "{{ ipam_site_ip_address_pools.siteId if ipam_site_ip_address_pools.siteId is not none else omit }}"
        siteName: "{{ ipam_site_ip_address_pools.siteName if ipam_site_ip_address_pools.siteName is not none else omit }}"
        validate_response_schema: "{{ ipam_site_ip_address_pools.validate_response_schema if ipam_site_ip_address_pools.validate_response_schema is not none else omit }}"
      register: ipam_site_ip_address_pools_result
      tags:
        - never
        - ipam_site_ip_address_pools
