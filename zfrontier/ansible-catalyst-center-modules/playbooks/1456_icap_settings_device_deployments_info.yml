---
# Sample playbook for cisco.catalystcenter.icap_settings_device_deployments_info (cisco.catalystcenter 2.15.0)
# Build order: 1456
# Information module for Icap Settings Device Deployments
# Reads ../models/icap_settings_device_deployments_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/icap_settings_device_deployments_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1456 icap_settings_device_deployments_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/icap_settings_device_deployments_info.yml
  tasks:
    - name: Run icap_settings_device_deployments_info from its model
      cisco.catalystcenter.icap_settings_device_deployments_info:
        catalystcenter_debug: "{{ icap_settings_device_deployments_info.catalystcenter_debug if icap_settings_device_deployments_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ icap_settings_device_deployments_info.catalystcenter_host if icap_settings_device_deployments_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ icap_settings_device_deployments_info.catalystcenter_password if icap_settings_device_deployments_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ icap_settings_device_deployments_info.catalystcenter_port if icap_settings_device_deployments_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ icap_settings_device_deployments_info.catalystcenter_username if icap_settings_device_deployments_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ icap_settings_device_deployments_info.catalystcenter_verify if icap_settings_device_deployments_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ icap_settings_device_deployments_info.catalystcenter_version if icap_settings_device_deployments_info.catalystcenter_version is not none else omit }}"
        deployActivityId: "{{ icap_settings_device_deployments_info.deployActivityId if icap_settings_device_deployments_info.deployActivityId is not none else omit }}"
        headers: "{{ icap_settings_device_deployments_info.headers if icap_settings_device_deployments_info.headers is not none else omit }}"
        limit: "{{ icap_settings_device_deployments_info.limit if icap_settings_device_deployments_info.limit is not none else omit }}"
        networkDeviceIds: "{{ icap_settings_device_deployments_info.networkDeviceIds if icap_settings_device_deployments_info.networkDeviceIds is not none else omit }}"
        offset: "{{ icap_settings_device_deployments_info.offset if icap_settings_device_deployments_info.offset is not none else omit }}"
        order: "{{ icap_settings_device_deployments_info.order if icap_settings_device_deployments_info.order is not none else omit }}"
        sortBy: "{{ icap_settings_device_deployments_info.sortBy if icap_settings_device_deployments_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ icap_settings_device_deployments_info.validate_response_schema if icap_settings_device_deployments_info.validate_response_schema is not none else omit }}"
      register: icap_settings_device_deployments_info_result
