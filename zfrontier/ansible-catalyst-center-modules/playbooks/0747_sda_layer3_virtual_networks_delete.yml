---
# Sample playbook for cisco.catalystcenter.sda_layer3_virtual_networks_delete (cisco.catalystcenter 2.15.0)
# Build order: 747
# Resource module for Sda Layer3 Virtual Networks Delete
# Reads ../models/sda_layer3_virtual_networks_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_layer3_virtual_networks_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_layer3_virtual_networks_delete.

- name: "0747 sda_layer3_virtual_networks_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_layer3_virtual_networks_delete.yml
  tasks:
    - name: Run sda_layer3_virtual_networks_delete from its model
      cisco.catalystcenter.sda_layer3_virtual_networks_delete:
        catalystcenter_debug: "{{ sda_layer3_virtual_networks_delete.catalystcenter_debug if sda_layer3_virtual_networks_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_layer3_virtual_networks_delete.catalystcenter_host if sda_layer3_virtual_networks_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_layer3_virtual_networks_delete.catalystcenter_password if sda_layer3_virtual_networks_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_layer3_virtual_networks_delete.catalystcenter_port if sda_layer3_virtual_networks_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_layer3_virtual_networks_delete.catalystcenter_username if sda_layer3_virtual_networks_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_layer3_virtual_networks_delete.catalystcenter_verify if sda_layer3_virtual_networks_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_layer3_virtual_networks_delete.catalystcenter_version if sda_layer3_virtual_networks_delete.catalystcenter_version is not none else omit }}"
        id: "{{ sda_layer3_virtual_networks_delete.id if sda_layer3_virtual_networks_delete.id is not none else omit }}"
        validate_response_schema: "{{ sda_layer3_virtual_networks_delete.validate_response_schema if sda_layer3_virtual_networks_delete.validate_response_schema is not none else omit }}"
      register: sda_layer3_virtual_networks_delete_result
      tags:
        - never
        - sda_layer3_virtual_networks_delete
