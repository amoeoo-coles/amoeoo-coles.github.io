---
# Sample playbook for cisco.catalystcenter.event_sftp_configurations (cisco.catalystcenter 2.15.0)
# Build order: 1480
# Resource module for Event Sftp Configurations
# Reads ../models/event_sftp_configurations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_sftp_configurations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_sftp_configurations.

- name: "1480 event_sftp_configurations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_sftp_configurations.yml
  tasks:
    - name: Run event_sftp_configurations from its model
      cisco.catalystcenter.event_sftp_configurations:
        catalystcenter_debug: "{{ event_sftp_configurations.catalystcenter_debug if event_sftp_configurations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_sftp_configurations.catalystcenter_host if event_sftp_configurations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_sftp_configurations.catalystcenter_password if event_sftp_configurations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_sftp_configurations.catalystcenter_port if event_sftp_configurations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_sftp_configurations.catalystcenter_username if event_sftp_configurations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_sftp_configurations.catalystcenter_verify if event_sftp_configurations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_sftp_configurations.catalystcenter_version if event_sftp_configurations.catalystcenter_version is not none else omit }}"
        description: "{{ event_sftp_configurations.description if event_sftp_configurations.description is not none else omit }}"
        host: "{{ event_sftp_configurations.host if event_sftp_configurations.host is not none else omit }}"
        id: "{{ event_sftp_configurations.id if event_sftp_configurations.id is not none else omit }}"
        name: "{{ event_sftp_configurations.name if event_sftp_configurations.name is not none else omit }}"
        password: "{{ event_sftp_configurations.password if event_sftp_configurations.password is not none else omit }}"
        path: "{{ event_sftp_configurations.path if event_sftp_configurations.path is not none else omit }}"
        port: "{{ event_sftp_configurations.port if event_sftp_configurations.port is not none else omit }}"
        username: "{{ event_sftp_configurations.username if event_sftp_configurations.username is not none else omit }}"
        validate_response_schema: "{{ event_sftp_configurations.validate_response_schema if event_sftp_configurations.validate_response_schema is not none else omit }}"
      register: event_sftp_configurations_result
      tags:
        - never
        - event_sftp_configurations
