---
# Sample playbook for cisco.catalystcenter.sda_layer3_virtual_networks (cisco.catalystcenter 2.15.0)
# Build order: 746
# Resource module for Sda Layer3 Virtual Networks
# Reads ../models/sda_layer3_virtual_networks.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_layer3_virtual_networks_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_layer3_virtual_networks.

- name: "0746 sda_layer3_virtual_networks"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_layer3_virtual_networks.yml
  tasks:
    - name: Run sda_layer3_virtual_networks from its model
      cisco.catalystcenter.sda_layer3_virtual_networks:
        catalystcenter_debug: "{{ sda_layer3_virtual_networks.catalystcenter_debug if sda_layer3_virtual_networks.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_layer3_virtual_networks.catalystcenter_host if sda_layer3_virtual_networks.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_layer3_virtual_networks.catalystcenter_password if sda_layer3_virtual_networks.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_layer3_virtual_networks.catalystcenter_port if sda_layer3_virtual_networks.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_layer3_virtual_networks.catalystcenter_username if sda_layer3_virtual_networks.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_layer3_virtual_networks.catalystcenter_verify if sda_layer3_virtual_networks.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_layer3_virtual_networks.catalystcenter_version if sda_layer3_virtual_networks.catalystcenter_version is not none else omit }}"
        payload: "{{ (sda_layer3_virtual_networks.payload | cat_strip_nulls) if (sda_layer3_virtual_networks.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_layer3_virtual_networks.validate_response_schema if sda_layer3_virtual_networks.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_layer3_virtual_networks.virtualNetworkName if sda_layer3_virtual_networks.virtualNetworkName is not none else omit }}"
      register: sda_layer3_virtual_networks_result
      tags:
        - never
        - sda_layer3_virtual_networks
