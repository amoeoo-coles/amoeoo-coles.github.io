---
# Sample playbook for cisco.catalystcenter.wireless_sensor_test_results_info (cisco.catalystcenter 2.15.0)
# Build order: 1290
# Information module for Wireless Sensor Test Results
# Reads ../models/wireless_sensor_test_results_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_sensor_test_results_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1290 wireless_sensor_test_results_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_sensor_test_results_info.yml
  tasks:
    - name: Run wireless_sensor_test_results_info from its model
      cisco.catalystcenter.wireless_sensor_test_results_info:
        catalystcenter_debug: "{{ wireless_sensor_test_results_info.catalystcenter_debug if wireless_sensor_test_results_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_sensor_test_results_info.catalystcenter_host if wireless_sensor_test_results_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_sensor_test_results_info.catalystcenter_password if wireless_sensor_test_results_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_sensor_test_results_info.catalystcenter_port if wireless_sensor_test_results_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_sensor_test_results_info.catalystcenter_username if wireless_sensor_test_results_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_sensor_test_results_info.catalystcenter_verify if wireless_sensor_test_results_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_sensor_test_results_info.catalystcenter_version if wireless_sensor_test_results_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ wireless_sensor_test_results_info.endTime if wireless_sensor_test_results_info.endTime is not none else omit }}"
        headers: "{{ wireless_sensor_test_results_info.headers if wireless_sensor_test_results_info.headers is not none else omit }}"
        siteId: "{{ wireless_sensor_test_results_info.siteId if wireless_sensor_test_results_info.siteId is not none else omit }}"
        startTime: "{{ wireless_sensor_test_results_info.startTime if wireless_sensor_test_results_info.startTime is not none else omit }}"
        testFailureBy: "{{ wireless_sensor_test_results_info.testFailureBy if wireless_sensor_test_results_info.testFailureBy is not none else omit }}"
        validate_response_schema: "{{ wireless_sensor_test_results_info.validate_response_schema if wireless_sensor_test_results_info.validate_response_schema is not none else omit }}"
      register: wireless_sensor_test_results_info_result
