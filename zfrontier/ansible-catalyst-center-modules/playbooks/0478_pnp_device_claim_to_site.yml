---
# Sample playbook for cisco.catalystcenter.pnp_device_claim_to_site (cisco.catalystcenter 2.15.0)
# Build order: 478
# Resource module for Pnp Device Claim To Site
# Reads ../models/pnp_device_claim_to_site.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_claim_to_site_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_device_claim_to_site.

- name: "0478 pnp_device_claim_to_site"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_device_claim_to_site.yml
  tasks:
    - name: Run pnp_device_claim_to_site from its model
      cisco.catalystcenter.pnp_device_claim_to_site:
        catalystcenter_debug: "{{ pnp_device_claim_to_site.catalystcenter_debug if pnp_device_claim_to_site.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_device_claim_to_site.catalystcenter_host if pnp_device_claim_to_site.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_device_claim_to_site.catalystcenter_password if pnp_device_claim_to_site.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_device_claim_to_site.catalystcenter_port if pnp_device_claim_to_site.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_device_claim_to_site.catalystcenter_username if pnp_device_claim_to_site.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_device_claim_to_site.catalystcenter_verify if pnp_device_claim_to_site.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_device_claim_to_site.catalystcenter_version if pnp_device_claim_to_site.catalystcenter_version is not none else omit }}"
        configInfo: "{{ (pnp_device_claim_to_site.configInfo | cat_strip_nulls) if (pnp_device_claim_to_site.configInfo | cat_strip_nulls) is not none else omit }}"
        deviceId: "{{ pnp_device_claim_to_site.deviceId if pnp_device_claim_to_site.deviceId is not none else omit }}"
        gateway: "{{ pnp_device_claim_to_site.gateway if pnp_device_claim_to_site.gateway is not none else omit }}"
        hostname: "{{ pnp_device_claim_to_site.hostname if pnp_device_claim_to_site.hostname is not none else omit }}"
        imageInfo: "{{ (pnp_device_claim_to_site.imageInfo | cat_strip_nulls) if (pnp_device_claim_to_site.imageInfo | cat_strip_nulls) is not none else omit }}"
        ipInterfaceName: "{{ pnp_device_claim_to_site.ipInterfaceName if pnp_device_claim_to_site.ipInterfaceName is not none else omit }}"
        rfProfile: "{{ pnp_device_claim_to_site.rfProfile if pnp_device_claim_to_site.rfProfile is not none else omit }}"
        sensorProfile: "{{ pnp_device_claim_to_site.sensorProfile if pnp_device_claim_to_site.sensorProfile is not none else omit }}"
        siteId: "{{ pnp_device_claim_to_site.siteId if pnp_device_claim_to_site.siteId is not none else omit }}"
        staticIP: "{{ pnp_device_claim_to_site.staticIP if pnp_device_claim_to_site.staticIP is not none else omit }}"
        subnetMask: "{{ pnp_device_claim_to_site.subnetMask if pnp_device_claim_to_site.subnetMask is not none else omit }}"
        type: "{{ pnp_device_claim_to_site.type if pnp_device_claim_to_site.type is not none else omit }}"
        validate_response_schema: "{{ pnp_device_claim_to_site.validate_response_schema if pnp_device_claim_to_site.validate_response_schema is not none else omit }}"
        vlanId: "{{ pnp_device_claim_to_site.vlanId if pnp_device_claim_to_site.vlanId is not none else omit }}"
      register: pnp_device_claim_to_site_result
      tags:
        - never
        - pnp_device_claim_to_site
