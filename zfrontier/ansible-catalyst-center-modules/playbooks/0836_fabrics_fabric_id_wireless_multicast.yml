---
# Sample playbook for cisco.catalystcenter.fabrics_fabric_id_wireless_multicast (cisco.catalystcenter 2.15.0)
# Build order: 836
# Resource module for Fabrics Fabric Id Wireless Multicast
# Reads ../models/fabrics_fabric_id_wireless_multicast.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/fabrics_fabric_id_wireless_multicast_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags fabrics_fabric_id_wireless_multicast.

- name: "0836 fabrics_fabric_id_wireless_multicast"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/fabrics_fabric_id_wireless_multicast.yml
  tasks:
    - name: Run fabrics_fabric_id_wireless_multicast from its model
      cisco.catalystcenter.fabrics_fabric_id_wireless_multicast:
        catalystcenter_debug: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_debug if fabrics_fabric_id_wireless_multicast.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_host if fabrics_fabric_id_wireless_multicast.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_password if fabrics_fabric_id_wireless_multicast.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_port if fabrics_fabric_id_wireless_multicast.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_username if fabrics_fabric_id_wireless_multicast.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_verify if fabrics_fabric_id_wireless_multicast.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ fabrics_fabric_id_wireless_multicast.catalystcenter_version if fabrics_fabric_id_wireless_multicast.catalystcenter_version is not none else omit }}"
        fabricId: "{{ fabrics_fabric_id_wireless_multicast.fabricId if fabrics_fabric_id_wireless_multicast.fabricId is not none else omit }}"
        multicastEnabled: "{{ fabrics_fabric_id_wireless_multicast.multicastEnabled if fabrics_fabric_id_wireless_multicast.multicastEnabled is not none else omit }}"
        validate_response_schema: "{{ fabrics_fabric_id_wireless_multicast.validate_response_schema if fabrics_fabric_id_wireless_multicast.validate_response_schema is not none else omit }}"
      register: fabrics_fabric_id_wireless_multicast_result
      tags:
        - never
        - fabrics_fabric_id_wireless_multicast
