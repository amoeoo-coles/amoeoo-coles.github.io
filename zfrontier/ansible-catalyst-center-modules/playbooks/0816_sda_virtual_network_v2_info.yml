---
# Sample playbook for cisco.catalystcenter.sda_virtual_network_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 816
# Information module for Sda Virtual Network V2
# Reads ../models/sda_virtual_network_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_virtual_network_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0816 sda_virtual_network_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_virtual_network_v2_info.yml
  tasks:
    - name: Run sda_virtual_network_v2_info from its model
      cisco.catalystcenter.sda_virtual_network_v2_info:
        catalystcenter_debug: "{{ sda_virtual_network_v2_info.catalystcenter_debug if sda_virtual_network_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_virtual_network_v2_info.catalystcenter_host if sda_virtual_network_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_virtual_network_v2_info.catalystcenter_password if sda_virtual_network_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_virtual_network_v2_info.catalystcenter_port if sda_virtual_network_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_virtual_network_v2_info.catalystcenter_username if sda_virtual_network_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_virtual_network_v2_info.catalystcenter_verify if sda_virtual_network_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_virtual_network_v2_info.catalystcenter_version if sda_virtual_network_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_virtual_network_v2_info.headers if sda_virtual_network_v2_info.headers is not none else omit }}"
        validate_response_schema: "{{ sda_virtual_network_v2_info.validate_response_schema if sda_virtual_network_v2_info.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_virtual_network_v2_info.virtualNetworkName if sda_virtual_network_v2_info.virtualNetworkName is not none else omit }}"
      register: sda_virtual_network_v2_info_result
