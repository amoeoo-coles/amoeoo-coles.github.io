---
# Sample playbook for cisco.catalystcenter.dhcp_services_count_info (cisco.catalystcenter 2.15.0)
# Build order: 400
# Information module for Dhcp Services Count
# Reads ../models/dhcp_services_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dhcp_services_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0400 dhcp_services_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dhcp_services_count_info.yml
  tasks:
    - name: Run dhcp_services_count_info from its model
      cisco.catalystcenter.dhcp_services_count_info:
        catalystcenter_debug: "{{ dhcp_services_count_info.catalystcenter_debug if dhcp_services_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dhcp_services_count_info.catalystcenter_host if dhcp_services_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dhcp_services_count_info.catalystcenter_password if dhcp_services_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dhcp_services_count_info.catalystcenter_port if dhcp_services_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dhcp_services_count_info.catalystcenter_username if dhcp_services_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dhcp_services_count_info.catalystcenter_verify if dhcp_services_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dhcp_services_count_info.catalystcenter_version if dhcp_services_count_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ dhcp_services_count_info.deviceId if dhcp_services_count_info.deviceId is not none else omit }}"
        deviceName: "{{ dhcp_services_count_info.deviceName if dhcp_services_count_info.deviceName is not none else omit }}"
        deviceSiteHierarchy: "{{ dhcp_services_count_info.deviceSiteHierarchy if dhcp_services_count_info.deviceSiteHierarchy is not none else omit }}"
        deviceSiteHierarchyId: "{{ dhcp_services_count_info.deviceSiteHierarchyId if dhcp_services_count_info.deviceSiteHierarchyId is not none else omit }}"
        deviceSiteId: "{{ dhcp_services_count_info.deviceSiteId if dhcp_services_count_info.deviceSiteId is not none else omit }}"
        endTime: "{{ dhcp_services_count_info.endTime if dhcp_services_count_info.endTime is not none else omit }}"
        headers: "{{ dhcp_services_count_info.headers if dhcp_services_count_info.headers is not none else omit }}"
        serverIp: "{{ dhcp_services_count_info.serverIp if dhcp_services_count_info.serverIp is not none else omit }}"
        startTime: "{{ dhcp_services_count_info.startTime if dhcp_services_count_info.startTime is not none else omit }}"
        validate_response_schema: "{{ dhcp_services_count_info.validate_response_schema if dhcp_services_count_info.validate_response_schema is not none else omit }}"
      register: dhcp_services_count_info_result
