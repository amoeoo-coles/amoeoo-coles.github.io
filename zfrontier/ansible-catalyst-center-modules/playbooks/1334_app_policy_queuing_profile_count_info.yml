---
# Sample playbook for cisco.catalystcenter.app_policy_queuing_profile_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1334
# Information module for App Policy Queuing Profile Count
# Reads ../models/app_policy_queuing_profile_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/app_policy_queuing_profile_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1334 app_policy_queuing_profile_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/app_policy_queuing_profile_count_info.yml
  tasks:
    - name: Run app_policy_queuing_profile_count_info from its model
      cisco.catalystcenter.app_policy_queuing_profile_count_info:
        catalystcenter_debug: "{{ app_policy_queuing_profile_count_info.catalystcenter_debug if app_policy_queuing_profile_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ app_policy_queuing_profile_count_info.catalystcenter_host if app_policy_queuing_profile_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ app_policy_queuing_profile_count_info.catalystcenter_password if app_policy_queuing_profile_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ app_policy_queuing_profile_count_info.catalystcenter_port if app_policy_queuing_profile_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ app_policy_queuing_profile_count_info.catalystcenter_username if app_policy_queuing_profile_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ app_policy_queuing_profile_count_info.catalystcenter_verify if app_policy_queuing_profile_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ app_policy_queuing_profile_count_info.catalystcenter_version if app_policy_queuing_profile_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ app_policy_queuing_profile_count_info.headers if app_policy_queuing_profile_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ app_policy_queuing_profile_count_info.validate_response_schema if app_policy_queuing_profile_count_info.validate_response_schema is not none else omit }}"
      register: app_policy_queuing_profile_count_info_result
