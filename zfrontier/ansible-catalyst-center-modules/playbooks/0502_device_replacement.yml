---
# Sample playbook for cisco.catalystcenter.device_replacement (cisco.catalystcenter 2.15.0)
# Build order: 502
# Resource module for Device Replacement
# Reads ../models/device_replacement.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_replacement_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags device_replacement.

- name: "0502 device_replacement"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_replacement.yml
  tasks:
    - name: Run device_replacement from its model
      cisco.catalystcenter.device_replacement:
        catalystcenter_debug: "{{ device_replacement.catalystcenter_debug if device_replacement.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_replacement.catalystcenter_host if device_replacement.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_replacement.catalystcenter_password if device_replacement.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_replacement.catalystcenter_port if device_replacement.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_replacement.catalystcenter_username if device_replacement.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_replacement.catalystcenter_verify if device_replacement.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_replacement.catalystcenter_version if device_replacement.catalystcenter_version is not none else omit }}"
        payload: "{{ (device_replacement.payload | cat_strip_nulls) if (device_replacement.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ device_replacement.validate_response_schema if device_replacement.validate_response_schema is not none else omit }}"
      register: device_replacement_result
      tags:
        - never
        - device_replacement
