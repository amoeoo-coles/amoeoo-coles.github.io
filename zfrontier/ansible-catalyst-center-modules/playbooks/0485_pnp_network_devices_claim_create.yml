---
# Sample playbook for cisco.catalystcenter.pnp_network_devices_claim_create (cisco.catalystcenter 2.15.0)
# Build order: 485
# Resource module for Pnp Network Devices Claim Create
# Reads ../models/pnp_network_devices_claim_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_network_devices_claim_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_network_devices_claim_create.

- name: "0485 pnp_network_devices_claim_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_network_devices_claim_create.yml
  tasks:
    - name: Run pnp_network_devices_claim_create from its model
      cisco.catalystcenter.pnp_network_devices_claim_create:
        apZone: "{{ pnp_network_devices_claim_create.apZone if pnp_network_devices_claim_create.apZone is not none else omit }}"
        cablingScheme: "{{ pnp_network_devices_claim_create.cablingScheme if pnp_network_devices_claim_create.cablingScheme is not none else omit }}"
        catalystcenter_debug: "{{ pnp_network_devices_claim_create.catalystcenter_debug if pnp_network_devices_claim_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_network_devices_claim_create.catalystcenter_host if pnp_network_devices_claim_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_network_devices_claim_create.catalystcenter_password if pnp_network_devices_claim_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_network_devices_claim_create.catalystcenter_port if pnp_network_devices_claim_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_network_devices_claim_create.catalystcenter_username if pnp_network_devices_claim_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_network_devices_claim_create.catalystcenter_verify if pnp_network_devices_claim_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_network_devices_claim_create.catalystcenter_version if pnp_network_devices_claim_create.catalystcenter_version is not none else omit }}"
        deviceType: "{{ pnp_network_devices_claim_create.deviceType if pnp_network_devices_claim_create.deviceType is not none else omit }}"
        gateway: "{{ pnp_network_devices_claim_create.gateway if pnp_network_devices_claim_create.gateway is not none else omit }}"
        hostname: "{{ pnp_network_devices_claim_create.hostname if pnp_network_devices_claim_create.hostname is not none else omit }}"
        id: "{{ pnp_network_devices_claim_create.id if pnp_network_devices_claim_create.id is not none else omit }}"
        imageInfo: "{{ (pnp_network_devices_claim_create.imageInfo | cat_strip_nulls) if (pnp_network_devices_claim_create.imageInfo | cat_strip_nulls) is not none else omit }}"
        ipInterfaceName: "{{ pnp_network_devices_claim_create.ipInterfaceName if pnp_network_devices_claim_create.ipInterfaceName is not none else omit }}"
        licenseLevel: "{{ pnp_network_devices_claim_create.licenseLevel if pnp_network_devices_claim_create.licenseLevel is not none else omit }}"
        prefix: "{{ pnp_network_devices_claim_create.prefix if pnp_network_devices_claim_create.prefix is not none else omit }}"
        pushDeviceIdCertificate: "{{ pnp_network_devices_claim_create.pushDeviceIdCertificate if pnp_network_devices_claim_create.pushDeviceIdCertificate is not none else omit }}"
        rfProfile: "{{ pnp_network_devices_claim_create.rfProfile if pnp_network_devices_claim_create.rfProfile is not none else omit }}"
        sensorProfile: "{{ pnp_network_devices_claim_create.sensorProfile if pnp_network_devices_claim_create.sensorProfile is not none else omit }}"
        siteId: "{{ pnp_network_devices_claim_create.siteId if pnp_network_devices_claim_create.siteId is not none else omit }}"
        staticIpAddress: "{{ pnp_network_devices_claim_create.staticIpAddress if pnp_network_devices_claim_create.staticIpAddress is not none else omit }}"
        subnetMask: "{{ pnp_network_devices_claim_create.subnetMask if pnp_network_devices_claim_create.subnetMask is not none else omit }}"
        svlConfig: "{{ (pnp_network_devices_claim_create.svlConfig | cat_strip_nulls) if (pnp_network_devices_claim_create.svlConfig | cat_strip_nulls) is not none else omit }}"
        topOfStackSerialNumber: "{{ pnp_network_devices_claim_create.topOfStackSerialNumber if pnp_network_devices_claim_create.topOfStackSerialNumber is not none else omit }}"
        validate_response_schema: "{{ pnp_network_devices_claim_create.validate_response_schema if pnp_network_devices_claim_create.validate_response_schema is not none else omit }}"
        vlanId: "{{ pnp_network_devices_claim_create.vlanId if pnp_network_devices_claim_create.vlanId is not none else omit }}"
      register: pnp_network_devices_claim_create_result
      tags:
        - never
        - pnp_network_devices_claim_create
