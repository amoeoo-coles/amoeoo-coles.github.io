---
# Sample playbook for cisco.catalystcenter.system_performance_historical_info (cisco.catalystcenter 2.15.0)
# Build order: 1434
# Information module for System Performance Historical
# Reads ../models/system_performance_historical_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/system_performance_historical_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1434 system_performance_historical_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_performance_historical_info.yml
  tasks:
    - name: Run system_performance_historical_info from its model
      cisco.catalystcenter.system_performance_historical_info:
        catalystcenter_debug: "{{ system_performance_historical_info.catalystcenter_debug if system_performance_historical_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ system_performance_historical_info.catalystcenter_host if system_performance_historical_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ system_performance_historical_info.catalystcenter_password if system_performance_historical_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ system_performance_historical_info.catalystcenter_port if system_performance_historical_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ system_performance_historical_info.catalystcenter_username if system_performance_historical_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ system_performance_historical_info.catalystcenter_verify if system_performance_historical_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ system_performance_historical_info.catalystcenter_version if system_performance_historical_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ system_performance_historical_info.endTime if system_performance_historical_info.endTime is not none else omit }}"
        headers: "{{ system_performance_historical_info.headers if system_performance_historical_info.headers is not none else omit }}"
        kpi: "{{ system_performance_historical_info.kpi if system_performance_historical_info.kpi is not none else omit }}"
        startTime: "{{ system_performance_historical_info.startTime if system_performance_historical_info.startTime is not none else omit }}"
        validate_response_schema: "{{ system_performance_historical_info.validate_response_schema if system_performance_historical_info.validate_response_schema is not none else omit }}"
      register: system_performance_historical_info_result
