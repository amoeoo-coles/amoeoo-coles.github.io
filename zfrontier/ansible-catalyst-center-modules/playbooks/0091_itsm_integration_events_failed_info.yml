---
# Sample playbook for cisco.catalystcenter.itsm_integration_events_failed_info (cisco.catalystcenter 2.15.0)
# Build order: 91
# Information module for Itsm Integration Events Failed
# Reads ../models/itsm_integration_events_failed_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/itsm_integration_events_failed_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0091 itsm_integration_events_failed_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/itsm_integration_events_failed_info.yml
  tasks:
    - name: Run itsm_integration_events_failed_info from its model
      cisco.catalystcenter.itsm_integration_events_failed_info:
        catalystcenter_debug: "{{ itsm_integration_events_failed_info.catalystcenter_debug if itsm_integration_events_failed_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ itsm_integration_events_failed_info.catalystcenter_host if itsm_integration_events_failed_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ itsm_integration_events_failed_info.catalystcenter_password if itsm_integration_events_failed_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ itsm_integration_events_failed_info.catalystcenter_port if itsm_integration_events_failed_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ itsm_integration_events_failed_info.catalystcenter_username if itsm_integration_events_failed_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ itsm_integration_events_failed_info.catalystcenter_verify if itsm_integration_events_failed_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ itsm_integration_events_failed_info.catalystcenter_version if itsm_integration_events_failed_info.catalystcenter_version is not none else omit }}"
        headers: "{{ itsm_integration_events_failed_info.headers if itsm_integration_events_failed_info.headers is not none else omit }}"
        instanceId: "{{ itsm_integration_events_failed_info.instanceId if itsm_integration_events_failed_info.instanceId is not none else omit }}"
        validate_response_schema: "{{ itsm_integration_events_failed_info.validate_response_schema if itsm_integration_events_failed_info.validate_response_schema is not none else omit }}"
      register: itsm_integration_events_failed_info_result
