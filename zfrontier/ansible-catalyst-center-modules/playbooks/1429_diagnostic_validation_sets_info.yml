---
# Sample playbook for cisco.catalystcenter.diagnostic_validation_sets_info (cisco.catalystcenter 2.15.0)
# Build order: 1429
# Information module for Diagnostic Validation Sets
# Reads ../models/diagnostic_validation_sets_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/diagnostic_validation_sets_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1429 diagnostic_validation_sets_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/diagnostic_validation_sets_info.yml
  tasks:
    - name: Run diagnostic_validation_sets_info from its model
      cisco.catalystcenter.diagnostic_validation_sets_info:
        catalystcenter_debug: "{{ diagnostic_validation_sets_info.catalystcenter_debug if diagnostic_validation_sets_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ diagnostic_validation_sets_info.catalystcenter_host if diagnostic_validation_sets_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ diagnostic_validation_sets_info.catalystcenter_password if diagnostic_validation_sets_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ diagnostic_validation_sets_info.catalystcenter_port if diagnostic_validation_sets_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ diagnostic_validation_sets_info.catalystcenter_username if diagnostic_validation_sets_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ diagnostic_validation_sets_info.catalystcenter_verify if diagnostic_validation_sets_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ diagnostic_validation_sets_info.catalystcenter_version if diagnostic_validation_sets_info.catalystcenter_version is not none else omit }}"
        headers: "{{ diagnostic_validation_sets_info.headers if diagnostic_validation_sets_info.headers is not none else omit }}"
        id: "{{ diagnostic_validation_sets_info.id if diagnostic_validation_sets_info.id is not none else omit }}"
        validate_response_schema: "{{ diagnostic_validation_sets_info.validate_response_schema if diagnostic_validation_sets_info.validate_response_schema is not none else omit }}"
        view: "{{ diagnostic_validation_sets_info.view if diagnostic_validation_sets_info.view is not none else omit }}"
      register: diagnostic_validation_sets_info_result
