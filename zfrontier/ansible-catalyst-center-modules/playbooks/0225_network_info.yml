---
# Sample playbook for cisco.catalystcenter.network_info (cisco.catalystcenter 2.15.0)
# Build order: 225
# Information module for Network
# Reads ../models/network_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0225 network_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_info.yml
  tasks:
    - name: Run network_info from its model
      cisco.catalystcenter.network_info:
        catalystcenter_debug: "{{ network_info.catalystcenter_debug if network_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_info.catalystcenter_host if network_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_info.catalystcenter_password if network_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_info.catalystcenter_port if network_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_info.catalystcenter_username if network_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_info.catalystcenter_verify if network_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_info.catalystcenter_version if network_info.catalystcenter_version is not none else omit }}"
        headers: "{{ network_info.headers if network_info.headers is not none else omit }}"
        siteId: "{{ network_info.siteId if network_info.siteId is not none else omit }}"
        validate_response_schema: "{{ network_info.validate_response_schema if network_info.validate_response_schema is not none else omit }}"
      register: network_info_result
