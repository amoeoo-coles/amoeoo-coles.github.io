---
# Sample playbook for cisco.catalystcenter.network_device_by_serial_number_info (cisco.catalystcenter 2.15.0)
# Build order: 427
# Information module for Network Device By Serial Number
# Reads ../models/network_device_by_serial_number_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_by_serial_number_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0427 network_device_by_serial_number_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_by_serial_number_info.yml
  tasks:
    - name: Run network_device_by_serial_number_info from its model
      cisco.catalystcenter.network_device_by_serial_number_info:
        catalystcenter_debug: "{{ network_device_by_serial_number_info.catalystcenter_debug if network_device_by_serial_number_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_by_serial_number_info.catalystcenter_host if network_device_by_serial_number_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_by_serial_number_info.catalystcenter_password if network_device_by_serial_number_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_by_serial_number_info.catalystcenter_port if network_device_by_serial_number_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_by_serial_number_info.catalystcenter_username if network_device_by_serial_number_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_by_serial_number_info.catalystcenter_verify if network_device_by_serial_number_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_by_serial_number_info.catalystcenter_version if network_device_by_serial_number_info.catalystcenter_version is not none else omit }}"
        headers: "{{ network_device_by_serial_number_info.headers if network_device_by_serial_number_info.headers is not none else omit }}"
        serialNumber: "{{ network_device_by_serial_number_info.serialNumber if network_device_by_serial_number_info.serialNumber is not none else omit }}"
        validate_response_schema: "{{ network_device_by_serial_number_info.validate_response_schema if network_device_by_serial_number_info.validate_response_schema is not none else omit }}"
      register: network_device_by_serial_number_info_result
