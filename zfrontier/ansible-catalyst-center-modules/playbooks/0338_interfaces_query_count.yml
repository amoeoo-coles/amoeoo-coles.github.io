---
# Sample playbook for cisco.catalystcenter.interfaces_query_count (cisco.catalystcenter 2.15.0)
# Build order: 338
# Resource module for Interfaces Query Count
# Reads ../models/interfaces_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/interfaces_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags interfaces_query_count.

- name: "0338 interfaces_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/interfaces_query_count.yml
  tasks:
    - name: Run interfaces_query_count from its model
      cisco.catalystcenter.interfaces_query_count:
        aggregateAttributes: "{{ (interfaces_query_count.aggregateAttributes | cat_strip_nulls) if (interfaces_query_count.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (interfaces_query_count.attributes | cat_strip_nulls) if (interfaces_query_count.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ interfaces_query_count.catalystcenter_debug if interfaces_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ interfaces_query_count.catalystcenter_host if interfaces_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ interfaces_query_count.catalystcenter_password if interfaces_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ interfaces_query_count.catalystcenter_port if interfaces_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ interfaces_query_count.catalystcenter_username if interfaces_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ interfaces_query_count.catalystcenter_verify if interfaces_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ interfaces_query_count.catalystcenter_version if interfaces_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ interfaces_query_count.endTime if interfaces_query_count.endTime is not none else omit }}"
        filters: "{{ (interfaces_query_count.filters | cat_strip_nulls) if (interfaces_query_count.filters | cat_strip_nulls) is not none else omit }}"
        page: "{{ (interfaces_query_count.page | cat_strip_nulls) if (interfaces_query_count.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ interfaces_query_count.startTime if interfaces_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ interfaces_query_count.validate_response_schema if interfaces_query_count.validate_response_schema is not none else omit }}"
        views: "{{ (interfaces_query_count.views | cat_strip_nulls) if (interfaces_query_count.views | cat_strip_nulls) is not none else omit }}"
      register: interfaces_query_count_result
      tags:
        - never
        - interfaces_query_count
