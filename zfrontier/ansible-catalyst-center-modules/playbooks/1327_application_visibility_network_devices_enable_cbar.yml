---
# Sample playbook for cisco.catalystcenter.application_visibility_network_devices_enable_cbar (cisco.catalystcenter 2.15.0)
# Build order: 1327
# Resource module for Application Visibility Network Devices Enable Cbar
# Reads ../models/application_visibility_network_devices_enable_cbar.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/application_visibility_network_devices_enable_cbar_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags application_visibility_network_devices_enable_cbar.

- name: "1327 application_visibility_network_devices_enable_cbar"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/application_visibility_network_devices_enable_cbar.yml
  tasks:
    - name: Run application_visibility_network_devices_enable_cbar from its model
      cisco.catalystcenter.application_visibility_network_devices_enable_cbar:
        catalystcenter_debug: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_debug if application_visibility_network_devices_enable_cbar.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_host if application_visibility_network_devices_enable_cbar.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_password if application_visibility_network_devices_enable_cbar.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_port if application_visibility_network_devices_enable_cbar.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_username if application_visibility_network_devices_enable_cbar.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_verify if application_visibility_network_devices_enable_cbar.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ application_visibility_network_devices_enable_cbar.catalystcenter_version if application_visibility_network_devices_enable_cbar.catalystcenter_version is not none else omit }}"
        networkDevices: "{{ (application_visibility_network_devices_enable_cbar.networkDevices | cat_strip_nulls) if (application_visibility_network_devices_enable_cbar.networkDevices | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ application_visibility_network_devices_enable_cbar.validate_response_schema if application_visibility_network_devices_enable_cbar.validate_response_schema is not none else omit }}"
      register: application_visibility_network_devices_enable_cbar_result
      tags:
        - never
        - application_visibility_network_devices_enable_cbar
