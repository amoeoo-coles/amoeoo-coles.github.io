---
# Sample playbook for cisco.catalystcenter.service_provider_info (cisco.catalystcenter 2.15.0)
# Build order: 230
# Information module for Service Provider
# Reads ../models/service_provider_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/service_provider_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0230 service_provider_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/service_provider_info.yml
  tasks:
    - name: Run service_provider_info from its model
      cisco.catalystcenter.service_provider_info:
        catalystcenter_debug: "{{ service_provider_info.catalystcenter_debug if service_provider_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ service_provider_info.catalystcenter_host if service_provider_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ service_provider_info.catalystcenter_password if service_provider_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ service_provider_info.catalystcenter_port if service_provider_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ service_provider_info.catalystcenter_username if service_provider_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ service_provider_info.catalystcenter_verify if service_provider_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ service_provider_info.catalystcenter_version if service_provider_info.catalystcenter_version is not none else omit }}"
        headers: "{{ service_provider_info.headers if service_provider_info.headers is not none else omit }}"
        validate_response_schema: "{{ service_provider_info.validate_response_schema if service_provider_info.validate_response_schema is not none else omit }}"
      register: service_provider_info_result
