---
# Sample playbook for cisco.catalystcenter.endpoint_analytics_endpoints (cisco.catalystcenter 2.15.0)
# Build order: 1367
# Resource module for Endpoint Analytics Endpoints
# Reads ../models/endpoint_analytics_endpoints.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/endpoint_analytics_endpoints_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags endpoint_analytics_endpoints.

- name: "1367 endpoint_analytics_endpoints"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoint_analytics_endpoints.yml
  tasks:
    - name: Run endpoint_analytics_endpoints from its model
      cisco.catalystcenter.endpoint_analytics_endpoints:
        catalystcenter_debug: "{{ endpoint_analytics_endpoints.catalystcenter_debug if endpoint_analytics_endpoints.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ endpoint_analytics_endpoints.catalystcenter_host if endpoint_analytics_endpoints.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ endpoint_analytics_endpoints.catalystcenter_password if endpoint_analytics_endpoints.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ endpoint_analytics_endpoints.catalystcenter_port if endpoint_analytics_endpoints.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ endpoint_analytics_endpoints.catalystcenter_username if endpoint_analytics_endpoints.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ endpoint_analytics_endpoints.catalystcenter_verify if endpoint_analytics_endpoints.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ endpoint_analytics_endpoints.catalystcenter_version if endpoint_analytics_endpoints.catalystcenter_version is not none else omit }}"
        deviceType: "{{ endpoint_analytics_endpoints.deviceType if endpoint_analytics_endpoints.deviceType is not none else omit }}"
        epId: "{{ endpoint_analytics_endpoints.epId if endpoint_analytics_endpoints.epId is not none else omit }}"
        hardwareManufacturer: "{{ endpoint_analytics_endpoints.hardwareManufacturer if endpoint_analytics_endpoints.hardwareManufacturer is not none else omit }}"
        hardwareModel: "{{ endpoint_analytics_endpoints.hardwareModel if endpoint_analytics_endpoints.hardwareModel is not none else omit }}"
        macAddress: "{{ endpoint_analytics_endpoints.macAddress if endpoint_analytics_endpoints.macAddress is not none else omit }}"
        validate_response_schema: "{{ endpoint_analytics_endpoints.validate_response_schema if endpoint_analytics_endpoints.validate_response_schema is not none else omit }}"
      register: endpoint_analytics_endpoints_result
      tags:
        - never
        - endpoint_analytics_endpoints
