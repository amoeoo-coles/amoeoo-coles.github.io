---
# Sample playbook for cisco.catalystcenter.areas_info (cisco.catalystcenter 2.15.0)
# Build order: 164
# Information module for Areas
# Reads ../models/areas_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/areas_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0164 areas_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/areas_info.yml
  tasks:
    - name: Run areas_info from its model
      cisco.catalystcenter.areas_info:
        catalystcenter_debug: "{{ areas_info.catalystcenter_debug if areas_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ areas_info.catalystcenter_host if areas_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ areas_info.catalystcenter_password if areas_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ areas_info.catalystcenter_port if areas_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ areas_info.catalystcenter_username if areas_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ areas_info.catalystcenter_verify if areas_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ areas_info.catalystcenter_version if areas_info.catalystcenter_version is not none else omit }}"
        headers: "{{ areas_info.headers if areas_info.headers is not none else omit }}"
        id: "{{ areas_info.id if areas_info.id is not none else omit }}"
        validate_response_schema: "{{ areas_info.validate_response_schema if areas_info.validate_response_schema is not none else omit }}"
      register: areas_info_result
