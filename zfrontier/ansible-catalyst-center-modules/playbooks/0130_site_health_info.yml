---
# Sample playbook for cisco.catalystcenter.site_health_info (cisco.catalystcenter 2.15.0)
# Build order: 130
# Information module for Site Health
# Reads ../models/site_health_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_health_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0130 site_health_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_health_info.yml
  tasks:
    - name: Run site_health_info from its model
      cisco.catalystcenter.site_health_info:
        catalystcenter_debug: "{{ site_health_info.catalystcenter_debug if site_health_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_health_info.catalystcenter_host if site_health_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_health_info.catalystcenter_password if site_health_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_health_info.catalystcenter_port if site_health_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_health_info.catalystcenter_username if site_health_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_health_info.catalystcenter_verify if site_health_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_health_info.catalystcenter_version if site_health_info.catalystcenter_version is not none else omit }}"
        headers: "{{ site_health_info.headers if site_health_info.headers is not none else omit }}"
        limit: "{{ site_health_info.limit if site_health_info.limit is not none else omit }}"
        offset: "{{ site_health_info.offset if site_health_info.offset is not none else omit }}"
        siteType: "{{ site_health_info.siteType if site_health_info.siteType is not none else omit }}"
        timestamp: "{{ site_health_info.timestamp if site_health_info.timestamp is not none else omit }}"
        validate_response_schema: "{{ site_health_info.validate_response_schema if site_health_info.validate_response_schema is not none else omit }}"
      register: site_health_info_result
