---
# Sample playbook for cisco.catalystcenter.sda_fabric_devices_layer2_handoffs_info (cisco.catalystcenter 2.15.0)
# Build order: 783
# Information module for Sda Fabric Devices Layer2 Handoffs
# Reads ../models/sda_fabric_devices_layer2_handoffs_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabric_devices_layer2_handoffs_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0783 sda_fabric_devices_layer2_handoffs_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabric_devices_layer2_handoffs_info.yml
  tasks:
    - name: Run sda_fabric_devices_layer2_handoffs_info from its model
      cisco.catalystcenter.sda_fabric_devices_layer2_handoffs_info:
        catalystcenter_debug: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_debug if sda_fabric_devices_layer2_handoffs_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_host if sda_fabric_devices_layer2_handoffs_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_password if sda_fabric_devices_layer2_handoffs_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_port if sda_fabric_devices_layer2_handoffs_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_username if sda_fabric_devices_layer2_handoffs_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_verify if sda_fabric_devices_layer2_handoffs_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabric_devices_layer2_handoffs_info.catalystcenter_version if sda_fabric_devices_layer2_handoffs_info.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_fabric_devices_layer2_handoffs_info.fabricId if sda_fabric_devices_layer2_handoffs_info.fabricId is not none else omit }}"
        headers: "{{ sda_fabric_devices_layer2_handoffs_info.headers if sda_fabric_devices_layer2_handoffs_info.headers is not none else omit }}"
        limit: "{{ sda_fabric_devices_layer2_handoffs_info.limit if sda_fabric_devices_layer2_handoffs_info.limit is not none else omit }}"
        networkDeviceId: "{{ sda_fabric_devices_layer2_handoffs_info.networkDeviceId if sda_fabric_devices_layer2_handoffs_info.networkDeviceId is not none else omit }}"
        offset: "{{ sda_fabric_devices_layer2_handoffs_info.offset if sda_fabric_devices_layer2_handoffs_info.offset is not none else omit }}"
        validate_response_schema: "{{ sda_fabric_devices_layer2_handoffs_info.validate_response_schema if sda_fabric_devices_layer2_handoffs_info.validate_response_schema is not none else omit }}"
      register: sda_fabric_devices_layer2_handoffs_info_result
