---
# Sample playbook for cisco.catalystcenter.roles_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 51
# Information module for Roles V2
# Reads ../models/roles_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/roles_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0051 roles_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/roles_v2_info.yml
  tasks:
    - name: Run roles_v2_info from its model
      cisco.catalystcenter.roles_v2_info:
        catalystcenter_debug: "{{ roles_v2_info.catalystcenter_debug if roles_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ roles_v2_info.catalystcenter_host if roles_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ roles_v2_info.catalystcenter_password if roles_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ roles_v2_info.catalystcenter_port if roles_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ roles_v2_info.catalystcenter_username if roles_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ roles_v2_info.catalystcenter_verify if roles_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ roles_v2_info.catalystcenter_version if roles_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ roles_v2_info.headers if roles_v2_info.headers is not none else omit }}"
        id: "{{ roles_v2_info.id if roles_v2_info.id is not none else omit }}"
        validate_response_schema: "{{ roles_v2_info.validate_response_schema if roles_v2_info.validate_response_schema is not none else omit }}"
      register: roles_v2_info_result
