---
# Sample playbook for cisco.catalystcenter.wireless_settings_pre_auth_acls (cisco.catalystcenter 2.15.0)
# Build order: 1054
# Resource module for Wireless Settings Pre Auth Acls
# Reads ../models/wireless_settings_pre_auth_acls.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_pre_auth_acls_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_pre_auth_acls.

- name: "1054 wireless_settings_pre_auth_acls"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_pre_auth_acls.yml
  tasks:
    - name: Run wireless_settings_pre_auth_acls from its model
      cisco.catalystcenter.wireless_settings_pre_auth_acls:
        aclListName: "{{ wireless_settings_pre_auth_acls.aclListName if wireless_settings_pre_auth_acls.aclListName is not none else omit }}"
        aclName: "{{ wireless_settings_pre_auth_acls.aclName if wireless_settings_pre_auth_acls.aclName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_settings_pre_auth_acls.catalystcenter_debug if wireless_settings_pre_auth_acls.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_pre_auth_acls.catalystcenter_host if wireless_settings_pre_auth_acls.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_pre_auth_acls.catalystcenter_password if wireless_settings_pre_auth_acls.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_pre_auth_acls.catalystcenter_port if wireless_settings_pre_auth_acls.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_pre_auth_acls.catalystcenter_username if wireless_settings_pre_auth_acls.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_pre_auth_acls.catalystcenter_verify if wireless_settings_pre_auth_acls.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_pre_auth_acls.catalystcenter_version if wireless_settings_pre_auth_acls.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_settings_pre_auth_acls.id if wireless_settings_pre_auth_acls.id is not none else omit }}"
        includeAutoGeneratedRules: "{{ wireless_settings_pre_auth_acls.includeAutoGeneratedRules if wireless_settings_pre_auth_acls.includeAutoGeneratedRules is not none else omit }}"
        ipAclRules: "{{ (wireless_settings_pre_auth_acls.ipAclRules | cat_strip_nulls) if (wireless_settings_pre_auth_acls.ipAclRules | cat_strip_nulls) is not none else omit }}"
        ipv6AclEnabled: "{{ wireless_settings_pre_auth_acls.ipv6AclEnabled if wireless_settings_pre_auth_acls.ipv6AclEnabled is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_pre_auth_acls.validate_response_schema if wireless_settings_pre_auth_acls.validate_response_schema is not none else omit }}"
        walledGardenUrls: "{{ (wireless_settings_pre_auth_acls.walledGardenUrls | cat_strip_nulls) if (wireless_settings_pre_auth_acls.walledGardenUrls | cat_strip_nulls) is not none else omit }}"
      register: wireless_settings_pre_auth_acls_result
      tags:
        - never
        - wireless_settings_pre_auth_acls
