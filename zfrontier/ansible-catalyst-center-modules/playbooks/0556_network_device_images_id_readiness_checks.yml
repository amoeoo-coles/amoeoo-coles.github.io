---
# Sample playbook for cisco.catalystcenter.network_device_images_id_readiness_checks (cisco.catalystcenter 2.15.0)
# Build order: 556
# Resource module for Network Device Images Id Readiness Checks
# Reads ../models/network_device_images_id_readiness_checks.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_images_id_readiness_checks_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_images_id_readiness_checks.

- name: "0556 network_device_images_id_readiness_checks"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_images_id_readiness_checks.yml
  tasks:
    - name: Run network_device_images_id_readiness_checks from its model
      cisco.catalystcenter.network_device_images_id_readiness_checks:
        catalystcenter_debug: "{{ network_device_images_id_readiness_checks.catalystcenter_debug if network_device_images_id_readiness_checks.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_images_id_readiness_checks.catalystcenter_host if network_device_images_id_readiness_checks.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_images_id_readiness_checks.catalystcenter_password if network_device_images_id_readiness_checks.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_images_id_readiness_checks.catalystcenter_port if network_device_images_id_readiness_checks.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_images_id_readiness_checks.catalystcenter_username if network_device_images_id_readiness_checks.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_images_id_readiness_checks.catalystcenter_verify if network_device_images_id_readiness_checks.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_images_id_readiness_checks.catalystcenter_version if network_device_images_id_readiness_checks.catalystcenter_version is not none else omit }}"
        id: "{{ network_device_images_id_readiness_checks.id if network_device_images_id_readiness_checks.id is not none else omit }}"
        validate_response_schema: "{{ network_device_images_id_readiness_checks.validate_response_schema if network_device_images_id_readiness_checks.validate_response_schema is not none else omit }}"
      register: network_device_images_id_readiness_checks_result
      tags:
        - never
        - network_device_images_id_readiness_checks
