---
# Sample playbook for cisco.catalystcenter.flexible_report_schedule_info (cisco.catalystcenter 2.15.0)
# Build order: 1472
# Information module for Flexible Report Schedule
# Reads ../models/flexible_report_schedule_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/flexible_report_schedule_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1472 flexible_report_schedule_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/flexible_report_schedule_info.yml
  tasks:
    - name: Run flexible_report_schedule_info from its model
      cisco.catalystcenter.flexible_report_schedule_info:
        catalystcenter_debug: "{{ flexible_report_schedule_info.catalystcenter_debug if flexible_report_schedule_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ flexible_report_schedule_info.catalystcenter_host if flexible_report_schedule_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ flexible_report_schedule_info.catalystcenter_password if flexible_report_schedule_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ flexible_report_schedule_info.catalystcenter_port if flexible_report_schedule_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ flexible_report_schedule_info.catalystcenter_username if flexible_report_schedule_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ flexible_report_schedule_info.catalystcenter_verify if flexible_report_schedule_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ flexible_report_schedule_info.catalystcenter_version if flexible_report_schedule_info.catalystcenter_version is not none else omit }}"
        headers: "{{ flexible_report_schedule_info.headers if flexible_report_schedule_info.headers is not none else omit }}"
        reportId: "{{ flexible_report_schedule_info.reportId if flexible_report_schedule_info.reportId is not none else omit }}"
        validate_response_schema: "{{ flexible_report_schedule_info.validate_response_schema if flexible_report_schedule_info.validate_response_schema is not none else omit }}"
      register: flexible_report_schedule_info_result
