---
# Sample playbook for cisco.catalystcenter.configuration_template (cisco.catalystcenter 2.15.0)
# Build order: 589
# Resource module for Configuration Template
# Reads ../models/configuration_template.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template.

- name: "0589 configuration_template"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template.yml
  tasks:
    - name: Run configuration_template from its model
      cisco.catalystcenter.configuration_template:
        author: "{{ configuration_template.author if configuration_template.author is not none else omit }}"
        catalystcenter_debug: "{{ configuration_template.catalystcenter_debug if configuration_template.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template.catalystcenter_host if configuration_template.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template.catalystcenter_password if configuration_template.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template.catalystcenter_port if configuration_template.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template.catalystcenter_username if configuration_template.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template.catalystcenter_verify if configuration_template.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template.catalystcenter_version if configuration_template.catalystcenter_version is not none else omit }}"
        composite: "{{ configuration_template.composite if configuration_template.composite is not none else omit }}"
        containingTemplates: "{{ (configuration_template.containingTemplates | cat_strip_nulls) if (configuration_template.containingTemplates | cat_strip_nulls) is not none else omit }}"
        createTime: "{{ configuration_template.createTime if configuration_template.createTime is not none else omit }}"
        customParamsOrder: "{{ configuration_template.customParamsOrder if configuration_template.customParamsOrder is not none else omit }}"
        description: "{{ configuration_template.description if configuration_template.description is not none else omit }}"
        deviceTypes: "{{ (configuration_template.deviceTypes | cat_strip_nulls) if (configuration_template.deviceTypes | cat_strip_nulls) is not none else omit }}"
        failurePolicy: "{{ configuration_template.failurePolicy if configuration_template.failurePolicy is not none else omit }}"
        id: "{{ configuration_template.id if configuration_template.id is not none else omit }}"
        language: "{{ configuration_template.language if configuration_template.language is not none else omit }}"
        lastUpdateTime: "{{ configuration_template.lastUpdateTime if configuration_template.lastUpdateTime is not none else omit }}"
        latestVersionTime: "{{ configuration_template.latestVersionTime if configuration_template.latestVersionTime is not none else omit }}"
        name: "{{ configuration_template.name if configuration_template.name is not none else omit }}"
        parentTemplateId: "{{ configuration_template.parentTemplateId if configuration_template.parentTemplateId is not none else omit }}"
        projectId: "{{ configuration_template.projectId if configuration_template.projectId is not none else omit }}"
        projectName: "{{ configuration_template.projectName if configuration_template.projectName is not none else omit }}"
        rollbackTemplateContent: "{{ configuration_template.rollbackTemplateContent if configuration_template.rollbackTemplateContent is not none else omit }}"
        rollbackTemplateParams: "{{ (configuration_template.rollbackTemplateParams | cat_strip_nulls) if (configuration_template.rollbackTemplateParams | cat_strip_nulls) is not none else omit }}"
        softwareType: "{{ configuration_template.softwareType if configuration_template.softwareType is not none else omit }}"
        softwareVariant: "{{ configuration_template.softwareVariant if configuration_template.softwareVariant is not none else omit }}"
        softwareVersion: "{{ configuration_template.softwareVersion if configuration_template.softwareVersion is not none else omit }}"
        tags: "{{ (configuration_template.tags | cat_strip_nulls) if (configuration_template.tags | cat_strip_nulls) is not none else omit }}"
        templateContent: "{{ configuration_template.templateContent if configuration_template.templateContent is not none else omit }}"
        templateId: "{{ configuration_template.templateId if configuration_template.templateId is not none else omit }}"
        templateParams: "{{ (configuration_template.templateParams | cat_strip_nulls) if (configuration_template.templateParams | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ configuration_template.validate_response_schema if configuration_template.validate_response_schema is not none else omit }}"
        validationErrors: "{{ (configuration_template.validationErrors | cat_strip_nulls) if (configuration_template.validationErrors | cat_strip_nulls) is not none else omit }}"
        version: "{{ configuration_template.version if configuration_template.version is not none else omit }}"
      register: configuration_template_result
      tags:
        - never
        - configuration_template
