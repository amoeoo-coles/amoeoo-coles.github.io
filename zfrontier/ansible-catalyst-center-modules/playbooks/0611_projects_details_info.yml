---
# Sample playbook for cisco.catalystcenter.projects_details_info (cisco.catalystcenter 2.15.0)
# Build order: 611
# Information module for Projects Details
# Reads ../models/projects_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/projects_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0611 projects_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/projects_details_info.yml
  tasks:
    - name: Run projects_details_info from its model
      cisco.catalystcenter.projects_details_info:
        catalystcenter_debug: "{{ projects_details_info.catalystcenter_debug if projects_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ projects_details_info.catalystcenter_host if projects_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ projects_details_info.catalystcenter_password if projects_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ projects_details_info.catalystcenter_port if projects_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ projects_details_info.catalystcenter_username if projects_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ projects_details_info.catalystcenter_verify if projects_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ projects_details_info.catalystcenter_version if projects_details_info.catalystcenter_version is not none else omit }}"
        headers: "{{ projects_details_info.headers if projects_details_info.headers is not none else omit }}"
        id: "{{ projects_details_info.id if projects_details_info.id is not none else omit }}"
        limit: "{{ projects_details_info.limit if projects_details_info.limit is not none else omit }}"
        name: "{{ projects_details_info.name if projects_details_info.name is not none else omit }}"
        offset: "{{ projects_details_info.offset if projects_details_info.offset is not none else omit }}"
        sortOrder: "{{ projects_details_info.sortOrder if projects_details_info.sortOrder is not none else omit }}"
        validate_response_schema: "{{ projects_details_info.validate_response_schema if projects_details_info.validate_response_schema is not none else omit }}"
      register: projects_details_info_result
