---
# Sample playbook for cisco.catalystcenter.sda_fabrics_vlan_to_ssids_fabric_id (cisco.catalystcenter 2.15.0)
# Build order: 837
# Resource module for Sda Fabrics Vlan To Ssids Fabric Id
# Reads ../models/sda_fabrics_vlan_to_ssids_fabric_id.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabrics_vlan_to_ssids_fabric_id_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_fabrics_vlan_to_ssids_fabric_id.

- name: "0837 sda_fabrics_vlan_to_ssids_fabric_id"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabrics_vlan_to_ssids_fabric_id.yml
  tasks:
    - name: Run sda_fabrics_vlan_to_ssids_fabric_id from its model
      cisco.catalystcenter.sda_fabrics_vlan_to_ssids_fabric_id:
        catalystcenter_debug: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_debug if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_host if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_password if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_port if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_username if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_verify if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_version if sda_fabrics_vlan_to_ssids_fabric_id.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_fabrics_vlan_to_ssids_fabric_id.fabricId if sda_fabrics_vlan_to_ssids_fabric_id.fabricId is not none else omit }}"
        payload: "{{ (sda_fabrics_vlan_to_ssids_fabric_id.payload | cat_strip_nulls) if (sda_fabrics_vlan_to_ssids_fabric_id.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_fabrics_vlan_to_ssids_fabric_id.validate_response_schema if sda_fabrics_vlan_to_ssids_fabric_id.validate_response_schema is not none else omit }}"
      register: sda_fabrics_vlan_to_ssids_fabric_id_result
      tags:
        - never
        - sda_fabrics_vlan_to_ssids_fabric_id
