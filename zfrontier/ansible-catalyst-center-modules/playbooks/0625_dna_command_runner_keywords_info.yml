---
# Sample playbook for cisco.catalystcenter.dna_command_runner_keywords_info (cisco.catalystcenter 2.15.0)
# Build order: 625
# Information module for Dna Command Runner Keywords
# Reads ../models/dna_command_runner_keywords_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dna_command_runner_keywords_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0625 dna_command_runner_keywords_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dna_command_runner_keywords_info.yml
  tasks:
    - name: Run dna_command_runner_keywords_info from its model
      cisco.catalystcenter.dna_command_runner_keywords_info:
        catalystcenter_debug: "{{ dna_command_runner_keywords_info.catalystcenter_debug if dna_command_runner_keywords_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dna_command_runner_keywords_info.catalystcenter_host if dna_command_runner_keywords_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dna_command_runner_keywords_info.catalystcenter_password if dna_command_runner_keywords_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dna_command_runner_keywords_info.catalystcenter_port if dna_command_runner_keywords_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dna_command_runner_keywords_info.catalystcenter_username if dna_command_runner_keywords_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dna_command_runner_keywords_info.catalystcenter_verify if dna_command_runner_keywords_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dna_command_runner_keywords_info.catalystcenter_version if dna_command_runner_keywords_info.catalystcenter_version is not none else omit }}"
        headers: "{{ dna_command_runner_keywords_info.headers if dna_command_runner_keywords_info.headers is not none else omit }}"
        validate_response_schema: "{{ dna_command_runner_keywords_info.validate_response_schema if dna_command_runner_keywords_info.validate_response_schema is not none else omit }}"
      register: dna_command_runner_keywords_info_result
