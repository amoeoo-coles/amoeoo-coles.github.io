---
# Sample playbook for cisco.catalystcenter.dhcp_services_query (cisco.catalystcenter 2.15.0)
# Build order: 310
# Resource module for Dhcp Services Query
# Reads ../models/dhcp_services_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dhcp_services_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dhcp_services_query.

- name: "0310 dhcp_services_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dhcp_services_query.yml
  tasks:
    - name: Run dhcp_services_query from its model
      cisco.catalystcenter.dhcp_services_query:
        catalystcenter_debug: "{{ dhcp_services_query.catalystcenter_debug if dhcp_services_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dhcp_services_query.catalystcenter_host if dhcp_services_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dhcp_services_query.catalystcenter_password if dhcp_services_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dhcp_services_query.catalystcenter_port if dhcp_services_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dhcp_services_query.catalystcenter_username if dhcp_services_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dhcp_services_query.catalystcenter_verify if dhcp_services_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dhcp_services_query.catalystcenter_version if dhcp_services_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ dhcp_services_query.endTime if dhcp_services_query.endTime is not none else omit }}"
        filters: "{{ (dhcp_services_query.filters | cat_strip_nulls) if (dhcp_services_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ dhcp_services_query.headers if dhcp_services_query.headers is not none else omit }}"
        page: "{{ (dhcp_services_query.page | cat_strip_nulls) if (dhcp_services_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ dhcp_services_query.startTime if dhcp_services_query.startTime is not none else omit }}"
        validate_response_schema: "{{ dhcp_services_query.validate_response_schema if dhcp_services_query.validate_response_schema is not none else omit }}"
      register: dhcp_services_query_result
      tags:
        - never
        - dhcp_services_query
