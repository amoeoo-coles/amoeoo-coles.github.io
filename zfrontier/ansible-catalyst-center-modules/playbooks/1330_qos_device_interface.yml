---
# Sample playbook for cisco.catalystcenter.qos_device_interface (cisco.catalystcenter 2.15.0)
# Build order: 1330
# Resource module for Qos Device Interface
# Reads ../models/qos_device_interface.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/qos_device_interface_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags qos_device_interface.

- name: "1330 qos_device_interface"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/qos_device_interface.yml
  tasks:
    - name: Run qos_device_interface from its model
      cisco.catalystcenter.qos_device_interface:
        catalystcenter_debug: "{{ qos_device_interface.catalystcenter_debug if qos_device_interface.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ qos_device_interface.catalystcenter_host if qos_device_interface.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ qos_device_interface.catalystcenter_password if qos_device_interface.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ qos_device_interface.catalystcenter_port if qos_device_interface.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ qos_device_interface.catalystcenter_username if qos_device_interface.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ qos_device_interface.catalystcenter_verify if qos_device_interface.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ qos_device_interface.catalystcenter_version if qos_device_interface.catalystcenter_version is not none else omit }}"
        id: "{{ qos_device_interface.id if qos_device_interface.id is not none else omit }}"
        payload: "{{ (qos_device_interface.payload | cat_strip_nulls) if (qos_device_interface.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ qos_device_interface.validate_response_schema if qos_device_interface.validate_response_schema is not none else omit }}"
      register: qos_device_interface_result
      tags:
        - never
        - qos_device_interface
