---
# Sample playbook for cisco.catalystcenter.access_groups_info (cisco.catalystcenter 2.15.0)
# Build order: 47
# Information module for Access Groups
# Reads ../models/access_groups_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/access_groups_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0047 access_groups_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/access_groups_info.yml
  tasks:
    - name: Run access_groups_info from its model
      cisco.catalystcenter.access_groups_info:
        catalystcenter_debug: "{{ access_groups_info.catalystcenter_debug if access_groups_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ access_groups_info.catalystcenter_host if access_groups_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ access_groups_info.catalystcenter_password if access_groups_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ access_groups_info.catalystcenter_port if access_groups_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ access_groups_info.catalystcenter_username if access_groups_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ access_groups_info.catalystcenter_verify if access_groups_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ access_groups_info.catalystcenter_version if access_groups_info.catalystcenter_version is not none else omit }}"
        headers: "{{ access_groups_info.headers if access_groups_info.headers is not none else omit }}"
        id: "{{ access_groups_info.id if access_groups_info.id is not none else omit }}"
        ids: "{{ access_groups_info.ids if access_groups_info.ids is not none else omit }}"
        limit: "{{ access_groups_info.limit if access_groups_info.limit is not none else omit }}"
        names: "{{ access_groups_info.names if access_groups_info.names is not none else omit }}"
        offset: "{{ access_groups_info.offset if access_groups_info.offset is not none else omit }}"
        sourceResourceIds: "{{ access_groups_info.sourceResourceIds if access_groups_info.sourceResourceIds is not none else omit }}"
        type: "{{ access_groups_info.type if access_groups_info.type is not none else omit }}"
        userCount: "{{ access_groups_info.userCount if access_groups_info.userCount is not none else omit }}"
        validate_response_schema: "{{ access_groups_info.validate_response_schema if access_groups_info.validate_response_schema is not none else omit }}"
      register: access_groups_info_result
