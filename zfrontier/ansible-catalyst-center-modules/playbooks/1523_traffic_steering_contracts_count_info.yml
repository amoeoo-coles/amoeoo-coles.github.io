---
# Sample playbook for cisco.catalystcenter.traffic_steering_contracts_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1523
# Information module for Traffic Steering Contracts Count
# Reads ../models/traffic_steering_contracts_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/traffic_steering_contracts_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1523 traffic_steering_contracts_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/traffic_steering_contracts_count_info.yml
  tasks:
    - name: Run traffic_steering_contracts_count_info from its model
      cisco.catalystcenter.traffic_steering_contracts_count_info:
        catalystcenter_debug: "{{ traffic_steering_contracts_count_info.catalystcenter_debug if traffic_steering_contracts_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ traffic_steering_contracts_count_info.catalystcenter_host if traffic_steering_contracts_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ traffic_steering_contracts_count_info.catalystcenter_password if traffic_steering_contracts_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ traffic_steering_contracts_count_info.catalystcenter_port if traffic_steering_contracts_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ traffic_steering_contracts_count_info.catalystcenter_username if traffic_steering_contracts_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ traffic_steering_contracts_count_info.catalystcenter_verify if traffic_steering_contracts_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ traffic_steering_contracts_count_info.catalystcenter_version if traffic_steering_contracts_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ traffic_steering_contracts_count_info.headers if traffic_steering_contracts_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ traffic_steering_contracts_count_info.validate_response_schema if traffic_steering_contracts_count_info.validate_response_schema is not none else omit }}"
      register: traffic_steering_contracts_count_info_result
