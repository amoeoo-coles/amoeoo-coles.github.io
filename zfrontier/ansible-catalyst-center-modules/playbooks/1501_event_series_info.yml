---
# Sample playbook for cisco.catalystcenter.event_series_info (cisco.catalystcenter 2.15.0)
# Build order: 1501
# Information module for Event Series
# Reads ../models/event_series_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_series_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1501 event_series_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_series_info.yml
  tasks:
    - name: Run event_series_info from its model
      cisco.catalystcenter.event_series_info:
        catalystcenter_debug: "{{ event_series_info.catalystcenter_debug if event_series_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_series_info.catalystcenter_host if event_series_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_series_info.catalystcenter_password if event_series_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_series_info.catalystcenter_port if event_series_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_series_info.catalystcenter_username if event_series_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_series_info.catalystcenter_verify if event_series_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_series_info.catalystcenter_version if event_series_info.catalystcenter_version is not none else omit }}"
        category: "{{ event_series_info.category if event_series_info.category is not none else omit }}"
        domain: "{{ event_series_info.domain if event_series_info.domain is not none else omit }}"
        endTime: "{{ event_series_info.endTime if event_series_info.endTime is not none else omit }}"
        eventIds: "{{ event_series_info.eventIds if event_series_info.eventIds is not none else omit }}"
        headers: "{{ event_series_info.headers if event_series_info.headers is not none else omit }}"
        limit: "{{ event_series_info.limit if event_series_info.limit is not none else omit }}"
        namespace: "{{ event_series_info.namespace if event_series_info.namespace is not none else omit }}"
        offset: "{{ event_series_info.offset if event_series_info.offset is not none else omit }}"
        order: "{{ event_series_info.order if event_series_info.order is not none else omit }}"
        severity: "{{ event_series_info.severity if event_series_info.severity is not none else omit }}"
        siteId: "{{ event_series_info.siteId if event_series_info.siteId is not none else omit }}"
        sortBy: "{{ event_series_info.sortBy if event_series_info.sortBy is not none else omit }}"
        source: "{{ event_series_info.source if event_series_info.source is not none else omit }}"
        startTime: "{{ event_series_info.startTime if event_series_info.startTime is not none else omit }}"
        subDomain: "{{ event_series_info.subDomain if event_series_info.subDomain is not none else omit }}"
        tags: "{{ event_series_info.tags if event_series_info.tags is not none else omit }}"
        type: "{{ event_series_info.type if event_series_info.type is not none else omit }}"
        validate_response_schema: "{{ event_series_info.validate_response_schema if event_series_info.validate_response_schema is not none else omit }}"
      register: event_series_info_result
