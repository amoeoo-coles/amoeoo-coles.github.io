        networkDeviceId: "{{ wireless_settings_network_device_id_assign_anchor_managed_ap_locations.networkDeviceId if wireless_settings_network_device_id_assign_anchor_managed_ap_locations.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_network_device_id_assign_anchor_managed_ap_locations.validate_response_schema if wireless_settings_network_device_id_assign_anchor_managed_ap_locations.validate_response_schema is not none else omit }}"
