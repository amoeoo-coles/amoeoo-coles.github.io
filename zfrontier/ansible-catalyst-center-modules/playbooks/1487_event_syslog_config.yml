---
# Sample playbook for cisco.catalystcenter.event_syslog_config (cisco.catalystcenter 2.15.0)
# Build order: 1487
# Resource module for Event Syslog Config
# Reads ../models/event_syslog_config.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_syslog_config_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_syslog_config.

- name: "1487 event_syslog_config"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_syslog_config.yml
  tasks:
    - name: Run event_syslog_config from its model
      cisco.catalystcenter.event_syslog_config:
        catalystcenter_debug: "{{ event_syslog_config.catalystcenter_debug if event_syslog_config.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_syslog_config.catalystcenter_host if event_syslog_config.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_syslog_config.catalystcenter_password if event_syslog_config.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_syslog_config.catalystcenter_port if event_syslog_config.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_syslog_config.catalystcenter_username if event_syslog_config.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_syslog_config.catalystcenter_verify if event_syslog_config.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_syslog_config.catalystcenter_version if event_syslog_config.catalystcenter_version is not none else omit }}"
        configId: "{{ event_syslog_config.configId if event_syslog_config.configId is not none else omit }}"
        description: "{{ event_syslog_config.description if event_syslog_config.description is not none else omit }}"
        host: "{{ event_syslog_config.host if event_syslog_config.host is not none else omit }}"
        name: "{{ event_syslog_config.name if event_syslog_config.name is not none else omit }}"
        port: "{{ event_syslog_config.port if event_syslog_config.port is not none else omit }}"
        protocol: "{{ event_syslog_config.protocol if event_syslog_config.protocol is not none else omit }}"
        validate_response_schema: "{{ event_syslog_config.validate_response_schema if event_syslog_config.validate_response_schema is not none else omit }}"
      register: event_syslog_config_result
      tags:
        - never
        - event_syslog_config
