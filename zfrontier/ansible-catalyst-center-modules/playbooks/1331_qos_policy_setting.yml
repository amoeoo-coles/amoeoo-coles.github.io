---
# Sample playbook for cisco.catalystcenter.qos_policy_setting (cisco.catalystcenter 2.15.0)
# Build order: 1331
# Resource module for Qos Policy Setting
# Reads ../models/qos_policy_setting.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/qos_policy_setting_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags qos_policy_setting.

- name: "1331 qos_policy_setting"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/qos_policy_setting.yml
  tasks:
    - name: Run qos_policy_setting from its model
      cisco.catalystcenter.qos_policy_setting:
        catalystcenter_debug: "{{ qos_policy_setting.catalystcenter_debug if qos_policy_setting.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ qos_policy_setting.catalystcenter_host if qos_policy_setting.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ qos_policy_setting.catalystcenter_password if qos_policy_setting.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ qos_policy_setting.catalystcenter_port if qos_policy_setting.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ qos_policy_setting.catalystcenter_username if qos_policy_setting.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ qos_policy_setting.catalystcenter_verify if qos_policy_setting.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ qos_policy_setting.catalystcenter_version if qos_policy_setting.catalystcenter_version is not none else omit }}"
        deployByDefaultOnWiredDevices: "{{ qos_policy_setting.deployByDefaultOnWiredDevices if qos_policy_setting.deployByDefaultOnWiredDevices is not none else omit }}"
        validate_response_schema: "{{ qos_policy_setting.validate_response_schema if qos_policy_setting.validate_response_schema is not none else omit }}"
      register: qos_policy_setting_result
      tags:
        - never
        - qos_policy_setting
