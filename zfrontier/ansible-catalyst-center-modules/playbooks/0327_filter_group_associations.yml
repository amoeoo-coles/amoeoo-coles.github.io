---
# Sample playbook for cisco.catalystcenter.filter_group_associations (cisco.catalystcenter 2.15.0)
# Build order: 327
# Resource module for Filter Group Associations
# Reads ../models/filter_group_associations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/filter_group_associations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags filter_group_associations.

- name: "0327 filter_group_associations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/filter_group_associations.yml
  tasks:
    - name: Run filter_group_associations from its model
      cisco.catalystcenter.filter_group_associations:
        catalystcenter_debug: "{{ filter_group_associations.catalystcenter_debug if filter_group_associations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ filter_group_associations.catalystcenter_host if filter_group_associations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ filter_group_associations.catalystcenter_password if filter_group_associations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ filter_group_associations.catalystcenter_port if filter_group_associations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ filter_group_associations.catalystcenter_username if filter_group_associations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ filter_group_associations.catalystcenter_verify if filter_group_associations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ filter_group_associations.catalystcenter_version if filter_group_associations.catalystcenter_version is not none else omit }}"
        entityId: "{{ filter_group_associations.entityId if filter_group_associations.entityId is not none else omit }}"
        entityName: "{{ filter_group_associations.entityName if filter_group_associations.entityName is not none else omit }}"
        entityType: "{{ filter_group_associations.entityType if filter_group_associations.entityType is not none else omit }}"
        filterGroupId: "{{ filter_group_associations.filterGroupId if filter_group_associations.filterGroupId is not none else omit }}"
        headers: "{{ filter_group_associations.headers if filter_group_associations.headers is not none else omit }}"
        validate_response_schema: "{{ filter_group_associations.validate_response_schema if filter_group_associations.validate_response_schema is not none else omit }}"
      register: filter_group_associations_result
      tags:
        - never
        - filter_group_associations
