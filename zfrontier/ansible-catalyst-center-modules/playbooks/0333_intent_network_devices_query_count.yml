---
# Sample playbook for cisco.catalystcenter.intent_network_devices_query_count (cisco.catalystcenter 2.15.0)
# Build order: 333
# Resource module for Intent Network Devices Query Count
# Reads ../models/intent_network_devices_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/intent_network_devices_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags intent_network_devices_query_count.

- name: "0333 intent_network_devices_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/intent_network_devices_query_count.yml
  tasks:
    - name: Run intent_network_devices_query_count from its model
      cisco.catalystcenter.intent_network_devices_query_count:
        catalystcenter_debug: "{{ intent_network_devices_query_count.catalystcenter_debug if intent_network_devices_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ intent_network_devices_query_count.catalystcenter_host if intent_network_devices_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ intent_network_devices_query_count.catalystcenter_password if intent_network_devices_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ intent_network_devices_query_count.catalystcenter_port if intent_network_devices_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ intent_network_devices_query_count.catalystcenter_username if intent_network_devices_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ intent_network_devices_query_count.catalystcenter_verify if intent_network_devices_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ intent_network_devices_query_count.catalystcenter_version if intent_network_devices_query_count.catalystcenter_version is not none else omit }}"
        filter: "{{ (intent_network_devices_query_count.filter | cat_strip_nulls) if (intent_network_devices_query_count.filter | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ intent_network_devices_query_count.validate_response_schema if intent_network_devices_query_count.validate_response_schema is not none else omit }}"
      register: intent_network_devices_query_count_result
      tags:
        - never
        - intent_network_devices_query_count
