---
# Sample playbook for cisco.catalystcenter.dhcp_services_summary_analytics (cisco.catalystcenter 2.15.0)
# Build order: 312
# Resource module for Dhcp Services Summary Analytics
# Reads ../models/dhcp_services_summary_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dhcp_services_summary_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dhcp_services_summary_analytics.

- name: "0312 dhcp_services_summary_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dhcp_services_summary_analytics.yml
  tasks:
    - name: Run dhcp_services_summary_analytics from its model
      cisco.catalystcenter.dhcp_services_summary_analytics:
        aggregateAttributes: "{{ (dhcp_services_summary_analytics.aggregateAttributes | cat_strip_nulls) if (dhcp_services_summary_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (dhcp_services_summary_analytics.attributes | cat_strip_nulls) if (dhcp_services_summary_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ dhcp_services_summary_analytics.catalystcenter_debug if dhcp_services_summary_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dhcp_services_summary_analytics.catalystcenter_host if dhcp_services_summary_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dhcp_services_summary_analytics.catalystcenter_password if dhcp_services_summary_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dhcp_services_summary_analytics.catalystcenter_port if dhcp_services_summary_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dhcp_services_summary_analytics.catalystcenter_username if dhcp_services_summary_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dhcp_services_summary_analytics.catalystcenter_verify if dhcp_services_summary_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dhcp_services_summary_analytics.catalystcenter_version if dhcp_services_summary_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ dhcp_services_summary_analytics.endTime if dhcp_services_summary_analytics.endTime is not none else omit }}"
        filters: "{{ (dhcp_services_summary_analytics.filters | cat_strip_nulls) if (dhcp_services_summary_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (dhcp_services_summary_analytics.groupBy | cat_strip_nulls) if (dhcp_services_summary_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        headers: "{{ dhcp_services_summary_analytics.headers if dhcp_services_summary_analytics.headers is not none else omit }}"
        page: "{{ (dhcp_services_summary_analytics.page | cat_strip_nulls) if (dhcp_services_summary_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ dhcp_services_summary_analytics.startTime if dhcp_services_summary_analytics.startTime is not none else omit }}"
        validate_response_schema: "{{ dhcp_services_summary_analytics.validate_response_schema if dhcp_services_summary_analytics.validate_response_schema is not none else omit }}"
      register: dhcp_services_summary_analytics_result
      tags:
        - never
        - dhcp_services_summary_analytics
