---
# Sample playbook for cisco.catalystcenter.product_names_info (cisco.catalystcenter 2.15.0)
# Build order: 581
# Information module for Product Names
# Reads ../models/product_names_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/product_names_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0581 product_names_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/product_names_info.yml
  tasks:
    - name: Run product_names_info from its model
      cisco.catalystcenter.product_names_info:
        catalystcenter_debug: "{{ product_names_info.catalystcenter_debug if product_names_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ product_names_info.catalystcenter_host if product_names_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ product_names_info.catalystcenter_password if product_names_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ product_names_info.catalystcenter_port if product_names_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ product_names_info.catalystcenter_username if product_names_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ product_names_info.catalystcenter_verify if product_names_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ product_names_info.catalystcenter_version if product_names_info.catalystcenter_version is not none else omit }}"
        headers: "{{ product_names_info.headers if product_names_info.headers is not none else omit }}"
        limit: "{{ product_names_info.limit if product_names_info.limit is not none else omit }}"
        offset: "{{ product_names_info.offset if product_names_info.offset is not none else omit }}"
        productId: "{{ product_names_info.productId if product_names_info.productId is not none else omit }}"
        productName: "{{ product_names_info.productName if product_names_info.productName is not none else omit }}"
        productNameOrdinal: "{{ product_names_info.productNameOrdinal if product_names_info.productNameOrdinal is not none else omit }}"
        validate_response_schema: "{{ product_names_info.validate_response_schema if product_names_info.validate_response_schema is not none else omit }}"
      register: product_names_info_result
