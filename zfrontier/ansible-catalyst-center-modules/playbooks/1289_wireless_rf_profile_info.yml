---
# Sample playbook for cisco.catalystcenter.wireless_rf_profile_info (cisco.catalystcenter 2.15.0)
# Build order: 1289
# Information module for Wireless Rf Profile
# Reads ../models/wireless_rf_profile_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_rf_profile_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1289 wireless_rf_profile_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_rf_profile_info.yml
  tasks:
    - name: Run wireless_rf_profile_info from its model
      cisco.catalystcenter.wireless_rf_profile_info:
        catalystcenter_debug: "{{ wireless_rf_profile_info.catalystcenter_debug if wireless_rf_profile_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_rf_profile_info.catalystcenter_host if wireless_rf_profile_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_rf_profile_info.catalystcenter_password if wireless_rf_profile_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_rf_profile_info.catalystcenter_port if wireless_rf_profile_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_rf_profile_info.catalystcenter_username if wireless_rf_profile_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_rf_profile_info.catalystcenter_verify if wireless_rf_profile_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_rf_profile_info.catalystcenter_version if wireless_rf_profile_info.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_rf_profile_info.headers if wireless_rf_profile_info.headers is not none else omit }}"
        rf_profile_name: "{{ wireless_rf_profile_info.rf_profile_name if wireless_rf_profile_info.rf_profile_name is not none else omit }}"
        validate_response_schema: "{{ wireless_rf_profile_info.validate_response_schema if wireless_rf_profile_info.validate_response_schema is not none else omit }}"
      register: wireless_rf_profile_info_result
