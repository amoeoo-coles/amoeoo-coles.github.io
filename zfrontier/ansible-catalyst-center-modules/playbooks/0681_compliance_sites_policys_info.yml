---
# Sample playbook for cisco.catalystcenter.compliance_sites_policys_info (cisco.catalystcenter 2.15.0)
# Build order: 681
# Information module for Compliance Sites Policys
# Reads ../models/compliance_sites_policys_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_sites_policys_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0681 compliance_sites_policys_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_sites_policys_info.yml
  tasks:
    - name: Run compliance_sites_policys_info from its model
      cisco.catalystcenter.compliance_sites_policys_info:
        catalystcenter_debug: "{{ compliance_sites_policys_info.catalystcenter_debug if compliance_sites_policys_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_sites_policys_info.catalystcenter_host if compliance_sites_policys_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_sites_policys_info.catalystcenter_password if compliance_sites_policys_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_sites_policys_info.catalystcenter_port if compliance_sites_policys_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_sites_policys_info.catalystcenter_username if compliance_sites_policys_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_sites_policys_info.catalystcenter_verify if compliance_sites_policys_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_sites_policys_info.catalystcenter_version if compliance_sites_policys_info.catalystcenter_version is not none else omit }}"
        headers: "{{ compliance_sites_policys_info.headers if compliance_sites_policys_info.headers is not none else omit }}"
        limit: "{{ compliance_sites_policys_info.limit if compliance_sites_policys_info.limit is not none else omit }}"
        offset: "{{ compliance_sites_policys_info.offset if compliance_sites_policys_info.offset is not none else omit }}"
        order: "{{ compliance_sites_policys_info.order if compliance_sites_policys_info.order is not none else omit }}"
        policyId: "{{ compliance_sites_policys_info.policyId if compliance_sites_policys_info.policyId is not none else omit }}"
        policyName: "{{ compliance_sites_policys_info.policyName if compliance_sites_policys_info.policyName is not none else omit }}"
        siteId: "{{ compliance_sites_policys_info.siteId if compliance_sites_policys_info.siteId is not none else omit }}"
        sortBy: "{{ compliance_sites_policys_info.sortBy if compliance_sites_policys_info.sortBy is not none else omit }}"
        status: "{{ (compliance_sites_policys_info.status | cat_strip_nulls) if (compliance_sites_policys_info.status | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ compliance_sites_policys_info.validate_response_schema if compliance_sites_policys_info.validate_response_schema is not none else omit }}"
      register: compliance_sites_policys_info_result
