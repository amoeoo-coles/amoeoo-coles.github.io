---
# Sample playbook for cisco.catalystcenter.business_sda_wireless_controller_delete (cisco.catalystcenter 2.15.0)
# Build order: 833
# Resource module for Business Sda Wireless Controller Delete
# Reads ../models/business_sda_wireless_controller_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/business_sda_wireless_controller_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags business_sda_wireless_controller_delete.

- name: "0833 business_sda_wireless_controller_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/business_sda_wireless_controller_delete.yml
  tasks:
    - name: Run business_sda_wireless_controller_delete from its model
      cisco.catalystcenter.business_sda_wireless_controller_delete:
        catalystcenter_debug: "{{ business_sda_wireless_controller_delete.catalystcenter_debug if business_sda_wireless_controller_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ business_sda_wireless_controller_delete.catalystcenter_host if business_sda_wireless_controller_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ business_sda_wireless_controller_delete.catalystcenter_password if business_sda_wireless_controller_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ business_sda_wireless_controller_delete.catalystcenter_port if business_sda_wireless_controller_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ business_sda_wireless_controller_delete.catalystcenter_username if business_sda_wireless_controller_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ business_sda_wireless_controller_delete.catalystcenter_verify if business_sda_wireless_controller_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ business_sda_wireless_controller_delete.catalystcenter_version if business_sda_wireless_controller_delete.catalystcenter_version is not none else omit }}"
        deviceIPAddress: "{{ business_sda_wireless_controller_delete.deviceIPAddress if business_sda_wireless_controller_delete.deviceIPAddress is not none else omit }}"
        headers: "{{ business_sda_wireless_controller_delete.headers if business_sda_wireless_controller_delete.headers is not none else omit }}"
        validate_response_schema: "{{ business_sda_wireless_controller_delete.validate_response_schema if business_sda_wireless_controller_delete.validate_response_schema is not none else omit }}"
      register: business_sda_wireless_controller_delete_result
      tags:
        - never
        - business_sda_wireless_controller_delete
