---
# Sample playbook for cisco.catalystcenter.associate_site_to_network_profile (cisco.catalystcenter 2.15.0)
# Build order: 146
# Resource module for Associate Site To Network Profile
# Reads ../models/associate_site_to_network_profile.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/associate_site_to_network_profile_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags associate_site_to_network_profile.

- name: "0146 associate_site_to_network_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/associate_site_to_network_profile.yml
  tasks:
    - name: Run associate_site_to_network_profile from its model
      cisco.catalystcenter.associate_site_to_network_profile:
        catalystcenter_debug: "{{ associate_site_to_network_profile.catalystcenter_debug if associate_site_to_network_profile.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ associate_site_to_network_profile.catalystcenter_host if associate_site_to_network_profile.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ associate_site_to_network_profile.catalystcenter_password if associate_site_to_network_profile.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ associate_site_to_network_profile.catalystcenter_port if associate_site_to_network_profile.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ associate_site_to_network_profile.catalystcenter_username if associate_site_to_network_profile.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ associate_site_to_network_profile.catalystcenter_verify if associate_site_to_network_profile.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ associate_site_to_network_profile.catalystcenter_version if associate_site_to_network_profile.catalystcenter_version is not none else omit }}"
        networkProfileId: "{{ associate_site_to_network_profile.networkProfileId if associate_site_to_network_profile.networkProfileId is not none else omit }}"
        siteId: "{{ associate_site_to_network_profile.siteId if associate_site_to_network_profile.siteId is not none else omit }}"
        validate_response_schema: "{{ associate_site_to_network_profile.validate_response_schema if associate_site_to_network_profile.validate_response_schema is not none else omit }}"
      register: associate_site_to_network_profile_result
      tags:
        - never
        - associate_site_to_network_profile
