---
# Sample playbook for cisco.catalystcenter.energy_sites_query_count (cisco.catalystcenter 2.15.0)
# Build order: 107
# Resource module for Energy Sites Query Count
# Reads ../models/energy_sites_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_sites_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags energy_sites_query_count.

- name: "0107 energy_sites_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_sites_query_count.yml
  tasks:
    - name: Run energy_sites_query_count from its model
      cisco.catalystcenter.energy_sites_query_count:
        aggregateAttributes: "{{ (energy_sites_query_count.aggregateAttributes | cat_strip_nulls) if (energy_sites_query_count.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (energy_sites_query_count.attributes | cat_strip_nulls) if (energy_sites_query_count.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ energy_sites_query_count.catalystcenter_debug if energy_sites_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_sites_query_count.catalystcenter_host if energy_sites_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_sites_query_count.catalystcenter_password if energy_sites_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_sites_query_count.catalystcenter_port if energy_sites_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_sites_query_count.catalystcenter_username if energy_sites_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_sites_query_count.catalystcenter_verify if energy_sites_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_sites_query_count.catalystcenter_version if energy_sites_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ energy_sites_query_count.endTime if energy_sites_query_count.endTime is not none else omit }}"
        filters: "{{ (energy_sites_query_count.filters | cat_strip_nulls) if (energy_sites_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ energy_sites_query_count.headers if energy_sites_query_count.headers is not none else omit }}"
        page: "{{ (energy_sites_query_count.page | cat_strip_nulls) if (energy_sites_query_count.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ energy_sites_query_count.startTime if energy_sites_query_count.startTime is not none else omit }}"
        taskId: "{{ energy_sites_query_count.taskId if energy_sites_query_count.taskId is not none else omit }}"
        validate_response_schema: "{{ energy_sites_query_count.validate_response_schema if energy_sites_query_count.validate_response_schema is not none else omit }}"
        views: "{{ (energy_sites_query_count.views | cat_strip_nulls) if (energy_sites_query_count.views | cat_strip_nulls) is not none else omit }}"
      register: energy_sites_query_count_result
      tags:
        - never
        - energy_sites_query_count
