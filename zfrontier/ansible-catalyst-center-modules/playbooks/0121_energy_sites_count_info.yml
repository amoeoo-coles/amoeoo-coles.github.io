---
# Sample playbook for cisco.catalystcenter.energy_sites_count_info (cisco.catalystcenter 2.15.0)
# Build order: 121
# Information module for Energy Sites Count
# Reads ../models/energy_sites_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_sites_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0121 energy_sites_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_sites_count_info.yml
  tasks:
    - name: Run energy_sites_count_info from its model
      cisco.catalystcenter.energy_sites_count_info:
        catalystcenter_debug: "{{ energy_sites_count_info.catalystcenter_debug if energy_sites_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_sites_count_info.catalystcenter_host if energy_sites_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_sites_count_info.catalystcenter_password if energy_sites_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_sites_count_info.catalystcenter_port if energy_sites_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_sites_count_info.catalystcenter_username if energy_sites_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_sites_count_info.catalystcenter_verify if energy_sites_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_sites_count_info.catalystcenter_version if energy_sites_count_info.catalystcenter_version is not none else omit }}"
        deviceCategory: "{{ energy_sites_count_info.deviceCategory if energy_sites_count_info.deviceCategory is not none else omit }}"
        endTime: "{{ energy_sites_count_info.endTime if energy_sites_count_info.endTime is not none else omit }}"
        headers: "{{ energy_sites_count_info.headers if energy_sites_count_info.headers is not none else omit }}"
        siteHierarchy: "{{ energy_sites_count_info.siteHierarchy if energy_sites_count_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ energy_sites_count_info.siteHierarchyId if energy_sites_count_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ energy_sites_count_info.siteId if energy_sites_count_info.siteId is not none else omit }}"
        siteName: "{{ energy_sites_count_info.siteName if energy_sites_count_info.siteName is not none else omit }}"
        siteType: "{{ energy_sites_count_info.siteType if energy_sites_count_info.siteType is not none else omit }}"
        startTime: "{{ energy_sites_count_info.startTime if energy_sites_count_info.startTime is not none else omit }}"
        taskId: "{{ energy_sites_count_info.taskId if energy_sites_count_info.taskId is not none else omit }}"
        validate_response_schema: "{{ energy_sites_count_info.validate_response_schema if energy_sites_count_info.validate_response_schema is not none else omit }}"
      register: energy_sites_count_info_result
