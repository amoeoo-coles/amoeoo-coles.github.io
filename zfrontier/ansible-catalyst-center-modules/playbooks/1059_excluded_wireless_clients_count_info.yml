---
# Sample playbook for cisco.catalystcenter.excluded_wireless_clients_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1059
# Information module for Excluded Wireless Clients Count
# Reads ../models/excluded_wireless_clients_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/excluded_wireless_clients_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1059 excluded_wireless_clients_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/excluded_wireless_clients_count_info.yml
  tasks:
    - name: Run excluded_wireless_clients_count_info from its model
      cisco.catalystcenter.excluded_wireless_clients_count_info:
        catalystcenter_debug: "{{ excluded_wireless_clients_count_info.catalystcenter_debug if excluded_wireless_clients_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ excluded_wireless_clients_count_info.catalystcenter_host if excluded_wireless_clients_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ excluded_wireless_clients_count_info.catalystcenter_password if excluded_wireless_clients_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ excluded_wireless_clients_count_info.catalystcenter_port if excluded_wireless_clients_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ excluded_wireless_clients_count_info.catalystcenter_username if excluded_wireless_clients_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ excluded_wireless_clients_count_info.catalystcenter_verify if excluded_wireless_clients_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ excluded_wireless_clients_count_info.catalystcenter_version if excluded_wireless_clients_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ excluded_wireless_clients_count_info.headers if excluded_wireless_clients_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ excluded_wireless_clients_count_info.validate_response_schema if excluded_wireless_clients_count_info.validate_response_schema is not none else omit }}"
      register: excluded_wireless_clients_count_info_result
