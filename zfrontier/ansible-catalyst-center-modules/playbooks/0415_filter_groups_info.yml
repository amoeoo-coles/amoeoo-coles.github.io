---
# Sample playbook for cisco.catalystcenter.filter_groups_info (cisco.catalystcenter 2.15.0)
# Build order: 415
# Information module for Filter Groups
# Reads ../models/filter_groups_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/filter_groups_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0415 filter_groups_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/filter_groups_info.yml
  tasks:
    - name: Run filter_groups_info from its model
      cisco.catalystcenter.filter_groups_info:
        catalystcenter_debug: "{{ filter_groups_info.catalystcenter_debug if filter_groups_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ filter_groups_info.catalystcenter_host if filter_groups_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ filter_groups_info.catalystcenter_password if filter_groups_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ filter_groups_info.catalystcenter_port if filter_groups_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ filter_groups_info.catalystcenter_username if filter_groups_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ filter_groups_info.catalystcenter_verify if filter_groups_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ filter_groups_info.catalystcenter_version if filter_groups_info.catalystcenter_version is not none else omit }}"
        headers: "{{ filter_groups_info.headers if filter_groups_info.headers is not none else omit }}"
        id: "{{ (filter_groups_info.id | cat_strip_nulls) if (filter_groups_info.id | cat_strip_nulls) is not none else omit }}"
        limit: "{{ filter_groups_info.limit if filter_groups_info.limit is not none else omit }}"
        name: "{{ (filter_groups_info.name | cat_strip_nulls) if (filter_groups_info.name | cat_strip_nulls) is not none else omit }}"
        offset: "{{ filter_groups_info.offset if filter_groups_info.offset is not none else omit }}"
        type: "{{ (filter_groups_info.type | cat_strip_nulls) if (filter_groups_info.type | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ filter_groups_info.validate_response_schema if filter_groups_info.validate_response_schema is not none else omit }}"
      register: filter_groups_info_result
