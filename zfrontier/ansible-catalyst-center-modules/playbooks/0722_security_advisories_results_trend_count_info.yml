---
# Sample playbook for cisco.catalystcenter.security_advisories_results_trend_count_info (cisco.catalystcenter 2.15.0)
# Build order: 722
# Information module for Security Advisories Results Trend Count
# Reads ../models/security_advisories_results_trend_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_advisories_results_trend_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0722 security_advisories_results_trend_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_advisories_results_trend_count_info.yml
  tasks:
    - name: Run security_advisories_results_trend_count_info from its model
      cisco.catalystcenter.security_advisories_results_trend_count_info:
        catalystcenter_debug: "{{ security_advisories_results_trend_count_info.catalystcenter_debug if security_advisories_results_trend_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_advisories_results_trend_count_info.catalystcenter_host if security_advisories_results_trend_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_advisories_results_trend_count_info.catalystcenter_password if security_advisories_results_trend_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_advisories_results_trend_count_info.catalystcenter_port if security_advisories_results_trend_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_advisories_results_trend_count_info.catalystcenter_username if security_advisories_results_trend_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_advisories_results_trend_count_info.catalystcenter_verify if security_advisories_results_trend_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_advisories_results_trend_count_info.catalystcenter_version if security_advisories_results_trend_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ security_advisories_results_trend_count_info.headers if security_advisories_results_trend_count_info.headers is not none else omit }}"
        scanTime: "{{ security_advisories_results_trend_count_info.scanTime if security_advisories_results_trend_count_info.scanTime is not none else omit }}"
        validate_response_schema: "{{ security_advisories_results_trend_count_info.validate_response_schema if security_advisories_results_trend_count_info.validate_response_schema is not none else omit }}"
      register: security_advisories_results_trend_count_info_result
