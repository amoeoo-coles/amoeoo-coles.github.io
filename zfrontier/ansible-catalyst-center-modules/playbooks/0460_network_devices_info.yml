        transitNetworkId: "{{ network_devices_info.transitNetworkId if network_devices_info.transitNetworkId is not none else omit }}"
        type: "{{ network_devices_info.type if network_devices_info.type is not none else omit }}"
        validate_response_schema: "{{ network_devices_info.validate_response_schema if network_devices_info.validate_response_schema is not none else omit }}"
        view: "{{ network_devices_info.view if network_devices_info.view is not none else omit }}"
      register: network_devices_info_result
