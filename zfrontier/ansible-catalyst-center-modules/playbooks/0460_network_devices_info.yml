---
# Sample playbook for cisco.catalystcenter.network_devices_info (cisco.catalystcenter 2.15.0)
# Build order: 460
# Information module for Network Devices
# Reads ../models/network_devices_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0460 network_devices_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_info.yml
  tasks:
    - name: Run network_devices_info from its model
      cisco.catalystcenter.network_devices_info:
        attribute: "{{ network_devices_info.attribute if network_devices_info.attribute is not none else omit }}"
        catalystcenter_debug: "{{ network_devices_info.catalystcenter_debug if network_devices_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_info.catalystcenter_host if network_devices_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_info.catalystcenter_password if network_devices_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_info.catalystcenter_port if network_devices_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_info.catalystcenter_username if network_devices_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_info.catalystcenter_verify if network_devices_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_info.catalystcenter_version if network_devices_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ network_devices_info.endTime if network_devices_info.endTime is not none else omit }}"
        fabricRole: "{{ network_devices_info.fabricRole if network_devices_info.fabricRole is not none else omit }}"
        fabricSiteId: "{{ network_devices_info.fabricSiteId if network_devices_info.fabricSiteId is not none else omit }}"
        family: "{{ network_devices_info.family if network_devices_info.family is not none else omit }}"
        headers: "{{ network_devices_info.headers if network_devices_info.headers is not none else omit }}"
        healthScore: "{{ network_devices_info.healthScore if network_devices_info.healthScore is not none else omit }}"
        id: "{{ network_devices_info.id if network_devices_info.id is not none else omit }}"
        l2Vn: "{{ network_devices_info.l2Vn if network_devices_info.l2Vn is not none else omit }}"
        l3Vn: "{{ network_devices_info.l3Vn if network_devices_info.l3Vn is not none else omit }}"
        limit: "{{ network_devices_info.limit if network_devices_info.limit is not none else omit }}"
        macAddress: "{{ network_devices_info.macAddress if network_devices_info.macAddress is not none else omit }}"
        maintenanceMode: "{{ network_devices_info.maintenanceMode if network_devices_info.maintenanceMode is not none else omit }}"
        managementIpAddress: "{{ network_devices_info.managementIpAddress if network_devices_info.managementIpAddress is not none else omit }}"
        offset: "{{ network_devices_info.offset if network_devices_info.offset is not none else omit }}"
        order: "{{ network_devices_info.order if network_devices_info.order is not none else omit }}"
        role: "{{ network_devices_info.role if network_devices_info.role is not none else omit }}"
        secureMode: "{{ network_devices_info.secureMode if network_devices_info.secureMode is not none else omit }}"
        serialNumber: "{{ network_devices_info.serialNumber if network_devices_info.serialNumber is not none else omit }}"
        siteHierarchy: "{{ network_devices_info.siteHierarchy if network_devices_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ network_devices_info.siteHierarchyId if network_devices_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ network_devices_info.siteId if network_devices_info.siteId is not none else omit }}"
        softwareVersion: "{{ network_devices_info.softwareVersion if network_devices_info.softwareVersion is not none else omit }}"
        sortBy: "{{ network_devices_info.sortBy if network_devices_info.sortBy is not none else omit }}"
