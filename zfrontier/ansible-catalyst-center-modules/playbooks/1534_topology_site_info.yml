---
# Sample playbook for cisco.catalystcenter.topology_site_info (cisco.catalystcenter 2.15.0)
# Build order: 1534
# Information module for Topology Site
# Reads ../models/topology_site_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/topology_site_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1534 topology_site_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/topology_site_info.yml
  tasks:
    - name: Run topology_site_info from its model
      cisco.catalystcenter.topology_site_info:
        catalystcenter_debug: "{{ topology_site_info.catalystcenter_debug if topology_site_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ topology_site_info.catalystcenter_host if topology_site_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ topology_site_info.catalystcenter_password if topology_site_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ topology_site_info.catalystcenter_port if topology_site_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ topology_site_info.catalystcenter_username if topology_site_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ topology_site_info.catalystcenter_verify if topology_site_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ topology_site_info.catalystcenter_version if topology_site_info.catalystcenter_version is not none else omit }}"
        headers: "{{ topology_site_info.headers if topology_site_info.headers is not none else omit }}"
        validate_response_schema: "{{ topology_site_info.validate_response_schema if topology_site_info.validate_response_schema is not none else omit }}"
      register: topology_site_info_result
