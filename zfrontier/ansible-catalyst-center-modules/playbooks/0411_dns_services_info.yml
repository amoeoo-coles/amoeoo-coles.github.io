---
# Sample playbook for cisco.catalystcenter.dns_services_info (cisco.catalystcenter 2.15.0)
# Build order: 411
# Information module for Dns Services
# Reads ../models/dns_services_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dns_services_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0411 dns_services_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dns_services_info.yml
  tasks:
    - name: Run dns_services_info from its model
      cisco.catalystcenter.dns_services_info:
        catalystcenter_debug: "{{ dns_services_info.catalystcenter_debug if dns_services_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dns_services_info.catalystcenter_host if dns_services_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dns_services_info.catalystcenter_password if dns_services_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dns_services_info.catalystcenter_port if dns_services_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dns_services_info.catalystcenter_username if dns_services_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dns_services_info.catalystcenter_verify if dns_services_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dns_services_info.catalystcenter_version if dns_services_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ dns_services_info.deviceId if dns_services_info.deviceId is not none else omit }}"
        deviceSiteHierarchyId: "{{ dns_services_info.deviceSiteHierarchyId if dns_services_info.deviceSiteHierarchyId is not none else omit }}"
        deviceSiteId: "{{ dns_services_info.deviceSiteId if dns_services_info.deviceSiteId is not none else omit }}"
        endTime: "{{ dns_services_info.endTime if dns_services_info.endTime is not none else omit }}"
        headers: "{{ dns_services_info.headers if dns_services_info.headers is not none else omit }}"
        id: "{{ dns_services_info.id if dns_services_info.id is not none else omit }}"
        limit: "{{ dns_services_info.limit if dns_services_info.limit is not none else omit }}"
        offset: "{{ dns_services_info.offset if dns_services_info.offset is not none else omit }}"
        order: "{{ dns_services_info.order if dns_services_info.order is not none else omit }}"
        serverIp: "{{ dns_services_info.serverIp if dns_services_info.serverIp is not none else omit }}"
        sortBy: "{{ dns_services_info.sortBy if dns_services_info.sortBy is not none else omit }}"
        ssid: "{{ dns_services_info.ssid if dns_services_info.ssid is not none else omit }}"
        startTime: "{{ dns_services_info.startTime if dns_services_info.startTime is not none else omit }}"
        validate_response_schema: "{{ dns_services_info.validate_response_schema if dns_services_info.validate_response_schema is not none else omit }}"
      register: dns_services_info_result
