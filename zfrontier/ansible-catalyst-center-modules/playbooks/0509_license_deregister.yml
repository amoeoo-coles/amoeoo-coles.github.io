---
# Sample playbook for cisco.catalystcenter.license_deregister (cisco.catalystcenter 2.15.0)
# Build order: 509
# Resource module for License Deregister
# Reads ../models/license_deregister.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/license_deregister_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags license_deregister.

- name: "0509 license_deregister"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/license_deregister.yml
  tasks:
    - name: Run license_deregister from its model
      cisco.catalystcenter.license_deregister:
        catalystcenter_debug: "{{ license_deregister.catalystcenter_debug if license_deregister.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ license_deregister.catalystcenter_host if license_deregister.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ license_deregister.catalystcenter_password if license_deregister.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ license_deregister.catalystcenter_port if license_deregister.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ license_deregister.catalystcenter_username if license_deregister.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ license_deregister.catalystcenter_verify if license_deregister.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ license_deregister.catalystcenter_version if license_deregister.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ license_deregister.validate_response_schema if license_deregister.validate_response_schema is not none else omit }}"
      register: license_deregister_result
      tags:
        - never
        - license_deregister
