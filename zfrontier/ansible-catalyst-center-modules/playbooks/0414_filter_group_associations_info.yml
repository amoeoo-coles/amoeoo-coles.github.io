---
# Sample playbook for cisco.catalystcenter.filter_group_associations_info (cisco.catalystcenter 2.15.0)
# Build order: 414
# Information module for Filter Group Associations
# Reads ../models/filter_group_associations_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/filter_group_associations_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0414 filter_group_associations_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/filter_group_associations_info.yml
  tasks:
    - name: Run filter_group_associations_info from its model
      cisco.catalystcenter.filter_group_associations_info:
        catalystcenter_debug: "{{ filter_group_associations_info.catalystcenter_debug if filter_group_associations_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ filter_group_associations_info.catalystcenter_host if filter_group_associations_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ filter_group_associations_info.catalystcenter_password if filter_group_associations_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ filter_group_associations_info.catalystcenter_port if filter_group_associations_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ filter_group_associations_info.catalystcenter_username if filter_group_associations_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ filter_group_associations_info.catalystcenter_verify if filter_group_associations_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ filter_group_associations_info.catalystcenter_version if filter_group_associations_info.catalystcenter_version is not none else omit }}"
        entityId: "{{ (filter_group_associations_info.entityId | cat_strip_nulls) if (filter_group_associations_info.entityId | cat_strip_nulls) is not none else omit }}"
        entityType: "{{ (filter_group_associations_info.entityType | cat_strip_nulls) if (filter_group_associations_info.entityType | cat_strip_nulls) is not none else omit }}"
        filterGroupId: "{{ (filter_group_associations_info.filterGroupId | cat_strip_nulls) if (filter_group_associations_info.filterGroupId | cat_strip_nulls) is not none else omit }}"
        headers: "{{ filter_group_associations_info.headers if filter_group_associations_info.headers is not none else omit }}"
        validate_response_schema: "{{ filter_group_associations_info.validate_response_schema if filter_group_associations_info.validate_response_schema is not none else omit }}"
      register: filter_group_associations_info_result
