---
# Sample playbook for cisco.catalystcenter.platform_nodes_configuration_summary_info (cisco.catalystcenter 2.15.0)
# Build order: 67
# Information module for Platform Nodes Configuration Summary
# Reads ../models/platform_nodes_configuration_summary_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/platform_nodes_configuration_summary_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0067 platform_nodes_configuration_summary_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/platform_nodes_configuration_summary_info.yml
  tasks:
    - name: Run platform_nodes_configuration_summary_info from its model
      cisco.catalystcenter.platform_nodes_configuration_summary_info:
        catalystcenter_debug: "{{ platform_nodes_configuration_summary_info.catalystcenter_debug if platform_nodes_configuration_summary_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ platform_nodes_configuration_summary_info.catalystcenter_host if platform_nodes_configuration_summary_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ platform_nodes_configuration_summary_info.catalystcenter_password if platform_nodes_configuration_summary_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ platform_nodes_configuration_summary_info.catalystcenter_port if platform_nodes_configuration_summary_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ platform_nodes_configuration_summary_info.catalystcenter_username if platform_nodes_configuration_summary_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ platform_nodes_configuration_summary_info.catalystcenter_verify if platform_nodes_configuration_summary_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ platform_nodes_configuration_summary_info.catalystcenter_version if platform_nodes_configuration_summary_info.catalystcenter_version is not none else omit }}"
        headers: "{{ platform_nodes_configuration_summary_info.headers if platform_nodes_configuration_summary_info.headers is not none else omit }}"
        validate_response_schema: "{{ platform_nodes_configuration_summary_info.validate_response_schema if platform_nodes_configuration_summary_info.validate_response_schema is not none else omit }}"
      register: platform_nodes_configuration_summary_info_result
