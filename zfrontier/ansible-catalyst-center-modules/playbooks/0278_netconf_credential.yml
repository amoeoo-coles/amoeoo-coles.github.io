---
# Sample playbook for cisco.catalystcenter.netconf_credential (cisco.catalystcenter 2.15.0)
# Build order: 278
# Resource module for Netconf Credential
# Reads ../models/netconf_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/netconf_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags netconf_credential.

- name: "0278 netconf_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/netconf_credential.yml
  tasks:
    - name: Run netconf_credential from its model
      cisco.catalystcenter.netconf_credential:
        catalystcenter_debug: "{{ netconf_credential.catalystcenter_debug if netconf_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ netconf_credential.catalystcenter_host if netconf_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ netconf_credential.catalystcenter_password if netconf_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ netconf_credential.catalystcenter_port if netconf_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ netconf_credential.catalystcenter_username if netconf_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ netconf_credential.catalystcenter_verify if netconf_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ netconf_credential.catalystcenter_version if netconf_credential.catalystcenter_version is not none else omit }}"
        comments: "{{ netconf_credential.comments if netconf_credential.comments is not none else omit }}"
        credentialType: "{{ netconf_credential.credentialType if netconf_credential.credentialType is not none else omit }}"
        description: "{{ netconf_credential.description if netconf_credential.description is not none else omit }}"
        id: "{{ netconf_credential.id if netconf_credential.id is not none else omit }}"
        instanceTenantId: "{{ netconf_credential.instanceTenantId if netconf_credential.instanceTenantId is not none else omit }}"
        instanceUuid: "{{ netconf_credential.instanceUuid if netconf_credential.instanceUuid is not none else omit }}"
        netconfPort: "{{ netconf_credential.netconfPort if netconf_credential.netconfPort is not none else omit }}"
        validate_response_schema: "{{ netconf_credential.validate_response_schema if netconf_credential.validate_response_schema is not none else omit }}"
      register: netconf_credential_result
      tags:
        - never
        - netconf_credential
