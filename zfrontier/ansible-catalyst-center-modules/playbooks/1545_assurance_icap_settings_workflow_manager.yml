---
# Sample playbook for cisco.catalystcenter.assurance_icap_settings_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 1545
# Configure and manage ICAP (Intelligent Capture) settings in Cisco Catalyst Center for network assurance.
# Reads ../models/assurance_icap_settings_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_icap_settings_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assurance_icap_settings_workflow_manager.

- name: "1545 assurance_icap_settings_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_icap_settings_workflow_manager.yml
  tasks:
    - name: Run assurance_icap_settings_workflow_manager from its model
      cisco.catalystcenter.assurance_icap_settings_workflow_manager:
        catalystcenter_api_task_timeout: "{{ assurance_icap_settings_workflow_manager.catalystcenter_api_task_timeout if assurance_icap_settings_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ assurance_icap_settings_workflow_manager.catalystcenter_debug if assurance_icap_settings_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_icap_settings_workflow_manager.catalystcenter_host if assurance_icap_settings_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ assurance_icap_settings_workflow_manager.catalystcenter_log if assurance_icap_settings_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ assurance_icap_settings_workflow_manager.catalystcenter_log_append if assurance_icap_settings_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ assurance_icap_settings_workflow_manager.catalystcenter_log_file_path if assurance_icap_settings_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ assurance_icap_settings_workflow_manager.catalystcenter_log_level if assurance_icap_settings_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ assurance_icap_settings_workflow_manager.catalystcenter_password if assurance_icap_settings_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_icap_settings_workflow_manager.catalystcenter_port if assurance_icap_settings_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ assurance_icap_settings_workflow_manager.catalystcenter_task_poll_interval if assurance_icap_settings_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ assurance_icap_settings_workflow_manager.catalystcenter_username if assurance_icap_settings_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_icap_settings_workflow_manager.catalystcenter_verify if assurance_icap_settings_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_icap_settings_workflow_manager.catalystcenter_version if assurance_icap_settings_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (assurance_icap_settings_workflow_manager.config | cat_strip_nulls) if (assurance_icap_settings_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ assurance_icap_settings_workflow_manager.config_verify if assurance_icap_settings_workflow_manager.config_verify is not none else omit }}"
        state: "{{ assurance_icap_settings_workflow_manager.state if assurance_icap_settings_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ assurance_icap_settings_workflow_manager.validate_response_schema if assurance_icap_settings_workflow_manager.validate_response_schema is not none else omit }}"
      register: assurance_icap_settings_workflow_manager_result
      tags:
        - never
        - assurance_icap_settings_workflow_manager
