---
# Sample playbook for cisco.catalystcenter.aaa_services_count_info (cisco.catalystcenter 2.15.0)
# Build order: 380
# Information module for Aaa Services Count
# Reads ../models/aaa_services_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/aaa_services_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0380 aaa_services_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/aaa_services_count_info.yml
  tasks:
    - name: Run aaa_services_count_info from its model
      cisco.catalystcenter.aaa_services_count_info:
        catalystcenter_debug: "{{ aaa_services_count_info.catalystcenter_debug if aaa_services_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ aaa_services_count_info.catalystcenter_host if aaa_services_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ aaa_services_count_info.catalystcenter_password if aaa_services_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ aaa_services_count_info.catalystcenter_port if aaa_services_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ aaa_services_count_info.catalystcenter_username if aaa_services_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ aaa_services_count_info.catalystcenter_verify if aaa_services_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ aaa_services_count_info.catalystcenter_version if aaa_services_count_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ aaa_services_count_info.deviceId if aaa_services_count_info.deviceId is not none else omit }}"
        deviceName: "{{ aaa_services_count_info.deviceName if aaa_services_count_info.deviceName is not none else omit }}"
        deviceSiteHierarchy: "{{ aaa_services_count_info.deviceSiteHierarchy if aaa_services_count_info.deviceSiteHierarchy is not none else omit }}"
        deviceSiteHierarchyId: "{{ aaa_services_count_info.deviceSiteHierarchyId if aaa_services_count_info.deviceSiteHierarchyId is not none else omit }}"
        deviceSiteId: "{{ aaa_services_count_info.deviceSiteId if aaa_services_count_info.deviceSiteId is not none else omit }}"
        endTime: "{{ aaa_services_count_info.endTime if aaa_services_count_info.endTime is not none else omit }}"
        headers: "{{ aaa_services_count_info.headers if aaa_services_count_info.headers is not none else omit }}"
        serverIp: "{{ aaa_services_count_info.serverIp if aaa_services_count_info.serverIp is not none else omit }}"
        startTime: "{{ aaa_services_count_info.startTime if aaa_services_count_info.startTime is not none else omit }}"
        validate_response_schema: "{{ aaa_services_count_info.validate_response_schema if aaa_services_count_info.validate_response_schema is not none else omit }}"
      register: aaa_services_count_info_result
