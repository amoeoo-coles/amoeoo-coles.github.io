---
# Sample playbook for cisco.catalystcenter.network_devices_unassign_from_site_apply (cisco.catalystcenter 2.15.0)
# Build order: 159
# Resource module for Network Devices Unassign From Site Apply
# Reads ../models/network_devices_unassign_from_site_apply.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_unassign_from_site_apply_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_unassign_from_site_apply.

- name: "0159 network_devices_unassign_from_site_apply"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_unassign_from_site_apply.yml
  tasks:
    - name: Run network_devices_unassign_from_site_apply from its model
      cisco.catalystcenter.network_devices_unassign_from_site_apply:
        catalystcenter_debug: "{{ network_devices_unassign_from_site_apply.catalystcenter_debug if network_devices_unassign_from_site_apply.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_unassign_from_site_apply.catalystcenter_host if network_devices_unassign_from_site_apply.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_unassign_from_site_apply.catalystcenter_password if network_devices_unassign_from_site_apply.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_unassign_from_site_apply.catalystcenter_port if network_devices_unassign_from_site_apply.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_unassign_from_site_apply.catalystcenter_username if network_devices_unassign_from_site_apply.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_unassign_from_site_apply.catalystcenter_verify if network_devices_unassign_from_site_apply.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_unassign_from_site_apply.catalystcenter_version if network_devices_unassign_from_site_apply.catalystcenter_version is not none else omit }}"
        deviceIds: "{{ (network_devices_unassign_from_site_apply.deviceIds | cat_strip_nulls) if (network_devices_unassign_from_site_apply.deviceIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ network_devices_unassign_from_site_apply.validate_response_schema if network_devices_unassign_from_site_apply.validate_response_schema is not none else omit }}"
      register: network_devices_unassign_from_site_apply_result
      tags:
        - never
        - network_devices_unassign_from_site_apply
