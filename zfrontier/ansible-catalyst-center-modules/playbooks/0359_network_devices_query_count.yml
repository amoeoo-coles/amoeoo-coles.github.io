---
# Sample playbook for cisco.catalystcenter.network_devices_query_count (cisco.catalystcenter 2.15.0)
# Build order: 359
# Resource module for Network Devices Query Count
# Reads ../models/network_devices_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_query_count.

- name: "0359 network_devices_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_query_count.yml
  tasks:
    - name: Run network_devices_query_count from its model
      cisco.catalystcenter.network_devices_query_count:
        catalystcenter_debug: "{{ network_devices_query_count.catalystcenter_debug if network_devices_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_query_count.catalystcenter_host if network_devices_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_query_count.catalystcenter_password if network_devices_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_query_count.catalystcenter_port if network_devices_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_query_count.catalystcenter_username if network_devices_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_query_count.catalystcenter_verify if network_devices_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_query_count.catalystcenter_version if network_devices_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ network_devices_query_count.endTime if network_devices_query_count.endTime is not none else omit }}"
        filters: "{{ (network_devices_query_count.filters | cat_strip_nulls) if (network_devices_query_count.filters | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ network_devices_query_count.startTime if network_devices_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ network_devices_query_count.validate_response_schema if network_devices_query_count.validate_response_schema is not none else omit }}"
      register: network_devices_query_count_result
      tags:
        - never
        - network_devices_query_count
