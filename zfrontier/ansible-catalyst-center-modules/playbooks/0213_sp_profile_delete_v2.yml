---
# Sample playbook for cisco.catalystcenter.sp_profile_delete_v2 (cisco.catalystcenter 2.15.0)
# Build order: 213
# Resource module for Sp Profile Delete V2
# Reads ../models/sp_profile_delete_v2.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sp_profile_delete_v2_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sp_profile_delete_v2.

- name: "0213 sp_profile_delete_v2"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sp_profile_delete_v2.yml
  tasks:
    - name: Run sp_profile_delete_v2 from its model
      cisco.catalystcenter.sp_profile_delete_v2:
        catalystcenter_debug: "{{ sp_profile_delete_v2.catalystcenter_debug if sp_profile_delete_v2.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sp_profile_delete_v2.catalystcenter_host if sp_profile_delete_v2.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sp_profile_delete_v2.catalystcenter_password if sp_profile_delete_v2.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sp_profile_delete_v2.catalystcenter_port if sp_profile_delete_v2.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sp_profile_delete_v2.catalystcenter_username if sp_profile_delete_v2.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sp_profile_delete_v2.catalystcenter_verify if sp_profile_delete_v2.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sp_profile_delete_v2.catalystcenter_version if sp_profile_delete_v2.catalystcenter_version is not none else omit }}"
        spProfileName: "{{ sp_profile_delete_v2.spProfileName if sp_profile_delete_v2.spProfileName is not none else omit }}"
        validate_response_schema: "{{ sp_profile_delete_v2.validate_response_schema if sp_profile_delete_v2.validate_response_schema is not none else omit }}"
      register: sp_profile_delete_v2_result
      tags:
        - never
        - sp_profile_delete_v2
