---
# Sample playbook for cisco.catalystcenter.traffic_steering_policys_bulk_create (cisco.catalystcenter 2.15.0)
# Build order: 1522
# Resource module for Traffic Steering Policys Bulk Create
# Reads ../models/traffic_steering_policys_bulk_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/traffic_steering_policys_bulk_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags traffic_steering_policys_bulk_create.

- name: "1522 traffic_steering_policys_bulk_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/traffic_steering_policys_bulk_create.yml
  tasks:
    - name: Run traffic_steering_policys_bulk_create from its model
      cisco.catalystcenter.traffic_steering_policys_bulk_create:
        catalystcenter_debug: "{{ traffic_steering_policys_bulk_create.catalystcenter_debug if traffic_steering_policys_bulk_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ traffic_steering_policys_bulk_create.catalystcenter_host if traffic_steering_policys_bulk_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ traffic_steering_policys_bulk_create.catalystcenter_password if traffic_steering_policys_bulk_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ traffic_steering_policys_bulk_create.catalystcenter_port if traffic_steering_policys_bulk_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ traffic_steering_policys_bulk_create.catalystcenter_username if traffic_steering_policys_bulk_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ traffic_steering_policys_bulk_create.catalystcenter_verify if traffic_steering_policys_bulk_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ traffic_steering_policys_bulk_create.catalystcenter_version if traffic_steering_policys_bulk_create.catalystcenter_version is not none else omit }}"
        payload: "{{ (traffic_steering_policys_bulk_create.payload | cat_strip_nulls) if (traffic_steering_policys_bulk_create.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ traffic_steering_policys_bulk_create.validate_response_schema if traffic_steering_policys_bulk_create.validate_response_schema is not none else omit }}"
      register: traffic_steering_policys_bulk_create_result
      tags:
        - never
        - traffic_steering_policys_bulk_create
