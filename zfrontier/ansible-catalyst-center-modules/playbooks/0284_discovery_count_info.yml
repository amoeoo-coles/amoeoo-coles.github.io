---
# Sample playbook for cisco.catalystcenter.discovery_count_info (cisco.catalystcenter 2.15.0)
# Build order: 284
# Information module for Discovery Count
# Reads ../models/discovery_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0284 discovery_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_count_info.yml
  tasks:
    - name: Run discovery_count_info from its model
      cisco.catalystcenter.discovery_count_info:
        catalystcenter_debug: "{{ discovery_count_info.catalystcenter_debug if discovery_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_count_info.catalystcenter_host if discovery_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery_count_info.catalystcenter_password if discovery_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_count_info.catalystcenter_port if discovery_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery_count_info.catalystcenter_username if discovery_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_count_info.catalystcenter_verify if discovery_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_count_info.catalystcenter_version if discovery_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ discovery_count_info.headers if discovery_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ discovery_count_info.validate_response_schema if discovery_count_info.validate_response_schema is not none else omit }}"
      register: discovery_count_info_result
