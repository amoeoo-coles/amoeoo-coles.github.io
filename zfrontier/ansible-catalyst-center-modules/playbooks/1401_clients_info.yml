---
# Sample playbook for cisco.catalystcenter.clients_info (cisco.catalystcenter 2.15.0)
# Build order: 1401
# Information module for Clients
# Reads ../models/clients_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/clients_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1401 clients_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/clients_info.yml
  tasks:
    - name: Run clients_info from its model
      cisco.catalystcenter.clients_info:
        attribute: "{{ clients_info.attribute if clients_info.attribute is not none else omit }}"
        band: "{{ clients_info.band if clients_info.band is not none else omit }}"
        catalystcenter_debug: "{{ clients_info.catalystcenter_debug if clients_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ clients_info.catalystcenter_host if clients_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ clients_info.catalystcenter_password if clients_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ clients_info.catalystcenter_port if clients_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ clients_info.catalystcenter_username if clients_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ clients_info.catalystcenter_verify if clients_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ clients_info.catalystcenter_version if clients_info.catalystcenter_version is not none else omit }}"
        connectedNetworkDeviceName: "{{ clients_info.connectedNetworkDeviceName if clients_info.connectedNetworkDeviceName is not none else omit }}"
        endTime: "{{ clients_info.endTime if clients_info.endTime is not none else omit }}"
        headers: "{{ clients_info.headers if clients_info.headers is not none else omit }}"
        id: "{{ clients_info.id if clients_info.id is not none else omit }}"
        ipv4Address: "{{ clients_info.ipv4Address if clients_info.ipv4Address is not none else omit }}"
        ipv6Address: "{{ clients_info.ipv6Address if clients_info.ipv6Address is not none else omit }}"
        limit: "{{ clients_info.limit if clients_info.limit is not none else omit }}"
        macAddress: "{{ clients_info.macAddress if clients_info.macAddress is not none else omit }}"
        offset: "{{ clients_info.offset if clients_info.offset is not none else omit }}"
        order: "{{ clients_info.order if clients_info.order is not none else omit }}"
        osType: "{{ clients_info.osType if clients_info.osType is not none else omit }}"
        osVersion: "{{ clients_info.osVersion if clients_info.osVersion is not none else omit }}"
        siteHierarchy: "{{ clients_info.siteHierarchy if clients_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ clients_info.siteHierarchyId if clients_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ clients_info.siteId if clients_info.siteId is not none else omit }}"
        sortBy: "{{ clients_info.sortBy if clients_info.sortBy is not none else omit }}"
        ssid: "{{ clients_info.ssid if clients_info.ssid is not none else omit }}"
        startTime: "{{ clients_info.startTime if clients_info.startTime is not none else omit }}"
        type: "{{ clients_info.type if clients_info.type is not none else omit }}"
        validate_response_schema: "{{ clients_info.validate_response_schema if clients_info.validate_response_schema is not none else omit }}"
        view: "{{ clients_info.view if clients_info.view is not none else omit }}"
        wlcName: "{{ clients_info.wlcName if clients_info.wlcName is not none else omit }}"
      register: clients_info_result
