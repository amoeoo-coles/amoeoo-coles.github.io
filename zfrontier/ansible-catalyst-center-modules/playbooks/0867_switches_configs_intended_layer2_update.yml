---
# Sample playbook for cisco.catalystcenter.switches_configs_intended_layer2_update (cisco.catalystcenter 2.15.0)
# Build order: 867
# Resource module for Switches Configs Intended Layer2 Update
# Reads ../models/switches_configs_intended_layer2_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/switches_configs_intended_layer2_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags switches_configs_intended_layer2_update.

- name: "0867 switches_configs_intended_layer2_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/switches_configs_intended_layer2_update.yml
  tasks:
    - name: Run switches_configs_intended_layer2_update from its model
      cisco.catalystcenter.switches_configs_intended_layer2_update:
        catalystcenter_debug: "{{ switches_configs_intended_layer2_update.catalystcenter_debug if switches_configs_intended_layer2_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ switches_configs_intended_layer2_update.catalystcenter_host if switches_configs_intended_layer2_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ switches_configs_intended_layer2_update.catalystcenter_password if switches_configs_intended_layer2_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ switches_configs_intended_layer2_update.catalystcenter_port if switches_configs_intended_layer2_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ switches_configs_intended_layer2_update.catalystcenter_username if switches_configs_intended_layer2_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ switches_configs_intended_layer2_update.catalystcenter_verify if switches_configs_intended_layer2_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ switches_configs_intended_layer2_update.catalystcenter_version if switches_configs_intended_layer2_update.catalystcenter_version is not none else omit }}"
        cdpConfig: "{{ (switches_configs_intended_layer2_update.cdpConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.cdpConfig | cat_strip_nulls) is not none else omit }}"
        etherchannelConfig: "{{ (switches_configs_intended_layer2_update.etherchannelConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.etherchannelConfig | cat_strip_nulls) is not none else omit }}"
        feature: "{{ switches_configs_intended_layer2_update.feature if switches_configs_intended_layer2_update.feature is not none else omit }}"
        id: "{{ switches_configs_intended_layer2_update.id if switches_configs_intended_layer2_update.id is not none else omit }}"
        igmpSnoopingConfig: "{{ (switches_configs_intended_layer2_update.igmpSnoopingConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.igmpSnoopingConfig | cat_strip_nulls) is not none else omit }}"
        lldpConfig: "{{ (switches_configs_intended_layer2_update.lldpConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.lldpConfig | cat_strip_nulls) is not none else omit }}"
        macAddressTableConfig: "{{ (switches_configs_intended_layer2_update.macAddressTableConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.macAddressTableConfig | cat_strip_nulls) is not none else omit }}"
        mldSnoopingConfig: "{{ (switches_configs_intended_layer2_update.mldSnoopingConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.mldSnoopingConfig | cat_strip_nulls) is not none else omit }}"
        stpConfig: "{{ (switches_configs_intended_layer2_update.stpConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.stpConfig | cat_strip_nulls) is not none else omit }}"
        udldConfig: "{{ (switches_configs_intended_layer2_update.udldConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.udldConfig | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ switches_configs_intended_layer2_update.validate_response_schema if switches_configs_intended_layer2_update.validate_response_schema is not none else omit }}"
        vlanConfig: "{{ (switches_configs_intended_layer2_update.vlanConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.vlanConfig | cat_strip_nulls) is not none else omit }}"
        vtpConfig: "{{ (switches_configs_intended_layer2_update.vtpConfig | cat_strip_nulls) if (switches_configs_intended_layer2_update.vtpConfig | cat_strip_nulls) is not none else omit }}"
      register: switches_configs_intended_layer2_update_result
      tags:
        - never
        - switches_configs_intended_layer2_update
