---
# Sample playbook for cisco.catalystcenter.wireless_accespoint_configuration (cisco.catalystcenter 2.15.0)
# Build order: 979
# Resource module for Wireless Accespoint Configuration
# Reads ../models/wireless_accespoint_configuration.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_accespoint_configuration_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_accespoint_configuration.

- name: "0979 wireless_accespoint_configuration"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_accespoint_configuration.yml
  tasks:
    - name: Run wireless_accespoint_configuration from its model
      cisco.catalystcenter.wireless_accespoint_configuration:
        adminStatus: "{{ wireless_accespoint_configuration.adminStatus if wireless_accespoint_configuration.adminStatus is not none else omit }}"
        apList: "{{ (wireless_accespoint_configuration.apList | cat_strip_nulls) if (wireless_accespoint_configuration.apList | cat_strip_nulls) is not none else omit }}"
        apMode: "{{ wireless_accespoint_configuration.apMode if wireless_accespoint_configuration.apMode is not none else omit }}"
        catalystcenter_debug: "{{ wireless_accespoint_configuration.catalystcenter_debug if wireless_accespoint_configuration.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_accespoint_configuration.catalystcenter_host if wireless_accespoint_configuration.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_accespoint_configuration.catalystcenter_password if wireless_accespoint_configuration.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_accespoint_configuration.catalystcenter_port if wireless_accespoint_configuration.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_accespoint_configuration.catalystcenter_username if wireless_accespoint_configuration.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_accespoint_configuration.catalystcenter_verify if wireless_accespoint_configuration.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_accespoint_configuration.catalystcenter_version if wireless_accespoint_configuration.catalystcenter_version is not none else omit }}"
        configureAdminStatus: "{{ wireless_accespoint_configuration.configureAdminStatus if wireless_accespoint_configuration.configureAdminStatus is not none else omit }}"
        configureApMode: "{{ wireless_accespoint_configuration.configureApMode if wireless_accespoint_configuration.configureApMode is not none else omit }}"
        configureFailoverPriority: "{{ wireless_accespoint_configuration.configureFailoverPriority if wireless_accespoint_configuration.configureFailoverPriority is not none else omit }}"
        configureHAController: "{{ wireless_accespoint_configuration.configureHAController if wireless_accespoint_configuration.configureHAController is not none else omit }}"
        configureLedBrightnessLevel: "{{ wireless_accespoint_configuration.configureLedBrightnessLevel if wireless_accespoint_configuration.configureLedBrightnessLevel is not none else omit }}"
        configureLedStatus: "{{ wireless_accespoint_configuration.configureLedStatus if wireless_accespoint_configuration.configureLedStatus is not none else omit }}"
        configureLocation: "{{ wireless_accespoint_configuration.configureLocation if wireless_accespoint_configuration.configureLocation is not none else omit }}"
        failoverPriority: "{{ wireless_accespoint_configuration.failoverPriority if wireless_accespoint_configuration.failoverPriority is not none else omit }}"
        isAssignedSiteAsLocation: "{{ wireless_accespoint_configuration.isAssignedSiteAsLocation if wireless_accespoint_configuration.isAssignedSiteAsLocation is not none else omit }}"
        ledBrightnessLevel: "{{ wireless_accespoint_configuration.ledBrightnessLevel if wireless_accespoint_configuration.ledBrightnessLevel is not none else omit }}"
        ledStatus: "{{ wireless_accespoint_configuration.ledStatus if wireless_accespoint_configuration.ledStatus is not none else omit }}"
        location: "{{ wireless_accespoint_configuration.location if wireless_accespoint_configuration.location is not none else omit }}"
        primaryControllerName: "{{ wireless_accespoint_configuration.primaryControllerName if wireless_accespoint_configuration.primaryControllerName is not none else omit }}"
        primaryIpAddress: "{{ (wireless_accespoint_configuration.primaryIpAddress | cat_strip_nulls) if (wireless_accespoint_configuration.primaryIpAddress | cat_strip_nulls) is not none else omit }}"
        radioConfigurations: "{{ (wireless_accespoint_configuration.radioConfigurations | cat_strip_nulls) if (wireless_accespoint_configuration.radioConfigurations | cat_strip_nulls) is not none else omit }}"
        secondaryControllerName: "{{ wireless_accespoint_configuration.secondaryControllerName if wireless_accespoint_configuration.secondaryControllerName is not none else omit }}"
        secondaryIpAddress: "{{ (wireless_accespoint_configuration.secondaryIpAddress | cat_strip_nulls) if (wireless_accespoint_configuration.secondaryIpAddress | cat_strip_nulls) is not none else omit }}"
        tertiaryControllerName: "{{ wireless_accespoint_configuration.tertiaryControllerName if wireless_accespoint_configuration.tertiaryControllerName is not none else omit }}"
        tertiaryIpAddress: "{{ (wireless_accespoint_configuration.tertiaryIpAddress | cat_strip_nulls) if (wireless_accespoint_configuration.tertiaryIpAddress | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_accespoint_configuration.validate_response_schema if wireless_accespoint_configuration.validate_response_schema is not none else omit }}"
      register: wireless_accespoint_configuration_result
      tags:
        - never
        - wireless_accespoint_configuration
