---
# Sample playbook for cisco.catalystcenter.swim_import_local (cisco.catalystcenter 2.15.0)
# Build order: 558
# Resource module for Swim Import Local
# Reads ../models/swim_import_local.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/swim_import_local_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags swim_import_local.

- name: "0558 swim_import_local"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/swim_import_local.yml
  tasks:
    - name: Run swim_import_local from its model
      cisco.catalystcenter.swim_import_local:
        catalystcenter_debug: "{{ swim_import_local.catalystcenter_debug if swim_import_local.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ swim_import_local.catalystcenter_host if swim_import_local.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ swim_import_local.catalystcenter_password if swim_import_local.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ swim_import_local.catalystcenter_port if swim_import_local.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ swim_import_local.catalystcenter_username if swim_import_local.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ swim_import_local.catalystcenter_verify if swim_import_local.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ swim_import_local.catalystcenter_version if swim_import_local.catalystcenter_version is not none else omit }}"
        filePath: "{{ swim_import_local.filePath if swim_import_local.filePath is not none else omit }}"
        isThirdParty: "{{ swim_import_local.isThirdParty if swim_import_local.isThirdParty is not none else omit }}"
        thirdPartyApplicationType: "{{ swim_import_local.thirdPartyApplicationType if swim_import_local.thirdPartyApplicationType is not none else omit }}"
        thirdPartyImageFamily: "{{ swim_import_local.thirdPartyImageFamily if swim_import_local.thirdPartyImageFamily is not none else omit }}"
        thirdPartyVendor: "{{ swim_import_local.thirdPartyVendor if swim_import_local.thirdPartyVendor is not none else omit }}"
        validate_response_schema: "{{ swim_import_local.validate_response_schema if swim_import_local.validate_response_schema is not none else omit }}"
      register: swim_import_local_result
      tags:
        - never
        - swim_import_local
