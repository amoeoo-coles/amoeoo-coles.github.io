---
# Sample playbook for cisco.catalystcenter.path_traces_result_info (cisco.catalystcenter 2.15.0)
# Build order: 1466
# Information module for Path Traces Result
# Reads ../models/path_traces_result_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/path_traces_result_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1466 path_traces_result_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/path_traces_result_info.yml
  tasks:
    - name: Run path_traces_result_info from its model
      cisco.catalystcenter.path_traces_result_info:
        catalystcenter_debug: "{{ path_traces_result_info.catalystcenter_debug if path_traces_result_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ path_traces_result_info.catalystcenter_host if path_traces_result_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ path_traces_result_info.catalystcenter_password if path_traces_result_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ path_traces_result_info.catalystcenter_port if path_traces_result_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ path_traces_result_info.catalystcenter_username if path_traces_result_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ path_traces_result_info.catalystcenter_verify if path_traces_result_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ path_traces_result_info.catalystcenter_version if path_traces_result_info.catalystcenter_version is not none else omit }}"
        headers: "{{ path_traces_result_info.headers if path_traces_result_info.headers is not none else omit }}"
        id: "{{ path_traces_result_info.id if path_traces_result_info.id is not none else omit }}"
        validate_response_schema: "{{ path_traces_result_info.validate_response_schema if path_traces_result_info.validate_response_schema is not none else omit }}"
        view: "{{ (path_traces_result_info.view | cat_strip_nulls) if (path_traces_result_info.view | cat_strip_nulls) is not none else omit }}"
      register: path_traces_result_info_result
