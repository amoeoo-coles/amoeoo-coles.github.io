---
# Sample playbook for cisco.catalystcenter.energy_network_devices_query (cisco.catalystcenter 2.15.0)
# Build order: 324
# Resource module for Energy Network Devices Query
# Reads ../models/energy_network_devices_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_network_devices_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags energy_network_devices_query.

- name: "0324 energy_network_devices_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_network_devices_query.yml
  tasks:
    - name: Run energy_network_devices_query from its model
      cisco.catalystcenter.energy_network_devices_query:
        aggregateAttributes: "{{ (energy_network_devices_query.aggregateAttributes | cat_strip_nulls) if (energy_network_devices_query.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (energy_network_devices_query.attributes | cat_strip_nulls) if (energy_network_devices_query.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ energy_network_devices_query.catalystcenter_debug if energy_network_devices_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_network_devices_query.catalystcenter_host if energy_network_devices_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_network_devices_query.catalystcenter_password if energy_network_devices_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_network_devices_query.catalystcenter_port if energy_network_devices_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_network_devices_query.catalystcenter_username if energy_network_devices_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_network_devices_query.catalystcenter_verify if energy_network_devices_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_network_devices_query.catalystcenter_version if energy_network_devices_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ energy_network_devices_query.endTime if energy_network_devices_query.endTime is not none else omit }}"
        filters: "{{ (energy_network_devices_query.filters | cat_strip_nulls) if (energy_network_devices_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ energy_network_devices_query.headers if energy_network_devices_query.headers is not none else omit }}"
        page: "{{ (energy_network_devices_query.page | cat_strip_nulls) if (energy_network_devices_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ energy_network_devices_query.startTime if energy_network_devices_query.startTime is not none else omit }}"
        validate_response_schema: "{{ energy_network_devices_query.validate_response_schema if energy_network_devices_query.validate_response_schema is not none else omit }}"
        views: "{{ (energy_network_devices_query.views | cat_strip_nulls) if (energy_network_devices_query.views | cat_strip_nulls) is not none else omit }}"
      register: energy_network_devices_query_result
      tags:
        - never
        - energy_network_devices_query
