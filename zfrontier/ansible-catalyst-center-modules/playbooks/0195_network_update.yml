---
# Sample playbook for cisco.catalystcenter.network_update (cisco.catalystcenter 2.15.0)
# Build order: 195
# Resource module for Network Update
# Reads ../models/network_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_update.

- name: "0195 network_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_update.yml
  tasks:
    - name: Run network_update from its model
      cisco.catalystcenter.network_update:
        catalystcenter_debug: "{{ network_update.catalystcenter_debug if network_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_update.catalystcenter_host if network_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_update.catalystcenter_password if network_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_update.catalystcenter_port if network_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_update.catalystcenter_username if network_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_update.catalystcenter_verify if network_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_update.catalystcenter_version if network_update.catalystcenter_version is not none else omit }}"
        headers: "{{ network_update.headers if network_update.headers is not none else omit }}"
        settings: "{{ (network_update.settings | cat_strip_nulls) if (network_update.settings | cat_strip_nulls) is not none else omit }}"
        siteId: "{{ network_update.siteId if network_update.siteId is not none else omit }}"
        validate_response_schema: "{{ network_update.validate_response_schema if network_update.validate_response_schema is not none else omit }}"
      register: network_update_result
      tags:
        - never
        - network_update
