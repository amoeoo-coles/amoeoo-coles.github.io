---
# Sample playbook for cisco.catalystcenter.ipam_server_setting (cisco.catalystcenter 2.15.0)
# Build order: 3
# Resource module for Ipam Server Setting
# Reads ../models/ipam_server_setting.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ipam_server_setting_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags ipam_server_setting.

- name: "0003 ipam_server_setting"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipam_server_setting.yml
  tasks:
    - name: Run ipam_server_setting from its model
      cisco.catalystcenter.ipam_server_setting:
        catalystcenter_debug: "{{ ipam_server_setting.catalystcenter_debug if ipam_server_setting.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ipam_server_setting.catalystcenter_host if ipam_server_setting.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ ipam_server_setting.catalystcenter_password if ipam_server_setting.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ipam_server_setting.catalystcenter_port if ipam_server_setting.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ ipam_server_setting.catalystcenter_username if ipam_server_setting.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ipam_server_setting.catalystcenter_verify if ipam_server_setting.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ipam_server_setting.catalystcenter_version if ipam_server_setting.catalystcenter_version is not none else omit }}"
        password: "{{ ipam_server_setting.password if ipam_server_setting.password is not none else omit }}"
        provider: "{{ (ipam_server_setting.provider | cat_strip_nulls) if (ipam_server_setting.provider | cat_strip_nulls) is not none else omit }}"
        serverName: "{{ ipam_server_setting.serverName if ipam_server_setting.serverName is not none else omit }}"
        serverUrl: "{{ ipam_server_setting.serverUrl if ipam_server_setting.serverUrl is not none else omit }}"
        state_: "{{ ipam_server_setting.state_ if ipam_server_setting.state_ is not none else omit }}"
        syncView: "{{ ipam_server_setting.syncView if ipam_server_setting.syncView is not none else omit }}"
        userName: "{{ ipam_server_setting.userName if ipam_server_setting.userName is not none else omit }}"
        validate_response_schema: "{{ ipam_server_setting.validate_response_schema if ipam_server_setting.validate_response_schema is not none else omit }}"
        view: "{{ ipam_server_setting.view if ipam_server_setting.view is not none else omit }}"
      register: ipam_server_setting_result
      tags:
        - never
        - ipam_server_setting
