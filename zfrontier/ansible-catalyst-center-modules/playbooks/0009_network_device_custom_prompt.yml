---
# Sample playbook for cisco.catalystcenter.network_device_custom_prompt (cisco.catalystcenter 2.15.0)
# Build order: 9
# Resource module for Network Device Custom Prompt
# Reads ../models/network_device_custom_prompt.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_custom_prompt_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_custom_prompt.

- name: "0009 network_device_custom_prompt"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_custom_prompt.yml
  tasks:
    - name: Run network_device_custom_prompt from its model
      cisco.catalystcenter.network_device_custom_prompt:
        catalystcenter_debug: "{{ network_device_custom_prompt.catalystcenter_debug if network_device_custom_prompt.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_custom_prompt.catalystcenter_host if network_device_custom_prompt.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_custom_prompt.catalystcenter_password if network_device_custom_prompt.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_custom_prompt.catalystcenter_port if network_device_custom_prompt.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_custom_prompt.catalystcenter_username if network_device_custom_prompt.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_custom_prompt.catalystcenter_verify if network_device_custom_prompt.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_custom_prompt.catalystcenter_version if network_device_custom_prompt.catalystcenter_version is not none else omit }}"
        passwordPrompt: "{{ network_device_custom_prompt.passwordPrompt if network_device_custom_prompt.passwordPrompt is not none else omit }}"
        usernamePrompt: "{{ network_device_custom_prompt.usernamePrompt if network_device_custom_prompt.usernamePrompt is not none else omit }}"
        validate_response_schema: "{{ network_device_custom_prompt.validate_response_schema if network_device_custom_prompt.validate_response_schema is not none else omit }}"
      register: network_device_custom_prompt_result
      tags:
        - never
        - network_device_custom_prompt
