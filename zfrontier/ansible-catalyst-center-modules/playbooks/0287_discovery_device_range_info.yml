---
# Sample playbook for cisco.catalystcenter.discovery_device_range_info (cisco.catalystcenter 2.15.0)
# Build order: 287
# Information module for Discovery Device Range
# Reads ../models/discovery_device_range_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_device_range_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0287 discovery_device_range_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_device_range_info.yml
  tasks:
    - name: Run discovery_device_range_info from its model
      cisco.catalystcenter.discovery_device_range_info:
        catalystcenter_debug: "{{ discovery_device_range_info.catalystcenter_debug if discovery_device_range_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_device_range_info.catalystcenter_host if discovery_device_range_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery_device_range_info.catalystcenter_password if discovery_device_range_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_device_range_info.catalystcenter_port if discovery_device_range_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery_device_range_info.catalystcenter_username if discovery_device_range_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_device_range_info.catalystcenter_verify if discovery_device_range_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_device_range_info.catalystcenter_version if discovery_device_range_info.catalystcenter_version is not none else omit }}"
        headers: "{{ discovery_device_range_info.headers if discovery_device_range_info.headers is not none else omit }}"
        id: "{{ discovery_device_range_info.id if discovery_device_range_info.id is not none else omit }}"
        recordsToReturn: "{{ discovery_device_range_info.recordsToReturn if discovery_device_range_info.recordsToReturn is not none else omit }}"
        startIndex: "{{ discovery_device_range_info.startIndex if discovery_device_range_info.startIndex is not none else omit }}"
        taskId: "{{ discovery_device_range_info.taskId if discovery_device_range_info.taskId is not none else omit }}"
        validate_response_schema: "{{ discovery_device_range_info.validate_response_schema if discovery_device_range_info.validate_response_schema is not none else omit }}"
      register: discovery_device_range_info_result
