---
# Sample playbook for cisco.catalystcenter.images_distribution_server_settings (cisco.catalystcenter 2.15.0)
# Build order: 547
# Resource module for Images Distribution Server Settings
# Reads ../models/images_distribution_server_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_distribution_server_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags images_distribution_server_settings.

- name: "0547 images_distribution_server_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_distribution_server_settings.yml
  tasks:
    - name: Run images_distribution_server_settings from its model
      cisco.catalystcenter.images_distribution_server_settings:
        catalystcenter_debug: "{{ images_distribution_server_settings.catalystcenter_debug if images_distribution_server_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_distribution_server_settings.catalystcenter_host if images_distribution_server_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_distribution_server_settings.catalystcenter_password if images_distribution_server_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_distribution_server_settings.catalystcenter_port if images_distribution_server_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_distribution_server_settings.catalystcenter_username if images_distribution_server_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_distribution_server_settings.catalystcenter_verify if images_distribution_server_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_distribution_server_settings.catalystcenter_version if images_distribution_server_settings.catalystcenter_version is not none else omit }}"
        id: "{{ images_distribution_server_settings.id if images_distribution_server_settings.id is not none else omit }}"
        password: "{{ images_distribution_server_settings.password if images_distribution_server_settings.password is not none else omit }}"
        portNumber: "{{ images_distribution_server_settings.portNumber if images_distribution_server_settings.portNumber is not none else omit }}"
        rootLocation: "{{ images_distribution_server_settings.rootLocation if images_distribution_server_settings.rootLocation is not none else omit }}"
        serverAddress: "{{ images_distribution_server_settings.serverAddress if images_distribution_server_settings.serverAddress is not none else omit }}"
        username: "{{ images_distribution_server_settings.username if images_distribution_server_settings.username is not none else omit }}"
        validate_response_schema: "{{ images_distribution_server_settings.validate_response_schema if images_distribution_server_settings.validate_response_schema is not none else omit }}"
      register: images_distribution_server_settings_result
      tags:
        - never
        - images_distribution_server_settings
