---
# Sample playbook for cisco.catalystcenter.device_credential_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 283
# Resource module for Global Device Credentials and Assigning Credentials to sites.
# Reads ../models/device_credential_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_credential_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags device_credential_workflow_manager.

- name: "0283 device_credential_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_credential_workflow_manager.yml
  tasks:
    - name: Run device_credential_workflow_manager from its model
      cisco.catalystcenter.device_credential_workflow_manager:
        catalystcenter_api_task_timeout: "{{ device_credential_workflow_manager.catalystcenter_api_task_timeout if device_credential_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ device_credential_workflow_manager.catalystcenter_debug if device_credential_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_credential_workflow_manager.catalystcenter_host if device_credential_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ device_credential_workflow_manager.catalystcenter_log if device_credential_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ device_credential_workflow_manager.catalystcenter_log_append if device_credential_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ device_credential_workflow_manager.catalystcenter_log_file_path if device_credential_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ device_credential_workflow_manager.catalystcenter_log_level if device_credential_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ device_credential_workflow_manager.catalystcenter_password if device_credential_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_credential_workflow_manager.catalystcenter_port if device_credential_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ device_credential_workflow_manager.catalystcenter_task_poll_interval if device_credential_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ device_credential_workflow_manager.catalystcenter_username if device_credential_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_credential_workflow_manager.catalystcenter_verify if device_credential_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_credential_workflow_manager.catalystcenter_version if device_credential_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (device_credential_workflow_manager.config | cat_strip_nulls) if (device_credential_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ device_credential_workflow_manager.config_verify if device_credential_workflow_manager.config_verify is not none else omit }}"
        state: "{{ device_credential_workflow_manager.state if device_credential_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ device_credential_workflow_manager.validate_response_schema if device_credential_workflow_manager.validate_response_schema is not none else omit }}"
      register: device_credential_workflow_manager_result
      tags:
        - never
        - device_credential_workflow_manager
