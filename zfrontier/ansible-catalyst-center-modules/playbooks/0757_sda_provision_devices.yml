---
# Sample playbook for cisco.catalystcenter.sda_provision_devices (cisco.catalystcenter 2.15.0)
# Build order: 757
# Resource module for Sda Provision Devices
# Reads ../models/sda_provision_devices.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_provision_devices_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_provision_devices.

- name: "0757 sda_provision_devices"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_provision_devices.yml
  tasks:
    - name: Run sda_provision_devices from its model
      cisco.catalystcenter.sda_provision_devices:
        catalystcenter_debug: "{{ sda_provision_devices.catalystcenter_debug if sda_provision_devices.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_provision_devices.catalystcenter_host if sda_provision_devices.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_provision_devices.catalystcenter_password if sda_provision_devices.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_provision_devices.catalystcenter_port if sda_provision_devices.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_provision_devices.catalystcenter_username if sda_provision_devices.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_provision_devices.catalystcenter_verify if sda_provision_devices.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_provision_devices.catalystcenter_version if sda_provision_devices.catalystcenter_version is not none else omit }}"
        cleanUpConfig: "{{ sda_provision_devices.cleanUpConfig if sda_provision_devices.cleanUpConfig is not none else omit }}"
        id: "{{ sda_provision_devices.id if sda_provision_devices.id is not none else omit }}"
        networkDeviceId: "{{ sda_provision_devices.networkDeviceId if sda_provision_devices.networkDeviceId is not none else omit }}"
        payload: "{{ (sda_provision_devices.payload | cat_strip_nulls) if (sda_provision_devices.payload | cat_strip_nulls) is not none else omit }}"
        siteId: "{{ sda_provision_devices.siteId if sda_provision_devices.siteId is not none else omit }}"
        validate_response_schema: "{{ sda_provision_devices.validate_response_schema if sda_provision_devices.validate_response_schema is not none else omit }}"
      register: sda_provision_devices_result
      tags:
        - never
        - sda_provision_devices
