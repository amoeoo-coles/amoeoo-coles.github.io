---
# Sample playbook for cisco.catalystcenter.aaa_services_info (cisco.catalystcenter 2.15.0)
# Build order: 381
# Information module for Aaa Services
# Reads ../models/aaa_services_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/aaa_services_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0381 aaa_services_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/aaa_services_info.yml
  tasks:
    - name: Run aaa_services_info from its model
      cisco.catalystcenter.aaa_services_info:
        catalystcenter_debug: "{{ aaa_services_info.catalystcenter_debug if aaa_services_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ aaa_services_info.catalystcenter_host if aaa_services_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ aaa_services_info.catalystcenter_password if aaa_services_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ aaa_services_info.catalystcenter_port if aaa_services_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ aaa_services_info.catalystcenter_username if aaa_services_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ aaa_services_info.catalystcenter_verify if aaa_services_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ aaa_services_info.catalystcenter_version if aaa_services_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ aaa_services_info.deviceId if aaa_services_info.deviceId is not none else omit }}"
        deviceName: "{{ aaa_services_info.deviceName if aaa_services_info.deviceName is not none else omit }}"
        deviceSiteHierarchyId: "{{ aaa_services_info.deviceSiteHierarchyId if aaa_services_info.deviceSiteHierarchyId is not none else omit }}"
        endTime: "{{ aaa_services_info.endTime if aaa_services_info.endTime is not none else omit }}"
        headers: "{{ aaa_services_info.headers if aaa_services_info.headers is not none else omit }}"
        id: "{{ aaa_services_info.id if aaa_services_info.id is not none else omit }}"
        limit: "{{ aaa_services_info.limit if aaa_services_info.limit is not none else omit }}"
        offset: "{{ aaa_services_info.offset if aaa_services_info.offset is not none else omit }}"
        order: "{{ aaa_services_info.order if aaa_services_info.order is not none else omit }}"
        serverIp: "{{ aaa_services_info.serverIp if aaa_services_info.serverIp is not none else omit }}"
        siteHierarchy: "{{ aaa_services_info.siteHierarchy if aaa_services_info.siteHierarchy is not none else omit }}"
        siteId: "{{ aaa_services_info.siteId if aaa_services_info.siteId is not none else omit }}"
        sortBy: "{{ aaa_services_info.sortBy if aaa_services_info.sortBy is not none else omit }}"
        startTime: "{{ aaa_services_info.startTime if aaa_services_info.startTime is not none else omit }}"
        validate_response_schema: "{{ aaa_services_info.validate_response_schema if aaa_services_info.validate_response_schema is not none else omit }}"
      register: aaa_services_info_result
