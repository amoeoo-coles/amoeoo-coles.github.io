---
# Sample playbook for cisco.catalystcenter.pnp_device_claim (cisco.catalystcenter 2.15.0)
# Build order: 477
# Resource module for Pnp Device Claim
# Reads ../models/pnp_device_claim.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_claim_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_device_claim.

- name: "0477 pnp_device_claim"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_device_claim.yml
  tasks:
    - name: Run pnp_device_claim from its model
      cisco.catalystcenter.pnp_device_claim:
        authorizationNeeded: "{{ pnp_device_claim.authorizationNeeded if pnp_device_claim.authorizationNeeded is not none else omit }}"
        catalystcenter_debug: "{{ pnp_device_claim.catalystcenter_debug if pnp_device_claim.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_device_claim.catalystcenter_host if pnp_device_claim.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_device_claim.catalystcenter_password if pnp_device_claim.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_device_claim.catalystcenter_port if pnp_device_claim.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_device_claim.catalystcenter_username if pnp_device_claim.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_device_claim.catalystcenter_verify if pnp_device_claim.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_device_claim.catalystcenter_version if pnp_device_claim.catalystcenter_version is not none else omit }}"
        configFileUrl: "{{ pnp_device_claim.configFileUrl if pnp_device_claim.configFileUrl is not none else omit }}"
        configId: "{{ pnp_device_claim.configId if pnp_device_claim.configId is not none else omit }}"
        deviceClaimList: "{{ (pnp_device_claim.deviceClaimList | cat_strip_nulls) if (pnp_device_claim.deviceClaimList | cat_strip_nulls) is not none else omit }}"
        fileServiceId: "{{ pnp_device_claim.fileServiceId if pnp_device_claim.fileServiceId is not none else omit }}"
        imageId: "{{ pnp_device_claim.imageId if pnp_device_claim.imageId is not none else omit }}"
        imageUrl: "{{ pnp_device_claim.imageUrl if pnp_device_claim.imageUrl is not none else omit }}"
        populateInventory: "{{ pnp_device_claim.populateInventory if pnp_device_claim.populateInventory is not none else omit }}"
        projectId: "{{ pnp_device_claim.projectId if pnp_device_claim.projectId is not none else omit }}"
        validate_response_schema: "{{ pnp_device_claim.validate_response_schema if pnp_device_claim.validate_response_schema is not none else omit }}"
        workflowId: "{{ pnp_device_claim.workflowId if pnp_device_claim.workflowId is not none else omit }}"
      register: pnp_device_claim_result
      tags:
        - never
        - pnp_device_claim
