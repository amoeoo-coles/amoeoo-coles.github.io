---
# Sample playbook for cisco.catalystcenter.pnp_workflow_info (cisco.catalystcenter 2.15.0)
# Build order: 501
# Information module for Pnp Workflow
# Reads ../models/pnp_workflow_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_workflow_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0501 pnp_workflow_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_workflow_info.yml
  tasks:
    - name: Run pnp_workflow_info from its model
      cisco.catalystcenter.pnp_workflow_info:
        catalystcenter_debug: "{{ pnp_workflow_info.catalystcenter_debug if pnp_workflow_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_workflow_info.catalystcenter_host if pnp_workflow_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_workflow_info.catalystcenter_password if pnp_workflow_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_workflow_info.catalystcenter_port if pnp_workflow_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_workflow_info.catalystcenter_username if pnp_workflow_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_workflow_info.catalystcenter_verify if pnp_workflow_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_workflow_info.catalystcenter_version if pnp_workflow_info.catalystcenter_version is not none else omit }}"
        headers: "{{ pnp_workflow_info.headers if pnp_workflow_info.headers is not none else omit }}"
        id: "{{ pnp_workflow_info.id if pnp_workflow_info.id is not none else omit }}"
        limit: "{{ pnp_workflow_info.limit if pnp_workflow_info.limit is not none else omit }}"
        name: "{{ (pnp_workflow_info.name | cat_strip_nulls) if (pnp_workflow_info.name | cat_strip_nulls) is not none else omit }}"
        offset: "{{ pnp_workflow_info.offset if pnp_workflow_info.offset is not none else omit }}"
        sort: "{{ (pnp_workflow_info.sort | cat_strip_nulls) if (pnp_workflow_info.sort | cat_strip_nulls) is not none else omit }}"
        sortOrder: "{{ pnp_workflow_info.sortOrder if pnp_workflow_info.sortOrder is not none else omit }}"
        type: "{{ (pnp_workflow_info.type | cat_strip_nulls) if (pnp_workflow_info.type | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ pnp_workflow_info.validate_response_schema if pnp_workflow_info.validate_response_schema is not none else omit }}"
      register: pnp_workflow_info_result
