        catalystcenter_username: "{{ tags_interfaces_members_associations_query.catalystcenter_username if tags_interfaces_members_associations_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tags_interfaces_members_associations_query.catalystcenter_verify if tags_interfaces_members_associations_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tags_interfaces_members_associations_query.catalystcenter_version if tags_interfaces_members_associations_query.catalystcenter_version is not none else omit }}"
        ids: "{{ (tags_interfaces_members_associations_query.ids | cat_strip_nulls) if (tags_interfaces_members_associations_query.ids | cat_strip_nulls) is not none else omit }}"
