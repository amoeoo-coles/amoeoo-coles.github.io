---
# Sample playbook for cisco.catalystcenter.accesspoint_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 1313
# Generate YAML configurations playbook for 'accesspoint_workflow_manager' module.
# Reads ../models/accesspoint_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/accesspoint_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags accesspoint_playbook_config_generator.

- name: "1313 accesspoint_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/accesspoint_playbook_config_generator.yml
  tasks:
    - name: Run accesspoint_playbook_config_generator from its model
      cisco.catalystcenter.accesspoint_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ accesspoint_playbook_config_generator.catalystcenter_api_task_timeout if accesspoint_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ accesspoint_playbook_config_generator.catalystcenter_debug if accesspoint_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ accesspoint_playbook_config_generator.catalystcenter_host if accesspoint_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ accesspoint_playbook_config_generator.catalystcenter_log if accesspoint_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ accesspoint_playbook_config_generator.catalystcenter_log_append if accesspoint_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ accesspoint_playbook_config_generator.catalystcenter_log_file_path if accesspoint_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ accesspoint_playbook_config_generator.catalystcenter_log_level if accesspoint_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ accesspoint_playbook_config_generator.catalystcenter_password if accesspoint_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ accesspoint_playbook_config_generator.catalystcenter_port if accesspoint_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ accesspoint_playbook_config_generator.catalystcenter_task_poll_interval if accesspoint_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ accesspoint_playbook_config_generator.catalystcenter_username if accesspoint_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ accesspoint_playbook_config_generator.catalystcenter_verify if accesspoint_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ accesspoint_playbook_config_generator.catalystcenter_version if accesspoint_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (accesspoint_playbook_config_generator.config | cat_strip_nulls) if (accesspoint_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ accesspoint_playbook_config_generator.file_mode if accesspoint_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ accesspoint_playbook_config_generator.file_path if accesspoint_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ accesspoint_playbook_config_generator.state if accesspoint_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ accesspoint_playbook_config_generator.validate_response_schema if accesspoint_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: accesspoint_playbook_config_generator_result
      tags:
        - never
        - accesspoint_playbook_config_generator
