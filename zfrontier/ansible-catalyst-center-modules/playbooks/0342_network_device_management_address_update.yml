---
# Sample playbook for cisco.catalystcenter.network_device_management_address_update (cisco.catalystcenter 2.15.0)
# Build order: 342
# Resource module for Network Device Management Address Update
# Reads ../models/network_device_management_address_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_management_address_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_management_address_update.

- name: "0342 network_device_management_address_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_management_address_update.yml
  tasks:
    - name: Run network_device_management_address_update from its model
      cisco.catalystcenter.network_device_management_address_update:
        catalystcenter_debug: "{{ network_device_management_address_update.catalystcenter_debug if network_device_management_address_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_management_address_update.catalystcenter_host if network_device_management_address_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_management_address_update.catalystcenter_password if network_device_management_address_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_management_address_update.catalystcenter_port if network_device_management_address_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_management_address_update.catalystcenter_username if network_device_management_address_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_management_address_update.catalystcenter_verify if network_device_management_address_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_management_address_update.catalystcenter_version if network_device_management_address_update.catalystcenter_version is not none else omit }}"
        deviceid: "{{ network_device_management_address_update.deviceid if network_device_management_address_update.deviceid is not none else omit }}"
        newIP: "{{ network_device_management_address_update.newIP if network_device_management_address_update.newIP is not none else omit }}"
        validate_response_schema: "{{ network_device_management_address_update.validate_response_schema if network_device_management_address_update.validate_response_schema is not none else omit }}"
      register: network_device_management_address_update_result
      tags:
        - never
        - network_device_management_address_update
