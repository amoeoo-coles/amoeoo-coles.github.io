---
# Sample playbook for cisco.catalystcenter.topology_layer_3_info (cisco.catalystcenter 2.15.0)
# Build order: 1531
# Information module for Topology Layer 3
# Reads ../models/topology_layer_3_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/topology_layer_3_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1531 topology_layer_3_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/topology_layer_3_info.yml
  tasks:
    - name: Run topology_layer_3_info from its model
      cisco.catalystcenter.topology_layer_3_info:
        catalystcenter_debug: "{{ topology_layer_3_info.catalystcenter_debug if topology_layer_3_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ topology_layer_3_info.catalystcenter_host if topology_layer_3_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ topology_layer_3_info.catalystcenter_password if topology_layer_3_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ topology_layer_3_info.catalystcenter_port if topology_layer_3_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ topology_layer_3_info.catalystcenter_username if topology_layer_3_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ topology_layer_3_info.catalystcenter_verify if topology_layer_3_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ topology_layer_3_info.catalystcenter_version if topology_layer_3_info.catalystcenter_version is not none else omit }}"
        headers: "{{ topology_layer_3_info.headers if topology_layer_3_info.headers is not none else omit }}"
        topologyType: "{{ topology_layer_3_info.topologyType if topology_layer_3_info.topologyType is not none else omit }}"
        validate_response_schema: "{{ topology_layer_3_info.validate_response_schema if topology_layer_3_info.validate_response_schema is not none else omit }}"
      register: topology_layer_3_info_result
