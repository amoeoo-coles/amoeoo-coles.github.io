---
# Sample playbook for cisco.catalystcenter.sda_extranet_policies (cisco.catalystcenter 2.15.0)
# Build order: 733
# Resource module for Sda Extranet Policies
# Reads ../models/sda_extranet_policies.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_extranet_policies_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_extranet_policies.

- name: "0733 sda_extranet_policies"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_extranet_policies.yml
  tasks:
    - name: Run sda_extranet_policies from its model
      cisco.catalystcenter.sda_extranet_policies:
        catalystcenter_debug: "{{ sda_extranet_policies.catalystcenter_debug if sda_extranet_policies.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_extranet_policies.catalystcenter_host if sda_extranet_policies.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_extranet_policies.catalystcenter_password if sda_extranet_policies.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_extranet_policies.catalystcenter_port if sda_extranet_policies.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_extranet_policies.catalystcenter_username if sda_extranet_policies.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_extranet_policies.catalystcenter_verify if sda_extranet_policies.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_extranet_policies.catalystcenter_version if sda_extranet_policies.catalystcenter_version is not none else omit }}"
        extranetPolicyName: "{{ sda_extranet_policies.extranetPolicyName if sda_extranet_policies.extranetPolicyName is not none else omit }}"
        id: "{{ sda_extranet_policies.id if sda_extranet_policies.id is not none else omit }}"
        payload: "{{ (sda_extranet_policies.payload | cat_strip_nulls) if (sda_extranet_policies.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_extranet_policies.validate_response_schema if sda_extranet_policies.validate_response_schema is not none else omit }}"
      register: sda_extranet_policies_result
      tags:
        - never
        - sda_extranet_policies
