---
# Sample playbook for cisco.catalystcenter.snmpv2_read_community_credential (cisco.catalystcenter 2.15.0)
# Build order: 280
# Resource module for Snmpv2 Read Community Credential
# Reads ../models/snmpv2_read_community_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/snmpv2_read_community_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags snmpv2_read_community_credential.

- name: "0280 snmpv2_read_community_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/snmpv2_read_community_credential.yml
  tasks:
    - name: Run snmpv2_read_community_credential from its model
      cisco.catalystcenter.snmpv2_read_community_credential:
        catalystcenter_debug: "{{ snmpv2_read_community_credential.catalystcenter_debug if snmpv2_read_community_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ snmpv2_read_community_credential.catalystcenter_host if snmpv2_read_community_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ snmpv2_read_community_credential.catalystcenter_password if snmpv2_read_community_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ snmpv2_read_community_credential.catalystcenter_port if snmpv2_read_community_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ snmpv2_read_community_credential.catalystcenter_username if snmpv2_read_community_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ snmpv2_read_community_credential.catalystcenter_verify if snmpv2_read_community_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ snmpv2_read_community_credential.catalystcenter_version if snmpv2_read_community_credential.catalystcenter_version is not none else omit }}"
        comments: "{{ snmpv2_read_community_credential.comments if snmpv2_read_community_credential.comments is not none else omit }}"
        credentialType: "{{ snmpv2_read_community_credential.credentialType if snmpv2_read_community_credential.credentialType is not none else omit }}"
        description: "{{ snmpv2_read_community_credential.description if snmpv2_read_community_credential.description is not none else omit }}"
        instanceUuid: "{{ snmpv2_read_community_credential.instanceUuid if snmpv2_read_community_credential.instanceUuid is not none else omit }}"
        readCommunity: "{{ snmpv2_read_community_credential.readCommunity if snmpv2_read_community_credential.readCommunity is not none else omit }}"
        validate_response_schema: "{{ snmpv2_read_community_credential.validate_response_schema if snmpv2_read_community_credential.validate_response_schema is not none else omit }}"
      register: snmpv2_read_community_credential_result
      tags:
        - never
        - snmpv2_read_community_credential
