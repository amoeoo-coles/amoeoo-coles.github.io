---
# Sample playbook for cisco.catalystcenter.path_trace_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 1548
# Resource module for managing PathTrace settings in Cisco Catalyst Center
# Reads ../models/path_trace_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/path_trace_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags path_trace_workflow_manager.

- name: "1548 path_trace_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/path_trace_workflow_manager.yml
  tasks:
    - name: Run path_trace_workflow_manager from its model
      cisco.catalystcenter.path_trace_workflow_manager:
        catalystcenter_api_task_timeout: "{{ path_trace_workflow_manager.catalystcenter_api_task_timeout if path_trace_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ path_trace_workflow_manager.catalystcenter_debug if path_trace_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ path_trace_workflow_manager.catalystcenter_host if path_trace_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ path_trace_workflow_manager.catalystcenter_log if path_trace_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ path_trace_workflow_manager.catalystcenter_log_append if path_trace_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ path_trace_workflow_manager.catalystcenter_log_file_path if path_trace_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ path_trace_workflow_manager.catalystcenter_log_level if path_trace_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ path_trace_workflow_manager.catalystcenter_password if path_trace_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ path_trace_workflow_manager.catalystcenter_port if path_trace_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ path_trace_workflow_manager.catalystcenter_task_poll_interval if path_trace_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ path_trace_workflow_manager.catalystcenter_username if path_trace_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ path_trace_workflow_manager.catalystcenter_verify if path_trace_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ path_trace_workflow_manager.catalystcenter_version if path_trace_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (path_trace_workflow_manager.config | cat_strip_nulls) if (path_trace_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ path_trace_workflow_manager.config_verify if path_trace_workflow_manager.config_verify is not none else omit }}"
        state: "{{ path_trace_workflow_manager.state if path_trace_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ path_trace_workflow_manager.validate_response_schema if path_trace_workflow_manager.validate_response_schema is not none else omit }}"
      register: path_trace_workflow_manager_result
      tags:
        - never
        - path_trace_workflow_manager
