---
# Sample playbook for cisco.catalystcenter.configuration_template_import_template (cisco.catalystcenter 2.15.0)
# Build order: 597
# Resource module for Configuration Template Import Template
# Reads ../models/configuration_template_import_template.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_import_template_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_import_template.

- name: "0597 configuration_template_import_template"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_import_template.yml
  tasks:
    - name: Run configuration_template_import_template from its model
      cisco.catalystcenter.configuration_template_import_template:
        catalystcenter_debug: "{{ configuration_template_import_template.catalystcenter_debug if configuration_template_import_template.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_import_template.catalystcenter_host if configuration_template_import_template.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_import_template.catalystcenter_password if configuration_template_import_template.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_import_template.catalystcenter_port if configuration_template_import_template.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_import_template.catalystcenter_username if configuration_template_import_template.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_import_template.catalystcenter_verify if configuration_template_import_template.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_import_template.catalystcenter_version if configuration_template_import_template.catalystcenter_version is not none else omit }}"
        doVersion: "{{ configuration_template_import_template.doVersion if configuration_template_import_template.doVersion is not none else omit }}"
        payload: "{{ (configuration_template_import_template.payload | cat_strip_nulls) if (configuration_template_import_template.payload | cat_strip_nulls) is not none else omit }}"
        projectName: "{{ configuration_template_import_template.projectName if configuration_template_import_template.projectName is not none else omit }}"
        validate_response_schema: "{{ configuration_template_import_template.validate_response_schema if configuration_template_import_template.validate_response_schema is not none else omit }}"
      register: configuration_template_import_template_result
      tags:
        - never
        - configuration_template_import_template
