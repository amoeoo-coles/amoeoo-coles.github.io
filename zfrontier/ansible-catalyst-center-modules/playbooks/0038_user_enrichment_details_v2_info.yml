---
# Sample playbook for cisco.catalystcenter.user_enrichment_details_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 38
# Information module for User Enrichment Details V2
# Reads ../models/user_enrichment_details_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/user_enrichment_details_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0038 user_enrichment_details_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/user_enrichment_details_v2_info.yml
  tasks:
    - name: Run user_enrichment_details_v2_info from its model
      cisco.catalystcenter.user_enrichment_details_v2_info:
        catalystcenter_debug: "{{ user_enrichment_details_v2_info.catalystcenter_debug if user_enrichment_details_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ user_enrichment_details_v2_info.catalystcenter_host if user_enrichment_details_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ user_enrichment_details_v2_info.catalystcenter_password if user_enrichment_details_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ user_enrichment_details_v2_info.catalystcenter_port if user_enrichment_details_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ user_enrichment_details_v2_info.catalystcenter_username if user_enrichment_details_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ user_enrichment_details_v2_info.catalystcenter_verify if user_enrichment_details_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ user_enrichment_details_v2_info.catalystcenter_version if user_enrichment_details_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ user_enrichment_details_v2_info.headers if user_enrichment_details_v2_info.headers is not none else omit }}"
        validate_response_schema: "{{ user_enrichment_details_v2_info.validate_response_schema if user_enrichment_details_v2_info.validate_response_schema is not none else omit }}"
      register: user_enrichment_details_v2_info_result
