---
# Sample playbook for cisco.catalystcenter.site_delete (cisco.catalystcenter 2.15.0)
# Build order: 113
# Resource module for Site Delete
# Reads ../models/site_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags site_delete.

- name: "0113 site_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_delete.yml
  tasks:
    - name: Run site_delete from its model
      cisco.catalystcenter.site_delete:
        catalystcenter_debug: "{{ site_delete.catalystcenter_debug if site_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_delete.catalystcenter_host if site_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_delete.catalystcenter_password if site_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_delete.catalystcenter_port if site_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_delete.catalystcenter_username if site_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_delete.catalystcenter_verify if site_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_delete.catalystcenter_version if site_delete.catalystcenter_version is not none else omit }}"
        siteId: "{{ site_delete.siteId if site_delete.siteId is not none else omit }}"
        validate_response_schema: "{{ site_delete.validate_response_schema if site_delete.validate_response_schema is not none else omit }}"
      register: site_delete_result
      tags:
        - never
        - site_delete
