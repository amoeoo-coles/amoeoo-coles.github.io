---
# Sample playbook for cisco.catalystcenter.sda_pending_fabric_events_info (cisco.catalystcenter 2.15.0)
# Build order: 802
# Information module for Sda Pending Fabric Events
# Reads ../models/sda_pending_fabric_events_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_pending_fabric_events_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0802 sda_pending_fabric_events_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_pending_fabric_events_info.yml
  tasks:
    - name: Run sda_pending_fabric_events_info from its model
      cisco.catalystcenter.sda_pending_fabric_events_info:
        catalystcenter_debug: "{{ sda_pending_fabric_events_info.catalystcenter_debug if sda_pending_fabric_events_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_pending_fabric_events_info.catalystcenter_host if sda_pending_fabric_events_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_pending_fabric_events_info.catalystcenter_password if sda_pending_fabric_events_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_pending_fabric_events_info.catalystcenter_port if sda_pending_fabric_events_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_pending_fabric_events_info.catalystcenter_username if sda_pending_fabric_events_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_pending_fabric_events_info.catalystcenter_verify if sda_pending_fabric_events_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_pending_fabric_events_info.catalystcenter_version if sda_pending_fabric_events_info.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_pending_fabric_events_info.fabricId if sda_pending_fabric_events_info.fabricId is not none else omit }}"
        headers: "{{ sda_pending_fabric_events_info.headers if sda_pending_fabric_events_info.headers is not none else omit }}"
        limit: "{{ sda_pending_fabric_events_info.limit if sda_pending_fabric_events_info.limit is not none else omit }}"
        offset: "{{ sda_pending_fabric_events_info.offset if sda_pending_fabric_events_info.offset is not none else omit }}"
        validate_response_schema: "{{ sda_pending_fabric_events_info.validate_response_schema if sda_pending_fabric_events_info.validate_response_schema is not none else omit }}"
      register: sda_pending_fabric_events_info_result
