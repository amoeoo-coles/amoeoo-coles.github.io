---
# Sample playbook for cisco.catalystcenter.site_count_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 129
# Information module for Site Count V2
# Reads ../models/site_count_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_count_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0129 site_count_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_count_v2_info.yml
  tasks:
    - name: Run site_count_v2_info from its model
      cisco.catalystcenter.site_count_v2_info:
        catalystcenter_debug: "{{ site_count_v2_info.catalystcenter_debug if site_count_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_count_v2_info.catalystcenter_host if site_count_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_count_v2_info.catalystcenter_password if site_count_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_count_v2_info.catalystcenter_port if site_count_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_count_v2_info.catalystcenter_username if site_count_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_count_v2_info.catalystcenter_verify if site_count_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_count_v2_info.catalystcenter_version if site_count_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ site_count_v2_info.headers if site_count_v2_info.headers is not none else omit }}"
        id: "{{ site_count_v2_info.id if site_count_v2_info.id is not none else omit }}"
        validate_response_schema: "{{ site_count_v2_info.validate_response_schema if site_count_v2_info.validate_response_schema is not none else omit }}"
      register: site_count_v2_info_result
