---
# Sample playbook for cisco.catalystcenter.sda_device_role_info (cisco.catalystcenter 2.15.0)
# Build order: 774
# Information module for Sda Device Role
# Reads ../models/sda_device_role_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_device_role_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0774 sda_device_role_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_device_role_info.yml
  tasks:
    - name: Run sda_device_role_info from its model
      cisco.catalystcenter.sda_device_role_info:
        catalystcenter_debug: "{{ sda_device_role_info.catalystcenter_debug if sda_device_role_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_device_role_info.catalystcenter_host if sda_device_role_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_device_role_info.catalystcenter_password if sda_device_role_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_device_role_info.catalystcenter_port if sda_device_role_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_device_role_info.catalystcenter_username if sda_device_role_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_device_role_info.catalystcenter_verify if sda_device_role_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_device_role_info.catalystcenter_version if sda_device_role_info.catalystcenter_version is not none else omit }}"
        deviceManagementIpAddress: "{{ sda_device_role_info.deviceManagementIpAddress if sda_device_role_info.deviceManagementIpAddress is not none else omit }}"
        headers: "{{ sda_device_role_info.headers if sda_device_role_info.headers is not none else omit }}"
        validate_response_schema: "{{ sda_device_role_info.validate_response_schema if sda_device_role_info.validate_response_schema is not none else omit }}"
      register: sda_device_role_info_result
