---
# Sample playbook for cisco.catalystcenter.itsm_cmdb_sync_status_info (cisco.catalystcenter 2.15.0)
# Build order: 90
# Information module for Itsm Cmdb Sync Status
# Reads ../models/itsm_cmdb_sync_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/itsm_cmdb_sync_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0090 itsm_cmdb_sync_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/itsm_cmdb_sync_status_info.yml
  tasks:
    - name: Run itsm_cmdb_sync_status_info from its model
      cisco.catalystcenter.itsm_cmdb_sync_status_info:
        catalystcenter_debug: "{{ itsm_cmdb_sync_status_info.catalystcenter_debug if itsm_cmdb_sync_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ itsm_cmdb_sync_status_info.catalystcenter_host if itsm_cmdb_sync_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ itsm_cmdb_sync_status_info.catalystcenter_password if itsm_cmdb_sync_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ itsm_cmdb_sync_status_info.catalystcenter_port if itsm_cmdb_sync_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ itsm_cmdb_sync_status_info.catalystcenter_username if itsm_cmdb_sync_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ itsm_cmdb_sync_status_info.catalystcenter_verify if itsm_cmdb_sync_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ itsm_cmdb_sync_status_info.catalystcenter_version if itsm_cmdb_sync_status_info.catalystcenter_version is not none else omit }}"
        date: "{{ itsm_cmdb_sync_status_info.date if itsm_cmdb_sync_status_info.date is not none else omit }}"
        headers: "{{ itsm_cmdb_sync_status_info.headers if itsm_cmdb_sync_status_info.headers is not none else omit }}"
        status: "{{ itsm_cmdb_sync_status_info.status if itsm_cmdb_sync_status_info.status is not none else omit }}"
        validate_response_schema: "{{ itsm_cmdb_sync_status_info.validate_response_schema if itsm_cmdb_sync_status_info.validate_response_schema is not none else omit }}"
      register: itsm_cmdb_sync_status_info_result
