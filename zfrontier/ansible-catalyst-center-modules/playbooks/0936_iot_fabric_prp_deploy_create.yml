---
# Sample playbook for cisco.catalystcenter.iot_fabric_prp_deploy_create (cisco.catalystcenter 2.15.0)
# Build order: 936
# Resource module for Iot Fabric Prp Deploy Create
# Reads ../models/iot_fabric_prp_deploy_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_fabric_prp_deploy_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_fabric_prp_deploy_create.

- name: "0936 iot_fabric_prp_deploy_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_fabric_prp_deploy_create.yml
  tasks:
    - name: Run iot_fabric_prp_deploy_create from its model
      cisco.catalystcenter.iot_fabric_prp_deploy_create:
        activityDescription: "{{ iot_fabric_prp_deploy_create.activityDescription if iot_fabric_prp_deploy_create.activityDescription is not none else omit }}"
        allowedVlans: "{{ iot_fabric_prp_deploy_create.allowedVlans if iot_fabric_prp_deploy_create.allowedVlans is not none else omit }}"
        catalystcenter_debug: "{{ iot_fabric_prp_deploy_create.catalystcenter_debug if iot_fabric_prp_deploy_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_fabric_prp_deploy_create.catalystcenter_host if iot_fabric_prp_deploy_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_fabric_prp_deploy_create.catalystcenter_password if iot_fabric_prp_deploy_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_fabric_prp_deploy_create.catalystcenter_port if iot_fabric_prp_deploy_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_fabric_prp_deploy_create.catalystcenter_username if iot_fabric_prp_deploy_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_fabric_prp_deploy_create.catalystcenter_verify if iot_fabric_prp_deploy_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_fabric_prp_deploy_create.catalystcenter_version if iot_fabric_prp_deploy_create.catalystcenter_version is not none else omit }}"
        channelNumber: "{{ iot_fabric_prp_deploy_create.channelNumber if iot_fabric_prp_deploy_create.channelNumber is not none else omit }}"
        description: "{{ iot_fabric_prp_deploy_create.description if iot_fabric_prp_deploy_create.description is not none else omit }}"
        interfaceNames: "{{ (iot_fabric_prp_deploy_create.interfaceNames | cat_strip_nulls) if (iot_fabric_prp_deploy_create.interfaceNames | cat_strip_nulls) is not none else omit }}"
        isPtpEnabled: "{{ iot_fabric_prp_deploy_create.isPtpEnabled if iot_fabric_prp_deploy_create.isPtpEnabled is not none else omit }}"
        isStpBpduFilter: "{{ iot_fabric_prp_deploy_create.isStpBpduFilter if iot_fabric_prp_deploy_create.isStpBpduFilter is not none else omit }}"
        isStpPortfastTrunk: "{{ iot_fabric_prp_deploy_create.isStpPortfastTrunk if iot_fabric_prp_deploy_create.isStpPortfastTrunk is not none else omit }}"
        lanBDeviceDetails: "{{ (iot_fabric_prp_deploy_create.lanBDeviceDetails | cat_strip_nulls) if (iot_fabric_prp_deploy_create.lanBDeviceDetails | cat_strip_nulls) is not none else omit }}"
        networkDeviceId: "{{ iot_fabric_prp_deploy_create.networkDeviceId if iot_fabric_prp_deploy_create.networkDeviceId is not none else omit }}"
        supervisionFrameOption: "{{ (iot_fabric_prp_deploy_create.supervisionFrameOption | cat_strip_nulls) if (iot_fabric_prp_deploy_create.supervisionFrameOption | cat_strip_nulls) is not none else omit }}"
        switchPortMode: "{{ iot_fabric_prp_deploy_create.switchPortMode if iot_fabric_prp_deploy_create.switchPortMode is not none else omit }}"
        validate_response_schema: "{{ iot_fabric_prp_deploy_create.validate_response_schema if iot_fabric_prp_deploy_create.validate_response_schema is not none else omit }}"
      register: iot_fabric_prp_deploy_create_result
      tags:
        - never
        - iot_fabric_prp_deploy_create
