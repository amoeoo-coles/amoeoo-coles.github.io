---
# Sample playbook for cisco.catalystcenter.sites_telemetry_settings (cisco.catalystcenter 2.15.0)
# Build order: 211
# Resource module for Sites Telemetry Settings
# Reads ../models/sites_telemetry_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_telemetry_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sites_telemetry_settings.

- name: "0211 sites_telemetry_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_telemetry_settings.yml
  tasks:
    - name: Run sites_telemetry_settings from its model
      cisco.catalystcenter.sites_telemetry_settings:
        applicationVisibility: "{{ (sites_telemetry_settings.applicationVisibility | cat_strip_nulls) if (sites_telemetry_settings.applicationVisibility | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ sites_telemetry_settings.catalystcenter_debug if sites_telemetry_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_telemetry_settings.catalystcenter_host if sites_telemetry_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_telemetry_settings.catalystcenter_password if sites_telemetry_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_telemetry_settings.catalystcenter_port if sites_telemetry_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_telemetry_settings.catalystcenter_username if sites_telemetry_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_telemetry_settings.catalystcenter_verify if sites_telemetry_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_telemetry_settings.catalystcenter_version if sites_telemetry_settings.catalystcenter_version is not none else omit }}"
        id: "{{ sites_telemetry_settings.id if sites_telemetry_settings.id is not none else omit }}"
        snmpTraps: "{{ (sites_telemetry_settings.snmpTraps | cat_strip_nulls) if (sites_telemetry_settings.snmpTraps | cat_strip_nulls) is not none else omit }}"
        syslogs: "{{ (sites_telemetry_settings.syslogs | cat_strip_nulls) if (sites_telemetry_settings.syslogs | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sites_telemetry_settings.validate_response_schema if sites_telemetry_settings.validate_response_schema is not none else omit }}"
        wiredDataCollection: "{{ (sites_telemetry_settings.wiredDataCollection | cat_strip_nulls) if (sites_telemetry_settings.wiredDataCollection | cat_strip_nulls) is not none else omit }}"
        wirelessTelemetry: "{{ (sites_telemetry_settings.wirelessTelemetry | cat_strip_nulls) if (sites_telemetry_settings.wirelessTelemetry | cat_strip_nulls) is not none else omit }}"
      register: sites_telemetry_settings_result
      tags:
        - never
        - sites_telemetry_settings
