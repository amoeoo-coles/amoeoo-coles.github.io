---
# Sample playbook for cisco.catalystcenter.license_status_info (cisco.catalystcenter 2.15.0)
# Build order: 526
# Information module for License Status
# Reads ../models/license_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/license_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0526 license_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/license_status_info.yml
  tasks:
    - name: Run license_status_info from its model
      cisco.catalystcenter.license_status_info:
        catalystcenter_debug: "{{ license_status_info.catalystcenter_debug if license_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ license_status_info.catalystcenter_host if license_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ license_status_info.catalystcenter_password if license_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ license_status_info.catalystcenter_port if license_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ license_status_info.catalystcenter_username if license_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ license_status_info.catalystcenter_verify if license_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ license_status_info.catalystcenter_version if license_status_info.catalystcenter_version is not none else omit }}"
        headers: "{{ license_status_info.headers if license_status_info.headers is not none else omit }}"
        validate_response_schema: "{{ license_status_info.validate_response_schema if license_status_info.validate_response_schema is not none else omit }}"
      register: license_status_info_result
