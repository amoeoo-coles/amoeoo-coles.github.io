---
# Sample playbook for cisco.catalystcenter.dhcp_services_info (cisco.catalystcenter 2.15.0)
# Build order: 401
# Information module for Dhcp Services
# Reads ../models/dhcp_services_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dhcp_services_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0401 dhcp_services_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dhcp_services_info.yml
  tasks:
    - name: Run dhcp_services_info from its model
      cisco.catalystcenter.dhcp_services_info:
        catalystcenter_debug: "{{ dhcp_services_info.catalystcenter_debug if dhcp_services_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dhcp_services_info.catalystcenter_host if dhcp_services_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dhcp_services_info.catalystcenter_password if dhcp_services_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dhcp_services_info.catalystcenter_port if dhcp_services_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dhcp_services_info.catalystcenter_username if dhcp_services_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dhcp_services_info.catalystcenter_verify if dhcp_services_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dhcp_services_info.catalystcenter_version if dhcp_services_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ dhcp_services_info.deviceId if dhcp_services_info.deviceId is not none else omit }}"
        deviceName: "{{ dhcp_services_info.deviceName if dhcp_services_info.deviceName is not none else omit }}"
        deviceSiteHierarchy: "{{ dhcp_services_info.deviceSiteHierarchy if dhcp_services_info.deviceSiteHierarchy is not none else omit }}"
        deviceSiteHierarchyId: "{{ dhcp_services_info.deviceSiteHierarchyId if dhcp_services_info.deviceSiteHierarchyId is not none else omit }}"
        deviceSiteId: "{{ dhcp_services_info.deviceSiteId if dhcp_services_info.deviceSiteId is not none else omit }}"
        endTime: "{{ dhcp_services_info.endTime if dhcp_services_info.endTime is not none else omit }}"
        headers: "{{ dhcp_services_info.headers if dhcp_services_info.headers is not none else omit }}"
        id: "{{ dhcp_services_info.id if dhcp_services_info.id is not none else omit }}"
        limit: "{{ dhcp_services_info.limit if dhcp_services_info.limit is not none else omit }}"
        offset: "{{ dhcp_services_info.offset if dhcp_services_info.offset is not none else omit }}"
        order: "{{ dhcp_services_info.order if dhcp_services_info.order is not none else omit }}"
        serverIp: "{{ dhcp_services_info.serverIp if dhcp_services_info.serverIp is not none else omit }}"
        sortBy: "{{ dhcp_services_info.sortBy if dhcp_services_info.sortBy is not none else omit }}"
        startTime: "{{ dhcp_services_info.startTime if dhcp_services_info.startTime is not none else omit }}"
        validate_response_schema: "{{ dhcp_services_info.validate_response_schema if dhcp_services_info.validate_response_schema is not none else omit }}"
      register: dhcp_services_info_result
