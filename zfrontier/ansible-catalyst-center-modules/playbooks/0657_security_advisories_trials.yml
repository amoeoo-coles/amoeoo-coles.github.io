---
# Sample playbook for cisco.catalystcenter.security_advisories_trials (cisco.catalystcenter 2.15.0)
# Build order: 657
# Resource module for Security Advisories Trials
# Reads ../models/security_advisories_trials.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_advisories_trials_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_advisories_trials.

- name: "0657 security_advisories_trials"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_advisories_trials.yml
  tasks:
    - name: Run security_advisories_trials from its model
      cisco.catalystcenter.security_advisories_trials:
        catalystcenter_debug: "{{ security_advisories_trials.catalystcenter_debug if security_advisories_trials.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_advisories_trials.catalystcenter_host if security_advisories_trials.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_advisories_trials.catalystcenter_password if security_advisories_trials.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_advisories_trials.catalystcenter_port if security_advisories_trials.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_advisories_trials.catalystcenter_username if security_advisories_trials.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_advisories_trials.catalystcenter_verify if security_advisories_trials.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_advisories_trials.catalystcenter_version if security_advisories_trials.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ security_advisories_trials.validate_response_schema if security_advisories_trials.validate_response_schema is not none else omit }}"
      register: security_advisories_trials_result
      tags:
        - never
        - security_advisories_trials
