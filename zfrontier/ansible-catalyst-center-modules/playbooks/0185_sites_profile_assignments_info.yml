---
# Sample playbook for cisco.catalystcenter.sites_profile_assignments_info (cisco.catalystcenter 2.15.0)
# Build order: 185
# Information module for Sites Profile Assignments
# Reads ../models/sites_profile_assignments_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_profile_assignments_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0185 sites_profile_assignments_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_profile_assignments_info.yml
  tasks:
    - name: Run sites_profile_assignments_info from its model
      cisco.catalystcenter.sites_profile_assignments_info:
        catalystcenter_debug: "{{ sites_profile_assignments_info.catalystcenter_debug if sites_profile_assignments_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_profile_assignments_info.catalystcenter_host if sites_profile_assignments_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_profile_assignments_info.catalystcenter_password if sites_profile_assignments_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_profile_assignments_info.catalystcenter_port if sites_profile_assignments_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_profile_assignments_info.catalystcenter_username if sites_profile_assignments_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_profile_assignments_info.catalystcenter_verify if sites_profile_assignments_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_profile_assignments_info.catalystcenter_version if sites_profile_assignments_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sites_profile_assignments_info.headers if sites_profile_assignments_info.headers is not none else omit }}"
        limit: "{{ sites_profile_assignments_info.limit if sites_profile_assignments_info.limit is not none else omit }}"
        offset: "{{ sites_profile_assignments_info.offset if sites_profile_assignments_info.offset is not none else omit }}"
        siteId: "{{ sites_profile_assignments_info.siteId if sites_profile_assignments_info.siteId is not none else omit }}"
        validate_response_schema: "{{ sites_profile_assignments_info.validate_response_schema if sites_profile_assignments_info.validate_response_schema is not none else omit }}"
      register: sites_profile_assignments_info_result
