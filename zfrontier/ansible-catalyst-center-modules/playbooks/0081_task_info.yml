---
# Sample playbook for cisco.catalystcenter.task_info (cisco.catalystcenter 2.15.0)
# Build order: 81
# Information module for Task
# Reads ../models/task_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/task_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0081 task_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/task_info.yml
  tasks:
    - name: Run task_info from its model
      cisco.catalystcenter.task_info:
        catalystcenter_debug: "{{ task_info.catalystcenter_debug if task_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ task_info.catalystcenter_host if task_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ task_info.catalystcenter_password if task_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ task_info.catalystcenter_port if task_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ task_info.catalystcenter_username if task_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ task_info.catalystcenter_verify if task_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ task_info.catalystcenter_version if task_info.catalystcenter_version is not none else omit }}"
        data: "{{ task_info.data if task_info.data is not none else omit }}"
        endTime: "{{ task_info.endTime if task_info.endTime is not none else omit }}"
        errorCode: "{{ task_info.errorCode if task_info.errorCode is not none else omit }}"
        failureReason: "{{ task_info.failureReason if task_info.failureReason is not none else omit }}"
        headers: "{{ task_info.headers if task_info.headers is not none else omit }}"
        isError: "{{ task_info.isError if task_info.isError is not none else omit }}"
        limit: "{{ task_info.limit if task_info.limit is not none else omit }}"
        offset: "{{ task_info.offset if task_info.offset is not none else omit }}"
        order: "{{ task_info.order if task_info.order is not none else omit }}"
        parentId: "{{ task_info.parentId if task_info.parentId is not none else omit }}"
        progress: "{{ task_info.progress if task_info.progress is not none else omit }}"
        serviceType: "{{ task_info.serviceType if task_info.serviceType is not none else omit }}"
        sortBy: "{{ task_info.sortBy if task_info.sortBy is not none else omit }}"
        startTime: "{{ task_info.startTime if task_info.startTime is not none else omit }}"
        taskId: "{{ task_info.taskId if task_info.taskId is not none else omit }}"
        username: "{{ task_info.username if task_info.username is not none else omit }}"
        validate_response_schema: "{{ task_info.validate_response_schema if task_info.validate_response_schema is not none else omit }}"
      register: task_info_result
