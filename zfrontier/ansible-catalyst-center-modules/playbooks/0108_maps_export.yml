---
# Sample playbook for cisco.catalystcenter.maps_export (cisco.catalystcenter 2.15.0)
# Build order: 108
# Resource module for Maps Export
# Reads ../models/maps_export.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/maps_export_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags maps_export.

- name: "0108 maps_export"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/maps_export.yml
  tasks:
    - name: Run maps_export from its model
      cisco.catalystcenter.maps_export:
        catalystcenter_debug: "{{ maps_export.catalystcenter_debug if maps_export.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ maps_export.catalystcenter_host if maps_export.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ maps_export.catalystcenter_password if maps_export.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ maps_export.catalystcenter_port if maps_export.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ maps_export.catalystcenter_username if maps_export.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ maps_export.catalystcenter_verify if maps_export.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ maps_export.catalystcenter_version if maps_export.catalystcenter_version is not none else omit }}"
        siteHierarchyUuid: "{{ maps_export.siteHierarchyUuid if maps_export.siteHierarchyUuid is not none else omit }}"
        validate_response_schema: "{{ maps_export.validate_response_schema if maps_export.validate_response_schema is not none else omit }}"
      register: maps_export_result
      tags:
        - never
        - maps_export
