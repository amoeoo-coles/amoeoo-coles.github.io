---
# Sample playbook for cisco.catalystcenter.network_device_update_role (cisco.catalystcenter 2.15.0)
# Build order: 345
# Resource module for Network Device Update Role
# Reads ../models/network_device_update_role.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_update_role_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_update_role.

- name: "0345 network_device_update_role"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_update_role.yml
  tasks:
    - name: Run network_device_update_role from its model
      cisco.catalystcenter.network_device_update_role:
        catalystcenter_debug: "{{ network_device_update_role.catalystcenter_debug if network_device_update_role.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_update_role.catalystcenter_host if network_device_update_role.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_update_role.catalystcenter_password if network_device_update_role.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_update_role.catalystcenter_port if network_device_update_role.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_update_role.catalystcenter_username if network_device_update_role.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_update_role.catalystcenter_verify if network_device_update_role.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_update_role.catalystcenter_version if network_device_update_role.catalystcenter_version is not none else omit }}"
        id: "{{ network_device_update_role.id if network_device_update_role.id is not none else omit }}"
        role: "{{ network_device_update_role.role if network_device_update_role.role is not none else omit }}"
        roleSource: "{{ network_device_update_role.roleSource if network_device_update_role.roleSource is not none else omit }}"
        validate_response_schema: "{{ network_device_update_role.validate_response_schema if network_device_update_role.validate_response_schema is not none else omit }}"
      register: network_device_update_role_result
      tags:
        - never
        - network_device_update_role
