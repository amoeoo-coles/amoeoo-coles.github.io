---
# Sample playbook for cisco.catalystcenter.dna_event_snmp_config_info (cisco.catalystcenter 2.15.0)
# Build order: 1489
# Information module for Dna Event Snmp Config
# Reads ../models/dna_event_snmp_config_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dna_event_snmp_config_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1489 dna_event_snmp_config_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dna_event_snmp_config_info.yml
  tasks:
    - name: Run dna_event_snmp_config_info from its model
      cisco.catalystcenter.dna_event_snmp_config_info:
        catalystcenter_debug: "{{ dna_event_snmp_config_info.catalystcenter_debug if dna_event_snmp_config_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dna_event_snmp_config_info.catalystcenter_host if dna_event_snmp_config_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dna_event_snmp_config_info.catalystcenter_password if dna_event_snmp_config_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dna_event_snmp_config_info.catalystcenter_port if dna_event_snmp_config_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dna_event_snmp_config_info.catalystcenter_username if dna_event_snmp_config_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dna_event_snmp_config_info.catalystcenter_verify if dna_event_snmp_config_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dna_event_snmp_config_info.catalystcenter_version if dna_event_snmp_config_info.catalystcenter_version is not none else omit }}"
        configId: "{{ dna_event_snmp_config_info.configId if dna_event_snmp_config_info.configId is not none else omit }}"
        headers: "{{ dna_event_snmp_config_info.headers if dna_event_snmp_config_info.headers is not none else omit }}"
        limit: "{{ dna_event_snmp_config_info.limit if dna_event_snmp_config_info.limit is not none else omit }}"
        offset: "{{ dna_event_snmp_config_info.offset if dna_event_snmp_config_info.offset is not none else omit }}"
        order: "{{ dna_event_snmp_config_info.order if dna_event_snmp_config_info.order is not none else omit }}"
        sortBy: "{{ dna_event_snmp_config_info.sortBy if dna_event_snmp_config_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ dna_event_snmp_config_info.validate_response_schema if dna_event_snmp_config_info.validate_response_schema is not none else omit }}"
      register: dna_event_snmp_config_info_result
