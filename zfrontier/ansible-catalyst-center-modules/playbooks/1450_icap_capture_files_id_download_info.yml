---
# Sample playbook for cisco.catalystcenter.icap_capture_files_id_download_info (cisco.catalystcenter 2.15.0)
# Build order: 1450
# Information module for Icap Capture Files Id Download
# Reads ../models/icap_capture_files_id_download_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/icap_capture_files_id_download_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1450 icap_capture_files_id_download_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/icap_capture_files_id_download_info.yml
  tasks:
    - name: Run icap_capture_files_id_download_info from its model
      cisco.catalystcenter.icap_capture_files_id_download_info:
        catalystcenter_debug: "{{ icap_capture_files_id_download_info.catalystcenter_debug if icap_capture_files_id_download_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ icap_capture_files_id_download_info.catalystcenter_host if icap_capture_files_id_download_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ icap_capture_files_id_download_info.catalystcenter_password if icap_capture_files_id_download_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ icap_capture_files_id_download_info.catalystcenter_port if icap_capture_files_id_download_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ icap_capture_files_id_download_info.catalystcenter_username if icap_capture_files_id_download_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ icap_capture_files_id_download_info.catalystcenter_verify if icap_capture_files_id_download_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ icap_capture_files_id_download_info.catalystcenter_version if icap_capture_files_id_download_info.catalystcenter_version is not none else omit }}"
        headers: "{{ icap_capture_files_id_download_info.headers if icap_capture_files_id_download_info.headers is not none else omit }}"
        id: "{{ icap_capture_files_id_download_info.id if icap_capture_files_id_download_info.id is not none else omit }}"
        validate_response_schema: "{{ icap_capture_files_id_download_info.validate_response_schema if icap_capture_files_id_download_info.validate_response_schema is not none else omit }}"
      register: icap_capture_files_id_download_info_result
