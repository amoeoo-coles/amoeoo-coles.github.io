---
# Sample playbook for cisco.catalystcenter.icap_settings_configuration_models (cisco.catalystcenter 2.15.0)
# Build order: 1438
# Resource module for Icap Settings Configuration Models
# Reads ../models/icap_settings_configuration_models.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/icap_settings_configuration_models_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags icap_settings_configuration_models.

- name: "1438 icap_settings_configuration_models"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/icap_settings_configuration_models.yml
  tasks:
    - name: Run icap_settings_configuration_models from its model
      cisco.catalystcenter.icap_settings_configuration_models:
        catalystcenter_debug: "{{ icap_settings_configuration_models.catalystcenter_debug if icap_settings_configuration_models.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ icap_settings_configuration_models.catalystcenter_host if icap_settings_configuration_models.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ icap_settings_configuration_models.catalystcenter_password if icap_settings_configuration_models.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ icap_settings_configuration_models.catalystcenter_port if icap_settings_configuration_models.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ icap_settings_configuration_models.catalystcenter_username if icap_settings_configuration_models.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ icap_settings_configuration_models.catalystcenter_verify if icap_settings_configuration_models.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ icap_settings_configuration_models.catalystcenter_version if icap_settings_configuration_models.catalystcenter_version is not none else omit }}"
        payload: "{{ (icap_settings_configuration_models.payload | cat_strip_nulls) if (icap_settings_configuration_models.payload | cat_strip_nulls) is not none else omit }}"
        previewDescription: "{{ icap_settings_configuration_models.previewDescription if icap_settings_configuration_models.previewDescription is not none else omit }}"
        validate_response_schema: "{{ icap_settings_configuration_models.validate_response_schema if icap_settings_configuration_models.validate_response_schema is not none else omit }}"
      register: icap_settings_configuration_models_result
      tags:
        - never
        - icap_settings_configuration_models
