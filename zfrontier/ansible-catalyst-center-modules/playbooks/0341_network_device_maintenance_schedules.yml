---
# Sample playbook for cisco.catalystcenter.network_device_maintenance_schedules (cisco.catalystcenter 2.15.0)
# Build order: 341
# Resource module for Network Device Maintenance Schedules
# Reads ../models/network_device_maintenance_schedules.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_maintenance_schedules_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_maintenance_schedules.

- name: "0341 network_device_maintenance_schedules"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_maintenance_schedules.yml
  tasks:
    - name: Run network_device_maintenance_schedules from its model
      cisco.catalystcenter.network_device_maintenance_schedules:
        catalystcenter_debug: "{{ network_device_maintenance_schedules.catalystcenter_debug if network_device_maintenance_schedules.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_maintenance_schedules.catalystcenter_host if network_device_maintenance_schedules.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_maintenance_schedules.catalystcenter_password if network_device_maintenance_schedules.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_maintenance_schedules.catalystcenter_port if network_device_maintenance_schedules.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_maintenance_schedules.catalystcenter_username if network_device_maintenance_schedules.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_maintenance_schedules.catalystcenter_verify if network_device_maintenance_schedules.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_maintenance_schedules.catalystcenter_version if network_device_maintenance_schedules.catalystcenter_version is not none else omit }}"
        description: "{{ network_device_maintenance_schedules.description if network_device_maintenance_schedules.description is not none else omit }}"
        id: "{{ network_device_maintenance_schedules.id if network_device_maintenance_schedules.id is not none else omit }}"
        maintenanceSchedule: "{{ (network_device_maintenance_schedules.maintenanceSchedule | cat_strip_nulls) if (network_device_maintenance_schedules.maintenanceSchedule | cat_strip_nulls) is not none else omit }}"
        networkDeviceIds: "{{ (network_device_maintenance_schedules.networkDeviceIds | cat_strip_nulls) if (network_device_maintenance_schedules.networkDeviceIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ network_device_maintenance_schedules.validate_response_schema if network_device_maintenance_schedules.validate_response_schema is not none else omit }}"
      register: network_device_maintenance_schedules_result
      tags:
        - never
        - network_device_maintenance_schedules
