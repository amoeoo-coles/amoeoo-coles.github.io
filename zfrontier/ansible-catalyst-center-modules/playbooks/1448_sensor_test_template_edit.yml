---
# Sample playbook for cisco.catalystcenter.sensor_test_template_edit (cisco.catalystcenter 2.15.0)
# Build order: 1448
# Resource module for Sensor Test Template Edit
# Reads ../models/sensor_test_template_edit.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sensor_test_template_edit_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sensor_test_template_edit.

- name: "1448 sensor_test_template_edit"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sensor_test_template_edit.yml
  tasks:
    - name: Run sensor_test_template_edit from its model
      cisco.catalystcenter.sensor_test_template_edit:
        _id: "{{ sensor_test_template_edit._id if sensor_test_template_edit._id is not none else omit }}"
        actionInProgress: "{{ sensor_test_template_edit.actionInProgress if sensor_test_template_edit.actionInProgress is not none else omit }}"
        apCoverage: "{{ (sensor_test_template_edit.apCoverage | cat_strip_nulls) if (sensor_test_template_edit.apCoverage | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ sensor_test_template_edit.catalystcenter_debug if sensor_test_template_edit.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sensor_test_template_edit.catalystcenter_host if sensor_test_template_edit.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sensor_test_template_edit.catalystcenter_password if sensor_test_template_edit.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sensor_test_template_edit.catalystcenter_port if sensor_test_template_edit.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sensor_test_template_edit.catalystcenter_username if sensor_test_template_edit.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sensor_test_template_edit.catalystcenter_verify if sensor_test_template_edit.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sensor_test_template_edit.catalystcenter_version if sensor_test_template_edit.catalystcenter_version is not none else omit }}"
        connection: "{{ sensor_test_template_edit.connection if sensor_test_template_edit.connection is not none else omit }}"
        encryptionMode: "{{ sensor_test_template_edit.encryptionMode if sensor_test_template_edit.encryptionMode is not none else omit }}"
        frequency: "{{ (sensor_test_template_edit.frequency | cat_strip_nulls) if (sensor_test_template_edit.frequency | cat_strip_nulls) is not none else omit }}"
        lastModifiedTime: "{{ sensor_test_template_edit.lastModifiedTime if sensor_test_template_edit.lastModifiedTime is not none else omit }}"
        location: "{{ sensor_test_template_edit.location if sensor_test_template_edit.location is not none else omit }}"
        locationInfoList: "{{ (sensor_test_template_edit.locationInfoList | cat_strip_nulls) if (sensor_test_template_edit.locationInfoList | cat_strip_nulls) is not none else omit }}"
        modelVersion: "{{ sensor_test_template_edit.modelVersion if sensor_test_template_edit.modelVersion is not none else omit }}"
        name: "{{ sensor_test_template_edit.name if sensor_test_template_edit.name is not none else omit }}"
        numAssociatedSensor: "{{ sensor_test_template_edit.numAssociatedSensor if sensor_test_template_edit.numAssociatedSensor is not none else omit }}"
        numNeighborAPThreshold: "{{ sensor_test_template_edit.numNeighborAPThreshold if sensor_test_template_edit.numNeighborAPThreshold is not none else omit }}"
        profiles: "{{ (sensor_test_template_edit.profiles | cat_strip_nulls) if (sensor_test_template_edit.profiles | cat_strip_nulls) is not none else omit }}"
        radioAsSensorRemoved: "{{ sensor_test_template_edit.radioAsSensorRemoved if sensor_test_template_edit.radioAsSensorRemoved is not none else omit }}"
        rssiThreshold: "{{ sensor_test_template_edit.rssiThreshold if sensor_test_template_edit.rssiThreshold is not none else omit }}"
        runNow: "{{ sensor_test_template_edit.runNow if sensor_test_template_edit.runNow is not none else omit }}"
        scheduleInDays: "{{ sensor_test_template_edit.scheduleInDays if sensor_test_template_edit.scheduleInDays is not none else omit }}"
        sensors: "{{ (sensor_test_template_edit.sensors | cat_strip_nulls) if (sensor_test_template_edit.sensors | cat_strip_nulls) is not none else omit }}"
        showWlcUpgradeBanner: "{{ sensor_test_template_edit.showWlcUpgradeBanner if sensor_test_template_edit.showWlcUpgradeBanner is not none else omit }}"
        siteHierarchy: "{{ sensor_test_template_edit.siteHierarchy if sensor_test_template_edit.siteHierarchy is not none else omit }}"
        ssids: "{{ (sensor_test_template_edit.ssids | cat_strip_nulls) if (sensor_test_template_edit.ssids | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ sensor_test_template_edit.startTime if sensor_test_template_edit.startTime is not none else omit }}"
        status: "{{ sensor_test_template_edit.status if sensor_test_template_edit.status is not none else omit }}"
        templateName: "{{ sensor_test_template_edit.templateName if sensor_test_template_edit.templateName is not none else omit }}"
        testScheduleMode: "{{ sensor_test_template_edit.testScheduleMode if sensor_test_template_edit.testScheduleMode is not none else omit }}"
        validate_response_schema: "{{ sensor_test_template_edit.validate_response_schema if sensor_test_template_edit.validate_response_schema is not none else omit }}"
        version: "{{ sensor_test_template_edit.version if sensor_test_template_edit.version is not none else omit }}"
        wlans: "{{ (sensor_test_template_edit.wlans | cat_strip_nulls) if (sensor_test_template_edit.wlans | cat_strip_nulls) is not none else omit }}"
      register: sensor_test_template_edit_result
      tags:
        - never
        - sensor_test_template_edit
