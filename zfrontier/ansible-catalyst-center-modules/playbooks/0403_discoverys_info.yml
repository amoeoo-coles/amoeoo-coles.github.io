---
# Sample playbook for cisco.catalystcenter.discoverys_info (cisco.catalystcenter 2.15.0)
# Build order: 403
# Information module for Discoverys
# Reads ../models/discoverys_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discoverys_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0403 discoverys_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discoverys_info.yml
  tasks:
    - name: Run discoverys_info from its model
      cisco.catalystcenter.discoverys_info:
        catalystcenter_debug: "{{ discoverys_info.catalystcenter_debug if discoverys_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discoverys_info.catalystcenter_host if discoverys_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discoverys_info.catalystcenter_password if discoverys_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discoverys_info.catalystcenter_port if discoverys_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discoverys_info.catalystcenter_username if discoverys_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discoverys_info.catalystcenter_verify if discoverys_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discoverys_info.catalystcenter_version if discoverys_info.catalystcenter_version is not none else omit }}"
        headers: "{{ discoverys_info.headers if discoverys_info.headers is not none else omit }}"
        id: "{{ (discoverys_info.id | cat_strip_nulls) if (discoverys_info.id | cat_strip_nulls) is not none else omit }}"
        limit: "{{ discoverys_info.limit if discoverys_info.limit is not none else omit }}"
        name: "{{ discoverys_info.name if discoverys_info.name is not none else omit }}"
        offset: "{{ discoverys_info.offset if discoverys_info.offset is not none else omit }}"
        validate_response_schema: "{{ discoverys_info.validate_response_schema if discoverys_info.validate_response_schema is not none else omit }}"
      register: discoverys_info_result
