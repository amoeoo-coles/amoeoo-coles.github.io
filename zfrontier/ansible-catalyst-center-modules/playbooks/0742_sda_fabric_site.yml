---
# Sample playbook for cisco.catalystcenter.sda_fabric_site (cisco.catalystcenter 2.15.0)
# Build order: 742
# Resource module for Sda Fabric Site
# Reads ../models/sda_fabric_site.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabric_site_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_fabric_site.

- name: "0742 sda_fabric_site"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabric_site.yml
  tasks:
    - name: Run sda_fabric_site from its model
      cisco.catalystcenter.sda_fabric_site:
        catalystcenter_debug: "{{ sda_fabric_site.catalystcenter_debug if sda_fabric_site.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabric_site.catalystcenter_host if sda_fabric_site.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabric_site.catalystcenter_password if sda_fabric_site.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabric_site.catalystcenter_port if sda_fabric_site.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabric_site.catalystcenter_username if sda_fabric_site.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabric_site.catalystcenter_verify if sda_fabric_site.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabric_site.catalystcenter_version if sda_fabric_site.catalystcenter_version is not none else omit }}"
        fabricName: "{{ sda_fabric_site.fabricName if sda_fabric_site.fabricName is not none else omit }}"
        fabricType: "{{ sda_fabric_site.fabricType if sda_fabric_site.fabricType is not none else omit }}"
        siteNameHierarchy: "{{ sda_fabric_site.siteNameHierarchy if sda_fabric_site.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ sda_fabric_site.validate_response_schema if sda_fabric_site.validate_response_schema is not none else omit }}"
      register: sda_fabric_site_result
      tags:
        - never
        - sda_fabric_site
