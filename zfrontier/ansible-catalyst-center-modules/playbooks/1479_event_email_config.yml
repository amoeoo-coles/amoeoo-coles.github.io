---
# Sample playbook for cisco.catalystcenter.event_email_config (cisco.catalystcenter 2.15.0)
# Build order: 1479
# Resource module for Event Email Config
# Reads ../models/event_email_config.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_email_config_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_email_config.

- name: "1479 event_email_config"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_email_config.yml
  tasks:
    - name: Run event_email_config from its model
      cisco.catalystcenter.event_email_config:
        catalystcenter_debug: "{{ event_email_config.catalystcenter_debug if event_email_config.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_email_config.catalystcenter_host if event_email_config.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_email_config.catalystcenter_password if event_email_config.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_email_config.catalystcenter_port if event_email_config.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_email_config.catalystcenter_username if event_email_config.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_email_config.catalystcenter_verify if event_email_config.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_email_config.catalystcenter_version if event_email_config.catalystcenter_version is not none else omit }}"
        emailConfigId: "{{ event_email_config.emailConfigId if event_email_config.emailConfigId is not none else omit }}"
        fromEmail: "{{ event_email_config.fromEmail if event_email_config.fromEmail is not none else omit }}"
        primarySMTPConfig: "{{ (event_email_config.primarySMTPConfig | cat_strip_nulls) if (event_email_config.primarySMTPConfig | cat_strip_nulls) is not none else omit }}"
        secondarySMTPConfig: "{{ (event_email_config.secondarySMTPConfig | cat_strip_nulls) if (event_email_config.secondarySMTPConfig | cat_strip_nulls) is not none else omit }}"
        subject: "{{ event_email_config.subject if event_email_config.subject is not none else omit }}"
        toEmail: "{{ event_email_config.toEmail if event_email_config.toEmail is not none else omit }}"
        validate_response_schema: "{{ event_email_config.validate_response_schema if event_email_config.validate_response_schema is not none else omit }}"
      register: event_email_config_result
      tags:
        - never
        - event_email_config
