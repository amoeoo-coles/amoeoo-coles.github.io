---
# Sample playbook for cisco.catalystcenter.network_bugs_results_trend_count_info (cisco.catalystcenter 2.15.0)
# Build order: 710
# Information module for Network Bugs Results Trend Count
# Reads ../models/network_bugs_results_trend_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_bugs_results_trend_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0710 network_bugs_results_trend_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_bugs_results_trend_count_info.yml
  tasks:
    - name: Run network_bugs_results_trend_count_info from its model
      cisco.catalystcenter.network_bugs_results_trend_count_info:
        catalystcenter_debug: "{{ network_bugs_results_trend_count_info.catalystcenter_debug if network_bugs_results_trend_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_bugs_results_trend_count_info.catalystcenter_host if network_bugs_results_trend_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_bugs_results_trend_count_info.catalystcenter_password if network_bugs_results_trend_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_bugs_results_trend_count_info.catalystcenter_port if network_bugs_results_trend_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_bugs_results_trend_count_info.catalystcenter_username if network_bugs_results_trend_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_bugs_results_trend_count_info.catalystcenter_verify if network_bugs_results_trend_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_bugs_results_trend_count_info.catalystcenter_version if network_bugs_results_trend_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ network_bugs_results_trend_count_info.headers if network_bugs_results_trend_count_info.headers is not none else omit }}"
        scanTime: "{{ network_bugs_results_trend_count_info.scanTime if network_bugs_results_trend_count_info.scanTime is not none else omit }}"
        validate_response_schema: "{{ network_bugs_results_trend_count_info.validate_response_schema if network_bugs_results_trend_count_info.validate_response_schema is not none else omit }}"
      register: network_bugs_results_trend_count_info_result
