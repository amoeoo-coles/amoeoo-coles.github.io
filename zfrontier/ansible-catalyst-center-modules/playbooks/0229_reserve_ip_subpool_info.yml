---
# Sample playbook for cisco.catalystcenter.reserve_ip_subpool_info (cisco.catalystcenter 2.15.0)
# Build order: 229
# Information module for Reserve Ip Subpool
# Reads ../models/reserve_ip_subpool_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reserve_ip_subpool_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0229 reserve_ip_subpool_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reserve_ip_subpool_info.yml
  tasks:
    - name: Run reserve_ip_subpool_info from its model
      cisco.catalystcenter.reserve_ip_subpool_info:
        catalystcenter_debug: "{{ reserve_ip_subpool_info.catalystcenter_debug if reserve_ip_subpool_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ reserve_ip_subpool_info.catalystcenter_host if reserve_ip_subpool_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ reserve_ip_subpool_info.catalystcenter_password if reserve_ip_subpool_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ reserve_ip_subpool_info.catalystcenter_port if reserve_ip_subpool_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ reserve_ip_subpool_info.catalystcenter_username if reserve_ip_subpool_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ reserve_ip_subpool_info.catalystcenter_verify if reserve_ip_subpool_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ reserve_ip_subpool_info.catalystcenter_version if reserve_ip_subpool_info.catalystcenter_version is not none else omit }}"
        groupName: "{{ reserve_ip_subpool_info.groupName if reserve_ip_subpool_info.groupName is not none else omit }}"
        headers: "{{ reserve_ip_subpool_info.headers if reserve_ip_subpool_info.headers is not none else omit }}"
        ignoreInheritedGroups: "{{ reserve_ip_subpool_info.ignoreInheritedGroups if reserve_ip_subpool_info.ignoreInheritedGroups is not none else omit }}"
        limit: "{{ reserve_ip_subpool_info.limit if reserve_ip_subpool_info.limit is not none else omit }}"
        offset: "{{ reserve_ip_subpool_info.offset if reserve_ip_subpool_info.offset is not none else omit }}"
        poolUsage: "{{ reserve_ip_subpool_info.poolUsage if reserve_ip_subpool_info.poolUsage is not none else omit }}"
        siteId: "{{ reserve_ip_subpool_info.siteId if reserve_ip_subpool_info.siteId is not none else omit }}"
        validate_response_schema: "{{ reserve_ip_subpool_info.validate_response_schema if reserve_ip_subpool_info.validate_response_schema is not none else omit }}"
      register: reserve_ip_subpool_info_result
