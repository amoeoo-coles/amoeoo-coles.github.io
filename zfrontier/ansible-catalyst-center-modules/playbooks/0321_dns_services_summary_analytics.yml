---
# Sample playbook for cisco.catalystcenter.dns_services_summary_analytics (cisco.catalystcenter 2.15.0)
# Build order: 321
# Resource module for Dns Services Summary Analytics
# Reads ../models/dns_services_summary_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dns_services_summary_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags dns_services_summary_analytics.

- name: "0321 dns_services_summary_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dns_services_summary_analytics.yml
  tasks:
    - name: Run dns_services_summary_analytics from its model
      cisco.catalystcenter.dns_services_summary_analytics:
        aggregateAttributes: "{{ (dns_services_summary_analytics.aggregateAttributes | cat_strip_nulls) if (dns_services_summary_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (dns_services_summary_analytics.attributes | cat_strip_nulls) if (dns_services_summary_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ dns_services_summary_analytics.catalystcenter_debug if dns_services_summary_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dns_services_summary_analytics.catalystcenter_host if dns_services_summary_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dns_services_summary_analytics.catalystcenter_password if dns_services_summary_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dns_services_summary_analytics.catalystcenter_port if dns_services_summary_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dns_services_summary_analytics.catalystcenter_username if dns_services_summary_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dns_services_summary_analytics.catalystcenter_verify if dns_services_summary_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dns_services_summary_analytics.catalystcenter_version if dns_services_summary_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ dns_services_summary_analytics.endTime if dns_services_summary_analytics.endTime is not none else omit }}"
        filters: "{{ (dns_services_summary_analytics.filters | cat_strip_nulls) if (dns_services_summary_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (dns_services_summary_analytics.groupBy | cat_strip_nulls) if (dns_services_summary_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        headers: "{{ dns_services_summary_analytics.headers if dns_services_summary_analytics.headers is not none else omit }}"
        page: "{{ (dns_services_summary_analytics.page | cat_strip_nulls) if (dns_services_summary_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ dns_services_summary_analytics.startTime if dns_services_summary_analytics.startTime is not none else omit }}"
        validate_response_schema: "{{ dns_services_summary_analytics.validate_response_schema if dns_services_summary_analytics.validate_response_schema is not none else omit }}"
      register: dns_services_summary_analytics_result
      tags:
        - never
        - dns_services_summary_analytics
