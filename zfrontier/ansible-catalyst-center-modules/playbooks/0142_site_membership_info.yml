---
# Sample playbook for cisco.catalystcenter.site_membership_info (cisco.catalystcenter 2.15.0)
# Build order: 142
# Information module for Site Membership
# Reads ../models/site_membership_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_membership_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0142 site_membership_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_membership_info.yml
  tasks:
    - name: Run site_membership_info from its model
      cisco.catalystcenter.site_membership_info:
        catalystcenter_debug: "{{ site_membership_info.catalystcenter_debug if site_membership_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_membership_info.catalystcenter_host if site_membership_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_membership_info.catalystcenter_password if site_membership_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_membership_info.catalystcenter_port if site_membership_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_membership_info.catalystcenter_username if site_membership_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_membership_info.catalystcenter_verify if site_membership_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_membership_info.catalystcenter_version if site_membership_info.catalystcenter_version is not none else omit }}"
        deviceFamily: "{{ site_membership_info.deviceFamily if site_membership_info.deviceFamily is not none else omit }}"
        headers: "{{ site_membership_info.headers if site_membership_info.headers is not none else omit }}"
        limit: "{{ site_membership_info.limit if site_membership_info.limit is not none else omit }}"
        offset: "{{ site_membership_info.offset if site_membership_info.offset is not none else omit }}"
        serialNumber: "{{ site_membership_info.serialNumber if site_membership_info.serialNumber is not none else omit }}"
        siteId: "{{ site_membership_info.siteId if site_membership_info.siteId is not none else omit }}"
        validate_response_schema: "{{ site_membership_info.validate_response_schema if site_membership_info.validate_response_schema is not none else omit }}"
      register: site_membership_info_result
