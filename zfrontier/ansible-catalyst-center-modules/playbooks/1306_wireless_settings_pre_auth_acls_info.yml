---
# Sample playbook for cisco.catalystcenter.wireless_settings_pre_auth_acls_info (cisco.catalystcenter 2.15.0)
# Build order: 1306
# Information module for Wireless Settings Pre Auth Acls
# Reads ../models/wireless_settings_pre_auth_acls_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_pre_auth_acls_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1306 wireless_settings_pre_auth_acls_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_pre_auth_acls_info.yml
  tasks:
    - name: Run wireless_settings_pre_auth_acls_info from its model
      cisco.catalystcenter.wireless_settings_pre_auth_acls_info:
        aclListName: "{{ wireless_settings_pre_auth_acls_info.aclListName if wireless_settings_pre_auth_acls_info.aclListName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_debug if wireless_settings_pre_auth_acls_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_host if wireless_settings_pre_auth_acls_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_password if wireless_settings_pre_auth_acls_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_port if wireless_settings_pre_auth_acls_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_username if wireless_settings_pre_auth_acls_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_verify if wireless_settings_pre_auth_acls_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_pre_auth_acls_info.catalystcenter_version if wireless_settings_pre_auth_acls_info.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_settings_pre_auth_acls_info.headers if wireless_settings_pre_auth_acls_info.headers is not none else omit }}"
        id: "{{ wireless_settings_pre_auth_acls_info.id if wireless_settings_pre_auth_acls_info.id is not none else omit }}"
        limit: "{{ wireless_settings_pre_auth_acls_info.limit if wireless_settings_pre_auth_acls_info.limit is not none else omit }}"
        offset: "{{ wireless_settings_pre_auth_acls_info.offset if wireless_settings_pre_auth_acls_info.offset is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_pre_auth_acls_info.validate_response_schema if wireless_settings_pre_auth_acls_info.validate_response_schema is not none else omit }}"
      register: wireless_settings_pre_auth_acls_info_result
