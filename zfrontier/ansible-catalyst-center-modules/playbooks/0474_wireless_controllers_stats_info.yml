---
# Sample playbook for cisco.catalystcenter.wireless_controllers_stats_info (cisco.catalystcenter 2.15.0)
# Build order: 474
# Information module for Wireless Controllers Stats
# Reads ../models/wireless_controllers_stats_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_stats_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0474 wireless_controllers_stats_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_stats_info.yml
  tasks:
    - name: Run wireless_controllers_stats_info from its model
      cisco.catalystcenter.wireless_controllers_stats_info:
        attribute: "{{ (wireless_controllers_stats_info.attribute | cat_strip_nulls) if (wireless_controllers_stats_info.attribute | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ wireless_controllers_stats_info.catalystcenter_debug if wireless_controllers_stats_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_stats_info.catalystcenter_host if wireless_controllers_stats_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_stats_info.catalystcenter_password if wireless_controllers_stats_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_stats_info.catalystcenter_port if wireless_controllers_stats_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_stats_info.catalystcenter_username if wireless_controllers_stats_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_stats_info.catalystcenter_verify if wireless_controllers_stats_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_stats_info.catalystcenter_version if wireless_controllers_stats_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ wireless_controllers_stats_info.endTime if wireless_controllers_stats_info.endTime is not none else omit }}"
        headers: "{{ wireless_controllers_stats_info.headers if wireless_controllers_stats_info.headers is not none else omit }}"
        id: "{{ wireless_controllers_stats_info.id if wireless_controllers_stats_info.id is not none else omit }}"
        limit: "{{ wireless_controllers_stats_info.limit if wireless_controllers_stats_info.limit is not none else omit }}"
        offset: "{{ wireless_controllers_stats_info.offset if wireless_controllers_stats_info.offset is not none else omit }}"
        order: "{{ wireless_controllers_stats_info.order if wireless_controllers_stats_info.order is not none else omit }}"
        sortBy: "{{ wireless_controllers_stats_info.sortBy if wireless_controllers_stats_info.sortBy is not none else omit }}"
        startTime: "{{ wireless_controllers_stats_info.startTime if wireless_controllers_stats_info.startTime is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_stats_info.validate_response_schema if wireless_controllers_stats_info.validate_response_schema is not none else omit }}"
        view: "{{ (wireless_controllers_stats_info.view | cat_strip_nulls) if (wireless_controllers_stats_info.view | cat_strip_nulls) is not none else omit }}"
      register: wireless_controllers_stats_info_result
