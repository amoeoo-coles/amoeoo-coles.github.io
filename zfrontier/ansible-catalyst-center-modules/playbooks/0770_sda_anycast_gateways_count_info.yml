---
# Sample playbook for cisco.catalystcenter.sda_anycast_gateways_count_info (cisco.catalystcenter 2.15.0)
# Build order: 770
# Information module for Sda Anycast Gateways Count
# Reads ../models/sda_anycast_gateways_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_anycast_gateways_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0770 sda_anycast_gateways_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_anycast_gateways_count_info.yml
  tasks:
    - name: Run sda_anycast_gateways_count_info from its model
      cisco.catalystcenter.sda_anycast_gateways_count_info:
        catalystcenter_debug: "{{ sda_anycast_gateways_count_info.catalystcenter_debug if sda_anycast_gateways_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_anycast_gateways_count_info.catalystcenter_host if sda_anycast_gateways_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_anycast_gateways_count_info.catalystcenter_password if sda_anycast_gateways_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_anycast_gateways_count_info.catalystcenter_port if sda_anycast_gateways_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_anycast_gateways_count_info.catalystcenter_username if sda_anycast_gateways_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_anycast_gateways_count_info.catalystcenter_verify if sda_anycast_gateways_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_anycast_gateways_count_info.catalystcenter_version if sda_anycast_gateways_count_info.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_anycast_gateways_count_info.fabricId if sda_anycast_gateways_count_info.fabricId is not none else omit }}"
        headers: "{{ sda_anycast_gateways_count_info.headers if sda_anycast_gateways_count_info.headers is not none else omit }}"
        ipPoolName: "{{ (sda_anycast_gateways_count_info.ipPoolName | cat_strip_nulls) if (sda_anycast_gateways_count_info.ipPoolName | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_anycast_gateways_count_info.validate_response_schema if sda_anycast_gateways_count_info.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_anycast_gateways_count_info.virtualNetworkName if sda_anycast_gateways_count_info.virtualNetworkName is not none else omit }}"
        vlanId: "{{ sda_anycast_gateways_count_info.vlanId if sda_anycast_gateways_count_info.vlanId is not none else omit }}"
        vlanName: "{{ sda_anycast_gateways_count_info.vlanName if sda_anycast_gateways_count_info.vlanName is not none else omit }}"
      register: sda_anycast_gateways_count_info_result
