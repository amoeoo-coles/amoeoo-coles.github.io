---
# Sample playbook for cisco.catalystcenter.images_site_wise_product_names_info (cisco.catalystcenter 2.15.0)
# Build order: 570
# Information module for Images Site Wise Product Names
# Reads ../models/images_site_wise_product_names_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_site_wise_product_names_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0570 images_site_wise_product_names_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_site_wise_product_names_info.yml
  tasks:
    - name: Run images_site_wise_product_names_info from its model
      cisco.catalystcenter.images_site_wise_product_names_info:
        assigned: "{{ images_site_wise_product_names_info.assigned if images_site_wise_product_names_info.assigned is not none else omit }}"
        catalystcenter_debug: "{{ images_site_wise_product_names_info.catalystcenter_debug if images_site_wise_product_names_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_site_wise_product_names_info.catalystcenter_host if images_site_wise_product_names_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_site_wise_product_names_info.catalystcenter_password if images_site_wise_product_names_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_site_wise_product_names_info.catalystcenter_port if images_site_wise_product_names_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_site_wise_product_names_info.catalystcenter_username if images_site_wise_product_names_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_site_wise_product_names_info.catalystcenter_verify if images_site_wise_product_names_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_site_wise_product_names_info.catalystcenter_version if images_site_wise_product_names_info.catalystcenter_version is not none else omit }}"
        headers: "{{ images_site_wise_product_names_info.headers if images_site_wise_product_names_info.headers is not none else omit }}"
        imageId: "{{ images_site_wise_product_names_info.imageId if images_site_wise_product_names_info.imageId is not none else omit }}"
        limit: "{{ images_site_wise_product_names_info.limit if images_site_wise_product_names_info.limit is not none else omit }}"
        offset: "{{ images_site_wise_product_names_info.offset if images_site_wise_product_names_info.offset is not none else omit }}"
        productId: "{{ images_site_wise_product_names_info.productId if images_site_wise_product_names_info.productId is not none else omit }}"
        productName: "{{ images_site_wise_product_names_info.productName if images_site_wise_product_names_info.productName is not none else omit }}"
        recommended: "{{ images_site_wise_product_names_info.recommended if images_site_wise_product_names_info.recommended is not none else omit }}"
        validate_response_schema: "{{ images_site_wise_product_names_info.validate_response_schema if images_site_wise_product_names_info.validate_response_schema is not none else omit }}"
      register: images_site_wise_product_names_info_result
