---
# Sample playbook for cisco.catalystcenter.sda_fabric_sites_info (cisco.catalystcenter 2.15.0)
# Build order: 791
# Information module for Sda Fabric Sites
# Reads ../models/sda_fabric_sites_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabric_sites_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0791 sda_fabric_sites_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabric_sites_info.yml
  tasks:
    - name: Run sda_fabric_sites_info from its model
      cisco.catalystcenter.sda_fabric_sites_info:
        catalystcenter_debug: "{{ sda_fabric_sites_info.catalystcenter_debug if sda_fabric_sites_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabric_sites_info.catalystcenter_host if sda_fabric_sites_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabric_sites_info.catalystcenter_password if sda_fabric_sites_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabric_sites_info.catalystcenter_port if sda_fabric_sites_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabric_sites_info.catalystcenter_username if sda_fabric_sites_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabric_sites_info.catalystcenter_verify if sda_fabric_sites_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabric_sites_info.catalystcenter_version if sda_fabric_sites_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_fabric_sites_info.headers if sda_fabric_sites_info.headers is not none else omit }}"
        id: "{{ sda_fabric_sites_info.id if sda_fabric_sites_info.id is not none else omit }}"
        limit: "{{ sda_fabric_sites_info.limit if sda_fabric_sites_info.limit is not none else omit }}"
        offset: "{{ sda_fabric_sites_info.offset if sda_fabric_sites_info.offset is not none else omit }}"
        siteId: "{{ sda_fabric_sites_info.siteId if sda_fabric_sites_info.siteId is not none else omit }}"
        validate_response_schema: "{{ sda_fabric_sites_info.validate_response_schema if sda_fabric_sites_info.validate_response_schema is not none else omit }}"
      register: sda_fabric_sites_info_result
