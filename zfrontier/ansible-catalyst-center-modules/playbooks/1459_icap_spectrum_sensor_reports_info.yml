---
# Sample playbook for cisco.catalystcenter.icap_spectrum_sensor_reports_info (cisco.catalystcenter 2.15.0)
# Build order: 1459
# Information module for Icap Spectrum Sensor Reports
# Reads ../models/icap_spectrum_sensor_reports_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/icap_spectrum_sensor_reports_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1459 icap_spectrum_sensor_reports_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/icap_spectrum_sensor_reports_info.yml
  tasks:
    - name: Run icap_spectrum_sensor_reports_info from its model
      cisco.catalystcenter.icap_spectrum_sensor_reports_info:
        apMac: "{{ icap_spectrum_sensor_reports_info.apMac if icap_spectrum_sensor_reports_info.apMac is not none else omit }}"
        catalystcenter_debug: "{{ icap_spectrum_sensor_reports_info.catalystcenter_debug if icap_spectrum_sensor_reports_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ icap_spectrum_sensor_reports_info.catalystcenter_host if icap_spectrum_sensor_reports_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ icap_spectrum_sensor_reports_info.catalystcenter_password if icap_spectrum_sensor_reports_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ icap_spectrum_sensor_reports_info.catalystcenter_port if icap_spectrum_sensor_reports_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ icap_spectrum_sensor_reports_info.catalystcenter_username if icap_spectrum_sensor_reports_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ icap_spectrum_sensor_reports_info.catalystcenter_verify if icap_spectrum_sensor_reports_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ icap_spectrum_sensor_reports_info.catalystcenter_version if icap_spectrum_sensor_reports_info.catalystcenter_version is not none else omit }}"
        dataType: "{{ icap_spectrum_sensor_reports_info.dataType if icap_spectrum_sensor_reports_info.dataType is not none else omit }}"
        endTime: "{{ icap_spectrum_sensor_reports_info.endTime if icap_spectrum_sensor_reports_info.endTime is not none else omit }}"
        headers: "{{ icap_spectrum_sensor_reports_info.headers if icap_spectrum_sensor_reports_info.headers is not none else omit }}"
        limit: "{{ icap_spectrum_sensor_reports_info.limit if icap_spectrum_sensor_reports_info.limit is not none else omit }}"
        offset: "{{ icap_spectrum_sensor_reports_info.offset if icap_spectrum_sensor_reports_info.offset is not none else omit }}"
        startTime: "{{ icap_spectrum_sensor_reports_info.startTime if icap_spectrum_sensor_reports_info.startTime is not none else omit }}"
        timeSortOrder: "{{ icap_spectrum_sensor_reports_info.timeSortOrder if icap_spectrum_sensor_reports_info.timeSortOrder is not none else omit }}"
        validate_response_schema: "{{ icap_spectrum_sensor_reports_info.validate_response_schema if icap_spectrum_sensor_reports_info.validate_response_schema is not none else omit }}"
      register: icap_spectrum_sensor_reports_info_result
