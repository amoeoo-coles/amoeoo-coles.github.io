---
# Sample playbook for cisco.catalystcenter.event_snmp_config_update (cisco.catalystcenter 2.15.0)
# Build order: 1482
# Resource module for Event Snmp Config Update
# Reads ../models/event_snmp_config_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_snmp_config_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_snmp_config_update.

- name: "1482 event_snmp_config_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_snmp_config_update.yml
  tasks:
    - name: Run event_snmp_config_update from its model
      cisco.catalystcenter.event_snmp_config_update:
        authPassword: "{{ event_snmp_config_update.authPassword if event_snmp_config_update.authPassword is not none else omit }}"
        catalystcenter_debug: "{{ event_snmp_config_update.catalystcenter_debug if event_snmp_config_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_snmp_config_update.catalystcenter_host if event_snmp_config_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_snmp_config_update.catalystcenter_password if event_snmp_config_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_snmp_config_update.catalystcenter_port if event_snmp_config_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_snmp_config_update.catalystcenter_username if event_snmp_config_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_snmp_config_update.catalystcenter_verify if event_snmp_config_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_snmp_config_update.catalystcenter_version if event_snmp_config_update.catalystcenter_version is not none else omit }}"
        community: "{{ event_snmp_config_update.community if event_snmp_config_update.community is not none else omit }}"
        configId: "{{ event_snmp_config_update.configId if event_snmp_config_update.configId is not none else omit }}"
        description: "{{ event_snmp_config_update.description if event_snmp_config_update.description is not none else omit }}"
        ipAddress: "{{ event_snmp_config_update.ipAddress if event_snmp_config_update.ipAddress is not none else omit }}"
        name: "{{ event_snmp_config_update.name if event_snmp_config_update.name is not none else omit }}"
        port: "{{ event_snmp_config_update.port if event_snmp_config_update.port is not none else omit }}"
        privacyPassword: "{{ event_snmp_config_update.privacyPassword if event_snmp_config_update.privacyPassword is not none else omit }}"
        snmpAuthType: "{{ event_snmp_config_update.snmpAuthType if event_snmp_config_update.snmpAuthType is not none else omit }}"
        snmpMode: "{{ event_snmp_config_update.snmpMode if event_snmp_config_update.snmpMode is not none else omit }}"
        snmpPrivacyType: "{{ event_snmp_config_update.snmpPrivacyType if event_snmp_config_update.snmpPrivacyType is not none else omit }}"
        snmpVersion: "{{ event_snmp_config_update.snmpVersion if event_snmp_config_update.snmpVersion is not none else omit }}"
        userName: "{{ event_snmp_config_update.userName if event_snmp_config_update.userName is not none else omit }}"
        validate_response_schema: "{{ event_snmp_config_update.validate_response_schema if event_snmp_config_update.validate_response_schema is not none else omit }}"
      register: event_snmp_config_update_result
      tags:
        - never
        - event_snmp_config_update
