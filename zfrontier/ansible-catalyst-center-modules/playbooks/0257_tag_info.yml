---
# Sample playbook for cisco.catalystcenter.tag_info (cisco.catalystcenter 2.15.0)
# Build order: 257
# Information module for Tag
# Reads ../models/tag_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tag_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0257 tag_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tag_info.yml
  tasks:
    - name: Run tag_info from its model
      cisco.catalystcenter.tag_info:
        additionalInfo_attributes: "{{ tag_info.additionalInfo_attributes if tag_info.additionalInfo_attributes is not none else omit }}"
        additionalInfo_nameSpace: "{{ tag_info.additionalInfo_nameSpace if tag_info.additionalInfo_nameSpace is not none else omit }}"
        catalystcenter_debug: "{{ tag_info.catalystcenter_debug if tag_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tag_info.catalystcenter_host if tag_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tag_info.catalystcenter_password if tag_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tag_info.catalystcenter_port if tag_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tag_info.catalystcenter_username if tag_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tag_info.catalystcenter_verify if tag_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tag_info.catalystcenter_version if tag_info.catalystcenter_version is not none else omit }}"
        field: "{{ tag_info.field if tag_info.field is not none else omit }}"
        headers: "{{ tag_info.headers if tag_info.headers is not none else omit }}"
        id: "{{ tag_info.id if tag_info.id is not none else omit }}"
        level: "{{ tag_info.level if tag_info.level is not none else omit }}"
        limit: "{{ tag_info.limit if tag_info.limit is not none else omit }}"
        name: "{{ tag_info.name if tag_info.name is not none else omit }}"
        offset: "{{ tag_info.offset if tag_info.offset is not none else omit }}"
        order: "{{ tag_info.order if tag_info.order is not none else omit }}"
        size: "{{ tag_info.size if tag_info.size is not none else omit }}"
        sortBy: "{{ tag_info.sortBy if tag_info.sortBy is not none else omit }}"
        systemTag: "{{ tag_info.systemTag if tag_info.systemTag is not none else omit }}"
        validate_response_schema: "{{ tag_info.validate_response_schema if tag_info.validate_response_schema is not none else omit }}"
      register: tag_info_result
