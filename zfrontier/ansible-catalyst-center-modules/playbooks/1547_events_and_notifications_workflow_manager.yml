---
# Sample playbook for cisco.catalystcenter.events_and_notifications_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 1547
# Configure various types of destinations to deliver event notifications from Cisco Catalyst Center Platform.
# Reads ../models/events_and_notifications_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/events_and_notifications_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags events_and_notifications_workflow_manager.

- name: "1547 events_and_notifications_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/events_and_notifications_workflow_manager.yml
  tasks:
    - name: Run events_and_notifications_workflow_manager from its model
      cisco.catalystcenter.events_and_notifications_workflow_manager:
        catalystcenter_api_task_timeout: "{{ events_and_notifications_workflow_manager.catalystcenter_api_task_timeout if events_and_notifications_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ events_and_notifications_workflow_manager.catalystcenter_debug if events_and_notifications_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ events_and_notifications_workflow_manager.catalystcenter_host if events_and_notifications_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ events_and_notifications_workflow_manager.catalystcenter_log if events_and_notifications_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ events_and_notifications_workflow_manager.catalystcenter_log_append if events_and_notifications_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ events_and_notifications_workflow_manager.catalystcenter_log_file_path if events_and_notifications_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ events_and_notifications_workflow_manager.catalystcenter_log_level if events_and_notifications_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ events_and_notifications_workflow_manager.catalystcenter_password if events_and_notifications_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ events_and_notifications_workflow_manager.catalystcenter_port if events_and_notifications_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ events_and_notifications_workflow_manager.catalystcenter_task_poll_interval if events_and_notifications_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ events_and_notifications_workflow_manager.catalystcenter_username if events_and_notifications_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ events_and_notifications_workflow_manager.catalystcenter_verify if events_and_notifications_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ events_and_notifications_workflow_manager.catalystcenter_version if events_and_notifications_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (events_and_notifications_workflow_manager.config | cat_strip_nulls) if (events_and_notifications_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ events_and_notifications_workflow_manager.config_verify if events_and_notifications_workflow_manager.config_verify is not none else omit }}"
        state: "{{ events_and_notifications_workflow_manager.state if events_and_notifications_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ events_and_notifications_workflow_manager.validate_response_schema if events_and_notifications_workflow_manager.validate_response_schema is not none else omit }}"
      register: events_and_notifications_workflow_manager_result
      tags:
        - never
        - events_and_notifications_workflow_manager
