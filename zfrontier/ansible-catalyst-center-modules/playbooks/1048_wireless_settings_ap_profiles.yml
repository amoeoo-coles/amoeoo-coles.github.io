---
# Sample playbook for cisco.catalystcenter.wireless_settings_ap_profiles (cisco.catalystcenter 2.15.0)
# Build order: 1048
# Resource module for Wireless Settings Ap Profiles
# Reads ../models/wireless_settings_ap_profiles.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_ap_profiles_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_ap_profiles.

- name: "1048 wireless_settings_ap_profiles"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_ap_profiles.yml
  tasks:
    - name: Run wireless_settings_ap_profiles from its model
      cisco.catalystcenter.wireless_settings_ap_profiles:
        apPowerProfileName: "{{ wireless_settings_ap_profiles.apPowerProfileName if wireless_settings_ap_profiles.apPowerProfileName is not none else omit }}"
        apProfileName: "{{ wireless_settings_ap_profiles.apProfileName if wireless_settings_ap_profiles.apProfileName is not none else omit }}"
        awipsEnabled: "{{ wireless_settings_ap_profiles.awipsEnabled if wireless_settings_ap_profiles.awipsEnabled is not none else omit }}"
        awipsForensicEnabled: "{{ wireless_settings_ap_profiles.awipsForensicEnabled if wireless_settings_ap_profiles.awipsForensicEnabled is not none else omit }}"
        calendarPowerProfiles: "{{ (wireless_settings_ap_profiles.calendarPowerProfiles | cat_strip_nulls) if (wireless_settings_ap_profiles.calendarPowerProfiles | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ wireless_settings_ap_profiles.catalystcenter_debug if wireless_settings_ap_profiles.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_ap_profiles.catalystcenter_host if wireless_settings_ap_profiles.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_ap_profiles.catalystcenter_password if wireless_settings_ap_profiles.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_ap_profiles.catalystcenter_port if wireless_settings_ap_profiles.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_ap_profiles.catalystcenter_username if wireless_settings_ap_profiles.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_ap_profiles.catalystcenter_verify if wireless_settings_ap_profiles.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_ap_profiles.catalystcenter_version if wireless_settings_ap_profiles.catalystcenter_version is not none else omit }}"
        clientLimit: "{{ wireless_settings_ap_profiles.clientLimit if wireless_settings_ap_profiles.clientLimit is not none else omit }}"
        countryCode: "{{ wireless_settings_ap_profiles.countryCode if wireless_settings_ap_profiles.countryCode is not none else omit }}"
        description: "{{ wireless_settings_ap_profiles.description if wireless_settings_ap_profiles.description is not none else omit }}"
        id: "{{ wireless_settings_ap_profiles.id if wireless_settings_ap_profiles.id is not none else omit }}"
        managementSetting: "{{ (wireless_settings_ap_profiles.managementSetting | cat_strip_nulls) if (wireless_settings_ap_profiles.managementSetting | cat_strip_nulls) is not none else omit }}"
        meshEnabled: "{{ wireless_settings_ap_profiles.meshEnabled if wireless_settings_ap_profiles.meshEnabled is not none else omit }}"
        meshSetting: "{{ (wireless_settings_ap_profiles.meshSetting | cat_strip_nulls) if (wireless_settings_ap_profiles.meshSetting | cat_strip_nulls) is not none else omit }}"
        pmfDenialEnabled: "{{ wireless_settings_ap_profiles.pmfDenialEnabled if wireless_settings_ap_profiles.pmfDenialEnabled is not none else omit }}"
        remoteWorkerEnabled: "{{ wireless_settings_ap_profiles.remoteWorkerEnabled if wireless_settings_ap_profiles.remoteWorkerEnabled is not none else omit }}"
        rogueDetectionSetting: "{{ (wireless_settings_ap_profiles.rogueDetectionSetting | cat_strip_nulls) if (wireless_settings_ap_profiles.rogueDetectionSetting | cat_strip_nulls) is not none else omit }}"
        timeZone: "{{ wireless_settings_ap_profiles.timeZone if wireless_settings_ap_profiles.timeZone is not none else omit }}"
        timeZoneOffsetHour: "{{ wireless_settings_ap_profiles.timeZoneOffsetHour if wireless_settings_ap_profiles.timeZoneOffsetHour is not none else omit }}"
        timeZoneOffsetMinutes: "{{ wireless_settings_ap_profiles.timeZoneOffsetMinutes if wireless_settings_ap_profiles.timeZoneOffsetMinutes is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_ap_profiles.validate_response_schema if wireless_settings_ap_profiles.validate_response_schema is not none else omit }}"
      register: wireless_settings_ap_profiles_result
      tags:
        - never
        - wireless_settings_ap_profiles
