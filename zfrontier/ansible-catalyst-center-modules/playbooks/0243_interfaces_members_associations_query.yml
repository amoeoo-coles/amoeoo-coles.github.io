        catalystcenter_password: "{{ interfaces_members_associations_query.catalystcenter_password if interfaces_members_associations_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ interfaces_members_associations_query.catalystcenter_port if interfaces_members_associations_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ interfaces_members_associations_query.catalystcenter_username if interfaces_members_associations_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ interfaces_members_associations_query.catalystcenter_verify if interfaces_members_associations_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ interfaces_members_associations_query.catalystcenter_version if interfaces_members_associations_query.catalystcenter_version is not none else omit }}"
        ids: "{{ (interfaces_members_associations_query.ids | cat_strip_nulls) if (interfaces_members_associations_query.ids | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ interfaces_members_associations_query.validate_response_schema if interfaces_members_associations_query.validate_response_schema is not none else omit }}"
      register: interfaces_members_associations_query_result
      tags:
