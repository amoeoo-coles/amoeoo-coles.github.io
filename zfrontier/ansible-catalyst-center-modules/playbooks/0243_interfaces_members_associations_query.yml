# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags interfaces_members_associations_query.

- name: "0243 interfaces_members_associations_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/interfaces_members_associations_query.yml
  tasks:
    - name: Run interfaces_members_associations_query from its model
      cisco.catalystcenter.interfaces_members_associations_query:
        catalystcenter_debug: "{{ interfaces_members_associations_query.catalystcenter_debug if interfaces_members_associations_query.catalystcenter_debug is not none else omit }}"
