---
# Sample playbook for cisco.catalystcenter.cisco_imcs (cisco.catalystcenter 2.15.0)
# Build order: 87
# Resource module for Cisco Imcs
# Reads ../models/cisco_imcs.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/cisco_imcs_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags cisco_imcs.

- name: "0087 cisco_imcs"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/cisco_imcs.yml
  tasks:
    - name: Run cisco_imcs from its model
      cisco.catalystcenter.cisco_imcs:
        catalystcenter_debug: "{{ cisco_imcs.catalystcenter_debug if cisco_imcs.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ cisco_imcs.catalystcenter_host if cisco_imcs.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ cisco_imcs.catalystcenter_password if cisco_imcs.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ cisco_imcs.catalystcenter_port if cisco_imcs.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ cisco_imcs.catalystcenter_username if cisco_imcs.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ cisco_imcs.catalystcenter_verify if cisco_imcs.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ cisco_imcs.catalystcenter_version if cisco_imcs.catalystcenter_version is not none else omit }}"
        id: "{{ cisco_imcs.id if cisco_imcs.id is not none else omit }}"
        ipAddress: "{{ cisco_imcs.ipAddress if cisco_imcs.ipAddress is not none else omit }}"
        nodeId: "{{ cisco_imcs.nodeId if cisco_imcs.nodeId is not none else omit }}"
        password: "{{ cisco_imcs.password if cisco_imcs.password is not none else omit }}"
        username: "{{ cisco_imcs.username if cisco_imcs.username is not none else omit }}"
        validate_response_schema: "{{ cisco_imcs.validate_response_schema if cisco_imcs.validate_response_schema is not none else omit }}"
      register: cisco_imcs_result
      tags:
        - never
        - cisco_imcs
