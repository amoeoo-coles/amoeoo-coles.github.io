---
# Sample playbook for cisco.catalystcenter.switches_configs_intended_layer3_delete (cisco.catalystcenter 2.15.0)
# Build order: 869
# Resource module for Switches Configs Intended Layer3 Delete
# Reads ../models/switches_configs_intended_layer3_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/switches_configs_intended_layer3_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags switches_configs_intended_layer3_delete.

- name: "0869 switches_configs_intended_layer3_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/switches_configs_intended_layer3_delete.yml
  tasks:
    - name: Run switches_configs_intended_layer3_delete from its model
      cisco.catalystcenter.switches_configs_intended_layer3_delete:
        catalystcenter_debug: "{{ switches_configs_intended_layer3_delete.catalystcenter_debug if switches_configs_intended_layer3_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ switches_configs_intended_layer3_delete.catalystcenter_host if switches_configs_intended_layer3_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ switches_configs_intended_layer3_delete.catalystcenter_password if switches_configs_intended_layer3_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ switches_configs_intended_layer3_delete.catalystcenter_port if switches_configs_intended_layer3_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ switches_configs_intended_layer3_delete.catalystcenter_username if switches_configs_intended_layer3_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ switches_configs_intended_layer3_delete.catalystcenter_verify if switches_configs_intended_layer3_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ switches_configs_intended_layer3_delete.catalystcenter_version if switches_configs_intended_layer3_delete.catalystcenter_version is not none else omit }}"
        feature: "{{ switches_configs_intended_layer3_delete.feature if switches_configs_intended_layer3_delete.feature is not none else omit }}"
        id: "{{ switches_configs_intended_layer3_delete.id if switches_configs_intended_layer3_delete.id is not none else omit }}"
        validate_response_schema: "{{ switches_configs_intended_layer3_delete.validate_response_schema if switches_configs_intended_layer3_delete.validate_response_schema is not none else omit }}"
      register: switches_configs_intended_layer3_delete_result
      tags:
        - never
        - switches_configs_intended_layer3_delete
