---
# Sample playbook for cisco.catalystcenter.roles (cisco.catalystcenter 2.15.0)
# Build order: 41
# Resource module for Roles
# Reads ../models/roles.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/roles_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags roles.

- name: "0041 roles"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/roles.yml
  tasks:
    - name: Run roles from its model
      cisco.catalystcenter.roles:
        catalystcenter_debug: "{{ model_roles.catalystcenter_debug if model_roles.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ model_roles.catalystcenter_host if model_roles.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ model_roles.catalystcenter_password if model_roles.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ model_roles.catalystcenter_port if model_roles.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ model_roles.catalystcenter_username if model_roles.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ model_roles.catalystcenter_verify if model_roles.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ model_roles.catalystcenter_version if model_roles.catalystcenter_version is not none else omit }}"
        description: "{{ model_roles.description if model_roles.description is not none else omit }}"
        resourceTypes: "{{ (model_roles.resourceTypes | cat_strip_nulls) if (model_roles.resourceTypes | cat_strip_nulls) is not none else omit }}"
        role: "{{ model_roles.role if model_roles.role is not none else omit }}"
        roleId: "{{ model_roles.roleId if model_roles.roleId is not none else omit }}"
        validate_response_schema: "{{ model_roles.validate_response_schema if model_roles.validate_response_schema is not none else omit }}"
      register: roles_result
      tags:
        - never
        - roles
