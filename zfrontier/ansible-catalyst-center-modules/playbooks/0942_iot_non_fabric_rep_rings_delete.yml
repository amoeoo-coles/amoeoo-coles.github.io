---
# Sample playbook for cisco.catalystcenter.iot_non_fabric_rep_rings_delete (cisco.catalystcenter 2.15.0)
# Build order: 942
# Resource module for Iot Non Fabric Rep Rings Delete
# Reads ../models/iot_non_fabric_rep_rings_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_non_fabric_rep_rings_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_non_fabric_rep_rings_delete.

- name: "0942 iot_non_fabric_rep_rings_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_non_fabric_rep_rings_delete.yml
  tasks:
    - name: Run iot_non_fabric_rep_rings_delete from its model
      cisco.catalystcenter.iot_non_fabric_rep_rings_delete:
        catalystcenter_debug: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_debug if iot_non_fabric_rep_rings_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_host if iot_non_fabric_rep_rings_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_password if iot_non_fabric_rep_rings_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_port if iot_non_fabric_rep_rings_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_username if iot_non_fabric_rep_rings_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_verify if iot_non_fabric_rep_rings_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_non_fabric_rep_rings_delete.catalystcenter_version if iot_non_fabric_rep_rings_delete.catalystcenter_version is not none else omit }}"
        forceDelete: "{{ iot_non_fabric_rep_rings_delete.forceDelete if iot_non_fabric_rep_rings_delete.forceDelete is not none else omit }}"
        id: "{{ iot_non_fabric_rep_rings_delete.id if iot_non_fabric_rep_rings_delete.id is not none else omit }}"
        validate_response_schema: "{{ iot_non_fabric_rep_rings_delete.validate_response_schema if iot_non_fabric_rep_rings_delete.validate_response_schema is not none else omit }}"
      register: iot_non_fabric_rep_rings_delete_result
      tags:
        - never
        - iot_non_fabric_rep_rings_delete
