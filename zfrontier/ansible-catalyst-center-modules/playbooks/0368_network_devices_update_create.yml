---
# Sample playbook for cisco.catalystcenter.network_devices_update_create (cisco.catalystcenter 2.15.0)
# Build order: 368
# Resource module for Network Devices Update Create
# Reads ../models/network_devices_update_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_update_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_update_create.

- name: "0368 network_devices_update_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_update_create.yml
  tasks:
    - name: Run network_devices_update_create from its model
      cisco.catalystcenter.network_devices_update_create:
        catalystcenter_debug: "{{ network_devices_update_create.catalystcenter_debug if network_devices_update_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_update_create.catalystcenter_host if network_devices_update_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_update_create.catalystcenter_password if network_devices_update_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_update_create.catalystcenter_port if network_devices_update_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_update_create.catalystcenter_username if network_devices_update_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_update_create.catalystcenter_verify if network_devices_update_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_update_create.catalystcenter_version if network_devices_update_create.catalystcenter_version is not none else omit }}"
        category: "{{ network_devices_update_create.category if network_devices_update_create.category is not none else omit }}"
        credentials: "{{ (network_devices_update_create.credentials | cat_strip_nulls) if (network_devices_update_create.credentials | cat_strip_nulls) is not none else omit }}"
        id: "{{ network_devices_update_create.id if network_devices_update_create.id is not none else omit }}"
        managementAddress: "{{ network_devices_update_create.managementAddress if network_devices_update_create.managementAddress is not none else omit }}"
        validate_response_schema: "{{ network_devices_update_create.validate_response_schema if network_devices_update_create.validate_response_schema is not none else omit }}"
      register: network_devices_update_create_result
      tags:
        - never
        - network_devices_update_create
