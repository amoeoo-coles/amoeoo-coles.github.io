---
# Sample playbook for cisco.catalystcenter.discovery_summary_info (cisco.catalystcenter 2.15.0)
# Build order: 291
# Information module for Discovery Summary
# Reads ../models/discovery_summary_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_summary_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0291 discovery_summary_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_summary_info.yml
  tasks:
    - name: Run discovery_summary_info from its model
      cisco.catalystcenter.discovery_summary_info:
        catalystcenter_debug: "{{ discovery_summary_info.catalystcenter_debug if discovery_summary_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_summary_info.catalystcenter_host if discovery_summary_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery_summary_info.catalystcenter_password if discovery_summary_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_summary_info.catalystcenter_port if discovery_summary_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery_summary_info.catalystcenter_username if discovery_summary_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_summary_info.catalystcenter_verify if discovery_summary_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_summary_info.catalystcenter_version if discovery_summary_info.catalystcenter_version is not none else omit }}"
        cliStatus: "{{ (discovery_summary_info.cliStatus | cat_strip_nulls) if (discovery_summary_info.cliStatus | cat_strip_nulls) is not none else omit }}"
        headers: "{{ discovery_summary_info.headers if discovery_summary_info.headers is not none else omit }}"
        httpStatus: "{{ (discovery_summary_info.httpStatus | cat_strip_nulls) if (discovery_summary_info.httpStatus | cat_strip_nulls) is not none else omit }}"
        id: "{{ discovery_summary_info.id if discovery_summary_info.id is not none else omit }}"
        ipAddress: "{{ (discovery_summary_info.ipAddress | cat_strip_nulls) if (discovery_summary_info.ipAddress | cat_strip_nulls) is not none else omit }}"
        netconfStatus: "{{ (discovery_summary_info.netconfStatus | cat_strip_nulls) if (discovery_summary_info.netconfStatus | cat_strip_nulls) is not none else omit }}"
        pingStatus: "{{ (discovery_summary_info.pingStatus | cat_strip_nulls) if (discovery_summary_info.pingStatus | cat_strip_nulls) is not none else omit }}"
        snmpStatus: "{{ (discovery_summary_info.snmpStatus | cat_strip_nulls) if (discovery_summary_info.snmpStatus | cat_strip_nulls) is not none else omit }}"
        sortBy: "{{ discovery_summary_info.sortBy if discovery_summary_info.sortBy is not none else omit }}"
        sortOrder: "{{ discovery_summary_info.sortOrder if discovery_summary_info.sortOrder is not none else omit }}"
        taskId: "{{ discovery_summary_info.taskId if discovery_summary_info.taskId is not none else omit }}"
        validate_response_schema: "{{ discovery_summary_info.validate_response_schema if discovery_summary_info.validate_response_schema is not none else omit }}"
      register: discovery_summary_info_result
