---
# Sample playbook for cisco.catalystcenter.network_devices_query (cisco.catalystcenter 2.15.0)
# Build order: 358
# Resource module for Network Devices Query
# Reads ../models/network_devices_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_query.

- name: "0358 network_devices_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_query.yml
  tasks:
    - name: Run network_devices_query from its model
      cisco.catalystcenter.network_devices_query:
        aggregateAttributes: "{{ (network_devices_query.aggregateAttributes | cat_strip_nulls) if (network_devices_query.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (network_devices_query.attributes | cat_strip_nulls) if (network_devices_query.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ network_devices_query.catalystcenter_debug if network_devices_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_query.catalystcenter_host if network_devices_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_query.catalystcenter_password if network_devices_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_query.catalystcenter_port if network_devices_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_query.catalystcenter_username if network_devices_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_query.catalystcenter_verify if network_devices_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_query.catalystcenter_version if network_devices_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ network_devices_query.endTime if network_devices_query.endTime is not none else omit }}"
        filters: "{{ (network_devices_query.filters | cat_strip_nulls) if (network_devices_query.filters | cat_strip_nulls) is not none else omit }}"
        page: "{{ (network_devices_query.page | cat_strip_nulls) if (network_devices_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ network_devices_query.startTime if network_devices_query.startTime is not none else omit }}"
        validate_response_schema: "{{ network_devices_query.validate_response_schema if network_devices_query.validate_response_schema is not none else omit }}"
        views: "{{ (network_devices_query.views | cat_strip_nulls) if (network_devices_query.views | cat_strip_nulls) is not none else omit }}"
      register: network_devices_query_result
      tags:
        - never
        - network_devices_query
