---
# Sample playbook for cisco.catalystcenter.traffic_steering_policys (cisco.catalystcenter 2.15.0)
# Build order: 1521
# Resource module for Traffic Steering Policys
# Reads ../models/traffic_steering_policys.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/traffic_steering_policys_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags traffic_steering_policys.

- name: "1521 traffic_steering_policys"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/traffic_steering_policys.yml
  tasks:
    - name: Run traffic_steering_policys from its model
      cisco.catalystcenter.traffic_steering_policys:
        catalystcenter_debug: "{{ traffic_steering_policys.catalystcenter_debug if traffic_steering_policys.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ traffic_steering_policys.catalystcenter_host if traffic_steering_policys.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ traffic_steering_policys.catalystcenter_password if traffic_steering_policys.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ traffic_steering_policys.catalystcenter_port if traffic_steering_policys.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ traffic_steering_policys.catalystcenter_username if traffic_steering_policys.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ traffic_steering_policys.catalystcenter_verify if traffic_steering_policys.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ traffic_steering_policys.catalystcenter_version if traffic_steering_policys.catalystcenter_version is not none else omit }}"
        contractId: "{{ traffic_steering_policys.contractId if traffic_steering_policys.contractId is not none else omit }}"
        contractName: "{{ traffic_steering_policys.contractName if traffic_steering_policys.contractName is not none else omit }}"
        createdTime: "{{ traffic_steering_policys.createdTime if traffic_steering_policys.createdTime is not none else omit }}"
        destinationId: "{{ traffic_steering_policys.destinationId if traffic_steering_policys.destinationId is not none else omit }}"
        destinationName: "{{ traffic_steering_policys.destinationName if traffic_steering_policys.destinationName is not none else omit }}"
        id: "{{ traffic_steering_policys.id if traffic_steering_policys.id is not none else omit }}"
        lastUpdatedTime: "{{ traffic_steering_policys.lastUpdatedTime if traffic_steering_policys.lastUpdatedTime is not none else omit }}"
        siteId: "{{ traffic_steering_policys.siteId if traffic_steering_policys.siteId is not none else omit }}"
        sourceId: "{{ traffic_steering_policys.sourceId if traffic_steering_policys.sourceId is not none else omit }}"
        sourceName: "{{ traffic_steering_policys.sourceName if traffic_steering_policys.sourceName is not none else omit }}"
        validate_response_schema: "{{ traffic_steering_policys.validate_response_schema if traffic_steering_policys.validate_response_schema is not none else omit }}"
        virtualNetworkFirewall: "{{ (traffic_steering_policys.virtualNetworkFirewall | cat_strip_nulls) if (traffic_steering_policys.virtualNetworkFirewall | cat_strip_nulls) is not none else omit }}"
        virtualNetworkFirewallCount: "{{ traffic_steering_policys.virtualNetworkFirewallCount if traffic_steering_policys.virtualNetworkFirewallCount is not none else omit }}"
      register: traffic_steering_policys_result
      tags:
        - never
        - traffic_steering_policys
