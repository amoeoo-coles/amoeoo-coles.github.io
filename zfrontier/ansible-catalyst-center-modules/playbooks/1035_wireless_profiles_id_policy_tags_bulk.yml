---
# Sample playbook for cisco.catalystcenter.wireless_profiles_id_policy_tags_bulk (cisco.catalystcenter 2.15.0)
# Build order: 1035
# Resource module for Wireless Profiles Id Policy Tags Bulk
# Reads ../models/wireless_profiles_id_policy_tags_bulk.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_profiles_id_policy_tags_bulk_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_profiles_id_policy_tags_bulk.

- name: "1035 wireless_profiles_id_policy_tags_bulk"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_profiles_id_policy_tags_bulk.yml
  tasks:
    - name: Run wireless_profiles_id_policy_tags_bulk from its model
      cisco.catalystcenter.wireless_profiles_id_policy_tags_bulk:
        catalystcenter_debug: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_debug if wireless_profiles_id_policy_tags_bulk.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_host if wireless_profiles_id_policy_tags_bulk.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_password if wireless_profiles_id_policy_tags_bulk.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_port if wireless_profiles_id_policy_tags_bulk.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_username if wireless_profiles_id_policy_tags_bulk.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_verify if wireless_profiles_id_policy_tags_bulk.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_profiles_id_policy_tags_bulk.catalystcenter_version if wireless_profiles_id_policy_tags_bulk.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_profiles_id_policy_tags_bulk.id if wireless_profiles_id_policy_tags_bulk.id is not none else omit }}"
        items: "{{ (wireless_profiles_id_policy_tags_bulk.items | cat_strip_nulls) if (wireless_profiles_id_policy_tags_bulk.items | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_profiles_id_policy_tags_bulk.validate_response_schema if wireless_profiles_id_policy_tags_bulk.validate_response_schema is not none else omit }}"
      register: wireless_profiles_id_policy_tags_bulk_result
      tags:
        - never
        - wireless_profiles_id_policy_tags_bulk
