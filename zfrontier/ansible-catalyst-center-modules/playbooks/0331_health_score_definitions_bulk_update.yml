---
# Sample playbook for cisco.catalystcenter.health_score_definitions_bulk_update (cisco.catalystcenter 2.15.0)
# Build order: 331
# Resource module for Health Score Definitions Bulk Update
# Reads ../models/health_score_definitions_bulk_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/health_score_definitions_bulk_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags health_score_definitions_bulk_update.

- name: "0331 health_score_definitions_bulk_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/health_score_definitions_bulk_update.yml
  tasks:
    - name: Run health_score_definitions_bulk_update from its model
      cisco.catalystcenter.health_score_definitions_bulk_update:
        catalystcenter_debug: "{{ health_score_definitions_bulk_update.catalystcenter_debug if health_score_definitions_bulk_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ health_score_definitions_bulk_update.catalystcenter_host if health_score_definitions_bulk_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ health_score_definitions_bulk_update.catalystcenter_password if health_score_definitions_bulk_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ health_score_definitions_bulk_update.catalystcenter_port if health_score_definitions_bulk_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ health_score_definitions_bulk_update.catalystcenter_username if health_score_definitions_bulk_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ health_score_definitions_bulk_update.catalystcenter_verify if health_score_definitions_bulk_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ health_score_definitions_bulk_update.catalystcenter_version if health_score_definitions_bulk_update.catalystcenter_version is not none else omit }}"
        headers: "{{ health_score_definitions_bulk_update.headers if health_score_definitions_bulk_update.headers is not none else omit }}"
        payload: "{{ (health_score_definitions_bulk_update.payload | cat_strip_nulls) if (health_score_definitions_bulk_update.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ health_score_definitions_bulk_update.validate_response_schema if health_score_definitions_bulk_update.validate_response_schema is not none else omit }}"
      register: health_score_definitions_bulk_update_result
      tags:
        - never
        - health_score_definitions_bulk_update
