---
# Sample playbook for cisco.catalystcenter.custom_issue_definitions_info (cisco.catalystcenter 2.15.0)
# Build order: 1419
# Information module for Custom Issue Definitions
# Reads ../models/custom_issue_definitions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/custom_issue_definitions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1419 custom_issue_definitions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/custom_issue_definitions_info.yml
  tasks:
    - name: Run custom_issue_definitions_info from its model
      cisco.catalystcenter.custom_issue_definitions_info:
        catalystcenter_debug: "{{ custom_issue_definitions_info.catalystcenter_debug if custom_issue_definitions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ custom_issue_definitions_info.catalystcenter_host if custom_issue_definitions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ custom_issue_definitions_info.catalystcenter_password if custom_issue_definitions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ custom_issue_definitions_info.catalystcenter_port if custom_issue_definitions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ custom_issue_definitions_info.catalystcenter_username if custom_issue_definitions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ custom_issue_definitions_info.catalystcenter_verify if custom_issue_definitions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ custom_issue_definitions_info.catalystcenter_version if custom_issue_definitions_info.catalystcenter_version is not none else omit }}"
        facility: "{{ custom_issue_definitions_info.facility if custom_issue_definitions_info.facility is not none else omit }}"
        headers: "{{ custom_issue_definitions_info.headers if custom_issue_definitions_info.headers is not none else omit }}"
        id: "{{ custom_issue_definitions_info.id if custom_issue_definitions_info.id is not none else omit }}"
        isEnabled: "{{ custom_issue_definitions_info.isEnabled if custom_issue_definitions_info.isEnabled is not none else omit }}"
        limit: "{{ custom_issue_definitions_info.limit if custom_issue_definitions_info.limit is not none else omit }}"
        mnemonic: "{{ custom_issue_definitions_info.mnemonic if custom_issue_definitions_info.mnemonic is not none else omit }}"
        name: "{{ custom_issue_definitions_info.name if custom_issue_definitions_info.name is not none else omit }}"
        offset: "{{ custom_issue_definitions_info.offset if custom_issue_definitions_info.offset is not none else omit }}"
        order: "{{ custom_issue_definitions_info.order if custom_issue_definitions_info.order is not none else omit }}"
        priority: "{{ custom_issue_definitions_info.priority if custom_issue_definitions_info.priority is not none else omit }}"
        profileId: "{{ custom_issue_definitions_info.profileId if custom_issue_definitions_info.profileId is not none else omit }}"
        severity: "{{ custom_issue_definitions_info.severity if custom_issue_definitions_info.severity is not none else omit }}"
        sortBy: "{{ custom_issue_definitions_info.sortBy if custom_issue_definitions_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ custom_issue_definitions_info.validate_response_schema if custom_issue_definitions_info.validate_response_schema is not none else omit }}"
      register: custom_issue_definitions_info_result
