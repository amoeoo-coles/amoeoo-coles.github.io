---
# Sample playbook for cisco.catalystcenter.integration_settings_instances_itsm (cisco.catalystcenter 2.15.0)
# Build order: 92
# Resource module for Integration Settings Instances Itsm
# Reads ../models/integration_settings_instances_itsm.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/integration_settings_instances_itsm_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags integration_settings_instances_itsm.

- name: "0092 integration_settings_instances_itsm"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/integration_settings_instances_itsm.yml
  tasks:
    - name: Run integration_settings_instances_itsm from its model
      cisco.catalystcenter.integration_settings_instances_itsm:
        catalystcenter_debug: "{{ integration_settings_instances_itsm.catalystcenter_debug if integration_settings_instances_itsm.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ integration_settings_instances_itsm.catalystcenter_host if integration_settings_instances_itsm.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ integration_settings_instances_itsm.catalystcenter_password if integration_settings_instances_itsm.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ integration_settings_instances_itsm.catalystcenter_port if integration_settings_instances_itsm.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ integration_settings_instances_itsm.catalystcenter_username if integration_settings_instances_itsm.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ integration_settings_instances_itsm.catalystcenter_verify if integration_settings_instances_itsm.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ integration_settings_instances_itsm.catalystcenter_version if integration_settings_instances_itsm.catalystcenter_version is not none else omit }}"
        data: "{{ (integration_settings_instances_itsm.data | cat_strip_nulls) if (integration_settings_instances_itsm.data | cat_strip_nulls) is not none else omit }}"
        description: "{{ integration_settings_instances_itsm.description if integration_settings_instances_itsm.description is not none else omit }}"
        dypName: "{{ integration_settings_instances_itsm.dypName if integration_settings_instances_itsm.dypName is not none else omit }}"
        instanceId: "{{ integration_settings_instances_itsm.instanceId if integration_settings_instances_itsm.instanceId is not none else omit }}"
        name: "{{ integration_settings_instances_itsm.name if integration_settings_instances_itsm.name is not none else omit }}"
        validate_response_schema: "{{ integration_settings_instances_itsm.validate_response_schema if integration_settings_instances_itsm.validate_response_schema is not none else omit }}"
      register: integration_settings_instances_itsm_result
      tags:
        - never
        - integration_settings_instances_itsm
