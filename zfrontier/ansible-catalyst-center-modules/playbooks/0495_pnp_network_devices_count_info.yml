        catalystcenter_verify: "{{ pnp_network_devices_count_info.catalystcenter_verify if pnp_network_devices_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_network_devices_count_info.catalystcenter_version if pnp_network_devices_count_info.catalystcenter_version is not none else omit }}"
        contactedStatus: "{{ pnp_network_devices_count_info.contactedStatus if pnp_network_devices_count_info.contactedStatus is not none else omit }}"
        headers: "{{ pnp_network_devices_count_info.headers if pnp_network_devices_count_info.headers is not none else omit }}"
