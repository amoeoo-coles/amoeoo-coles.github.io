# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0495 pnp_network_devices_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_network_devices_count_info.yml
  tasks:
    - name: Run pnp_network_devices_count_info from its model
      cisco.catalystcenter.pnp_network_devices_count_info:
