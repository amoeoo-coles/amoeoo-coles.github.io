---
# Sample playbook for cisco.catalystcenter.authentication_policy_servers_info (cisco.catalystcenter 2.15.0)
# Build order: 11
# Information module for Authentication Policy Servers
# Reads ../models/authentication_policy_servers_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/authentication_policy_servers_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0011 authentication_policy_servers_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/authentication_policy_servers_info.yml
  tasks:
    - name: Run authentication_policy_servers_info from its model
      cisco.catalystcenter.authentication_policy_servers_info:
        catalystcenter_debug: "{{ authentication_policy_servers_info.catalystcenter_debug if authentication_policy_servers_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ authentication_policy_servers_info.catalystcenter_host if authentication_policy_servers_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ authentication_policy_servers_info.catalystcenter_password if authentication_policy_servers_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ authentication_policy_servers_info.catalystcenter_port if authentication_policy_servers_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ authentication_policy_servers_info.catalystcenter_username if authentication_policy_servers_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ authentication_policy_servers_info.catalystcenter_verify if authentication_policy_servers_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ authentication_policy_servers_info.catalystcenter_version if authentication_policy_servers_info.catalystcenter_version is not none else omit }}"
        headers: "{{ authentication_policy_servers_info.headers if authentication_policy_servers_info.headers is not none else omit }}"
        isIseEnabled: "{{ authentication_policy_servers_info.isIseEnabled if authentication_policy_servers_info.isIseEnabled is not none else omit }}"
        role: "{{ authentication_policy_servers_info.role if authentication_policy_servers_info.role is not none else omit }}"
        state_: "{{ authentication_policy_servers_info.state_ if authentication_policy_servers_info.state_ is not none else omit }}"
        validate_response_schema: "{{ authentication_policy_servers_info.validate_response_schema if authentication_policy_servers_info.validate_response_schema is not none else omit }}"
      register: authentication_policy_servers_info_result
