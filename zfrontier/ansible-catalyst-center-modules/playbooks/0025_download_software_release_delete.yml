---
# Sample playbook for cisco.catalystcenter.download_software_release_delete (cisco.catalystcenter 2.15.0)
# Build order: 25
# Resource module for Download Software Release Delete
# Reads ../models/download_software_release_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/download_software_release_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags download_software_release_delete.

- name: "0025 download_software_release_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/download_software_release_delete.yml
  tasks:
    - name: Run download_software_release_delete from its model
      cisco.catalystcenter.download_software_release_delete:
        catalystcenter_debug: "{{ download_software_release_delete.catalystcenter_debug if download_software_release_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ download_software_release_delete.catalystcenter_host if download_software_release_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ download_software_release_delete.catalystcenter_password if download_software_release_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ download_software_release_delete.catalystcenter_port if download_software_release_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ download_software_release_delete.catalystcenter_username if download_software_release_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ download_software_release_delete.catalystcenter_verify if download_software_release_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ download_software_release_delete.catalystcenter_version if download_software_release_delete.catalystcenter_version is not none else omit }}"
        releaseName: "{{ download_software_release_delete.releaseName if download_software_release_delete.releaseName is not none else omit }}"
        releaseVersion: "{{ download_software_release_delete.releaseVersion if download_software_release_delete.releaseVersion is not none else omit }}"
        validate_response_schema: "{{ download_software_release_delete.validate_response_schema if download_software_release_delete.validate_response_schema is not none else omit }}"
      register: download_software_release_delete_result
      tags:
        - never
        - download_software_release_delete
