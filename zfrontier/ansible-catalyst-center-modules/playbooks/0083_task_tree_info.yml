---
# Sample playbook for cisco.catalystcenter.task_tree_info (cisco.catalystcenter 2.15.0)
# Build order: 83
# Information module for Task Tree
# Reads ../models/task_tree_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/task_tree_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0083 task_tree_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/task_tree_info.yml
  tasks:
    - name: Run task_tree_info from its model
      cisco.catalystcenter.task_tree_info:
        catalystcenter_debug: "{{ task_tree_info.catalystcenter_debug if task_tree_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ task_tree_info.catalystcenter_host if task_tree_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ task_tree_info.catalystcenter_password if task_tree_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ task_tree_info.catalystcenter_port if task_tree_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ task_tree_info.catalystcenter_username if task_tree_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ task_tree_info.catalystcenter_verify if task_tree_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ task_tree_info.catalystcenter_version if task_tree_info.catalystcenter_version is not none else omit }}"
        headers: "{{ task_tree_info.headers if task_tree_info.headers is not none else omit }}"
        taskId: "{{ task_tree_info.taskId if task_tree_info.taskId is not none else omit }}"
        validate_response_schema: "{{ task_tree_info.validate_response_schema if task_tree_info.validate_response_schema is not none else omit }}"
      register: task_tree_info_result
