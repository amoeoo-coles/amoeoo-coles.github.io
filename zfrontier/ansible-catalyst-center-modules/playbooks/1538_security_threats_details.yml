---
# Sample playbook for cisco.catalystcenter.security_threats_details (cisco.catalystcenter 2.15.0)
# Build order: 1538
# Resource module for Security Threats Details
# Reads ../models/security_threats_details.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_threats_details_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_threats_details.

- name: "1538 security_threats_details"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_threats_details.yml
  tasks:
    - name: Run security_threats_details from its model
      cisco.catalystcenter.security_threats_details:
        catalystcenter_debug: "{{ security_threats_details.catalystcenter_debug if security_threats_details.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_threats_details.catalystcenter_host if security_threats_details.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_threats_details.catalystcenter_password if security_threats_details.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_threats_details.catalystcenter_port if security_threats_details.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_threats_details.catalystcenter_username if security_threats_details.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_threats_details.catalystcenter_verify if security_threats_details.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_threats_details.catalystcenter_version if security_threats_details.catalystcenter_version is not none else omit }}"
        endTime: "{{ security_threats_details.endTime if security_threats_details.endTime is not none else omit }}"
        isNewThreat: "{{ security_threats_details.isNewThreat if security_threats_details.isNewThreat is not none else omit }}"
        limit: "{{ security_threats_details.limit if security_threats_details.limit is not none else omit }}"
        offset: "{{ security_threats_details.offset if security_threats_details.offset is not none else omit }}"
        siteId: "{{ (security_threats_details.siteId | cat_strip_nulls) if (security_threats_details.siteId | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ security_threats_details.startTime if security_threats_details.startTime is not none else omit }}"
        threatLevel: "{{ (security_threats_details.threatLevel | cat_strip_nulls) if (security_threats_details.threatLevel | cat_strip_nulls) is not none else omit }}"
        threatType: "{{ (security_threats_details.threatType | cat_strip_nulls) if (security_threats_details.threatType | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ security_threats_details.validate_response_schema if security_threats_details.validate_response_schema is not none else omit }}"
      register: security_threats_details_result
      tags:
        - never
        - security_threats_details
