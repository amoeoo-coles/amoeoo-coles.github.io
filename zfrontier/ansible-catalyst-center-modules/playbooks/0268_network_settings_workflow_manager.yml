---
# Sample playbook for cisco.catalystcenter.network_settings_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 268
# Resource module for IP Address pools and network functions
# Reads ../models/network_settings_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_settings_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_settings_workflow_manager.

- name: "0268 network_settings_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_settings_workflow_manager.yml
  tasks:
    - name: Run network_settings_workflow_manager from its model
      cisco.catalystcenter.network_settings_workflow_manager:
        catalystcenter_api_task_timeout: "{{ network_settings_workflow_manager.catalystcenter_api_task_timeout if network_settings_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ network_settings_workflow_manager.catalystcenter_debug if network_settings_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_settings_workflow_manager.catalystcenter_host if network_settings_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ network_settings_workflow_manager.catalystcenter_log if network_settings_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ network_settings_workflow_manager.catalystcenter_log_append if network_settings_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ network_settings_workflow_manager.catalystcenter_log_file_path if network_settings_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ network_settings_workflow_manager.catalystcenter_log_level if network_settings_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ network_settings_workflow_manager.catalystcenter_password if network_settings_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_settings_workflow_manager.catalystcenter_port if network_settings_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ network_settings_workflow_manager.catalystcenter_task_poll_interval if network_settings_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ network_settings_workflow_manager.catalystcenter_username if network_settings_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_settings_workflow_manager.catalystcenter_verify if network_settings_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_settings_workflow_manager.catalystcenter_version if network_settings_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (network_settings_workflow_manager.config | cat_strip_nulls) if (network_settings_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ network_settings_workflow_manager.config_verify if network_settings_workflow_manager.config_verify is not none else omit }}"
        state: "{{ network_settings_workflow_manager.state if network_settings_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ network_settings_workflow_manager.validate_response_schema if network_settings_workflow_manager.validate_response_schema is not none else omit }}"
      register: network_settings_workflow_manager_result
      tags:
        - never
        - network_settings_workflow_manager
