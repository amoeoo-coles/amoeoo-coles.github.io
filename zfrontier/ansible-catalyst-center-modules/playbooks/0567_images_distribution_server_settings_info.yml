---
# Sample playbook for cisco.catalystcenter.images_distribution_server_settings_info (cisco.catalystcenter 2.15.0)
# Build order: 567
# Information module for Images Distribution Server Settings
# Reads ../models/images_distribution_server_settings_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_distribution_server_settings_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0567 images_distribution_server_settings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_distribution_server_settings_info.yml
  tasks:
    - name: Run images_distribution_server_settings_info from its model
      cisco.catalystcenter.images_distribution_server_settings_info:
        catalystcenter_debug: "{{ images_distribution_server_settings_info.catalystcenter_debug if images_distribution_server_settings_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_distribution_server_settings_info.catalystcenter_host if images_distribution_server_settings_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_distribution_server_settings_info.catalystcenter_password if images_distribution_server_settings_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_distribution_server_settings_info.catalystcenter_port if images_distribution_server_settings_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_distribution_server_settings_info.catalystcenter_username if images_distribution_server_settings_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_distribution_server_settings_info.catalystcenter_verify if images_distribution_server_settings_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_distribution_server_settings_info.catalystcenter_version if images_distribution_server_settings_info.catalystcenter_version is not none else omit }}"
        headers: "{{ images_distribution_server_settings_info.headers if images_distribution_server_settings_info.headers is not none else omit }}"
        id: "{{ images_distribution_server_settings_info.id if images_distribution_server_settings_info.id is not none else omit }}"
        validate_response_schema: "{{ images_distribution_server_settings_info.validate_response_schema if images_distribution_server_settings_info.validate_response_schema is not none else omit }}"
      register: images_distribution_server_settings_info_result
