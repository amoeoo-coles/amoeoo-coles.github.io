---
# Sample playbook for cisco.catalystcenter.assurance_issues_update (cisco.catalystcenter 2.15.0)
# Build order: 1412
# Resource module for Assurance Issues Update
# Reads ../models/assurance_issues_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_issues_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assurance_issues_update.

- name: "1412 assurance_issues_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_issues_update.yml
  tasks:
    - name: Run assurance_issues_update from its model
      cisco.catalystcenter.assurance_issues_update:
        catalystcenter_debug: "{{ assurance_issues_update.catalystcenter_debug if assurance_issues_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_issues_update.catalystcenter_host if assurance_issues_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_issues_update.catalystcenter_password if assurance_issues_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_issues_update.catalystcenter_port if assurance_issues_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_issues_update.catalystcenter_username if assurance_issues_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_issues_update.catalystcenter_verify if assurance_issues_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_issues_update.catalystcenter_version if assurance_issues_update.catalystcenter_version is not none else omit }}"
        headers: "{{ assurance_issues_update.headers if assurance_issues_update.headers is not none else omit }}"
        id: "{{ assurance_issues_update.id if assurance_issues_update.id is not none else omit }}"
        notes: "{{ assurance_issues_update.notes if assurance_issues_update.notes is not none else omit }}"
        validate_response_schema: "{{ assurance_issues_update.validate_response_schema if assurance_issues_update.validate_response_schema is not none else omit }}"
      register: assurance_issues_update_result
      tags:
        - never
        - assurance_issues_update
