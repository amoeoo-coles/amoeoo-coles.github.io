        catalystcenter_password: "{{ switches_configs_intended_security_update.catalystcenter_password if switches_configs_intended_security_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ switches_configs_intended_security_update.catalystcenter_port if switches_configs_intended_security_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ switches_configs_intended_security_update.catalystcenter_username if switches_configs_intended_security_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ switches_configs_intended_security_update.catalystcenter_verify if switches_configs_intended_security_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ switches_configs_intended_security_update.catalystcenter_version if switches_configs_intended_security_update.catalystcenter_version is not none else omit }}"
