        dhcpSnoopingConfig: "{{ (switches_configs_intended_security_update.dhcpSnoopingConfig | cat_strip_nulls) if (switches_configs_intended_security_update.dhcpSnoopingConfig | cat_strip_nulls) is not none else omit }}"
        dot1xConfig: "{{ (switches_configs_intended_security_update.dot1xConfig | cat_strip_nulls) if (switches_configs_intended_security_update.dot1xConfig | cat_strip_nulls) is not none else omit }}"
