        validate_response_schema: "{{ switches_configs_intended_security_update.validate_response_schema if switches_configs_intended_security_update.validate_response_schema is not none else omit }}"
      register: switches_configs_intended_security_update_result
      tags:
        - never
        - switches_configs_intended_security_update
