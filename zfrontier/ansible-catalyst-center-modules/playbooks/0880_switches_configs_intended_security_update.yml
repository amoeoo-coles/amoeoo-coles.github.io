---
# Sample playbook for cisco.catalystcenter.switches_configs_intended_security_update (cisco.catalystcenter 2.15.0)
# Build order: 880
# Resource module for Switches Configs Intended Security Update
# Reads ../models/switches_configs_intended_security_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/switches_configs_intended_security_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags switches_configs_intended_security_update.

- name: "0880 switches_configs_intended_security_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/switches_configs_intended_security_update.yml
  tasks:
    - name: Run switches_configs_intended_security_update from its model
      cisco.catalystcenter.switches_configs_intended_security_update:
        arpInspectionConfig: "{{ (switches_configs_intended_security_update.arpInspectionConfig | cat_strip_nulls) if (switches_configs_intended_security_update.arpInspectionConfig | cat_strip_nulls) is not none else omit }}"
