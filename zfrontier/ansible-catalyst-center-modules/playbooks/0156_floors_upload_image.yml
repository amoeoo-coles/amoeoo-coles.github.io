---
# Sample playbook for cisco.catalystcenter.floors_upload_image (cisco.catalystcenter 2.15.0)
# Build order: 156
# Resource module for Floors Upload Image
# Reads ../models/floors_upload_image.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/floors_upload_image_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags floors_upload_image.

- name: "0156 floors_upload_image"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/floors_upload_image.yml
  tasks:
    - name: Run floors_upload_image from its model
      cisco.catalystcenter.floors_upload_image:
        catalystcenter_debug: "{{ floors_upload_image.catalystcenter_debug if floors_upload_image.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ floors_upload_image.catalystcenter_host if floors_upload_image.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ floors_upload_image.catalystcenter_password if floors_upload_image.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ floors_upload_image.catalystcenter_port if floors_upload_image.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ floors_upload_image.catalystcenter_username if floors_upload_image.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ floors_upload_image.catalystcenter_verify if floors_upload_image.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ floors_upload_image.catalystcenter_version if floors_upload_image.catalystcenter_version is not none else omit }}"
        id: "{{ floors_upload_image.id if floors_upload_image.id is not none else omit }}"
        validate_response_schema: "{{ floors_upload_image.validate_response_schema if floors_upload_image.validate_response_schema is not none else omit }}"
      register: floors_upload_image_result
      tags:
        - never
        - floors_upload_image
