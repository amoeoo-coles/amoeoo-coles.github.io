---
# Sample playbook for cisco.catalystcenter.compliance_policys_rules (cisco.catalystcenter 2.15.0)
# Build order: 643
# Resource module for Compliance Policys Rules
# Reads ../models/compliance_policys_rules.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_policys_rules_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_policys_rules.

- name: "0643 compliance_policys_rules"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_policys_rules.yml
  tasks:
    - name: Run compliance_policys_rules from its model
      cisco.catalystcenter.compliance_policys_rules:
        catalystcenter_debug: "{{ compliance_policys_rules.catalystcenter_debug if compliance_policys_rules.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_policys_rules.catalystcenter_host if compliance_policys_rules.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_policys_rules.catalystcenter_password if compliance_policys_rules.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_policys_rules.catalystcenter_port if compliance_policys_rules.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_policys_rules.catalystcenter_username if compliance_policys_rules.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_policys_rules.catalystcenter_verify if compliance_policys_rules.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_policys_rules.catalystcenter_version if compliance_policys_rules.catalystcenter_version is not none else omit }}"
        conditionsCount: "{{ compliance_policys_rules.conditionsCount if compliance_policys_rules.conditionsCount is not none else omit }}"
        description: "{{ compliance_policys_rules.description if compliance_policys_rules.description is not none else omit }}"
        deviceTypes: "{{ (compliance_policys_rules.deviceTypes | cat_strip_nulls) if (compliance_policys_rules.deviceTypes | cat_strip_nulls) is not none else omit }}"
        id: "{{ compliance_policys_rules.id if compliance_policys_rules.id is not none else omit }}"
        impact: "{{ compliance_policys_rules.impact if compliance_policys_rules.impact is not none else omit }}"
        name: "{{ compliance_policys_rules.name if compliance_policys_rules.name is not none else omit }}"
        policyId: "{{ compliance_policys_rules.policyId if compliance_policys_rules.policyId is not none else omit }}"
        softwareType: "{{ compliance_policys_rules.softwareType if compliance_policys_rules.softwareType is not none else omit }}"
        suggestedFix: "{{ compliance_policys_rules.suggestedFix if compliance_policys_rules.suggestedFix is not none else omit }}"
        validate_response_schema: "{{ compliance_policys_rules.validate_response_schema if compliance_policys_rules.validate_response_schema is not none else omit }}"
        variablesCount: "{{ compliance_policys_rules.variablesCount if compliance_policys_rules.variablesCount is not none else omit }}"
      register: compliance_policys_rules_result
      tags:
        - never
        - compliance_policys_rules
