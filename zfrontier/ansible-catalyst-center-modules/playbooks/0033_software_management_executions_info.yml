---
# Sample playbook for cisco.catalystcenter.software_management_executions_info (cisco.catalystcenter 2.15.0)
# Build order: 33
# Information module for Software Management Executions
# Reads ../models/software_management_executions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/software_management_executions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0033 software_management_executions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/software_management_executions_info.yml
  tasks:
    - name: Run software_management_executions_info from its model
      cisco.catalystcenter.software_management_executions_info:
        catalystcenter_debug: "{{ software_management_executions_info.catalystcenter_debug if software_management_executions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ software_management_executions_info.catalystcenter_host if software_management_executions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ software_management_executions_info.catalystcenter_password if software_management_executions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ software_management_executions_info.catalystcenter_port if software_management_executions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ software_management_executions_info.catalystcenter_username if software_management_executions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ software_management_executions_info.catalystcenter_verify if software_management_executions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ software_management_executions_info.catalystcenter_version if software_management_executions_info.catalystcenter_version is not none else omit }}"
        headers: "{{ software_management_executions_info.headers if software_management_executions_info.headers is not none else omit }}"
        id: "{{ software_management_executions_info.id if software_management_executions_info.id is not none else omit }}"
        validate_response_schema: "{{ software_management_executions_info.validate_response_schema if software_management_executions_info.validate_response_schema is not none else omit }}"
      register: software_management_executions_info_result
