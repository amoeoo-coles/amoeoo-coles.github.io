---
# Sample playbook for cisco.catalystcenter.upgrade_software_release_create (cisco.catalystcenter 2.15.0)
# Build order: 29
# Resource module for Upgrade Software Release Create
# Reads ../models/upgrade_software_release_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/upgrade_software_release_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags upgrade_software_release_create.

- name: "0029 upgrade_software_release_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/upgrade_software_release_create.yml
  tasks:
    - name: Run upgrade_software_release_create from its model
      cisco.catalystcenter.upgrade_software_release_create:
        catalystcenter_debug: "{{ upgrade_software_release_create.catalystcenter_debug if upgrade_software_release_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ upgrade_software_release_create.catalystcenter_host if upgrade_software_release_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ upgrade_software_release_create.catalystcenter_password if upgrade_software_release_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ upgrade_software_release_create.catalystcenter_port if upgrade_software_release_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ upgrade_software_release_create.catalystcenter_username if upgrade_software_release_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ upgrade_software_release_create.catalystcenter_verify if upgrade_software_release_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ upgrade_software_release_create.catalystcenter_version if upgrade_software_release_create.catalystcenter_version is not none else omit }}"
        optionalPackages: "{{ (upgrade_software_release_create.optionalPackages | cat_strip_nulls) if (upgrade_software_release_create.optionalPackages | cat_strip_nulls) is not none else omit }}"
        releaseName: "{{ upgrade_software_release_create.releaseName if upgrade_software_release_create.releaseName is not none else omit }}"
        releaseVersion: "{{ upgrade_software_release_create.releaseVersion if upgrade_software_release_create.releaseVersion is not none else omit }}"
        validate_response_schema: "{{ upgrade_software_release_create.validate_response_schema if upgrade_software_release_create.validate_response_schema is not none else omit }}"
      register: upgrade_software_release_create_result
      tags:
        - never
        - upgrade_software_release_create
