---
# Sample playbook for cisco.catalystcenter.client_health_info (cisco.catalystcenter 2.15.0)
# Build order: 1398
# Information module for Client Health
# Reads ../models/client_health_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/client_health_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1398 client_health_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/client_health_info.yml
  tasks:
    - name: Run client_health_info from its model
      cisco.catalystcenter.client_health_info:
        catalystcenter_debug: "{{ client_health_info.catalystcenter_debug if client_health_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ client_health_info.catalystcenter_host if client_health_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ client_health_info.catalystcenter_password if client_health_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ client_health_info.catalystcenter_port if client_health_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ client_health_info.catalystcenter_username if client_health_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ client_health_info.catalystcenter_verify if client_health_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ client_health_info.catalystcenter_version if client_health_info.catalystcenter_version is not none else omit }}"
        headers: "{{ client_health_info.headers if client_health_info.headers is not none else omit }}"
        timestamp: "{{ client_health_info.timestamp if client_health_info.timestamp is not none else omit }}"
        validate_response_schema: "{{ client_health_info.validate_response_schema if client_health_info.validate_response_schema is not none else omit }}"
      register: client_health_info_result
