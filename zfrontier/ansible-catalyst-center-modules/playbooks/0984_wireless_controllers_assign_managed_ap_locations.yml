---
# Sample playbook for cisco.catalystcenter.wireless_controllers_assign_managed_ap_locations (cisco.catalystcenter 2.15.0)
# Build order: 984
# Resource module for Wireless Controllers Assign Managed Ap Locations
# Reads ../models/wireless_controllers_assign_managed_ap_locations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_assign_managed_ap_locations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_assign_managed_ap_locations.

- name: "0984 wireless_controllers_assign_managed_ap_locations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_assign_managed_ap_locations.yml
  tasks:
    - name: Run wireless_controllers_assign_managed_ap_locations from its model
      cisco.catalystcenter.wireless_controllers_assign_managed_ap_locations:
        catalystcenter_debug: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_debug if wireless_controllers_assign_managed_ap_locations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_host if wireless_controllers_assign_managed_ap_locations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_password if wireless_controllers_assign_managed_ap_locations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_port if wireless_controllers_assign_managed_ap_locations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_username if wireless_controllers_assign_managed_ap_locations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_verify if wireless_controllers_assign_managed_ap_locations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_assign_managed_ap_locations.catalystcenter_version if wireless_controllers_assign_managed_ap_locations.catalystcenter_version is not none else omit }}"
        deviceId: "{{ wireless_controllers_assign_managed_ap_locations.deviceId if wireless_controllers_assign_managed_ap_locations.deviceId is not none else omit }}"
        primaryManagedAPLocationsSiteIds: "{{ (wireless_controllers_assign_managed_ap_locations.primaryManagedAPLocationsSiteIds | cat_strip_nulls) if (wireless_controllers_assign_managed_ap_locations.primaryManagedAPLocationsSiteIds | cat_strip_nulls) is not none else omit }}"
        secondaryManagedAPLocationsSiteIds: "{{ (wireless_controllers_assign_managed_ap_locations.secondaryManagedAPLocationsSiteIds | cat_strip_nulls) if (wireless_controllers_assign_managed_ap_locations.secondaryManagedAPLocationsSiteIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_assign_managed_ap_locations.validate_response_schema if wireless_controllers_assign_managed_ap_locations.validate_response_schema is not none else omit }}"
      register: wireless_controllers_assign_managed_ap_locations_result
      tags:
        - never
        - wireless_controllers_assign_managed_ap_locations
