        catalystcenter_port: "{{ wireless_controllers_intended_ssids_policy_profiles_mobility_export_anchors.catalystcenter_port if wireless_controllers_intended_ssids_policy_profiles_mobility_export_anchors.catalystcenter_port is not none else omit }}"
