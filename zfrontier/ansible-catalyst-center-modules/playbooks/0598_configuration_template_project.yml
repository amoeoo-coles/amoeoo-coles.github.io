---
# Sample playbook for cisco.catalystcenter.configuration_template_project (cisco.catalystcenter 2.15.0)
# Build order: 598
# Resource module for Configuration Template Project
# Reads ../models/configuration_template_project.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_project_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_project.

- name: "0598 configuration_template_project"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_project.yml
  tasks:
    - name: Run configuration_template_project from its model
      cisco.catalystcenter.configuration_template_project:
        catalystcenter_debug: "{{ configuration_template_project.catalystcenter_debug if configuration_template_project.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_project.catalystcenter_host if configuration_template_project.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_project.catalystcenter_password if configuration_template_project.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_project.catalystcenter_port if configuration_template_project.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_project.catalystcenter_username if configuration_template_project.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_project.catalystcenter_verify if configuration_template_project.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_project.catalystcenter_version if configuration_template_project.catalystcenter_version is not none else omit }}"
        createTime: "{{ configuration_template_project.createTime if configuration_template_project.createTime is not none else omit }}"
        description: "{{ configuration_template_project.description if configuration_template_project.description is not none else omit }}"
        id: "{{ configuration_template_project.id if configuration_template_project.id is not none else omit }}"
        lastUpdateTime: "{{ configuration_template_project.lastUpdateTime if configuration_template_project.lastUpdateTime is not none else omit }}"
        name: "{{ configuration_template_project.name if configuration_template_project.name is not none else omit }}"
        projectId: "{{ configuration_template_project.projectId if configuration_template_project.projectId is not none else omit }}"
        tags: "{{ (configuration_template_project.tags | cat_strip_nulls) if (configuration_template_project.tags | cat_strip_nulls) is not none else omit }}"
        templates: "{{ (configuration_template_project.templates | cat_strip_nulls) if (configuration_template_project.templates | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ configuration_template_project.validate_response_schema if configuration_template_project.validate_response_schema is not none else omit }}"
      register: configuration_template_project_result
      tags:
        - never
        - configuration_template_project
