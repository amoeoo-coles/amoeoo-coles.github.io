---
# Sample playbook for cisco.catalystcenter.device_details_info (cisco.catalystcenter 2.15.0)
# Build order: 390
# Information module for Device Details
# Reads ../models/device_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0390 device_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_details_info.yml
  tasks:
    - name: Run device_details_info from its model
      cisco.catalystcenter.device_details_info:
        catalystcenter_debug: "{{ device_details_info.catalystcenter_debug if device_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_details_info.catalystcenter_host if device_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_details_info.catalystcenter_password if device_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_details_info.catalystcenter_port if device_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_details_info.catalystcenter_username if device_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_details_info.catalystcenter_verify if device_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_details_info.catalystcenter_version if device_details_info.catalystcenter_version is not none else omit }}"
        headers: "{{ device_details_info.headers if device_details_info.headers is not none else omit }}"
        identifier: "{{ device_details_info.identifier if device_details_info.identifier is not none else omit }}"
        searchBy: "{{ device_details_info.searchBy if device_details_info.searchBy is not none else omit }}"
        timestamp: "{{ device_details_info.timestamp if device_details_info.timestamp is not none else omit }}"
        validate_response_schema: "{{ device_details_info.validate_response_schema if device_details_info.validate_response_schema is not none else omit }}"
      register: device_details_info_result
