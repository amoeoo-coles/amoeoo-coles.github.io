---
# Sample playbook for cisco.catalystcenter.wireless_policies_ip_access_control_lists_protocol (cisco.catalystcenter 2.15.0)
# Build order: 1032
# Resource module for Wireless Policies Ip Access Control Lists Protocol
# Reads ../models/wireless_policies_ip_access_control_lists_protocol.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_policies_ip_access_control_lists_protocol_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_policies_ip_access_control_lists_protocol.

- name: "1032 wireless_policies_ip_access_control_lists_protocol"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_policies_ip_access_control_lists_protocol.yml
  tasks:
    - name: Run wireless_policies_ip_access_control_lists_protocol from its model
      cisco.catalystcenter.wireless_policies_ip_access_control_lists_protocol:
        catalystcenter_debug: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_debug if wireless_policies_ip_access_control_lists_protocol.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_host if wireless_policies_ip_access_control_lists_protocol.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_password if wireless_policies_ip_access_control_lists_protocol.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_port if wireless_policies_ip_access_control_lists_protocol.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_username if wireless_policies_ip_access_control_lists_protocol.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_verify if wireless_policies_ip_access_control_lists_protocol.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_policies_ip_access_control_lists_protocol.catalystcenter_version if wireless_policies_ip_access_control_lists_protocol.catalystcenter_version is not none else omit }}"
        ignoreConflict: "{{ wireless_policies_ip_access_control_lists_protocol.ignoreConflict if wireless_policies_ip_access_control_lists_protocol.ignoreConflict is not none else omit }}"
        name: "{{ wireless_policies_ip_access_control_lists_protocol.name if wireless_policies_ip_access_control_lists_protocol.name is not none else omit }}"
        ports: "{{ wireless_policies_ip_access_control_lists_protocol.ports if wireless_policies_ip_access_control_lists_protocol.ports is not none else omit }}"
        protocol: "{{ wireless_policies_ip_access_control_lists_protocol.protocol if wireless_policies_ip_access_control_lists_protocol.protocol is not none else omit }}"
        validate_response_schema: "{{ wireless_policies_ip_access_control_lists_protocol.validate_response_schema if wireless_policies_ip_access_control_lists_protocol.validate_response_schema is not none else omit }}"
      register: wireless_policies_ip_access_control_lists_protocol_result
      tags:
        - never
        - wireless_policies_ip_access_control_lists_protocol
