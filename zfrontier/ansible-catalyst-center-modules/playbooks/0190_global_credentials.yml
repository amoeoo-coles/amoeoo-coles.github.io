---
# Sample playbook for cisco.catalystcenter.global_credentials (cisco.catalystcenter 2.15.0)
# Build order: 190
# Resource module for Global Credentials
# Reads ../models/global_credentials.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/global_credentials_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags global_credentials.

- name: "0190 global_credentials"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/global_credentials.yml
  tasks:
    - name: Run global_credentials from its model
      cisco.catalystcenter.global_credentials:
        authPassword: "{{ global_credentials.authPassword if global_credentials.authPassword is not none else omit }}"
        authType: "{{ global_credentials.authType if global_credentials.authType is not none else omit }}"
        catalystcenter_debug: "{{ global_credentials.catalystcenter_debug if global_credentials.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ global_credentials.catalystcenter_host if global_credentials.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ global_credentials.catalystcenter_password if global_credentials.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ global_credentials.catalystcenter_port if global_credentials.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ global_credentials.catalystcenter_username if global_credentials.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ global_credentials.catalystcenter_verify if global_credentials.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ global_credentials.catalystcenter_version if global_credentials.catalystcenter_version is not none else omit }}"
        description: "{{ global_credentials.description if global_credentials.description is not none else omit }}"
        enablePassword: "{{ global_credentials.enablePassword if global_credentials.enablePassword is not none else omit }}"
        id: "{{ global_credentials.id if global_credentials.id is not none else omit }}"
        mode: "{{ global_credentials.mode if global_credentials.mode is not none else omit }}"
        password: "{{ global_credentials.password if global_credentials.password is not none else omit }}"
        port: "{{ global_credentials.port if global_credentials.port is not none else omit }}"
        privacyPassword: "{{ global_credentials.privacyPassword if global_credentials.privacyPassword is not none else omit }}"
        privacyType: "{{ global_credentials.privacyType if global_credentials.privacyType is not none else omit }}"
        protocol: "{{ global_credentials.protocol if global_credentials.protocol is not none else omit }}"
        readCommunity: "{{ global_credentials.readCommunity if global_credentials.readCommunity is not none else omit }}"
        type: "{{ global_credentials.type if global_credentials.type is not none else omit }}"
        username: "{{ global_credentials.username if global_credentials.username is not none else omit }}"
        validate_response_schema: "{{ global_credentials.validate_response_schema if global_credentials.validate_response_schema is not none else omit }}"
        writeCommunity: "{{ global_credentials.writeCommunity if global_credentials.writeCommunity is not none else omit }}"
      register: global_credentials_result
      tags:
        - never
        - global_credentials
