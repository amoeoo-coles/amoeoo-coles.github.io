        catalystcenter_port: "{{ wireless_access_points_factory_reset_request_status_info.catalystcenter_port if wireless_access_points_factory_reset_request_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_access_points_factory_reset_request_status_info.catalystcenter_username if wireless_access_points_factory_reset_request_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_access_points_factory_reset_request_status_info.catalystcenter_verify if wireless_access_points_factory_reset_request_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_access_points_factory_reset_request_status_info.catalystcenter_version if wireless_access_points_factory_reset_request_status_info.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_access_points_factory_reset_request_status_info.headers if wireless_access_points_factory_reset_request_status_info.headers is not none else omit }}"
        taskId: "{{ wireless_access_points_factory_reset_request_status_info.taskId if wireless_access_points_factory_reset_request_status_info.taskId is not none else omit }}"
        validate_response_schema: "{{ wireless_access_points_factory_reset_request_status_info.validate_response_schema if wireless_access_points_factory_reset_request_status_info.validate_response_schema is not none else omit }}"
      register: wireless_access_points_factory_reset_request_status_info_result
