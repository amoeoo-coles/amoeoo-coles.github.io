---
# Sample playbook for cisco.catalystcenter.wireless_access_points_factory_reset_request_status_info (cisco.catalystcenter 2.15.0)
# Build order: 1081
# Information module for Wireless Access Points Factory Reset Request Status
# Reads ../models/wireless_access_points_factory_reset_request_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_access_points_factory_reset_request_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1081 wireless_access_points_factory_reset_request_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_access_points_factory_reset_request_status_info.yml
  tasks:
    - name: Run wireless_access_points_factory_reset_request_status_info from its model
      cisco.catalystcenter.wireless_access_points_factory_reset_request_status_info:
