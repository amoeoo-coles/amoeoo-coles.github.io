---
# Sample playbook for cisco.catalystcenter.wireless_provision_ssid_delete_reprovision (cisco.catalystcenter 2.15.0)
# Build order: 1043
# Resource module for Wireless Provision Ssid Delete Reprovision
# Reads ../models/wireless_provision_ssid_delete_reprovision.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_provision_ssid_delete_reprovision_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_provision_ssid_delete_reprovision.

- name: "1043 wireless_provision_ssid_delete_reprovision"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_provision_ssid_delete_reprovision.yml
  tasks:
    - name: Run wireless_provision_ssid_delete_reprovision from its model
      cisco.catalystcenter.wireless_provision_ssid_delete_reprovision:
        catalystcenter_debug: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_debug if wireless_provision_ssid_delete_reprovision.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_host if wireless_provision_ssid_delete_reprovision.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_password if wireless_provision_ssid_delete_reprovision.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_port if wireless_provision_ssid_delete_reprovision.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_username if wireless_provision_ssid_delete_reprovision.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_verify if wireless_provision_ssid_delete_reprovision.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_provision_ssid_delete_reprovision.catalystcenter_version if wireless_provision_ssid_delete_reprovision.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_provision_ssid_delete_reprovision.headers if wireless_provision_ssid_delete_reprovision.headers is not none else omit }}"
        managedAPLocations: "{{ wireless_provision_ssid_delete_reprovision.managedAPLocations if wireless_provision_ssid_delete_reprovision.managedAPLocations is not none else omit }}"
        ssidName: "{{ wireless_provision_ssid_delete_reprovision.ssidName if wireless_provision_ssid_delete_reprovision.ssidName is not none else omit }}"
        validate_response_schema: "{{ wireless_provision_ssid_delete_reprovision.validate_response_schema if wireless_provision_ssid_delete_reprovision.validate_response_schema is not none else omit }}"
      register: wireless_provision_ssid_delete_reprovision_result
      tags:
        - never
        - wireless_provision_ssid_delete_reprovision
