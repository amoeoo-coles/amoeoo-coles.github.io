---
# Sample playbook for cisco.catalystcenter.diagnostic_validation_workflows (cisco.catalystcenter 2.15.0)
# Build order: 1426
# Resource module for Diagnostic Validation Workflows
# Reads ../models/diagnostic_validation_workflows.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/diagnostic_validation_workflows_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags diagnostic_validation_workflows.

- name: "1426 diagnostic_validation_workflows"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/diagnostic_validation_workflows.yml
  tasks:
    - name: Run diagnostic_validation_workflows from its model
      cisco.catalystcenter.diagnostic_validation_workflows:
        catalystcenter_debug: "{{ diagnostic_validation_workflows.catalystcenter_debug if diagnostic_validation_workflows.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ diagnostic_validation_workflows.catalystcenter_host if diagnostic_validation_workflows.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ diagnostic_validation_workflows.catalystcenter_password if diagnostic_validation_workflows.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ diagnostic_validation_workflows.catalystcenter_port if diagnostic_validation_workflows.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ diagnostic_validation_workflows.catalystcenter_username if diagnostic_validation_workflows.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ diagnostic_validation_workflows.catalystcenter_verify if diagnostic_validation_workflows.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ diagnostic_validation_workflows.catalystcenter_version if diagnostic_validation_workflows.catalystcenter_version is not none else omit }}"
        description: "{{ diagnostic_validation_workflows.description if diagnostic_validation_workflows.description is not none else omit }}"
        id: "{{ diagnostic_validation_workflows.id if diagnostic_validation_workflows.id is not none else omit }}"
        name: "{{ diagnostic_validation_workflows.name if diagnostic_validation_workflows.name is not none else omit }}"
        validate_response_schema: "{{ diagnostic_validation_workflows.validate_response_schema if diagnostic_validation_workflows.validate_response_schema is not none else omit }}"
        validationSetIds: "{{ (diagnostic_validation_workflows.validationSetIds | cat_strip_nulls) if (diagnostic_validation_workflows.validationSetIds | cat_strip_nulls) is not none else omit }}"
      register: diagnostic_validation_workflows_result
      tags:
        - never
        - diagnostic_validation_workflows
