---
# Sample playbook for cisco.catalystcenter.network_bugs_trials (cisco.catalystcenter 2.15.0)
# Build order: 653
# Resource module for Network Bugs Trials
# Reads ../models/network_bugs_trials.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_bugs_trials_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_bugs_trials.

- name: "0653 network_bugs_trials"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_bugs_trials.yml
  tasks:
    - name: Run network_bugs_trials from its model
      cisco.catalystcenter.network_bugs_trials:
        catalystcenter_debug: "{{ network_bugs_trials.catalystcenter_debug if network_bugs_trials.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_bugs_trials.catalystcenter_host if network_bugs_trials.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_bugs_trials.catalystcenter_password if network_bugs_trials.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_bugs_trials.catalystcenter_port if network_bugs_trials.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_bugs_trials.catalystcenter_username if network_bugs_trials.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_bugs_trials.catalystcenter_verify if network_bugs_trials.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_bugs_trials.catalystcenter_version if network_bugs_trials.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ network_bugs_trials.validate_response_schema if network_bugs_trials.validate_response_schema is not none else omit }}"
      register: network_bugs_trials_result
      tags:
        - never
        - network_bugs_trials
