---
# Sample playbook for cisco.catalystcenter.releases_release_summary_info (cisco.catalystcenter 2.15.0)
# Build order: 32
# Information module for Releases Release Summary
# Reads ../models/releases_release_summary_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/releases_release_summary_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0032 releases_release_summary_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/releases_release_summary_info.yml
  tasks:
    - name: Run releases_release_summary_info from its model
      cisco.catalystcenter.releases_release_summary_info:
        catalystcenter_debug: "{{ releases_release_summary_info.catalystcenter_debug if releases_release_summary_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ releases_release_summary_info.catalystcenter_host if releases_release_summary_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ releases_release_summary_info.catalystcenter_password if releases_release_summary_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ releases_release_summary_info.catalystcenter_port if releases_release_summary_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ releases_release_summary_info.catalystcenter_username if releases_release_summary_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ releases_release_summary_info.catalystcenter_verify if releases_release_summary_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ releases_release_summary_info.catalystcenter_version if releases_release_summary_info.catalystcenter_version is not none else omit }}"
        headers: "{{ releases_release_summary_info.headers if releases_release_summary_info.headers is not none else omit }}"
        releaseName: "{{ releases_release_summary_info.releaseName if releases_release_summary_info.releaseName is not none else omit }}"
        releaseVersion: "{{ releases_release_summary_info.releaseVersion if releases_release_summary_info.releaseVersion is not none else omit }}"
        validate_response_schema: "{{ releases_release_summary_info.validate_response_schema if releases_release_summary_info.validate_response_schema is not none else omit }}"
      register: releases_release_summary_info_result
