---
# Sample playbook for cisco.catalystcenter.sda_extranet_policies_info (cisco.catalystcenter 2.15.0)
# Build order: 776
# Information module for Sda Extranet Policies
# Reads ../models/sda_extranet_policies_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_extranet_policies_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0776 sda_extranet_policies_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_extranet_policies_info.yml
  tasks:
    - name: Run sda_extranet_policies_info from its model
      cisco.catalystcenter.sda_extranet_policies_info:
        catalystcenter_debug: "{{ sda_extranet_policies_info.catalystcenter_debug if sda_extranet_policies_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_extranet_policies_info.catalystcenter_host if sda_extranet_policies_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_extranet_policies_info.catalystcenter_password if sda_extranet_policies_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_extranet_policies_info.catalystcenter_port if sda_extranet_policies_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_extranet_policies_info.catalystcenter_username if sda_extranet_policies_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_extranet_policies_info.catalystcenter_verify if sda_extranet_policies_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_extranet_policies_info.catalystcenter_version if sda_extranet_policies_info.catalystcenter_version is not none else omit }}"
        extranetPolicyName: "{{ sda_extranet_policies_info.extranetPolicyName if sda_extranet_policies_info.extranetPolicyName is not none else omit }}"
        headers: "{{ sda_extranet_policies_info.headers if sda_extranet_policies_info.headers is not none else omit }}"
        limit: "{{ sda_extranet_policies_info.limit if sda_extranet_policies_info.limit is not none else omit }}"
        offset: "{{ sda_extranet_policies_info.offset if sda_extranet_policies_info.offset is not none else omit }}"
        validate_response_schema: "{{ sda_extranet_policies_info.validate_response_schema if sda_extranet_policies_info.validate_response_schema is not none else omit }}"
      register: sda_extranet_policies_info_result
