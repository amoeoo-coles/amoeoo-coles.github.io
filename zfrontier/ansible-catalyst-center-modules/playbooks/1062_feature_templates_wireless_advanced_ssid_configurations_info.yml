        id: "{{ feature_templates_wireless_advanced_ssid_configurations_info.id if feature_templates_wireless_advanced_ssid_configurations_info.id is not none else omit }}"
        validate_response_schema: "{{ feature_templates_wireless_advanced_ssid_configurations_info.validate_response_schema if feature_templates_wireless_advanced_ssid_configurations_info.validate_response_schema is not none else omit }}"
      register: feature_templates_wireless_advanced_ssid_configurations_info_result
