        catalystcenter_username: "{{ feature_templates_wireless_advanced_ssid_configurations_info.catalystcenter_username if feature_templates_wireless_advanced_ssid_configurations_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ feature_templates_wireless_advanced_ssid_configurations_info.catalystcenter_verify if feature_templates_wireless_advanced_ssid_configurations_info.catalystcenter_verify is not none else omit }}"
