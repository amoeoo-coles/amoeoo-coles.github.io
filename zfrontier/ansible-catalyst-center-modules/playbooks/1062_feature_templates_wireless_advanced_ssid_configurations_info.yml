  tasks:
    - name: Run feature_templates_wireless_advanced_ssid_configurations_info from its model
      cisco.catalystcenter.feature_templates_wireless_advanced_ssid_configurations_info:
        catalystcenter_debug: "{{ feature_templates_wireless_advanced_ssid_configurations_info.catalystcenter_debug if feature_templates_wireless_advanced_ssid_configurations_info.catalystcenter_debug is not none else omit }}"
