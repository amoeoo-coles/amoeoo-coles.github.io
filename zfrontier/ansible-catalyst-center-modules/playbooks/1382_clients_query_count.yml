---
# Sample playbook for cisco.catalystcenter.clients_query_count (cisco.catalystcenter 2.15.0)
# Build order: 1382
# Resource module for Clients Query Count
# Reads ../models/clients_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/clients_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags clients_query_count.

- name: "1382 clients_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/clients_query_count.yml
  tasks:
    - name: Run clients_query_count from its model
      cisco.catalystcenter.clients_query_count:
        catalystcenter_debug: "{{ clients_query_count.catalystcenter_debug if clients_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ clients_query_count.catalystcenter_host if clients_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ clients_query_count.catalystcenter_password if clients_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ clients_query_count.catalystcenter_port if clients_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ clients_query_count.catalystcenter_username if clients_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ clients_query_count.catalystcenter_verify if clients_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ clients_query_count.catalystcenter_version if clients_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ clients_query_count.endTime if clients_query_count.endTime is not none else omit }}"
        filters: "{{ (clients_query_count.filters | cat_strip_nulls) if (clients_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ clients_query_count.headers if clients_query_count.headers is not none else omit }}"
        startTime: "{{ clients_query_count.startTime if clients_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ clients_query_count.validate_response_schema if clients_query_count.validate_response_schema is not none else omit }}"
      register: clients_query_count_result
      tags:
        - never
        - clients_query_count
