---
# Sample playbook for cisco.catalystcenter.aaa_services_query (cisco.catalystcenter 2.15.0)
# Build order: 296
# Resource module for Aaa Services Query
# Reads ../models/aaa_services_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/aaa_services_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags aaa_services_query.

- name: "0296 aaa_services_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/aaa_services_query.yml
  tasks:
    - name: Run aaa_services_query from its model
      cisco.catalystcenter.aaa_services_query:
        catalystcenter_debug: "{{ aaa_services_query.catalystcenter_debug if aaa_services_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ aaa_services_query.catalystcenter_host if aaa_services_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ aaa_services_query.catalystcenter_password if aaa_services_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ aaa_services_query.catalystcenter_port if aaa_services_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ aaa_services_query.catalystcenter_username if aaa_services_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ aaa_services_query.catalystcenter_verify if aaa_services_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ aaa_services_query.catalystcenter_version if aaa_services_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ aaa_services_query.endTime if aaa_services_query.endTime is not none else omit }}"
        filters: "{{ (aaa_services_query.filters | cat_strip_nulls) if (aaa_services_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ aaa_services_query.headers if aaa_services_query.headers is not none else omit }}"
        page: "{{ (aaa_services_query.page | cat_strip_nulls) if (aaa_services_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ aaa_services_query.startTime if aaa_services_query.startTime is not none else omit }}"
        validate_response_schema: "{{ aaa_services_query.validate_response_schema if aaa_services_query.validate_response_schema is not none else omit }}"
      register: aaa_services_query_result
      tags:
        - never
        - aaa_services_query
