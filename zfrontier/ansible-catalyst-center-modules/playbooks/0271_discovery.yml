---
# Sample playbook for cisco.catalystcenter.discovery (cisco.catalystcenter 2.15.0)
# Build order: 271
# Resource module for Discovery
# Reads ../models/discovery.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags discovery.

- name: "0271 discovery"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery.yml
  tasks:
    - name: Run discovery from its model
      cisco.catalystcenter.discovery:
        attributeInfo: "{{ discovery.attributeInfo if discovery.attributeInfo is not none else omit }}"
        catalystcenter_debug: "{{ discovery.catalystcenter_debug if discovery.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery.catalystcenter_host if discovery.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery.catalystcenter_password if discovery.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery.catalystcenter_port if discovery.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery.catalystcenter_username if discovery.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery.catalystcenter_verify if discovery.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery.catalystcenter_version if discovery.catalystcenter_version is not none else omit }}"
        cdpLevel: "{{ discovery.cdpLevel if discovery.cdpLevel is not none else omit }}"
        deviceIds: "{{ discovery.deviceIds if discovery.deviceIds is not none else omit }}"
        discoveryCondition: "{{ discovery.discoveryCondition if discovery.discoveryCondition is not none else omit }}"
        discoveryStatus: "{{ discovery.discoveryStatus if discovery.discoveryStatus is not none else omit }}"
        discoveryType: "{{ discovery.discoveryType if discovery.discoveryType is not none else omit }}"
        enablePasswordList: "{{ (discovery.enablePasswordList | cat_strip_nulls) if (discovery.enablePasswordList | cat_strip_nulls) is not none else omit }}"
        globalCredentialIdList: "{{ (discovery.globalCredentialIdList | cat_strip_nulls) if (discovery.globalCredentialIdList | cat_strip_nulls) is not none else omit }}"
        httpReadCredential: "{{ (discovery.httpReadCredential | cat_strip_nulls) if (discovery.httpReadCredential | cat_strip_nulls) is not none else omit }}"
        httpWriteCredential: "{{ (discovery.httpWriteCredential | cat_strip_nulls) if (discovery.httpWriteCredential | cat_strip_nulls) is not none else omit }}"
        id: "{{ discovery.id if discovery.id is not none else omit }}"
        ipAddressList: "{{ discovery.ipAddressList if discovery.ipAddressList is not none else omit }}"
        ipFilterList: "{{ (discovery.ipFilterList | cat_strip_nulls) if (discovery.ipFilterList | cat_strip_nulls) is not none else omit }}"
        isAutoCdp: "{{ discovery.isAutoCdp if discovery.isAutoCdp is not none else omit }}"
        lldpLevel: "{{ discovery.lldpLevel if discovery.lldpLevel is not none else omit }}"
        name: "{{ discovery.name if discovery.name is not none else omit }}"
        netconfPort: "{{ discovery.netconfPort if discovery.netconfPort is not none else omit }}"
        numDevices: "{{ discovery.numDevices if discovery.numDevices is not none else omit }}"
        parentDiscoveryId: "{{ discovery.parentDiscoveryId if discovery.parentDiscoveryId is not none else omit }}"
        passwordList: "{{ (discovery.passwordList | cat_strip_nulls) if (discovery.passwordList | cat_strip_nulls) is not none else omit }}"
        preferredMgmtIPMethod: "{{ discovery.preferredMgmtIPMethod if discovery.preferredMgmtIPMethod is not none else omit }}"
        protocolOrder: "{{ discovery.protocolOrder if discovery.protocolOrder is not none else omit }}"
        retry: "{{ discovery.retry if discovery.retry is not none else omit }}"
        retryCount: "{{ discovery.retryCount if discovery.retryCount is not none else omit }}"
        snmpAuthPassphrase: "{{ discovery.snmpAuthPassphrase if discovery.snmpAuthPassphrase is not none else omit }}"
        snmpAuthProtocol: "{{ discovery.snmpAuthProtocol if discovery.snmpAuthProtocol is not none else omit }}"
        snmpMode: "{{ discovery.snmpMode if discovery.snmpMode is not none else omit }}"
        snmpPrivPassphrase: "{{ discovery.snmpPrivPassphrase if discovery.snmpPrivPassphrase is not none else omit }}"
        snmpPrivProtocol: "{{ discovery.snmpPrivProtocol if discovery.snmpPrivProtocol is not none else omit }}"
        snmpROCommunity: "{{ discovery.snmpROCommunity if discovery.snmpROCommunity is not none else omit }}"
        snmpROCommunityDesc: "{{ discovery.snmpROCommunityDesc if discovery.snmpROCommunityDesc is not none else omit }}"
        snmpRWCommunity: "{{ discovery.snmpRWCommunity if discovery.snmpRWCommunity is not none else omit }}"
        snmpRWCommunityDesc: "{{ discovery.snmpRWCommunityDesc if discovery.snmpRWCommunityDesc is not none else omit }}"
        snmpUserName: "{{ discovery.snmpUserName if discovery.snmpUserName is not none else omit }}"
        snmpVersion: "{{ discovery.snmpVersion if discovery.snmpVersion is not none else omit }}"
        timeout: "{{ discovery.timeout if discovery.timeout is not none else omit }}"
        updateMgmtIp: "{{ discovery.updateMgmtIp if discovery.updateMgmtIp is not none else omit }}"
        userNameList: "{{ (discovery.userNameList | cat_strip_nulls) if (discovery.userNameList | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ discovery.validate_response_schema if discovery.validate_response_schema is not none else omit }}"
      register: discovery_result
      tags:
        - never
        - discovery
