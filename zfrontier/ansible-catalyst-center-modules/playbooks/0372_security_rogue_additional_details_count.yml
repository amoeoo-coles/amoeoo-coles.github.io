---
# Sample playbook for cisco.catalystcenter.security_rogue_additional_details_count (cisco.catalystcenter 2.15.0)
# Build order: 372
# Resource module for Security Rogue Additional Details Count
# Reads ../models/security_rogue_additional_details_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_rogue_additional_details_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_rogue_additional_details_count.

- name: "0372 security_rogue_additional_details_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_rogue_additional_details_count.yml
  tasks:
    - name: Run security_rogue_additional_details_count from its model
      cisco.catalystcenter.security_rogue_additional_details_count:
        catalystcenter_debug: "{{ security_rogue_additional_details_count.catalystcenter_debug if security_rogue_additional_details_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_rogue_additional_details_count.catalystcenter_host if security_rogue_additional_details_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_rogue_additional_details_count.catalystcenter_password if security_rogue_additional_details_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_rogue_additional_details_count.catalystcenter_port if security_rogue_additional_details_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_rogue_additional_details_count.catalystcenter_username if security_rogue_additional_details_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_rogue_additional_details_count.catalystcenter_verify if security_rogue_additional_details_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_rogue_additional_details_count.catalystcenter_version if security_rogue_additional_details_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ security_rogue_additional_details_count.endTime if security_rogue_additional_details_count.endTime is not none else omit }}"
        siteId: "{{ (security_rogue_additional_details_count.siteId | cat_strip_nulls) if (security_rogue_additional_details_count.siteId | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ security_rogue_additional_details_count.startTime if security_rogue_additional_details_count.startTime is not none else omit }}"
        threatLevel: "{{ (security_rogue_additional_details_count.threatLevel | cat_strip_nulls) if (security_rogue_additional_details_count.threatLevel | cat_strip_nulls) is not none else omit }}"
        threatType: "{{ (security_rogue_additional_details_count.threatType | cat_strip_nulls) if (security_rogue_additional_details_count.threatType | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ security_rogue_additional_details_count.validate_response_schema if security_rogue_additional_details_count.validate_response_schema is not none else omit }}"
      register: security_rogue_additional_details_count_result
      tags:
        - never
        - security_rogue_additional_details_count
