---
# Sample playbook for cisco.catalystcenter.sda_provision_devices_info (cisco.catalystcenter 2.15.0)
# Build order: 811
# Information module for Sda Provision Devices
# Reads ../models/sda_provision_devices_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_provision_devices_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0811 sda_provision_devices_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_provision_devices_info.yml
  tasks:
    - name: Run sda_provision_devices_info from its model
      cisco.catalystcenter.sda_provision_devices_info:
        catalystcenter_debug: "{{ sda_provision_devices_info.catalystcenter_debug if sda_provision_devices_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_provision_devices_info.catalystcenter_host if sda_provision_devices_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_provision_devices_info.catalystcenter_password if sda_provision_devices_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_provision_devices_info.catalystcenter_port if sda_provision_devices_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_provision_devices_info.catalystcenter_username if sda_provision_devices_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_provision_devices_info.catalystcenter_verify if sda_provision_devices_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_provision_devices_info.catalystcenter_version if sda_provision_devices_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_provision_devices_info.headers if sda_provision_devices_info.headers is not none else omit }}"
        id: "{{ sda_provision_devices_info.id if sda_provision_devices_info.id is not none else omit }}"
        limit: "{{ sda_provision_devices_info.limit if sda_provision_devices_info.limit is not none else omit }}"
        networkDeviceId: "{{ sda_provision_devices_info.networkDeviceId if sda_provision_devices_info.networkDeviceId is not none else omit }}"
        offset: "{{ sda_provision_devices_info.offset if sda_provision_devices_info.offset is not none else omit }}"
        siteId: "{{ sda_provision_devices_info.siteId if sda_provision_devices_info.siteId is not none else omit }}"
        validate_response_schema: "{{ sda_provision_devices_info.validate_response_schema if sda_provision_devices_info.validate_response_schema is not none else omit }}"
      register: sda_provision_devices_info_result
