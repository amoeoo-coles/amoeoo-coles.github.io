---
# Sample playbook for cisco.catalystcenter.site_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 186
# Generate YAML playbook for 'site_workflow_manager' module.
# Reads ../models/site_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags site_playbook_config_generator.

- name: "0186 site_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_playbook_config_generator.yml
  tasks:
    - name: Run site_playbook_config_generator from its model
      cisco.catalystcenter.site_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ site_playbook_config_generator.catalystcenter_api_task_timeout if site_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ site_playbook_config_generator.catalystcenter_debug if site_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_playbook_config_generator.catalystcenter_host if site_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ site_playbook_config_generator.catalystcenter_log if site_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ site_playbook_config_generator.catalystcenter_log_append if site_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ site_playbook_config_generator.catalystcenter_log_file_path if site_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ site_playbook_config_generator.catalystcenter_log_level if site_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ site_playbook_config_generator.catalystcenter_password if site_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_playbook_config_generator.catalystcenter_port if site_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ site_playbook_config_generator.catalystcenter_task_poll_interval if site_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ site_playbook_config_generator.catalystcenter_username if site_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_playbook_config_generator.catalystcenter_verify if site_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_playbook_config_generator.catalystcenter_version if site_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (site_playbook_config_generator.config | cat_strip_nulls) if (site_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ site_playbook_config_generator.file_mode if site_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ site_playbook_config_generator.file_path if site_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ site_playbook_config_generator.state if site_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ site_playbook_config_generator.validate_response_schema if site_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: site_playbook_config_generator_result
      tags:
        - never
        - site_playbook_config_generator
