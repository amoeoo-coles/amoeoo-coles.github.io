---
# Sample playbook for cisco.catalystcenter.applications_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 1345
# Information module for Applications V2
# Reads ../models/applications_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/applications_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1345 applications_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/applications_v2_info.yml
  tasks:
    - name: Run applications_v2_info from its model
      cisco.catalystcenter.applications_v2_info:
        attributes: "{{ applications_v2_info.attributes if applications_v2_info.attributes is not none else omit }}"
        catalystcenter_debug: "{{ applications_v2_info.catalystcenter_debug if applications_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ applications_v2_info.catalystcenter_host if applications_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ applications_v2_info.catalystcenter_password if applications_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ applications_v2_info.catalystcenter_port if applications_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ applications_v2_info.catalystcenter_username if applications_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ applications_v2_info.catalystcenter_verify if applications_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ applications_v2_info.catalystcenter_version if applications_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ applications_v2_info.headers if applications_v2_info.headers is not none else omit }}"
        limit: "{{ applications_v2_info.limit if applications_v2_info.limit is not none else omit }}"
        name: "{{ applications_v2_info.name if applications_v2_info.name is not none else omit }}"
        offset: "{{ applications_v2_info.offset if applications_v2_info.offset is not none else omit }}"
        validate_response_schema: "{{ applications_v2_info.validate_response_schema if applications_v2_info.validate_response_schema is not none else omit }}"
      register: applications_v2_info_result
