---
# Sample playbook for cisco.catalystcenter.compliance_sites_violations (cisco.catalystcenter 2.15.0)
# Build order: 648
# Resource module for Compliance Sites Violations
# Reads ../models/compliance_sites_violations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_sites_violations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_sites_violations.

- name: "0648 compliance_sites_violations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_sites_violations.yml
  tasks:
    - name: Run compliance_sites_violations from its model
      cisco.catalystcenter.compliance_sites_violations:
        acknowledgementStatus: "{{ compliance_sites_violations.acknowledgementStatus if compliance_sites_violations.acknowledgementStatus is not none else omit }}"
        catalystcenter_debug: "{{ compliance_sites_violations.catalystcenter_debug if compliance_sites_violations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_sites_violations.catalystcenter_host if compliance_sites_violations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_sites_violations.catalystcenter_password if compliance_sites_violations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_sites_violations.catalystcenter_port if compliance_sites_violations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_sites_violations.catalystcenter_username if compliance_sites_violations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_sites_violations.catalystcenter_verify if compliance_sites_violations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_sites_violations.catalystcenter_version if compliance_sites_violations.catalystcenter_version is not none else omit }}"
        siteId: "{{ compliance_sites_violations.siteId if compliance_sites_violations.siteId is not none else omit }}"
        validate_response_schema: "{{ compliance_sites_violations.validate_response_schema if compliance_sites_violations.validate_response_schema is not none else omit }}"
        violationId: "{{ compliance_sites_violations.violationId if compliance_sites_violations.violationId is not none else omit }}"
      register: compliance_sites_violations_result
      tags:
        - never
        - compliance_sites_violations
