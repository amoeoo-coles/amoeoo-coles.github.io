---
# Sample playbook for cisco.catalystcenter.user_role_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 98
# Generate YAML playbook for user and role management.
# Reads ../models/user_role_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/user_role_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags user_role_playbook_config_generator.

- name: "0098 user_role_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/user_role_playbook_config_generator.yml
  tasks:
    - name: Run user_role_playbook_config_generator from its model
      cisco.catalystcenter.user_role_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ user_role_playbook_config_generator.catalystcenter_api_task_timeout if user_role_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ user_role_playbook_config_generator.catalystcenter_debug if user_role_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ user_role_playbook_config_generator.catalystcenter_host if user_role_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ user_role_playbook_config_generator.catalystcenter_log if user_role_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ user_role_playbook_config_generator.catalystcenter_log_append if user_role_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ user_role_playbook_config_generator.catalystcenter_log_file_path if user_role_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ user_role_playbook_config_generator.catalystcenter_log_level if user_role_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ user_role_playbook_config_generator.catalystcenter_password if user_role_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ user_role_playbook_config_generator.catalystcenter_port if user_role_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ user_role_playbook_config_generator.catalystcenter_task_poll_interval if user_role_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ user_role_playbook_config_generator.catalystcenter_username if user_role_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ user_role_playbook_config_generator.catalystcenter_verify if user_role_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ user_role_playbook_config_generator.catalystcenter_version if user_role_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (user_role_playbook_config_generator.config | cat_strip_nulls) if (user_role_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ user_role_playbook_config_generator.file_mode if user_role_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ user_role_playbook_config_generator.file_path if user_role_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ user_role_playbook_config_generator.state if user_role_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ user_role_playbook_config_generator.validate_response_schema if user_role_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: user_role_playbook_config_generator_result
      tags:
        - never
        - user_role_playbook_config_generator
