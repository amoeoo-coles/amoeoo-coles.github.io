---
# Sample playbook for cisco.catalystcenter.provision_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 729
# Resource module for provision related functions
# Reads ../models/provision_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/provision_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags provision_workflow_manager.

- name: "0729 provision_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/provision_workflow_manager.yml
  tasks:
    - name: Run provision_workflow_manager from its model
      cisco.catalystcenter.provision_workflow_manager:
        catalystcenter_api_task_timeout: "{{ provision_workflow_manager.catalystcenter_api_task_timeout if provision_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ provision_workflow_manager.catalystcenter_debug if provision_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ provision_workflow_manager.catalystcenter_host if provision_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ provision_workflow_manager.catalystcenter_log if provision_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ provision_workflow_manager.catalystcenter_log_append if provision_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ provision_workflow_manager.catalystcenter_log_file_path if provision_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ provision_workflow_manager.catalystcenter_log_level if provision_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ provision_workflow_manager.catalystcenter_password if provision_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ provision_workflow_manager.catalystcenter_port if provision_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ provision_workflow_manager.catalystcenter_task_poll_interval if provision_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ provision_workflow_manager.catalystcenter_username if provision_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ provision_workflow_manager.catalystcenter_verify if provision_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ provision_workflow_manager.catalystcenter_version if provision_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (provision_workflow_manager.config | cat_strip_nulls) if (provision_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ provision_workflow_manager.config_verify if provision_workflow_manager.config_verify is not none else omit }}"
        state: "{{ provision_workflow_manager.state if provision_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ provision_workflow_manager.validate_response_schema if provision_workflow_manager.validate_response_schema is not none else omit }}"
      register: provision_workflow_manager_result
      tags:
        - never
        - provision_workflow_manager
