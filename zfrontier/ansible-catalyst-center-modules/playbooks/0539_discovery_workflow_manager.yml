---
# Sample playbook for cisco.catalystcenter.discovery_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 539
# A resource module for handling device discovery tasks.
# Reads ../models/discovery_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags discovery_workflow_manager.

- name: "0539 discovery_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_workflow_manager.yml
  tasks:
    - name: Run discovery_workflow_manager from its model
      cisco.catalystcenter.discovery_workflow_manager:
        catalystcenter_api_task_timeout: "{{ discovery_workflow_manager.catalystcenter_api_task_timeout if discovery_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ discovery_workflow_manager.catalystcenter_debug if discovery_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_workflow_manager.catalystcenter_host if discovery_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ discovery_workflow_manager.catalystcenter_log if discovery_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ discovery_workflow_manager.catalystcenter_log_append if discovery_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ discovery_workflow_manager.catalystcenter_log_file_path if discovery_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ discovery_workflow_manager.catalystcenter_log_level if discovery_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ discovery_workflow_manager.catalystcenter_password if discovery_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_workflow_manager.catalystcenter_port if discovery_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ discovery_workflow_manager.catalystcenter_task_poll_interval if discovery_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ discovery_workflow_manager.catalystcenter_username if discovery_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_workflow_manager.catalystcenter_verify if discovery_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_workflow_manager.catalystcenter_version if discovery_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (discovery_workflow_manager.config | cat_strip_nulls) if (discovery_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ discovery_workflow_manager.config_verify if discovery_workflow_manager.config_verify is not none else omit }}"
        state: "{{ discovery_workflow_manager.state if discovery_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ discovery_workflow_manager.validate_response_schema if discovery_workflow_manager.validate_response_schema is not none else omit }}"
      register: discovery_workflow_manager_result
      tags:
        - never
        - discovery_workflow_manager
