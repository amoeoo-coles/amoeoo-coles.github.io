---
# Sample playbook for cisco.catalystcenter.activities_id_info (cisco.catalystcenter 2.15.0)
# Build order: 75
# Information module for Activities Id
# Reads ../models/activities_id_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/activities_id_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0075 activities_id_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/activities_id_info.yml
  tasks:
    - name: Run activities_id_info from its model
      cisco.catalystcenter.activities_id_info:
        catalystcenter_debug: "{{ activities_id_info.catalystcenter_debug if activities_id_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ activities_id_info.catalystcenter_host if activities_id_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ activities_id_info.catalystcenter_password if activities_id_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ activities_id_info.catalystcenter_port if activities_id_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ activities_id_info.catalystcenter_username if activities_id_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ activities_id_info.catalystcenter_verify if activities_id_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ activities_id_info.catalystcenter_version if activities_id_info.catalystcenter_version is not none else omit }}"
        headers: "{{ activities_id_info.headers if activities_id_info.headers is not none else omit }}"
        id: "{{ activities_id_info.id if activities_id_info.id is not none else omit }}"
        validate_response_schema: "{{ activities_id_info.validate_response_schema if activities_id_info.validate_response_schema is not none else omit }}"
      register: activities_id_info_result
