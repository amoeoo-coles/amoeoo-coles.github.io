---
# Sample playbook for cisco.catalystcenter.fabrics_fabric_id_switch_wireless_setting (cisco.catalystcenter 2.15.0)
# Build order: 834
# Resource module for Fabrics Fabric Id Switch Wireless Setting
# Reads ../models/fabrics_fabric_id_switch_wireless_setting.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/fabrics_fabric_id_switch_wireless_setting_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags fabrics_fabric_id_switch_wireless_setting.

- name: "0834 fabrics_fabric_id_switch_wireless_setting"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/fabrics_fabric_id_switch_wireless_setting.yml
  tasks:
    - name: Run fabrics_fabric_id_switch_wireless_setting from its model
      cisco.catalystcenter.fabrics_fabric_id_switch_wireless_setting:
        catalystcenter_debug: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_debug if fabrics_fabric_id_switch_wireless_setting.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_host if fabrics_fabric_id_switch_wireless_setting.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_password if fabrics_fabric_id_switch_wireless_setting.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_port if fabrics_fabric_id_switch_wireless_setting.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_username if fabrics_fabric_id_switch_wireless_setting.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_verify if fabrics_fabric_id_switch_wireless_setting.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ fabrics_fabric_id_switch_wireless_setting.catalystcenter_version if fabrics_fabric_id_switch_wireless_setting.catalystcenter_version is not none else omit }}"
        fabricId: "{{ fabrics_fabric_id_switch_wireless_setting.fabricId if fabrics_fabric_id_switch_wireless_setting.fabricId is not none else omit }}"
        payload: "{{ (fabrics_fabric_id_switch_wireless_setting.payload | cat_strip_nulls) if (fabrics_fabric_id_switch_wireless_setting.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ fabrics_fabric_id_switch_wireless_setting.validate_response_schema if fabrics_fabric_id_switch_wireless_setting.validate_response_schema is not none else omit }}"
      register: fabrics_fabric_id_switch_wireless_setting_result
      tags:
        - never
        - fabrics_fabric_id_switch_wireless_setting
