---
# Sample playbook for cisco.catalystcenter.pnp_virtual_accounts_info (cisco.catalystcenter 2.15.0)
# Build order: 499
# Information module for Pnp Virtual Accounts
# Reads ../models/pnp_virtual_accounts_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_virtual_accounts_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0499 pnp_virtual_accounts_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_virtual_accounts_info.yml
  tasks:
    - name: Run pnp_virtual_accounts_info from its model
      cisco.catalystcenter.pnp_virtual_accounts_info:
        catalystcenter_debug: "{{ pnp_virtual_accounts_info.catalystcenter_debug if pnp_virtual_accounts_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_virtual_accounts_info.catalystcenter_host if pnp_virtual_accounts_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_virtual_accounts_info.catalystcenter_password if pnp_virtual_accounts_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_virtual_accounts_info.catalystcenter_port if pnp_virtual_accounts_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_virtual_accounts_info.catalystcenter_username if pnp_virtual_accounts_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_virtual_accounts_info.catalystcenter_verify if pnp_virtual_accounts_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_virtual_accounts_info.catalystcenter_version if pnp_virtual_accounts_info.catalystcenter_version is not none else omit }}"
        domain: "{{ pnp_virtual_accounts_info.domain if pnp_virtual_accounts_info.domain is not none else omit }}"
        headers: "{{ pnp_virtual_accounts_info.headers if pnp_virtual_accounts_info.headers is not none else omit }}"
        validate_response_schema: "{{ pnp_virtual_accounts_info.validate_response_schema if pnp_virtual_accounts_info.validate_response_schema is not none else omit }}"
      register: pnp_virtual_accounts_info_result
