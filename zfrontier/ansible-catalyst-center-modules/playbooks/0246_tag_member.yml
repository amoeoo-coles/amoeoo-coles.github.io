---
# Sample playbook for cisco.catalystcenter.tag_member (cisco.catalystcenter 2.15.0)
# Build order: 246
# Resource module for Tag Member
# Reads ../models/tag_member.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tag_member_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags tag_member.

- name: "0246 tag_member"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tag_member.yml
  tasks:
    - name: Run tag_member from its model
      cisco.catalystcenter.tag_member:
        catalystcenter_debug: "{{ tag_member.catalystcenter_debug if tag_member.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tag_member.catalystcenter_host if tag_member.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tag_member.catalystcenter_password if tag_member.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tag_member.catalystcenter_port if tag_member.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tag_member.catalystcenter_username if tag_member.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tag_member.catalystcenter_verify if tag_member.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tag_member.catalystcenter_version if tag_member.catalystcenter_version is not none else omit }}"
        id: "{{ tag_member.id if tag_member.id is not none else omit }}"
        memberId: "{{ tag_member.memberId if tag_member.memberId is not none else omit }}"
        memberType: "{{ (tag_member.memberType | cat_strip_nulls) if (tag_member.memberType | cat_strip_nulls) is not none else omit }}"
        payload: "{{ tag_member.payload if tag_member.payload is not none else omit }}"
        validate_response_schema: "{{ tag_member.validate_response_schema if tag_member.validate_response_schema is not none else omit }}"
      register: tag_member_result
      tags:
        - never
        - tag_member
