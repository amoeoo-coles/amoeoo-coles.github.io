---
# Sample playbook for cisco.catalystcenter.discovery_range_delete (cisco.catalystcenter 2.15.0)
# Build order: 272
# Resource module for Discovery Range Delete
# Reads ../models/discovery_range_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_range_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags discovery_range_delete.

- name: "0272 discovery_range_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_range_delete.yml
  tasks:
    - name: Run discovery_range_delete from its model
      cisco.catalystcenter.discovery_range_delete:
        catalystcenter_debug: "{{ discovery_range_delete.catalystcenter_debug if discovery_range_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_range_delete.catalystcenter_host if discovery_range_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery_range_delete.catalystcenter_password if discovery_range_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_range_delete.catalystcenter_port if discovery_range_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery_range_delete.catalystcenter_username if discovery_range_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_range_delete.catalystcenter_verify if discovery_range_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_range_delete.catalystcenter_version if discovery_range_delete.catalystcenter_version is not none else omit }}"
        recordsToDelete: "{{ discovery_range_delete.recordsToDelete if discovery_range_delete.recordsToDelete is not none else omit }}"
        startIndex: "{{ discovery_range_delete.startIndex if discovery_range_delete.startIndex is not none else omit }}"
        validate_response_schema: "{{ discovery_range_delete.validate_response_schema if discovery_range_delete.validate_response_schema is not none else omit }}"
      register: discovery_range_delete_result
      tags:
        - never
        - discovery_range_delete
