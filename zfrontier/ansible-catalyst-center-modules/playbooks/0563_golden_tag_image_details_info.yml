---
# Sample playbook for cisco.catalystcenter.golden_tag_image_details_info (cisco.catalystcenter 2.15.0)
# Build order: 563
# Information module for Golden Tag Image Details
# Reads ../models/golden_tag_image_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/golden_tag_image_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0563 golden_tag_image_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/golden_tag_image_details_info.yml
  tasks:
    - name: Run golden_tag_image_details_info from its model
      cisco.catalystcenter.golden_tag_image_details_info:
        catalystcenter_debug: "{{ golden_tag_image_details_info.catalystcenter_debug if golden_tag_image_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ golden_tag_image_details_info.catalystcenter_host if golden_tag_image_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ golden_tag_image_details_info.catalystcenter_password if golden_tag_image_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ golden_tag_image_details_info.catalystcenter_port if golden_tag_image_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ golden_tag_image_details_info.catalystcenter_username if golden_tag_image_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ golden_tag_image_details_info.catalystcenter_verify if golden_tag_image_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ golden_tag_image_details_info.catalystcenter_version if golden_tag_image_details_info.catalystcenter_version is not none else omit }}"
        deviceFamilyIdentifier: "{{ golden_tag_image_details_info.deviceFamilyIdentifier if golden_tag_image_details_info.deviceFamilyIdentifier is not none else omit }}"
        deviceRole: "{{ golden_tag_image_details_info.deviceRole if golden_tag_image_details_info.deviceRole is not none else omit }}"
        headers: "{{ golden_tag_image_details_info.headers if golden_tag_image_details_info.headers is not none else omit }}"
        imageId: "{{ golden_tag_image_details_info.imageId if golden_tag_image_details_info.imageId is not none else omit }}"
        siteId: "{{ golden_tag_image_details_info.siteId if golden_tag_image_details_info.siteId is not none else omit }}"
        validate_response_schema: "{{ golden_tag_image_details_info.validate_response_schema if golden_tag_image_details_info.validate_response_schema is not none else omit }}"
      register: golden_tag_image_details_info_result
