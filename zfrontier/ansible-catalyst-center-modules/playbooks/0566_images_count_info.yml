---
# Sample playbook for cisco.catalystcenter.images_count_info (cisco.catalystcenter 2.15.0)
# Build order: 566
# Information module for Images Count
# Reads ../models/images_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0566 images_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_count_info.yml
  tasks:
    - name: Run images_count_info from its model
      cisco.catalystcenter.images_count_info:
        catalystcenter_debug: "{{ images_count_info.catalystcenter_debug if images_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_count_info.catalystcenter_host if images_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_count_info.catalystcenter_password if images_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_count_info.catalystcenter_port if images_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_count_info.catalystcenter_username if images_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_count_info.catalystcenter_verify if images_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_count_info.catalystcenter_version if images_count_info.catalystcenter_version is not none else omit }}"
        golden: "{{ images_count_info.golden if images_count_info.golden is not none else omit }}"
        hasAddonImages: "{{ images_count_info.hasAddonImages if images_count_info.hasAddonImages is not none else omit }}"
        headers: "{{ images_count_info.headers if images_count_info.headers is not none else omit }}"
        imported: "{{ images_count_info.imported if images_count_info.imported is not none else omit }}"
        integrity: "{{ images_count_info.integrity if images_count_info.integrity is not none else omit }}"
        isAddonImages: "{{ images_count_info.isAddonImages if images_count_info.isAddonImages is not none else omit }}"
        name: "{{ images_count_info.name if images_count_info.name is not none else omit }}"
        productNameOrdinal: "{{ images_count_info.productNameOrdinal if images_count_info.productNameOrdinal is not none else omit }}"
        siteId: "{{ images_count_info.siteId if images_count_info.siteId is not none else omit }}"
        supervisorProductNameOrdinal: "{{ images_count_info.supervisorProductNameOrdinal if images_count_info.supervisorProductNameOrdinal is not none else omit }}"
        validate_response_schema: "{{ images_count_info.validate_response_schema if images_count_info.validate_response_schema is not none else omit }}"
        version: "{{ images_count_info.version if images_count_info.version is not none else omit }}"
      register: images_count_info_result
