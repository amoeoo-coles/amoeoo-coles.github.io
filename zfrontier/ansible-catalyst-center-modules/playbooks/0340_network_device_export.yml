---
# Sample playbook for cisco.catalystcenter.network_device_export (cisco.catalystcenter 2.15.0)
# Build order: 340
# Resource module for Network Device Export
# Reads ../models/network_device_export.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_export_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_export.

- name: "0340 network_device_export"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_export.yml
  tasks:
    - name: Run network_device_export from its model
      cisco.catalystcenter.network_device_export:
        catalystcenter_debug: "{{ network_device_export.catalystcenter_debug if network_device_export.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_export.catalystcenter_host if network_device_export.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_export.catalystcenter_password if network_device_export.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_export.catalystcenter_port if network_device_export.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_export.catalystcenter_username if network_device_export.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_export.catalystcenter_verify if network_device_export.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_export.catalystcenter_version if network_device_export.catalystcenter_version is not none else omit }}"
        deviceUuids: "{{ (network_device_export.deviceUuids | cat_strip_nulls) if (network_device_export.deviceUuids | cat_strip_nulls) is not none else omit }}"
        operationEnum: "{{ network_device_export.operationEnum if network_device_export.operationEnum is not none else omit }}"
        parameters: "{{ (network_device_export.parameters | cat_strip_nulls) if (network_device_export.parameters | cat_strip_nulls) is not none else omit }}"
        password: "{{ network_device_export.password if network_device_export.password is not none else omit }}"
        validate_response_schema: "{{ network_device_export.validate_response_schema if network_device_export.validate_response_schema is not none else omit }}"
      register: network_device_export_result
      tags:
        - never
        - network_device_export
