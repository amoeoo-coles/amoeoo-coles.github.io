---
# Sample playbook for cisco.catalystcenter.sites_device_credentials_apply (cisco.catalystcenter 2.15.0)
# Build order: 205
# Resource module for Sites Device Credentials Apply
# Reads ../models/sites_device_credentials_apply.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_device_credentials_apply_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sites_device_credentials_apply.

- name: "0205 sites_device_credentials_apply"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_device_credentials_apply.yml
  tasks:
    - name: Run sites_device_credentials_apply from its model
      cisco.catalystcenter.sites_device_credentials_apply:
        catalystcenter_debug: "{{ sites_device_credentials_apply.catalystcenter_debug if sites_device_credentials_apply.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_device_credentials_apply.catalystcenter_host if sites_device_credentials_apply.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_device_credentials_apply.catalystcenter_password if sites_device_credentials_apply.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_device_credentials_apply.catalystcenter_port if sites_device_credentials_apply.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_device_credentials_apply.catalystcenter_username if sites_device_credentials_apply.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_device_credentials_apply.catalystcenter_verify if sites_device_credentials_apply.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_device_credentials_apply.catalystcenter_version if sites_device_credentials_apply.catalystcenter_version is not none else omit }}"
        deviceCredentialId: "{{ sites_device_credentials_apply.deviceCredentialId if sites_device_credentials_apply.deviceCredentialId is not none else omit }}"
        siteId: "{{ sites_device_credentials_apply.siteId if sites_device_credentials_apply.siteId is not none else omit }}"
        validate_response_schema: "{{ sites_device_credentials_apply.validate_response_schema if sites_device_credentials_apply.validate_response_schema is not none else omit }}"
      register: sites_device_credentials_apply_result
      tags:
        - never
        - sites_device_credentials_apply
