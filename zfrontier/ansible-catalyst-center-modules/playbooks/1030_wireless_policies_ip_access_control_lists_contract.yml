---
# Sample playbook for cisco.catalystcenter.wireless_policies_ip_access_control_lists_contract (cisco.catalystcenter 2.15.0)
# Build order: 1030
# Resource module for Wireless Policies Ip Access Control Lists Contract
# Reads ../models/wireless_policies_ip_access_control_lists_contract.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_policies_ip_access_control_lists_contract_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_policies_ip_access_control_lists_contract.

- name: "1030 wireless_policies_ip_access_control_lists_contract"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_policies_ip_access_control_lists_contract.yml
  tasks:
    - name: Run wireless_policies_ip_access_control_lists_contract from its model
      cisco.catalystcenter.wireless_policies_ip_access_control_lists_contract:
        catalystcenter_debug: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_debug if wireless_policies_ip_access_control_lists_contract.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_host if wireless_policies_ip_access_control_lists_contract.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_password if wireless_policies_ip_access_control_lists_contract.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_port if wireless_policies_ip_access_control_lists_contract.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_username if wireless_policies_ip_access_control_lists_contract.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_verify if wireless_policies_ip_access_control_lists_contract.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_policies_ip_access_control_lists_contract.catalystcenter_version if wireless_policies_ip_access_control_lists_contract.catalystcenter_version is not none else omit }}"
        description: "{{ wireless_policies_ip_access_control_lists_contract.description if wireless_policies_ip_access_control_lists_contract.description is not none else omit }}"
        id: "{{ wireless_policies_ip_access_control_lists_contract.id if wireless_policies_ip_access_control_lists_contract.id is not none else omit }}"
        implicitAction: "{{ wireless_policies_ip_access_control_lists_contract.implicitAction if wireless_policies_ip_access_control_lists_contract.implicitAction is not none else omit }}"
        name: "{{ wireless_policies_ip_access_control_lists_contract.name if wireless_policies_ip_access_control_lists_contract.name is not none else omit }}"
        protocolIds: "{{ (wireless_policies_ip_access_control_lists_contract.protocolIds | cat_strip_nulls) if (wireless_policies_ip_access_control_lists_contract.protocolIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_policies_ip_access_control_lists_contract.validate_response_schema if wireless_policies_ip_access_control_lists_contract.validate_response_schema is not none else omit }}"
      register: wireless_policies_ip_access_control_lists_contract_result
      tags:
        - never
        - wireless_policies_ip_access_control_lists_contract
