---
# Sample playbook for cisco.catalystcenter.pnp_global_settings (cisco.catalystcenter 2.15.0)
# Build order: 483
# Resource module for Pnp Global Settings
# Reads ../models/pnp_global_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_global_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_global_settings.

- name: "0483 pnp_global_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_global_settings.yml
  tasks:
    - name: Run pnp_global_settings from its model
      cisco.catalystcenter.pnp_global_settings:
        acceptEula: "{{ pnp_global_settings.acceptEula if pnp_global_settings.acceptEula is not none else omit }}"
        catalystcenter_debug: "{{ pnp_global_settings.catalystcenter_debug if pnp_global_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_global_settings.catalystcenter_host if pnp_global_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_global_settings.catalystcenter_password if pnp_global_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_global_settings.catalystcenter_port if pnp_global_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_global_settings.catalystcenter_username if pnp_global_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_global_settings.catalystcenter_verify if pnp_global_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_global_settings.catalystcenter_version if pnp_global_settings.catalystcenter_version is not none else omit }}"
        defaultProfile: "{{ (pnp_global_settings.defaultProfile | cat_strip_nulls) if (pnp_global_settings.defaultProfile | cat_strip_nulls) is not none else omit }}"
        id: "{{ pnp_global_settings.id if pnp_global_settings.id is not none else omit }}"
        savaMappingList: "{{ (pnp_global_settings.savaMappingList | cat_strip_nulls) if (pnp_global_settings.savaMappingList | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ pnp_global_settings.validate_response_schema if pnp_global_settings.validate_response_schema is not none else omit }}"
      register: pnp_global_settings_result
      tags:
        - never
        - pnp_global_settings
