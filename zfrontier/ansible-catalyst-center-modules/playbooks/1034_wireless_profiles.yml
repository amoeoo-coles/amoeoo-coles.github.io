---
# Sample playbook for cisco.catalystcenter.wireless_profiles (cisco.catalystcenter 2.15.0)
# Build order: 1034
# Resource module for Wireless Profiles
# Reads ../models/wireless_profiles.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_profiles_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_profiles.

- name: "1034 wireless_profiles"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_profiles.yml
  tasks:
    - name: Run wireless_profiles from its model
      cisco.catalystcenter.wireless_profiles:
        additionalInterfaces: "{{ (wireless_profiles.additionalInterfaces | cat_strip_nulls) if (wireless_profiles.additionalInterfaces | cat_strip_nulls) is not none else omit }}"
        apZones: "{{ (wireless_profiles.apZones | cat_strip_nulls) if (wireless_profiles.apZones | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ wireless_profiles.catalystcenter_debug if wireless_profiles.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_profiles.catalystcenter_host if wireless_profiles.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_profiles.catalystcenter_password if wireless_profiles.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_profiles.catalystcenter_port if wireless_profiles.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_profiles.catalystcenter_username if wireless_profiles.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_profiles.catalystcenter_verify if wireless_profiles.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_profiles.catalystcenter_version if wireless_profiles.catalystcenter_version is not none else omit }}"
        featureTemplates: "{{ (wireless_profiles.featureTemplates | cat_strip_nulls) if (wireless_profiles.featureTemplates | cat_strip_nulls) is not none else omit }}"
        id: "{{ wireless_profiles.id if wireless_profiles.id is not none else omit }}"
        ssidDetails: "{{ (wireless_profiles.ssidDetails | cat_strip_nulls) if (wireless_profiles.ssidDetails | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_profiles.validate_response_schema if wireless_profiles.validate_response_schema is not none else omit }}"
        wirelessProfileName: "{{ wireless_profiles.wirelessProfileName if wireless_profiles.wirelessProfileName is not none else omit }}"
      register: wireless_profiles_result
      tags:
        - never
        - wireless_profiles
