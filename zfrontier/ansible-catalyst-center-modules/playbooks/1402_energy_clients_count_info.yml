---
# Sample playbook for cisco.catalystcenter.energy_clients_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1402
# Information module for Energy Clients Count
# Reads ../models/energy_clients_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_clients_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1402 energy_clients_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_clients_count_info.yml
  tasks:
    - name: Run energy_clients_count_info from its model
      cisco.catalystcenter.energy_clients_count_info:
        catalystcenter_debug: "{{ energy_clients_count_info.catalystcenter_debug if energy_clients_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_clients_count_info.catalystcenter_host if energy_clients_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_clients_count_info.catalystcenter_password if energy_clients_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_clients_count_info.catalystcenter_port if energy_clients_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_clients_count_info.catalystcenter_username if energy_clients_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_clients_count_info.catalystcenter_verify if energy_clients_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_clients_count_info.catalystcenter_version if energy_clients_count_info.catalystcenter_version is not none else omit }}"
        deviceCategory: "{{ energy_clients_count_info.deviceCategory if energy_clients_count_info.deviceCategory is not none else omit }}"
        deviceSubCategory: "{{ energy_clients_count_info.deviceSubCategory if energy_clients_count_info.deviceSubCategory is not none else omit }}"
        endTime: "{{ energy_clients_count_info.endTime if energy_clients_count_info.endTime is not none else omit }}"
        headers: "{{ energy_clients_count_info.headers if energy_clients_count_info.headers is not none else omit }}"
        id: "{{ energy_clients_count_info.id if energy_clients_count_info.id is not none else omit }}"
        siteHierarchy: "{{ energy_clients_count_info.siteHierarchy if energy_clients_count_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ energy_clients_count_info.siteHierarchyId if energy_clients_count_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ energy_clients_count_info.siteId if energy_clients_count_info.siteId is not none else omit }}"
        startTime: "{{ energy_clients_count_info.startTime if energy_clients_count_info.startTime is not none else omit }}"
        validate_response_schema: "{{ energy_clients_count_info.validate_response_schema if energy_clients_count_info.validate_response_schema is not none else omit }}"
      register: energy_clients_count_info_result
