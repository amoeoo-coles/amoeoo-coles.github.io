---
# Sample playbook for cisco.catalystcenter.uninstall_optional_packages_create (cisco.catalystcenter 2.15.0)
# Build order: 28
# Resource module for Uninstall Optional Packages Create
# Reads ../models/uninstall_optional_packages_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/uninstall_optional_packages_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags uninstall_optional_packages_create.

- name: "0028 uninstall_optional_packages_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/uninstall_optional_packages_create.yml
  tasks:
    - name: Run uninstall_optional_packages_create from its model
      cisco.catalystcenter.uninstall_optional_packages_create:
        catalystcenter_debug: "{{ uninstall_optional_packages_create.catalystcenter_debug if uninstall_optional_packages_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ uninstall_optional_packages_create.catalystcenter_host if uninstall_optional_packages_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ uninstall_optional_packages_create.catalystcenter_password if uninstall_optional_packages_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ uninstall_optional_packages_create.catalystcenter_port if uninstall_optional_packages_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ uninstall_optional_packages_create.catalystcenter_username if uninstall_optional_packages_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ uninstall_optional_packages_create.catalystcenter_verify if uninstall_optional_packages_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ uninstall_optional_packages_create.catalystcenter_version if uninstall_optional_packages_create.catalystcenter_version is not none else omit }}"
        optionalPackages: "{{ (uninstall_optional_packages_create.optionalPackages | cat_strip_nulls) if (uninstall_optional_packages_create.optionalPackages | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ uninstall_optional_packages_create.validate_response_schema if uninstall_optional_packages_create.validate_response_schema is not none else omit }}"
      register: uninstall_optional_packages_create_result
      tags:
        - never
        - uninstall_optional_packages_create
