---
# Sample playbook for cisco.catalystcenter.system_issue_definitions (cisco.catalystcenter 2.15.0)
# Build order: 1415
# Resource module for System Issue Definitions
# Reads ../models/system_issue_definitions.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/system_issue_definitions_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags system_issue_definitions.

- name: "1415 system_issue_definitions"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_issue_definitions.yml
  tasks:
    - name: Run system_issue_definitions from its model
      cisco.catalystcenter.system_issue_definitions:
        catalystcenter_debug: "{{ system_issue_definitions.catalystcenter_debug if system_issue_definitions.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ system_issue_definitions.catalystcenter_host if system_issue_definitions.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ system_issue_definitions.catalystcenter_password if system_issue_definitions.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ system_issue_definitions.catalystcenter_port if system_issue_definitions.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ system_issue_definitions.catalystcenter_username if system_issue_definitions.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ system_issue_definitions.catalystcenter_verify if system_issue_definitions.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ system_issue_definitions.catalystcenter_version if system_issue_definitions.catalystcenter_version is not none else omit }}"
        headers: "{{ system_issue_definitions.headers if system_issue_definitions.headers is not none else omit }}"
        id: "{{ system_issue_definitions.id if system_issue_definitions.id is not none else omit }}"
        issueEnabled: "{{ system_issue_definitions.issueEnabled if system_issue_definitions.issueEnabled is not none else omit }}"
        priority: "{{ system_issue_definitions.priority if system_issue_definitions.priority is not none else omit }}"
        synchronizeToHealthThreshold: "{{ system_issue_definitions.synchronizeToHealthThreshold if system_issue_definitions.synchronizeToHealthThreshold is not none else omit }}"
        thresholdValue: "{{ system_issue_definitions.thresholdValue if system_issue_definitions.thresholdValue is not none else omit }}"
        validate_response_schema: "{{ system_issue_definitions.validate_response_schema if system_issue_definitions.validate_response_schema is not none else omit }}"
      register: system_issue_definitions_result
      tags:
        - never
        - system_issue_definitions
