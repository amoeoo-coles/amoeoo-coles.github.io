---
# Sample playbook for cisco.catalystcenter.global_credentials_info (cisco.catalystcenter 2.15.0)
# Build order: 217
# Information module for Global Credentials
# Reads ../models/global_credentials_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/global_credentials_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0217 global_credentials_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/global_credentials_info.yml
  tasks:
    - name: Run global_credentials_info from its model
      cisco.catalystcenter.global_credentials_info:
        catalystcenter_debug: "{{ global_credentials_info.catalystcenter_debug if global_credentials_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ global_credentials_info.catalystcenter_host if global_credentials_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ global_credentials_info.catalystcenter_password if global_credentials_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ global_credentials_info.catalystcenter_port if global_credentials_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ global_credentials_info.catalystcenter_username if global_credentials_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ global_credentials_info.catalystcenter_verify if global_credentials_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ global_credentials_info.catalystcenter_version if global_credentials_info.catalystcenter_version is not none else omit }}"
        headers: "{{ global_credentials_info.headers if global_credentials_info.headers is not none else omit }}"
        id: "{{ (global_credentials_info.id | cat_strip_nulls) if (global_credentials_info.id | cat_strip_nulls) is not none else omit }}"
        limit: "{{ global_credentials_info.limit if global_credentials_info.limit is not none else omit }}"
        offset: "{{ global_credentials_info.offset if global_credentials_info.offset is not none else omit }}"
        order: "{{ global_credentials_info.order if global_credentials_info.order is not none else omit }}"
        sortBy: "{{ global_credentials_info.sortBy if global_credentials_info.sortBy is not none else omit }}"
        type: "{{ global_credentials_info.type if global_credentials_info.type is not none else omit }}"
        validate_response_schema: "{{ global_credentials_info.validate_response_schema if global_credentials_info.validate_response_schema is not none else omit }}"
      register: global_credentials_info_result
