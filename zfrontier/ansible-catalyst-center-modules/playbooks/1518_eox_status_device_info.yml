---
# Sample playbook for cisco.catalystcenter.eox_status_device_info (cisco.catalystcenter 2.15.0)
# Build order: 1518
# Information module for Eox Status Device
# Reads ../models/eox_status_device_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/eox_status_device_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1518 eox_status_device_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/eox_status_device_info.yml
  tasks:
    - name: Run eox_status_device_info from its model
      cisco.catalystcenter.eox_status_device_info:
        catalystcenter_debug: "{{ eox_status_device_info.catalystcenter_debug if eox_status_device_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ eox_status_device_info.catalystcenter_host if eox_status_device_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ eox_status_device_info.catalystcenter_password if eox_status_device_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ eox_status_device_info.catalystcenter_port if eox_status_device_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ eox_status_device_info.catalystcenter_username if eox_status_device_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ eox_status_device_info.catalystcenter_verify if eox_status_device_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ eox_status_device_info.catalystcenter_version if eox_status_device_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ eox_status_device_info.deviceId if eox_status_device_info.deviceId is not none else omit }}"
        headers: "{{ eox_status_device_info.headers if eox_status_device_info.headers is not none else omit }}"
        limit: "{{ eox_status_device_info.limit if eox_status_device_info.limit is not none else omit }}"
        offset: "{{ eox_status_device_info.offset if eox_status_device_info.offset is not none else omit }}"
        validate_response_schema: "{{ eox_status_device_info.validate_response_schema if eox_status_device_info.validate_response_schema is not none else omit }}"
      register: eox_status_device_info_result
