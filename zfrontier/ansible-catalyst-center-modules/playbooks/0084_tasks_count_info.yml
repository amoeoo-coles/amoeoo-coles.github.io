---
# Sample playbook for cisco.catalystcenter.tasks_count_info (cisco.catalystcenter 2.15.0)
# Build order: 84
# Information module for Tasks Count
# Reads ../models/tasks_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tasks_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0084 tasks_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tasks_count_info.yml
  tasks:
    - name: Run tasks_count_info from its model
      cisco.catalystcenter.tasks_count_info:
        catalystcenter_debug: "{{ tasks_count_info.catalystcenter_debug if tasks_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tasks_count_info.catalystcenter_host if tasks_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tasks_count_info.catalystcenter_password if tasks_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tasks_count_info.catalystcenter_port if tasks_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tasks_count_info.catalystcenter_username if tasks_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tasks_count_info.catalystcenter_verify if tasks_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tasks_count_info.catalystcenter_version if tasks_count_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ tasks_count_info.endTime if tasks_count_info.endTime is not none else omit }}"
        headers: "{{ tasks_count_info.headers if tasks_count_info.headers is not none else omit }}"
        parentId: "{{ tasks_count_info.parentId if tasks_count_info.parentId is not none else omit }}"
        rootId: "{{ tasks_count_info.rootId if tasks_count_info.rootId is not none else omit }}"
        startTime: "{{ tasks_count_info.startTime if tasks_count_info.startTime is not none else omit }}"
        status: "{{ tasks_count_info.status if tasks_count_info.status is not none else omit }}"
        validate_response_schema: "{{ tasks_count_info.validate_response_schema if tasks_count_info.validate_response_schema is not none else omit }}"
      register: tasks_count_info_result
