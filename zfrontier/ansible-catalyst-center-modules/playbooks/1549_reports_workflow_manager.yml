---
# Sample playbook for cisco.catalystcenter.reports_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 1549
# Resource module for managing Reports in Cisco Catalyst Center.
# Reads ../models/reports_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reports_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags reports_workflow_manager.

- name: "1549 reports_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reports_workflow_manager.yml
  tasks:
    - name: Run reports_workflow_manager from its model
      cisco.catalystcenter.reports_workflow_manager:
        catalystcenter_api_task_timeout: "{{ reports_workflow_manager.catalystcenter_api_task_timeout if reports_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ reports_workflow_manager.catalystcenter_debug if reports_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ reports_workflow_manager.catalystcenter_host if reports_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ reports_workflow_manager.catalystcenter_log if reports_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ reports_workflow_manager.catalystcenter_log_append if reports_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ reports_workflow_manager.catalystcenter_log_file_path if reports_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ reports_workflow_manager.catalystcenter_log_level if reports_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ reports_workflow_manager.catalystcenter_password if reports_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ reports_workflow_manager.catalystcenter_port if reports_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ reports_workflow_manager.catalystcenter_task_poll_interval if reports_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ reports_workflow_manager.catalystcenter_username if reports_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ reports_workflow_manager.catalystcenter_verify if reports_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ reports_workflow_manager.catalystcenter_version if reports_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (reports_workflow_manager.config | cat_strip_nulls) if (reports_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ reports_workflow_manager.config_verify if reports_workflow_manager.config_verify is not none else omit }}"
        state: "{{ reports_workflow_manager.state if reports_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ reports_workflow_manager.validate_response_schema if reports_workflow_manager.validate_response_schema is not none else omit }}"
      register: reports_workflow_manager_result
      tags:
        - never
        - reports_workflow_manager
