---
# Sample playbook for cisco.catalystcenter.roles_permissions_info (cisco.catalystcenter 2.15.0)
# Build order: 50
# Information module for Roles Permissions
# Reads ../models/roles_permissions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/roles_permissions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0050 roles_permissions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/roles_permissions_info.yml
  tasks:
    - name: Run roles_permissions_info from its model
      cisco.catalystcenter.roles_permissions_info:
        catalystcenter_debug: "{{ roles_permissions_info.catalystcenter_debug if roles_permissions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ roles_permissions_info.catalystcenter_host if roles_permissions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ roles_permissions_info.catalystcenter_password if roles_permissions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ roles_permissions_info.catalystcenter_port if roles_permissions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ roles_permissions_info.catalystcenter_username if roles_permissions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ roles_permissions_info.catalystcenter_verify if roles_permissions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ roles_permissions_info.catalystcenter_version if roles_permissions_info.catalystcenter_version is not none else omit }}"
        headers: "{{ roles_permissions_info.headers if roles_permissions_info.headers is not none else omit }}"
        validate_response_schema: "{{ roles_permissions_info.validate_response_schema if roles_permissions_info.validate_response_schema is not none else omit }}"
      register: roles_permissions_info_result
