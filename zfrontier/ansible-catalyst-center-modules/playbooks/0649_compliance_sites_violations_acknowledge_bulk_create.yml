---
# Sample playbook for cisco.catalystcenter.compliance_sites_violations_acknowledge_bulk_create (cisco.catalystcenter 2.15.0)
# Build order: 649
# Resource module for Compliance Sites Violations Acknowledge Bulk Create
# Reads ../models/compliance_sites_violations_acknowledge_bulk_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_sites_violations_acknowledge_bulk_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_sites_violations_acknowledge_bulk_create.

- name: "0649 compliance_sites_violations_acknowledge_bulk_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_sites_violations_acknowledge_bulk_create.yml
  tasks:
    - name: Run compliance_sites_violations_acknowledge_bulk_create from its model
      cisco.catalystcenter.compliance_sites_violations_acknowledge_bulk_create:
        acknowledgementStatus: "{{ compliance_sites_violations_acknowledge_bulk_create.acknowledgementStatus if compliance_sites_violations_acknowledge_bulk_create.acknowledgementStatus is not none else omit }}"
        catalystcenter_debug: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_debug if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_host if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_password if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_port if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_username if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_verify if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_sites_violations_acknowledge_bulk_create.catalystcenter_version if compliance_sites_violations_acknowledge_bulk_create.catalystcenter_version is not none else omit }}"
        siteId: "{{ compliance_sites_violations_acknowledge_bulk_create.siteId if compliance_sites_violations_acknowledge_bulk_create.siteId is not none else omit }}"
        validate_response_schema: "{{ compliance_sites_violations_acknowledge_bulk_create.validate_response_schema if compliance_sites_violations_acknowledge_bulk_create.validate_response_schema is not none else omit }}"
        violations: "{{ (compliance_sites_violations_acknowledge_bulk_create.violations | cat_strip_nulls) if (compliance_sites_violations_acknowledge_bulk_create.violations | cat_strip_nulls) is not none else omit }}"
      register: compliance_sites_violations_acknowledge_bulk_create_result
      tags:
        - never
        - compliance_sites_violations_acknowledge_bulk_create
