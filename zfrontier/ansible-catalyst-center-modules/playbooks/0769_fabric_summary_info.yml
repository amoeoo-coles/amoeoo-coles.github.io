---
# Sample playbook for cisco.catalystcenter.fabric_summary_info (cisco.catalystcenter 2.15.0)
# Build order: 769
# Information module for Fabric Summary
# Reads ../models/fabric_summary_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/fabric_summary_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0769 fabric_summary_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/fabric_summary_info.yml
  tasks:
    - name: Run fabric_summary_info from its model
      cisco.catalystcenter.fabric_summary_info:
        catalystcenter_debug: "{{ fabric_summary_info.catalystcenter_debug if fabric_summary_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ fabric_summary_info.catalystcenter_host if fabric_summary_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ fabric_summary_info.catalystcenter_password if fabric_summary_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ fabric_summary_info.catalystcenter_port if fabric_summary_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ fabric_summary_info.catalystcenter_username if fabric_summary_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ fabric_summary_info.catalystcenter_verify if fabric_summary_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ fabric_summary_info.catalystcenter_version if fabric_summary_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ fabric_summary_info.endTime if fabric_summary_info.endTime is not none else omit }}"
        headers: "{{ fabric_summary_info.headers if fabric_summary_info.headers is not none else omit }}"
        siteHierarchy: "{{ fabric_summary_info.siteHierarchy if fabric_summary_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ fabric_summary_info.siteHierarchyId if fabric_summary_info.siteHierarchyId is not none else omit }}"
        startTime: "{{ fabric_summary_info.startTime if fabric_summary_info.startTime is not none else omit }}"
        validate_response_schema: "{{ fabric_summary_info.validate_response_schema if fabric_summary_info.validate_response_schema is not none else omit }}"
      register: fabric_summary_info_result
