---
# Sample playbook for cisco.catalystcenter.compliance_device_details_count_info (cisco.catalystcenter 2.15.0)
# Build order: 660
# Information module for Compliance Device Details Count
# Reads ../models/compliance_device_details_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_device_details_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0660 compliance_device_details_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_device_details_count_info.yml
  tasks:
    - name: Run compliance_device_details_count_info from its model
      cisco.catalystcenter.compliance_device_details_count_info:
        catalystcenter_debug: "{{ compliance_device_details_count_info.catalystcenter_debug if compliance_device_details_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_device_details_count_info.catalystcenter_host if compliance_device_details_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_device_details_count_info.catalystcenter_password if compliance_device_details_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_device_details_count_info.catalystcenter_port if compliance_device_details_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_device_details_count_info.catalystcenter_username if compliance_device_details_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_device_details_count_info.catalystcenter_verify if compliance_device_details_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_device_details_count_info.catalystcenter_version if compliance_device_details_count_info.catalystcenter_version is not none else omit }}"
        complianceStatus: "{{ compliance_device_details_count_info.complianceStatus if compliance_device_details_count_info.complianceStatus is not none else omit }}"
        complianceType: "{{ compliance_device_details_count_info.complianceType if compliance_device_details_count_info.complianceType is not none else omit }}"
        headers: "{{ compliance_device_details_count_info.headers if compliance_device_details_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ compliance_device_details_count_info.validate_response_schema if compliance_device_details_count_info.validate_response_schema is not none else omit }}"
      register: compliance_device_details_count_info_result
