---
# Sample playbook for cisco.catalystcenter.users_external_servers_info (cisco.catalystcenter 2.15.0)
# Build order: 55
# Information module for Users External Servers
# Reads ../models/users_external_servers_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/users_external_servers_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0055 users_external_servers_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/users_external_servers_info.yml
  tasks:
    - name: Run users_external_servers_info from its model
      cisco.catalystcenter.users_external_servers_info:
        catalystcenter_debug: "{{ users_external_servers_info.catalystcenter_debug if users_external_servers_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ users_external_servers_info.catalystcenter_host if users_external_servers_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ users_external_servers_info.catalystcenter_password if users_external_servers_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ users_external_servers_info.catalystcenter_port if users_external_servers_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ users_external_servers_info.catalystcenter_username if users_external_servers_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ users_external_servers_info.catalystcenter_verify if users_external_servers_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ users_external_servers_info.catalystcenter_version if users_external_servers_info.catalystcenter_version is not none else omit }}"
        headers: "{{ users_external_servers_info.headers if users_external_servers_info.headers is not none else omit }}"
        invokeSource: "{{ users_external_servers_info.invokeSource if users_external_servers_info.invokeSource is not none else omit }}"
        validate_response_schema: "{{ users_external_servers_info.validate_response_schema if users_external_servers_info.validate_response_schema is not none else omit }}"
      register: users_external_servers_info_result
