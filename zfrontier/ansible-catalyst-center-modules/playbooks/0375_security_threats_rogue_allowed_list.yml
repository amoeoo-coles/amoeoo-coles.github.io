---
# Sample playbook for cisco.catalystcenter.security_threats_rogue_allowed_list (cisco.catalystcenter 2.15.0)
# Build order: 375
# Resource module for Security Threats Rogue Allowed List
# Reads ../models/security_threats_rogue_allowed_list.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_threats_rogue_allowed_list_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_threats_rogue_allowed_list.

- name: "0375 security_threats_rogue_allowed_list"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_threats_rogue_allowed_list.yml
  tasks:
    - name: Run security_threats_rogue_allowed_list from its model
      cisco.catalystcenter.security_threats_rogue_allowed_list:
        catalystcenter_debug: "{{ security_threats_rogue_allowed_list.catalystcenter_debug if security_threats_rogue_allowed_list.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_threats_rogue_allowed_list.catalystcenter_host if security_threats_rogue_allowed_list.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_threats_rogue_allowed_list.catalystcenter_password if security_threats_rogue_allowed_list.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_threats_rogue_allowed_list.catalystcenter_port if security_threats_rogue_allowed_list.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_threats_rogue_allowed_list.catalystcenter_username if security_threats_rogue_allowed_list.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_threats_rogue_allowed_list.catalystcenter_verify if security_threats_rogue_allowed_list.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_threats_rogue_allowed_list.catalystcenter_version if security_threats_rogue_allowed_list.catalystcenter_version is not none else omit }}"
        macAddress: "{{ security_threats_rogue_allowed_list.macAddress if security_threats_rogue_allowed_list.macAddress is not none else omit }}"
        payload: "{{ (security_threats_rogue_allowed_list.payload | cat_strip_nulls) if (security_threats_rogue_allowed_list.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ security_threats_rogue_allowed_list.validate_response_schema if security_threats_rogue_allowed_list.validate_response_schema is not none else omit }}"
      register: security_threats_rogue_allowed_list_result
      tags:
        - never
        - security_threats_rogue_allowed_list
