---
# Sample playbook for cisco.catalystcenter.network_device_images_activate_bulk (cisco.catalystcenter 2.15.0)
# Build order: 552
# Resource module for Network Device Images Activate Bulk
# Reads ../models/network_device_images_activate_bulk.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_images_activate_bulk_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_images_activate_bulk.

- name: "0552 network_device_images_activate_bulk"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_images_activate_bulk.yml
  tasks:
    - name: Run network_device_images_activate_bulk from its model
      cisco.catalystcenter.network_device_images_activate_bulk:
        catalystcenter_debug: "{{ network_device_images_activate_bulk.catalystcenter_debug if network_device_images_activate_bulk.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_images_activate_bulk.catalystcenter_host if network_device_images_activate_bulk.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_images_activate_bulk.catalystcenter_password if network_device_images_activate_bulk.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_images_activate_bulk.catalystcenter_port if network_device_images_activate_bulk.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_images_activate_bulk.catalystcenter_username if network_device_images_activate_bulk.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_images_activate_bulk.catalystcenter_verify if network_device_images_activate_bulk.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_images_activate_bulk.catalystcenter_version if network_device_images_activate_bulk.catalystcenter_version is not none else omit }}"
        payload: "{{ (network_device_images_activate_bulk.payload | cat_strip_nulls) if (network_device_images_activate_bulk.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ network_device_images_activate_bulk.validate_response_schema if network_device_images_activate_bulk.validate_response_schema is not none else omit }}"
      register: network_device_images_activate_bulk_result
      tags:
        - never
        - network_device_images_activate_bulk
