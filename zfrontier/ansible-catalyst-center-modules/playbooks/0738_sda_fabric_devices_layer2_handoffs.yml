---
# Sample playbook for cisco.catalystcenter.sda_fabric_devices_layer2_handoffs (cisco.catalystcenter 2.15.0)
# Build order: 738
# Resource module for Sda Fabric Devices Layer2 Handoffs
# Reads ../models/sda_fabric_devices_layer2_handoffs.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabric_devices_layer2_handoffs_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_fabric_devices_layer2_handoffs.

- name: "0738 sda_fabric_devices_layer2_handoffs"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabric_devices_layer2_handoffs.yml
  tasks:
    - name: Run sda_fabric_devices_layer2_handoffs from its model
      cisco.catalystcenter.sda_fabric_devices_layer2_handoffs:
        catalystcenter_debug: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_debug if sda_fabric_devices_layer2_handoffs.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_host if sda_fabric_devices_layer2_handoffs.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_password if sda_fabric_devices_layer2_handoffs.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_port if sda_fabric_devices_layer2_handoffs.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_username if sda_fabric_devices_layer2_handoffs.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_verify if sda_fabric_devices_layer2_handoffs.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabric_devices_layer2_handoffs.catalystcenter_version if sda_fabric_devices_layer2_handoffs.catalystcenter_version is not none else omit }}"
        fabricId: "{{ sda_fabric_devices_layer2_handoffs.fabricId if sda_fabric_devices_layer2_handoffs.fabricId is not none else omit }}"
        id: "{{ sda_fabric_devices_layer2_handoffs.id if sda_fabric_devices_layer2_handoffs.id is not none else omit }}"
        networkDeviceId: "{{ sda_fabric_devices_layer2_handoffs.networkDeviceId if sda_fabric_devices_layer2_handoffs.networkDeviceId is not none else omit }}"
        payload: "{{ (sda_fabric_devices_layer2_handoffs.payload | cat_strip_nulls) if (sda_fabric_devices_layer2_handoffs.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_fabric_devices_layer2_handoffs.validate_response_schema if sda_fabric_devices_layer2_handoffs.validate_response_schema is not none else omit }}"
      register: sda_fabric_devices_layer2_handoffs_result
      tags:
        - never
        - sda_fabric_devices_layer2_handoffs
