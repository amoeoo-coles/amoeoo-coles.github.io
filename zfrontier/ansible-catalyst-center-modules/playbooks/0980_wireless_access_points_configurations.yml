---
# Sample playbook for cisco.catalystcenter.wireless_access_points_configurations (cisco.catalystcenter 2.15.0)
# Build order: 980
# Resource module for Wireless Access Points Configurations
# Reads ../models/wireless_access_points_configurations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_access_points_configurations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_access_points_configurations.

- name: "0980 wireless_access_points_configurations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_access_points_configurations.yml
  tasks:
    - name: Run wireless_access_points_configurations from its model
      cisco.catalystcenter.wireless_access_points_configurations:
        accelerometerStateEnabled: "{{ wireless_access_points_configurations.accelerometerStateEnabled if wireless_access_points_configurations.accelerometerStateEnabled is not none else omit }}"
        accessPoints: "{{ (wireless_access_points_configurations.accessPoints | cat_strip_nulls) if (wireless_access_points_configurations.accessPoints | cat_strip_nulls) is not none else omit }}"
        adminStatus: "{{ wireless_access_points_configurations.adminStatus if wireless_access_points_configurations.adminStatus is not none else omit }}"
        assignSiteAsLocation: "{{ wireless_access_points_configurations.assignSiteAsLocation if wireless_access_points_configurations.assignSiteAsLocation is not none else omit }}"
        catalystcenter_debug: "{{ wireless_access_points_configurations.catalystcenter_debug if wireless_access_points_configurations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_access_points_configurations.catalystcenter_host if wireless_access_points_configurations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_access_points_configurations.catalystcenter_password if wireless_access_points_configurations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_access_points_configurations.catalystcenter_port if wireless_access_points_configurations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_access_points_configurations.catalystcenter_username if wireless_access_points_configurations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_access_points_configurations.catalystcenter_verify if wireless_access_points_configurations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_access_points_configurations.catalystcenter_version if wireless_access_points_configurations.catalystcenter_version is not none else omit }}"
        cleanAirSI24: "{{ wireless_access_points_configurations.cleanAirSI24 if wireless_access_points_configurations.cleanAirSI24 is not none else omit }}"
        cleanAirSI5: "{{ wireless_access_points_configurations.cleanAirSI5 if wireless_access_points_configurations.cleanAirSI5 is not none else omit }}"
        cleanAirSI6: "{{ wireless_access_points_configurations.cleanAirSI6 if wireless_access_points_configurations.cleanAirSI6 is not none else omit }}"
        dnsIpAddress: "{{ wireless_access_points_configurations.dnsIpAddress if wireless_access_points_configurations.dnsIpAddress is not none else omit }}"
        domainName: "{{ wireless_access_points_configurations.domainName if wireless_access_points_configurations.domainName is not none else omit }}"
        failoverPriority: "{{ wireless_access_points_configurations.failoverPriority if wireless_access_points_configurations.failoverPriority is not none else omit }}"
        lanPortConfigurations: "{{ (wireless_access_points_configurations.lanPortConfigurations | cat_strip_nulls) if (wireless_access_points_configurations.lanPortConfigurations | cat_strip_nulls) is not none else omit }}"
        ledBrightnessLevel: "{{ wireless_access_points_configurations.ledBrightnessLevel if wireless_access_points_configurations.ledBrightnessLevel is not none else omit }}"
        ledStatus: "{{ wireless_access_points_configurations.ledStatus if wireless_access_points_configurations.ledStatus is not none else omit }}"
        location: "{{ wireless_access_points_configurations.location if wireless_access_points_configurations.location is not none else omit }}"
        meshRole: "{{ wireless_access_points_configurations.meshRole if wireless_access_points_configurations.meshRole is not none else omit }}"
        mode: "{{ wireless_access_points_configurations.mode if wireless_access_points_configurations.mode is not none else omit }}"
        primaryControllerIpAddress: "{{ wireless_access_points_configurations.primaryControllerIpAddress if wireless_access_points_configurations.primaryControllerIpAddress is not none else omit }}"
        primaryControllerName: "{{ wireless_access_points_configurations.primaryControllerName if wireless_access_points_configurations.primaryControllerName is not none else omit }}"
        radioConfigurations: "{{ (wireless_access_points_configurations.radioConfigurations | cat_strip_nulls) if (wireless_access_points_configurations.radioConfigurations | cat_strip_nulls) is not none else omit }}"
        rapDownlinkBackhaul: "{{ wireless_access_points_configurations.rapDownlinkBackhaul if wireless_access_points_configurations.rapDownlinkBackhaul is not none else omit }}"
        secondaryControllerIpAddress: "{{ wireless_access_points_configurations.secondaryControllerIpAddress if wireless_access_points_configurations.secondaryControllerIpAddress is not none else omit }}"
        secondaryControllerName: "{{ wireless_access_points_configurations.secondaryControllerName if wireless_access_points_configurations.secondaryControllerName is not none else omit }}"
        tertiaryControllerIpAddress: "{{ wireless_access_points_configurations.tertiaryControllerIpAddress if wireless_access_points_configurations.tertiaryControllerIpAddress is not none else omit }}"
        tertiaryControllerName: "{{ wireless_access_points_configurations.tertiaryControllerName if wireless_access_points_configurations.tertiaryControllerName is not none else omit }}"
        validate_response_schema: "{{ wireless_access_points_configurations.validate_response_schema if wireless_access_points_configurations.validate_response_schema is not none else omit }}"
        vlanTagId: "{{ wireless_access_points_configurations.vlanTagId if wireless_access_points_configurations.vlanTagId is not none else omit }}"
        vlanTagStatus: "{{ wireless_access_points_configurations.vlanTagStatus if wireless_access_points_configurations.vlanTagStatus is not none else omit }}"
      register: wireless_access_points_configurations_result
      tags:
        - never
        - wireless_access_points_configurations
