---
# Sample playbook for cisco.catalystcenter.wireless_accesspoint_configuration_summary_info (cisco.catalystcenter 2.15.0)
# Build order: 1083
# Information module for Wireless Accesspoint Configuration Summary
# Reads ../models/wireless_accesspoint_configuration_summary_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_accesspoint_configuration_summary_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1083 wireless_accesspoint_configuration_summary_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_accesspoint_configuration_summary_info.yml
  tasks:
    - name: Run wireless_accesspoint_configuration_summary_info from its model
      cisco.catalystcenter.wireless_accesspoint_configuration_summary_info:
        apMode: "{{ wireless_accesspoint_configuration_summary_info.apMode if wireless_accesspoint_configuration_summary_info.apMode is not none else omit }}"
        apModel: "{{ wireless_accesspoint_configuration_summary_info.apModel if wireless_accesspoint_configuration_summary_info.apModel is not none else omit }}"
        catalystcenter_debug: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_debug if wireless_accesspoint_configuration_summary_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_host if wireless_accesspoint_configuration_summary_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_password if wireless_accesspoint_configuration_summary_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_port if wireless_accesspoint_configuration_summary_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_username if wireless_accesspoint_configuration_summary_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_verify if wireless_accesspoint_configuration_summary_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_accesspoint_configuration_summary_info.catalystcenter_version if wireless_accesspoint_configuration_summary_info.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_accesspoint_configuration_summary_info.headers if wireless_accesspoint_configuration_summary_info.headers is not none else omit }}"
        key: "{{ wireless_accesspoint_configuration_summary_info.key if wireless_accesspoint_configuration_summary_info.key is not none else omit }}"
        limit: "{{ wireless_accesspoint_configuration_summary_info.limit if wireless_accesspoint_configuration_summary_info.limit is not none else omit }}"
        meshRole: "{{ wireless_accesspoint_configuration_summary_info.meshRole if wireless_accesspoint_configuration_summary_info.meshRole is not none else omit }}"
        offset: "{{ wireless_accesspoint_configuration_summary_info.offset if wireless_accesspoint_configuration_summary_info.offset is not none else omit }}"
        provisioned: "{{ wireless_accesspoint_configuration_summary_info.provisioned if wireless_accesspoint_configuration_summary_info.provisioned is not none else omit }}"
        validate_response_schema: "{{ wireless_accesspoint_configuration_summary_info.validate_response_schema if wireless_accesspoint_configuration_summary_info.validate_response_schema is not none else omit }}"
        wlcIpAddress: "{{ wireless_accesspoint_configuration_summary_info.wlcIpAddress if wireless_accesspoint_configuration_summary_info.wlcIpAddress is not none else omit }}"
      register: wireless_accesspoint_configuration_summary_info_result
