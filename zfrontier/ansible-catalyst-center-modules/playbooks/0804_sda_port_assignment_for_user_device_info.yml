---
# Sample playbook for cisco.catalystcenter.sda_port_assignment_for_user_device_info (cisco.catalystcenter 2.15.0)
# Build order: 804
# Information module for Sda Port Assignment For User Device
# Reads ../models/sda_port_assignment_for_user_device_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_port_assignment_for_user_device_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0804 sda_port_assignment_for_user_device_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_port_assignment_for_user_device_info.yml
  tasks:
    - name: Run sda_port_assignment_for_user_device_info from its model
      cisco.catalystcenter.sda_port_assignment_for_user_device_info:
        catalystcenter_debug: "{{ sda_port_assignment_for_user_device_info.catalystcenter_debug if sda_port_assignment_for_user_device_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_port_assignment_for_user_device_info.catalystcenter_host if sda_port_assignment_for_user_device_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_port_assignment_for_user_device_info.catalystcenter_password if sda_port_assignment_for_user_device_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_port_assignment_for_user_device_info.catalystcenter_port if sda_port_assignment_for_user_device_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_port_assignment_for_user_device_info.catalystcenter_username if sda_port_assignment_for_user_device_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_port_assignment_for_user_device_info.catalystcenter_verify if sda_port_assignment_for_user_device_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_port_assignment_for_user_device_info.catalystcenter_version if sda_port_assignment_for_user_device_info.catalystcenter_version is not none else omit }}"
        deviceManagementIpAddress: "{{ sda_port_assignment_for_user_device_info.deviceManagementIpAddress if sda_port_assignment_for_user_device_info.deviceManagementIpAddress is not none else omit }}"
        headers: "{{ sda_port_assignment_for_user_device_info.headers if sda_port_assignment_for_user_device_info.headers is not none else omit }}"
        interfaceName: "{{ sda_port_assignment_for_user_device_info.interfaceName if sda_port_assignment_for_user_device_info.interfaceName is not none else omit }}"
        validate_response_schema: "{{ sda_port_assignment_for_user_device_info.validate_response_schema if sda_port_assignment_for_user_device_info.validate_response_schema is not none else omit }}"
      register: sda_port_assignment_for_user_device_info_result
