---
# Sample playbook for cisco.catalystcenter.lan_automation_delete (cisco.catalystcenter 2.15.0)
# Build order: 627
# Resource module for Lan Automation Delete
# Reads ../models/lan_automation_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags lan_automation_delete.

- name: "0627 lan_automation_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_delete.yml
  tasks:
    - name: Run lan_automation_delete from its model
      cisco.catalystcenter.lan_automation_delete:
        catalystcenter_debug: "{{ lan_automation_delete.catalystcenter_debug if lan_automation_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_delete.catalystcenter_host if lan_automation_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_delete.catalystcenter_password if lan_automation_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_delete.catalystcenter_port if lan_automation_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_delete.catalystcenter_username if lan_automation_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_delete.catalystcenter_verify if lan_automation_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_delete.catalystcenter_version if lan_automation_delete.catalystcenter_version is not none else omit }}"
        id: "{{ lan_automation_delete.id if lan_automation_delete.id is not none else omit }}"
        validate_response_schema: "{{ lan_automation_delete.validate_response_schema if lan_automation_delete.validate_response_schema is not none else omit }}"
      register: lan_automation_delete_result
      tags:
        - never
        - lan_automation_delete
