---
# Sample playbook for cisco.catalystcenter.thousand_eyes_test_results_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1361
# Information module for Thousand Eyes Test Results Count
# Reads ../models/thousand_eyes_test_results_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/thousand_eyes_test_results_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1361 thousand_eyes_test_results_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/thousand_eyes_test_results_count_info.yml
  tasks:
    - name: Run thousand_eyes_test_results_count_info from its model
      cisco.catalystcenter.thousand_eyes_test_results_count_info:
        agentId: "{{ thousand_eyes_test_results_count_info.agentId if thousand_eyes_test_results_count_info.agentId is not none else omit }}"
        catalystcenter_debug: "{{ thousand_eyes_test_results_count_info.catalystcenter_debug if thousand_eyes_test_results_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ thousand_eyes_test_results_count_info.catalystcenter_host if thousand_eyes_test_results_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ thousand_eyes_test_results_count_info.catalystcenter_password if thousand_eyes_test_results_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ thousand_eyes_test_results_count_info.catalystcenter_port if thousand_eyes_test_results_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ thousand_eyes_test_results_count_info.catalystcenter_username if thousand_eyes_test_results_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ thousand_eyes_test_results_count_info.catalystcenter_verify if thousand_eyes_test_results_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ thousand_eyes_test_results_count_info.catalystcenter_version if thousand_eyes_test_results_count_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ thousand_eyes_test_results_count_info.endTime if thousand_eyes_test_results_count_info.endTime is not none else omit }}"
        headers: "{{ thousand_eyes_test_results_count_info.headers if thousand_eyes_test_results_count_info.headers is not none else omit }}"
        networkDeviceName: "{{ thousand_eyes_test_results_count_info.networkDeviceName if thousand_eyes_test_results_count_info.networkDeviceName is not none else omit }}"
        siteId: "{{ thousand_eyes_test_results_count_info.siteId if thousand_eyes_test_results_count_info.siteId is not none else omit }}"
        startTime: "{{ thousand_eyes_test_results_count_info.startTime if thousand_eyes_test_results_count_info.startTime is not none else omit }}"
        testId: "{{ thousand_eyes_test_results_count_info.testId if thousand_eyes_test_results_count_info.testId is not none else omit }}"
        testName: "{{ thousand_eyes_test_results_count_info.testName if thousand_eyes_test_results_count_info.testName is not none else omit }}"
        testType: "{{ thousand_eyes_test_results_count_info.testType if thousand_eyes_test_results_count_info.testType is not none else omit }}"
        validate_response_schema: "{{ thousand_eyes_test_results_count_info.validate_response_schema if thousand_eyes_test_results_count_info.validate_response_schema is not none else omit }}"
      register: thousand_eyes_test_results_count_info_result
