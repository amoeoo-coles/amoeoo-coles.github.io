---
# Sample playbook for cisco.catalystcenter.capture_wired_count_info (cisco.catalystcenter 2.15.0)
# Build order: 388
# Information module for Capture Wired Count
# Reads ../models/capture_wired_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/capture_wired_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0388 capture_wired_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/capture_wired_count_info.yml
  tasks:
    - name: Run capture_wired_count_info from its model
      cisco.catalystcenter.capture_wired_count_info:
        captureStatus: "{{ capture_wired_count_info.captureStatus if capture_wired_count_info.captureStatus is not none else omit }}"
        catalystcenter_debug: "{{ capture_wired_count_info.catalystcenter_debug if capture_wired_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ capture_wired_count_info.catalystcenter_host if capture_wired_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ capture_wired_count_info.catalystcenter_password if capture_wired_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ capture_wired_count_info.catalystcenter_port if capture_wired_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ capture_wired_count_info.catalystcenter_username if capture_wired_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ capture_wired_count_info.catalystcenter_verify if capture_wired_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ capture_wired_count_info.catalystcenter_version if capture_wired_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ capture_wired_count_info.headers if capture_wired_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ capture_wired_count_info.validate_response_schema if capture_wired_count_info.validate_response_schema is not none else omit }}"
      register: capture_wired_count_info_result
