---
# Sample playbook for cisco.catalystcenter.network_devices_trend_analytics (cisco.catalystcenter 2.15.0)
# Build order: 365
# Resource module for Network Devices Trend Analytics
# Reads ../models/network_devices_trend_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_trend_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_trend_analytics.

- name: "0365 network_devices_trend_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_trend_analytics.yml
  tasks:
    - name: Run network_devices_trend_analytics from its model
      cisco.catalystcenter.network_devices_trend_analytics:
        aggregateAttributes: "{{ (network_devices_trend_analytics.aggregateAttributes | cat_strip_nulls) if (network_devices_trend_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (network_devices_trend_analytics.attributes | cat_strip_nulls) if (network_devices_trend_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ network_devices_trend_analytics.catalystcenter_debug if network_devices_trend_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_trend_analytics.catalystcenter_host if network_devices_trend_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_trend_analytics.catalystcenter_password if network_devices_trend_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_trend_analytics.catalystcenter_port if network_devices_trend_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_trend_analytics.catalystcenter_username if network_devices_trend_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_trend_analytics.catalystcenter_verify if network_devices_trend_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_trend_analytics.catalystcenter_version if network_devices_trend_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ network_devices_trend_analytics.endTime if network_devices_trend_analytics.endTime is not none else omit }}"
        filters: "{{ (network_devices_trend_analytics.filters | cat_strip_nulls) if (network_devices_trend_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (network_devices_trend_analytics.groupBy | cat_strip_nulls) if (network_devices_trend_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        page: "{{ (network_devices_trend_analytics.page | cat_strip_nulls) if (network_devices_trend_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ network_devices_trend_analytics.startTime if network_devices_trend_analytics.startTime is not none else omit }}"
        trendInterval: "{{ network_devices_trend_analytics.trendInterval if network_devices_trend_analytics.trendInterval is not none else omit }}"
        validate_response_schema: "{{ network_devices_trend_analytics.validate_response_schema if network_devices_trend_analytics.validate_response_schema is not none else omit }}"
      register: network_devices_trend_analytics_result
      tags:
        - never
        - network_devices_trend_analytics
