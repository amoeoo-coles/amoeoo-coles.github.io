---
# Sample playbook for cisco.catalystcenter.planned_access_points_info (cisco.catalystcenter 2.15.0)
# Build order: 469
# Information module for Planned Access Points
# Reads ../models/planned_access_points_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/planned_access_points_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0469 planned_access_points_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/planned_access_points_info.yml
  tasks:
    - name: Run planned_access_points_info from its model
      cisco.catalystcenter.planned_access_points_info:
        catalystcenter_debug: "{{ planned_access_points_info.catalystcenter_debug if planned_access_points_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ planned_access_points_info.catalystcenter_host if planned_access_points_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ planned_access_points_info.catalystcenter_password if planned_access_points_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ planned_access_points_info.catalystcenter_port if planned_access_points_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ planned_access_points_info.catalystcenter_username if planned_access_points_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ planned_access_points_info.catalystcenter_verify if planned_access_points_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ planned_access_points_info.catalystcenter_version if planned_access_points_info.catalystcenter_version is not none else omit }}"
        floorId: "{{ planned_access_points_info.floorId if planned_access_points_info.floorId is not none else omit }}"
        headers: "{{ planned_access_points_info.headers if planned_access_points_info.headers is not none else omit }}"
        limit: "{{ planned_access_points_info.limit if planned_access_points_info.limit is not none else omit }}"
        offset: "{{ planned_access_points_info.offset if planned_access_points_info.offset is not none else omit }}"
        radios: "{{ planned_access_points_info.radios if planned_access_points_info.radios is not none else omit }}"
        validate_response_schema: "{{ planned_access_points_info.validate_response_schema if planned_access_points_info.validate_response_schema is not none else omit }}"
      register: planned_access_points_info_result
