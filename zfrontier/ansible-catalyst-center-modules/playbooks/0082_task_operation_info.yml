---
# Sample playbook for cisco.catalystcenter.task_operation_info (cisco.catalystcenter 2.15.0)
# Build order: 82
# Information module for Task Operation
# Reads ../models/task_operation_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/task_operation_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0082 task_operation_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/task_operation_info.yml
  tasks:
    - name: Run task_operation_info from its model
      cisco.catalystcenter.task_operation_info:
        catalystcenter_debug: "{{ task_operation_info.catalystcenter_debug if task_operation_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ task_operation_info.catalystcenter_host if task_operation_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ task_operation_info.catalystcenter_password if task_operation_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ task_operation_info.catalystcenter_port if task_operation_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ task_operation_info.catalystcenter_username if task_operation_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ task_operation_info.catalystcenter_verify if task_operation_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ task_operation_info.catalystcenter_version if task_operation_info.catalystcenter_version is not none else omit }}"
        headers: "{{ task_operation_info.headers if task_operation_info.headers is not none else omit }}"
        limit: "{{ task_operation_info.limit if task_operation_info.limit is not none else omit }}"
        offset: "{{ task_operation_info.offset if task_operation_info.offset is not none else omit }}"
        operationId: "{{ task_operation_info.operationId if task_operation_info.operationId is not none else omit }}"
        validate_response_schema: "{{ task_operation_info.validate_response_schema if task_operation_info.validate_response_schema is not none else omit }}"
      register: task_operation_info_result
