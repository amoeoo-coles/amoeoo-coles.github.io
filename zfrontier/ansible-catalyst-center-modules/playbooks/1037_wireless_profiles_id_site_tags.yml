---
# Sample playbook for cisco.catalystcenter.wireless_profiles_id_site_tags (cisco.catalystcenter 2.15.0)
# Build order: 1037
# Resource module for Wireless Profiles Id Site Tags
# Reads ../models/wireless_profiles_id_site_tags.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_profiles_id_site_tags_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_profiles_id_site_tags.

- name: "1037 wireless_profiles_id_site_tags"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_profiles_id_site_tags.yml
  tasks:
    - name: Run wireless_profiles_id_site_tags from its model
      cisco.catalystcenter.wireless_profiles_id_site_tags:
        apProfileName: "{{ wireless_profiles_id_site_tags.apProfileName if wireless_profiles_id_site_tags.apProfileName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_profiles_id_site_tags.catalystcenter_debug if wireless_profiles_id_site_tags.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_profiles_id_site_tags.catalystcenter_host if wireless_profiles_id_site_tags.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_profiles_id_site_tags.catalystcenter_password if wireless_profiles_id_site_tags.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_profiles_id_site_tags.catalystcenter_port if wireless_profiles_id_site_tags.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_profiles_id_site_tags.catalystcenter_username if wireless_profiles_id_site_tags.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_profiles_id_site_tags.catalystcenter_verify if wireless_profiles_id_site_tags.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_profiles_id_site_tags.catalystcenter_version if wireless_profiles_id_site_tags.catalystcenter_version is not none else omit }}"
        flexProfileName: "{{ wireless_profiles_id_site_tags.flexProfileName if wireless_profiles_id_site_tags.flexProfileName is not none else omit }}"
        id: "{{ wireless_profiles_id_site_tags.id if wireless_profiles_id_site_tags.id is not none else omit }}"
        load: "{{ (wireless_profiles_id_site_tags.load | cat_strip_nulls) if (wireless_profiles_id_site_tags.load | cat_strip_nulls) is not none else omit }}"
        siteIds: "{{ (wireless_profiles_id_site_tags.siteIds | cat_strip_nulls) if (wireless_profiles_id_site_tags.siteIds | cat_strip_nulls) is not none else omit }}"
        siteTagId: "{{ wireless_profiles_id_site_tags.siteTagId if wireless_profiles_id_site_tags.siteTagId is not none else omit }}"
        siteTagName: "{{ wireless_profiles_id_site_tags.siteTagName if wireless_profiles_id_site_tags.siteTagName is not none else omit }}"
        validate_response_schema: "{{ wireless_profiles_id_site_tags.validate_response_schema if wireless_profiles_id_site_tags.validate_response_schema is not none else omit }}"
      register: wireless_profiles_id_site_tags_result
      tags:
        - never
        - wireless_profiles_id_site_tags
