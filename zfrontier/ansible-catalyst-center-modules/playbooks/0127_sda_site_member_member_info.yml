---
# Sample playbook for cisco.catalystcenter.sda_site_member_member_info (cisco.catalystcenter 2.15.0)
# Build order: 127
# Information module for Sda Site Member Member
# Reads ../models/sda_site_member_member_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_site_member_member_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0127 sda_site_member_member_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_site_member_member_info.yml
  tasks:
    - name: Run sda_site_member_member_info from its model
      cisco.catalystcenter.sda_site_member_member_info:
        catalystcenter_debug: "{{ sda_site_member_member_info.catalystcenter_debug if sda_site_member_member_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_site_member_member_info.catalystcenter_host if sda_site_member_member_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_site_member_member_info.catalystcenter_password if sda_site_member_member_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_site_member_member_info.catalystcenter_port if sda_site_member_member_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_site_member_member_info.catalystcenter_username if sda_site_member_member_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_site_member_member_info.catalystcenter_verify if sda_site_member_member_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_site_member_member_info.catalystcenter_version if sda_site_member_member_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_site_member_member_info.headers if sda_site_member_member_info.headers is not none else omit }}"
        id: "{{ sda_site_member_member_info.id if sda_site_member_member_info.id is not none else omit }}"
        level: "{{ sda_site_member_member_info.level if sda_site_member_member_info.level is not none else omit }}"
        limit: "{{ sda_site_member_member_info.limit if sda_site_member_member_info.limit is not none else omit }}"
        memberType: "{{ sda_site_member_member_info.memberType if sda_site_member_member_info.memberType is not none else omit }}"
        offset: "{{ sda_site_member_member_info.offset if sda_site_member_member_info.offset is not none else omit }}"
        validate_response_schema: "{{ sda_site_member_member_info.validate_response_schema if sda_site_member_member_info.validate_response_schema is not none else omit }}"
      register: sda_site_member_member_info_result
