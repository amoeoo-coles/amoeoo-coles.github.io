---
# Sample playbook for cisco.catalystcenter.wireless_controllers_wireless_mobility_groups_mobility_reset (cisco.catalystcenter 2.15.0)
# Build order: 1026
# Resource module for Wireless Controllers Wireless Mobility Groups Mobility Reset
# Reads ../models/wireless_controllers_wireless_mobility_groups_mobility_reset.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_wireless_mobility_groups_mobility_reset_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_wireless_mobility_groups_mobility_reset.

- name: "1026 wireless_controllers_wireless_mobility_groups_mobility_reset"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_wireless_mobility_groups_mobility_reset.yml
  tasks:
    - name: Run wireless_controllers_wireless_mobility_groups_mobility_reset from its model
      cisco.catalystcenter.wireless_controllers_wireless_mobility_groups_mobility_reset:
        catalystcenter_debug: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_debug if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_host if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_password if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_port if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_username if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_verify if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_version if wireless_controllers_wireless_mobility_groups_mobility_reset.catalystcenter_version is not none else omit }}"
        networkDeviceId: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.networkDeviceId if wireless_controllers_wireless_mobility_groups_mobility_reset.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_wireless_mobility_groups_mobility_reset.validate_response_schema if wireless_controllers_wireless_mobility_groups_mobility_reset.validate_response_schema is not none else omit }}"
      register: wireless_controllers_wireless_mobility_groups_mobility_reset_result
      tags:
        - never
        - wireless_controllers_wireless_mobility_groups_mobility_reset
