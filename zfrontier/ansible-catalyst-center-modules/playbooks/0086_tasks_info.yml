---
# Sample playbook for cisco.catalystcenter.tasks_info (cisco.catalystcenter 2.15.0)
# Build order: 86
# Information module for Tasks
# Reads ../models/tasks_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tasks_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0086 tasks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tasks_info.yml
  tasks:
    - name: Run tasks_info from its model
      cisco.catalystcenter.tasks_info:
        catalystcenter_debug: "{{ tasks_info.catalystcenter_debug if tasks_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tasks_info.catalystcenter_host if tasks_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tasks_info.catalystcenter_password if tasks_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tasks_info.catalystcenter_port if tasks_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tasks_info.catalystcenter_username if tasks_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tasks_info.catalystcenter_verify if tasks_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tasks_info.catalystcenter_version if tasks_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ tasks_info.endTime if tasks_info.endTime is not none else omit }}"
        headers: "{{ tasks_info.headers if tasks_info.headers is not none else omit }}"
        id: "{{ tasks_info.id if tasks_info.id is not none else omit }}"
        limit: "{{ tasks_info.limit if tasks_info.limit is not none else omit }}"
        offset: "{{ tasks_info.offset if tasks_info.offset is not none else omit }}"
        order: "{{ tasks_info.order if tasks_info.order is not none else omit }}"
        parentId: "{{ tasks_info.parentId if tasks_info.parentId is not none else omit }}"
        rootId: "{{ tasks_info.rootId if tasks_info.rootId is not none else omit }}"
        sortBy: "{{ tasks_info.sortBy if tasks_info.sortBy is not none else omit }}"
        startTime: "{{ tasks_info.startTime if tasks_info.startTime is not none else omit }}"
        status: "{{ tasks_info.status if tasks_info.status is not none else omit }}"
        validate_response_schema: "{{ tasks_info.validate_response_schema if tasks_info.validate_response_schema is not none else omit }}"
      register: tasks_info_result
