---
# Sample playbook for cisco.catalystcenter.file_namespaces_info (cisco.catalystcenter 2.15.0)
# Build order: 71
# Information module for File Namespaces
# Reads ../models/file_namespaces_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/file_namespaces_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0071 file_namespaces_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/file_namespaces_info.yml
  tasks:
    - name: Run file_namespaces_info from its model
      cisco.catalystcenter.file_namespaces_info:
        catalystcenter_debug: "{{ file_namespaces_info.catalystcenter_debug if file_namespaces_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ file_namespaces_info.catalystcenter_host if file_namespaces_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ file_namespaces_info.catalystcenter_password if file_namespaces_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ file_namespaces_info.catalystcenter_port if file_namespaces_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ file_namespaces_info.catalystcenter_username if file_namespaces_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ file_namespaces_info.catalystcenter_verify if file_namespaces_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ file_namespaces_info.catalystcenter_version if file_namespaces_info.catalystcenter_version is not none else omit }}"
        headers: "{{ file_namespaces_info.headers if file_namespaces_info.headers is not none else omit }}"
        nameSpace: "{{ file_namespaces_info.nameSpace if file_namespaces_info.nameSpace is not none else omit }}"
        validate_response_schema: "{{ file_namespaces_info.validate_response_schema if file_namespaces_info.validate_response_schema is not none else omit }}"
      register: file_namespaces_info_result
