---
# Sample playbook for cisco.catalystcenter.wireless_psk_override (cisco.catalystcenter 2.15.0)
# Build order: 1044
# Resource module for Wireless Psk Override
# Reads ../models/wireless_psk_override.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_psk_override_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_psk_override.

- name: "1044 wireless_psk_override"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_psk_override.yml
  tasks:
    - name: Run wireless_psk_override from its model
      cisco.catalystcenter.wireless_psk_override:
        catalystcenter_debug: "{{ wireless_psk_override.catalystcenter_debug if wireless_psk_override.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_psk_override.catalystcenter_host if wireless_psk_override.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_psk_override.catalystcenter_password if wireless_psk_override.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_psk_override.catalystcenter_port if wireless_psk_override.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_psk_override.catalystcenter_username if wireless_psk_override.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_psk_override.catalystcenter_verify if wireless_psk_override.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_psk_override.catalystcenter_version if wireless_psk_override.catalystcenter_version is not none else omit }}"
        payload: "{{ (wireless_psk_override.payload | cat_strip_nulls) if (wireless_psk_override.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_psk_override.validate_response_schema if wireless_psk_override.validate_response_schema is not none else omit }}"
      register: wireless_psk_override_result
      tags:
        - never
        - wireless_psk_override
