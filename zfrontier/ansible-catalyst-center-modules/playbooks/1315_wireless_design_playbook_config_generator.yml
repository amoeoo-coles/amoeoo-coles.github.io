---
# Sample playbook for cisco.catalystcenter.wireless_design_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 1315
# Generate YAML playbook for wireless_design_workflow_manager module.
# Reads ../models/wireless_design_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_design_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_design_playbook_config_generator.

- name: "1315 wireless_design_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_design_playbook_config_generator.yml
  tasks:
    - name: Run wireless_design_playbook_config_generator from its model
      cisco.catalystcenter.wireless_design_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ wireless_design_playbook_config_generator.catalystcenter_api_task_timeout if wireless_design_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ wireless_design_playbook_config_generator.catalystcenter_debug if wireless_design_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_design_playbook_config_generator.catalystcenter_host if wireless_design_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ wireless_design_playbook_config_generator.catalystcenter_log if wireless_design_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ wireless_design_playbook_config_generator.catalystcenter_log_append if wireless_design_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ wireless_design_playbook_config_generator.catalystcenter_log_file_path if wireless_design_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ wireless_design_playbook_config_generator.catalystcenter_log_level if wireless_design_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ wireless_design_playbook_config_generator.catalystcenter_password if wireless_design_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_design_playbook_config_generator.catalystcenter_port if wireless_design_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ wireless_design_playbook_config_generator.catalystcenter_task_poll_interval if wireless_design_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ wireless_design_playbook_config_generator.catalystcenter_username if wireless_design_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_design_playbook_config_generator.catalystcenter_verify if wireless_design_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_design_playbook_config_generator.catalystcenter_version if wireless_design_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (wireless_design_playbook_config_generator.config | cat_strip_nulls) if (wireless_design_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ wireless_design_playbook_config_generator.file_mode if wireless_design_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ wireless_design_playbook_config_generator.file_path if wireless_design_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ wireless_design_playbook_config_generator.state if wireless_design_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ wireless_design_playbook_config_generator.validate_response_schema if wireless_design_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: wireless_design_playbook_config_generator_result
      tags:
        - never
        - wireless_design_playbook_config_generator
