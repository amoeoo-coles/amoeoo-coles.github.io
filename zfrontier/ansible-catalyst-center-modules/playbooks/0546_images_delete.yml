---
# Sample playbook for cisco.catalystcenter.images_delete (cisco.catalystcenter 2.15.0)
# Build order: 546
# Resource module for Images Delete
# Reads ../models/images_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags images_delete.

- name: "0546 images_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_delete.yml
  tasks:
    - name: Run images_delete from its model
      cisco.catalystcenter.images_delete:
        catalystcenter_debug: "{{ images_delete.catalystcenter_debug if images_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_delete.catalystcenter_host if images_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_delete.catalystcenter_password if images_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_delete.catalystcenter_port if images_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_delete.catalystcenter_username if images_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_delete.catalystcenter_verify if images_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_delete.catalystcenter_version if images_delete.catalystcenter_version is not none else omit }}"
        id: "{{ images_delete.id if images_delete.id is not none else omit }}"
        validate_response_schema: "{{ images_delete.validate_response_schema if images_delete.validate_response_schema is not none else omit }}"
      register: images_delete_result
      tags:
        - never
        - images_delete
