---
# Sample playbook for cisco.catalystcenter.issues_enrichment_details_info (cisco.catalystcenter 2.15.0)
# Build order: 1422
# Information module for Issues Enrichment Details
# Reads ../models/issues_enrichment_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/issues_enrichment_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1422 issues_enrichment_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/issues_enrichment_details_info.yml
  tasks:
    - name: Run issues_enrichment_details_info from its model
      cisco.catalystcenter.issues_enrichment_details_info:
        catalystcenter_debug: "{{ issues_enrichment_details_info.catalystcenter_debug if issues_enrichment_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ issues_enrichment_details_info.catalystcenter_host if issues_enrichment_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ issues_enrichment_details_info.catalystcenter_password if issues_enrichment_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ issues_enrichment_details_info.catalystcenter_port if issues_enrichment_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ issues_enrichment_details_info.catalystcenter_username if issues_enrichment_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ issues_enrichment_details_info.catalystcenter_verify if issues_enrichment_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ issues_enrichment_details_info.catalystcenter_version if issues_enrichment_details_info.catalystcenter_version is not none else omit }}"
        headers: "{{ issues_enrichment_details_info.headers if issues_enrichment_details_info.headers is not none else omit }}"
        validate_response_schema: "{{ issues_enrichment_details_info.validate_response_schema if issues_enrichment_details_info.validate_response_schema is not none else omit }}"
      register: issues_enrichment_details_info_result
