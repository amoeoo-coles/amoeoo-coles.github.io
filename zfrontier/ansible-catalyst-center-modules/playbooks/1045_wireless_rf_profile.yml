---
# Sample playbook for cisco.catalystcenter.wireless_rf_profile (cisco.catalystcenter 2.15.0)
# Build order: 1045
# Resource module for Wireless Rf Profile
# Reads ../models/wireless_rf_profile.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_rf_profile_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_rf_profile.

- name: "1045 wireless_rf_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_rf_profile.yml
  tasks:
    - name: Run wireless_rf_profile from its model
      cisco.catalystcenter.wireless_rf_profile:
        catalystcenter_debug: "{{ wireless_rf_profile.catalystcenter_debug if wireless_rf_profile.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_rf_profile.catalystcenter_host if wireless_rf_profile.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_rf_profile.catalystcenter_password if wireless_rf_profile.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_rf_profile.catalystcenter_port if wireless_rf_profile.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_rf_profile.catalystcenter_username if wireless_rf_profile.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_rf_profile.catalystcenter_verify if wireless_rf_profile.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_rf_profile.catalystcenter_version if wireless_rf_profile.catalystcenter_version is not none else omit }}"
        channelWidth: "{{ wireless_rf_profile.channelWidth if wireless_rf_profile.channelWidth is not none else omit }}"
        defaultRfProfile: "{{ wireless_rf_profile.defaultRfProfile if wireless_rf_profile.defaultRfProfile is not none else omit }}"
        enableBrownField: "{{ wireless_rf_profile.enableBrownField if wireless_rf_profile.enableBrownField is not none else omit }}"
        enableCustom: "{{ wireless_rf_profile.enableCustom if wireless_rf_profile.enableCustom is not none else omit }}"
        enableRadioTypeA: "{{ wireless_rf_profile.enableRadioTypeA if wireless_rf_profile.enableRadioTypeA is not none else omit }}"
        enableRadioTypeB: "{{ wireless_rf_profile.enableRadioTypeB if wireless_rf_profile.enableRadioTypeB is not none else omit }}"
        enableRadioTypeC: "{{ wireless_rf_profile.enableRadioTypeC if wireless_rf_profile.enableRadioTypeC is not none else omit }}"
        name: "{{ wireless_rf_profile.name if wireless_rf_profile.name is not none else omit }}"
        radioTypeAProperties: "{{ (wireless_rf_profile.radioTypeAProperties | cat_strip_nulls) if (wireless_rf_profile.radioTypeAProperties | cat_strip_nulls) is not none else omit }}"
        radioTypeBProperties: "{{ (wireless_rf_profile.radioTypeBProperties | cat_strip_nulls) if (wireless_rf_profile.radioTypeBProperties | cat_strip_nulls) is not none else omit }}"
        radioTypeCProperties: "{{ (wireless_rf_profile.radioTypeCProperties | cat_strip_nulls) if (wireless_rf_profile.radioTypeCProperties | cat_strip_nulls) is not none else omit }}"
        rfProfileName: "{{ wireless_rf_profile.rfProfileName if wireless_rf_profile.rfProfileName is not none else omit }}"
        validate_response_schema: "{{ wireless_rf_profile.validate_response_schema if wireless_rf_profile.validate_response_schema is not none else omit }}"
      register: wireless_rf_profile_result
      tags:
        - never
        - wireless_rf_profile
