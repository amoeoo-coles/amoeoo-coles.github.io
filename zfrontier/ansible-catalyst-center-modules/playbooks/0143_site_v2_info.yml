---
# Sample playbook for cisco.catalystcenter.site_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 143
# Information module for Site V2
# Reads ../models/site_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0143 site_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_v2_info.yml
  tasks:
    - name: Run site_v2_info from its model
      cisco.catalystcenter.site_v2_info:
        catalystcenter_debug: "{{ site_v2_info.catalystcenter_debug if site_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_v2_info.catalystcenter_host if site_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_v2_info.catalystcenter_password if site_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_v2_info.catalystcenter_port if site_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_v2_info.catalystcenter_username if site_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_v2_info.catalystcenter_verify if site_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_v2_info.catalystcenter_version if site_v2_info.catalystcenter_version is not none else omit }}"
        groupNameHierarchy: "{{ site_v2_info.groupNameHierarchy if site_v2_info.groupNameHierarchy is not none else omit }}"
        headers: "{{ site_v2_info.headers if site_v2_info.headers is not none else omit }}"
        id: "{{ site_v2_info.id if site_v2_info.id is not none else omit }}"
        limit: "{{ site_v2_info.limit if site_v2_info.limit is not none else omit }}"
        offset: "{{ site_v2_info.offset if site_v2_info.offset is not none else omit }}"
        type: "{{ site_v2_info.type if site_v2_info.type is not none else omit }}"
        validate_response_schema: "{{ site_v2_info.validate_response_schema if site_v2_info.validate_response_schema is not none else omit }}"
      register: site_v2_info_result
