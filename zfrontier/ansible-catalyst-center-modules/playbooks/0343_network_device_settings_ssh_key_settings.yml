---
# Sample playbook for cisco.catalystcenter.network_device_settings_ssh_key_settings (cisco.catalystcenter 2.15.0)
# Build order: 343
# Resource module for Network Device Settings Ssh Key Settings
# Reads ../models/network_device_settings_ssh_key_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_settings_ssh_key_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_settings_ssh_key_settings.

- name: "0343 network_device_settings_ssh_key_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_settings_ssh_key_settings.yml
  tasks:
    - name: Run network_device_settings_ssh_key_settings from its model
      cisco.catalystcenter.network_device_settings_ssh_key_settings:
        autoAcceptSshKeys: "{{ network_device_settings_ssh_key_settings.autoAcceptSshKeys if network_device_settings_ssh_key_settings.autoAcceptSshKeys is not none else omit }}"
        catalystcenter_debug: "{{ network_device_settings_ssh_key_settings.catalystcenter_debug if network_device_settings_ssh_key_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_settings_ssh_key_settings.catalystcenter_host if network_device_settings_ssh_key_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_settings_ssh_key_settings.catalystcenter_password if network_device_settings_ssh_key_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_settings_ssh_key_settings.catalystcenter_port if network_device_settings_ssh_key_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_settings_ssh_key_settings.catalystcenter_username if network_device_settings_ssh_key_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_settings_ssh_key_settings.catalystcenter_verify if network_device_settings_ssh_key_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_settings_ssh_key_settings.catalystcenter_version if network_device_settings_ssh_key_settings.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ network_device_settings_ssh_key_settings.validate_response_schema if network_device_settings_ssh_key_settings.validate_response_schema is not none else omit }}"
      register: network_device_settings_ssh_key_settings_result
      tags:
        - never
        - network_device_settings_ssh_key_settings
