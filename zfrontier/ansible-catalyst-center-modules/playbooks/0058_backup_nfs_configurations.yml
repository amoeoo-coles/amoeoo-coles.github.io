---
# Sample playbook for cisco.catalystcenter.backup_nfs_configurations (cisco.catalystcenter 2.15.0)
# Build order: 58
# Resource module for Backup Nfs Configurations
# Reads ../models/backup_nfs_configurations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/backup_nfs_configurations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags backup_nfs_configurations.

- name: "0058 backup_nfs_configurations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backup_nfs_configurations.yml
  tasks:
    - name: Run backup_nfs_configurations from its model
      cisco.catalystcenter.backup_nfs_configurations:
        catalystcenter_debug: "{{ backup_nfs_configurations.catalystcenter_debug if backup_nfs_configurations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ backup_nfs_configurations.catalystcenter_host if backup_nfs_configurations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ backup_nfs_configurations.catalystcenter_password if backup_nfs_configurations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ backup_nfs_configurations.catalystcenter_port if backup_nfs_configurations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ backup_nfs_configurations.catalystcenter_username if backup_nfs_configurations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ backup_nfs_configurations.catalystcenter_verify if backup_nfs_configurations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ backup_nfs_configurations.catalystcenter_version if backup_nfs_configurations.catalystcenter_version is not none else omit }}"
        id: "{{ backup_nfs_configurations.id if backup_nfs_configurations.id is not none else omit }}"
        nfsPort: "{{ backup_nfs_configurations.nfsPort if backup_nfs_configurations.nfsPort is not none else omit }}"
        nfsVersion: "{{ backup_nfs_configurations.nfsVersion if backup_nfs_configurations.nfsVersion is not none else omit }}"
        portMapperPort: "{{ backup_nfs_configurations.portMapperPort if backup_nfs_configurations.portMapperPort is not none else omit }}"
        server: "{{ backup_nfs_configurations.server if backup_nfs_configurations.server is not none else omit }}"
        sourcePath: "{{ backup_nfs_configurations.sourcePath if backup_nfs_configurations.sourcePath is not none else omit }}"
        validate_response_schema: "{{ backup_nfs_configurations.validate_response_schema if backup_nfs_configurations.validate_response_schema is not none else omit }}"
      register: backup_nfs_configurations_result
      tags:
        - never
        - backup_nfs_configurations
