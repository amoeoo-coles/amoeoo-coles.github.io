---
# Sample playbook for cisco.catalystcenter.role_permissions_info (cisco.catalystcenter 2.15.0)
# Build order: 48
# Information module for Role Permissions
# Reads ../models/role_permissions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/role_permissions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0048 role_permissions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/role_permissions_info.yml
  tasks:
    - name: Run role_permissions_info from its model
      cisco.catalystcenter.role_permissions_info:
        catalystcenter_debug: "{{ role_permissions_info.catalystcenter_debug if role_permissions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ role_permissions_info.catalystcenter_host if role_permissions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ role_permissions_info.catalystcenter_password if role_permissions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ role_permissions_info.catalystcenter_port if role_permissions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ role_permissions_info.catalystcenter_username if role_permissions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ role_permissions_info.catalystcenter_verify if role_permissions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ role_permissions_info.catalystcenter_version if role_permissions_info.catalystcenter_version is not none else omit }}"
        headers: "{{ role_permissions_info.headers if role_permissions_info.headers is not none else omit }}"
        validate_response_schema: "{{ role_permissions_info.validate_response_schema if role_permissions_info.validate_response_schema is not none else omit }}"
      register: role_permissions_info_result
