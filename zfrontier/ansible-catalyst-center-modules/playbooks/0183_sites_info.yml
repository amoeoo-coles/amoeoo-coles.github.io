---
# Sample playbook for cisco.catalystcenter.sites_info (cisco.catalystcenter 2.15.0)
# Build order: 183
# Information module for Sites
# Reads ../models/sites_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0183 sites_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_info.yml
  tasks:
    - name: Run sites_info from its model
      cisco.catalystcenter.sites_info:
        _unitsOfMeasure: "{{ sites_info._unitsOfMeasure if sites_info._unitsOfMeasure is not none else omit }}"
        catalystcenter_debug: "{{ sites_info.catalystcenter_debug if sites_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_info.catalystcenter_host if sites_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_info.catalystcenter_password if sites_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_info.catalystcenter_port if sites_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_info.catalystcenter_username if sites_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_info.catalystcenter_verify if sites_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_info.catalystcenter_version if sites_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sites_info.headers if sites_info.headers is not none else omit }}"
        id: "{{ sites_info.id if sites_info.id is not none else omit }}"
        limit: "{{ sites_info.limit if sites_info.limit is not none else omit }}"
        name: "{{ sites_info.name if sites_info.name is not none else omit }}"
        nameHierarchy: "{{ sites_info.nameHierarchy if sites_info.nameHierarchy is not none else omit }}"
        offset: "{{ sites_info.offset if sites_info.offset is not none else omit }}"
        type: "{{ sites_info.type if sites_info.type is not none else omit }}"
        validate_response_schema: "{{ sites_info.validate_response_schema if sites_info.validate_response_schema is not none else omit }}"
      register: sites_info_result
