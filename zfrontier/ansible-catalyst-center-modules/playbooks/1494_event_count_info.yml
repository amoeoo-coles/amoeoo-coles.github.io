---
# Sample playbook for cisco.catalystcenter.event_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1494
# Information module for Event Count
# Reads ../models/event_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1494 event_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_count_info.yml
  tasks:
    - name: Run event_count_info from its model
      cisco.catalystcenter.event_count_info:
        catalystcenter_debug: "{{ event_count_info.catalystcenter_debug if event_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_count_info.catalystcenter_host if event_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_count_info.catalystcenter_password if event_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_count_info.catalystcenter_port if event_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_count_info.catalystcenter_username if event_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_count_info.catalystcenter_verify if event_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_count_info.catalystcenter_version if event_count_info.catalystcenter_version is not none else omit }}"
        eventId: "{{ event_count_info.eventId if event_count_info.eventId is not none else omit }}"
        headers: "{{ event_count_info.headers if event_count_info.headers is not none else omit }}"
        tags: "{{ event_count_info.tags if event_count_info.tags is not none else omit }}"
        validate_response_schema: "{{ event_count_info.validate_response_schema if event_count_info.validate_response_schema is not none else omit }}"
      register: event_count_info_result
