---
# Sample playbook for cisco.catalystcenter.trusted_certificates_import (cisco.catalystcenter 2.15.0)
# Build order: 56
# Resource module for Trusted Certificates Import
# Reads ../models/trusted_certificates_import.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/trusted_certificates_import_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags trusted_certificates_import.

- name: "0056 trusted_certificates_import"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/trusted_certificates_import.yml
  tasks:
    - name: Run trusted_certificates_import from its model
      cisco.catalystcenter.trusted_certificates_import:
        catalystcenter_debug: "{{ trusted_certificates_import.catalystcenter_debug if trusted_certificates_import.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ trusted_certificates_import.catalystcenter_host if trusted_certificates_import.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ trusted_certificates_import.catalystcenter_password if trusted_certificates_import.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ trusted_certificates_import.catalystcenter_port if trusted_certificates_import.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ trusted_certificates_import.catalystcenter_username if trusted_certificates_import.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ trusted_certificates_import.catalystcenter_verify if trusted_certificates_import.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ trusted_certificates_import.catalystcenter_version if trusted_certificates_import.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ trusted_certificates_import.validate_response_schema if trusted_certificates_import.validate_response_schema is not none else omit }}"
      register: trusted_certificates_import_result
      tags:
        - never
        - trusted_certificates_import
