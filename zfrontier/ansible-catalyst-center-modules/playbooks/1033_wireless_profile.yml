---
# Sample playbook for cisco.catalystcenter.wireless_profile (cisco.catalystcenter 2.15.0)
# Build order: 1033
# Resource module for Wireless Profile
# Reads ../models/wireless_profile.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_profile_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_profile.

- name: "1033 wireless_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_profile.yml
  tasks:
    - name: Run wireless_profile from its model
      cisco.catalystcenter.wireless_profile:
        additionalInterfaces: "{{ (wireless_profile.additionalInterfaces | cat_strip_nulls) if (wireless_profile.additionalInterfaces | cat_strip_nulls) is not none else omit }}"
        apZones: "{{ (wireless_profile.apZones | cat_strip_nulls) if (wireless_profile.apZones | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ wireless_profile.catalystcenter_debug if wireless_profile.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_profile.catalystcenter_host if wireless_profile.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_profile.catalystcenter_password if wireless_profile.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_profile.catalystcenter_port if wireless_profile.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_profile.catalystcenter_username if wireless_profile.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_profile.catalystcenter_verify if wireless_profile.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_profile.catalystcenter_version if wireless_profile.catalystcenter_version is not none else omit }}"
        featureTemplates: "{{ (wireless_profile.featureTemplates | cat_strip_nulls) if (wireless_profile.featureTemplates | cat_strip_nulls) is not none else omit }}"
        id: "{{ wireless_profile.id if wireless_profile.id is not none else omit }}"
        ssidDetails: "{{ (wireless_profile.ssidDetails | cat_strip_nulls) if (wireless_profile.ssidDetails | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_profile.validate_response_schema if wireless_profile.validate_response_schema is not none else omit }}"
        wirelessProfileName: "{{ wireless_profile.wirelessProfileName if wireless_profile.wirelessProfileName is not none else omit }}"
      register: wireless_profile_result
      tags:
        - never
        - wireless_profile
