---
# Sample playbook for cisco.catalystcenter.wireless_settings_remote_teleworkers (cisco.catalystcenter 2.15.0)
# Build order: 1055
# Resource module for Wireless Settings Remote Teleworkers
# Reads ../models/wireless_settings_remote_teleworkers.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_remote_teleworkers_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_remote_teleworkers.

- name: "1055 wireless_settings_remote_teleworkers"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_remote_teleworkers.yml
  tasks:
    - name: Run wireless_settings_remote_teleworkers from its model
      cisco.catalystcenter.wireless_settings_remote_teleworkers:
        areaId: "{{ wireless_settings_remote_teleworkers.areaId if wireless_settings_remote_teleworkers.areaId is not none else omit }}"
        catalystcenter_debug: "{{ wireless_settings_remote_teleworkers.catalystcenter_debug if wireless_settings_remote_teleworkers.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_remote_teleworkers.catalystcenter_host if wireless_settings_remote_teleworkers.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_remote_teleworkers.catalystcenter_password if wireless_settings_remote_teleworkers.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_remote_teleworkers.catalystcenter_port if wireless_settings_remote_teleworkers.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_remote_teleworkers.catalystcenter_username if wireless_settings_remote_teleworkers.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_remote_teleworkers.catalystcenter_verify if wireless_settings_remote_teleworkers.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_remote_teleworkers.catalystcenter_version if wireless_settings_remote_teleworkers.catalystcenter_version is not none else omit }}"
        enableRemoteTeleworker: "{{ wireless_settings_remote_teleworkers.enableRemoteTeleworker if wireless_settings_remote_teleworkers.enableRemoteTeleworker is not none else omit }}"
        id: "{{ wireless_settings_remote_teleworkers.id if wireless_settings_remote_teleworkers.id is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_remote_teleworkers.validate_response_schema if wireless_settings_remote_teleworkers.validate_response_schema is not none else omit }}"
      register: wireless_settings_remote_teleworkers_result
      tags:
        - never
        - wireless_settings_remote_teleworkers
