---
# Sample playbook for cisco.catalystcenter.event_email_config_info (cisco.catalystcenter 2.15.0)
# Build order: 1495
# Information module for Event Email Config
# Reads ../models/event_email_config_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_email_config_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1495 event_email_config_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_email_config_info.yml
  tasks:
    - name: Run event_email_config_info from its model
      cisco.catalystcenter.event_email_config_info:
        catalystcenter_debug: "{{ event_email_config_info.catalystcenter_debug if event_email_config_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_email_config_info.catalystcenter_host if event_email_config_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_email_config_info.catalystcenter_password if event_email_config_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_email_config_info.catalystcenter_port if event_email_config_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_email_config_info.catalystcenter_username if event_email_config_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_email_config_info.catalystcenter_verify if event_email_config_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_email_config_info.catalystcenter_version if event_email_config_info.catalystcenter_version is not none else omit }}"
        headers: "{{ event_email_config_info.headers if event_email_config_info.headers is not none else omit }}"
        validate_response_schema: "{{ event_email_config_info.validate_response_schema if event_email_config_info.validate_response_schema is not none else omit }}"
      register: event_email_config_info_result
