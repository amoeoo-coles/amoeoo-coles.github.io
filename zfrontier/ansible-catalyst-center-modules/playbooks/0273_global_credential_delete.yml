---
# Sample playbook for cisco.catalystcenter.global_credential_delete (cisco.catalystcenter 2.15.0)
# Build order: 273
# Resource module for Global Credential Delete
# Reads ../models/global_credential_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/global_credential_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags global_credential_delete.

- name: "0273 global_credential_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/global_credential_delete.yml
  tasks:
    - name: Run global_credential_delete from its model
      cisco.catalystcenter.global_credential_delete:
        catalystcenter_debug: "{{ global_credential_delete.catalystcenter_debug if global_credential_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ global_credential_delete.catalystcenter_host if global_credential_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ global_credential_delete.catalystcenter_password if global_credential_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ global_credential_delete.catalystcenter_port if global_credential_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ global_credential_delete.catalystcenter_username if global_credential_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ global_credential_delete.catalystcenter_verify if global_credential_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ global_credential_delete.catalystcenter_version if global_credential_delete.catalystcenter_version is not none else omit }}"
        globalCredentialId: "{{ global_credential_delete.globalCredentialId if global_credential_delete.globalCredentialId is not none else omit }}"
        validate_response_schema: "{{ global_credential_delete.validate_response_schema if global_credential_delete.validate_response_schema is not none else omit }}"
      register: global_credential_delete_result
      tags:
        - never
        - global_credential_delete
