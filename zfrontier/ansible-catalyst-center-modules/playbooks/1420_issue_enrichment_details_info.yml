---
# Sample playbook for cisco.catalystcenter.issue_enrichment_details_info (cisco.catalystcenter 2.15.0)
# Build order: 1420
# Information module for Issue Enrichment Details
# Reads ../models/issue_enrichment_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/issue_enrichment_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1420 issue_enrichment_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/issue_enrichment_details_info.yml
  tasks:
    - name: Run issue_enrichment_details_info from its model
      cisco.catalystcenter.issue_enrichment_details_info:
        catalystcenter_debug: "{{ issue_enrichment_details_info.catalystcenter_debug if issue_enrichment_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ issue_enrichment_details_info.catalystcenter_host if issue_enrichment_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ issue_enrichment_details_info.catalystcenter_password if issue_enrichment_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ issue_enrichment_details_info.catalystcenter_port if issue_enrichment_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ issue_enrichment_details_info.catalystcenter_username if issue_enrichment_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ issue_enrichment_details_info.catalystcenter_verify if issue_enrichment_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ issue_enrichment_details_info.catalystcenter_version if issue_enrichment_details_info.catalystcenter_version is not none else omit }}"
        headers: "{{ issue_enrichment_details_info.headers if issue_enrichment_details_info.headers is not none else omit }}"
        validate_response_schema: "{{ issue_enrichment_details_info.validate_response_schema if issue_enrichment_details_info.validate_response_schema is not none else omit }}"
      register: issue_enrichment_details_info_result
