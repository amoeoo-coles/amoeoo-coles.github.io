---
# Sample playbook for cisco.catalystcenter.network_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 228
# Information module for Network V2
# Reads ../models/network_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0228 network_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_v2_info.yml
  tasks:
    - name: Run network_v2_info from its model
      cisco.catalystcenter.network_v2_info:
        catalystcenter_debug: "{{ network_v2_info.catalystcenter_debug if network_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_v2_info.catalystcenter_host if network_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_v2_info.catalystcenter_password if network_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_v2_info.catalystcenter_port if network_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_v2_info.catalystcenter_username if network_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_v2_info.catalystcenter_verify if network_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_v2_info.catalystcenter_version if network_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ network_v2_info.headers if network_v2_info.headers is not none else omit }}"
        siteId: "{{ network_v2_info.siteId if network_v2_info.siteId is not none else omit }}"
        validate_response_schema: "{{ network_v2_info.validate_response_schema if network_v2_info.validate_response_schema is not none else omit }}"
      register: network_v2_info_result
