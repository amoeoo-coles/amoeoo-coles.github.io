---
# Sample playbook for cisco.catalystcenter.health_score_definitions_info (cisco.catalystcenter 2.15.0)
# Build order: 419
# Information module for Health Score Definitions
# Reads ../models/health_score_definitions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/health_score_definitions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0419 health_score_definitions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/health_score_definitions_info.yml
  tasks:
    - name: Run health_score_definitions_info from its model
      cisco.catalystcenter.health_score_definitions_info:
        attribute: "{{ health_score_definitions_info.attribute if health_score_definitions_info.attribute is not none else omit }}"
        catalystcenter_debug: "{{ health_score_definitions_info.catalystcenter_debug if health_score_definitions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ health_score_definitions_info.catalystcenter_host if health_score_definitions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ health_score_definitions_info.catalystcenter_password if health_score_definitions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ health_score_definitions_info.catalystcenter_port if health_score_definitions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ health_score_definitions_info.catalystcenter_username if health_score_definitions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ health_score_definitions_info.catalystcenter_verify if health_score_definitions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ health_score_definitions_info.catalystcenter_version if health_score_definitions_info.catalystcenter_version is not none else omit }}"
        deviceType: "{{ health_score_definitions_info.deviceType if health_score_definitions_info.deviceType is not none else omit }}"
        headers: "{{ health_score_definitions_info.headers if health_score_definitions_info.headers is not none else omit }}"
        id: "{{ health_score_definitions_info.id if health_score_definitions_info.id is not none else omit }}"
        includeForOverallHealth: "{{ health_score_definitions_info.includeForOverallHealth if health_score_definitions_info.includeForOverallHealth is not none else omit }}"
        limit: "{{ health_score_definitions_info.limit if health_score_definitions_info.limit is not none else omit }}"
        offset: "{{ health_score_definitions_info.offset if health_score_definitions_info.offset is not none else omit }}"
        validate_response_schema: "{{ health_score_definitions_info.validate_response_schema if health_score_definitions_info.validate_response_schema is not none else omit }}"
      register: health_score_definitions_info_result
