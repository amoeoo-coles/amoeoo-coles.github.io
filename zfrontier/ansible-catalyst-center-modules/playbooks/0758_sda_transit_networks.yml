---
# Sample playbook for cisco.catalystcenter.sda_transit_networks (cisco.catalystcenter 2.15.0)
# Build order: 758
# Resource module for Sda Transit Networks
# Reads ../models/sda_transit_networks.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_transit_networks_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_transit_networks.

- name: "0758 sda_transit_networks"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_transit_networks.yml
  tasks:
    - name: Run sda_transit_networks from its model
      cisco.catalystcenter.sda_transit_networks:
        catalystcenter_debug: "{{ sda_transit_networks.catalystcenter_debug if sda_transit_networks.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_transit_networks.catalystcenter_host if sda_transit_networks.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_transit_networks.catalystcenter_password if sda_transit_networks.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_transit_networks.catalystcenter_port if sda_transit_networks.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_transit_networks.catalystcenter_username if sda_transit_networks.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_transit_networks.catalystcenter_verify if sda_transit_networks.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_transit_networks.catalystcenter_version if sda_transit_networks.catalystcenter_version is not none else omit }}"
        payload: "{{ (sda_transit_networks.payload | cat_strip_nulls) if (sda_transit_networks.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_transit_networks.validate_response_schema if sda_transit_networks.validate_response_schema is not none else omit }}"
      register: sda_transit_networks_result
      tags:
        - never
        - sda_transit_networks
