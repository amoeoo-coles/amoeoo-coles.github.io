---
# Sample playbook for cisco.catalystcenter.buildings_info (cisco.catalystcenter 2.15.0)
# Build order: 165
# Information module for Buildings
# Reads ../models/buildings_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/buildings_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0165 buildings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/buildings_info.yml
  tasks:
    - name: Run buildings_info from its model
      cisco.catalystcenter.buildings_info:
        catalystcenter_debug: "{{ buildings_info.catalystcenter_debug if buildings_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ buildings_info.catalystcenter_host if buildings_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ buildings_info.catalystcenter_password if buildings_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ buildings_info.catalystcenter_port if buildings_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ buildings_info.catalystcenter_username if buildings_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ buildings_info.catalystcenter_verify if buildings_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ buildings_info.catalystcenter_version if buildings_info.catalystcenter_version is not none else omit }}"
        headers: "{{ buildings_info.headers if buildings_info.headers is not none else omit }}"
        id: "{{ buildings_info.id if buildings_info.id is not none else omit }}"
        validate_response_schema: "{{ buildings_info.validate_response_schema if buildings_info.validate_response_schema is not none else omit }}"
      register: buildings_info_result
