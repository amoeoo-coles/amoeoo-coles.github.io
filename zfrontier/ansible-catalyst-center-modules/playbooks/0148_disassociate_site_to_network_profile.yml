---
# Sample playbook for cisco.catalystcenter.disassociate_site_to_network_profile (cisco.catalystcenter 2.15.0)
# Build order: 148
# Resource module for Disassociate Site To Network Profile
# Reads ../models/disassociate_site_to_network_profile.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/disassociate_site_to_network_profile_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags disassociate_site_to_network_profile.

- name: "0148 disassociate_site_to_network_profile"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/disassociate_site_to_network_profile.yml
  tasks:
    - name: Run disassociate_site_to_network_profile from its model
      cisco.catalystcenter.disassociate_site_to_network_profile:
        catalystcenter_debug: "{{ disassociate_site_to_network_profile.catalystcenter_debug if disassociate_site_to_network_profile.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ disassociate_site_to_network_profile.catalystcenter_host if disassociate_site_to_network_profile.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ disassociate_site_to_network_profile.catalystcenter_password if disassociate_site_to_network_profile.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ disassociate_site_to_network_profile.catalystcenter_port if disassociate_site_to_network_profile.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ disassociate_site_to_network_profile.catalystcenter_username if disassociate_site_to_network_profile.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ disassociate_site_to_network_profile.catalystcenter_verify if disassociate_site_to_network_profile.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ disassociate_site_to_network_profile.catalystcenter_version if disassociate_site_to_network_profile.catalystcenter_version is not none else omit }}"
        networkProfileId: "{{ disassociate_site_to_network_profile.networkProfileId if disassociate_site_to_network_profile.networkProfileId is not none else omit }}"
        siteId: "{{ disassociate_site_to_network_profile.siteId if disassociate_site_to_network_profile.siteId is not none else omit }}"
        validate_response_schema: "{{ disassociate_site_to_network_profile.validate_response_schema if disassociate_site_to_network_profile.validate_response_schema is not none else omit }}"
      register: disassociate_site_to_network_profile_result
      tags:
        - never
        - disassociate_site_to_network_profile
