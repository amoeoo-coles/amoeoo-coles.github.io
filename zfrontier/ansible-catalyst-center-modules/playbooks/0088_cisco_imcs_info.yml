---
# Sample playbook for cisco.catalystcenter.cisco_imcs_info (cisco.catalystcenter 2.15.0)
# Build order: 88
# Information module for Cisco Imcs
# Reads ../models/cisco_imcs_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/cisco_imcs_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0088 cisco_imcs_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/cisco_imcs_info.yml
  tasks:
    - name: Run cisco_imcs_info from its model
      cisco.catalystcenter.cisco_imcs_info:
        catalystcenter_debug: "{{ cisco_imcs_info.catalystcenter_debug if cisco_imcs_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ cisco_imcs_info.catalystcenter_host if cisco_imcs_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ cisco_imcs_info.catalystcenter_password if cisco_imcs_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ cisco_imcs_info.catalystcenter_port if cisco_imcs_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ cisco_imcs_info.catalystcenter_username if cisco_imcs_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ cisco_imcs_info.catalystcenter_verify if cisco_imcs_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ cisco_imcs_info.catalystcenter_version if cisco_imcs_info.catalystcenter_version is not none else omit }}"
        headers: "{{ cisco_imcs_info.headers if cisco_imcs_info.headers is not none else omit }}"
        id: "{{ cisco_imcs_info.id if cisco_imcs_info.id is not none else omit }}"
        validate_response_schema: "{{ cisco_imcs_info.validate_response_schema if cisco_imcs_info.validate_response_schema is not none else omit }}"
      register: cisco_imcs_info_result
