---
# Sample playbook for cisco.catalystcenter.backup_storages_info (cisco.catalystcenter 2.15.0)
# Build order: 63
# Information module for Backup Storages
# Reads ../models/backup_storages_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/backup_storages_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0063 backup_storages_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backup_storages_info.yml
  tasks:
    - name: Run backup_storages_info from its model
      cisco.catalystcenter.backup_storages_info:
        catalystcenter_debug: "{{ backup_storages_info.catalystcenter_debug if backup_storages_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ backup_storages_info.catalystcenter_host if backup_storages_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ backup_storages_info.catalystcenter_password if backup_storages_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ backup_storages_info.catalystcenter_port if backup_storages_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ backup_storages_info.catalystcenter_username if backup_storages_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ backup_storages_info.catalystcenter_verify if backup_storages_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ backup_storages_info.catalystcenter_version if backup_storages_info.catalystcenter_version is not none else omit }}"
        headers: "{{ backup_storages_info.headers if backup_storages_info.headers is not none else omit }}"
        storageType: "{{ backup_storages_info.storageType if backup_storages_info.storageType is not none else omit }}"
        validate_response_schema: "{{ backup_storages_info.validate_response_schema if backup_storages_info.validate_response_schema is not none else omit }}"
      register: backup_storages_info_result
