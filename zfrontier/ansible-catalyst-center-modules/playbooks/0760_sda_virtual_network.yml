---
# Sample playbook for cisco.catalystcenter.sda_virtual_network (cisco.catalystcenter 2.15.0)
# Build order: 760
# Resource module for Sda Virtual Network
# Reads ../models/sda_virtual_network.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_virtual_network_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_virtual_network.

- name: "0760 sda_virtual_network"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_virtual_network.yml
  tasks:
    - name: Run sda_virtual_network from its model
      cisco.catalystcenter.sda_virtual_network:
        catalystcenter_debug: "{{ sda_virtual_network.catalystcenter_debug if sda_virtual_network.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_virtual_network.catalystcenter_host if sda_virtual_network.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_virtual_network.catalystcenter_password if sda_virtual_network.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_virtual_network.catalystcenter_port if sda_virtual_network.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_virtual_network.catalystcenter_username if sda_virtual_network.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_virtual_network.catalystcenter_verify if sda_virtual_network.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_virtual_network.catalystcenter_version if sda_virtual_network.catalystcenter_version is not none else omit }}"
        siteNameHierarchy: "{{ sda_virtual_network.siteNameHierarchy if sda_virtual_network.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ sda_virtual_network.validate_response_schema if sda_virtual_network.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_virtual_network.virtualNetworkName if sda_virtual_network.virtualNetworkName is not none else omit }}"
      register: sda_virtual_network_result
      tags:
        - never
        - sda_virtual_network
