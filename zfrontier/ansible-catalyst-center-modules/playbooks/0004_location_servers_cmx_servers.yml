---
# Sample playbook for cisco.catalystcenter.location_servers_cmx_servers (cisco.catalystcenter 2.15.0)
# Build order: 4
# Resource module for Location Servers Cmx Servers
# Reads ../models/location_servers_cmx_servers.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/location_servers_cmx_servers_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags location_servers_cmx_servers.

- name: "0004 location_servers_cmx_servers"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/location_servers_cmx_servers.yml
  tasks:
    - name: Run location_servers_cmx_servers from its model
      cisco.catalystcenter.location_servers_cmx_servers:
        catalystcenter_debug: "{{ location_servers_cmx_servers.catalystcenter_debug if location_servers_cmx_servers.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ location_servers_cmx_servers.catalystcenter_host if location_servers_cmx_servers.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ location_servers_cmx_servers.catalystcenter_password if location_servers_cmx_servers.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ location_servers_cmx_servers.catalystcenter_port if location_servers_cmx_servers.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ location_servers_cmx_servers.catalystcenter_username if location_servers_cmx_servers.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ location_servers_cmx_servers.catalystcenter_verify if location_servers_cmx_servers.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ location_servers_cmx_servers.catalystcenter_version if location_servers_cmx_servers.catalystcenter_version is not none else omit }}"
        connectionAddress: "{{ location_servers_cmx_servers.connectionAddress if location_servers_cmx_servers.connectionAddress is not none else omit }}"
        id: "{{ location_servers_cmx_servers.id if location_servers_cmx_servers.id is not none else omit }}"
        password: "{{ location_servers_cmx_servers.password if location_servers_cmx_servers.password is not none else omit }}"
        username: "{{ location_servers_cmx_servers.username if location_servers_cmx_servers.username is not none else omit }}"
        validate_response_schema: "{{ location_servers_cmx_servers.validate_response_schema if location_servers_cmx_servers.validate_response_schema is not none else omit }}"
      register: location_servers_cmx_servers_result
      tags:
        - never
        - location_servers_cmx_servers
