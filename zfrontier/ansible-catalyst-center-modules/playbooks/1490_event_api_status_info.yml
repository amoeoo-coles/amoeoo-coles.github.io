---
# Sample playbook for cisco.catalystcenter.event_api_status_info (cisco.catalystcenter 2.15.0)
# Build order: 1490
# Information module for Event Api Status
# Reads ../models/event_api_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_api_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1490 event_api_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_api_status_info.yml
  tasks:
    - name: Run event_api_status_info from its model
      cisco.catalystcenter.event_api_status_info:
        catalystcenter_debug: "{{ event_api_status_info.catalystcenter_debug if event_api_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_api_status_info.catalystcenter_host if event_api_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_api_status_info.catalystcenter_password if event_api_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_api_status_info.catalystcenter_port if event_api_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_api_status_info.catalystcenter_username if event_api_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_api_status_info.catalystcenter_verify if event_api_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_api_status_info.catalystcenter_version if event_api_status_info.catalystcenter_version is not none else omit }}"
        executionId: "{{ event_api_status_info.executionId if event_api_status_info.executionId is not none else omit }}"
        headers: "{{ event_api_status_info.headers if event_api_status_info.headers is not none else omit }}"
        validate_response_schema: "{{ event_api_status_info.validate_response_schema if event_api_status_info.validate_response_schema is not none else omit }}"
      register: event_api_status_info_result
