---
# Sample playbook for cisco.catalystcenter.sites_dns_settings (cisco.catalystcenter 2.15.0)
# Build order: 207
# Resource module for Sites Dns Settings
# Reads ../models/sites_dns_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_dns_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sites_dns_settings.

- name: "0207 sites_dns_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_dns_settings.yml
  tasks:
    - name: Run sites_dns_settings from its model
      cisco.catalystcenter.sites_dns_settings:
        catalystcenter_debug: "{{ sites_dns_settings.catalystcenter_debug if sites_dns_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_dns_settings.catalystcenter_host if sites_dns_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_dns_settings.catalystcenter_password if sites_dns_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_dns_settings.catalystcenter_port if sites_dns_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_dns_settings.catalystcenter_username if sites_dns_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_dns_settings.catalystcenter_verify if sites_dns_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_dns_settings.catalystcenter_version if sites_dns_settings.catalystcenter_version is not none else omit }}"
        dns: "{{ (sites_dns_settings.dns | cat_strip_nulls) if (sites_dns_settings.dns | cat_strip_nulls) is not none else omit }}"
        id: "{{ sites_dns_settings.id if sites_dns_settings.id is not none else omit }}"
        validate_response_schema: "{{ sites_dns_settings.validate_response_schema if sites_dns_settings.validate_response_schema is not none else omit }}"
      register: sites_dns_settings_result
      tags:
        - never
        - sites_dns_settings
