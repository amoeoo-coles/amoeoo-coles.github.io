---
# Sample playbook for cisco.catalystcenter.path_trace_info (cisco.catalystcenter 2.15.0)
# Build order: 1463
# Information module for Path Trace
# Reads ../models/path_trace_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/path_trace_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1463 path_trace_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/path_trace_info.yml
  tasks:
    - name: Run path_trace_info from its model
      cisco.catalystcenter.path_trace_info:
        catalystcenter_debug: "{{ path_trace_info.catalystcenter_debug if path_trace_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ path_trace_info.catalystcenter_host if path_trace_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ path_trace_info.catalystcenter_password if path_trace_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ path_trace_info.catalystcenter_port if path_trace_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ path_trace_info.catalystcenter_username if path_trace_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ path_trace_info.catalystcenter_verify if path_trace_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ path_trace_info.catalystcenter_version if path_trace_info.catalystcenter_version is not none else omit }}"
        destIP: "{{ path_trace_info.destIP if path_trace_info.destIP is not none else omit }}"
        destPort: "{{ path_trace_info.destPort if path_trace_info.destPort is not none else omit }}"
        flowAnalysisId: "{{ path_trace_info.flowAnalysisId if path_trace_info.flowAnalysisId is not none else omit }}"
        gtCreateTime: "{{ path_trace_info.gtCreateTime if path_trace_info.gtCreateTime is not none else omit }}"
        headers: "{{ path_trace_info.headers if path_trace_info.headers is not none else omit }}"
        lastUpdateTime: "{{ path_trace_info.lastUpdateTime if path_trace_info.lastUpdateTime is not none else omit }}"
        limit: "{{ path_trace_info.limit if path_trace_info.limit is not none else omit }}"
        ltCreateTime: "{{ path_trace_info.ltCreateTime if path_trace_info.ltCreateTime is not none else omit }}"
        offset: "{{ path_trace_info.offset if path_trace_info.offset is not none else omit }}"
        order: "{{ path_trace_info.order if path_trace_info.order is not none else omit }}"
        periodicRefresh: "{{ path_trace_info.periodicRefresh if path_trace_info.periodicRefresh is not none else omit }}"
        protocol: "{{ path_trace_info.protocol if path_trace_info.protocol is not none else omit }}"
        sortBy: "{{ path_trace_info.sortBy if path_trace_info.sortBy is not none else omit }}"
        sourceIP: "{{ path_trace_info.sourceIP if path_trace_info.sourceIP is not none else omit }}"
        sourcePort: "{{ path_trace_info.sourcePort if path_trace_info.sourcePort is not none else omit }}"
        status: "{{ path_trace_info.status if path_trace_info.status is not none else omit }}"
        taskId: "{{ path_trace_info.taskId if path_trace_info.taskId is not none else omit }}"
        validate_response_schema: "{{ path_trace_info.validate_response_schema if path_trace_info.validate_response_schema is not none else omit }}"
      register: path_trace_info_result
