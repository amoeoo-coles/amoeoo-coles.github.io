---
# Sample playbook for cisco.catalystcenter.site_info (cisco.catalystcenter 2.15.0)
# Build order: 136
# Information module for Site
# Reads ../models/site_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0136 site_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_info.yml
  tasks:
    - name: Run site_info from its model
      cisco.catalystcenter.site_info:
        catalystcenter_debug: "{{ site_info.catalystcenter_debug if site_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_info.catalystcenter_host if site_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_info.catalystcenter_password if site_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_info.catalystcenter_port if site_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_info.catalystcenter_username if site_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_info.catalystcenter_verify if site_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_info.catalystcenter_version if site_info.catalystcenter_version is not none else omit }}"
        headers: "{{ site_info.headers if site_info.headers is not none else omit }}"
        limit: "{{ site_info.limit if site_info.limit is not none else omit }}"
        name: "{{ site_info.name if site_info.name is not none else omit }}"
        offset: "{{ site_info.offset if site_info.offset is not none else omit }}"
        siteId: "{{ site_info.siteId if site_info.siteId is not none else omit }}"
        type: "{{ site_info.type if site_info.type is not none else omit }}"
        validate_response_schema: "{{ site_info.validate_response_schema if site_info.validate_response_schema is not none else omit }}"
      register: site_info_result
