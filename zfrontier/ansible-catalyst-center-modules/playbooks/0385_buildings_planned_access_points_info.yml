        catalystcenter_debug: "{{ buildings_planned_access_points_info.catalystcenter_debug if buildings_planned_access_points_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ buildings_planned_access_points_info.catalystcenter_host if buildings_planned_access_points_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ buildings_planned_access_points_info.catalystcenter_password if buildings_planned_access_points_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ buildings_planned_access_points_info.catalystcenter_port if buildings_planned_access_points_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ buildings_planned_access_points_info.catalystcenter_username if buildings_planned_access_points_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ buildings_planned_access_points_info.catalystcenter_verify if buildings_planned_access_points_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ buildings_planned_access_points_info.catalystcenter_version if buildings_planned_access_points_info.catalystcenter_version is not none else omit }}"
