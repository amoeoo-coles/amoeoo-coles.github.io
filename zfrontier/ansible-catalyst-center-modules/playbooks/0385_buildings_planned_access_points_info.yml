        offset: "{{ buildings_planned_access_points_info.offset if buildings_planned_access_points_info.offset is not none else omit }}"
        radios: "{{ buildings_planned_access_points_info.radios if buildings_planned_access_points_info.radios is not none else omit }}"
        validate_response_schema: "{{ buildings_planned_access_points_info.validate_response_schema if buildings_planned_access_points_info.validate_response_schema is not none else omit }}"
      register: buildings_planned_access_points_info_result
