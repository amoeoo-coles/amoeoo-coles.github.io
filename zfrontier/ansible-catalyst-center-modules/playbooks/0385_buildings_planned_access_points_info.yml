# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0385 buildings_planned_access_points_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/buildings_planned_access_points_info.yml
  tasks:
    - name: Run buildings_planned_access_points_info from its model
      cisco.catalystcenter.buildings_planned_access_points_info:
