---
# Sample playbook for cisco.catalystcenter.accesspoint_location_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 1316
# Resource module for managing Access Point planned positions and real positions in Cisco Catalyst Center
# Reads ../models/accesspoint_location_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/accesspoint_location_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags accesspoint_location_workflow_manager.

- name: "1316 accesspoint_location_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/accesspoint_location_workflow_manager.yml
  tasks:
    - name: Run accesspoint_location_workflow_manager from its model
      cisco.catalystcenter.accesspoint_location_workflow_manager:
        catalystcenter_api_task_timeout: "{{ accesspoint_location_workflow_manager.catalystcenter_api_task_timeout if accesspoint_location_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ accesspoint_location_workflow_manager.catalystcenter_debug if accesspoint_location_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ accesspoint_location_workflow_manager.catalystcenter_host if accesspoint_location_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ accesspoint_location_workflow_manager.catalystcenter_log if accesspoint_location_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ accesspoint_location_workflow_manager.catalystcenter_log_append if accesspoint_location_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ accesspoint_location_workflow_manager.catalystcenter_log_file_path if accesspoint_location_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ accesspoint_location_workflow_manager.catalystcenter_log_level if accesspoint_location_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ accesspoint_location_workflow_manager.catalystcenter_password if accesspoint_location_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ accesspoint_location_workflow_manager.catalystcenter_port if accesspoint_location_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ accesspoint_location_workflow_manager.catalystcenter_task_poll_interval if accesspoint_location_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ accesspoint_location_workflow_manager.catalystcenter_username if accesspoint_location_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ accesspoint_location_workflow_manager.catalystcenter_verify if accesspoint_location_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ accesspoint_location_workflow_manager.catalystcenter_version if accesspoint_location_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (accesspoint_location_workflow_manager.config | cat_strip_nulls) if (accesspoint_location_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ accesspoint_location_workflow_manager.config_verify if accesspoint_location_workflow_manager.config_verify is not none else omit }}"
        state: "{{ accesspoint_location_workflow_manager.state if accesspoint_location_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ accesspoint_location_workflow_manager.validate_response_schema if accesspoint_location_workflow_manager.validate_response_schema is not none else omit }}"
      register: accesspoint_location_workflow_manager_result
      tags:
        - never
        - accesspoint_location_workflow_manager
