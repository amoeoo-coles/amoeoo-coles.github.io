---
# Sample playbook for cisco.catalystcenter.device_health_info (cisco.catalystcenter 2.15.0)
# Build order: 394
# Information module for Device Health
# Reads ../models/device_health_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_health_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0394 device_health_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_health_info.yml
  tasks:
    - name: Run device_health_info from its model
      cisco.catalystcenter.device_health_info:
        catalystcenter_debug: "{{ device_health_info.catalystcenter_debug if device_health_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_health_info.catalystcenter_host if device_health_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_health_info.catalystcenter_password if device_health_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_health_info.catalystcenter_port if device_health_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_health_info.catalystcenter_username if device_health_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_health_info.catalystcenter_verify if device_health_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_health_info.catalystcenter_version if device_health_info.catalystcenter_version is not none else omit }}"
        deviceRole: "{{ device_health_info.deviceRole if device_health_info.deviceRole is not none else omit }}"
        endTime: "{{ device_health_info.endTime if device_health_info.endTime is not none else omit }}"
        headers: "{{ device_health_info.headers if device_health_info.headers is not none else omit }}"
        health: "{{ device_health_info.health if device_health_info.health is not none else omit }}"
        limit: "{{ device_health_info.limit if device_health_info.limit is not none else omit }}"
        offset: "{{ device_health_info.offset if device_health_info.offset is not none else omit }}"
        siteId: "{{ device_health_info.siteId if device_health_info.siteId is not none else omit }}"
        startTime: "{{ device_health_info.startTime if device_health_info.startTime is not none else omit }}"
        validate_response_schema: "{{ device_health_info.validate_response_schema if device_health_info.validate_response_schema is not none else omit }}"
      register: device_health_info_result
