---
# Sample playbook for cisco.catalystcenter.energy_network_devices_info (cisco.catalystcenter 2.15.0)
# Build order: 413
# Information module for Energy Network Devices
# Reads ../models/energy_network_devices_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_network_devices_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0413 energy_network_devices_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_network_devices_info.yml
  tasks:
    - name: Run energy_network_devices_info from its model
      cisco.catalystcenter.energy_network_devices_info:
        attribute: "{{ energy_network_devices_info.attribute if energy_network_devices_info.attribute is not none else omit }}"
        catalystcenter_debug: "{{ energy_network_devices_info.catalystcenter_debug if energy_network_devices_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_network_devices_info.catalystcenter_host if energy_network_devices_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_network_devices_info.catalystcenter_password if energy_network_devices_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_network_devices_info.catalystcenter_port if energy_network_devices_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_network_devices_info.catalystcenter_username if energy_network_devices_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_network_devices_info.catalystcenter_verify if energy_network_devices_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_network_devices_info.catalystcenter_version if energy_network_devices_info.catalystcenter_version is not none else omit }}"
        cursor: "{{ energy_network_devices_info.cursor if energy_network_devices_info.cursor is not none else omit }}"
        deviceCategory: "{{ energy_network_devices_info.deviceCategory if energy_network_devices_info.deviceCategory is not none else omit }}"
        deviceSubCategory: "{{ energy_network_devices_info.deviceSubCategory if energy_network_devices_info.deviceSubCategory is not none else omit }}"
        endTime: "{{ energy_network_devices_info.endTime if energy_network_devices_info.endTime is not none else omit }}"
        headers: "{{ energy_network_devices_info.headers if energy_network_devices_info.headers is not none else omit }}"
        id: "{{ energy_network_devices_info.id if energy_network_devices_info.id is not none else omit }}"
        limit: "{{ energy_network_devices_info.limit if energy_network_devices_info.limit is not none else omit }}"
        order: "{{ energy_network_devices_info.order if energy_network_devices_info.order is not none else omit }}"
        siteHierarchy: "{{ energy_network_devices_info.siteHierarchy if energy_network_devices_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ energy_network_devices_info.siteHierarchyId if energy_network_devices_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ energy_network_devices_info.siteId if energy_network_devices_info.siteId is not none else omit }}"
        sortBy: "{{ energy_network_devices_info.sortBy if energy_network_devices_info.sortBy is not none else omit }}"
        startTime: "{{ energy_network_devices_info.startTime if energy_network_devices_info.startTime is not none else omit }}"
        validate_response_schema: "{{ energy_network_devices_info.validate_response_schema if energy_network_devices_info.validate_response_schema is not none else omit }}"
        view: "{{ energy_network_devices_info.view if energy_network_devices_info.view is not none else omit }}"
      register: energy_network_devices_info_result
