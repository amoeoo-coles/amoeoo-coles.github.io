---
# Sample playbook for cisco.catalystcenter.flexible_report_schedule (cisco.catalystcenter 2.15.0)
# Build order: 1468
# Resource module for Flexible Report Schedule
# Reads ../models/flexible_report_schedule.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/flexible_report_schedule_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags flexible_report_schedule.

- name: "1468 flexible_report_schedule"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/flexible_report_schedule.yml
  tasks:
    - name: Run flexible_report_schedule from its model
      cisco.catalystcenter.flexible_report_schedule:
        catalystcenter_debug: "{{ flexible_report_schedule.catalystcenter_debug if flexible_report_schedule.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ flexible_report_schedule.catalystcenter_host if flexible_report_schedule.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ flexible_report_schedule.catalystcenter_password if flexible_report_schedule.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ flexible_report_schedule.catalystcenter_port if flexible_report_schedule.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ flexible_report_schedule.catalystcenter_username if flexible_report_schedule.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ flexible_report_schedule.catalystcenter_verify if flexible_report_schedule.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ flexible_report_schedule.catalystcenter_version if flexible_report_schedule.catalystcenter_version is not none else omit }}"
        reportId: "{{ flexible_report_schedule.reportId if flexible_report_schedule.reportId is not none else omit }}"
        schedule: "{{ (flexible_report_schedule.schedule | cat_strip_nulls) if (flexible_report_schedule.schedule | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ flexible_report_schedule.validate_response_schema if flexible_report_schedule.validate_response_schema is not none else omit }}"
      register: flexible_report_schedule_result
      tags:
        - never
        - flexible_report_schedule
