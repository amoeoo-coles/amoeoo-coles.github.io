---
# Sample playbook for cisco.catalystcenter.system_health_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1432
# Information module for System Health Count
# Reads ../models/system_health_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/system_health_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1432 system_health_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_health_count_info.yml
  tasks:
    - name: Run system_health_count_info from its model
      cisco.catalystcenter.system_health_count_info:
        catalystcenter_debug: "{{ system_health_count_info.catalystcenter_debug if system_health_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ system_health_count_info.catalystcenter_host if system_health_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ system_health_count_info.catalystcenter_password if system_health_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ system_health_count_info.catalystcenter_port if system_health_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ system_health_count_info.catalystcenter_username if system_health_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ system_health_count_info.catalystcenter_verify if system_health_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ system_health_count_info.catalystcenter_version if system_health_count_info.catalystcenter_version is not none else omit }}"
        domain: "{{ system_health_count_info.domain if system_health_count_info.domain is not none else omit }}"
        headers: "{{ system_health_count_info.headers if system_health_count_info.headers is not none else omit }}"
        subdomain: "{{ system_health_count_info.subdomain if system_health_count_info.subdomain is not none else omit }}"
        validate_response_schema: "{{ system_health_count_info.validate_response_schema if system_health_count_info.validate_response_schema is not none else omit }}"
      register: system_health_count_info_result
