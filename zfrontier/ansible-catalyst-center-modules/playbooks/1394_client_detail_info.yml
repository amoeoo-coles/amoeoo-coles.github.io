---
# Sample playbook for cisco.catalystcenter.client_detail_info (cisco.catalystcenter 2.15.0)
# Build order: 1394
# Information module for Client Detail
# Reads ../models/client_detail_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/client_detail_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1394 client_detail_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/client_detail_info.yml
  tasks:
    - name: Run client_detail_info from its model
      cisco.catalystcenter.client_detail_info:
        catalystcenter_debug: "{{ client_detail_info.catalystcenter_debug if client_detail_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ client_detail_info.catalystcenter_host if client_detail_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ client_detail_info.catalystcenter_password if client_detail_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ client_detail_info.catalystcenter_port if client_detail_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ client_detail_info.catalystcenter_username if client_detail_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ client_detail_info.catalystcenter_verify if client_detail_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ client_detail_info.catalystcenter_version if client_detail_info.catalystcenter_version is not none else omit }}"
        headers: "{{ client_detail_info.headers if client_detail_info.headers is not none else omit }}"
        macAddress: "{{ client_detail_info.macAddress if client_detail_info.macAddress is not none else omit }}"
        timestamp: "{{ client_detail_info.timestamp if client_detail_info.timestamp is not none else omit }}"
        validate_response_schema: "{{ client_detail_info.validate_response_schema if client_detail_info.validate_response_schema is not none else omit }}"
      register: client_detail_info_result
