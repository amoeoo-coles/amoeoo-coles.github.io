---
# Sample playbook for cisco.catalystcenter.field_notices_trigger_scan (cisco.catalystcenter 2.15.0)
# Build order: 652
# Resource module for Field Notices Trigger Scan
# Reads ../models/field_notices_trigger_scan.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/field_notices_trigger_scan_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags field_notices_trigger_scan.

- name: "0652 field_notices_trigger_scan"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/field_notices_trigger_scan.yml
  tasks:
    - name: Run field_notices_trigger_scan from its model
      cisco.catalystcenter.field_notices_trigger_scan:
        catalystcenter_debug: "{{ field_notices_trigger_scan.catalystcenter_debug if field_notices_trigger_scan.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ field_notices_trigger_scan.catalystcenter_host if field_notices_trigger_scan.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ field_notices_trigger_scan.catalystcenter_password if field_notices_trigger_scan.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ field_notices_trigger_scan.catalystcenter_port if field_notices_trigger_scan.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ field_notices_trigger_scan.catalystcenter_username if field_notices_trigger_scan.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ field_notices_trigger_scan.catalystcenter_verify if field_notices_trigger_scan.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ field_notices_trigger_scan.catalystcenter_version if field_notices_trigger_scan.catalystcenter_version is not none else omit }}"
        failedDevicesOnly: "{{ field_notices_trigger_scan.failedDevicesOnly if field_notices_trigger_scan.failedDevicesOnly is not none else omit }}"
        validate_response_schema: "{{ field_notices_trigger_scan.validate_response_schema if field_notices_trigger_scan.validate_response_schema is not none else omit }}"
      register: field_notices_trigger_scan_result
      tags:
        - never
        - field_notices_trigger_scan
