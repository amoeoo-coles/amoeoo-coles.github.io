---
# Sample playbook for cisco.catalystcenter.path_traces_info (cisco.catalystcenter 2.15.0)
# Build order: 1465
# Information module for Path Traces
# Reads ../models/path_traces_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/path_traces_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1465 path_traces_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/path_traces_info.yml
  tasks:
    - name: Run path_traces_info from its model
      cisco.catalystcenter.path_traces_info:
        catalystcenter_debug: "{{ path_traces_info.catalystcenter_debug if path_traces_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ path_traces_info.catalystcenter_host if path_traces_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ path_traces_info.catalystcenter_password if path_traces_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ path_traces_info.catalystcenter_port if path_traces_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ path_traces_info.catalystcenter_username if path_traces_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ path_traces_info.catalystcenter_verify if path_traces_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ path_traces_info.catalystcenter_version if path_traces_info.catalystcenter_version is not none else omit }}"
        destinationIpAddress: "{{ path_traces_info.destinationIpAddress if path_traces_info.destinationIpAddress is not none else omit }}"
        destinationMacAddress: "{{ path_traces_info.destinationMacAddress if path_traces_info.destinationMacAddress is not none else omit }}"
        destinationPort: "{{ path_traces_info.destinationPort if path_traces_info.destinationPort is not none else omit }}"
        greaterThanCreateTime: "{{ path_traces_info.greaterThanCreateTime if path_traces_info.greaterThanCreateTime is not none else omit }}"
        headers: "{{ path_traces_info.headers if path_traces_info.headers is not none else omit }}"
        id: "{{ path_traces_info.id if path_traces_info.id is not none else omit }}"
        lastUpdateTime: "{{ path_traces_info.lastUpdateTime if path_traces_info.lastUpdateTime is not none else omit }}"
        lessThanCreateTime: "{{ path_traces_info.lessThanCreateTime if path_traces_info.lessThanCreateTime is not none else omit }}"
        limit: "{{ path_traces_info.limit if path_traces_info.limit is not none else omit }}"
        offset: "{{ path_traces_info.offset if path_traces_info.offset is not none else omit }}"
        order: "{{ path_traces_info.order if path_traces_info.order is not none else omit }}"
        periodicRefresh: "{{ path_traces_info.periodicRefresh if path_traces_info.periodicRefresh is not none else omit }}"
        protocol: "{{ path_traces_info.protocol if path_traces_info.protocol is not none else omit }}"
        sortBy: "{{ path_traces_info.sortBy if path_traces_info.sortBy is not none else omit }}"
        sourceIpAddress: "{{ path_traces_info.sourceIpAddress if path_traces_info.sourceIpAddress is not none else omit }}"
        sourceMacAddress: "{{ path_traces_info.sourceMacAddress if path_traces_info.sourceMacAddress is not none else omit }}"
        sourcePort: "{{ path_traces_info.sourcePort if path_traces_info.sourcePort is not none else omit }}"
        status: "{{ path_traces_info.status if path_traces_info.status is not none else omit }}"
        validate_response_schema: "{{ path_traces_info.validate_response_schema if path_traces_info.validate_response_schema is not none else omit }}"
      register: path_traces_info_result
