---
# Sample playbook for cisco.catalystcenter.global_credential_v2_info (cisco.catalystcenter 2.15.0)
# Build order: 293
# Information module for Global Credential V2
# Reads ../models/global_credential_v2_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/global_credential_v2_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0293 global_credential_v2_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/global_credential_v2_info.yml
  tasks:
    - name: Run global_credential_v2_info from its model
      cisco.catalystcenter.global_credential_v2_info:
        catalystcenter_debug: "{{ global_credential_v2_info.catalystcenter_debug if global_credential_v2_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ global_credential_v2_info.catalystcenter_host if global_credential_v2_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ global_credential_v2_info.catalystcenter_password if global_credential_v2_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ global_credential_v2_info.catalystcenter_port if global_credential_v2_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ global_credential_v2_info.catalystcenter_username if global_credential_v2_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ global_credential_v2_info.catalystcenter_verify if global_credential_v2_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ global_credential_v2_info.catalystcenter_version if global_credential_v2_info.catalystcenter_version is not none else omit }}"
        headers: "{{ global_credential_v2_info.headers if global_credential_v2_info.headers is not none else omit }}"
        validate_response_schema: "{{ global_credential_v2_info.validate_response_schema if global_credential_v2_info.validate_response_schema is not none else omit }}"
      register: global_credential_v2_info_result
