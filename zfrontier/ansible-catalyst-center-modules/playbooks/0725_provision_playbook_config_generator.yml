---
# Sample playbook for cisco.catalystcenter.provision_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 725
# Generate YAML playbook for 'provision_workflow_manager' module.
# Reads ../models/provision_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/provision_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags provision_playbook_config_generator.

- name: "0725 provision_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/provision_playbook_config_generator.yml
  tasks:
    - name: Run provision_playbook_config_generator from its model
      cisco.catalystcenter.provision_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ provision_playbook_config_generator.catalystcenter_api_task_timeout if provision_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ provision_playbook_config_generator.catalystcenter_debug if provision_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ provision_playbook_config_generator.catalystcenter_host if provision_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ provision_playbook_config_generator.catalystcenter_log if provision_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ provision_playbook_config_generator.catalystcenter_log_append if provision_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ provision_playbook_config_generator.catalystcenter_log_file_path if provision_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ provision_playbook_config_generator.catalystcenter_log_level if provision_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ provision_playbook_config_generator.catalystcenter_password if provision_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ provision_playbook_config_generator.catalystcenter_port if provision_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ provision_playbook_config_generator.catalystcenter_task_poll_interval if provision_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ provision_playbook_config_generator.catalystcenter_username if provision_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ provision_playbook_config_generator.catalystcenter_verify if provision_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ provision_playbook_config_generator.catalystcenter_version if provision_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (provision_playbook_config_generator.config | cat_strip_nulls) if (provision_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ provision_playbook_config_generator.file_mode if provision_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ provision_playbook_config_generator.file_path if provision_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ provision_playbook_config_generator.state if provision_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ provision_playbook_config_generator.validate_response_schema if provision_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: provision_playbook_config_generator_result
      tags:
        - never
        - provision_playbook_config_generator
