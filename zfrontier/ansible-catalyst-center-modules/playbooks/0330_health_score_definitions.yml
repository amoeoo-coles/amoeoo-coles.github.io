---
# Sample playbook for cisco.catalystcenter.health_score_definitions (cisco.catalystcenter 2.15.0)
# Build order: 330
# Resource module for Health Score Definitions
# Reads ../models/health_score_definitions.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/health_score_definitions_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags health_score_definitions.

- name: "0330 health_score_definitions"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/health_score_definitions.yml
  tasks:
    - name: Run health_score_definitions from its model
      cisco.catalystcenter.health_score_definitions:
        catalystcenter_debug: "{{ health_score_definitions.catalystcenter_debug if health_score_definitions.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ health_score_definitions.catalystcenter_host if health_score_definitions.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ health_score_definitions.catalystcenter_password if health_score_definitions.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ health_score_definitions.catalystcenter_port if health_score_definitions.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ health_score_definitions.catalystcenter_username if health_score_definitions.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ health_score_definitions.catalystcenter_verify if health_score_definitions.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ health_score_definitions.catalystcenter_version if health_score_definitions.catalystcenter_version is not none else omit }}"
        headers: "{{ health_score_definitions.headers if health_score_definitions.headers is not none else omit }}"
        id: "{{ health_score_definitions.id if health_score_definitions.id is not none else omit }}"
        includeForOverallHealth: "{{ health_score_definitions.includeForOverallHealth if health_score_definitions.includeForOverallHealth is not none else omit }}"
        synchronizeToIssueThreshold: "{{ health_score_definitions.synchronizeToIssueThreshold if health_score_definitions.synchronizeToIssueThreshold is not none else omit }}"
        thresholdValue: "{{ health_score_definitions.thresholdValue if health_score_definitions.thresholdValue is not none else omit }}"
        validate_response_schema: "{{ health_score_definitions.validate_response_schema if health_score_definitions.validate_response_schema is not none else omit }}"
      register: health_score_definitions_result
      tags:
        - never
        - health_score_definitions
