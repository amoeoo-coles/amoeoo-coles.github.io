---
# Sample playbook for cisco.catalystcenter.sda_virtual_network_ip_pool (cisco.catalystcenter 2.15.0)
# Build order: 761
# Resource module for Sda Virtual Network Ip Pool
# Reads ../models/sda_virtual_network_ip_pool.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_virtual_network_ip_pool_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_virtual_network_ip_pool.

- name: "0761 sda_virtual_network_ip_pool"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_virtual_network_ip_pool.yml
  tasks:
    - name: Run sda_virtual_network_ip_pool from its model
      cisco.catalystcenter.sda_virtual_network_ip_pool:
        autoGenerateVlanName: "{{ sda_virtual_network_ip_pool.autoGenerateVlanName if sda_virtual_network_ip_pool.autoGenerateVlanName is not none else omit }}"
        catalystcenter_debug: "{{ sda_virtual_network_ip_pool.catalystcenter_debug if sda_virtual_network_ip_pool.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_virtual_network_ip_pool.catalystcenter_host if sda_virtual_network_ip_pool.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_virtual_network_ip_pool.catalystcenter_password if sda_virtual_network_ip_pool.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_virtual_network_ip_pool.catalystcenter_port if sda_virtual_network_ip_pool.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_virtual_network_ip_pool.catalystcenter_username if sda_virtual_network_ip_pool.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_virtual_network_ip_pool.catalystcenter_verify if sda_virtual_network_ip_pool.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_virtual_network_ip_pool.catalystcenter_version if sda_virtual_network_ip_pool.catalystcenter_version is not none else omit }}"
        ipPoolName: "{{ sda_virtual_network_ip_pool.ipPoolName if sda_virtual_network_ip_pool.ipPoolName is not none else omit }}"
        isBridgeModeVm: "{{ sda_virtual_network_ip_pool.isBridgeModeVm if sda_virtual_network_ip_pool.isBridgeModeVm is not none else omit }}"
        isCommonPool: "{{ sda_virtual_network_ip_pool.isCommonPool if sda_virtual_network_ip_pool.isCommonPool is not none else omit }}"
        isIpDirectedBroadcast: "{{ sda_virtual_network_ip_pool.isIpDirectedBroadcast if sda_virtual_network_ip_pool.isIpDirectedBroadcast is not none else omit }}"
        isL2FloodingEnabled: "{{ sda_virtual_network_ip_pool.isL2FloodingEnabled if sda_virtual_network_ip_pool.isL2FloodingEnabled is not none else omit }}"
        isLayer2Only: "{{ sda_virtual_network_ip_pool.isLayer2Only if sda_virtual_network_ip_pool.isLayer2Only is not none else omit }}"
        isThisCriticalPool: "{{ sda_virtual_network_ip_pool.isThisCriticalPool if sda_virtual_network_ip_pool.isThisCriticalPool is not none else omit }}"
        isWirelessPool: "{{ sda_virtual_network_ip_pool.isWirelessPool if sda_virtual_network_ip_pool.isWirelessPool is not none else omit }}"
        poolType: "{{ sda_virtual_network_ip_pool.poolType if sda_virtual_network_ip_pool.poolType is not none else omit }}"
        scalableGroupName: "{{ sda_virtual_network_ip_pool.scalableGroupName if sda_virtual_network_ip_pool.scalableGroupName is not none else omit }}"
        siteNameHierarchy: "{{ sda_virtual_network_ip_pool.siteNameHierarchy if sda_virtual_network_ip_pool.siteNameHierarchy is not none else omit }}"
        trafficType: "{{ sda_virtual_network_ip_pool.trafficType if sda_virtual_network_ip_pool.trafficType is not none else omit }}"
        validate_response_schema: "{{ sda_virtual_network_ip_pool.validate_response_schema if sda_virtual_network_ip_pool.validate_response_schema is not none else omit }}"
        virtualNetworkName: "{{ sda_virtual_network_ip_pool.virtualNetworkName if sda_virtual_network_ip_pool.virtualNetworkName is not none else omit }}"
        vlanId: "{{ sda_virtual_network_ip_pool.vlanId if sda_virtual_network_ip_pool.vlanId is not none else omit }}"
        vlanName: "{{ sda_virtual_network_ip_pool.vlanName if sda_virtual_network_ip_pool.vlanName is not none else omit }}"
      register: sda_virtual_network_ip_pool_result
      tags:
        - never
        - sda_virtual_network_ip_pool
