---
# Sample playbook for cisco.catalystcenter.installed_release_info (cisco.catalystcenter 2.15.0)
# Build order: 30
# Information module for Installed Release
# Reads ../models/installed_release_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/installed_release_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0030 installed_release_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/installed_release_info.yml
  tasks:
    - name: Run installed_release_info from its model
      cisco.catalystcenter.installed_release_info:
        catalystcenter_debug: "{{ installed_release_info.catalystcenter_debug if installed_release_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ installed_release_info.catalystcenter_host if installed_release_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ installed_release_info.catalystcenter_password if installed_release_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ installed_release_info.catalystcenter_port if installed_release_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ installed_release_info.catalystcenter_username if installed_release_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ installed_release_info.catalystcenter_verify if installed_release_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ installed_release_info.catalystcenter_version if installed_release_info.catalystcenter_version is not none else omit }}"
        headers: "{{ installed_release_info.headers if installed_release_info.headers is not none else omit }}"
        validate_response_schema: "{{ installed_release_info.validate_response_schema if installed_release_info.validate_response_schema is not none else omit }}"
      register: installed_release_info_result
