---
# Sample playbook for cisco.catalystcenter.maps_supported_access_points_info (cisco.catalystcenter 2.15.0)
# Build order: 126
# Information module for Maps Supported Access Points
# Reads ../models/maps_supported_access_points_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/maps_supported_access_points_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0126 maps_supported_access_points_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/maps_supported_access_points_info.yml
  tasks:
    - name: Run maps_supported_access_points_info from its model
      cisco.catalystcenter.maps_supported_access_points_info:
        catalystcenter_debug: "{{ maps_supported_access_points_info.catalystcenter_debug if maps_supported_access_points_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ maps_supported_access_points_info.catalystcenter_host if maps_supported_access_points_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ maps_supported_access_points_info.catalystcenter_password if maps_supported_access_points_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ maps_supported_access_points_info.catalystcenter_port if maps_supported_access_points_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ maps_supported_access_points_info.catalystcenter_username if maps_supported_access_points_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ maps_supported_access_points_info.catalystcenter_verify if maps_supported_access_points_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ maps_supported_access_points_info.catalystcenter_version if maps_supported_access_points_info.catalystcenter_version is not none else omit }}"
        headers: "{{ maps_supported_access_points_info.headers if maps_supported_access_points_info.headers is not none else omit }}"
        validate_response_schema: "{{ maps_supported_access_points_info.validate_response_schema if maps_supported_access_points_info.validate_response_schema is not none else omit }}"
      register: maps_supported_access_points_info_result
