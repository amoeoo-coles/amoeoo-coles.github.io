---
# Sample playbook for cisco.catalystcenter.wireless_controllers_certificate_renewal_create (cisco.catalystcenter 2.15.0)
# Build order: 985
# Resource module for Wireless Controllers Certificate Renewal Create
# Reads ../models/wireless_controllers_certificate_renewal_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_certificate_renewal_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_certificate_renewal_create.

- name: "0985 wireless_controllers_certificate_renewal_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_certificate_renewal_create.yml
  tasks:
    - name: Run wireless_controllers_certificate_renewal_create from its model
      cisco.catalystcenter.wireless_controllers_certificate_renewal_create:
        accessPointMacs: "{{ (wireless_controllers_certificate_renewal_create.accessPointMacs | cat_strip_nulls) if (wireless_controllers_certificate_renewal_create.accessPointMacs | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_debug if wireless_controllers_certificate_renewal_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_host if wireless_controllers_certificate_renewal_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_password if wireless_controllers_certificate_renewal_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_port if wireless_controllers_certificate_renewal_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_username if wireless_controllers_certificate_renewal_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_verify if wireless_controllers_certificate_renewal_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_certificate_renewal_create.catalystcenter_version if wireless_controllers_certificate_renewal_create.catalystcenter_version is not none else omit }}"
        deviceId: "{{ wireless_controllers_certificate_renewal_create.deviceId if wireless_controllers_certificate_renewal_create.deviceId is not none else omit }}"
        expiryTime: "{{ wireless_controllers_certificate_renewal_create.expiryTime if wireless_controllers_certificate_renewal_create.expiryTime is not none else omit }}"
        siteTagIds: "{{ (wireless_controllers_certificate_renewal_create.siteTagIds | cat_strip_nulls) if (wireless_controllers_certificate_renewal_create.siteTagIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_certificate_renewal_create.validate_response_schema if wireless_controllers_certificate_renewal_create.validate_response_schema is not none else omit }}"
      register: wireless_controllers_certificate_renewal_create_result
      tags:
        - never
        - wireless_controllers_certificate_renewal_create
