---
# Sample playbook for cisco.catalystcenter.task_count_info (cisco.catalystcenter 2.15.0)
# Build order: 80
# Information module for Task Count
# Reads ../models/task_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/task_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0080 task_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/task_count_info.yml
  tasks:
    - name: Run task_count_info from its model
      cisco.catalystcenter.task_count_info:
        catalystcenter_debug: "{{ task_count_info.catalystcenter_debug if task_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ task_count_info.catalystcenter_host if task_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ task_count_info.catalystcenter_password if task_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ task_count_info.catalystcenter_port if task_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ task_count_info.catalystcenter_username if task_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ task_count_info.catalystcenter_verify if task_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ task_count_info.catalystcenter_version if task_count_info.catalystcenter_version is not none else omit }}"
        data: "{{ task_count_info.data if task_count_info.data is not none else omit }}"
        endTime: "{{ task_count_info.endTime if task_count_info.endTime is not none else omit }}"
        errorCode: "{{ task_count_info.errorCode if task_count_info.errorCode is not none else omit }}"
        failureReason: "{{ task_count_info.failureReason if task_count_info.failureReason is not none else omit }}"
        headers: "{{ task_count_info.headers if task_count_info.headers is not none else omit }}"
        isError: "{{ task_count_info.isError if task_count_info.isError is not none else omit }}"
        parentId: "{{ task_count_info.parentId if task_count_info.parentId is not none else omit }}"
        progress: "{{ task_count_info.progress if task_count_info.progress is not none else omit }}"
        serviceType: "{{ task_count_info.serviceType if task_count_info.serviceType is not none else omit }}"
        startTime: "{{ task_count_info.startTime if task_count_info.startTime is not none else omit }}"
        username: "{{ task_count_info.username if task_count_info.username is not none else omit }}"
        validate_response_schema: "{{ task_count_info.validate_response_schema if task_count_info.validate_response_schema is not none else omit }}"
      register: task_count_info_result
