---
# Sample playbook for cisco.catalystcenter.interfaces_id_trend_analytics (cisco.catalystcenter 2.15.0)
# Build order: 336
# Resource module for Interfaces Id Trend Analytics
# Reads ../models/interfaces_id_trend_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/interfaces_id_trend_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags interfaces_id_trend_analytics.

- name: "0336 interfaces_id_trend_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/interfaces_id_trend_analytics.yml
  tasks:
    - name: Run interfaces_id_trend_analytics from its model
      cisco.catalystcenter.interfaces_id_trend_analytics:
        aggregateAttributes: "{{ (interfaces_id_trend_analytics.aggregateAttributes | cat_strip_nulls) if (interfaces_id_trend_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (interfaces_id_trend_analytics.attributes | cat_strip_nulls) if (interfaces_id_trend_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ interfaces_id_trend_analytics.catalystcenter_debug if interfaces_id_trend_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ interfaces_id_trend_analytics.catalystcenter_host if interfaces_id_trend_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ interfaces_id_trend_analytics.catalystcenter_password if interfaces_id_trend_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ interfaces_id_trend_analytics.catalystcenter_port if interfaces_id_trend_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ interfaces_id_trend_analytics.catalystcenter_username if interfaces_id_trend_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ interfaces_id_trend_analytics.catalystcenter_verify if interfaces_id_trend_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ interfaces_id_trend_analytics.catalystcenter_version if interfaces_id_trend_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ interfaces_id_trend_analytics.endTime if interfaces_id_trend_analytics.endTime is not none else omit }}"
        filters: "{{ (interfaces_id_trend_analytics.filters | cat_strip_nulls) if (interfaces_id_trend_analytics.filters | cat_strip_nulls) is not none else omit }}"
        id: "{{ interfaces_id_trend_analytics.id if interfaces_id_trend_analytics.id is not none else omit }}"
        startTime: "{{ interfaces_id_trend_analytics.startTime if interfaces_id_trend_analytics.startTime is not none else omit }}"
        timestampOrder: "{{ interfaces_id_trend_analytics.timestampOrder if interfaces_id_trend_analytics.timestampOrder is not none else omit }}"
        trendIntervalInMinutes: "{{ interfaces_id_trend_analytics.trendIntervalInMinutes if interfaces_id_trend_analytics.trendIntervalInMinutes is not none else omit }}"
        validate_response_schema: "{{ interfaces_id_trend_analytics.validate_response_schema if interfaces_id_trend_analytics.validate_response_schema is not none else omit }}"
      register: interfaces_id_trend_analytics_result
      tags:
        - never
        - interfaces_id_trend_analytics
