---
# Sample playbook for cisco.catalystcenter.wireless_policies_ip_access_control_lists_network_group (cisco.catalystcenter 2.15.0)
# Build order: 1031
# Resource module for Wireless Policies Ip Access Control Lists Network Group
# Reads ../models/wireless_policies_ip_access_control_lists_network_group.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_policies_ip_access_control_lists_network_group_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_policies_ip_access_control_lists_network_group.

- name: "1031 wireless_policies_ip_access_control_lists_network_group"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_policies_ip_access_control_lists_network_group.yml
  tasks:
    - name: Run wireless_policies_ip_access_control_lists_network_group from its model
      cisco.catalystcenter.wireless_policies_ip_access_control_lists_network_group:
        catalystcenter_debug: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_debug if wireless_policies_ip_access_control_lists_network_group.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_host if wireless_policies_ip_access_control_lists_network_group.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_password if wireless_policies_ip_access_control_lists_network_group.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_port if wireless_policies_ip_access_control_lists_network_group.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_username if wireless_policies_ip_access_control_lists_network_group.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_verify if wireless_policies_ip_access_control_lists_network_group.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_policies_ip_access_control_lists_network_group.catalystcenter_version if wireless_policies_ip_access_control_lists_network_group.catalystcenter_version is not none else omit }}"
        description: "{{ wireless_policies_ip_access_control_lists_network_group.description if wireless_policies_ip_access_control_lists_network_group.description is not none else omit }}"
        id: "{{ wireless_policies_ip_access_control_lists_network_group.id if wireless_policies_ip_access_control_lists_network_group.id is not none else omit }}"
        ipAddresses: "{{ (wireless_policies_ip_access_control_lists_network_group.ipAddresses | cat_strip_nulls) if (wireless_policies_ip_access_control_lists_network_group.ipAddresses | cat_strip_nulls) is not none else omit }}"
        name: "{{ wireless_policies_ip_access_control_lists_network_group.name if wireless_policies_ip_access_control_lists_network_group.name is not none else omit }}"
        validate_response_schema: "{{ wireless_policies_ip_access_control_lists_network_group.validate_response_schema if wireless_policies_ip_access_control_lists_network_group.validate_response_schema is not none else omit }}"
      register: wireless_policies_ip_access_control_lists_network_group_result
