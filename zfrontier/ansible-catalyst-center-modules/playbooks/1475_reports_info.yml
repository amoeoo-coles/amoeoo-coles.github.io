---
# Sample playbook for cisco.catalystcenter.reports_info (cisco.catalystcenter 2.15.0)
# Build order: 1475
# Information module for Reports
# Reads ../models/reports_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reports_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1475 reports_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reports_info.yml
  tasks:
    - name: Run reports_info from its model
      cisco.catalystcenter.reports_info:
        catalystcenter_debug: "{{ reports_info.catalystcenter_debug if reports_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ reports_info.catalystcenter_host if reports_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ reports_info.catalystcenter_password if reports_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ reports_info.catalystcenter_port if reports_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ reports_info.catalystcenter_username if reports_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ reports_info.catalystcenter_verify if reports_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ reports_info.catalystcenter_version if reports_info.catalystcenter_version is not none else omit }}"
        headers: "{{ reports_info.headers if reports_info.headers is not none else omit }}"
        reportId: "{{ reports_info.reportId if reports_info.reportId is not none else omit }}"
        validate_response_schema: "{{ reports_info.validate_response_schema if reports_info.validate_response_schema is not none else omit }}"
        viewGroupId: "{{ reports_info.viewGroupId if reports_info.viewGroupId is not none else omit }}"
        viewId: "{{ reports_info.viewId if reports_info.viewId is not none else omit }}"
      register: reports_info_result
