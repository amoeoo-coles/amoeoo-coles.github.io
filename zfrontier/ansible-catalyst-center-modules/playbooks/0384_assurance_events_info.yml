---
# Sample playbook for cisco.catalystcenter.assurance_events_info (cisco.catalystcenter 2.15.0)
# Build order: 384
# Information module for Assurance Events
# Reads ../models/assurance_events_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_events_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0384 assurance_events_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_events_info.yml
  tasks:
    - name: Run assurance_events_info from its model
      cisco.catalystcenter.assurance_events_info:
        apMac: "{{ assurance_events_info.apMac if assurance_events_info.apMac is not none else omit }}"
        attribute: "{{ assurance_events_info.attribute if assurance_events_info.attribute is not none else omit }}"
        catalystcenter_debug: "{{ assurance_events_info.catalystcenter_debug if assurance_events_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_events_info.catalystcenter_host if assurance_events_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_events_info.catalystcenter_password if assurance_events_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_events_info.catalystcenter_port if assurance_events_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_events_info.catalystcenter_username if assurance_events_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_events_info.catalystcenter_verify if assurance_events_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_events_info.catalystcenter_version if assurance_events_info.catalystcenter_version is not none else omit }}"
        clientMac: "{{ assurance_events_info.clientMac if assurance_events_info.clientMac is not none else omit }}"
        deviceFamily: "{{ assurance_events_info.deviceFamily if assurance_events_info.deviceFamily is not none else omit }}"
        endTime: "{{ assurance_events_info.endTime if assurance_events_info.endTime is not none else omit }}"
        headers: "{{ assurance_events_info.headers if assurance_events_info.headers is not none else omit }}"
        id: "{{ assurance_events_info.id if assurance_events_info.id is not none else omit }}"
        limit: "{{ assurance_events_info.limit if assurance_events_info.limit is not none else omit }}"
        messageType: "{{ assurance_events_info.messageType if assurance_events_info.messageType is not none else omit }}"
        networkDeviceId: "{{ assurance_events_info.networkDeviceId if assurance_events_info.networkDeviceId is not none else omit }}"
        networkDeviceName: "{{ assurance_events_info.networkDeviceName if assurance_events_info.networkDeviceName is not none else omit }}"
        offset: "{{ assurance_events_info.offset if assurance_events_info.offset is not none else omit }}"
        order: "{{ assurance_events_info.order if assurance_events_info.order is not none else omit }}"
        severity: "{{ assurance_events_info.severity if assurance_events_info.severity is not none else omit }}"
        siteHierarchyId: "{{ assurance_events_info.siteHierarchyId if assurance_events_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ assurance_events_info.siteId if assurance_events_info.siteId is not none else omit }}"
        sortBy: "{{ assurance_events_info.sortBy if assurance_events_info.sortBy is not none else omit }}"
        startTime: "{{ assurance_events_info.startTime if assurance_events_info.startTime is not none else omit }}"
        validate_response_schema: "{{ assurance_events_info.validate_response_schema if assurance_events_info.validate_response_schema is not none else omit }}"
        view: "{{ assurance_events_info.view if assurance_events_info.view is not none else omit }}"
      register: assurance_events_info_result
