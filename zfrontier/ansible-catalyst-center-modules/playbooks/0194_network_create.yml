---
# Sample playbook for cisco.catalystcenter.network_create (cisco.catalystcenter 2.15.0)
# Build order: 194
# Resource module for Network Create
# Reads ../models/network_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_create.

- name: "0194 network_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_create.yml
  tasks:
    - name: Run network_create from its model
      cisco.catalystcenter.network_create:
        catalystcenter_debug: "{{ network_create.catalystcenter_debug if network_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_create.catalystcenter_host if network_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_create.catalystcenter_password if network_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_create.catalystcenter_port if network_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_create.catalystcenter_username if network_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_create.catalystcenter_verify if network_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_create.catalystcenter_version if network_create.catalystcenter_version is not none else omit }}"
        headers: "{{ network_create.headers if network_create.headers is not none else omit }}"
        settings: "{{ (network_create.settings | cat_strip_nulls) if (network_create.settings | cat_strip_nulls) is not none else omit }}"
        siteId: "{{ network_create.siteId if network_create.siteId is not none else omit }}"
        validate_response_schema: "{{ network_create.validate_response_schema if network_create.validate_response_schema is not none else omit }}"
      register: network_create_result
      tags:
        - never
        - network_create
