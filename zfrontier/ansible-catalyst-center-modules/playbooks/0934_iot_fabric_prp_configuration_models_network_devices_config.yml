---
# Sample playbook for cisco.catalystcenter.iot_fabric_prp_configuration_models_network_devices_config (cisco.catalystcenter 2.15.0)
# Build order: 934
# Resource module for Iot Fabric Prp Configuration Models Network Devices Config
# Reads ../models/iot_fabric_prp_configuration_models_network_devices_config.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_fabric_prp_configuration_models_network_devices_config_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_fabric_prp_configuration_models_network_devices_config.

- name: "0934 iot_fabric_prp_configuration_models_network_devices_config"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_fabric_prp_configuration_models_network_devices_config.yml
  tasks:
    - name: Run iot_fabric_prp_configuration_models_network_devices_config from its model
      cisco.catalystcenter.iot_fabric_prp_configuration_models_network_devices_config:
        catalystcenter_debug: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_debug if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_host if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_password if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_port if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_username if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_verify if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_version if iot_fabric_prp_configuration_models_network_devices_config.catalystcenter_version is not none else omit }}"
        networkDeviceId: "{{ iot_fabric_prp_configuration_models_network_devices_config.networkDeviceId if iot_fabric_prp_configuration_models_network_devices_config.networkDeviceId is not none else omit }}"
        previewActivityId: "{{ iot_fabric_prp_configuration_models_network_devices_config.previewActivityId if iot_fabric_prp_configuration_models_network_devices_config.previewActivityId is not none else omit }}"
        validate_response_schema: "{{ iot_fabric_prp_configuration_models_network_devices_config.validate_response_schema if iot_fabric_prp_configuration_models_network_devices_config.validate_response_schema is not none else omit }}"
      register: iot_fabric_prp_configuration_models_network_devices_config_result
      tags:
        - never
        - iot_fabric_prp_configuration_models_network_devices_config
