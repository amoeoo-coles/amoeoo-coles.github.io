---
# Sample playbook for cisco.catalystcenter.swim_import_via_url (cisco.catalystcenter 2.15.0)
# Build order: 559
# Resource module for Swim Import Via Url
# Reads ../models/swim_import_via_url.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/swim_import_via_url_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags swim_import_via_url.

- name: "0559 swim_import_via_url"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/swim_import_via_url.yml
  tasks:
    - name: Run swim_import_via_url from its model
      cisco.catalystcenter.swim_import_via_url:
        catalystcenter_debug: "{{ swim_import_via_url.catalystcenter_debug if swim_import_via_url.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ swim_import_via_url.catalystcenter_host if swim_import_via_url.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ swim_import_via_url.catalystcenter_password if swim_import_via_url.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ swim_import_via_url.catalystcenter_port if swim_import_via_url.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ swim_import_via_url.catalystcenter_username if swim_import_via_url.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ swim_import_via_url.catalystcenter_verify if swim_import_via_url.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ swim_import_via_url.catalystcenter_version if swim_import_via_url.catalystcenter_version is not none else omit }}"
        payload: "{{ (swim_import_via_url.payload | cat_strip_nulls) if (swim_import_via_url.payload | cat_strip_nulls) is not none else omit }}"
        scheduleAt: "{{ swim_import_via_url.scheduleAt if swim_import_via_url.scheduleAt is not none else omit }}"
        scheduleDesc: "{{ swim_import_via_url.scheduleDesc if swim_import_via_url.scheduleDesc is not none else omit }}"
        scheduleOrigin: "{{ swim_import_via_url.scheduleOrigin if swim_import_via_url.scheduleOrigin is not none else omit }}"
        validate_response_schema: "{{ swim_import_via_url.validate_response_schema if swim_import_via_url.validate_response_schema is not none else omit }}"
      register: swim_import_via_url_result
      tags:
        - never
        - swim_import_via_url
