---
# Sample playbook for cisco.catalystcenter.images_site_wise_product_names (cisco.catalystcenter 2.15.0)
# Build order: 551
# Resource module for Images Site Wise Product Names
# Reads ../models/images_site_wise_product_names.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/images_site_wise_product_names_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags images_site_wise_product_names.

- name: "0551 images_site_wise_product_names"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/images_site_wise_product_names.yml
  tasks:
    - name: Run images_site_wise_product_names from its model
      cisco.catalystcenter.images_site_wise_product_names:
        catalystcenter_debug: "{{ images_site_wise_product_names.catalystcenter_debug if images_site_wise_product_names.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ images_site_wise_product_names.catalystcenter_host if images_site_wise_product_names.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ images_site_wise_product_names.catalystcenter_password if images_site_wise_product_names.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ images_site_wise_product_names.catalystcenter_port if images_site_wise_product_names.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ images_site_wise_product_names.catalystcenter_username if images_site_wise_product_names.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ images_site_wise_product_names.catalystcenter_verify if images_site_wise_product_names.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ images_site_wise_product_names.catalystcenter_version if images_site_wise_product_names.catalystcenter_version is not none else omit }}"
        imageId: "{{ images_site_wise_product_names.imageId if images_site_wise_product_names.imageId is not none else omit }}"
        productNameOrdinal: "{{ images_site_wise_product_names.productNameOrdinal if images_site_wise_product_names.productNameOrdinal is not none else omit }}"
        siteIds: "{{ (images_site_wise_product_names.siteIds | cat_strip_nulls) if (images_site_wise_product_names.siteIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ images_site_wise_product_names.validate_response_schema if images_site_wise_product_names.validate_response_schema is not none else omit }}"
      register: images_site_wise_product_names_result
      tags:
        - never
        - images_site_wise_product_names
