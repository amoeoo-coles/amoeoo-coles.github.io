---
# Sample playbook for cisco.catalystcenter.device_reboot_apreboot_info (cisco.catalystcenter 2.15.0)
# Build order: 1058
# Information module for Device Reboot Apreboot
# Reads ../models/device_reboot_apreboot_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_reboot_apreboot_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1058 device_reboot_apreboot_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_reboot_apreboot_info.yml
  tasks:
    - name: Run device_reboot_apreboot_info from its model
      cisco.catalystcenter.device_reboot_apreboot_info:
        catalystcenter_debug: "{{ device_reboot_apreboot_info.catalystcenter_debug if device_reboot_apreboot_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_reboot_apreboot_info.catalystcenter_host if device_reboot_apreboot_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_reboot_apreboot_info.catalystcenter_password if device_reboot_apreboot_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_reboot_apreboot_info.catalystcenter_port if device_reboot_apreboot_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_reboot_apreboot_info.catalystcenter_username if device_reboot_apreboot_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_reboot_apreboot_info.catalystcenter_verify if device_reboot_apreboot_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_reboot_apreboot_info.catalystcenter_version if device_reboot_apreboot_info.catalystcenter_version is not none else omit }}"
        headers: "{{ device_reboot_apreboot_info.headers if device_reboot_apreboot_info.headers is not none else omit }}"
        parentTaskId: "{{ device_reboot_apreboot_info.parentTaskId if device_reboot_apreboot_info.parentTaskId is not none else omit }}"
        validate_response_schema: "{{ device_reboot_apreboot_info.validate_response_schema if device_reboot_apreboot_info.validate_response_schema is not none else omit }}"
      register: device_reboot_apreboot_info_result
