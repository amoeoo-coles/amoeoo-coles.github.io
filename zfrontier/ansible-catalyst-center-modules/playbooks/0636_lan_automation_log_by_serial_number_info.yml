---
# Sample playbook for cisco.catalystcenter.lan_automation_log_by_serial_number_info (cisco.catalystcenter 2.15.0)
# Build order: 636
# Information module for Lan Automation Log By Serial Number
# Reads ../models/lan_automation_log_by_serial_number_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_log_by_serial_number_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0636 lan_automation_log_by_serial_number_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_log_by_serial_number_info.yml
  tasks:
    - name: Run lan_automation_log_by_serial_number_info from its model
      cisco.catalystcenter.lan_automation_log_by_serial_number_info:
        catalystcenter_debug: "{{ lan_automation_log_by_serial_number_info.catalystcenter_debug if lan_automation_log_by_serial_number_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_log_by_serial_number_info.catalystcenter_host if lan_automation_log_by_serial_number_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_log_by_serial_number_info.catalystcenter_password if lan_automation_log_by_serial_number_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_log_by_serial_number_info.catalystcenter_port if lan_automation_log_by_serial_number_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_log_by_serial_number_info.catalystcenter_username if lan_automation_log_by_serial_number_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_log_by_serial_number_info.catalystcenter_verify if lan_automation_log_by_serial_number_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_log_by_serial_number_info.catalystcenter_version if lan_automation_log_by_serial_number_info.catalystcenter_version is not none else omit }}"
        headers: "{{ lan_automation_log_by_serial_number_info.headers if lan_automation_log_by_serial_number_info.headers is not none else omit }}"
        id: "{{ lan_automation_log_by_serial_number_info.id if lan_automation_log_by_serial_number_info.id is not none else omit }}"
        logLevel: "{{ lan_automation_log_by_serial_number_info.logLevel if lan_automation_log_by_serial_number_info.logLevel is not none else omit }}"
        serialNumber: "{{ lan_automation_log_by_serial_number_info.serialNumber if lan_automation_log_by_serial_number_info.serialNumber is not none else omit }}"
        validate_response_schema: "{{ lan_automation_log_by_serial_number_info.validate_response_schema if lan_automation_log_by_serial_number_info.validate_response_schema is not none else omit }}"
      register: lan_automation_log_by_serial_number_info_result
