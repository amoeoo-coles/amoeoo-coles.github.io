---
# Sample playbook for cisco.catalystcenter.download_software_release_update (cisco.catalystcenter 2.15.0)
# Build order: 26
# Resource module for Download Software Release Update
# Reads ../models/download_software_release_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/download_software_release_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags download_software_release_update.

- name: "0026 download_software_release_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/download_software_release_update.yml
  tasks:
    - name: Run download_software_release_update from its model
      cisco.catalystcenter.download_software_release_update:
        catalystcenter_debug: "{{ download_software_release_update.catalystcenter_debug if download_software_release_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ download_software_release_update.catalystcenter_host if download_software_release_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ download_software_release_update.catalystcenter_password if download_software_release_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ download_software_release_update.catalystcenter_port if download_software_release_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ download_software_release_update.catalystcenter_username if download_software_release_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ download_software_release_update.catalystcenter_verify if download_software_release_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ download_software_release_update.catalystcenter_version if download_software_release_update.catalystcenter_version is not none else omit }}"
        optionalPackages: "{{ (download_software_release_update.optionalPackages | cat_strip_nulls) if (download_software_release_update.optionalPackages | cat_strip_nulls) is not none else omit }}"
        releaseName: "{{ download_software_release_update.releaseName if download_software_release_update.releaseName is not none else omit }}"
        releaseVersion: "{{ download_software_release_update.releaseVersion if download_software_release_update.releaseVersion is not none else omit }}"
        validate_response_schema: "{{ download_software_release_update.validate_response_schema if download_software_release_update.validate_response_schema is not none else omit }}"
      register: download_software_release_update_result
      tags:
        - never
        - download_software_release_update
