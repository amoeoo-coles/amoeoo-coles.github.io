---
# Sample playbook for cisco.catalystcenter.applications_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1342
# Information module for Applications Count
# Reads ../models/applications_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/applications_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1342 applications_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/applications_count_info.yml
  tasks:
    - name: Run applications_count_info from its model
      cisco.catalystcenter.applications_count_info:
        catalystcenter_debug: "{{ applications_count_info.catalystcenter_debug if applications_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ applications_count_info.catalystcenter_host if applications_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ applications_count_info.catalystcenter_password if applications_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ applications_count_info.catalystcenter_port if applications_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ applications_count_info.catalystcenter_username if applications_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ applications_count_info.catalystcenter_verify if applications_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ applications_count_info.catalystcenter_version if applications_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ applications_count_info.headers if applications_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ applications_count_info.validate_response_schema if applications_count_info.validate_response_schema is not none else omit }}"
      register: applications_count_info_result
