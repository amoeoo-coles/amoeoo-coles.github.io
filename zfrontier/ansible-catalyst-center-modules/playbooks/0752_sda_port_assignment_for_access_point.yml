---
# Sample playbook for cisco.catalystcenter.sda_port_assignment_for_access_point (cisco.catalystcenter 2.15.0)
# Build order: 752
# Resource module for Sda Port Assignment For Access Point
# Reads ../models/sda_port_assignment_for_access_point.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_port_assignment_for_access_point_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_port_assignment_for_access_point.

- name: "0752 sda_port_assignment_for_access_point"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_port_assignment_for_access_point.yml
  tasks:
    - name: Run sda_port_assignment_for_access_point from its model
      cisco.catalystcenter.sda_port_assignment_for_access_point:
        authenticateTemplateName: "{{ sda_port_assignment_for_access_point.authenticateTemplateName if sda_port_assignment_for_access_point.authenticateTemplateName is not none else omit }}"
        catalystcenter_debug: "{{ sda_port_assignment_for_access_point.catalystcenter_debug if sda_port_assignment_for_access_point.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_port_assignment_for_access_point.catalystcenter_host if sda_port_assignment_for_access_point.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_port_assignment_for_access_point.catalystcenter_password if sda_port_assignment_for_access_point.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_port_assignment_for_access_point.catalystcenter_port if sda_port_assignment_for_access_point.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_port_assignment_for_access_point.catalystcenter_username if sda_port_assignment_for_access_point.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_port_assignment_for_access_point.catalystcenter_verify if sda_port_assignment_for_access_point.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_port_assignment_for_access_point.catalystcenter_version if sda_port_assignment_for_access_point.catalystcenter_version is not none else omit }}"
        dataIpAddressPoolName: "{{ sda_port_assignment_for_access_point.dataIpAddressPoolName if sda_port_assignment_for_access_point.dataIpAddressPoolName is not none else omit }}"
        deviceManagementIpAddress: "{{ sda_port_assignment_for_access_point.deviceManagementIpAddress if sda_port_assignment_for_access_point.deviceManagementIpAddress is not none else omit }}"
        interfaceDescription: "{{ sda_port_assignment_for_access_point.interfaceDescription if sda_port_assignment_for_access_point.interfaceDescription is not none else omit }}"
        interfaceName: "{{ sda_port_assignment_for_access_point.interfaceName if sda_port_assignment_for_access_point.interfaceName is not none else omit }}"
        siteNameHierarchy: "{{ sda_port_assignment_for_access_point.siteNameHierarchy if sda_port_assignment_for_access_point.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ sda_port_assignment_for_access_point.validate_response_schema if sda_port_assignment_for_access_point.validate_response_schema is not none else omit }}"
      register: sda_port_assignment_for_access_point_result
      tags:
        - never
        - sda_port_assignment_for_access_point
