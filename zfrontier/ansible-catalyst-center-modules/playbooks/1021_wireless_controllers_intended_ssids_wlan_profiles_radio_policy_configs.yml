---
# Sample playbook for cisco.catalystcenter.wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs (cisco.catalystcenter 2.15.0)
# Build order: 1021
# Resource module for Wireless Controllers Intended Ssids Wlan Profiles Radio Policy Configs
# Reads ../models/wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.

- name: "1021 wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.yml
  tasks:
    - name: Run wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs from its model
      cisco.catalystcenter.wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs:
        catalystcenter_debug: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_debug if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_host if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_password if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_port if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_username if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_verify if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_version if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.id if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.id is not none else omit }}"
        networkDeviceId: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.networkDeviceId if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.validate_response_schema if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.validate_response_schema is not none else omit }}"
        wlanProfileId: "{{ wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.wlanProfileId if wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs.wlanProfileId is not none else omit }}"
      register: wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs_result
      tags:
        - never
        - wireless_controllers_intended_ssids_wlan_profiles_radio_policy_configs
