---
# Sample playbook for cisco.catalystcenter.wireless_settings_ap_authorization_lists (cisco.catalystcenter 2.15.0)
# Build order: 1047
# Resource module for Wireless Settings Ap Authorization Lists
# Reads ../models/wireless_settings_ap_authorization_lists.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_ap_authorization_lists_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_settings_ap_authorization_lists.

- name: "1047 wireless_settings_ap_authorization_lists"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_settings_ap_authorization_lists.yml
  tasks:
    - name: Run wireless_settings_ap_authorization_lists from its model
      cisco.catalystcenter.wireless_settings_ap_authorization_lists:
        apAuthorizationListName: "{{ wireless_settings_ap_authorization_lists.apAuthorizationListName if wireless_settings_ap_authorization_lists.apAuthorizationListName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_settings_ap_authorization_lists.catalystcenter_debug if wireless_settings_ap_authorization_lists.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_settings_ap_authorization_lists.catalystcenter_host if wireless_settings_ap_authorization_lists.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_settings_ap_authorization_lists.catalystcenter_password if wireless_settings_ap_authorization_lists.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_settings_ap_authorization_lists.catalystcenter_port if wireless_settings_ap_authorization_lists.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_settings_ap_authorization_lists.catalystcenter_username if wireless_settings_ap_authorization_lists.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_settings_ap_authorization_lists.catalystcenter_verify if wireless_settings_ap_authorization_lists.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_settings_ap_authorization_lists.catalystcenter_version if wireless_settings_ap_authorization_lists.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_settings_ap_authorization_lists.id if wireless_settings_ap_authorization_lists.id is not none else omit }}"
        localAuthorization: "{{ (wireless_settings_ap_authorization_lists.localAuthorization | cat_strip_nulls) if (wireless_settings_ap_authorization_lists.localAuthorization | cat_strip_nulls) is not none else omit }}"
        remoteAuthorization: "{{ (wireless_settings_ap_authorization_lists.remoteAuthorization | cat_strip_nulls) if (wireless_settings_ap_authorization_lists.remoteAuthorization | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ wireless_settings_ap_authorization_lists.validate_response_schema if wireless_settings_ap_authorization_lists.validate_response_schema is not none else omit }}"
      register: wireless_settings_ap_authorization_lists_result
      tags:
        - never
        - wireless_settings_ap_authorization_lists
