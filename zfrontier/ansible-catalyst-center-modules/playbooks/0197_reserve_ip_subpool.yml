---
# Sample playbook for cisco.catalystcenter.reserve_ip_subpool (cisco.catalystcenter 2.15.0)
# Build order: 197
# Resource module for Reserve Ip Subpool
# Reads ../models/reserve_ip_subpool.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reserve_ip_subpool_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags reserve_ip_subpool.

- name: "0197 reserve_ip_subpool"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reserve_ip_subpool.yml
  tasks:
    - name: Run reserve_ip_subpool from its model
      cisco.catalystcenter.reserve_ip_subpool:
        catalystcenter_debug: "{{ reserve_ip_subpool.catalystcenter_debug if reserve_ip_subpool.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ reserve_ip_subpool.catalystcenter_host if reserve_ip_subpool.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ reserve_ip_subpool.catalystcenter_password if reserve_ip_subpool.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ reserve_ip_subpool.catalystcenter_port if reserve_ip_subpool.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ reserve_ip_subpool.catalystcenter_username if reserve_ip_subpool.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ reserve_ip_subpool.catalystcenter_verify if reserve_ip_subpool.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ reserve_ip_subpool.catalystcenter_version if reserve_ip_subpool.catalystcenter_version is not none else omit }}"
        id: "{{ reserve_ip_subpool.id if reserve_ip_subpool.id is not none else omit }}"
        ipv4DhcpServers: "{{ (reserve_ip_subpool.ipv4DhcpServers | cat_strip_nulls) if (reserve_ip_subpool.ipv4DhcpServers | cat_strip_nulls) is not none else omit }}"
        ipv4DnsServers: "{{ (reserve_ip_subpool.ipv4DnsServers | cat_strip_nulls) if (reserve_ip_subpool.ipv4DnsServers | cat_strip_nulls) is not none else omit }}"
        ipv4GateWay: "{{ reserve_ip_subpool.ipv4GateWay if reserve_ip_subpool.ipv4GateWay is not none else omit }}"
        ipv4GlobalPool: "{{ reserve_ip_subpool.ipv4GlobalPool if reserve_ip_subpool.ipv4GlobalPool is not none else omit }}"
        ipv4Prefix: "{{ reserve_ip_subpool.ipv4Prefix if reserve_ip_subpool.ipv4Prefix is not none else omit }}"
        ipv4PrefixLength: "{{ reserve_ip_subpool.ipv4PrefixLength if reserve_ip_subpool.ipv4PrefixLength is not none else omit }}"
        ipv4Subnet: "{{ reserve_ip_subpool.ipv4Subnet if reserve_ip_subpool.ipv4Subnet is not none else omit }}"
        ipv4TotalHost: "{{ reserve_ip_subpool.ipv4TotalHost if reserve_ip_subpool.ipv4TotalHost is not none else omit }}"
        ipv6AddressSpace: "{{ reserve_ip_subpool.ipv6AddressSpace if reserve_ip_subpool.ipv6AddressSpace is not none else omit }}"
        ipv6DhcpServers: "{{ (reserve_ip_subpool.ipv6DhcpServers | cat_strip_nulls) if (reserve_ip_subpool.ipv6DhcpServers | cat_strip_nulls) is not none else omit }}"
        ipv6DnsServers: "{{ (reserve_ip_subpool.ipv6DnsServers | cat_strip_nulls) if (reserve_ip_subpool.ipv6DnsServers | cat_strip_nulls) is not none else omit }}"
        ipv6GateWay: "{{ reserve_ip_subpool.ipv6GateWay if reserve_ip_subpool.ipv6GateWay is not none else omit }}"
        ipv6GlobalPool: "{{ reserve_ip_subpool.ipv6GlobalPool if reserve_ip_subpool.ipv6GlobalPool is not none else omit }}"
        ipv6Prefix: "{{ reserve_ip_subpool.ipv6Prefix if reserve_ip_subpool.ipv6Prefix is not none else omit }}"
        ipv6PrefixLength: "{{ reserve_ip_subpool.ipv6PrefixLength if reserve_ip_subpool.ipv6PrefixLength is not none else omit }}"
        ipv6Subnet: "{{ reserve_ip_subpool.ipv6Subnet if reserve_ip_subpool.ipv6Subnet is not none else omit }}"
        ipv6TotalHost: "{{ reserve_ip_subpool.ipv6TotalHost if reserve_ip_subpool.ipv6TotalHost is not none else omit }}"
        name: "{{ reserve_ip_subpool.name if reserve_ip_subpool.name is not none else omit }}"
        siteId: "{{ reserve_ip_subpool.siteId if reserve_ip_subpool.siteId is not none else omit }}"
        slaacSupport: "{{ reserve_ip_subpool.slaacSupport if reserve_ip_subpool.slaacSupport is not none else omit }}"
        type: "{{ reserve_ip_subpool.type if reserve_ip_subpool.type is not none else omit }}"
        validate_response_schema: "{{ reserve_ip_subpool.validate_response_schema if reserve_ip_subpool.validate_response_schema is not none else omit }}"
      register: reserve_ip_subpool_result
      tags:
        - never
        - reserve_ip_subpool
