---
# Sample playbook for cisco.catalystcenter.capture_wired_configuration_models_create (cisco.catalystcenter 2.15.0)
# Build order: 304
# Resource module for Capture Wired Configuration Models Create
# Reads ../models/capture_wired_configuration_models_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/capture_wired_configuration_models_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags capture_wired_configuration_models_create.

- name: "0304 capture_wired_configuration_models_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/capture_wired_configuration_models_create.yml
  tasks:
    - name: Run capture_wired_configuration_models_create from its model
      cisco.catalystcenter.capture_wired_configuration_models_create:
        catalystcenter_debug: "{{ capture_wired_configuration_models_create.catalystcenter_debug if capture_wired_configuration_models_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ capture_wired_configuration_models_create.catalystcenter_host if capture_wired_configuration_models_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ capture_wired_configuration_models_create.catalystcenter_password if capture_wired_configuration_models_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ capture_wired_configuration_models_create.catalystcenter_port if capture_wired_configuration_models_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ capture_wired_configuration_models_create.catalystcenter_username if capture_wired_configuration_models_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ capture_wired_configuration_models_create.catalystcenter_verify if capture_wired_configuration_models_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ capture_wired_configuration_models_create.catalystcenter_version if capture_wired_configuration_models_create.catalystcenter_version is not none else omit }}"
        metadata: "{{ (capture_wired_configuration_models_create.metadata | cat_strip_nulls) if (capture_wired_configuration_models_create.metadata | cat_strip_nulls) is not none else omit }}"
        previewDescription: "{{ capture_wired_configuration_models_create.previewDescription if capture_wired_configuration_models_create.previewDescription is not none else omit }}"
        validate_response_schema: "{{ capture_wired_configuration_models_create.validate_response_schema if capture_wired_configuration_models_create.validate_response_schema is not none else omit }}"
        wiredCaptureSettings: "{{ (capture_wired_configuration_models_create.wiredCaptureSettings | cat_strip_nulls) if (capture_wired_configuration_models_create.wiredCaptureSettings | cat_strip_nulls) is not none else omit }}"
      register: capture_wired_configuration_models_create_result
      tags:
        - never
        - capture_wired_configuration_models_create
