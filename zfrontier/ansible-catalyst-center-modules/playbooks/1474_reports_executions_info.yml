---
# Sample playbook for cisco.catalystcenter.reports_executions_info (cisco.catalystcenter 2.15.0)
# Build order: 1474
# Information module for Reports Executions
# Reads ../models/reports_executions_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reports_executions_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1474 reports_executions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reports_executions_info.yml
  tasks:
    - name: Run reports_executions_info from its model
      cisco.catalystcenter.reports_executions_info:
        catalystcenter_debug: "{{ reports_executions_info.catalystcenter_debug if reports_executions_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ reports_executions_info.catalystcenter_host if reports_executions_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ reports_executions_info.catalystcenter_password if reports_executions_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ reports_executions_info.catalystcenter_port if reports_executions_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ reports_executions_info.catalystcenter_username if reports_executions_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ reports_executions_info.catalystcenter_verify if reports_executions_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ reports_executions_info.catalystcenter_version if reports_executions_info.catalystcenter_version is not none else omit }}"
        dirPath: "{{ reports_executions_info.dirPath if reports_executions_info.dirPath is not none else omit }}"
        executionId: "{{ reports_executions_info.executionId if reports_executions_info.executionId is not none else omit }}"
        filename: "{{ reports_executions_info.filename if reports_executions_info.filename is not none else omit }}"
        headers: "{{ reports_executions_info.headers if reports_executions_info.headers is not none else omit }}"
        reportId: "{{ reports_executions_info.reportId if reports_executions_info.reportId is not none else omit }}"
        saveFile: "{{ reports_executions_info.saveFile if reports_executions_info.saveFile is not none else omit }}"
        validate_response_schema: "{{ reports_executions_info.validate_response_schema if reports_executions_info.validate_response_schema is not none else omit }}"
      register: reports_executions_info_result
