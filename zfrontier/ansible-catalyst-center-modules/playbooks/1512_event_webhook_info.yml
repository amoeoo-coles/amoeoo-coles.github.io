---
# Sample playbook for cisco.catalystcenter.event_webhook_info (cisco.catalystcenter 2.15.0)
# Build order: 1512
# Information module for Event Webhook
# Reads ../models/event_webhook_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_webhook_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1512 event_webhook_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_webhook_info.yml
  tasks:
    - name: Run event_webhook_info from its model
      cisco.catalystcenter.event_webhook_info:
        catalystcenter_debug: "{{ event_webhook_info.catalystcenter_debug if event_webhook_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_webhook_info.catalystcenter_host if event_webhook_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_webhook_info.catalystcenter_password if event_webhook_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_webhook_info.catalystcenter_port if event_webhook_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_webhook_info.catalystcenter_username if event_webhook_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_webhook_info.catalystcenter_verify if event_webhook_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_webhook_info.catalystcenter_version if event_webhook_info.catalystcenter_version is not none else omit }}"
        headers: "{{ event_webhook_info.headers if event_webhook_info.headers is not none else omit }}"
        limit: "{{ event_webhook_info.limit if event_webhook_info.limit is not none else omit }}"
        offset: "{{ event_webhook_info.offset if event_webhook_info.offset is not none else omit }}"
        order: "{{ event_webhook_info.order if event_webhook_info.order is not none else omit }}"
        sortBy: "{{ event_webhook_info.sortBy if event_webhook_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ event_webhook_info.validate_response_schema if event_webhook_info.validate_response_schema is not none else omit }}"
        webhookIds: "{{ event_webhook_info.webhookIds if event_webhook_info.webhookIds is not none else omit }}"
      register: event_webhook_info_result
