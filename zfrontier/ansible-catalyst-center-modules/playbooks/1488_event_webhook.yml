---
# Sample playbook for cisco.catalystcenter.event_webhook (cisco.catalystcenter 2.15.0)
# Build order: 1488
# Resource module for Event Webhook
# Reads ../models/event_webhook.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_webhook_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags event_webhook.

- name: "1488 event_webhook"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_webhook.yml
  tasks:
    - name: Run event_webhook from its model
      cisco.catalystcenter.event_webhook:
        catalystcenter_debug: "{{ event_webhook.catalystcenter_debug if event_webhook.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_webhook.catalystcenter_host if event_webhook.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_webhook.catalystcenter_password if event_webhook.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_webhook.catalystcenter_port if event_webhook.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_webhook.catalystcenter_username if event_webhook.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_webhook.catalystcenter_verify if event_webhook.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_webhook.catalystcenter_version if event_webhook.catalystcenter_version is not none else omit }}"
        description: "{{ event_webhook.description if event_webhook.description is not none else omit }}"
        headers: "{{ (event_webhook.headers | cat_strip_nulls) if (event_webhook.headers | cat_strip_nulls) is not none else omit }}"
        isProxyRoute: "{{ event_webhook.isProxyRoute if event_webhook.isProxyRoute is not none else omit }}"
        method: "{{ event_webhook.method if event_webhook.method is not none else omit }}"
        name: "{{ event_webhook.name if event_webhook.name is not none else omit }}"
        trustCert: "{{ event_webhook.trustCert if event_webhook.trustCert is not none else omit }}"
        url: "{{ event_webhook.url if event_webhook.url is not none else omit }}"
        validate_response_schema: "{{ event_webhook.validate_response_schema if event_webhook.validate_response_schema is not none else omit }}"
        webhookId: "{{ event_webhook.webhookId if event_webhook.webhookId is not none else omit }}"
      register: event_webhook_result
      tags:
        - never
        - event_webhook
