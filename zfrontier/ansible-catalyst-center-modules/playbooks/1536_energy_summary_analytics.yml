---
# Sample playbook for cisco.catalystcenter.energy_summary_analytics (cisco.catalystcenter 2.15.0)
# Build order: 1536
# Resource module for Energy Summary Analytics
# Reads ../models/energy_summary_analytics.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_summary_analytics_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags energy_summary_analytics.

- name: "1536 energy_summary_analytics"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_summary_analytics.yml
  tasks:
    - name: Run energy_summary_analytics from its model
      cisco.catalystcenter.energy_summary_analytics:
        aggregateAttributes: "{{ (energy_summary_analytics.aggregateAttributes | cat_strip_nulls) if (energy_summary_analytics.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (energy_summary_analytics.attributes | cat_strip_nulls) if (energy_summary_analytics.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ energy_summary_analytics.catalystcenter_debug if energy_summary_analytics.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_summary_analytics.catalystcenter_host if energy_summary_analytics.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_summary_analytics.catalystcenter_password if energy_summary_analytics.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_summary_analytics.catalystcenter_port if energy_summary_analytics.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_summary_analytics.catalystcenter_username if energy_summary_analytics.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_summary_analytics.catalystcenter_verify if energy_summary_analytics.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_summary_analytics.catalystcenter_version if energy_summary_analytics.catalystcenter_version is not none else omit }}"
        endTime: "{{ energy_summary_analytics.endTime if energy_summary_analytics.endTime is not none else omit }}"
        filters: "{{ (energy_summary_analytics.filters | cat_strip_nulls) if (energy_summary_analytics.filters | cat_strip_nulls) is not none else omit }}"
        groupBy: "{{ (energy_summary_analytics.groupBy | cat_strip_nulls) if (energy_summary_analytics.groupBy | cat_strip_nulls) is not none else omit }}"
        headers: "{{ energy_summary_analytics.headers if energy_summary_analytics.headers is not none else omit }}"
        page: "{{ (energy_summary_analytics.page | cat_strip_nulls) if (energy_summary_analytics.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ energy_summary_analytics.startTime if energy_summary_analytics.startTime is not none else omit }}"
        validate_response_schema: "{{ energy_summary_analytics.validate_response_schema if energy_summary_analytics.validate_response_schema is not none else omit }}"
      register: energy_summary_analytics_result
      tags:
        - never
        - energy_summary_analytics
