        catalystcenter_verify: "{{ network_device_user_defined_field_update.catalystcenter_verify if network_device_user_defined_field_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_user_defined_field_update.catalystcenter_version if network_device_user_defined_field_update.catalystcenter_version is not none else omit }}"
        deviceId: "{{ network_device_user_defined_field_update.deviceId if network_device_user_defined_field_update.deviceId is not none else omit }}"
        payload: "{{ (network_device_user_defined_field_update.payload | cat_strip_nulls) if (network_device_user_defined_field_update.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ network_device_user_defined_field_update.validate_response_schema if network_device_user_defined_field_update.validate_response_schema is not none else omit }}"
