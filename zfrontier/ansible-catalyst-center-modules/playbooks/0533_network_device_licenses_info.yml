---
# Sample playbook for cisco.catalystcenter.network_device_licenses_info (cisco.catalystcenter 2.15.0)
# Build order: 533
# Information module for Network Device Licenses
# Reads ../models/network_device_licenses_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_licenses_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0533 network_device_licenses_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_licenses_info.yml
  tasks:
