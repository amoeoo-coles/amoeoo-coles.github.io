        authorizationStatus: "{{ network_device_licenses_info.authorizationStatus if network_device_licenses_info.authorizationStatus is not none else omit }}"
        catalystcenter_debug: "{{ network_device_licenses_info.catalystcenter_debug if network_device_licenses_info.catalystcenter_debug is not none else omit }}"
