        catalystcenter_port: "{{ network_device_licenses_info.catalystcenter_port if network_device_licenses_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_licenses_info.catalystcenter_username if network_device_licenses_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_licenses_info.catalystcenter_verify if network_device_licenses_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_licenses_info.catalystcenter_version if network_device_licenses_info.catalystcenter_version is not none else omit }}"
