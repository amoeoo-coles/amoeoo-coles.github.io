        smartAccountId: "{{ network_device_licenses_info.smartAccountId if network_device_licenses_info.smartAccountId is not none else omit }}"
        sortBy: "{{ network_device_licenses_info.sortBy if network_device_licenses_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ network_device_licenses_info.validate_response_schema if network_device_licenses_info.validate_response_schema is not none else omit }}"
        virtualAccountId: "{{ network_device_licenses_info.virtualAccountId if network_device_licenses_info.virtualAccountId is not none else omit }}"
      register: network_device_licenses_info_result
