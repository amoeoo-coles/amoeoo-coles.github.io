        licenseStatus: "{{ network_device_licenses_info.licenseStatus if network_device_licenses_info.licenseStatus is not none else omit }}"
        licenseType: "{{ network_device_licenses_info.licenseType if network_device_licenses_info.licenseType is not none else omit }}"
