---
# Sample playbook for cisco.catalystcenter.wireless_enterprise_ssid (cisco.catalystcenter 2.15.0)
# Build order: 1028
# Resource module for Wireless Enterprise Ssid
# Reads ../models/wireless_enterprise_ssid.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_enterprise_ssid_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_enterprise_ssid.

- name: "1028 wireless_enterprise_ssid"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_enterprise_ssid.yml
  tasks:
    - name: Run wireless_enterprise_ssid from its model
      cisco.catalystcenter.wireless_enterprise_ssid:
        aaaOverride: "{{ wireless_enterprise_ssid.aaaOverride if wireless_enterprise_ssid.aaaOverride is not none else omit }}"
        authKeyMgmt: "{{ (wireless_enterprise_ssid.authKeyMgmt | cat_strip_nulls) if (wireless_enterprise_ssid.authKeyMgmt | cat_strip_nulls) is not none else omit }}"
        basicServiceSetClientIdleTimeout: "{{ wireless_enterprise_ssid.basicServiceSetClientIdleTimeout if wireless_enterprise_ssid.basicServiceSetClientIdleTimeout is not none else omit }}"
        catalystcenter_debug: "{{ wireless_enterprise_ssid.catalystcenter_debug if wireless_enterprise_ssid.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_enterprise_ssid.catalystcenter_host if wireless_enterprise_ssid.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_enterprise_ssid.catalystcenter_password if wireless_enterprise_ssid.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_enterprise_ssid.catalystcenter_port if wireless_enterprise_ssid.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_enterprise_ssid.catalystcenter_username if wireless_enterprise_ssid.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_enterprise_ssid.catalystcenter_verify if wireless_enterprise_ssid.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_enterprise_ssid.catalystcenter_version if wireless_enterprise_ssid.catalystcenter_version is not none else omit }}"
        clientExclusionTimeout: "{{ wireless_enterprise_ssid.clientExclusionTimeout if wireless_enterprise_ssid.clientExclusionTimeout is not none else omit }}"
        clientRateLimit: "{{ wireless_enterprise_ssid.clientRateLimit if wireless_enterprise_ssid.clientRateLimit is not none else omit }}"
        coverageHoleDetectionEnable: "{{ wireless_enterprise_ssid.coverageHoleDetectionEnable if wireless_enterprise_ssid.coverageHoleDetectionEnable is not none else omit }}"
        enableBasicServiceSetMaxIdle: "{{ wireless_enterprise_ssid.enableBasicServiceSetMaxIdle if wireless_enterprise_ssid.enableBasicServiceSetMaxIdle is not none else omit }}"
        enableBroadcastSSID: "{{ wireless_enterprise_ssid.enableBroadcastSSID if wireless_enterprise_ssid.enableBroadcastSSID is not none else omit }}"
        enableClientExclusion: "{{ wireless_enterprise_ssid.enableClientExclusion if wireless_enterprise_ssid.enableClientExclusion is not none else omit }}"
        enableDirectedMulticastService: "{{ wireless_enterprise_ssid.enableDirectedMulticastService if wireless_enterprise_ssid.enableDirectedMulticastService is not none else omit }}"
        enableFastLane: "{{ wireless_enterprise_ssid.enableFastLane if wireless_enterprise_ssid.enableFastLane is not none else omit }}"
        enableMACFiltering: "{{ wireless_enterprise_ssid.enableMACFiltering if wireless_enterprise_ssid.enableMACFiltering is not none else omit }}"
        enableNeighborList: "{{ wireless_enterprise_ssid.enableNeighborList if wireless_enterprise_ssid.enableNeighborList is not none else omit }}"
        enableSessionTimeOut: "{{ wireless_enterprise_ssid.enableSessionTimeOut if wireless_enterprise_ssid.enableSessionTimeOut is not none else omit }}"
        fastTransition: "{{ wireless_enterprise_ssid.fastTransition if wireless_enterprise_ssid.fastTransition is not none else omit }}"
        ghz24Policy: "{{ wireless_enterprise_ssid.ghz24Policy if wireless_enterprise_ssid.ghz24Policy is not none else omit }}"
        ghz6PolicyClientSteering: "{{ wireless_enterprise_ssid.ghz6PolicyClientSteering if wireless_enterprise_ssid.ghz6PolicyClientSteering is not none else omit }}"
        mfpClientProtection: "{{ wireless_enterprise_ssid.mfpClientProtection if wireless_enterprise_ssid.mfpClientProtection is not none else omit }}"
        multiPSKSettings: "{{ (wireless_enterprise_ssid.multiPSKSettings | cat_strip_nulls) if (wireless_enterprise_ssid.multiPSKSettings | cat_strip_nulls) is not none else omit }}"
        name: "{{ wireless_enterprise_ssid.name if wireless_enterprise_ssid.name is not none else omit }}"
        nasOptions: "{{ (wireless_enterprise_ssid.nasOptions | cat_strip_nulls) if (wireless_enterprise_ssid.nasOptions | cat_strip_nulls) is not none else omit }}"
        passphrase: "{{ wireless_enterprise_ssid.passphrase if wireless_enterprise_ssid.passphrase is not none else omit }}"
        policyProfileName: "{{ wireless_enterprise_ssid.policyProfileName if wireless_enterprise_ssid.policyProfileName is not none else omit }}"
        profileName: "{{ wireless_enterprise_ssid.profileName if wireless_enterprise_ssid.profileName is not none else omit }}"
        protectedManagementFrame: "{{ wireless_enterprise_ssid.protectedManagementFrame if wireless_enterprise_ssid.protectedManagementFrame is not none else omit }}"
        radioPolicy: "{{ wireless_enterprise_ssid.radioPolicy if wireless_enterprise_ssid.radioPolicy is not none else omit }}"
        rsnCipherSuiteCcmp256: "{{ wireless_enterprise_ssid.rsnCipherSuiteCcmp256 if wireless_enterprise_ssid.rsnCipherSuiteCcmp256 is not none else omit }}"
        rsnCipherSuiteGcmp128: "{{ wireless_enterprise_ssid.rsnCipherSuiteGcmp128 if wireless_enterprise_ssid.rsnCipherSuiteGcmp128 is not none else omit }}"
        rsnCipherSuiteGcmp256: "{{ wireless_enterprise_ssid.rsnCipherSuiteGcmp256 if wireless_enterprise_ssid.rsnCipherSuiteGcmp256 is not none else omit }}"
        securityLevel: "{{ wireless_enterprise_ssid.securityLevel if wireless_enterprise_ssid.securityLevel is not none else omit }}"
        sessionTimeOut: "{{ wireless_enterprise_ssid.sessionTimeOut if wireless_enterprise_ssid.sessionTimeOut is not none else omit }}"
        ssidName: "{{ wireless_enterprise_ssid.ssidName if wireless_enterprise_ssid.ssidName is not none else omit }}"
        trafficType: "{{ wireless_enterprise_ssid.trafficType if wireless_enterprise_ssid.trafficType is not none else omit }}"
        validate_response_schema: "{{ wireless_enterprise_ssid.validate_response_schema if wireless_enterprise_ssid.validate_response_schema is not none else omit }}"
      register: wireless_enterprise_ssid_result
      tags:
        - never
        - wireless_enterprise_ssid
