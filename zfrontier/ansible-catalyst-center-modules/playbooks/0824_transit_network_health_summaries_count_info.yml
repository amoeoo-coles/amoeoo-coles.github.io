        id: "{{ transit_network_health_summaries_count_info.id if transit_network_health_summaries_count_info.id is not none else omit }}"
        startTime: "{{ transit_network_health_summaries_count_info.startTime if transit_network_health_summaries_count_info.startTime is not none else omit }}"
        validate_response_schema: "{{ transit_network_health_summaries_count_info.validate_response_schema if transit_network_health_summaries_count_info.validate_response_schema is not none else omit }}"
      register: transit_network_health_summaries_count_info_result
