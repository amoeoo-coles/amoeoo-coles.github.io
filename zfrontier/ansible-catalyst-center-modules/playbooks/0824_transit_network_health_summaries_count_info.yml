        catalystcenter_username: "{{ transit_network_health_summaries_count_info.catalystcenter_username if transit_network_health_summaries_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ transit_network_health_summaries_count_info.catalystcenter_verify if transit_network_health_summaries_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ transit_network_health_summaries_count_info.catalystcenter_version if transit_network_health_summaries_count_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ transit_network_health_summaries_count_info.endTime if transit_network_health_summaries_count_info.endTime is not none else omit }}"
