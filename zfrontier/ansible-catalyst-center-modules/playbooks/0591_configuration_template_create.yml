---
# Sample playbook for cisco.catalystcenter.configuration_template_create (cisco.catalystcenter 2.15.0)
# Build order: 591
# Resource module for Configuration Template Create
# Reads ../models/configuration_template_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_create.

- name: "0591 configuration_template_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_create.yml
  tasks:
    - name: Run configuration_template_create from its model
      cisco.catalystcenter.configuration_template_create:
        author: "{{ configuration_template_create.author if configuration_template_create.author is not none else omit }}"
        catalystcenter_debug: "{{ configuration_template_create.catalystcenter_debug if configuration_template_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_create.catalystcenter_host if configuration_template_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_create.catalystcenter_password if configuration_template_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_create.catalystcenter_port if configuration_template_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_create.catalystcenter_username if configuration_template_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_create.catalystcenter_verify if configuration_template_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_create.catalystcenter_version if configuration_template_create.catalystcenter_version is not none else omit }}"
        composite: "{{ configuration_template_create.composite if configuration_template_create.composite is not none else omit }}"
        containingTemplates: "{{ (configuration_template_create.containingTemplates | cat_strip_nulls) if (configuration_template_create.containingTemplates | cat_strip_nulls) is not none else omit }}"
        createTime: "{{ configuration_template_create.createTime if configuration_template_create.createTime is not none else omit }}"
        customParamsOrder: "{{ configuration_template_create.customParamsOrder if configuration_template_create.customParamsOrder is not none else omit }}"
        description: "{{ configuration_template_create.description if configuration_template_create.description is not none else omit }}"
        deviceTypes: "{{ (configuration_template_create.deviceTypes | cat_strip_nulls) if (configuration_template_create.deviceTypes | cat_strip_nulls) is not none else omit }}"
        failurePolicy: "{{ configuration_template_create.failurePolicy if configuration_template_create.failurePolicy is not none else omit }}"
        id: "{{ configuration_template_create.id if configuration_template_create.id is not none else omit }}"
        language: "{{ configuration_template_create.language if configuration_template_create.language is not none else omit }}"
        lastUpdateTime: "{{ configuration_template_create.lastUpdateTime if configuration_template_create.lastUpdateTime is not none else omit }}"
        latestVersionTime: "{{ configuration_template_create.latestVersionTime if configuration_template_create.latestVersionTime is not none else omit }}"
        name: "{{ configuration_template_create.name if configuration_template_create.name is not none else omit }}"
        parentTemplateId: "{{ configuration_template_create.parentTemplateId if configuration_template_create.parentTemplateId is not none else omit }}"
        projectId: "{{ configuration_template_create.projectId if configuration_template_create.projectId is not none else omit }}"
        projectName: "{{ configuration_template_create.projectName if configuration_template_create.projectName is not none else omit }}"
        rollbackTemplateContent: "{{ configuration_template_create.rollbackTemplateContent if configuration_template_create.rollbackTemplateContent is not none else omit }}"
        rollbackTemplateParams: "{{ (configuration_template_create.rollbackTemplateParams | cat_strip_nulls) if (configuration_template_create.rollbackTemplateParams | cat_strip_nulls) is not none else omit }}"
        softwareType: "{{ configuration_template_create.softwareType if configuration_template_create.softwareType is not none else omit }}"
        softwareVariant: "{{ configuration_template_create.softwareVariant if configuration_template_create.softwareVariant is not none else omit }}"
        softwareVersion: "{{ configuration_template_create.softwareVersion if configuration_template_create.softwareVersion is not none else omit }}"
        tags: "{{ (configuration_template_create.tags | cat_strip_nulls) if (configuration_template_create.tags | cat_strip_nulls) is not none else omit }}"
        templateContent: "{{ configuration_template_create.templateContent if configuration_template_create.templateContent is not none else omit }}"
        templateParams: "{{ (configuration_template_create.templateParams | cat_strip_nulls) if (configuration_template_create.templateParams | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ configuration_template_create.validate_response_schema if configuration_template_create.validate_response_schema is not none else omit }}"
        validationErrors: "{{ (configuration_template_create.validationErrors | cat_strip_nulls) if (configuration_template_create.validationErrors | cat_strip_nulls) is not none else omit }}"
        version: "{{ configuration_template_create.version if configuration_template_create.version is not none else omit }}"
      register: configuration_template_create_result
      tags:
        - never
        - configuration_template_create
