---
# Sample playbook for cisco.catalystcenter.network_device_info (cisco.catalystcenter 2.15.0)
# Build order: 435
# Information module for Network Device
# Reads ../models/network_device_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0435 network_device_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_info.yml
  tasks:
    - name: Run network_device_info from its model
      cisco.catalystcenter.network_device_info:
        associatedWlcIp: "{{ (network_device_info.associatedWlcIp | cat_strip_nulls) if (network_device_info.associatedWlcIp | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ network_device_info.catalystcenter_debug if network_device_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_info.catalystcenter_host if network_device_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_info.catalystcenter_password if network_device_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_info.catalystcenter_port if network_device_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_info.catalystcenter_username if network_device_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_info.catalystcenter_verify if network_device_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_info.catalystcenter_version if network_device_info.catalystcenter_version is not none else omit }}"
