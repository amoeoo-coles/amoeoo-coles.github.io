---
# Sample playbook for cisco.catalystcenter.lan_automation_port_channels (cisco.catalystcenter 2.15.0)
# Build order: 628
# Resource module for Lan Automation Port Channels
# Reads ../models/lan_automation_port_channels.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_port_channels_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags lan_automation_port_channels.

- name: "0628 lan_automation_port_channels"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_port_channels.yml
  tasks:
    - name: Run lan_automation_port_channels from its model
      cisco.catalystcenter.lan_automation_port_channels:
        catalystcenter_debug: "{{ lan_automation_port_channels.catalystcenter_debug if lan_automation_port_channels.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_port_channels.catalystcenter_host if lan_automation_port_channels.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_port_channels.catalystcenter_password if lan_automation_port_channels.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_port_channels.catalystcenter_port if lan_automation_port_channels.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_port_channels.catalystcenter_username if lan_automation_port_channels.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_port_channels.catalystcenter_verify if lan_automation_port_channels.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_port_channels.catalystcenter_version if lan_automation_port_channels.catalystcenter_version is not none else omit }}"
        device1ManagementIPAddress: "{{ lan_automation_port_channels.device1ManagementIPAddress if lan_automation_port_channels.device1ManagementIPAddress is not none else omit }}"
        device1Uuid: "{{ lan_automation_port_channels.device1Uuid if lan_automation_port_channels.device1Uuid is not none else omit }}"
        device2ManagementIPAddress: "{{ lan_automation_port_channels.device2ManagementIPAddress if lan_automation_port_channels.device2ManagementIPAddress is not none else omit }}"
        device2Uuid: "{{ lan_automation_port_channels.device2Uuid if lan_automation_port_channels.device2Uuid is not none else omit }}"
        id: "{{ lan_automation_port_channels.id if lan_automation_port_channels.id is not none else omit }}"
        portChannelMembers: "{{ (lan_automation_port_channels.portChannelMembers | cat_strip_nulls) if (lan_automation_port_channels.portChannelMembers | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ lan_automation_port_channels.validate_response_schema if lan_automation_port_channels.validate_response_schema is not none else omit }}"
      register: lan_automation_port_channels_result
      tags:
        - never
        - lan_automation_port_channels
