---
# Sample playbook for cisco.catalystcenter.configuration_template_version_create (cisco.catalystcenter 2.15.0)
# Build order: 599
# Resource module for Configuration Template Version Create
# Reads ../models/configuration_template_version_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_version_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_version_create.

- name: "0599 configuration_template_version_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_version_create.yml
  tasks:
    - name: Run configuration_template_version_create from its model
      cisco.catalystcenter.configuration_template_version_create:
        catalystcenter_debug: "{{ configuration_template_version_create.catalystcenter_debug if configuration_template_version_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_version_create.catalystcenter_host if configuration_template_version_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_version_create.catalystcenter_password if configuration_template_version_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_version_create.catalystcenter_port if configuration_template_version_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_version_create.catalystcenter_username if configuration_template_version_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_version_create.catalystcenter_verify if configuration_template_version_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_version_create.catalystcenter_version if configuration_template_version_create.catalystcenter_version is not none else omit }}"
        comments: "{{ configuration_template_version_create.comments if configuration_template_version_create.comments is not none else omit }}"
        templateId: "{{ configuration_template_version_create.templateId if configuration_template_version_create.templateId is not none else omit }}"
        validate_response_schema: "{{ configuration_template_version_create.validate_response_schema if configuration_template_version_create.validate_response_schema is not none else omit }}"
      register: configuration_template_version_create_result
      tags:
        - never
        - configuration_template_version_create
