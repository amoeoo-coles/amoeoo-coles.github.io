---
# Sample playbook for cisco.catalystcenter.pnp_device_import (cisco.catalystcenter 2.15.0)
# Build order: 480
# Resource module for Pnp Device Import
# Reads ../models/pnp_device_import.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_import_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_device_import.

- name: "0480 pnp_device_import"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_device_import.yml
  tasks:
    - name: Run pnp_device_import from its model
      cisco.catalystcenter.pnp_device_import:
        catalystcenter_debug: "{{ pnp_device_import.catalystcenter_debug if pnp_device_import.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_device_import.catalystcenter_host if pnp_device_import.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_device_import.catalystcenter_password if pnp_device_import.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_device_import.catalystcenter_port if pnp_device_import.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_device_import.catalystcenter_username if pnp_device_import.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_device_import.catalystcenter_verify if pnp_device_import.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_device_import.catalystcenter_version if pnp_device_import.catalystcenter_version is not none else omit }}"
        payload: "{{ (pnp_device_import.payload | cat_strip_nulls) if (pnp_device_import.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ pnp_device_import.validate_response_schema if pnp_device_import.validate_response_schema is not none else omit }}"
      register: pnp_device_import_result
      tags:
        - never
        - pnp_device_import
