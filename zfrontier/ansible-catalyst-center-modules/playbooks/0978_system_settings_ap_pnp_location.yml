---
# Sample playbook for cisco.catalystcenter.system_settings_ap_pnp_location (cisco.catalystcenter 2.15.0)
# Build order: 978
# Resource module for System Settings Ap Pnp Location
# Reads ../models/system_settings_ap_pnp_location.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/system_settings_ap_pnp_location_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags system_settings_ap_pnp_location.

- name: "0978 system_settings_ap_pnp_location"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/system_settings_ap_pnp_location.yml
  tasks:
    - name: Run system_settings_ap_pnp_location from its model
      cisco.catalystcenter.system_settings_ap_pnp_location:
        apPnPLocation: "{{ system_settings_ap_pnp_location.apPnPLocation if system_settings_ap_pnp_location.apPnPLocation is not none else omit }}"
        catalystcenter_debug: "{{ system_settings_ap_pnp_location.catalystcenter_debug if system_settings_ap_pnp_location.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ system_settings_ap_pnp_location.catalystcenter_host if system_settings_ap_pnp_location.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ system_settings_ap_pnp_location.catalystcenter_password if system_settings_ap_pnp_location.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ system_settings_ap_pnp_location.catalystcenter_port if system_settings_ap_pnp_location.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ system_settings_ap_pnp_location.catalystcenter_username if system_settings_ap_pnp_location.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ system_settings_ap_pnp_location.catalystcenter_verify if system_settings_ap_pnp_location.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ system_settings_ap_pnp_location.catalystcenter_version if system_settings_ap_pnp_location.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ system_settings_ap_pnp_location.validate_response_schema if system_settings_ap_pnp_location.validate_response_schema is not none else omit }}"
      register: system_settings_ap_pnp_location_result
      tags:
        - never
        - system_settings_ap_pnp_location
