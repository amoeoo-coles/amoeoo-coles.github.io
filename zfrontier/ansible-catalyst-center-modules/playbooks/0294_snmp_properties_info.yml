---
# Sample playbook for cisco.catalystcenter.snmp_properties_info (cisco.catalystcenter 2.15.0)
# Build order: 294
# Information module for Snmp Properties
# Reads ../models/snmp_properties_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/snmp_properties_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0294 snmp_properties_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/snmp_properties_info.yml
  tasks:
    - name: Run snmp_properties_info from its model
      cisco.catalystcenter.snmp_properties_info:
        catalystcenter_debug: "{{ snmp_properties_info.catalystcenter_debug if snmp_properties_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ snmp_properties_info.catalystcenter_host if snmp_properties_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ snmp_properties_info.catalystcenter_password if snmp_properties_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ snmp_properties_info.catalystcenter_port if snmp_properties_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ snmp_properties_info.catalystcenter_username if snmp_properties_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ snmp_properties_info.catalystcenter_verify if snmp_properties_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ snmp_properties_info.catalystcenter_version if snmp_properties_info.catalystcenter_version is not none else omit }}"
        headers: "{{ snmp_properties_info.headers if snmp_properties_info.headers is not none else omit }}"
        validate_response_schema: "{{ snmp_properties_info.validate_response_schema if snmp_properties_info.validate_response_schema is not none else omit }}"
      register: snmp_properties_info_result
