---
# Sample playbook for cisco.catalystcenter.endpoint_analytics_tasks_info (cisco.catalystcenter 2.15.0)
# Build order: 1374
# Information module for Endpoint Analytics Tasks
# Reads ../models/endpoint_analytics_tasks_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/endpoint_analytics_tasks_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1374 endpoint_analytics_tasks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/endpoint_analytics_tasks_info.yml
  tasks:
    - name: Run endpoint_analytics_tasks_info from its model
      cisco.catalystcenter.endpoint_analytics_tasks_info:
        catalystcenter_debug: "{{ endpoint_analytics_tasks_info.catalystcenter_debug if endpoint_analytics_tasks_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ endpoint_analytics_tasks_info.catalystcenter_host if endpoint_analytics_tasks_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ endpoint_analytics_tasks_info.catalystcenter_password if endpoint_analytics_tasks_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ endpoint_analytics_tasks_info.catalystcenter_port if endpoint_analytics_tasks_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ endpoint_analytics_tasks_info.catalystcenter_username if endpoint_analytics_tasks_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ endpoint_analytics_tasks_info.catalystcenter_verify if endpoint_analytics_tasks_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ endpoint_analytics_tasks_info.catalystcenter_version if endpoint_analytics_tasks_info.catalystcenter_version is not none else omit }}"
        headers: "{{ endpoint_analytics_tasks_info.headers if endpoint_analytics_tasks_info.headers is not none else omit }}"
        taskId: "{{ endpoint_analytics_tasks_info.taskId if endpoint_analytics_tasks_info.taskId is not none else omit }}"
        validate_response_schema: "{{ endpoint_analytics_tasks_info.validate_response_schema if endpoint_analytics_tasks_info.validate_response_schema is not none else omit }}"
      register: endpoint_analytics_tasks_info_result
