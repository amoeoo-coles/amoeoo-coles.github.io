---
# Sample playbook for cisco.catalystcenter.application_policy_application_set (cisco.catalystcenter 2.15.0)
# Build order: 1322
# Resource module for Application Policy Application Set
# Reads ../models/application_policy_application_set.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/application_policy_application_set_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags application_policy_application_set.

- name: "1322 application_policy_application_set"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/application_policy_application_set.yml
  tasks:
    - name: Run application_policy_application_set from its model
      cisco.catalystcenter.application_policy_application_set:
        catalystcenter_debug: "{{ application_policy_application_set.catalystcenter_debug if application_policy_application_set.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ application_policy_application_set.catalystcenter_host if application_policy_application_set.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ application_policy_application_set.catalystcenter_password if application_policy_application_set.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ application_policy_application_set.catalystcenter_port if application_policy_application_set.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ application_policy_application_set.catalystcenter_username if application_policy_application_set.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ application_policy_application_set.catalystcenter_verify if application_policy_application_set.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ application_policy_application_set.catalystcenter_version if application_policy_application_set.catalystcenter_version is not none else omit }}"
        id: "{{ application_policy_application_set.id if application_policy_application_set.id is not none else omit }}"
        payload: "{{ (application_policy_application_set.payload | cat_strip_nulls) if (application_policy_application_set.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ application_policy_application_set.validate_response_schema if application_policy_application_set.validate_response_schema is not none else omit }}"
      register: application_policy_application_set_result
      tags:
        - never
        - application_policy_application_set
