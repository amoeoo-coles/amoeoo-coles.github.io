---
# Sample playbook for cisco.catalystcenter.location_servers_spaces (cisco.catalystcenter 2.15.0)
# Build order: 5
# Resource module for Location Servers Spaces
# Reads ../models/location_servers_spaces.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/location_servers_spaces_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags location_servers_spaces.

- name: "0005 location_servers_spaces"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/location_servers_spaces.yml
  tasks:
    - name: Run location_servers_spaces from its model
      cisco.catalystcenter.location_servers_spaces:
        catalystcenter_debug: "{{ location_servers_spaces.catalystcenter_debug if location_servers_spaces.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ location_servers_spaces.catalystcenter_host if location_servers_spaces.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ location_servers_spaces.catalystcenter_password if location_servers_spaces.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ location_servers_spaces.catalystcenter_port if location_servers_spaces.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ location_servers_spaces.catalystcenter_username if location_servers_spaces.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ location_servers_spaces.catalystcenter_verify if location_servers_spaces.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ location_servers_spaces.catalystcenter_version if location_servers_spaces.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ location_servers_spaces.validate_response_schema if location_servers_spaces.validate_response_schema is not none else omit }}"
      register: location_servers_spaces_result
      tags:
        - never
        - location_servers_spaces
