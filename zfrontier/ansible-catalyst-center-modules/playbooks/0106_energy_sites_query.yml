---
# Sample playbook for cisco.catalystcenter.energy_sites_query (cisco.catalystcenter 2.15.0)
# Build order: 106
# Resource module for Energy Sites Query
# Reads ../models/energy_sites_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/energy_sites_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags energy_sites_query.

- name: "0106 energy_sites_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/energy_sites_query.yml
  tasks:
    - name: Run energy_sites_query from its model
      cisco.catalystcenter.energy_sites_query:
        aggregateAttributes: "{{ (energy_sites_query.aggregateAttributes | cat_strip_nulls) if (energy_sites_query.aggregateAttributes | cat_strip_nulls) is not none else omit }}"
        attributes: "{{ (energy_sites_query.attributes | cat_strip_nulls) if (energy_sites_query.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ energy_sites_query.catalystcenter_debug if energy_sites_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ energy_sites_query.catalystcenter_host if energy_sites_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ energy_sites_query.catalystcenter_password if energy_sites_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ energy_sites_query.catalystcenter_port if energy_sites_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ energy_sites_query.catalystcenter_username if energy_sites_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ energy_sites_query.catalystcenter_verify if energy_sites_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ energy_sites_query.catalystcenter_version if energy_sites_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ energy_sites_query.endTime if energy_sites_query.endTime is not none else omit }}"
        filters: "{{ (energy_sites_query.filters | cat_strip_nulls) if (energy_sites_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ energy_sites_query.headers if energy_sites_query.headers is not none else omit }}"
        page: "{{ (energy_sites_query.page | cat_strip_nulls) if (energy_sites_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ energy_sites_query.startTime if energy_sites_query.startTime is not none else omit }}"
        taskId: "{{ energy_sites_query.taskId if energy_sites_query.taskId is not none else omit }}"
        validate_response_schema: "{{ energy_sites_query.validate_response_schema if energy_sites_query.validate_response_schema is not none else omit }}"
        views: "{{ (energy_sites_query.views | cat_strip_nulls) if (energy_sites_query.views | cat_strip_nulls) is not none else omit }}"
      register: energy_sites_query_result
      tags:
        - never
        - energy_sites_query
