---
# Sample playbook for cisco.catalystcenter.backups_info (cisco.catalystcenter 2.15.0)
# Build order: 64
# Information module for Backups
# Reads ../models/backups_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/backups_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0064 backups_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backups_info.yml
  tasks:
    - name: Run backups_info from its model
      cisco.catalystcenter.backups_info:
        catalystcenter_debug: "{{ backups_info.catalystcenter_debug if backups_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ backups_info.catalystcenter_host if backups_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ backups_info.catalystcenter_password if backups_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ backups_info.catalystcenter_port if backups_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ backups_info.catalystcenter_username if backups_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ backups_info.catalystcenter_verify if backups_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ backups_info.catalystcenter_version if backups_info.catalystcenter_version is not none else omit }}"
        headers: "{{ backups_info.headers if backups_info.headers is not none else omit }}"
        id: "{{ backups_info.id if backups_info.id is not none else omit }}"
        limit: "{{ backups_info.limit if backups_info.limit is not none else omit }}"
        offset: "{{ backups_info.offset if backups_info.offset is not none else omit }}"
        order: "{{ backups_info.order if backups_info.order is not none else omit }}"
        query: "{{ backups_info.query if backups_info.query is not none else omit }}"
        sortBy: "{{ backups_info.sortBy if backups_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ backups_info.validate_response_schema if backups_info.validate_response_schema is not none else omit }}"
      register: backups_info_result
