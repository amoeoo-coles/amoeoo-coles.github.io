---
# Sample playbook for cisco.catalystcenter.network_devices_update (cisco.catalystcenter 2.15.0)
# Build order: 367
# Resource module for Network Devices Update
# Reads ../models/network_devices_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_update.

- name: "0367 network_devices_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_update.yml
  tasks:
    - name: Run network_devices_update from its model
      cisco.catalystcenter.network_devices_update:
        catalystcenter_debug: "{{ network_devices_update.catalystcenter_debug if network_devices_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_update.catalystcenter_host if network_devices_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_update.catalystcenter_password if network_devices_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_update.catalystcenter_port if network_devices_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_update.catalystcenter_username if network_devices_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_update.catalystcenter_verify if network_devices_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_update.catalystcenter_version if network_devices_update.catalystcenter_version is not none else omit }}"
        category: "{{ network_devices_update.category if network_devices_update.category is not none else omit }}"
        credentials: "{{ (network_devices_update.credentials | cat_strip_nulls) if (network_devices_update.credentials | cat_strip_nulls) is not none else omit }}"
        id: "{{ network_devices_update.id if network_devices_update.id is not none else omit }}"
        managementAddress: "{{ network_devices_update.managementAddress if network_devices_update.managementAddress is not none else omit }}"
        validate_response_schema: "{{ network_devices_update.validate_response_schema if network_devices_update.validate_response_schema is not none else omit }}"
      register: network_devices_update_result
      tags:
        - never
        - network_devices_update
