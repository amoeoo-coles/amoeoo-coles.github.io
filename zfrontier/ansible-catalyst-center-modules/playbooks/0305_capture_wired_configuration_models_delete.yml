---
# Sample playbook for cisco.catalystcenter.capture_wired_configuration_models_delete (cisco.catalystcenter 2.15.0)
# Build order: 305
# Resource module for Capture Wired Configuration Models Delete
# Reads ../models/capture_wired_configuration_models_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/capture_wired_configuration_models_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags capture_wired_configuration_models_delete.

- name: "0305 capture_wired_configuration_models_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/capture_wired_configuration_models_delete.yml
  tasks:
    - name: Run capture_wired_configuration_models_delete from its model
      cisco.catalystcenter.capture_wired_configuration_models_delete:
        catalystcenter_debug: "{{ capture_wired_configuration_models_delete.catalystcenter_debug if capture_wired_configuration_models_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ capture_wired_configuration_models_delete.catalystcenter_host if capture_wired_configuration_models_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ capture_wired_configuration_models_delete.catalystcenter_password if capture_wired_configuration_models_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ capture_wired_configuration_models_delete.catalystcenter_port if capture_wired_configuration_models_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ capture_wired_configuration_models_delete.catalystcenter_username if capture_wired_configuration_models_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ capture_wired_configuration_models_delete.catalystcenter_verify if capture_wired_configuration_models_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ capture_wired_configuration_models_delete.catalystcenter_version if capture_wired_configuration_models_delete.catalystcenter_version is not none else omit }}"
        previewActivityId: "{{ capture_wired_configuration_models_delete.previewActivityId if capture_wired_configuration_models_delete.previewActivityId is not none else omit }}"
        validate_response_schema: "{{ capture_wired_configuration_models_delete.validate_response_schema if capture_wired_configuration_models_delete.validate_response_schema is not none else omit }}"
      register: capture_wired_configuration_models_delete_result
      tags:
        - never
        - capture_wired_configuration_models_delete
