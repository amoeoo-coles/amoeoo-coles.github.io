---
# Sample playbook for cisco.catalystcenter.access_groups_count_info (cisco.catalystcenter 2.15.0)
# Build order: 46
# Information module for Access Groups Count
# Reads ../models/access_groups_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/access_groups_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0046 access_groups_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/access_groups_count_info.yml
  tasks:
    - name: Run access_groups_count_info from its model
      cisco.catalystcenter.access_groups_count_info:
        catalystcenter_debug: "{{ access_groups_count_info.catalystcenter_debug if access_groups_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ access_groups_count_info.catalystcenter_host if access_groups_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ access_groups_count_info.catalystcenter_password if access_groups_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ access_groups_count_info.catalystcenter_port if access_groups_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ access_groups_count_info.catalystcenter_username if access_groups_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ access_groups_count_info.catalystcenter_verify if access_groups_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ access_groups_count_info.catalystcenter_version if access_groups_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ access_groups_count_info.headers if access_groups_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ access_groups_count_info.validate_response_schema if access_groups_count_info.validate_response_schema is not none else omit }}"
      register: access_groups_count_info_result
