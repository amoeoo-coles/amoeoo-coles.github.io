---
# Sample playbook for cisco.catalystcenter.tag_count_info (cisco.catalystcenter 2.15.0)
# Build order: 256
# Information module for Tag Count
# Reads ../models/tag_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tag_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0256 tag_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tag_count_info.yml
  tasks:
    - name: Run tag_count_info from its model
      cisco.catalystcenter.tag_count_info:
        attributeName: "{{ tag_count_info.attributeName if tag_count_info.attributeName is not none else omit }}"
        catalystcenter_debug: "{{ tag_count_info.catalystcenter_debug if tag_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tag_count_info.catalystcenter_host if tag_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tag_count_info.catalystcenter_password if tag_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tag_count_info.catalystcenter_port if tag_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tag_count_info.catalystcenter_username if tag_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tag_count_info.catalystcenter_verify if tag_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tag_count_info.catalystcenter_version if tag_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ tag_count_info.headers if tag_count_info.headers is not none else omit }}"
        name: "{{ tag_count_info.name if tag_count_info.name is not none else omit }}"
        nameSpace: "{{ tag_count_info.nameSpace if tag_count_info.nameSpace is not none else omit }}"
        size: "{{ tag_count_info.size if tag_count_info.size is not none else omit }}"
        systemTag: "{{ tag_count_info.systemTag if tag_count_info.systemTag is not none else omit }}"
        validate_response_schema: "{{ tag_count_info.validate_response_schema if tag_count_info.validate_response_schema is not none else omit }}"
      register: tag_count_info_result
