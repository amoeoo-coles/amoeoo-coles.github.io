---
# Sample playbook for cisco.catalystcenter.network_devices_export_credentials_create (cisco.catalystcenter 2.15.0)
# Build order: 353
# Resource module for Network Devices Export Credentials Create
# Reads ../models/network_devices_export_credentials_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_export_credentials_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_export_credentials_create.

- name: "0353 network_devices_export_credentials_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_export_credentials_create.yml
  tasks:
    - name: Run network_devices_export_credentials_create from its model
      cisco.catalystcenter.network_devices_export_credentials_create:
        catalystcenter_debug: "{{ network_devices_export_credentials_create.catalystcenter_debug if network_devices_export_credentials_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_export_credentials_create.catalystcenter_host if network_devices_export_credentials_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_export_credentials_create.catalystcenter_password if network_devices_export_credentials_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_export_credentials_create.catalystcenter_port if network_devices_export_credentials_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_export_credentials_create.catalystcenter_username if network_devices_export_credentials_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_export_credentials_create.catalystcenter_verify if network_devices_export_credentials_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_export_credentials_create.catalystcenter_version if network_devices_export_credentials_create.catalystcenter_version is not none else omit }}"
        exportSshKey: "{{ network_devices_export_credentials_create.exportSshKey if network_devices_export_credentials_create.exportSshKey is not none else omit }}"
        networkDeviceIds: "{{ (network_devices_export_credentials_create.networkDeviceIds | cat_strip_nulls) if (network_devices_export_credentials_create.networkDeviceIds | cat_strip_nulls) is not none else omit }}"
        password: "{{ network_devices_export_credentials_create.password if network_devices_export_credentials_create.password is not none else omit }}"
        validate_response_schema: "{{ network_devices_export_credentials_create.validate_response_schema if network_devices_export_credentials_create.validate_response_schema is not none else omit }}"
      register: network_devices_export_credentials_create_result
      tags:
        - never
        - network_devices_export_credentials_create
