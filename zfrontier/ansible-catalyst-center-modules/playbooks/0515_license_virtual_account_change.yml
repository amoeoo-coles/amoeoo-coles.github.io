---
# Sample playbook for cisco.catalystcenter.license_virtual_account_change (cisco.catalystcenter 2.15.0)
# Build order: 515
# Resource module for License Virtual Account Change
# Reads ../models/license_virtual_account_change.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/license_virtual_account_change_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags license_virtual_account_change.

- name: "0515 license_virtual_account_change"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/license_virtual_account_change.yml
  tasks:
    - name: Run license_virtual_account_change from its model
      cisco.catalystcenter.license_virtual_account_change:
        catalystcenter_debug: "{{ license_virtual_account_change.catalystcenter_debug if license_virtual_account_change.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ license_virtual_account_change.catalystcenter_host if license_virtual_account_change.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ license_virtual_account_change.catalystcenter_password if license_virtual_account_change.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ license_virtual_account_change.catalystcenter_port if license_virtual_account_change.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ license_virtual_account_change.catalystcenter_username if license_virtual_account_change.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ license_virtual_account_change.catalystcenter_verify if license_virtual_account_change.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ license_virtual_account_change.catalystcenter_version if license_virtual_account_change.catalystcenter_version is not none else omit }}"
        device_uuids: "{{ (license_virtual_account_change.device_uuids | cat_strip_nulls) if (license_virtual_account_change.device_uuids | cat_strip_nulls) is not none else omit }}"
        smart_account_id: "{{ license_virtual_account_change.smart_account_id if license_virtual_account_change.smart_account_id is not none else omit }}"
        validate_response_schema: "{{ license_virtual_account_change.validate_response_schema if license_virtual_account_change.validate_response_schema is not none else omit }}"
        virtual_account_name: "{{ license_virtual_account_change.virtual_account_name if license_virtual_account_change.virtual_account_name is not none else omit }}"
      register: license_virtual_account_change_result
      tags:
        - never
        - license_virtual_account_change
