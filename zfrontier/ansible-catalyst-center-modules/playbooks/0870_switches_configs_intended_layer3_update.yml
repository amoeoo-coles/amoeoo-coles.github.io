---
# Sample playbook for cisco.catalystcenter.switches_configs_intended_layer3_update (cisco.catalystcenter 2.15.0)
# Build order: 870
# Resource module for Switches Configs Intended Layer3 Update
# Reads ../models/switches_configs_intended_layer3_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/switches_configs_intended_layer3_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags switches_configs_intended_layer3_update.

- name: "0870 switches_configs_intended_layer3_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/switches_configs_intended_layer3_update.yml
  tasks:
    - name: Run switches_configs_intended_layer3_update from its model
      cisco.catalystcenter.switches_configs_intended_layer3_update:
        bfdConfig: "{{ (switches_configs_intended_layer3_update.bfdConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.bfdConfig | cat_strip_nulls) is not none else omit }}"
        bfdTemplateSingleHopConfig: "{{ (switches_configs_intended_layer3_update.bfdTemplateSingleHopConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.bfdTemplateSingleHopConfig | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ switches_configs_intended_layer3_update.catalystcenter_debug if switches_configs_intended_layer3_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ switches_configs_intended_layer3_update.catalystcenter_host if switches_configs_intended_layer3_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ switches_configs_intended_layer3_update.catalystcenter_password if switches_configs_intended_layer3_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ switches_configs_intended_layer3_update.catalystcenter_port if switches_configs_intended_layer3_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ switches_configs_intended_layer3_update.catalystcenter_username if switches_configs_intended_layer3_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ switches_configs_intended_layer3_update.catalystcenter_verify if switches_configs_intended_layer3_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ switches_configs_intended_layer3_update.catalystcenter_version if switches_configs_intended_layer3_update.catalystcenter_version is not none else omit }}"
        dhcpRelayConfig: "{{ (switches_configs_intended_layer3_update.dhcpRelayConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.dhcpRelayConfig | cat_strip_nulls) is not none else omit }}"
        feature: "{{ switches_configs_intended_layer3_update.feature if switches_configs_intended_layer3_update.feature is not none else omit }}"
        id: "{{ switches_configs_intended_layer3_update.id if switches_configs_intended_layer3_update.id is not none else omit }}"
        ipv4RoutesConfig: "{{ (switches_configs_intended_layer3_update.ipv4RoutesConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv4RoutesConfig | cat_strip_nulls) is not none else omit }}"
        ipv4RoutingConfig: "{{ (switches_configs_intended_layer3_update.ipv4RoutingConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv4RoutingConfig | cat_strip_nulls) is not none else omit }}"
        ipv4VrfConfig: "{{ (switches_configs_intended_layer3_update.ipv4VrfConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv4VrfConfig | cat_strip_nulls) is not none else omit }}"
        ipv4VrfRoutesConfig: "{{ (switches_configs_intended_layer3_update.ipv4VrfRoutesConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv4VrfRoutesConfig | cat_strip_nulls) is not none else omit }}"
        ipv6RoutesConfig: "{{ (switches_configs_intended_layer3_update.ipv6RoutesConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv6RoutesConfig | cat_strip_nulls) is not none else omit }}"
        ipv6RoutingConfig: "{{ (switches_configs_intended_layer3_update.ipv6RoutingConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv6RoutingConfig | cat_strip_nulls) is not none else omit }}"
        ipv6VrfRoutesConfig: "{{ (switches_configs_intended_layer3_update.ipv6VrfRoutesConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.ipv6VrfRoutesConfig | cat_strip_nulls) is not none else omit }}"
        loopbackConfig: "{{ (switches_configs_intended_layer3_update.loopbackConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.loopbackConfig | cat_strip_nulls) is not none else omit }}"
        sviConfig: "{{ (switches_configs_intended_layer3_update.sviConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.sviConfig | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ switches_configs_intended_layer3_update.validate_response_schema if switches_configs_intended_layer3_update.validate_response_schema is not none else omit }}"
        vrfConfig: "{{ (switches_configs_intended_layer3_update.vrfConfig | cat_strip_nulls) if (switches_configs_intended_layer3_update.vrfConfig | cat_strip_nulls) is not none else omit }}"
      register: switches_configs_intended_layer3_update_result
      tags:
        - never
        - switches_configs_intended_layer3_update
