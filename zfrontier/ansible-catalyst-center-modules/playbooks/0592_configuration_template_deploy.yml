---
# Sample playbook for cisco.catalystcenter.configuration_template_deploy (cisco.catalystcenter 2.15.0)
# Build order: 592
# Resource module for Configuration Template Deploy
# Reads ../models/configuration_template_deploy.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_deploy_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_deploy.

- name: "0592 configuration_template_deploy"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_deploy.yml
  tasks:
    - name: Run configuration_template_deploy from its model
      cisco.catalystcenter.configuration_template_deploy:
        catalystcenter_debug: "{{ configuration_template_deploy.catalystcenter_debug if configuration_template_deploy.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_deploy.catalystcenter_host if configuration_template_deploy.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_deploy.catalystcenter_password if configuration_template_deploy.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_deploy.catalystcenter_port if configuration_template_deploy.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_deploy.catalystcenter_username if configuration_template_deploy.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_deploy.catalystcenter_verify if configuration_template_deploy.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_deploy.catalystcenter_version if configuration_template_deploy.catalystcenter_version is not none else omit }}"
        forcePushTemplate: "{{ configuration_template_deploy.forcePushTemplate if configuration_template_deploy.forcePushTemplate is not none else omit }}"
        isComposite: "{{ configuration_template_deploy.isComposite if configuration_template_deploy.isComposite is not none else omit }}"
        mainTemplateId: "{{ configuration_template_deploy.mainTemplateId if configuration_template_deploy.mainTemplateId is not none else omit }}"
        memberTemplateDeploymentInfo: "{{ (configuration_template_deploy.memberTemplateDeploymentInfo | cat_strip_nulls) if (configuration_template_deploy.memberTemplateDeploymentInfo | cat_strip_nulls) is not none else omit }}"
        targetInfo: "{{ (configuration_template_deploy.targetInfo | cat_strip_nulls) if (configuration_template_deploy.targetInfo | cat_strip_nulls) is not none else omit }}"
        templateId: "{{ configuration_template_deploy.templateId if configuration_template_deploy.templateId is not none else omit }}"
        validate_response_schema: "{{ configuration_template_deploy.validate_response_schema if configuration_template_deploy.validate_response_schema is not none else omit }}"
      register: configuration_template_deploy_result
      tags:
        - never
        - configuration_template_deploy
