---
# Sample playbook for cisco.catalystcenter.icap_radios_id_stats (cisco.catalystcenter 2.15.0)
# Build order: 1437
# Resource module for Icap Radios Id Stats
# Reads ../models/icap_radios_id_stats.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/icap_radios_id_stats_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags icap_radios_id_stats.

- name: "1437 icap_radios_id_stats"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/icap_radios_id_stats.yml
  tasks:
    - name: Run icap_radios_id_stats from its model
      cisco.catalystcenter.icap_radios_id_stats:
        catalystcenter_debug: "{{ icap_radios_id_stats.catalystcenter_debug if icap_radios_id_stats.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ icap_radios_id_stats.catalystcenter_host if icap_radios_id_stats.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ icap_radios_id_stats.catalystcenter_password if icap_radios_id_stats.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ icap_radios_id_stats.catalystcenter_port if icap_radios_id_stats.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ icap_radios_id_stats.catalystcenter_username if icap_radios_id_stats.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ icap_radios_id_stats.catalystcenter_verify if icap_radios_id_stats.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ icap_radios_id_stats.catalystcenter_version if icap_radios_id_stats.catalystcenter_version is not none else omit }}"
        endTime: "{{ icap_radios_id_stats.endTime if icap_radios_id_stats.endTime is not none else omit }}"
        filters: "{{ (icap_radios_id_stats.filters | cat_strip_nulls) if (icap_radios_id_stats.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ icap_radios_id_stats.headers if icap_radios_id_stats.headers is not none else omit }}"
        id: "{{ icap_radios_id_stats.id if icap_radios_id_stats.id is not none else omit }}"
        page: "{{ (icap_radios_id_stats.page | cat_strip_nulls) if (icap_radios_id_stats.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ icap_radios_id_stats.startTime if icap_radios_id_stats.startTime is not none else omit }}"
        validate_response_schema: "{{ icap_radios_id_stats.validate_response_schema if icap_radios_id_stats.validate_response_schema is not none else omit }}"
      register: icap_radios_id_stats_result
      tags:
        - never
        - icap_radios_id_stats
