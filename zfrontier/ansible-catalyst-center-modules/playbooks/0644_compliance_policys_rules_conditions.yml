---
# Sample playbook for cisco.catalystcenter.compliance_policys_rules_conditions (cisco.catalystcenter 2.15.0)
# Build order: 644
# Resource module for Compliance Policys Rules Conditions
# Reads ../models/compliance_policys_rules_conditions.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_policys_rules_conditions_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_policys_rules_conditions.

- name: "0644 compliance_policys_rules_conditions"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_policys_rules_conditions.yml
  tasks:
    - name: Run compliance_policys_rules_conditions from its model
      cisco.catalystcenter.compliance_policys_rules_conditions:
        action: "{{ (compliance_policys_rules_conditions.action | cat_strip_nulls) if (compliance_policys_rules_conditions.action | cat_strip_nulls) is not none else omit }}"
        blockEndExpression: "{{ compliance_policys_rules_conditions.blockEndExpression if compliance_policys_rules_conditions.blockEndExpression is not none else omit }}"
        blockStartExpression: "{{ compliance_policys_rules_conditions.blockStartExpression if compliance_policys_rules_conditions.blockStartExpression is not none else omit }}"
        blockViolationCriteria: "{{ compliance_policys_rules_conditions.blockViolationCriteria if compliance_policys_rules_conditions.blockViolationCriteria is not none else omit }}"
        catalystcenter_debug: "{{ compliance_policys_rules_conditions.catalystcenter_debug if compliance_policys_rules_conditions.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_policys_rules_conditions.catalystcenter_host if compliance_policys_rules_conditions.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_policys_rules_conditions.catalystcenter_password if compliance_policys_rules_conditions.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_policys_rules_conditions.catalystcenter_port if compliance_policys_rules_conditions.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_policys_rules_conditions.catalystcenter_username if compliance_policys_rules_conditions.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_policys_rules_conditions.catalystcenter_verify if compliance_policys_rules_conditions.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_policys_rules_conditions.catalystcenter_version if compliance_policys_rules_conditions.catalystcenter_version is not none else omit }}"
        deviceProperty: "{{ compliance_policys_rules_conditions.deviceProperty if compliance_policys_rules_conditions.deviceProperty is not none else omit }}"
        id: "{{ compliance_policys_rules_conditions.id if compliance_policys_rules_conditions.id is not none else omit }}"
        name: "{{ compliance_policys_rules_conditions.name if compliance_policys_rules_conditions.name is not none else omit }}"
        operator: "{{ compliance_policys_rules_conditions.operator if compliance_policys_rules_conditions.operator is not none else omit }}"
        parseAsBlocks: "{{ compliance_policys_rules_conditions.parseAsBlocks if compliance_policys_rules_conditions.parseAsBlocks is not none else omit }}"
        policyId: "{{ compliance_policys_rules_conditions.policyId if compliance_policys_rules_conditions.policyId is not none else omit }}"
        regexViolationCriteria: "{{ compliance_policys_rules_conditions.regexViolationCriteria if compliance_policys_rules_conditions.regexViolationCriteria is not none else omit }}"
        ruleId: "{{ compliance_policys_rules_conditions.ruleId if compliance_policys_rules_conditions.ruleId is not none else omit }}"
        scope: "{{ compliance_policys_rules_conditions.scope if compliance_policys_rules_conditions.scope is not none else omit }}"
        sequenceNumber: "{{ compliance_policys_rules_conditions.sequenceNumber if compliance_policys_rules_conditions.sequenceNumber is not none else omit }}"
        showCommand: "{{ compliance_policys_rules_conditions.showCommand if compliance_policys_rules_conditions.showCommand is not none else omit }}"
        validate_response_schema: "{{ compliance_policys_rules_conditions.validate_response_schema if compliance_policys_rules_conditions.validate_response_schema is not none else omit }}"
        value: "{{ compliance_policys_rules_conditions.value if compliance_policys_rules_conditions.value is not none else omit }}"
      register: compliance_policys_rules_conditions_result
      tags:
        - never
        - compliance_policys_rules_conditions
