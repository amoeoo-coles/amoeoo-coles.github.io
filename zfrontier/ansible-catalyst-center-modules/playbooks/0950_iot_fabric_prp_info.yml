---
# Sample playbook for cisco.catalystcenter.iot_fabric_prp_info (cisco.catalystcenter 2.15.0)
# Build order: 950
# Information module for Iot Fabric Prp
# Reads ../models/iot_fabric_prp_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_fabric_prp_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0950 iot_fabric_prp_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_fabric_prp_info.yml
  tasks:
    - name: Run iot_fabric_prp_info from its model
      cisco.catalystcenter.iot_fabric_prp_info:
        catalystcenter_debug: "{{ iot_fabric_prp_info.catalystcenter_debug if iot_fabric_prp_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_fabric_prp_info.catalystcenter_host if iot_fabric_prp_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_fabric_prp_info.catalystcenter_password if iot_fabric_prp_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_fabric_prp_info.catalystcenter_port if iot_fabric_prp_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_fabric_prp_info.catalystcenter_username if iot_fabric_prp_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_fabric_prp_info.catalystcenter_verify if iot_fabric_prp_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_fabric_prp_info.catalystcenter_version if iot_fabric_prp_info.catalystcenter_version is not none else omit }}"
        headers: "{{ iot_fabric_prp_info.headers if iot_fabric_prp_info.headers is not none else omit }}"
        limit: "{{ iot_fabric_prp_info.limit if iot_fabric_prp_info.limit is not none else omit }}"
        networkDeviceId: "{{ iot_fabric_prp_info.networkDeviceId if iot_fabric_prp_info.networkDeviceId is not none else omit }}"
        offset: "{{ iot_fabric_prp_info.offset if iot_fabric_prp_info.offset is not none else omit }}"
        validate_response_schema: "{{ iot_fabric_prp_info.validate_response_schema if iot_fabric_prp_info.validate_response_schema is not none else omit }}"
      register: iot_fabric_prp_info_result
