---
# Sample playbook for cisco.catalystcenter.compliance_policys_rules_variables (cisco.catalystcenter 2.15.0)
# Build order: 645
# Resource module for Compliance Policys Rules Variables
# Reads ../models/compliance_policys_rules_variables.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_policys_rules_variables_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_policys_rules_variables.

- name: "0645 compliance_policys_rules_variables"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_policys_rules_variables.yml
  tasks:
    - name: Run compliance_policys_rules_variables from its model
      cisco.catalystcenter.compliance_policys_rules_variables:
        catalystcenter_debug: "{{ compliance_policys_rules_variables.catalystcenter_debug if compliance_policys_rules_variables.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_policys_rules_variables.catalystcenter_host if compliance_policys_rules_variables.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_policys_rules_variables.catalystcenter_password if compliance_policys_rules_variables.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_policys_rules_variables.catalystcenter_port if compliance_policys_rules_variables.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_policys_rules_variables.catalystcenter_username if compliance_policys_rules_variables.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_policys_rules_variables.catalystcenter_verify if compliance_policys_rules_variables.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_policys_rules_variables.catalystcenter_version if compliance_policys_rules_variables.catalystcenter_version is not none else omit }}"
        dataType: "{{ compliance_policys_rules_variables.dataType if compliance_policys_rules_variables.dataType is not none else omit }}"
        defaultValue: "{{ compliance_policys_rules_variables.defaultValue if compliance_policys_rules_variables.defaultValue is not none else omit }}"
        description: "{{ compliance_policys_rules_variables.description if compliance_policys_rules_variables.description is not none else omit }}"
        id: "{{ compliance_policys_rules_variables.id if compliance_policys_rules_variables.id is not none else omit }}"
        identifier: "{{ compliance_policys_rules_variables.identifier if compliance_policys_rules_variables.identifier is not none else omit }}"
        inputType: "{{ compliance_policys_rules_variables.inputType if compliance_policys_rules_variables.inputType is not none else omit }}"
        mandatory: "{{ compliance_policys_rules_variables.mandatory if compliance_policys_rules_variables.mandatory is not none else omit }}"
        maxLength: "{{ compliance_policys_rules_variables.maxLength if compliance_policys_rules_variables.maxLength is not none else omit }}"
        maxValue: "{{ compliance_policys_rules_variables.maxValue if compliance_policys_rules_variables.maxValue is not none else omit }}"
        minValue: "{{ compliance_policys_rules_variables.minValue if compliance_policys_rules_variables.minValue is not none else omit }}"
        name: "{{ compliance_policys_rules_variables.name if compliance_policys_rules_variables.name is not none else omit }}"
        policyId: "{{ compliance_policys_rules_variables.policyId if compliance_policys_rules_variables.policyId is not none else omit }}"
        ruleId: "{{ compliance_policys_rules_variables.ruleId if compliance_policys_rules_variables.ruleId is not none else omit }}"
        selectionList: "{{ (compliance_policys_rules_variables.selectionList | cat_strip_nulls) if (compliance_policys_rules_variables.selectionList | cat_strip_nulls) is not none else omit }}"
        sequenceNumber: "{{ compliance_policys_rules_variables.sequenceNumber if compliance_policys_rules_variables.sequenceNumber is not none else omit }}"
        usedByConditions: "{{ (compliance_policys_rules_variables.usedByConditions | cat_strip_nulls) if (compliance_policys_rules_variables.usedByConditions | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ compliance_policys_rules_variables.validate_response_schema if compliance_policys_rules_variables.validate_response_schema is not none else omit }}"
        validationRegex: "{{ compliance_policys_rules_variables.validationRegex if compliance_policys_rules_variables.validationRegex is not none else omit }}"
      register: compliance_policys_rules_variables_result
      tags:
        - never
        - compliance_policys_rules_variables
