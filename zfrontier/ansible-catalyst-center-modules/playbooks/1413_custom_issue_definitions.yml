---
# Sample playbook for cisco.catalystcenter.custom_issue_definitions (cisco.catalystcenter 2.15.0)
# Build order: 1413
# Resource module for Custom Issue Definitions
# Reads ../models/custom_issue_definitions.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/custom_issue_definitions_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags custom_issue_definitions.

- name: "1413 custom_issue_definitions"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/custom_issue_definitions.yml
  tasks:
    - name: Run custom_issue_definitions from its model
      cisco.catalystcenter.custom_issue_definitions:
        catalystcenter_debug: "{{ custom_issue_definitions.catalystcenter_debug if custom_issue_definitions.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ custom_issue_definitions.catalystcenter_host if custom_issue_definitions.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ custom_issue_definitions.catalystcenter_password if custom_issue_definitions.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ custom_issue_definitions.catalystcenter_port if custom_issue_definitions.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ custom_issue_definitions.catalystcenter_username if custom_issue_definitions.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ custom_issue_definitions.catalystcenter_verify if custom_issue_definitions.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ custom_issue_definitions.catalystcenter_version if custom_issue_definitions.catalystcenter_version is not none else omit }}"
        description: "{{ custom_issue_definitions.description if custom_issue_definitions.description is not none else omit }}"
        headers: "{{ custom_issue_definitions.headers if custom_issue_definitions.headers is not none else omit }}"
        id: "{{ custom_issue_definitions.id if custom_issue_definitions.id is not none else omit }}"
        isEnabled: "{{ custom_issue_definitions.isEnabled if custom_issue_definitions.isEnabled is not none else omit }}"
        isNotificationEnabled: "{{ custom_issue_definitions.isNotificationEnabled if custom_issue_definitions.isNotificationEnabled is not none else omit }}"
        name: "{{ custom_issue_definitions.name if custom_issue_definitions.name is not none else omit }}"
        priority: "{{ custom_issue_definitions.priority if custom_issue_definitions.priority is not none else omit }}"
        rules: "{{ (custom_issue_definitions.rules | cat_strip_nulls) if (custom_issue_definitions.rules | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ custom_issue_definitions.validate_response_schema if custom_issue_definitions.validate_response_schema is not none else omit }}"
      register: custom_issue_definitions_result
      tags:
        - never
        - custom_issue_definitions
