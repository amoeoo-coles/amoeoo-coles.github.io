---
# Sample playbook for cisco.catalystcenter.product_series_info (cisco.catalystcenter 2.15.0)
# Build order: 583
# Information module for Product Series
# Reads ../models/product_series_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/product_series_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0583 product_series_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/product_series_info.yml
  tasks:
    - name: Run product_series_info from its model
      cisco.catalystcenter.product_series_info:
        catalystcenter_debug: "{{ product_series_info.catalystcenter_debug if product_series_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ product_series_info.catalystcenter_host if product_series_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ product_series_info.catalystcenter_password if product_series_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ product_series_info.catalystcenter_port if product_series_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ product_series_info.catalystcenter_username if product_series_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ product_series_info.catalystcenter_verify if product_series_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ product_series_info.catalystcenter_version if product_series_info.catalystcenter_version is not none else omit }}"
        headers: "{{ product_series_info.headers if product_series_info.headers is not none else omit }}"
        limit: "{{ product_series_info.limit if product_series_info.limit is not none else omit }}"
        name: "{{ product_series_info.name if product_series_info.name is not none else omit }}"
        offset: "{{ product_series_info.offset if product_series_info.offset is not none else omit }}"
        productSeriesOrdinal: "{{ product_series_info.productSeriesOrdinal if product_series_info.productSeriesOrdinal is not none else omit }}"
        validate_response_schema: "{{ product_series_info.validate_response_schema if product_series_info.validate_response_schema is not none else omit }}"
      register: product_series_info_result
