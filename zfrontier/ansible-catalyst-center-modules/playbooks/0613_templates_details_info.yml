---
# Sample playbook for cisco.catalystcenter.templates_details_info (cisco.catalystcenter 2.15.0)
# Build order: 613
# Information module for Templates Details
# Reads ../models/templates_details_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/templates_details_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0613 templates_details_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/templates_details_info.yml
  tasks:
    - name: Run templates_details_info from its model
      cisco.catalystcenter.templates_details_info:
        allTemplateAttributes: "{{ templates_details_info.allTemplateAttributes if templates_details_info.allTemplateAttributes is not none else omit }}"
        catalystcenter_debug: "{{ templates_details_info.catalystcenter_debug if templates_details_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ templates_details_info.catalystcenter_host if templates_details_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ templates_details_info.catalystcenter_password if templates_details_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ templates_details_info.catalystcenter_port if templates_details_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ templates_details_info.catalystcenter_username if templates_details_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ templates_details_info.catalystcenter_verify if templates_details_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ templates_details_info.catalystcenter_version if templates_details_info.catalystcenter_version is not none else omit }}"
        filterConflictingTemplates: "{{ templates_details_info.filterConflictingTemplates if templates_details_info.filterConflictingTemplates is not none else omit }}"
        headers: "{{ templates_details_info.headers if templates_details_info.headers is not none else omit }}"
        id: "{{ templates_details_info.id if templates_details_info.id is not none else omit }}"
        includeVersionDetails: "{{ templates_details_info.includeVersionDetails if templates_details_info.includeVersionDetails is not none else omit }}"
        limit: "{{ templates_details_info.limit if templates_details_info.limit is not none else omit }}"
        name: "{{ templates_details_info.name if templates_details_info.name is not none else omit }}"
        offset: "{{ templates_details_info.offset if templates_details_info.offset is not none else omit }}"
        productFamily: "{{ templates_details_info.productFamily if templates_details_info.productFamily is not none else omit }}"
        productSeries: "{{ templates_details_info.productSeries if templates_details_info.productSeries is not none else omit }}"
        productType: "{{ templates_details_info.productType if templates_details_info.productType is not none else omit }}"
        projectId: "{{ templates_details_info.projectId if templates_details_info.projectId is not none else omit }}"
        projectName: "{{ templates_details_info.projectName if templates_details_info.projectName is not none else omit }}"
        softwareType: "{{ templates_details_info.softwareType if templates_details_info.softwareType is not none else omit }}"
        softwareVersion: "{{ templates_details_info.softwareVersion if templates_details_info.softwareVersion is not none else omit }}"
        sortOrder: "{{ templates_details_info.sortOrder if templates_details_info.sortOrder is not none else omit }}"
        tags: "{{ (templates_details_info.tags | cat_strip_nulls) if (templates_details_info.tags | cat_strip_nulls) is not none else omit }}"
        unCommitted: "{{ templates_details_info.unCommitted if templates_details_info.unCommitted is not none else omit }}"
        validate_response_schema: "{{ templates_details_info.validate_response_schema if templates_details_info.validate_response_schema is not none else omit }}"
      register: templates_details_info_result
