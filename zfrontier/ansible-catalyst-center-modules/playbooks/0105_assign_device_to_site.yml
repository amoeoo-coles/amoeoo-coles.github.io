---
# Sample playbook for cisco.catalystcenter.assign_device_to_site (cisco.catalystcenter 2.15.0)
# Build order: 105
# Resource module for Assign Device To Site
# Reads ../models/assign_device_to_site.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assign_device_to_site_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assign_device_to_site.

- name: "0105 assign_device_to_site"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assign_device_to_site.yml
  tasks:
    - name: Run assign_device_to_site from its model
      cisco.catalystcenter.assign_device_to_site:
        catalystcenter_debug: "{{ assign_device_to_site.catalystcenter_debug if assign_device_to_site.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assign_device_to_site.catalystcenter_host if assign_device_to_site.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assign_device_to_site.catalystcenter_password if assign_device_to_site.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assign_device_to_site.catalystcenter_port if assign_device_to_site.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assign_device_to_site.catalystcenter_username if assign_device_to_site.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assign_device_to_site.catalystcenter_verify if assign_device_to_site.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assign_device_to_site.catalystcenter_version if assign_device_to_site.catalystcenter_version is not none else omit }}"
        device: "{{ (assign_device_to_site.device | cat_strip_nulls) if (assign_device_to_site.device | cat_strip_nulls) is not none else omit }}"
        headers: "{{ assign_device_to_site.headers if assign_device_to_site.headers is not none else omit }}"
        siteId: "{{ assign_device_to_site.siteId if assign_device_to_site.siteId is not none else omit }}"
        validate_response_schema: "{{ assign_device_to_site.validate_response_schema if assign_device_to_site.validate_response_schema is not none else omit }}"
      register: assign_device_to_site_result
      tags:
        - never
        - assign_device_to_site
