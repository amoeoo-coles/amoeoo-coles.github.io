---
# Sample playbook for cisco.catalystcenter.interfaces_info (cisco.catalystcenter 2.15.0)
# Build order: 425
# Information module for Interfaces
# Reads ../models/interfaces_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/interfaces_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0425 interfaces_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/interfaces_info.yml
  tasks:
    - name: Run interfaces_info from its model
      cisco.catalystcenter.interfaces_info:
        attribute: "{{ interfaces_info.attribute if interfaces_info.attribute is not none else omit }}"
        catalystcenter_debug: "{{ interfaces_info.catalystcenter_debug if interfaces_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ interfaces_info.catalystcenter_host if interfaces_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ interfaces_info.catalystcenter_password if interfaces_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ interfaces_info.catalystcenter_port if interfaces_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ interfaces_info.catalystcenter_username if interfaces_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ interfaces_info.catalystcenter_verify if interfaces_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ interfaces_info.catalystcenter_version if interfaces_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ interfaces_info.endTime if interfaces_info.endTime is not none else omit }}"
        headers: "{{ interfaces_info.headers if interfaces_info.headers is not none else omit }}"
        id: "{{ interfaces_info.id if interfaces_info.id is not none else omit }}"
        interfaceId: "{{ interfaces_info.interfaceId if interfaces_info.interfaceId is not none else omit }}"
        interfaceName: "{{ interfaces_info.interfaceName if interfaces_info.interfaceName is not none else omit }}"
        limit: "{{ interfaces_info.limit if interfaces_info.limit is not none else omit }}"
        networkDeviceId: "{{ interfaces_info.networkDeviceId if interfaces_info.networkDeviceId is not none else omit }}"
        networkDeviceIpAddress: "{{ interfaces_info.networkDeviceIpAddress if interfaces_info.networkDeviceIpAddress is not none else omit }}"
        networkDeviceMacAddress: "{{ interfaces_info.networkDeviceMacAddress if interfaces_info.networkDeviceMacAddress is not none else omit }}"
        offset: "{{ interfaces_info.offset if interfaces_info.offset is not none else omit }}"
        order: "{{ interfaces_info.order if interfaces_info.order is not none else omit }}"
        siteHierarchy: "{{ interfaces_info.siteHierarchy if interfaces_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ interfaces_info.siteHierarchyId if interfaces_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ interfaces_info.siteId if interfaces_info.siteId is not none else omit }}"
        sortBy: "{{ interfaces_info.sortBy if interfaces_info.sortBy is not none else omit }}"
        startTime: "{{ interfaces_info.startTime if interfaces_info.startTime is not none else omit }}"
        validate_response_schema: "{{ interfaces_info.validate_response_schema if interfaces_info.validate_response_schema is not none else omit }}"
        view: "{{ interfaces_info.view if interfaces_info.view is not none else omit }}"
      register: interfaces_info_result
