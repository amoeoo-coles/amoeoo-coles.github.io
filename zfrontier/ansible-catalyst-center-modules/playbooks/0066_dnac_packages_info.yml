---
# Sample playbook for cisco.catalystcenter.dnac_packages_info (cisco.catalystcenter 2.15.0)
# Build order: 66
# Information module for Dnac Packages
# Reads ../models/dnac_packages_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/dnac_packages_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0066 dnac_packages_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/dnac_packages_info.yml
  tasks:
    - name: Run dnac_packages_info from its model
      cisco.catalystcenter.dnac_packages_info:
        catalystcenter_debug: "{{ dnac_packages_info.catalystcenter_debug if dnac_packages_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ dnac_packages_info.catalystcenter_host if dnac_packages_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ dnac_packages_info.catalystcenter_password if dnac_packages_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ dnac_packages_info.catalystcenter_port if dnac_packages_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ dnac_packages_info.catalystcenter_username if dnac_packages_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ dnac_packages_info.catalystcenter_verify if dnac_packages_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ dnac_packages_info.catalystcenter_version if dnac_packages_info.catalystcenter_version is not none else omit }}"
        headers: "{{ dnac_packages_info.headers if dnac_packages_info.headers is not none else omit }}"
        validate_response_schema: "{{ dnac_packages_info.validate_response_schema if dnac_packages_info.validate_response_schema is not none else omit }}"
      register: dnac_packages_info_result
