---
# Sample playbook for cisco.catalystcenter.pnp_virtual_account_devices_sync (cisco.catalystcenter 2.15.0)
# Build order: 489
# Resource module for Pnp Virtual Account Devices Sync
# Reads ../models/pnp_virtual_account_devices_sync.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_virtual_account_devices_sync_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_virtual_account_devices_sync.

- name: "0489 pnp_virtual_account_devices_sync"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_virtual_account_devices_sync.yml
  tasks:
    - name: Run pnp_virtual_account_devices_sync from its model
      cisco.catalystcenter.pnp_virtual_account_devices_sync:
        autoSyncPeriod: "{{ pnp_virtual_account_devices_sync.autoSyncPeriod if pnp_virtual_account_devices_sync.autoSyncPeriod is not none else omit }}"
        catalystcenter_debug: "{{ pnp_virtual_account_devices_sync.catalystcenter_debug if pnp_virtual_account_devices_sync.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_virtual_account_devices_sync.catalystcenter_host if pnp_virtual_account_devices_sync.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_virtual_account_devices_sync.catalystcenter_password if pnp_virtual_account_devices_sync.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_virtual_account_devices_sync.catalystcenter_port if pnp_virtual_account_devices_sync.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_virtual_account_devices_sync.catalystcenter_username if pnp_virtual_account_devices_sync.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_virtual_account_devices_sync.catalystcenter_verify if pnp_virtual_account_devices_sync.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_virtual_account_devices_sync.catalystcenter_version if pnp_virtual_account_devices_sync.catalystcenter_version is not none else omit }}"
        ccoUser: "{{ pnp_virtual_account_devices_sync.ccoUser if pnp_virtual_account_devices_sync.ccoUser is not none else omit }}"
        expiry: "{{ pnp_virtual_account_devices_sync.expiry if pnp_virtual_account_devices_sync.expiry is not none else omit }}"
        lastSync: "{{ pnp_virtual_account_devices_sync.lastSync if pnp_virtual_account_devices_sync.lastSync is not none else omit }}"
        profile: "{{ (pnp_virtual_account_devices_sync.profile | cat_strip_nulls) if (pnp_virtual_account_devices_sync.profile | cat_strip_nulls) is not none else omit }}"
        smartAccountId: "{{ pnp_virtual_account_devices_sync.smartAccountId if pnp_virtual_account_devices_sync.smartAccountId is not none else omit }}"
        syncResult: "{{ (pnp_virtual_account_devices_sync.syncResult | cat_strip_nulls) if (pnp_virtual_account_devices_sync.syncResult | cat_strip_nulls) is not none else omit }}"
        syncResultStr: "{{ pnp_virtual_account_devices_sync.syncResultStr if pnp_virtual_account_devices_sync.syncResultStr is not none else omit }}"
        syncStartTime: "{{ pnp_virtual_account_devices_sync.syncStartTime if pnp_virtual_account_devices_sync.syncStartTime is not none else omit }}"
        syncStatus: "{{ pnp_virtual_account_devices_sync.syncStatus if pnp_virtual_account_devices_sync.syncStatus is not none else omit }}"
        tenantId: "{{ pnp_virtual_account_devices_sync.tenantId if pnp_virtual_account_devices_sync.tenantId is not none else omit }}"
        token: "{{ pnp_virtual_account_devices_sync.token if pnp_virtual_account_devices_sync.token is not none else omit }}"
        validate_response_schema: "{{ pnp_virtual_account_devices_sync.validate_response_schema if pnp_virtual_account_devices_sync.validate_response_schema is not none else omit }}"
        virtualAccountId: "{{ pnp_virtual_account_devices_sync.virtualAccountId if pnp_virtual_account_devices_sync.virtualAccountId is not none else omit }}"
      register: pnp_virtual_account_devices_sync_result
      tags:
        - never
        - pnp_virtual_account_devices_sync
