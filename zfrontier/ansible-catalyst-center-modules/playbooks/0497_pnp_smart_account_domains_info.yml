---
# Sample playbook for cisco.catalystcenter.pnp_smart_account_domains_info (cisco.catalystcenter 2.15.0)
# Build order: 497
# Information module for Pnp Smart Account Domains
# Reads ../models/pnp_smart_account_domains_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_smart_account_domains_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0497 pnp_smart_account_domains_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_smart_account_domains_info.yml
  tasks:
    - name: Run pnp_smart_account_domains_info from its model
      cisco.catalystcenter.pnp_smart_account_domains_info:
        catalystcenter_debug: "{{ pnp_smart_account_domains_info.catalystcenter_debug if pnp_smart_account_domains_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_smart_account_domains_info.catalystcenter_host if pnp_smart_account_domains_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_smart_account_domains_info.catalystcenter_password if pnp_smart_account_domains_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_smart_account_domains_info.catalystcenter_port if pnp_smart_account_domains_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_smart_account_domains_info.catalystcenter_username if pnp_smart_account_domains_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_smart_account_domains_info.catalystcenter_verify if pnp_smart_account_domains_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_smart_account_domains_info.catalystcenter_version if pnp_smart_account_domains_info.catalystcenter_version is not none else omit }}"
        headers: "{{ pnp_smart_account_domains_info.headers if pnp_smart_account_domains_info.headers is not none else omit }}"
        validate_response_schema: "{{ pnp_smart_account_domains_info.validate_response_schema if pnp_smart_account_domains_info.validate_response_schema is not none else omit }}"
      register: pnp_smart_account_domains_info_result
