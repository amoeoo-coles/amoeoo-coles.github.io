---
# Sample playbook for cisco.catalystcenter.sda_authentication_profiles (cisco.catalystcenter 2.15.0)
# Build order: 732
# Resource module for Sda Authentication Profiles
# Reads ../models/sda_authentication_profiles.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_authentication_profiles_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_authentication_profiles.

- name: "0732 sda_authentication_profiles"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_authentication_profiles.yml
  tasks:
    - name: Run sda_authentication_profiles from its model
      cisco.catalystcenter.sda_authentication_profiles:
        catalystcenter_debug: "{{ sda_authentication_profiles.catalystcenter_debug if sda_authentication_profiles.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_authentication_profiles.catalystcenter_host if sda_authentication_profiles.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_authentication_profiles.catalystcenter_password if sda_authentication_profiles.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_authentication_profiles.catalystcenter_port if sda_authentication_profiles.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_authentication_profiles.catalystcenter_username if sda_authentication_profiles.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_authentication_profiles.catalystcenter_verify if sda_authentication_profiles.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_authentication_profiles.catalystcenter_version if sda_authentication_profiles.catalystcenter_version is not none else omit }}"
        payload: "{{ (sda_authentication_profiles.payload | cat_strip_nulls) if (sda_authentication_profiles.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_authentication_profiles.validate_response_schema if sda_authentication_profiles.validate_response_schema is not none else omit }}"
      register: sda_authentication_profiles_result
      tags:
        - never
        - sda_authentication_profiles
