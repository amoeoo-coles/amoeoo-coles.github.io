---
# Sample playbook for cisco.catalystcenter.user_role_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 102
# Resource module for managing users, roles, and access groups in Cisco Catalyst Center.
# Reads ../models/user_role_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/user_role_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags user_role_workflow_manager.

- name: "0102 user_role_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/user_role_workflow_manager.yml
  tasks:
    - name: Run user_role_workflow_manager from its model
      cisco.catalystcenter.user_role_workflow_manager:
        catalystcenter_api_task_timeout: "{{ user_role_workflow_manager.catalystcenter_api_task_timeout if user_role_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ user_role_workflow_manager.catalystcenter_debug if user_role_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ user_role_workflow_manager.catalystcenter_host if user_role_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ user_role_workflow_manager.catalystcenter_log if user_role_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ user_role_workflow_manager.catalystcenter_log_append if user_role_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ user_role_workflow_manager.catalystcenter_log_file_path if user_role_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ user_role_workflow_manager.catalystcenter_log_level if user_role_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ user_role_workflow_manager.catalystcenter_password if user_role_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ user_role_workflow_manager.catalystcenter_port if user_role_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ user_role_workflow_manager.catalystcenter_task_poll_interval if user_role_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ user_role_workflow_manager.catalystcenter_username if user_role_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ user_role_workflow_manager.catalystcenter_verify if user_role_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ user_role_workflow_manager.catalystcenter_version if user_role_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (user_role_workflow_manager.config | cat_strip_nulls) if (user_role_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ user_role_workflow_manager.config_verify if user_role_workflow_manager.config_verify is not none else omit }}"
        state: "{{ user_role_workflow_manager.state if user_role_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ user_role_workflow_manager.validate_response_schema if user_role_workflow_manager.validate_response_schema is not none else omit }}"
      register: user_role_workflow_manager_result
      tags:
        - never
        - user_role_workflow_manager
