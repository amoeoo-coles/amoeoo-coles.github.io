---
# Sample playbook for cisco.catalystcenter.flexible_report_executions (cisco.catalystcenter 2.15.0)
# Build order: 1467
# Resource module for Flexible Report Executions
# Reads ../models/flexible_report_executions.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/flexible_report_executions_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags flexible_report_executions.

- name: "1467 flexible_report_executions"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/flexible_report_executions.yml
  tasks:
    - name: Run flexible_report_executions from its model
      cisco.catalystcenter.flexible_report_executions:
        catalystcenter_debug: "{{ flexible_report_executions.catalystcenter_debug if flexible_report_executions.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ flexible_report_executions.catalystcenter_host if flexible_report_executions.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ flexible_report_executions.catalystcenter_password if flexible_report_executions.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ flexible_report_executions.catalystcenter_port if flexible_report_executions.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ flexible_report_executions.catalystcenter_username if flexible_report_executions.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ flexible_report_executions.catalystcenter_verify if flexible_report_executions.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ flexible_report_executions.catalystcenter_version if flexible_report_executions.catalystcenter_version is not none else omit }}"
        reportId: "{{ flexible_report_executions.reportId if flexible_report_executions.reportId is not none else omit }}"
        validate_response_schema: "{{ flexible_report_executions.validate_response_schema if flexible_report_executions.validate_response_schema is not none else omit }}"
      register: flexible_report_executions_result
      tags:
        - never
        - flexible_report_executions
