---
# Sample playbook for cisco.catalystcenter.ise_radius_integration_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 101
# Resource module for Authentication and Policy Servers
# Reads ../models/ise_radius_integration_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ise_radius_integration_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags ise_radius_integration_workflow_manager.

- name: "0101 ise_radius_integration_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ise_radius_integration_workflow_manager.yml
  tasks:
    - name: Run ise_radius_integration_workflow_manager from its model
      cisco.catalystcenter.ise_radius_integration_workflow_manager:
        catalystcenter_api_task_timeout: "{{ ise_radius_integration_workflow_manager.catalystcenter_api_task_timeout if ise_radius_integration_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ ise_radius_integration_workflow_manager.catalystcenter_debug if ise_radius_integration_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ise_radius_integration_workflow_manager.catalystcenter_host if ise_radius_integration_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ ise_radius_integration_workflow_manager.catalystcenter_log if ise_radius_integration_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ ise_radius_integration_workflow_manager.catalystcenter_log_append if ise_radius_integration_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ ise_radius_integration_workflow_manager.catalystcenter_log_file_path if ise_radius_integration_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ ise_radius_integration_workflow_manager.catalystcenter_log_level if ise_radius_integration_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ ise_radius_integration_workflow_manager.catalystcenter_password if ise_radius_integration_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ise_radius_integration_workflow_manager.catalystcenter_port if ise_radius_integration_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ ise_radius_integration_workflow_manager.catalystcenter_task_poll_interval if ise_radius_integration_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ ise_radius_integration_workflow_manager.catalystcenter_username if ise_radius_integration_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ise_radius_integration_workflow_manager.catalystcenter_verify if ise_radius_integration_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ise_radius_integration_workflow_manager.catalystcenter_version if ise_radius_integration_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (ise_radius_integration_workflow_manager.config | cat_strip_nulls) if (ise_radius_integration_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ ise_radius_integration_workflow_manager.config_verify if ise_radius_integration_workflow_manager.config_verify is not none else omit }}"
        state: "{{ ise_radius_integration_workflow_manager.state if ise_radius_integration_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ ise_radius_integration_workflow_manager.validate_response_schema if ise_radius_integration_workflow_manager.validate_response_schema is not none else omit }}"
      register: ise_radius_integration_workflow_manager_result
      tags:
        - never
        - ise_radius_integration_workflow_manager
