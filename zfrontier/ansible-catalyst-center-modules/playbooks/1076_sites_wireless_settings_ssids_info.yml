---
# Sample playbook for cisco.catalystcenter.sites_wireless_settings_ssids_info (cisco.catalystcenter 2.15.0)
# Build order: 1076
# Information module for Sites Wireless Settings Ssids
# Reads ../models/sites_wireless_settings_ssids_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sites_wireless_settings_ssids_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1076 sites_wireless_settings_ssids_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sites_wireless_settings_ssids_info.yml
  tasks:
    - name: Run sites_wireless_settings_ssids_info from its model
      cisco.catalystcenter.sites_wireless_settings_ssids_info:
        authType: "{{ sites_wireless_settings_ssids_info.authType if sites_wireless_settings_ssids_info.authType is not none else omit }}"
        catalystcenter_debug: "{{ sites_wireless_settings_ssids_info.catalystcenter_debug if sites_wireless_settings_ssids_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sites_wireless_settings_ssids_info.catalystcenter_host if sites_wireless_settings_ssids_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sites_wireless_settings_ssids_info.catalystcenter_password if sites_wireless_settings_ssids_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sites_wireless_settings_ssids_info.catalystcenter_port if sites_wireless_settings_ssids_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sites_wireless_settings_ssids_info.catalystcenter_username if sites_wireless_settings_ssids_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sites_wireless_settings_ssids_info.catalystcenter_verify if sites_wireless_settings_ssids_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sites_wireless_settings_ssids_info.catalystcenter_version if sites_wireless_settings_ssids_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sites_wireless_settings_ssids_info.headers if sites_wireless_settings_ssids_info.headers is not none else omit }}"
        id: "{{ sites_wireless_settings_ssids_info.id if sites_wireless_settings_ssids_info.id is not none else omit }}"
        l3authType: "{{ sites_wireless_settings_ssids_info.l3authType if sites_wireless_settings_ssids_info.l3authType is not none else omit }}"
        limit: "{{ sites_wireless_settings_ssids_info.limit if sites_wireless_settings_ssids_info.limit is not none else omit }}"
        offset: "{{ sites_wireless_settings_ssids_info.offset if sites_wireless_settings_ssids_info.offset is not none else omit }}"
        siteId: "{{ sites_wireless_settings_ssids_info.siteId if sites_wireless_settings_ssids_info.siteId is not none else omit }}"
        ssid: "{{ sites_wireless_settings_ssids_info.ssid if sites_wireless_settings_ssids_info.ssid is not none else omit }}"
        validate_response_schema: "{{ sites_wireless_settings_ssids_info.validate_response_schema if sites_wireless_settings_ssids_info.validate_response_schema is not none else omit }}"
        wlanType: "{{ sites_wireless_settings_ssids_info.wlanType if sites_wireless_settings_ssids_info.wlanType is not none else omit }}"
      register: sites_wireless_settings_ssids_info_result
