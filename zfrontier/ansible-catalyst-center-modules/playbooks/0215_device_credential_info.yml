---
# Sample playbook for cisco.catalystcenter.device_credential_info (cisco.catalystcenter 2.15.0)
# Build order: 215
# Information module for Device Credential
# Reads ../models/device_credential_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_credential_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0215 device_credential_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_credential_info.yml
  tasks:
    - name: Run device_credential_info from its model
      cisco.catalystcenter.device_credential_info:
        catalystcenter_debug: "{{ device_credential_info.catalystcenter_debug if device_credential_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_credential_info.catalystcenter_host if device_credential_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_credential_info.catalystcenter_password if device_credential_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_credential_info.catalystcenter_port if device_credential_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_credential_info.catalystcenter_username if device_credential_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_credential_info.catalystcenter_verify if device_credential_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_credential_info.catalystcenter_version if device_credential_info.catalystcenter_version is not none else omit }}"
        headers: "{{ device_credential_info.headers if device_credential_info.headers is not none else omit }}"
        siteId: "{{ device_credential_info.siteId if device_credential_info.siteId is not none else omit }}"
        validate_response_schema: "{{ device_credential_info.validate_response_schema if device_credential_info.validate_response_schema is not none else omit }}"
      register: device_credential_info_result
