---
# Sample playbook for cisco.catalystcenter.iot_fabric_prp_configuration_models_delete (cisco.catalystcenter 2.15.0)
# Build order: 931
# Resource module for Iot Fabric Prp Configuration Models Delete
# Reads ../models/iot_fabric_prp_configuration_models_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_fabric_prp_configuration_models_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_fabric_prp_configuration_models_delete.

- name: "0931 iot_fabric_prp_configuration_models_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_fabric_prp_configuration_models_delete.yml
  tasks:
    - name: Run iot_fabric_prp_configuration_models_delete from its model
      cisco.catalystcenter.iot_fabric_prp_configuration_models_delete:
        catalystcenter_debug: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_debug if iot_fabric_prp_configuration_models_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_host if iot_fabric_prp_configuration_models_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_password if iot_fabric_prp_configuration_models_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_port if iot_fabric_prp_configuration_models_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_username if iot_fabric_prp_configuration_models_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_verify if iot_fabric_prp_configuration_models_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_fabric_prp_configuration_models_delete.catalystcenter_version if iot_fabric_prp_configuration_models_delete.catalystcenter_version is not none else omit }}"
        previewActivityId: "{{ iot_fabric_prp_configuration_models_delete.previewActivityId if iot_fabric_prp_configuration_models_delete.previewActivityId is not none else omit }}"
        validate_response_schema: "{{ iot_fabric_prp_configuration_models_delete.validate_response_schema if iot_fabric_prp_configuration_models_delete.validate_response_schema is not none else omit }}"
      register: iot_fabric_prp_configuration_models_delete_result
      tags:
        - never
        - iot_fabric_prp_configuration_models_delete
