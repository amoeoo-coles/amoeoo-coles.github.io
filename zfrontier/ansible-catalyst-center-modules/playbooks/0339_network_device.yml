---
# Sample playbook for cisco.catalystcenter.network_device (cisco.catalystcenter 2.15.0)
# Build order: 339
# Resource module for Network Device
# Reads ../models/network_device.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device.

- name: "0339 network_device"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device.yml
  tasks:
    - name: Run network_device from its model
      cisco.catalystcenter.network_device:
        catalystcenter_debug: "{{ network_device.catalystcenter_debug if network_device.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device.catalystcenter_host if network_device.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device.catalystcenter_password if network_device.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device.catalystcenter_port if network_device.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device.catalystcenter_username if network_device.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device.catalystcenter_verify if network_device.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device.catalystcenter_version if network_device.catalystcenter_version is not none else omit }}"
        cleanConfig: "{{ network_device.cleanConfig if network_device.cleanConfig is not none else omit }}"
        cliTransport: "{{ network_device.cliTransport if network_device.cliTransport is not none else omit }}"
        computeDevice: "{{ network_device.computeDevice if network_device.computeDevice is not none else omit }}"
        enablePassword: "{{ network_device.enablePassword if network_device.enablePassword is not none else omit }}"
        extendedDiscoveryInfo: "{{ network_device.extendedDiscoveryInfo if network_device.extendedDiscoveryInfo is not none else omit }}"
        httpPassword: "{{ network_device.httpPassword if network_device.httpPassword is not none else omit }}"
        httpPort: "{{ network_device.httpPort if network_device.httpPort is not none else omit }}"
        httpSecure: "{{ network_device.httpSecure if network_device.httpSecure is not none else omit }}"
        httpUserName: "{{ network_device.httpUserName if network_device.httpUserName is not none else omit }}"
        id: "{{ network_device.id if network_device.id is not none else omit }}"
        ipAddress: "{{ (network_device.ipAddress | cat_strip_nulls) if (network_device.ipAddress | cat_strip_nulls) is not none else omit }}"
        merakiOrgId: "{{ (network_device.merakiOrgId | cat_strip_nulls) if (network_device.merakiOrgId | cat_strip_nulls) is not none else omit }}"
        netconfPort: "{{ network_device.netconfPort if network_device.netconfPort is not none else omit }}"
        password: "{{ network_device.password if network_device.password is not none else omit }}"
        serialNumber: "{{ network_device.serialNumber if network_device.serialNumber is not none else omit }}"
        snmpAuthPassphrase: "{{ network_device.snmpAuthPassphrase if network_device.snmpAuthPassphrase is not none else omit }}"
        snmpAuthProtocol: "{{ network_device.snmpAuthProtocol if network_device.snmpAuthProtocol is not none else omit }}"
        snmpMode: "{{ network_device.snmpMode if network_device.snmpMode is not none else omit }}"
        snmpPrivPassphrase: "{{ network_device.snmpPrivPassphrase if network_device.snmpPrivPassphrase is not none else omit }}"
        snmpPrivProtocol: "{{ network_device.snmpPrivProtocol if network_device.snmpPrivProtocol is not none else omit }}"
        snmpROCommunity: "{{ network_device.snmpROCommunity if network_device.snmpROCommunity is not none else omit }}"
        snmpRWCommunity: "{{ network_device.snmpRWCommunity if network_device.snmpRWCommunity is not none else omit }}"
        snmpRetry: "{{ network_device.snmpRetry if network_device.snmpRetry is not none else omit }}"
        snmpTimeout: "{{ network_device.snmpTimeout if network_device.snmpTimeout is not none else omit }}"
        snmpUserName: "{{ network_device.snmpUserName if network_device.snmpUserName is not none else omit }}"
        snmpVersion: "{{ network_device.snmpVersion if network_device.snmpVersion is not none else omit }}"
        type: "{{ network_device.type if network_device.type is not none else omit }}"
        updateMgmtIPaddressList: "{{ (network_device.updateMgmtIPaddressList | cat_strip_nulls) if (network_device.updateMgmtIPaddressList | cat_strip_nulls) is not none else omit }}"
        userName: "{{ network_device.userName if network_device.userName is not none else omit }}"
        validate_response_schema: "{{ network_device.validate_response_schema if network_device.validate_response_schema is not none else omit }}"
      register: network_device_result
      tags:
        - never
        - network_device
