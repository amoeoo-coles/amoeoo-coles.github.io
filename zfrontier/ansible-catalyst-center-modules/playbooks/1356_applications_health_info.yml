---
# Sample playbook for cisco.catalystcenter.applications_health_info (cisco.catalystcenter 2.15.0)
# Build order: 1356
# Information module for Applications Health
# Reads ../models/applications_health_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/applications_health_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1356 applications_health_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/applications_health_info.yml
  tasks:
    - name: Run applications_health_info from its model
      cisco.catalystcenter.applications_health_info:
        applicationHealth: "{{ applications_health_info.applicationHealth if applications_health_info.applicationHealth is not none else omit }}"
        applicationName: "{{ applications_health_info.applicationName if applications_health_info.applicationName is not none else omit }}"
        catalystcenter_debug: "{{ applications_health_info.catalystcenter_debug if applications_health_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ applications_health_info.catalystcenter_host if applications_health_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ applications_health_info.catalystcenter_password if applications_health_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ applications_health_info.catalystcenter_port if applications_health_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ applications_health_info.catalystcenter_username if applications_health_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ applications_health_info.catalystcenter_verify if applications_health_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ applications_health_info.catalystcenter_version if applications_health_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ applications_health_info.deviceId if applications_health_info.deviceId is not none else omit }}"
        endTime: "{{ applications_health_info.endTime if applications_health_info.endTime is not none else omit }}"
        headers: "{{ applications_health_info.headers if applications_health_info.headers is not none else omit }}"
        limit: "{{ applications_health_info.limit if applications_health_info.limit is not none else omit }}"
        macAddress: "{{ applications_health_info.macAddress if applications_health_info.macAddress is not none else omit }}"
        offset: "{{ applications_health_info.offset if applications_health_info.offset is not none else omit }}"
        siteId: "{{ applications_health_info.siteId if applications_health_info.siteId is not none else omit }}"
        startTime: "{{ applications_health_info.startTime if applications_health_info.startTime is not none else omit }}"
        validate_response_schema: "{{ applications_health_info.validate_response_schema if applications_health_info.validate_response_schema is not none else omit }}"
      register: applications_health_info_result
