---
# Sample playbook for cisco.catalystcenter.switches_configs_intended_port_update (cisco.catalystcenter 2.15.0)
# Build order: 877
# Resource module for Switches Configs Intended Port Update
# Reads ../models/switches_configs_intended_port_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/switches_configs_intended_port_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags switches_configs_intended_port_update.

- name: "0877 switches_configs_intended_port_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/switches_configs_intended_port_update.yml
  tasks:
    - name: Run switches_configs_intended_port_update from its model
      cisco.catalystcenter.switches_configs_intended_port_update:
        catalystcenter_debug: "{{ switches_configs_intended_port_update.catalystcenter_debug if switches_configs_intended_port_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ switches_configs_intended_port_update.catalystcenter_host if switches_configs_intended_port_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ switches_configs_intended_port_update.catalystcenter_password if switches_configs_intended_port_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ switches_configs_intended_port_update.catalystcenter_port if switches_configs_intended_port_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ switches_configs_intended_port_update.catalystcenter_username if switches_configs_intended_port_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ switches_configs_intended_port_update.catalystcenter_verify if switches_configs_intended_port_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ switches_configs_intended_port_update.catalystcenter_version if switches_configs_intended_port_update.catalystcenter_version is not none else omit }}"
        ethernetInterfaceConfig: "{{ (switches_configs_intended_port_update.ethernetInterfaceConfig | cat_strip_nulls) if (switches_configs_intended_port_update.ethernetInterfaceConfig | cat_strip_nulls) is not none else omit }}"
        feature: "{{ switches_configs_intended_port_update.feature if switches_configs_intended_port_update.feature is not none else omit }}"
        id: "{{ switches_configs_intended_port_update.id if switches_configs_intended_port_update.id is not none else omit }}"
        portChannelInterfaceConfig: "{{ (switches_configs_intended_port_update.portChannelInterfaceConfig | cat_strip_nulls) if (switches_configs_intended_port_update.portChannelInterfaceConfig | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ switches_configs_intended_port_update.validate_response_schema if switches_configs_intended_port_update.validate_response_schema is not none else omit }}"
      register: switches_configs_intended_port_update_result
      tags:
        - never
        - switches_configs_intended_port_update
