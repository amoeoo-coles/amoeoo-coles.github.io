---
# Sample playbook for cisco.catalystcenter.event_artifact_info (cisco.catalystcenter 2.15.0)
# Build order: 1492
# Information module for Event Artifact
# Reads ../models/event_artifact_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/event_artifact_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1492 event_artifact_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/event_artifact_info.yml
  tasks:
    - name: Run event_artifact_info from its model
      cisco.catalystcenter.event_artifact_info:
        catalystcenter_debug: "{{ event_artifact_info.catalystcenter_debug if event_artifact_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ event_artifact_info.catalystcenter_host if event_artifact_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_artifact_info.catalystcenter_password if event_artifact_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ event_artifact_info.catalystcenter_port if event_artifact_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ event_artifact_info.catalystcenter_username if event_artifact_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ event_artifact_info.catalystcenter_verify if event_artifact_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_artifact_info.catalystcenter_version if event_artifact_info.catalystcenter_version is not none else omit }}"
        eventIds: "{{ event_artifact_info.eventIds if event_artifact_info.eventIds is not none else omit }}"
        headers: "{{ event_artifact_info.headers if event_artifact_info.headers is not none else omit }}"
        limit: "{{ event_artifact_info.limit if event_artifact_info.limit is not none else omit }}"
        offset: "{{ event_artifact_info.offset if event_artifact_info.offset is not none else omit }}"
        order: "{{ event_artifact_info.order if event_artifact_info.order is not none else omit }}"
        search: "{{ event_artifact_info.search if event_artifact_info.search is not none else omit }}"
        sortBy: "{{ event_artifact_info.sortBy if event_artifact_info.sortBy is not none else omit }}"
        tags: "{{ event_artifact_info.tags if event_artifact_info.tags is not none else omit }}"
        validate_response_schema: "{{ event_artifact_info.validate_response_schema if event_artifact_info.validate_response_schema is not none else omit }}"
      register: event_artifact_info_result
