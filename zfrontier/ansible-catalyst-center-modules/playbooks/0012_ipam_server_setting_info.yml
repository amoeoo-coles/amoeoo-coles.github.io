---
# Sample playbook for cisco.catalystcenter.ipam_server_setting_info (cisco.catalystcenter 2.15.0)
# Build order: 12
# Information module for Ipam Server Setting
# Reads ../models/ipam_server_setting_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ipam_server_setting_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0012 ipam_server_setting_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipam_server_setting_info.yml
  tasks:
    - name: Run ipam_server_setting_info from its model
      cisco.catalystcenter.ipam_server_setting_info:
        catalystcenter_debug: "{{ ipam_server_setting_info.catalystcenter_debug if ipam_server_setting_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ipam_server_setting_info.catalystcenter_host if ipam_server_setting_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ ipam_server_setting_info.catalystcenter_password if ipam_server_setting_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ipam_server_setting_info.catalystcenter_port if ipam_server_setting_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ ipam_server_setting_info.catalystcenter_username if ipam_server_setting_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ipam_server_setting_info.catalystcenter_verify if ipam_server_setting_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ipam_server_setting_info.catalystcenter_version if ipam_server_setting_info.catalystcenter_version is not none else omit }}"
        headers: "{{ ipam_server_setting_info.headers if ipam_server_setting_info.headers is not none else omit }}"
        validate_response_schema: "{{ ipam_server_setting_info.validate_response_schema if ipam_server_setting_info.validate_response_schema is not none else omit }}"
      register: ipam_server_setting_info_result
