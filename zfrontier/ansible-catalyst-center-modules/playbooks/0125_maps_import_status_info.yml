---
# Sample playbook for cisco.catalystcenter.maps_import_status_info (cisco.catalystcenter 2.15.0)
# Build order: 125
# Information module for Maps Import Status
# Reads ../models/maps_import_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/maps_import_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0125 maps_import_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/maps_import_status_info.yml
  tasks:
    - name: Run maps_import_status_info from its model
      cisco.catalystcenter.maps_import_status_info:
        catalystcenter_debug: "{{ maps_import_status_info.catalystcenter_debug if maps_import_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ maps_import_status_info.catalystcenter_host if maps_import_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ maps_import_status_info.catalystcenter_password if maps_import_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ maps_import_status_info.catalystcenter_port if maps_import_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ maps_import_status_info.catalystcenter_username if maps_import_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ maps_import_status_info.catalystcenter_verify if maps_import_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ maps_import_status_info.catalystcenter_version if maps_import_status_info.catalystcenter_version is not none else omit }}"
        headers: "{{ maps_import_status_info.headers if maps_import_status_info.headers is not none else omit }}"
        importContextUuid: "{{ maps_import_status_info.importContextUuid if maps_import_status_info.importContextUuid is not none else omit }}"
        validate_response_schema: "{{ maps_import_status_info.validate_response_schema if maps_import_status_info.validate_response_schema is not none else omit }}"
      register: maps_import_status_info_result
