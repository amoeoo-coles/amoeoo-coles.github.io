---
# Sample playbook for cisco.catalystcenter.connection_mode_setting_info (cisco.catalystcenter 2.15.0)
# Build order: 519
# Information module for Connection Mode Setting
# Reads ../models/connection_mode_setting_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/connection_mode_setting_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0519 connection_mode_setting_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/connection_mode_setting_info.yml
  tasks:
    - name: Run connection_mode_setting_info from its model
      cisco.catalystcenter.connection_mode_setting_info:
        catalystcenter_debug: "{{ connection_mode_setting_info.catalystcenter_debug if connection_mode_setting_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ connection_mode_setting_info.catalystcenter_host if connection_mode_setting_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ connection_mode_setting_info.catalystcenter_password if connection_mode_setting_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ connection_mode_setting_info.catalystcenter_port if connection_mode_setting_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ connection_mode_setting_info.catalystcenter_username if connection_mode_setting_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ connection_mode_setting_info.catalystcenter_verify if connection_mode_setting_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ connection_mode_setting_info.catalystcenter_version if connection_mode_setting_info.catalystcenter_version is not none else omit }}"
        headers: "{{ connection_mode_setting_info.headers if connection_mode_setting_info.headers is not none else omit }}"
        validate_response_schema: "{{ connection_mode_setting_info.validate_response_schema if connection_mode_setting_info.validate_response_schema is not none else omit }}"
      register: connection_mode_setting_info_result
