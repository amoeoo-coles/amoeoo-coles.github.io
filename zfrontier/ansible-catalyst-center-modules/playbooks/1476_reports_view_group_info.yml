---
# Sample playbook for cisco.catalystcenter.reports_view_group_info (cisco.catalystcenter 2.15.0)
# Build order: 1476
# Information module for Reports View Group
# Reads ../models/reports_view_group_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reports_view_group_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1476 reports_view_group_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/reports_view_group_info.yml
  tasks:
    - name: Run reports_view_group_info from its model
      cisco.catalystcenter.reports_view_group_info:
        catalystcenter_debug: "{{ reports_view_group_info.catalystcenter_debug if reports_view_group_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ reports_view_group_info.catalystcenter_host if reports_view_group_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ reports_view_group_info.catalystcenter_password if reports_view_group_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ reports_view_group_info.catalystcenter_port if reports_view_group_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ reports_view_group_info.catalystcenter_username if reports_view_group_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ reports_view_group_info.catalystcenter_verify if reports_view_group_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ reports_view_group_info.catalystcenter_version if reports_view_group_info.catalystcenter_version is not none else omit }}"
        headers: "{{ reports_view_group_info.headers if reports_view_group_info.headers is not none else omit }}"
        validate_response_schema: "{{ reports_view_group_info.validate_response_schema if reports_view_group_info.validate_response_schema is not none else omit }}"
        viewGroupId: "{{ reports_view_group_info.viewGroupId if reports_view_group_info.viewGroupId is not none else omit }}"
      register: reports_view_group_info_result
