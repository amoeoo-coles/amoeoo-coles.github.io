---
# Sample playbook for cisco.catalystcenter.access_groups (cisco.catalystcenter 2.15.0)
# Build order: 40
# Resource module for Access Groups
# Reads ../models/access_groups.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/access_groups_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags access_groups.

- name: "0040 access_groups"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/access_groups.yml
  tasks:
    - name: Run access_groups from its model
      cisco.catalystcenter.access_groups:
        catalystcenter_debug: "{{ access_groups.catalystcenter_debug if access_groups.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ access_groups.catalystcenter_host if access_groups.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ access_groups.catalystcenter_password if access_groups.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ access_groups.catalystcenter_port if access_groups.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ access_groups.catalystcenter_username if access_groups.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ access_groups.catalystcenter_verify if access_groups.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ access_groups.catalystcenter_version if access_groups.catalystcenter_version is not none else omit }}"
        description: "{{ access_groups.description if access_groups.description is not none else omit }}"
        id: "{{ access_groups.id if access_groups.id is not none else omit }}"
        name: "{{ access_groups.name if access_groups.name is not none else omit }}"
        resourceGroups: "{{ (access_groups.resourceGroups | cat_strip_nulls) if (access_groups.resourceGroups | cat_strip_nulls) is not none else omit }}"
        role: "{{ (access_groups.role | cat_strip_nulls) if (access_groups.role | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ access_groups.validate_response_schema if access_groups.validate_response_schema is not none else omit }}"
      register: access_groups_result
      tags:
        - never
        - access_groups
