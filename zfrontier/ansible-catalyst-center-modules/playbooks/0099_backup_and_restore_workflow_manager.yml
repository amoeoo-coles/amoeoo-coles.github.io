---
# Sample playbook for cisco.catalystcenter.backup_and_restore_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 99
# Resource module for comprehensive backup and restore workflow management with NFS server configuration in Cisco Catalyst Center.
# Reads ../models/backup_and_restore_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/backup_and_restore_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags backup_and_restore_workflow_manager.

- name: "0099 backup_and_restore_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backup_and_restore_workflow_manager.yml
  tasks:
    - name: Run backup_and_restore_workflow_manager from its model
      cisco.catalystcenter.backup_and_restore_workflow_manager:
        catalystcenter_api_task_timeout: "{{ backup_and_restore_workflow_manager.catalystcenter_api_task_timeout if backup_and_restore_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ backup_and_restore_workflow_manager.catalystcenter_debug if backup_and_restore_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ backup_and_restore_workflow_manager.catalystcenter_host if backup_and_restore_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ backup_and_restore_workflow_manager.catalystcenter_log if backup_and_restore_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ backup_and_restore_workflow_manager.catalystcenter_log_append if backup_and_restore_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ backup_and_restore_workflow_manager.catalystcenter_log_file_path if backup_and_restore_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ backup_and_restore_workflow_manager.catalystcenter_log_level if backup_and_restore_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ backup_and_restore_workflow_manager.catalystcenter_password if backup_and_restore_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ backup_and_restore_workflow_manager.catalystcenter_port if backup_and_restore_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ backup_and_restore_workflow_manager.catalystcenter_task_poll_interval if backup_and_restore_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ backup_and_restore_workflow_manager.catalystcenter_username if backup_and_restore_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ backup_and_restore_workflow_manager.catalystcenter_verify if backup_and_restore_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ backup_and_restore_workflow_manager.catalystcenter_version if backup_and_restore_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (backup_and_restore_workflow_manager.config | cat_strip_nulls) if (backup_and_restore_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ backup_and_restore_workflow_manager.config_verify if backup_and_restore_workflow_manager.config_verify is not none else omit }}"
        state: "{{ backup_and_restore_workflow_manager.state if backup_and_restore_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ backup_and_restore_workflow_manager.validate_response_schema if backup_and_restore_workflow_manager.validate_response_schema is not none else omit }}"
      register: backup_and_restore_workflow_manager_result
      tags:
        - never
        - backup_and_restore_workflow_manager
