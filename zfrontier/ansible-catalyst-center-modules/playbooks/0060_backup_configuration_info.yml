---
# Sample playbook for cisco.catalystcenter.backup_configuration_info (cisco.catalystcenter 2.15.0)
# Build order: 60
# Information module for Backup Configuration
# Reads ../models/backup_configuration_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/backup_configuration_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0060 backup_configuration_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/backup_configuration_info.yml
  tasks:
    - name: Run backup_configuration_info from its model
      cisco.catalystcenter.backup_configuration_info:
        catalystcenter_debug: "{{ backup_configuration_info.catalystcenter_debug if backup_configuration_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ backup_configuration_info.catalystcenter_host if backup_configuration_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ backup_configuration_info.catalystcenter_password if backup_configuration_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ backup_configuration_info.catalystcenter_port if backup_configuration_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ backup_configuration_info.catalystcenter_username if backup_configuration_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ backup_configuration_info.catalystcenter_verify if backup_configuration_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ backup_configuration_info.catalystcenter_version if backup_configuration_info.catalystcenter_version is not none else omit }}"
        headers: "{{ backup_configuration_info.headers if backup_configuration_info.headers is not none else omit }}"
        validate_response_schema: "{{ backup_configuration_info.validate_response_schema if backup_configuration_info.validate_response_schema is not none else omit }}"
      register: backup_configuration_info_result
