---
# Sample playbook for cisco.catalystcenter.sda_port_channels_info (cisco.catalystcenter 2.15.0)
# Build order: 808
# Information module for Sda Port Channels
# Reads ../models/sda_port_channels_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_port_channels_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0808 sda_port_channels_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_port_channels_info.yml
  tasks:
    - name: Run sda_port_channels_info from its model
      cisco.catalystcenter.sda_port_channels_info:
        catalystcenter_debug: "{{ sda_port_channels_info.catalystcenter_debug if sda_port_channels_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_port_channels_info.catalystcenter_host if sda_port_channels_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_port_channels_info.catalystcenter_password if sda_port_channels_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_port_channels_info.catalystcenter_port if sda_port_channels_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_port_channels_info.catalystcenter_username if sda_port_channels_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_port_channels_info.catalystcenter_verify if sda_port_channels_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_port_channels_info.catalystcenter_version if sda_port_channels_info.catalystcenter_version is not none else omit }}"
        connectedDeviceType: "{{ sda_port_channels_info.connectedDeviceType if sda_port_channels_info.connectedDeviceType is not none else omit }}"
        fabricId: "{{ sda_port_channels_info.fabricId if sda_port_channels_info.fabricId is not none else omit }}"
        headers: "{{ sda_port_channels_info.headers if sda_port_channels_info.headers is not none else omit }}"
        limit: "{{ sda_port_channels_info.limit if sda_port_channels_info.limit is not none else omit }}"
        nativeVlanId: "{{ sda_port_channels_info.nativeVlanId if sda_port_channels_info.nativeVlanId is not none else omit }}"
        networkDeviceId: "{{ sda_port_channels_info.networkDeviceId if sda_port_channels_info.networkDeviceId is not none else omit }}"
        offset: "{{ sda_port_channels_info.offset if sda_port_channels_info.offset is not none else omit }}"
        portChannelName: "{{ sda_port_channels_info.portChannelName if sda_port_channels_info.portChannelName is not none else omit }}"
        validate_response_schema: "{{ sda_port_channels_info.validate_response_schema if sda_port_channels_info.validate_response_schema is not none else omit }}"
      register: sda_port_channels_info_result
