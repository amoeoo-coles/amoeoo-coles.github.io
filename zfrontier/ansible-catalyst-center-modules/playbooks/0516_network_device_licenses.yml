---
# Sample playbook for cisco.catalystcenter.network_device_licenses (cisco.catalystcenter 2.15.0)
# Build order: 516
# Resource module for Network Device Licenses
# Reads ../models/network_device_licenses.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_licenses_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_licenses.

- name: "0516 network_device_licenses"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_licenses.yml
  tasks:
    - name: Run network_device_licenses from its model
      cisco.catalystcenter.network_device_licenses:
        authCodeStatus: "{{ network_device_licenses.authCodeStatus if network_device_licenses.authCodeStatus is not none else omit }}"
        authorizationStatus: "{{ network_device_licenses.authorizationStatus if network_device_licenses.authorizationStatus is not none else omit }}"
        catalystcenter_debug: "{{ network_device_licenses.catalystcenter_debug if network_device_licenses.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_licenses.catalystcenter_host if network_device_licenses.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_licenses.catalystcenter_password if network_device_licenses.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_licenses.catalystcenter_port if network_device_licenses.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_licenses.catalystcenter_username if network_device_licenses.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_licenses.catalystcenter_verify if network_device_licenses.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_licenses.catalystcenter_version if network_device_licenses.catalystcenter_version is not none else omit }}"
        changeWirelessLicense: "{{ network_device_licenses.changeWirelessLicense if network_device_licenses.changeWirelessLicense is not none else omit }}"
        customerTags: "{{ (network_device_licenses.customerTags | cat_strip_nulls) if (network_device_licenses.customerTags | cat_strip_nulls) is not none else omit }}"
        family: "{{ network_device_licenses.family if network_device_licenses.family is not none else omit }}"
        hostname: "{{ network_device_licenses.hostname if network_device_licenses.hostname is not none else omit }}"
        id: "{{ network_device_licenses.id if network_device_licenses.id is not none else omit }}"
        lastSuccessfulUsageReportingTime: "{{ (network_device_licenses.lastSuccessfulUsageReportingTime | cat_strip_nulls) if (network_device_licenses.lastSuccessfulUsageReportingTime | cat_strip_nulls) is not none else omit }}"
        licenseLevel: "{{ network_device_licenses.licenseLevel if network_device_licenses.licenseLevel is not none else omit }}"
        licenseManagedBy: "{{ network_device_licenses.licenseManagedBy if network_device_licenses.licenseManagedBy is not none else omit }}"
        licenseMode: "{{ network_device_licenses.licenseMode if network_device_licenses.licenseMode is not none else omit }}"
        licenses: "{{ (network_device_licenses.licenses | cat_strip_nulls) if (network_device_licenses.licenses | cat_strip_nulls) is not none else omit }}"
        managementAddress: "{{ network_device_licenses.managementAddress if network_device_licenses.managementAddress is not none else omit }}"
        networkDeviceId: "{{ network_device_licenses.networkDeviceId if network_device_licenses.networkDeviceId is not none else omit }}"
        registrationStatus: "{{ network_device_licenses.registrationStatus if network_device_licenses.registrationStatus is not none else omit }}"
        series: "{{ network_device_licenses.series if network_device_licenses.series is not none else omit }}"
        siteHierarchy: "{{ network_device_licenses.siteHierarchy if network_device_licenses.siteHierarchy is not none else omit }}"
        smartAccountId: "{{ network_device_licenses.smartAccountId if network_device_licenses.smartAccountId is not none else omit }}"
        softwareVersion: "{{ network_device_licenses.softwareVersion if network_device_licenses.softwareVersion is not none else omit }}"
        throughputValue: "{{ network_device_licenses.throughputValue if network_device_licenses.throughputValue is not none else omit }}"
        triggerReboot: "{{ network_device_licenses.triggerReboot if network_device_licenses.triggerReboot is not none else omit }}"
        validate_response_schema: "{{ network_device_licenses.validate_response_schema if network_device_licenses.validate_response_schema is not none else omit }}"
        virtualAccountId: "{{ network_device_licenses.virtualAccountId if network_device_licenses.virtualAccountId is not none else omit }}"
        wirelessCapable: "{{ network_device_licenses.wirelessCapable if network_device_licenses.wirelessCapable is not none else omit }}"
      register: network_device_licenses_result
      tags:
        - never
        - network_device_licenses
