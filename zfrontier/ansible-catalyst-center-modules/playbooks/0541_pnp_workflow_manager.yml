---
# Sample playbook for cisco.catalystcenter.pnp_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 541
# Resource module for Site and PnP related functions
# Reads ../models/pnp_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_workflow_manager.

- name: "0541 pnp_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_workflow_manager.yml
  tasks:
    - name: Run pnp_workflow_manager from its model
      cisco.catalystcenter.pnp_workflow_manager:
        catalystcenter_api_task_timeout: "{{ pnp_workflow_manager.catalystcenter_api_task_timeout if pnp_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ pnp_workflow_manager.catalystcenter_debug if pnp_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_workflow_manager.catalystcenter_host if pnp_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ pnp_workflow_manager.catalystcenter_log if pnp_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ pnp_workflow_manager.catalystcenter_log_append if pnp_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ pnp_workflow_manager.catalystcenter_log_file_path if pnp_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ pnp_workflow_manager.catalystcenter_log_level if pnp_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ pnp_workflow_manager.catalystcenter_password if pnp_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_workflow_manager.catalystcenter_port if pnp_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ pnp_workflow_manager.catalystcenter_task_poll_interval if pnp_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ pnp_workflow_manager.catalystcenter_username if pnp_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_workflow_manager.catalystcenter_verify if pnp_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_workflow_manager.catalystcenter_version if pnp_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (pnp_workflow_manager.config | cat_strip_nulls) if (pnp_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ pnp_workflow_manager.config_verify if pnp_workflow_manager.config_verify is not none else omit }}"
        state: "{{ pnp_workflow_manager.state if pnp_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ pnp_workflow_manager.validate_response_schema if pnp_workflow_manager.validate_response_schema is not none else omit }}"
      register: pnp_workflow_manager_result
      tags:
        - never
        - pnp_workflow_manager
