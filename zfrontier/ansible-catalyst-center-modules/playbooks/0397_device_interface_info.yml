---
# Sample playbook for cisco.catalystcenter.device_interface_info (cisco.catalystcenter 2.15.0)
# Build order: 397
# Information module for Device Interface
# Reads ../models/device_interface_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_interface_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0397 device_interface_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_interface_info.yml
  tasks:
    - name: Run device_interface_info from its model
      cisco.catalystcenter.device_interface_info:
        catalystcenter_debug: "{{ device_interface_info.catalystcenter_debug if device_interface_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_interface_info.catalystcenter_host if device_interface_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_interface_info.catalystcenter_password if device_interface_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_interface_info.catalystcenter_port if device_interface_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_interface_info.catalystcenter_username if device_interface_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_interface_info.catalystcenter_verify if device_interface_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_interface_info.catalystcenter_version if device_interface_info.catalystcenter_version is not none else omit }}"
        headers: "{{ device_interface_info.headers if device_interface_info.headers is not none else omit }}"
        id: "{{ device_interface_info.id if device_interface_info.id is not none else omit }}"
        lastInputTime: "{{ device_interface_info.lastInputTime if device_interface_info.lastInputTime is not none else omit }}"
        lastOutputTime: "{{ device_interface_info.lastOutputTime if device_interface_info.lastOutputTime is not none else omit }}"
        limit: "{{ device_interface_info.limit if device_interface_info.limit is not none else omit }}"
        offset: "{{ device_interface_info.offset if device_interface_info.offset is not none else omit }}"
        validate_response_schema: "{{ device_interface_info.validate_response_schema if device_interface_info.validate_response_schema is not none else omit }}"
      register: device_interface_info_result
