---
# Sample playbook for cisco.catalystcenter.authentication_import_certificate_p12 (cisco.catalystcenter 2.15.0)
# Build order: 36
# Resource module for Authentication Import Certificate P12
# Reads ../models/authentication_import_certificate_p12.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/authentication_import_certificate_p12_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags authentication_import_certificate_p12.

- name: "0036 authentication_import_certificate_p12"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/authentication_import_certificate_p12.yml
  tasks:
    - name: Run authentication_import_certificate_p12 from its model
      cisco.catalystcenter.authentication_import_certificate_p12:
        catalystcenter_debug: "{{ authentication_import_certificate_p12.catalystcenter_debug if authentication_import_certificate_p12.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ authentication_import_certificate_p12.catalystcenter_host if authentication_import_certificate_p12.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ authentication_import_certificate_p12.catalystcenter_password if authentication_import_certificate_p12.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ authentication_import_certificate_p12.catalystcenter_port if authentication_import_certificate_p12.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ authentication_import_certificate_p12.catalystcenter_username if authentication_import_certificate_p12.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ authentication_import_certificate_p12.catalystcenter_verify if authentication_import_certificate_p12.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ authentication_import_certificate_p12.catalystcenter_version if authentication_import_certificate_p12.catalystcenter_version is not none else omit }}"
        listOfUsers: "{{ (authentication_import_certificate_p12.listOfUsers | cat_strip_nulls) if (authentication_import_certificate_p12.listOfUsers | cat_strip_nulls) is not none else omit }}"
        p12FilePath: "{{ authentication_import_certificate_p12.p12FilePath if authentication_import_certificate_p12.p12FilePath is not none else omit }}"
        p12Password: "{{ authentication_import_certificate_p12.p12Password if authentication_import_certificate_p12.p12Password is not none else omit }}"
        pkPassword: "{{ authentication_import_certificate_p12.pkPassword if authentication_import_certificate_p12.pkPassword is not none else omit }}"
        validate_response_schema: "{{ authentication_import_certificate_p12.validate_response_schema if authentication_import_certificate_p12.validate_response_schema is not none else omit }}"
      register: authentication_import_certificate_p12_result
      tags:
        - never
        - authentication_import_certificate_p12
