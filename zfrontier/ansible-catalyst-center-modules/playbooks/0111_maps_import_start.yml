---
# Sample playbook for cisco.catalystcenter.maps_import_start (cisco.catalystcenter 2.15.0)
# Build order: 111
# Resource module for Maps Import Start
# Reads ../models/maps_import_start.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/maps_import_start_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags maps_import_start.

- name: "0111 maps_import_start"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/maps_import_start.yml
  tasks:
    - name: Run maps_import_start from its model
      cisco.catalystcenter.maps_import_start:
        catalystcenter_debug: "{{ maps_import_start.catalystcenter_debug if maps_import_start.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ maps_import_start.catalystcenter_host if maps_import_start.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ maps_import_start.catalystcenter_password if maps_import_start.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ maps_import_start.catalystcenter_port if maps_import_start.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ maps_import_start.catalystcenter_username if maps_import_start.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ maps_import_start.catalystcenter_verify if maps_import_start.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ maps_import_start.catalystcenter_version if maps_import_start.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ maps_import_start.validate_response_schema if maps_import_start.validate_response_schema is not none else omit }}"
      register: maps_import_start_result
      tags:
        - never
        - maps_import_start
