---
# Sample playbook for cisco.catalystcenter.device_credential (cisco.catalystcenter 2.15.0)
# Build order: 189
# Resource module for Device Credential
# Reads ../models/device_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags device_credential.

- name: "0189 device_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_credential.yml
  tasks:
    - name: Run device_credential from its model
      cisco.catalystcenter.device_credential:
        catalystcenter_debug: "{{ device_credential.catalystcenter_debug if device_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ device_credential.catalystcenter_host if device_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ device_credential.catalystcenter_password if device_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ device_credential.catalystcenter_port if device_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ device_credential.catalystcenter_username if device_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ device_credential.catalystcenter_verify if device_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ device_credential.catalystcenter_version if device_credential.catalystcenter_version is not none else omit }}"
        id: "{{ device_credential.id if device_credential.id is not none else omit }}"
        settings: "{{ (device_credential.settings | cat_strip_nulls) if (device_credential.settings | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ device_credential.validate_response_schema if device_credential.validate_response_schema is not none else omit }}"
      register: device_credential_result
      tags:
        - never
        - device_credential
