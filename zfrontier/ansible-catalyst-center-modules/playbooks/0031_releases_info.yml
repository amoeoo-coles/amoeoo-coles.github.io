---
# Sample playbook for cisco.catalystcenter.releases_info (cisco.catalystcenter 2.15.0)
# Build order: 31
# Information module for Releases
# Reads ../models/releases_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/releases_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0031 releases_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/releases_info.yml
  tasks:
    - name: Run releases_info from its model
      cisco.catalystcenter.releases_info:
        catalystcenter_debug: "{{ releases_info.catalystcenter_debug if releases_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ releases_info.catalystcenter_host if releases_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ releases_info.catalystcenter_password if releases_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ releases_info.catalystcenter_port if releases_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ releases_info.catalystcenter_username if releases_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ releases_info.catalystcenter_verify if releases_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ releases_info.catalystcenter_version if releases_info.catalystcenter_version is not none else omit }}"
        headers: "{{ releases_info.headers if releases_info.headers is not none else omit }}"
        validate_response_schema: "{{ releases_info.validate_response_schema if releases_info.validate_response_schema is not none else omit }}"
      register: releases_info_result
