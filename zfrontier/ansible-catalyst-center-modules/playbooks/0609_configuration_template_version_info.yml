---
# Sample playbook for cisco.catalystcenter.configuration_template_version_info (cisco.catalystcenter 2.15.0)
# Build order: 609
# Information module for Configuration Template Version
# Reads ../models/configuration_template_version_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_version_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0609 configuration_template_version_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_version_info.yml
  tasks:
    - name: Run configuration_template_version_info from its model
      cisco.catalystcenter.configuration_template_version_info:
        catalystcenter_debug: "{{ configuration_template_version_info.catalystcenter_debug if configuration_template_version_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_version_info.catalystcenter_host if configuration_template_version_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_version_info.catalystcenter_password if configuration_template_version_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_version_info.catalystcenter_port if configuration_template_version_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_version_info.catalystcenter_username if configuration_template_version_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_version_info.catalystcenter_verify if configuration_template_version_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_version_info.catalystcenter_version if configuration_template_version_info.catalystcenter_version is not none else omit }}"
        headers: "{{ configuration_template_version_info.headers if configuration_template_version_info.headers is not none else omit }}"
        templateId: "{{ configuration_template_version_info.templateId if configuration_template_version_info.templateId is not none else omit }}"
        validate_response_schema: "{{ configuration_template_version_info.validate_response_schema if configuration_template_version_info.validate_response_schema is not none else omit }}"
      register: configuration_template_version_info_result
