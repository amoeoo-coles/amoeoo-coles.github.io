---
# Sample playbook for cisco.catalystcenter.tag_member_type_info (cisco.catalystcenter 2.15.0)
# Build order: 260
# Information module for Tag Member Type
# Reads ../models/tag_member_type_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tag_member_type_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0260 tag_member_type_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tag_member_type_info.yml
  tasks:
    - name: Run tag_member_type_info from its model
      cisco.catalystcenter.tag_member_type_info:
        catalystcenter_debug: "{{ tag_member_type_info.catalystcenter_debug if tag_member_type_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tag_member_type_info.catalystcenter_host if tag_member_type_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ tag_member_type_info.catalystcenter_password if tag_member_type_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tag_member_type_info.catalystcenter_port if tag_member_type_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ tag_member_type_info.catalystcenter_username if tag_member_type_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tag_member_type_info.catalystcenter_verify if tag_member_type_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tag_member_type_info.catalystcenter_version if tag_member_type_info.catalystcenter_version is not none else omit }}"
        headers: "{{ tag_member_type_info.headers if tag_member_type_info.headers is not none else omit }}"
        validate_response_schema: "{{ tag_member_type_info.validate_response_schema if tag_member_type_info.validate_response_schema is not none else omit }}"
      register: tag_member_type_info_result
