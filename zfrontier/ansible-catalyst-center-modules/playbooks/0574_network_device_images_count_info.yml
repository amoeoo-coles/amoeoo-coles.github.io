---
# Sample playbook for cisco.catalystcenter.network_device_images_count_info (cisco.catalystcenter 2.15.0)
# Build order: 574
# Information module for Network Device Images Count
# Reads ../models/network_device_images_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_images_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0574 network_device_images_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_images_count_info.yml
  tasks:
    - name: Run network_device_images_count_info from its model
      cisco.catalystcenter.network_device_images_count_info:
        catalystcenter_debug: "{{ network_device_images_count_info.catalystcenter_debug if network_device_images_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_images_count_info.catalystcenter_host if network_device_images_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_images_count_info.catalystcenter_password if network_device_images_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_images_count_info.catalystcenter_port if network_device_images_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_images_count_info.catalystcenter_username if network_device_images_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_images_count_info.catalystcenter_verify if network_device_images_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_images_count_info.catalystcenter_version if network_device_images_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ network_device_images_count_info.headers if network_device_images_count_info.headers is not none else omit }}"
        managementAddress: "{{ network_device_images_count_info.managementAddress if network_device_images_count_info.managementAddress is not none else omit }}"
        networkDeviceImageStatus: "{{ network_device_images_count_info.networkDeviceImageStatus if network_device_images_count_info.networkDeviceImageStatus is not none else omit }}"
        networkDeviceUpdateStatus: "{{ network_device_images_count_info.networkDeviceUpdateStatus if network_device_images_count_info.networkDeviceUpdateStatus is not none else omit }}"
        productId: "{{ network_device_images_count_info.productId if network_device_images_count_info.productId is not none else omit }}"
        productName: "{{ network_device_images_count_info.productName if network_device_images_count_info.productName is not none else omit }}"
        role: "{{ network_device_images_count_info.role if network_device_images_count_info.role is not none else omit }}"
        siteId: "{{ network_device_images_count_info.siteId if network_device_images_count_info.siteId is not none else omit }}"
        validate_response_schema: "{{ network_device_images_count_info.validate_response_schema if network_device_images_count_info.validate_response_schema is not none else omit }}"
      register: network_device_images_count_info_result
