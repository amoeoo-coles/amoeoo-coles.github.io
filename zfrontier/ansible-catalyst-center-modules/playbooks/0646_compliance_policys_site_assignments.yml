---
# Sample playbook for cisco.catalystcenter.compliance_policys_site_assignments (cisco.catalystcenter 2.15.0)
# Build order: 646
# Resource module for Compliance Policys Site Assignments
# Reads ../models/compliance_policys_site_assignments.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_policys_site_assignments_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_policys_site_assignments.

- name: "0646 compliance_policys_site_assignments"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_policys_site_assignments.yml
  tasks:
    - name: Run compliance_policys_site_assignments from its model
      cisco.catalystcenter.compliance_policys_site_assignments:
        catalystcenter_debug: "{{ compliance_policys_site_assignments.catalystcenter_debug if compliance_policys_site_assignments.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_policys_site_assignments.catalystcenter_host if compliance_policys_site_assignments.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_policys_site_assignments.catalystcenter_password if compliance_policys_site_assignments.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_policys_site_assignments.catalystcenter_port if compliance_policys_site_assignments.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_policys_site_assignments.catalystcenter_username if compliance_policys_site_assignments.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_policys_site_assignments.catalystcenter_verify if compliance_policys_site_assignments.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_policys_site_assignments.catalystcenter_version if compliance_policys_site_assignments.catalystcenter_version is not none else omit }}"
        policyId: "{{ compliance_policys_site_assignments.policyId if compliance_policys_site_assignments.policyId is not none else omit }}"
        siteIds: "{{ (compliance_policys_site_assignments.siteIds | cat_strip_nulls) if (compliance_policys_site_assignments.siteIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ compliance_policys_site_assignments.validate_response_schema if compliance_policys_site_assignments.validate_response_schema is not none else omit }}"
      register: compliance_policys_site_assignments_result
      tags:
        - never
        - compliance_policys_site_assignments
