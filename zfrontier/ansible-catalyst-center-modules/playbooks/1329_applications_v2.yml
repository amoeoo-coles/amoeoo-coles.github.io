---
# Sample playbook for cisco.catalystcenter.applications_v2 (cisco.catalystcenter 2.15.0)
# Build order: 1329
# Resource module for Applications V2
# Reads ../models/applications_v2.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/applications_v2_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags applications_v2.

- name: "1329 applications_v2"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/applications_v2.yml
  tasks:
    - name: Run applications_v2 from its model
      cisco.catalystcenter.applications_v2:
        catalystcenter_debug: "{{ applications_v2.catalystcenter_debug if applications_v2.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ applications_v2.catalystcenter_host if applications_v2.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ applications_v2.catalystcenter_password if applications_v2.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ applications_v2.catalystcenter_port if applications_v2.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ applications_v2.catalystcenter_username if applications_v2.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ applications_v2.catalystcenter_verify if applications_v2.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ applications_v2.catalystcenter_version if applications_v2.catalystcenter_version is not none else omit }}"
        id: "{{ applications_v2.id if applications_v2.id is not none else omit }}"
        payload: "{{ (applications_v2.payload | cat_strip_nulls) if (applications_v2.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ applications_v2.validate_response_schema if applications_v2.validate_response_schema is not none else omit }}"
      register: applications_v2_result
      tags:
        - never
        - applications_v2
