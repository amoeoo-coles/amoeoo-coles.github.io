---
# Sample playbook for cisco.catalystcenter.sda_port_assignment_for_user_device (cisco.catalystcenter 2.15.0)
# Build order: 753
# Resource module for Sda Port Assignment For User Device
# Reads ../models/sda_port_assignment_for_user_device.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_port_assignment_for_user_device_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_port_assignment_for_user_device.

- name: "0753 sda_port_assignment_for_user_device"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_port_assignment_for_user_device.yml
  tasks:
    - name: Run sda_port_assignment_for_user_device from its model
      cisco.catalystcenter.sda_port_assignment_for_user_device:
        authenticateTemplateName: "{{ sda_port_assignment_for_user_device.authenticateTemplateName if sda_port_assignment_for_user_device.authenticateTemplateName is not none else omit }}"
        catalystcenter_debug: "{{ sda_port_assignment_for_user_device.catalystcenter_debug if sda_port_assignment_for_user_device.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_port_assignment_for_user_device.catalystcenter_host if sda_port_assignment_for_user_device.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_port_assignment_for_user_device.catalystcenter_password if sda_port_assignment_for_user_device.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_port_assignment_for_user_device.catalystcenter_port if sda_port_assignment_for_user_device.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_port_assignment_for_user_device.catalystcenter_username if sda_port_assignment_for_user_device.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_port_assignment_for_user_device.catalystcenter_verify if sda_port_assignment_for_user_device.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_port_assignment_for_user_device.catalystcenter_version if sda_port_assignment_for_user_device.catalystcenter_version is not none else omit }}"
        dataIpAddressPoolName: "{{ sda_port_assignment_for_user_device.dataIpAddressPoolName if sda_port_assignment_for_user_device.dataIpAddressPoolName is not none else omit }}"
        deviceManagementIpAddress: "{{ sda_port_assignment_for_user_device.deviceManagementIpAddress if sda_port_assignment_for_user_device.deviceManagementIpAddress is not none else omit }}"
        interfaceDescription: "{{ sda_port_assignment_for_user_device.interfaceDescription if sda_port_assignment_for_user_device.interfaceDescription is not none else omit }}"
        interfaceName: "{{ sda_port_assignment_for_user_device.interfaceName if sda_port_assignment_for_user_device.interfaceName is not none else omit }}"
        interfaceNames: "{{ (sda_port_assignment_for_user_device.interfaceNames | cat_strip_nulls) if (sda_port_assignment_for_user_device.interfaceNames | cat_strip_nulls) is not none else omit }}"
        scalableGroupName: "{{ sda_port_assignment_for_user_device.scalableGroupName if sda_port_assignment_for_user_device.scalableGroupName is not none else omit }}"
        siteNameHierarchy: "{{ sda_port_assignment_for_user_device.siteNameHierarchy if sda_port_assignment_for_user_device.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ sda_port_assignment_for_user_device.validate_response_schema if sda_port_assignment_for_user_device.validate_response_schema is not none else omit }}"
        voiceIpAddressPoolName: "{{ sda_port_assignment_for_user_device.voiceIpAddressPoolName if sda_port_assignment_for_user_device.voiceIpAddressPoolName is not none else omit }}"
      register: sda_port_assignment_for_user_device_result
      tags:
        - never
        - sda_port_assignment_for_user_device
