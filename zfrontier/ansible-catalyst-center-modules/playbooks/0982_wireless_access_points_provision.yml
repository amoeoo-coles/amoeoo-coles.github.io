---
# Sample playbook for cisco.catalystcenter.wireless_access_points_provision (cisco.catalystcenter 2.15.0)
# Build order: 982
# Resource module for Wireless Access Points Provision
# Reads ../models/wireless_access_points_provision.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_access_points_provision_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_access_points_provision.

- name: "0982 wireless_access_points_provision"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_access_points_provision.yml
  tasks:
    - name: Run wireless_access_points_provision from its model
      cisco.catalystcenter.wireless_access_points_provision:
        apZoneName: "{{ wireless_access_points_provision.apZoneName if wireless_access_points_provision.apZoneName is not none else omit }}"
        catalystcenter_debug: "{{ wireless_access_points_provision.catalystcenter_debug if wireless_access_points_provision.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_access_points_provision.catalystcenter_host if wireless_access_points_provision.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_access_points_provision.catalystcenter_password if wireless_access_points_provision.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_access_points_provision.catalystcenter_port if wireless_access_points_provision.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_access_points_provision.catalystcenter_username if wireless_access_points_provision.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_access_points_provision.catalystcenter_verify if wireless_access_points_provision.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_access_points_provision.catalystcenter_version if wireless_access_points_provision.catalystcenter_version is not none else omit }}"
        networkDevices: "{{ (wireless_access_points_provision.networkDevices | cat_strip_nulls) if (wireless_access_points_provision.networkDevices | cat_strip_nulls) is not none else omit }}"
        rfProfileName: "{{ wireless_access_points_provision.rfProfileName if wireless_access_points_provision.rfProfileName is not none else omit }}"
        siteId: "{{ wireless_access_points_provision.siteId if wireless_access_points_provision.siteId is not none else omit }}"
        validate_response_schema: "{{ wireless_access_points_provision.validate_response_schema if wireless_access_points_provision.validate_response_schema is not none else omit }}"
      register: wireless_access_points_provision_result
      tags:
        - never
        - wireless_access_points_provision
