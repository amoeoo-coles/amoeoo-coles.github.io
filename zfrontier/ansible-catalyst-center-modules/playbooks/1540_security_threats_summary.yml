---
# Sample playbook for cisco.catalystcenter.security_threats_summary (cisco.catalystcenter 2.15.0)
# Build order: 1540
# Resource module for Security Threats Summary
# Reads ../models/security_threats_summary.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_threats_summary_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_threats_summary.

- name: "1540 security_threats_summary"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_threats_summary.yml
  tasks:
    - name: Run security_threats_summary from its model
      cisco.catalystcenter.security_threats_summary:
        catalystcenter_debug: "{{ security_threats_summary.catalystcenter_debug if security_threats_summary.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_threats_summary.catalystcenter_host if security_threats_summary.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_threats_summary.catalystcenter_password if security_threats_summary.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_threats_summary.catalystcenter_port if security_threats_summary.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_threats_summary.catalystcenter_username if security_threats_summary.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_threats_summary.catalystcenter_verify if security_threats_summary.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_threats_summary.catalystcenter_version if security_threats_summary.catalystcenter_version is not none else omit }}"
        endTime: "{{ security_threats_summary.endTime if security_threats_summary.endTime is not none else omit }}"
        siteId: "{{ (security_threats_summary.siteId | cat_strip_nulls) if (security_threats_summary.siteId | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ security_threats_summary.startTime if security_threats_summary.startTime is not none else omit }}"
        threatLevel: "{{ (security_threats_summary.threatLevel | cat_strip_nulls) if (security_threats_summary.threatLevel | cat_strip_nulls) is not none else omit }}"
        threatType: "{{ (security_threats_summary.threatType | cat_strip_nulls) if (security_threats_summary.threatType | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ security_threats_summary.validate_response_schema if security_threats_summary.validate_response_schema is not none else omit }}"
      register: security_threats_summary_result
      tags:
        - never
        - security_threats_summary
