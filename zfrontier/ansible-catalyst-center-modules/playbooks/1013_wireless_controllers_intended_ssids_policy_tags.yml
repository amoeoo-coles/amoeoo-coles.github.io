---
# Sample playbook for cisco.catalystcenter.wireless_controllers_intended_ssids_policy_tags (cisco.catalystcenter 2.15.0)
# Build order: 1013
# Resource module for Wireless Controllers Intended Ssids Policy Tags
# Reads ../models/wireless_controllers_intended_ssids_policy_tags.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_intended_ssids_policy_tags_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_intended_ssids_policy_tags.

- name: "1013 wireless_controllers_intended_ssids_policy_tags"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_intended_ssids_policy_tags.yml
  tasks:
    - name: Run wireless_controllers_intended_ssids_policy_tags from its model
      cisco.catalystcenter.wireless_controllers_intended_ssids_policy_tags:
        catalystcenter_debug: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_debug if wireless_controllers_intended_ssids_policy_tags.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_host if wireless_controllers_intended_ssids_policy_tags.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_password if wireless_controllers_intended_ssids_policy_tags.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_port if wireless_controllers_intended_ssids_policy_tags.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_username if wireless_controllers_intended_ssids_policy_tags.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_verify if wireless_controllers_intended_ssids_policy_tags.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_intended_ssids_policy_tags.catalystcenter_version if wireless_controllers_intended_ssids_policy_tags.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_controllers_intended_ssids_policy_tags.id if wireless_controllers_intended_ssids_policy_tags.id is not none else omit }}"
        networkDeviceId: "{{ wireless_controllers_intended_ssids_policy_tags.networkDeviceId if wireless_controllers_intended_ssids_policy_tags.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_intended_ssids_policy_tags.validate_response_schema if wireless_controllers_intended_ssids_policy_tags.validate_response_schema is not none else omit }}"
      register: wireless_controllers_intended_ssids_policy_tags_result
      tags:
        - never
        - wireless_controllers_intended_ssids_policy_tags
