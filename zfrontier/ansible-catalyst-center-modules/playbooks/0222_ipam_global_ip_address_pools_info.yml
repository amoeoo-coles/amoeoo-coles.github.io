---
# Sample playbook for cisco.catalystcenter.ipam_global_ip_address_pools_info (cisco.catalystcenter 2.15.0)
# Build order: 222
# Information module for Ipam Global Ip Address Pools
# Reads ../models/ipam_global_ip_address_pools_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ipam_global_ip_address_pools_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0222 ipam_global_ip_address_pools_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipam_global_ip_address_pools_info.yml
  tasks:
    - name: Run ipam_global_ip_address_pools_info from its model
      cisco.catalystcenter.ipam_global_ip_address_pools_info:
        catalystcenter_debug: "{{ ipam_global_ip_address_pools_info.catalystcenter_debug if ipam_global_ip_address_pools_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ipam_global_ip_address_pools_info.catalystcenter_host if ipam_global_ip_address_pools_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ ipam_global_ip_address_pools_info.catalystcenter_password if ipam_global_ip_address_pools_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ipam_global_ip_address_pools_info.catalystcenter_port if ipam_global_ip_address_pools_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ ipam_global_ip_address_pools_info.catalystcenter_username if ipam_global_ip_address_pools_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ipam_global_ip_address_pools_info.catalystcenter_verify if ipam_global_ip_address_pools_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ipam_global_ip_address_pools_info.catalystcenter_version if ipam_global_ip_address_pools_info.catalystcenter_version is not none else omit }}"
        headers: "{{ ipam_global_ip_address_pools_info.headers if ipam_global_ip_address_pools_info.headers is not none else omit }}"
        id: "{{ ipam_global_ip_address_pools_info.id if ipam_global_ip_address_pools_info.id is not none else omit }}"
        limit: "{{ ipam_global_ip_address_pools_info.limit if ipam_global_ip_address_pools_info.limit is not none else omit }}"
        offset: "{{ ipam_global_ip_address_pools_info.offset if ipam_global_ip_address_pools_info.offset is not none else omit }}"
        order: "{{ ipam_global_ip_address_pools_info.order if ipam_global_ip_address_pools_info.order is not none else omit }}"
        sortBy: "{{ ipam_global_ip_address_pools_info.sortBy if ipam_global_ip_address_pools_info.sortBy is not none else omit }}"
        validate_response_schema: "{{ ipam_global_ip_address_pools_info.validate_response_schema if ipam_global_ip_address_pools_info.validate_response_schema is not none else omit }}"
      register: ipam_global_ip_address_pools_info_result
