---
# Sample playbook for cisco.catalystcenter.configuration_template_clone (cisco.catalystcenter 2.15.0)
# Build order: 590
# Resource module for Configuration Template Clone
# Reads ../models/configuration_template_clone.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_clone_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags configuration_template_clone.

- name: "0590 configuration_template_clone"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_clone.yml
  tasks:
    - name: Run configuration_template_clone from its model
      cisco.catalystcenter.configuration_template_clone:
        catalystcenter_debug: "{{ configuration_template_clone.catalystcenter_debug if configuration_template_clone.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_clone.catalystcenter_host if configuration_template_clone.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_clone.catalystcenter_password if configuration_template_clone.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_clone.catalystcenter_port if configuration_template_clone.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_clone.catalystcenter_username if configuration_template_clone.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_clone.catalystcenter_verify if configuration_template_clone.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_clone.catalystcenter_version if configuration_template_clone.catalystcenter_version is not none else omit }}"
        name: "{{ configuration_template_clone.name if configuration_template_clone.name is not none else omit }}"
        projectId: "{{ configuration_template_clone.projectId if configuration_template_clone.projectId is not none else omit }}"
        templateId: "{{ configuration_template_clone.templateId if configuration_template_clone.templateId is not none else omit }}"
        validate_response_schema: "{{ configuration_template_clone.validate_response_schema if configuration_template_clone.validate_response_schema is not none else omit }}"
      register: configuration_template_clone_result
      tags:
        - never
        - configuration_template_clone
