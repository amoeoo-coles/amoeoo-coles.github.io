---
# Sample playbook for cisco.catalystcenter.ipam_site_ip_address_pools_count_info (cisco.catalystcenter 2.15.0)
# Build order: 223
# Information module for Ipam Site Ip Address Pools Count
# Reads ../models/ipam_site_ip_address_pools_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ipam_site_ip_address_pools_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0223 ipam_site_ip_address_pools_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ipam_site_ip_address_pools_count_info.yml
  tasks:
    - name: Run ipam_site_ip_address_pools_count_info from its model
      cisco.catalystcenter.ipam_site_ip_address_pools_count_info:
        catalystcenter_debug: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_debug if ipam_site_ip_address_pools_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_host if ipam_site_ip_address_pools_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_password if ipam_site_ip_address_pools_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_port if ipam_site_ip_address_pools_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_username if ipam_site_ip_address_pools_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_verify if ipam_site_ip_address_pools_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ipam_site_ip_address_pools_count_info.catalystcenter_version if ipam_site_ip_address_pools_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ ipam_site_ip_address_pools_count_info.headers if ipam_site_ip_address_pools_count_info.headers is not none else omit }}"
        siteId: "{{ ipam_site_ip_address_pools_count_info.siteId if ipam_site_ip_address_pools_count_info.siteId is not none else omit }}"
        validate_response_schema: "{{ ipam_site_ip_address_pools_count_info.validate_response_schema if ipam_site_ip_address_pools_count_info.validate_response_schema is not none else omit }}"
      register: ipam_site_ip_address_pools_count_info_result
