---
# Sample playbook for cisco.catalystcenter.app_policy_intent_create (cisco.catalystcenter 2.15.0)
# Build order: 1320
# Resource module for App Policy Intent Create
# Reads ../models/app_policy_intent_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/app_policy_intent_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags app_policy_intent_create.

- name: "1320 app_policy_intent_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/app_policy_intent_create.yml
  tasks:
    - name: Run app_policy_intent_create from its model
      cisco.catalystcenter.app_policy_intent_create:
        catalystcenter_debug: "{{ app_policy_intent_create.catalystcenter_debug if app_policy_intent_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ app_policy_intent_create.catalystcenter_host if app_policy_intent_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ app_policy_intent_create.catalystcenter_password if app_policy_intent_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ app_policy_intent_create.catalystcenter_port if app_policy_intent_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ app_policy_intent_create.catalystcenter_username if app_policy_intent_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ app_policy_intent_create.catalystcenter_verify if app_policy_intent_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ app_policy_intent_create.catalystcenter_version if app_policy_intent_create.catalystcenter_version is not none else omit }}"
        createList: "{{ (app_policy_intent_create.createList | cat_strip_nulls) if (app_policy_intent_create.createList | cat_strip_nulls) is not none else omit }}"
        deleteList: "{{ (app_policy_intent_create.deleteList | cat_strip_nulls) if (app_policy_intent_create.deleteList | cat_strip_nulls) is not none else omit }}"
        updateList: "{{ (app_policy_intent_create.updateList | cat_strip_nulls) if (app_policy_intent_create.updateList | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ app_policy_intent_create.validate_response_schema if app_policy_intent_create.validate_response_schema is not none else omit }}"
      register: app_policy_intent_create_result
      tags:
        - never
        - app_policy_intent_create
