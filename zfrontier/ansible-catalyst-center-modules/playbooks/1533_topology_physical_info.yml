---
# Sample playbook for cisco.catalystcenter.topology_physical_info (cisco.catalystcenter 2.15.0)
# Build order: 1533
# Information module for Topology Physical
# Reads ../models/topology_physical_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/topology_physical_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1533 topology_physical_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/topology_physical_info.yml
  tasks:
    - name: Run topology_physical_info from its model
      cisco.catalystcenter.topology_physical_info:
        catalystcenter_debug: "{{ topology_physical_info.catalystcenter_debug if topology_physical_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ topology_physical_info.catalystcenter_host if topology_physical_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ topology_physical_info.catalystcenter_password if topology_physical_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ topology_physical_info.catalystcenter_port if topology_physical_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ topology_physical_info.catalystcenter_username if topology_physical_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ topology_physical_info.catalystcenter_verify if topology_physical_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ topology_physical_info.catalystcenter_version if topology_physical_info.catalystcenter_version is not none else omit }}"
        headers: "{{ topology_physical_info.headers if topology_physical_info.headers is not none else omit }}"
        nodeType: "{{ topology_physical_info.nodeType if topology_physical_info.nodeType is not none else omit }}"
        validate_response_schema: "{{ topology_physical_info.validate_response_schema if topology_physical_info.validate_response_schema is not none else omit }}"
      register: topology_physical_info_result
