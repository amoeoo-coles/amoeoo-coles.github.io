---
# Sample playbook for cisco.catalystcenter.aaa_services_query_count (cisco.catalystcenter 2.15.0)
# Build order: 297
# Resource module for Aaa Services Query Count
# Reads ../models/aaa_services_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/aaa_services_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags aaa_services_query_count.

- name: "0297 aaa_services_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/aaa_services_query_count.yml
  tasks:
    - name: Run aaa_services_query_count from its model
      cisco.catalystcenter.aaa_services_query_count:
        catalystcenter_debug: "{{ aaa_services_query_count.catalystcenter_debug if aaa_services_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ aaa_services_query_count.catalystcenter_host if aaa_services_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ aaa_services_query_count.catalystcenter_password if aaa_services_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ aaa_services_query_count.catalystcenter_port if aaa_services_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ aaa_services_query_count.catalystcenter_username if aaa_services_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ aaa_services_query_count.catalystcenter_verify if aaa_services_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ aaa_services_query_count.catalystcenter_version if aaa_services_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ aaa_services_query_count.endTime if aaa_services_query_count.endTime is not none else omit }}"
        filters: "{{ (aaa_services_query_count.filters | cat_strip_nulls) if (aaa_services_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ aaa_services_query_count.headers if aaa_services_query_count.headers is not none else omit }}"
        startTime: "{{ aaa_services_query_count.startTime if aaa_services_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ aaa_services_query_count.validate_response_schema if aaa_services_query_count.validate_response_schema is not none else omit }}"
      register: aaa_services_query_count_result
      tags:
        - never
        - aaa_services_query_count
