---
# Sample playbook for cisco.catalystcenter.global_credential_update (cisco.catalystcenter 2.15.0)
# Build order: 274
# Resource module for Global Credential Update
# Reads ../models/global_credential_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/global_credential_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags global_credential_update.

- name: "0274 global_credential_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/global_credential_update.yml
  tasks:
    - name: Run global_credential_update from its model
      cisco.catalystcenter.global_credential_update:
        catalystcenter_debug: "{{ global_credential_update.catalystcenter_debug if global_credential_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ global_credential_update.catalystcenter_host if global_credential_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ global_credential_update.catalystcenter_password if global_credential_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ global_credential_update.catalystcenter_port if global_credential_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ global_credential_update.catalystcenter_username if global_credential_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ global_credential_update.catalystcenter_verify if global_credential_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ global_credential_update.catalystcenter_version if global_credential_update.catalystcenter_version is not none else omit }}"
        globalCredentialId: "{{ global_credential_update.globalCredentialId if global_credential_update.globalCredentialId is not none else omit }}"
        siteUuids: "{{ (global_credential_update.siteUuids | cat_strip_nulls) if (global_credential_update.siteUuids | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ global_credential_update.validate_response_schema if global_credential_update.validate_response_schema is not none else omit }}"
      register: global_credential_update_result
      tags:
        - never
        - global_credential_update
