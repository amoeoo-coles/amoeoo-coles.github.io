---
# Sample playbook for cisco.catalystcenter.maps_import_perform (cisco.catalystcenter 2.15.0)
# Build order: 110
# Resource module for Maps Import Perform
# Reads ../models/maps_import_perform.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/maps_import_perform_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags maps_import_perform.

- name: "0110 maps_import_perform"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/maps_import_perform.yml
  tasks:
    - name: Run maps_import_perform from its model
      cisco.catalystcenter.maps_import_perform:
        catalystcenter_debug: "{{ maps_import_perform.catalystcenter_debug if maps_import_perform.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ maps_import_perform.catalystcenter_host if maps_import_perform.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ maps_import_perform.catalystcenter_password if maps_import_perform.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ maps_import_perform.catalystcenter_port if maps_import_perform.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ maps_import_perform.catalystcenter_username if maps_import_perform.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ maps_import_perform.catalystcenter_verify if maps_import_perform.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ maps_import_perform.catalystcenter_version if maps_import_perform.catalystcenter_version is not none else omit }}"
        importContextUuid: "{{ maps_import_perform.importContextUuid if maps_import_perform.importContextUuid is not none else omit }}"
        validate_response_schema: "{{ maps_import_perform.validate_response_schema if maps_import_perform.validate_response_schema is not none else omit }}"
      register: maps_import_perform_result
      tags:
        - never
        - maps_import_perform
