---
# Sample playbook for cisco.catalystcenter.feature_templates_wireless_summary_info (cisco.catalystcenter 2.15.0)
# Build order: 1071
# Information module for Feature Templates Wireless Summary
# Reads ../models/feature_templates_wireless_summary_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/feature_templates_wireless_summary_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1071 feature_templates_wireless_summary_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/feature_templates_wireless_summary_info.yml
  tasks:
    - name: Run feature_templates_wireless_summary_info from its model
      cisco.catalystcenter.feature_templates_wireless_summary_info:
        catalystcenter_debug: "{{ feature_templates_wireless_summary_info.catalystcenter_debug if feature_templates_wireless_summary_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ feature_templates_wireless_summary_info.catalystcenter_host if feature_templates_wireless_summary_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ feature_templates_wireless_summary_info.catalystcenter_password if feature_templates_wireless_summary_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ feature_templates_wireless_summary_info.catalystcenter_port if feature_templates_wireless_summary_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ feature_templates_wireless_summary_info.catalystcenter_username if feature_templates_wireless_summary_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ feature_templates_wireless_summary_info.catalystcenter_verify if feature_templates_wireless_summary_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ feature_templates_wireless_summary_info.catalystcenter_version if feature_templates_wireless_summary_info.catalystcenter_version is not none else omit }}"
        designName: "{{ feature_templates_wireless_summary_info.designName if feature_templates_wireless_summary_info.designName is not none else omit }}"
        headers: "{{ feature_templates_wireless_summary_info.headers if feature_templates_wireless_summary_info.headers is not none else omit }}"
        limit: "{{ feature_templates_wireless_summary_info.limit if feature_templates_wireless_summary_info.limit is not none else omit }}"
        offset: "{{ feature_templates_wireless_summary_info.offset if feature_templates_wireless_summary_info.offset is not none else omit }}"
        systemTemplate: "{{ feature_templates_wireless_summary_info.systemTemplate if feature_templates_wireless_summary_info.systemTemplate is not none else omit }}"
        type: "{{ feature_templates_wireless_summary_info.type if feature_templates_wireless_summary_info.type is not none else omit }}"
        validate_response_schema: "{{ feature_templates_wireless_summary_info.validate_response_schema if feature_templates_wireless_summary_info.validate_response_schema is not none else omit }}"
      register: feature_templates_wireless_summary_info_result
