---
# Sample playbook for cisco.catalystcenter.wireless_controllers_wireless_mobility_groups_mobility_provision (cisco.catalystcenter 2.15.0)
# Build order: 1025
# Resource module for Wireless Controllers Wireless Mobility Groups Mobility Provision
# Reads ../models/wireless_controllers_wireless_mobility_groups_mobility_provision.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_wireless_mobility_groups_mobility_provision_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_wireless_mobility_groups_mobility_provision.

- name: "1025 wireless_controllers_wireless_mobility_groups_mobility_provision"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_wireless_mobility_groups_mobility_provision.yml
  tasks:
    - name: Run wireless_controllers_wireless_mobility_groups_mobility_provision from its model
      cisco.catalystcenter.wireless_controllers_wireless_mobility_groups_mobility_provision:
        catalystcenter_debug: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_debug if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_host if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_password if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_port if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_username if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_verify if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_version if wireless_controllers_wireless_mobility_groups_mobility_provision.catalystcenter_version is not none else omit }}"
        dataLinkEncryption: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.dataLinkEncryption if wireless_controllers_wireless_mobility_groups_mobility_provision.dataLinkEncryption is not none else omit }}"
        dtlsHighCipher: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.dtlsHighCipher if wireless_controllers_wireless_mobility_groups_mobility_provision.dtlsHighCipher is not none else omit }}"
        macAddress: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.macAddress if wireless_controllers_wireless_mobility_groups_mobility_provision.macAddress is not none else omit }}"
        managementIp: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.managementIp if wireless_controllers_wireless_mobility_groups_mobility_provision.managementIp is not none else omit }}"
        mobilityGroupName: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.mobilityGroupName if wireless_controllers_wireless_mobility_groups_mobility_provision.mobilityGroupName is not none else omit }}"
        mobilityPeers: "{{ (wireless_controllers_wireless_mobility_groups_mobility_provision.mobilityPeers | cat_strip_nulls) if (wireless_controllers_wireless_mobility_groups_mobility_provision.mobilityPeers | cat_strip_nulls) is not none else omit }}"
        networkDeviceId: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.networkDeviceId if wireless_controllers_wireless_mobility_groups_mobility_provision.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_wireless_mobility_groups_mobility_provision.validate_response_schema if wireless_controllers_wireless_mobility_groups_mobility_provision.validate_response_schema is not none else omit }}"
      register: wireless_controllers_wireless_mobility_groups_mobility_provision_result
      tags:
        - never
        - wireless_controllers_wireless_mobility_groups_mobility_provision
