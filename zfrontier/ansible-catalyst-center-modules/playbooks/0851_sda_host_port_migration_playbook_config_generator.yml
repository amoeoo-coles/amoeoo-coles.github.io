---
# Sample playbook for cisco.catalystcenter.sda_host_port_migration_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Build order: 851
# Generate SDA host port migration YAML configurations.
# Reads ../models/sda_host_port_migration_playbook_config_generator.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_host_port_migration_playbook_config_generator_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_host_port_migration_playbook_config_generator.

- name: "0851 sda_host_port_migration_playbook_config_generator"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_host_port_migration_playbook_config_generator.yml
  tasks:
    - name: Run sda_host_port_migration_playbook_config_generator from its model
      cisco.catalystcenter.sda_host_port_migration_playbook_config_generator:
        catalystcenter_api_task_timeout: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_api_task_timeout if sda_host_port_migration_playbook_config_generator.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_debug if sda_host_port_migration_playbook_config_generator.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_host if sda_host_port_migration_playbook_config_generator.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_log if sda_host_port_migration_playbook_config_generator.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_log_append if sda_host_port_migration_playbook_config_generator.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_log_file_path if sda_host_port_migration_playbook_config_generator.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_log_level if sda_host_port_migration_playbook_config_generator.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_password if sda_host_port_migration_playbook_config_generator.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_port if sda_host_port_migration_playbook_config_generator.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_task_poll_interval if sda_host_port_migration_playbook_config_generator.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_username if sda_host_port_migration_playbook_config_generator.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_verify if sda_host_port_migration_playbook_config_generator.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_host_port_migration_playbook_config_generator.catalystcenter_version if sda_host_port_migration_playbook_config_generator.catalystcenter_version is not none else omit }}"
        config: "{{ (sda_host_port_migration_playbook_config_generator.config | cat_strip_nulls) if (sda_host_port_migration_playbook_config_generator.config | cat_strip_nulls) is not none else omit }}"
        file_mode: "{{ sda_host_port_migration_playbook_config_generator.file_mode if sda_host_port_migration_playbook_config_generator.file_mode is not none else omit }}"
        file_path: "{{ sda_host_port_migration_playbook_config_generator.file_path if sda_host_port_migration_playbook_config_generator.file_path is not none else omit }}"
        state: "{{ sda_host_port_migration_playbook_config_generator.state if sda_host_port_migration_playbook_config_generator.state is not none else omit }}"
        validate_response_schema: "{{ sda_host_port_migration_playbook_config_generator.validate_response_schema if sda_host_port_migration_playbook_config_generator.validate_response_schema is not none else omit }}"
      register: sda_host_port_migration_playbook_config_generator_result
      tags:
        - never
        - sda_host_port_migration_playbook_config_generator
