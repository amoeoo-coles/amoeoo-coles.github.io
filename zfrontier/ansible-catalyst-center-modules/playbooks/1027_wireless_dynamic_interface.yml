---
# Sample playbook for cisco.catalystcenter.wireless_dynamic_interface (cisco.catalystcenter 2.15.0)
# Build order: 1027
# Resource module for Wireless Dynamic Interface
# Reads ../models/wireless_dynamic_interface.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_dynamic_interface_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_dynamic_interface.

- name: "1027 wireless_dynamic_interface"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_dynamic_interface.yml
  tasks:
    - name: Run wireless_dynamic_interface from its model
      cisco.catalystcenter.wireless_dynamic_interface:
        catalystcenter_debug: "{{ wireless_dynamic_interface.catalystcenter_debug if wireless_dynamic_interface.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_dynamic_interface.catalystcenter_host if wireless_dynamic_interface.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_dynamic_interface.catalystcenter_password if wireless_dynamic_interface.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_dynamic_interface.catalystcenter_port if wireless_dynamic_interface.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_dynamic_interface.catalystcenter_username if wireless_dynamic_interface.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_dynamic_interface.catalystcenter_verify if wireless_dynamic_interface.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_dynamic_interface.catalystcenter_version if wireless_dynamic_interface.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_dynamic_interface.headers if wireless_dynamic_interface.headers is not none else omit }}"
        interfaceName: "{{ wireless_dynamic_interface.interfaceName if wireless_dynamic_interface.interfaceName is not none else omit }}"
        validate_response_schema: "{{ wireless_dynamic_interface.validate_response_schema if wireless_dynamic_interface.validate_response_schema is not none else omit }}"
        vlanId: "{{ wireless_dynamic_interface.vlanId if wireless_dynamic_interface.vlanId is not none else omit }}"
      register: wireless_dynamic_interface_result
      tags:
        - never
        - wireless_dynamic_interface
