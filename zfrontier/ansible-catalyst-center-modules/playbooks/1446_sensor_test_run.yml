---
# Sample playbook for cisco.catalystcenter.sensor_test_run (cisco.catalystcenter 2.15.0)
# Build order: 1446
# Resource module for Sensor Test Run
# Reads ../models/sensor_test_run.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sensor_test_run_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sensor_test_run.

- name: "1446 sensor_test_run"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sensor_test_run.yml
  tasks:
    - name: Run sensor_test_run from its model
      cisco.catalystcenter.sensor_test_run:
        catalystcenter_debug: "{{ sensor_test_run.catalystcenter_debug if sensor_test_run.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sensor_test_run.catalystcenter_host if sensor_test_run.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sensor_test_run.catalystcenter_password if sensor_test_run.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sensor_test_run.catalystcenter_port if sensor_test_run.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sensor_test_run.catalystcenter_username if sensor_test_run.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sensor_test_run.catalystcenter_verify if sensor_test_run.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sensor_test_run.catalystcenter_version if sensor_test_run.catalystcenter_version is not none else omit }}"
        templateName: "{{ sensor_test_run.templateName if sensor_test_run.templateName is not none else omit }}"
        validate_response_schema: "{{ sensor_test_run.validate_response_schema if sensor_test_run.validate_response_schema is not none else omit }}"
      register: sensor_test_run_result
      tags:
        - never
        - sensor_test_run
