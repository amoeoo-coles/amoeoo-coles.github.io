---
# Sample playbook for cisco.catalystcenter.provisioning_settings_info (cisco.catalystcenter 2.15.0)
# Build order: 23
# Information module for Provisioning Settings
# Reads ../models/provisioning_settings_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/provisioning_settings_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0023 provisioning_settings_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/provisioning_settings_info.yml
  tasks:
    - name: Run provisioning_settings_info from its model
      cisco.catalystcenter.provisioning_settings_info:
        catalystcenter_debug: "{{ provisioning_settings_info.catalystcenter_debug if provisioning_settings_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ provisioning_settings_info.catalystcenter_host if provisioning_settings_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ provisioning_settings_info.catalystcenter_password if provisioning_settings_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ provisioning_settings_info.catalystcenter_port if provisioning_settings_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ provisioning_settings_info.catalystcenter_username if provisioning_settings_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ provisioning_settings_info.catalystcenter_verify if provisioning_settings_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ provisioning_settings_info.catalystcenter_version if provisioning_settings_info.catalystcenter_version is not none else omit }}"
        headers: "{{ provisioning_settings_info.headers if provisioning_settings_info.headers is not none else omit }}"
        validate_response_schema: "{{ provisioning_settings_info.validate_response_schema if provisioning_settings_info.validate_response_schema is not none else omit }}"
      register: provisioning_settings_info_result
