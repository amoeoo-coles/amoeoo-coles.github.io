---
# Sample playbook for cisco.catalystcenter.license_usage_info (cisco.catalystcenter 2.15.0)
# Build order: 530
# Information module for License Usage
# Reads ../models/license_usage_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/license_usage_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0530 license_usage_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/license_usage_info.yml
  tasks:
    - name: Run license_usage_info from its model
      cisco.catalystcenter.license_usage_info:
        catalystcenter_debug: "{{ license_usage_info.catalystcenter_debug if license_usage_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ license_usage_info.catalystcenter_host if license_usage_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ license_usage_info.catalystcenter_password if license_usage_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ license_usage_info.catalystcenter_port if license_usage_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ license_usage_info.catalystcenter_username if license_usage_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ license_usage_info.catalystcenter_verify if license_usage_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ license_usage_info.catalystcenter_version if license_usage_info.catalystcenter_version is not none else omit }}"
        headers: "{{ license_usage_info.headers if license_usage_info.headers is not none else omit }}"
        limit: "{{ license_usage_info.limit if license_usage_info.limit is not none else omit }}"
        offset: "{{ license_usage_info.offset if license_usage_info.offset is not none else omit }}"
        productFamily: "{{ license_usage_info.productFamily if license_usage_info.productFamily is not none else omit }}"
        smartAccountId: "{{ license_usage_info.smartAccountId if license_usage_info.smartAccountId is not none else omit }}"
        validate_response_schema: "{{ license_usage_info.validate_response_schema if license_usage_info.validate_response_schema is not none else omit }}"
        virtualAccountId: "{{ license_usage_info.virtualAccountId if license_usage_info.virtualAccountId is not none else omit }}"
      register: license_usage_info_result
