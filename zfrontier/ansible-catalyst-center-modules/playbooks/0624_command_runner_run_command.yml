---
# Sample playbook for cisco.catalystcenter.command_runner_run_command (cisco.catalystcenter 2.15.0)
# Build order: 624
# Resource module for Command Runner Run Command
# Reads ../models/command_runner_run_command.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/command_runner_run_command_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags command_runner_run_command.

- name: "0624 command_runner_run_command"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/command_runner_run_command.yml
  tasks:
    - name: Run command_runner_run_command from its model
      cisco.catalystcenter.command_runner_run_command:
        catalystcenter_debug: "{{ command_runner_run_command.catalystcenter_debug if command_runner_run_command.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ command_runner_run_command.catalystcenter_host if command_runner_run_command.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ command_runner_run_command.catalystcenter_password if command_runner_run_command.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ command_runner_run_command.catalystcenter_port if command_runner_run_command.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ command_runner_run_command.catalystcenter_username if command_runner_run_command.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ command_runner_run_command.catalystcenter_verify if command_runner_run_command.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ command_runner_run_command.catalystcenter_version if command_runner_run_command.catalystcenter_version is not none else omit }}"
        commands: "{{ (command_runner_run_command.commands | cat_strip_nulls) if (command_runner_run_command.commands | cat_strip_nulls) is not none else omit }}"
        description: "{{ command_runner_run_command.description if command_runner_run_command.description is not none else omit }}"
        deviceUuids: "{{ (command_runner_run_command.deviceUuids | cat_strip_nulls) if (command_runner_run_command.deviceUuids | cat_strip_nulls) is not none else omit }}"
        name: "{{ command_runner_run_command.name if command_runner_run_command.name is not none else omit }}"
        timeout: "{{ command_runner_run_command.timeout if command_runner_run_command.timeout is not none else omit }}"
        validate_response_schema: "{{ command_runner_run_command.validate_response_schema if command_runner_run_command.validate_response_schema is not none else omit }}"
      register: command_runner_run_command_result
      tags:
        - never
        - command_runner_run_command
