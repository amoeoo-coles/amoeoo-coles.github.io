---
# Sample playbook for cisco.catalystcenter.network_device_images_validations (cisco.catalystcenter 2.15.0)
# Build order: 557
# Resource module for Network Device Images Validations
# Reads ../models/network_device_images_validations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_images_validations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_images_validations.

- name: "0557 network_device_images_validations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_images_validations.yml
  tasks:
    - name: Run network_device_images_validations from its model
      cisco.catalystcenter.network_device_images_validations:
        catalystcenter_debug: "{{ network_device_images_validations.catalystcenter_debug if network_device_images_validations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_images_validations.catalystcenter_host if network_device_images_validations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_images_validations.catalystcenter_password if network_device_images_validations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_images_validations.catalystcenter_port if network_device_images_validations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_images_validations.catalystcenter_username if network_device_images_validations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_images_validations.catalystcenter_verify if network_device_images_validations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_images_validations.catalystcenter_version if network_device_images_validations.catalystcenter_version is not none else omit }}"
        cli: "{{ network_device_images_validations.cli if network_device_images_validations.cli is not none else omit }}"
        description: "{{ network_device_images_validations.description if network_device_images_validations.description is not none else omit }}"
        id: "{{ network_device_images_validations.id if network_device_images_validations.id is not none else omit }}"
        name: "{{ network_device_images_validations.name if network_device_images_validations.name is not none else omit }}"
        operationType: "{{ network_device_images_validations.operationType if network_device_images_validations.operationType is not none else omit }}"
        productSeriesOrdinals: "{{ (network_device_images_validations.productSeriesOrdinals | cat_strip_nulls) if (network_device_images_validations.productSeriesOrdinals | cat_strip_nulls) is not none else omit }}"
        type: "{{ network_device_images_validations.type if network_device_images_validations.type is not none else omit }}"
        validate_response_schema: "{{ network_device_images_validations.validate_response_schema if network_device_images_validations.validate_response_schema is not none else omit }}"
      register: network_device_images_validations_result
      tags:
        - never
        - network_device_images_validations
