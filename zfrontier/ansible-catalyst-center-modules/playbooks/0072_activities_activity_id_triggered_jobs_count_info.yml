---
# Sample playbook for cisco.catalystcenter.activities_activity_id_triggered_jobs_count_info (cisco.catalystcenter 2.15.0)
# Build order: 72
# Information module for Activities Activity Id Triggered Jobs Count
# Reads ../models/activities_activity_id_triggered_jobs_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/activities_activity_id_triggered_jobs_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0072 activities_activity_id_triggered_jobs_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/activities_activity_id_triggered_jobs_count_info.yml
  tasks:
    - name: Run activities_activity_id_triggered_jobs_count_info from its model
      cisco.catalystcenter.activities_activity_id_triggered_jobs_count_info:
        activityId: "{{ activities_activity_id_triggered_jobs_count_info.activityId if activities_activity_id_triggered_jobs_count_info.activityId is not none else omit }}"
        catalystcenter_debug: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_debug if activities_activity_id_triggered_jobs_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_host if activities_activity_id_triggered_jobs_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_password if activities_activity_id_triggered_jobs_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_port if activities_activity_id_triggered_jobs_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_username if activities_activity_id_triggered_jobs_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_verify if activities_activity_id_triggered_jobs_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ activities_activity_id_triggered_jobs_count_info.catalystcenter_version if activities_activity_id_triggered_jobs_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ activities_activity_id_triggered_jobs_count_info.headers if activities_activity_id_triggered_jobs_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ activities_activity_id_triggered_jobs_count_info.validate_response_schema if activities_activity_id_triggered_jobs_count_info.validate_response_schema is not none else omit }}"
      register: activities_activity_id_triggered_jobs_count_info_result
