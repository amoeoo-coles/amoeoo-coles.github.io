---
# Sample playbook for cisco.catalystcenter.download_software_release_create (cisco.catalystcenter 2.15.0)
# Build order: 24
# Resource module for Download Software Release Create
# Reads ../models/download_software_release_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/download_software_release_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags download_software_release_create.

- name: "0024 download_software_release_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/download_software_release_create.yml
  tasks:
    - name: Run download_software_release_create from its model
      cisco.catalystcenter.download_software_release_create:
        catalystcenter_debug: "{{ download_software_release_create.catalystcenter_debug if download_software_release_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ download_software_release_create.catalystcenter_host if download_software_release_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ download_software_release_create.catalystcenter_password if download_software_release_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ download_software_release_create.catalystcenter_port if download_software_release_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ download_software_release_create.catalystcenter_username if download_software_release_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ download_software_release_create.catalystcenter_verify if download_software_release_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ download_software_release_create.catalystcenter_version if download_software_release_create.catalystcenter_version is not none else omit }}"
        optionalPackages: "{{ (download_software_release_create.optionalPackages | cat_strip_nulls) if (download_software_release_create.optionalPackages | cat_strip_nulls) is not none else omit }}"
        releaseName: "{{ download_software_release_create.releaseName if download_software_release_create.releaseName is not none else omit }}"
        releaseVersion: "{{ download_software_release_create.releaseVersion if download_software_release_create.releaseVersion is not none else omit }}"
        validate_response_schema: "{{ download_software_release_create.validate_response_schema if download_software_release_create.validate_response_schema is not none else omit }}"
      register: download_software_release_create_result
      tags:
        - never
        - download_software_release_create
