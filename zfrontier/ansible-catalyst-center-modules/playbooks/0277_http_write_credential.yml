---
# Sample playbook for cisco.catalystcenter.http_write_credential (cisco.catalystcenter 2.15.0)
# Build order: 277
# Resource module for Http Write Credential
# Reads ../models/http_write_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/http_write_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags http_write_credential.

- name: "0277 http_write_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/http_write_credential.yml
  tasks:
    - name: Run http_write_credential from its model
      cisco.catalystcenter.http_write_credential:
        catalystcenter_debug: "{{ http_write_credential.catalystcenter_debug if http_write_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ http_write_credential.catalystcenter_host if http_write_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ http_write_credential.catalystcenter_password if http_write_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ http_write_credential.catalystcenter_port if http_write_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ http_write_credential.catalystcenter_username if http_write_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ http_write_credential.catalystcenter_verify if http_write_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ http_write_credential.catalystcenter_version if http_write_credential.catalystcenter_version is not none else omit }}"
        comments: "{{ http_write_credential.comments if http_write_credential.comments is not none else omit }}"
        credentialType: "{{ http_write_credential.credentialType if http_write_credential.credentialType is not none else omit }}"
        description: "{{ http_write_credential.description if http_write_credential.description is not none else omit }}"
        id: "{{ http_write_credential.id if http_write_credential.id is not none else omit }}"
        instanceTenantId: "{{ http_write_credential.instanceTenantId if http_write_credential.instanceTenantId is not none else omit }}"
        instanceUuid: "{{ http_write_credential.instanceUuid if http_write_credential.instanceUuid is not none else omit }}"
        password: "{{ http_write_credential.password if http_write_credential.password is not none else omit }}"
        port: "{{ http_write_credential.port if http_write_credential.port is not none else omit }}"
        secure: "{{ http_write_credential.secure if http_write_credential.secure is not none else omit }}"
        username: "{{ http_write_credential.username if http_write_credential.username is not none else omit }}"
        validate_response_schema: "{{ http_write_credential.validate_response_schema if http_write_credential.validate_response_schema is not none else omit }}"
      register: http_write_credential_result
      tags:
        - never
        - http_write_credential
