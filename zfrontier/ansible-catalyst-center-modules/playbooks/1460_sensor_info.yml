---
# Sample playbook for cisco.catalystcenter.sensor_info (cisco.catalystcenter 2.15.0)
# Build order: 1460
# Information module for Sensor
# Reads ../models/sensor_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sensor_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1460 sensor_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sensor_info.yml
  tasks:
    - name: Run sensor_info from its model
      cisco.catalystcenter.sensor_info:
        catalystcenter_debug: "{{ sensor_info.catalystcenter_debug if sensor_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sensor_info.catalystcenter_host if sensor_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sensor_info.catalystcenter_password if sensor_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sensor_info.catalystcenter_port if sensor_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sensor_info.catalystcenter_username if sensor_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sensor_info.catalystcenter_verify if sensor_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sensor_info.catalystcenter_version if sensor_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sensor_info.headers if sensor_info.headers is not none else omit }}"
        siteId: "{{ sensor_info.siteId if sensor_info.siteId is not none else omit }}"
        validate_response_schema: "{{ sensor_info.validate_response_schema if sensor_info.validate_response_schema is not none else omit }}"
      register: sensor_info_result
