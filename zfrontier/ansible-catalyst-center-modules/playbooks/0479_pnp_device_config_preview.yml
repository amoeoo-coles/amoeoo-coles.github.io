---
# Sample playbook for cisco.catalystcenter.pnp_device_config_preview (cisco.catalystcenter 2.15.0)
# Build order: 479
# Resource module for Pnp Device Config Preview
# Reads ../models/pnp_device_config_preview.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_config_preview_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_device_config_preview.

- name: "0479 pnp_device_config_preview"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_device_config_preview.yml
  tasks:
    - name: Run pnp_device_config_preview from its model
      cisco.catalystcenter.pnp_device_config_preview:
        catalystcenter_debug: "{{ pnp_device_config_preview.catalystcenter_debug if pnp_device_config_preview.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_device_config_preview.catalystcenter_host if pnp_device_config_preview.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_device_config_preview.catalystcenter_password if pnp_device_config_preview.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_device_config_preview.catalystcenter_port if pnp_device_config_preview.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_device_config_preview.catalystcenter_username if pnp_device_config_preview.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_device_config_preview.catalystcenter_verify if pnp_device_config_preview.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_device_config_preview.catalystcenter_version if pnp_device_config_preview.catalystcenter_version is not none else omit }}"
        deviceId: "{{ pnp_device_config_preview.deviceId if pnp_device_config_preview.deviceId is not none else omit }}"
        siteId: "{{ pnp_device_config_preview.siteId if pnp_device_config_preview.siteId is not none else omit }}"
        type: "{{ pnp_device_config_preview.type if pnp_device_config_preview.type is not none else omit }}"
        validate_response_schema: "{{ pnp_device_config_preview.validate_response_schema if pnp_device_config_preview.validate_response_schema is not none else omit }}"
      register: pnp_device_config_preview_result
      tags:
        - never
        - pnp_device_config_preview
