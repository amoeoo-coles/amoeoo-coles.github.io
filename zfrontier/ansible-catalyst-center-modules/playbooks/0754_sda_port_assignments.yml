---
# Sample playbook for cisco.catalystcenter.sda_port_assignments (cisco.catalystcenter 2.15.0)
# Build order: 754
# Resource module for Sda Port Assignments
# Reads ../models/sda_port_assignments.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_port_assignments_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_port_assignments.

- name: "0754 sda_port_assignments"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_port_assignments.yml
  tasks:
    - name: Run sda_port_assignments from its model
      cisco.catalystcenter.sda_port_assignments:
        catalystcenter_debug: "{{ sda_port_assignments.catalystcenter_debug if sda_port_assignments.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_port_assignments.catalystcenter_host if sda_port_assignments.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_port_assignments.catalystcenter_password if sda_port_assignments.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_port_assignments.catalystcenter_port if sda_port_assignments.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_port_assignments.catalystcenter_username if sda_port_assignments.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_port_assignments.catalystcenter_verify if sda_port_assignments.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_port_assignments.catalystcenter_version if sda_port_assignments.catalystcenter_version is not none else omit }}"
        dataVlanName: "{{ sda_port_assignments.dataVlanName if sda_port_assignments.dataVlanName is not none else omit }}"
        fabricId: "{{ sda_port_assignments.fabricId if sda_port_assignments.fabricId is not none else omit }}"
        id: "{{ sda_port_assignments.id if sda_port_assignments.id is not none else omit }}"
        interfaceName: "{{ sda_port_assignments.interfaceName if sda_port_assignments.interfaceName is not none else omit }}"
        networkDeviceId: "{{ sda_port_assignments.networkDeviceId if sda_port_assignments.networkDeviceId is not none else omit }}"
        payload: "{{ (sda_port_assignments.payload | cat_strip_nulls) if (sda_port_assignments.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ sda_port_assignments.validate_response_schema if sda_port_assignments.validate_response_schema is not none else omit }}"
        voiceVlanName: "{{ sda_port_assignments.voiceVlanName if sda_port_assignments.voiceVlanName is not none else omit }}"
      register: sda_port_assignments_result
      tags:
        - never
        - sda_port_assignments
