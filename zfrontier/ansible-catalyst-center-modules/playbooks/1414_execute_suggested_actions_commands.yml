---
# Sample playbook for cisco.catalystcenter.execute_suggested_actions_commands (cisco.catalystcenter 2.15.0)
# Build order: 1414
# Resource module for Execute Suggested Actions Commands
# Reads ../models/execute_suggested_actions_commands.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/execute_suggested_actions_commands_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags execute_suggested_actions_commands.

- name: "1414 execute_suggested_actions_commands"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/execute_suggested_actions_commands.yml
  tasks:
    - name: Run execute_suggested_actions_commands from its model
      cisco.catalystcenter.execute_suggested_actions_commands:
        catalystcenter_debug: "{{ execute_suggested_actions_commands.catalystcenter_debug if execute_suggested_actions_commands.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ execute_suggested_actions_commands.catalystcenter_host if execute_suggested_actions_commands.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ execute_suggested_actions_commands.catalystcenter_password if execute_suggested_actions_commands.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ execute_suggested_actions_commands.catalystcenter_port if execute_suggested_actions_commands.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ execute_suggested_actions_commands.catalystcenter_username if execute_suggested_actions_commands.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ execute_suggested_actions_commands.catalystcenter_verify if execute_suggested_actions_commands.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ execute_suggested_actions_commands.catalystcenter_version if execute_suggested_actions_commands.catalystcenter_version is not none else omit }}"
        entity_type: "{{ execute_suggested_actions_commands.entity_type if execute_suggested_actions_commands.entity_type is not none else omit }}"
        entity_value: "{{ execute_suggested_actions_commands.entity_value if execute_suggested_actions_commands.entity_value is not none else omit }}"
        validate_response_schema: "{{ execute_suggested_actions_commands.validate_response_schema if execute_suggested_actions_commands.validate_response_schema is not none else omit }}"
      register: execute_suggested_actions_commands_result
      tags:
        - never
        - execute_suggested_actions_commands
