---
# Sample playbook for cisco.catalystcenter.sda_fabrics_vlan_to_ssids_count_info (cisco.catalystcenter 2.15.0)
# Build order: 841
# Information module for Sda Fabrics Vlan To Ssids Count
# Reads ../models/sda_fabrics_vlan_to_ssids_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_fabrics_vlan_to_ssids_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0841 sda_fabrics_vlan_to_ssids_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_fabrics_vlan_to_ssids_count_info.yml
  tasks:
    - name: Run sda_fabrics_vlan_to_ssids_count_info from its model
      cisco.catalystcenter.sda_fabrics_vlan_to_ssids_count_info:
        catalystcenter_debug: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_debug if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_host if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_password if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_port if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_username if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_verify if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_fabrics_vlan_to_ssids_count_info.catalystcenter_version if sda_fabrics_vlan_to_ssids_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_fabrics_vlan_to_ssids_count_info.headers if sda_fabrics_vlan_to_ssids_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ sda_fabrics_vlan_to_ssids_count_info.validate_response_schema if sda_fabrics_vlan_to_ssids_count_info.validate_response_schema is not none else omit }}"
      register: sda_fabrics_vlan_to_ssids_count_info_result
