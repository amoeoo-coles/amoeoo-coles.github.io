---
# Sample playbook for cisco.catalystcenter.wireless_enterprise_ssid_info (cisco.catalystcenter 2.15.0)
# Build order: 1273
# Information module for Wireless Enterprise Ssid
# Reads ../models/wireless_enterprise_ssid_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_enterprise_ssid_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1273 wireless_enterprise_ssid_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_enterprise_ssid_info.yml
  tasks:
    - name: Run wireless_enterprise_ssid_info from its model
      cisco.catalystcenter.wireless_enterprise_ssid_info:
        catalystcenter_debug: "{{ wireless_enterprise_ssid_info.catalystcenter_debug if wireless_enterprise_ssid_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_enterprise_ssid_info.catalystcenter_host if wireless_enterprise_ssid_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_enterprise_ssid_info.catalystcenter_password if wireless_enterprise_ssid_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_enterprise_ssid_info.catalystcenter_port if wireless_enterprise_ssid_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_enterprise_ssid_info.catalystcenter_username if wireless_enterprise_ssid_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_enterprise_ssid_info.catalystcenter_verify if wireless_enterprise_ssid_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_enterprise_ssid_info.catalystcenter_version if wireless_enterprise_ssid_info.catalystcenter_version is not none else omit }}"
        headers: "{{ wireless_enterprise_ssid_info.headers if wireless_enterprise_ssid_info.headers is not none else omit }}"
        ssidName: "{{ wireless_enterprise_ssid_info.ssidName if wireless_enterprise_ssid_info.ssidName is not none else omit }}"
        validate_response_schema: "{{ wireless_enterprise_ssid_info.validate_response_schema if wireless_enterprise_ssid_info.validate_response_schema is not none else omit }}"
      register: wireless_enterprise_ssid_info_result
