---
# Sample playbook for cisco.catalystcenter.pnp_device_count_info (cisco.catalystcenter 2.15.0)
# Build order: 491
# Information module for Pnp Device Count
# Reads ../models/pnp_device_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0491 pnp_device_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_device_count_info.yml
  tasks:
    - name: Run pnp_device_count_info from its model
      cisco.catalystcenter.pnp_device_count_info:
        catalystcenter_debug: "{{ pnp_device_count_info.catalystcenter_debug if pnp_device_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_device_count_info.catalystcenter_host if pnp_device_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_device_count_info.catalystcenter_password if pnp_device_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_device_count_info.catalystcenter_port if pnp_device_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_device_count_info.catalystcenter_username if pnp_device_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_device_count_info.catalystcenter_verify if pnp_device_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_device_count_info.catalystcenter_version if pnp_device_count_info.catalystcenter_version is not none else omit }}"
        headers: "{{ pnp_device_count_info.headers if pnp_device_count_info.headers is not none else omit }}"
        lastContact: "{{ pnp_device_count_info.lastContact if pnp_device_count_info.lastContact is not none else omit }}"
        name: "{{ (pnp_device_count_info.name | cat_strip_nulls) if (pnp_device_count_info.name | cat_strip_nulls) is not none else omit }}"
        onbState: "{{ (pnp_device_count_info.onbState | cat_strip_nulls) if (pnp_device_count_info.onbState | cat_strip_nulls) is not none else omit }}"
        pid: "{{ (pnp_device_count_info.pid | cat_strip_nulls) if (pnp_device_count_info.pid | cat_strip_nulls) is not none else omit }}"
        serialNumber: "{{ (pnp_device_count_info.serialNumber | cat_strip_nulls) if (pnp_device_count_info.serialNumber | cat_strip_nulls) is not none else omit }}"
        smartAccountId: "{{ (pnp_device_count_info.smartAccountId | cat_strip_nulls) if (pnp_device_count_info.smartAccountId | cat_strip_nulls) is not none else omit }}"
        source: "{{ (pnp_device_count_info.source | cat_strip_nulls) if (pnp_device_count_info.source | cat_strip_nulls) is not none else omit }}"
        state_: "{{ (pnp_device_count_info.state_ | cat_strip_nulls) if (pnp_device_count_info.state_ | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ pnp_device_count_info.validate_response_schema if pnp_device_count_info.validate_response_schema is not none else omit }}"
        virtualAccountId: "{{ (pnp_device_count_info.virtualAccountId | cat_strip_nulls) if (pnp_device_count_info.virtualAccountId | cat_strip_nulls) is not none else omit }}"
        workflowId: "{{ (pnp_device_count_info.workflowId | cat_strip_nulls) if (pnp_device_count_info.workflowId | cat_strip_nulls) is not none else omit }}"
        workflowName: "{{ (pnp_device_count_info.workflowName | cat_strip_nulls) if (pnp_device_count_info.workflowName | cat_strip_nulls) is not none else omit }}"
      register: pnp_device_count_info_result
