---
# Sample playbook for cisco.catalystcenter.network_devices_resync_interval_settings (cisco.catalystcenter 2.15.0)
# Build order: 360
# Resource module for Network Devices Resync Interval Settings
# Reads ../models/network_devices_resync_interval_settings.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_devices_resync_interval_settings_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_devices_resync_interval_settings.

- name: "0360 network_devices_resync_interval_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_devices_resync_interval_settings.yml
  tasks:
    - name: Run network_devices_resync_interval_settings from its model
      cisco.catalystcenter.network_devices_resync_interval_settings:
        catalystcenter_debug: "{{ network_devices_resync_interval_settings.catalystcenter_debug if network_devices_resync_interval_settings.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_devices_resync_interval_settings.catalystcenter_host if network_devices_resync_interval_settings.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_devices_resync_interval_settings.catalystcenter_password if network_devices_resync_interval_settings.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_devices_resync_interval_settings.catalystcenter_port if network_devices_resync_interval_settings.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_devices_resync_interval_settings.catalystcenter_username if network_devices_resync_interval_settings.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_devices_resync_interval_settings.catalystcenter_verify if network_devices_resync_interval_settings.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_devices_resync_interval_settings.catalystcenter_version if network_devices_resync_interval_settings.catalystcenter_version is not none else omit }}"
        interval: "{{ network_devices_resync_interval_settings.interval if network_devices_resync_interval_settings.interval is not none else omit }}"
        validate_response_schema: "{{ network_devices_resync_interval_settings.validate_response_schema if network_devices_resync_interval_settings.validate_response_schema is not none else omit }}"
      register: network_devices_resync_interval_settings_result
      tags:
        - never
        - network_devices_resync_interval_settings
