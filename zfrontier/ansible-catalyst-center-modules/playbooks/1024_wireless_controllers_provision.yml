---
# Sample playbook for cisco.catalystcenter.wireless_controllers_provision (cisco.catalystcenter 2.15.0)
# Build order: 1024
# Resource module for Wireless Controllers Provision
# Reads ../models/wireless_controllers_provision.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_provision_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_provision.

- name: "1024 wireless_controllers_provision"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_provision.yml
  tasks:
    - name: Run wireless_controllers_provision from its model
      cisco.catalystcenter.wireless_controllers_provision:
        apAuthorizationListName: "{{ wireless_controllers_provision.apAuthorizationListName if wireless_controllers_provision.apAuthorizationListName is not none else omit }}"
        authorizeMeshAndNonMeshAccessPoints: "{{ wireless_controllers_provision.authorizeMeshAndNonMeshAccessPoints if wireless_controllers_provision.authorizeMeshAndNonMeshAccessPoints is not none else omit }}"
        catalystcenter_debug: "{{ wireless_controllers_provision.catalystcenter_debug if wireless_controllers_provision.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_provision.catalystcenter_host if wireless_controllers_provision.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_provision.catalystcenter_password if wireless_controllers_provision.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_provision.catalystcenter_port if wireless_controllers_provision.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_provision.catalystcenter_username if wireless_controllers_provision.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_provision.catalystcenter_verify if wireless_controllers_provision.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_provision.catalystcenter_version if wireless_controllers_provision.catalystcenter_version is not none else omit }}"
        deviceId: "{{ wireless_controllers_provision.deviceId if wireless_controllers_provision.deviceId is not none else omit }}"
        featureTemplatesOverridenAttributes: "{{ (wireless_controllers_provision.featureTemplatesOverridenAttributes | cat_strip_nulls) if (wireless_controllers_provision.featureTemplatesOverridenAttributes | cat_strip_nulls) is not none else omit }}"
        interfaces: "{{ (wireless_controllers_provision.interfaces | cat_strip_nulls) if (wireless_controllers_provision.interfaces | cat_strip_nulls) is not none else omit }}"
        lscPercentage: "{{ wireless_controllers_provision.lscPercentage if wireless_controllers_provision.lscPercentage is not none else omit }}"
        lscProfileName: "{{ wireless_controllers_provision.lscProfileName if wireless_controllers_provision.lscProfileName is not none else omit }}"
        natIpAddress: "{{ wireless_controllers_provision.natIpAddress if wireless_controllers_provision.natIpAddress is not none else omit }}"
        rollingApUpgrade: "{{ (wireless_controllers_provision.rollingApUpgrade | cat_strip_nulls) if (wireless_controllers_provision.rollingApUpgrade | cat_strip_nulls) is not none else omit }}"
        skipApProvision: "{{ wireless_controllers_provision.skipApProvision if wireless_controllers_provision.skipApProvision is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_provision.validate_response_schema if wireless_controllers_provision.validate_response_schema is not none else omit }}"
      register: wireless_controllers_provision_result
      tags:
        - never
        - wireless_controllers_provision
