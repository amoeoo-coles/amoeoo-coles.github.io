---
# Sample playbook for cisco.catalystcenter.sda_transit_networks_info (cisco.catalystcenter 2.15.0)
# Build order: 813
# Information module for Sda Transit Networks
# Reads ../models/sda_transit_networks_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_transit_networks_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0813 sda_transit_networks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_transit_networks_info.yml
  tasks:
    - name: Run sda_transit_networks_info from its model
      cisco.catalystcenter.sda_transit_networks_info:
        catalystcenter_debug: "{{ sda_transit_networks_info.catalystcenter_debug if sda_transit_networks_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_transit_networks_info.catalystcenter_host if sda_transit_networks_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ sda_transit_networks_info.catalystcenter_password if sda_transit_networks_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_transit_networks_info.catalystcenter_port if sda_transit_networks_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ sda_transit_networks_info.catalystcenter_username if sda_transit_networks_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_transit_networks_info.catalystcenter_verify if sda_transit_networks_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_transit_networks_info.catalystcenter_version if sda_transit_networks_info.catalystcenter_version is not none else omit }}"
        headers: "{{ sda_transit_networks_info.headers if sda_transit_networks_info.headers is not none else omit }}"
        id: "{{ sda_transit_networks_info.id if sda_transit_networks_info.id is not none else omit }}"
        limit: "{{ sda_transit_networks_info.limit if sda_transit_networks_info.limit is not none else omit }}"
        name: "{{ sda_transit_networks_info.name if sda_transit_networks_info.name is not none else omit }}"
        offset: "{{ sda_transit_networks_info.offset if sda_transit_networks_info.offset is not none else omit }}"
        type: "{{ sda_transit_networks_info.type if sda_transit_networks_info.type is not none else omit }}"
        validate_response_schema: "{{ sda_transit_networks_info.validate_response_schema if sda_transit_networks_info.validate_response_schema is not none else omit }}"
      register: sda_transit_networks_info_result
