---
# Sample playbook for cisco.catalystcenter.assurance_issues_query (cisco.catalystcenter 2.15.0)
# Build order: 1406
# Resource module for Assurance Issues Query
# Reads ../models/assurance_issues_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_issues_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assurance_issues_query.

- name: "1406 assurance_issues_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_issues_query.yml
  tasks:
    - name: Run assurance_issues_query from its model
      cisco.catalystcenter.assurance_issues_query:
        catalystcenter_debug: "{{ assurance_issues_query.catalystcenter_debug if assurance_issues_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_issues_query.catalystcenter_host if assurance_issues_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_issues_query.catalystcenter_password if assurance_issues_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_issues_query.catalystcenter_port if assurance_issues_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_issues_query.catalystcenter_username if assurance_issues_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_issues_query.catalystcenter_verify if assurance_issues_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_issues_query.catalystcenter_version if assurance_issues_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ assurance_issues_query.endTime if assurance_issues_query.endTime is not none else omit }}"
        filters: "{{ (assurance_issues_query.filters | cat_strip_nulls) if (assurance_issues_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ assurance_issues_query.headers if assurance_issues_query.headers is not none else omit }}"
        startTime: "{{ assurance_issues_query.startTime if assurance_issues_query.startTime is not none else omit }}"
        validate_response_schema: "{{ assurance_issues_query.validate_response_schema if assurance_issues_query.validate_response_schema is not none else omit }}"
      register: assurance_issues_query_result
      tags:
        - never
        - assurance_issues_query
