---
# Sample playbook for cisco.catalystcenter.service_provider_profile_delete (cisco.catalystcenter 2.15.0)
# Build order: 199
# Resource module for Service Provider Profile Delete
# Reads ../models/service_provider_profile_delete.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/service_provider_profile_delete_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags service_provider_profile_delete.

- name: "0199 service_provider_profile_delete"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/service_provider_profile_delete.yml
  tasks:
    - name: Run service_provider_profile_delete from its model
      cisco.catalystcenter.service_provider_profile_delete:
        catalystcenter_debug: "{{ service_provider_profile_delete.catalystcenter_debug if service_provider_profile_delete.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ service_provider_profile_delete.catalystcenter_host if service_provider_profile_delete.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ service_provider_profile_delete.catalystcenter_password if service_provider_profile_delete.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ service_provider_profile_delete.catalystcenter_port if service_provider_profile_delete.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ service_provider_profile_delete.catalystcenter_username if service_provider_profile_delete.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ service_provider_profile_delete.catalystcenter_verify if service_provider_profile_delete.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ service_provider_profile_delete.catalystcenter_version if service_provider_profile_delete.catalystcenter_version is not none else omit }}"
        spProfileName: "{{ service_provider_profile_delete.spProfileName if service_provider_profile_delete.spProfileName is not none else omit }}"
        validate_response_schema: "{{ service_provider_profile_delete.validate_response_schema if service_provider_profile_delete.validate_response_schema is not none else omit }}"
      register: service_provider_profile_delete_result
      tags:
        - never
        - service_provider_profile_delete
