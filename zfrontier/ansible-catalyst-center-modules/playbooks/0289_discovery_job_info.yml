---
# Sample playbook for cisco.catalystcenter.discovery_job_info (cisco.catalystcenter 2.15.0)
# Build order: 289
# Information module for Discovery Job
# Reads ../models/discovery_job_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_job_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0289 discovery_job_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_job_info.yml
  tasks:
    - name: Run discovery_job_info from its model
      cisco.catalystcenter.discovery_job_info:
        catalystcenter_debug: "{{ discovery_job_info.catalystcenter_debug if discovery_job_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_job_info.catalystcenter_host if discovery_job_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery_job_info.catalystcenter_password if discovery_job_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_job_info.catalystcenter_port if discovery_job_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery_job_info.catalystcenter_username if discovery_job_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_job_info.catalystcenter_verify if discovery_job_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_job_info.catalystcenter_version if discovery_job_info.catalystcenter_version is not none else omit }}"
        headers: "{{ discovery_job_info.headers if discovery_job_info.headers is not none else omit }}"
        id: "{{ discovery_job_info.id if discovery_job_info.id is not none else omit }}"
        ipAddress: "{{ discovery_job_info.ipAddress if discovery_job_info.ipAddress is not none else omit }}"
        limit: "{{ discovery_job_info.limit if discovery_job_info.limit is not none else omit }}"
        name: "{{ discovery_job_info.name if discovery_job_info.name is not none else omit }}"
        offset: "{{ discovery_job_info.offset if discovery_job_info.offset is not none else omit }}"
        validate_response_schema: "{{ discovery_job_info.validate_response_schema if discovery_job_info.validate_response_schema is not none else omit }}"
      register: discovery_job_info_result
