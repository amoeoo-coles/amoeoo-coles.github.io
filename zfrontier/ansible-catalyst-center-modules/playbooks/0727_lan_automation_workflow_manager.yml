---
# Sample playbook for cisco.catalystcenter.lan_automation_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 727
# Automate network discovery, deployment, and device configuration with LAN Automation in Cisco Catalyst Center.
# Reads ../models/lan_automation_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags lan_automation_workflow_manager.

- name: "0727 lan_automation_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_workflow_manager.yml
  tasks:
    - name: Run lan_automation_workflow_manager from its model
      cisco.catalystcenter.lan_automation_workflow_manager:
        catalystcenter_api_task_timeout: "{{ lan_automation_workflow_manager.catalystcenter_api_task_timeout if lan_automation_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ lan_automation_workflow_manager.catalystcenter_debug if lan_automation_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_workflow_manager.catalystcenter_host if lan_automation_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ lan_automation_workflow_manager.catalystcenter_log if lan_automation_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ lan_automation_workflow_manager.catalystcenter_log_append if lan_automation_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ lan_automation_workflow_manager.catalystcenter_log_file_path if lan_automation_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ lan_automation_workflow_manager.catalystcenter_log_level if lan_automation_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_workflow_manager.catalystcenter_password if lan_automation_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_workflow_manager.catalystcenter_port if lan_automation_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ lan_automation_workflow_manager.catalystcenter_task_poll_interval if lan_automation_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_workflow_manager.catalystcenter_username if lan_automation_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_workflow_manager.catalystcenter_verify if lan_automation_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_workflow_manager.catalystcenter_version if lan_automation_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (lan_automation_workflow_manager.config | cat_strip_nulls) if (lan_automation_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ lan_automation_workflow_manager.config_verify if lan_automation_workflow_manager.config_verify is not none else omit }}"
        state: "{{ lan_automation_workflow_manager.state if lan_automation_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ lan_automation_workflow_manager.validate_response_schema if lan_automation_workflow_manager.validate_response_schema is not none else omit }}"
      register: lan_automation_workflow_manager_result
      tags:
        - never
        - lan_automation_workflow_manager
