---
# Sample playbook for cisco.catalystcenter.excluded_wireless_clients_bulk_create (cisco.catalystcenter 2.15.0)
# Build order: 962
# Resource module for Excluded Wireless Clients Bulk Create
# Reads ../models/excluded_wireless_clients_bulk_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/excluded_wireless_clients_bulk_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags excluded_wireless_clients_bulk_create.

- name: "0962 excluded_wireless_clients_bulk_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/excluded_wireless_clients_bulk_create.yml
  tasks:
    - name: Run excluded_wireless_clients_bulk_create from its model
      cisco.catalystcenter.excluded_wireless_clients_bulk_create:
        catalystcenter_debug: "{{ excluded_wireless_clients_bulk_create.catalystcenter_debug if excluded_wireless_clients_bulk_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ excluded_wireless_clients_bulk_create.catalystcenter_host if excluded_wireless_clients_bulk_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ excluded_wireless_clients_bulk_create.catalystcenter_password if excluded_wireless_clients_bulk_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ excluded_wireless_clients_bulk_create.catalystcenter_port if excluded_wireless_clients_bulk_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ excluded_wireless_clients_bulk_create.catalystcenter_username if excluded_wireless_clients_bulk_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ excluded_wireless_clients_bulk_create.catalystcenter_verify if excluded_wireless_clients_bulk_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ excluded_wireless_clients_bulk_create.catalystcenter_version if excluded_wireless_clients_bulk_create.catalystcenter_version is not none else omit }}"
        items: "{{ (excluded_wireless_clients_bulk_create.items | cat_strip_nulls) if (excluded_wireless_clients_bulk_create.items | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ excluded_wireless_clients_bulk_create.validate_response_schema if excluded_wireless_clients_bulk_create.validate_response_schema is not none else omit }}"
      register: excluded_wireless_clients_bulk_create_result
      tags:
        - never
        - excluded_wireless_clients_bulk_create
