---
# Sample playbook for cisco.catalystcenter.issues_info (cisco.catalystcenter 2.15.0)
# Build order: 1423
# Information module for Issues
# Reads ../models/issues_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/issues_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1423 issues_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/issues_info.yml
  tasks:
    - name: Run issues_info from its model
      cisco.catalystcenter.issues_info:
        aiDriven: "{{ issues_info.aiDriven if issues_info.aiDriven is not none else omit }}"
        catalystcenter_debug: "{{ issues_info.catalystcenter_debug if issues_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ issues_info.catalystcenter_host if issues_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ issues_info.catalystcenter_password if issues_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ issues_info.catalystcenter_port if issues_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ issues_info.catalystcenter_username if issues_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ issues_info.catalystcenter_verify if issues_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ issues_info.catalystcenter_version if issues_info.catalystcenter_version is not none else omit }}"
        deviceId: "{{ issues_info.deviceId if issues_info.deviceId is not none else omit }}"
        endTime: "{{ issues_info.endTime if issues_info.endTime is not none else omit }}"
        headers: "{{ issues_info.headers if issues_info.headers is not none else omit }}"
        issueStatus: "{{ issues_info.issueStatus if issues_info.issueStatus is not none else omit }}"
        macAddress: "{{ issues_info.macAddress if issues_info.macAddress is not none else omit }}"
        priority: "{{ issues_info.priority if issues_info.priority is not none else omit }}"
        siteId: "{{ issues_info.siteId if issues_info.siteId is not none else omit }}"
        startTime: "{{ issues_info.startTime if issues_info.startTime is not none else omit }}"
        validate_response_schema: "{{ issues_info.validate_response_schema if issues_info.validate_response_schema is not none else omit }}"
      register: issues_info_result
