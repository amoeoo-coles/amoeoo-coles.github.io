---
# Sample playbook for cisco.catalystcenter.file_info (cisco.catalystcenter 2.15.0)
# Build order: 70
# Information module for File
# Reads ../models/file_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/file_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0070 file_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/file_info.yml
  tasks:
    - name: Run file_info from its model
      cisco.catalystcenter.file_info:
        catalystcenter_debug: "{{ file_info.catalystcenter_debug if file_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ file_info.catalystcenter_host if file_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ file_info.catalystcenter_password if file_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ file_info.catalystcenter_port if file_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ file_info.catalystcenter_username if file_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ file_info.catalystcenter_verify if file_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ file_info.catalystcenter_version if file_info.catalystcenter_version is not none else omit }}"
        dirPath: "{{ file_info.dirPath if file_info.dirPath is not none else omit }}"
        fileId: "{{ file_info.fileId if file_info.fileId is not none else omit }}"
        filename: "{{ file_info.filename if file_info.filename is not none else omit }}"
        headers: "{{ file_info.headers if file_info.headers is not none else omit }}"
        saveFile: "{{ file_info.saveFile if file_info.saveFile is not none else omit }}"
        validate_response_schema: "{{ file_info.validate_response_schema if file_info.validate_response_schema is not none else omit }}"
      register: file_info_result
