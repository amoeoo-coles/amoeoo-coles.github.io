---
# Sample playbook for cisco.catalystcenter.feature_templates_wireless_event_driven_rrm_configurations (cisco.catalystcenter 2.15.0)
# Build order: 968
# Resource module for Feature Templates Wireless Event Driven Rrm Configurations
# Reads ../models/feature_templates_wireless_event_driven_rrm_configurations.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/feature_templates_wireless_event_driven_rrm_configurations_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags feature_templates_wireless_event_driven_rrm_configurations.

- name: "0968 feature_templates_wireless_event_driven_rrm_configurations"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/feature_templates_wireless_event_driven_rrm_configurations.yml
  tasks:
    - name: Run feature_templates_wireless_event_driven_rrm_configurations from its model
      cisco.catalystcenter.feature_templates_wireless_event_driven_rrm_configurations:
        catalystcenter_debug: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_debug if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_host if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_password if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_port if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_username if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_verify if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_version if feature_templates_wireless_event_driven_rrm_configurations.catalystcenter_version is not none else omit }}"
        designName: "{{ feature_templates_wireless_event_driven_rrm_configurations.designName if feature_templates_wireless_event_driven_rrm_configurations.designName is not none else omit }}"
        featureAttributes: "{{ (feature_templates_wireless_event_driven_rrm_configurations.featureAttributes | cat_strip_nulls) if (feature_templates_wireless_event_driven_rrm_configurations.featureAttributes | cat_strip_nulls) is not none else omit }}"
        id: "{{ feature_templates_wireless_event_driven_rrm_configurations.id if feature_templates_wireless_event_driven_rrm_configurations.id is not none else omit }}"
        unlockedAttributes: "{{ (feature_templates_wireless_event_driven_rrm_configurations.unlockedAttributes | cat_strip_nulls) if (feature_templates_wireless_event_driven_rrm_configurations.unlockedAttributes | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ feature_templates_wireless_event_driven_rrm_configurations.validate_response_schema if feature_templates_wireless_event_driven_rrm_configurations.validate_response_schema is not none else omit }}"
      register: feature_templates_wireless_event_driven_rrm_configurations_result
      tags:
        - never
        - feature_templates_wireless_event_driven_rrm_configurations
