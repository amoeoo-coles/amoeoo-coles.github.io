---
# Sample playbook for cisco.catalystcenter.sda_extranet_policies_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 854
# SDA Extranet Policies Module provides functionality for managing SD-Access Extranet Policies in Cisco Catalyst Center.
# Reads ../models/sda_extranet_policies_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/sda_extranet_policies_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags sda_extranet_policies_workflow_manager.

- name: "0854 sda_extranet_policies_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/sda_extranet_policies_workflow_manager.yml
  tasks:
    - name: Run sda_extranet_policies_workflow_manager from its model
      cisco.catalystcenter.sda_extranet_policies_workflow_manager:
        catalystcenter_api_task_timeout: "{{ sda_extranet_policies_workflow_manager.catalystcenter_api_task_timeout if sda_extranet_policies_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ sda_extranet_policies_workflow_manager.catalystcenter_debug if sda_extranet_policies_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ sda_extranet_policies_workflow_manager.catalystcenter_host if sda_extranet_policies_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ sda_extranet_policies_workflow_manager.catalystcenter_log if sda_extranet_policies_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ sda_extranet_policies_workflow_manager.catalystcenter_log_append if sda_extranet_policies_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ sda_extranet_policies_workflow_manager.catalystcenter_log_file_path if sda_extranet_policies_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ sda_extranet_policies_workflow_manager.catalystcenter_log_level if sda_extranet_policies_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ sda_extranet_policies_workflow_manager.catalystcenter_password if sda_extranet_policies_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ sda_extranet_policies_workflow_manager.catalystcenter_port if sda_extranet_policies_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ sda_extranet_policies_workflow_manager.catalystcenter_task_poll_interval if sda_extranet_policies_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ sda_extranet_policies_workflow_manager.catalystcenter_username if sda_extranet_policies_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ sda_extranet_policies_workflow_manager.catalystcenter_verify if sda_extranet_policies_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ sda_extranet_policies_workflow_manager.catalystcenter_version if sda_extranet_policies_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (sda_extranet_policies_workflow_manager.config | cat_strip_nulls) if (sda_extranet_policies_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ sda_extranet_policies_workflow_manager.config_verify if sda_extranet_policies_workflow_manager.config_verify is not none else omit }}"
        state: "{{ sda_extranet_policies_workflow_manager.state if sda_extranet_policies_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ sda_extranet_policies_workflow_manager.validate_response_schema if sda_extranet_policies_workflow_manager.validate_response_schema is not none else omit }}"
      register: sda_extranet_policies_workflow_manager_result
      tags:
        - never
        - sda_extranet_policies_workflow_manager
