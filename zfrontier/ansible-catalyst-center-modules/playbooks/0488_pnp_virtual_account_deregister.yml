---
# Sample playbook for cisco.catalystcenter.pnp_virtual_account_deregister (cisco.catalystcenter 2.15.0)
# Build order: 488
# Resource module for Pnp Virtual Account Deregister
# Reads ../models/pnp_virtual_account_deregister.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_virtual_account_deregister_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_virtual_account_deregister.

- name: "0488 pnp_virtual_account_deregister"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_virtual_account_deregister.yml
  tasks:
    - name: Run pnp_virtual_account_deregister from its model
      cisco.catalystcenter.pnp_virtual_account_deregister:
        catalystcenter_debug: "{{ pnp_virtual_account_deregister.catalystcenter_debug if pnp_virtual_account_deregister.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_virtual_account_deregister.catalystcenter_host if pnp_virtual_account_deregister.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_virtual_account_deregister.catalystcenter_password if pnp_virtual_account_deregister.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_virtual_account_deregister.catalystcenter_port if pnp_virtual_account_deregister.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_virtual_account_deregister.catalystcenter_username if pnp_virtual_account_deregister.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_virtual_account_deregister.catalystcenter_verify if pnp_virtual_account_deregister.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_virtual_account_deregister.catalystcenter_version if pnp_virtual_account_deregister.catalystcenter_version is not none else omit }}"
        domain: "{{ pnp_virtual_account_deregister.domain if pnp_virtual_account_deregister.domain is not none else omit }}"
        name: "{{ pnp_virtual_account_deregister.name if pnp_virtual_account_deregister.name is not none else omit }}"
        validate_response_schema: "{{ pnp_virtual_account_deregister.validate_response_schema if pnp_virtual_account_deregister.validate_response_schema is not none else omit }}"
      register: pnp_virtual_account_deregister_result
      tags:
        - never
        - pnp_virtual_account_deregister
