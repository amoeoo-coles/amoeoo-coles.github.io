---
# Sample playbook for cisco.catalystcenter.configuration_template_info (cisco.catalystcenter 2.15.0)
# Build order: 607
# Information module for Configuration Template
# Reads ../models/configuration_template_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/configuration_template_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0607 configuration_template_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/configuration_template_info.yml
  tasks:
    - name: Run configuration_template_info from its model
      cisco.catalystcenter.configuration_template_info:
        catalystcenter_debug: "{{ configuration_template_info.catalystcenter_debug if configuration_template_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ configuration_template_info.catalystcenter_host if configuration_template_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ configuration_template_info.catalystcenter_password if configuration_template_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ configuration_template_info.catalystcenter_port if configuration_template_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ configuration_template_info.catalystcenter_username if configuration_template_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ configuration_template_info.catalystcenter_verify if configuration_template_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ configuration_template_info.catalystcenter_version if configuration_template_info.catalystcenter_version is not none else omit }}"
        filterConflictingTemplates: "{{ configuration_template_info.filterConflictingTemplates if configuration_template_info.filterConflictingTemplates is not none else omit }}"
        headers: "{{ configuration_template_info.headers if configuration_template_info.headers is not none else omit }}"
        latestVersion: "{{ configuration_template_info.latestVersion if configuration_template_info.latestVersion is not none else omit }}"
        productFamily: "{{ configuration_template_info.productFamily if configuration_template_info.productFamily is not none else omit }}"
        productSeries: "{{ configuration_template_info.productSeries if configuration_template_info.productSeries is not none else omit }}"
        productType: "{{ configuration_template_info.productType if configuration_template_info.productType is not none else omit }}"
        projectId: "{{ configuration_template_info.projectId if configuration_template_info.projectId is not none else omit }}"
        projectNames: "{{ (configuration_template_info.projectNames | cat_strip_nulls) if (configuration_template_info.projectNames | cat_strip_nulls) is not none else omit }}"
        softwareType: "{{ configuration_template_info.softwareType if configuration_template_info.softwareType is not none else omit }}"
        softwareVersion: "{{ configuration_template_info.softwareVersion if configuration_template_info.softwareVersion is not none else omit }}"
        sortOrder: "{{ configuration_template_info.sortOrder if configuration_template_info.sortOrder is not none else omit }}"
        tags: "{{ (configuration_template_info.tags | cat_strip_nulls) if (configuration_template_info.tags | cat_strip_nulls) is not none else omit }}"
        templateId: "{{ configuration_template_info.templateId if configuration_template_info.templateId is not none else omit }}"
        unCommitted: "{{ configuration_template_info.unCommitted if configuration_template_info.unCommitted is not none else omit }}"
        validate_response_schema: "{{ configuration_template_info.validate_response_schema if configuration_template_info.validate_response_schema is not none else omit }}"
      register: configuration_template_info_result
