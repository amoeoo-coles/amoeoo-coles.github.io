---
# Sample playbook for cisco.catalystcenter.discovery_range_info (cisco.catalystcenter 2.15.0)
# Build order: 290
# Information module for Discovery Range
# Reads ../models/discovery_range_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_range_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0290 discovery_range_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discovery_range_info.yml
  tasks:
    - name: Run discovery_range_info from its model
      cisco.catalystcenter.discovery_range_info:
        catalystcenter_debug: "{{ discovery_range_info.catalystcenter_debug if discovery_range_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discovery_range_info.catalystcenter_host if discovery_range_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discovery_range_info.catalystcenter_password if discovery_range_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discovery_range_info.catalystcenter_port if discovery_range_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discovery_range_info.catalystcenter_username if discovery_range_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discovery_range_info.catalystcenter_verify if discovery_range_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discovery_range_info.catalystcenter_version if discovery_range_info.catalystcenter_version is not none else omit }}"
        headers: "{{ discovery_range_info.headers if discovery_range_info.headers is not none else omit }}"
        recordsToReturn: "{{ discovery_range_info.recordsToReturn if discovery_range_info.recordsToReturn is not none else omit }}"
        startIndex: "{{ discovery_range_info.startIndex if discovery_range_info.startIndex is not none else omit }}"
        validate_response_schema: "{{ discovery_range_info.validate_response_schema if discovery_range_info.validate_response_schema is not none else omit }}"
      register: discovery_range_info_result
