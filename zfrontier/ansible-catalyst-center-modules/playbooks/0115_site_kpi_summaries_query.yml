---
# Sample playbook for cisco.catalystcenter.site_kpi_summaries_query (cisco.catalystcenter 2.15.0)
# Build order: 115
# Resource module for Site Kpi Summaries Query
# Reads ../models/site_kpi_summaries_query.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/site_kpi_summaries_query_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags site_kpi_summaries_query.

- name: "0115 site_kpi_summaries_query"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/site_kpi_summaries_query.yml
  tasks:
    - name: Run site_kpi_summaries_query from its model
      cisco.catalystcenter.site_kpi_summaries_query:
        attributes: "{{ (site_kpi_summaries_query.attributes | cat_strip_nulls) if (site_kpi_summaries_query.attributes | cat_strip_nulls) is not none else omit }}"
        catalystcenter_debug: "{{ site_kpi_summaries_query.catalystcenter_debug if site_kpi_summaries_query.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ site_kpi_summaries_query.catalystcenter_host if site_kpi_summaries_query.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ site_kpi_summaries_query.catalystcenter_password if site_kpi_summaries_query.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ site_kpi_summaries_query.catalystcenter_port if site_kpi_summaries_query.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ site_kpi_summaries_query.catalystcenter_username if site_kpi_summaries_query.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ site_kpi_summaries_query.catalystcenter_verify if site_kpi_summaries_query.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ site_kpi_summaries_query.catalystcenter_version if site_kpi_summaries_query.catalystcenter_version is not none else omit }}"
        endTime: "{{ site_kpi_summaries_query.endTime if site_kpi_summaries_query.endTime is not none else omit }}"
        filters: "{{ (site_kpi_summaries_query.filters | cat_strip_nulls) if (site_kpi_summaries_query.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ site_kpi_summaries_query.headers if site_kpi_summaries_query.headers is not none else omit }}"
        page: "{{ (site_kpi_summaries_query.page | cat_strip_nulls) if (site_kpi_summaries_query.page | cat_strip_nulls) is not none else omit }}"
        startTime: "{{ site_kpi_summaries_query.startTime if site_kpi_summaries_query.startTime is not none else omit }}"
        validate_response_schema: "{{ site_kpi_summaries_query.validate_response_schema if site_kpi_summaries_query.validate_response_schema is not none else omit }}"
        views: "{{ (site_kpi_summaries_query.views | cat_strip_nulls) if (site_kpi_summaries_query.views | cat_strip_nulls) is not none else omit }}"
      register: site_kpi_summaries_query_result
      tags:
        - never
        - site_kpi_summaries_query
