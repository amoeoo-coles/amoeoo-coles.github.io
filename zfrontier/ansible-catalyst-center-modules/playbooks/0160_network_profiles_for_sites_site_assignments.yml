---
# Sample playbook for cisco.catalystcenter.network_profiles_for_sites_site_assignments (cisco.catalystcenter 2.15.0)
# Build order: 160
# Resource module for Network Profiles For Sites Site Assignments
# Reads ../models/network_profiles_for_sites_site_assignments.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_profiles_for_sites_site_assignments_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_profiles_for_sites_site_assignments.

- name: "0160 network_profiles_for_sites_site_assignments"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_profiles_for_sites_site_assignments.yml
  tasks:
    - name: Run network_profiles_for_sites_site_assignments from its model
      cisco.catalystcenter.network_profiles_for_sites_site_assignments:
        catalystcenter_debug: "{{ network_profiles_for_sites_site_assignments.catalystcenter_debug if network_profiles_for_sites_site_assignments.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_profiles_for_sites_site_assignments.catalystcenter_host if network_profiles_for_sites_site_assignments.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_profiles_for_sites_site_assignments.catalystcenter_password if network_profiles_for_sites_site_assignments.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_profiles_for_sites_site_assignments.catalystcenter_port if network_profiles_for_sites_site_assignments.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_profiles_for_sites_site_assignments.catalystcenter_username if network_profiles_for_sites_site_assignments.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_profiles_for_sites_site_assignments.catalystcenter_verify if network_profiles_for_sites_site_assignments.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_profiles_for_sites_site_assignments.catalystcenter_version if network_profiles_for_sites_site_assignments.catalystcenter_version is not none else omit }}"
        id: "{{ network_profiles_for_sites_site_assignments.id if network_profiles_for_sites_site_assignments.id is not none else omit }}"
        profileId: "{{ network_profiles_for_sites_site_assignments.profileId if network_profiles_for_sites_site_assignments.profileId is not none else omit }}"
        validate_response_schema: "{{ network_profiles_for_sites_site_assignments.validate_response_schema if network_profiles_for_sites_site_assignments.validate_response_schema is not none else omit }}"
      register: network_profiles_for_sites_site_assignments_result
      tags:
        - never
        - network_profiles_for_sites_site_assignments
