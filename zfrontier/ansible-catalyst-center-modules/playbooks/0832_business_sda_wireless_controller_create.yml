---
# Sample playbook for cisco.catalystcenter.business_sda_wireless_controller_create (cisco.catalystcenter 2.15.0)
# Build order: 832
# Resource module for Business Sda Wireless Controller Create
# Reads ../models/business_sda_wireless_controller_create.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/business_sda_wireless_controller_create_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags business_sda_wireless_controller_create.

- name: "0832 business_sda_wireless_controller_create"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/business_sda_wireless_controller_create.yml
  tasks:
    - name: Run business_sda_wireless_controller_create from its model
      cisco.catalystcenter.business_sda_wireless_controller_create:
        catalystcenter_debug: "{{ business_sda_wireless_controller_create.catalystcenter_debug if business_sda_wireless_controller_create.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ business_sda_wireless_controller_create.catalystcenter_host if business_sda_wireless_controller_create.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ business_sda_wireless_controller_create.catalystcenter_password if business_sda_wireless_controller_create.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ business_sda_wireless_controller_create.catalystcenter_port if business_sda_wireless_controller_create.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ business_sda_wireless_controller_create.catalystcenter_username if business_sda_wireless_controller_create.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ business_sda_wireless_controller_create.catalystcenter_verify if business_sda_wireless_controller_create.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ business_sda_wireless_controller_create.catalystcenter_version if business_sda_wireless_controller_create.catalystcenter_version is not none else omit }}"
        deviceName: "{{ business_sda_wireless_controller_create.deviceName if business_sda_wireless_controller_create.deviceName is not none else omit }}"
        headers: "{{ business_sda_wireless_controller_create.headers if business_sda_wireless_controller_create.headers is not none else omit }}"
        siteNameHierarchy: "{{ business_sda_wireless_controller_create.siteNameHierarchy if business_sda_wireless_controller_create.siteNameHierarchy is not none else omit }}"
        validate_response_schema: "{{ business_sda_wireless_controller_create.validate_response_schema if business_sda_wireless_controller_create.validate_response_schema is not none else omit }}"
      register: business_sda_wireless_controller_create_result
      tags:
        - never
        - business_sda_wireless_controller_create
