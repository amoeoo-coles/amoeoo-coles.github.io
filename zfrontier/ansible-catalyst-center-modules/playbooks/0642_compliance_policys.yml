---
# Sample playbook for cisco.catalystcenter.compliance_policys (cisco.catalystcenter 2.15.0)
# Build order: 642
# Resource module for Compliance Policys
# Reads ../models/compliance_policys.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_policys_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags compliance_policys.

- name: "0642 compliance_policys"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_policys.yml
  tasks:
    - name: Run compliance_policys from its model
      cisco.catalystcenter.compliance_policys:
        catalystcenter_debug: "{{ compliance_policys.catalystcenter_debug if compliance_policys.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_policys.catalystcenter_host if compliance_policys.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_policys.catalystcenter_password if compliance_policys.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_policys.catalystcenter_port if compliance_policys.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_policys.catalystcenter_username if compliance_policys.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_policys.catalystcenter_verify if compliance_policys.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_policys.catalystcenter_version if compliance_policys.catalystcenter_version is not none else omit }}"
        description: "{{ compliance_policys.description if compliance_policys.description is not none else omit }}"
        id: "{{ compliance_policys.id if compliance_policys.id is not none else omit }}"
        name: "{{ compliance_policys.name if compliance_policys.name is not none else omit }}"
        rulesCount: "{{ compliance_policys.rulesCount if compliance_policys.rulesCount is not none else omit }}"
        sitesCount: "{{ compliance_policys.sitesCount if compliance_policys.sitesCount is not none else omit }}"
        source: "{{ compliance_policys.source if compliance_policys.source is not none else omit }}"
        status: "{{ compliance_policys.status if compliance_policys.status is not none else omit }}"
        validate_response_schema: "{{ compliance_policys.validate_response_schema if compliance_policys.validate_response_schema is not none else omit }}"
      register: compliance_policys_result
      tags:
        - never
        - compliance_policys
