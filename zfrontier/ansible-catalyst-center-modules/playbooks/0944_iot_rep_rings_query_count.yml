---
# Sample playbook for cisco.catalystcenter.iot_rep_rings_query_count (cisco.catalystcenter 2.15.0)
# Build order: 944
# Resource module for Iot Rep Rings Query Count
# Reads ../models/iot_rep_rings_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_rep_rings_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_rep_rings_query_count.

- name: "0944 iot_rep_rings_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_rep_rings_query_count.yml
  tasks:
    - name: Run iot_rep_rings_query_count from its model
      cisco.catalystcenter.iot_rep_rings_query_count:
        catalystcenter_debug: "{{ iot_rep_rings_query_count.catalystcenter_debug if iot_rep_rings_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_rep_rings_query_count.catalystcenter_host if iot_rep_rings_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_rep_rings_query_count.catalystcenter_password if iot_rep_rings_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_rep_rings_query_count.catalystcenter_port if iot_rep_rings_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_rep_rings_query_count.catalystcenter_username if iot_rep_rings_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_rep_rings_query_count.catalystcenter_verify if iot_rep_rings_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_rep_rings_query_count.catalystcenter_version if iot_rep_rings_query_count.catalystcenter_version is not none else omit }}"
        deploymentMode: "{{ iot_rep_rings_query_count.deploymentMode if iot_rep_rings_query_count.deploymentMode is not none else omit }}"
        networkDeviceId: "{{ iot_rep_rings_query_count.networkDeviceId if iot_rep_rings_query_count.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ iot_rep_rings_query_count.validate_response_schema if iot_rep_rings_query_count.validate_response_schema is not none else omit }}"
      register: iot_rep_rings_query_count_result
      tags:
        - never
        - iot_rep_rings_query_count
