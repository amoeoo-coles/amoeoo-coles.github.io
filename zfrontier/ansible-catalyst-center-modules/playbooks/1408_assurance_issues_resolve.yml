---
# Sample playbook for cisco.catalystcenter.assurance_issues_resolve (cisco.catalystcenter 2.15.0)
# Build order: 1408
# Resource module for Assurance Issues Resolve
# Reads ../models/assurance_issues_resolve.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_issues_resolve_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assurance_issues_resolve.

- name: "1408 assurance_issues_resolve"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_issues_resolve.yml
  tasks:
    - name: Run assurance_issues_resolve from its model
      cisco.catalystcenter.assurance_issues_resolve:
        catalystcenter_debug: "{{ assurance_issues_resolve.catalystcenter_debug if assurance_issues_resolve.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_issues_resolve.catalystcenter_host if assurance_issues_resolve.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_issues_resolve.catalystcenter_password if assurance_issues_resolve.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_issues_resolve.catalystcenter_port if assurance_issues_resolve.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_issues_resolve.catalystcenter_username if assurance_issues_resolve.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_issues_resolve.catalystcenter_verify if assurance_issues_resolve.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_issues_resolve.catalystcenter_version if assurance_issues_resolve.catalystcenter_version is not none else omit }}"
        headers: "{{ assurance_issues_resolve.headers if assurance_issues_resolve.headers is not none else omit }}"
        issueIds: "{{ (assurance_issues_resolve.issueIds | cat_strip_nulls) if (assurance_issues_resolve.issueIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ assurance_issues_resolve.validate_response_schema if assurance_issues_resolve.validate_response_schema is not none else omit }}"
      register: assurance_issues_resolve_result
      tags:
        - never
        - assurance_issues_resolve
