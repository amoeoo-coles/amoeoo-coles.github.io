---
# Sample playbook for cisco.catalystcenter.ise_integration_status_info (cisco.catalystcenter 2.15.0)
# Build order: 13
# Information module for Ise Integration Status
# Reads ../models/ise_integration_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ise_integration_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0013 ise_integration_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/ise_integration_status_info.yml
  tasks:
    - name: Run ise_integration_status_info from its model
      cisco.catalystcenter.ise_integration_status_info:
        catalystcenter_debug: "{{ ise_integration_status_info.catalystcenter_debug if ise_integration_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ ise_integration_status_info.catalystcenter_host if ise_integration_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ ise_integration_status_info.catalystcenter_password if ise_integration_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ ise_integration_status_info.catalystcenter_port if ise_integration_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ ise_integration_status_info.catalystcenter_username if ise_integration_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ ise_integration_status_info.catalystcenter_verify if ise_integration_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ ise_integration_status_info.catalystcenter_version if ise_integration_status_info.catalystcenter_version is not none else omit }}"
        headers: "{{ ise_integration_status_info.headers if ise_integration_status_info.headers is not none else omit }}"
        validate_response_schema: "{{ ise_integration_status_info.validate_response_schema if ise_integration_status_info.validate_response_schema is not none else omit }}"
      register: ise_integration_status_info_result
