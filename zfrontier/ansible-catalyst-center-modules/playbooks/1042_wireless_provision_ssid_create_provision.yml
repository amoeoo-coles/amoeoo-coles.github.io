---
# Sample playbook for cisco.catalystcenter.wireless_provision_ssid_create_provision (cisco.catalystcenter 2.15.0)
# Build order: 1042
# Resource module for Wireless Provision Ssid Create Provision
# Reads ../models/wireless_provision_ssid_create_provision.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_provision_ssid_create_provision_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_provision_ssid_create_provision.

- name: "1042 wireless_provision_ssid_create_provision"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_provision_ssid_create_provision.yml
  tasks:
    - name: Run wireless_provision_ssid_create_provision from its model
      cisco.catalystcenter.wireless_provision_ssid_create_provision:
        catalystcenter_debug: "{{ wireless_provision_ssid_create_provision.catalystcenter_debug if wireless_provision_ssid_create_provision.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_provision_ssid_create_provision.catalystcenter_host if wireless_provision_ssid_create_provision.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_provision_ssid_create_provision.catalystcenter_password if wireless_provision_ssid_create_provision.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_provision_ssid_create_provision.catalystcenter_port if wireless_provision_ssid_create_provision.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_provision_ssid_create_provision.catalystcenter_username if wireless_provision_ssid_create_provision.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_provision_ssid_create_provision.catalystcenter_verify if wireless_provision_ssid_create_provision.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_provision_ssid_create_provision.catalystcenter_version if wireless_provision_ssid_create_provision.catalystcenter_version is not none else omit }}"
        enableFabric: "{{ wireless_provision_ssid_create_provision.enableFabric if wireless_provision_ssid_create_provision.enableFabric is not none else omit }}"
        flexConnect: "{{ (wireless_provision_ssid_create_provision.flexConnect | cat_strip_nulls) if (wireless_provision_ssid_create_provision.flexConnect | cat_strip_nulls) is not none else omit }}"
        headers: "{{ wireless_provision_ssid_create_provision.headers if wireless_provision_ssid_create_provision.headers is not none else omit }}"
        managedAPLocations: "{{ (wireless_provision_ssid_create_provision.managedAPLocations | cat_strip_nulls) if (wireless_provision_ssid_create_provision.managedAPLocations | cat_strip_nulls) is not none else omit }}"
        ssidDetails: "{{ (wireless_provision_ssid_create_provision.ssidDetails | cat_strip_nulls) if (wireless_provision_ssid_create_provision.ssidDetails | cat_strip_nulls) is not none else omit }}"
        ssidType: "{{ wireless_provision_ssid_create_provision.ssidType if wireless_provision_ssid_create_provision.ssidType is not none else omit }}"
        validate_response_schema: "{{ wireless_provision_ssid_create_provision.validate_response_schema if wireless_provision_ssid_create_provision.validate_response_schema is not none else omit }}"
      register: wireless_provision_ssid_create_provision_result
      tags:
        - never
        - wireless_provision_ssid_create_provision
