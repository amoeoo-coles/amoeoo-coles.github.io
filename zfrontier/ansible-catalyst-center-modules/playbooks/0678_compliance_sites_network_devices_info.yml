---
# Sample playbook for cisco.catalystcenter.compliance_sites_network_devices_info (cisco.catalystcenter 2.15.0)
# Build order: 678
# Information module for Compliance Sites Network Devices
# Reads ../models/compliance_sites_network_devices_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/compliance_sites_network_devices_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0678 compliance_sites_network_devices_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/compliance_sites_network_devices_info.yml
  tasks:
    - name: Run compliance_sites_network_devices_info from its model
      cisco.catalystcenter.compliance_sites_network_devices_info:
        catalystcenter_debug: "{{ compliance_sites_network_devices_info.catalystcenter_debug if compliance_sites_network_devices_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ compliance_sites_network_devices_info.catalystcenter_host if compliance_sites_network_devices_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ compliance_sites_network_devices_info.catalystcenter_password if compliance_sites_network_devices_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ compliance_sites_network_devices_info.catalystcenter_port if compliance_sites_network_devices_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ compliance_sites_network_devices_info.catalystcenter_username if compliance_sites_network_devices_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ compliance_sites_network_devices_info.catalystcenter_verify if compliance_sites_network_devices_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ compliance_sites_network_devices_info.catalystcenter_version if compliance_sites_network_devices_info.catalystcenter_version is not none else omit }}"
        complianceTypes: "{{ (compliance_sites_network_devices_info.complianceTypes | cat_strip_nulls) if (compliance_sites_network_devices_info.complianceTypes | cat_strip_nulls) is not none else omit }}"
        headers: "{{ compliance_sites_network_devices_info.headers if compliance_sites_network_devices_info.headers is not none else omit }}"
        limit: "{{ compliance_sites_network_devices_info.limit if compliance_sites_network_devices_info.limit is not none else omit }}"
        networkDeviceId: "{{ compliance_sites_network_devices_info.networkDeviceId if compliance_sites_network_devices_info.networkDeviceId is not none else omit }}"
        offset: "{{ compliance_sites_network_devices_info.offset if compliance_sites_network_devices_info.offset is not none else omit }}"
        severity: "{{ compliance_sites_network_devices_info.severity if compliance_sites_network_devices_info.severity is not none else omit }}"
        siteId: "{{ compliance_sites_network_devices_info.siteId if compliance_sites_network_devices_info.siteId is not none else omit }}"
        status: "{{ compliance_sites_network_devices_info.status if compliance_sites_network_devices_info.status is not none else omit }}"
        validate_response_schema: "{{ compliance_sites_network_devices_info.validate_response_schema if compliance_sites_network_devices_info.validate_response_schema is not none else omit }}"
      register: compliance_sites_network_devices_info_result
