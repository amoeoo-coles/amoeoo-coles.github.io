---
# Sample playbook for cisco.catalystcenter.wireless_controllers_intended_ssids_dot11_be_profiles (cisco.catalystcenter 2.15.0)
# Build order: 1004
# Resource module for Wireless Controllers Intended Ssids Dot11 Be Profiles
# Reads ../models/wireless_controllers_intended_ssids_dot11_be_profiles.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_intended_ssids_dot11_be_profiles_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags wireless_controllers_intended_ssids_dot11_be_profiles.

- name: "1004 wireless_controllers_intended_ssids_dot11_be_profiles"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wireless_controllers_intended_ssids_dot11_be_profiles.yml
  tasks:
    - name: Run wireless_controllers_intended_ssids_dot11_be_profiles from its model
      cisco.catalystcenter.wireless_controllers_intended_ssids_dot11_be_profiles:
        catalystcenter_debug: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_debug if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_host if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_password if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_port if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_username if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_verify if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_version if wireless_controllers_intended_ssids_dot11_be_profiles.catalystcenter_version is not none else omit }}"
        id: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.id if wireless_controllers_intended_ssids_dot11_be_profiles.id is not none else omit }}"
        networkDeviceId: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.networkDeviceId if wireless_controllers_intended_ssids_dot11_be_profiles.networkDeviceId is not none else omit }}"
        validate_response_schema: "{{ wireless_controllers_intended_ssids_dot11_be_profiles.validate_response_schema if wireless_controllers_intended_ssids_dot11_be_profiles.validate_response_schema is not none else omit }}"
      register: wireless_controllers_intended_ssids_dot11_be_profiles_result
      tags:
        - never
        - wireless_controllers_intended_ssids_dot11_be_profiles
