---
# Sample playbook for cisco.catalystcenter.interfaces_count_info (cisco.catalystcenter 2.15.0)
# Build order: 424
# Information module for Interfaces Count
# Reads ../models/interfaces_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/interfaces_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0424 interfaces_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/interfaces_count_info.yml
  tasks:
    - name: Run interfaces_count_info from its model
      cisco.catalystcenter.interfaces_count_info:
        catalystcenter_debug: "{{ interfaces_count_info.catalystcenter_debug if interfaces_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ interfaces_count_info.catalystcenter_host if interfaces_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ interfaces_count_info.catalystcenter_password if interfaces_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ interfaces_count_info.catalystcenter_port if interfaces_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ interfaces_count_info.catalystcenter_username if interfaces_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ interfaces_count_info.catalystcenter_verify if interfaces_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ interfaces_count_info.catalystcenter_version if interfaces_count_info.catalystcenter_version is not none else omit }}"
        endTime: "{{ interfaces_count_info.endTime if interfaces_count_info.endTime is not none else omit }}"
        headers: "{{ interfaces_count_info.headers if interfaces_count_info.headers is not none else omit }}"
        interfaceId: "{{ interfaces_count_info.interfaceId if interfaces_count_info.interfaceId is not none else omit }}"
        interfaceName: "{{ interfaces_count_info.interfaceName if interfaces_count_info.interfaceName is not none else omit }}"
        networkDeviceId: "{{ interfaces_count_info.networkDeviceId if interfaces_count_info.networkDeviceId is not none else omit }}"
        networkDeviceIpAddress: "{{ interfaces_count_info.networkDeviceIpAddress if interfaces_count_info.networkDeviceIpAddress is not none else omit }}"
        networkDeviceMacAddress: "{{ interfaces_count_info.networkDeviceMacAddress if interfaces_count_info.networkDeviceMacAddress is not none else omit }}"
        siteHierarchy: "{{ interfaces_count_info.siteHierarchy if interfaces_count_info.siteHierarchy is not none else omit }}"
        siteHierarchyId: "{{ interfaces_count_info.siteHierarchyId if interfaces_count_info.siteHierarchyId is not none else omit }}"
        siteId: "{{ interfaces_count_info.siteId if interfaces_count_info.siteId is not none else omit }}"
        startTime: "{{ interfaces_count_info.startTime if interfaces_count_info.startTime is not none else omit }}"
        validate_response_schema: "{{ interfaces_count_info.validate_response_schema if interfaces_count_info.validate_response_schema is not none else omit }}"
      register: interfaces_count_info_result
