---
# Sample playbook for cisco.catalystcenter.security_service_insertions (cisco.catalystcenter 2.15.0)
# Build order: 763
# Resource module for Security Service Insertions
# Reads ../models/security_service_insertions.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_service_insertions_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags security_service_insertions.

- name: "0763 security_service_insertions"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_service_insertions.yml
  tasks:
    - name: Run security_service_insertions from its model
      cisco.catalystcenter.security_service_insertions:
        catalystcenter_debug: "{{ security_service_insertions.catalystcenter_debug if security_service_insertions.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_service_insertions.catalystcenter_host if security_service_insertions.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_service_insertions.catalystcenter_password if security_service_insertions.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_service_insertions.catalystcenter_port if security_service_insertions.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_service_insertions.catalystcenter_username if security_service_insertions.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_service_insertions.catalystcenter_verify if security_service_insertions.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_service_insertions.catalystcenter_version if security_service_insertions.catalystcenter_version is not none else omit }}"
        id: "{{ security_service_insertions.id if security_service_insertions.id is not none else omit }}"
        siteId: "{{ security_service_insertions.siteId if security_service_insertions.siteId is not none else omit }}"
        validate_response_schema: "{{ security_service_insertions.validate_response_schema if security_service_insertions.validate_response_schema is not none else omit }}"
        virtualNetworks: "{{ (security_service_insertions.virtualNetworks | cat_strip_nulls) if (security_service_insertions.virtualNetworks | cat_strip_nulls) is not none else omit }}"
      register: security_service_insertions_result
      tags:
        - never
        - security_service_insertions
