---
# Sample playbook for cisco.catalystcenter.authentication_policy_servers (cisco.catalystcenter 2.15.0)
# Build order: 1
# Resource module for Authentication Policy Servers
# Reads ../models/authentication_policy_servers.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/authentication_policy_servers_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags authentication_policy_servers.

- name: "0001 authentication_policy_servers"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/authentication_policy_servers.yml
  tasks:
    - name: Run authentication_policy_servers from its model
      cisco.catalystcenter.authentication_policy_servers:
        accountingPort: "{{ authentication_policy_servers.accountingPort if authentication_policy_servers.accountingPort is not none else omit }}"
        authenticationPort: "{{ authentication_policy_servers.authenticationPort if authentication_policy_servers.authenticationPort is not none else omit }}"
        catalystcenter_debug: "{{ authentication_policy_servers.catalystcenter_debug if authentication_policy_servers.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ authentication_policy_servers.catalystcenter_host if authentication_policy_servers.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ authentication_policy_servers.catalystcenter_password if authentication_policy_servers.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ authentication_policy_servers.catalystcenter_port if authentication_policy_servers.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ authentication_policy_servers.catalystcenter_username if authentication_policy_servers.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ authentication_policy_servers.catalystcenter_verify if authentication_policy_servers.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ authentication_policy_servers.catalystcenter_version if authentication_policy_servers.catalystcenter_version is not none else omit }}"
        ciscoIseDtos: "{{ (authentication_policy_servers.ciscoIseDtos | cat_strip_nulls) if (authentication_policy_servers.ciscoIseDtos | cat_strip_nulls) is not none else omit }}"
        encryptionKey: "{{ authentication_policy_servers.encryptionKey if authentication_policy_servers.encryptionKey is not none else omit }}"
        encryptionScheme: "{{ authentication_policy_servers.encryptionScheme if authentication_policy_servers.encryptionScheme is not none else omit }}"
        externalCiscoIseIpAddrDtos: "{{ (authentication_policy_servers.externalCiscoIseIpAddrDtos | cat_strip_nulls) if (authentication_policy_servers.externalCiscoIseIpAddrDtos | cat_strip_nulls) is not none else omit }}"
        id: "{{ authentication_policy_servers.id if authentication_policy_servers.id is not none else omit }}"
        ipAddress: "{{ authentication_policy_servers.ipAddress if authentication_policy_servers.ipAddress is not none else omit }}"
        isIseEnabled: "{{ authentication_policy_servers.isIseEnabled if authentication_policy_servers.isIseEnabled is not none else omit }}"
        messageKey: "{{ authentication_policy_servers.messageKey if authentication_policy_servers.messageKey is not none else omit }}"
        port: "{{ authentication_policy_servers.port if authentication_policy_servers.port is not none else omit }}"
        protocol: "{{ authentication_policy_servers.protocol if authentication_policy_servers.protocol is not none else omit }}"
        pxgridEnabled: "{{ authentication_policy_servers.pxgridEnabled if authentication_policy_servers.pxgridEnabled is not none else omit }}"
        retries: "{{ authentication_policy_servers.retries if authentication_policy_servers.retries is not none else omit }}"
        role: "{{ authentication_policy_servers.role if authentication_policy_servers.role is not none else omit }}"
        sharedSecret: "{{ authentication_policy_servers.sharedSecret if authentication_policy_servers.sharedSecret is not none else omit }}"
        timeoutSeconds: "{{ authentication_policy_servers.timeoutSeconds if authentication_policy_servers.timeoutSeconds is not none else omit }}"
        useDnacCertForPxgrid: "{{ authentication_policy_servers.useDnacCertForPxgrid if authentication_policy_servers.useDnacCertForPxgrid is not none else omit }}"
        validate_response_schema: "{{ authentication_policy_servers.validate_response_schema if authentication_policy_servers.validate_response_schema is not none else omit }}"
      register: authentication_policy_servers_result
      tags:
        - never
        - authentication_policy_servers
