---
# Sample playbook for cisco.catalystcenter.pnp_virtual_account_add (cisco.catalystcenter 2.15.0)
# Build order: 487
# Resource module for Pnp Virtual Account Add
# Reads ../models/pnp_virtual_account_add.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_virtual_account_add_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_virtual_account_add.

- name: "0487 pnp_virtual_account_add"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_virtual_account_add.yml
  tasks:
    - name: Run pnp_virtual_account_add from its model
      cisco.catalystcenter.pnp_virtual_account_add:
        autoSyncPeriod: "{{ pnp_virtual_account_add.autoSyncPeriod if pnp_virtual_account_add.autoSyncPeriod is not none else omit }}"
        catalystcenter_debug: "{{ pnp_virtual_account_add.catalystcenter_debug if pnp_virtual_account_add.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_virtual_account_add.catalystcenter_host if pnp_virtual_account_add.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_virtual_account_add.catalystcenter_password if pnp_virtual_account_add.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_virtual_account_add.catalystcenter_port if pnp_virtual_account_add.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_virtual_account_add.catalystcenter_username if pnp_virtual_account_add.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_virtual_account_add.catalystcenter_verify if pnp_virtual_account_add.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_virtual_account_add.catalystcenter_version if pnp_virtual_account_add.catalystcenter_version is not none else omit }}"
        ccoUser: "{{ pnp_virtual_account_add.ccoUser if pnp_virtual_account_add.ccoUser is not none else omit }}"
        expiry: "{{ pnp_virtual_account_add.expiry if pnp_virtual_account_add.expiry is not none else omit }}"
        lastSync: "{{ pnp_virtual_account_add.lastSync if pnp_virtual_account_add.lastSync is not none else omit }}"
        profile: "{{ (pnp_virtual_account_add.profile | cat_strip_nulls) if (pnp_virtual_account_add.profile | cat_strip_nulls) is not none else omit }}"
        smartAccountId: "{{ pnp_virtual_account_add.smartAccountId if pnp_virtual_account_add.smartAccountId is not none else omit }}"
        syncResult: "{{ (pnp_virtual_account_add.syncResult | cat_strip_nulls) if (pnp_virtual_account_add.syncResult | cat_strip_nulls) is not none else omit }}"
        syncResultStr: "{{ pnp_virtual_account_add.syncResultStr if pnp_virtual_account_add.syncResultStr is not none else omit }}"
        syncStartTime: "{{ pnp_virtual_account_add.syncStartTime if pnp_virtual_account_add.syncStartTime is not none else omit }}"
        syncStatus: "{{ pnp_virtual_account_add.syncStatus if pnp_virtual_account_add.syncStatus is not none else omit }}"
        tenantId: "{{ pnp_virtual_account_add.tenantId if pnp_virtual_account_add.tenantId is not none else omit }}"
        token: "{{ pnp_virtual_account_add.token if pnp_virtual_account_add.token is not none else omit }}"
        validate_response_schema: "{{ pnp_virtual_account_add.validate_response_schema if pnp_virtual_account_add.validate_response_schema is not none else omit }}"
        virtualAccountId: "{{ pnp_virtual_account_add.virtualAccountId if pnp_virtual_account_add.virtualAccountId is not none else omit }}"
      register: pnp_virtual_account_add_result
      tags:
        - never
        - pnp_virtual_account_add
