---
# Sample playbook for cisco.catalystcenter.template_preview (cisco.catalystcenter 2.15.0)
# Build order: 601
# Resource module for Template Preview
# Reads ../models/template_preview.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/template_preview_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags template_preview.

- name: "0601 template_preview"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/template_preview.yml
  tasks:
    - name: Run template_preview from its model
      cisco.catalystcenter.template_preview:
        catalystcenter_debug: "{{ template_preview.catalystcenter_debug if template_preview.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ template_preview.catalystcenter_host if template_preview.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ template_preview.catalystcenter_password if template_preview.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ template_preview.catalystcenter_port if template_preview.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ template_preview.catalystcenter_username if template_preview.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ template_preview.catalystcenter_verify if template_preview.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ template_preview.catalystcenter_version if template_preview.catalystcenter_version is not none else omit }}"
        deviceId: "{{ template_preview.deviceId if template_preview.deviceId is not none else omit }}"
        params: "{{ (template_preview.params | cat_strip_nulls) if (template_preview.params | cat_strip_nulls) is not none else omit }}"
        resourceParams: "{{ (template_preview.resourceParams | cat_strip_nulls) if (template_preview.resourceParams | cat_strip_nulls) is not none else omit }}"
        templateId: "{{ template_preview.templateId if template_preview.templateId is not none else omit }}"
        validate_response_schema: "{{ template_preview.validate_response_schema if template_preview.validate_response_schema is not none else omit }}"
      register: template_preview_result
      tags:
        - never
        - template_preview
