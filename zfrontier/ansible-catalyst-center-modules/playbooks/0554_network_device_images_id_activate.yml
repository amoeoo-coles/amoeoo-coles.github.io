---
# Sample playbook for cisco.catalystcenter.network_device_images_id_activate (cisco.catalystcenter 2.15.0)
# Build order: 554
# Resource module for Network Device Images Id Activate
# Reads ../models/network_device_images_id_activate.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_images_id_activate_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags network_device_images_id_activate.

- name: "0554 network_device_images_id_activate"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_images_id_activate.yml
  tasks:
    - name: Run network_device_images_id_activate from its model
      cisco.catalystcenter.network_device_images_id_activate:
        catalystcenter_debug: "{{ network_device_images_id_activate.catalystcenter_debug if network_device_images_id_activate.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_images_id_activate.catalystcenter_host if network_device_images_id_activate.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_images_id_activate.catalystcenter_password if network_device_images_id_activate.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_images_id_activate.catalystcenter_port if network_device_images_id_activate.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_images_id_activate.catalystcenter_username if network_device_images_id_activate.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_images_id_activate.catalystcenter_verify if network_device_images_id_activate.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_images_id_activate.catalystcenter_version if network_device_images_id_activate.catalystcenter_version is not none else omit }}"
        compatibleFeatures: "{{ (network_device_images_id_activate.compatibleFeatures | cat_strip_nulls) if (network_device_images_id_activate.compatibleFeatures | cat_strip_nulls) is not none else omit }}"
        id: "{{ network_device_images_id_activate.id if network_device_images_id_activate.id is not none else omit }}"
        installedImages: "{{ (network_device_images_id_activate.installedImages | cat_strip_nulls) if (network_device_images_id_activate.installedImages | cat_strip_nulls) is not none else omit }}"
        networkValidationIds: "{{ (network_device_images_id_activate.networkValidationIds | cat_strip_nulls) if (network_device_images_id_activate.networkValidationIds | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ network_device_images_id_activate.validate_response_schema if network_device_images_id_activate.validate_response_schema is not none else omit }}"
      register: network_device_images_id_activate_result
      tags:
        - never
        - network_device_images_id_activate
