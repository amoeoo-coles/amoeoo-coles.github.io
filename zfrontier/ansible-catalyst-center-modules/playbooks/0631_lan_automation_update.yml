---
# Sample playbook for cisco.catalystcenter.lan_automation_update (cisco.catalystcenter 2.15.0)
# Build order: 631
# Resource module for Lan Automation Update
# Reads ../models/lan_automation_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags lan_automation_update.

- name: "0631 lan_automation_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/lan_automation_update.yml
  tasks:
    - name: Run lan_automation_update from its model
      cisco.catalystcenter.lan_automation_update:
        catalystcenter_debug: "{{ lan_automation_update.catalystcenter_debug if lan_automation_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ lan_automation_update.catalystcenter_host if lan_automation_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ lan_automation_update.catalystcenter_password if lan_automation_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ lan_automation_update.catalystcenter_port if lan_automation_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ lan_automation_update.catalystcenter_username if lan_automation_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ lan_automation_update.catalystcenter_verify if lan_automation_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ lan_automation_update.catalystcenter_version if lan_automation_update.catalystcenter_version is not none else omit }}"
        id: "{{ lan_automation_update.id if lan_automation_update.id is not none else omit }}"
        payload: "{{ (lan_automation_update.payload | cat_strip_nulls) if (lan_automation_update.payload | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ lan_automation_update.validate_response_schema if lan_automation_update.validate_response_schema is not none else omit }}"
      register: lan_automation_update_result
      tags:
        - never
        - lan_automation_update
