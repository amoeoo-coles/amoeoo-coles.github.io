---
# Sample playbook for cisco.catalystcenter.discoverys_jobs_info (cisco.catalystcenter 2.15.0)
# Build order: 407
# Information module for Discoverys Jobs
# Reads ../models/discoverys_jobs_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discoverys_jobs_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0407 discoverys_jobs_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/discoverys_jobs_info.yml
  tasks:
    - name: Run discoverys_jobs_info from its model
      cisco.catalystcenter.discoverys_jobs_info:
        catalystcenter_debug: "{{ discoverys_jobs_info.catalystcenter_debug if discoverys_jobs_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ discoverys_jobs_info.catalystcenter_host if discoverys_jobs_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ discoverys_jobs_info.catalystcenter_password if discoverys_jobs_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ discoverys_jobs_info.catalystcenter_port if discoverys_jobs_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ discoverys_jobs_info.catalystcenter_username if discoverys_jobs_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ discoverys_jobs_info.catalystcenter_verify if discoverys_jobs_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ discoverys_jobs_info.catalystcenter_version if discoverys_jobs_info.catalystcenter_version is not none else omit }}"
        discoveryId: "{{ discoverys_jobs_info.discoveryId if discoverys_jobs_info.discoveryId is not none else omit }}"
        headers: "{{ discoverys_jobs_info.headers if discoverys_jobs_info.headers is not none else omit }}"
        id: "{{ discoverys_jobs_info.id if discoverys_jobs_info.id is not none else omit }}"
        jobId: "{{ (discoverys_jobs_info.jobId | cat_strip_nulls) if (discoverys_jobs_info.jobId | cat_strip_nulls) is not none else omit }}"
        limit: "{{ discoverys_jobs_info.limit if discoverys_jobs_info.limit is not none else omit }}"
        offset: "{{ discoverys_jobs_info.offset if discoverys_jobs_info.offset is not none else omit }}"
        orderBy: "{{ discoverys_jobs_info.orderBy if discoverys_jobs_info.orderBy is not none else omit }}"
        validate_response_schema: "{{ discoverys_jobs_info.validate_response_schema if discoverys_jobs_info.validate_response_schema is not none else omit }}"
      register: discoverys_jobs_info_result
