---
# Sample playbook for cisco.catalystcenter.tags_workflow_manager (cisco.catalystcenter 2.15.0)
# Build order: 269
# Create/ Update/ Delete Tag(s) and Tag Memberships in Cisco Catalyst Center.
# Reads ../models/tags_workflow_manager.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/tags_workflow_manager_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags tags_workflow_manager.

- name: "0269 tags_workflow_manager"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/tags_workflow_manager.yml
  tasks:
    - name: Run tags_workflow_manager from its model
      cisco.catalystcenter.tags_workflow_manager:
        catalystcenter_api_task_timeout: "{{ tags_workflow_manager.catalystcenter_api_task_timeout if tags_workflow_manager.catalystcenter_api_task_timeout is not none else omit }}"
        catalystcenter_debug: "{{ tags_workflow_manager.catalystcenter_debug if tags_workflow_manager.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ tags_workflow_manager.catalystcenter_host if tags_workflow_manager.catalystcenter_host is not none else omit }}"
        catalystcenter_log: "{{ tags_workflow_manager.catalystcenter_log if tags_workflow_manager.catalystcenter_log is not none else omit }}"
        catalystcenter_log_append: "{{ tags_workflow_manager.catalystcenter_log_append if tags_workflow_manager.catalystcenter_log_append is not none else omit }}"
        catalystcenter_log_file_path: "{{ tags_workflow_manager.catalystcenter_log_file_path if tags_workflow_manager.catalystcenter_log_file_path is not none else omit }}"
        catalystcenter_log_level: "{{ tags_workflow_manager.catalystcenter_log_level if tags_workflow_manager.catalystcenter_log_level is not none else omit }}"
        catalystcenter_password: "{{ tags_workflow_manager.catalystcenter_password if tags_workflow_manager.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ tags_workflow_manager.catalystcenter_port if tags_workflow_manager.catalystcenter_port is not none else omit }}"
        catalystcenter_task_poll_interval: "{{ tags_workflow_manager.catalystcenter_task_poll_interval if tags_workflow_manager.catalystcenter_task_poll_interval is not none else omit }}"
        catalystcenter_username: "{{ tags_workflow_manager.catalystcenter_username if tags_workflow_manager.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ tags_workflow_manager.catalystcenter_verify if tags_workflow_manager.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ tags_workflow_manager.catalystcenter_version if tags_workflow_manager.catalystcenter_version is not none else omit }}"
        config: "{{ (tags_workflow_manager.config | cat_strip_nulls) if (tags_workflow_manager.config | cat_strip_nulls) is not none else omit }}"
        config_verify: "{{ tags_workflow_manager.config_verify if tags_workflow_manager.config_verify is not none else omit }}"
        state: "{{ tags_workflow_manager.state if tags_workflow_manager.state is not none else omit }}"
        validate_response_schema: "{{ tags_workflow_manager.validate_response_schema if tags_workflow_manager.validate_response_schema is not none else omit }}"
      register: tags_workflow_manager_result
      tags:
        - never
        - tags_workflow_manager
