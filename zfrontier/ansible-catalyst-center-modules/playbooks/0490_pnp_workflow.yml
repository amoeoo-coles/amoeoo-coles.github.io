---
# Sample playbook for cisco.catalystcenter.pnp_workflow (cisco.catalystcenter 2.15.0)
# Build order: 490
# Resource module for Pnp Workflow
# Reads ../models/pnp_workflow.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_workflow_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags pnp_workflow.

- name: "0490 pnp_workflow"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/pnp_workflow.yml
  tasks:
    - name: Run pnp_workflow from its model
      cisco.catalystcenter.pnp_workflow:
        _id: "{{ pnp_workflow._id if pnp_workflow._id is not none else omit }}"
        addToInventory: "{{ pnp_workflow.addToInventory if pnp_workflow.addToInventory is not none else omit }}"
        addedOn: "{{ pnp_workflow.addedOn if pnp_workflow.addedOn is not none else omit }}"
        catalystcenter_debug: "{{ pnp_workflow.catalystcenter_debug if pnp_workflow.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ pnp_workflow.catalystcenter_host if pnp_workflow.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ pnp_workflow.catalystcenter_password if pnp_workflow.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ pnp_workflow.catalystcenter_port if pnp_workflow.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ pnp_workflow.catalystcenter_username if pnp_workflow.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ pnp_workflow.catalystcenter_verify if pnp_workflow.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ pnp_workflow.catalystcenter_version if pnp_workflow.catalystcenter_version is not none else omit }}"
        configId: "{{ pnp_workflow.configId if pnp_workflow.configId is not none else omit }}"
        currTaskIdx: "{{ pnp_workflow.currTaskIdx if pnp_workflow.currTaskIdx is not none else omit }}"
        description: "{{ pnp_workflow.description if pnp_workflow.description is not none else omit }}"
        endTime: "{{ pnp_workflow.endTime if pnp_workflow.endTime is not none else omit }}"
        execTime: "{{ pnp_workflow.execTime if pnp_workflow.execTime is not none else omit }}"
        id: "{{ pnp_workflow.id if pnp_workflow.id is not none else omit }}"
        imageId: "{{ pnp_workflow.imageId if pnp_workflow.imageId is not none else omit }}"
        instanceType: "{{ pnp_workflow.instanceType if pnp_workflow.instanceType is not none else omit }}"
        lastupdateOn: "{{ pnp_workflow.lastupdateOn if pnp_workflow.lastupdateOn is not none else omit }}"
        name: "{{ pnp_workflow.name if pnp_workflow.name is not none else omit }}"
        startTime: "{{ pnp_workflow.startTime if pnp_workflow.startTime is not none else omit }}"
        state_: "{{ pnp_workflow.state_ if pnp_workflow.state_ is not none else omit }}"
        tasks: "{{ (pnp_workflow.tasks | cat_strip_nulls) if (pnp_workflow.tasks | cat_strip_nulls) is not none else omit }}"
        tenantId: "{{ pnp_workflow.tenantId if pnp_workflow.tenantId is not none else omit }}"
        type: "{{ pnp_workflow.type if pnp_workflow.type is not none else omit }}"
        useState: "{{ pnp_workflow.useState if pnp_workflow.useState is not none else omit }}"
        validate_response_schema: "{{ pnp_workflow.validate_response_schema if pnp_workflow.validate_response_schema is not none else omit }}"
        version: "{{ pnp_workflow.version if pnp_workflow.version is not none else omit }}"
      register: pnp_workflow_result
      tags:
        - never
        - pnp_workflow
