---
# Sample playbook for cisco.catalystcenter.icap_settings_count_info (cisco.catalystcenter 2.15.0)
# Build order: 1454
# Information module for Icap Settings Count
# Reads ../models/icap_settings_count_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/icap_settings_count_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "1454 icap_settings_count_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/icap_settings_count_info.yml
  tasks:
    - name: Run icap_settings_count_info from its model
      cisco.catalystcenter.icap_settings_count_info:
        apId: "{{ icap_settings_count_info.apId if icap_settings_count_info.apId is not none else omit }}"
        captureStatus: "{{ icap_settings_count_info.captureStatus if icap_settings_count_info.captureStatus is not none else omit }}"
        captureType: "{{ icap_settings_count_info.captureType if icap_settings_count_info.captureType is not none else omit }}"
        catalystcenter_debug: "{{ icap_settings_count_info.catalystcenter_debug if icap_settings_count_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ icap_settings_count_info.catalystcenter_host if icap_settings_count_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ icap_settings_count_info.catalystcenter_password if icap_settings_count_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ icap_settings_count_info.catalystcenter_port if icap_settings_count_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ icap_settings_count_info.catalystcenter_username if icap_settings_count_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ icap_settings_count_info.catalystcenter_verify if icap_settings_count_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ icap_settings_count_info.catalystcenter_version if icap_settings_count_info.catalystcenter_version is not none else omit }}"
        clientMac: "{{ icap_settings_count_info.clientMac if icap_settings_count_info.clientMac is not none else omit }}"
        headers: "{{ icap_settings_count_info.headers if icap_settings_count_info.headers is not none else omit }}"
        validate_response_schema: "{{ icap_settings_count_info.validate_response_schema if icap_settings_count_info.validate_response_schema is not none else omit }}"
        wlcId: "{{ icap_settings_count_info.wlcId if icap_settings_count_info.wlcId is not none else omit }}"
      register: icap_settings_count_info_result
