---
# Sample playbook for cisco.catalystcenter.assurance_tasks_info (cisco.catalystcenter 2.15.0)
# Build order: 78
# Information module for Assurance Tasks
# Reads ../models/assurance_tasks_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_tasks_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0078 assurance_tasks_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_tasks_info.yml
  tasks:
    - name: Run assurance_tasks_info from its model
      cisco.catalystcenter.assurance_tasks_info:
        catalystcenter_debug: "{{ assurance_tasks_info.catalystcenter_debug if assurance_tasks_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_tasks_info.catalystcenter_host if assurance_tasks_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_tasks_info.catalystcenter_password if assurance_tasks_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_tasks_info.catalystcenter_port if assurance_tasks_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_tasks_info.catalystcenter_username if assurance_tasks_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_tasks_info.catalystcenter_verify if assurance_tasks_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_tasks_info.catalystcenter_version if assurance_tasks_info.catalystcenter_version is not none else omit }}"
        headers: "{{ assurance_tasks_info.headers if assurance_tasks_info.headers is not none else omit }}"
        id: "{{ assurance_tasks_info.id if assurance_tasks_info.id is not none else omit }}"
        limit: "{{ assurance_tasks_info.limit if assurance_tasks_info.limit is not none else omit }}"
        offset: "{{ assurance_tasks_info.offset if assurance_tasks_info.offset is not none else omit }}"
        order: "{{ assurance_tasks_info.order if assurance_tasks_info.order is not none else omit }}"
        sortBy: "{{ assurance_tasks_info.sortBy if assurance_tasks_info.sortBy is not none else omit }}"
        status: "{{ assurance_tasks_info.status if assurance_tasks_info.status is not none else omit }}"
        validate_response_schema: "{{ assurance_tasks_info.validate_response_schema if assurance_tasks_info.validate_response_schema is not none else omit }}"
      register: assurance_tasks_info_result
