---
# Sample playbook for cisco.catalystcenter.iot_fabric_prp_deploy_update (cisco.catalystcenter 2.15.0)
# Build order: 938
# Resource module for Iot Fabric Prp Deploy Update
# Reads ../models/iot_fabric_prp_deploy_update.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_fabric_prp_deploy_update_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags iot_fabric_prp_deploy_update.

- name: "0938 iot_fabric_prp_deploy_update"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/iot_fabric_prp_deploy_update.yml
  tasks:
    - name: Run iot_fabric_prp_deploy_update from its model
      cisco.catalystcenter.iot_fabric_prp_deploy_update:
        activityDescription: "{{ iot_fabric_prp_deploy_update.activityDescription if iot_fabric_prp_deploy_update.activityDescription is not none else omit }}"
        allowedVlans: "{{ iot_fabric_prp_deploy_update.allowedVlans if iot_fabric_prp_deploy_update.allowedVlans is not none else omit }}"
        catalystcenter_debug: "{{ iot_fabric_prp_deploy_update.catalystcenter_debug if iot_fabric_prp_deploy_update.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ iot_fabric_prp_deploy_update.catalystcenter_host if iot_fabric_prp_deploy_update.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ iot_fabric_prp_deploy_update.catalystcenter_password if iot_fabric_prp_deploy_update.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ iot_fabric_prp_deploy_update.catalystcenter_port if iot_fabric_prp_deploy_update.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ iot_fabric_prp_deploy_update.catalystcenter_username if iot_fabric_prp_deploy_update.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ iot_fabric_prp_deploy_update.catalystcenter_verify if iot_fabric_prp_deploy_update.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ iot_fabric_prp_deploy_update.catalystcenter_version if iot_fabric_prp_deploy_update.catalystcenter_version is not none else omit }}"
        networkDeviceId: "{{ iot_fabric_prp_deploy_update.networkDeviceId if iot_fabric_prp_deploy_update.networkDeviceId is not none else omit }}"
        supervisionFrameOption: "{{ (iot_fabric_prp_deploy_update.supervisionFrameOption | cat_strip_nulls) if (iot_fabric_prp_deploy_update.supervisionFrameOption | cat_strip_nulls) is not none else omit }}"
        validate_response_schema: "{{ iot_fabric_prp_deploy_update.validate_response_schema if iot_fabric_prp_deploy_update.validate_response_schema is not none else omit }}"
      register: iot_fabric_prp_deploy_update_result
      tags:
        - never
        - iot_fabric_prp_deploy_update
