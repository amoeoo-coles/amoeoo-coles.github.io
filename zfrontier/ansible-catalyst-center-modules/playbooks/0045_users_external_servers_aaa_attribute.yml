---
# Sample playbook for cisco.catalystcenter.users_external_servers_aaa_attribute (cisco.catalystcenter 2.15.0)
# Build order: 45
# Resource module for Users External Servers Aaa Attribute
# Reads ../models/users_external_servers_aaa_attribute.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/users_external_servers_aaa_attribute_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags users_external_servers_aaa_attribute.

- name: "0045 users_external_servers_aaa_attribute"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/users_external_servers_aaa_attribute.yml
  tasks:
    - name: Run users_external_servers_aaa_attribute from its model
      cisco.catalystcenter.users_external_servers_aaa_attribute:
        attributeName: "{{ users_external_servers_aaa_attribute.attributeName if users_external_servers_aaa_attribute.attributeName is not none else omit }}"
        catalystcenter_debug: "{{ users_external_servers_aaa_attribute.catalystcenter_debug if users_external_servers_aaa_attribute.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ users_external_servers_aaa_attribute.catalystcenter_host if users_external_servers_aaa_attribute.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ users_external_servers_aaa_attribute.catalystcenter_password if users_external_servers_aaa_attribute.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ users_external_servers_aaa_attribute.catalystcenter_port if users_external_servers_aaa_attribute.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ users_external_servers_aaa_attribute.catalystcenter_username if users_external_servers_aaa_attribute.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ users_external_servers_aaa_attribute.catalystcenter_verify if users_external_servers_aaa_attribute.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ users_external_servers_aaa_attribute.catalystcenter_version if users_external_servers_aaa_attribute.catalystcenter_version is not none else omit }}"
        validate_response_schema: "{{ users_external_servers_aaa_attribute.validate_response_schema if users_external_servers_aaa_attribute.validate_response_schema is not none else omit }}"
      register: users_external_servers_aaa_attribute_result
      tags:
        - never
        - users_external_servers_aaa_attribute
