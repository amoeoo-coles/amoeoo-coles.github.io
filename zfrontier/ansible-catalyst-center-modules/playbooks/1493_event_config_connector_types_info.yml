        catalystcenter_verify: "{{ event_config_connector_types_info.catalystcenter_verify if event_config_connector_types_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ event_config_connector_types_info.catalystcenter_version if event_config_connector_types_info.catalystcenter_version is not none else omit }}"
        headers: "{{ event_config_connector_types_info.headers if event_config_connector_types_info.headers is not none else omit }}"
        validate_response_schema: "{{ event_config_connector_types_info.validate_response_schema if event_config_connector_types_info.validate_response_schema is not none else omit }}"
      register: event_config_connector_types_info_result
