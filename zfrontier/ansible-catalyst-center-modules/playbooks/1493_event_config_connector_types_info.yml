        catalystcenter_host: "{{ event_config_connector_types_info.catalystcenter_host if event_config_connector_types_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ event_config_connector_types_info.catalystcenter_password if event_config_connector_types_info.catalystcenter_password is not none else omit }}"
