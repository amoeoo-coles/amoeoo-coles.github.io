---
# Sample playbook for cisco.catalystcenter.assurance_issues_query_count (cisco.catalystcenter 2.15.0)
# Build order: 1407
# Resource module for Assurance Issues Query Count
# Reads ../models/assurance_issues_query_count.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/assurance_issues_query_count_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags assurance_issues_query_count.

- name: "1407 assurance_issues_query_count"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/assurance_issues_query_count.yml
  tasks:
    - name: Run assurance_issues_query_count from its model
      cisco.catalystcenter.assurance_issues_query_count:
        catalystcenter_debug: "{{ assurance_issues_query_count.catalystcenter_debug if assurance_issues_query_count.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ assurance_issues_query_count.catalystcenter_host if assurance_issues_query_count.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ assurance_issues_query_count.catalystcenter_password if assurance_issues_query_count.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ assurance_issues_query_count.catalystcenter_port if assurance_issues_query_count.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ assurance_issues_query_count.catalystcenter_username if assurance_issues_query_count.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ assurance_issues_query_count.catalystcenter_verify if assurance_issues_query_count.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ assurance_issues_query_count.catalystcenter_version if assurance_issues_query_count.catalystcenter_version is not none else omit }}"
        endTime: "{{ assurance_issues_query_count.endTime if assurance_issues_query_count.endTime is not none else omit }}"
        filters: "{{ (assurance_issues_query_count.filters | cat_strip_nulls) if (assurance_issues_query_count.filters | cat_strip_nulls) is not none else omit }}"
        headers: "{{ assurance_issues_query_count.headers if assurance_issues_query_count.headers is not none else omit }}"
        startTime: "{{ assurance_issues_query_count.startTime if assurance_issues_query_count.startTime is not none else omit }}"
        validate_response_schema: "{{ assurance_issues_query_count.validate_response_schema if assurance_issues_query_count.validate_response_schema is not none else omit }}"
      register: assurance_issues_query_count_result
      tags:
        - never
        - assurance_issues_query_count
