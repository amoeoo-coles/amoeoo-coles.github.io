---
# Sample playbook for cisco.catalystcenter.security_rogue_wireless_containment_status_info (cisco.catalystcenter 2.15.0)
# Build order: 470
# Information module for Security Rogue Wireless Containment Status
# Reads ../models/security_rogue_wireless_containment_status_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/security_rogue_wireless_containment_status_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0470 security_rogue_wireless_containment_status_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/security_rogue_wireless_containment_status_info.yml
  tasks:
    - name: Run security_rogue_wireless_containment_status_info from its model
      cisco.catalystcenter.security_rogue_wireless_containment_status_info:
        catalystcenter_debug: "{{ security_rogue_wireless_containment_status_info.catalystcenter_debug if security_rogue_wireless_containment_status_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ security_rogue_wireless_containment_status_info.catalystcenter_host if security_rogue_wireless_containment_status_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ security_rogue_wireless_containment_status_info.catalystcenter_password if security_rogue_wireless_containment_status_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ security_rogue_wireless_containment_status_info.catalystcenter_port if security_rogue_wireless_containment_status_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ security_rogue_wireless_containment_status_info.catalystcenter_username if security_rogue_wireless_containment_status_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ security_rogue_wireless_containment_status_info.catalystcenter_verify if security_rogue_wireless_containment_status_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ security_rogue_wireless_containment_status_info.catalystcenter_version if security_rogue_wireless_containment_status_info.catalystcenter_version is not none else omit }}"
        headers: "{{ security_rogue_wireless_containment_status_info.headers if security_rogue_wireless_containment_status_info.headers is not none else omit }}"
        macAddress: "{{ security_rogue_wireless_containment_status_info.macAddress if security_rogue_wireless_containment_status_info.macAddress is not none else omit }}"
        validate_response_schema: "{{ security_rogue_wireless_containment_status_info.validate_response_schema if security_rogue_wireless_containment_status_info.validate_response_schema is not none else omit }}"
      register: security_rogue_wireless_containment_status_info_result
