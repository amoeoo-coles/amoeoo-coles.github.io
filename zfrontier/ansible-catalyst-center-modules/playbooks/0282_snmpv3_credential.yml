---
# Sample playbook for cisco.catalystcenter.snmpv3_credential (cisco.catalystcenter 2.15.0)
# Build order: 282
# Resource module for Snmpv3 Credential
# Reads ../models/snmpv3_credential.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/snmpv3_credential_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags snmpv3_credential.

- name: "0282 snmpv3_credential"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/snmpv3_credential.yml
  tasks:
    - name: Run snmpv3_credential from its model
      cisco.catalystcenter.snmpv3_credential:
        authPassword: "{{ snmpv3_credential.authPassword if snmpv3_credential.authPassword is not none else omit }}"
        authType: "{{ snmpv3_credential.authType if snmpv3_credential.authType is not none else omit }}"
        catalystcenter_debug: "{{ snmpv3_credential.catalystcenter_debug if snmpv3_credential.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ snmpv3_credential.catalystcenter_host if snmpv3_credential.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ snmpv3_credential.catalystcenter_password if snmpv3_credential.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ snmpv3_credential.catalystcenter_port if snmpv3_credential.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ snmpv3_credential.catalystcenter_username if snmpv3_credential.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ snmpv3_credential.catalystcenter_verify if snmpv3_credential.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ snmpv3_credential.catalystcenter_version if snmpv3_credential.catalystcenter_version is not none else omit }}"
        comments: "{{ snmpv3_credential.comments if snmpv3_credential.comments is not none else omit }}"
        credentialType: "{{ snmpv3_credential.credentialType if snmpv3_credential.credentialType is not none else omit }}"
        description: "{{ snmpv3_credential.description if snmpv3_credential.description is not none else omit }}"
        id: "{{ snmpv3_credential.id if snmpv3_credential.id is not none else omit }}"
        instanceTenantId: "{{ snmpv3_credential.instanceTenantId if snmpv3_credential.instanceTenantId is not none else omit }}"
        instanceUuid: "{{ snmpv3_credential.instanceUuid if snmpv3_credential.instanceUuid is not none else omit }}"
        privacyPassword: "{{ snmpv3_credential.privacyPassword if snmpv3_credential.privacyPassword is not none else omit }}"
        privacyType: "{{ snmpv3_credential.privacyType if snmpv3_credential.privacyType is not none else omit }}"
        snmpMode: "{{ snmpv3_credential.snmpMode if snmpv3_credential.snmpMode is not none else omit }}"
        username: "{{ snmpv3_credential.username if snmpv3_credential.username is not none else omit }}"
        validate_response_schema: "{{ snmpv3_credential.validate_response_schema if snmpv3_credential.validate_response_schema is not none else omit }}"
      register: snmpv3_credential_result
      tags:
        - never
        - snmpv3_credential
