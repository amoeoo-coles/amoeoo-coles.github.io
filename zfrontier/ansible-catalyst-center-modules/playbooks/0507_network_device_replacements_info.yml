---
# Sample playbook for cisco.catalystcenter.network_device_replacements_info (cisco.catalystcenter 2.15.0)
# Build order: 507
# Information module for Network Device Replacements
# Reads ../models/network_device_replacements_info.yml (vars_files). Docs: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_replacements_info_module.html
# Connection placeholders come from inventory.yml: {{ catalystcenter_host }} {{ catalystcenter_username }} {{ catalystcenter_password }}.

- name: "0507 network_device_replacements_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/network_device_replacements_info.yml
  tasks:
    - name: Run network_device_replacements_info from its model
      cisco.catalystcenter.network_device_replacements_info:
        catalystcenter_debug: "{{ network_device_replacements_info.catalystcenter_debug if network_device_replacements_info.catalystcenter_debug is not none else omit }}"
        catalystcenter_host: "{{ network_device_replacements_info.catalystcenter_host if network_device_replacements_info.catalystcenter_host is not none else omit }}"
        catalystcenter_password: "{{ network_device_replacements_info.catalystcenter_password if network_device_replacements_info.catalystcenter_password is not none else omit }}"
        catalystcenter_port: "{{ network_device_replacements_info.catalystcenter_port if network_device_replacements_info.catalystcenter_port is not none else omit }}"
        catalystcenter_username: "{{ network_device_replacements_info.catalystcenter_username if network_device_replacements_info.catalystcenter_username is not none else omit }}"
        catalystcenter_verify: "{{ network_device_replacements_info.catalystcenter_verify if network_device_replacements_info.catalystcenter_verify is not none else omit }}"
        catalystcenter_version: "{{ network_device_replacements_info.catalystcenter_version if network_device_replacements_info.catalystcenter_version is not none else omit }}"
        family: "{{ network_device_replacements_info.family if network_device_replacements_info.family is not none else omit }}"
        faultyDeviceName: "{{ network_device_replacements_info.faultyDeviceName if network_device_replacements_info.faultyDeviceName is not none else omit }}"
        faultyDevicePlatform: "{{ network_device_replacements_info.faultyDevicePlatform if network_device_replacements_info.faultyDevicePlatform is not none else omit }}"
        faultyDeviceSerialNumber: "{{ network_device_replacements_info.faultyDeviceSerialNumber if network_device_replacements_info.faultyDeviceSerialNumber is not none else omit }}"
        headers: "{{ network_device_replacements_info.headers if network_device_replacements_info.headers is not none else omit }}"
        id: "{{ network_device_replacements_info.id if network_device_replacements_info.id is not none else omit }}"
        limit: "{{ network_device_replacements_info.limit if network_device_replacements_info.limit is not none else omit }}"
        offset: "{{ network_device_replacements_info.offset if network_device_replacements_info.offset is not none else omit }}"
        outOfBand: "{{ network_device_replacements_info.outOfBand if network_device_replacements_info.outOfBand is not none else omit }}"
        replacementDevicePlatform: "{{ network_device_replacements_info.replacementDevicePlatform if network_device_replacements_info.replacementDevicePlatform is not none else omit }}"
        replacementDeviceSerialNumber: "{{ network_device_replacements_info.replacementDeviceSerialNumber if network_device_replacements_info.replacementDeviceSerialNumber is not none else omit }}"
        replacementStatus: "{{ network_device_replacements_info.replacementStatus if network_device_replacements_info.replacementStatus is not none else omit }}"
        sortBy: "{{ network_device_replacements_info.sortBy if network_device_replacements_info.sortBy is not none else omit }}"
        sortOrder: "{{ network_device_replacements_info.sortOrder if network_device_replacements_info.sortOrder is not none else omit }}"
        validate_response_schema: "{{ network_device_replacements_info.validate_response_schema if network_device_replacements_info.validate_response_schema is not none else omit }}"
      register: network_device_replacements_info_result
