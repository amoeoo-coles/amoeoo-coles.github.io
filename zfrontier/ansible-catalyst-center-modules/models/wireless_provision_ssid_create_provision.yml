---
# Data model for cisco.catalystcenter.wireless_provision_ssid_create_provision (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_provision_ssid_create_provision
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_provision_ssid_create_provision_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_provision_ssid_create_provision.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1042
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Wireless

wireless_provision_ssid_create_provision:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  enableFabric: true
  flexConnect:
    enableFlexConnect: true
    localToVlan: 0
  headers: '{{my_headers | from_json}}'
  managedAPLocations:
    - string
  ssidDetails:
    authKeyMgmt:
      - '{{ vault_authkeymgmt }}'
    enableBroadcastSSID: true
    enableFastLane: true
    enableMACFiltering: true
    fastTransition: string
    ghz24Policy: string
    ghz6PolicyClientSteering: true
    name: string
    passphrase: '{{ vault_passphrase }}'
    radioPolicy: string
    rsnCipherSuiteCcmp256: true
    rsnCipherSuiteGcmp128: true
    rsnCipherSuiteGcmp256: true
    securityLevel: string
    trafficType: string
    webAuthURL: string
  ssidType: string
  validate_response_schema: null
