---
# Data model for cisco.catalystcenter.wireless_controllers_provision (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_controllers_provision
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_controllers_provision_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_controllers_provision.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1024
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Wireless

wireless_controllers_provision:
  apAuthorizationListName: string
  authorizeMeshAndNonMeshAccessPoints: true
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  deviceId: string
  featureTemplatesOverridenAttributes:
    editFeatureTemplates:
      - additionalIdentifiers:
          siteUuid: string
          wlanProfileName: string
        attributes: {}
        excludedAttributes:
          - string
        featureTemplateId: string
  interfaces:
    - interfaceGateway: string
      interfaceIPAddress: string
      interfaceName: string
      interfaceNetmaskInCIDR: 0
      ipV6Addresses:
        - ipAddress: string
          prefixLength: 0
      lagOrPortNumber: 0
      vlanId: 0
  lscPercentage: 0
  lscProfileName: string
  natIpAddress: string
  rollingApUpgrade:
    apRebootPercentage: 0
    enableRollingApUpgrade: true
  skipApProvision: true
  validate_response_schema: null
