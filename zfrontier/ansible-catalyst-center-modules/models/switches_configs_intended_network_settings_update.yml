---
# Data model for cisco.catalystcenter.switches_configs_intended_network_settings_update (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.switches_configs_intended_network_settings_update
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/switches_configs_intended_network_settings_update_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/switches_configs_intended_network_settings_update.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 873
  group: 8. Wired and industrial
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Wired

switches_configs_intended_network_settings_update:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  dhcpExcludedAddressConfig:
    items:
      - configType: string
        ipDhcpExcludedLowAddressConfig:
          items:
            - configType: string
              excludedAddressLow: string
        ipDhcpExcludedLowHighAddressConfig:
          items:
            - configType: string
              excludedAddressHigh: string
              excludedAddressLow: string
  dhcpGeneralConfig:
    items:
      - configType: string
        isBootpIgnoreEnabled: true
  domainConfig:
    items:
      - configType: string
        domainName: string
        ipDomainList:
          configType: string
          items:
            - configType: string
              domainNameList: string
        ipDomainName:
          configType: string
          items:
            - configType: string
              domainWithVrf:
                configType: string
                items:
                  - configType: string
                    domainName: string
                    vrfName: string
        isLookupEnabled: true
        sourceLoopbackInterface: 0
        timeout: 0
  feature: string
  id: string
  ipV4DhcpPoolConfig:
    items:
      - configType: string
        defaultRouterList: string
        dnsServerList: string
        domainName: string
        leaseDays: 0
        leaseHours: 0
        leaseMinutes: 0
        optionCode:
          configType: string
          items:
            - asciiString: string
              configType: string
              hexadecimalString: string
              ipAddressString: string
              ipAddresses: string
              optionCode: 0
        poolName: string
        primaryNetworkMask: string
        primaryNetworkNumber: string
        vrfName: string
  ipV6DhcpPoolConfig:
    items:
      - configType: string
        dnsServer: string
        domainNames: string
        poolName: string
        prefix:
          configType: string
          items:
            - configType: string
              ipV6Prefix: string
              poolName: string
              preferredLifetime: 0
              validLifetime: 0
  nameServerConfig:
    items:
      - configType: string
        nameServerWithVrf:
          configType: string
          items:
            - configType: string
              nameServers: string
              vrfName: string
        nameServers: string
  ntpAuthenticationKeyConfig:
    items:
      - configType: string
        encryptionType: 0
        keyNumber: 0
        md5: string
        md5Config: string
  ntpGeneralConfig:
    items:
      - configType: string
        isAuthenticateEnabled: true
        isLoggingEnabled: true
        sourceLoopbackInterface: 0
        stratum: 0
  ntpPerVrfServerConfig:
    items:
      - configType: string
        ntpVrfServerList:
          configType: string
          items:
            - configType: string
              ipAddress: string
              isPreferred: true
              peerAuthenticationKey: 0
        vrfName: string
  ntpServerConfig:
    items:
      - configType: string
        ipAddress: string
        isPreferred: true
        peerAuthenticationKey: 0
        sourceInterface: string
  ntpTrustedKeyConfig:
    items:
      - configType: string
        trustedKey: 0
  validate_response_schema: null
