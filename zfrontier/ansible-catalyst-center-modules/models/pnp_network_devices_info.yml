---
# Data model for cisco.catalystcenter.pnp_network_devices_info (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.pnp_network_devices_info
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_network_devices_info_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/pnp_network_devices_info.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: info (read-only)
  build_order: 496
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Device Onboarding (PnP)

pnp_network_devices_info:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  contactedStatus: string
  headers: '{{my_headers | from_json}}'
  hostname: string
  id: null
  imageVersion: string
  limit: 0
  macAddress: str
  offset: 1
  onboardingState: string
  order: asc
  pid: string
  serialNumber: string
  siteNameHierarchy: string
  smartAccount: string
  sortBy: string
  source: string
  state_: string
  svlClaimable: true
  svlDevice: true
  validate_response_schema: null
  virtualAccount: string
