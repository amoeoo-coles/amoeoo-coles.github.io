---
# Data model for cisco.catalystcenter.lan_automation_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.lan_automation_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/lan_automation_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 727
  group: 6. Templates, LAN automation and compliance
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

lan_automation_workflow_manager:
  catalystcenter_api_task_timeout: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: null
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: null
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - lan_automated_device_update:
        hostname_update_devices:
          - device_management_ip_address: null
            new_host_name: null
        link_add:
          destination_device_interface_name: null
          destination_device_management_ip_address: null
          ip_pool_name: null
          source_device_interface_name: null
          source_device_management_ip_address: null
        link_delete:
          destination_device_interface_name: null
          destination_device_management_ip_address: null
          source_device_interface_name: null
          source_device_management_ip_address: null
        loopback_update_device_list:
          - device_management_ip_address: null
            new_loopback0_ip_address: null
      lan_automation:
        device_serial_number_authorization: null
        discovered_device_site_name_hierarchy: Global/USA/SAN JOSE
        discovery_devices:
          - device_host_name: SR-LAN-9300-IM1
            device_management_ip_address: 192.0.2.10
            device_serial_number: FJC27172JDW
            device_site_name_hierarchy: Global/USA/SAN JOSE/BLD23
          - device_host_name: SR-LAN-9300-IM2
            device_management_ip_address: 192.0.2.11
            device_serial_number: FJC2721261A
            device_site_name_hierarchy: Global/USA/SAN JOSE/BLD20
        discovery_level: 5
        discovery_timeout: 40
        host_name_prefix: San-Jose
        ip_pools:
          - ip_pool_name: underlay_sub
            ip_pool_role: MAIN_POOL
          - ip_pool_name: underlay_sub_sj
            ip_pool_role: PHYSICAL_LINK_POOL
        isis_domain_pwd: '{{ lan_automation_isis_domain_password }}'
        launch_and_wait: false
        multicast_enabled: true
        peer_device_management_ip_address: 192.0.2.2
        pnp_authorization: false
        primary_device_interface_names:
          - HundredGigE1/0/2
          - HundredGigE1/0/29
        primary_device_management_ip_address: 192.0.2.1
        redistribute_isis_to_bgp: true
      port_channel:
        - destination_device_mac_address: null
          destination_device_management_ip_address: null
          destination_device_serial_number: null
          links:
