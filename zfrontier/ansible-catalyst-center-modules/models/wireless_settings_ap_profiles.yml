---
# Data model for cisco.catalystcenter.wireless_settings_ap_profiles (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_settings_ap_profiles
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_settings_ap_profiles_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_settings_ap_profiles.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1048
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Wireless

wireless_settings_ap_profiles:
  apPowerProfileName: string
  apProfileName: string
  awipsEnabled: true
  awipsForensicEnabled: true
  calendarPowerProfiles:
    - apPowerProfileName: string
      calendarProfileName: string
      duration:
        schedulerDate:
          - string
        schedulerDay:
          - string
        schedulerEndTime: string
        schedulerStartTime: string
      schedulerType: string
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  clientLimit: 0
  countryCode: string
  description: string
  id: string
  managementSetting:
    authType: string
    cdpState: true
    dot1xPassword: '{{ vault_dot1xpassword }}'
    dot1xUsername: string
    managementEnablePassword: '{{ vault_managementenablepassword }}'
    managementPassword: '{{ vault_managementpassword }}'
    managementUserName: string
    sshEnabled: true
    telnetEnabled: true
  meshEnabled: true
  meshSetting:
    backhaulClientAccess: true
    bridgeGroupName: string
    ghz24BackhaulDataRates: string
    ghz5BackhaulDataRates: string
    range: 0
    rapDownlinkBackhaul: string
  pmfDenialEnabled: true
  remoteWorkerEnabled: true
  rogueDetectionSetting:
    rogueDetection: true
    rogueDetectionMinRssi: 0
    rogueDetectionReportInterval: 0
    rogueDetectionTransientInterval: 0
  timeZone: string
  timeZoneOffsetHour: 0
  timeZoneOffsetMinutes: 0
  validate_response_schema: null
