---
# Data model for cisco.catalystcenter.ise_radius_integration_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.ise_radius_integration_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/ise_radius_integration_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/ise_radius_integration_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 101
  group: 1. System, users and platform
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

ise_radius_integration_workflow_manager:
  catalystcenter_api_task_timeout: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: '{{ catalystcenter_log_level }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: null
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - authentication_policy_server:
        - accounting_port: 1813
          authentication_port: 1812
          cisco_ise_dtos:
            - description: null
              fqdn: null
              ip_address: null
              password: null
              ssh_key: null
              user_name: null
          encryption_key: '{{ vault_encryption_key }}'
          encryption_scheme: KEYWRAP
          external_cisco_ise_ip_addr_dtos:
            - external_cisco_ise_ip_addresses:
                - external_ip_address: null
              ise_type: null
          ise_integration_wait_time: null
          message_authenticator_code_key: '{{ vault_message_authenticator_code_key }}'
          protocol: RADIUS_TACACS
          pxgrid_enabled: null
          retries: 3
          role: secondary
          server_ip_address: 198.51.100.1
          server_type: AAA
          shared_secret: '{{ vault_shared_secret }}'
          timeout: 4
          trusted_server: null
          use_dnac_cert_for_pxgrid: null
  config_verify: true
  state: merged
  validate_response_schema: null
