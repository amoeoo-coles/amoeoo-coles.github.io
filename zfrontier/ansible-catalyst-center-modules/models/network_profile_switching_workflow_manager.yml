---
# Data model for cisco.catalystcenter.network_profile_switching_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.network_profile_switching_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_profile_switching_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/network_profile_switching_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 958
  group: 8. Wired and industrial
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

network_profile_switching_workflow_manager:
  catalystcenter_api_task_timeout: 1000
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: DEBUG
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: 1
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - day_n_templates:
        - Campus_Switch_Config_Update
      onboarding_templates: null
      profile_name: Campus_Switching_Profile
      site_names:
        - Global/India/Chennai
        - Global/India/Mumbai
  config_verify: true
  state: merged
  validate_response_schema: null
