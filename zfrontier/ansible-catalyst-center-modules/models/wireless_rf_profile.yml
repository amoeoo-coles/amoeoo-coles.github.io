---
# Data model for cisco.catalystcenter.wireless_rf_profile (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_rf_profile
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_rf_profile_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_rf_profile.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1045
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Wireless

wireless_rf_profile:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  channelWidth: string
  defaultRfProfile: true
  enableBrownField: true
  enableCustom: true
  enableRadioTypeA: true
  enableRadioTypeB: true
  enableRadioTypeC: true
  name: string
  radioTypeAProperties:
    dataRates: string
    mandatoryDataRates: string
    maxPowerLevel: 0
    minPowerLevel: 0
    parentProfile: string
    powerThresholdV1: 0
    radioChannels: string
    rxSopThreshold: string
  radioTypeBProperties:
    dataRates: string
    mandatoryDataRates: string
    maxPowerLevel: 0
    minPowerLevel: 0
    parentProfile: string
    powerThresholdV1: 0
    radioChannels: string
    rxSopThreshold: string
  radioTypeCProperties:
    dataRates: string
    mandatoryDataRates: string
    maxPowerLevel: 0
    minPowerLevel: 0
    parentProfile: string
    powerThresholdV1: 0
    radioChannels: string
    rxSopThreshold: string
  rfProfileName: null
  validate_response_schema: null
