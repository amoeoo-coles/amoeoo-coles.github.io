---
# Data model for cisco.catalystcenter.wireless_design_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_design_playbook_config_generator
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_design_playbook_config_generator_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_design_playbook_config_generator.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: config generator
  build_order: 1315
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

wireless_design_playbook_config_generator:
  catalystcenter_api_task_timeout: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: '{{catalystcenter_log_level}}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: null
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    component_specific_filters:
      802_11_be_profiles:
        - profile_name: null
      access_point_profiles:
        - ap_profile_name: null
      anchor_groups:
        - anchor_group_name: null
      components_list: null
      feature_template_config:
        - design_name: null
          feature_template_type: null
      flex_connect_configuration:
        - site_name_hierarchy: null
      interfaces:
        - interface_name: null
          vlan_id: null
      power_profiles:
        - power_profile_name: null
      radio_frequency_profiles:
        - rf_profile_name: null
      ssids:
        - site_name_hierarchy: null
          ssid_name: null
          ssid_type: null
  file_mode: overwrite
  file_path: tmp/catc_wireless_config.yml
  state: gathered
  validate_response_schema: null
