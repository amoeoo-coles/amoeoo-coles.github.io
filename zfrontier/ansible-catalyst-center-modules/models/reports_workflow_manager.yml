---
# Data model for cisco.catalystcenter.reports_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.reports_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reports_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/reports_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 1549
  group: 11. Assurance, events and reports
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

reports_workflow_manager:
  catalystcenter_api_task_timeout: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: DEBUG
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: null
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - generate_report:
        - deliveries:
            - delivery_type: DOWNLOAD
              email_attach: null
              file_path: /Users/xyz/Desktop
              notification_endpoints:
                - email_addresses: null
              notify: null
              webhook_name: null
          name: Sample Inventory report
          new_report: null
          schedule:
            date_time: null
            recurrence:
              day_of_month: null
              days: null
              last_day_of_month: null
              recurrence_type: null
            schedule_type: SCHEDULE_NOW
            start_date: null
            time: null
            time_zone: Asia/Calcutta
          tags: null
          view:
            field_groups:
              - field_group_display_name: All Data
                field_group_name: inventoryAllData
                fields:
                  - display_name: Device Type
                    name: type
                  - display_name: Device Name
                    name: hostname
                  - display_name: IP Address
                    name: ipAddress
            filters:
              - display_name: null
                filter_type: MULTI_SELECT_TREE
                name: Location
                value: []
              - display_name: null
                filter_type: MULTI_SELECT
                name: DeviceFamily
                value: []
              - display_name: null
                filter_type: MULTI_SELECT
                name: DeviceType
                value: []
              - display_name: null
                filter_type: MULTI_SELECT
                name: SoftwareVersion
                value: []
            format:
              format_type: CSV
            view_name: All Data
          view_group_name: Inventory
          view_group_version: 2.0.0
  config_verify: true
  state: merged
  validate_response_schema: null
