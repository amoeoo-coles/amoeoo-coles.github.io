---
# Data model for cisco.catalystcenter.network_update (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.network_update
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_update_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/network_update.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 195
  group: 3. Network settings, IPAM and tags
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Network Settings

network_update:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  headers: '{{my_headers | from_json}}'
  settings:
    clientAndEndpoint_aaa:
      ipAddress: string
      network: string
      protocol: string
      servers: string
      sharedSecret: '{{ vault_sharedsecret }}'
    dhcpServer:
      - string
    dnsServer:
      domainName: string
      primaryIpAddress: string
      secondaryIpAddress: string
    messageOfTheday:
      bannerMessage: string
      retainExistingBanner: string
    netflowcollector:
      ipAddress: string
      port: 0
    network_aaa:
      ipAddress: string
      network: string
      protocol: string
      servers: string
      sharedSecret: '{{ vault_sharedsecret }}'
    ntpServer:
      - string
    snmpServer:
      configureDnacIP: true
      ipAddresses:
        - string
    syslogServer:
      configureDnacIP: true
      ipAddresses:
        - string
    timezone: string
  siteId: application/json
  validate_response_schema: null
