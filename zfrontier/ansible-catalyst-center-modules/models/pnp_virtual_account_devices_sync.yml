---
# Data model for cisco.catalystcenter.pnp_virtual_account_devices_sync (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.pnp_virtual_account_devices_sync
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_virtual_account_devices_sync_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/pnp_virtual_account_devices_sync.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 489
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Device Onboarding (PnP)

pnp_virtual_account_devices_sync:
  autoSyncPeriod: 0
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  ccoUser: string
  expiry: 0
  lastSync: 0
  profile:
    addressFqdn: string
    addressIpV4: string
    cert: string
    makeDefault: true
    name: string
    port: 0
    profileId: string
    proxy: true
  smartAccountId: string
  syncResult:
    syncList:
      - deviceSnList:
          - string
        syncType: string
    syncMsg: string
  syncResultStr: string
  syncStartTime: 0
  syncStatus: string
  tenantId: string
  token: '{{ vault_token }}'
  validate_response_schema: null
  virtualAccountId: string
