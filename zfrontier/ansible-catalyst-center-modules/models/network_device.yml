---
# Data model for cisco.catalystcenter.network_device (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.network_device
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/network_device.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 339
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Devices

network_device:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  cleanConfig: null
  cliTransport: string
  computeDevice: true
  enablePassword: '{{ vault_enablepassword }}'
  extendedDiscoveryInfo: string
  httpPassword: '{{ vault_httppassword }}'
  httpPort: string
  httpSecure: true
  httpUserName: string
  id: null
  ipAddress:
    - string
  merakiOrgId:
    - string
  netconfPort: string
  password: '{{ vault_password }}'
  serialNumber: string
  snmpAuthPassphrase: '{{ vault_snmpauthpassphrase }}'
  snmpAuthProtocol: string
  snmpMode: string
  snmpPrivPassphrase: '{{ vault_snmpprivpassphrase }}'
  snmpPrivProtocol: string
  snmpROCommunity: '{{ vault_snmprocommunity }}'
  snmpRWCommunity: '{{ vault_snmprwcommunity }}'
  snmpRetry: 0
  snmpTimeout: 0
  snmpUserName: string
  snmpVersion: string
  type: string
  updateMgmtIPaddressList:
    - existMgmtIpAddress: null
      newMgmtIpAddress: null
  userName: string
  validate_response_schema: null
