---
# Data model for cisco.catalystcenter.iot_non_fabric_rep_rings (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.iot_non_fabric_rep_rings
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/iot_non_fabric_rep_rings_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/iot_non_fabric_rep_rings.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 941
  group: 8. Wired and industrial
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Industrial Configuration

iot_non_fabric_rep_rings:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  deploymentMode: string
  id: string
  macsecConfig:
    accessControlMode: string
    ciphersuite: string
    encryptionMode: string
    keys:
      - cryptoAlgo: string
        id: 0
        passPhrase: string
        startTime: string
  networkDeviceId: string
  repSegmentId: 0
  repZtpMsg: string
  ringMembers:
    - networkDeviceId: string
      nodeName: string
      portName1: string
      portName2: string
      portRepZtpStatus1: string
      portRepZtpStatus2: string
      ringOrder: 0
  ringName: string
  rootNeighbourNetworkDeviceIds:
    - string
  rootNetworkDeviceId: string
  status: string
  validate_response_schema: null
