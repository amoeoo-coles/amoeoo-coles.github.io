      - configType: string
        holdtime: 0
        isAdvertiseV2Enabled: true
        isCdpEnabled: true
        timer: 0
  etherchannelConfig:
    items:
      - configType: string
        isAutoEnabled: true
        lacpSystemPriority: 0
        loadBalancingMethod: string
  feature: string
  id: string
  igmpSnoopingConfig:
    items:
      - configType: string
        igmpSnoopingQuerierEntry:
          configType: string
          items:
            - configType: string
              querierAddress: string
              querierVersion: 0
              queryInterval: 0
        igmpSnoopingVlans:
          configType: string
          items:
            - configType: string
              isImmediateLeaveEnabled: true
              isQuerierEnabled: true
              mrouterInterface: string
              querierAddress: string
              querierVersion: 0
              queryInterval: 0
              vlanId: 0
        isIgmpSnoopingEnabled: true
        isQuerierEnabled: true
        lastMemberQueryInterval: 0
  lldpConfig:
    items:
      - configType: string
        holdtime: 0
        isLldpEnabled: true
        reinitializationDelay: 0
        timer: 0
  macAddressTableConfig:
    items:
      - agingTime: 0
        configType: string
        isChangeNotificationEnabled: true
        isMacMoveEnabled: true
        isNotificationThresholdEnabled: true
        macAddressTableStatic:
          configType: string
          items:
            - configType: string
              destinationInterface: string
              isDropEnabled: true
              macAddress: string
              vlanId: 0
        macAddressTableVlanAgingTime:
          configType: string
          items:
            - agingTime: 0
              configType: string
              vlanId: 0
        notificationChangeHistorySize: 0
        notificationChangeInterval: 0
        notificationThresholdInterval: 0
        notificationThresholdLimit: 0
  mldSnoopingConfig:
    items:
      - configType: string
        isListenerMessageSuppressionEnabled: true
        isMldSnoopingEnabled: true
        isQuerierEnabled: true
        lastListenerQueryInterval: 0
        mldSnoopingQuerierEntry:
          configType: string
          items:
            - configType: string
              querierAddress: string
              querierVersion: 0
              queryInterval: 0
        mldSnoopingVlans:
          configType: string
          items:
            - configType: string
              isImmediateLeaveEnabled: true
              isQuerierEnabled: true
              mrouterInterface: string
              querierAddress: string
              querierVersion: 0
              queryInterval: 0
              vlanId: 0
  stpConfig:
    items:
      - configType: string
        isBackboneFastEnabled: true
        isBpduFilterEnabled: true
        isBpduGuardEnabled: true
        isEtherChannelGuardEnabled: true
        isExtendedSystemIdEnabled: true
        isLoggingEnabled: true
        isLoopGuardEnabled: true
        isUplinkFastEnabled: true
        portFastMode: string
        stpMode: string
        transmitHoldCount: 0
        uplinkFastMaxUpdateRate: 0
        vlanConfig:
          configType: string
          items:
            - configType: string
              forwardDelay: 0
              helloInterval: 0
              maxAge: 0
              priority: 0
              vlan: 0
  udldConfig:
    items:
      - configType: string
        isAggressiveEnabled: true
        isRecoveryEnabled: true
        isUdldEnabled: true
        messageTime: 0
        recoveryInterval: 0
  validate_response_schema: null
  vlanConfig:
    items:
      - configType: string
        isRemoteSpanEnabled: true
