            - hostname: null
              ip_address: null
              mac_address: null
              serial_number:
                - FCW2137L0SB
            - hostname:
                - SJ-BN-9300.cisco.local
              ip_address: null
              mac_address: null
              serial_number: null
            - hostname: null
              ip_address: null
              mac_address:
