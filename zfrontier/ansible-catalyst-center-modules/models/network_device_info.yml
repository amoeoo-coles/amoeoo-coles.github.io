---
# Data model for cisco.catalystcenter.network_device_info (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.network_device_info
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_info_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/network_device_info.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: info (read-only)
  build_order: 435
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Devices

network_device_info:
  associatedWlcIp: []
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  collectionInterval: []
  collectionStatus: []
  deviceSupportLevel: string
  errorCode: []
  errorDescription: []
  family: []
  headers: '{{my_headers | from_json}}'
  hostname: []
  id: string
  license_name: []
  license_status: []
  license_type: []
  limit: 500
  location: []
  locationName: []
  macAddress: []
  managementIpAddress: []
  module_equpimenttype: []
  module_name: []
  module_operationstatecode: []
  module_partnumber: []
  module_servicestate: []
  module_vendorequipmenttype: []
  notSyncedForMinutes: []
  offset: 1
  platformId: []
  reachabilityStatus: []
  role: []
  serialNumber: []
  series: []
  softwareType: []
  softwareVersion: []
  type: []
  upTime: []
  validate_response_schema: null
