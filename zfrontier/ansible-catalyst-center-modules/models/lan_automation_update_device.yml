---
# Data model for cisco.catalystcenter.lan_automation_update_device (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.lan_automation_update_device
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/lan_automation_update_device_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/lan_automation_update_device.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 632
  group: 6. Templates, LAN automation and compliance
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: LAN Automation

lan_automation_update_device:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  feature: string
  hostnameUpdateDevices:
    - deviceManagementIPAddress: string
      newHostName: string
  linkUpdate:
    destinationDeviceInterfaceName: string
    destinationDeviceManagementIPAddress: string
    ipPoolName: string
    ipV6Only: true
    sourceDeviceInterfaceName: string
    sourceDeviceManagementIPAddress: string
    useP2PLinkLocalAddress: true
  loopbackUpdateDeviceList:
    - deviceManagementIPAddress: string
      newLoopback0IPAddress: string
  validate_response_schema: null
