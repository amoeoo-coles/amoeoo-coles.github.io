---
# Data model for cisco.catalystcenter.pnp_device_import (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.pnp_device_import
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/pnp_device_import_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/pnp_device_import.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 480
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation
  api_family: Device Onboarding (PnP)

pnp_device_import:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  payload:
    - _id: string
      deviceInfo:
        description: string
        deviceSudiSerialNos:
          - string
        hostname: string
        macAddress: string
        pid: string
        serialNumber: string
        siteId: string
        stack: true
        stackInfo:
          isFullRing: true
          stackMemberList:
            - hardwareVersion: string
              licenseLevel: string
              licenseType: string
              macAddress: string
              pid: string
              priority: 0
              role: string
              serialNumber: string
              softwareVersion: string
              stackNumber: 0
              state: string
              sudiSerialNumber: string
          stackRingProtocol: string
          supportsStackWorkflows: true
          totalMemberCount: 0
          validLicenseLevels:
            - string
        sudiRequired: true
        userMicNumbers:
          - string
        userSudiSerialNos:
          - string
        workflowId: string
        workflowName: string
  validate_response_schema: null
