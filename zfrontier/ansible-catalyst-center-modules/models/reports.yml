---
# Data model for cisco.catalystcenter.reports (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.reports
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/reports_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/reports.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1469
  group: 11. Assurance, events and reports
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Reports

reports:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  dataCategory: string
  deliveries: []
  name: string
  reportId: null
  schedule: {}
  tags:
    - string
  validate_response_schema: null
  view:
    fieldGroups:
      - fieldGroupDisplayName: string
        fieldGroupName: string
        fields:
          - displayName: string
            name: string
    filters:
      - displayName: string
        name: string
        type: string
        value: {}
    format:
      formatType: string
      name: string
    name: string
    viewId: string
  viewGroupId: string
  viewGroupVersion: string
