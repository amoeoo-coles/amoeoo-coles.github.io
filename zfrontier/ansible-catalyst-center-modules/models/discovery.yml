---
# Data model for cisco.catalystcenter.discovery (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.discovery
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/discovery.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 271
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Discovery

discovery:
  attributeInfo: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  cdpLevel: 0
  deviceIds: null
  discoveryCondition: null
  discoveryStatus: null
  discoveryType: string
  enablePasswordList:
    - '{{ vault_enablepasswordlist }}'
  globalCredentialIdList:
    - string
  httpReadCredential:
    password: '{{ vault_password }}'
    port: 0
    secure: true
    username: string
  httpWriteCredential:
    password: '{{ vault_password }}'
    port: 0
    secure: true
    username: string
  id: null
  ipAddressList: string
  ipFilterList:
    - string
  isAutoCdp: null
  lldpLevel: 0
  name: string
  netconfPort: string
  numDevices: null
  parentDiscoveryId: null
  passwordList:
    - '{{ vault_passwordlist }}'
  preferredMgmtIPMethod: string
  protocolOrder: string
  retry: 0
  retryCount: null
  snmpAuthPassphrase: '{{ vault_snmpauthpassphrase }}'
  snmpAuthProtocol: string
  snmpMode: string
  snmpPrivPassphrase: '{{ vault_snmpprivpassphrase }}'
  snmpPrivProtocol: string
  snmpROCommunity: '{{ vault_snmprocommunity }}'
  snmpROCommunityDesc: '{{ vault_snmprocommunitydesc }}'
  snmpRWCommunity: '{{ vault_snmprwcommunity }}'
  snmpRWCommunityDesc: '{{ vault_snmprwcommunitydesc }}'
  snmpUserName: string
  snmpVersion: string
  timeout: 0
  updateMgmtIp: null
  userNameList:
    - string
  validate_response_schema: null
