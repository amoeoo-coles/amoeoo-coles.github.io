---
# Data model for cisco.catalystcenter.backup_and_restore_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.backup_and_restore_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/backup_and_restore_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/backup_and_restore_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 99
  group: 1. System, users and platform
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

backup_and_restore_workflow_manager:
  catalystcenter_api_task_timeout: 1000
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: DEBUG
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: 1
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - backup:
        - backup_retention_days: null
          backup_task_timeout: null
          delete_all_backup: null
          generate_new_backup: null
          name: null
          scope: null
      backup_storage_configuration:
        - data_retention_period: null
          encryption_passphrase: null
          nfs_details:
            nfs_port: null
            nfs_portmapper_port: null
            nfs_version: null
            server_ip: null
            source_path: null
          server_type: null
      nfs_configuration:
        - nfs_port: 2049
          nfs_portmapper_port: 111
          nfs_version: nfs4
          server_ip: '{{ nfs_configuration.server_ip }}'
          source_path: '{{ nfs_configuration.source_path }}'
      restore_operations:
        - encryption_passphrase: null
          name: null
          restore_task_timeout: null
  config_verify: true
  state: merged
  validate_response_schema: null
