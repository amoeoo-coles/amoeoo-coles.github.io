---
# Data model for cisco.catalystcenter.applications_v2 (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.applications_v2
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/applications_v2_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/applications_v2.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1329
  group: 10. Application policy and endpoint analytics
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Application Policy

applications_v2:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  id: null
  payload:
    - displayName: string
      id: string
      indicativeNetworkIdentity:
        - displayName: string
          id: string
          lowerPort: 0
          ports: string
          protocol: string
          upperPort: 0
      instanceId: 0
      instanceVersion: 0
      name: string
      namespace: string
      networkApplications:
        - appProtocol: string
          applicationSubType: string
          applicationType: string
          categoryId: string
          displayName: string
          dscp: string
          engineId: string
          helpString: string
          id: string
          ignoreConflict: true
          longDescription: string
          name: string
          popularity: 0
          rank: 0
          selectorId: string
          serverName: string
          trafficClass: string
          url: string
      networkIdentity:
        - displayName: string
          id: string
          ipv4Subnet:
            - string
          ipv6Subnet: []
          lowerPort: 0
          ports: string
          protocol: string
          upperPort: 0
      parentScalableGroup:
        idRef: string
      qualifier: string
      scalableGroupExternalHandle: string
      scalableGroupType: string
      type: string
  validate_response_schema: null
