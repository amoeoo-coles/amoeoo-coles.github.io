---
# Data model for cisco.catalystcenter.wireless_enterprise_ssid (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_enterprise_ssid
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_enterprise_ssid_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_enterprise_ssid.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 1028
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Wireless

wireless_enterprise_ssid:
  aaaOverride: true
  authKeyMgmt:
    - '{{ vault_authkeymgmt }}'
  basicServiceSetClientIdleTimeout: 0
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  clientExclusionTimeout: 0
  clientRateLimit: 0
  coverageHoleDetectionEnable: true
  enableBasicServiceSetMaxIdle: true
  enableBroadcastSSID: true
  enableClientExclusion: true
  enableDirectedMulticastService: true
  enableFastLane: true
  enableMACFiltering: true
  enableNeighborList: true
  enableSessionTimeOut: true
  fastTransition: string
  ghz24Policy: string
  ghz6PolicyClientSteering: true
  mfpClientProtection: string
  multiPSKSettings:
    - passphrase: '{{ vault_passphrase }}'
      passphraseType: string
      priority: 0
  name: string
  nasOptions:
    - string
  passphrase: '{{ vault_passphrase }}'
  policyProfileName: string
  profileName: string
  protectedManagementFrame: string
  radioPolicy: string
  rsnCipherSuiteCcmp256: true
  rsnCipherSuiteGcmp128: true
  rsnCipherSuiteGcmp256: true
  securityLevel: string
  sessionTimeOut: 0
  ssidName: null
  trafficType: string
  validate_response_schema: null
