---
# Data model for cisco.catalystcenter.accesspoint_location_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.accesspoint_location_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/accesspoint_location_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/accesspoint_location_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 1316
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

accesspoint_location_workflow_manager:
  catalystcenter_api_task_timeout: 1000
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: DEBUG
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: 1
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - access_points:
        - accesspoint_model: AP9120E
          accesspoint_name: AP687D.B402.1614-AP-location_Test6
          action: null
          mac_address: null
          position:
            x_position: 30
            y_position: 30
            z_position: 8
          radios:
            - antenna:
                antenna_name: AIR-ANT2524DB-R-2.4GHz
                azimuth: 30
                elevation: 30
              bands:
                - '2.4'
              channel: 11
              tx_power: 5
            - antenna:
                antenna_name: AIR-ANT2524DB-R-5GHz
                azimuth: 30
                elevation: 30
              bands:
                - '5'
              channel: 44
              tx_power: 6
            - antenna:
                antenna_name: AIR-ANT2524DB-R
                azimuth: 30
                elevation: 30
              bands:
                - '2.4'
                - '5'
              channel: 48
              tx_power: 6
      floor_site_hierarchy: Global/USA/SAN JOSE/SJ_BLD23/FLOOR1
  config_verify: true
  state: merged
  validate_response_schema: null
