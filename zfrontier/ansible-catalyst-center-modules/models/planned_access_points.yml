---
# Data model for cisco.catalystcenter.planned_access_points (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.planned_access_points
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/planned_access_points_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/planned_access_points.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 370
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Devices

planned_access_points:
  attributes:
    createDate: 0
    domain: string
    heirarchyName: string
    id: 0
    instanceUuid: string
    macAddress: string
    name: string
    source: string
    typeString: string
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  floorId: string
  isSensor: true
  location:
    altitude: 0
    lattitude: 0
    longtitude: 0
  plannedAccessPointUuid: null
  position:
    x: 0
    y: 0
    z: 0
  radioCount: 0
  radios:
    - antenna:
        azimuthAngle: 0
        elevationAngle: 0
        gain: 0
        mode: string
        name: string
        type: string
      attributes:
        channel: 0
        channelString: string
        id: 0
        ifMode: string
        ifTypeString: string
        ifTypeSubband: string
        instanceUuid: string
        slotId: 0
        txPowerLevel: 0
      isSensor: true
  validate_response_schema: null
