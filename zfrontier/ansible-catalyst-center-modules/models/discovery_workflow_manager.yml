---
# Data model for cisco.catalystcenter.discovery_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.discovery_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/discovery_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 539
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

discovery_workflow_manager:
  catalystcenter_api_task_timeout: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: '{{catalystcenter_log_level}}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: null
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - cdp_level: null
      delete_all: null
      discovery_name: Discovery with both global and job specific credentials
      discovery_specific_credentials:
        cli_credentials_list:
          - enable_password: '{{ discovery_cli_enable_password }}'
            password: '{{ discovery_cli_password }}'
            username: cisco
        http_read_credential:
          password: '{{ discovery_http_read_password }}'
          port: 443
          secure: true
          username: cisco
        http_write_credential:
          password: '{{ discovery_http_write_password }}'
          port: 443
          secure: true
          username: cisco
        net_conf_port: 750
        snmp_v2_read_credential:
          community: '{{ discovery_snmp_v2_read_community }}'
          description: snmp_v2-new
        snmp_v2_write_credential:
          community: '{{ discovery_snmp_v2_write_community }}'
          description: snmp_v2-new
        snmp_v3_credential:
          auth_password: '{{ discovery_snmp_v3_auth_password }}'
          auth_type: SHA
          privacy_password: '{{ discovery_snmp_v3_privacy_password }}'
          privacy_type: AES256
          snmp_mode: AUTHPRIV
          username: v3Public2
      discovery_type: RANGE
      global_credentials:
        cli_credentials_list:
          - description: ISE
            username: cisco
          - description: CLI1234
            username: cli
        http_read_credential_list:
          - description: HTTP Read
            username: HTTP_Read
        http_write_credential_list:
          - description: HTTP Write
            username: HTTP_Write
        net_conf_port_list:
          - description: Old_one
        snmp_v2_read_credential_list:
          - description: snmpV2_read
        snmp_v2_write_credential_list:
          - description: snmpV2_write
        snmp_v3_credential_list:
          - description: snmpV3
            username: snmpV3
      ip_address_list:
        - 192.0.2.1-192.0.2.100
      ip_filter_list:
        - 192.0.2.2
        - 192.0.2.10
      lldp_level: null
      preferred_mgmt_ip_method: null
      protocol_order: ssh
      records_to_return: 100
      retry: 5
      start_index: 1
      timeout: 3
      use_global_credentials: null
  config_verify: true
  state: merged
  validate_response_schema: null
