---
# Data model for cisco.catalystcenter.network_profile_wireless_workflow_manager (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.network_profile_wireless_workflow_manager
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_profile_wireless_workflow_manager_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/network_profile_wireless_workflow_manager.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: workflow manager
  build_order: 1318
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state merged)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

network_profile_wireless_workflow_manager:
  catalystcenter_api_task_timeout: 1000
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_log: true
  catalystcenter_log_append: null
  catalystcenter_log_file_path: null
  catalystcenter_log_level: DEBUG
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_task_poll_interval: 1
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  config:
    - additional_interfaces:
        - interface_name: Corp_Interface_1
          vlan_id: 100
        - interface_name: Guest_Interface_1
          vlan_id: 3002
      ap_zones:
        - ap_zone_name: HQ_AP_Zone
          rf_profile_name: HIGH
          ssids:
            - Corporate_WiFi
        - ap_zone_name: Branch_AP_Zone
          rf_profile_name: TYPICAL
          ssids:
            - Guest_WiFi
      day_n_templates:
        - Wireless_Controller_Config
      feature_template_designs:
        - applicability_ssids:
            - HQ_WiFi
            - Branch_Secure
          design_type: Advanced SSID Configuration
          feature_templates:
            - Default Advanced SSID Design
      profile_name: Corporate_Wireless_Profile
      site_names:
        - Global/Headquarters
        - Global/BranchOffice
      ssid_details:
        - anchor_group_name: null
          dot11be_profile_name: Corporate_VLAN
          enable_fabric: false
          interface_name: null
          local_to_vlan: null
          ssid_name: Corporate_WiFi
          vlan_group_name: Corporate_VLAN_Group
        - anchor_group_name: null
          dot11be_profile_name: Corporate_VLAN
          enable_fabric: false
          interface_name: guest_network
          local_to_vlan: 3002
          ssid_name: Guest_WiFi
          vlan_group_name: null
  config_verify: true
  state: merged
  validate_response_schema: null
