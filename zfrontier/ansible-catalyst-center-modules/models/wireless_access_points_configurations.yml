---
# Data model for cisco.catalystcenter.wireless_access_points_configurations (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.wireless_access_points_configurations
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/wireless_access_points_configurations_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/wireless_access_points_configurations.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 980
  group: 9. Wireless
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Wireless

wireless_access_points_configurations:
  accelerometerStateEnabled: true
  accessPoints:
    - geolocationConfiguration:
        cableLength: 0
        geolocationHeight: 0
        geolocationHeightUncertainty: 0
      macAddress: string
      name: string
      newName: string
  adminStatus: true
  assignSiteAsLocation: true
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  cleanAirSI24: true
  cleanAirSI5: true
  cleanAirSI6: true
  dnsIpAddress: 192.0.2.4
  domainName: string
  failoverPriority: string
  lanPortConfigurations:
    - poeStatus: true
      portId: 0
      portStatus: true
  ledBrightnessLevel: 0
  ledStatus: true
  location: string
  meshRole: string
  mode: string
  primaryControllerIpAddress: 192.0.2.45
  primaryControllerName: string
  radioConfigurations:
    - adminStatus: true
      antennaCableName: string
      antennaGain: 0
      antennaName: string
      bssColor: 0
      bssColorAssignmentMode: string
      bssColorRadioAdminStatus: true
      cableLoss: 0
      channelAssignmentMode: string
      channelNumber: 0
      channelWidth: string
      dualRadioMode: true
      powerAssignmentMode: string
      powerLevel: 0
      radioBand: string
      radioRoleAssignment: string
      radioType: string
      slotId: 0
  rapDownlinkBackhaul: string
  secondaryControllerIpAddress: 192.0.2.46
  secondaryControllerName: string
  tertiaryControllerIpAddress: 192.0.2.47
  tertiaryControllerName: string
  validate_response_schema: null
  vlanTagId: 0
  vlanTagStatus: true
