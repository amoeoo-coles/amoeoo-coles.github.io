---
# Data model for cisco.catalystcenter.device_credential (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.device_credential
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/device_credential_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/device_credential.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 189
  group: 3. Network settings, IPAM and tags
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Network Settings

device_credential:
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  id: null
  settings:
    cliCredential:
      - description: string
        enablePassword: '{{ vault_enablepassword }}'
        password: '{{ vault_password }}'
        username: string
    httpsRead:
      - name: string
        password: '{{ vault_password }}'
        port: 0
        username: string
    httpsWrite:
      - name: string
        password: '{{ vault_password }}'
        port: 0
        username: string
    snmpV2cRead:
      - description: string
        readCommunity: '{{ vault_readcommunity }}'
    snmpV2cWrite:
      - description: string
        writeCommunity: '{{ vault_writecommunity }}'
    snmpV3:
      - authPassword: '{{ vault_authpassword }}'
        authType: string
        description: string
        privacyPassword: '{{ vault_privacypassword }}'
        privacyType: string
        snmpMode: string
        username: string
  validate_response_schema: null
