---
# Data model for cisco.catalystcenter.network_device_licenses (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.network_device_licenses
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/network_device_licenses_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/network_device_licenses.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: action
  build_order: 516
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation
  api_family: Licenses

network_device_licenses:
  authCodeStatus: string
  authorizationStatus: string
  catalystcenter_debug: '{{ catalystcenter_debug }}'
  catalystcenter_host: '{{ catalystcenter_host }}'
  catalystcenter_password: '{{ catalystcenter_password }}'
  catalystcenter_port: '{{ catalystcenter_port }}'
  catalystcenter_username: '{{ catalystcenter_username }}'
  catalystcenter_verify: '{{ catalystcenter_verify }}'
  catalystcenter_version: '{{ catalystcenter_version }}'
  changeWirelessLicense: true
  customerTags:
    tag1: string
    tag2: string
    tag3: string
    tag4: string
  family: string
  hostname: string
  id: string
  lastSuccessfulUsageReportingTime: {}
  licenseLevel: string
  licenseManagedBy: string
  licenseMode: string
  licenses:
    - count: 0
      evaluationExpiryTime: {}
      name: string
      owned: true
      status: string
      type: string
  managementAddress: 192.0.2.1
  networkDeviceId: string
  registrationStatus: string
  series: string
  siteHierarchy: string
  smartAccountId: string
  softwareVersion: string
  throughputValue: string
  triggerReboot: true
  validate_response_schema: null
  virtualAccountId: string
  wirelessCapable: true
