---
# Data model for cisco.catalystcenter.discovery_playbook_config_generator (cisco.catalystcenter 2.15.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystcenter.discovery_playbook_config_generator
  collection: cisco.catalystcenter
  collection_version: 2.15.0
  doc_url: https://cisco-en-programmability.github.io/catalystcenter-ansible/v2.15.0/plugins/discovery_playbook_config_generator_module.html
  source_url: https://github.com/cisco-en-programmability/catalystcenter-ansible/blob/v2.15.0/plugins/modules/discovery_playbook_config_generator.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystcenter/
  module_type: config generator
  build_order: 535
  group: 4. Discovery, inventory and PnP
  sample_values_from: module EXAMPLES (first task)
  deprecation: none stated in module documentation
  api_family: not stated in module documentation

discovery_playbook_config_generator:
  catalystcenter_api_task_timeout: null
  catalystcenter_debug: '{{ catalystcenter_debug }}'
