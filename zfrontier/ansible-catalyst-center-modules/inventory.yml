---
# Example inventory for the cisco.catalystcenter 2.15.0 catalogue. Placeholders only.
#   ansible-playbook -i inventory.yml site.yml -e catalystcenter_host=catalyst.example.net \
#     -e catalystcenter_username=admin -e catalystcenter_password='***'
all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    catalystcenter_host: "{{ catalystcenter_host }}"
    catalystcenter_port: 443
    catalystcenter_verify: true
    catalystcenter_version: "2.3.7.9"
    catalystcenter_debug: false
