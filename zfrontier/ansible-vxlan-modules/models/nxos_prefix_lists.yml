# Model for cisco.nxos.nxos_prefix_lists. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_prefix_lists_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_prefix_lists
  schema_path: plugins/modules/nxos_prefix_lists.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_prefix_lists:
  config:
  - afi: ipv4
    prefix_lists:
    - name: AllowPrefix
      description: allows engineering IPv4 networks
      entries:
      - sequence: 10
        action: permit
        prefix: 192.0.2.0/23
        eq: 24
      - sequence: 20
        action: permit
        prefix: 198.51.100.128/26
    - name: DenyPrefix
      description: denies lab IPv4 networks
      entries:
      - sequence: 20
        action: deny
        prefix: 203.0.113.0/24
        le: 25
  - afi: ipv6
    prefix_lists:
    - name: AllowIPv6Prefix
      description: allows engineering IPv6 networks
      entries:
      - sequence: 8
        action: permit
        prefix: 2001:db8:400::/38
      - sequence: 20
        action: permit
        prefix: 2001:db8:8000::/35
        le: 37
  running_config: null
  state: merged
