---
# Model for cisco.dcnm.dcnm_policy. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_policy_module.rst
  collection: cisco.dcnm
  collection_version: 3.13.1
  kind: module
  module: cisco.dcnm.dcnm_policy
  schema_path: plugins/modules/dcnm_policy.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 5
  deprecated: false
dcnm_policy:
  config:
  - name: template_101
    create_additional_policy: false
    priority: 101
  - name: template_102
    create_additional_policy: false
    description: 102 - No piority given
  - name: template_103
    create_additional_policy: false
    description: Both description and priority given
    priority: 500
  - switch:
    - ip: '{{ ansible_switch1 }}'
      policies:
      - name: template_104
        create_additional_policy: false
      - name: template_105
        create_additional_policy: false
    - ip: '{{ ansible_switch2 }}'
  deploy: true
  fabric: '{{ ansible_it_fabric }}'
  state: merged
  use_desc_as_key: null
