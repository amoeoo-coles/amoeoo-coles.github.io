---
# Model for cisco.dcnm.dcnm_links. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_links_module.rst
  collection: cisco.dcnm
  collection_version: 3.13.1
  kind: module
  module: cisco.dcnm.dcnm_links
  schema_path: plugins/modules/dcnm_links.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 4
  deprecated: false
dcnm_links:
  config:
  - dst_fabric: ansible_num_fabric
    src_interface: Ethernet1/1
    dst_interface: Ethernet1/1
    src_device: 193.168.1.1
    dst_device: 193.168.1.2
    template: int_intra_fabric_num_link
    profile:
      peer1_ipv4_addr: 192.168.1.1
      peer2_ipv4_addr: 192.168.1.2
      admin_state: true
      mtu: 9216
      peer1_description: Description of source
      peer2_description: Description of dest
      peer1_bfd_echo_disable: false
      peer2_bfd_echo_disable: false
      enable_macsec: false
      peer1_cmds:
      - no shutdown
      peer2_cmds:
      - no shutdown
  - dst_fabric: ansible_num_fabric
    src_interface: Ethernet1/2
    dst_interface: Ethernet1/2
    src_device: 193.168.1.1
    dst_device: 193.168.1.2
    template: int_pre_provision_intra_fabric_link
  - dst_fabric: ansible_num_fabric
    src_interface: Ethernet1/3
    dst_interface: Ethernet1/3
    src_device: 193.168.1.1
    dst_device: 193.168.1.2
    template: ios_xe_int_intra_fabric_num_link
    profile:
      peer1_ipv4_addr: 192.169.2.1
      peer2_ipv4_addr: 192.169.2.2
      peer1_ipv6_addr: fe80:01::01
      peer2_ipv6_addr: fe80:01::02
      admin_state: true
      mtu: 1500
      peer1_description: Description of source
      peer2_description: Description of dest
      peer1_bfd_echo_disable: false
      peer2_bfd_echo_disable: false
      enable_macsec: false
      peer1_cmds:
      - no shutdown
      peer2_cmds:
      - no shutdown
  deploy: null
  src_fabric: ansible_num_fabric
  state: merged
