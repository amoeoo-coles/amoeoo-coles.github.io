---
# Model for cisco.nxos.nxos_acls. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_acls_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_acls
  schema_path: plugins/modules/nxos_acls.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_acls:
  config:
  - afi: ipv4
    acls:
    - name: ACL1v4
      aces:
      - grant: deny
        destination:
          address: 192.0.2.64
          wildcard_bits: 0.0.0.255
        source:
          any: true
          port_protocol:
            lt: 55
        protocol: tcp
        protocol_options:
          tcp:
            ack: true
            fin: true
        sequence: 50
  - afi: ipv6
    acls:
    - name: ACL1v6
      aces:
      - grant: permit
        sequence: 10
        source:
          any: true
        destination:
          prefix: 2001:db8:12::/32
        protocol: sctp
  running_config: null
  state: merged
