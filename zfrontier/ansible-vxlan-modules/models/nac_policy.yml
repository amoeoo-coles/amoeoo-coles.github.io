vxlan:
  policy:
    policies:
    - name: alias
      template_name: bgp_peer_template
      filename: ./data/policies/alias.cfg
      template_vars:
        BGP_AS: '64690'
        TEMPLATE_TYPE: peer
        TEMPLATE_NAME: ebgp-cmd-pr-fmg-f5
        CONF: |2-
            bfd multihop
            remote-as 65386
            description ebgp-cmd-pr-fmg-f5
            update-source Loopback5
    groups:
    - name: server leafs
      priority: 500
      policies:
      - name: grpc feature
        priority: 50
    switches:
    - name: nac-leaf3
      groups:
      - server leafs
