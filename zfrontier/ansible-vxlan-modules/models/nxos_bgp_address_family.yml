---
# Model for cisco.nxos.nxos_bgp_address_family. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_bgp_address_family_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_bgp_address_family
  schema_path: plugins/modules/nxos_bgp_address_family.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_bgp_address_family:
  config:
    as_number: 65536
    address_family:
    - afi: ipv4
      safi: multicast
      networks:
      - prefix: 192.0.2.32/27
      - prefix: 192.0.2.64/27
        route_map: rmap1
      nexthop:
        route_map: rmap2
        trigger_delay:
          critical_delay: 120
          non_critical_delay: 180
    - afi: ipv4
      safi: unicast
      vrf: site-1
      default_information:
        originate: true
      aggregate_address:
      - prefix: 203.0.113.0/24
        as_set: true
        summary_only: true
    - afi: ipv6
      safi: multicast
      vrf: site-1
      redistribute:
      - protocol: ospfv3
        id: 100
        route_map: rmap-ospf-1
      - protocol: eigrp
        id: 101
        route_map: rmap-eigrp-1
  running_config: null
  state: merged
