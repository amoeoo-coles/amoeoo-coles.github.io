  collection: cisco.dcnm
  collection_version: 3.13.1
  kind: module
  module: cisco.dcnm.dcnm_image_upload
  schema_path: plugins/modules/dcnm_image_upload.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 2
  deprecated: false
dcnm_image_upload:
  files:
  - path: full/path/to/image1
    source: scp
    remote_server: 192.0.2.1
    username: image_upload
    password: '{{ password_placeholder }}'
  - path: full/path/to/image2
    source: local
  - path: full/path/to/image3
    source: sftp
    remote_server: 192.0.2.1
