---
# Model for cisco.nxos.nxos_route_maps. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_route_maps_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_route_maps
  schema_path: plugins/modules/nxos_route_maps.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_route_maps:
  config:
  - route_map: rmap1
    entries:
    - sequence: 10
      action: permit
      description: rmap1-10-permit
      match:
        ip:
          address:
            access_list: acl_1
        as_path: Allow40
        as_number:
          asn: 65564
    - sequence: 20
      action: deny
      description: rmap1-20-deny
      match:
        community:
          community_list:
          - BGPCommunity1
          - BGPCommunity2
        ip:
          address:
            prefix_lists:
            - AllowPrefix1
            - AllowPrefix2
      set:
        dampening:
          half_life: 30
          start_reuse_route: 1500
          start_suppress_route: 10000
          max_suppress_time: 120
  - route_map: rmap2
    entries:
    - sequence: 20
      action: permit
      description: rmap2-20-permit
      continue_sequence: 40
      match:
        ipv6:
          address:
            prefix_lists: AllowIPv6Prefix
        interfaces: '{{ nxos_int1 }}'
      set:
        as_path:
          prepend:
            as_number:
            - 65563
            - 65568
            - 65569
        comm_list: BGPCommunity
    - sequence: 40
      action: deny
      description: rmap2-40-deny
      match:
        route_types:
        - level-1
        - level-2
        tags: 2
        ip:
          multicast:
            rp:
              prefix: 192.0.2.0/24
              rp_type: ASM
            source: 203.0.113.0/24
            group_range:
              first: 239.0.0.1
              last: 239.255.255.255
  - route_map: rmap3
    entries:
    - sequence: 10
      description: '*** first stanza ***'
      action: permit
      set:
        ip:
          next_hop:
            verify_availability:
            - address: 3.3.3.3
              track: 1
            - address: 4.4.4.4
              track: 3
    - sequence: 20
      description: '*** second stanza ***'
      action: permit
      set:
        ip:
          next_hop:
            address: 6.6.6.6 2.2.2.2
            load_share: true
            drop_on_fail: true
    - sequence: 30
      description: '*** third stanza ***'
      action: permit
      set:
        ip:
          next_hop:
            peer_address: true
    - sequence: 40
      description: '*** fourth stanza ***'
      action: permit
      set:
        ip:
          next_hop:
            unchanged: true
            redist_unchanged: true
  running_config: null
  state: merged
