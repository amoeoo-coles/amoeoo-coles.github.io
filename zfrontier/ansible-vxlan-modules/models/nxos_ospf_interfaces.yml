---
# Model for cisco.nxos.nxos_ospf_interfaces. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ospf_interfaces_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_ospf_interfaces
  schema_path: plugins/modules/nxos_ospf_interfaces.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_ospf_interfaces:
  config:
  - name: Ethernet1/1
    address_family:
    - afi: ipv4
      processes:
      - process_id: '100'
        area:
          area_id: 1.1.1.1
          secondaries: false
      multi_areas:
      - 11.11.11.11
    - afi: ipv6
      processes:
      - process_id: '200'
        area:
          area_id: 2.2.2.2
        multi_areas:
        - 21.0.0.0
      - process_id: '300'
        multi_areas:
        - 50.50.50.50
      multi_areas:
      - 16.10.10.10
  - name: Ethernet1/2
    address_family:
    - afi: ipv4
      authentication:
        enable: true
        key_chain: test-1
      message_digest_key:
        key_id: 10
        encryption: 3
        key: '{{ key_placeholder }}'
      cost: 100
    - afi: ipv6
      network: broadcast
      shutdown: true
  - name: Ethernet1/3
    address_family:
    - afi: ipv4
      authentication_key:
        encryption: 7
        key: '{{ key_placeholder }}'
  running_config: null
  state: merged
