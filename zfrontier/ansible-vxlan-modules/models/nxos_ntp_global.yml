---
# Model for cisco.nxos.nxos_ntp_global. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ntp_global_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_ntp_global
  schema_path: plugins/modules/nxos_ntp_global.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_ntp_global:
  config:
    access_group:
      peer:
      - access_list: PeerAcl1
      serve:
      - access_list: ServeAcl1
    authenticate: true
    authentication_keys:
    - id: 1001
      key: '{{ key_placeholder }}'
      encryption: 7
    - id: 1002
      key: '{{ key_placeholder }}'
      encryption: 7
    logging: true
    master:
      stratum: 2
    peers:
    - peer: 192.0.2.1
      key_id: 1
      maxpoll: 15
      minpoll: 5
      vrf: default
    - peer: 192.0.2.2
      key_id: 2
      prefer: true
      vrf: siteA
    servers:
    - server: 198.51.100.1
      key_id: 2
      vrf: default
    - server: 203.0.113.1
      key_id: 1
      vrf: siteB
  running_config: null
  state: merged
