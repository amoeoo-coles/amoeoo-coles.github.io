# Model for cisco.nxos.nxos_logging_global. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_logging_global_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_logging_global
  schema_path: plugins/modules/nxos_logging_global.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_logging_global:
  config:
    console:
      severity: error
    monitor:
      severity: warning
    ip:
      access_list:
        cache:
          entries: 16384
          interval: 200
          threshold: 5000
    facilities:
    - facility: auth
      severity: critical
    - facility: ospfv3
      severity: alert
    - facility: ftp
      severity: informational
    hosts:
    - host: 203.0.113.100
      severity: alert
      use_vrf: management
    - host: 203.0.113.101
      severity: error
      facility: local6
      use_vrf: default
    origin_id:
      hostname: true
  running_config: null
  state: merged
