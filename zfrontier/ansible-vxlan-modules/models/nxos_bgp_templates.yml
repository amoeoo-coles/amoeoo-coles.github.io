---
# Model for cisco.nxos.nxos_bgp_templates. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_bgp_templates_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_bgp_templates
  schema_path: plugins/modules/nxos_bgp_templates.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_bgp_templates:
  config:
    as_number: 65536
    neighbor:
    - name: neighbor_tmplt_1
      address_family:
      - afi: ipv4
        safi: unicast
        advertise_map:
          route_map: rmap1
          non_exist_map: nemap1
        advertisement_interval: 60
        disable_peer_as_check: true
      bmp_activate_server: 2
      capability:
        suppress_4_byte_as: true
      description: Test_BGP_PEER_TEMPLATE_1
      local_as: 65536
      remote_as: 65001
    - name: neighbor_tmplt_2
      description: Test_BGP_PEER_TEMPLATE_2
      address_family:
      - afi: ipv4
        safi: multicast
        advertise_map:
          route_map: rmap1
          exist_map: emap1
        as_override: true
        filter_list:
          inbound: flist1
          outbound: flist2
      inherit:
        peer_session: psession1
      timers:
        holdtime: 100
        keepalive: 45
  running_config: null
  state: merged
