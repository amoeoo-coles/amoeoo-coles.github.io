# Model for cisco.nxos.nxos_bgp_neighbor_address_family. Options are only those documented by the module.
# Values come from the module EXAMPLES; null means omit (module default).
# Secret-like options are placeholders. Do not commit real credentials.
references:
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_bgp_neighbor_address_family_module.html
  collection: cisco.nxos
  collection_version: 14.0.0
  kind: module
  module: cisco.nxos.nxos_bgp_neighbor_address_family
  schema_path: plugins/modules/nxos_bgp_neighbor_address_family.py DOCUMENTATION.options
  example_source: module EXAMPLES (first task)
  options_documented: 3
  deprecated: false
nxos_bgp_neighbor_address_family:
  config:
    as_number: 65536
    neighbors:
    - neighbor_address: 192.0.2.32
      address_family:
      - afi: ipv4
        safi: unicast
        maximum_prefix:
          max_prefix_limit: 20
          generate_warning_threshold: 75
        weight: 100
        prefix_list:
          inbound: rmap1
          outbound: rmap2
      - afi: ipv6
        safi: unicast
    - neighbor_address: 192.0.2.33
      address_family:
      - afi: ipv4
        safi: multicast
        inherit:
          template: BasePolicy
          sequence: 200
    vrfs:
    - vrf: site-1
      neighbors:
      - neighbor_address: 203.0.113.1
        address_family:
        - afi: ipv4
          safi: unicast
          suppress_inactive: true
          next_hop_self:
            set: true
      - neighbor_address: 203.0.113.2
        address_family:
        - afi: ipv6
          safi: unicast
        - afi: ipv4
          safi: multicast
          send_community:
            set: true
  running_config: null
  state: merged
