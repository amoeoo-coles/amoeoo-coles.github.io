---
# Sample playbook 050 for cisco.nxos.nxos_vxlan_vtep_vni
# Build order: 050 of 129 (3. Overlay (NVE, EVPN, VNIs))
# Reads ../models/nxos_vxlan_vtep_vni.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vxlan_vtep_vni_module.html

- name: "050 nxos_vxlan_vtep_vni"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vxlan_vtep_vni.yml
  tasks:
    - name: Run cisco.nxos.nxos_vxlan_vtep_vni with the non-null model parameters
      cisco.nxos.nxos_vxlan_vtep_vni: "{{ nxos_vxlan_vtep_vni | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_vxlan_vtep_vni_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_vxlan_vtep_vni_result
        verbosity: 1
