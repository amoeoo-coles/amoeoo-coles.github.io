---
# Sample playbook 117 for cisco.nxos.nxos_facts
# Build order: 117 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/nxos_facts.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_facts_module.html

- name: "117 nxos_facts"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_facts.yml
  tasks:
    - name: Run cisco.nxos.nxos_facts with the non-null model parameters
      cisco.nxos.nxos_facts: "{{ nxos_facts | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_facts_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_facts_result
        verbosity: 1
