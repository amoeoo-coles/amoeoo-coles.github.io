---
# Sample playbook 018 for cisco.nxos.nxos_logging_global
# Build order: 018 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/nxos_logging_global.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_logging_global_module.html

- name: "018 nxos_logging_global"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_logging_global.yml
  tasks:
    - name: Run cisco.nxos.nxos_logging_global with the non-null model parameters
      cisco.nxos.nxos_logging_global: "{{ nxos_logging_global | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_logging_global_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_logging_global_result
        verbosity: 1
