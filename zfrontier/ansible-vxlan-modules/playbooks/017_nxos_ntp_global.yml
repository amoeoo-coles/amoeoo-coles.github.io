---
# Sample playbook 017 for cisco.nxos.nxos_ntp_global
# Build order: 017 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/nxos_ntp_global.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ntp_global_module.html

- name: "017 nxos_ntp_global"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_ntp_global.yml
  tasks:
    - name: Run cisco.nxos.nxos_ntp_global with the non-null model parameters
      cisco.nxos.nxos_ntp_global: "{{ nxos_ntp_global | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_ntp_global_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_ntp_global_result
        verbosity: 1
