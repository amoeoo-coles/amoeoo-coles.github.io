---
# Sample playbook 109 for role cisco.nac_dc_vxlan.dtc.deploy
# Build order: 109 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/role_dtc_deploy.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/netascode/ansible-dc-vxlan/tree/main/roles/dtc/deploy

- name: "109 role_dtc_deploy (cisco.nac_dc_vxlan.dtc.deploy)"
  hosts: ndfc
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - ../models/role_dtc_deploy.yml
  pre_tasks:
    - name: Apply the role control variables from the model
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ role_variables | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
  roles:
    - role: cisco.nac_dc_vxlan.dtc.deploy
