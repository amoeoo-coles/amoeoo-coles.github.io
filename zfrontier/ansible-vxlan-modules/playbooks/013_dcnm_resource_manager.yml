---
# Sample playbook 013 for cisco.dcnm.dcnm_resource_manager
# Build order: 013 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/dcnm_resource_manager.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_resource_manager_module.rst

- name: "013 dcnm_resource_manager"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_resource_manager.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_resource_manager with the non-null model parameters
      cisco.dcnm.dcnm_resource_manager: "{{ dcnm_resource_manager | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_resource_manager_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_resource_manager_result
        verbosity: 1
