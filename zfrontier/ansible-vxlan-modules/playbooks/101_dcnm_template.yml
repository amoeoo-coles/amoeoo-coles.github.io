---
# Sample playbook 101 for cisco.dcnm.dcnm_template
# Build order: 101 of 129 (7. Policies and route control)
# Reads ../models/dcnm_template.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_template_module.rst

- name: "101 dcnm_template"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_template.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_template with the non-null model parameters
      cisco.dcnm.dcnm_template: "{{ dcnm_template | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_template_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_template_result
        verbosity: 1
