---
# Sample playbook 106 for cisco.nxos.nxos_acl_interfaces
# Build order: 106 of 129 (7. Policies and route control)
# Reads ../models/nxos_acl_interfaces.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_acl_interfaces_module.html

- name: "106 nxos_acl_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_acl_interfaces.yml
  tasks:
    - name: Run cisco.nxos.nxos_acl_interfaces with the non-null model parameters
      cisco.nxos.nxos_acl_interfaces: "{{ nxos_acl_interfaces | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_acl_interfaces_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_acl_interfaces_result
        verbosity: 1
