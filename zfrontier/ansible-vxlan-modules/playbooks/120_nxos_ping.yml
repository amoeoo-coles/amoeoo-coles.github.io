---
# Sample playbook 120 for cisco.nxos.nxos_ping
# Build order: 120 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/nxos_ping.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ping_module.html

- name: "120 nxos_ping"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_ping.yml
  tasks:
    - name: Run cisco.nxos.nxos_ping with the non-null model parameters
      cisco.nxos.nxos_ping: "{{ nxos_ping | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_ping_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_ping_result
        verbosity: 1
