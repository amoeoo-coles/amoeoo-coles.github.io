---
# Sample playbook 001 for role cisco.nac_dc_vxlan.common_global
# Build order: 001 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/role_common_global.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/netascode/ansible-dc-vxlan/tree/main/roles/common_global

- name: "001 role_common_global (cisco.nac_dc_vxlan.common_global)"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/role_common_global.yml
  tasks:
    - name: Show the control variables this dependency role reads
      ansible.builtin.debug:
        msg: "cisco.nac_dc_vxlan.common_global runs as a dependency of the dtc roles and is not called directly. Variables: {{ role_variables | default({}) | to_json }}"
