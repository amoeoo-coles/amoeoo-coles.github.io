---
# Sample playbook 030 for NaC data model section vxlan.topology.edge_connections.bgp_section
# Build order: 030 of 129 (2. Underlay)
# Reads ../models/nac_edge_connection.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://netascode.cisco.com/docs/data_models/vxlan/topology/topology_edge_connection/

- name: "030 nac_edge_connection (vxlan.topology.edge_connections.bgp_section)"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/nac_edge_connection.yml
  tasks:
    - name: Check the model defines vxlan.topology.edge_connections.bgp_section
      ansible.builtin.assert:
        that:
          - vxlan['topology']['edge_connections']['bgp_section'] is defined
        quiet: true

    - name: Stage the section into host_vars for the nac_dc_vxlan roles (opt-in with -e stage_model=true)
      ansible.builtin.copy:
        content: "{{ {'vxlan': vxlan} | to_nice_yaml(indent=2) }}"
        dest: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/nac_edge_connection.nac.yaml"
        mode: "0644"
      delegate_to: localhost
      when: stage_model | default(false) | bool

    - name: Validate staged data with cisco.nac_dc_vxlan.validate (run with --tags validate)
      ansible.builtin.import_role:
        name: cisco.nac_dc_vxlan.validate
      tags:
        - never
        - validate
