---
# Sample playbook 089 for cisco.nxos.nxos_udld_interface
# Build order: 089 of 129 (6. Interfaces and access)
# Reads ../models/nxos_udld_interface.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_udld_interface_module.html

- name: "089 nxos_udld_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_udld_interface.yml
  tasks:
    - name: Run cisco.nxos.nxos_udld_interface with the non-null model parameters
      cisco.nxos.nxos_udld_interface: "{{ nxos_udld_interface | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_udld_interface_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_udld_interface_result
        verbosity: 1
