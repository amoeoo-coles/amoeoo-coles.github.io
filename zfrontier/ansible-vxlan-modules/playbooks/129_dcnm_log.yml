---
# Sample playbook 129 for cisco.dcnm.dcnm_log
# Build order: 129 of 129 (9. Multi-site, services and other)
# Reads ../models/dcnm_log.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_log_module.rst

- name: "129 dcnm_log"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_log.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_log with the non-null model parameters
      cisco.dcnm.dcnm_log: "{{ dcnm_log | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_log_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_log_result
        verbosity: 1
