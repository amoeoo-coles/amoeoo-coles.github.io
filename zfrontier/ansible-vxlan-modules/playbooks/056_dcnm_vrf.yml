---
# Sample playbook 056 for cisco.dcnm.dcnm_vrf
# Build order: 056 of 129 (4. VRFs)
# Reads ../models/dcnm_vrf.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_vrf_module.rst

- name: "056 dcnm_vrf"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_vrf.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_vrf with the non-null model parameters
      cisco.dcnm.dcnm_vrf: "{{ dcnm_vrf | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_vrf_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_vrf_result
        verbosity: 1
