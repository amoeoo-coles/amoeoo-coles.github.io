---
# Sample playbook 062 for cisco.nxos.nxos_vrf_interfaces
# Build order: 062 of 129 (4. VRFs)
# Reads ../models/nxos_vrf_interfaces.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vrf_interfaces_module.html

- name: "062 nxos_vrf_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vrf_interfaces.yml
  tasks:
    - name: Run cisco.nxos.nxos_vrf_interfaces with the non-null model parameters
      cisco.nxos.nxos_vrf_interfaces: "{{ nxos_vrf_interfaces | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_vrf_interfaces_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_vrf_interfaces_result
        verbosity: 1
