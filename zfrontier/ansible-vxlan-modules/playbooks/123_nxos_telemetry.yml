---
# Sample playbook 123 for cisco.nxos.nxos_telemetry
# Build order: 123 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/nxos_telemetry.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_telemetry_module.html

- name: "123 nxos_telemetry"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_telemetry.yml
  tasks:
    - name: Run cisco.nxos.nxos_telemetry with the non-null model parameters
      cisco.nxos.nxos_telemetry: "{{ nxos_telemetry | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_telemetry_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_telemetry_result
        verbosity: 1
