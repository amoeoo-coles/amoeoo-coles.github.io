---
# Sample playbook 031 for cisco.dcnm.dcnm_links
# Build order: 031 of 129 (2. Underlay)
# Reads ../models/dcnm_links.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_links_module.rst

- name: "031 dcnm_links"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_links.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_links with the non-null model parameters
      cisco.dcnm.dcnm_links: "{{ dcnm_links | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_links_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_links_result
        verbosity: 1
