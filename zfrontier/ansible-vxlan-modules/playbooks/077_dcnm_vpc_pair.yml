---
# Sample playbook 077 for cisco.dcnm.dcnm_vpc_pair
# Build order: 077 of 129 (6. Interfaces and access)
# Reads ../models/dcnm_vpc_pair.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_vpc_pair_module.rst

- name: "077 dcnm_vpc_pair"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_vpc_pair.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_vpc_pair with the non-null model parameters
      cisco.dcnm.dcnm_vpc_pair: "{{ dcnm_vpc_pair | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_vpc_pair_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_vpc_pair_result
        verbosity: 1
