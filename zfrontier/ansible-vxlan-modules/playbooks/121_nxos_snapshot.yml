---
# Sample playbook 121 for cisco.nxos.nxos_snapshot
# Build order: 121 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/nxos_snapshot.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_snapshot_module.html

- name: "121 nxos_snapshot"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_snapshot.yml
  tasks:
    - name: Run cisco.nxos.nxos_snapshot with the non-null model parameters
      cisco.nxos.nxos_snapshot: "{{ nxos_snapshot | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_snapshot_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_snapshot_result
        verbosity: 1
