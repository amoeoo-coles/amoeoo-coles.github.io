---
# Sample playbook 088 for cisco.nxos.nxos_udld
# Build order: 088 of 129 (6. Interfaces and access)
# Reads ../models/nxos_udld.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_udld_module.html

- name: "088 nxos_udld"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_udld.yml
  tasks:
    - name: Run cisco.nxos.nxos_udld with the non-null model parameters
      cisco.nxos.nxos_udld: "{{ nxos_udld | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_udld_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_udld_result
        verbosity: 1
