---
# Sample playbook 043 for cisco.nxos.nxos_vxlan_vtep
# Build order: 043 of 129 (3. Overlay (NVE, EVPN, VNIs))
# Reads ../models/nxos_vxlan_vtep.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vxlan_vtep_module.html

- name: "043 nxos_vxlan_vtep"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vxlan_vtep.yml
  tasks:
    - name: Run cisco.nxos.nxos_vxlan_vtep with the non-null model parameters
      cisco.nxos.nxos_vxlan_vtep: "{{ nxos_vxlan_vtep | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_vxlan_vtep_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_vxlan_vtep_result
        verbosity: 1
