---
# Sample playbook 085 for cisco.nxos.nxos_vpc
# Build order: 085 of 129 (6. Interfaces and access)
# Reads ../models/nxos_vpc.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vpc_module.html

- name: "085 nxos_vpc"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vpc.yml
  tasks:
    - name: Run cisco.nxos.nxos_vpc with the non-null model parameters
      cisco.nxos.nxos_vpc: "{{ nxos_vpc | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_vpc_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_vpc_result
        verbosity: 1
