---
# Sample playbook 118 for cisco.nxos.nxos_command
# Build order: 118 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/nxos_command.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_command_module.html

- name: "118 nxos_command"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_command.yml
  tasks:
    - name: Run cisco.nxos.nxos_command with the non-null model parameters
      cisco.nxos.nxos_command: "{{ nxos_command | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_command_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_command_result
        verbosity: 1
