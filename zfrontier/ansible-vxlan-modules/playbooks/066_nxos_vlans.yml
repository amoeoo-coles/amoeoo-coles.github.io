---
# Sample playbook 066 for cisco.nxos.nxos_vlans
# Build order: 066 of 129 (5. Networks)
# Reads ../models/nxos_vlans.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vlans_module.html

- name: "066 nxos_vlans"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vlans.yml
  tasks:
    - name: Run cisco.nxos.nxos_vlans with the non-null model parameters
      cisco.nxos.nxos_vlans: "{{ nxos_vlans | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_vlans_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_vlans_result
        verbosity: 1
