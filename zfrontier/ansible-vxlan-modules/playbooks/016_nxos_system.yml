---
# Sample playbook 016 for cisco.nxos.nxos_system
# Build order: 016 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/nxos_system.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_system_module.html

- name: "016 nxos_system"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_system.yml
  tasks:
    - name: Run cisco.nxos.nxos_system with the non-null model parameters
      cisco.nxos.nxos_system: "{{ nxos_system | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_system_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_system_result
        verbosity: 1
