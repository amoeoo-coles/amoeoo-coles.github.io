---
# Sample playbook 090 for NaC data model section vxlan.overlay_extensions.route_control
# Build order: 090 of 129 (7. Policies and route control)
# Reads ../models/nac_route_control_top.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://netascode.cisco.com/docs/data_models/vxlan/overlay_extensions/route_control/route_control_top/

- name: "090 nac_route_control_top (vxlan.overlay_extensions.route_control)"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/nac_route_control_top.yml
  tasks:
    - name: Check the model defines vxlan.overlay_extensions.route_control
      ansible.builtin.assert:
        that:
          - vxlan['overlay_extensions']['route_control'] is defined
        quiet: true

    - name: Stage the section into host_vars for the nac_dc_vxlan roles (opt-in with -e stage_model=true)
      ansible.builtin.copy:
        content: "{{ {'vxlan': vxlan} | to_nice_yaml(indent=2) }}"
        dest: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/nac_route_control_top.nac.yaml"
        mode: "0644"
      delegate_to: localhost
      when: stage_model | default(false) | bool

    - name: Validate staged data with cisco.nac_dc_vxlan.validate (run with --tags validate)
      ansible.builtin.import_role:
        name: cisco.nac_dc_vxlan.validate
      tags:
        - never
        - validate
