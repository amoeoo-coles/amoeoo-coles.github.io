---
# Sample playbook 032 for cisco.nxos.nxos_ospfv2
# Build order: 032 of 129 (2. Underlay)
# Reads ../models/nxos_ospfv2.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ospfv2_module.html

- name: "032 nxos_ospfv2"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_ospfv2.yml
  tasks:
    - name: Run cisco.nxos.nxos_ospfv2 with the non-null model parameters
      cisco.nxos.nxos_ospfv2: "{{ nxos_ospfv2 | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_ospfv2_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_ospfv2_result
        verbosity: 1
