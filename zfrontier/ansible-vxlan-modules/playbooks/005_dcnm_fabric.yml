---
# Sample playbook 005 for cisco.dcnm.dcnm_fabric
# Build order: 005 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/dcnm_fabric.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_fabric_module.rst

- name: "005 dcnm_fabric"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_fabric.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_fabric with the non-null model parameters
      cisco.dcnm.dcnm_fabric: "{{ dcnm_fabric | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_fabric_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_fabric_result
        verbosity: 1
