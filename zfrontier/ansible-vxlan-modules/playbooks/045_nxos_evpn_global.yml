---
# Sample playbook 045 for cisco.nxos.nxos_evpn_global
# Build order: 045 of 129 (3. Overlay (NVE, EVPN, VNIs))
# Reads ../models/nxos_evpn_global.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_evpn_global_module.html

- name: "045 nxos_evpn_global"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_evpn_global.yml
  tasks:
    - name: Run cisco.nxos.nxos_evpn_global with the non-null model parameters
      cisco.nxos.nxos_evpn_global: "{{ nxos_evpn_global | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_evpn_global_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_evpn_global_result
        verbosity: 1
