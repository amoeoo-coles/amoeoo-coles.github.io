---
# Sample playbook 107 for role cisco.nac_dc_vxlan.dtc.common
# Build order: 107 of 129 (8. Deploy, Day 2 and operations)
# Reads ../models/role_dtc_common.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/netascode/ansible-dc-vxlan/tree/main/roles/dtc/common

- name: "107 role_dtc_common (cisco.nac_dc_vxlan.dtc.common)"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/role_dtc_common.yml
  tasks:
    - name: Show the control variables this dependency role reads
      ansible.builtin.debug:
        msg: "cisco.nac_dc_vxlan.dtc.common runs as a dependency of the dtc roles and is not called directly. Variables: {{ role_variables | default({}) | to_json }}"
