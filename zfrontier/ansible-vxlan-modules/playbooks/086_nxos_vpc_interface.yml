---
# Sample playbook 086 for cisco.nxos.nxos_vpc_interface
# Build order: 086 of 129 (6. Interfaces and access)
# Reads ../models/nxos_vpc_interface.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vpc_interface_module.html

- name: "086 nxos_vpc_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vpc_interface.yml
  tasks:
    - name: Run cisco.nxos.nxos_vpc_interface with the non-null model parameters
      cisco.nxos.nxos_vpc_interface: "{{ nxos_vpc_interface | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_vpc_interface_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_vpc_interface_result
        verbosity: 1
