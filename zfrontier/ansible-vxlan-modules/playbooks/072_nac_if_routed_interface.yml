---
# Sample playbook 072 for NaC data model section vxlan.topology.switches
# Build order: 072 of 129 (6. Interfaces and access)
# Reads ../models/nac_if_routed_interface.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://netascode.cisco.com/docs/data_models/vxlan/topology/interface/routed_interface/

- name: "072 nac_if_routed_interface (vxlan.topology.switches)"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/nac_if_routed_interface.yml
  tasks:
    - name: Check the model defines vxlan.topology.switches
      ansible.builtin.assert:
        that:
          - vxlan['topology']['switches'] is defined
        quiet: true

    - name: Stage the section into host_vars for the nac_dc_vxlan roles (opt-in with -e stage_model=true)
      ansible.builtin.copy:
        content: "{{ {'vxlan': vxlan} | to_nice_yaml(indent=2) }}"
        dest: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/nac_if_routed_interface.nac.yaml"
        mode: "0644"
      delegate_to: localhost
      when: stage_model | default(false) | bool

    - name: Validate staged data with cisco.nac_dc_vxlan.validate (run with --tags validate)
      ansible.builtin.import_role:
        name: cisco.nac_dc_vxlan.validate
      tags:
        - never
        - validate
