---
# Sample playbook 002 for role cisco.nac_dc_vxlan.validate
# Build order: 002 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/role_validate.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/netascode/ansible-dc-vxlan/tree/main/roles/validate

- name: "002 role_validate (cisco.nac_dc_vxlan.validate)"
  hosts: ndfc
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - ../models/role_validate.yml
  pre_tasks:
    - name: Apply the role control variables from the model
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ role_variables | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
  roles:
    - role: cisco.nac_dc_vxlan.validate
