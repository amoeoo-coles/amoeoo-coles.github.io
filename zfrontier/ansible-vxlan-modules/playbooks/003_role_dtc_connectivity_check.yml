---
# Sample playbook 003 for role cisco.nac_dc_vxlan.dtc.connectivity_check
# Build order: 003 of 129 (1. Fabric, global settings and switch inventory)
# Reads ../models/role_dtc_connectivity_check.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/netascode/ansible-dc-vxlan/tree/main/roles/dtc/connectivity_check

- name: "003 role_dtc_connectivity_check (cisco.nac_dc_vxlan.dtc.connectivity_check)"
  hosts: ndfc
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - ../models/role_dtc_connectivity_check.yml
  pre_tasks:
    - name: Apply the role control variables from the model
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ role_variables | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
  roles:
    - role: cisco.nac_dc_vxlan.dtc.connectivity_check
