---
# Sample playbook 125 for cisco.dcnm.dcnm_fabric_group
# Build order: 125 of 129 (9. Multi-site, services and other)
# Reads ../models/dcnm_fabric_group.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://github.com/CiscoDevNet/ansible-dcnm/blob/main/docs/cisco.dcnm.dcnm_fabric_group_module.rst

- name: "125 dcnm_fabric_group"
  hosts: ndfc
  gather_facts: false
  vars_files:
    - ../models/dcnm_fabric_group.yml
  tasks:
    - name: Run cisco.dcnm.dcnm_fabric_group with the non-null model parameters
      cisco.dcnm.dcnm_fabric_group: "{{ dcnm_fabric_group | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: dcnm_fabric_group_result

    - name: Show the result
      ansible.builtin.debug:
        var: dcnm_fabric_group_result
        verbosity: 1
