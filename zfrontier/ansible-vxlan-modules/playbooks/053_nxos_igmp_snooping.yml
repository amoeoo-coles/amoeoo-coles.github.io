---
# Sample playbook 053 for cisco.nxos.nxos_igmp_snooping
# Build order: 053 of 129 (3. Overlay (NVE, EVPN, VNIs))
# Reads ../models/nxos_igmp_snooping.yml with vars_files. Credentials come from the inventory
# placeholders {{ nxos_host }} {{ ansible_user }} {{ ansible_password }} (and {{ nd_host }} for Nexus Dashboard).
# Reference: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_igmp_snooping_module.html

- name: "053 nxos_igmp_snooping"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_igmp_snooping.yml
  tasks:
    - name: Run cisco.nxos.nxos_igmp_snooping with the non-null model parameters
      cisco.nxos.nxos_igmp_snooping: "{{ nxos_igmp_snooping | dict2items | rejectattr('value', 'none') | list | items2dict }}"
      register: nxos_igmp_snooping_result

    - name: Show the result
      ansible.builtin.debug:
        var: nxos_igmp_snooping_result
        verbosity: 1
