---
# Example inventory for the VXLAN catalogue. Placeholders only: pass real values with -e or
# an encrypted vars file at runtime. Never commit secrets.
#   ansible-playbook -i inventory.yml site.yml -e nxos_host=leaf1.example.net -e nd_host=nd.example.net \
#     -e ansible_user=admin -e ansible_password='***'
# ndfc group: Nexus Dashboard (NDFC) for cisco.nac_dc_vxlan roles and cisco.dcnm modules,
# connection values as in the netascode ansible-dc-vxlan-example group_vars.
# nxos group: Nexus switches for cisco.nxos modules (network_cli).

all:
  vars:
    ansible_user: "{{ ansible_user }}"
    ansible_password: "{{ ansible_password }}"
  children:
    ndfc:
      hosts:
        nac-fabric1:
          ansible_host: "{{ nd_host }}"
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.dcnm.dcnm
        ansible_httpapi_port: 443
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_httpapi_login_domain: local
        ndfc_switch_username: "{{ ansible_user }}"
        ndfc_switch_password: "{{ ansible_password }}"
    nxos:
      hosts:
        nxos-leaf1:
          ansible_host: "{{ nxos_host }}"
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
