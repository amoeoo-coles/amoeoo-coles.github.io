    export_format: json
  form-lcm-rma:
    serial: SALEXNEW02
    node_id: '101'
    pod_id: '1'
    node_name: spine-101
  form-lcm-backend:
    backend_type: http
    state_address: https://state.example.invalid/states/aci-multisite-example
    lock_address: https://state.example.invalid/states/aci-multisite-example/lock
  form-ts-isn-ospf:
    isn_vrf: ACI-ISN
    if_name: Ethernet1/1.4
  form-ts-evpn:
    site1_name: site-1
    site2_name: site-2
  form-ts-ndo-deploy:
    schema: schema-ms-lab
    template: tmpl-stretched
  form-ts-state:
    tf_dir: terraform
    address: mso_schema.ms
