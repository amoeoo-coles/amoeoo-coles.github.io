# Example / documentation addressing only. Do not apply unchanged.
# Consumed in Terragrunt units with:
#   locals { model = yamldecode(file("${get_repo_root()}/data/sample.yml")) }
# Credentials are never stored in this file.
meta:
  description: Example ACI Multi-Site fabrics for the Terraform workbench. Documentation
    and lab prefixes only.
  addressing: RFC 5737 (198.51.100.0/24, 192.0.2.0/24, 203.0.113.0/24) and RFC 1918
    198.51.100.0/8 examples. Replace before apply.
  credentials: Never stored here. Use var.apic_password, var.ndo_password, var.nxos_password
    or {{ ndo_password }} in CI.
sites:
  site1_name: site-1
  site2_name: site-2
  site1_tep: 198.51.100.0/16
  site2_tep: 198.51.100.0/16
forms:
  form-tg-root:
    tg_state_address: https://state.example.invalid/states
    tg_lock_method: POST
    tg_provider_path: provider.tf
    tg_backend_path: backend.tf
    tg_required_version: '>= 1.5.0'
  form-tg-envcommon:
    tg_env: lab
    tg_lab_apic: https://apic.lab.example.invalid
    tg_prod_apic: https://apic.prod.example.invalid
    tg_ndo_url: https://nd.example.invalid
    tg_module_ref: v1.0.0
  form-tg-units:
    tg_env: lab
    tg_location: site-1
    tg_unit: infra
    tg_source_local: ${get_repo_root()}/modules/infra
  form-tg-deps:
    tg_env: lab
    tg_location: site-1
    tg_infra_path: ../../shared/infra
    tg_wan_path: ../../shared/isn
    tg_mock_tep: 198.51.100.0/16
    tg_mock_wan_vrf: ACI-ISN
  form-tg-runall:
    tg_env: lab
    tg_working_dir: live
    tg_plan_flags: -input=false -detailed-exitcode
    tg_lock: enabled
  form-tg-troubleshoot:
    tg_env: lab
    tg_cache_dir: .terragrunt-cache
    tg_unit_from: shared/infra
    tg_unit_to: site-1/infra
  form-ms-tep-plan:
    site1_tep: 198.51.100.0/16
    site2_tep: 198.51.100.0/16
    site1_ext_tep: 198.51.100.0/24
    site2_ext_tep: 198.51.100.0/24
    dataplane_tep_s1: 198.51.100.1/32
    dataplane_tep_s2: 198.51.100.2/32
  form-ms-isn-addr:
    isn_vrf: ACI-ISN
    site1_p2p: 198.51.100.0/30
    site2_p2p: 198.51.100.4/30
    ospf_area: 0.0.0.0
    site1_asn: '65001'
    site2_asn: '65002'
  form-ms-mtu-prereq:
    fabric_mtu: '9216'
    rtt_ms: '8'
    rtt_limit_note: not collected
  form-dp-stretch-tenant:
    tenant: tn-example
    schema: schema-ms-lab
    template: tmpl-stretched
    vrf: vrf-stretched
    site1_name: site-1
    site2_name: site-2
  form-dp-site-local-vrf:
    tenant: tn-example
    vrf: vrf-site1-local
    schema: schema-ms-lab
    template: tmpl-site1-local
    site_name: site-1
  form-dp-stretch-bd-bum:
    schema: schema-ms-lab
    template: tmpl-stretched
    vrf: vrf-stretched
    bd: bd-stretched-bum
    bd_subnet: 198.51.100.1/24
  form-dp-stretch-bd-nobum:
    schema: schema-ms-lab
    template: tmpl-stretched
    vrf: vrf-stretched
    bd: bd-stretched-unicast
    bd_subnet: 198.51.100.1/24
  form-dp-shared-services:
    schema: schema-ms-lab
    template: tmpl-stretched
    anp: anp-shared
    epg: epg-shared-svc
    bd: bd-stretched-unicast
    contract: c-shared-svc
  form-dp-ms-plus-mp:
    mp_site_name: site-mp-west
    other_site_name: site-2
    schema: schema-ms-lab
    template: tmpl-stretched
  form-isn-vrf-features:
    isn_hostname: isn-nxos-1
    isn_vrf: ACI-ISN
    jumbo_mtu: '9216'
    lo0_ip: 198.51.100.17/32
    vrf_rd: '65011:4'
  form-isn-subif:
    isn_vrf: ACI-ISN
    if_name: Ethernet1/1
    vlan_id: '4'
    subif_ip: 198.51.100.2/30
    if_mtu: '9216'
    ospf_area: 0.0.0.0
  form-isn-ospf:
    isn_vrf: ACI-ISN
    ospf_proc: '1'
    lo0_ip: 198.51.100.17
    ospf_area: 0.0.0.0
  form-isn-bgp-evpn:
    isn_vrf: ACI-ISN
    bgp_asn: '65011'
    lo0_ip: 198.51.100.17
    site1_nei: 198.51.100.1
    site2_nei: 198.51.100.5
    site1_asn: '65001'
    site2_asn: '65002'
  form-isn-verify:
    isn_vrf: ACI-ISN
    if_name: Ethernet1/1.4
    expect_mtu: '9216'
  form-isn-qos:
    if_name: Ethernet1/1.4
    policy_name: PM-ISN-OUT
  form-day1-nd-cluster:
    nd_nodes: nd-1,nd-2,nd-3
    nd_oob_ip: 203.0.113.10/24
  form-day1-site1:
    site1_name: site-1
    apic_site_id: '1'
  form-day1-site2:
    site2_name: site-2
    apic_site_id: '2'
  form-day1-infra:
    site1_p2p: 198.51.100.0/30
    site2_p2p: 198.51.100.4/30
    overlay_mode: BGP-EVPN
    mcast_mode: not collected
  form-day1-schema:
    tenant: tn-example
    schema: schema-ms-lab
    template: tmpl-stretched
    site1_name: site-1
    site2_name: site-2
  form-day2-tenant:
    tenant: tn-example
    site1_name: site-1
    site2_name: site-2
  form-day2-vrf-bd:
    schema: schema-ms-lab
    template: tmpl-stretched
    vrf: vrf-stretched
    bd: bd-stretched-unicast
    bd_subnet: 198.51.100.1/24
  form-day2-epg-contract:
    schema: schema-ms-lab
    template: tmpl-stretched
    anp: anp-app
    epg: epg-web
    bd: bd-stretched-unicast
    contract: c-web
    contract_scope: context
  form-day2-ndo-deploy:
    schema: schema-ms-lab
    template: tmpl-stretched
    re_deploy: 'false'
  form-bau-drift:
    tf_dir: terraform
    exitcode: 'true'
    var_file: cicd/terraform.tfvars.example
  form-lcm-fw-sites:
    site_first: site-2
    site_second: site-1
