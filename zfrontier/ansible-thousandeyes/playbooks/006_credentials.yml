---
# Sample playbook for ThousandEyes v7 CredentialsApi (ansible.builtin.uri, not an official collection)
# Build order: 6 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-credentials/docs/CredentialsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "006 credentials"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/credentials.yml
  tasks:
    - name: "GET /credentials (List credentials)"
      ansible.builtin.uri:
        url: "{{ te_credentials.base_url }}/credentials{% if te_credentials.aid %}?aid={{ te_credentials.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: credentials_get

    - name: "POST /credentials (Create credential)"
      ansible.builtin.uri:
        url: "{{ te_credentials.base_url }}/credentials{% if te_credentials.aid %}?aid={{ te_credentials.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_credentials.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: credentials_create
      tags:
        - never
        - credentials
