---
# Sample playbook for ThousandEyes v7 DashboardsFiltersApi (ansible.builtin.uri, not an official collection)
# Build order: 35 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-dashboards/docs/DashboardsFiltersApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "035 dashboards_filters"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/dashboards_filters.yml
  tasks:
    - name: "GET /dashboards/filters (List dashboard filters)"
      ansible.builtin.uri:
        url: "{{ te_dashboards_filters.base_url }}/dashboards/filters{% if te_dashboards_filters.aid %}?aid={{ te_dashboards_filters.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: dashboards_filters_get

    - name: "POST /dashboards/filters (Create dashboard filter)"
      ansible.builtin.uri:
        url: "{{ te_dashboards_filters.base_url }}/dashboards/filters{% if te_dashboards_filters.aid %}?aid={{ te_dashboards_filters.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_dashboards_filters.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: dashboards_filters_create
      tags:
        - never
        - dashboards_filters
