---
# Sample playbook for ThousandEyes v7 WebHTTPServerTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 71 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/WebHTTPServerTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "071 webhttp_server_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/webhttp_server_test_results.yml
  tasks:
    - name: "GET /test-results/{testId}/http-server (Get HTTP server test results)"
      ansible.builtin.uri:
        url: "{{ te_webhttp_server_test_results.base_url }}/test-results/{{ te_webhttp_server_test_results.path_params.testId }}/http-server{% if te_webhttp_server_test_results.aid %}?aid={{ te_webhttp_server_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: webhttp_server_test_results_get
