---
# Sample playbook for ThousandEyes v7 APITestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 62 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/APITestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "062 api_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/api_test_results.yml
  tasks:
    - name: "GET /test-results/{testId}/api (Get API test results)"
      ansible.builtin.uri:
        url: "{{ te_api_test_results.base_url }}/test-results/{{ te_api_test_results.path_params.testId }}/api{% if te_api_test_results.aid %}?aid={{ te_api_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: api_test_results_get
