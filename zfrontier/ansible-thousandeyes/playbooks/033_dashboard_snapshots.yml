---
# Sample playbook for ThousandEyes v7 DashboardSnapshotsApi (ansible.builtin.uri, not an official collection)
# Build order: 33 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-dashboards/docs/DashboardSnapshotsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "033 dashboard_snapshots"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/dashboard_snapshots.yml
  tasks:
    - name: "GET /dashboard-snapshots (List dashboard snapshots)"
      ansible.builtin.uri:
        url: "{{ te_dashboard_snapshots.base_url }}/dashboard-snapshots{% if te_dashboard_snapshots.aid %}?aid={{ te_dashboard_snapshots.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: dashboard_snapshots_get

    - name: "POST /dashboard-snapshots (Create dashboard snapshot)"
      ansible.builtin.uri:
        url: "{{ te_dashboard_snapshots.base_url }}/dashboard-snapshots{% if te_dashboard_snapshots.aid %}?aid={{ te_dashboard_snapshots.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_dashboard_snapshots.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: dashboard_snapshots_create
      tags:
        - never
        - dashboard_snapshots
