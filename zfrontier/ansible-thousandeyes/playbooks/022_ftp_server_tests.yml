---
# Sample playbook for ThousandEyes v7 FTPServerTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 22 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tests/docs/FTPServerTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "022 ftp_server_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/ftp_server_tests.yml
  tasks:
    - name: "GET /tests/ftp-server (List FTP Server tests)"
      ansible.builtin.uri:
        url: "{{ te_ftp_server_tests.base_url }}/tests/ftp-server{% if te_ftp_server_tests.aid %}?aid={{ te_ftp_server_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: ftp_server_tests_get

    - name: "POST /tests/ftp-server (Create FTP Server test)"
      ansible.builtin.uri:
        url: "{{ te_ftp_server_tests.base_url }}/tests/ftp-server{% if te_ftp_server_tests.aid %}?aid={{ te_ftp_server_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_ftp_server_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: ftp_server_tests_create
      tags:
        - never
        - ftp_server_tests
