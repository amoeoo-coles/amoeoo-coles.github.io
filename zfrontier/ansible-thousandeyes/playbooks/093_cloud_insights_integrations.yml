---
# Sample playbook for ThousandEyes v7 CloudInsightsIntegrationsApi (ansible.builtin.uri, not an official collection)
# Build order: 93 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-cloud-insights-integrations/docs/CloudInsightsIntegrationsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "093 cloud_insights_integrations"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/cloud_insights_integrations.yml
  tasks:
    - name: "GET /cloud-insights/integration/aws (List AWS integrations)"
      ansible.builtin.uri:
        url: "{{ te_cloud_insights_integrations.base_url }}/cloud-insights/integration/aws{% if te_cloud_insights_integrations.aid %}?aid={{ te_cloud_insights_integrations.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: cloud_insights_integrations_get

    - name: "POST /cloud-insights/integration/aws/flow-logs (Create AWS flow logs monitoring integration)"
      ansible.builtin.uri:
        url: "{{ te_cloud_insights_integrations.base_url }}/cloud-insights/integration/aws/flow-logs{% if te_cloud_insights_integrations.aid %}?aid={{ te_cloud_insights_integrations.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_cloud_insights_integrations.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: cloud_insights_integrations_create
      tags:
        - never
        - cloud_insights_integrations
