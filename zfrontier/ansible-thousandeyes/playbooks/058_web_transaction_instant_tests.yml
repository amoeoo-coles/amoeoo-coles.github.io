---
# Sample playbook for ThousandEyes v7 WebTransactionInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 58 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/WebTransactionInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "058 web_transaction_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/web_transaction_instant_tests.yml
  tasks:

    - name: "POST /tests/web-transactions/instant (Create web transactions instant test)"
      ansible.builtin.uri:
        url: "{{ te_web_transaction_instant_tests.base_url }}/tests/web-transactions/instant{% if te_web_transaction_instant_tests.aid %}?aid={{ te_web_transaction_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_web_transaction_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: web_transaction_instant_tests_create
      tags:
        - never
        - web_transaction_instant_tests
