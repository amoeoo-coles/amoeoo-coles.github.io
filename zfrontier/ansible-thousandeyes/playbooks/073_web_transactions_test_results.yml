---
# Sample playbook for ThousandEyes v7 WebTransactionsTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 73 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/WebTransactionsTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "073 web_transactions_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/web_transactions_test_results.yml
  tasks:
    - name: "GET /test-results/{testId}/web-transactions (Get web transactions test results)"
      ansible.builtin.uri:
        url: "{{ te_web_transactions_test_results.base_url }}/test-results/{{ te_web_transactions_test_results.path_params.testId }}/web-transactions{% if te_web_transactions_test_results.aid %}?aid={{ te_web_transactions_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: web_transactions_test_results_get
