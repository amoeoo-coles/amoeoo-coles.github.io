---
# Sample playbook for ThousandEyes v7 NetworkDynamicEndpointTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 76 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-test-results/docs/NetworkDynamicEndpointTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "076 network_dynamic_endpoint_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/network_dynamic_endpoint_test_results.yml
  tasks:
    - name: "GET /endpoint/test-results/dynamic-tests/{testId}/path-vis (Retrieve path visualization network dynamic test results)"
      ansible.builtin.uri:
        url: "{{ te_network_dynamic_endpoint_test_results.base_url }}/endpoint/test-results/dynamic-tests/{{ te_network_dynamic_endpoint_test_results.path_params.testId }}/path-vis{% if te_network_dynamic_endpoint_test_results.aid %}?aid={{ te_network_dynamic_endpoint_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: network_dynamic_endpoint_test_results_get

    - name: "POST /endpoint/test-results/dynamic-tests/{testId}/network/filter (Retrieve network dynamic test results)"
      ansible.builtin.uri:
        url: "{{ te_network_dynamic_endpoint_test_results.base_url }}/endpoint/test-results/dynamic-tests/{{ te_network_dynamic_endpoint_test_results.path_params.testId }}/network/filter{% if te_network_dynamic_endpoint_test_results.aid %}?aid={{ te_network_dynamic_endpoint_test_results.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_network_dynamic_endpoint_test_results.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: network_dynamic_endpoint_test_results_create
      tags:
        - never
        - network_dynamic_endpoint_test_results
