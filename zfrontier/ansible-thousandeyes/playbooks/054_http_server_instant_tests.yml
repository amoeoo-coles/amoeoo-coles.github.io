---
# Sample playbook for ThousandEyes v7 HTTPServerInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 54 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/HTTPServerInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "054 http_server_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/http_server_instant_tests.yml
  tasks:

    - name: "POST /tests/http-server/instant (Create HTTP server instant test)"
      ansible.builtin.uri:
        url: "{{ te_http_server_instant_tests.base_url }}/tests/http-server/instant{% if te_http_server_instant_tests.aid %}?aid={{ te_http_server_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_http_server_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: http_server_instant_tests_create
      tags:
        - never
        - http_server_instant_tests
