---
# Sample playbook for ThousandEyes v7 SIPServerInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 56 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/SIPServerInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "056 sip_server_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/sip_server_instant_tests.yml
  tasks:

    - name: "POST /tests/sip-server/instant (Create SIP server instant test)"
      ansible.builtin.uri:
        url: "{{ te_sip_server_instant_tests.base_url }}/tests/sip-server/instant{% if te_sip_server_instant_tests.aid %}?aid={{ te_sip_server_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_sip_server_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: sip_server_instant_tests_create
      tags:
        - never
        - sip_server_instant_tests
