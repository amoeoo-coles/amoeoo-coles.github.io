---
# Sample playbook for ThousandEyes v7 OperationConnectorsApi (ansible.builtin.uri, not an official collection)
# Build order: 89 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-connectors/docs/OperationConnectorsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "089 operation_connectors"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/operation_connectors.yml
  tasks:
    - name: "GET /operations/{type}/{id}/connectors (Retrieve connectors assigned to an operation)"
      ansible.builtin.uri:
        url: "{{ te_operation_connectors.base_url }}/operations/{{ te_operation_connectors.path_params.type }}/{{ te_operation_connectors.path_params.id }}/connectors{% if te_operation_connectors.aid %}?aid={{ te_operation_connectors.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: operation_connectors_get
