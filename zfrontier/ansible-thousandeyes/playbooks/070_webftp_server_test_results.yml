---
# Sample playbook for ThousandEyes v7 WebFTPServerTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 70 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/WebFTPServerTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "070 webftp_server_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/webftp_server_test_results.yml
  tasks:
    - name: "GET /test-results/{testId}/ftp-server (Get FTP server test results)"
      ansible.builtin.uri:
        url: "{{ te_webftp_server_test_results.base_url }}/test-results/{{ te_webftp_server_test_results.path_params.testId }}/ftp-server{% if te_webftp_server_test_results.aid %}?aid={{ te_webftp_server_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: webftp_server_test_results_get
