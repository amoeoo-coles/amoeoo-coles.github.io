---
# Sample playbook for ThousandEyes v7 CloudAndEnterpriseAgentsApi (ansible.builtin.uri, not an official collection)
# Build order: 9 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-agents/docs/CloudAndEnterpriseAgentsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "009 cloud_and_enterprise_agents"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/cloud_and_enterprise_agents.yml
  tasks:
    - name: "GET /agents (List Cloud and Enterprise Agents)"
      ansible.builtin.uri:
        url: "{{ te_cloud_and_enterprise_agents.base_url }}/agents{% if te_cloud_and_enterprise_agents.aid %}?aid={{ te_cloud_and_enterprise_agents.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: cloud_and_enterprise_agents_get
