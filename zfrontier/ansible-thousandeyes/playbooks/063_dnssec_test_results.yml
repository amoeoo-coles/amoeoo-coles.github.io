---
# Sample playbook for ThousandEyes v7 DNSSECTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 63 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/DNSSECTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "063 dnssec_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/dnssec_test_results.yml
  tasks:
    - name: "GET /test-results/{testId}/dnssec (Get DNSSEC test results)"
      ansible.builtin.uri:
        url: "{{ te_dnssec_test_results.base_url }}/test-results/{{ te_dnssec_test_results.path_params.testId }}/dnssec{% if te_dnssec_test_results.aid %}?aid={{ te_dnssec_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: dnssec_test_results_get
