---
# Sample playbook for ThousandEyes v7 CredentialVaultOperationsApi (ansible.builtin.uri, not an official collection)
# Build order: 86 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-connectors/docs/CredentialVaultOperationsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "086 credential_vault_operations"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/credential_vault_operations.yml
  tasks:
    - name: "GET /operations/credential-vault (List Credential Vault operations)"
      ansible.builtin.uri:
        url: "{{ te_credential_vault_operations.base_url }}/operations/credential-vault{% if te_credential_vault_operations.aid %}?aid={{ te_credential_vault_operations.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: credential_vault_operations_get

    - name: "POST /operations/credential-vault (Create Credential Vault operation)"
      ansible.builtin.uri:
        url: "{{ te_credential_vault_operations.base_url }}/operations/credential-vault{% if te_credential_vault_operations.aid %}?aid={{ te_credential_vault_operations.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_credential_vault_operations.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: credential_vault_operations_create
      tags:
        - never
        - credential_vault_operations
