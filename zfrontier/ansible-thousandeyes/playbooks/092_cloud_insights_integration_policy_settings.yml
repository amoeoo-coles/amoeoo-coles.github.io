---
# Sample playbook for ThousandEyes v7 CloudInsightsIntegrationPolicySettingsApi (ansible.builtin.uri, not an official collection)
# Build order: 92 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-cloud-insights-integrations/docs/CloudInsightsIntegrationPolicySettingsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "092 cloud_insights_integration_policy_settings"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/cloud_insights_integration_policy_settings.yml
  tasks:
    - name: "GET /cloud-insights/integration/aws/policy/settings (Get AWS integration policy settings)"
      ansible.builtin.uri:
        url: "{{ te_cloud_insights_integration_policy_settings.base_url }}/cloud-insights/integration/aws/policy/settings{% if te_cloud_insights_integration_policy_settings.aid %}?aid={{ te_cloud_insights_integration_policy_settings.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: cloud_insights_integration_policy_settings_get
