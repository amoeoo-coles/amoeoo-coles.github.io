---
# Sample playbook for ThousandEyes v7 LocalProblemsApi (ansible.builtin.uri, not an official collection)
# Build order: 11 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-agents/docs/LocalProblemsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "011 local_problems"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/local_problems.yml
  tasks:
    - name: "GET /agents/local-problems (List Cloud agents with local problems)"
      ansible.builtin.uri:
        url: "{{ te_local_problems.base_url }}/agents/local-problems{% if te_local_problems.aid %}?aid={{ te_local_problems.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: local_problems_get
