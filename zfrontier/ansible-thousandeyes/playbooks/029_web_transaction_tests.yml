---
# Sample playbook for ThousandEyes v7 WebTransactionTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 29 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tests/docs/WebTransactionTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "029 web_transaction_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/web_transaction_tests.yml
  tasks:
    - name: "GET /tests/web-transactions (List Web Transactions tests)"
      ansible.builtin.uri:
        url: "{{ te_web_transaction_tests.base_url }}/tests/web-transactions{% if te_web_transaction_tests.aid %}?aid={{ te_web_transaction_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: web_transaction_tests_get

    - name: "POST /tests/web-transactions (Create Web Transactions test)"
      ansible.builtin.uri:
        url: "{{ te_web_transaction_tests.base_url }}/tests/web-transactions{% if te_web_transaction_tests.aid %}?aid={{ te_web_transaction_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_web_transaction_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: web_transaction_tests_create
      tags:
        - never
        - web_transaction_tests
