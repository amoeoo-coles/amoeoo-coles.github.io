---
# Sample playbook for ThousandEyes v7 AgentToServerInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 48 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/AgentToServerInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "048 agent_to_server_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/agent_to_server_instant_tests.yml
  tasks:

    - name: "POST /tests/agent-to-server/instant (Create agent-to-server instant test)"
      ansible.builtin.uri:
        url: "{{ te_agent_to_server_instant_tests.base_url }}/tests/agent-to-server/instant{% if te_agent_to_server_instant_tests.aid %}?aid={{ te_agent_to_server_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_agent_to_server_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: agent_to_server_instant_tests_create
      tags:
        - never
        - agent_to_server_instant_tests
