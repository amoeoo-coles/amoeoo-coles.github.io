---
# Sample playbook for ThousandEyes v7 DNSServerInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 50 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/DNSServerInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "050 dns_server_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/dns_server_instant_tests.yml
  tasks:

    - name: "POST /tests/dns-server/instant (Create DNS server instant test)"
      ansible.builtin.uri:
        url: "{{ te_dns_server_instant_tests.base_url }}/tests/dns-server/instant{% if te_dns_server_instant_tests.aid %}?aid={{ te_dns_server_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_dns_server_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: dns_server_instant_tests_create
      tags:
        - never
        - dns_server_instant_tests
