---
# Sample playbook for ThousandEyes v7 PageLoadTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 24 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tests/docs/PageLoadTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "024 page_load_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/page_load_tests.yml
  tasks:
    - name: "GET /tests/page-load (List Page Load tests)"
      ansible.builtin.uri:
        url: "{{ te_page_load_tests.base_url }}/tests/page-load{% if te_page_load_tests.aid %}?aid={{ te_page_load_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: page_load_tests_get

    - name: "POST /tests/page-load (Create Page Load test)"
      ansible.builtin.uri:
        url: "{{ te_page_load_tests.base_url }}/tests/page-load{% if te_page_load_tests.aid %}?aid={{ te_page_load_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_page_load_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: page_load_tests_create
      tags:
        - never
        - page_load_tests
