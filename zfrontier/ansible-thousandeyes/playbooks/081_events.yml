---
# Sample playbook for ThousandEyes v7 EventsApi (ansible.builtin.uri, not an official collection)
# Build order: 81 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-event-detection/docs/EventsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "081 events"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/events.yml
  tasks:
    - name: "GET /events (List events)"
      ansible.builtin.uri:
        url: "{{ te_events.base_url }}/events{% if te_events.aid %}?aid={{ te_events.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: events_get
