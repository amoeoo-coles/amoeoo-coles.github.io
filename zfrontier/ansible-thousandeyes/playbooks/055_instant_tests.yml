---
# Sample playbook for ThousandEyes v7 InstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 55 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/InstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "055 instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/instant_tests.yml
  tasks:

    - name: "POST /tests/{testId}/run (Run instant test)"
      ansible.builtin.uri:
        url: "{{ te_instant_tests.base_url }}/tests/{{ te_instant_tests.path_params.testId }}/run{% if te_instant_tests.aid %}?aid={{ te_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: instant_tests_create
      tags:
        - never
        - instant_tests
