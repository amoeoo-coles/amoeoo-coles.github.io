---
# Sample playbook for ThousandEyes v7 APIInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 46 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/APIInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "046 api_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/api_instant_tests.yml
  tasks:

    - name: "POST /tests/api/instant (Create API instant test)"
      ansible.builtin.uri:
        url: "{{ te_api_instant_tests.base_url }}/tests/api/instant{% if te_api_instant_tests.aid %}?aid={{ te_api_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_api_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: api_instant_tests_create
      tags:
        - never
        - api_instant_tests
