---
# Sample playbook for ThousandEyes v7 FTPServerInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 52 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/FTPServerInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "052 ftp_server_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/ftp_server_instant_tests.yml
  tasks:

    - name: "POST /tests/ftp-server/instant (Create FTP server instant test)"
      ansible.builtin.uri:
        url: "{{ te_ftp_server_instant_tests.base_url }}/tests/ftp-server/instant{% if te_ftp_server_instant_tests.aid %}?aid={{ te_ftp_server_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_ftp_server_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: ftp_server_instant_tests_create
      tags:
        - never
        - ftp_server_instant_tests
