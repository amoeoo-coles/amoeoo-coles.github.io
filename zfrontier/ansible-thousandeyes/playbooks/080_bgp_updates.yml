---
# Sample playbook for ThousandEyes v7 BGPUpdatesApi (ansible.builtin.uri, not an official collection)
# Build order: 80 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-bgp-updates/docs/BGPUpdatesApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "080 bgp_updates"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/bgp_updates.yml
  tasks:
    - name: "GET /bgp/updates (List BGP updates)"
      ansible.builtin.uri:
        url: "{{ te_bgp_updates.base_url }}/bgp/updates{% if te_bgp_updates.aid %}?aid={{ te_bgp_updates.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: bgp_updates_get
