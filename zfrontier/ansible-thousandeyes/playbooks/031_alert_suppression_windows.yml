---
# Sample playbook for ThousandEyes v7 AlertSuppressionWindowsApi (ansible.builtin.uri, not an official collection)
# Build order: 31 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-alerts/docs/AlertSuppressionWindowsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "031 alert_suppression_windows"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/alert_suppression_windows.yml
  tasks:
    - name: "GET /alert-suppression-windows (List alert suppression windows)"
      ansible.builtin.uri:
        url: "{{ te_alert_suppression_windows.base_url }}/alert-suppression-windows{% if te_alert_suppression_windows.aid %}?aid={{ te_alert_suppression_windows.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: alert_suppression_windows_get

    - name: "POST /alert-suppression-windows (Create alert suppression window)"
      ansible.builtin.uri:
        url: "{{ te_alert_suppression_windows.base_url }}/alert-suppression-windows{% if te_alert_suppression_windows.aid %}?aid={{ te_alert_suppression_windows.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_alert_suppression_windows.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: alert_suppression_windows_create
      tags:
        - never
        - alert_suppression_windows
