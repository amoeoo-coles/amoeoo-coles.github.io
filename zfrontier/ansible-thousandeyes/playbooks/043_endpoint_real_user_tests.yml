---
# Sample playbook for ThousandEyes v7 EndpointRealUserTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 43 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-tests/docs/EndpointRealUserTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "043 endpoint_real_user_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/endpoint_real_user_tests.yml
  tasks:
    - name: "GET /endpoint/tests/real-user-tests (List endpoint real user tests)"
      ansible.builtin.uri:
        url: "{{ te_endpoint_real_user_tests.base_url }}/endpoint/tests/real-user-tests{% if te_endpoint_real_user_tests.aid %}?aid={{ te_endpoint_real_user_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: endpoint_real_user_tests_get
