---
# Sample playbook for ThousandEyes v7 WebhookOperationsApi (ansible.builtin.uri, not an official collection)
# Build order: 91 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-connectors/docs/WebhookOperationsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "091 webhook_operations"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/webhook_operations.yml
  tasks:
    - name: "GET /operations/webhooks (List webhook operations)"
      ansible.builtin.uri:
        url: "{{ te_webhook_operations.base_url }}/operations/webhooks{% if te_webhook_operations.aid %}?aid={{ te_webhook_operations.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: webhook_operations_get

    - name: "POST /operations/webhooks (Create webhook operation)"
      ansible.builtin.uri:
        url: "{{ te_webhook_operations.base_url }}/operations/webhooks{% if te_webhook_operations.aid %}?aid={{ te_webhook_operations.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_webhook_operations.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: webhook_operations_create
      tags:
        - never
        - webhook_operations
