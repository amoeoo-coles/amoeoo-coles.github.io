---
# Sample playbook for ThousandEyes v7 VoiceTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 28 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tests/docs/VoiceTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "028 voice_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/voice_tests.yml
  tasks:
    - name: "GET /tests/voice (List Voice tests)"
      ansible.builtin.uri:
        url: "{{ te_voice_tests.base_url }}/tests/voice{% if te_voice_tests.aid %}?aid={{ te_voice_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: voice_tests_get

    - name: "POST /tests/voice (Create Voice test)"
      ansible.builtin.uri:
        url: "{{ te_voice_tests.base_url }}/tests/voice{% if te_voice_tests.aid %}?aid={{ te_voice_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_voice_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: voice_tests_create
      tags:
        - never
        - voice_tests
