---
# Sample playbook for ThousandEyes v7 RealUserEndpointTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 78 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-test-results/docs/RealUserEndpointTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "078 real_user_endpoint_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/real_user_endpoint_test_results.yml
  tasks:
    - name: "GET /endpoint/test-results/real-user-tests/{id} (Retrieve endpoint real user test)"
      ansible.builtin.uri:
        url: "{{ te_real_user_endpoint_test_results.base_url }}/endpoint/test-results/real-user-tests/{{ te_real_user_endpoint_test_results.path_params.id }}{% if te_real_user_endpoint_test_results.aid %}?aid={{ te_real_user_endpoint_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: real_user_endpoint_test_results_get

    - name: "POST /endpoint/test-results/real-user-tests/networks/filter (List endpoint real user tests networks)"
      ansible.builtin.uri:
        url: "{{ te_real_user_endpoint_test_results.base_url }}/endpoint/test-results/real-user-tests/networks/filter{% if te_real_user_endpoint_test_results.aid %}?aid={{ te_real_user_endpoint_test_results.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_real_user_endpoint_test_results.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: real_user_endpoint_test_results_create
      tags:
        - never
        - real_user_endpoint_test_results
