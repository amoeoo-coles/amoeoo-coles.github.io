---
# Sample playbook for ThousandEyes v7 CyberArkConjurConnectorsApi (ansible.builtin.uri, not an official collection)
# Build order: 87 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-connectors/docs/CyberArkConjurConnectorsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "087 cyber_ark_conjur_connectors"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/cyber_ark_conjur_connectors.yml
  tasks:
    - name: "GET /connectors/conjur (List Conjur connectors)"
      ansible.builtin.uri:
        url: "{{ te_cyber_ark_conjur_connectors.base_url }}/connectors/conjur{% if te_cyber_ark_conjur_connectors.aid %}?aid={{ te_cyber_ark_conjur_connectors.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: cyber_ark_conjur_connectors_get

    - name: "POST /connectors/conjur (Create Conjur connector)"
      ansible.builtin.uri:
        url: "{{ te_cyber_ark_conjur_connectors.base_url }}/connectors/conjur{% if te_cyber_ark_conjur_connectors.aid %}?aid={{ te_cyber_ark_conjur_connectors.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_cyber_ark_conjur_connectors.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: cyber_ark_conjur_connectors_create
      tags:
        - never
        - cyber_ark_conjur_connectors
