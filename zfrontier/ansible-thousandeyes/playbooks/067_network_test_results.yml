---
# Sample playbook for ThousandEyes v7 NetworkTestResultsApi (ansible.builtin.uri, not an official collection)
# Build order: 67 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/NetworkTestResultsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "067 network_test_results"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/network_test_results.yml
  tasks:
    - name: "GET /test-results/{testId}/network (Get network test results)"
      ansible.builtin.uri:
        url: "{{ te_network_test_results.base_url }}/test-results/{{ te_network_test_results.path_params.testId }}/network{% if te_network_test_results.aid %}?aid={{ te_network_test_results.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: network_test_results_get
