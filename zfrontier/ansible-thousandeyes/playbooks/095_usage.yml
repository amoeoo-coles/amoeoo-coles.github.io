---
# Sample playbook for ThousandEyes v7 UsageApi (ansible.builtin.uri, not an official collection)
# Build order: 95 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-usage/docs/UsageApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "095 usage"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/usage.yml
  tasks:
    - name: "GET /usage/units/enterprise-agents (Get enterprise agent usage)"
      ansible.builtin.uri:
        url: "{{ te_usage.base_url }}/usage/units/enterprise-agents{% if te_usage.aid %}?aid={{ te_usage.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: usage_get
