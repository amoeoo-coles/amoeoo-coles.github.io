---
# Sample playbook for ThousandEyes v7 EndpointAgentLabelsApi (ansible.builtin.uri, not an official collection)
# Build order: 40 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-labels/docs/EndpointAgentLabelsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "040 endpoint_agent_labels"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/endpoint_agent_labels.yml
  tasks:
    - name: "GET /endpoint/labels (List labels)"
      ansible.builtin.uri:
        url: "{{ te_endpoint_agent_labels.base_url }}/endpoint/labels{% if te_endpoint_agent_labels.aid %}?aid={{ te_endpoint_agent_labels.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: endpoint_agent_labels_get

    - name: "POST /endpoint/labels (Create label)"
      ansible.builtin.uri:
        url: "{{ te_endpoint_agent_labels.base_url }}/endpoint/labels{% if te_endpoint_agent_labels.aid %}?aid={{ te_endpoint_agent_labels.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_endpoint_agent_labels.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: endpoint_agent_labels_create
      tags:
        - never
        - endpoint_agent_labels
