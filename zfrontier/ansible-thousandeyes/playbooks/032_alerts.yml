---
# Sample playbook for ThousandEyes v7 AlertsApi (ansible.builtin.uri, not an official collection)
# Build order: 32 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-alerts/docs/AlertsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "032 alerts"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/alerts.yml
  tasks:
    - name: "GET /alerts (List alerts)"
      ansible.builtin.uri:
        url: "{{ te_alerts.base_url }}/alerts{% if te_alerts.aid %}?aid={{ te_alerts.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: alerts_get
