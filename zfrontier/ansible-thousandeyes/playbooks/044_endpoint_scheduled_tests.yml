---
# Sample playbook for ThousandEyes v7 EndpointScheduledTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 44 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-tests/docs/EndpointScheduledTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "044 endpoint_scheduled_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/endpoint_scheduled_tests.yml
  tasks:
    - name: "GET /endpoint/tests/scheduled-tests (List endpoint scheduled tests)"
      ansible.builtin.uri:
        url: "{{ te_endpoint_scheduled_tests.base_url }}/endpoint/tests/scheduled-tests{% if te_endpoint_scheduled_tests.aid %}?aid={{ te_endpoint_scheduled_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: endpoint_scheduled_tests_get
