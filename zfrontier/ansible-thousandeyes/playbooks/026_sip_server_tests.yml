---
# Sample playbook for ThousandEyes v7 SIPServerTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 26 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tests/docs/SIPServerTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "026 sip_server_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/sip_server_tests.yml
  tasks:
    - name: "GET /tests/sip-server (List SIP Server tests)"
      ansible.builtin.uri:
        url: "{{ te_sip_server_tests.base_url }}/tests/sip-server{% if te_sip_server_tests.aid %}?aid={{ te_sip_server_tests.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: sip_server_tests_get

    - name: "POST /tests/sip-server (Create SIP Server test)"
      ansible.builtin.uri:
        url: "{{ te_sip_server_tests.base_url }}/tests/sip-server{% if te_sip_server_tests.aid %}?aid={{ te_sip_server_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_sip_server_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: sip_server_tests_create
      tags:
        - never
        - sip_server_tests
