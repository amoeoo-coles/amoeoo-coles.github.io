---
# Sample playbook for ThousandEyes v7 EndpointProxiesApi (ansible.builtin.uri, not an official collection)
# Build order: 39 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-agents/docs/EndpointProxiesApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "039 endpoint_proxies"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/endpoint_proxies.yml
  tasks:
    - name: "GET /endpoint/proxies (List endpoint proxy settings)"
      ansible.builtin.uri:
        url: "{{ te_endpoint_proxies.base_url }}/endpoint/proxies{% if te_endpoint_proxies.aid %}?aid={{ te_endpoint_proxies.aid }}{% endif %}"
        method: GET
        headers:
          Authorization: "Bearer {{ te_token }}"
          Accept: application/hal+json
        return_content: true
        status_code: [200]
      register: endpoint_proxies_get
