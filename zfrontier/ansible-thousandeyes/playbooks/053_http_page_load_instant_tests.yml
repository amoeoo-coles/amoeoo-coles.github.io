---
# Sample playbook for ThousandEyes v7 HTTPPageLoadInstantTestsApi (ansible.builtin.uri, not an official collection)
# Build order: 53 · Docs: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-instant-tests/docs/HTTPPageLoadInstantTestsApi.md
# Token placeholder: {{ te_token }} (Bearer). Account group: model aid (optional).

- name: "053 http_page_load_instant_tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../models/http_page_load_instant_tests.yml
  tasks:

    - name: "POST /tests/page-load/instant (Create HTTP page load instant test)"
      ansible.builtin.uri:
        url: "{{ te_http_page_load_instant_tests.base_url }}/tests/page-load/instant{% if te_http_page_load_instant_tests.aid %}?aid={{ te_http_page_load_instant_tests.aid }}{% endif %}"
        method: POST
        headers:
          Authorization: "Bearer {{ te_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ te_http_page_load_instant_tests.create_body | cat_strip_nulls | default({}, true) }}"
        status_code: [200, 201, 202]
      register: http_page_load_instant_tests_create
      tags:
        - never
        - http_page_load_instant_tests
