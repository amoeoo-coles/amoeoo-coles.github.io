  create_body:
    interval: null
    alertsEnabled: null
    enabled: null
    description: null
    testName: null
    codecId: null
    dscpId: null
    duration: null
    jitterBuffer: null
    numPathTraces: null
    port: null
    randomizedStartTime: null
    targetAgentId: null
    bgpMeasurements: null
    usePublicBgp: null
    labels: null
    tags: null
    sharedWithAccounts: null
    alertRules: null
    agents: null
    monitors: null
