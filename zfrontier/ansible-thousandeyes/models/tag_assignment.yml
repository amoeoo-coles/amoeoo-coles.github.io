---
# Data model for ThousandEyes v7 TagAssignmentApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: TagAssignmentApi
  sdk_package: thousandeyes-sdk-tags
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tags/docs/TagAssignmentApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 13
  create_body_model: BulkTagAssignments
  create_body_required: none
  sample_values_from: none (all values null; field names from the SDK request model)

te_tag_assignment:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    id: null
  endpoints:
    - POST /tags/assign - Assign multiple tags to multiple objects
    - POST /tags/unassign - Remove multiple tags from multiple objects
    - POST /tags/{id}/assign - Assign tag to multiple objects
    - POST /tags/{id}/unassign - Remove tag from multiple objects
  create_body:
    tags: null
