---
# Data model for ThousandEyes v7 DashboardsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: DashboardsApi
  sdk_package: thousandeyes-sdk-dashboards
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-dashboards/docs/DashboardsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 34
  create_body_model: Dashboard
  create_body_required: none
  sample_values_from: none (all values null; field names from the SDK request model)

te_dashboards:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    cardId: null
    columnId: null
    dashboardId: null
    widgetId: null
  endpoints:
    - POST /dashboards - Create dashboard
    - GET /dashboards - List dashboards
    - POST /dashboards/{dashboardId}/clone - Clone dashboard
    - PUT /dashboards/{dashboardId} - Update dashboard
    - PUT /dashboards/{dashboardId}/actions/schedule - Create or update dashboard snapshot schedule
    - GET /dashboards/{dashboardId} - Retrieve dashboard
    - DELETE /dashboards/{dashboardId} - Delete dashboard
    - DELETE /dashboards/{dashboardId}/actions/schedule - Delete dashboard snapshot schedule
    - GET /dashboards/{dashboardId}/widgets/{widgetId} - Retrieve dashboard widget data
    - GET /dashboards/{dashboardId}/widgets/{widgetId}/cards/{cardId} - Retrieve individual card data
      from numbers widget
    - GET /dashboards/{dashboardId}/widgets/{widgetId}/columns/{columnId} - Retrieve individual column
      data from multi-metric table widget
  create_body:
    globalFilterId: null
    title: null
    isPrivate: null
    widgets: null
    description: null
    defaultTimespan: null
    isGlobalOverride: null
    layout: null
    refreshRate: null
