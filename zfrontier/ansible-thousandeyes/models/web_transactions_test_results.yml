---
# Data model for ThousandEyes v7 WebTransactionsTestResultsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: WebTransactionsTestResultsApi
  sdk_package: thousandeyes-sdk-test-results
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-test-results/docs/WebTransactionsTestResultsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 73
  create_body_model: none (no POST endpoint)
  create_body_required: none
  sample_values_from: none (all values null; field names from the SDK request model)

te_web_transactions_test_results:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    agentId: null
    pageId: null
    roundId: null
    testId: null
  endpoints:
    - GET /test-results/{testId}/web-transactions - Get web transactions test results
    - GET /test-results/{testId}/web-transactions/agent/{agentId}/round/{roundId}/console-logs - Get console
      logs test results by agent and round
    - GET /test-results/{testId}/web-transactions/agent/{agentId}/round/{roundId} - Get web transactions
      test results by agent and round
    - GET /test-results/{testId}/web-transactions/agent/{agentId}/round/{roundId}/page/{pageId} - Get
      detailed web transactions test result by agent, round, and page
