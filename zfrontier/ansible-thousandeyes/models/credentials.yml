---
# Data model for ThousandEyes v7 CredentialsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: CredentialsApi
  sdk_package: thousandeyes-sdk-credentials
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-credentials/docs/CredentialsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 6
  create_body_model: CredentialRequest
  create_body_required: none
  sample_values_from: none (all values null; field names from the SDK request model)

te_credentials:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    id: null
  endpoints:
    - POST /credentials - Create credential
    - GET /credentials - List credentials
    - PUT /credentials/{id} - Update credential
    - GET /credentials/{id} - Retrieve credential
    - DELETE /credentials/{id} - Delete credential
  create_body:
    name: null
    value: null
