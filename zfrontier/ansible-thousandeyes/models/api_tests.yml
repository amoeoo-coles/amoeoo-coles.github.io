---
# Data model for ThousandEyes v7 APITestsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: APITestsApi
  sdk_package: thousandeyes-sdk-tests
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-tests/docs/APITestsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 15
  create_body_model: ApiTestRequest
  create_body_required:
    - interval
    - requests
    - url
    - agents
  sample_values_from: none (all values null; field names from the SDK request model)

te_api_tests:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    testId: null
  endpoints:
    - POST /tests/api - Create API test
    - GET /tests/api - List API tests
    - PUT /tests/api/{testId} - Update API test
    - GET /tests/api/{testId} - Get API test
    - DELETE /tests/api/{testId} - Delete API test
  create_body:
    interval: null
    alertsEnabled: null
    enabled: null
    description: null
    testName: null
    clientCertificate: null
    clientCertDomainsAllowList: null
    collectProxyNetworkData: null
    distributedTracing: null
    followRedirects: null
    mtuMeasurements: null
    networkMeasurements: null
    numPathTraces: null
    overrideAgentProxy: null
    overrideProxyId: null
    pathTraceMode: null
    predefinedVariables: null
    probeMode: null
    protocol: null
    randomizedStartTime: null
    requests: null
    sslVersionId: null
    targetTime: null
    timeLimit: null
    url: null
    bgpMeasurements: null
    usePublicBgp: null
    labels: null
    tags: null
    sharedWithAccounts: null
    alertRules: null
    agents: null
    monitors: null
    credentials: null
    vaultCredentials: null
