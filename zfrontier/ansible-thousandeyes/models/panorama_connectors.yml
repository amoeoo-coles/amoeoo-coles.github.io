---
# Data model for ThousandEyes v7 PanoramaConnectorsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: PanoramaConnectorsApi
  sdk_package: thousandeyes-sdk-connectors
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-connectors/docs/PanoramaConnectorsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 90
  create_body_model: PanoramaConnector
  create_body_required:
    - type
    - name
    - target
    - authentication
  sample_values_from: none (all values null; field names from the SDK request model)

te_panorama_connectors:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    id: null
  endpoints:
    - POST /connectors/panorama - Create Panorama connector
    - GET /connectors/panorama - List Panorama connectors
    - PUT /connectors/panorama/{id}/operations - Assign operations to Panorama connector
    - PUT /connectors/panorama/{id} - Update Panorama connector
    - GET /connectors/panorama/{id} - Retrieve Panorama connector
    - GET /connectors/panorama/{id}/operations - List operation IDs for Panorama connector
    - DELETE /connectors/panorama/{id} - Delete Panorama connector
  create_body:
    type: null
    name: null
    target: null
    authentication: null
