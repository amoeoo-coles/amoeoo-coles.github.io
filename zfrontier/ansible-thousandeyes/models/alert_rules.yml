---
# Data model for ThousandEyes v7 AlertRulesApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: AlertRulesApi
  sdk_package: thousandeyes-sdk-alerts
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-alerts/docs/AlertRulesApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 30
  create_body_model: RuleDetailUpdate
  create_body_required:
    - ruleName
    - expression
    - alertType
    - roundsViolatingOutOf
  sample_values_from: none (all values null; field names from the SDK request model)

te_alert_rules:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    ruleId: null
  endpoints:
    - POST /alerts/rules - Create alert rule
    - GET /alerts/rules - List alert rules
    - PUT /alerts/rules/{ruleId} - Update alert rule
    - GET /alerts/rules/{ruleId} - Retrieve alert rule
    - DELETE /alerts/rules/{ruleId} - Delete alert rule
  create_body:
    ruleName: null
    expression: null
    description: null
    direction: null
    notifyOnClear: null
    isDefault: null
    alertType: null
    alertGroupType: null
    minimumSources: null
    minimumSourcesPct: null
    roundsViolatingMode: null
    roundsViolatingOutOf: null
    roundsViolatingRequired: null
    includeCoveredPrefixes: null
    sensitivityLevel: null
    severity: null
    endpointAgentIds: null
    endpointLabelIds: null
    visitedSitesFilter: null
    notifications: null
    testIds: null
