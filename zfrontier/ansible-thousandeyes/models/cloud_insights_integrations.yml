---
# Data model for ThousandEyes v7 CloudInsightsIntegrationsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: CloudInsightsIntegrationsApi
  sdk_package: thousandeyes-sdk-cloud-insights-integrations
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-cloud-insights-integrations/docs/CloudInsightsIntegrationsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 93
  create_body_model: AwsFlowLogsIntegrationRequest
  create_body_required:
    - name
    - roleArn
    - snsTopicsArns
  sample_values_from: none (all values null; field names from the SDK request model)

te_cloud_insights_integrations:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    integrationId: null
  endpoints:
    - POST /cloud-insights/integration/aws/flow-logs - Create AWS flow logs monitoring integration
    - POST /cloud-insights/integration/aws/inventory - Create AWS inventory monitoring integration
    - POST /cloud-insights/integration/azure/flow-logs - Create Azure flow logs monitoring integration
    - POST /cloud-insights/integration/azure/inventory - Create Azure inventory monitoring integration
    - GET /cloud-insights/integration/aws - List AWS integrations
    - GET /cloud-insights/integration/azure - List Azure integrations
    - GET /cloud-insights/integration/aws/flow-logs/policies - Get AWS flow logs monitoring IAM policies
    - GET /cloud-insights/integration/aws/inventory/policies - Get AWS inventory monitoring IAM policies
    - PUT /cloud-insights/integration/azure/flow-logs/{integrationId} - Update Azure flow logs monitoring
      integration
    - PUT /cloud-insights/integration/azure/inventory/{integrationId} - Update Azure inventory monitoring
      integration
    - GET /cloud-insights/integration/aws/{integrationId} - Get AWS integration
    - GET /cloud-insights/integration/azure/{integrationId} - Get Azure integration
    - DELETE /cloud-insights/integration/aws/{integrationId} - Delete AWS integration
    - DELETE /cloud-insights/integration/azure/{integrationId} - Delete Azure integration
  create_body:
    name: null
    roleArn: null
    snsTopicsArns: null
