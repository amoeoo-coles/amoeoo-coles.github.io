---
# Data model for ThousandEyes v7 EndpointAgentsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: EndpointAgentsApi
  sdk_package: thousandeyes-sdk-endpoint-agents
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-endpoint-agents/docs/EndpointAgentsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 37
  create_body_model: AgentSearchRequest
  create_body_required: none
  sample_values_from: none (all values null; field names from the SDK request model)

te_endpoint_agents:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    agentId: null
  endpoints:
    - POST /endpoint/agents/filter - Filter endpoint agents
    - GET /endpoint/agents - List endpoint agents
    - GET /endpoint/agents/connection-string - Get agent connection string
    - POST /endpoint/agents/{agentId}/disable - Disable endpoint agent
    - POST /endpoint/agents/{agentId}/enable - Enable endpoint agent
    - PATCH /endpoint/agents/{agentId} - Update endpoint agent
    - GET /endpoint/agents/{agentId} - Retrieve endpoint agent
    - DELETE /endpoint/agents/{agentId} - Delete endpoint agent
  create_body:
    searchFilters: null
    thresholdFilter: null
    searchSort: null
