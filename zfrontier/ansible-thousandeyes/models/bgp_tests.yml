    - DELETE /tests/bgp/{testId} - Delete BGP test
  create_body:
    description: null
    testName: null
    enabled: null
    includeCoveredPrefixes: null
    usePublicBgp: null
    alertsEnabled: null
    prefix: null
    labels: null
    tags: null
    sharedWithAccounts: null
    alertRules: null
    monitors: null
