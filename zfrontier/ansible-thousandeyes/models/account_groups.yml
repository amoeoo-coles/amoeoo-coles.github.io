---
# Data model for ThousandEyes v7 AccountGroupsApi via ansible.builtin.uri
# NOT an official collection: there is no ThousandEyes collection on Ansible Galaxy.
# Endpoints and body field names come from ThousandEyes' official SDK docs; values are null.
# The bearer token is a placeholder only ({{ te_token }}). Never commit tokens.

references:
  api: ThousandEyes API v7
  base_url: https://api.thousandeyes.com/v7
  api_class: AccountGroupsApi
  sdk_package: thousandeyes-sdk-administrative
  doc_url: https://github.com/thousandeyes/thousandeyes-sdk-python/blob/ad7fe76/thousandeyes-sdk-administrative/docs/AccountGroupsApi.md
  official_api_docs: https://developer.cisco.com/docs/thousandeyes/
  module: 'ansible.builtin.uri (not an official ThousandEyes collection: none exists on Galaxy)'
  build_order: 1
  create_body_model: AccountGroupRequest
  create_body_required:
    - accountGroupName
  sample_values_from: none (all values null; field names from the SDK request model)

te_account_groups:
  base_url: '{{ te_base_url }}'
  aid: null
  path_params:
    id: null
  endpoints:
    - POST /account-groups - Create account group
    - GET /account-groups - List account groups
    - PUT /account-groups/{id} - Update account group
    - GET /account-groups/{id} - Retrieve account group
    - DELETE /account-groups/{id} - Delete account group
  create_body:
    accountGroupName: null
    agents: null
