  pod2_tep: 198.51.100.0/16
  pod1_ext_tep: 198.51.100.0/24
  pod2_ext_tep: 198.51.100.0/24
  dataplane_tep: 198.51.100.1/32
  gipo_pool: 225.0.0.0/15
  ipn_vrf: ACI-IPN
  infra_vlan: 3967
  pod1_p2p: 198.51.100.0/30
  pod2_p2p: 198.51.100.0/30
  phantom_rp_ip: 198.51.100.1
  ospf_area: 0.0.0.0
  fabric_mtu: 9216
  bgp_asn: 65001
  rtt_ms: 2
  coop_mode: strict
