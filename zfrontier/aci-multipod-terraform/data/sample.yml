# Example / documentation addressing only. Do not apply unchanged.
# Consumed in Terraform with:
#   locals { model = yamldecode(file("${path.module}/data/sample.yml")) }
# Credentials are never stored in this file.
meta:
  description: Example ACI Multi-Pod fabric for the Terraform workbench. Documentation
    and lab prefixes only.
  addressing: RFC 5737 (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) and RFC 1918
    198.51.100.0/8 examples. Replace before apply.
  credentials: Never stored here. Use var.apic_password, var.ndo_password, var.nxos_password
    or {{ apic_password }} / {{ ndo_password }} in CI.
fabric:
  fabric_name: lab-mp-fabric
  ndo_site_name: site-mp-lab
  tenant: tn-example
  vrf: vrf-stretched
  bd: bd-stretched
  bd_subnet: 198.51.100.1/24
planning:
