---
# Sample playbook for cisco.fmcansible.fmc_configuration (cisco.fmcansible 1.1.1)
# Build order: 2
# Manages configuration on Cisco FMC devices over REST API
# Reads ../models/fmc_configuration.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/fmcansible/content/module/fmc_configuration/?version=1.1.1
# Connection placeholders come from inventory.yml: {{ fmc_host }} {{ ansible_user }} {{ ansible_password }} {{ domain_uuid }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags fmc_configuration.

- name: "0002 fmc_configuration"
  hosts: fmc
  gather_facts: false
  vars_files:
    - ../models/fmc_configuration.yml
  tasks:
    - name: Run fmc_configuration from its model
      cisco.fmcansible.fmc_configuration:
        data: "{{ (fmc_configuration.data | cat_strip_nulls) if (fmc_configuration.data | cat_strip_nulls) is not none else omit }}"
        filters: "{{ fmc_configuration.filters if fmc_configuration.filters is not none else omit }}"
        operation: "{{ fmc_configuration.operation if fmc_configuration.operation is not none else omit }}"
        path_params: "{{ fmc_configuration.path_params if fmc_configuration.path_params is not none else omit }}"
        query_params: "{{ fmc_configuration.query_params if fmc_configuration.query_params is not none else omit }}"
        register_as: "{{ fmc_configuration.register_as if fmc_configuration.register_as is not none else omit }}"
      register: fmc_configuration_result
      tags:
        - never
        - fmc_configuration
