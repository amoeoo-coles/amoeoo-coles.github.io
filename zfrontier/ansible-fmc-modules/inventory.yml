---
# Example inventory for the cisco.fmcansible 1.1.1 catalogue. Placeholders only.
# The collection talks to FMC through its httpapi plugin (cisco.fmcansible.fmc).
#   ansible-playbook -i inventory.yml site.yml -e fmc_host=fmc.example.net \
#     -e ansible_user=admin -e ansible_password='***' -e domain_uuid=...
all:
  children:
    fmc:
      hosts:
        fmc-01:
          ansible_host: "{{ fmc_host }}"
      vars:
        ansible_network_os: cisco.fmcansible.fmc
        ansible_connection: ansible.netcommon.httpapi
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: true
        ansible_user: "{{ ansible_user }}"
        ansible_password: "{{ ansible_password }}"
