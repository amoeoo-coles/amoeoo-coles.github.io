---
# Sample playbook for cisco.intersight.intersight_power_policy (cisco.intersight 2.23.0)
# Build order: 91
# Power Policy configuration for Cisco Intersight
# Reads ../models/intersight_power_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_power_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0091 intersight_power_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_power_policy.yml
  tasks:
    - name: Run intersight_power_policy from its model
      cisco.intersight.intersight_power_policy:
        api_bearer_token: "{{ intersight_power_policy.api_bearer_token if intersight_power_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_power_policy.api_key_id if intersight_power_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_power_policy.api_private_key if intersight_power_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_power_policy.api_uri if intersight_power_policy.api_uri is not none else omit }}"
        description: "{{ intersight_power_policy.description if intersight_power_policy.description is not none else omit }}"
        dynamic_power_rebalancing: "{{ intersight_power_policy.dynamic_power_rebalancing if intersight_power_policy.dynamic_power_rebalancing is not none else omit }}"
        extended_power_capacity: "{{ intersight_power_policy.extended_power_capacity if intersight_power_policy.extended_power_capacity is not none else omit }}"
        name: "{{ intersight_power_policy.name if intersight_power_policy.name is not none else omit }}"
        organization: "{{ intersight_power_policy.organization if intersight_power_policy.organization is not none else omit }}"
        power_allocation: "{{ intersight_power_policy.power_allocation if intersight_power_policy.power_allocation is not none else omit }}"
        power_priority: "{{ intersight_power_policy.power_priority if intersight_power_policy.power_priority is not none else omit }}"
        power_profiling: "{{ intersight_power_policy.power_profiling if intersight_power_policy.power_profiling is not none else omit }}"
        power_redundancy: "{{ intersight_power_policy.power_redundancy if intersight_power_policy.power_redundancy is not none else omit }}"
        power_restore: "{{ intersight_power_policy.power_restore if intersight_power_policy.power_restore is not none else omit }}"
        power_save_mode: "{{ intersight_power_policy.power_save_mode if intersight_power_policy.power_save_mode is not none else omit }}"
        processor_package_power_limit: "{{ intersight_power_policy.processor_package_power_limit if intersight_power_policy.processor_package_power_limit is not none else omit }}"
        state: "{{ intersight_power_policy.state if intersight_power_policy.state is not none else omit }}"
        tags: "{{ (intersight_power_policy.tags | cat_strip_nulls) if (intersight_power_policy.tags | cat_strip_nulls) is not none else omit }}"
        target_platform: "{{ intersight_power_policy.target_platform if intersight_power_policy.target_platform is not none else omit }}"
        use_proxy: "{{ intersight_power_policy.use_proxy if intersight_power_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_power_policy.validate_certs if intersight_power_policy.validate_certs is not none else omit }}"
      register: intersight_power_policy_result
      tags:
        - never
        - intersight_power_policy
