---
# Sample playbook for cisco.intersight.intersight_snmp_policy (cisco.intersight 2.23.0)
# Build order: 107
# SNMP Policy configuration for Cisco Intersight
# Reads ../models/intersight_snmp_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_snmp_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0107 intersight_snmp_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_snmp_policy.yml
  tasks:
    - name: Run intersight_snmp_policy from its model
      cisco.intersight.intersight_snmp_policy:
        access_community_string: "{{ intersight_snmp_policy.access_community_string if intersight_snmp_policy.access_community_string is not none else omit }}"
        api_bearer_token: "{{ intersight_snmp_policy.api_bearer_token if intersight_snmp_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_snmp_policy.api_key_id if intersight_snmp_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_snmp_policy.api_private_key if intersight_snmp_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_snmp_policy.api_uri if intersight_snmp_policy.api_uri is not none else omit }}"
        community_access: "{{ intersight_snmp_policy.community_access if intersight_snmp_policy.community_access is not none else omit }}"
        description: "{{ intersight_snmp_policy.description if intersight_snmp_policy.description is not none else omit }}"
        enabled: "{{ intersight_snmp_policy.enabled if intersight_snmp_policy.enabled is not none else omit }}"
        engine_input_id: "{{ intersight_snmp_policy.engine_input_id if intersight_snmp_policy.engine_input_id is not none else omit }}"
        name: "{{ intersight_snmp_policy.name if intersight_snmp_policy.name is not none else omit }}"
        organization: "{{ intersight_snmp_policy.organization if intersight_snmp_policy.organization is not none else omit }}"
        snmp_port: "{{ intersight_snmp_policy.snmp_port if intersight_snmp_policy.snmp_port is not none else omit }}"
        snmp_traps: "{{ (intersight_snmp_policy.snmp_traps | cat_strip_nulls) if (intersight_snmp_policy.snmp_traps | cat_strip_nulls) is not none else omit }}"
        snmp_users: "{{ (intersight_snmp_policy.snmp_users | cat_strip_nulls) if (intersight_snmp_policy.snmp_users | cat_strip_nulls) is not none else omit }}"
        state: "{{ intersight_snmp_policy.state if intersight_snmp_policy.state is not none else omit }}"
        sys_contact: "{{ intersight_snmp_policy.sys_contact if intersight_snmp_policy.sys_contact is not none else omit }}"
        sys_location: "{{ intersight_snmp_policy.sys_location if intersight_snmp_policy.sys_location is not none else omit }}"
        tags: "{{ (intersight_snmp_policy.tags | cat_strip_nulls) if (intersight_snmp_policy.tags | cat_strip_nulls) is not none else omit }}"
        trap_community: "{{ intersight_snmp_policy.trap_community if intersight_snmp_policy.trap_community is not none else omit }}"
        use_proxy: "{{ intersight_snmp_policy.use_proxy if intersight_snmp_policy.use_proxy is not none else omit }}"
        v2c_enabled: "{{ intersight_snmp_policy.v2c_enabled if intersight_snmp_policy.v2c_enabled is not none else omit }}"
        v3_enabled: "{{ intersight_snmp_policy.v3_enabled if intersight_snmp_policy.v3_enabled is not none else omit }}"
        validate_certs: "{{ intersight_snmp_policy.validate_certs if intersight_snmp_policy.validate_certs is not none else omit }}"
      register: intersight_snmp_policy_result
      tags:
        - never
        - intersight_snmp_policy
