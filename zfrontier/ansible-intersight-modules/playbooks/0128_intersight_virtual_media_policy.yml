---
# Sample playbook for cisco.intersight.intersight_virtual_media_policy (cisco.intersight 2.23.0)
# Build order: 128
# Virtual Media policy configuration for Cisco Intersight
# Reads ../models/intersight_virtual_media_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_virtual_media_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0128 intersight_virtual_media_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_virtual_media_policy.yml
  tasks:
    - name: Run intersight_virtual_media_policy from its model
      cisco.intersight.intersight_virtual_media_policy:
        api_bearer_token: "{{ intersight_virtual_media_policy.api_bearer_token if intersight_virtual_media_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_virtual_media_policy.api_key_id if intersight_virtual_media_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_virtual_media_policy.api_private_key if intersight_virtual_media_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_virtual_media_policy.api_uri if intersight_virtual_media_policy.api_uri is not none else omit }}"
        cdd_virtual_media: "{{ (intersight_virtual_media_policy.cdd_virtual_media | cat_strip_nulls) if (intersight_virtual_media_policy.cdd_virtual_media | cat_strip_nulls) is not none else omit }}"
        description: "{{ intersight_virtual_media_policy.description if intersight_virtual_media_policy.description is not none else omit }}"
        enable: "{{ intersight_virtual_media_policy.enable if intersight_virtual_media_policy.enable is not none else omit }}"
        encryption: "{{ intersight_virtual_media_policy.encryption if intersight_virtual_media_policy.encryption is not none else omit }}"
        hdd_virtual_media: "{{ (intersight_virtual_media_policy.hdd_virtual_media | cat_strip_nulls) if (intersight_virtual_media_policy.hdd_virtual_media | cat_strip_nulls) is not none else omit }}"
        low_power_usb: "{{ intersight_virtual_media_policy.low_power_usb if intersight_virtual_media_policy.low_power_usb is not none else omit }}"
        name: "{{ intersight_virtual_media_policy.name if intersight_virtual_media_policy.name is not none else omit }}"
        organization: "{{ intersight_virtual_media_policy.organization if intersight_virtual_media_policy.organization is not none else omit }}"
        state: "{{ intersight_virtual_media_policy.state if intersight_virtual_media_policy.state is not none else omit }}"
        tags: "{{ (intersight_virtual_media_policy.tags | cat_strip_nulls) if (intersight_virtual_media_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_virtual_media_policy.use_proxy if intersight_virtual_media_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_virtual_media_policy.validate_certs if intersight_virtual_media_policy.validate_certs is not none else omit }}"
      register: intersight_virtual_media_policy_result
      tags:
        - never
        - intersight_virtual_media_policy
