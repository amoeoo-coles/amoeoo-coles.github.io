---
# Sample playbook for cisco.intersight.intersight_boot_order_policy (cisco.intersight 2.23.0)
# Build order: 9
# Boot Order policy configuration for Cisco Intersight
# Reads ../models/intersight_boot_order_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_boot_order_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0009 intersight_boot_order_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_boot_order_policy.yml
  tasks:
    - name: Run intersight_boot_order_policy from its model
      cisco.intersight.intersight_boot_order_policy:
        api_bearer_token: "{{ intersight_boot_order_policy.api_bearer_token if intersight_boot_order_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_boot_order_policy.api_key_id if intersight_boot_order_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_boot_order_policy.api_private_key if intersight_boot_order_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_boot_order_policy.api_uri if intersight_boot_order_policy.api_uri is not none else omit }}"
        boot_devices: "{{ (intersight_boot_order_policy.boot_devices | cat_strip_nulls) if (intersight_boot_order_policy.boot_devices | cat_strip_nulls) is not none else omit }}"
        configured_boot_mode: "{{ intersight_boot_order_policy.configured_boot_mode if intersight_boot_order_policy.configured_boot_mode is not none else omit }}"
        description: "{{ intersight_boot_order_policy.description if intersight_boot_order_policy.description is not none else omit }}"
        name: "{{ intersight_boot_order_policy.name if intersight_boot_order_policy.name is not none else omit }}"
        organization: "{{ intersight_boot_order_policy.organization if intersight_boot_order_policy.organization is not none else omit }}"
        state: "{{ intersight_boot_order_policy.state if intersight_boot_order_policy.state is not none else omit }}"
        tags: "{{ (intersight_boot_order_policy.tags | cat_strip_nulls) if (intersight_boot_order_policy.tags | cat_strip_nulls) is not none else omit }}"
        uefi_enable_secure_boot: "{{ intersight_boot_order_policy.uefi_enable_secure_boot if intersight_boot_order_policy.uefi_enable_secure_boot is not none else omit }}"
        use_proxy: "{{ intersight_boot_order_policy.use_proxy if intersight_boot_order_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_boot_order_policy.validate_certs if intersight_boot_order_policy.validate_certs is not none else omit }}"
      register: intersight_boot_order_policy_result
      tags:
        - never
        - intersight_boot_order_policy
