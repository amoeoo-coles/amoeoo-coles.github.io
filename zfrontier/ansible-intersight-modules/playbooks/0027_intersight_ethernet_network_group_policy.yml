---
# Sample playbook for cisco.intersight.intersight_ethernet_network_group_policy (cisco.intersight 2.23.0)
# Build order: 27
# Ethernet Network Group Policy configuration for Cisco Intersight
# Reads ../models/intersight_ethernet_network_group_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ethernet_network_group_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0027 intersight_ethernet_network_group_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ethernet_network_group_policy.yml
  tasks:
    - name: Run intersight_ethernet_network_group_policy from its model
      cisco.intersight.intersight_ethernet_network_group_policy:
        allowed_vlans: "{{ intersight_ethernet_network_group_policy.allowed_vlans if intersight_ethernet_network_group_policy.allowed_vlans is not none else omit }}"
        api_bearer_token: "{{ intersight_ethernet_network_group_policy.api_bearer_token if intersight_ethernet_network_group_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ethernet_network_group_policy.api_key_id if intersight_ethernet_network_group_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ethernet_network_group_policy.api_private_key if intersight_ethernet_network_group_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ethernet_network_group_policy.api_uri if intersight_ethernet_network_group_policy.api_uri is not none else omit }}"
        description: "{{ intersight_ethernet_network_group_policy.description if intersight_ethernet_network_group_policy.description is not none else omit }}"
        name: "{{ intersight_ethernet_network_group_policy.name if intersight_ethernet_network_group_policy.name is not none else omit }}"
        native_vlan: "{{ intersight_ethernet_network_group_policy.native_vlan if intersight_ethernet_network_group_policy.native_vlan is not none else omit }}"
        organization: "{{ intersight_ethernet_network_group_policy.organization if intersight_ethernet_network_group_policy.organization is not none else omit }}"
        qinq_enabled: "{{ intersight_ethernet_network_group_policy.qinq_enabled if intersight_ethernet_network_group_policy.qinq_enabled is not none else omit }}"
        qinq_vlan: "{{ intersight_ethernet_network_group_policy.qinq_vlan if intersight_ethernet_network_group_policy.qinq_vlan is not none else omit }}"
        state: "{{ intersight_ethernet_network_group_policy.state if intersight_ethernet_network_group_policy.state is not none else omit }}"
        tags: "{{ intersight_ethernet_network_group_policy.tags if intersight_ethernet_network_group_policy.tags is not none else omit }}"
        use_proxy: "{{ intersight_ethernet_network_group_policy.use_proxy if intersight_ethernet_network_group_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ethernet_network_group_policy.validate_certs if intersight_ethernet_network_group_policy.validate_certs is not none else omit }}"
      register: intersight_ethernet_network_group_policy_result
      tags:
        - never
        - intersight_ethernet_network_group_policy
