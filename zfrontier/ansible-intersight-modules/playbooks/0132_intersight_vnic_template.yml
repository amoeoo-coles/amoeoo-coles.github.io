---
# Sample playbook for cisco.intersight.intersight_vnic_template (cisco.intersight 2.23.0)
# Build order: 132
# Manage vNIC Templates for Cisco Intersight
# Reads ../models/intersight_vnic_template.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vnic_template_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0132 intersight_vnic_template"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_vnic_template.yml
  tasks:
    - name: Run intersight_vnic_template from its model
      cisco.intersight.intersight_vnic_template:
        api_bearer_token: "{{ intersight_vnic_template.api_bearer_token if intersight_vnic_template.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_vnic_template.api_key_id if intersight_vnic_template.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_vnic_template.api_private_key if intersight_vnic_template.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_vnic_template.api_uri if intersight_vnic_template.api_uri is not none else omit }}"
        cdn_source: "{{ intersight_vnic_template.cdn_source if intersight_vnic_template.cdn_source is not none else omit }}"
        cdn_value: "{{ intersight_vnic_template.cdn_value if intersight_vnic_template.cdn_value is not none else omit }}"
        connection_type: "{{ intersight_vnic_template.connection_type if intersight_vnic_template.connection_type is not none else omit }}"
        description: "{{ intersight_vnic_template.description if intersight_vnic_template.description is not none else omit }}"
        enable_override: "{{ intersight_vnic_template.enable_override if intersight_vnic_template.enable_override is not none else omit }}"
        eth_adapter_policy_name: "{{ intersight_vnic_template.eth_adapter_policy_name if intersight_vnic_template.eth_adapter_policy_name is not none else omit }}"
        eth_qos_policy_name: "{{ intersight_vnic_template.eth_qos_policy_name if intersight_vnic_template.eth_qos_policy_name is not none else omit }}"
        fabric_eth_network_control_policy_name: "{{ intersight_vnic_template.fabric_eth_network_control_policy_name if intersight_vnic_template.fabric_eth_network_control_policy_name is not none else omit }}"
        fabric_eth_network_group_policy_name: "{{ intersight_vnic_template.fabric_eth_network_group_policy_name if intersight_vnic_template.fabric_eth_network_group_policy_name is not none else omit }}"
        failover_enabled: "{{ intersight_vnic_template.failover_enabled if intersight_vnic_template.failover_enabled is not none else omit }}"
        iscsi_boot_policy_name: "{{ intersight_vnic_template.iscsi_boot_policy_name if intersight_vnic_template.iscsi_boot_policy_name is not none else omit }}"
        mac_pool_name: "{{ intersight_vnic_template.mac_pool_name if intersight_vnic_template.mac_pool_name is not none else omit }}"
        name: "{{ intersight_vnic_template.name if intersight_vnic_template.name is not none else omit }}"
        organization: "{{ intersight_vnic_template.organization if intersight_vnic_template.organization is not none else omit }}"
        pin_group_name: "{{ intersight_vnic_template.pin_group_name if intersight_vnic_template.pin_group_name is not none else omit }}"
        sriov_settings: "{{ intersight_vnic_template.sriov_settings if intersight_vnic_template.sriov_settings is not none else omit }}"
        state: "{{ intersight_vnic_template.state if intersight_vnic_template.state is not none else omit }}"
        switch_id: "{{ intersight_vnic_template.switch_id if intersight_vnic_template.switch_id is not none else omit }}"
        tags: "{{ (intersight_vnic_template.tags | cat_strip_nulls) if (intersight_vnic_template.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_vnic_template.use_proxy if intersight_vnic_template.use_proxy is not none else omit }}"
        usnic_settings: "{{ intersight_vnic_template.usnic_settings if intersight_vnic_template.usnic_settings is not none else omit }}"
        validate_certs: "{{ intersight_vnic_template.validate_certs if intersight_vnic_template.validate_certs is not none else omit }}"
        vmq_settings: "{{ intersight_vnic_template.vmq_settings if intersight_vnic_template.vmq_settings is not none else omit }}"
      register: intersight_vnic_template_result
      tags:
        - never
        - intersight_vnic_template
