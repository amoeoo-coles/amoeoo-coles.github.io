---
# Sample playbook for cisco.intersight.intersight_chassis_profile_info (cisco.intersight 2.23.0)
# Build order: 14
# Gather information about Chassis Profiles in Cisco Intersight
# Reads ../models/intersight_chassis_profile_info.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_chassis_profile_info_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0014 intersight_chassis_profile_info"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_chassis_profile_info.yml
  tasks:
    - name: Run intersight_chassis_profile_info from its model
      cisco.intersight.intersight_chassis_profile_info:
        api_bearer_token: "{{ intersight_chassis_profile_info.api_bearer_token if intersight_chassis_profile_info.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_chassis_profile_info.api_key_id if intersight_chassis_profile_info.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_chassis_profile_info.api_private_key if intersight_chassis_profile_info.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_chassis_profile_info.api_uri if intersight_chassis_profile_info.api_uri is not none else omit }}"
        name: "{{ intersight_chassis_profile_info.name if intersight_chassis_profile_info.name is not none else omit }}"
        organization: "{{ intersight_chassis_profile_info.organization if intersight_chassis_profile_info.organization is not none else omit }}"
        use_proxy: "{{ intersight_chassis_profile_info.use_proxy if intersight_chassis_profile_info.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_chassis_profile_info.validate_certs if intersight_chassis_profile_info.validate_certs is not none else omit }}"
      register: intersight_chassis_profile_info_result
