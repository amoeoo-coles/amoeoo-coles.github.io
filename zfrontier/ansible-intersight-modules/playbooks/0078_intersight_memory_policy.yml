---
# Sample playbook for cisco.intersight.intersight_memory_policy (cisco.intersight 2.23.0)
# Build order: 78
# Memory policy configuration for Cisco Intersight
# Reads ../models/intersight_memory_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_memory_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0078 intersight_memory_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_memory_policy.yml
  tasks:
    - name: Run intersight_memory_policy from its model
      cisco.intersight.intersight_memory_policy:
        api_bearer_token: "{{ intersight_memory_policy.api_bearer_token if intersight_memory_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_memory_policy.api_key_id if intersight_memory_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_memory_policy.api_private_key if intersight_memory_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_memory_policy.api_uri if intersight_memory_policy.api_uri is not none else omit }}"
        description: "{{ intersight_memory_policy.description if intersight_memory_policy.description is not none else omit }}"
        enable_dimm_blocklisting: "{{ intersight_memory_policy.enable_dimm_blocklisting if intersight_memory_policy.enable_dimm_blocklisting is not none else omit }}"
        name: "{{ intersight_memory_policy.name if intersight_memory_policy.name is not none else omit }}"
        organization: "{{ intersight_memory_policy.organization if intersight_memory_policy.organization is not none else omit }}"
        state: "{{ intersight_memory_policy.state if intersight_memory_policy.state is not none else omit }}"
        tags: "{{ (intersight_memory_policy.tags | cat_strip_nulls) if (intersight_memory_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_memory_policy.use_proxy if intersight_memory_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_memory_policy.validate_certs if intersight_memory_policy.validate_certs is not none else omit }}"
      register: intersight_memory_policy_result
      tags:
        - never
        - intersight_memory_policy
