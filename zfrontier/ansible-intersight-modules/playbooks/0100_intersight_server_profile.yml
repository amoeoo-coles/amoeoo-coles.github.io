---
# Sample playbook for cisco.intersight.intersight_server_profile (cisco.intersight 2.23.0)
# Build order: 100
# Server Profile configuration for Cisco Intersight
# Reads ../models/intersight_server_profile.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_server_profile_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0100 intersight_server_profile"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_server_profile.yml
  tasks:
    - name: Run intersight_server_profile from its model
      cisco.intersight.intersight_server_profile:
        action: "{{ intersight_server_profile.action if intersight_server_profile.action is not none else omit }}"
        action_poll_interval: "{{ intersight_server_profile.action_poll_interval if intersight_server_profile.action_poll_interval is not none else omit }}"
        action_timeout: "{{ intersight_server_profile.action_timeout if intersight_server_profile.action_timeout is not none else omit }}"
        adapter_policy: "{{ intersight_server_profile.adapter_policy if intersight_server_profile.adapter_policy is not none else omit }}"
        api_bearer_token: "{{ intersight_server_profile.api_bearer_token if intersight_server_profile.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_server_profile.api_key_id if intersight_server_profile.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_server_profile.api_private_key if intersight_server_profile.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_server_profile.api_uri if intersight_server_profile.api_uri is not none else omit }}"
        assigned_server: "{{ intersight_server_profile.assigned_server if intersight_server_profile.assigned_server is not none else omit }}"
        assigned_server_serial: "{{ intersight_server_profile.assigned_server_serial if intersight_server_profile.assigned_server_serial is not none else omit }}"
        bios_policy: "{{ intersight_server_profile.bios_policy if intersight_server_profile.bios_policy is not none else omit }}"
        boot_order_policy: "{{ intersight_server_profile.boot_order_policy if intersight_server_profile.boot_order_policy is not none else omit }}"
        certificate_policy: "{{ intersight_server_profile.certificate_policy if intersight_server_profile.certificate_policy is not none else omit }}"
        description: "{{ intersight_server_profile.description if intersight_server_profile.description is not none else omit }}"
        drive_security_policy: "{{ intersight_server_profile.drive_security_policy if intersight_server_profile.drive_security_policy is not none else omit }}"
        firmware_policy: "{{ intersight_server_profile.firmware_policy if intersight_server_profile.firmware_policy is not none else omit }}"
        imc_access_policy: "{{ intersight_server_profile.imc_access_policy if intersight_server_profile.imc_access_policy is not none else omit }}"
        ipmi_over_lan_policy: "{{ intersight_server_profile.ipmi_over_lan_policy if intersight_server_profile.ipmi_over_lan_policy is not none else omit }}"
        lan_connectivity_policy: "{{ intersight_server_profile.lan_connectivity_policy if intersight_server_profile.lan_connectivity_policy is not none else omit }}"
        ldap_policy: "{{ intersight_server_profile.ldap_policy if intersight_server_profile.ldap_policy is not none else omit }}"
        local_user_policy: "{{ intersight_server_profile.local_user_policy if intersight_server_profile.local_user_policy is not none else omit }}"
        name: "{{ intersight_server_profile.name if intersight_server_profile.name is not none else omit }}"
        network_connectivity_policy: "{{ intersight_server_profile.network_connectivity_policy if intersight_server_profile.network_connectivity_policy is not none else omit }}"
        ntp_policy: "{{ intersight_server_profile.ntp_policy if intersight_server_profile.ntp_policy is not none else omit }}"
        organization: "{{ intersight_server_profile.organization if intersight_server_profile.organization is not none else omit }}"
        power_policy: "{{ intersight_server_profile.power_policy if intersight_server_profile.power_policy is not none else omit }}"
        san_connectivity_policy: "{{ intersight_server_profile.san_connectivity_policy if intersight_server_profile.san_connectivity_policy is not none else omit }}"
        sd_card_policy: "{{ intersight_server_profile.sd_card_policy if intersight_server_profile.sd_card_policy is not none else omit }}"
        serial_over_lan_policy: "{{ intersight_server_profile.serial_over_lan_policy if intersight_server_profile.serial_over_lan_policy is not none else omit }}"
        server_profile_template: "{{ intersight_server_profile.server_profile_template if intersight_server_profile.server_profile_template is not none else omit }}"
        smtp_policy: "{{ intersight_server_profile.smtp_policy if intersight_server_profile.smtp_policy is not none else omit }}"
        snmp_policy: "{{ intersight_server_profile.snmp_policy if intersight_server_profile.snmp_policy is not none else omit }}"
        ssh_policy: "{{ intersight_server_profile.ssh_policy if intersight_server_profile.ssh_policy is not none else omit }}"
        state: "{{ intersight_server_profile.state if intersight_server_profile.state is not none else omit }}"
        static_uuid_address: "{{ intersight_server_profile.static_uuid_address if intersight_server_profile.static_uuid_address is not none else omit }}"
        storage_policy: "{{ intersight_server_profile.storage_policy if intersight_server_profile.storage_policy is not none else omit }}"
        syslog_policy: "{{ intersight_server_profile.syslog_policy if intersight_server_profile.syslog_policy is not none else omit }}"
        tags: "{{ (intersight_server_profile.tags | cat_strip_nulls) if (intersight_server_profile.tags | cat_strip_nulls) is not none else omit }}"
        target_platform: "{{ intersight_server_profile.target_platform if intersight_server_profile.target_platform is not none else omit }}"
        thermal_policy: "{{ intersight_server_profile.thermal_policy if intersight_server_profile.thermal_policy is not none else omit }}"
        use_proxy: "{{ intersight_server_profile.use_proxy if intersight_server_profile.use_proxy is not none else omit }}"
        uuid_address_type: "{{ intersight_server_profile.uuid_address_type if intersight_server_profile.uuid_address_type is not none else omit }}"
        uuid_pool: "{{ intersight_server_profile.uuid_pool if intersight_server_profile.uuid_pool is not none else omit }}"
        validate_certs: "{{ intersight_server_profile.validate_certs if intersight_server_profile.validate_certs is not none else omit }}"
        virtual_kvm_policy: "{{ intersight_server_profile.virtual_kvm_policy if intersight_server_profile.virtual_kvm_policy is not none else omit }}"
        virtual_media_policy: "{{ intersight_server_profile.virtual_media_policy if intersight_server_profile.virtual_media_policy is not none else omit }}"
        wait_for_action: "{{ intersight_server_profile.wait_for_action if intersight_server_profile.wait_for_action is not none else omit }}"
      register: intersight_server_profile_result
      tags:
        - never
        - intersight_server_profile
