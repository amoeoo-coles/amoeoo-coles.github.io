---
# Sample playbook for cisco.intersight.intersight_ipmi_over_lan_policy (cisco.intersight 2.23.0)
# Build order: 50
# IPMI over LAN Policy configuration for Cisco Intersight
# Reads ../models/intersight_ipmi_over_lan_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ipmi_over_lan_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0050 intersight_ipmi_over_lan_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ipmi_over_lan_policy.yml
  tasks:
    - name: Run intersight_ipmi_over_lan_policy from its model
      cisco.intersight.intersight_ipmi_over_lan_policy:
        api_bearer_token: "{{ intersight_ipmi_over_lan_policy.api_bearer_token if intersight_ipmi_over_lan_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ipmi_over_lan_policy.api_key_id if intersight_ipmi_over_lan_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ipmi_over_lan_policy.api_private_key if intersight_ipmi_over_lan_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ipmi_over_lan_policy.api_uri if intersight_ipmi_over_lan_policy.api_uri is not none else omit }}"
        description: "{{ intersight_ipmi_over_lan_policy.description if intersight_ipmi_over_lan_policy.description is not none else omit }}"
        enabled: "{{ intersight_ipmi_over_lan_policy.enabled if intersight_ipmi_over_lan_policy.enabled is not none else omit }}"
        encryption_key: "{{ intersight_ipmi_over_lan_policy.encryption_key if intersight_ipmi_over_lan_policy.encryption_key is not none else omit }}"
        name: "{{ intersight_ipmi_over_lan_policy.name if intersight_ipmi_over_lan_policy.name is not none else omit }}"
        organization: "{{ intersight_ipmi_over_lan_policy.organization if intersight_ipmi_over_lan_policy.organization is not none else omit }}"
        privilege: "{{ intersight_ipmi_over_lan_policy.privilege if intersight_ipmi_over_lan_policy.privilege is not none else omit }}"
        state: "{{ intersight_ipmi_over_lan_policy.state if intersight_ipmi_over_lan_policy.state is not none else omit }}"
        tags: "{{ (intersight_ipmi_over_lan_policy.tags | cat_strip_nulls) if (intersight_ipmi_over_lan_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_ipmi_over_lan_policy.use_proxy if intersight_ipmi_over_lan_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ipmi_over_lan_policy.validate_certs if intersight_ipmi_over_lan_policy.validate_certs is not none else omit }}"
      register: intersight_ipmi_over_lan_policy_result
      tags:
        - never
        - intersight_ipmi_over_lan_policy
