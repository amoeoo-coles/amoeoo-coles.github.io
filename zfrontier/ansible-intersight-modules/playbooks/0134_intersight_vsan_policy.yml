---
# Sample playbook for cisco.intersight.intersight_vsan_policy (cisco.intersight 2.23.0)
# Build order: 134
# Manage VSAN Policies and VSANs for Cisco Intersight
# Reads ../models/intersight_vsan_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vsan_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0134 intersight_vsan_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_vsan_policy.yml
  tasks:
    - name: Run intersight_vsan_policy from its model
      cisco.intersight.intersight_vsan_policy:
        api_bearer_token: "{{ intersight_vsan_policy.api_bearer_token if intersight_vsan_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_vsan_policy.api_key_id if intersight_vsan_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_vsan_policy.api_private_key if intersight_vsan_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_vsan_policy.api_uri if intersight_vsan_policy.api_uri is not none else omit }}"
        description: "{{ intersight_vsan_policy.description if intersight_vsan_policy.description is not none else omit }}"
        enable_trunking: "{{ intersight_vsan_policy.enable_trunking if intersight_vsan_policy.enable_trunking is not none else omit }}"
        name: "{{ intersight_vsan_policy.name if intersight_vsan_policy.name is not none else omit }}"
        organization: "{{ intersight_vsan_policy.organization if intersight_vsan_policy.organization is not none else omit }}"
        state: "{{ intersight_vsan_policy.state if intersight_vsan_policy.state is not none else omit }}"
        tags: "{{ (intersight_vsan_policy.tags | cat_strip_nulls) if (intersight_vsan_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_vsan_policy.use_proxy if intersight_vsan_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_vsan_policy.validate_certs if intersight_vsan_policy.validate_certs is not none else omit }}"
        vsans: "{{ (intersight_vsan_policy.vsans | cat_strip_nulls) if (intersight_vsan_policy.vsans | cat_strip_nulls) is not none else omit }}"
      register: intersight_vsan_policy_result
      tags:
        - never
        - intersight_vsan_policy
