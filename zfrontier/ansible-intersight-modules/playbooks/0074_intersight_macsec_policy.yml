---
# Sample playbook for cisco.intersight.intersight_macsec_policy (cisco.intersight 2.23.0)
# Build order: 74
# MACsec Policy configuration for Cisco Intersight
# Reads ../models/intersight_macsec_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_macsec_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0074 intersight_macsec_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_macsec_policy.yml
  tasks:
    - name: Run intersight_macsec_policy from its model
      cisco.intersight.intersight_macsec_policy:
        api_bearer_token: "{{ intersight_macsec_policy.api_bearer_token if intersight_macsec_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_macsec_policy.api_key_id if intersight_macsec_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_macsec_policy.api_private_key if intersight_macsec_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_macsec_policy.api_uri if intersight_macsec_policy.api_uri is not none else omit }}"
        cipher_suite: "{{ intersight_macsec_policy.cipher_suite if intersight_macsec_policy.cipher_suite is not none else omit }}"
        confidentiality_offset: "{{ intersight_macsec_policy.confidentiality_offset if intersight_macsec_policy.confidentiality_offset is not none else omit }}"
        configure_fallback_keychain: "{{ intersight_macsec_policy.configure_fallback_keychain if intersight_macsec_policy.configure_fallback_keychain is not none else omit }}"
        description: "{{ intersight_macsec_policy.description if intersight_macsec_policy.description is not none else omit }}"
        eapol_ethertype: "{{ intersight_macsec_policy.eapol_ethertype if intersight_macsec_policy.eapol_ethertype is not none else omit }}"
        eapol_mac_address: "{{ intersight_macsec_policy.eapol_mac_address if intersight_macsec_policy.eapol_mac_address is not none else omit }}"
        fallback_keychain_name: "{{ intersight_macsec_policy.fallback_keychain_name if intersight_macsec_policy.fallback_keychain_name is not none else omit }}"
        fallback_keys: "{{ intersight_macsec_policy.fallback_keys if intersight_macsec_policy.fallback_keys is not none else omit }}"
        include_icv_indicator: "{{ intersight_macsec_policy.include_icv_indicator if intersight_macsec_policy.include_icv_indicator is not none else omit }}"
        key_server_priority: "{{ intersight_macsec_policy.key_server_priority if intersight_macsec_policy.key_server_priority is not none else omit }}"
        name: "{{ intersight_macsec_policy.name if intersight_macsec_policy.name is not none else omit }}"
        organization: "{{ intersight_macsec_policy.organization if intersight_macsec_policy.organization is not none else omit }}"
        primary_keychain_name: "{{ intersight_macsec_policy.primary_keychain_name if intersight_macsec_policy.primary_keychain_name is not none else omit }}"
        primary_keys: "{{ (intersight_macsec_policy.primary_keys | cat_strip_nulls) if (intersight_macsec_policy.primary_keys | cat_strip_nulls) is not none else omit }}"
        replay_window_size: "{{ intersight_macsec_policy.replay_window_size if intersight_macsec_policy.replay_window_size is not none else omit }}"
        sak_expiry_time: "{{ intersight_macsec_policy.sak_expiry_time if intersight_macsec_policy.sak_expiry_time is not none else omit }}"
        security_policy: "{{ intersight_macsec_policy.security_policy if intersight_macsec_policy.security_policy is not none else omit }}"
        state: "{{ intersight_macsec_policy.state if intersight_macsec_policy.state is not none else omit }}"
        tags: "{{ (intersight_macsec_policy.tags | cat_strip_nulls) if (intersight_macsec_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_macsec_policy.use_proxy if intersight_macsec_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_macsec_policy.validate_certs if intersight_macsec_policy.validate_certs is not none else omit }}"
      register: intersight_macsec_policy_result
      tags:
        - never
        - intersight_macsec_policy
