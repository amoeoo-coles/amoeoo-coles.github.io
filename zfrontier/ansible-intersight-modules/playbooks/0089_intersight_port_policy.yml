---
# Sample playbook for cisco.intersight.intersight_port_policy (cisco.intersight 2.23.0)
# Build order: 89
# Manage Port Policies for Cisco Intersight
# Reads ../models/intersight_port_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_port_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0089 intersight_port_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_port_policy.yml
  tasks:
    - name: Run intersight_port_policy from its model
      cisco.intersight.intersight_port_policy:
        api_bearer_token: "{{ intersight_port_policy.api_bearer_token if intersight_port_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_port_policy.api_key_id if intersight_port_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_port_policy.api_private_key if intersight_port_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_port_policy.api_uri if intersight_port_policy.api_uri is not none else omit }}"
        appliance_port_channels: "{{ intersight_port_policy.appliance_port_channels if intersight_port_policy.appliance_port_channels is not none else omit }}"
        appliance_ports: "{{ intersight_port_policy.appliance_ports if intersight_port_policy.appliance_ports is not none else omit }}"
        breakout_ports: "{{ (intersight_port_policy.breakout_ports | cat_strip_nulls) if (intersight_port_policy.breakout_ports | cat_strip_nulls) is not none else omit }}"
        description: "{{ intersight_port_policy.description if intersight_port_policy.description is not none else omit }}"
        device_model: "{{ intersight_port_policy.device_model if intersight_port_policy.device_model is not none else omit }}"
        ethernet_uplink_port_channels: "{{ intersight_port_policy.ethernet_uplink_port_channels if intersight_port_policy.ethernet_uplink_port_channels is not none else omit }}"
        ethernet_uplink_ports: "{{ intersight_port_policy.ethernet_uplink_ports if intersight_port_policy.ethernet_uplink_ports is not none else omit }}"
        fc_port_mode: "{{ intersight_port_policy.fc_port_mode if intersight_port_policy.fc_port_mode is not none else omit }}"
        fc_storage_ports: "{{ intersight_port_policy.fc_storage_ports if intersight_port_policy.fc_storage_ports is not none else omit }}"
        fc_uplink_port_channels: "{{ intersight_port_policy.fc_uplink_port_channels if intersight_port_policy.fc_uplink_port_channels is not none else omit }}"
        fc_uplink_ports: "{{ intersight_port_policy.fc_uplink_ports if intersight_port_policy.fc_uplink_ports is not none else omit }}"
        fcoe_uplink_port_channels: "{{ intersight_port_policy.fcoe_uplink_port_channels if intersight_port_policy.fcoe_uplink_port_channels is not none else omit }}"
        fcoe_uplink_ports: "{{ intersight_port_policy.fcoe_uplink_ports if intersight_port_policy.fcoe_uplink_ports is not none else omit }}"
        name: "{{ intersight_port_policy.name if intersight_port_policy.name is not none else omit }}"
        organization: "{{ intersight_port_policy.organization if intersight_port_policy.organization is not none else omit }}"
        pin_groups: "{{ intersight_port_policy.pin_groups if intersight_port_policy.pin_groups is not none else omit }}"
        server_ports: "{{ (intersight_port_policy.server_ports | cat_strip_nulls) if (intersight_port_policy.server_ports | cat_strip_nulls) is not none else omit }}"
        state: "{{ intersight_port_policy.state if intersight_port_policy.state is not none else omit }}"
        tags: "{{ (intersight_port_policy.tags | cat_strip_nulls) if (intersight_port_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_port_policy.use_proxy if intersight_port_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_port_policy.validate_certs if intersight_port_policy.validate_certs is not none else omit }}"
      register: intersight_port_policy_result
      tags:
        - never
        - intersight_port_policy
