---
# Sample playbook for cisco.intersight.intersight_iscsi_adapter_policy (cisco.intersight 2.23.0)
# Build order: 54
# Manage iSCSI Adapter Policies for Cisco Intersight
# Reads ../models/intersight_iscsi_adapter_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_iscsi_adapter_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0054 intersight_iscsi_adapter_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_iscsi_adapter_policy.yml
  tasks:
    - name: Run intersight_iscsi_adapter_policy from its model
      cisco.intersight.intersight_iscsi_adapter_policy:
        api_bearer_token: "{{ intersight_iscsi_adapter_policy.api_bearer_token if intersight_iscsi_adapter_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_iscsi_adapter_policy.api_key_id if intersight_iscsi_adapter_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_iscsi_adapter_policy.api_private_key if intersight_iscsi_adapter_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_iscsi_adapter_policy.api_uri if intersight_iscsi_adapter_policy.api_uri is not none else omit }}"
        connection_time_out: "{{ intersight_iscsi_adapter_policy.connection_time_out if intersight_iscsi_adapter_policy.connection_time_out is not none else omit }}"
        description: "{{ intersight_iscsi_adapter_policy.description if intersight_iscsi_adapter_policy.description is not none else omit }}"
        dhcp_timeout: "{{ intersight_iscsi_adapter_policy.dhcp_timeout if intersight_iscsi_adapter_policy.dhcp_timeout is not none else omit }}"
        lun_busy_retry_count: "{{ intersight_iscsi_adapter_policy.lun_busy_retry_count if intersight_iscsi_adapter_policy.lun_busy_retry_count is not none else omit }}"
        name: "{{ intersight_iscsi_adapter_policy.name if intersight_iscsi_adapter_policy.name is not none else omit }}"
        organization: "{{ intersight_iscsi_adapter_policy.organization if intersight_iscsi_adapter_policy.organization is not none else omit }}"
        state: "{{ intersight_iscsi_adapter_policy.state if intersight_iscsi_adapter_policy.state is not none else omit }}"
        tags: "{{ intersight_iscsi_adapter_policy.tags if intersight_iscsi_adapter_policy.tags is not none else omit }}"
        use_proxy: "{{ intersight_iscsi_adapter_policy.use_proxy if intersight_iscsi_adapter_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_iscsi_adapter_policy.validate_certs if intersight_iscsi_adapter_policy.validate_certs is not none else omit }}"
      register: intersight_iscsi_adapter_policy_result
      tags:
        - never
        - intersight_iscsi_adapter_policy
