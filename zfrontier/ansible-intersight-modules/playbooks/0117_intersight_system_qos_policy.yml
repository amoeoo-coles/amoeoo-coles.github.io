---
# Sample playbook for cisco.intersight.intersight_system_qos_policy (cisco.intersight 2.23.0)
# Build order: 117
# System QoS policy configuration for Cisco Intersight
# Reads ../models/intersight_system_qos_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_system_qos_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0117 intersight_system_qos_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_system_qos_policy.yml
  tasks:
    - name: Run intersight_system_qos_policy from its model
      cisco.intersight.intersight_system_qos_policy:
        api_bearer_token: "{{ intersight_system_qos_policy.api_bearer_token if intersight_system_qos_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_system_qos_policy.api_key_id if intersight_system_qos_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_system_qos_policy.api_private_key if intersight_system_qos_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_system_qos_policy.api_uri if intersight_system_qos_policy.api_uri is not none else omit }}"
        classes: "{{ (intersight_system_qos_policy.classes | cat_strip_nulls) if (intersight_system_qos_policy.classes | cat_strip_nulls) is not none else omit }}"
        description: "{{ intersight_system_qos_policy.description if intersight_system_qos_policy.description is not none else omit }}"
        name: "{{ intersight_system_qos_policy.name if intersight_system_qos_policy.name is not none else omit }}"
        organization: "{{ intersight_system_qos_policy.organization if intersight_system_qos_policy.organization is not none else omit }}"
        state: "{{ intersight_system_qos_policy.state if intersight_system_qos_policy.state is not none else omit }}"
        tags: "{{ (intersight_system_qos_policy.tags | cat_strip_nulls) if (intersight_system_qos_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_system_qos_policy.use_proxy if intersight_system_qos_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_system_qos_policy.validate_certs if intersight_system_qos_policy.validate_certs is not none else omit }}"
      register: intersight_system_qos_policy_result
      tags:
        - never
        - intersight_system_qos_policy
