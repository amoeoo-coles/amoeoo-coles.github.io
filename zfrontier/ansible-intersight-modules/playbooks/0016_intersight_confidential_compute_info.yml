---
# Sample playbook for cisco.intersight.intersight_confidential_compute_info (cisco.intersight 2.23.0)
# Build order: 16
# Gather information about Confidential Compute Policies
# Reads ../models/intersight_confidential_compute_info.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_confidential_compute_info_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0016 intersight_confidential_compute_info"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_confidential_compute_info.yml
  tasks:
    - name: Run intersight_confidential_compute_info from its model
      cisco.intersight.intersight_confidential_compute_info:
        api_bearer_token: "{{ intersight_confidential_compute_info.api_bearer_token if intersight_confidential_compute_info.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_confidential_compute_info.api_key_id if intersight_confidential_compute_info.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_confidential_compute_info.api_private_key if intersight_confidential_compute_info.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_confidential_compute_info.api_uri if intersight_confidential_compute_info.api_uri is not none else omit }}"
        name: "{{ intersight_confidential_compute_info.name if intersight_confidential_compute_info.name is not none else omit }}"
        organization: "{{ intersight_confidential_compute_info.organization if intersight_confidential_compute_info.organization is not none else omit }}"
        use_proxy: "{{ intersight_confidential_compute_info.use_proxy if intersight_confidential_compute_info.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_confidential_compute_info.validate_certs if intersight_confidential_compute_info.validate_certs is not none else omit }}"
      register: intersight_confidential_compute_info_result
