---
# Sample playbook for cisco.intersight.intersight_ldap_policy (cisco.intersight 2.23.0)
# Build order: 64
# Manage LDAP Policies for Cisco Intersight
# Reads ../models/intersight_ldap_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ldap_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0064 intersight_ldap_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ldap_policy.yml
  tasks:
    - name: Run intersight_ldap_policy from its model
      cisco.intersight.intersight_ldap_policy:
        api_bearer_token: "{{ intersight_ldap_policy.api_bearer_token if intersight_ldap_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ldap_policy.api_key_id if intersight_ldap_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ldap_policy.api_private_key if intersight_ldap_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ldap_policy.api_uri if intersight_ldap_policy.api_uri is not none else omit }}"
        attribute: "{{ intersight_ldap_policy.attribute if intersight_ldap_policy.attribute is not none else omit }}"
        base_dn: "{{ intersight_ldap_policy.base_dn if intersight_ldap_policy.base_dn is not none else omit }}"
        bind_dn: "{{ intersight_ldap_policy.bind_dn if intersight_ldap_policy.bind_dn is not none else omit }}"
        bind_method: "{{ intersight_ldap_policy.bind_method if intersight_ldap_policy.bind_method is not none else omit }}"
        description: "{{ intersight_ldap_policy.description if intersight_ldap_policy.description is not none else omit }}"
        dns_source: "{{ intersight_ldap_policy.dns_source if intersight_ldap_policy.dns_source is not none else omit }}"
        domain: "{{ intersight_ldap_policy.domain if intersight_ldap_policy.domain is not none else omit }}"
        enable_dns: "{{ intersight_ldap_policy.enable_dns if intersight_ldap_policy.enable_dns is not none else omit }}"
        enable_encryption: "{{ intersight_ldap_policy.enable_encryption if intersight_ldap_policy.enable_encryption is not none else omit }}"
        enable_ldap: "{{ intersight_ldap_policy.enable_ldap if intersight_ldap_policy.enable_ldap is not none else omit }}"
        filter: "{{ intersight_ldap_policy.filter if intersight_ldap_policy.filter is not none else omit }}"
        group_attribute: "{{ intersight_ldap_policy.group_attribute if intersight_ldap_policy.group_attribute is not none else omit }}"
        group_authorization: "{{ intersight_ldap_policy.group_authorization if intersight_ldap_policy.group_authorization is not none else omit }}"
        ldap_groups: "{{ (intersight_ldap_policy.ldap_groups | cat_strip_nulls) if (intersight_ldap_policy.ldap_groups | cat_strip_nulls) is not none else omit }}"
        ldap_providers: "{{ intersight_ldap_policy.ldap_providers if intersight_ldap_policy.ldap_providers is not none else omit }}"
        name: "{{ intersight_ldap_policy.name if intersight_ldap_policy.name is not none else omit }}"
        nested_group_search: "{{ intersight_ldap_policy.nested_group_search if intersight_ldap_policy.nested_group_search is not none else omit }}"
        nested_group_search_depth: "{{ intersight_ldap_policy.nested_group_search_depth if intersight_ldap_policy.nested_group_search_depth is not none else omit }}"
        organization: "{{ intersight_ldap_policy.organization if intersight_ldap_policy.organization is not none else omit }}"
        password: "{{ intersight_ldap_policy.password if intersight_ldap_policy.password is not none else omit }}"
        search_domain: "{{ intersight_ldap_policy.search_domain if intersight_ldap_policy.search_domain is not none else omit }}"
        search_forest: "{{ intersight_ldap_policy.search_forest if intersight_ldap_policy.search_forest is not none else omit }}"
        state: "{{ intersight_ldap_policy.state if intersight_ldap_policy.state is not none else omit }}"
        tags: "{{ (intersight_ldap_policy.tags | cat_strip_nulls) if (intersight_ldap_policy.tags | cat_strip_nulls) is not none else omit }}"
        timeout: "{{ intersight_ldap_policy.timeout if intersight_ldap_policy.timeout is not none else omit }}"
        use_proxy: "{{ intersight_ldap_policy.use_proxy if intersight_ldap_policy.use_proxy is not none else omit }}"
        user_search_precedence: "{{ intersight_ldap_policy.user_search_precedence if intersight_ldap_policy.user_search_precedence is not none else omit }}"
        validate_certs: "{{ intersight_ldap_policy.validate_certs if intersight_ldap_policy.validate_certs is not none else omit }}"
      register: intersight_ldap_policy_result
      tags:
        - never
        - intersight_ldap_policy
