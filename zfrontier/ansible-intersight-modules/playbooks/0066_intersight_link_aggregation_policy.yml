---
# Sample playbook for cisco.intersight.intersight_link_aggregation_policy (cisco.intersight 2.23.0)
# Build order: 66
# Link Aggregation Policy configuration for Cisco Intersight
# Reads ../models/intersight_link_aggregation_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_link_aggregation_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0066 intersight_link_aggregation_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_link_aggregation_policy.yml
  tasks:
    - name: Run intersight_link_aggregation_policy from its model
      cisco.intersight.intersight_link_aggregation_policy:
        api_bearer_token: "{{ intersight_link_aggregation_policy.api_bearer_token if intersight_link_aggregation_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_link_aggregation_policy.api_key_id if intersight_link_aggregation_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_link_aggregation_policy.api_private_key if intersight_link_aggregation_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_link_aggregation_policy.api_uri if intersight_link_aggregation_policy.api_uri is not none else omit }}"
        description: "{{ intersight_link_aggregation_policy.description if intersight_link_aggregation_policy.description is not none else omit }}"
        lacp_rate: "{{ intersight_link_aggregation_policy.lacp_rate if intersight_link_aggregation_policy.lacp_rate is not none else omit }}"
        name: "{{ intersight_link_aggregation_policy.name if intersight_link_aggregation_policy.name is not none else omit }}"
        organization: "{{ intersight_link_aggregation_policy.organization if intersight_link_aggregation_policy.organization is not none else omit }}"
        state: "{{ intersight_link_aggregation_policy.state if intersight_link_aggregation_policy.state is not none else omit }}"
        suspend_individual: "{{ intersight_link_aggregation_policy.suspend_individual if intersight_link_aggregation_policy.suspend_individual is not none else omit }}"
        tags: "{{ (intersight_link_aggregation_policy.tags | cat_strip_nulls) if (intersight_link_aggregation_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_link_aggregation_policy.use_proxy if intersight_link_aggregation_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_link_aggregation_policy.validate_certs if intersight_link_aggregation_policy.validate_certs is not none else omit }}"
      register: intersight_link_aggregation_policy_result
      tags:
        - never
        - intersight_link_aggregation_policy
