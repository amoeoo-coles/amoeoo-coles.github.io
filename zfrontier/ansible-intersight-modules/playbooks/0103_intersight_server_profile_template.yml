        certificate_policy: "{{ intersight_server_profile_template.certificate_policy if intersight_server_profile_template.certificate_policy is not none else omit }}"
        description: "{{ intersight_server_profile_template.description if intersight_server_profile_template.description is not none else omit }}"
        device_connector_policy: "{{ intersight_server_profile_template.device_connector_policy if intersight_server_profile_template.device_connector_policy is not none else omit }}"
        drive_security_policy: "{{ intersight_server_profile_template.drive_security_policy if intersight_server_profile_template.drive_security_policy is not none else omit }}"
        firmware_policy: "{{ intersight_server_profile_template.firmware_policy if intersight_server_profile_template.firmware_policy is not none else omit }}"
        ipmi_over_lan_policy: "{{ intersight_server_profile_template.ipmi_over_lan_policy if intersight_server_profile_template.ipmi_over_lan_policy is not none else omit }}"
