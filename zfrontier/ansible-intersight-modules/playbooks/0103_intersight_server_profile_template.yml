---
# Sample playbook for cisco.intersight.intersight_server_profile_template (cisco.intersight 2.23.0)
# Build order: 103
# Manage Server Profile Templates in Cisco Intersight
# Reads ../models/intersight_server_profile_template.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_server_profile_template_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0103 intersight_server_profile_template"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_server_profile_template.yml
  tasks:
    - name: Run intersight_server_profile_template from its model
      cisco.intersight.intersight_server_profile_template:
        adapter_policy: "{{ intersight_server_profile_template.adapter_policy if intersight_server_profile_template.adapter_policy is not none else omit }}"
        api_bearer_token: "{{ intersight_server_profile_template.api_bearer_token if intersight_server_profile_template.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_server_profile_template.api_key_id if intersight_server_profile_template.api_key_id is not none else omit }}"
