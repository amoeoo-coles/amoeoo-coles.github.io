        syslog_policy: "{{ intersight_server_profile_template.syslog_policy if intersight_server_profile_template.syslog_policy is not none else omit }}"
        tags: "{{ (intersight_server_profile_template.tags | cat_strip_nulls) if (intersight_server_profile_template.tags | cat_strip_nulls) is not none else omit }}"
        target_platform: "{{ intersight_server_profile_template.target_platform if intersight_server_profile_template.target_platform is not none else omit }}"
        thermal_policy: "{{ intersight_server_profile_template.thermal_policy if intersight_server_profile_template.thermal_policy is not none else omit }}"
