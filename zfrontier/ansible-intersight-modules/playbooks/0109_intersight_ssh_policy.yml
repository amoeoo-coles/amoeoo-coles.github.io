---
# Sample playbook for cisco.intersight.intersight_ssh_policy (cisco.intersight 2.23.0)
# Build order: 109
# SSH Policy configuration for Cisco Intersight
# Reads ../models/intersight_ssh_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ssh_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0109 intersight_ssh_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ssh_policy.yml
  tasks:
    - name: Run intersight_ssh_policy from its model
      cisco.intersight.intersight_ssh_policy:
        api_bearer_token: "{{ intersight_ssh_policy.api_bearer_token if intersight_ssh_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ssh_policy.api_key_id if intersight_ssh_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ssh_policy.api_private_key if intersight_ssh_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ssh_policy.api_uri if intersight_ssh_policy.api_uri is not none else omit }}"
        description: "{{ intersight_ssh_policy.description if intersight_ssh_policy.description is not none else omit }}"
        enable_ssh: "{{ intersight_ssh_policy.enable_ssh if intersight_ssh_policy.enable_ssh is not none else omit }}"
        name: "{{ intersight_ssh_policy.name if intersight_ssh_policy.name is not none else omit }}"
        organization: "{{ intersight_ssh_policy.organization if intersight_ssh_policy.organization is not none else omit }}"
        ssh_port: "{{ intersight_ssh_policy.ssh_port if intersight_ssh_policy.ssh_port is not none else omit }}"
        ssh_timeout: "{{ intersight_ssh_policy.ssh_timeout if intersight_ssh_policy.ssh_timeout is not none else omit }}"
        state: "{{ intersight_ssh_policy.state if intersight_ssh_policy.state is not none else omit }}"
        tags: "{{ (intersight_ssh_policy.tags | cat_strip_nulls) if (intersight_ssh_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_ssh_policy.use_proxy if intersight_ssh_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ssh_policy.validate_certs if intersight_ssh_policy.validate_certs is not none else omit }}"
      register: intersight_ssh_policy_result
      tags:
        - never
        - intersight_ssh_policy
