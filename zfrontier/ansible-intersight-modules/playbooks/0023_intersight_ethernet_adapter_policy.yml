        rss_ipv6_hash: "{{ intersight_ethernet_adapter_policy.rss_ipv6_hash if intersight_ethernet_adapter_policy.rss_ipv6_hash is not none else omit }}"
        rss_tcp_ipv4_hash: "{{ intersight_ethernet_adapter_policy.rss_tcp_ipv4_hash if intersight_ethernet_adapter_policy.rss_tcp_ipv4_hash is not none else omit }}"
