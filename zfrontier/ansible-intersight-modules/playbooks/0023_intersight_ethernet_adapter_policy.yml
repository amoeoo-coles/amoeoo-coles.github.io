---
# Sample playbook for cisco.intersight.intersight_ethernet_adapter_policy (cisco.intersight 2.23.0)
# Build order: 23
# Ethernet Adapter Policy configuration for Cisco Intersight
# Reads ../models/intersight_ethernet_adapter_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ethernet_adapter_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0023 intersight_ethernet_adapter_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ethernet_adapter_policy.yml
  tasks:
    - name: Run intersight_ethernet_adapter_policy from its model
      cisco.intersight.intersight_ethernet_adapter_policy:
        advanced_filter: "{{ intersight_ethernet_adapter_policy.advanced_filter if intersight_ethernet_adapter_policy.advanced_filter is not none else omit }}"
        api_bearer_token: "{{ intersight_ethernet_adapter_policy.api_bearer_token if intersight_ethernet_adapter_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ethernet_adapter_policy.api_key_id if intersight_ethernet_adapter_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ethernet_adapter_policy.api_private_key if intersight_ethernet_adapter_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ethernet_adapter_policy.api_uri if intersight_ethernet_adapter_policy.api_uri is not none else omit }}"
        arfs_enabled: "{{ intersight_ethernet_adapter_policy.arfs_enabled if intersight_ethernet_adapter_policy.arfs_enabled is not none else omit }}"
        completion_queue_count: "{{ intersight_ethernet_adapter_policy.completion_queue_count if intersight_ethernet_adapter_policy.completion_queue_count is not none else omit }}"
        completion_ring_size: "{{ intersight_ethernet_adapter_policy.completion_ring_size if intersight_ethernet_adapter_policy.completion_ring_size is not none else omit }}"
        description: "{{ intersight_ethernet_adapter_policy.description if intersight_ethernet_adapter_policy.description is not none else omit }}"
        etherchannel_pinning_enabled: "{{ intersight_ethernet_adapter_policy.etherchannel_pinning_enabled if intersight_ethernet_adapter_policy.etherchannel_pinning_enabled is not none else omit }}"
        geneve_enabled: "{{ intersight_ethernet_adapter_policy.geneve_enabled if intersight_ethernet_adapter_policy.geneve_enabled is not none else omit }}"
        interrupt_coalescing_time: "{{ intersight_ethernet_adapter_policy.interrupt_coalescing_time if intersight_ethernet_adapter_policy.interrupt_coalescing_time is not none else omit }}"
        interrupt_coalescing_type: "{{ intersight_ethernet_adapter_policy.interrupt_coalescing_type if intersight_ethernet_adapter_policy.interrupt_coalescing_type is not none else omit }}"
        interrupt_count: "{{ intersight_ethernet_adapter_policy.interrupt_count if intersight_ethernet_adapter_policy.interrupt_count is not none else omit }}"
        interrupt_mode: "{{ intersight_ethernet_adapter_policy.interrupt_mode if intersight_ethernet_adapter_policy.interrupt_mode is not none else omit }}"
        interrupt_scaling: "{{ intersight_ethernet_adapter_policy.interrupt_scaling if intersight_ethernet_adapter_policy.interrupt_scaling is not none else omit }}"
        name: "{{ intersight_ethernet_adapter_policy.name if intersight_ethernet_adapter_policy.name is not none else omit }}"
        nvgre_enabled: "{{ intersight_ethernet_adapter_policy.nvgre_enabled if intersight_ethernet_adapter_policy.nvgre_enabled is not none else omit }}"
        organization: "{{ intersight_ethernet_adapter_policy.organization if intersight_ethernet_adapter_policy.organization is not none else omit }}"
        ptp_enabled: "{{ intersight_ethernet_adapter_policy.ptp_enabled if intersight_ethernet_adapter_policy.ptp_enabled is not none else omit }}"
        roce_class_of_service: "{{ intersight_ethernet_adapter_policy.roce_class_of_service if intersight_ethernet_adapter_policy.roce_class_of_service is not none else omit }}"
        roce_enabled: "{{ intersight_ethernet_adapter_policy.roce_enabled if intersight_ethernet_adapter_policy.roce_enabled is not none else omit }}"
