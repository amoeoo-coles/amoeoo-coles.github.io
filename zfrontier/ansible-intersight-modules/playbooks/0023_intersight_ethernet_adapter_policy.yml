        rx_queue_count: "{{ intersight_ethernet_adapter_policy.rx_queue_count if intersight_ethernet_adapter_policy.rx_queue_count is not none else omit }}"
        rx_ring_size: "{{ intersight_ethernet_adapter_policy.rx_ring_size if intersight_ethernet_adapter_policy.rx_ring_size is not none else omit }}"
        state: "{{ intersight_ethernet_adapter_policy.state if intersight_ethernet_adapter_policy.state is not none else omit }}"
        tags: "{{ (intersight_ethernet_adapter_policy.tags | cat_strip_nulls) if (intersight_ethernet_adapter_policy.tags | cat_strip_nulls) is not none else omit }}"
        tcp_large_receive: "{{ intersight_ethernet_adapter_policy.tcp_large_receive if intersight_ethernet_adapter_policy.tcp_large_receive is not none else omit }}"
        tcp_large_send: "{{ intersight_ethernet_adapter_policy.tcp_large_send if intersight_ethernet_adapter_policy.tcp_large_send is not none else omit }}"
        tcp_rx_checksum: "{{ intersight_ethernet_adapter_policy.tcp_rx_checksum if intersight_ethernet_adapter_policy.tcp_rx_checksum is not none else omit }}"
        tcp_tx_checksum: "{{ intersight_ethernet_adapter_policy.tcp_tx_checksum if intersight_ethernet_adapter_policy.tcp_tx_checksum is not none else omit }}"
        tx_queue_count: "{{ intersight_ethernet_adapter_policy.tx_queue_count if intersight_ethernet_adapter_policy.tx_queue_count is not none else omit }}"
        tx_ring_size: "{{ intersight_ethernet_adapter_policy.tx_ring_size if intersight_ethernet_adapter_policy.tx_ring_size is not none else omit }}"
        uplink_failback_timeout: "{{ intersight_ethernet_adapter_policy.uplink_failback_timeout if intersight_ethernet_adapter_policy.uplink_failback_timeout is not none else omit }}"
        use_proxy: "{{ intersight_ethernet_adapter_policy.use_proxy if intersight_ethernet_adapter_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ethernet_adapter_policy.validate_certs if intersight_ethernet_adapter_policy.validate_certs is not none else omit }}"
        vxlan_enabled: "{{ intersight_ethernet_adapter_policy.vxlan_enabled if intersight_ethernet_adapter_policy.vxlan_enabled is not none else omit }}"
      register: intersight_ethernet_adapter_policy_result
      tags:
        - never
        - intersight_ethernet_adapter_policy
