---
# Sample playbook for cisco.intersight.intersight_ethernet_network_control_policy (cisco.intersight 2.23.0)
# Build order: 25
# Ethernet Network Control Policy configuration for Cisco Intersight
# Reads ../models/intersight_ethernet_network_control_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ethernet_network_control_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0025 intersight_ethernet_network_control_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ethernet_network_control_policy.yml
  tasks:
    - name: Run intersight_ethernet_network_control_policy from its model
      cisco.intersight.intersight_ethernet_network_control_policy:
        api_bearer_token: "{{ intersight_ethernet_network_control_policy.api_bearer_token if intersight_ethernet_network_control_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ethernet_network_control_policy.api_key_id if intersight_ethernet_network_control_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ethernet_network_control_policy.api_private_key if intersight_ethernet_network_control_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ethernet_network_control_policy.api_uri if intersight_ethernet_network_control_policy.api_uri is not none else omit }}"
        cdp_enabled: "{{ intersight_ethernet_network_control_policy.cdp_enabled if intersight_ethernet_network_control_policy.cdp_enabled is not none else omit }}"
        description: "{{ intersight_ethernet_network_control_policy.description if intersight_ethernet_network_control_policy.description is not none else omit }}"
        forge_mac: "{{ intersight_ethernet_network_control_policy.forge_mac if intersight_ethernet_network_control_policy.forge_mac is not none else omit }}"
        lldp_receive_enabled: "{{ intersight_ethernet_network_control_policy.lldp_receive_enabled if intersight_ethernet_network_control_policy.lldp_receive_enabled is not none else omit }}"
        lldp_transmit_enabled: "{{ intersight_ethernet_network_control_policy.lldp_transmit_enabled if intersight_ethernet_network_control_policy.lldp_transmit_enabled is not none else omit }}"
        mac_registration_mode: "{{ intersight_ethernet_network_control_policy.mac_registration_mode if intersight_ethernet_network_control_policy.mac_registration_mode is not none else omit }}"
        name: "{{ intersight_ethernet_network_control_policy.name if intersight_ethernet_network_control_policy.name is not none else omit }}"
        organization: "{{ intersight_ethernet_network_control_policy.organization if intersight_ethernet_network_control_policy.organization is not none else omit }}"
        state: "{{ intersight_ethernet_network_control_policy.state if intersight_ethernet_network_control_policy.state is not none else omit }}"
        tags: "{{ intersight_ethernet_network_control_policy.tags if intersight_ethernet_network_control_policy.tags is not none else omit }}"
        uplink_fail_action: "{{ intersight_ethernet_network_control_policy.uplink_fail_action if intersight_ethernet_network_control_policy.uplink_fail_action is not none else omit }}"
        use_proxy: "{{ intersight_ethernet_network_control_policy.use_proxy if intersight_ethernet_network_control_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ethernet_network_control_policy.validate_certs if intersight_ethernet_network_control_policy.validate_certs is not none else omit }}"
      register: intersight_ethernet_network_control_policy_result
      tags:
        - never
        - intersight_ethernet_network_control_policy
