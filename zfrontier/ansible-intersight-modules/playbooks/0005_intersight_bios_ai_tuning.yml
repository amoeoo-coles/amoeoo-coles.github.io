---
# Sample playbook for cisco.intersight.intersight_bios_ai_tuning (cisco.intersight 2.23.0)
# Build order: 5
# AI-optimized BIOS policy presets for Cisco Intersight
# Reads ../models/intersight_bios_ai_tuning.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_bios_ai_tuning_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0005 intersight_bios_ai_tuning"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_bios_ai_tuning.yml
  tasks:
    - name: Run intersight_bios_ai_tuning from its model
      cisco.intersight.intersight_bios_ai_tuning:
        api_bearer_token: "{{ intersight_bios_ai_tuning.api_bearer_token if intersight_bios_ai_tuning.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_bios_ai_tuning.api_key_id if intersight_bios_ai_tuning.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_bios_ai_tuning.api_private_key if intersight_bios_ai_tuning.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_bios_ai_tuning.api_uri if intersight_bios_ai_tuning.api_uri is not none else omit }}"
        cpu_energy_performance: "{{ intersight_bios_ai_tuning.cpu_energy_performance if intersight_bios_ai_tuning.cpu_energy_performance is not none else omit }}"
        cpu_performance: "{{ intersight_bios_ai_tuning.cpu_performance if intersight_bios_ai_tuning.cpu_performance is not none else omit }}"
        cpu_power_management: "{{ intersight_bios_ai_tuning.cpu_power_management if intersight_bios_ai_tuning.cpu_power_management is not none else omit }}"
        description: "{{ intersight_bios_ai_tuning.description if intersight_bios_ai_tuning.description is not none else omit }}"
        gpu_count: "{{ intersight_bios_ai_tuning.gpu_count if intersight_bios_ai_tuning.gpu_count is not none else omit }}"
        intel_turbo_boost_tech: "{{ intersight_bios_ai_tuning.intel_turbo_boost_tech if intersight_bios_ai_tuning.intel_turbo_boost_tech is not none else omit }}"
        name: "{{ intersight_bios_ai_tuning.name if intersight_bios_ai_tuning.name is not none else omit }}"
        numa_optimized: "{{ intersight_bios_ai_tuning.numa_optimized if intersight_bios_ai_tuning.numa_optimized is not none else omit }}"
        organization: "{{ intersight_bios_ai_tuning.organization if intersight_bios_ai_tuning.organization is not none else omit }}"
        sriov: "{{ intersight_bios_ai_tuning.sriov if intersight_bios_ai_tuning.sriov is not none else omit }}"
        state: "{{ intersight_bios_ai_tuning.state if intersight_bios_ai_tuning.state is not none else omit }}"
        tags: "{{ intersight_bios_ai_tuning.tags if intersight_bios_ai_tuning.tags is not none else omit }}"
        tuning_profile: "{{ intersight_bios_ai_tuning.tuning_profile if intersight_bios_ai_tuning.tuning_profile is not none else omit }}"
        use_proxy: "{{ intersight_bios_ai_tuning.use_proxy if intersight_bios_ai_tuning.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_bios_ai_tuning.validate_certs if intersight_bios_ai_tuning.validate_certs is not none else omit }}"
      register: intersight_bios_ai_tuning_result
      tags:
        - never
        - intersight_bios_ai_tuning
