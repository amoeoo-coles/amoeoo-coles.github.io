---
# Sample playbook for cisco.intersight.intersight_multicast_policy (cisco.intersight 2.23.0)
# Build order: 80
# Multicast Policy configuration for Cisco Intersight
# Reads ../models/intersight_multicast_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_multicast_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0080 intersight_multicast_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_multicast_policy.yml
  tasks:
    - name: Run intersight_multicast_policy from its model
      cisco.intersight.intersight_multicast_policy:
        api_bearer_token: "{{ intersight_multicast_policy.api_bearer_token if intersight_multicast_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_multicast_policy.api_key_id if intersight_multicast_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_multicast_policy.api_private_key if intersight_multicast_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_multicast_policy.api_uri if intersight_multicast_policy.api_uri is not none else omit }}"
        description: "{{ intersight_multicast_policy.description if intersight_multicast_policy.description is not none else omit }}"
        name: "{{ intersight_multicast_policy.name if intersight_multicast_policy.name is not none else omit }}"
        organization: "{{ intersight_multicast_policy.organization if intersight_multicast_policy.organization is not none else omit }}"
        querier_ip_address: "{{ intersight_multicast_policy.querier_ip_address if intersight_multicast_policy.querier_ip_address is not none else omit }}"
        querier_ip_address_peer: "{{ intersight_multicast_policy.querier_ip_address_peer if intersight_multicast_policy.querier_ip_address_peer is not none else omit }}"
        querier_state: "{{ intersight_multicast_policy.querier_state if intersight_multicast_policy.querier_state is not none else omit }}"
        snooping_state: "{{ intersight_multicast_policy.snooping_state if intersight_multicast_policy.snooping_state is not none else omit }}"
        src_ip_proxy: "{{ intersight_multicast_policy.src_ip_proxy if intersight_multicast_policy.src_ip_proxy is not none else omit }}"
        state: "{{ intersight_multicast_policy.state if intersight_multicast_policy.state is not none else omit }}"
        tags: "{{ (intersight_multicast_policy.tags | cat_strip_nulls) if (intersight_multicast_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_multicast_policy.use_proxy if intersight_multicast_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_multicast_policy.validate_certs if intersight_multicast_policy.validate_certs is not none else omit }}"
      register: intersight_multicast_policy_result
      tags:
        - never
        - intersight_multicast_policy
