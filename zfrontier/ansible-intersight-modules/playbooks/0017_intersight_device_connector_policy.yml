---
# Sample playbook for cisco.intersight.intersight_device_connector_policy (cisco.intersight 2.23.0)
# Build order: 17
# Device Connector Policy configuration for Cisco Intersight
# Reads ../models/intersight_device_connector_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_device_connector_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0017 intersight_device_connector_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_device_connector_policy.yml
  tasks:
    - name: Run intersight_device_connector_policy from its model
      cisco.intersight.intersight_device_connector_policy:
        api_bearer_token: "{{ intersight_device_connector_policy.api_bearer_token if intersight_device_connector_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_device_connector_policy.api_key_id if intersight_device_connector_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_device_connector_policy.api_private_key if intersight_device_connector_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_device_connector_policy.api_uri if intersight_device_connector_policy.api_uri is not none else omit }}"
        description: "{{ intersight_device_connector_policy.description if intersight_device_connector_policy.description is not none else omit }}"
        enable_lockout: "{{ intersight_device_connector_policy.enable_lockout if intersight_device_connector_policy.enable_lockout is not none else omit }}"
        name: "{{ intersight_device_connector_policy.name if intersight_device_connector_policy.name is not none else omit }}"
        organization: "{{ intersight_device_connector_policy.organization if intersight_device_connector_policy.organization is not none else omit }}"
        state: "{{ intersight_device_connector_policy.state if intersight_device_connector_policy.state is not none else omit }}"
        tags: "{{ (intersight_device_connector_policy.tags | cat_strip_nulls) if (intersight_device_connector_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_device_connector_policy.use_proxy if intersight_device_connector_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_device_connector_policy.validate_certs if intersight_device_connector_policy.validate_certs is not none else omit }}"
      register: intersight_device_connector_policy_result
      tags:
        - never
        - intersight_device_connector_policy
