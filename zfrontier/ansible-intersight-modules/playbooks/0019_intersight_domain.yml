---
# Sample playbook for cisco.intersight.intersight_domain (cisco.intersight 2.23.0)
# Build order: 19
# Manage UCS Domain Profiles in Cisco Intersight
# Reads ../models/intersight_domain.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_domain_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0019 intersight_domain"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_domain.yml
  tasks:
    - name: Run intersight_domain from its model
      cisco.intersight.intersight_domain:
        action: "{{ intersight_domain.action if intersight_domain.action is not none else omit }}"
        action_poll_interval: "{{ intersight_domain.action_poll_interval if intersight_domain.action_poll_interval is not none else omit }}"
        action_timeout: "{{ intersight_domain.action_timeout if intersight_domain.action_timeout is not none else omit }}"
        api_bearer_token: "{{ intersight_domain.api_bearer_token if intersight_domain.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_domain.api_key_id if intersight_domain.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_domain.api_private_key if intersight_domain.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_domain.api_uri if intersight_domain.api_uri is not none else omit }}"
        assigned_switch_a_serial: "{{ intersight_domain.assigned_switch_a_serial if intersight_domain.assigned_switch_a_serial is not none else omit }}"
        assigned_switch_b_serial: "{{ intersight_domain.assigned_switch_b_serial if intersight_domain.assigned_switch_b_serial is not none else omit }}"
        auditd_policy: "{{ intersight_domain.auditd_policy if intersight_domain.auditd_policy is not none else omit }}"
        certificate_management_policy: "{{ intersight_domain.certificate_management_policy if intersight_domain.certificate_management_policy is not none else omit }}"
        description: "{{ intersight_domain.description if intersight_domain.description is not none else omit }}"
        ldap_policy: "{{ intersight_domain.ldap_policy if intersight_domain.ldap_policy is not none else omit }}"
        name: "{{ intersight_domain.name if intersight_domain.name is not none else omit }}"
        network_connectivity_policy: "{{ intersight_domain.network_connectivity_policy if intersight_domain.network_connectivity_policy is not none else omit }}"
        ntp_policy: "{{ intersight_domain.ntp_policy if intersight_domain.ntp_policy is not none else omit }}"
        organization: "{{ intersight_domain.organization if intersight_domain.organization is not none else omit }}"
        port_policy_fi_a: "{{ intersight_domain.port_policy_fi_a if intersight_domain.port_policy_fi_a is not none else omit }}"
        port_policy_fi_b: "{{ intersight_domain.port_policy_fi_b if intersight_domain.port_policy_fi_b is not none else omit }}"
        snmp_policy: "{{ intersight_domain.snmp_policy if intersight_domain.snmp_policy is not none else omit }}"
        state: "{{ intersight_domain.state if intersight_domain.state is not none else omit }}"
        switch_control_policy: "{{ intersight_domain.switch_control_policy if intersight_domain.switch_control_policy is not none else omit }}"
        syslog_policy: "{{ intersight_domain.syslog_policy if intersight_domain.syslog_policy is not none else omit }}"
        system_qos_policy: "{{ intersight_domain.system_qos_policy if intersight_domain.system_qos_policy is not none else omit }}"
        tags: "{{ intersight_domain.tags if intersight_domain.tags is not none else omit }}"
        use_proxy: "{{ intersight_domain.use_proxy if intersight_domain.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_domain.validate_certs if intersight_domain.validate_certs is not none else omit }}"
        vlan_policy_fi_a: "{{ intersight_domain.vlan_policy_fi_a if intersight_domain.vlan_policy_fi_a is not none else omit }}"
        vlan_policy_fi_b: "{{ intersight_domain.vlan_policy_fi_b if intersight_domain.vlan_policy_fi_b is not none else omit }}"
        vsan_policy_fi_a: "{{ intersight_domain.vsan_policy_fi_a if intersight_domain.vsan_policy_fi_a is not none else omit }}"
        vsan_policy_fi_b: "{{ intersight_domain.vsan_policy_fi_b if intersight_domain.vsan_policy_fi_b is not none else omit }}"
        wait_for_action: "{{ intersight_domain.wait_for_action if intersight_domain.wait_for_action is not none else omit }}"
      register: intersight_domain_result
      tags:
        - never
        - intersight_domain
