---
# Sample playbook for cisco.intersight.intersight_switch_control_policy (cisco.intersight 2.23.0)
# Build order: 113
# Switch Control Policy configuration for Cisco Intersight
# Reads ../models/intersight_switch_control_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_switch_control_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0113 intersight_switch_control_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_switch_control_policy.yml
  tasks:
    - name: Run intersight_switch_control_policy from its model
      cisco.intersight.intersight_switch_control_policy:
        api_bearer_token: "{{ intersight_switch_control_policy.api_bearer_token if intersight_switch_control_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_switch_control_policy.api_key_id if intersight_switch_control_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_switch_control_policy.api_private_key if intersight_switch_control_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_switch_control_policy.api_uri if intersight_switch_control_policy.api_uri is not none else omit }}"
        description: "{{ intersight_switch_control_policy.description if intersight_switch_control_policy.description is not none else omit }}"
        ethernet_switching_mode: "{{ intersight_switch_control_policy.ethernet_switching_mode if intersight_switch_control_policy.ethernet_switching_mode is not none else omit }}"
        fabric_pc_vhba_reset: "{{ intersight_switch_control_policy.fabric_pc_vhba_reset if intersight_switch_control_policy.fabric_pc_vhba_reset is not none else omit }}"
        fc_switching_mode: "{{ intersight_switch_control_policy.fc_switching_mode if intersight_switch_control_policy.fc_switching_mode is not none else omit }}"
        mac_aging_option: "{{ intersight_switch_control_policy.mac_aging_option if intersight_switch_control_policy.mac_aging_option is not none else omit }}"
        mac_aging_time: "{{ intersight_switch_control_policy.mac_aging_time if intersight_switch_control_policy.mac_aging_time is not none else omit }}"
        message_interval: "{{ intersight_switch_control_policy.message_interval if intersight_switch_control_policy.message_interval is not none else omit }}"
        name: "{{ intersight_switch_control_policy.name if intersight_switch_control_policy.name is not none else omit }}"
        organization: "{{ intersight_switch_control_policy.organization if intersight_switch_control_policy.organization is not none else omit }}"
        primary_key: "{{ intersight_switch_control_policy.primary_key if intersight_switch_control_policy.primary_key is not none else omit }}"
        recovery_action: "{{ intersight_switch_control_policy.recovery_action if intersight_switch_control_policy.recovery_action is not none else omit }}"
        reserved_vlan_start_id: "{{ intersight_switch_control_policy.reserved_vlan_start_id if intersight_switch_control_policy.reserved_vlan_start_id is not none else omit }}"
        state: "{{ intersight_switch_control_policy.state if intersight_switch_control_policy.state is not none else omit }}"
        tags: "{{ (intersight_switch_control_policy.tags | cat_strip_nulls) if (intersight_switch_control_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_switch_control_policy.use_proxy if intersight_switch_control_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_switch_control_policy.validate_certs if intersight_switch_control_policy.validate_certs is not none else omit }}"
        vlan_port_optimization_enabled: "{{ intersight_switch_control_policy.vlan_port_optimization_enabled if intersight_switch_control_policy.vlan_port_optimization_enabled is not none else omit }}"
      register: intersight_switch_control_policy_result
      tags:
        - never
        - intersight_switch_control_policy
