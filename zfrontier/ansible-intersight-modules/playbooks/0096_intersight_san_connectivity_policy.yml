---
# Sample playbook for cisco.intersight.intersight_san_connectivity_policy (cisco.intersight 2.23.0)
# Build order: 96
# Manage SAN Connectivity Policies and vHBAs for Cisco Intersight
# Reads ../models/intersight_san_connectivity_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_san_connectivity_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0096 intersight_san_connectivity_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_san_connectivity_policy.yml
  tasks:
    - name: Run intersight_san_connectivity_policy from its model
      cisco.intersight.intersight_san_connectivity_policy:
        api_bearer_token: "{{ intersight_san_connectivity_policy.api_bearer_token if intersight_san_connectivity_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_san_connectivity_policy.api_key_id if intersight_san_connectivity_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_san_connectivity_policy.api_private_key if intersight_san_connectivity_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_san_connectivity_policy.api_uri if intersight_san_connectivity_policy.api_uri is not none else omit }}"
        description: "{{ intersight_san_connectivity_policy.description if intersight_san_connectivity_policy.description is not none else omit }}"
        name: "{{ intersight_san_connectivity_policy.name if intersight_san_connectivity_policy.name is not none else omit }}"
        organization: "{{ intersight_san_connectivity_policy.organization if intersight_san_connectivity_policy.organization is not none else omit }}"
        placement_mode: "{{ intersight_san_connectivity_policy.placement_mode if intersight_san_connectivity_policy.placement_mode is not none else omit }}"
        state: "{{ intersight_san_connectivity_policy.state if intersight_san_connectivity_policy.state is not none else omit }}"
        static_wwnn_address: "{{ intersight_san_connectivity_policy.static_wwnn_address if intersight_san_connectivity_policy.static_wwnn_address is not none else omit }}"
        tags: "{{ (intersight_san_connectivity_policy.tags | cat_strip_nulls) if (intersight_san_connectivity_policy.tags | cat_strip_nulls) is not none else omit }}"
        target_platform: "{{ intersight_san_connectivity_policy.target_platform if intersight_san_connectivity_policy.target_platform is not none else omit }}"
        use_proxy: "{{ intersight_san_connectivity_policy.use_proxy if intersight_san_connectivity_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_san_connectivity_policy.validate_certs if intersight_san_connectivity_policy.validate_certs is not none else omit }}"
        vhbas: "{{ (intersight_san_connectivity_policy.vhbas | cat_strip_nulls) if (intersight_san_connectivity_policy.vhbas | cat_strip_nulls) is not none else omit }}"
        wwnn_address_type: "{{ intersight_san_connectivity_policy.wwnn_address_type if intersight_san_connectivity_policy.wwnn_address_type is not none else omit }}"
        wwnn_pool: "{{ intersight_san_connectivity_policy.wwnn_pool if intersight_san_connectivity_policy.wwnn_pool is not none else omit }}"
      register: intersight_san_connectivity_policy_result
      tags:
        - never
        - intersight_san_connectivity_policy
