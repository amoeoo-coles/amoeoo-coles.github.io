---
# Sample playbook for cisco.intersight.intersight_syslog_policy (cisco.intersight 2.23.0)
# Build order: 115
# Syslog Policy configuration for Cisco Intersight
# Reads ../models/intersight_syslog_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_syslog_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0115 intersight_syslog_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_syslog_policy.yml
  tasks:
    - name: Run intersight_syslog_policy from its model
      cisco.intersight.intersight_syslog_policy:
        api_bearer_token: "{{ intersight_syslog_policy.api_bearer_token if intersight_syslog_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_syslog_policy.api_key_id if intersight_syslog_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_syslog_policy.api_private_key if intersight_syslog_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_syslog_policy.api_uri if intersight_syslog_policy.api_uri is not none else omit }}"
        description: "{{ intersight_syslog_policy.description if intersight_syslog_policy.description is not none else omit }}"
        first_remote_logging_enabled: "{{ intersight_syslog_policy.first_remote_logging_enabled if intersight_syslog_policy.first_remote_logging_enabled is not none else omit }}"
        first_remote_logging_hostname: "{{ intersight_syslog_policy.first_remote_logging_hostname if intersight_syslog_policy.first_remote_logging_hostname is not none else omit }}"
        first_remote_logging_minimum_severity: "{{ intersight_syslog_policy.first_remote_logging_minimum_severity if intersight_syslog_policy.first_remote_logging_minimum_severity is not none else omit }}"
        first_remote_logging_port: "{{ intersight_syslog_policy.first_remote_logging_port if intersight_syslog_policy.first_remote_logging_port is not none else omit }}"
        first_remote_logging_protocol: "{{ intersight_syslog_policy.first_remote_logging_protocol if intersight_syslog_policy.first_remote_logging_protocol is not none else omit }}"
        local_logging_minimum_severity: "{{ intersight_syslog_policy.local_logging_minimum_severity if intersight_syslog_policy.local_logging_minimum_severity is not none else omit }}"
        name: "{{ intersight_syslog_policy.name if intersight_syslog_policy.name is not none else omit }}"
        organization: "{{ intersight_syslog_policy.organization if intersight_syslog_policy.organization is not none else omit }}"
        second_remote_logging_enabled: "{{ intersight_syslog_policy.second_remote_logging_enabled if intersight_syslog_policy.second_remote_logging_enabled is not none else omit }}"
        second_remote_logging_hostname: "{{ intersight_syslog_policy.second_remote_logging_hostname if intersight_syslog_policy.second_remote_logging_hostname is not none else omit }}"
        second_remote_logging_minimum_severity: "{{ intersight_syslog_policy.second_remote_logging_minimum_severity if intersight_syslog_policy.second_remote_logging_minimum_severity is not none else omit }}"
        second_remote_logging_port: "{{ intersight_syslog_policy.second_remote_logging_port if intersight_syslog_policy.second_remote_logging_port is not none else omit }}"
        second_remote_logging_protocol: "{{ intersight_syslog_policy.second_remote_logging_protocol if intersight_syslog_policy.second_remote_logging_protocol is not none else omit }}"
        state: "{{ intersight_syslog_policy.state if intersight_syslog_policy.state is not none else omit }}"
        tags: "{{ (intersight_syslog_policy.tags | cat_strip_nulls) if (intersight_syslog_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_syslog_policy.use_proxy if intersight_syslog_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_syslog_policy.validate_certs if intersight_syslog_policy.validate_certs is not none else omit }}"
      register: intersight_syslog_policy_result
      tags:
        - never
        - intersight_syslog_policy
