---
# Sample playbook for cisco.intersight.intersight_storage_policy (cisco.intersight 2.23.0)
# Build order: 111
# Storage Policy configuration for Cisco Intersight
# Reads ../models/intersight_storage_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_storage_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0111 intersight_storage_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_storage_policy.yml
  tasks:
    - name: Run intersight_storage_policy from its model
      cisco.intersight.intersight_storage_policy:
        api_bearer_token: "{{ intersight_storage_policy.api_bearer_token if intersight_storage_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_storage_policy.api_key_id if intersight_storage_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_storage_policy.api_private_key if intersight_storage_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_storage_policy.api_uri if intersight_storage_policy.api_uri is not none else omit }}"
        controller_attached_nvme_slots: "{{ intersight_storage_policy.controller_attached_nvme_slots if intersight_storage_policy.controller_attached_nvme_slots is not none else omit }}"
        default_drive_mode: "{{ intersight_storage_policy.default_drive_mode if intersight_storage_policy.default_drive_mode is not none else omit }}"
        description: "{{ intersight_storage_policy.description if intersight_storage_policy.description is not none else omit }}"
        direct_attached_nvme_slots: "{{ intersight_storage_policy.direct_attached_nvme_slots if intersight_storage_policy.direct_attached_nvme_slots is not none else omit }}"
        drive_groups: "{{ intersight_storage_policy.drive_groups if intersight_storage_policy.drive_groups is not none else omit }}"
        m2_virtual_drive_config: "{{ (intersight_storage_policy.m2_virtual_drive_config | cat_strip_nulls) if (intersight_storage_policy.m2_virtual_drive_config | cat_strip_nulls) is not none else omit }}"
        name: "{{ intersight_storage_policy.name if intersight_storage_policy.name is not none else omit }}"
        organization: "{{ intersight_storage_policy.organization if intersight_storage_policy.organization is not none else omit }}"
        raid0_drive_config: "{{ (intersight_storage_policy.raid0_drive_config | cat_strip_nulls) if (intersight_storage_policy.raid0_drive_config | cat_strip_nulls) is not none else omit }}"
        secure_jbods: "{{ intersight_storage_policy.secure_jbods if intersight_storage_policy.secure_jbods is not none else omit }}"
        state: "{{ intersight_storage_policy.state if intersight_storage_policy.state is not none else omit }}"
        tags: "{{ (intersight_storage_policy.tags | cat_strip_nulls) if (intersight_storage_policy.tags | cat_strip_nulls) is not none else omit }}"
        unused_disks_state: "{{ intersight_storage_policy.unused_disks_state if intersight_storage_policy.unused_disks_state is not none else omit }}"
        use_jbod_for_vd_creation: "{{ intersight_storage_policy.use_jbod_for_vd_creation if intersight_storage_policy.use_jbod_for_vd_creation is not none else omit }}"
        use_proxy: "{{ intersight_storage_policy.use_proxy if intersight_storage_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_storage_policy.validate_certs if intersight_storage_policy.validate_certs is not none else omit }}"
      register: intersight_storage_policy_result
      tags:
        - never
        - intersight_storage_policy
