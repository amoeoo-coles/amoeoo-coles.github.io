---
# Sample playbook for cisco.intersight.intersight_imc_access_policy (cisco.intersight 2.23.0)
# Build order: 45
# IMC Access Policy configuration for Cisco Intersight
# Reads ../models/intersight_imc_access_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_imc_access_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0045 intersight_imc_access_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_imc_access_policy.yml
  tasks:
    - name: Run intersight_imc_access_policy from its model
      cisco.intersight.intersight_imc_access_policy:
        api_bearer_token: "{{ intersight_imc_access_policy.api_bearer_token if intersight_imc_access_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_imc_access_policy.api_key_id if intersight_imc_access_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_imc_access_policy.api_private_key if intersight_imc_access_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_imc_access_policy.api_uri if intersight_imc_access_policy.api_uri is not none else omit }}"
        description: "{{ intersight_imc_access_policy.description if intersight_imc_access_policy.description is not none else omit }}"
        ip_pool: "{{ intersight_imc_access_policy.ip_pool if intersight_imc_access_policy.ip_pool is not none else omit }}"
        name: "{{ intersight_imc_access_policy.name if intersight_imc_access_policy.name is not none else omit }}"
        organization: "{{ intersight_imc_access_policy.organization if intersight_imc_access_policy.organization is not none else omit }}"
        out_of_band: "{{ intersight_imc_access_policy.out_of_band if intersight_imc_access_policy.out_of_band is not none else omit }}"
        state: "{{ intersight_imc_access_policy.state if intersight_imc_access_policy.state is not none else omit }}"
        tags: "{{ (intersight_imc_access_policy.tags | cat_strip_nulls) if (intersight_imc_access_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_imc_access_policy.use_proxy if intersight_imc_access_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_imc_access_policy.validate_certs if intersight_imc_access_policy.validate_certs is not none else omit }}"
        vlan_id: "{{ intersight_imc_access_policy.vlan_id if intersight_imc_access_policy.vlan_id is not none else omit }}"
      register: intersight_imc_access_policy_result
      tags:
        - never
        - intersight_imc_access_policy
