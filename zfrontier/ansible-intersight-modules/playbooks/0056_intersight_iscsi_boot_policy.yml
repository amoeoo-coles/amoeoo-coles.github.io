---
# Sample playbook for cisco.intersight.intersight_iscsi_boot_policy (cisco.intersight 2.23.0)
# Build order: 56
# Manage iSCSI Boot Policies for Cisco Intersight
# Reads ../models/intersight_iscsi_boot_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_iscsi_boot_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0056 intersight_iscsi_boot_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_iscsi_boot_policy.yml
  tasks:
    - name: Run intersight_iscsi_boot_policy from its model
      cisco.intersight.intersight_iscsi_boot_policy:
        api_bearer_token: "{{ intersight_iscsi_boot_policy.api_bearer_token if intersight_iscsi_boot_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_iscsi_boot_policy.api_key_id if intersight_iscsi_boot_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_iscsi_boot_policy.api_private_key if intersight_iscsi_boot_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_iscsi_boot_policy.api_uri if intersight_iscsi_boot_policy.api_uri is not none else omit }}"
        auto_targetvendor_name: "{{ intersight_iscsi_boot_policy.auto_targetvendor_name if intersight_iscsi_boot_policy.auto_targetvendor_name is not none else omit }}"
        chap: "{{ intersight_iscsi_boot_policy.chap if intersight_iscsi_boot_policy.chap is not none else omit }}"
        description: "{{ intersight_iscsi_boot_policy.description if intersight_iscsi_boot_policy.description is not none else omit }}"
        initiator_ip_pool_name: "{{ intersight_iscsi_boot_policy.initiator_ip_pool_name if intersight_iscsi_boot_policy.initiator_ip_pool_name is not none else omit }}"
        initiator_ip_source: "{{ intersight_iscsi_boot_policy.initiator_ip_source if intersight_iscsi_boot_policy.initiator_ip_source is not none else omit }}"
        initiator_static_ipv4_address: "{{ intersight_iscsi_boot_policy.initiator_static_ipv4_address if intersight_iscsi_boot_policy.initiator_static_ipv4_address is not none else omit }}"
        initiator_static_ipv4_gateway: "{{ intersight_iscsi_boot_policy.initiator_static_ipv4_gateway if intersight_iscsi_boot_policy.initiator_static_ipv4_gateway is not none else omit }}"
        initiator_static_ipv4_netmask: "{{ intersight_iscsi_boot_policy.initiator_static_ipv4_netmask if intersight_iscsi_boot_policy.initiator_static_ipv4_netmask is not none else omit }}"
        initiator_static_ipv4_primary_dns: "{{ intersight_iscsi_boot_policy.initiator_static_ipv4_primary_dns if intersight_iscsi_boot_policy.initiator_static_ipv4_primary_dns is not none else omit }}"
        initiator_static_ipv4_secondary_dns: "{{ intersight_iscsi_boot_policy.initiator_static_ipv4_secondary_dns if intersight_iscsi_boot_policy.initiator_static_ipv4_secondary_dns is not none else omit }}"
        initiator_static_ipv6_address: "{{ intersight_iscsi_boot_policy.initiator_static_ipv6_address if intersight_iscsi_boot_policy.initiator_static_ipv6_address is not none else omit }}"
        initiator_static_ipv6_gateway: "{{ intersight_iscsi_boot_policy.initiator_static_ipv6_gateway if intersight_iscsi_boot_policy.initiator_static_ipv6_gateway is not none else omit }}"
        initiator_static_ipv6_prefix: "{{ intersight_iscsi_boot_policy.initiator_static_ipv6_prefix if intersight_iscsi_boot_policy.initiator_static_ipv6_prefix is not none else omit }}"
        iscsi_adapter_policy_name: "{{ intersight_iscsi_boot_policy.iscsi_adapter_policy_name if intersight_iscsi_boot_policy.iscsi_adapter_policy_name is not none else omit }}"
        iscsi_ip_type: "{{ intersight_iscsi_boot_policy.iscsi_ip_type if intersight_iscsi_boot_policy.iscsi_ip_type is not none else omit }}"
        mutual_chap: "{{ intersight_iscsi_boot_policy.mutual_chap if intersight_iscsi_boot_policy.mutual_chap is not none else omit }}"
        name: "{{ intersight_iscsi_boot_policy.name if intersight_iscsi_boot_policy.name is not none else omit }}"
        organization: "{{ intersight_iscsi_boot_policy.organization if intersight_iscsi_boot_policy.organization is not none else omit }}"
        primary_target_policy_name: "{{ intersight_iscsi_boot_policy.primary_target_policy_name if intersight_iscsi_boot_policy.primary_target_policy_name is not none else omit }}"
        secondary_target_policy_name: "{{ intersight_iscsi_boot_policy.secondary_target_policy_name if intersight_iscsi_boot_policy.secondary_target_policy_name is not none else omit }}"
        state: "{{ intersight_iscsi_boot_policy.state if intersight_iscsi_boot_policy.state is not none else omit }}"
        tags: "{{ intersight_iscsi_boot_policy.tags if intersight_iscsi_boot_policy.tags is not none else omit }}"
        target_source_type: "{{ intersight_iscsi_boot_policy.target_source_type if intersight_iscsi_boot_policy.target_source_type is not none else omit }}"
        use_proxy: "{{ intersight_iscsi_boot_policy.use_proxy if intersight_iscsi_boot_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_iscsi_boot_policy.validate_certs if intersight_iscsi_boot_policy.validate_certs is not none else omit }}"
      register: intersight_iscsi_boot_policy_result
      tags:
        - never
        - intersight_iscsi_boot_policy
