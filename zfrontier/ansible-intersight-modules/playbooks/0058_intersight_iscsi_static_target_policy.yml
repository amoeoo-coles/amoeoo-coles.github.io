---
# Sample playbook for cisco.intersight.intersight_iscsi_static_target_policy (cisco.intersight 2.23.0)
# Build order: 58
# Manage iSCSI Static Target Policies for Cisco Intersight
# Reads ../models/intersight_iscsi_static_target_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_iscsi_static_target_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0058 intersight_iscsi_static_target_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_iscsi_static_target_policy.yml
  tasks:
    - name: Run intersight_iscsi_static_target_policy from its model
      cisco.intersight.intersight_iscsi_static_target_policy:
        api_bearer_token: "{{ intersight_iscsi_static_target_policy.api_bearer_token if intersight_iscsi_static_target_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_iscsi_static_target_policy.api_key_id if intersight_iscsi_static_target_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_iscsi_static_target_policy.api_private_key if intersight_iscsi_static_target_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_iscsi_static_target_policy.api_uri if intersight_iscsi_static_target_policy.api_uri is not none else omit }}"
        description: "{{ intersight_iscsi_static_target_policy.description if intersight_iscsi_static_target_policy.description is not none else omit }}"
        ip_protocol: "{{ intersight_iscsi_static_target_policy.ip_protocol if intersight_iscsi_static_target_policy.ip_protocol is not none else omit }}"
        ipv4_address: "{{ intersight_iscsi_static_target_policy.ipv4_address if intersight_iscsi_static_target_policy.ipv4_address is not none else omit }}"
        ipv6_address: "{{ intersight_iscsi_static_target_policy.ipv6_address if intersight_iscsi_static_target_policy.ipv6_address is not none else omit }}"
        lun_id: "{{ intersight_iscsi_static_target_policy.lun_id if intersight_iscsi_static_target_policy.lun_id is not none else omit }}"
        name: "{{ intersight_iscsi_static_target_policy.name if intersight_iscsi_static_target_policy.name is not none else omit }}"
        organization: "{{ intersight_iscsi_static_target_policy.organization if intersight_iscsi_static_target_policy.organization is not none else omit }}"
        port: "{{ intersight_iscsi_static_target_policy.port if intersight_iscsi_static_target_policy.port is not none else omit }}"
        state: "{{ intersight_iscsi_static_target_policy.state if intersight_iscsi_static_target_policy.state is not none else omit }}"
        tags: "{{ (intersight_iscsi_static_target_policy.tags | cat_strip_nulls) if (intersight_iscsi_static_target_policy.tags | cat_strip_nulls) is not none else omit }}"
        target_name: "{{ intersight_iscsi_static_target_policy.target_name if intersight_iscsi_static_target_policy.target_name is not none else omit }}"
        use_proxy: "{{ intersight_iscsi_static_target_policy.use_proxy if intersight_iscsi_static_target_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_iscsi_static_target_policy.validate_certs if intersight_iscsi_static_target_policy.validate_certs is not none else omit }}"
      register: intersight_iscsi_static_target_policy_result
      tags:
        - never
        - intersight_iscsi_static_target_policy
