---
# Sample playbook for cisco.intersight.intersight_confidential_compute (cisco.intersight 2.23.0)
# Build order: 15
# Confidential computing BIOS policy for Cisco Intersight
# Reads ../models/intersight_confidential_compute.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_confidential_compute_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0015 intersight_confidential_compute"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_confidential_compute.yml
  tasks:
    - name: Run intersight_confidential_compute from its model
      cisco.intersight.intersight_confidential_compute:
        api_bearer_token: "{{ intersight_confidential_compute.api_bearer_token if intersight_confidential_compute.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_confidential_compute.api_key_id if intersight_confidential_compute.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_confidential_compute.api_private_key if intersight_confidential_compute.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_confidential_compute.api_uri if intersight_confidential_compute.api_uri is not none else omit }}"
        description: "{{ intersight_confidential_compute.description if intersight_confidential_compute.description is not none else omit }}"
        enable_tme: "{{ intersight_confidential_compute.enable_tme if intersight_confidential_compute.enable_tme is not none else omit }}"
        name: "{{ intersight_confidential_compute.name if intersight_confidential_compute.name is not none else omit }}"
        numa_optimized: "{{ intersight_confidential_compute.numa_optimized if intersight_confidential_compute.numa_optimized is not none else omit }}"
        organization: "{{ intersight_confidential_compute.organization if intersight_confidential_compute.organization is not none else omit }}"
        security_profile: "{{ intersight_confidential_compute.security_profile if intersight_confidential_compute.security_profile is not none else omit }}"
        sev_asid_count: "{{ intersight_confidential_compute.sev_asid_count if intersight_confidential_compute.sev_asid_count is not none else omit }}"
        sgx_epoch0: "{{ intersight_confidential_compute.sgx_epoch0 if intersight_confidential_compute.sgx_epoch0 is not none else omit }}"
        sgx_epoch1: "{{ intersight_confidential_compute.sgx_epoch1 if intersight_confidential_compute.sgx_epoch1 is not none else omit }}"
        state: "{{ intersight_confidential_compute.state if intersight_confidential_compute.state is not none else omit }}"
        tags: "{{ intersight_confidential_compute.tags if intersight_confidential_compute.tags is not none else omit }}"
        use_proxy: "{{ intersight_confidential_compute.use_proxy if intersight_confidential_compute.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_confidential_compute.validate_certs if intersight_confidential_compute.validate_certs is not none else omit }}"
      register: intersight_confidential_compute_result
      tags:
        - never
        - intersight_confidential_compute
