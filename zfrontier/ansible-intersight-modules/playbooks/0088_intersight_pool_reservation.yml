---
# Sample playbook for cisco.intersight.intersight_pool_reservation (cisco.intersight 2.23.0)
# Build order: 88
# Manage pool identifier reservations in Cisco Intersight
# Reads ../models/intersight_pool_reservation.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_pool_reservation_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0088 intersight_pool_reservation"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_pool_reservation.yml
  tasks:
    - name: Run intersight_pool_reservation from its model
      cisco.intersight.intersight_pool_reservation:
        allocation_type: "{{ intersight_pool_reservation.allocation_type if intersight_pool_reservation.allocation_type is not none else omit }}"
        api_bearer_token: "{{ intersight_pool_reservation.api_bearer_token if intersight_pool_reservation.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_pool_reservation.api_key_id if intersight_pool_reservation.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_pool_reservation.api_private_key if intersight_pool_reservation.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_pool_reservation.api_uri if intersight_pool_reservation.api_uri is not none else omit }}"
        identity: "{{ intersight_pool_reservation.identity if intersight_pool_reservation.identity is not none else omit }}"
        organization: "{{ intersight_pool_reservation.organization if intersight_pool_reservation.organization is not none else omit }}"
        pool_name: "{{ intersight_pool_reservation.pool_name if intersight_pool_reservation.pool_name is not none else omit }}"
        pool_type: "{{ intersight_pool_reservation.pool_type if intersight_pool_reservation.pool_type is not none else omit }}"
        state: "{{ intersight_pool_reservation.state if intersight_pool_reservation.state is not none else omit }}"
        use_proxy: "{{ intersight_pool_reservation.use_proxy if intersight_pool_reservation.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_pool_reservation.validate_certs if intersight_pool_reservation.validate_certs is not none else omit }}"
      register: intersight_pool_reservation_result
      tags:
        - never
        - intersight_pool_reservation
