---
# Sample playbook for cisco.intersight.intersight_wwn_pool (cisco.intersight 2.23.0)
# Build order: 136
# WWNN/WWPN Pool configuration for Cisco Intersight
# Reads ../models/intersight_wwn_pool.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_wwn_pool_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0136 intersight_wwn_pool"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_wwn_pool.yml
  tasks:
    - name: Run intersight_wwn_pool from its model
      cisco.intersight.intersight_wwn_pool:
        api_bearer_token: "{{ intersight_wwn_pool.api_bearer_token if intersight_wwn_pool.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_wwn_pool.api_key_id if intersight_wwn_pool.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_wwn_pool.api_private_key if intersight_wwn_pool.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_wwn_pool.api_uri if intersight_wwn_pool.api_uri is not none else omit }}"
        assignment_order: "{{ intersight_wwn_pool.assignment_order if intersight_wwn_pool.assignment_order is not none else omit }}"
        description: "{{ intersight_wwn_pool.description if intersight_wwn_pool.description is not none else omit }}"
        id_blocks: "{{ (intersight_wwn_pool.id_blocks | cat_strip_nulls) if (intersight_wwn_pool.id_blocks | cat_strip_nulls) is not none else omit }}"
        name: "{{ intersight_wwn_pool.name if intersight_wwn_pool.name is not none else omit }}"
        organization: "{{ intersight_wwn_pool.organization if intersight_wwn_pool.organization is not none else omit }}"
        pool_purpose: "{{ intersight_wwn_pool.pool_purpose if intersight_wwn_pool.pool_purpose is not none else omit }}"
        state: "{{ intersight_wwn_pool.state if intersight_wwn_pool.state is not none else omit }}"
        tags: "{{ (intersight_wwn_pool.tags | cat_strip_nulls) if (intersight_wwn_pool.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_wwn_pool.use_proxy if intersight_wwn_pool.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_wwn_pool.validate_certs if intersight_wwn_pool.validate_certs is not none else omit }}"
      register: intersight_wwn_pool_result
      tags:
        - never
        - intersight_wwn_pool
