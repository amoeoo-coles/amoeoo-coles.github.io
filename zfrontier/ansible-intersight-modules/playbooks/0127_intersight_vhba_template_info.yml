---
# Sample playbook for cisco.intersight.intersight_vhba_template_info (cisco.intersight 2.23.0)
# Build order: 127
# Gather information about vHBA Templates in Cisco Intersight
# Reads ../models/intersight_vhba_template_info.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vhba_template_info_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0127 intersight_vhba_template_info"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_vhba_template_info.yml
  tasks:
    - name: Run intersight_vhba_template_info from its model
      cisco.intersight.intersight_vhba_template_info:
        api_bearer_token: "{{ intersight_vhba_template_info.api_bearer_token if intersight_vhba_template_info.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_vhba_template_info.api_key_id if intersight_vhba_template_info.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_vhba_template_info.api_private_key if intersight_vhba_template_info.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_vhba_template_info.api_uri if intersight_vhba_template_info.api_uri is not none else omit }}"
        name: "{{ intersight_vhba_template_info.name if intersight_vhba_template_info.name is not none else omit }}"
        organization: "{{ intersight_vhba_template_info.organization if intersight_vhba_template_info.organization is not none else omit }}"
        use_proxy: "{{ intersight_vhba_template_info.use_proxy if intersight_vhba_template_info.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_vhba_template_info.validate_certs if intersight_vhba_template_info.validate_certs is not none else omit }}"
      register: intersight_vhba_template_info_result
