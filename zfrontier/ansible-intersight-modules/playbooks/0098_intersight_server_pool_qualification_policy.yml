---
# Sample playbook for cisco.intersight.intersight_server_pool_qualification_policy (cisco.intersight 2.23.0)
# Build order: 98
# Server Pool Qualification Policy configuration for Cisco Intersight
# Reads ../models/intersight_server_pool_qualification_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_server_pool_qualification_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0098 intersight_server_pool_qualification_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_server_pool_qualification_policy.yml
  tasks:
    - name: Run intersight_server_pool_qualification_policy from its model
      cisco.intersight.intersight_server_pool_qualification_policy:
        api_bearer_token: "{{ intersight_server_pool_qualification_policy.api_bearer_token if intersight_server_pool_qualification_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_server_pool_qualification_policy.api_key_id if intersight_server_pool_qualification_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_server_pool_qualification_policy.api_private_key if intersight_server_pool_qualification_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_server_pool_qualification_policy.api_uri if intersight_server_pool_qualification_policy.api_uri is not none else omit }}"
        blade_qualifier: "{{ intersight_server_pool_qualification_policy.blade_qualifier if intersight_server_pool_qualification_policy.blade_qualifier is not none else omit }}"
        description: "{{ intersight_server_pool_qualification_policy.description if intersight_server_pool_qualification_policy.description is not none else omit }}"
        domain_qualifier: "{{ intersight_server_pool_qualification_policy.domain_qualifier if intersight_server_pool_qualification_policy.domain_qualifier is not none else omit }}"
        gpu_qualifier: "{{ intersight_server_pool_qualification_policy.gpu_qualifier if intersight_server_pool_qualification_policy.gpu_qualifier is not none else omit }}"
        memory_qualifier: "{{ intersight_server_pool_qualification_policy.memory_qualifier if intersight_server_pool_qualification_policy.memory_qualifier is not none else omit }}"
        name: "{{ intersight_server_pool_qualification_policy.name if intersight_server_pool_qualification_policy.name is not none else omit }}"
        network_adaptor_qualifier: "{{ intersight_server_pool_qualification_policy.network_adaptor_qualifier if intersight_server_pool_qualification_policy.network_adaptor_qualifier is not none else omit }}"
        organization: "{{ intersight_server_pool_qualification_policy.organization if intersight_server_pool_qualification_policy.organization is not none else omit }}"
        processor_qualifier: "{{ intersight_server_pool_qualification_policy.processor_qualifier if intersight_server_pool_qualification_policy.processor_qualifier is not none else omit }}"
        rack_server_qualifier: "{{ intersight_server_pool_qualification_policy.rack_server_qualifier if intersight_server_pool_qualification_policy.rack_server_qualifier is not none else omit }}"
        state: "{{ intersight_server_pool_qualification_policy.state if intersight_server_pool_qualification_policy.state is not none else omit }}"
        tag_qualifier: "{{ intersight_server_pool_qualification_policy.tag_qualifier if intersight_server_pool_qualification_policy.tag_qualifier is not none else omit }}"
        tags: "{{ intersight_server_pool_qualification_policy.tags if intersight_server_pool_qualification_policy.tags is not none else omit }}"
        use_proxy: "{{ intersight_server_pool_qualification_policy.use_proxy if intersight_server_pool_qualification_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_server_pool_qualification_policy.validate_certs if intersight_server_pool_qualification_policy.validate_certs is not none else omit }}"
      register: intersight_server_pool_qualification_policy_result
      tags:
        - never
        - intersight_server_pool_qualification_policy
