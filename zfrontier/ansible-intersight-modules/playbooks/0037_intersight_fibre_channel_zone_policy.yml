---
# Sample playbook for cisco.intersight.intersight_fibre_channel_zone_policy (cisco.intersight 2.23.0)
# Build order: 37
# Manage Fibre Channel Zone Policies for Cisco Intersight
# Reads ../models/intersight_fibre_channel_zone_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_fibre_channel_zone_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0037 intersight_fibre_channel_zone_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_fibre_channel_zone_policy.yml
  tasks:
    - name: Run intersight_fibre_channel_zone_policy from its model
      cisco.intersight.intersight_fibre_channel_zone_policy:
        api_bearer_token: "{{ intersight_fibre_channel_zone_policy.api_bearer_token if intersight_fibre_channel_zone_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_fibre_channel_zone_policy.api_key_id if intersight_fibre_channel_zone_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_fibre_channel_zone_policy.api_private_key if intersight_fibre_channel_zone_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_fibre_channel_zone_policy.api_uri if intersight_fibre_channel_zone_policy.api_uri is not none else omit }}"
        description: "{{ intersight_fibre_channel_zone_policy.description if intersight_fibre_channel_zone_policy.description is not none else omit }}"
        fc_target_members: "{{ (intersight_fibre_channel_zone_policy.fc_target_members | cat_strip_nulls) if (intersight_fibre_channel_zone_policy.fc_target_members | cat_strip_nulls) is not none else omit }}"
        fc_target_zoning_type: "{{ intersight_fibre_channel_zone_policy.fc_target_zoning_type if intersight_fibre_channel_zone_policy.fc_target_zoning_type is not none else omit }}"
        name: "{{ intersight_fibre_channel_zone_policy.name if intersight_fibre_channel_zone_policy.name is not none else omit }}"
        organization: "{{ intersight_fibre_channel_zone_policy.organization if intersight_fibre_channel_zone_policy.organization is not none else omit }}"
        state: "{{ intersight_fibre_channel_zone_policy.state if intersight_fibre_channel_zone_policy.state is not none else omit }}"
        tags: "{{ (intersight_fibre_channel_zone_policy.tags | cat_strip_nulls) if (intersight_fibre_channel_zone_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_fibre_channel_zone_policy.use_proxy if intersight_fibre_channel_zone_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_fibre_channel_zone_policy.validate_certs if intersight_fibre_channel_zone_policy.validate_certs is not none else omit }}"
      register: intersight_fibre_channel_zone_policy_result
      tags:
        - never
        - intersight_fibre_channel_zone_policy
