---
# Sample playbook for cisco.intersight.intersight_network_connectivity_policy (cisco.intersight 2.23.0)
# Build order: 82
# Network Connectivity Policy configuration for Cisco Intersight
# Reads ../models/intersight_network_connectivity_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_network_connectivity_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0082 intersight_network_connectivity_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_network_connectivity_policy.yml
  tasks:
    - name: Run intersight_network_connectivity_policy from its model
      cisco.intersight.intersight_network_connectivity_policy:
        alternate_ipv4_dns_server: "{{ intersight_network_connectivity_policy.alternate_ipv4_dns_server if intersight_network_connectivity_policy.alternate_ipv4_dns_server is not none else omit }}"
        alternate_ipv6_dns_server: "{{ intersight_network_connectivity_policy.alternate_ipv6_dns_server if intersight_network_connectivity_policy.alternate_ipv6_dns_server is not none else omit }}"
        api_bearer_token: "{{ intersight_network_connectivity_policy.api_bearer_token if intersight_network_connectivity_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_network_connectivity_policy.api_key_id if intersight_network_connectivity_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_network_connectivity_policy.api_private_key if intersight_network_connectivity_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_network_connectivity_policy.api_uri if intersight_network_connectivity_policy.api_uri is not none else omit }}"
        description: "{{ intersight_network_connectivity_policy.description if intersight_network_connectivity_policy.description is not none else omit }}"
        dynamic_dns_domain: "{{ intersight_network_connectivity_policy.dynamic_dns_domain if intersight_network_connectivity_policy.dynamic_dns_domain is not none else omit }}"
        enable_dynamic_dns: "{{ intersight_network_connectivity_policy.enable_dynamic_dns if intersight_network_connectivity_policy.enable_dynamic_dns is not none else omit }}"
        enable_ipv4_dns_from_dhcp: "{{ intersight_network_connectivity_policy.enable_ipv4_dns_from_dhcp if intersight_network_connectivity_policy.enable_ipv4_dns_from_dhcp is not none else omit }}"
        enable_ipv6: "{{ intersight_network_connectivity_policy.enable_ipv6 if intersight_network_connectivity_policy.enable_ipv6 is not none else omit }}"
        enable_ipv6_dns_from_dhcp: "{{ intersight_network_connectivity_policy.enable_ipv6_dns_from_dhcp if intersight_network_connectivity_policy.enable_ipv6_dns_from_dhcp is not none else omit }}"
        name: "{{ intersight_network_connectivity_policy.name if intersight_network_connectivity_policy.name is not none else omit }}"
        organization: "{{ intersight_network_connectivity_policy.organization if intersight_network_connectivity_policy.organization is not none else omit }}"
        preferred_ipv4_dns_server: "{{ intersight_network_connectivity_policy.preferred_ipv4_dns_server if intersight_network_connectivity_policy.preferred_ipv4_dns_server is not none else omit }}"
        preferred_ipv6_dns_server: "{{ intersight_network_connectivity_policy.preferred_ipv6_dns_server if intersight_network_connectivity_policy.preferred_ipv6_dns_server is not none else omit }}"
        state: "{{ intersight_network_connectivity_policy.state if intersight_network_connectivity_policy.state is not none else omit }}"
        tags: "{{ (intersight_network_connectivity_policy.tags | cat_strip_nulls) if (intersight_network_connectivity_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_network_connectivity_policy.use_proxy if intersight_network_connectivity_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_network_connectivity_policy.validate_certs if intersight_network_connectivity_policy.validate_certs is not none else omit }}"
      register: intersight_network_connectivity_policy_result
      tags:
        - never
        - intersight_network_connectivity_policy
