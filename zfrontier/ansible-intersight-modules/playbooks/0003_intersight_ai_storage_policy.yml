---
# Sample playbook for cisco.intersight.intersight_ai_storage_policy (cisco.intersight 2.23.0)
# Build order: 3
# AI-optimized storage policy for Cisco Intersight
# Reads ../models/intersight_ai_storage_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ai_storage_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0003 intersight_ai_storage_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ai_storage_policy.yml
  tasks:
    - name: Run intersight_ai_storage_policy from its model
      cisco.intersight.intersight_ai_storage_policy:
        api_bearer_token: "{{ intersight_ai_storage_policy.api_bearer_token if intersight_ai_storage_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ai_storage_policy.api_key_id if intersight_ai_storage_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ai_storage_policy.api_private_key if intersight_ai_storage_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ai_storage_policy.api_uri if intersight_ai_storage_policy.api_uri is not none else omit }}"
        description: "{{ intersight_ai_storage_policy.description if intersight_ai_storage_policy.description is not none else omit }}"
        m2_boot_enabled: "{{ intersight_ai_storage_policy.m2_boot_enabled if intersight_ai_storage_policy.m2_boot_enabled is not none else omit }}"
        name: "{{ intersight_ai_storage_policy.name if intersight_ai_storage_policy.name is not none else omit }}"
        nvme_mode: "{{ intersight_ai_storage_policy.nvme_mode if intersight_ai_storage_policy.nvme_mode is not none else omit }}"
        nvme_slots: "{{ intersight_ai_storage_policy.nvme_slots if intersight_ai_storage_policy.nvme_slots is not none else omit }}"
        organization: "{{ intersight_ai_storage_policy.organization if intersight_ai_storage_policy.organization is not none else omit }}"
        raid_level: "{{ intersight_ai_storage_policy.raid_level if intersight_ai_storage_policy.raid_level is not none else omit }}"
        read_policy: "{{ intersight_ai_storage_policy.read_policy if intersight_ai_storage_policy.read_policy is not none else omit }}"
        state: "{{ intersight_ai_storage_policy.state if intersight_ai_storage_policy.state is not none else omit }}"
        storage_profile: "{{ intersight_ai_storage_policy.storage_profile if intersight_ai_storage_policy.storage_profile is not none else omit }}"
        tags: "{{ intersight_ai_storage_policy.tags if intersight_ai_storage_policy.tags is not none else omit }}"
        use_proxy: "{{ intersight_ai_storage_policy.use_proxy if intersight_ai_storage_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ai_storage_policy.validate_certs if intersight_ai_storage_policy.validate_certs is not none else omit }}"
        write_policy: "{{ intersight_ai_storage_policy.write_policy if intersight_ai_storage_policy.write_policy is not none else omit }}"
      register: intersight_ai_storage_policy_result
      tags:
        - never
        - intersight_ai_storage_policy
