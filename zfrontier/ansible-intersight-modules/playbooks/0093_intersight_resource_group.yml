---
# Sample playbook for cisco.intersight.intersight_resource_group (cisco.intersight 2.23.0)
# Build order: 93
# Resource Group configuration for Cisco Intersight
# Reads ../models/intersight_resource_group.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_resource_group_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0093 intersight_resource_group"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_resource_group.yml
  tasks:
    - name: Run intersight_resource_group from its model
      cisco.intersight.intersight_resource_group:
        api_bearer_token: "{{ intersight_resource_group.api_bearer_token if intersight_resource_group.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_resource_group.api_key_id if intersight_resource_group.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_resource_group.api_private_key if intersight_resource_group.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_resource_group.api_uri if intersight_resource_group.api_uri is not none else omit }}"
        description: "{{ intersight_resource_group.description if intersight_resource_group.description is not none else omit }}"
        name: "{{ intersight_resource_group.name if intersight_resource_group.name is not none else omit }}"
        resources: "{{ (intersight_resource_group.resources | cat_strip_nulls) if (intersight_resource_group.resources | cat_strip_nulls) is not none else omit }}"
        state: "{{ intersight_resource_group.state if intersight_resource_group.state is not none else omit }}"
        tags: "{{ intersight_resource_group.tags if intersight_resource_group.tags is not none else omit }}"
        use_proxy: "{{ intersight_resource_group.use_proxy if intersight_resource_group.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_resource_group.validate_certs if intersight_resource_group.validate_certs is not none else omit }}"
      register: intersight_resource_group_result
      tags:
        - never
        - intersight_resource_group
