---
# Sample playbook for cisco.intersight.intersight_gpu_policy (cisco.intersight 2.23.0)
# Build order: 43
# GPU policy configuration for Cisco Intersight
# Reads ../models/intersight_gpu_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_gpu_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0043 intersight_gpu_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_gpu_policy.yml
  tasks:
    - name: Run intersight_gpu_policy from its model
      cisco.intersight.intersight_gpu_policy:
        api_bearer_token: "{{ intersight_gpu_policy.api_bearer_token if intersight_gpu_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_gpu_policy.api_key_id if intersight_gpu_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_gpu_policy.api_private_key if intersight_gpu_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_gpu_policy.api_uri if intersight_gpu_policy.api_uri is not none else omit }}"
        description: "{{ intersight_gpu_policy.description if intersight_gpu_policy.description is not none else omit }}"
        gpu_mode: "{{ intersight_gpu_policy.gpu_mode if intersight_gpu_policy.gpu_mode is not none else omit }}"
        gpu_thermal_threshold: "{{ intersight_gpu_policy.gpu_thermal_threshold if intersight_gpu_policy.gpu_thermal_threshold is not none else omit }}"
        mig_enabled: "{{ intersight_gpu_policy.mig_enabled if intersight_gpu_policy.mig_enabled is not none else omit }}"
        mig_profiles: "{{ intersight_gpu_policy.mig_profiles if intersight_gpu_policy.mig_profiles is not none else omit }}"
        name: "{{ intersight_gpu_policy.name if intersight_gpu_policy.name is not none else omit }}"
        organization: "{{ intersight_gpu_policy.organization if intersight_gpu_policy.organization is not none else omit }}"
        power_cap_watts: "{{ intersight_gpu_policy.power_cap_watts if intersight_gpu_policy.power_cap_watts is not none else omit }}"
        power_capping_enabled: "{{ intersight_gpu_policy.power_capping_enabled if intersight_gpu_policy.power_capping_enabled is not none else omit }}"
        state: "{{ intersight_gpu_policy.state if intersight_gpu_policy.state is not none else omit }}"
        tags: "{{ intersight_gpu_policy.tags if intersight_gpu_policy.tags is not none else omit }}"
        use_proxy: "{{ intersight_gpu_policy.use_proxy if intersight_gpu_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_gpu_policy.validate_certs if intersight_gpu_policy.validate_certs is not none else omit }}"
      register: intersight_gpu_policy_result
      tags:
        - never
        - intersight_gpu_policy
