---
# Sample playbook for cisco.intersight.intersight_resource_group_info (cisco.intersight 2.23.0)
# Build order: 94
# Gather information about Resource Groups in Cisco Intersight
# Reads ../models/intersight_resource_group_info.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_resource_group_info_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0094 intersight_resource_group_info"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_resource_group_info.yml
  tasks:
    - name: Run intersight_resource_group_info from its model
      cisco.intersight.intersight_resource_group_info:
        api_bearer_token: "{{ intersight_resource_group_info.api_bearer_token if intersight_resource_group_info.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_resource_group_info.api_key_id if intersight_resource_group_info.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_resource_group_info.api_private_key if intersight_resource_group_info.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_resource_group_info.api_uri if intersight_resource_group_info.api_uri is not none else omit }}"
        name: "{{ intersight_resource_group_info.name if intersight_resource_group_info.name is not none else omit }}"
        use_proxy: "{{ intersight_resource_group_info.use_proxy if intersight_resource_group_info.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_resource_group_info.validate_certs if intersight_resource_group_info.validate_certs is not none else omit }}"
      register: intersight_resource_group_info_result
