---
# Sample playbook for cisco.intersight.intersight_bios_ai_tuning_info (cisco.intersight 2.23.0)
# Build order: 6
# Gather information about BIOS AI Tuning Policies
# Reads ../models/intersight_bios_ai_tuning_info.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_bios_ai_tuning_info_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0006 intersight_bios_ai_tuning_info"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_bios_ai_tuning_info.yml
  tasks:
    - name: Run intersight_bios_ai_tuning_info from its model
      cisco.intersight.intersight_bios_ai_tuning_info:
        api_bearer_token: "{{ intersight_bios_ai_tuning_info.api_bearer_token if intersight_bios_ai_tuning_info.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_bios_ai_tuning_info.api_key_id if intersight_bios_ai_tuning_info.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_bios_ai_tuning_info.api_private_key if intersight_bios_ai_tuning_info.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_bios_ai_tuning_info.api_uri if intersight_bios_ai_tuning_info.api_uri is not none else omit }}"
        name: "{{ intersight_bios_ai_tuning_info.name if intersight_bios_ai_tuning_info.name is not none else omit }}"
        organization: "{{ intersight_bios_ai_tuning_info.organization if intersight_bios_ai_tuning_info.organization is not none else omit }}"
        use_proxy: "{{ intersight_bios_ai_tuning_info.use_proxy if intersight_bios_ai_tuning_info.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_bios_ai_tuning_info.validate_certs if intersight_bios_ai_tuning_info.validate_certs is not none else omit }}"
      register: intersight_bios_ai_tuning_info_result
