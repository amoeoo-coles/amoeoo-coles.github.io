---
# Sample playbook for cisco.intersight.intersight_drive_security_policy (cisco.intersight 2.23.0)
# Build order: 21
# Drive Security Policy configuration for Cisco Intersight
# Reads ../models/intersight_drive_security_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_drive_security_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0021 intersight_drive_security_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_drive_security_policy.yml
  tasks:
    - name: Run intersight_drive_security_policy from its model
      cisco.intersight.intersight_drive_security_policy:
        api_bearer_token: "{{ intersight_drive_security_policy.api_bearer_token if intersight_drive_security_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_drive_security_policy.api_key_id if intersight_drive_security_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_drive_security_policy.api_private_key if intersight_drive_security_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_drive_security_policy.api_uri if intersight_drive_security_policy.api_uri is not none else omit }}"
        description: "{{ intersight_drive_security_policy.description if intersight_drive_security_policy.description is not none else omit }}"
        manual_key: "{{ intersight_drive_security_policy.manual_key if intersight_drive_security_policy.manual_key is not none else omit }}"
        name: "{{ intersight_drive_security_policy.name if intersight_drive_security_policy.name is not none else omit }}"
        organization: "{{ intersight_drive_security_policy.organization if intersight_drive_security_policy.organization is not none else omit }}"
        remote_key: "{{ intersight_drive_security_policy.remote_key if intersight_drive_security_policy.remote_key is not none else omit }}"
        state: "{{ intersight_drive_security_policy.state if intersight_drive_security_policy.state is not none else omit }}"
        tags: "{{ (intersight_drive_security_policy.tags | cat_strip_nulls) if (intersight_drive_security_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_drive_security_policy.use_proxy if intersight_drive_security_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_drive_security_policy.validate_certs if intersight_drive_security_policy.validate_certs is not none else omit }}"
      register: intersight_drive_security_policy_result
      tags:
        - never
        - intersight_drive_security_policy
