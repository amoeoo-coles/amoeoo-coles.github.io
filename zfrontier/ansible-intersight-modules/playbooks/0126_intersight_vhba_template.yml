---
# Sample playbook for cisco.intersight.intersight_vhba_template (cisco.intersight 2.23.0)
# Build order: 126
# Manage vHBA Templates for Cisco Intersight
# Reads ../models/intersight_vhba_template.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vhba_template_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0126 intersight_vhba_template"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_vhba_template.yml
  tasks:
    - name: Run intersight_vhba_template from its model
      cisco.intersight.intersight_vhba_template:
        api_bearer_token: "{{ intersight_vhba_template.api_bearer_token if intersight_vhba_template.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_vhba_template.api_key_id if intersight_vhba_template.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_vhba_template.api_private_key if intersight_vhba_template.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_vhba_template.api_uri if intersight_vhba_template.api_uri is not none else omit }}"
        description: "{{ intersight_vhba_template.description if intersight_vhba_template.description is not none else omit }}"
        enable_override: "{{ intersight_vhba_template.enable_override if intersight_vhba_template.enable_override is not none else omit }}"
        fibre_channel_adapter_policy_name: "{{ intersight_vhba_template.fibre_channel_adapter_policy_name if intersight_vhba_template.fibre_channel_adapter_policy_name is not none else omit }}"
        fibre_channel_network_policy_name: "{{ intersight_vhba_template.fibre_channel_network_policy_name if intersight_vhba_template.fibre_channel_network_policy_name is not none else omit }}"
        fibre_channel_qos_policy_name: "{{ intersight_vhba_template.fibre_channel_qos_policy_name if intersight_vhba_template.fibre_channel_qos_policy_name is not none else omit }}"
        fibre_channel_zone_policy_names: "{{ intersight_vhba_template.fibre_channel_zone_policy_names if intersight_vhba_template.fibre_channel_zone_policy_names is not none else omit }}"
        name: "{{ intersight_vhba_template.name if intersight_vhba_template.name is not none else omit }}"
        organization: "{{ intersight_vhba_template.organization if intersight_vhba_template.organization is not none else omit }}"
        persistent_bindings: "{{ intersight_vhba_template.persistent_bindings if intersight_vhba_template.persistent_bindings is not none else omit }}"
        pin_group_name: "{{ intersight_vhba_template.pin_group_name if intersight_vhba_template.pin_group_name is not none else omit }}"
        state: "{{ intersight_vhba_template.state if intersight_vhba_template.state is not none else omit }}"
        switch_id: "{{ intersight_vhba_template.switch_id if intersight_vhba_template.switch_id is not none else omit }}"
        tags: "{{ (intersight_vhba_template.tags | cat_strip_nulls) if (intersight_vhba_template.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_vhba_template.use_proxy if intersight_vhba_template.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_vhba_template.validate_certs if intersight_vhba_template.validate_certs is not none else omit }}"
        vhba_type: "{{ intersight_vhba_template.vhba_type if intersight_vhba_template.vhba_type is not none else omit }}"
        wwpn_pool_name: "{{ intersight_vhba_template.wwpn_pool_name if intersight_vhba_template.wwpn_pool_name is not none else omit }}"
      register: intersight_vhba_template_result
      tags:
        - never
        - intersight_vhba_template
