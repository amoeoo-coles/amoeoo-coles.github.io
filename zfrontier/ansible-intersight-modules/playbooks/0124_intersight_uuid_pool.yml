---
# Sample playbook for cisco.intersight.intersight_uuid_pool (cisco.intersight 2.23.0)
# Build order: 124
# UUID Pool configuration for Cisco Intersight
# Reads ../models/intersight_uuid_pool.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_uuid_pool_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0124 intersight_uuid_pool"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_uuid_pool.yml
  tasks:
    - name: Run intersight_uuid_pool from its model
      cisco.intersight.intersight_uuid_pool:
        api_bearer_token: "{{ intersight_uuid_pool.api_bearer_token if intersight_uuid_pool.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_uuid_pool.api_key_id if intersight_uuid_pool.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_uuid_pool.api_private_key if intersight_uuid_pool.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_uuid_pool.api_uri if intersight_uuid_pool.api_uri is not none else omit }}"
        assignment_order: "{{ intersight_uuid_pool.assignment_order if intersight_uuid_pool.assignment_order is not none else omit }}"
        description: "{{ intersight_uuid_pool.description if intersight_uuid_pool.description is not none else omit }}"
        name: "{{ intersight_uuid_pool.name if intersight_uuid_pool.name is not none else omit }}"
        organization: "{{ intersight_uuid_pool.organization if intersight_uuid_pool.organization is not none else omit }}"
        prefix: "{{ intersight_uuid_pool.prefix if intersight_uuid_pool.prefix is not none else omit }}"
        state: "{{ intersight_uuid_pool.state if intersight_uuid_pool.state is not none else omit }}"
        tags: "{{ (intersight_uuid_pool.tags | cat_strip_nulls) if (intersight_uuid_pool.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_uuid_pool.use_proxy if intersight_uuid_pool.use_proxy is not none else omit }}"
        uuid_suffix_blocks: "{{ (intersight_uuid_pool.uuid_suffix_blocks | cat_strip_nulls) if (intersight_uuid_pool.uuid_suffix_blocks | cat_strip_nulls) is not none else omit }}"
        validate_certs: "{{ intersight_uuid_pool.validate_certs if intersight_uuid_pool.validate_certs is not none else omit }}"
      register: intersight_uuid_pool_result
      tags:
        - never
        - intersight_uuid_pool
