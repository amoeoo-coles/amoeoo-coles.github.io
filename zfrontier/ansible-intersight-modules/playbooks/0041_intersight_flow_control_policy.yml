---
# Sample playbook for cisco.intersight.intersight_flow_control_policy (cisco.intersight 2.23.0)
# Build order: 41
# Flow Control Policy configuration for Cisco Intersight
# Reads ../models/intersight_flow_control_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_flow_control_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0041 intersight_flow_control_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_flow_control_policy.yml
  tasks:
    - name: Run intersight_flow_control_policy from its model
      cisco.intersight.intersight_flow_control_policy:
        api_bearer_token: "{{ intersight_flow_control_policy.api_bearer_token if intersight_flow_control_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_flow_control_policy.api_key_id if intersight_flow_control_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_flow_control_policy.api_private_key if intersight_flow_control_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_flow_control_policy.api_uri if intersight_flow_control_policy.api_uri is not none else omit }}"
        description: "{{ intersight_flow_control_policy.description if intersight_flow_control_policy.description is not none else omit }}"
        name: "{{ intersight_flow_control_policy.name if intersight_flow_control_policy.name is not none else omit }}"
        organization: "{{ intersight_flow_control_policy.organization if intersight_flow_control_policy.organization is not none else omit }}"
        priority_flow_control_mode: "{{ intersight_flow_control_policy.priority_flow_control_mode if intersight_flow_control_policy.priority_flow_control_mode is not none else omit }}"
        receive_direction: "{{ intersight_flow_control_policy.receive_direction if intersight_flow_control_policy.receive_direction is not none else omit }}"
        send_direction: "{{ intersight_flow_control_policy.send_direction if intersight_flow_control_policy.send_direction is not none else omit }}"
        state: "{{ intersight_flow_control_policy.state if intersight_flow_control_policy.state is not none else omit }}"
        tags: "{{ (intersight_flow_control_policy.tags | cat_strip_nulls) if (intersight_flow_control_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_flow_control_policy.use_proxy if intersight_flow_control_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_flow_control_policy.validate_certs if intersight_flow_control_policy.validate_certs is not none else omit }}"
      register: intersight_flow_control_policy_result
      tags:
        - never
        - intersight_flow_control_policy
