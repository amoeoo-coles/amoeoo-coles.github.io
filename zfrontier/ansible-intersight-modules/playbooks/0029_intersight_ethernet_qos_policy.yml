---
# Sample playbook for cisco.intersight.intersight_ethernet_qos_policy (cisco.intersight 2.23.0)
# Build order: 29
# Ethernet QoS Policy configuration for Cisco Intersight
# Reads ../models/intersight_ethernet_qos_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ethernet_qos_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0029 intersight_ethernet_qos_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_ethernet_qos_policy.yml
  tasks:
    - name: Run intersight_ethernet_qos_policy from its model
      cisco.intersight.intersight_ethernet_qos_policy:
        api_bearer_token: "{{ intersight_ethernet_qos_policy.api_bearer_token if intersight_ethernet_qos_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_ethernet_qos_policy.api_key_id if intersight_ethernet_qos_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_ethernet_qos_policy.api_private_key if intersight_ethernet_qos_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_ethernet_qos_policy.api_uri if intersight_ethernet_qos_policy.api_uri is not none else omit }}"
        burst: "{{ intersight_ethernet_qos_policy.burst if intersight_ethernet_qos_policy.burst is not none else omit }}"
        cos: "{{ intersight_ethernet_qos_policy.cos if intersight_ethernet_qos_policy.cos is not none else omit }}"
        description: "{{ intersight_ethernet_qos_policy.description if intersight_ethernet_qos_policy.description is not none else omit }}"
        mtu: "{{ intersight_ethernet_qos_policy.mtu if intersight_ethernet_qos_policy.mtu is not none else omit }}"
        name: "{{ intersight_ethernet_qos_policy.name if intersight_ethernet_qos_policy.name is not none else omit }}"
        organization: "{{ intersight_ethernet_qos_policy.organization if intersight_ethernet_qos_policy.organization is not none else omit }}"
        priority: "{{ intersight_ethernet_qos_policy.priority if intersight_ethernet_qos_policy.priority is not none else omit }}"
        rate_limit: "{{ intersight_ethernet_qos_policy.rate_limit if intersight_ethernet_qos_policy.rate_limit is not none else omit }}"
        state: "{{ intersight_ethernet_qos_policy.state if intersight_ethernet_qos_policy.state is not none else omit }}"
        tags: "{{ intersight_ethernet_qos_policy.tags if intersight_ethernet_qos_policy.tags is not none else omit }}"
        trust_host_cos: "{{ intersight_ethernet_qos_policy.trust_host_cos if intersight_ethernet_qos_policy.trust_host_cos is not none else omit }}"
        use_proxy: "{{ intersight_ethernet_qos_policy.use_proxy if intersight_ethernet_qos_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_ethernet_qos_policy.validate_certs if intersight_ethernet_qos_policy.validate_certs is not none else omit }}"
      register: intersight_ethernet_qos_policy_result
      tags:
        - never
        - intersight_ethernet_qos_policy
