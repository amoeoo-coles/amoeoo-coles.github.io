        boot_order_policy: "{{ intersight_unified_edge_profile.boot_order_policy if intersight_unified_edge_profile.boot_order_policy is not none else omit }}"
        description: "{{ intersight_unified_edge_profile.description if intersight_unified_edge_profile.description is not none else omit }}"
        firmware_policy: "{{ intersight_unified_edge_profile.firmware_policy if intersight_unified_edge_profile.firmware_policy is not none else omit }}"
        hardware_platform: "{{ intersight_unified_edge_profile.hardware_platform if intersight_unified_edge_profile.hardware_platform is not none else omit }}"
        ipmi_over_lan_policy: "{{ intersight_unified_edge_profile.ipmi_over_lan_policy if intersight_unified_edge_profile.ipmi_over_lan_policy is not none else omit }}"
        kvm_policy: "{{ intersight_unified_edge_profile.kvm_policy if intersight_unified_edge_profile.kvm_policy is not none else omit }}"
        lan_connectivity_policy: "{{ intersight_unified_edge_profile.lan_connectivity_policy if intersight_unified_edge_profile.lan_connectivity_policy is not none else omit }}"
        local_user_policy: "{{ intersight_unified_edge_profile.local_user_policy if intersight_unified_edge_profile.local_user_policy is not none else omit }}"
        name: "{{ intersight_unified_edge_profile.name if intersight_unified_edge_profile.name is not none else omit }}"
        network_connectivity_policy: "{{ intersight_unified_edge_profile.network_connectivity_policy if intersight_unified_edge_profile.network_connectivity_policy is not none else omit }}"
        ntp_policy: "{{ intersight_unified_edge_profile.ntp_policy if intersight_unified_edge_profile.ntp_policy is not none else omit }}"
        organization: "{{ intersight_unified_edge_profile.organization if intersight_unified_edge_profile.organization is not none else omit }}"
        power_policy: "{{ intersight_unified_edge_profile.power_policy if intersight_unified_edge_profile.power_policy is not none else omit }}"
        snmp_policy: "{{ intersight_unified_edge_profile.snmp_policy if intersight_unified_edge_profile.snmp_policy is not none else omit }}"
