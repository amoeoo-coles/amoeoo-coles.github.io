---
# Sample playbook for cisco.intersight.intersight_unified_edge_profile (cisco.intersight 2.23.0)
# Build order: 122
# Unified Edge server profile template for Cisco Intersight
# Reads ../models/intersight_unified_edge_profile.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_unified_edge_profile_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0122 intersight_unified_edge_profile"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_unified_edge_profile.yml
  tasks:
    - name: Run intersight_unified_edge_profile from its model
      cisco.intersight.intersight_unified_edge_profile:
        api_bearer_token: "{{ intersight_unified_edge_profile.api_bearer_token if intersight_unified_edge_profile.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_unified_edge_profile.api_key_id if intersight_unified_edge_profile.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_unified_edge_profile.api_private_key if intersight_unified_edge_profile.api_private_key is not none else omit }}"
