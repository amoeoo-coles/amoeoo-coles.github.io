        thermal_policy: "{{ intersight_unified_edge_profile.thermal_policy if intersight_unified_edge_profile.thermal_policy is not none else omit }}"
        use_proxy: "{{ intersight_unified_edge_profile.use_proxy if intersight_unified_edge_profile.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_unified_edge_profile.validate_certs if intersight_unified_edge_profile.validate_certs is not none else omit }}"
      register: intersight_unified_edge_profile_result
      tags:
