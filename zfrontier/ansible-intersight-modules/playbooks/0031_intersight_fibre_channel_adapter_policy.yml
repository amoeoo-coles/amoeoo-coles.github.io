---
# Sample playbook for cisco.intersight.intersight_fibre_channel_adapter_policy (cisco.intersight 2.23.0)
# Build order: 31
# Manage Fibre Channel Adapter Policies for Cisco Intersight
# Reads ../models/intersight_fibre_channel_adapter_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_fibre_channel_adapter_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0031 intersight_fibre_channel_adapter_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_fibre_channel_adapter_policy.yml
  tasks:
    - name: Run intersight_fibre_channel_adapter_policy from its model
      cisco.intersight.intersight_fibre_channel_adapter_policy:
        api_bearer_token: "{{ intersight_fibre_channel_adapter_policy.api_bearer_token if intersight_fibre_channel_adapter_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_fibre_channel_adapter_policy.api_key_id if intersight_fibre_channel_adapter_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_fibre_channel_adapter_policy.api_private_key if intersight_fibre_channel_adapter_policy.api_private_key is not none else omit }}"
