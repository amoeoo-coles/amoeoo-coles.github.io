        tags: "{{ intersight_fibre_channel_adapter_policy.tags if intersight_fibre_channel_adapter_policy.tags is not none else omit }}"
        tx_ring_size: "{{ intersight_fibre_channel_adapter_policy.tx_ring_size if intersight_fibre_channel_adapter_policy.tx_ring_size is not none else omit }}"
        use_proxy: "{{ intersight_fibre_channel_adapter_policy.use_proxy if intersight_fibre_channel_adapter_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_fibre_channel_adapter_policy.validate_certs if intersight_fibre_channel_adapter_policy.validate_certs is not none else omit }}"
      register: intersight_fibre_channel_adapter_policy_result
      tags:
