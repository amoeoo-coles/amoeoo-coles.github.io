        description: "{{ intersight_fibre_channel_adapter_policy.description if intersight_fibre_channel_adapter_policy.description is not none else omit }}"
        error_detection_timeout: "{{ intersight_fibre_channel_adapter_policy.error_detection_timeout if intersight_fibre_channel_adapter_policy.error_detection_timeout is not none else omit }}"
        error_recovery_enabled: "{{ intersight_fibre_channel_adapter_policy.error_recovery_enabled if intersight_fibre_channel_adapter_policy.error_recovery_enabled is not none else omit }}"
        flogi_retries: "{{ intersight_fibre_channel_adapter_policy.flogi_retries if intersight_fibre_channel_adapter_policy.flogi_retries is not none else omit }}"
        flogi_timeout: "{{ intersight_fibre_channel_adapter_policy.flogi_timeout if intersight_fibre_channel_adapter_policy.flogi_timeout is not none else omit }}"
        interrupt_mode: "{{ intersight_fibre_channel_adapter_policy.interrupt_mode if intersight_fibre_channel_adapter_policy.interrupt_mode is not none else omit }}"
        io_retry_timeout: "{{ intersight_fibre_channel_adapter_policy.io_retry_timeout if intersight_fibre_channel_adapter_policy.io_retry_timeout is not none else omit }}"
        io_throttle_count: "{{ intersight_fibre_channel_adapter_policy.io_throttle_count if intersight_fibre_channel_adapter_policy.io_throttle_count is not none else omit }}"
        link_down_timeout: "{{ intersight_fibre_channel_adapter_policy.link_down_timeout if intersight_fibre_channel_adapter_policy.link_down_timeout is not none else omit }}"
        lun_count: "{{ intersight_fibre_channel_adapter_policy.lun_count if intersight_fibre_channel_adapter_policy.lun_count is not none else omit }}"
        lun_queue_depth: "{{ intersight_fibre_channel_adapter_policy.lun_queue_depth if intersight_fibre_channel_adapter_policy.lun_queue_depth is not none else omit }}"
        name: "{{ intersight_fibre_channel_adapter_policy.name if intersight_fibre_channel_adapter_policy.name is not none else omit }}"
        organization: "{{ intersight_fibre_channel_adapter_policy.organization if intersight_fibre_channel_adapter_policy.organization is not none else omit }}"
        plogi_retries: "{{ intersight_fibre_channel_adapter_policy.plogi_retries if intersight_fibre_channel_adapter_policy.plogi_retries is not none else omit }}"
        plogi_timeout: "{{ intersight_fibre_channel_adapter_policy.plogi_timeout if intersight_fibre_channel_adapter_policy.plogi_timeout is not none else omit }}"
