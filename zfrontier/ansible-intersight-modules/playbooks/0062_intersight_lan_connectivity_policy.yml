---
# Sample playbook for cisco.intersight.intersight_lan_connectivity_policy (cisco.intersight 2.23.0)
# Build order: 62
# Manage LAN Connectivity Policies and vNICs for Cisco Intersight
# Reads ../models/intersight_lan_connectivity_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_lan_connectivity_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0062 intersight_lan_connectivity_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_lan_connectivity_policy.yml
  tasks:
    - name: Run intersight_lan_connectivity_policy from its model
      cisco.intersight.intersight_lan_connectivity_policy:
        api_bearer_token: "{{ intersight_lan_connectivity_policy.api_bearer_token if intersight_lan_connectivity_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_lan_connectivity_policy.api_key_id if intersight_lan_connectivity_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_lan_connectivity_policy.api_private_key if intersight_lan_connectivity_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_lan_connectivity_policy.api_uri if intersight_lan_connectivity_policy.api_uri is not none else omit }}"
        azure_qos_enabled: "{{ intersight_lan_connectivity_policy.azure_qos_enabled if intersight_lan_connectivity_policy.azure_qos_enabled is not none else omit }}"
        description: "{{ intersight_lan_connectivity_policy.description if intersight_lan_connectivity_policy.description is not none else omit }}"
        iqn_allocation_type: "{{ intersight_lan_connectivity_policy.iqn_allocation_type if intersight_lan_connectivity_policy.iqn_allocation_type is not none else omit }}"
        iqn_pool_name: "{{ intersight_lan_connectivity_policy.iqn_pool_name if intersight_lan_connectivity_policy.iqn_pool_name is not none else omit }}"
        name: "{{ intersight_lan_connectivity_policy.name if intersight_lan_connectivity_policy.name is not none else omit }}"
        organization: "{{ intersight_lan_connectivity_policy.organization if intersight_lan_connectivity_policy.organization is not none else omit }}"
        placement_mode: "{{ intersight_lan_connectivity_policy.placement_mode if intersight_lan_connectivity_policy.placement_mode is not none else omit }}"
        state: "{{ intersight_lan_connectivity_policy.state if intersight_lan_connectivity_policy.state is not none else omit }}"
        static_iqn_name: "{{ intersight_lan_connectivity_policy.static_iqn_name if intersight_lan_connectivity_policy.static_iqn_name is not none else omit }}"
        tags: "{{ (intersight_lan_connectivity_policy.tags | cat_strip_nulls) if (intersight_lan_connectivity_policy.tags | cat_strip_nulls) is not none else omit }}"
        target_platform: "{{ intersight_lan_connectivity_policy.target_platform if intersight_lan_connectivity_policy.target_platform is not none else omit }}"
        use_proxy: "{{ intersight_lan_connectivity_policy.use_proxy if intersight_lan_connectivity_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_lan_connectivity_policy.validate_certs if intersight_lan_connectivity_policy.validate_certs is not none else omit }}"
        vnics: "{{ (intersight_lan_connectivity_policy.vnics | cat_strip_nulls) if (intersight_lan_connectivity_policy.vnics | cat_strip_nulls) is not none else omit }}"
      register: intersight_lan_connectivity_policy_result
      tags:
        - never
        - intersight_lan_connectivity_policy
