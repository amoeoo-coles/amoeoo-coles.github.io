---
# Sample playbook for cisco.intersight.intersight_thermal_policy (cisco.intersight 2.23.0)
# Build order: 120
# Thermal Policy configuration for Cisco Intersight
# Reads ../models/intersight_thermal_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_thermal_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0120 intersight_thermal_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_thermal_policy.yml
  tasks:
    - name: Run intersight_thermal_policy from its model
      cisco.intersight.intersight_thermal_policy:
        api_bearer_token: "{{ intersight_thermal_policy.api_bearer_token if intersight_thermal_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_thermal_policy.api_key_id if intersight_thermal_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_thermal_policy.api_private_key if intersight_thermal_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_thermal_policy.api_uri if intersight_thermal_policy.api_uri is not none else omit }}"
        description: "{{ intersight_thermal_policy.description if intersight_thermal_policy.description is not none else omit }}"
        fan_control_mode: "{{ intersight_thermal_policy.fan_control_mode if intersight_thermal_policy.fan_control_mode is not none else omit }}"
        name: "{{ intersight_thermal_policy.name if intersight_thermal_policy.name is not none else omit }}"
        organization: "{{ intersight_thermal_policy.organization if intersight_thermal_policy.organization is not none else omit }}"
        state: "{{ intersight_thermal_policy.state if intersight_thermal_policy.state is not none else omit }}"
        tags: "{{ (intersight_thermal_policy.tags | cat_strip_nulls) if (intersight_thermal_policy.tags | cat_strip_nulls) is not none else omit }}"
        use_proxy: "{{ intersight_thermal_policy.use_proxy if intersight_thermal_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_thermal_policy.validate_certs if intersight_thermal_policy.validate_certs is not none else omit }}"
      register: intersight_thermal_policy_result
      tags:
        - never
        - intersight_thermal_policy
