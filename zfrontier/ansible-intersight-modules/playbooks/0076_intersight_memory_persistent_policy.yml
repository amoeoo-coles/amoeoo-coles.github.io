---
# Sample playbook for cisco.intersight.intersight_memory_persistent_policy (cisco.intersight 2.23.0)
# Build order: 76
# Memory Persistent Policy configuration for Cisco Intersight
# Reads ../models/intersight_memory_persistent_policy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_memory_persistent_policy_module.html
# Connection placeholders: {{ intersight_api_private_key }} {{ intersight_api_key_id }} {{ intersight_api_bearer_token }}.

- name: "0076 intersight_memory_persistent_policy"
  hosts: intersight
  gather_facts: false
  vars_files:
    - ../models/intersight_memory_persistent_policy.yml
  tasks:
    - name: Run intersight_memory_persistent_policy from its model
      cisco.intersight.intersight_memory_persistent_policy:
        api_bearer_token: "{{ intersight_memory_persistent_policy.api_bearer_token if intersight_memory_persistent_policy.api_bearer_token is not none else omit }}"
        api_key_id: "{{ intersight_memory_persistent_policy.api_key_id if intersight_memory_persistent_policy.api_key_id is not none else omit }}"
        api_private_key: "{{ intersight_memory_persistent_policy.api_private_key if intersight_memory_persistent_policy.api_private_key is not none else omit }}"
        api_uri: "{{ intersight_memory_persistent_policy.api_uri if intersight_memory_persistent_policy.api_uri is not none else omit }}"
        description: "{{ intersight_memory_persistent_policy.description if intersight_memory_persistent_policy.description is not none else omit }}"
        enable_goal: "{{ intersight_memory_persistent_policy.enable_goal if intersight_memory_persistent_policy.enable_goal is not none else omit }}"
        enable_security_passphrase: "{{ intersight_memory_persistent_policy.enable_security_passphrase if intersight_memory_persistent_policy.enable_security_passphrase is not none else omit }}"
        management_mode: "{{ intersight_memory_persistent_policy.management_mode if intersight_memory_persistent_policy.management_mode is not none else omit }}"
        memory_mode_percentage: "{{ intersight_memory_persistent_policy.memory_mode_percentage if intersight_memory_persistent_policy.memory_mode_percentage is not none else omit }}"
        name: "{{ intersight_memory_persistent_policy.name if intersight_memory_persistent_policy.name is not none else omit }}"
        namespaces: "{{ (intersight_memory_persistent_policy.namespaces | cat_strip_nulls) if (intersight_memory_persistent_policy.namespaces | cat_strip_nulls) is not none else omit }}"
        organization: "{{ intersight_memory_persistent_policy.organization if intersight_memory_persistent_policy.organization is not none else omit }}"
        persistent_memory_type: "{{ intersight_memory_persistent_policy.persistent_memory_type if intersight_memory_persistent_policy.persistent_memory_type is not none else omit }}"
        retain_namespaces: "{{ intersight_memory_persistent_policy.retain_namespaces if intersight_memory_persistent_policy.retain_namespaces is not none else omit }}"
        secure_passphrase: "{{ intersight_memory_persistent_policy.secure_passphrase if intersight_memory_persistent_policy.secure_passphrase is not none else omit }}"
        state: "{{ intersight_memory_persistent_policy.state if intersight_memory_persistent_policy.state is not none else omit }}"
        tags: "{{ intersight_memory_persistent_policy.tags if intersight_memory_persistent_policy.tags is not none else omit }}"
        use_proxy: "{{ intersight_memory_persistent_policy.use_proxy if intersight_memory_persistent_policy.use_proxy is not none else omit }}"
        validate_certs: "{{ intersight_memory_persistent_policy.validate_certs if intersight_memory_persistent_policy.validate_certs is not none else omit }}"
      register: intersight_memory_persistent_policy_result
      tags:
        - never
        - intersight_memory_persistent_policy
