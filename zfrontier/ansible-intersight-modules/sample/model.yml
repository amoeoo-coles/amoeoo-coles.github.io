  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  cdn_source: vnic
  cdn_value: null
  connection_type: none
  description: Basic vNIC template for production servers
  enable_override: false
  eth_adapter_policy_name: default-adapter-policy
  eth_qos_policy_name: default-qos-policy
  fabric_eth_network_control_policy_name: default-network-control
  fabric_eth_network_group_policy_name: default-network-group
  failover_enabled: false
  iscsi_boot_policy_name: null
  mac_pool_name: default-mac-pool
  name: basic-vnic-template
  organization: default
  pin_group_name: null
  sriov_settings: null
  state: present
  switch_id: A
  tags:
    - Key: '{{ intersight_vnic_template_Key }}'
      Value: Production
    - Key: '{{ intersight_vnic_template_Key }}'
      Value: DataCenter-A
  use_proxy: null
  usnic_settings: null
  validate_certs: true
  vmq_settings: null
intersight_vnic_template_info:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  name: null
  organization: null
  use_proxy: null
  validate_certs: true
intersight_vsan_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: VSAN policy for datacenter SAN infrastructure
  enable_trunking: false
  name: datacenter-vsan-policy
  organization: default
  state: present
  tags:
    - Key: '{{ intersight_vsan_policy_Key }}'
      Value: Production
    - Key: '{{ intersight_vsan_policy_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
  vsans:
    - name: vsan_uplink_100
      vsan_id: 100
      fcoe_vlan_id: 100
      vsan_scope: uplink
    - name: vsan_storage_200
      vsan_id: 200
      fcoe_vlan_id: 200
      vsan_scope: storage
    - name: vsan_common_300
      vsan_id: 300
      fcoe_vlan_id: 300
      vsan_scope: common
intersight_vsan_policy_info:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  name: null
  organization: null
  use_proxy: null
  validate_certs: true
  vsan_name: null
intersight_wwn_pool:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  assignment_order: sequential
  description: Test WWNN pool description
  id_blocks:
    - wwn_from: 20:00:00:25:B5:00:00:00
      size: 100
    - wwn_from: 20:00:00:25:B5:FF:00:00
      size: 100
  name: wwn_pool_1
  organization: null
  pool_purpose: WWNN
  state: present
  tags:
    - Key: '{{ intersight_wwn_pool_Key }}'
      Value: tag1
  use_proxy: null
  validate_certs: true
intersight_wwn_pool_info:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  name: wwn_pool_1
  organization: null
  pool_purpose: null
  use_proxy: null
  validate_certs: true
