---
# Data model for cisco.intersight.intersight_lan_connectivity_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_lan_connectivity_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_lan_connectivity_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 62
  group: 3. Ethernet, LAN and vNIC
  sample_values_from: module EXAMPLES

intersight_lan_connectivity_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  azure_qos_enabled: null
  description: LAN connectivity policy for Standalone servers
  iqn_allocation_type: null
  iqn_pool_name: null
  name: Standalone-lan-policy
  organization: default
  placement_mode: null
  state: present
  static_iqn_name: null
  tags:
    - Key: '{{ intersight_lan_connectivity_policy_Key }}'
      Value: Production
    - Key: '{{ intersight_lan_connectivity_policy_Key }}'
      Value: DataCenter-A
  target_platform: Standalone
  use_proxy: null
  validate_certs: true
  vnics:
    - name: eth0
      placement_slot_id: '1'
      pci_link: 0
      uplink_port: 0
      order: 0
      eth_network_policy_name: default-network-policy
      eth_qos_policy_name: default-qos-policy
      eth_adapter_policy_name: default-adapter-policy
      connection_type: none
    - name: eth1
      placement_slot_id: '2'
      pci_link: 0
      uplink_port: 1
      order: 1
      eth_network_policy_name: vlan-network-policy
      eth_qos_policy_name: high-qos-policy
      eth_adapter_policy_name: performance-adapter-policy
      connection_type: none
