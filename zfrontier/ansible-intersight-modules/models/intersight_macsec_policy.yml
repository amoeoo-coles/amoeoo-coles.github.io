---
# Data model for cisco.intersight.intersight_macsec_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_macsec_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_macsec_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 74
  group: 3. Ethernet, LAN and vNIC
  sample_values_from: module EXAMPLES

intersight_macsec_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  cipher_suite: gcm-aes-xpn-256
  confidentiality_offset: null
  configure_fallback_keychain: null
  description: MACsec policy with primary keychain
  eapol_ethertype: null
  eapol_mac_address: null
  fallback_keychain_name: null
  fallback_keys: null
  include_icv_indicator: null
  key_server_priority: null
  name: macsec-policy-01
  organization: default
  primary_keychain_name: primary-keychain
  primary_keys:
    - id: '1234'
      cryptographic_algorithm: aes-256-cmac
      secret: '{{ intersight_macsec_policy_secret }}'
      key_lifetime_always_active: true
  replay_window_size: null
  sak_expiry_time: null
  security_policy: should-secure
  state: present
  tags:
    - Key: '{{ intersight_macsec_policy_Key }}'
      Value: Production
  use_proxy: null
  validate_certs: true
