---
# Data model for cisco.intersight.intersight_firmware_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_firmware_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_firmware_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 39
  group: 6. BIOS, boot, firmware, memory and GPU
  sample_values_from: module EXAMPLES

intersight_firmware_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Firmware policy for standalone servers
  exclude_drives: null
  exclude_storage_controllers: null
  model_bundle_combo:
    - model_family: UCSC-C220-M5
      bundle_version: 4.3(2.250037)
    - model_family: UCSC-C220-M4
      bundle_version: 4.1(2m)
  name: Standalone-Firmware-Policy
  organization: null
  state: present
  tags:
    - Key: '{{ intersight_firmware_policy_Key }}'
      Value: Production
  target_platform: Standalone
  use_proxy: null
  validate_certs: true
