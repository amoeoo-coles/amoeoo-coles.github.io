---
# Data model for cisco.intersight.intersight_storage_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_storage_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_storage_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 111
  group: 7. Storage and drive security
  sample_values_from: module EXAMPLES

intersight_storage_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  controller_attached_nvme_slots: null
  default_drive_mode: null
  description: Basic storage policy configuration
  direct_attached_nvme_slots: null
  drive_groups: null
  m2_virtual_drive_config:
    enable: false
  name: basic-storage-policy
  organization: null
  raid0_drive_config:
    enable: false
  secure_jbods: null
  state: present
  tags:
    - Key: '{{ intersight_storage_policy_Key }}'
      Value: Production
  unused_disks_state: null
  use_jbod_for_vd_creation: null
  use_proxy: null
  validate_certs: true
