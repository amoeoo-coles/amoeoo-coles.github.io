---
# Data model for cisco.intersight.intersight_syslog_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_syslog_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_syslog_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 115
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_syslog_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Syslog policy for production servers
  first_remote_logging_enabled: true
  first_remote_logging_hostname: 198.51.100.50
  first_remote_logging_minimum_severity: informational
  first_remote_logging_port: 514
  first_remote_logging_protocol: udp
  local_logging_minimum_severity: notice
  name: Syslog-Policy-PROD
  organization: null
  second_remote_logging_enabled: null
  second_remote_logging_hostname: null
  second_remote_logging_minimum_severity: null
  second_remote_logging_port: null
  second_remote_logging_protocol: null
  state: present
  tags:
    - Key: '{{ intersight_syslog_policy_Key }}'
      Value: Production
  use_proxy: null
  validate_certs: true
