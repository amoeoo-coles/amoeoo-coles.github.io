---
# Data model for cisco.intersight.intersight_drive_security_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_drive_security_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_drive_security_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 21
  group: 7. Storage and drive security
  sample_values_from: module EXAMPLES

intersight_drive_security_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Drive security policy with manual key management
  manual_key: '{{ intersight_drive_security_policy_manual_key }}'
  name: manual-drive-security-policy
  organization: default
  remote_key: '{{ intersight_drive_security_policy_remote_key }}'
  state: present
  tags:
    - Key: '{{ intersight_drive_security_policy_Key }}'
      Value: Production
  use_proxy: null
  validate_certs: true
