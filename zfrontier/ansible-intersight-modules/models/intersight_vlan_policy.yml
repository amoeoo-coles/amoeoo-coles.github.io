---
# Data model for cisco.intersight.intersight_vlan_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_vlan_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vlan_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 130
  group: 10. Other
  sample_values_from: module EXAMPLES

intersight_vlan_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: VLAN policy for datacenter infrastructure
  name: datacenter-vlan-policy
  organization: default
  state: present
  tags:
    - Key: '{{ intersight_vlan_policy_Key }}'
      Value: Production
    - Key: '{{ intersight_vlan_policy_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
  vlans:
    - prefix: prod
      vlan_id: 100
      auto_allow_on_uplinks: true
      enable_sharing: false
      multicast_policy_name: default-multicast-policy
    - prefix: dev
      vlan_id: 200
      auto_allow_on_uplinks: false
      enable_sharing: false
      multicast_policy_name: default-multicast-policy
    - prefix: mgmt
      vlan_id: 300
      auto_allow_on_uplinks: true
      enable_sharing: false
      multicast_policy_name: default-multicast-policy
      is_native: true
