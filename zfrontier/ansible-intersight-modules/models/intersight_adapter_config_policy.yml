---
# Data model for cisco.intersight.intersight_adapter_config_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_adapter_config_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_adapter_config_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 1
  group: 9. Organization, target claim and generic API
  sample_values_from: module EXAMPLES

intersight_adapter_config_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Policy for VIC 1455
  name: adapter-config-policy
  organization: default
  settings:
    - slot_id: '2'
      enable_lldp: true
      enable_fip: true
      enable_port_channel: true
      dce_interface_1_fec_mode: cl91
      dce_interface_2_fec_mode: cl91
      dce_interface_3_fec_mode: cl91
      dce_interface_4_fec_mode: 'off'
  state: present
  tags: null
  use_proxy: null
  validate_certs: true
