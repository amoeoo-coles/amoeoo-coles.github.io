---
# Data model for cisco.intersight.intersight_ip_pool (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_ip_pool
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ip_pool_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 48
  group: 2. Pools and reservations
  sample_values_from: module EXAMPLES

intersight_ip_pool:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  assignment_order: sequential
  description: IP Pool for lab use
  enable_block_level_subnet_config: null
  ipv4_blocks:
    - from: 192.0.2.32
      size: 16
    - from: 192.0.2.64
      size: 16
  ipv4_config:
    netmask: 255.255.255.0
    gateway: 192.0.2.1
    primary_dns: 192.0.2.2
    secondary_dns: 192.0.2.3
  ipv6_blocks:
    - from: 2001:db8::2
      size: 64
    - from: 2001:db8::42
      size: 64
  ipv6_config:
    prefix: 64
    gateway: 2001:db8::1
    primary_dns: 2001:4860:4860::8888
    secondary_dns: 2001:4860:4860::8844
  name: lab-ip-pool
  organization: DevNet
  state: present
  tags:
    - Key: '{{ intersight_ip_pool_Key }}'
      Value: RCDN
  use_proxy: null
  validate_certs: true
