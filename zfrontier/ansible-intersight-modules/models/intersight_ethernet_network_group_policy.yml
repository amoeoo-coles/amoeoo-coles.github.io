---
# Data model for cisco.intersight.intersight_ethernet_network_group_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_ethernet_network_group_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ethernet_network_group_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 27
  group: 3. Ethernet, LAN and vNIC
  sample_values_from: module EXAMPLES

intersight_ethernet_network_group_policy:
  allowed_vlans: 1-8,12,16
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Policy with regular VLAN configuration
  name: regular-vlans-policy
  native_vlan: null
  organization: default
  qinq_enabled: false
  qinq_vlan: null
  state: present
  tags: null
  use_proxy: null
  validate_certs: true
