---
# Data model for cisco.intersight.intersight_domain (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_domain
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_domain_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 19
  group: 1. Server, chassis and domain profiles
  sample_values_from: module EXAMPLES

intersight_domain:
  action: null
  action_poll_interval: null
  action_timeout: null
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  assigned_switch_a_serial: null
  assigned_switch_b_serial: null
  auditd_policy: null
  certificate_management_policy: null
  description: Basic domain profile
  ldap_policy: null
  name: Domain-01
  network_connectivity_policy: null
  ntp_policy: null
  organization: default
  port_policy_fi_a: null
  port_policy_fi_b: null
  snmp_policy: null
  state: present
  switch_control_policy: null
  syslog_policy: null
  system_qos_policy: Default-QoS
  tags: null
  use_proxy: null
  validate_certs: true
  vlan_policy_fi_a: null
  vlan_policy_fi_b: null
  vsan_policy_fi_a: null
  vsan_policy_fi_b: null
  wait_for_action: null
