---
# Data model for cisco.intersight.intersight_snmp_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_snmp_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_snmp_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 107
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_snmp_policy:
  access_community_string: '{{ intersight_snmp_policy_access_community_string }}'
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  community_access: '{{ intersight_snmp_policy_community_access }}'
  description: SNMP policy with both v2 and v3 enabled
  enabled: true
  engine_input_id: custom-engine-id
  name: mixed-snmp-policy
  organization: default
  snmp_port: 161
  snmp_traps:
    - enabled: true
      version: V2
      community: '{{ intersight_snmp_policy_community }}'
      type: Trap
      destination: 192.0.2.100
      port: 162
    - enabled: true
      version: V3
      user: admin
      type: Trap
      destination: 192.0.2.101
      port: 162
  snmp_users:
    - name: admin
      security_level: AuthPriv
      auth_password: '{{ intersight_snmp_policy_auth_password }}'
      privacy_password: '{{ intersight_snmp_policy_privacy_password }}'
    - name: readonly
      security_level: AuthNoPriv
      auth_password: '{{ intersight_snmp_policy_auth_password }}'
  state: present
  sys_contact: admin@example.com
  sys_location: Data Center A
  tags:
    - Key: '{{ intersight_snmp_policy_Key }}'
      Value: Production
  trap_community: '{{ intersight_snmp_policy_trap_community }}'
  use_proxy: null
  v2c_enabled: true
  v3_enabled: true
  validate_certs: true
