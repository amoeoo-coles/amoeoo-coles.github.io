  persistent_memory_policy: null
  power_policy: null
  san_connectivity_policy: null
  sd_card_policy: null
  serial_over_lan_policy: null
  smtp_policy: null
  snmp_policy: null
  ssh_policy: null
  state: present
  storage_policy: null
  syslog_policy: null
  tags:
