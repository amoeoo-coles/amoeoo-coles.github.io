---
# Data model for cisco.intersight.intersight_resource_group (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_resource_group
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_resource_group_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 93
  group: 2. Pools and reservations
  sample_values_from: module EXAMPLES

intersight_resource_group:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Resource group for two UCS domains
  name: ucs-domains-group
  resources:
    - domain_name: ucs-domain-1
    - domain_name: ucs-domain-2
  state: present
  tags: null
  use_proxy: null
  validate_certs: true
