---
# Data model for cisco.intersight.intersight_virtual_media_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_virtual_media_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_virtual_media_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 128
  group: 6. BIOS, boot, firmware, memory and GPU
  sample_values_from: module EXAMPLES

intersight_virtual_media_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  cdd_virtual_media:
    mount_type: nfs
    volume: nfs-cdd
    remote_hostname: 192.0.2.77
    remote_path: mnt/SHARE/ISOS/CENTOS
    remote_file: CentOS7.iso
  description: Virutal Media policy for lab use
  enable: null
  encryption: null
  hdd_virtual_media:
    mount_type: nfs
    volume: nfs-hdd
    remote_hostname: 192.0.2.77
    remote_path: mnt/SHARE/ISOS/CENTOS
    remote_file: CentOS7.iso
  low_power_usb: null
  name: lab-vmedia
  organization: DevNet
  state: present
  tags:
    - Key: '{{ intersight_virtual_media_policy_Key }}'
      Value: RCDN
  use_proxy: null
  validate_certs: true
