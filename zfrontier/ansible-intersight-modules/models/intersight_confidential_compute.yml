---
# Data model for cisco.intersight.intersight_confidential_compute (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_confidential_compute
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_confidential_compute_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 15
  group: 6. BIOS, boot, firmware, memory and GPU
  sample_values_from: module EXAMPLES

intersight_confidential_compute:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: AMD SEV for secure AI inference VMs
  enable_tme: null
  name: bios-amd-sev-ai
  numa_optimized: null
  organization: AI-Factory
  security_profile: amd_sev
  sev_asid_count: 509 ASIDs
  sgx_epoch0: null
  sgx_epoch1: null
  state: present
  tags: null
  use_proxy: null
  validate_certs: true
