---
# Data model for cisco.intersight.intersight_port_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_port_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_port_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 89
  group: 10. Other
  sample_values_from: module EXAMPLES

intersight_port_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  appliance_port_channels: null
  appliance_ports: null
  breakout_ports:
    - port_id: 49
      custom_mode: BreakoutEthernet25G
      state: present
  description: Example port policy with various configurations
  device_model: UCS-FI-6454
  ethernet_uplink_port_channels: null
  ethernet_uplink_ports: null
  fc_port_mode: null
  fc_storage_ports: null
  fc_uplink_port_channels: null
  fc_uplink_ports: null
  fcoe_uplink_port_channels: null
  fcoe_uplink_ports: null
  name: port-policy-example
  organization: default
  pin_groups: null
  server_ports:
    - port_id: 1
      fec: Auto
      manual_numbering: false
      user_label: Server Port 1
      state: present
    - port_id: 2
      fec: Auto
      manual_numbering: true
      preferred_device_type: RackServer
      preferred_device_id: 2
      user_label: Server Port with Manual Numbering
      state: present
  state: present
  tags:
    - Key: '{{ intersight_port_policy_Key }}'
      Value: Production
  use_proxy: null
  validate_certs: true
