---
# Data model for cisco.intersight.intersight_bios_ai_tuning (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_bios_ai_tuning
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_bios_ai_tuning_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 5
  group: 6. BIOS, boot, firmware, memory and GPU
  sample_values_from: module EXAMPLES

intersight_bios_ai_tuning:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  cpu_energy_performance: null
  cpu_performance: null
  cpu_power_management: null
  description: BIOS tuning for H100 GPU inference servers
  gpu_count: 8
  intel_turbo_boost_tech: null
  name: bios-gpu-inference-h100
  numa_optimized: null
  organization: AI-Factory
  sriov: null
  state: present
  tags: null
  tuning_profile: gpu_inference
  use_proxy: null
  validate_certs: true
