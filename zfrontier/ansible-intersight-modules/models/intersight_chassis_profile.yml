---
# Data model for cisco.intersight.intersight_chassis_profile (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_chassis_profile
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_chassis_profile_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 13
  group: 1. Server, chassis and domain profiles
  sample_values_from: module EXAMPLES

intersight_chassis_profile:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  assigned_chassis_name: null
  description: Basic chassis profile
  imc_access_policy: null
  name: Chassis-Profile-01
  organization: default
  power_policy: null
  snmp_policy: null
  state: present
  tags:
    - Key: '{{ intersight_chassis_profile_Key }}'
      Value: Production
  thermal_policy: null
  use_proxy: null
  validate_certs: true
