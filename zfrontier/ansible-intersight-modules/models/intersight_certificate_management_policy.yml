---
# Data model for cisco.intersight.intersight_certificate_management_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_certificate_management_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_certificate_management_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 11
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_certificate_management_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  certificates:
    - certificate_type: rootca
      certificate_name: RootCA-01
      certificate: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
      enabled: true
  description: Certificate management policy with Root CA
  name: CertMgmt-Policy-01
  organization: default
  state: present
  tags: null
  use_proxy: null
  validate_certs: true
