---
# Data model for cisco.intersight.intersight_fibre_channel_zone_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_fibre_channel_zone_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_fibre_channel_zone_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 37
  group: 4. Fibre Channel, SAN and vHBA
  sample_values_from: module EXAMPLES

intersight_fibre_channel_zone_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: FC Zone policy with SIMT zoning
  fc_target_members:
    - name: target1
      wwpn: 21:00:00:e0:8b:05:05:04
      switch_id: A
      vsan_id: 100
    - name: target2
      wwpn: 21:00:00:e0:8b:05:05:03
      switch_id: B
      vsan_id: 100
    - name: target3
      wwpn: 21:00:00:e0:8b:05:05:09
      switch_id: A
      vsan_id: 200
  fc_target_zoning_type: SIMT
  name: fc-zone-policy-simt
  organization: default
  state: present
  tags:
    - Key: '{{ intersight_fibre_channel_zone_policy_Key }}'
      Value: Production
  use_proxy: null
  validate_certs: true
