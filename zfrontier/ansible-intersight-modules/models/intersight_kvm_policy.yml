---
# Data model for cisco.intersight.intersight_kvm_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_kvm_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_kvm_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 60
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_kvm_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: KVM policy with standard settings
  enable_local_server_video: null
  enable_video_encryption: null
  enabled: true
  maximum_sessions: null
  name: Default-KVM-Policy
  organization: null
  remote_port: null
  state: present
  tags:
    - Key: '{{ intersight_kvm_policy_Key }}'
      Value: Production
  tunneled_kvm_enabled: null
  use_proxy: null
  validate_certs: true
