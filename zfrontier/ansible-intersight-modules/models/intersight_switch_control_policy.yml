---
# Data model for cisco.intersight.intersight_switch_control_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_switch_control_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_switch_control_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 113
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_switch_control_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Switch control policy with default settings
  ethernet_switching_mode: null
  fabric_pc_vhba_reset: null
  fc_switching_mode: null
  mac_aging_option: null
  mac_aging_time: null
  message_interval: null
  name: SwitchControl-Policy-01
  organization: default
  primary_key: '{{ intersight_switch_control_policy_primary_key }}'
  recovery_action: null
  reserved_vlan_start_id: null
  state: present
  tags:
    - Key: '{{ intersight_switch_control_policy_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
  vlan_port_optimization_enabled: null
