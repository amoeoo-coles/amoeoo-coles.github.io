---
# Data model for cisco.intersight.intersight_system_qos_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_system_qos_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_system_qos_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 117
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_system_qos_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  classes:
    - name: Bronze
      admin_state: Enabled
      weight: 7
    - name: Silver
      admin_state: Enabled
      weight: 8
    - name: Gold
      admin_state: Enabled
      weight: 9
    - name: Platinum
      admin_state: Enabled
      weight: 10
    - name: Best Effort
      weight: 5
    - name: FC
      weight: 5
  description: System QoS policy for lab use
  name: lab-system-qos
  organization: DevNet
  state: present
  tags:
    - Key: '{{ intersight_system_qos_policy_Key }}'
      Value: RCDN
  use_proxy: null
  validate_certs: true
