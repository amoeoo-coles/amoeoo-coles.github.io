---
# Data model for cisco.intersight.intersight_boot_order_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_boot_order_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_boot_order_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 9
  group: 6. BIOS, boot, firmware, memory and GPU
  sample_values_from: module EXAMPLES

intersight_boot_order_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  boot_devices:
    - device_type: Local Disk
      device_name: Boot-Lun
      controller_slot: MRAID
  configured_boot_mode: legacy
  description: Boot Order policy for COS
  name: COS-Boot
  organization: DevNet
  state: present
  tags:
    - Key: '{{ intersight_boot_order_policy_Key }}'
      Value: RCDN
  uefi_enable_secure_boot: null
  use_proxy: null
  validate_certs: true
