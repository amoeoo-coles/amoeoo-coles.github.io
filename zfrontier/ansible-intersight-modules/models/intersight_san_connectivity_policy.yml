---
# Data model for cisco.intersight.intersight_san_connectivity_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_san_connectivity_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_san_connectivity_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 96
  group: 4. Fibre Channel, SAN and vHBA
  sample_values_from: module EXAMPLES

intersight_san_connectivity_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: SAN connectivity policy for standalone servers
  name: standalone-san-policy
  organization: default
  placement_mode: null
  state: present
  static_wwnn_address: null
  tags:
    - Key: '{{ intersight_san_connectivity_policy_Key }}'
      Value: Production
    - Key: '{{ intersight_san_connectivity_policy_Key }}'
      Value: DataCenter-A
  target_platform: Standalone
  use_proxy: null
  validate_certs: true
  vhbas:
    - name: vhba0
      vhba_type: fc-initiator
      slot_id: '1'
      pci_link: 0
      uplink_port: 0
      pci_order: 0
      persistent_lun_bindings: false
      fibre_channel_network_policy: fc-network-policy
      fibre_channel_qos_policy: fc-qos-policy
      fibre_channel_adapter_policy: fc-adapter-policy
    - name: vhba1
      vhba_type: fc-nvme-initiator
      slot_id: '4'
      pci_link: 0
      uplink_port: 2
      pci_order: 5
      persistent_lun_bindings: true
      fibre_channel_network_policy: fc-network-policy
      fibre_channel_qos_policy: fc-qos-policy
      fibre_channel_adapter_policy: fc-adapter-policy
  wwnn_address_type: null
  wwnn_pool: null
