---
# Data model for cisco.intersight.intersight_multicast_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_multicast_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_multicast_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 80
  group: 3. Ethernet, LAN and vNIC
  sample_values_from: module EXAMPLES

intersight_multicast_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Multicast policy with IGMP querier enabled
  name: Multicast-Policy-Querier
  organization: default
  querier_ip_address: 192.0.2.1
  querier_ip_address_peer: 192.0.2.2
  querier_state: Enabled
  snooping_state: Enabled
  src_ip_proxy: Enabled
  state: present
  tags:
    - Key: '{{ intersight_multicast_policy_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
