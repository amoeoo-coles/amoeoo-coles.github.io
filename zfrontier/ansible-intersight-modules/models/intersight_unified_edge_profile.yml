---
# Data model for cisco.intersight.intersight_unified_edge_profile (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_unified_edge_profile
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_unified_edge_profile_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 122
  group: 1. Server, chassis and domain profiles
  sample_values_from: module EXAMPLES

intersight_unified_edge_profile:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  bios_policy: bios-edge-ai
  boot_order_policy: boot-uefi-nvme
  description: XE9305 compact edge inference server
  firmware_policy: null
  hardware_platform: xe9305
  ipmi_over_lan_policy: null
  kvm_policy: null
  lan_connectivity_policy: lan-edge-mgmt
  local_user_policy: null
  name: spt-xe9305-inference
  network_connectivity_policy: null
  ntp_policy: null
  organization: Edge-Sites
  power_policy: null
  snmp_policy: null
  ssh_policy: null
  state: present
  storage_policy: storage-edge-inference
  syslog_policy: null
  tags: null
  thermal_policy: null
  use_proxy: null
  validate_certs: true
