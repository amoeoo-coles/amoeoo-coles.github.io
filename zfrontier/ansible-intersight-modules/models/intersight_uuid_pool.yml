---
# Data model for cisco.intersight.intersight_uuid_pool (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_uuid_pool
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_uuid_pool_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 124
  group: 2. Pools and reservations
  sample_values_from: module EXAMPLES

intersight_uuid_pool:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  assignment_order: sequential
  description: UUID Pool for lab use
  name: lab-uuid-pool
  organization: DevNet
  prefix: 550E8400-E29B-41D4
  state: present
  tags:
    - Key: '{{ intersight_uuid_pool_Key }}'
      Value: RCDN
  use_proxy: null
  uuid_suffix_blocks:
    - from: A716-446655440000
      size: 100
    - from: A716-446655441000
      size: 200
  validate_certs: true
