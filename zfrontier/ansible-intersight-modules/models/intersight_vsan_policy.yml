---
# Data model for cisco.intersight.intersight_vsan_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_vsan_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vsan_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 134
  group: 4. Fibre Channel, SAN and vHBA
  sample_values_from: module EXAMPLES

intersight_vsan_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: VSAN policy for datacenter SAN infrastructure
  enable_trunking: false
  name: datacenter-vsan-policy
  organization: default
  state: present
  tags:
    - Key: '{{ intersight_vsan_policy_Key }}'
      Value: Production
    - Key: '{{ intersight_vsan_policy_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
  vsans:
    - name: vsan_uplink_100
      vsan_id: 100
      fcoe_vlan_id: 100
      vsan_scope: uplink
    - name: vsan_storage_200
      vsan_id: 200
      fcoe_vlan_id: 200
      vsan_scope: storage
    - name: vsan_common_300
      vsan_id: 300
      fcoe_vlan_id: 300
      vsan_scope: common
