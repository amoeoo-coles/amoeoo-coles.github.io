---
# Data model for cisco.intersight.intersight_vhba_template (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_vhba_template
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vhba_template_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 126
  group: 4. Fibre Channel, SAN and vHBA
  sample_values_from: module EXAMPLES

intersight_vhba_template:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Basic vHBA template for production servers
  enable_override: false
  fibre_channel_adapter_policy_name: fc-adapter-policy
  fibre_channel_network_policy_name: fc-network-policy
  fibre_channel_qos_policy_name: fc-qos-policy
  fibre_channel_zone_policy_names: null
  name: basic-vhba-template
  organization: default
  persistent_bindings: false
  pin_group_name: null
  state: present
  switch_id: A
  tags:
    - Key: '{{ intersight_vhba_template_Key }}'
      Value: Production
    - Key: '{{ intersight_vhba_template_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
  vhba_type: fc-initiator
  wwpn_pool_name: default-wwpn-pool
