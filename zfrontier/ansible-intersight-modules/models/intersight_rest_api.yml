---
# Data model for cisco.intersight.intersight_rest_api (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_rest_api
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_rest_api_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 95
  group: 9. Organization, target claim and generic API
  sample_values_from: module EXAMPLES

intersight_rest_api:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_body:
    Name: vmedia-localdisk
    ConfiguredBootMode: Legacy
    BootDevices:
      - ObjectType: boot.VirtualMedia
        Enabled: true
        Name: remote-vmedia
        Subtype: cimc-mapped-dvd
      - ObjectType: boot.LocalDisk
        Enabled: true
        Name: localdisk
        Slot: MRAID
        Bootloader: null
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  list_body: null
  query_params:
    $filter: Name eq 'vmedia-localdisk'
  resource_path: /boot/PrecisionPolicies
  return_list: null
  state: present
  update_method: null
  use_proxy: null
  validate_certs: true
