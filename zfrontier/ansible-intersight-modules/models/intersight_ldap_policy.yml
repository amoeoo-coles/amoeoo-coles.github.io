---
# Data model for cisco.intersight.intersight_ldap_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_ldap_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ldap_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 64
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_ldap_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  attribute: CiscoAvPair
  base_dn: dc=example,dc=com
  bind_dn: null
  bind_method: logincredentials
  description: LDAP policy using DNS for server discovery
  dns_source: configured
  domain: example.com
  enable_dns: true
  enable_encryption: true
  enable_ldap: true
  filter: sAMAccountName
  group_attribute: memberOf
  group_authorization: true
  ldap_groups:
    - name: admin-group
      group_dn: cn=admins,ou=groups,dc=example,dc=com
      domain: example.com
      role: admin
    - name: readonly-group
      group_dn: cn=readers,ou=groups,dc=example,dc=com
      role: readonly
  ldap_providers: null
  name: ldap-dns-policy
  nested_group_search: true
  nested_group_search_depth: 64
  organization: default
  password: '{{ intersight_ldap_policy_password }}'
  search_domain: example.com
  search_forest: example.com
  state: present
  tags:
    - Key: '{{ intersight_ldap_policy_Key }}'
      Value: Production
  timeout: 30
  use_proxy: null
  user_search_precedence: localuserdb
  validate_certs: true
