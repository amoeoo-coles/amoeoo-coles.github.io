---
# Data model for cisco.intersight.intersight_power_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_power_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_power_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 91
  group: 8. Management, access, users and services
  sample_values_from: module EXAMPLES

intersight_power_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Power policy for standalone servers, restores to last state.
  dynamic_power_rebalancing: null
  extended_power_capacity: null
  name: Standalone-Server-Power-Policy
  organization: null
  power_allocation: null
  power_priority: null
  power_profiling: null
  power_redundancy: null
  power_restore: LastState
  power_save_mode: null
  processor_package_power_limit: Minimum
  state: present
  tags:
    - Key: '{{ intersight_power_policy_Key }}'
      Value: DevOps
  target_platform: Standalone
  use_proxy: null
  validate_certs: true
