---
# Data model for cisco.intersight.intersight_ai_storage_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_ai_storage_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_ai_storage_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 3
  group: 7. Storage and drive security
  sample_values_from: module EXAMPLES

intersight_ai_storage_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: NVMe direct-attach for model weight storage
  m2_boot_enabled: null
  name: storage-ai-inference
  nvme_mode: null
  nvme_slots: null
  organization: AI-Factory
  raid_level: null
  read_policy: null
  state: present
  storage_profile: inference_optimized
  tags: null
  use_proxy: null
  validate_certs: true
  write_policy: null
