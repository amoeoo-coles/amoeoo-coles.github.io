---
# Data model for cisco.intersight.intersight_vnic_template (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_vnic_template
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_vnic_template_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 132
  group: 3. Ethernet, LAN and vNIC
  sample_values_from: module EXAMPLES

intersight_vnic_template:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  cdn_source: vnic
  cdn_value: null
  connection_type: none
  description: Basic vNIC template for production servers
  enable_override: false
  eth_adapter_policy_name: default-adapter-policy
  eth_qos_policy_name: default-qos-policy
  fabric_eth_network_control_policy_name: default-network-control
  fabric_eth_network_group_policy_name: default-network-group
  failover_enabled: false
  iscsi_boot_policy_name: null
  mac_pool_name: default-mac-pool
  name: basic-vnic-template
  organization: default
  pin_group_name: null
  sriov_settings: null
  state: present
  switch_id: A
  tags:
    - Key: '{{ intersight_vnic_template_Key }}'
      Value: Production
    - Key: '{{ intersight_vnic_template_Key }}'
      Value: DataCenter-A
  use_proxy: null
  usnic_settings: null
  validate_certs: true
  vmq_settings: null
