---
# Data model for cisco.intersight.intersight_network_connectivity_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_network_connectivity_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_network_connectivity_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 82
  group: 3. Ethernet, LAN and vNIC
  sample_values_from: module EXAMPLES

intersight_network_connectivity_policy:
  alternate_ipv4_dns_server: null
  alternate_ipv6_dns_server: null
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  description: Network connectivity policy with Dynamic DNS
  dynamic_dns_domain: company.com
  enable_dynamic_dns: true
  enable_ipv4_dns_from_dhcp: true
  enable_ipv6: true
  enable_ipv6_dns_from_dhcp: true
  name: DynamicDNS-Policy
  organization: default
  preferred_ipv4_dns_server: null
  preferred_ipv6_dns_server: null
  state: present
  tags:
    - Key: '{{ intersight_network_connectivity_policy_Key }}'
      Value: DataCenter-A
  use_proxy: null
  validate_certs: true
