---
# Data model for cisco.intersight.intersight_iscsi_adapter_policy (cisco.intersight 2.23.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.intersight.intersight_iscsi_adapter_policy
  collection: cisco.intersight
  collection_version: 2.23.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/intersight/intersight_iscsi_adapter_policy_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/intersight/
  module_type: config (state)
  build_order: 54
  group: 5. iSCSI
  sample_values_from: module EXAMPLES

intersight_iscsi_adapter_policy:
  api_bearer_token: '{{ intersight_api_bearer_token }}'
  api_key_id: '{{ intersight_api_key_id }}'
  api_private_key: '{{ intersight_api_private_key }}'
  api_uri: https://intersight.example.com
  connection_time_out: null
  description: iSCSI adapter policy with default timeout values
  dhcp_timeout: null
  lun_busy_retry_count: null
  name: iscsi-adapter-default
  organization: default
  state: present
  tags: null
  use_proxy: null
  validate_certs: true
