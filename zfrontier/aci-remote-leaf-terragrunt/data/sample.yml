    spine_p2p: 192.0.2.0/30
    rl1_p2p: 192.0.2.4/30
    rl2_p2p: 192.0.2.8/30
    ospf_area: 0.0.0.0
  form-rl-mtu-prereq:
    jumbo_mtu: '9216'
    relay_target: 198.51.100.1
    rtt_note: not collected
  form-dp-vpc-rl:
