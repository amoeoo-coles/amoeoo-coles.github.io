    rl2_name: rl-202
    rl1_id: '201'
    rl2_id: '202'
    rl1_serial: SALEXRL201
    rl2_serial: SALEXRL202
    pod_id: '1'
    ext_pool_id: '1'
    vpc_group_id: '201'
