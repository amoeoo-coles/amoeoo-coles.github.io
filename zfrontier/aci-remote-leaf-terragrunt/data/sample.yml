# Example / documentation addressing only. Do not apply unchanged.
# Consumed in Terragrunt units with:
#   locals { model = yamldecode(file("${get_repo_root()}/data/sample.yml")) }
# Credentials are never stored in this file.
meta:
  description: Example ACI Remote Leaf fabric for the Terraform workbench. Documentation
    and lab prefixes only.
  addressing: RFC 5737 (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) and RFC 1918
    198.51.100.0/8 examples. Replace before apply.
  credentials: Never stored here. Use var.apic_password, var.ndo_password, var.nxos_password
    or {{ ndo_password }} in CI.
remote_leaf:
  pod_id: '1'
  rl_tep: 198.51.100.0/16
  rl1_id: '201'
  rl2_id: '202'
forms:
  form-tg-root:
    tg_state_address: https://state.example.invalid/states
    tg_lock_method: POST
    tg_provider_path: provider.tf
    tg_backend_path: backend.tf
    tg_required_version: '>= 1.5.0'
  form-tg-envcommon:
    tg_env: lab
    tg_lab_apic: https://apic.lab.example.invalid
    tg_prod_apic: https://apic.prod.example.invalid
    tg_ndo_url: https://nd.example.invalid
    tg_module_ref: v1.0.0
  form-tg-units:
    tg_env: lab
    tg_location: main-site
    tg_unit: infra
    tg_source_local: ${get_repo_root()}/modules/infra
  form-tg-deps:
    tg_env: lab
    tg_location: main-site
    tg_infra_path: ../../shared/infra
    tg_wan_path: ../../shared/ipn
    tg_mock_tep: 198.51.100.0/16
    tg_mock_wan_vrf: ACI-IPN
  form-tg-runall:
    tg_env: lab
    tg_working_dir: live
    tg_plan_flags: -input=false -detailed-exitcode
    tg_lock: enabled
  form-tg-troubleshoot:
    tg_env: lab
    tg_cache_dir: .terragrunt-cache
    tg_unit_from: shared/infra
    tg_unit_to: main-site/infra
  form-rl-tep-plan:
