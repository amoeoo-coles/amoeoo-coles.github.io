# YAML data model for nxos_isis
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 011 (2. Underlay)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_isis
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/isis
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_isis/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 11
  group: 2. Underlay

nxos_isis:
  # admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  admin_state: enabled
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # instances: map of objects, optional. List of IS-IS instances. - Map key: `name` - IS-IS instance name.
  instances:
    ISIS1:
      admin_state: enabled
      control: stateful-ha
      flush_routes: true
      isolate: true
      vrfs:
        default:
          address_families:
            v4:
              control: adj-check
              default_information_originate: 'on'
              default_information_originate_route_map: rm1
              distance: 100
              distributions:
                l2:
                  all: null
                  destination_level: l1
                  route_map: RM_DISTRIBUTE
              enable_bfd: false
              max_ecmp: 4
              multi_topology: st
              prefix_advertise_passive_l1: true
              prefix_advertise_passive_l2: true
              redistributions:
                direct;none;none:
                  route_map: RM_REDIST
                  scope: inter
                  srv6_prefix_type: unspecified
              router_id_interface: lo0
              router_id_ip_address: null
              segment_routing_mpls: true
              summary_addresses:
                10.0.0.0/8:
                  level: l2
              table_map: rm1
              table_map_filter: enabled
          admin_state: enabled
          authentication_check_l1: false
          authentication_check_l2: false
          authentication_key_l1: null
          authentication_key_l1_wo_version: null
          authentication_key_l2: null
          authentication_key_l2_wo_version: null
          authentication_type_l1: unknown
          authentication_type_l2: unknown
          bandwidth_reference: 400000
          bandwidth_reference_unit: mbps
          control: log-adj-changes
          graceful_restart_admin_state: disabled
          graceful_restart_t3_interval: 120
          is_type: l2
          levels:
            l2:
              control: fast-converge
              lsp_generation_initial_interval: 70
              lsp_generation_max_interval: 6000
              lsp_generation_second_interval: 70
              spf_initial_interval: 60
              spf_max_interval: 5000
              spf_second_interval: 60
          lsp_lifetime: 1000
          metric_type: wide
          mtu: 2000
          net: 49.0001.0000.0000.3333.00
          overload_admin_state: always-on
          overload_bgp_as_number: 100
          overload_bgp_as_number_string: '100'
          overload_startup_time: 60
          overload_suppress: interlevel
          passive_default: l12
          queue_limit: 3000
  # interfaces: map of objects, optional. List of IS-IS interfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1`.
  interfaces:
    eth1/10:
      admin_state: enabled
      authentication_check: false
      authentication_check_l1: false
      authentication_check_l2: false
      authentication_key: null
      authentication_key_l1: null
      authentication_key_l1_wo_version: null
      authentication_key_l2: null
      authentication_key_l2_wo_version: null
      authentication_key_wo_version: null
      authentication_type: unknown
      authentication_type_l1: unknown
      authentication_type_l2: unknown
      circuit_type: l2
      control: advert-tep
      csnp_interval_l1: 30
      csnp_interval_l2: 30
      description: ISIS interface
      enable_ipv4: true
      hello_interval: 20
      hello_interval_l1: 20
      hello_interval_l2: 20
      hello_multiplier: 4
      hello_multiplier_l1: 4
      hello_multiplier_l2: 4
      hello_padding: never
      instance_name: ISIS1
      ipv4_bfd: enabled
      ipv6: true
      ipv6_bfd: enabled
      ipv6_metric_l1: 1000
      ipv6_metric_l2: 1000
      lsp_refresh_interval: 100
      mesh_group_blocked: null
      mesh_group_id: 10
      metric_l1: 1000
      metric_l2: 1000
      mtu_check: true
      mtu_check_l1: true
      mtu_check_l2: true
      n_flag_clear: true
      network_type_p2p: 'on'
      passive: l1
      priority_l1: 80
      priority_l2: 80
      retransmit_interval: 10
      retransmit_throttle_interval: 100
      suppressed_state: true
      vrf: default
