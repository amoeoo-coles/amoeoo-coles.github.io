# YAML data model for nxos_cli
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 040 (7. Day 2 and operations)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_cli
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/cli
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_cli/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 40
  group: 7. Day 2 and operations

nxos_cli:
  # cli: string, required. The CLI commands to send to the device. Multi-line strings are supported, with each line being sent as a separate command.
  cli: |-
    <<-EOT
      interface loopback123
      description configured-via-cli
      EOT
  # device: string, optional. A device name from the provider configuration.
  device: null
