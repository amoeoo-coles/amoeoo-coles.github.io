# YAML data model for ndfc_fabric_ipfm
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 046 (8. Other)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_fabric_ipfm
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/fabric_ipfm
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_fabric_ipfm/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 46
  group: 8. Other

ndfc_fabric_ipfm:
  # aaa_remote_ip_enabled: bool, optional. Enable only, when IP Authorization is enabled in the AAA \ Server
  aaa_remote_ip_enabled: false
  # aaa_server_conf: string, optional. AAA Configurations
  aaa_server_conf: null
  # active_migration: bool, optional. Active Migration
  active_migration: null
  # agent_intf: string, optional. Interface to connect to Agent
  agent_intf: null
  # asm_group_ranges: string, optional. ASM group ranges with prefixes (len:4-32) example: 239.1.1.0/25, max 20 ranges. Enabling SPT-Threshold Infinity to prevent switchover to source-tree.
  asm_group_ranges: null
  # bootstrap_conf: string, optional. Additional CLIs required during device bootup/login e.g. AAA/Radius
  bootstrap_conf: null
  # bootstrap_enable: bool, optional. Automatic IP Assignment For POAP
  bootstrap_enable: false
  # bootstrap_multisubnet: string, optional. DHCPv4 Multi Subnet Scope - lines with # prefix are ignored here
  bootstrap_multisubnet: '#Scope_Start_IP, Scope_End_IP, Scope_Default_Gateway, Scope_Subnet_Prefix'
  # brfield_debug_flag: string, optional. Only for brf debugging purpose !!!
  brfield_debug_flag: null
  # cdp_enable: bool, optional. Enable CDP on management interface
  cdp_enable: false
  # deploy: bool, required. This flag does configuration save and deploy
  deploy: false
  # deployment_freeze: bool, optional. Disable all deployments in this fabric
  deployment_freeze: null
  # dhcp_enable: bool, optional. Automatic IP Assignment For POAP From Local DHCP Server
  dhcp_enable: false
  # dhcp_end: string, optional. End Address For Switch Out-of-Band POAP
  dhcp_end: null
  # dhcp_ipv6_enable: string, optional. No description available
  dhcp_ipv6_enable: null
  # dhcp_start: string, optional. Start Address For Switch Out-of-Band POAP
  dhcp_start: null
  # dns_server_ip_list: string, optional. Comma separated list of IP Addresses (v4/v6)
  dns_server_ip_list: null
  # dns_server_vrf: string, optional. One VRF for all DNS servers or a comma separated list of VRFs, one per DNS server
  dns_server_vrf: null
  # enable_aaa: bool, optional. Include AAA configs from Manageability tab during device bootup
  enable_aaa: false
  # enable_agent: bool, optional. Enable Agent (development purpose only)
  enable_agent: null
  # enable_asm: bool, optional. Enable groups with receivers sending (*,G) joins
  enable_asm: false
  # enable_nbm_passive: bool, optional. Enable NBM mode to pim-passive for default VRF
  enable_nbm_passive: false
  # enable_nxapi: bool, optional. Enable HTTPS NX-API
  enable_nxapi: null
  # enable_nxapi_http: bool, optional. Enable HTTP NX-API
  enable_nxapi_http: null
  # enable_rt_intf_stats: bool, optional. Valid for NX-OS only
  enable_rt_intf_stats: null
  # ext_fabric_type: string, optional. External Fabric Type
  ext_fabric_type: null
  # extra_conf_intra_links: string, optional. Additional CLIs For All Intra-Fabric Links
  extra_conf_intra_links: null
  # extra_conf_leaf: string, optional. Additional CLIs For All Leafs and Tier2 Leafs As Captured From Show Running Configuration
  extra_conf_leaf: null
  # extra_conf_spine: string, optional. Additional CLIs For All Spines As Captured From Show Running Configuration
  extra_conf_spine: null
  # fabric_mtu: number, optional. Must be an even number
  fabric_mtu: 9216
  # fabric_name: string, required. Fabric name to be created, updated or deleted.
  fabric_name: IP_FABRIC_MEDIA
  # feature_ptp: bool, optional. Enable Precision Time Protocol (PTP)
  feature_ptp: false
  # ff: string, optional. Template Family
  ff: null
  # grfield_debug_flag: string, optional. Enable to clean switch configuration without reload when PreserveConfig=no
  grfield_debug_flag: null
  # intf_stat_load_interval: number, optional. Time in seconds (Min:5, Max:300)
  intf_stat_load_interval: null
  # isis_auth_enable: bool, optional. Enable IS-IS Authentication
  isis_auth_enable: false
  # isis_auth_key: string, optional, sensitive (set via variable). Cisco Type 7 Encrypted
  isis_auth_key: null
  # isis_auth_keychain_key_id: number, optional. IS-IS Authentication Key ID (Min:0, Max:65535)
  isis_auth_keychain_key_id: null
  # isis_auth_keychain_name: string, optional. IS-IS Authentication Keychain Name
  isis_auth_keychain_name: null
  # isis_level: string, optional. Supported IS types: level-1, level-2
  isis_level: level-2
  # isis_p2p_enable: bool, optional. This will enable network point-to-point on fabric interfaces which are numbered
  isis_p2p_enable: null
  # l2_host_intf_mtu: number, optional. Must be an even number
  l2_host_intf_mtu: 9216
  # link_state_routing: string, optional. Used for Spine-Leaf Connectivity
  link_state_routing: ospf
  # link_state_routing_tag: string, optional. Routing process tag for the fabric
  link_state_routing_tag: '1'
  # loopback0_ip_range: string, optional. Routing Loopback IP Address Range
  loopback0_ip_range: 10.2.0.0/22
  # mgmt_gw: string, optional. Default Gateway For Management VRF On The Switch
  mgmt_gw: null
  # mgmt_prefix: number, optional. Switch Mgmt IP Subnet Prefix (Min:8, Max:30)
  mgmt_prefix: null
  # ntp_server_ip_list: string, optional. Comma separated list of IP Addresses (v4/v6)
  ntp_server_ip_list: null
  # ntp_server_vrf: string, optional. One VRF for all NTP servers or a comma separated list of VRFs, one per NTP server
  ntp_server_vrf: null
  # nxapi_http_port: number, optional. NX-API HTTP Port Number
  nxapi_http_port: null
  # nxapi_https_port: number, optional. NX-API HTTPS Port Number
  nxapi_https_port: null
  # nxapi_vrf: string, optional. VRF used for NX-API communication
  nxapi_vrf: management
  # ospf_area_id: string, optional. OSPF Area Id in IP address format
  ospf_area_id: 0.0.0.0
  # ospf_auth_enable: bool, optional. Enable OSPF Authentication
  ospf_auth_enable: false
  # ospf_auth_key: string, optional, sensitive (set via variable). 3DES Encrypted
  ospf_auth_key: null
  # ospf_auth_key_id: number, optional. No description available
  ospf_auth_key_id: null
  # pim_hello_auth_enable: bool, optional. Enable PIM Hello Authentication
  pim_hello_auth_enable: false
  # pim_hello_auth_key: string, optional, sensitive (set via variable). 3DES Encrypted
  pim_hello_auth_key: null
  # pm_enable: bool, optional. Enable Performance Monitoring
  pm_enable: false
  # power_redundancy_mode: string, optional. Default power supply mode for the fabric
  power_redundancy_mode: ps-redundant
  # ptp_domain_id: number, optional. Multiple Independent PTP Clocking Subdomains on a Single Network (Min:0, Max:127)
  ptp_domain_id: null
  # ptp_lb_id: number, optional. No description available
  ptp_lb_id: null
  # ptp_profile: string, optional. Enabled on ISL links only
  ptp_profile: null
  # replication_mode: string, optional. Replication Mode
  replication_mode: null
  # routing_lb_id: number, optional. No description available
  routing_lb_id: 0
  # rp_ip_range: string, optional. RP Loopback IP Address Range
  rp_ip_range: null
  # rp_lb_id: number, optional. No description available
  rp_lb_id: null
  # snmp_server_host_trap: bool, optional. Configure NDFC as a receiver for SNMP traps
  snmp_server_host_trap: true
  # static_underlay_ip_alloc: bool, optional. Checking this will disable Dynamic Fabric IP Address Allocations
  static_underlay_ip_alloc: false
  # subnet_range: string, optional. Address range to assign Numbered IPs
  subnet_range: 10.4.0.0/16
  # subnet_target_mask: number, optional. Mask for Fabric Subnet IP Range
  subnet_target_mask: 30
  # syslog_server_ip_list: string, optional. Comma separated list of IP Addresses (v4/v6)
  syslog_server_ip_list: null
  # syslog_server_vrf: string, optional. One VRF for all Syslog servers or a comma separated list of VRFs, one per Syslog server
  syslog_server_vrf: null
  # syslog_sev: string, optional. Comma separated list of Syslog severity values, one per Syslog server (Min:0, Max:7)
  syslog_sev: null
