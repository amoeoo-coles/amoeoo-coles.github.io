# YAML data model for ndfc_configuration_deploy
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 045 (7. Day 2 and operations)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_configuration_deploy
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/configuration_deploy
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_configuration_deploy/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 45
  group: 7. Day 2 and operations

ndfc_configuration_deploy:
  # always_execute: bool, optional. When set to false (default), the chosen operations (recalculate or deploy, whichever is set to true) are executed only once and not executed on subsequent terr…
  always_execute: false
  # deploy: bool, optional. Perform deploy operation when true.
  deploy: true
  # fabric_name: string, required. The name of the fabric
  fabric_name: CML
  # recalculate: bool, optional. Perform recalculate operation when true; also known as config-save in API.
  recalculate: true
  # serial_numbers: [set,  string], optional. Value 'ALL' if all switches in the fabric are to be deployed, or a list of serial numbers of the switches to be deployed.
  serial_numbers:
  - ALL
