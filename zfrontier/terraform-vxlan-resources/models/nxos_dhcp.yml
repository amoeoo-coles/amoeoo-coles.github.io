# YAML data model for nxos_dhcp
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 026 (5. Networks and L2VNI)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_dhcp
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/dhcp
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_dhcp/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 26
  group: 5. Networks and L2VNI

nxos_dhcp:
  # admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  admin_state: enabled
  # dai_interfaces: map of objects, optional. List of Dynamic ARP Inspection interfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1`.
  dai_interfaces:
    eth1/12:
      name: DAI1
      trust: true
  # dai_log_buffer_entries: number, optional. DAI Log Buffer Entries. - Range: `1`-`1024`
  dai_log_buffer_entries: 64
  # dai_validate_destination: bool, optional. DAI Validate Type: dst-mac.
  dai_validate_destination: true
  # dai_validate_ip: bool, optional. DAI Validate Type: ip.
  dai_validate_ip: true
  # dai_validate_source: bool, optional. DAI Validate Type: src-mac.
  dai_validate_source: true
  # dai_vlans: map of objects, optional. List of VLANs with Dynamic ARP Inspection enabled (`ip arp inspection vlan`). Requires the `arp-ether` TCAM region. - Map key: `vlan_id` - DAI Vlan Number. - K…
  dai_vlans:
    '101':
      log_type: permit
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # ip_source_bindings: map of objects, optional. List of static IP source bindings (`ip source binding`). - Map key format: `<ip>;<vlan_id>;<mac>;<interface_id>` - Key component `ip`: IP Source Biinding Vlan…
  ip_source_bindings:
    198.51.100.1;101;00:00:11:11:22:22;eth1/12: {}
  # ip_source_guard_excluded_vlans: map of objects, optional. List of VLANs excluded from IP Source Guard (`ip dhcp snooping ipsg-excluded vlan`). - Map key: `vlan_id` - Vlan Number to be ecluded from IPSG. - Key range: `…
  ip_source_guard_excluded_vlans:
    '102': {}
  # ip_source_guard_interfaces: map of objects, optional. List of IP Source Guard interfaces (`ip verify source dhcp-snooping-vlan`). Requires the `ipsg` TCAM region. - Map key: `interface_id` - Must match first field…
  ip_source_guard_interfaces:
    eth1/12:
      ip_source_guard: true
      name: IPSG1
  # ipv6_relay_information_option_vpn: bool, optional. IPv6 Relay Information Option Vpn Enabled.
  ipv6_relay_information_option_vpn: true
  # ipv6_relay_option79: bool, optional. IPv6 Relay Option79 Enabled.
  ipv6_relay_option79: true
  # ipv6_relay_option_type_cisco: bool, optional. IPv6 Relay Sub-Option Type Cisco Enabled.
  ipv6_relay_option_type_cisco: true
  # ipv6_source_interface: string, optional. Global Source Interface.
  ipv6_source_interface: lo1
  # ipv6_source_interface_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  ipv6_source_interface_admin_state: enabled
  # packet_strict_validation: bool, optional. Pkt Strict Validation.
  packet_strict_validation: true
  # relay_dai: bool, optional. Dynamic ARP Inspection functionality with DHCP Relay is enabled.
  relay_dai: true
  # relay_information_option: bool, optional. Relay Information Option Enabled.
  relay_information_option: true
  # relay_information_option_server_id_override: number, optional. Relay Information Option Server-id-override-disable Enabled. - Range: `0`-`1`
  relay_information_option_server_id_override: 1
  # relay_information_option_trust: bool, optional. Relay Information Option Trust Enabled.
  relay_information_option_trust: true
  # relay_information_option_vpn: bool, optional. Relay Information Option Vpn Enabled.
  relay_information_option_vpn: true
  # relay_information_trust_all: bool, optional. Relay Information Trust All Enabled.
  relay_information_trust_all: true
  # relay_interfaces: map of objects, optional. List of DHCP relay interfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1`.
  relay_interfaces:
    eth1/10:
      addresses:
        VRF1;198.51.100.15:
          counter: 1
      information_trusted: true
      ipv6_addresses:
        VRF1;ff02::1:2;eth1/11:
          counter: 1
      ipv6_source_interface: lo1
      options: relay-info
      smart_relay: true
      source_interface: lo1
      subnet_broadcast: true
      subnet_selection: null
      v6_smart_relay: false
  # relay_sub_option_circuit_id_customized: bool, optional. Relay Sub-Option Circuit-id Customized Enabled.
  relay_sub_option_circuit_id_customized: true
  # relay_sub_option_circuit_id_format_string: string, optional. Relay Sub-Option Circuit-id Format String.
  relay_sub_option_circuit_id_format_string: '%p'
  # relay_sub_option_format_non_tlv: bool, optional. Relay Option82 Sub-Option Format Non-TLV Enabled.
  relay_sub_option_format_non_tlv: true
  # relay_sub_option_type_cisco: bool, optional. Relay Sub-Option Type Cisco Enabled.
  relay_sub_option_type_cisco: true
  # relay_v4_over_v6: bool, optional. v4 over v6 relay transport.
  relay_v4_over_v6: true
  # relay_v6_iapd_route_add: bool, optional. DHCPv6 IAPD route addition.
  relay_v6_iapd_route_add: true
  # smart_relay_global: bool, optional. Smart Relay Global Enabled.
  smart_relay_global: true
  # snoop_sub_option_circuit_id_format_string: string, optional. Snoop Sub-Option Circuit-id Format String.
  snoop_sub_option_circuit_id_format_string: '%p'
  # snooping: bool, optional. Snooping Enabled.
  snooping: true
  # snooping_information_option: bool, optional. Snooping Information Option Enabled.
  snooping_information_option: true
  # snooping_interfaces: map of objects, optional. List of DHCP snooping interfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1`.
  snooping_interfaces:
    eth1/12:
      trust: true
  # snooping_sub_option_format_non_tlv: bool, optional. Snooping Option82 Sub-Option Format Non-TLV Enabled.
  snooping_sub_option_format_non_tlv: true
  # snooping_verify_mac_address: bool, optional. Snooping Verify Mac Address Enabled.
  snooping_verify_mac_address: false
  # snooping_vlans: map of objects, optional. List of VLANs with DHCP snooping enabled (`ip dhcp snooping vlan`). - Map key: `vlan_id` - Snoop Vlan Number. - Key range: `0`-`65535`
  snooping_vlans:
    '101':
      evpn: null
  # source_interface: string, optional. Global Source Interface.
  source_interface: lo1
  # v4_relay: bool, optional. DHCPv4 Enabled.
  v4_relay: true
  # v6_relay: bool, optional. DHCPv6 Enabled.
  v6_relay: true
  # v6_smart_relay_global: bool, optional. V6 Smart Relay Global Enabled.
  v6_smart_relay_global: true
