# YAML data model for nxos_subinterface
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 031 (6. Interfaces and access)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_subinterface
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/subinterface
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_subinterface/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 31
  group: 6. Interfaces and access

nxos_subinterface:
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # subinterfaces: map of objects, optional. List of subinterfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1.10`.
  subinterfaces:
    eth1/10.124:
      admin_state: down
      bandwidth: 1000
      delay: 10
      description: My Description
      encap: vlan-124
      link_logging: enable
      medium: broadcast
      mtu: 1500
      mtu_inherit: false
      router_mac: AA:BB:CC:DD:EE:FF
      router_mac_ipv6_extract: disable
      snmp_trap: disable
      vrf_dn: sys/inst-VRF123
