# YAML data model for ndfc_interface_vpc
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 036 (6. Interfaces and access)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_interface_vpc
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/interface_vpc
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_interface_vpc/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 36
  group: 6. Interfaces and access

ndfc_interface_vpc:
  # deploy: bool, optional. Deploy the configuration
  deploy: true
  # interfaces: map of objects, required. interfaces to configure
  interfaces:
    vPC1:
      admin_state: false
      bpdu_guard: 'true'
      copy_po_description: false
      interface_name: vPC1
      mtu: default
      netflow: false
      netflow_monitor: MON1
      netflow_sampler: SAMPLER1
      peer1_allowed_vlans: 10-20
      peer1_member_interfaces: eth1/15
      peer1_native_vlan: 1
      peer1_po_description: My interface description
      peer1_po_freeform_config: delay 200
      peer1_port_channel_id: 120
      peer2_allowed_vlans: 10-20
      peer2_member_interfaces: eth1/15
      peer2_native_vlan: 1
      peer2_po_description: My interface description
      peer2_po_freeform_config: delay 200
      peer2_port_channel_id: 120
      port_type_fast: false
      portchannel_mode: 'on'
      serial_number: null
      speed: Auto
  # policy: string, optional. "Name of the policy. Supported policies: * `int_vpc_access_host` * `int_vpc_dot1q_tunnel` * `int_vpc_pvlan_host` * `int_vpc_trunk_host`"
  policy: int_vpc_trunk_host
  # serial_number: string, optional. Serial number of switch to configure
  serial_number: 9TQYTJSZ1VJ~9Q34PHYLDB5
