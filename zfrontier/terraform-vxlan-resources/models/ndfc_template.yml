# YAML data model for ndfc_template
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 042 (7. Day 2 and operations)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_template
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/template
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_template/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 42
  group: 7. Day 2 and operations

ndfc_template:
  # content_type: string, optional. Type of the template content
  content_type: CLI
  # description: string, optional. Description of the template
  description: This is a template
  # supported_platforms: string, optional. Supported platforms for the template
  supported_platforms: All
  # tags: [set,  string], optional. Tags for the template
  tags:
  - key1
  - value1
  # template_content: string, required. Content for the template
  # not collected: no provider example. Minimal skeleton only, because the provider requires the text to start with '##template variables'.
  template_content: |
    ##template variables
    ##
    ##template content
    ##
  # template_name: string, required. Name of the template
  template_name: template1
  # template_sub_type: string, required. Sub type of the template
  template_sub_type: CONFIG
  # template_type: string, optional. Type of the template
  template_type: CLI
