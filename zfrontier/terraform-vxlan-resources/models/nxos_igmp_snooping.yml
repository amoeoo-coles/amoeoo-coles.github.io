# YAML data model for nxos_igmp_snooping
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 025 (5. Networks and L2VNI)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_igmp_snooping
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/igmp_snooping
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_igmp_snooping/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 25
  group: 5. Networks and L2VNI

nxos_igmp_snooping:
  # admin_state: string, optional. The administrative state of IGMP snooping. Some NX-OS versions (e.g. 10.6.4) reject modifying this attribute, in which case it should not be configured. - Choi…
  admin_state: null
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # domain_control: string, optional. IGMP snooping domain controls (querier, opt-flood, routing). - Choices: `querier`, `opt-flood`, `routing`
  domain_control: opt-flood
  # domain_name: string, optional. IGMP snooping domain object name.
  domain_name: default
  # global_vlan_disable_nve_static_router_port: bool, optional. Disable NVE static router port for IGMP snooping.
  global_vlan_disable_nve_static_router_port: false
  # global_vlan_vxlan: bool, optional. Enable IGMP snooping on all VXLAN VLANs.
  global_vlan_vxlan: true
  # global_vlan_vxlan_umc_drop_vlan: string, optional. Drop unknown multicast traffic on VXLAN VLAN range (e.g. 1-3967).
  global_vlan_vxlan_umc_drop_vlan: 100-200
  # instance_admin_state: string, optional. The administrative state of the IGMP snooping instance. - Choices: `enabled`, `disabled`
  instance_admin_state: enabled
  # instance_control: string, optional. IGMP snooping instance control flags. - Choices: `stateful-ha`
  instance_control: stateful-ha
  # vlans: map of objects, optional. List of per-VLAN IGMP snooping configurations (`vlan configuration <id>`). - Map key: `vlan_id` - Vlan ID for IGMP Snooping Configuration. Example: `vlan100`.
  vlans:
    vlan3901:
      access_group_description: My access group description
      access_group_direction: in
      access_group_name: access-group
      access_group_route_map: RM1
      explicit_tracking: false
      fast_leave: true
      group_timeout: 300
      igmp_snooping: false
      igmp_source_ip_proxy: false
      last_member_query_interval: 2
      link_local_groups_suppression: false
      lookup_mac: true
      max_general_query_miss: 4
      mrouter_interfaces:
        eth1/10: {}
      proxy_leave_use_group_address: true
      proxy_max_response_time: 10
      querier_address: 198.51.100.1
      querier_description: My querier description
      querier_name: querier
      querier_timeout: 300
      query_flood: false
      query_interval: 200
      query_max_response_time: 20
      report_flood_all_interfaces: true
      report_flood_interfaces:
        eth1/12:
          description: My description
          name: report-flood
          report_flood: true
      report_suppression: false
      robustness_variable: 3
      startup_query_count: 3
      startup_query_interval: 40
      static_groups:
        239.1.1.1:
          interfaces:
            eth1/11: {}
          name: group1
          sources:
            198.51.100.5:
              interfaces:
                eth1/11: {}
      v3_report_suppression: true
      version: v3
