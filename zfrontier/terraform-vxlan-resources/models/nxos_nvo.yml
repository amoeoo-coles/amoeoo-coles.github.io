# YAML data model for nxos_nvo
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 016 (3. VTEP and overlay)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_nvo
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/nvo
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_nvo/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 16
  group: 3. VTEP and overlay

nxos_nvo:
  # advertise_evpn_multicast_state: string, optional. Advertise EVPN Multicast State. - Choices: `enabled`
  advertise_evpn_multicast_state: enabled
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # evpn_multihoming_delay_restore_time: number, optional. Ethernet segment delay restore time in seconds. - Range: `30`-`1000` - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_delay_restore_time: null
  # evpn_multihoming_df_election_mode: string, optional. DF election mode for all Ethernet segments. - Choices: `perFlow`, `modulo` - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_df_election_mode: null
  # evpn_multihoming_df_election_time: string, optional. DF election time for EVPN multihoming. Only one fractional digit supported. - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_df_election_time: null
  # evpn_multihoming_ead_evi_route: bool, optional. Advertise EAD/EVI route for ESI. - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_ead_evi_route: null
  # evpn_multihoming_frr_anycast_source_ip: string, optional. Fast reroute anycast source IP address. - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_frr_anycast_source_ip: null
  # evpn_multihoming_state: string, optional. Configures the state of EVPN MultiHoming. - Choices: `disabled`, `enabled` - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_state: null
  # evpn_multihoming_system_mac: string, optional. Global system MAC address to be used by Ethernet segments configured under port-channels. - Minimum NX-OS version: `10.6(1)`
  evpn_multihoming_system_mac: null
  # evpn_multisite_border_gateway_dci_advertise_pip: string, optional. Enables/disables advertise PIP towards DCI in EVPN Multisite Border-gateway setup. - Choices: `disable`, `enable`
  evpn_multisite_border_gateway_dci_advertise_pip: enable
  # evpn_multisite_border_gateway_delay_restore_time: number, optional. Delay-Restore Time. - Range: `30`-`1000`
  evpn_multisite_border_gateway_delay_restore_time: 300
  # evpn_multisite_border_gateway_df_election_time: string, optional. DF election time for anycast border gateways. Only one fractional digit supported.
  evpn_multisite_border_gateway_df_election_time: '2.000000'
  # evpn_multisite_border_gateway_fabric_advertise_pip: string, optional. Enables/disables advertise PIP towards Fabric in EVPN Multisite Border-gateway setup. - Choices: `disable`, `enableL3`
  evpn_multisite_border_gateway_fabric_advertise_pip: enableL3
  # evpn_multisite_border_gateway_site_id: number, optional. Configuration of EVPN Multisite Border Gateway. - Range: `0`-`281474976710655`
  evpn_multisite_border_gateway_site_id: 65535
  # evpn_multisite_border_gateway_split_horizon_per_site: string, optional. Enables/disables the per-site split-horizon feature on an EVPN Multisite anycast border gateway. - Choices: `disable`, `enable`
  evpn_multisite_border_gateway_split_horizon_per_site: enable
  # evpn_multisite_border_gateway_state: string, optional. Configures the state of EVPN Multisite Border-gateway. - Choices: `enabled`
  evpn_multisite_border_gateway_state: enabled
  # evpn_storm_controls: map of objects, optional. EVPN Multisite storm control configuration. - Map key: `name` - Broadcast or Multicast or Unicast Name. - Key choices: `unknown`, `ucast`, `bcast`, `mcast`
  evpn_storm_controls:
    bcast:
      level: '10.500000'
  # nve_interfaces: map of objects, optional. NVE interface configuration. - Map key: `id` - Network Virtualization Overlay Endpoint (NVE) ID.
  nve_interfaces:
    '1':
      admin_state: enabled
      advertise_virtual_mac: true
      anycast_source_interface: unspecified
      configuration_source: null
      controller_id: null
      description: My NVE interface
      encapsulation_type: null
      fabric_ready_time: 30
      hold_down_time: 60
      host_reachability_protocol: bgp
      ingress_replication_protocol_bgp: true
      multicast_group_l2: 0.0.0.0
      multicast_group_l3: 0.0.0.0
      multicast_routing_source_interface: unspecified
      multisite_source_interface: unspecified
      multisite_virtual_mac: 00:00:00:00:00:00
      source_interface: lo0
      suppress_arp: true
      suppress_mac_route: false
      suppress_nd: false
      virtual_mac: 00:00:00:00:00:00
      vnis:
        '103100':
          associate_vrf: false
          ingress_replication_protocol: bgp
          legacy_mode: false
          multicast_group: 0.0.0.0
          multisite_ingress_replication: disable
          multisite_multicast_group: 0.0.0.0
          spine_anycast_gateway: false
          suppress_arp: 'off'
  # vxlan_udp_port: number, optional. VxLAN UDP Port. Allowed value range is 1024-65535. - Range: `1024`-`65535`
  vxlan_udp_port: 4789
  # vxlan_udp_source_port_mode: string, optional. VxLAN UDP Source Port Mode. - Choices: `low`, `high`, `rfc`
  vxlan_udp_source_port_mode: high
