# YAML data model for ndfc_vpc_pair
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 033 (6. Interfaces and access)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_vpc_pair
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/vpc_pair
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_vpc_pair/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 33
  group: 6. Interfaces and access

ndfc_vpc_pair:
  # deploy: bool, required. Deploy vPC pair
  deploy: true
  # serial_numbers: [set,  string], required. Serial numbers of the switches in the vPC pair. Must contain exactly two serial numbers.
  serial_numbers:
  - FGE20360RRZ
  - FGE20360RRY
  # use_virtual_peerlink: bool, required. Set to true to use virtual peer link
  use_virtual_peerlink: false
