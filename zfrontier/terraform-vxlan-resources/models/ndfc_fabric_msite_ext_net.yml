  # ptp_domain_id: number, optional. Multiple Independent PTP Clocking Subdomains on a Single Network
  ptp_domain_id: null
  # ptp_lb_id: number, optional. (Min:0, Max:1023)
  ptp_lb_id: null
  # scheduled_time: string, optional. Time (UTC) in 24hr format. (00:00 to 23:59)
  scheduled_time: null
  # snmp_server_host_trap: bool, optional. Configure NDFC as a receiver for SNMP traps
  snmp_server_host_trap: true
  # subinterface_range: string, optional. Per Border Dot1q Range For VRF Lite Connectivity (Min:2, Max:4093)
  subinterface_range: 2-511
