  dhcp_enable: false
  # dhcp_end: string, optional. End Address For Switch POAP
  dhcp_end: null
  # dhcp_ipv6_enable: string, optional. DHCP Version
  dhcp_ipv6_enable: null
  # dhcp_start: string, optional. Start Address For Switch POAP
  dhcp_start: null
  # domain_name: string, optional. Domain name for DHCP server PnP block
  domain_name: null
  # enable_aaa: bool, optional. Include AAA configs from Advanced tab during device bootup
  enable_aaa: null
  # enable_netflow: bool, optional. Enable Netflow on VTEPs
  enable_netflow: false
  # enable_nxapi: bool, optional. Enable HTTPS NX-API
  enable_nxapi: false
  # enable_nxapi_http: bool, optional. Enable HTTP NX-API
  enable_nxapi_http: false
  # enable_real_time_backup: bool, optional. Backup hourly only if there is any config deployment since last backup
  enable_real_time_backup: null
  # enable_rt_intf_stats: bool, optional. Valid for NX-OS only
  enable_rt_intf_stats: null
  # enable_scheduled_backup: bool, optional. Backup at the specified time
  enable_scheduled_backup: null
  # ext_fabric_type: string, optional. External Fabric Type
  ext_fabric_type: null
  # fabric_freeform: string, optional. Additional supported CLIs for all same OS (e.g. all NxOS or IOS-XE, etc) switches
