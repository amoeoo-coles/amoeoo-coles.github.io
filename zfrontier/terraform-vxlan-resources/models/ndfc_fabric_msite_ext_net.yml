  # netflow_record_list: string, optional. One or Multiple Netflow Records
  netflow_record_list: ${jsonencode({"NETFLOW_RECORD_LIST" = [{"RECORD_NAME" = "Test1", "RECORD_TEMPLATE" = "netflow_ipv4_record", "LAYER2_RECORD" = "false"}]})}
  # netflow_sampler_list: string, optional. One or multiple netflow Samplers. Applicable to N7K only
  netflow_sampler_list: ${jsonencode({"NETFLOW_SAMPLER_LIST" = [{"SAMPLER_NAME" = "Test1", "NUM_SAMPLES" = 12, "SAMPLING_RATE" = 10}]})}
  # nxapi_http_port: number, optional. NX-API HTTP Port Number
  nxapi_http_port: 80
  # nxapi_https_port: number, optional. NX-API HTTPS Port Number
  nxapi_https_port: 443
  # nxc_dest_vrf: string, optional. VRF to be used to reach Nexus Cloud, enter 'management' for management VRF and 'default' for default VRF
  nxc_dest_vrf: null
  # nxc_proxy_port: number, optional. Proxy port number, default is 8080
  nxc_proxy_port: null
  # nxc_proxy_server: string, optional. IPv4 or IPv6 address, or DNS name of the proxy server
  nxc_proxy_server: null
  # nxc_src_intf: string, optional. Source interface for communication to Nexus Cloud, mandatory if Destination VRF is not management
  nxc_src_intf: null
  # overwrite_global_nxc: bool, optional. If enabled, Fabric NxCloud Settings will be used
  overwrite_global_nxc: null
  # pm_enable: bool, optional. Enable Performance Monitoring (For NX-OS and IOS XE Switches Only)
  pm_enable: false
  # pnp_enable: bool, optional. Enable Plug n Play (Automatic IP Assignment) for Cat9K switches
  pnp_enable: null
  # power_redundancy_mode: string, optional. Default Power Supply Mode For Bootstrapped NX-OS Switches
