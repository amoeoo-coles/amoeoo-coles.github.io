  group: 1. Global, fabric and features

ndfc_fabric_msite_ext_net:
  # aaa_remote_ip_enabled: bool, optional. Enable only, when IP Authorization is enabled in the AAA Server
  aaa_remote_ip_enabled: false
  # aaa_server_conf: string, optional. AAA Configurations
  aaa_server_conf: null
  # allow_nxc: bool, optional. Allow onboarding of this fabric to Nexus Cloud
  allow_nxc: null
  # bgp_as: string, required. 1-4294967295 | 1-65535.0-65535. It is a good practice to have a unique ASN for each Fabric.
  bgp_as: '65000'
  # bootstrap_conf: string, optional. Additional CLIs required during device bootup/login e.g. AAA/Radius
  bootstrap_conf: null
  # bootstrap_conf_xe: string, optional. Additional CLIs required during device bootup/login e.g. AAA/Radius
  bootstrap_conf_xe: null
  # bootstrap_enable: bool, optional. Automatic IP Assignment For POAP (For NX-OS and IOS XE (Cat9K) Switches Only)
  bootstrap_enable: null
  # bootstrap_multisubnet: string, optional. "DHCPv4 Multi Subnet Scope - lines with # prefix are ignored here"
  bootstrap_multisubnet: '#Scope_Start_IP, Scope_End_IP, Scope_Default_Gateway, Scope_Subnet_Prefix'
