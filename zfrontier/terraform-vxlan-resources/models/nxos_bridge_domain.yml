# YAML data model for nxos_bridge_domain
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 022 (5. Networks and L2VNI)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_bridge_domain
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/bridge_domain
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_bridge_domain/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 22
  group: 5. Networks and L2VNI

nxos_bridge_domain:
  # bridge_domains: map of objects, optional. List of bridge domains. - Map key: `fabric_encap` - The Layer 2 bridge-domain Fabric encapsulation (VNID). Possible values are `unknown`, `vlan-XX` or `vxlan-X…
  bridge_domains:
    vlan-10:
      access_encap: unknown
      admin_state: active
      bridge_domain_state: suspend
      bridge_mode: mac
      control: untagged
      cross_connect: disable
      forwarding_control: mdst-flood
      forwarding_mode: bridge
      isolate: null
      long_name: false
      mac_packet_classify: null
      mode: CE
      name: VLAN10
      vrf_name: default
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # svi_autostate: string, optional. Disable/enable autoState for SVI interface. - Choices: `disable`, `enable`
  svi_autostate: disable
  # vlan_configurations: map of objects, optional. List of `vlan configuration` stanzas. - Map key: `access_encap` - The Layer 2 access encapsulation (VLAN or VNID). Possible values are `unknown`, `vlan-XX` or…
  vlan_configurations:
    vlan-100:
      mac_learning: null
