# YAML data model for ndfc_fabric_vxlan_msd
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 005 (1. Global, fabric and features)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_fabric_vxlan_msd
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/fabric_vxlan_msd
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_fabric_vxlan_msd/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 5
  group: 1. Global, fabric and features

ndfc_fabric_vxlan_msd:
  # anycast_gw_mac: string, optional. Shared MAC address for all leafs
  anycast_gw_mac: 2020.0000.00aa
  # bgp_rp_asn: string, optional. 1-4294967295 | 1-65535[.0-65535], e.g. 65000, 65001
  bgp_rp_asn: null
  # bgw_routing_tag: number, optional. Routing tag associated with IP address of loopback and DCI interfaces
  bgw_routing_tag: 54321
  # border_gwy_connections: string, optional. Manual, Auto Overlay EVPN Peering to Route Servers, Auto Overlay EVPN Direct Peering to Border Gateways
  border_gwy_connections: Manual
  # child_fabrics: [set,  string], optional. Add child fabrics to the MSD fabric
  child_fabrics:
  - TF_CHILD_FABRIC1
  - TF_CHILD_FABRIC2
  # cloudsec_algorithm: string, optional. CloudSec Cryptographic Algorithm
  cloudsec_algorithm: null
  # cloudsec_autoconfig: bool, optional. Auto Config CloudSec on Border Gateways
  cloudsec_autoconfig: false
  # cloudsec_enforcement: string, optional. If set to 'strict', data across site must be encrypted.
  cloudsec_enforcement: null
  # cloudsec_key_string: string, optional, sensitive (set via variable). Cisco Type 7 Encrypted Octet String
  cloudsec_key_string: null
  # cloudsec_report_timer: number, optional. CloudSec Operational Status periodic report timer in minutes
  cloudsec_report_timer: null
  # dci_subnet_range: string, optional. Address range to assign P2P DCI Links
  dci_subnet_range: 10.10.1.0/24
  # dci_subnet_target_mask: number, optional. Target Mask for Subnet Range (Min:8, Max:31)
  dci_subnet_target_mask: 30
  # default_network: string, optional. Default Overlay Network Template For Leafs
  default_network: Default_Network_Universal
  # default_pvlan_sec_network: string, optional. Default PVLAN Secondary Network Template
  default_pvlan_sec_network: null
  # default_vrf: string, optional. Default Overlay VRF Template For Leafs
  default_vrf: Default_VRF_Universal
  # delay_restore: number, optional. Multi-Site underlay and overlay control plane convergence time in seconds
  delay_restore: 300
  # deploy: bool, required. This flag does configuration save and deploy
  deploy: false
  # enable_bgp_bfd: bool, optional. BGP BFD on Multi-Site Underlay IFCs
  enable_bgp_bfd: null
  # enable_bgp_log_neighbor_change: bool, optional. BGP log neighbor change on Multi-Site Underlay IFCs
  enable_bgp_log_neighbor_change: null
  # enable_bgp_send_comm: bool, optional. BGP Send-community on Multi-Site Underlay IFCs
  enable_bgp_send_comm: null
  # enable_pvlan: bool, optional. Enable PVLAN on MSD and its child fabrics
  enable_pvlan: false
  # enable_rs_redist_direct: bool, optional. For auto-created Multi-Site overlay IFCs in Route Servers. Applicable only when Multi-Site Overlay IFC Deployment Method is Centralized_To_Route_Server.
  enable_rs_redist_direct: null
  # enable_scheduled_backup: bool, optional. Backup at the specified time. Note: Fabric Backup/Restore functionality is being deprecated for MSD fabrics. Recommendation is to use NDFC Backup & Restore
  enable_scheduled_backup: null
  # enable_sgt: string, optional. Enable Security Groups
  enable_sgt: null
  # enable_trm_trmv6: bool, optional. Enable IPv4 and/or IPv6 Tenant Routed Multicast across sites
  enable_trm_trmv6: null
  # ext_fabric_type: string, optional. External Fabric Type
  ext_fabric_type: null
  # fabric_name: string, required. Fabric name to be created, updated or deleted.
  fabric_name: TF_FABRIC_VXLAN_MSD
  # ff: string, optional. Template Family
  ff: null
  # l2_segment_id_range: string, optional. Overlay Network Identifier Range
  l2_segment_id_range: 30000-49000
  # l3_partition_id_range: string, optional. Overlay VRF Identifier Range
  l3_partition_id_range: 50000-59000
  # loopback100_ip_range: string, optional. Multi-Site VTEP VIP Loopback IP Range
  loopback100_ip_range: 10.10.0.0/24
  # loopback100_ipv6_range: string, optional. Multi-Site VTEP VIP Loopback IPv6 Range
  loopback100_ipv6_range: null
  # ms_ifc_bgp_auth_key_type: number, optional. BGP Key Encryption Type: 3 - 3DES, 7 - Cisco
  ms_ifc_bgp_auth_key_type: null
  # ms_ifc_bgp_password: string, optional, sensitive (set via variable). Encrypted eBGP Password Hex String
  ms_ifc_bgp_password: null
  # ms_ifc_bgp_password_enable: bool, optional. Enable Multi-Site eBGP Password
  ms_ifc_bgp_password_enable: false
  # ms_loopback_id: number, optional. Multi-Site VTEP VIP Loopback ID
  ms_loopback_id: 100
  # ms_underlay_autoconfig: bool, optional. Multi-Site Underlay IFC Auto Deployment Flag
  ms_underlay_autoconfig: false
  # network_extension_template: string, optional. Default Overlay Network Template For Borders
  network_extension_template: Default_Network_Extension_Universal
  # rp_server_ip: string, optional. Multi-Site Route-Server peer list (typically loopback IP address on Route-Server for Multi-Site EVPN peering with BGWs), e.g. 128.89.0.1, 128.89.0.2
  rp_server_ip: null
  # rs_routing_tag: number, optional. Routing tag associated with Route Server IP for redistribute direct. This is the IP used in eBGP EVPN peering.
  rs_routing_tag: null
  # scheduled_time: string, optional. Time (UTC) in 24hr format. (00:00 to 23:59)
  scheduled_time: null
  # sgt_id_range: string, optional. Security Group Tag (SGT) ID Range
  sgt_id_range: null
  # sgt_name_prefix: string, optional. Prefix to be used when a new Security Group is created.
  sgt_name_prefix: null
  # sgt_preprovision: bool, optional. Generate security groups configuration for non-enforced VRFs
  sgt_preprovision: null
  # tor_auto_deploy: bool, optional. Enables Overlay VLANs on uplink between ToRs and Leafs
  tor_auto_deploy: false
  # v6_dci_subnet_range: string, optional. Address range to assign P2P DCI Links
  v6_dci_subnet_range: null
  # v6_dci_subnet_target_mask: number, optional. Target IPv6 Mask for Subnet Range (Min:120, Max:127)
  v6_dci_subnet_target_mask: null
  # vrf_extension_template: string, optional. Default Overlay VRF Template For Borders
  vrf_extension_template: Default_VRF_Extension_Universal
  # vxlan_underlay_is_v6: bool, optional. If not enabled, IPv4 underlay is used in child VXLAN fabric
  vxlan_underlay_is_v6: null
