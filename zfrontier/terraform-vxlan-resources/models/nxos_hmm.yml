# YAML data model for nxos_hmm
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 023 (5. Networks and L2VNI)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_hmm
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/hmm
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_hmm/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 23
  group: 5. Networks and L2VNI

nxos_hmm:
  # admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  admin_state: enabled
  # administrative_distance: number, optional. Set the administrative distance for HMM. - Range: `1`-`255`
  administrative_distance: 150
  # anycast_mac: string, optional. Anycast Gateway MAC address.
  anycast_mac: '20:20:00:00:10:10'
  # control: string, optional. The control state. - Choices: `stateful-ha`
  control: stateful-ha
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # duplicate_host_detection_moves: number, optional. User Setting to mark a host as duplicate if it does ddHmmoves number of moves. - Range: `1`-`1000`
  duplicate_host_detection_moves: 10
  # duplicate_host_detection_seconds: number, optional. User Setting to mark a host as duplicate if it does ddHmmoves moves in ddHnsecs seconds. - Range: `2`-`36000`
  duplicate_host_detection_seconds: 300
  # duplicate_host_recovery_count: number, optional. Number of times (dhrcount) to periodically check if a Duplicate marked Host is no longer duplicate. - Range: `1`-`3000`
  duplicate_host_recovery_count: 10
  # duplicate_host_recovery_timeout: number, optional. User Setting to periodically (dhrtimeout seconds) check if a Duplicate marked Host is no longer duplicate. - Range: `30`-`36000`
  duplicate_host_recovery_timeout: 60
  # evpn_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  evpn_admin_state: enabled
  # evpn_control: string, optional. The control state. - Choices: `stateful-ha`
  evpn_control: stateful-ha
  # instance_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  instance_admin_state: enabled
  # interfaces: map of objects, optional. List of HMM Fabric Forwarding interfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `vlan10`.
  interfaces:
    vlan10:
      admin_state: enabled
      description: My Description
      mode: anycastGW
      proxy: null
  # limit_vlan_mac: number, optional. This is to limit the number of hosts learnt by HMM in the same subnet with same MAC information. - Range: `5`-`4096`
  limit_vlan_mac: 100
  # selective_host_probe: string, optional. When set to True, host mobility will be triggered when a remote host route exists irrespective of the sequence id. - Choices: `no`, `yes`
  selective_host_probe: null
