# YAML data model for ndfc_policy
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 043 (7. Day 2 and operations)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_policy
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/policy
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_policy/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 43
  group: 7. Day 2 and operations

ndfc_policy:
  # deploy: bool, optional. Deploy policy
  deploy: true
  # description: string, optional. Description of the policy
  description: Policy for switch
  # entity_name: string, required. Policy Name
  entity_name: Switch
  # entity_type: string, required. Type of the entity
  entity_type: SWITCH
  # is_policy_group: bool, optional. Policy Group
  is_policy_group: false
  # policy_parameters: [map,  string], optional. List of name value pairs
  policy_parameters:
    DSTGRP: '501'
    IPADDR: 198.51.100.19
    PORT: '57900'
    VRF: management
  # priority: number, optional. Priority of the policy
  priority: 500
  # serial_numbers: [set,  string], required. Serial numbers of the device. Use only one device for policy. Multiple devices can be in the list if this is a policygroup
  serial_numbers:
  - FDO245206N5
  - FDO245206N6
  # source: string, optional. Source of the policy
  source: CLI
  # template_name: string, required. Name of the template
  template_name: TelemetryDst_EF
