# YAML data model for nxos_spanning_tree
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 032 (6. Interfaces and access)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_spanning_tree
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/spanning_tree
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_spanning_tree/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 32
  group: 6. Interfaces and access

nxos_spanning_tree:
  # admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  admin_state: enabled
  # bridge_assurance: string, optional. Enable spanning-tree bridge assurance on all ports. - Choices: `enabled`, `disabled`
  bridge_assurance: disabled
  # control: string, optional. The control state. - Choices: `normal`, `stateful-ha`, `extchp-edge`, `extchp-bpdu-filter`, `extchp-bpdu-guard`
  control: normal,stateful-ha
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # fcoe: string, optional. Disable spanning tree for fcoe vlan. - Choices: `enabled`, `disabled`
  fcoe: enabled
  # instance_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  instance_admin_state: enabled
  # interfaces: map of objects, optional. List of Spanning Tree interfaces. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1`.
  interfaces:
    eth1/9:
      bpdu_filter: enable
      bpdu_guard: enable
      control: bpdu-guard
      cost: 100
      description: My interface description
      guard: root
      linecard_issu: auto
      link_type: p2p
      mode: edge
      mst_instances:
        '1':
          cost: 100
          priority: 64
      prestandard_configuration: enabled
      priority: 200
      simulate_pvst: enabled
  # l2_gateway_stp_domain_id: number, optional. Spanning tree L2 Gateway Domain Id. - Range: `0`-`200000000`
  l2_gateway_stp_domain_id: 512
  # linecard_issu: string, optional. Linecard ISSU type. - Choices: `default`, `disruptive`, `non-disruptive`, `auto`
  linecard_issu: auto
  # loopguard: string, optional. Enable loop guard on all ports. - Choices: `enabled`, `disabled`
  loopguard: enabled
  # mode: string, optional. Spanning tree mode. - Choices: `mst`, `pvrst`
  mode: pvrst
  # mst_forward_time: number, optional. STP forward delay. - Range: `4`-`30`
  mst_forward_time: 20
  # mst_hello_time: number, optional. STP Hello interval. - Range: `1`-`10`
  mst_hello_time: 5
  # mst_instances: map of objects, optional. List of Multiple Spanning Tree (MST) instances. - Map key: `instance_id` - Id. - Key range: `0`-`4094`
  mst_instances:
    '1':
      config_state: enabled
      diameter: null
      priority: 4096
      root: secondary
      root_mode: null
      root_type: null
      vlan_range: 10-20
  # mst_max_age: number, optional. STP max age interval. - Range: `6`-`40`
  mst_max_age: 25
  # mst_maximum_hops: number, optional. STP mst max hops. - Range: `1`-`255`
  mst_maximum_hops: 30
  # mst_region_name: string, optional. Region Name.
  mst_region_name: REGION1
  # mst_revision: number, optional. Region Revision. - Range: `0`-`65535`
  mst_revision: 5
  # mst_simulate_pvst: string, optional. spanning tree simulation. - Choices: `enabled`, `disabled`
  mst_simulate_pvst: disabled
  # pathcost_option: string, optional. Spanning tree pathcost options. - Choices: `auto`, `short`, `long`
  pathcost_option: long
  # vlans: map of objects, optional. Per-VLAN Spanning Tree configuration. - Map key: `vlan_id` - Access Encapsulation. - Key range: `1`-`4096`
  vlans:
    '100':
      admin_state: disabled
      diameter: 3
      enabled_interfaces: null
      forward_time: 20
      hello_time: 5
      max_age: 25
      priority: '4096'
      root_mode: null
      root_type: null
