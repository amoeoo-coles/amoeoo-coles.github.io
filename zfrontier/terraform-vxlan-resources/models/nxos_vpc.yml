# YAML data model for nxos_vpc
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 029 (6. Interfaces and access)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_vpc
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/vpc
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_vpc/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 29
  group: 6. Interfaces and access

nxos_vpc:
  # admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  admin_state: enabled
  # auto_recovery: string, optional. Auto Recovery. - Choices: `enabled`, `disabled`
  auto_recovery: enabled
  # auto_recovery_interval: number, optional. Auto Recovery interval. - Range: `60`-`3600`
  auto_recovery_interval: 480
  # control: string, optional. The control state. - Choices: `stateful-ha`
  control: stateful-ha
  # delay_peer_link_bringup: number, optional. Peer link delay timer. - Range: `0`-`7200`
  delay_peer_link_bringup: 60
  # delay_restore_orphan_port: number, optional. Delay restore for orphan ports. - Range: `0`-`300`
  delay_restore_orphan_port: 10
  # delay_restore_svi: number, optional. Delay restore for SVI. - Range: `1`-`3600`
  delay_restore_svi: 20
  # delay_restore_vpc: number, optional. Delay restore for vPC links. - Range: `1`-`3600`
  delay_restore_vpc: 60
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # domain_admin_state: string, optional. vPC suspend locally. - Choices: `enabled`, `disabled`
  domain_admin_state: enabled
  # domain_id: number, required. Domain id. - Range: `1`-`1000`
  domain_id: 100
  # dscp: number, optional. DSCP. - Range: `0`-`63`
  dscp: 46
  # exclude_svi: string, optional. SVI List excluded from suspension when dual-active.
  exclude_svi: 1-2
  # fast_convergence: string, optional. Fast Convergence. - Choices: `enabled`, `disabled`
  fast_convergence: enabled
  # graceful_consistency_check: string, optional. Graceful Type-1 Consistency Check. - Choices: `enabled`, `disabled`
  graceful_consistency_check: disabled
  # instance_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  instance_admin_state: enabled
  # interfaces: map of objects, optional. List of vPC interfaces. - Map key: `vpc_interface_id` - The vPC interface identifier. - Key range: `1`-`16384`
  interfaces:
    '1':
      port_channel_interface_dn: sys/intf/aggr-[po1]
  # keepalive_destination_ip: string, optional. destination address.
  keepalive_destination_ip: 192.168.1.1
  # keepalive_flush_timeout: number, optional. flush timeout. - Range: `3`-`10`
  keepalive_flush_timeout: 3
  # keepalive_interval: number, optional. interval. - Range: `400`-`10000`
  keepalive_interval: 1000
  # keepalive_precedence_type: string, optional. precedence type. - Choices: `network`, `internet`, `critical`, `flash-override`, `flash`, `immediate`, `priority`, `routine`
  keepalive_precedence_type: network
  # keepalive_precedence_value: number, optional. precedence value. - Range: `0`-`7`
  keepalive_precedence_value: 6
  # keepalive_source_ip: string, optional. source address.
  keepalive_source_ip: 192.168.1.2
  # keepalive_timeout: number, optional. timeout. - Range: `3`-`20`
  keepalive_timeout: 5
  # keepalive_type_of_service_byte: number, optional. tos byte. - Range: `0`-`255`
  keepalive_type_of_service_byte: 0
  # keepalive_type_of_service_configuration_type: string, optional. tos config type. - Choices: `noCfg`, `tos-byte`, `tos-value`, `tos-type`, `precedence-type`, `precedence-value`
  keepalive_type_of_service_configuration_type: noCfg
  # keepalive_type_of_service_type: string, optional. tos type. - Choices: `min-delay`, `max-throughput`, `max-reliability`, `min-monetary-cost`, `normal`
  keepalive_type_of_service_type: min-delay
  # keepalive_type_of_service_value: number, optional. tos value. - Range: `0`-`15`
  keepalive_type_of_service_value: 0
  # keepalive_udp_port: number, optional. port number. - Range: `1`-`65535`
  keepalive_udp_port: 1234
  # keepalive_vrf: string, optional. vrf name.
  keepalive_vrf: management
  # l3_peer_router: string, optional. L3 Peer Router. - Choices: `enabled`, `disabled`
  l3_peer_router: enabled
  # l3_peer_router_syslog: string, optional. L3 Peer Router Syslog. - Choices: `enabled`, `disabled`
  l3_peer_router_syslog: enabled
  # l3_peer_router_syslog_interval: number, optional. L3 Peer Router Syslog Interval. - Range: `1`-`3600`
  l3_peer_router_syslog_interval: 3000
  # mac_bpdu_source_version_2: bool, optional. Version 2 bpdu source mac-address.
  mac_bpdu_source_version_2: false
  # orphan_ports: map of objects, optional. List of vPC orphan ports to suspend. - Map key: `interface_id` - Must match first field in the output of `show intf brief`. Example: `eth1/1`.
  orphan_ports:
    eth1/10:
      admin_state: enabled
      description: My orphan port
      name: ORPHAN1
  # peer_gateway: string, optional. Peer Gateway. - Choices: `enabled`, `disabled`
  peer_gateway: enabled
  # peer_gateway_exclude_vlan: string, optional. Exclude VLAN List.
  peer_gateway_exclude_vlan: 1-2
  # peer_ip: string, optional. vpc peer IP address.
  peer_ip: 198.51.100.11
  # peer_switch: string, optional. vPC pair switches. - Choices: `enabled`, `disabled`
  peer_switch: enabled
  # peerlink_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  peerlink_admin_state: enabled
  # peerlink_description: string, optional. Description.
  peerlink_description: My description
  # peerlink_interface_id: string, optional. An identifier.
  peerlink_interface_id: eth1/9
  # role_priority: number, optional. role priority. - Range: `1`-`65535`
  role_priority: 100
  # sys_mac: string, optional. system mac.
  sys_mac: 01:01:01:01:01:01
  # system_priority: number, optional. system priority. - Range: `1`-`65535`
  system_priority: 100
  # track: number, optional. Tracking object to suspend vPC if object goes down. - Range: `0`-`500`
  track: 10
  # virtual_ip: string, optional. vpc virtual IP address (vIP).
  virtual_ip: 198.51.100.15
