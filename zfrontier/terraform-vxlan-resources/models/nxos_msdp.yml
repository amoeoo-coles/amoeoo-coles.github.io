# YAML data model for nxos_msdp
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 014 (2. Underlay)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_msdp
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/msdp
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_msdp/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 14
  group: 2. Underlay

nxos_msdp:
  # admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  admin_state: enabled
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # instance_admin_state: string, optional. The administrative state of the object or policy. - Choices: `enabled`, `disabled`
  instance_admin_state: enabled
  # instance_control: string, optional. The control state. - Choices: `stateful-ha`
  instance_control: stateful-ha
  # vrfs: map of objects, optional. List of MSDP VRF configurations. - Map key: `name` - VRF name.
  vrfs:
    default:
      control: flush-routes
      group_limits:
        10.0.0.0/8:
          description: My group limit
          maximum_groups: 100
          name: group-limit
      originator_interface: lo0
      peers:
        10.1.1.2:
          admin_state: disabled
          authentication_description: My authentication description
          authentication_key: null
          authentication_key_wo_version: null
          authentication_keychain: KC1
          authentication_name: auth1
          authentication_type: md5
          description: My MSDP peer
          keepalive_interval: 30
          keepalive_timeout: 60
          mesh_group_description: My mesh group description
          mesh_group_name: MESH1
          mesh_group_policy_name: mesh1
          name: peer1
          remote_as: '65001'
          sa_policies:
            in:
              description: My SA policy
              name: sa-policy
              prefix_list: null
              route_map: SA_POLICY
          source_active_limit: 1000
          source_interface: lo0
      reconnect_interval: 20
      redistribution_description: My redistribution
      redistribution_name: redist
      redistribution_prefix_list: null
      redistribution_route_map: REDIST
      redistribution_scope: inter
      redistribution_source: rtmap
      source_active_interval: 100
