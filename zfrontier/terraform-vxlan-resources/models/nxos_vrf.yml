# YAML data model for nxos_vrf
# Provider: CiscoDevNet/nxos 0.22.3   Build order: 020 (4. VRFs and L3VNI)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: nxos_vrf
  provider: CiscoDevNet/nxos
  provider_version: 0.22.3
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/nxos/0.22.3/docs/resources/vrf
  provider_example: https://github.com/CiscoDevNet/terraform-provider-nxos/blob/v0.22.3/examples/resources/nxos_vrf/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/nxos 0.22.3)
  build_order: 20
  group: 4. VRFs and L3VNI

nxos_vrf:
  # deletion_policy: string, optional. What happens on the device when objects managed by the resource are removed. `delete` deletes the object on destroy, including any configuration not managed by…
  deletion_policy: null
  # device: string, optional. A device name from the provider configuration.
  device: null
  # vrfs: map of objects, optional. List of VRFs. - Map key: `name` - VRF name.
  vrfs:
    VRF1:
      address_families:
        ipv4-ucast:
          route_target_address_families:
            ipv4-ucast:
              route_target_directions:
                import:
                  advertise_vpn: true
                  allow_vpn: false
                  default_vrf_prefix_limit: 1000
                  default_vrf_route_map: DEF-RM
                  description: null
                  name: null
                  route_map: ABC
                  route_targets:
                    route-target:as2-nn2:2:2: {}
      admin_state: admin-up
      controller_id: 1
      description: My VRF1 Description
      encap: vxlan-103901
      l3vni: false
      oui: null
      route_distinguisher: rd:unknown:0:0
      routing_encap: unknown
      vpn_id: null
