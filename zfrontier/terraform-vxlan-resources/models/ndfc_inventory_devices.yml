# YAML data model for ndfc_inventory_devices
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 007 (1. Global, fabric and features)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_inventory_devices
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/inventory_devices
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_inventory_devices/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 7
  group: 1. Global, fabric and features

ndfc_inventory_devices:
  # auth_protocol: string, optional. The authentication protocol to use for the devices
  auth_protocol: md5
  # deploy: bool, optional. Default set to true. NDFC recommends deploying the device configuration during "add devices" to avoid "out-of-sync" issues when deploying in other resources.
  deploy: true
  # devices: map of objects, required. The devices to manage in the inventory
  devices:
    10.1.1.1:
      breakout: null
      discovery_auth_protocol: md5
      discovery_password: null
      discovery_type: discover
      discovery_username: null
      gateway: null
      hostname: null
      image_policy: null
      model: null
      modules_model: null
      port_mode: null
      role: spine
      serial_number: null
      version: null
  # fabric_name: string, required. The name of the fabric
  fabric_name: CML
  # max_hops: number, optional. The maximum number of hops to use during the discovery of devices
  max_hops: 0
  # password: string, required, sensitive (set via variable). The password to use for the devices
  # value comes from var.ndfc_switch_password in the .tf file
  password: null
  # preserve_config: bool, optional. Preserve the configuration of the devices
  preserve_config: false
  # retries: number, optional. The number of retries to use validate fabric status before execution of requests
  retries: 300
  # retry_wait_timeout: number, optional. The time to wait between retries to validate fabric status before execution of requests
  retry_wait_timeout: 20
  # save: bool, optional. Default set to true. NDFC recommends saving the device configuration during "add devices" to avoid "out-of-sync" issues when deploying in other resources.
  save: true
  # seed_ip: string, optional. The seed IP address to use for the discovery devices
  seed_ip: null
  # set_as_individual_device_write_credential: bool, optional. Set and use discovery credentials for LAN devices
  set_as_individual_device_write_credential: false
  # username: string, required. The username to use for the devices
  # value comes from var.ndfc_switch_username in the .tf file
  username: admin
