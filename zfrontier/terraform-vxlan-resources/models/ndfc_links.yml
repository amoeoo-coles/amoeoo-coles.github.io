# YAML data model for ndfc_links
# Provider: CiscoDevNet/ndfc 0.3.1   Build order: 015 (2. Underlay)
# Attribute names, types and required flags come from the provider schema.
# Values come from the provider's own example (addresses mapped to documentation
# ranges, secrets removed). null = not collected / omit, so the provider default applies.
# Credentials are never stored here: use var.* in providers.tf / terraform.tfvars.

references:
  resource: ndfc_links
  provider: CiscoDevNet/ndfc
  provider_version: 0.3.1
  registry_doc: https://registry.terraform.io/providers/CiscoDevNet/ndfc/0.3.1/docs/resources/links
  provider_example: https://github.com/CiscoDevNet/terraform-provider-ndfc/blob/v0.3.1/examples/resources/ndfc_links/resource.tf
  schema_source: terraform providers schema -json (CiscoDevNet/ndfc 0.3.1)
  build_order: 15
  group: 2. Underlay

ndfc_links:
  # destination_device: string, required. Destination device serial number
  destination_device: SERIAL_2
  # destination_fabric: string, required. Destination fabric name
  destination_fabric: CML2
  # destination_interface: string, required. Destination interface name
  destination_interface: Ethernet1/1
  # link_parameters: [map,  string], optional. Link configuration parameters as key-value pairs
  link_parameters:
    asn: '65001'
    NEIGHBOR_ASN: '65002'
    IP_MASK: 192.0.2.1/24
    NEIGHBOR_IP: 192.0.2.2
    IPV6_MASK: 2001:db8::1/64
    IPV6_NEIGHBOR: 2001:db8::2
    MTU: '9216'
    DOT1Q_ID: '2'
    PEER1_DESC: Link to remote site A
    PEER2_DESC: Link to remote site B
    AUTO_VRF_LITE_FLAG: 'false'
    DEFAULT_VRF_FLAG: 'false'
    SYMMETRIC_DEFAULT_VRF_FLAG: 'false'
    DEFAULT_VRF_REDIS_BGP_RMAP: extcon-rmap-filter
    DEFAULT_VRF_BGP_AUTH_KEY_TYPE: '3'
    ENABLE_DCI_TRACKING: 'false'
    VRF_LITE_JYTHON_TEMPLATE: Ext_VRF_Lite_Jython
    PEER1_CONF: no shutdown
    PEER2_CONF: no shutdown
    PEER_VRF_NAME: default
    DEFAULT_VRF_PEER_VRF_NAME: default
  # source_device: string, required. Source device serial number
  source_device: SERIAL_1
  # source_fabric: string, required. Source fabric name
  source_fabric: CML1
  # source_interface: string, required. Source interface name
  source_interface: Ethernet1/1
  # template_name: string, required. Template name to use for the link
  template_name: ext_fabric_setup
