# Example tenant, VRF, bridge-domain and EPG model.
# Subnets are RFC1918 examples and are labelled as such on the page.
# They are not a production addressing plan.

tenant: Example-FW-Insertion
tenant_description: Example tenant for two-VRF firewall service insertion

vrfs:
  - name: VRF-1
    description: Independent L3 routing and security domain 1
    app:
      bd: BD-VRF1-App
      vlan: 301
      gateway: 10.1.1.1
      mask: 24
      subnet_name: sn-vrf1-app
      epg: EPG-VRF1-App
      role: consumer
    db:
      bd: BD-VRF1-DB
      vlan: 302
      gateway: 10.1.2.1
      mask: 24
      subnet_name: sn-vrf1-db
      epg: EPG-VRF1-DB
      role: provider
  - name: VRF-2
    description: Independent L3 routing and security domain 2
    app:
      bd: BD-VRF2-App
      vlan: 303
      gateway: 10.2.1.1
      mask: 24
      subnet_name: sn-vrf2-app
      epg: EPG-VRF2-App
      role: consumer
    db:
      bd: BD-VRF2-DB
      vlan: 304
      gateway: 10.2.2.1
      mask: 24
      subnet_name: sn-vrf2-db
      epg: EPG-VRF2-DB
      role: provider

app_profile: AP-FW-Insert

# Example static path bindings for the four server ports (see vars/access.yml).
# interface_mode "regular" is the APIC value for a tagged/802.1Q path.
epg_static_paths:
  - epg: EPG-VRF1-App
    leafs: [101]
    interface: "1/10"
    encap_id: 301
  - epg: EPG-VRF1-DB
    leafs: [101]
    interface: "1/11"
    encap_id: 302
  - epg: EPG-VRF2-App
    leafs: [102]
    interface: "1/10"
    encap_id: 303
  - epg: EPG-VRF2-DB
    leafs: [102]
    interface: "1/11"
    encap_id: 304
