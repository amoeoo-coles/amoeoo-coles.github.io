---
# Illustrative playbook for the D tenant design pattern.
# Requires cisco.aci (checked against 3.0.x documented options).
# Usage:
#   ansible-playbook playbook.yml -e apic_host=https://apic.example.invalid \
#     -e apic_username={{ apic_username }} -e apic_password={{ apic_password }}
# Do not apply this to a shared Always-On APIC unless you have written approval.
- name: ACI tenant design pattern — D
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/scenario.yml
  vars:
  aci_login: &aci_login
    host: "{{ apic_host }}"
    username: "{{ apic_username }}"
    password: "{{ apic_password }}"
    validate_certs: "{{ apic_validate_certs }}"
  tasks:
    - name: Fail if APIC connection variables are missing
      ansible.builtin.assert:
        that:
          - apic_host | length > 0
          - apic_username | length > 0
          - apic_password | length > 0
        fail_msg: >-
          Set apic_host, apic_username and apic_password (placeholders
          {{ apic_host }}, {{ apic_username }}, {{ apic_password }}) with
          --extra-vars, or export ACI_URL, ACI_USERNAME and ACI_PASSWORD.
          Do not put credentials in this repository.
- name: Create application and shared-services tenants
  cisco.aci.aci_tenant:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    description: Pattern D dedicated tenant
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Create a security domain per tenant
  cisco.aci.aci_aaa_domain:
    <<: *aci_login
    name: "{{ item.security_domain }}"
    description: Security domain for {{ item.tenant }}
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Create a VRF in each tenant
  cisco.aci.aci_vrf:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    vrf: "{{ item.vrf }}"
    description: Dedicated VRF for {{ item.tenant }}
    policy_control_preference: "{{ vrf_enforcement }}"
    preferred_group: "{{ preferred_group }}"
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Create a bridge domain in each tenant
  cisco.aci.aci_bd:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    vrf: "{{ item.vrf }}"
    bd: "{{ item.bd }}"
    description: Dedicated BD for {{ item.tenant }}
    enable_routing: true
    l2_unknown_unicast: "{{ l2_unknown_unicast }}"
    arp_flooding: false
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Add a subnet in each tenant
  cisco.aci.aci_bd_subnet:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    bd: "{{ item.bd }}"
    gateway: "{{ item.subnet_gateway }}"
    mask: "{{ item.subnet_mask }}"
    scope: "{{ item.subnet_scope }}"
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Create an application profile in each tenant
  cisco.aci.aci_ap:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    ap: "{{ item.ap }}"
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Create an EPG in each tenant
  cisco.aci.aci_epg:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    ap: "{{ item.ap }}"
    epg: "{{ item.epg }}"
    bd: "{{ item.bd }}"
    preferred_group: false
    state: present
  loop: "{{ app_tenants + [shared_services] }}"

- name: Create the shared-services HTTP filter
  cisco.aci.aci_filter:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    filter: "{{ filter }}"
    description: TCP destination port 80
    state: present

- name: Add a TCP/80 filter entry
  cisco.aci.aci_filter_entry:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    filter: "{{ filter }}"
    entry: allow-http
    ether_type: ip
    ip_protocol: tcp
    destination_port_start: 80
    destination_port_end: 80
    state: present

- name: Create the shared-services contract (scope global)
  cisco.aci.aci_contract:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    contract: "{{ shared_services.contract }}"
    description: Pattern D shared-services contract
    scope: "{{ shared_services.contract_scope }}"
    state: present

- name: Add the contract subject
  cisco.aci.aci_contract_subject:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    contract: "{{ shared_services.contract }}"
    subject: "{{ subject }}"
    reverse_filter: true
    state: present

- name: Attach the filter to the subject
  cisco.aci.aci_contract_subject_to_filter:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    contract: "{{ shared_services.contract }}"
    subject: "{{ subject }}"
    filter: "{{ filter }}"
    state: present

- name: The shared-services EPG provides the contract
  cisco.aci.aci_epg_to_contract:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    ap: "{{ shared_services.ap }}"
    epg: "{{ shared_services.epg }}"
    contract: "{{ shared_services.contract }}"
    contract_type: provider
    state: present

- name: Export the shared-services contract into each application tenant
  cisco.aci.aci_contract_export:
    <<: *aci_login
    tenant: "{{ shared_services.tenant }}"
    contract: "{{ shared_services.contract }}"
    destination_tenant: "{{ item.tenant }}"
    name: "{{ shared_services.export_name }}"
    description: Export of {{ shared_services.contract }} to {{ item.tenant }}
    state: present
  loop: "{{ app_tenants }}"

- name: Application EPGs consume the exported contract
  cisco.aci.aci_epg_to_contract:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    ap: "{{ item.ap }}"
    epg: "{{ item.epg }}"
    contract: "{{ shared_services.export_name }}"
    contract_type: consumer
    state: present
  loop: "{{ app_tenants }}"
