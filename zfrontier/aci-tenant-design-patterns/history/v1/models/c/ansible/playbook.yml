---
# Illustrative playbook for the C tenant design pattern.
# Requires cisco.aci (checked against 3.0.x documented options).
# Usage:
#   ansible-playbook playbook.yml -e apic_host=https://apic.example.invalid \
#     -e apic_username={{ apic_username }} -e apic_password={{ apic_password }}
# Do not apply this to a shared Always-On APIC unless you have written approval.
- name: ACI tenant design pattern — C
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/scenario.yml
  vars:
  aci_login: &aci_login
    host: "{{ apic_host }}"
    username: "{{ apic_username }}"
    password: "{{ apic_password }}"
    validate_certs: "{{ apic_validate_certs }}"
  tasks:
    - name: Fail if APIC connection variables are missing
      ansible.builtin.assert:
        that:
          - apic_host | length > 0
          - apic_username | length > 0
          - apic_password | length > 0
        fail_msg: >-
          Set apic_host, apic_username and apic_password (placeholders
          {{ apic_host }}, {{ apic_username }}, {{ apic_password }}) with
          --extra-vars, or export ACI_URL, ACI_USERNAME and ACI_PASSWORD.
          Do not put credentials in this repository.
- name: Create the shared VRF in tenant common
  cisco.aci.aci_vrf:
    <<: *aci_login
    tenant: "{{ common_tenant }}"
    vrf: "{{ vrf }}"
    description: Pattern C VRF in tenant common
    policy_control_preference: "{{ vrf_enforcement }}"
    preferred_group: "{{ preferred_group }}"
    state: present

- name: Create a contract in tenant common for same-VRF communication
  cisco.aci.aci_filter:
    <<: *aci_login
    tenant: "{{ common_tenant }}"
    filter: "{{ filter }}"
    description: TCP destination port 80
    state: present

- name: Add a TCP/80 filter entry
  cisco.aci.aci_filter_entry:
    <<: *aci_login
    tenant: "{{ common_tenant }}"
    filter: "{{ filter }}"
    entry: allow-http
    ether_type: ip
    ip_protocol: tcp
    destination_port_start: 80
    destination_port_end: 80
    state: present

- name: Create the inter-tenant contract (scope context)
  cisco.aci.aci_contract:
    <<: *aci_login
    tenant: "{{ common_tenant }}"
    contract: "{{ contract }}"
    description: Pattern C dev-to-test contract
    scope: "{{ contract_scope }}"
    state: present

- name: Add the contract subject
  cisco.aci.aci_contract_subject:
    <<: *aci_login
    tenant: "{{ common_tenant }}"
    contract: "{{ contract }}"
    subject: "{{ subject }}"
    reverse_filter: true
    state: present

- name: Attach the filter to the subject
  cisco.aci.aci_contract_subject_to_filter:
    <<: *aci_login
    tenant: "{{ common_tenant }}"
    contract: "{{ contract }}"
    subject: "{{ subject }}"
    filter: "{{ filter }}"
    state: present

- name: Create the dev and test user tenants
  cisco.aci.aci_tenant:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    description: Pattern C user tenant
    state: present
  loop: "{{ user_tenants }}"

- name: Create a security domain per user tenant
  cisco.aci.aci_aaa_domain:
    <<: *aci_login
    name: "{{ item.security_domain }}"
    description: Security domain for {{ item.tenant }}
    state: present
  loop: "{{ user_tenants }}"

- name: Create a bridge domain in each user tenant, bound to the common VRF
  cisco.aci.aci_bd:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    vrf: "{{ vrf }}"
    bd: "{{ item.bd }}"
    description: BD in {{ item.tenant }} using common/{{ vrf }}
    enable_routing: true
    l2_unknown_unicast: "{{ l2_unknown_unicast }}"
    arp_flooding: false
    state: present
  loop: "{{ user_tenants }}"
  # The VRF name is resolved in the user tenant first, then in common.

- name: Add a private subnet in each user tenant
  cisco.aci.aci_bd_subnet:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    bd: "{{ item.bd }}"
    gateway: "{{ item.subnet_gateway }}"
    mask: "{{ item.subnet_mask }}"
    scope: "{{ subnet_scope }}"
    state: present
  loop: "{{ user_tenants }}"

- name: Create an application profile in each user tenant
  cisco.aci.aci_ap:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    ap: "{{ item.ap }}"
    state: present
  loop: "{{ user_tenants }}"

- name: Create an EPG in each user tenant
  cisco.aci.aci_epg:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    ap: "{{ item.ap }}"
    epg: "{{ item.epg }}"
    bd: "{{ item.bd }}"
    preferred_group: false
    state: present
  loop: "{{ user_tenants }}"

- name: Bind EPGs to the common-tenant contract
  cisco.aci.aci_epg_to_contract:
    <<: *aci_login
    tenant: "{{ item.tenant }}"
    ap: "{{ item.ap }}"
    epg: "{{ item.epg }}"
    contract: "{{ contract }}"
    contract_type: "{{ item.role }}"
    state: present
  loop: "{{ user_tenants }}"
