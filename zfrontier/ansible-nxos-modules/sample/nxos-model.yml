---
# Combined sample NX-OS data model for cisco.nxos 14.0.0. Placeholders only.

collection: cisco.nxos
collection_version: 14.0.0
description: Combined sample data model for every cisco.nxos module in chronological build order. Values
  come from module EXAMPLES; null means omit.
connection:
  nxos_host: '{{ nxos_host }}'
  ansible_user: '{{ ansible_user }}'
  ansible_password: '{{ ansible_password }}'
  ansible_network_os: cisco.nxos.nxos
  ansible_connection: ansible.netcommon.network_cli
groups:
  system:
    title: 1. System and bootstrap
    intro: Feature enablement first, then hostname, system/DNS settings, login banner and NTP.
    modules:
      nxos_feature:
        feature: lacp
        state: enabled
      nxos_hostname:
        state: merged
        config:
          hostname: NXOSv-9k
      nxos_system:
        domain_lookup: null
        domain_name: test.example.com
        domain_search: null
        hostname: nxos01
        name_servers: null
        state: present
        system_mtu: null
      nxos_banner:
        banner: exec
        multiline_delimiter: null
        state: present
        text: 'this is my exec banner

          that contains a multiline

          string

          '
      nxos_ntp_global:
        state: merged
        config:
          access_group:
            match_all: null
            peer:
              - access_list: PeerAcl1
            query_only:
              - access_list: null
            serve:
              - access_list: ServeAcl1
            serve_only:
              - access_list: null
          allow:
            control:
              rate_limit: null
            private: null
          authenticate: true
          authentication_keys:
            - encryption: 7
              id: 1001
              key: '{{ vault_key }}'
            - encryption: 7
              id: 1002
              key: '{{ vault_key }}'
          logging: true
          master:
            stratum: 2
          passive: null
          peers:
            - key_id: 1
              maxpoll: 15
              minpoll: 5
              peer: 192.0.2.1
              prefer: null
              vrf: default
            - key_id: 2
              maxpoll: null
              minpoll: null
              peer: 192.0.2.2
              prefer: true
              vrf: siteA
          servers:
            - key_id: 2
              maxpoll: null
              minpoll: null
              prefer: null
              server: 198.51.100.1
              vrf: default
            - key_id: 1
              maxpoll: null
              minpoll: null
              prefer: null
              server: 203.0.113.1
              vrf: siteB
          source: null
          source_interface: null
          trusted_keys:
            - key_id: null
