---
# Data model for cisco.nxos.nxos_feature (cisco.nxos 14.0.0)
# Keys are only the options documented by the module. Values come from the
# module's own EXAMPLES where available; null means omit (use device/module default).
# Credentials and keys are vault placeholders only. Never commit secrets.

references:
  module: cisco.nxos.nxos_feature
  collection: cisco.nxos
  collection_version: 14.0.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_feature_module.html
  source_url: https://github.com/ansible-collections/cisco.nxos/blob/v14.0.0/plugins/modules/nxos_feature.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/nxos/
  module_type: legacy
  documented_states:
    - enabled
    - disabled
  build_order: 1
  group: 1. System and bootstrap
  sample_values_from: module EXAMPLES (first task with state enabled)
  deprecation: none stated in module documentation

nxos_feature:
  feature: lacp
  state: enabled
