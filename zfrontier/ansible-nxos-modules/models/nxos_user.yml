---
# Data model for cisco.nxos.nxos_user (cisco.nxos 14.0.0)
# Keys are only the options documented by the module. Values come from the
# module's own EXAMPLES where available; null means omit (use device/module default).
# Credentials and keys are vault placeholders only. Never commit secrets.
# Secret placeholders in this model: vault_sshkey

references:
  module: cisco.nxos.nxos_user
  collection: cisco.nxos
  collection_version: 14.0.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_user_module.html
  doc_url_note: official Ansible collection docs
  source_url: https://github.com/ansible-collections/cisco.nxos/blob/v14.0.0/plugins/modules/nxos_user.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/nxos/
  module_type: legacy
  documented_states:
    - present
    - absent
  build_order: 6
  group: 2. AAA, users and management
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

nxos_user:
  aggregate:
    - configured_password: null
      hashed_password: null
      name: null
      roles: null
      sshkey: null
      state: null
      update_password: null
  configured_password: null
  hashed_password: null
  name: ansible
  purge: null
  roles: null
  sshkey: '{{ vault_sshkey }}'
  state: present
  update_password: null
