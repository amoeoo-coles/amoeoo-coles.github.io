---
# Sample playbook for cisco.nxos.nxos_lacp (cisco.nxos 14.0.0)
# Build order: 20
# LACP resource module.
# Reads ../models/nxos_lacp.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_lacp_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "020 nxos_lacp"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_lacp.yml
  tasks:
    - name: Apply nxos_lacp model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_lacp:
        config: "{{ nxos_lacp.config | nxos_strip_nulls }}"
        state: "{{ nxos_lacp.state | default('merged') }}"
      register: nxos_lacp_result

    - name: Gather current nxos_lacp state (Day 2 / BAU check)
      cisco.nxos.nxos_lacp:
        state: gathered
      register: nxos_lacp_gathered
      tags:
        - never
        - gathered
