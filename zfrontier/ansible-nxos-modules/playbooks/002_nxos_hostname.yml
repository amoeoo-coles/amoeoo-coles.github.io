---
# Sample playbook for cisco.nxos.nxos_hostname (cisco.nxos 14.0.0)
# Build order: 2
# Hostname resource module.
# Reads ../models/nxos_hostname.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_hostname_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "002 nxos_hostname"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_hostname.yml
  tasks:
    - name: Apply nxos_hostname model (state from model; documented states merged, replaced, overridden, deleted, parsed, gathered, rendered)
      cisco.nxos.nxos_hostname:
        config: "{{ nxos_hostname.config | nxos_strip_nulls }}"
        state: "{{ nxos_hostname.state | default('merged') }}"
      register: nxos_hostname_result

    - name: Gather current nxos_hostname state (Day 2 / BAU check)
      cisco.nxos.nxos_hostname:
        state: gathered
      register: nxos_hostname_gathered
      tags:
        - never
        - gathered
