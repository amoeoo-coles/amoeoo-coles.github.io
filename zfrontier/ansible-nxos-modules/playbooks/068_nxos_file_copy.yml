---
# Sample playbook for cisco.nxos.nxos_file_copy (cisco.nxos 14.0.0)
# Build order: 68
# Copy a file to a remote NXOS device.
# Reads ../models/nxos_file_copy.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_file_copy_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "068 nxos_file_copy"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_file_copy.yml
  tasks:
    - name: Run nxos_file_copy from model
      cisco.nxos.nxos_file_copy:
        connect_ssh_port: "{{ nxos_file_copy.connect_ssh_port if nxos_file_copy.connect_ssh_port is not none else omit }}"
        file_pull: "{{ nxos_file_copy.file_pull if nxos_file_copy.file_pull is not none else omit }}"
        file_pull_compact: "{{ nxos_file_copy.file_pull_compact if nxos_file_copy.file_pull_compact is not none else omit }}"
        file_pull_kstack: "{{ nxos_file_copy.file_pull_kstack if nxos_file_copy.file_pull_kstack is not none else omit }}"
        file_pull_protocol: "{{ nxos_file_copy.file_pull_protocol if nxos_file_copy.file_pull_protocol is not none else omit }}"
        file_pull_timeout: "{{ nxos_file_copy.file_pull_timeout if nxos_file_copy.file_pull_timeout is not none else omit }}"
        file_system: "{{ nxos_file_copy.file_system if nxos_file_copy.file_system is not none else omit }}"
        local_file: "{{ nxos_file_copy.local_file if nxos_file_copy.local_file is not none else omit }}"
        local_file_directory: "{{ nxos_file_copy.local_file_directory if nxos_file_copy.local_file_directory is not none else omit }}"
        remote_file: "{{ nxos_file_copy.remote_file if nxos_file_copy.remote_file is not none else omit }}"
        remote_scp_server: "{{ nxos_file_copy.remote_scp_server if nxos_file_copy.remote_scp_server is not none else omit }}"
        remote_scp_server_password: "{{ nxos_file_copy.remote_scp_server_password if nxos_file_copy.remote_scp_server_password is not none else omit }}"
        remote_scp_server_user: "{{ nxos_file_copy.remote_scp_server_user if nxos_file_copy.remote_scp_server_user is not none else omit }}"
        vrf: "{{ nxos_file_copy.vrf if nxos_file_copy.vrf is not none else omit }}"
      register: nxos_file_copy_result
