---
# Sample playbook for cisco.nxos.nxos_nve_interface (cisco.nxos 14.0.0)
# Build order: 56
# NVE interface resource module.
# Reads ../models/nxos_nve_interface.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_nve_interface_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "056 nxos_nve_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_nve_interface.yml
  tasks:
    - name: Apply nxos_nve_interface model (state from model; documented states merged, replaced, overridden, deleted, parsed, gathered, rendered)
      cisco.nxos.nxos_nve_interface:
        config: "{{ nxos_nve_interface.config | nxos_strip_nulls }}"
        state: "{{ nxos_nve_interface.state | default('merged') }}"
      register: nxos_nve_interface_result

    - name: Gather current nxos_nve_interface state (Day 2 / BAU check)
      cisco.nxos.nxos_nve_interface:
        state: gathered
      register: nxos_nve_interface_gathered
      tags:
        - never
        - gathered
