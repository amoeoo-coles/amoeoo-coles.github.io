---
# Sample playbook for cisco.nxos.nxos_vxlan_vtep_vni (cisco.nxos 14.0.0)
# Build order: 57
# Creates a Virtual Network Identifier member (VNI)
# Reads ../models/nxos_vxlan_vtep_vni.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vxlan_vtep_vni_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "057 nxos_vxlan_vtep_vni"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vxlan_vtep_vni.yml
  tasks:
    - name: Run nxos_vxlan_vtep_vni from model (documented states present, absent)
      cisco.nxos.nxos_vxlan_vtep_vni:
        assoc_vrf: "{{ nxos_vxlan_vtep_vni.assoc_vrf if nxos_vxlan_vtep_vni.assoc_vrf is not none else omit }}"
        ingress_replication: "{{ nxos_vxlan_vtep_vni.ingress_replication if nxos_vxlan_vtep_vni.ingress_replication is not none else omit }}"
        interface: "{{ nxos_vxlan_vtep_vni.interface if nxos_vxlan_vtep_vni.interface is not none else omit }}"
        multicast_group: "{{ nxos_vxlan_vtep_vni.multicast_group if nxos_vxlan_vtep_vni.multicast_group is not none else omit }}"
        multisite_ingress_replication: "{{ nxos_vxlan_vtep_vni.multisite_ingress_replication if nxos_vxlan_vtep_vni.multisite_ingress_replication is not none else omit }}"
        peer_list: "{{ nxos_vxlan_vtep_vni.peer_list if nxos_vxlan_vtep_vni.peer_list is not none else omit }}"
        state: "{{ nxos_vxlan_vtep_vni.state if nxos_vxlan_vtep_vni.state is not none else omit }}"
        suppress_arp: "{{ nxos_vxlan_vtep_vni.suppress_arp if nxos_vxlan_vtep_vni.suppress_arp is not none else omit }}"
        suppress_arp_disable: "{{ nxos_vxlan_vtep_vni.suppress_arp_disable if nxos_vxlan_vtep_vni.suppress_arp_disable is not none else omit }}"
        vni: "{{ nxos_vxlan_vtep_vni.vni if nxos_vxlan_vtep_vni.vni is not none else omit }}"
      register: nxos_vxlan_vtep_vni_result
