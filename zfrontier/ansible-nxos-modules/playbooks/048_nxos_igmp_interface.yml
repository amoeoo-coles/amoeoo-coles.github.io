---
# Sample playbook for cisco.nxos.nxos_igmp_interface (cisco.nxos 14.0.0)
# Build order: 48
# Manages IGMP interface configuration.
# Reads ../models/nxos_igmp_interface.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_igmp_interface_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "048 nxos_igmp_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_igmp_interface.yml
  tasks:
    - name: Run nxos_igmp_interface from model (documented states present, absent, default)
      cisco.nxos.nxos_igmp_interface:
        group_timeout: "{{ nxos_igmp_interface.group_timeout if nxos_igmp_interface.group_timeout is not none else omit }}"
        immediate_leave: "{{ nxos_igmp_interface.immediate_leave if nxos_igmp_interface.immediate_leave is not none else omit }}"
        interface: "{{ nxos_igmp_interface.interface if nxos_igmp_interface.interface is not none else omit }}"
        last_member_qrt: "{{ nxos_igmp_interface.last_member_qrt if nxos_igmp_interface.last_member_qrt is not none else omit }}"
        last_member_query_count: "{{ nxos_igmp_interface.last_member_query_count if nxos_igmp_interface.last_member_query_count is not none else omit }}"
        oif_ps: "{{ omit if (nxos_igmp_interface.oif_ps | nxos_strip_nulls) is none else (nxos_igmp_interface.oif_ps | nxos_strip_nulls) }}"
        oif_routemap: "{{ nxos_igmp_interface.oif_routemap if nxos_igmp_interface.oif_routemap is not none else omit }}"
        querier_timeout: "{{ nxos_igmp_interface.querier_timeout if nxos_igmp_interface.querier_timeout is not none else omit }}"
        query_interval: "{{ nxos_igmp_interface.query_interval if nxos_igmp_interface.query_interval is not none else omit }}"
        query_mrt: "{{ nxos_igmp_interface.query_mrt if nxos_igmp_interface.query_mrt is not none else omit }}"
        report_llg: "{{ nxos_igmp_interface.report_llg if nxos_igmp_interface.report_llg is not none else omit }}"
        restart: "{{ nxos_igmp_interface.restart if nxos_igmp_interface.restart is not none else omit }}"
        robustness: "{{ nxos_igmp_interface.robustness if nxos_igmp_interface.robustness is not none else omit }}"
        startup_query_count: "{{ nxos_igmp_interface.startup_query_count if nxos_igmp_interface.startup_query_count is not none else omit }}"
        startup_query_interval: "{{ nxos_igmp_interface.startup_query_interval if nxos_igmp_interface.startup_query_interval is not none else omit }}"
        state: "{{ nxos_igmp_interface.state if nxos_igmp_interface.state is not none else omit }}"
        version: "{{ nxos_igmp_interface.version if nxos_igmp_interface.version is not none else omit }}"
      register: nxos_igmp_interface_result
