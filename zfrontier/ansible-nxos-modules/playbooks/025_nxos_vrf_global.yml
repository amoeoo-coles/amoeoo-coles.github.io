---
# Sample playbook for cisco.nxos.nxos_vrf_global (cisco.nxos 14.0.0)
# Build order: 25
# VRF global resource module.
# Reads ../models/nxos_vrf_global.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vrf_global_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "025 nxos_vrf_global"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vrf_global.yml
  tasks:
    - name: Apply nxos_vrf_global model (state from model; documented states parsed, gathered, deleted, merged, replaced, rendered, overridden, purged)
      cisco.nxos.nxos_vrf_global:
        config: "{{ nxos_vrf_global.config | nxos_strip_nulls }}"
        state: "{{ nxos_vrf_global.state | default('merged') }}"
      register: nxos_vrf_global_result

    - name: Gather current nxos_vrf_global state (Day 2 / BAU check)
      cisco.nxos.nxos_vrf_global:
        state: gathered
      register: nxos_vrf_global_gathered
      tags:
        - never
        - gathered
