---
# Sample playbook for cisco.nxos.nxos_bgp_global (cisco.nxos 14.0.0)
# Build order: 38
# BGP global resource module.
# Reads ../models/nxos_bgp_global.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_bgp_global_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "038 nxos_bgp_global"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_bgp_global.yml
  tasks:
    - name: Apply nxos_bgp_global model (state from model; documented states merged, replaced, overridden, deleted, purged, parsed, gathered, rendered)
      cisco.nxos.nxos_bgp_global:
        config: "{{ nxos_bgp_global.config | nxos_strip_nulls }}"
        state: "{{ nxos_bgp_global.state | default('merged') }}"
      register: nxos_bgp_global_result

    - name: Gather current nxos_bgp_global state (Day 2 / BAU check)
      cisco.nxos.nxos_bgp_global:
        state: gathered
      register: nxos_bgp_global_gathered
      tags:
        - never
        - gathered
