---
# Sample playbook for cisco.nxos.nxos_vtp_domain (cisco.nxos 14.0.0)
# Build order: 16
# Manages VTP domain configuration.
# Reads ../models/nxos_vtp_domain.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vtp_domain_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "016 nxos_vtp_domain"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vtp_domain.yml
  tasks:
    - name: Run nxos_vtp_domain from model
      cisco.nxos.nxos_vtp_domain:
        domain: "{{ nxos_vtp_domain.domain if nxos_vtp_domain.domain is not none else omit }}"
      register: nxos_vtp_domain_result
