---
# Sample playbook for cisco.nxos.nxos_vlans (cisco.nxos 14.0.0)
# Build order: 15
# VLANs resource module.
# Reads ../models/nxos_vlans.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vlans_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "015 nxos_vlans"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vlans.yml
  tasks:
    - name: Apply nxos_vlans model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_vlans:
        config: "{{ nxos_vlans.config | nxos_strip_nulls }}"
        state: "{{ nxos_vlans.state | default('merged') }}"
      register: nxos_vlans_result

    - name: Gather current nxos_vlans state (Day 2 / BAU check)
      cisco.nxos.nxos_vlans:
        state: gathered
      register: nxos_vlans_gathered
      tags:
        - never
        - gathered
