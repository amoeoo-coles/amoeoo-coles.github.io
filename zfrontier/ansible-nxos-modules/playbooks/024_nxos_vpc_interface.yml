---
# Sample playbook for cisco.nxos.nxos_vpc_interface (cisco.nxos 14.0.0)
# Build order: 24
# VPC interface resource module.
# Reads ../models/nxos_vpc_interface.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vpc_interface_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "024 nxos_vpc_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vpc_interface.yml
  tasks:
    - name: Apply nxos_vpc_interface model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_vpc_interface:
        config: "{{ nxos_vpc_interface.config | nxos_strip_nulls }}"
        state: "{{ nxos_vpc_interface.state | default('merged') }}"
      register: nxos_vpc_interface_result

    - name: Gather current nxos_vpc_interface state (Day 2 / BAU check)
      cisco.nxos.nxos_vpc_interface:
        state: gathered
      register: nxos_vpc_interface_gathered
      tags:
        - never
        - gathered
