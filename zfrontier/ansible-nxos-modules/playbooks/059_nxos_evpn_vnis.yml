---
# Sample playbook for cisco.nxos.nxos_evpn_vnis (cisco.nxos 14.0.0)
# Build order: 59
# EVPN VNIs resource module.
# Reads ../models/nxos_evpn_vnis.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_evpn_vnis_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "059 nxos_evpn_vnis"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_evpn_vnis.yml
  tasks:
    - name: Apply nxos_evpn_vnis model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_evpn_vnis:
        config: "{{ nxos_evpn_vnis.config | nxos_strip_nulls }}"
        state: "{{ nxos_evpn_vnis.state | default('merged') }}"
      register: nxos_evpn_vnis_result

    - name: Gather current nxos_evpn_vnis state (Day 2 / BAU check)
      cisco.nxos.nxos_evpn_vnis:
        state: gathered
      register: nxos_evpn_vnis_gathered
      tags:
        - never
        - gathered
