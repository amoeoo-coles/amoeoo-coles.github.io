---
# Sample playbook for cisco.nxos.nxos_pim_interface (cisco.nxos 14.0.0)
# Build order: 51
# Manages PIM interface configuration.
# Reads ../models/nxos_pim_interface.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_pim_interface_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "051 nxos_pim_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_pim_interface.yml
  tasks:
    - name: Run nxos_pim_interface from model (documented states present, absent, default)
      cisco.nxos.nxos_pim_interface:
        bfd: "{{ nxos_pim_interface.bfd if nxos_pim_interface.bfd is not none else omit }}"
        border: "{{ nxos_pim_interface.border if nxos_pim_interface.border is not none else omit }}"
        dr_prio: "{{ nxos_pim_interface.dr_prio if nxos_pim_interface.dr_prio is not none else omit }}"
        hello_auth_key: "{{ nxos_pim_interface.hello_auth_key if nxos_pim_interface.hello_auth_key is not none else omit }}"
        hello_interval: "{{ nxos_pim_interface.hello_interval if nxos_pim_interface.hello_interval is not none else omit }}"
        hello_interval_ms: "{{ nxos_pim_interface.hello_interval_ms if nxos_pim_interface.hello_interval_ms is not none else omit }}"
        interface: "{{ nxos_pim_interface.interface if nxos_pim_interface.interface is not none else omit }}"
        jp_policy_in: "{{ nxos_pim_interface.jp_policy_in if nxos_pim_interface.jp_policy_in is not none else omit }}"
        jp_policy_out: "{{ nxos_pim_interface.jp_policy_out if nxos_pim_interface.jp_policy_out is not none else omit }}"
        jp_type_in: "{{ nxos_pim_interface.jp_type_in if nxos_pim_interface.jp_type_in is not none else omit }}"
        jp_type_out: "{{ nxos_pim_interface.jp_type_out if nxos_pim_interface.jp_type_out is not none else omit }}"
        neighbor_policy: "{{ nxos_pim_interface.neighbor_policy if nxos_pim_interface.neighbor_policy is not none else omit }}"
        neighbor_type: "{{ nxos_pim_interface.neighbor_type if nxos_pim_interface.neighbor_type is not none else omit }}"
        sparse: "{{ nxos_pim_interface.sparse if nxos_pim_interface.sparse is not none else omit }}"
        state: "{{ nxos_pim_interface.state if nxos_pim_interface.state is not none else omit }}"
      register: nxos_pim_interface_result
