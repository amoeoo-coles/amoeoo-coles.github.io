---
# Sample playbook for cisco.nxos.nxos_interfaces (cisco.nxos 14.0.0)
# Build order: 10
# Interfaces resource module.
# Reads ../models/nxos_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "010 nxos_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_interfaces.yml
  tasks:
    - name: Apply nxos_interfaces model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed, purged)
      cisco.nxos.nxos_interfaces:
        config: "{{ nxos_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_interfaces.state | default('merged') }}"
      register: nxos_interfaces_result

    - name: Gather current nxos_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_interfaces:
        state: gathered
      register: nxos_interfaces_gathered
      tags:
        - never
        - gathered
