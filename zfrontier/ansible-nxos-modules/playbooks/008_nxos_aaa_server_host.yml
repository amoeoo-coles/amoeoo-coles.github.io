---
# Sample playbook for cisco.nxos.nxos_aaa_server_host (cisco.nxos 14.0.0)
# Build order: 8
# Manages AAA server host-specific configuration.
# Reads ../models/nxos_aaa_server_host.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_aaa_server_host_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "008 nxos_aaa_server_host"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_aaa_server_host.yml
  tasks:
    - name: Run nxos_aaa_server_host from model (documented states present, absent)
      cisco.nxos.nxos_aaa_server_host:
        acct_port: "{{ nxos_aaa_server_host.acct_port if nxos_aaa_server_host.acct_port is not none else omit }}"
        address: "{{ nxos_aaa_server_host.address if nxos_aaa_server_host.address is not none else omit }}"
        auth_port: "{{ nxos_aaa_server_host.auth_port if nxos_aaa_server_host.auth_port is not none else omit }}"
        encrypt_type: "{{ nxos_aaa_server_host.encrypt_type if nxos_aaa_server_host.encrypt_type is not none else omit }}"
        host_timeout: "{{ nxos_aaa_server_host.host_timeout if nxos_aaa_server_host.host_timeout is not none else omit }}"
        key: "{{ nxos_aaa_server_host.key if nxos_aaa_server_host.key is not none else omit }}"
        server_type: "{{ nxos_aaa_server_host.server_type if nxos_aaa_server_host.server_type is not none else omit }}"
        state: "{{ nxos_aaa_server_host.state if nxos_aaa_server_host.state is not none else omit }}"
        tacacs_port: "{{ nxos_aaa_server_host.tacacs_port if nxos_aaa_server_host.tacacs_port is not none else omit }}"
      register: nxos_aaa_server_host_result
