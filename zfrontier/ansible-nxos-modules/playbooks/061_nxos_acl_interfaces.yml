---
# Sample playbook for cisco.nxos.nxos_acl_interfaces (cisco.nxos 14.0.0)
# Build order: 61
# ACL interfaces resource module.
# Reads ../models/nxos_acl_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_acl_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "061 nxos_acl_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_acl_interfaces.yml
  tasks:
    - name: Apply nxos_acl_interfaces model (state from model; documented states deleted, gathered, merged, overridden, rendered, replaced, parsed)
      cisco.nxos.nxos_acl_interfaces:
        config: "{{ nxos_acl_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_acl_interfaces.state | default('merged') }}"
      register: nxos_acl_interfaces_result

    - name: Gather current nxos_acl_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_acl_interfaces:
        state: gathered
      register: nxos_acl_interfaces_gathered
      tags:
        - never
        - gathered
