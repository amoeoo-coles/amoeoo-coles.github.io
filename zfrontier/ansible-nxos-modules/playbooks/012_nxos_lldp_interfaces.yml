---
# Sample playbook for cisco.nxos.nxos_lldp_interfaces (cisco.nxos 14.0.0)
# Build order: 12
# LLDP interfaces resource module.
# Reads ../models/nxos_lldp_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_lldp_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "012 nxos_lldp_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_lldp_interfaces.yml
  tasks:
    - name: Apply nxos_lldp_interfaces model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_lldp_interfaces:
        config: "{{ nxos_lldp_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_lldp_interfaces.state | default('merged') }}"
      register: nxos_lldp_interfaces_result

    - name: Gather current nxos_lldp_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_lldp_interfaces:
        state: gathered
      register: nxos_lldp_interfaces_gathered
      tags:
        - never
        - gathered
