---
# Sample playbook for cisco.nxos.nxos_vrf_af (cisco.nxos 14.0.0)
# Build order: 28
# Manages VRF AF.
# Reads ../models/nxos_vrf_af.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vrf_af_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "028 nxos_vrf_af"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vrf_af.yml
  tasks:
    - name: Run nxos_vrf_af from model (documented states present, absent)
      cisco.nxos.nxos_vrf_af:
        afi: "{{ nxos_vrf_af.afi if nxos_vrf_af.afi is not none else omit }}"
        route_target_both_auto_evpn: "{{ nxos_vrf_af.route_target_both_auto_evpn if nxos_vrf_af.route_target_both_auto_evpn is not none else omit }}"
        route_targets: "{{ omit if (nxos_vrf_af.route_targets | nxos_strip_nulls) is none else (nxos_vrf_af.route_targets | nxos_strip_nulls) }}"
        state: "{{ nxos_vrf_af.state if nxos_vrf_af.state is not none else omit }}"
        vrf: "{{ nxos_vrf_af.vrf if nxos_vrf_af.vrf is not none else omit }}"
      register: nxos_vrf_af_result
