---
# Sample playbook for cisco.nxos.nxos_acls (cisco.nxos 14.0.0)
# Build order: 60
# ACLs resource module.
# Reads ../models/nxos_acls.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_acls_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "060 nxos_acls"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_acls.yml
  tasks:
    - name: Apply nxos_acls model (state from model; documented states deleted, gathered, merged, overridden, rendered, replaced, parsed)
      cisco.nxos.nxos_acls:
        config: "{{ nxos_acls.config | nxos_strip_nulls }}"
        state: "{{ nxos_acls.state | default('merged') }}"
      register: nxos_acls_result

    - name: Gather current nxos_acls state (Day 2 / BAU check)
      cisco.nxos.nxos_acls:
        state: gathered
      register: nxos_acls_gathered
      tags:
        - never
        - gathered
