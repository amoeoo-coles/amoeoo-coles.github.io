---
# Sample playbook for cisco.nxos.nxos_l3_interfaces (cisco.nxos 14.0.0)
# Build order: 31
# L3 interfaces resource module.
# Reads ../models/nxos_l3_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_l3_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "031 nxos_l3_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_l3_interfaces.yml
  tasks:
    - name: Apply nxos_l3_interfaces model (state from model; documented states merged, replaced, overridden, deleted, rendered, gathered, parsed)
      cisco.nxos.nxos_l3_interfaces:
        config: "{{ nxos_l3_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_l3_interfaces.state | default('merged') }}"
      register: nxos_l3_interfaces_result

    - name: Gather current nxos_l3_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_l3_interfaces:
        state: gathered
      register: nxos_l3_interfaces_gathered
      tags:
        - never
        - gathered
