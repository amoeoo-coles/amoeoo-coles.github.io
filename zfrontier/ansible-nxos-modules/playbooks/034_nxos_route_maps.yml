---
# Sample playbook for cisco.nxos.nxos_route_maps (cisco.nxos 14.0.0)
# Build order: 34
# Route maps resource module.
# Reads ../models/nxos_route_maps.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_route_maps_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "034 nxos_route_maps"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_route_maps.yml
  tasks:
    - name: Apply nxos_route_maps model (state from model; documented states merged, replaced, overridden, deleted, parsed, gathered, rendered)
      cisco.nxos.nxos_route_maps:
        config: "{{ nxos_route_maps.config | nxos_strip_nulls }}"
        state: "{{ nxos_route_maps.state | default('merged') }}"
      register: nxos_route_maps_result

    - name: Gather current nxos_route_maps state (Day 2 / BAU check)
      cisco.nxos.nxos_route_maps:
        state: gathered
      register: nxos_route_maps_gathered
      tags:
        - never
        - gathered
