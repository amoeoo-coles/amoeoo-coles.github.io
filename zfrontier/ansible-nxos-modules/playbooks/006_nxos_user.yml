---
# Sample playbook for cisco.nxos.nxos_user (cisco.nxos 14.0.0)
# Build order: 6
# Manage the collection of local users on Nexus devices
# Reads ../models/nxos_user.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_user_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "006 nxos_user"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_user.yml
  tasks:
    - name: Run nxos_user from model (documented states present, absent)
      cisco.nxos.nxos_user:
        aggregate: "{{ omit if (nxos_user.aggregate | nxos_strip_nulls) is none else (nxos_user.aggregate | nxos_strip_nulls) }}"
        configured_password: "{{ nxos_user.configured_password if nxos_user.configured_password is not none else omit }}"
        hashed_password: "{{ nxos_user.hashed_password if nxos_user.hashed_password is not none else omit }}"
        name: "{{ nxos_user.name if nxos_user.name is not none else omit }}"
        purge: "{{ nxos_user.purge if nxos_user.purge is not none else omit }}"
        roles: "{{ nxos_user.roles if nxos_user.roles is not none else omit }}"
        sshkey: "{{ nxos_user.sshkey if nxos_user.sshkey is not none else omit }}"
        state: "{{ nxos_user.state if nxos_user.state is not none else omit }}"
        update_password: "{{ nxos_user.update_password if nxos_user.update_password is not none else omit }}"
      register: nxos_user_result
