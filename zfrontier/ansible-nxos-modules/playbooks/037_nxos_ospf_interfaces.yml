---
# Sample playbook for cisco.nxos.nxos_ospf_interfaces (cisco.nxos 14.0.0)
# Build order: 37
# OSPF interfaces resource module.
# Reads ../models/nxos_ospf_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ospf_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "037 nxos_ospf_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_ospf_interfaces.yml
  tasks:
    - name: Apply nxos_ospf_interfaces model (state from model; documented states merged, replaced, overridden, deleted, gathered, parsed, rendered)
      cisco.nxos.nxos_ospf_interfaces:
        config: "{{ nxos_ospf_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_ospf_interfaces.state | default('merged') }}"
      register: nxos_ospf_interfaces_result

    - name: Gather current nxos_ospf_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_ospf_interfaces:
        state: gathered
      register: nxos_ospf_interfaces_gathered
      tags:
        - never
        - gathered
