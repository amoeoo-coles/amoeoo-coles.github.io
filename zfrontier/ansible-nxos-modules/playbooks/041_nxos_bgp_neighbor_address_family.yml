---
# Sample playbook for cisco.nxos.nxos_bgp_neighbor_address_family (cisco.nxos 14.0.0)
# Build order: 41
# BGP neighbor address family resource module.
# Reads ../models/nxos_bgp_neighbor_address_family.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_bgp_neighbor_address_family_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "041 nxos_bgp_neighbor_address_family"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_bgp_neighbor_address_family.yml
  tasks:
    - name: Apply nxos_bgp_neighbor_address_family model (state from model; documented states merged, replaced, overridden, deleted, parsed, gathered, rendered)
      cisco.nxos.nxos_bgp_neighbor_address_family:
        config: "{{ nxos_bgp_neighbor_address_family.config | nxos_strip_nulls }}"
        state: "{{ nxos_bgp_neighbor_address_family.state | default('merged') }}"
      register: nxos_bgp_neighbor_address_family_result

    - name: Gather current nxos_bgp_neighbor_address_family state (Day 2 / BAU check)
      cisco.nxos.nxos_bgp_neighbor_address_family:
        state: gathered
      register: nxos_bgp_neighbor_address_family_gathered
      tags:
        - never
        - gathered
