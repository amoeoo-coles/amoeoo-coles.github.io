---
# Sample playbook for cisco.nxos.nxos_vtp_password (cisco.nxos 14.0.0)
# Build order: 18
# Manages VTP password configuration.
# Reads ../models/nxos_vtp_password.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vtp_password_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "018 nxos_vtp_password"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vtp_password.yml
  tasks:
    - name: Run nxos_vtp_password from model (documented states present, absent)
      cisco.nxos.nxos_vtp_password:
        state: "{{ nxos_vtp_password.state if nxos_vtp_password.state is not none else omit }}"
        vtp_password: "{{ nxos_vtp_password.vtp_password if nxos_vtp_password.vtp_password is not none else omit }}"
      register: nxos_vtp_password_result
