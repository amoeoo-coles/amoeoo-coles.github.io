---
# Sample playbook for cisco.nxos.nxos_udld_interface (cisco.nxos 14.0.0)
# Build order: 14
# Manages UDLD interface configuration params.
# Reads ../models/nxos_udld_interface.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_udld_interface_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "014 nxos_udld_interface"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_udld_interface.yml
  tasks:
    - name: Run nxos_udld_interface from model (documented states present, absent)
      cisco.nxos.nxos_udld_interface:
        interface: "{{ nxos_udld_interface.interface if nxos_udld_interface.interface is not none else omit }}"
        mode: "{{ nxos_udld_interface.mode if nxos_udld_interface.mode is not none else omit }}"
        state: "{{ nxos_udld_interface.state if nxos_udld_interface.state is not none else omit }}"
      register: nxos_udld_interface_result
