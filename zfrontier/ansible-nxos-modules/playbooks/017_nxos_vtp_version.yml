---
# Sample playbook for cisco.nxos.nxos_vtp_version (cisco.nxos 14.0.0)
# Build order: 17
# Manages VTP version configuration.
# Reads ../models/nxos_vtp_version.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vtp_version_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "017 nxos_vtp_version"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vtp_version.yml
  tasks:
    - name: Run nxos_vtp_version from model
      cisco.nxos.nxos_vtp_version:
        version: "{{ nxos_vtp_version.version if nxos_vtp_version.version is not none else omit }}"
      register: nxos_vtp_version_result
