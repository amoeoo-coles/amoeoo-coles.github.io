---
# Sample playbook for cisco.nxos.nxos_ntp_global (cisco.nxos 14.0.0)
# Build order: 5
# NTP global resource module.
# Reads ../models/nxos_ntp_global.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_ntp_global_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "005 nxos_ntp_global"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_ntp_global.yml
  tasks:
    - name: Apply nxos_ntp_global model (state from model; documented states merged, replaced, overridden, deleted, parsed, gathered, rendered)
      cisco.nxos.nxos_ntp_global:
        config: "{{ nxos_ntp_global.config | nxos_strip_nulls }}"
        state: "{{ nxos_ntp_global.state | default('merged') }}"
      register: nxos_ntp_global_result

    - name: Gather current nxos_ntp_global state (Day 2 / BAU check)
      cisco.nxos.nxos_ntp_global:
        state: gathered
      register: nxos_ntp_global_gathered
      tags:
        - never
        - gathered
