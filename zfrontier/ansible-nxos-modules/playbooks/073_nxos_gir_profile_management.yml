---
# Sample playbook for cisco.nxos.nxos_gir_profile_management (cisco.nxos 14.0.0)
# Build order: 73
# Create a maintenance-mode or normal-mode profile for GIR.
# Reads ../models/nxos_gir_profile_management.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_gir_profile_management_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "073 nxos_gir_profile_management"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_gir_profile_management.yml
  tasks:
    - name: Run nxos_gir_profile_management from model (documented states present, absent)
      cisco.nxos.nxos_gir_profile_management:
        commands: "{{ omit if (nxos_gir_profile_management.commands | nxos_strip_nulls) is none else (nxos_gir_profile_management.commands | nxos_strip_nulls) }}"
        mode: "{{ nxos_gir_profile_management.mode if nxos_gir_profile_management.mode is not none else omit }}"
        state: "{{ nxos_gir_profile_management.state if nxos_gir_profile_management.state is not none else omit }}"
      register: nxos_gir_profile_management_result
