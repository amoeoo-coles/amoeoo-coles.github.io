---
# Sample playbook for cisco.nxos.nxos_vpc (cisco.nxos 14.0.0)
# Build order: 23
# VPC resource module.
# Reads ../models/nxos_vpc.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vpc_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "023 nxos_vpc"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vpc.yml
  tasks:
    - name: Apply nxos_vpc model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_vpc:
        config: "{{ nxos_vpc.config | nxos_strip_nulls }}"
        state: "{{ nxos_vpc.state | default('merged') }}"
      register: nxos_vpc_result

    - name: Gather current nxos_vpc state (Day 2 / BAU check)
      cisco.nxos.nxos_vpc:
        state: gathered
      register: nxos_vpc_gathered
      tags:
        - never
        - gathered
