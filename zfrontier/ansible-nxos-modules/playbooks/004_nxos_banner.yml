---
# Sample playbook for cisco.nxos.nxos_banner (cisco.nxos 14.0.0)
# Build order: 4
# Manage multiline banners on Cisco NXOS devices
# Reads ../models/nxos_banner.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_banner_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "004 nxos_banner"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_banner.yml
  tasks:
    - name: Run nxos_banner from model (documented states present, absent)
      cisco.nxos.nxos_banner:
        banner: "{{ nxos_banner.banner if nxos_banner.banner is not none else omit }}"
        multiline_delimiter: "{{ nxos_banner.multiline_delimiter if nxos_banner.multiline_delimiter is not none else omit }}"
        state: "{{ nxos_banner.state if nxos_banner.state is not none else omit }}"
        text: "{{ nxos_banner.text if nxos_banner.text is not none else omit }}"
      register: nxos_banner_result
