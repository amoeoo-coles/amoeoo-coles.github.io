---
# Sample playbook for cisco.nxos.nxos_vxlan_vtep (cisco.nxos 14.0.0)
# Build order: 55
# Manages VXLAN Network Virtualization Endpoint (NVE).
# Reads ../models/nxos_vxlan_vtep.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_vxlan_vtep_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "055 nxos_vxlan_vtep"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_vxlan_vtep.yml
  tasks:
    - name: Run nxos_vxlan_vtep from model (documented states present, absent)
      cisco.nxos.nxos_vxlan_vtep:
        advertise_virtual_rmac: "{{ nxos_vxlan_vtep.advertise_virtual_rmac if nxos_vxlan_vtep.advertise_virtual_rmac is not none else omit }}"
        description: "{{ nxos_vxlan_vtep.description if nxos_vxlan_vtep.description is not none else omit }}"
        global_ingress_replication_bgp: "{{ nxos_vxlan_vtep.global_ingress_replication_bgp if nxos_vxlan_vtep.global_ingress_replication_bgp is not none else omit }}"
        global_mcast_group_L2: "{{ nxos_vxlan_vtep.global_mcast_group_L2 if nxos_vxlan_vtep.global_mcast_group_L2 is not none else omit }}"
        global_mcast_group_L3: "{{ nxos_vxlan_vtep.global_mcast_group_L3 if nxos_vxlan_vtep.global_mcast_group_L3 is not none else omit }}"
        global_suppress_arp: "{{ nxos_vxlan_vtep.global_suppress_arp if nxos_vxlan_vtep.global_suppress_arp is not none else omit }}"
        host_reachability: "{{ nxos_vxlan_vtep.host_reachability if nxos_vxlan_vtep.host_reachability is not none else omit }}"
        interface: "{{ nxos_vxlan_vtep.interface if nxos_vxlan_vtep.interface is not none else omit }}"
        multisite_border_gateway_interface: "{{ nxos_vxlan_vtep.multisite_border_gateway_interface if nxos_vxlan_vtep.multisite_border_gateway_interface is not none else omit }}"
        shutdown: "{{ nxos_vxlan_vtep.shutdown if nxos_vxlan_vtep.shutdown is not none else omit }}"
        source_interface: "{{ nxos_vxlan_vtep.source_interface if nxos_vxlan_vtep.source_interface is not none else omit }}"
        source_interface_hold_down_time: "{{ nxos_vxlan_vtep.source_interface_hold_down_time if nxos_vxlan_vtep.source_interface_hold_down_time is not none else omit }}"
        state: "{{ nxos_vxlan_vtep.state if nxos_vxlan_vtep.state is not none else omit }}"
      register: nxos_vxlan_vtep_result
