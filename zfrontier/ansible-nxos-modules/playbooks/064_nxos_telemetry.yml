---
# Sample playbook for cisco.nxos.nxos_telemetry (cisco.nxos 14.0.0)
# Build order: 64
# Telemetry resource module.
# Reads ../models/nxos_telemetry.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_telemetry_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "064 nxos_telemetry"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_telemetry.yml
  tasks:
    - name: Apply nxos_telemetry model (state from model; documented states merged, replaced, deleted, gathered, overridden)
      cisco.nxos.nxos_telemetry:
        config: "{{ nxos_telemetry.config | nxos_strip_nulls }}"
        state: "{{ nxos_telemetry.state | default('merged') }}"
      register: nxos_telemetry_result

    - name: Gather current nxos_telemetry state (Day 2 / BAU check)
      cisco.nxos.nxos_telemetry:
        state: gathered
      register: nxos_telemetry_gathered
      tags:
        - never
        - gathered
