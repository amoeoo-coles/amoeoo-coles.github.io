---
# Sample playbook for cisco.nxos.nxos_pim_rp_address (cisco.nxos 14.0.0)
# Build order: 52
# Manages configuration of an PIM static RP address instance.
# Reads ../models/nxos_pim_rp_address.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_pim_rp_address_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "052 nxos_pim_rp_address"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_pim_rp_address.yml
  tasks:
    - name: Run nxos_pim_rp_address from model (documented states present, absent)
      cisco.nxos.nxos_pim_rp_address:
        bidir: "{{ nxos_pim_rp_address.bidir if nxos_pim_rp_address.bidir is not none else omit }}"
        group_list: "{{ nxos_pim_rp_address.group_list if nxos_pim_rp_address.group_list is not none else omit }}"
        prefix_list: "{{ nxos_pim_rp_address.prefix_list if nxos_pim_rp_address.prefix_list is not none else omit }}"
        route_map: "{{ nxos_pim_rp_address.route_map if nxos_pim_rp_address.route_map is not none else omit }}"
        rp_address: "{{ nxos_pim_rp_address.rp_address if nxos_pim_rp_address.rp_address is not none else omit }}"
        state: "{{ nxos_pim_rp_address.state if nxos_pim_rp_address.state is not none else omit }}"
      register: nxos_pim_rp_address_result
