---
# Sample playbook for cisco.nxos.nxos_static_routes (cisco.nxos 14.0.0)
# Build order: 32
# Static routes resource module.
# Reads ../models/nxos_static_routes.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_static_routes_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "032 nxos_static_routes"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_static_routes.yml
  tasks:
    - name: Apply nxos_static_routes model (state from model; documented states deleted, merged, overridden, replaced, gathered, rendered, parsed)
      cisco.nxos.nxos_static_routes:
        config: "{{ nxos_static_routes.config | nxos_strip_nulls }}"
        state: "{{ nxos_static_routes.state | default('merged') }}"
      register: nxos_static_routes_result

    - name: Gather current nxos_static_routes state (Day 2 / BAU check)
      cisco.nxos.nxos_static_routes:
        state: gathered
      register: nxos_static_routes_gathered
      tags:
        - never
        - gathered
