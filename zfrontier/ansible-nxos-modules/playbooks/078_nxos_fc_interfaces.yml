---
# Sample playbook for cisco.nxos.nxos_fc_interfaces (cisco.nxos 14.0.0)
# Build order: 78
# FC interfaces resource module.
# Reads ../models/nxos_fc_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_fc_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "078 nxos_fc_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_fc_interfaces.yml
  tasks:
    - name: Apply nxos_fc_interfaces model (state from model; documented states merged, replaced, overridden, deleted, gathered, rendered, parsed)
      cisco.nxos.nxos_fc_interfaces:
        config: "{{ nxos_fc_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_fc_interfaces.state | default('merged') }}"
      register: nxos_fc_interfaces_result

    - name: Gather current nxos_fc_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_fc_interfaces:
        state: gathered
      register: nxos_fc_interfaces_gathered
      tags:
        - never
        - gathered
