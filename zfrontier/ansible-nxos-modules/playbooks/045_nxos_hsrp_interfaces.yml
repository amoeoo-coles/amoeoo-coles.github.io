---
# Sample playbook for cisco.nxos.nxos_hsrp_interfaces (cisco.nxos 14.0.0)
# Build order: 45
# HSRP interfaces resource module.
# Reads ../models/nxos_hsrp_interfaces.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_hsrp_interfaces_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "045 nxos_hsrp_interfaces"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_hsrp_interfaces.yml
  tasks:
    - name: Apply nxos_hsrp_interfaces model (state from model; documented states merged, replaced, overridden, deleted, rendered, gathered, parsed)
      cisco.nxos.nxos_hsrp_interfaces:
        config: "{{ nxos_hsrp_interfaces.config | nxos_strip_nulls }}"
        state: "{{ nxos_hsrp_interfaces.state | default('merged') }}"
      register: nxos_hsrp_interfaces_result

    - name: Gather current nxos_hsrp_interfaces state (Day 2 / BAU check)
      cisco.nxos.nxos_hsrp_interfaces:
        state: gathered
      register: nxos_hsrp_interfaces_gathered
      tags:
        - never
        - gathered
