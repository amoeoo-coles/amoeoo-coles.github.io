---
# Sample playbook for cisco.nxos.nxos_hsrp (cisco.nxos 14.0.0)
# Build order: 44
# (deprecated, removed after 2028-06-01) Manages HSRP configuration on NX-OS switches.
# Reads ../models/nxos_hsrp.yml (vars_files). Docs: https://docs.ansible.com/projects/ansible/latest/collections/cisco/nxos/nxos_hsrp_module.html
# Inventory placeholders: {{ nxos_host }} {{ ansible_user }} {{ ansible_password }}.

- name: "044 nxos_hsrp"
  hosts: nxos
  gather_facts: false
  vars_files:
    - ../models/nxos_hsrp.yml
  tasks:
    - name: Run nxos_hsrp from model (documented states present, absent)
      cisco.nxos.nxos_hsrp:
        auth_string: "{{ nxos_hsrp.auth_string if nxos_hsrp.auth_string is not none else omit }}"
        auth_type: "{{ nxos_hsrp.auth_type if nxos_hsrp.auth_type is not none else omit }}"
        group: "{{ nxos_hsrp.group if nxos_hsrp.group is not none else omit }}"
        interface: "{{ nxos_hsrp.interface if nxos_hsrp.interface is not none else omit }}"
        preempt: "{{ nxos_hsrp.preempt if nxos_hsrp.preempt is not none else omit }}"
        priority: "{{ nxos_hsrp.priority if nxos_hsrp.priority is not none else omit }}"
        state: "{{ nxos_hsrp.state if nxos_hsrp.state is not none else omit }}"
        version: "{{ nxos_hsrp.version if nxos_hsrp.version is not none else omit }}"
        vip: "{{ nxos_hsrp.vip if nxos_hsrp.vip is not none else omit }}"
      register: nxos_hsrp_result
