---
# Sample playbook for cisco.aci.aci_cloud_zone
# Build order: 249
# Manage Cloud Availability Zone (cloud:Zone)
# Reads models/aci_cloud_zone.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "249 aci_cloud_zone"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_zone.yml
  tasks:
    - name: Query aci_cloud_zone
      cisco.aci.aci_cloud_zone: "{{ aci_cloud_zone | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_zone.state | default('present')) in ['present', 'query']
      register: query_result
