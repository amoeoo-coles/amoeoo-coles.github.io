---
# Sample playbook for cisco.aci.aci_system
# Build order: 001
# Query the ACI system information (top:System)
# Reads models/aci_system.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "001 aci_system"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_system.yml
  tasks:
    - name: Query aci_system
      cisco.aci.aci_system: "{{ aci_system | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_system.state | default('present')) in ['present', 'query']
      register: query_result
