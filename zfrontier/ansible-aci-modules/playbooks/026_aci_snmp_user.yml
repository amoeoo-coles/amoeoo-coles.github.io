---
# Sample playbook for cisco.aci.aci_snmp_user
# Build order: 026
# Manage SNMP v3 Users (snmp:UserP)
# Reads models/aci_snmp_user.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "026 aci_snmp_user"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_snmp_user.yml
  tasks:
    - name: Ensure aci_snmp_user is present
      cisco.aci.aci_snmp_user: "{{ aci_snmp_user | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_snmp_user.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_snmp_user
      cisco.aci.aci_snmp_user: "{{ aci_snmp_user | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_snmp_user.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_snmp_user (only when model state is absent)
      cisco.aci.aci_snmp_user: "{{ aci_snmp_user | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_snmp_user.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
