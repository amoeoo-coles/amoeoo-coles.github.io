---
# Sample playbook for cisco.aci.aci_key_policy
# Build order: 145
# Manage Key Policy (fv:KeyPol)
# Reads models/aci_key_policy.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "145 aci_key_policy"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_key_policy.yml
  tasks:
    - name: Ensure aci_key_policy is present
      cisco.aci.aci_key_policy: "{{ aci_key_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_key_policy.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_key_policy
      cisco.aci.aci_key_policy: "{{ aci_key_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_key_policy.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_key_policy (only when model state is absent)
      cisco.aci.aci_key_policy: "{{ aci_key_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_key_policy.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
