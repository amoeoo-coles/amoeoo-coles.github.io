---
# Sample playbook for cisco.aci.aci_esg_contract_master
# Build order: 219
# Manage ESG contract master relationships (fv:RsSecInherited)
# Reads models/aci_esg_contract_master.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "219 aci_esg_contract_master"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_esg_contract_master.yml
  tasks:
    - name: Ensure aci_esg_contract_master is present
      cisco.aci.aci_esg_contract_master: "{{ aci_esg_contract_master | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_esg_contract_master.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_esg_contract_master
      cisco.aci.aci_esg_contract_master: "{{ aci_esg_contract_master | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_esg_contract_master.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_esg_contract_master (only when model state is absent)
      cisco.aci.aci_esg_contract_master: "{{ aci_esg_contract_master | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_esg_contract_master.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
