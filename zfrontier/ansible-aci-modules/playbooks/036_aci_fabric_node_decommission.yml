---
# Sample playbook for cisco.aci.aci_fabric_node_decommission
# Build order: 036
# Manage the Commissioning and Decommissioning of the Fabric Node (fabric:RsDecommissionNode)
# Reads models/aci_fabric_node_decommission.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "036 aci_fabric_node_decommission"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_node_decommission.yml
  tasks:
    - name: Ensure aci_fabric_node_decommission is present
      cisco.aci.aci_fabric_node_decommission: "{{ aci_fabric_node_decommission | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_node_decommission.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_node_decommission
      cisco.aci.aci_fabric_node_decommission: "{{ aci_fabric_node_decommission | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_node_decommission.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_node_decommission (only when model state is absent)
      cisco.aci.aci_fabric_node_decommission: "{{ aci_fabric_node_decommission | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_node_decommission.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
