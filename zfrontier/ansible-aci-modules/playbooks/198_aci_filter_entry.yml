---
# Sample playbook for cisco.aci.aci_filter_entry
# Build order: 198
# Manage filter entries (vz:Entry)
# Reads models/aci_filter_entry.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "198 aci_filter_entry"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_filter_entry.yml
  tasks:
    - name: Ensure aci_filter_entry is present
      cisco.aci.aci_filter_entry: "{{ aci_filter_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_filter_entry.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_filter_entry
      cisco.aci.aci_filter_entry: "{{ aci_filter_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_filter_entry.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_filter_entry (only when model state is absent)
      cisco.aci.aci_filter_entry: "{{ aci_filter_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_filter_entry.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
