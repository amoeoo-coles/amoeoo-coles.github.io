---
# Sample playbook for cisco.aci.aci_epg
# Build order: 206
# Manage End Point Groups (EPG) objects (fv:AEPg)
# Reads models/aci_epg.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "206 aci_epg"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_epg.yml
  tasks:
    - name: Ensure aci_epg is present
      cisco.aci.aci_epg: "{{ aci_epg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_epg.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_epg
      cisco.aci.aci_epg: "{{ aci_epg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_epg.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_epg (only when model state is absent)
      cisco.aci.aci_epg: "{{ aci_epg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_epg.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
