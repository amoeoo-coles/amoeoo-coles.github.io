---
# Sample playbook for cisco.aci.aci_interface_policy_port_channel_member
# Build order: 086
# Manage Port Channel Member interface policies (lacp:IfPol)
# Reads models/aci_interface_policy_port_channel_member.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "086 aci_interface_policy_port_channel_member"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_policy_port_channel_member.yml
  tasks:
    - name: Ensure aci_interface_policy_port_channel_member is present
      cisco.aci.aci_interface_policy_port_channel_member: "{{ aci_interface_policy_port_channel_member | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_port_channel_member.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_policy_port_channel_member
      cisco.aci.aci_interface_policy_port_channel_member: "{{ aci_interface_policy_port_channel_member | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_port_channel_member.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_policy_port_channel_member (only when model state is absent)
      cisco.aci.aci_interface_policy_port_channel_member: "{{ aci_interface_policy_port_channel_member | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_port_channel_member.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
