---
# Sample playbook for cisco.aci.aci_dhcp_relay
# Build order: 133
# Manage DHCP relay policies (dhcp:RelayP)
# Reads models/aci_dhcp_relay.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "133 aci_dhcp_relay"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_dhcp_relay.yml
  tasks:
    - name: Ensure aci_dhcp_relay is present
      cisco.aci.aci_dhcp_relay: "{{ aci_dhcp_relay | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_relay.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_dhcp_relay
      cisco.aci.aci_dhcp_relay: "{{ aci_dhcp_relay | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_relay.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_dhcp_relay (only when model state is absent)
      cisco.aci.aci_dhcp_relay: "{{ aci_dhcp_relay | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_relay.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
