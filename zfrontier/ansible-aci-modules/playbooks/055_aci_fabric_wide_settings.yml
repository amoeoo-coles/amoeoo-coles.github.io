---
# Sample playbook for cisco.aci.aci_fabric_wide_settings
# Build order: 055
# Manage Fabric Wide Settings (infra:SetPol)
# Reads models/aci_fabric_wide_settings.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "055 aci_fabric_wide_settings"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_wide_settings.yml
  tasks:
    - name: Ensure aci_fabric_wide_settings is present
      cisco.aci.aci_fabric_wide_settings: "{{ aci_fabric_wide_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_wide_settings.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_wide_settings
      cisco.aci.aci_fabric_wide_settings: "{{ aci_fabric_wide_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_wide_settings.state | default('present')) in ['present', 'query']
      register: query_result
