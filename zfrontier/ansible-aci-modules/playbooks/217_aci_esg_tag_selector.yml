---
# Sample playbook for cisco.aci.aci_esg_tag_selector
# Build order: 217
# Manage ESG Tag Selectors (fv:TagSelector)
# Reads models/aci_esg_tag_selector.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "217 aci_esg_tag_selector"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_esg_tag_selector.yml
  tasks:
    - name: Ensure aci_esg_tag_selector is present
      cisco.aci.aci_esg_tag_selector: "{{ aci_esg_tag_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_esg_tag_selector.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_esg_tag_selector
      cisco.aci.aci_esg_tag_selector: "{{ aci_esg_tag_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_esg_tag_selector.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_esg_tag_selector (only when model state is absent)
      cisco.aci.aci_esg_tag_selector: "{{ aci_esg_tag_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_esg_tag_selector.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
