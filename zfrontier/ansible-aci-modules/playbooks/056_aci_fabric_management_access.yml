---
# Sample playbook for cisco.aci.aci_fabric_management_access
# Build order: 056
# Manage Fabric Management Access (comm:Pol)
# Reads models/aci_fabric_management_access.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "056 aci_fabric_management_access"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_management_access.yml
  tasks:
    - name: Ensure aci_fabric_management_access is present
      cisco.aci.aci_fabric_management_access: "{{ aci_fabric_management_access | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_management_access.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_management_access
      cisco.aci.aci_fabric_management_access: "{{ aci_fabric_management_access | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_management_access.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_management_access (only when model state is absent)
      cisco.aci.aci_fabric_management_access: "{{ aci_fabric_management_access | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_management_access.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
