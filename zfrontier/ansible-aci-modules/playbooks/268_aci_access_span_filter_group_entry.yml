---
# Sample playbook for cisco.aci.aci_access_span_filter_group_entry
# Build order: 268
# Manage Access SPAN filter group entries (span:FilterEntry)
# Reads models/aci_access_span_filter_group_entry.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "268 aci_access_span_filter_group_entry"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_access_span_filter_group_entry.yml
  tasks:
    - name: Ensure aci_access_span_filter_group_entry is present
      cisco.aci.aci_access_span_filter_group_entry: "{{ aci_access_span_filter_group_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_access_span_filter_group_entry.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_access_span_filter_group_entry
      cisco.aci.aci_access_span_filter_group_entry: "{{ aci_access_span_filter_group_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_access_span_filter_group_entry.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_access_span_filter_group_entry (only when model state is absent)
      cisco.aci.aci_access_span_filter_group_entry: "{{ aci_access_span_filter_group_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_access_span_filter_group_entry.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
