---
# Sample playbook for cisco.aci.aci_dhcp_relay_provider
# Build order: 134
# Manage DHCP relay policy providers (dhcp:RsProv)
# Reads models/aci_dhcp_relay_provider.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "134 aci_dhcp_relay_provider"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_dhcp_relay_provider.yml
  tasks:
    - name: Ensure aci_dhcp_relay_provider is present
      cisco.aci.aci_dhcp_relay_provider: "{{ aci_dhcp_relay_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_relay_provider.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_dhcp_relay_provider
      cisco.aci.aci_dhcp_relay_provider: "{{ aci_dhcp_relay_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_relay_provider.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_dhcp_relay_provider (only when model state is absent)
      cisco.aci.aci_dhcp_relay_provider: "{{ aci_dhcp_relay_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_relay_provider.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
