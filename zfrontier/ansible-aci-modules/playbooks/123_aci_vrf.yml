---
# Sample playbook for cisco.aci.aci_vrf
# Build order: 123
# Manage contexts or VRFs (fv:Ctx)
# Reads models/aci_vrf.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "123 aci_vrf"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vrf.yml
  tasks:
    - name: Ensure aci_vrf is present
      cisco.aci.aci_vrf: "{{ aci_vrf | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vrf.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vrf
      cisco.aci.aci_vrf: "{{ aci_vrf | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vrf.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vrf (only when model state is absent)
      cisco.aci.aci_vrf: "{{ aci_vrf | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vrf.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
