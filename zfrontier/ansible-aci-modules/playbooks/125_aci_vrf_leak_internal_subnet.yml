---
# Sample playbook for cisco.aci.aci_vrf_leak_internal_subnet
# Build order: 125
# Manage VRF leaking of subnets (leak:InternalSubnet)
# Reads models/aci_vrf_leak_internal_subnet.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "125 aci_vrf_leak_internal_subnet"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vrf_leak_internal_subnet.yml
  tasks:
    - name: Ensure aci_vrf_leak_internal_subnet is present
      cisco.aci.aci_vrf_leak_internal_subnet: "{{ aci_vrf_leak_internal_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vrf_leak_internal_subnet.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vrf_leak_internal_subnet
      cisco.aci.aci_vrf_leak_internal_subnet: "{{ aci_vrf_leak_internal_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vrf_leak_internal_subnet.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vrf_leak_internal_subnet (only when model state is absent)
      cisco.aci.aci_vrf_leak_internal_subnet: "{{ aci_vrf_leak_internal_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vrf_leak_internal_subnet.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
