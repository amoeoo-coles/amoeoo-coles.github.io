---
# Sample playbook for cisco.aci.aci_interface_policy_lldp
# Build order: 081
# Manage LLDP interface policies (lldp:IfPol)
# Reads models/aci_interface_policy_lldp.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "081 aci_interface_policy_lldp"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_policy_lldp.yml
  tasks:
    - name: Ensure aci_interface_policy_lldp is present
      cisco.aci.aci_interface_policy_lldp: "{{ aci_interface_policy_lldp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_lldp.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_policy_lldp
      cisco.aci.aci_interface_policy_lldp: "{{ aci_interface_policy_lldp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_lldp.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_policy_lldp (only when model state is absent)
      cisco.aci.aci_interface_policy_lldp: "{{ aci_interface_policy_lldp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_lldp.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
