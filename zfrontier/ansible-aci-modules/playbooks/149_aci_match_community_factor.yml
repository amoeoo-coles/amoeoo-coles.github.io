---
# Sample playbook for cisco.aci.aci_match_community_factor
# Build order: 149
# Manage Match Community Factor (rtctrl:MatchCommFactor)
# Reads models/aci_match_community_factor.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "149 aci_match_community_factor"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_match_community_factor.yml
  tasks:
    - name: Ensure aci_match_community_factor is present
      cisco.aci.aci_match_community_factor: "{{ aci_match_community_factor | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_match_community_factor.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_match_community_factor
      cisco.aci.aci_match_community_factor: "{{ aci_match_community_factor | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_match_community_factor.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_match_community_factor (only when model state is absent)
      cisco.aci.aci_match_community_factor: "{{ aci_match_community_factor | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_match_community_factor.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
