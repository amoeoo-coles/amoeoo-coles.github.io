---
# Sample playbook for cisco.aci.aci_domain
# Build order: 068
# Manage physical, virtual, bridged, routed or FC domain profiles (phys:DomP, vmm:DomP, l2ext:DomP, l3ext:DomP, and fc:DomP)
# Reads models/aci_domain.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "068 aci_domain"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_domain.yml
  tasks:
    - name: Ensure aci_domain is present
      cisco.aci.aci_domain: "{{ aci_domain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_domain.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_domain
      cisco.aci.aci_domain: "{{ aci_domain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_domain.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_domain (only when model state is absent)
      cisco.aci.aci_domain: "{{ aci_domain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_domain.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
