---
# Sample playbook for cisco.aci.aci_l3out_interface
# Build order: 171
# Manage Layer 3 Outside (L3Out) interfaces (l3ext:RsPathL3OutAtt)
# Reads models/aci_l3out_interface.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "171 aci_l3out_interface"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_interface.yml
  tasks:
    - name: Ensure aci_l3out_interface is present
      cisco.aci.aci_l3out_interface: "{{ aci_l3out_interface | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_interface.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_interface
      cisco.aci.aci_l3out_interface: "{{ aci_l3out_interface | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_interface.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_interface (only when model state is absent)
      cisco.aci.aci_l3out_interface: "{{ aci_l3out_interface | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_interface.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
