---
# Sample playbook for cisco.aci.aci_l3out_hsrp_secondary_vip
# Build order: 184
# Manage HSRP Secondary Virtual IP of a HSRP group (hsrp:SecVip)
# Reads models/aci_l3out_hsrp_secondary_vip.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "184 aci_l3out_hsrp_secondary_vip"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_hsrp_secondary_vip.yml
  tasks:
    - name: Ensure aci_l3out_hsrp_secondary_vip is present
      cisco.aci.aci_l3out_hsrp_secondary_vip: "{{ aci_l3out_hsrp_secondary_vip | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_hsrp_secondary_vip.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_hsrp_secondary_vip
      cisco.aci.aci_l3out_hsrp_secondary_vip: "{{ aci_l3out_hsrp_secondary_vip | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_hsrp_secondary_vip.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_hsrp_secondary_vip (only when model state is absent)
      cisco.aci.aci_l3out_hsrp_secondary_vip: "{{ aci_l3out_hsrp_secondary_vip | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_hsrp_secondary_vip.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
