---
# Sample playbook for cisco.aci.aci_cloud_region
# Build order: 248
# Manage Cloud Providers Region (cloud:Region)
# Reads models/aci_cloud_region.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "248 aci_cloud_region"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_region.yml
  tasks:
    - name: Query aci_cloud_region
      cisco.aci.aci_cloud_region: "{{ aci_cloud_region | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_region.state | default('present')) in ['present', 'query']
      register: query_result
