---
# Sample playbook for cisco.aci.aci_cloud_aws_provider
# Build order: 250
# Manage Cloud AWS Provider (cloud:AwsProvider)
# Reads models/aci_cloud_aws_provider.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "250 aci_cloud_aws_provider"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_aws_provider.yml
  tasks:
    - name: Ensure aci_cloud_aws_provider is present
      cisco.aci.aci_cloud_aws_provider: "{{ aci_cloud_aws_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_cloud_aws_provider.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_cloud_aws_provider
      cisco.aci.aci_cloud_aws_provider: "{{ aci_cloud_aws_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_aws_provider.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_cloud_aws_provider (only when model state is absent)
      cisco.aci.aci_cloud_aws_provider: "{{ aci_cloud_aws_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_cloud_aws_provider.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
