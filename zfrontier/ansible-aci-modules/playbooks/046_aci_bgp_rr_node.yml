---
# Sample playbook for cisco.aci.aci_bgp_rr_node
# Build order: 046
# Manage BGP Route Reflector objects (bgp:RRNodePEp)
# Reads models/aci_bgp_rr_node.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "046 aci_bgp_rr_node"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_bgp_rr_node.yml
  tasks:
    - name: Ensure aci_bgp_rr_node is present
      cisco.aci.aci_bgp_rr_node: "{{ aci_bgp_rr_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_bgp_rr_node.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_bgp_rr_node
      cisco.aci.aci_bgp_rr_node: "{{ aci_bgp_rr_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_bgp_rr_node.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_bgp_rr_node (only when model state is absent)
      cisco.aci.aci_bgp_rr_node: "{{ aci_bgp_rr_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_bgp_rr_node.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
