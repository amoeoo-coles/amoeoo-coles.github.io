---
# Sample playbook for cisco.aci.aci_l4l7_device_selection_interface_context
# Build order: 236
# Manage L4-L7 Device Selection Policy Logical Interface Contexts (vns:LIfCtx)
# Reads models/aci_l4l7_device_selection_interface_context.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "236 aci_l4l7_device_selection_interface_context"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_device_selection_interface_context.yml
  tasks:
    - name: Ensure aci_l4l7_device_selection_interface_context is present
      cisco.aci.aci_l4l7_device_selection_interface_context: "{{ aci_l4l7_device_selection_interface_context | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_device_selection_interface_context.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_device_selection_interface_context
      cisco.aci.aci_l4l7_device_selection_interface_context: "{{ aci_l4l7_device_selection_interface_context | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_device_selection_interface_context.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_device_selection_interface_context (only when model state is absent)
      cisco.aci.aci_l4l7_device_selection_interface_context: "{{ aci_l4l7_device_selection_interface_context | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_device_selection_interface_context.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
