---
# Sample playbook for cisco.aci.aci_access_span_src_group_src_path
# Build order: 271
# Manage Access SPAN source paths (span:RsSrcToPathEp)
# Reads models/aci_access_span_src_group_src_path.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "271 aci_access_span_src_group_src_path"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_access_span_src_group_src_path.yml
  tasks:
    - name: Ensure aci_access_span_src_group_src_path is present
      cisco.aci.aci_access_span_src_group_src_path: "{{ aci_access_span_src_group_src_path | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_access_span_src_group_src_path.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_access_span_src_group_src_path
      cisco.aci.aci_access_span_src_group_src_path: "{{ aci_access_span_src_group_src_path | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_access_span_src_group_src_path.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_access_span_src_group_src_path (only when model state is absent)
      cisco.aci.aci_access_span_src_group_src_path: "{{ aci_access_span_src_group_src_path | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_access_span_src_group_src_path.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
