---
# Sample playbook for cisco.aci.aci_vmm_credential
# Build order: 071
# Manage virtual domain credential profiles (vmm:UsrAccP)
# Reads models/aci_vmm_credential.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "071 aci_vmm_credential"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vmm_credential.yml
  tasks:
    - name: Ensure aci_vmm_credential is present
      cisco.aci.aci_vmm_credential: "{{ aci_vmm_credential | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vmm_credential.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vmm_credential
      cisco.aci.aci_vmm_credential: "{{ aci_vmm_credential | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vmm_credential.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vmm_credential (only when model state is absent)
      cisco.aci.aci_vmm_credential: "{{ aci_vmm_credential | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vmm_credential.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
