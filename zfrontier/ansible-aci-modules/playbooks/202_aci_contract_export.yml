---
# Sample playbook for cisco.aci.aci_contract_export
# Build order: 202
# Manage contract interfaces (vz:CPIf)
# Reads models/aci_contract_export.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "202 aci_contract_export"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_contract_export.yml
  tasks:
    - name: Ensure aci_contract_export is present
      cisco.aci.aci_contract_export: "{{ aci_contract_export | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_contract_export.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_contract_export
      cisco.aci.aci_contract_export: "{{ aci_contract_export | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_contract_export.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_contract_export (only when model state is absent)
      cisco.aci.aci_contract_export: "{{ aci_contract_export | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_contract_export.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
