---
# Sample playbook for cisco.aci.aci_system_endpoint_controls
# Build order: 004
# Manage System Endpoint Controls (ep:IpAgingP, ep:ControlP, and ep:LoopProtectP)
# Reads models/aci_system_endpoint_controls.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "004 aci_system_endpoint_controls"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_system_endpoint_controls.yml
  tasks:
    - name: Ensure aci_system_endpoint_controls is present
      cisco.aci.aci_system_endpoint_controls: "{{ aci_system_endpoint_controls | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_system_endpoint_controls.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_system_endpoint_controls
      cisco.aci.aci_system_endpoint_controls: "{{ aci_system_endpoint_controls | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_system_endpoint_controls.state | default('present')) in ['present', 'query']
      register: query_result
