---
# Sample playbook for cisco.aci.aci_esg
# Build order: 214
# Manage Endpoint Security Groups (ESGs) objects (fv:ESg)
# Reads models/aci_esg.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "214 aci_esg"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_esg.yml
  tasks:
    - name: Ensure aci_esg is present
      cisco.aci.aci_esg: "{{ aci_esg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_esg.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_esg
      cisco.aci.aci_esg: "{{ aci_esg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_esg.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_esg (only when model state is absent)
      cisco.aci.aci_esg: "{{ aci_esg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_esg.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
