---
# Sample playbook for cisco.aci.aci_interface_policy_link_level
# Build order: 084
# Manage Link Level interface policies (fabric:HIfPol)
# Reads models/aci_interface_policy_link_level.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "084 aci_interface_policy_link_level"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_policy_link_level.yml
  tasks:
    - name: Ensure aci_interface_policy_link_level is present
      cisco.aci.aci_interface_policy_link_level: "{{ aci_interface_policy_link_level | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_link_level.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_policy_link_level
      cisco.aci.aci_interface_policy_link_level: "{{ aci_interface_policy_link_level | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_link_level.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_policy_link_level (only when model state is absent)
      cisco.aci.aci_interface_policy_link_level: "{{ aci_interface_policy_link_level | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_link_level.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
