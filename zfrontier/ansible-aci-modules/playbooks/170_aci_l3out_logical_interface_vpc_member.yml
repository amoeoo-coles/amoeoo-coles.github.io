---
# Sample playbook for cisco.aci.aci_l3out_logical_interface_vpc_member
# Build order: 170
# Manage Member Node objects (l3ext:Member)
# Reads models/aci_l3out_logical_interface_vpc_member.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "170 aci_l3out_logical_interface_vpc_member"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_logical_interface_vpc_member.yml
  tasks:
    - name: Ensure aci_l3out_logical_interface_vpc_member is present
      cisco.aci.aci_l3out_logical_interface_vpc_member: "{{ aci_l3out_logical_interface_vpc_member | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_logical_interface_vpc_member.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_logical_interface_vpc_member
      cisco.aci.aci_l3out_logical_interface_vpc_member: "{{ aci_l3out_logical_interface_vpc_member | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_logical_interface_vpc_member.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_logical_interface_vpc_member (only when model state is absent)
      cisco.aci.aci_l3out_logical_interface_vpc_member: "{{ aci_l3out_logical_interface_vpc_member | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_logical_interface_vpc_member.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
