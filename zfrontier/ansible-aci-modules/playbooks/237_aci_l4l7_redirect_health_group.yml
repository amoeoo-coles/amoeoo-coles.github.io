---
# Sample playbook for cisco.aci.aci_l4l7_redirect_health_group
# Build order: 237
# Manage L4-L7 Redirect Health Groups (vns:RedirectHealthGroup)
# Reads models/aci_l4l7_redirect_health_group.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "237 aci_l4l7_redirect_health_group"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_redirect_health_group.yml
  tasks:
    - name: Ensure aci_l4l7_redirect_health_group is present
      cisco.aci.aci_l4l7_redirect_health_group: "{{ aci_l4l7_redirect_health_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_redirect_health_group.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_redirect_health_group
      cisco.aci.aci_l4l7_redirect_health_group: "{{ aci_l4l7_redirect_health_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_redirect_health_group.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_redirect_health_group (only when model state is absent)
      cisco.aci.aci_l4l7_redirect_health_group: "{{ aci_l4l7_redirect_health_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_redirect_health_group.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
