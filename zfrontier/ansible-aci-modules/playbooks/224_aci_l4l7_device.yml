---
# Sample playbook for cisco.aci.aci_l4l7_device
# Build order: 224
# Manage L4-L7 Devices (vns:LDevVip)
# Reads models/aci_l4l7_device.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "224 aci_l4l7_device"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_device.yml
  tasks:
    - name: Ensure aci_l4l7_device is present
      cisco.aci.aci_l4l7_device: "{{ aci_l4l7_device | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_device.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_device
      cisco.aci.aci_l4l7_device: "{{ aci_l4l7_device | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_device.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_device (only when model state is absent)
      cisco.aci.aci_l4l7_device: "{{ aci_l4l7_device | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_device.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
