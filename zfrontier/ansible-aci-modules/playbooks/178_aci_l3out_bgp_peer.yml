---
# Sample playbook for cisco.aci.aci_l3out_bgp_peer
# Build order: 178
# Manage Layer 3 Outside (L3Out) BGP Peers (bgp:PeerP and bgp:InfraPeerP)
# Reads models/aci_l3out_bgp_peer.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "178 aci_l3out_bgp_peer"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_bgp_peer.yml
  tasks:
    - name: Ensure aci_l3out_bgp_peer is present
      cisco.aci.aci_l3out_bgp_peer: "{{ aci_l3out_bgp_peer | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_bgp_peer.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_bgp_peer
      cisco.aci.aci_l3out_bgp_peer: "{{ aci_l3out_bgp_peer | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_bgp_peer.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_bgp_peer (only when model state is absent)
      cisco.aci.aci_l3out_bgp_peer: "{{ aci_l3out_bgp_peer | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_bgp_peer.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
