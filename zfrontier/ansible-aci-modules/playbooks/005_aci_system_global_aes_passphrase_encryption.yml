---
# Sample playbook for cisco.aci.aci_system_global_aes_passphrase_encryption
# Build order: 005
# Manage Global AES Passphrase Encryption Settings (pki:ExportEncryptionKey)
# Reads models/aci_system_global_aes_passphrase_encryption.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "005 aci_system_global_aes_passphrase_encryption"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_system_global_aes_passphrase_encryption.yml
  tasks:
    - name: Ensure aci_system_global_aes_passphrase_encryption is present
      cisco.aci.aci_system_global_aes_passphrase_encryption: "{{ aci_system_global_aes_passphrase_encryption | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_system_global_aes_passphrase_encryption.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_system_global_aes_passphrase_encryption
      cisco.aci.aci_system_global_aes_passphrase_encryption: "{{ aci_system_global_aes_passphrase_encryption | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_system_global_aes_passphrase_encryption.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_system_global_aes_passphrase_encryption (only when model state is absent)
      cisco.aci.aci_system_global_aes_passphrase_encryption: "{{ aci_system_global_aes_passphrase_encryption | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_system_global_aes_passphrase_encryption.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
