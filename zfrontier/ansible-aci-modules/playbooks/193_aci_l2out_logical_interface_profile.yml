---
# Sample playbook for cisco.aci.aci_l2out_logical_interface_profile
# Build order: 193
# Manage Layer 2 Outside (L2Out) interface profiles (l2ext:LIfP)
# Reads models/aci_l2out_logical_interface_profile.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "193 aci_l2out_logical_interface_profile"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l2out_logical_interface_profile.yml
  tasks:
    - name: Ensure aci_l2out_logical_interface_profile is present
      cisco.aci.aci_l2out_logical_interface_profile: "{{ aci_l2out_logical_interface_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l2out_logical_interface_profile.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l2out_logical_interface_profile
      cisco.aci.aci_l2out_logical_interface_profile: "{{ aci_l2out_logical_interface_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l2out_logical_interface_profile.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l2out_logical_interface_profile (only when model state is absent)
      cisco.aci.aci_l2out_logical_interface_profile: "{{ aci_l2out_logical_interface_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l2out_logical_interface_profile.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
