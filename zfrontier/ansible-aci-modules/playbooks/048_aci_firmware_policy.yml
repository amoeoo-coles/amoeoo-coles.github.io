---
# Sample playbook for cisco.aci.aci_firmware_policy
# Build order: 048
# Manage firmware policies (firmware:FwP)
# Reads models/aci_firmware_policy.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "048 aci_firmware_policy"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_firmware_policy.yml
  tasks:
    - name: Ensure aci_firmware_policy is present
      cisco.aci.aci_firmware_policy: "{{ aci_firmware_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_firmware_policy.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_firmware_policy
      cisco.aci.aci_firmware_policy: "{{ aci_firmware_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_firmware_policy.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_firmware_policy (only when model state is absent)
      cisco.aci.aci_firmware_policy: "{{ aci_firmware_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_firmware_policy.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
