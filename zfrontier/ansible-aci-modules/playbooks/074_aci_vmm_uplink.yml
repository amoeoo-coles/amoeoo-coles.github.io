---
# Sample playbook for cisco.aci.aci_vmm_uplink
# Build order: 074
# Manage VMM uplinks (vmm:UplinkP)
# Reads models/aci_vmm_uplink.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "074 aci_vmm_uplink"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vmm_uplink.yml
  tasks:
    - name: Ensure aci_vmm_uplink is present
      cisco.aci.aci_vmm_uplink: "{{ aci_vmm_uplink | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vmm_uplink.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vmm_uplink
      cisco.aci.aci_vmm_uplink: "{{ aci_vmm_uplink | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vmm_uplink.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vmm_uplink (only when model state is absent)
      cisco.aci.aci_vmm_uplink: "{{ aci_vmm_uplink | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vmm_uplink.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
