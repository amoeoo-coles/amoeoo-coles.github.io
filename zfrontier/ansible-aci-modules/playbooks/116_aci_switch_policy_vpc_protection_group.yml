---
# Sample playbook for cisco.aci.aci_switch_policy_vpc_protection_group
# Build order: 116
# Manage switch policy explicit vPC protection groups (fabric:ExplicitGEp and fabric:NodePEp).
# Reads models/aci_switch_policy_vpc_protection_group.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "116 aci_switch_policy_vpc_protection_group"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_switch_policy_vpc_protection_group.yml
  tasks:
    - name: Ensure aci_switch_policy_vpc_protection_group is present
      cisco.aci.aci_switch_policy_vpc_protection_group: "{{ aci_switch_policy_vpc_protection_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_switch_policy_vpc_protection_group.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_switch_policy_vpc_protection_group
      cisco.aci.aci_switch_policy_vpc_protection_group: "{{ aci_switch_policy_vpc_protection_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_switch_policy_vpc_protection_group.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_switch_policy_vpc_protection_group (only when model state is absent)
      cisco.aci.aci_switch_policy_vpc_protection_group: "{{ aci_switch_policy_vpc_protection_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_switch_policy_vpc_protection_group.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
