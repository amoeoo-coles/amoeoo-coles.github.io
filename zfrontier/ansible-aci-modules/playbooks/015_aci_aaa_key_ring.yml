---
# Sample playbook for cisco.aci.aci_aaa_key_ring
# Build order: 015
# Manage AAA Key Rings (pki:KeyRing)
# Reads models/aci_aaa_key_ring.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "015 aci_aaa_key_ring"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_aaa_key_ring.yml
  tasks:
    - name: Ensure aci_aaa_key_ring is present
      cisco.aci.aci_aaa_key_ring: "{{ aci_aaa_key_ring | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_aaa_key_ring.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_aaa_key_ring
      cisco.aci.aci_aaa_key_ring: "{{ aci_aaa_key_ring | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_aaa_key_ring.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_aaa_key_ring (only when model state is absent)
      cisco.aci.aci_aaa_key_ring: "{{ aci_aaa_key_ring | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_aaa_key_ring.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
