---
# Sample playbook for cisco.aci.aci_bd_dhcp_label
# Build order: 160
# Manage DHCP Labels (dhcp:Lbl)
# Reads models/aci_bd_dhcp_label.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "160 aci_bd_dhcp_label"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_bd_dhcp_label.yml
  tasks:
    - name: Ensure aci_bd_dhcp_label is present
      cisco.aci.aci_bd_dhcp_label: "{{ aci_bd_dhcp_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_bd_dhcp_label.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_bd_dhcp_label
      cisco.aci.aci_bd_dhcp_label: "{{ aci_bd_dhcp_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_bd_dhcp_label.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_bd_dhcp_label (only when model state is absent)
      cisco.aci.aci_bd_dhcp_label: "{{ aci_bd_dhcp_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_bd_dhcp_label.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
