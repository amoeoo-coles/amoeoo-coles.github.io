---
# Sample playbook for cisco.aci.aci_file_remote_path
# Build order: 282
# Manage Import/Export File Remote Paths (file:RemotePath)
# Reads models/aci_file_remote_path.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "282 aci_file_remote_path"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_file_remote_path.yml
  tasks:
    - name: Ensure aci_file_remote_path is present
      cisco.aci.aci_file_remote_path: "{{ aci_file_remote_path | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_file_remote_path.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_file_remote_path
      cisco.aci.aci_file_remote_path: "{{ aci_file_remote_path | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_file_remote_path.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_file_remote_path (only when model state is absent)
      cisco.aci.aci_file_remote_path: "{{ aci_file_remote_path | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_file_remote_path.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
