---
# Sample playbook for cisco.aci.aci_l3out_logical_node
# Build order: 167
# Manage Layer 3 Outside (L3Out) logical node profile nodes (l3ext:RsNodeL3OutAtt)
# Reads models/aci_l3out_logical_node.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "167 aci_l3out_logical_node"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_logical_node.yml
  tasks:
    - name: Ensure aci_l3out_logical_node is present
      cisco.aci.aci_l3out_logical_node: "{{ aci_l3out_logical_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_logical_node.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_logical_node
      cisco.aci.aci_l3out_logical_node: "{{ aci_l3out_logical_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_logical_node.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_logical_node (only when model state is absent)
      cisco.aci.aci_l3out_logical_node: "{{ aci_l3out_logical_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_logical_node.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
