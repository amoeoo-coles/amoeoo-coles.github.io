---
# Sample playbook for cisco.aci.aci_domain_to_vlan_pool
# Build order: 070
# Bind Domain to VLAN Pools (infra:RsVlanNs)
# Reads models/aci_domain_to_vlan_pool.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "070 aci_domain_to_vlan_pool"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_domain_to_vlan_pool.yml
  tasks:
    - name: Ensure aci_domain_to_vlan_pool is present
      cisco.aci.aci_domain_to_vlan_pool: "{{ aci_domain_to_vlan_pool | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_domain_to_vlan_pool.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_domain_to_vlan_pool
      cisco.aci.aci_domain_to_vlan_pool: "{{ aci_domain_to_vlan_pool | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_domain_to_vlan_pool.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_domain_to_vlan_pool (only when model state is absent)
      cisco.aci.aci_domain_to_vlan_pool: "{{ aci_domain_to_vlan_pool | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_domain_to_vlan_pool.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
