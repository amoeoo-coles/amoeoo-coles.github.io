---
# Sample playbook for cisco.aci.aci_l2out
# Build order: 191
# Manage Layer2 Out (L2Out) objects (l2ext:Out)
# Reads models/aci_l2out.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "191 aci_l2out"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l2out.yml
  tasks:
    - name: Ensure aci_l2out is present
      cisco.aci.aci_l2out: "{{ aci_l2out | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l2out.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l2out
      cisco.aci.aci_l2out: "{{ aci_l2out | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l2out.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l2out (only when model state is absent)
      cisco.aci.aci_l2out: "{{ aci_l2out | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l2out.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
