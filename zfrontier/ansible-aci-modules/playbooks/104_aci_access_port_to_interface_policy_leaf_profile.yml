---
# Sample playbook for cisco.aci.aci_access_port_to_interface_policy_leaf_profile
# Build order: 104
# Manage Fabric interface policy leaf profile interface selectors (infra:HPortS, infra:RsAccBaseGrp, and infra:PortBlk)
# Reads models/aci_access_port_to_interface_policy_leaf_profile.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "104 aci_access_port_to_interface_policy_leaf_profile"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_access_port_to_interface_policy_leaf_profile.yml
  tasks:
    - name: Ensure aci_access_port_to_interface_policy_leaf_profile is present
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile: "{{ aci_access_port_to_interface_policy_leaf_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_access_port_to_interface_policy_leaf_profile.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_access_port_to_interface_policy_leaf_profile
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile: "{{ aci_access_port_to_interface_policy_leaf_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_access_port_to_interface_policy_leaf_profile.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_access_port_to_interface_policy_leaf_profile (only when model state is absent)
      cisco.aci.aci_access_port_to_interface_policy_leaf_profile: "{{ aci_access_port_to_interface_policy_leaf_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_access_port_to_interface_policy_leaf_profile.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
