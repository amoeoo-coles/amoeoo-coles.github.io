---
# Sample playbook for cisco.aci.aci_action_rule_additional_communities
# Build order: 153
# Manage Action Rules based on Additional Communities (rtctrl:SetAddComm)
# Reads models/aci_action_rule_additional_communities.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "153 aci_action_rule_additional_communities"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_action_rule_additional_communities.yml
  tasks:
    - name: Ensure aci_action_rule_additional_communities is present
      cisco.aci.aci_action_rule_additional_communities: "{{ aci_action_rule_additional_communities | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_action_rule_additional_communities.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_action_rule_additional_communities
      cisco.aci.aci_action_rule_additional_communities: "{{ aci_action_rule_additional_communities | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_action_rule_additional_communities.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_action_rule_additional_communities (only when model state is absent)
      cisco.aci.aci_action_rule_additional_communities: "{{ aci_action_rule_additional_communities | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_action_rule_additional_communities.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
