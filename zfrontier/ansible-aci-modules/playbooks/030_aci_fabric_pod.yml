---
# Sample playbook for cisco.aci.aci_fabric_pod
# Build order: 030
# Manage Fabric Pod Setup Policy (fabric:SetupP)
# Reads models/aci_fabric_pod.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "030 aci_fabric_pod"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_pod.yml
  tasks:
    - name: Ensure aci_fabric_pod is present
      cisco.aci.aci_fabric_pod: "{{ aci_fabric_pod | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_pod.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_pod
      cisco.aci.aci_fabric_pod: "{{ aci_fabric_pod | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_pod.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_pod (only when model state is absent)
      cisco.aci.aci_fabric_pod: "{{ aci_fabric_pod | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_pod.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
