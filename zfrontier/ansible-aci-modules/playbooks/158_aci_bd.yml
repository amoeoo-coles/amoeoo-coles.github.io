---
# Sample playbook for cisco.aci.aci_bd
# Build order: 158
# Manage Bridge Domains (BD) objects (fv:BD)
# Reads models/aci_bd.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "158 aci_bd"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_bd.yml
  tasks:
    - name: Ensure aci_bd is present
      cisco.aci.aci_bd: "{{ aci_bd | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_bd.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_bd
      cisco.aci.aci_bd: "{{ aci_bd | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_bd.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_bd (only when model state is absent)
      cisco.aci.aci_bd: "{{ aci_bd | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_bd.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
