---
# Sample playbook for cisco.aci.aci_dhcp_option
# Build order: 132
# Manage DHCP Option (dhcp:Option)
# Reads models/aci_dhcp_option.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "132 aci_dhcp_option"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_dhcp_option.yml
  tasks:
    - name: Ensure aci_dhcp_option is present
      cisco.aci.aci_dhcp_option: "{{ aci_dhcp_option | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_option.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_dhcp_option
      cisco.aci.aci_dhcp_option: "{{ aci_dhcp_option | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_option.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_dhcp_option (only when model state is absent)
      cisco.aci.aci_dhcp_option: "{{ aci_dhcp_option | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_dhcp_option.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
