---
# Sample playbook for cisco.aci.aci_fabric_external_routing_profile
# Build order: 242
# Manage Fabric External Routing Profiles (l3ext:FabricExtRoutingP)
# Reads models/aci_fabric_external_routing_profile.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "242 aci_fabric_external_routing_profile"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_external_routing_profile.yml
  tasks:
    - name: Ensure aci_fabric_external_routing_profile is present
      cisco.aci.aci_fabric_external_routing_profile: "{{ aci_fabric_external_routing_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_external_routing_profile.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_external_routing_profile
      cisco.aci.aci_fabric_external_routing_profile: "{{ aci_fabric_external_routing_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_external_routing_profile.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_external_routing_profile (only when model state is absent)
      cisco.aci.aci_fabric_external_routing_profile: "{{ aci_fabric_external_routing_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_external_routing_profile.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
