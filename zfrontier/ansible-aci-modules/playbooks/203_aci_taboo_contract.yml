---
# Sample playbook for cisco.aci.aci_taboo_contract
# Build order: 203
# Manage taboo contracts (vz:BrCP)
# Reads models/aci_taboo_contract.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "203 aci_taboo_contract"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_taboo_contract.yml
  tasks:
    - name: Ensure aci_taboo_contract is present
      cisco.aci.aci_taboo_contract: "{{ aci_taboo_contract | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_taboo_contract.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_taboo_contract
      cisco.aci.aci_taboo_contract: "{{ aci_taboo_contract | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_taboo_contract.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_taboo_contract (only when model state is absent)
      cisco.aci.aci_taboo_contract: "{{ aci_taboo_contract | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_taboo_contract.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
