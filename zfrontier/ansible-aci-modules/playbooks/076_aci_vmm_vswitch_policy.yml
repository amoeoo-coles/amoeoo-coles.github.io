---
# Sample playbook for cisco.aci.aci_vmm_vswitch_policy
# Build order: 076
# Manage vSwitch policy for VMware virtual domains profiles (vmm:VSwitchPolicyCont)
# Reads models/aci_vmm_vswitch_policy.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "076 aci_vmm_vswitch_policy"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vmm_vswitch_policy.yml
  tasks:
    - name: Ensure aci_vmm_vswitch_policy is present
      cisco.aci.aci_vmm_vswitch_policy: "{{ aci_vmm_vswitch_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vmm_vswitch_policy.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vmm_vswitch_policy
      cisco.aci.aci_vmm_vswitch_policy: "{{ aci_vmm_vswitch_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vmm_vswitch_policy.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vmm_vswitch_policy (only when model state is absent)
      cisco.aci.aci_vmm_vswitch_policy: "{{ aci_vmm_vswitch_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vmm_vswitch_policy.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
