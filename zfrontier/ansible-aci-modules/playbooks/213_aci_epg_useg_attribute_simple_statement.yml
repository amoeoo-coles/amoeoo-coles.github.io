---
# Sample playbook for cisco.aci.aci_epg_useg_attribute_simple_statement
# Build order: 213
# Manage EPG useg Attributes Simple Statements (fv:DnsAttr, fv:IdGroupAttr, fv:IpAttr, fv:MacAttr, and fv:VmAttr)
# Reads models/aci_epg_useg_attribute_simple_statement.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "213 aci_epg_useg_attribute_simple_statement"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_epg_useg_attribute_simple_statement.yml
  tasks:
    - name: Ensure aci_epg_useg_attribute_simple_statement is present
      cisco.aci.aci_epg_useg_attribute_simple_statement: "{{ aci_epg_useg_attribute_simple_statement | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_epg_useg_attribute_simple_statement.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_epg_useg_attribute_simple_statement
      cisco.aci.aci_epg_useg_attribute_simple_statement: "{{ aci_epg_useg_attribute_simple_statement | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_epg_useg_attribute_simple_statement.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_epg_useg_attribute_simple_statement (only when model state is absent)
      cisco.aci.aci_epg_useg_attribute_simple_statement: "{{ aci_epg_useg_attribute_simple_statement | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_epg_useg_attribute_simple_statement.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
