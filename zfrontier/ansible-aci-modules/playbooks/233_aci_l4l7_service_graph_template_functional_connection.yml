---
# Sample playbook for cisco.aci.aci_l4l7_service_graph_template_functional_connection
# Build order: 233
# Manage L4-L7 Service Graph Templates Functional Connections (vns:AbsFuncConn)
# Reads models/aci_l4l7_service_graph_template_functional_connection.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "233 aci_l4l7_service_graph_template_functional_connection"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_service_graph_template_functional_connection.yml
  tasks:
    - name: Ensure aci_l4l7_service_graph_template_functional_connection is present
      cisco.aci.aci_l4l7_service_graph_template_functional_connection: "{{ aci_l4l7_service_graph_template_functional_connection | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_service_graph_template_functional_connection.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_service_graph_template_functional_connection
      cisco.aci.aci_l4l7_service_graph_template_functional_connection: "{{ aci_l4l7_service_graph_template_functional_connection | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_service_graph_template_functional_connection.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_service_graph_template_functional_connection (only when model state is absent)
      cisco.aci.aci_l4l7_service_graph_template_functional_connection: "{{ aci_l4l7_service_graph_template_functional_connection | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_service_graph_template_functional_connection.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
