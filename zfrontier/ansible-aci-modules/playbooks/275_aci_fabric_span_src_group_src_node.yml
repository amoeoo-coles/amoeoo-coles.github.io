---
# Sample playbook for cisco.aci.aci_fabric_span_src_group_src_node
# Build order: 275
# Manage Fabric SPAN source nodes (span:RsSrcToNode)
# Reads models/aci_fabric_span_src_group_src_node.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "275 aci_fabric_span_src_group_src_node"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_span_src_group_src_node.yml
  tasks:
    - name: Ensure aci_fabric_span_src_group_src_node is present
      cisco.aci.aci_fabric_span_src_group_src_node: "{{ aci_fabric_span_src_group_src_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_span_src_group_src_node.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_span_src_group_src_node
      cisco.aci.aci_fabric_span_src_group_src_node: "{{ aci_fabric_span_src_group_src_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_span_src_group_src_node.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_span_src_group_src_node (only when model state is absent)
      cisco.aci.aci_fabric_span_src_group_src_node: "{{ aci_fabric_span_src_group_src_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_span_src_group_src_node.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
