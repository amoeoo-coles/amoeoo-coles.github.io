---
# Sample playbook for cisco.aci.aci_oob_contract
# Build order: 063
# Manage Out-of-Band (OOB) Contract resources (vz:OOBBrCP)
# Reads models/aci_oob_contract.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "063 aci_oob_contract"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_oob_contract.yml
  tasks:
    - name: Ensure aci_oob_contract is present
      cisco.aci.aci_oob_contract: "{{ aci_oob_contract | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_oob_contract.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_oob_contract
      cisco.aci.aci_oob_contract: "{{ aci_oob_contract | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_oob_contract.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_oob_contract (only when model state is absent)
      cisco.aci.aci_oob_contract: "{{ aci_oob_contract | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_oob_contract.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
