---
# Sample playbook for cisco.aci.aci_cloud_subnet
# Build order: 254
# Manage Cloud Subnet (cloud:Subnet)
# Reads models/aci_cloud_subnet.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "254 aci_cloud_subnet"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_subnet.yml
  tasks:
    - name: Ensure aci_cloud_subnet is present
      cisco.aci.aci_cloud_subnet: "{{ aci_cloud_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_cloud_subnet.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_cloud_subnet
      cisco.aci.aci_cloud_subnet: "{{ aci_cloud_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_subnet.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_cloud_subnet (only when model state is absent)
      cisco.aci.aci_cloud_subnet: "{{ aci_cloud_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_cloud_subnet.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
