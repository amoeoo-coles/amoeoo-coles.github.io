---
# Sample playbook for cisco.aci.aci_match_as_path_regex_term
# Build order: 151
# Manage Match Regular Expression AS-Path Term (rtctrl:MatchAsPathRegexTerm)
# Reads models/aci_match_as_path_regex_term.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "151 aci_match_as_path_regex_term"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_match_as_path_regex_term.yml
  tasks:
    - name: Ensure aci_match_as_path_regex_term is present
      cisco.aci.aci_match_as_path_regex_term: "{{ aci_match_as_path_regex_term | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_match_as_path_regex_term.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_match_as_path_regex_term
      cisco.aci.aci_match_as_path_regex_term: "{{ aci_match_as_path_regex_term | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_match_as_path_regex_term.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_match_as_path_regex_term (only when model state is absent)
      cisco.aci.aci_match_as_path_regex_term: "{{ aci_match_as_path_regex_term | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_match_as_path_regex_term.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
