---
# Sample playbook for cisco.aci.aci_l4l7_policy_based_redirect
# Build order: 238
# Manage L4-L7 Policy Based Redirection Policies (vns:SvcRedirectPol)
# Reads models/aci_l4l7_policy_based_redirect.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "238 aci_l4l7_policy_based_redirect"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_policy_based_redirect.yml
  tasks:
    - name: Ensure aci_l4l7_policy_based_redirect is present
      cisco.aci.aci_l4l7_policy_based_redirect: "{{ aci_l4l7_policy_based_redirect | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_policy_based_redirect.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_policy_based_redirect
      cisco.aci.aci_l4l7_policy_based_redirect: "{{ aci_l4l7_policy_based_redirect | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_policy_based_redirect.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_policy_based_redirect (only when model state is absent)
      cisco.aci.aci_l4l7_policy_based_redirect: "{{ aci_l4l7_policy_based_redirect | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_policy_based_redirect.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
