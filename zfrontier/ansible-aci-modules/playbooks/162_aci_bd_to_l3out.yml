---
# Sample playbook for cisco.aci.aci_bd_to_l3out
# Build order: 162
# Bind Bridge Domain to L3 Out (fv:RsBDToOut)
# Reads models/aci_bd_to_l3out.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "162 aci_bd_to_l3out"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_bd_to_l3out.yml
  tasks:
    - name: Ensure aci_bd_to_l3out is present
      cisco.aci.aci_bd_to_l3out: "{{ aci_bd_to_l3out | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_bd_to_l3out.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_bd_to_l3out
      cisco.aci.aci_bd_to_l3out: "{{ aci_bd_to_l3out | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_bd_to_l3out.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_bd_to_l3out (only when model state is absent)
      cisco.aci.aci_bd_to_l3out: "{{ aci_bd_to_l3out | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_bd_to_l3out.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
