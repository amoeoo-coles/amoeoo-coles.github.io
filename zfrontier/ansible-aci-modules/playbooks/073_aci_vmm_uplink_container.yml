---
# Sample playbook for cisco.aci.aci_vmm_uplink_container
# Build order: 073
# Manage VMM uplink containers (vmm:UplinkPCont)
# Reads models/aci_vmm_uplink_container.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "073 aci_vmm_uplink_container"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vmm_uplink_container.yml
  tasks:
    - name: Ensure aci_vmm_uplink_container is present
      cisco.aci.aci_vmm_uplink_container: "{{ aci_vmm_uplink_container | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vmm_uplink_container.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vmm_uplink_container
      cisco.aci.aci_vmm_uplink_container: "{{ aci_vmm_uplink_container | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vmm_uplink_container.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vmm_uplink_container (only when model state is absent)
      cisco.aci.aci_vmm_uplink_container: "{{ aci_vmm_uplink_container | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vmm_uplink_container.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
