---
# Sample playbook for cisco.aci.aci_aaa_user_certificate
# Build order: 012
# Manage AAA user certificates (aaa:UserCert)
# Reads models/aci_aaa_user_certificate.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "012 aci_aaa_user_certificate"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_aaa_user_certificate.yml
  tasks:
    - name: Ensure aci_aaa_user_certificate is present
      cisco.aci.aci_aaa_user_certificate: "{{ aci_aaa_user_certificate | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_aaa_user_certificate.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_aaa_user_certificate
      cisco.aci.aci_aaa_user_certificate: "{{ aci_aaa_user_certificate | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_aaa_user_certificate.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_aaa_user_certificate (only when model state is absent)
      cisco.aci.aci_aaa_user_certificate: "{{ aci_aaa_user_certificate | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_aaa_user_certificate.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
