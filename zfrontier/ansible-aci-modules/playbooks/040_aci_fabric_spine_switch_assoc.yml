---
# Sample playbook for cisco.aci.aci_fabric_spine_switch_assoc
# Build order: 040
# Manage spine switch bindings to profiles and policy groups (fabric:SpineS and fabric:RsSpNodePGrp)
# Reads models/aci_fabric_spine_switch_assoc.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "040 aci_fabric_spine_switch_assoc"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_spine_switch_assoc.yml
  tasks:
    - name: Ensure aci_fabric_spine_switch_assoc is present
      cisco.aci.aci_fabric_spine_switch_assoc: "{{ aci_fabric_spine_switch_assoc | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_spine_switch_assoc.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_spine_switch_assoc
      cisco.aci.aci_fabric_spine_switch_assoc: "{{ aci_fabric_spine_switch_assoc | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_spine_switch_assoc.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_spine_switch_assoc (only when model state is absent)
      cisco.aci.aci_fabric_spine_switch_assoc: "{{ aci_fabric_spine_switch_assoc | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_spine_switch_assoc.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
