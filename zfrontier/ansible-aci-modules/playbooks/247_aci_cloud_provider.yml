---
# Sample playbook for cisco.aci.aci_cloud_provider
# Build order: 247
# Query Cloud Provider information (cloud:ProvP)
# Reads models/aci_cloud_provider.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "247 aci_cloud_provider"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_provider.yml
  tasks:
    - name: Query aci_cloud_provider
      cisco.aci.aci_cloud_provider: "{{ aci_cloud_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_provider.state | default('present')) in ['present', 'query']
      register: query_result
