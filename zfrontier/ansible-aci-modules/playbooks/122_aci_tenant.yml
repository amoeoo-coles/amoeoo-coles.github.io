---
# Sample playbook for cisco.aci.aci_tenant
# Build order: 122
# Manage tenants (fv:Tenant)
# Reads models/aci_tenant.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "122 aci_tenant"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_tenant.yml
  tasks:
    - name: Ensure aci_tenant is present
      cisco.aci.aci_tenant: "{{ aci_tenant | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_tenant.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_tenant
      cisco.aci.aci_tenant: "{{ aci_tenant | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_tenant.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_tenant (only when model state is absent)
      cisco.aci.aci_tenant: "{{ aci_tenant | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_tenant.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
