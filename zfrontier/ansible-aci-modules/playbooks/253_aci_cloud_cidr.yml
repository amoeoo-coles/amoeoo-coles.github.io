---
# Sample playbook for cisco.aci.aci_cloud_cidr
# Build order: 253
# Manage CIDR under Cloud Context Profile (cloud:Cidr)
# Reads models/aci_cloud_cidr.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "253 aci_cloud_cidr"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_cidr.yml
  tasks:
    - name: Ensure aci_cloud_cidr is present
      cisco.aci.aci_cloud_cidr: "{{ aci_cloud_cidr | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_cloud_cidr.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_cloud_cidr
      cisco.aci.aci_cloud_cidr: "{{ aci_cloud_cidr | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_cidr.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_cloud_cidr (only when model state is absent)
      cisco.aci.aci_cloud_cidr: "{{ aci_cloud_cidr | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_cloud_cidr.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
