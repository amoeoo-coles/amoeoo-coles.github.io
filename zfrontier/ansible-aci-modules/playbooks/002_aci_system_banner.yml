---
# Sample playbook for cisco.aci.aci_system_banner
# Build order: 002
# Manages Alias and Banners (aaa:PreLoginBanner)
# Reads models/aci_system_banner.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "002 aci_system_banner"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_system_banner.yml
  tasks:
    - name: Ensure aci_system_banner is present
      cisco.aci.aci_system_banner: "{{ aci_system_banner | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_system_banner.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_system_banner
      cisco.aci.aci_system_banner: "{{ aci_system_banner | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_system_banner.state | default('present')) in ['present', 'query']
      register: query_result
