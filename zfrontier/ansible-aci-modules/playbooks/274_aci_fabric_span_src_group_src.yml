---
# Sample playbook for cisco.aci.aci_fabric_span_src_group_src
# Build order: 274
# Manage Fabric SPAN sources (span:Src)
# Reads models/aci_fabric_span_src_group_src.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "274 aci_fabric_span_src_group_src"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_fabric_span_src_group_src.yml
  tasks:
    - name: Ensure aci_fabric_span_src_group_src is present
      cisco.aci.aci_fabric_span_src_group_src: "{{ aci_fabric_span_src_group_src | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_fabric_span_src_group_src.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_fabric_span_src_group_src
      cisco.aci.aci_fabric_span_src_group_src: "{{ aci_fabric_span_src_group_src | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_fabric_span_src_group_src.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_fabric_span_src_group_src (only when model state is absent)
      cisco.aci.aci_fabric_span_src_group_src: "{{ aci_fabric_span_src_group_src | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_fabric_span_src_group_src.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
