---
# Sample playbook for cisco.aci.aci_aaa_security_default_settings
# Build order: 016
# Manage AAA Key Rings (pki:Ep)
# Reads models/aci_aaa_security_default_settings.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "016 aci_aaa_security_default_settings"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_aaa_security_default_settings.yml
  tasks:
    - name: Ensure aci_aaa_security_default_settings is present
      cisco.aci.aci_aaa_security_default_settings: "{{ aci_aaa_security_default_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_aaa_security_default_settings.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_aaa_security_default_settings
      cisco.aci.aci_aaa_security_default_settings: "{{ aci_aaa_security_default_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_aaa_security_default_settings.state | default('present')) in ['present', 'query']
      register: query_result
