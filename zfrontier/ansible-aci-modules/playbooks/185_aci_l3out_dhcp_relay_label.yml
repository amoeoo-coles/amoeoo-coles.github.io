---
# Sample playbook for cisco.aci.aci_l3out_dhcp_relay_label
# Build order: 185
# Manage Layer 3 Outside (L3Out) DHCP Relay Label (dhcp:Lbl)
# Reads models/aci_l3out_dhcp_relay_label.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "185 aci_l3out_dhcp_relay_label"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_dhcp_relay_label.yml
  tasks:
    - name: Ensure aci_l3out_dhcp_relay_label is present
      cisco.aci.aci_l3out_dhcp_relay_label: "{{ aci_l3out_dhcp_relay_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_dhcp_relay_label.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_dhcp_relay_label
      cisco.aci.aci_l3out_dhcp_relay_label: "{{ aci_l3out_dhcp_relay_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_dhcp_relay_label.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_dhcp_relay_label (only when model state is absent)
      cisco.aci.aci_l3out_dhcp_relay_label: "{{ aci_l3out_dhcp_relay_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_dhcp_relay_label.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
