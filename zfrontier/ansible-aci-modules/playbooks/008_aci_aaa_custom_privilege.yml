---
# Sample playbook for cisco.aci.aci_aaa_custom_privilege
# Build order: 008
# Manage AAA RBAC Custom Privileges (aaa:RbacClassPriv)
# Reads models/aci_aaa_custom_privilege.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "008 aci_aaa_custom_privilege"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_aaa_custom_privilege.yml
  tasks:
    - name: Ensure aci_aaa_custom_privilege is present
      cisco.aci.aci_aaa_custom_privilege: "{{ aci_aaa_custom_privilege | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_aaa_custom_privilege.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_aaa_custom_privilege
      cisco.aci.aci_aaa_custom_privilege: "{{ aci_aaa_custom_privilege | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_aaa_custom_privilege.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_aaa_custom_privilege (only when model state is absent)
      cisco.aci.aci_aaa_custom_privilege: "{{ aci_aaa_custom_privilege | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_aaa_custom_privilege.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
