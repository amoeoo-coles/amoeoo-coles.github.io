---
# Sample playbook for cisco.aci.aci_l2out_extepg
# Build order: 195
# Manage External Network Instance (L2Out External EPG) objects (l2ext:InstP).
# Reads models/aci_l2out_extepg.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "195 aci_l2out_extepg"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l2out_extepg.yml
  tasks:
    - name: Ensure aci_l2out_extepg is present
      cisco.aci.aci_l2out_extepg: "{{ aci_l2out_extepg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l2out_extepg.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l2out_extepg
      cisco.aci.aci_l2out_extepg: "{{ aci_l2out_extepg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l2out_extepg.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l2out_extepg (only when model state is absent)
      cisco.aci.aci_l2out_extepg: "{{ aci_l2out_extepg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l2out_extepg.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
