---
# Sample playbook for cisco.aci.aci_l3out_bgp_protocol_profile
# Build order: 177
# Manage BGP Protocol Profile (bgp:ProtP)
# Reads models/aci_l3out_bgp_protocol_profile.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "177 aci_l3out_bgp_protocol_profile"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l3out_bgp_protocol_profile.yml
  tasks:
    - name: Ensure aci_l3out_bgp_protocol_profile is present
      cisco.aci.aci_l3out_bgp_protocol_profile: "{{ aci_l3out_bgp_protocol_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l3out_bgp_protocol_profile.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l3out_bgp_protocol_profile
      cisco.aci.aci_l3out_bgp_protocol_profile: "{{ aci_l3out_bgp_protocol_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l3out_bgp_protocol_profile.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l3out_bgp_protocol_profile (only when model state is absent)
      cisco.aci.aci_l3out_bgp_protocol_profile: "{{ aci_l3out_bgp_protocol_profile | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l3out_bgp_protocol_profile.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
