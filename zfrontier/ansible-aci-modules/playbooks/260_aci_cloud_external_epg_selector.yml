---
# Sample playbook for cisco.aci.aci_cloud_external_epg_selector
# Build order: 260
# Manage Cloud Endpoint Selector for External EPGs (cloud:ExtEPSelector)
# Reads models/aci_cloud_external_epg_selector.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "260 aci_cloud_external_epg_selector"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_external_epg_selector.yml
  tasks:
    - name: Ensure aci_cloud_external_epg_selector is present
      cisco.aci.aci_cloud_external_epg_selector: "{{ aci_cloud_external_epg_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_cloud_external_epg_selector.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_cloud_external_epg_selector
      cisco.aci.aci_cloud_external_epg_selector: "{{ aci_cloud_external_epg_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_external_epg_selector.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_cloud_external_epg_selector (only when model state is absent)
      cisco.aci.aci_cloud_external_epg_selector: "{{ aci_cloud_external_epg_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_cloud_external_epg_selector.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
