---
# Sample playbook for cisco.aci.aci_syslog_remote_dest
# Build order: 028
# Manage Syslog Remote Destinations (syslog:RemoteDest)
# Reads models/aci_syslog_remote_dest.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "028 aci_syslog_remote_dest"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_syslog_remote_dest.yml
  tasks:
    - name: Ensure aci_syslog_remote_dest is present
      cisco.aci.aci_syslog_remote_dest: "{{ aci_syslog_remote_dest | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_syslog_remote_dest.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_syslog_remote_dest
      cisco.aci.aci_syslog_remote_dest: "{{ aci_syslog_remote_dest | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_syslog_remote_dest.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_syslog_remote_dest (only when model state is absent)
      cisco.aci.aci_syslog_remote_dest: "{{ aci_syslog_remote_dest | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_syslog_remote_dest.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
