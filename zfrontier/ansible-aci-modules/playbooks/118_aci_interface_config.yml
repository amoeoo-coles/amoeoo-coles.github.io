---
# Sample playbook for cisco.aci.aci_interface_config
# Build order: 118
# Manage Interface Configuration of Access (infra:PortConfig) and Fabric (fabric:PortConfig) Ports is only supported for ACI 5.2(7)+
# Reads models/aci_interface_config.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "118 aci_interface_config"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_config.yml
  tasks:
    - name: Ensure aci_interface_config is present
      cisco.aci.aci_interface_config: "{{ aci_interface_config | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_config.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_config
      cisco.aci.aci_interface_config: "{{ aci_interface_config | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_config.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_config (only when model state is absent)
      cisco.aci.aci_interface_config: "{{ aci_interface_config | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_config.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
