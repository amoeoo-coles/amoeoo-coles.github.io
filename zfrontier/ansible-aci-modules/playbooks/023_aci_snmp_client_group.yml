---
# Sample playbook for cisco.aci.aci_snmp_client_group
# Build order: 023
# Manage SNMP client groups (snmp:ClientGrpP)
# Reads models/aci_snmp_client_group.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "023 aci_snmp_client_group"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_snmp_client_group.yml
  tasks:
    - name: Ensure aci_snmp_client_group is present
      cisco.aci.aci_snmp_client_group: "{{ aci_snmp_client_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_snmp_client_group.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_snmp_client_group
      cisco.aci.aci_snmp_client_group: "{{ aci_snmp_client_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_snmp_client_group.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_snmp_client_group (only when model state is absent)
      cisco.aci.aci_snmp_client_group: "{{ aci_snmp_client_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_snmp_client_group.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
