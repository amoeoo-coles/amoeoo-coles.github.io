---
# Sample playbook for cisco.aci.aci_interface_description
# Build order: 119
# Setting and removing description on physical interfaces (infra:HPathS, infra:RsHPathAtt, infra:SHPathS, and infra:RsSHPathAtt)
# Reads models/aci_interface_description.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "119 aci_interface_description"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_description.yml
  tasks:
    - name: Ensure aci_interface_description is present
      cisco.aci.aci_interface_description: "{{ aci_interface_description | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_description.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_description
      cisco.aci.aci_interface_description: "{{ aci_interface_description | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_description.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_description (only when model state is absent)
      cisco.aci.aci_interface_description: "{{ aci_interface_description | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_description.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
