---
# Sample playbook for cisco.aci.aci_netflow_monitor_to_exporter
# Build order: 264
# Manage Netflow Monitor to Exporter (netflow:RsMonitorToExporter)
# Reads models/aci_netflow_monitor_to_exporter.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "264 aci_netflow_monitor_to_exporter"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_netflow_monitor_to_exporter.yml
  tasks:
    - name: Ensure aci_netflow_monitor_to_exporter is present
      cisco.aci.aci_netflow_monitor_to_exporter: "{{ aci_netflow_monitor_to_exporter | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_netflow_monitor_to_exporter.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_netflow_monitor_to_exporter
      cisco.aci.aci_netflow_monitor_to_exporter: "{{ aci_netflow_monitor_to_exporter | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_netflow_monitor_to_exporter.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_netflow_monitor_to_exporter (only when model state is absent)
      cisco.aci.aci_netflow_monitor_to_exporter: "{{ aci_netflow_monitor_to_exporter | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_netflow_monitor_to_exporter.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
