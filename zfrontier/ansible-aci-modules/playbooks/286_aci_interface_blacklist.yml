---
# Sample playbook for cisco.aci.aci_interface_blacklist
# Build order: 286
# Enabling or Disabling physical interfaces (fabric:RsOosPath)
# Reads models/aci_interface_blacklist.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "286 aci_interface_blacklist"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_blacklist.yml
  tasks:
    - name: Ensure aci_interface_blacklist is present
      cisco.aci.aci_interface_blacklist: "{{ aci_interface_blacklist | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_blacklist.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_blacklist
      cisco.aci.aci_interface_blacklist: "{{ aci_interface_blacklist | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_blacklist.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_blacklist (only when model state is absent)
      cisco.aci.aci_interface_blacklist: "{{ aci_interface_blacklist | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_blacklist.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
