---
# Sample playbook for cisco.aci.aci_contract_subject
# Build order: 200
# Manage initial Contract Subjects (vz:Subj)
# Reads models/aci_contract_subject.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "200 aci_contract_subject"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_contract_subject.yml
  tasks:
    - name: Ensure aci_contract_subject is present
      cisco.aci.aci_contract_subject: "{{ aci_contract_subject | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_contract_subject.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_contract_subject
      cisco.aci.aci_contract_subject: "{{ aci_contract_subject | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_contract_subject.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_contract_subject (only when model state is absent)
      cisco.aci.aci_contract_subject: "{{ aci_contract_subject | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_contract_subject.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
