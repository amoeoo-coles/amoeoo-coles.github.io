---
# Sample playbook for cisco.aci.aci_cloud_vpn_gateway
# Build order: 255
# Manage cloudRouterP in Cloud Context Profile (cloud:RouterP)
# Reads models/aci_cloud_vpn_gateway.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "255 aci_cloud_vpn_gateway"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_vpn_gateway.yml
  tasks:
    - name: Ensure aci_cloud_vpn_gateway is present
      cisco.aci.aci_cloud_vpn_gateway: "{{ aci_cloud_vpn_gateway | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_cloud_vpn_gateway.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_cloud_vpn_gateway
      cisco.aci.aci_cloud_vpn_gateway: "{{ aci_cloud_vpn_gateway | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_vpn_gateway.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_cloud_vpn_gateway (only when model state is absent)
      cisco.aci.aci_cloud_vpn_gateway: "{{ aci_cloud_vpn_gateway | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_cloud_vpn_gateway.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
