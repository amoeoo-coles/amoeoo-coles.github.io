---
# Sample playbook for cisco.aci.aci_vlan_pool_encap_block
# Build order: 065
# Manage encap blocks assigned to VLAN pools (fvns:EncapBlk)
# Reads models/aci_vlan_pool_encap_block.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "065 aci_vlan_pool_encap_block"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_vlan_pool_encap_block.yml
  tasks:
    - name: Ensure aci_vlan_pool_encap_block is present
      cisco.aci.aci_vlan_pool_encap_block: "{{ aci_vlan_pool_encap_block | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_vlan_pool_encap_block.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_vlan_pool_encap_block
      cisco.aci.aci_vlan_pool_encap_block: "{{ aci_vlan_pool_encap_block | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_vlan_pool_encap_block.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_vlan_pool_encap_block (only when model state is absent)
      cisco.aci.aci_vlan_pool_encap_block: "{{ aci_vlan_pool_encap_block | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_vlan_pool_encap_block.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
