---
# Sample playbook for cisco.aci.aci_system_connectivity_preference
# Build order: 003
# APIC Connectivity Preferences (mgmt:ConnectivityPrefs)
# Reads models/aci_system_connectivity_preference.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "003 aci_system_connectivity_preference"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_system_connectivity_preference.yml
  tasks:
    - name: Ensure aci_system_connectivity_preference is present
      cisco.aci.aci_system_connectivity_preference: "{{ aci_system_connectivity_preference | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_system_connectivity_preference.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_system_connectivity_preference
      cisco.aci.aci_system_connectivity_preference: "{{ aci_system_connectivity_preference | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_system_connectivity_preference.state | default('present')) in ['present', 'query']
      register: query_result
