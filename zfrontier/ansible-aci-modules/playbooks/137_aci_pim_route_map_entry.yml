---
# Sample playbook for cisco.aci.aci_pim_route_map_entry
# Build order: 137
# Manage Protocol-Independent Multicast (PIM) Route Map Entry (pim:RouteMapEntry)
# Reads models/aci_pim_route_map_entry.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "137 aci_pim_route_map_entry"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_pim_route_map_entry.yml
  tasks:
    - name: Ensure aci_pim_route_map_entry is present
      cisco.aci.aci_pim_route_map_entry: "{{ aci_pim_route_map_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_pim_route_map_entry.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_pim_route_map_entry
      cisco.aci.aci_pim_route_map_entry: "{{ aci_pim_route_map_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_pim_route_map_entry.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_pim_route_map_entry (only when model state is absent)
      cisco.aci.aci_pim_route_map_entry: "{{ aci_pim_route_map_entry | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_pim_route_map_entry.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
