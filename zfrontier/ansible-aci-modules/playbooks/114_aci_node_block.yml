---
# Sample playbook for cisco.aci.aci_node_block
# Build order: 114
# Manage Node Block (infra:NodeBlk)
# Reads models/aci_node_block.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "114 aci_node_block"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_node_block.yml
  tasks:
    - name: Ensure aci_node_block is present
      cisco.aci.aci_node_block: "{{ aci_node_block | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_node_block.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_node_block
      cisco.aci.aci_node_block: "{{ aci_node_block | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_node_block.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_node_block (only when model state is absent)
      cisco.aci.aci_node_block: "{{ aci_node_block | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_node_block.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
