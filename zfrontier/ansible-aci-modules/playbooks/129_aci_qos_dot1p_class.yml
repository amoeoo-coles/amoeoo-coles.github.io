---
# Sample playbook for cisco.aci.aci_qos_dot1p_class
# Build order: 129
# Manage QoS Dot1P Class (qos:Dot1PClass)
# Reads models/aci_qos_dot1p_class.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "129 aci_qos_dot1p_class"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_qos_dot1p_class.yml
  tasks:
    - name: Ensure aci_qos_dot1p_class is present
      cisco.aci.aci_qos_dot1p_class: "{{ aci_qos_dot1p_class | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_qos_dot1p_class.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_qos_dot1p_class
      cisco.aci.aci_qos_dot1p_class: "{{ aci_qos_dot1p_class | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_qos_dot1p_class.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_qos_dot1p_class (only when model state is absent)
      cisco.aci.aci_qos_dot1p_class: "{{ aci_qos_dot1p_class | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_qos_dot1p_class.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
