---
# Sample playbook for cisco.aci.aci_l4l7_service_graph_template_node
# Build order: 231
# Manage L4-L7 Service Graph Templates Nodes (vns:AbsNode)
# Reads models/aci_l4l7_service_graph_template_node.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "231 aci_l4l7_service_graph_template_node"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_service_graph_template_node.yml
  tasks:
    - name: Ensure aci_l4l7_service_graph_template_node is present
      cisco.aci.aci_l4l7_service_graph_template_node: "{{ aci_l4l7_service_graph_template_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_service_graph_template_node.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_service_graph_template_node
      cisco.aci.aci_l4l7_service_graph_template_node: "{{ aci_l4l7_service_graph_template_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_service_graph_template_node.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_service_graph_template_node (only when model state is absent)
      cisco.aci.aci_l4l7_service_graph_template_node: "{{ aci_l4l7_service_graph_template_node | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_service_graph_template_node.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
