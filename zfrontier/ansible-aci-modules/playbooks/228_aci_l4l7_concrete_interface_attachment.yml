---
# Sample playbook for cisco.aci.aci_l4l7_concrete_interface_attachment
# Build order: 228
# Manage L4-L7 Concrete Interface Attachment (vns:RsCIfAttN)
# Reads models/aci_l4l7_concrete_interface_attachment.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "228 aci_l4l7_concrete_interface_attachment"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_l4l7_concrete_interface_attachment.yml
  tasks:
    - name: Ensure aci_l4l7_concrete_interface_attachment is present
      cisco.aci.aci_l4l7_concrete_interface_attachment: "{{ aci_l4l7_concrete_interface_attachment | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_concrete_interface_attachment.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_l4l7_concrete_interface_attachment
      cisco.aci.aci_l4l7_concrete_interface_attachment: "{{ aci_l4l7_concrete_interface_attachment | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_concrete_interface_attachment.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_l4l7_concrete_interface_attachment (only when model state is absent)
      cisco.aci.aci_l4l7_concrete_interface_attachment: "{{ aci_l4l7_concrete_interface_attachment | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_l4l7_concrete_interface_attachment.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
