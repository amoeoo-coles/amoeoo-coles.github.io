---
# Sample playbook for cisco.aci.aci_aaa_certificate_authority
# Build order: 014
# Manage AAA Certificate Authorities (pki:TP)
# Reads models/aci_aaa_certificate_authority.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "014 aci_aaa_certificate_authority"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_aaa_certificate_authority.yml
  tasks:
    - name: Ensure aci_aaa_certificate_authority is present
      cisco.aci.aci_aaa_certificate_authority: "{{ aci_aaa_certificate_authority | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_aaa_certificate_authority.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_aaa_certificate_authority
      cisco.aci.aci_aaa_certificate_authority: "{{ aci_aaa_certificate_authority | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_aaa_certificate_authority.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_aaa_certificate_authority (only when model state is absent)
      cisco.aci.aci_aaa_certificate_authority: "{{ aci_aaa_certificate_authority | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_aaa_certificate_authority.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
