---
# Sample playbook for cisco.aci.aci_action_rule_set_as_path_asn
# Build order: 155
# Manage the AS Path ASN (rtctrl:SetASPathASN)
# Reads models/aci_action_rule_set_as_path_asn.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "155 aci_action_rule_set_as_path_asn"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_action_rule_set_as_path_asn.yml
  tasks:
    - name: Ensure aci_action_rule_set_as_path_asn is present
      cisco.aci.aci_action_rule_set_as_path_asn: "{{ aci_action_rule_set_as_path_asn | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_action_rule_set_as_path_asn.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_action_rule_set_as_path_asn
      cisco.aci.aci_action_rule_set_as_path_asn: "{{ aci_action_rule_set_as_path_asn | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_action_rule_set_as_path_asn.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_action_rule_set_as_path_asn (only when model state is absent)
      cisco.aci.aci_action_rule_set_as_path_asn: "{{ aci_action_rule_set_as_path_asn | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_action_rule_set_as_path_asn.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
