---
# Sample playbook for cisco.aci.aci_tag
# Build order: 287
# Tagging of ACI objects (tag:Annotation, tag:Inst, and tag:Tag)
# Reads models/aci_tag.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "287 aci_tag"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_tag.yml
  tasks:
    - name: Ensure aci_tag is present
      cisco.aci.aci_tag: "{{ aci_tag | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_tag.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_tag
      cisco.aci.aci_tag: "{{ aci_tag | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_tag.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_tag (only when model state is absent)
      cisco.aci.aci_tag: "{{ aci_tag | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_tag.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
