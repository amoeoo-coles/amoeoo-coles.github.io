---
# Sample playbook for cisco.aci.aci_access_spine_interface_selector
# Build order: 108
# Manage Fabric Access Policy Spine Interface Port Selectors (infra:SHPortS)
# Reads models/aci_access_spine_interface_selector.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "108 aci_access_spine_interface_selector"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_access_spine_interface_selector.yml
  tasks:
    - name: Ensure aci_access_spine_interface_selector is present
      cisco.aci.aci_access_spine_interface_selector: "{{ aci_access_spine_interface_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_access_spine_interface_selector.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_access_spine_interface_selector
      cisco.aci.aci_access_spine_interface_selector: "{{ aci_access_spine_interface_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_access_spine_interface_selector.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_access_spine_interface_selector (only when model state is absent)
      cisco.aci.aci_access_spine_interface_selector: "{{ aci_access_spine_interface_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_access_spine_interface_selector.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
