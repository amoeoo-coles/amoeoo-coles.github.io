---
# Sample playbook for cisco.aci.aci_static_node_mgmt_address
# Build order: 060
# In band or Out of band management IP address (mgmt:RsOoBStNode and mgmt:RsInBStNode)
# Reads models/aci_static_node_mgmt_address.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "060 aci_static_node_mgmt_address"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_static_node_mgmt_address.yml
  tasks:
    - name: Ensure aci_static_node_mgmt_address is present
      cisco.aci.aci_static_node_mgmt_address: "{{ aci_static_node_mgmt_address | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_static_node_mgmt_address.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_static_node_mgmt_address
      cisco.aci.aci_static_node_mgmt_address: "{{ aci_static_node_mgmt_address | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_static_node_mgmt_address.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_static_node_mgmt_address (only when model state is absent)
      cisco.aci.aci_static_node_mgmt_address: "{{ aci_static_node_mgmt_address | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_static_node_mgmt_address.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
