---
# Sample playbook for cisco.aci.aci_match_rule
# Build order: 146
# Manage Match Rule (rtctrl:SubjP)
# Reads models/aci_match_rule.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "146 aci_match_rule"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_match_rule.yml
  tasks:
    - name: Ensure aci_match_rule is present
      cisco.aci.aci_match_rule: "{{ aci_match_rule | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_match_rule.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_match_rule
      cisco.aci.aci_match_rule: "{{ aci_match_rule | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_match_rule.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_match_rule (only when model state is absent)
      cisco.aci.aci_match_rule: "{{ aci_match_rule | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_match_rule.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
