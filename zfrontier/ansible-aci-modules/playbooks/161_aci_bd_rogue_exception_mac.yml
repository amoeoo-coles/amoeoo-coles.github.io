---
# Sample playbook for cisco.aci.aci_bd_rogue_exception_mac
# Build order: 161
# Manage Rogue Exception MAC (fv:RogueExceptionMac)
# Reads models/aci_bd_rogue_exception_mac.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "161 aci_bd_rogue_exception_mac"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_bd_rogue_exception_mac.yml
  tasks:
    - name: Ensure aci_bd_rogue_exception_mac is present
      cisco.aci.aci_bd_rogue_exception_mac: "{{ aci_bd_rogue_exception_mac | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_bd_rogue_exception_mac.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_bd_rogue_exception_mac
      cisco.aci.aci_bd_rogue_exception_mac: "{{ aci_bd_rogue_exception_mac | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_bd_rogue_exception_mac.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_bd_rogue_exception_mac (only when model state is absent)
      cisco.aci.aci_bd_rogue_exception_mac: "{{ aci_bd_rogue_exception_mac | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_bd_rogue_exception_mac.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
