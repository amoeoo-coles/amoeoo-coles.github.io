---
# Sample playbook for cisco.aci.aci_cloud_ap
# Build order: 256
# Manage Cloud Application Profile (AP) (cloud:App)
# Reads models/aci_cloud_ap.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "256 aci_cloud_ap"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_cloud_ap.yml
  tasks:
    - name: Ensure aci_cloud_ap is present
      cisco.aci.aci_cloud_ap: "{{ aci_cloud_ap | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_cloud_ap.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_cloud_ap
      cisco.aci.aci_cloud_ap: "{{ aci_cloud_ap | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_cloud_ap.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_cloud_ap (only when model state is absent)
      cisco.aci.aci_cloud_ap: "{{ aci_cloud_ap | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_cloud_ap.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
