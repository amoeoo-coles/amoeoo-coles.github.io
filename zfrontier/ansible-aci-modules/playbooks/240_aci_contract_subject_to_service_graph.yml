---
# Sample playbook for cisco.aci.aci_contract_subject_to_service_graph
# Build order: 240
# Bind contract subject to service graph (vz:RsSubjGraphAtt)
# Reads models/aci_contract_subject_to_service_graph.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "240 aci_contract_subject_to_service_graph"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_contract_subject_to_service_graph.yml
  tasks:
    - name: Ensure aci_contract_subject_to_service_graph is present
      cisco.aci.aci_contract_subject_to_service_graph: "{{ aci_contract_subject_to_service_graph | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_contract_subject_to_service_graph.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_contract_subject_to_service_graph
      cisco.aci.aci_contract_subject_to_service_graph: "{{ aci_contract_subject_to_service_graph | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_contract_subject_to_service_graph.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_contract_subject_to_service_graph (only when model state is absent)
      cisco.aci.aci_contract_subject_to_service_graph: "{{ aci_contract_subject_to_service_graph | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_contract_subject_to_service_graph.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
