---
# Sample playbook for cisco.aci.aci_interface_policy_leaf_profile_fex_policy_group
# Build order: 100
# Manage leaf interface profiles fex policy group (infra:FexBndlGrp)
# Reads models/aci_interface_policy_leaf_profile_fex_policy_group.yml and uses inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "100 aci_interface_policy_leaf_profile_fex_policy_group"
  hosts: apic
  gather_facts: false
  collections:
    - cisco.aci
  vars_files:
    - ../models/aci_interface_policy_leaf_profile_fex_policy_group.yml
  tasks:
    - name: Ensure aci_interface_policy_leaf_profile_fex_policy_group is present
      cisco.aci.aci_interface_policy_leaf_profile_fex_policy_group: "{{ aci_interface_policy_leaf_profile_fex_policy_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_leaf_profile_fex_policy_group.state | default('present')) == 'present'
      register: present_result

    - name: Query aci_interface_policy_leaf_profile_fex_policy_group
      cisco.aci.aci_interface_policy_leaf_profile_fex_policy_group: "{{ aci_interface_policy_leaf_profile_fex_policy_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_leaf_profile_fex_policy_group.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove aci_interface_policy_leaf_profile_fex_policy_group (only when model state is absent)
      cisco.aci.aci_interface_policy_leaf_profile_fex_policy_group: "{{ aci_interface_policy_leaf_profile_fex_policy_group | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (aci_interface_policy_leaf_profile_fex_policy_group.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
