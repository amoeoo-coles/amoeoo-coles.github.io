---
# YAML model for cisco.aci.aci_l3out_logical_interface_profile_ospf_policy
# Collection: cisco.aci 3.0.0
# APIC class: ospf:IfP
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_l3out_logical_interface_profile_ospf_policy:
  annotation: orchestrator:ansible
  certificate_name: null
  host: '{{ apic_host }}'
  interface_profile: my_interface_profile
  l3out: my_l3out
  node_profile: my_node_profile
  ospf_auth_key: '{{ ospf_auth_key_placeholder }}'
  ospf_auth_type: null
  ospf_policy: my_ospf_interface_policy
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  tenant: my_tenant
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
