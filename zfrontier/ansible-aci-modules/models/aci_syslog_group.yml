---
# YAML model for cisco.aci.aci_syslog_group
# Collection: cisco.aci 3.0.0
# APIC class: syslog:Group, syslog:Console, syslog:File, syslog:Prof
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_syslog_group:
  admin_state: null
  annotation: orchestrator:ansible
  certificate_name: null
  console_log_format: null
  console_log_severity: critical
  console_logging: enabled
  description: syslog group
  format: null
  host: '{{ apic_host }}'
  include_ms: null
  include_time_zone: null
  local_file_log_format: null
  local_file_log_severity: warnings
  local_file_logging: enabled
  name: my_syslog_group
  output_level: null
  output_path: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
