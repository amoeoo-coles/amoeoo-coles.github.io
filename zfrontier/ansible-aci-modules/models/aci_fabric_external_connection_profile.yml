---
# YAML model for cisco.aci.aci_fabric_external_connection_profile
# Collection: cisco.aci 3.0.0
# APIC class: fv:FabricExtConnP
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_fabric_external_connection_profile:
  annotation: orchestrator:ansible
  certificate_name: null
  community: '{{ community_placeholder }}'
  description: Fabric External Connection Profile
  fabric_id: 1
  host: '{{ apic_host }}'
  name: ansible_fabric_ext_conn_profile
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  peering_password: '{{ peering_password }}'
  peering_type: automatic_with_rr
  port: null
  private_key: null
  site_id: 1
  state: present
  suppress_previous: null
  suppress_verification: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
