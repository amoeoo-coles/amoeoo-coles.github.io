---
# YAML model for cisco.aci.aci_fabric_wide_settings
# Collection: cisco.aci 3.0.0
# APIC class: infra:SetPol
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_fabric_wide_settings:
  annotation: orchestrator:ansible
  certificate_name: null
  disable_remote_ep_learning: true
  enforce_domain_validation: null
  enforce_epg_vlan_validation: true
  enforce_subnet_check: null
  host: '{{ apic_host }}'
  leaf_opflex_client_auth: null
  leaf_ssl_opflex: null
  opflex_ssl_versions: null
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  reallocate_gipo: null
  restrict_infra_vlan_traffic: null
  spine_opflex_client_auth: null
  spine_ssl_opflex: null
  state: present
  suppress_previous: null
  suppress_verification: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
