---
# YAML model for cisco.aci.aci_l3out
# Collection: cisco.aci 3.0.0
# APIC class: l3ext:Out
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_l3out:
  annotation: orchestrator:ansible
  asn: null
  certificate_name: null
  description: L3Out for Production tenant
  domain: l3dom_prod
  dscp: null
  host: '{{ apic_host }}'
  l3out: prod_l3out
  l3protocol: ospf
  mpls: null
  name_alias: sample
  ospf:
    area_cost: 1
    area_ctrl:
    - summary
    - redistribute
    area_id: 0.0.0.1
    area_type: regular
    multipod_internal: 'no'
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  route_control: null
  state: present
  suppress_previous: null
  suppress_verification: null
  tenant: production
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
  vrf: prod
