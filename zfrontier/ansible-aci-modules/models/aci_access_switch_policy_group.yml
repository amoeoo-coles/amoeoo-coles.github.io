  netflow_node_policy: null
  node_802_1x_authentication_policy: example_node_802_1x_authentication_policy
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  poe_node_policy: example_poe_node_policy
  port: null
  private_key: null
  ptp_node_policy: null
  spanning_tree_policy: example_spanning_tree_policy
  state: present
  suppress_previous: null
  suppress_verification: null
  switch_type: leaf
  sync_e_node_policy: null
  timeout: null
  usb_configuration_policy: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
