---
# YAML model for cisco.aci.aci_aaa_security_default_settings
# Collection: cisco.aci 3.0.0
# APIC class: pki:Ep
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_aaa_security_default_settings:
  annotation: orchestrator:ansible
  certificate_name: null
  host: '{{ apic_host }}'
  lockout:
    enable: true
    max_attempts: 6
    window: 6
    duration: 61
  name_alias: sample
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  password_change:
    enable: true
    interval: 49
    allowed_changes: 6
    minimum_period_between_password_changes: 25
    history_storage_amount: 6
  password_strength_check: true
  password_strength_profile:
    enable: true
    type: custom
    min_length: 10
    max_length: 60
    class_flags:
    - digits
    - lowercase
    - specialchars
    - uppercase
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
  web_token:
    timeout: 601
    idle_timeout: 1201
    validity_period: 23
    refresh: true
