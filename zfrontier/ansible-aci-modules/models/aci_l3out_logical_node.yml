  node_id: 111
  node_profile: my_node_profile
  output_level: null
  output_path: null
  password: '{{ apic_password }}'
  pod_id: 1
  port: null
  private_key: null
  router_id: 111.111.111.111
  router_id_as_loopback: null
  sid: null
  state: present
  suppress_previous: null
  suppress_verification: null
