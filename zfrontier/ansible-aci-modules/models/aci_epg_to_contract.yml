# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_epg_to_contract:
  annotation: orchestrator:ansible
  ap: anstest
  certificate_name: null
  contract: anstest_http
  contract_label: contractlabel
  contract_type: provider
  epg: anstest
  host: '{{ apic_host }}'
  output_level: null
  output_path: null
  password: '{{ apic_password }}'
  port: null
  priority: null
  private_key: null
  provider_match: null
  state: present
  subject_label: subjlabel
  suppress_previous: null
  suppress_verification: null
  tenant: anstest
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
