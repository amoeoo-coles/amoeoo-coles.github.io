# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_interface_policy_eigrp:
  annotation: orchestrator:ansible
  bandwidth: 10000
  certificate_name: null
  control_state:
  - split-horizon
  - nh-self
  delay: 10
  delay_unit: tens_of_micro
  description: Example object managed by cisco.aci sample data
  eigrp: eigrp1
  hello_interval: 5
  hold_interval: 15
  host: '{{ apic_host }}'
  name_alias: sample
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  tenant: production
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
