---
# YAML model for cisco.aci.aci_system_endpoint_controls
# Collection: cisco.aci 3.0.0
# APIC class: ep:IpAgingP, ep:ControlP, ep:LoopProtectP
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_system_endpoint_controls:
  annotation: orchestrator:ansible
  certificate_name: null
  ep_loop_protection:
    admin_state: true
    interval: 70
    multiplication_factor: 15
    action:
    - bd
    - port
  host: '{{ apic_host }}'
  ip_aging:
    admin_state: true
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  roque_ep_control:
    admin_state: true
    interval: 50
    multiplication_factor: 10
    hold_interval: 2000
  state: present
  suppress_previous: null
  suppress_verification: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
