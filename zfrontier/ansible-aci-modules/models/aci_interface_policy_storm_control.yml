---
# YAML model for cisco.aci.aci_interface_policy_storm_control
# Collection: cisco.aci 3.0.0
# APIC class: stormctrl:IfPol
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_interface_policy_storm_control:
  all_types_configuration:
    rate: 80
    burst_rate: 100
    rate_type: percentage
  annotation: orchestrator:ansible
  broadcast_configuration: null
  certificate_name: null
  description: My Storm Control Policy
  host: '{{ apic_host }}'
  multicast_configuration: null
  name_alias: sample
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  storm_control_action: shutdown
  storm_control_policy: my_storm_control_policy
  storm_control_soak_action: 5
  suppress_previous: null
  suppress_verification: null
  timeout: null
  unicast_configuration: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
