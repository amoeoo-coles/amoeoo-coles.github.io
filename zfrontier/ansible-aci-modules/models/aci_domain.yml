---
# YAML model for cisco.aci.aci_domain
# Collection: cisco.aci 3.0.0
# APIC class: phys:DomP, vmm:DomP, l2ext:DomP, l3ext:DomP, fc:DomP
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_domain:
  access_mode: null
  add_infra_pg: null
  annotation: orchestrator:ansible
  certificate_name: null
  domain: phys_dom
  domain_type: phys
  dscp: null
  enable_vm_folder: null
  encap_mode: null
  host: '{{ apic_host }}'
  multicast_address: null
  name_alias: sample
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  tag_collection: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
  vm_provider: null
  vswitch: null
