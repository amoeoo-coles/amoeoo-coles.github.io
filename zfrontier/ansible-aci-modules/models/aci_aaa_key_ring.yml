---
# YAML model for cisco.aci.aci_aaa_key_ring
# Collection: cisco.aci 3.0.0
# APIC class: pki:KeyRing
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_aaa_key_ring:
  annotation: orchestrator:ansible
  certificate: '{{ lookup("file", "pki/example_certificate.crt") }}'
  certificate_authority: example_certificate_authority
  certificate_name: null
  cloud_tenant: null
  description: Example object managed by cisco.aci sample data
  ecc_curve: null
  host: '{{ apic_host }}'
  key: '{{ lookup("file", "pki/example_key.key") }}'
  key_type: null
  modulus: 2048
  name: example_key_ring
  name_alias: sample
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
