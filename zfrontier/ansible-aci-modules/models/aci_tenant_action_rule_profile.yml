---
# YAML model for cisco.aci.aci_tenant_action_rule_profile
# Collection: cisco.aci 3.0.0
# APIC class: rtctrl:AttrP
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_tenant_action_rule_profile:
  action_rule: my_action_rule
  annotation: orchestrator:ansible
  certificate_name: null
  description: Example object managed by cisco.aci sample data
  host: '{{ apic_host }}'
  multipath: true
  name_alias: sample
  next_hop_propagation: true
  output_level: null
  output_path: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  set_as_path:
  - criteria: prepend
    asns:
    - asn: '65001'
      order: 0
    - asn: '65002'
      order: 1
  - criteria: prepend-last-as
    last_num: 4
  set_communities:
  - community: '{{ community_placeholder }}'
    description: test
  - community: '{{ community_placeholder }}'
    description: test2
  set_community:
    community: '{{ community_placeholder }}'
    criteria: replace
  set_dampening:
    half_life: 10
    reuse: 1
    suppress: 10
    max_suppress_time: 100
  set_metric: 100
  set_metric_type: ospf_type_1
  set_next_hop: 1.1.1.1
  set_policy_tag:
    l3out: test
    external_epg: test
  set_preference: 100
  set_route_tag: null
  set_weight: 100
  state: present
  suppress_previous: null
  suppress_verification: null
  tenant: prod
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
