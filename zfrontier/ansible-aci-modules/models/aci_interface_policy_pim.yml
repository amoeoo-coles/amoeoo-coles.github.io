---
# YAML model for cisco.aci.aci_interface_policy_pim
# Collection: cisco.aci 3.0.0
# APIC class: pim:IfPol
# APIC DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ apic_host }} {{ apic_username }} {{ apic_password }}.
# Do not commit real credentials.

aci_interface_policy_pim:
  annotation: orchestrator:ansible
  authentication_key: null
  authentication_type: null
  certificate_name: null
  control_state:
  - multicast_domain_boundary
  - strict_rfc_compliant
  description: Example object managed by cisco.aci sample data
  designated_router_delay: 10
  designated_router_priority: tens_of_micro
  hello_interval: 5
  host: '{{ apic_host }}'
  inbound_join_prune_filter_policy: my_pim_route_map_policy_1
  join_prune_interval: 15
  name_alias: sample
  neighbor_filter_policy: my_pim_route_map_policy_3
  outbound_join_prune_filter_policy: my_pim_route_map_policy_2
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  pim: my_pim_policy
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  tenant: production
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
