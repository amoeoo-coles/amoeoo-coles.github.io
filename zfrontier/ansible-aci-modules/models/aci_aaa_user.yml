# Do not commit real credentials.

aci_aaa_user:
  aaa_password: '{{ aaa_password }}'
  aaa_password_lifetime: '{{ aaa_password_lifetime }}'
  aaa_password_update_required: '{{ aaa_password_update_required }}'
  aaa_user: dag
  annotation: orchestrator:ansible
  certificate_name: null
  clear_password_history: '{{ clear_password_history }}'
  description: Example object managed by cisco.aci sample data
  email: dag@wieers.com
  enabled: null
  expiration: never
  expires: false
  first_name: Dag
  host: '{{ apic_host }}'
  last_name: Wieers
  name_alias: sample
  output_level: null
  output_path: null
  owner_key: null
  owner_tag: null
  password: '{{ apic_password }}'
  phone: 1-234-555-678
  port: null
  private_key: null
  state: present
  suppress_previous: null
