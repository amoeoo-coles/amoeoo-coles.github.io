  from_port: 1011
  host: '{{ apic_host }}'
  node_block: my_node_block
  output_level: null
  output_path: null
  password: '{{ apic_password }}'
  port: null
  private_key: null
  state: present
  suppress_previous: null
  suppress_verification: null
  switch_profile: my_leaf_switch_profile
  timeout: null
  to_port: 1011
  type_node: leaf
  use_proxy: null
  use_ssl: null
  username: '{{ apic_username }}'
  validate_certs: null
