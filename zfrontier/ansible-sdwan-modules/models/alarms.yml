---
# Data model for cisco.catalystwan.alarms (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.alarms
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/alarms/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/alarms.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: info (read-only)
  build_order: 25
  group: 6. Monitoring and operations
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

alarms:
  from_time: 16
  log_file: null
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  mark_all_as_viewed: null
  only_critical: null
