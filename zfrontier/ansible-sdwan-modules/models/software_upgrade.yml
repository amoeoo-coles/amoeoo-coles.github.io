references:
  module: cisco.catalystwan.software_upgrade
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/software_upgrade/?version=0.3.2
