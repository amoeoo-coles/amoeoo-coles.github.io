---
# Data model for cisco.catalystwan.devices_certificates (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.devices_certificates
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/devices_certificates/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/devices_certificates.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 8
  group: 2. Controllers, edges and certificates
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

devices_certificates:
  change_vedge_list_validity:
    chasis_number: null
    serial_number: null
    validity: null
  device_ip: 192.0.2.1
  generate_csr: true
  invalidate: null
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  send_to_controllers: null
  send_to_vbond: null
  uuid: null
