---
# Data model for cisco.catalystwan.administration_settings (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.administration_settings
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/administration_settings/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/administration_settings.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 3
  group: 1. Bootstrap and Manager settings
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

administration_settings:
  certificates:
    certificate_signing: null
    email: null
    first_name: null
    last_name: null
    retrieve_interval: null
    validity_period: null
  enterprise_root_ca: null
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  org: null
  pnp_connect_sync: null
  smart_account_credentials:
    password: null
    username: null
  software_install_timeout:
    activate_timeout: null
    control_pps: null
    download_timeout: null
  validator:
    domain_ip: 192.0.2.1
    port: '12346'
