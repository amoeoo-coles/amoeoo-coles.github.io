references:
  module: cisco.catalystwan.users
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/users/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/users.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 5
  group: 1. Bootstrap and Manager settings
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

users:
  description: null
  get_all: true
  group: null
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
