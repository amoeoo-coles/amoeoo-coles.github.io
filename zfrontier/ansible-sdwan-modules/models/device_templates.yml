---
# Data model for cisco.catalystwan.device_templates (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.device_templates
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/device_templates/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/device_templates.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 16
  group: 4. Classic templates
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

device_templates:
  device_role: sdwan-edge
  device_specific_vars: null
  device_type: ISR4451
  general_templates:
    - Template1
    - Template2
  hostname: null
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  state: present
  template_description: This is a device template for device configuration
  template_name: MyDeviceTemplate
  timeout_seconds: null
