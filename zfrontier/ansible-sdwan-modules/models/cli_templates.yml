---
# Data model for cisco.catalystwan.cli_templates (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.cli_templates
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/cli_templates/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/cli_templates.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 18
  group: 4. Classic templates
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

cli_templates:
  config_file: /path/to/config_file.txt
  device_type: ISR4451
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  state: present
  template_description: This is a CLI template for device configuration
  template_name: MyTemplate
