---
# Data model for cisco.catalystwan.devices_wan_edges (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.devices_wan_edges
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/devices_wan_edges/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/devices_wan_edges.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 7
  group: 2. Controllers, edges and certificates
  sample_values_from: module EXAMPLES (first task with state present)
  deprecation: none stated in module documentation

devices_wan_edges:
  generate_bootstrap_configuration: null
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  password: '{{ vault_password }}'
  state: present
  sync_devices_from_smart_account: true
  username: smartaccount_user
  uuid: null
  wan_edge_list: null
