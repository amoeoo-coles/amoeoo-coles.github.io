---
# Data model for cisco.catalystwan.server_info (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.server_info
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/server_info/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/server_info.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: info (read-only)
  build_order: 2
  group: 1. Bootstrap and Manager settings
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

server_info:
  information_category: server_info
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
