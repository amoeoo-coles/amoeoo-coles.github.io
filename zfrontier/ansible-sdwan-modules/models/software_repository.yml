---
# Data model for cisco.catalystwan.software_repository (cisco.catalystwan 0.3.2)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.catalystwan.software_repository
  collection: cisco.catalystwan
  collection_version: 0.3.2
  doc_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/software_repository/?version=0.3.2
  source_url: https://github.com/cisco-open/ansible-collection-catalystwan/blob/v0.3.2/plugins/modules/software_repository.py
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/
  module_type: action
  build_order: 10
  group: 3. Software repository and upgrades
  sample_values_from: module EXAMPLES (first task with state unset)
  deprecation: none stated in module documentation

software_repository:
  manager_credentials:
    url: '{{ manager_url }}'
    username: '{{ manager_username }}'
    password: '{{ manager_password }}'
    port: '{{ manager_port }}'
  remote_server:
    image_location_prefix: null
    remote_server_id: null
    remote_server_name: MyRemoteServer
    remote_server_password: '{{ vault_remote_server_password }}'
    remote_server_port: null
    remote_server_protocol: null
    remote_server_url: ftp://example.com
    remote_server_user: admin
    remote_server_vpn: 10
    state: present
  software:
    image_path: null
    remote_filename: null
    remote_server_name: null
    software_id: null
    state: null
