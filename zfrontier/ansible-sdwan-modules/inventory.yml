---
# Example inventory for the cisco.catalystwan 0.3.2 catalogue. Placeholders only.
# Supply values at runtime (extra vars or Ansible Vault). Never commit secrets:
#   ansible-playbook -i inventory.yml site.yml -e manager_url=manager.example.net \
#     -e manager_username=admin -e manager_password='***'
all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    manager_url: "{{ manager_url }}"
    manager_port: "443"
