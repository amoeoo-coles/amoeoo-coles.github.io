---
# Sample playbook for cisco.catalystwan.cluster_management (cisco.catalystwan 0.3.2)
# Build order: 4
# Cluster configuration for vManage devices
# Reads ../models/cluster_management.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/cluster_management/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.

- name: "0004 cluster_management"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/cluster_management.yml
  tasks:
    - name: Run cluster_management from its model
      cisco.catalystwan.cluster_management: {}
      register: cluster_management_result
