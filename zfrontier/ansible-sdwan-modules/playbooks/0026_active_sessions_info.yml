---
# Sample playbook for cisco.catalystwan.active_sessions_info (cisco.catalystwan 0.3.2)
# Build order: 26
# Retrieves information about active sessions
# Reads ../models/active_sessions_info.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/active_sessions_info/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.

- name: "0026 active_sessions_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/active_sessions_info.yml
  tasks:
    - name: Run active_sessions_info from its model
      cisco.catalystwan.active_sessions_info:
        manager_credentials: "{{ (active_sessions_info.manager_credentials | cat_strip_nulls) if (active_sessions_info.manager_credentials | cat_strip_nulls) is not none else omit }}"
      register: active_sessions_info_result
