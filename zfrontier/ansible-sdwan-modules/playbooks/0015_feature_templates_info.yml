---
# Sample playbook for cisco.catalystwan.feature_templates_info (cisco.catalystwan 0.3.2)
# Build order: 15
# Get information about Feature Templates on vManage.
# Reads ../models/feature_templates_info.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/feature_templates_info/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.

- name: "0015 feature_templates_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/feature_templates_info.yml
  tasks:
    - name: Run feature_templates_info from its model
      cisco.catalystwan.feature_templates_info:
        filters: "{{ (feature_templates_info.filters | cat_strip_nulls) if (feature_templates_info.filters | cat_strip_nulls) is not none else omit }}"
        manager_credentials: "{{ (feature_templates_info.manager_credentials | cat_strip_nulls) if (feature_templates_info.manager_credentials | cat_strip_nulls) is not none else omit }}"
      register: feature_templates_info_result
