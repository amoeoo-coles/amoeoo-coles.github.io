---
# Sample playbook for cisco.catalystwan.feature_templates (cisco.catalystwan 0.3.2)
# Build order: 14
# Manage feature templates for Cisco vManage SD-WAN
# Reads ../models/feature_templates.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/feature_templates/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags feature_templates.

- name: "0014 feature_templates"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/feature_templates.yml
  tasks:
    - name: Run feature_templates from its model
      cisco.catalystwan.feature_templates:
        aaa: "{{ (feature_templates.aaa | cat_strip_nulls) if (feature_templates.aaa | cat_strip_nulls) is not none else omit }}"
        cisco_aaa: "{{ (feature_templates.cisco_aaa | cat_strip_nulls) if (feature_templates.cisco_aaa | cat_strip_nulls) is not none else omit }}"
        cisco_banner: "{{ (feature_templates.cisco_banner | cat_strip_nulls) if (feature_templates.cisco_banner | cat_strip_nulls) is not none else omit }}"
        cisco_bfd: "{{ (feature_templates.cisco_bfd | cat_strip_nulls) if (feature_templates.cisco_bfd | cat_strip_nulls) is not none else omit }}"
        cisco_logging: "{{ (feature_templates.cisco_logging | cat_strip_nulls) if (feature_templates.cisco_logging | cat_strip_nulls) is not none else omit }}"
        cisco_ntp: "{{ (feature_templates.cisco_ntp | cat_strip_nulls) if (feature_templates.cisco_ntp | cat_strip_nulls) is not none else omit }}"
        cisco_omp: "{{ (feature_templates.cisco_omp | cat_strip_nulls) if (feature_templates.cisco_omp | cat_strip_nulls) is not none else omit }}"
        cisco_ospf: "{{ (feature_templates.cisco_ospf | cat_strip_nulls) if (feature_templates.cisco_ospf | cat_strip_nulls) is not none else omit }}"
        cisco_secure_internet_gateway: "{{ (feature_templates.cisco_secure_internet_gateway | cat_strip_nulls) if (feature_templates.cisco_secure_internet_gateway | cat_strip_nulls) is not none else omit }}"
        cisco_snmp: "{{ (feature_templates.cisco_snmp | cat_strip_nulls) if (feature_templates.cisco_snmp | cat_strip_nulls) is not none else omit }}"
        cisco_system: "{{ (feature_templates.cisco_system | cat_strip_nulls) if (feature_templates.cisco_system | cat_strip_nulls) is not none else omit }}"
        cisco_vpn: "{{ (feature_templates.cisco_vpn | cat_strip_nulls) if (feature_templates.cisco_vpn | cat_strip_nulls) is not none else omit }}"
        cisco_vpn_interface: "{{ (feature_templates.cisco_vpn_interface | cat_strip_nulls) if (feature_templates.cisco_vpn_interface | cat_strip_nulls) is not none else omit }}"
        debug: "{{ feature_templates.debug if feature_templates.debug is not none else omit }}"
        device_models: "{{ feature_templates.device_models if feature_templates.device_models is not none else omit }}"
        device_specific_variables: "{{ feature_templates.device_specific_variables if feature_templates.device_specific_variables is not none else omit }}"
        manager_credentials: "{{ (feature_templates.manager_credentials | cat_strip_nulls) if (feature_templates.manager_credentials | cat_strip_nulls) is not none else omit }}"
        omp_vsmart: "{{ (feature_templates.omp_vsmart | cat_strip_nulls) if (feature_templates.omp_vsmart | cat_strip_nulls) is not none else omit }}"
        security_vsmart: "{{ (feature_templates.security_vsmart | cat_strip_nulls) if (feature_templates.security_vsmart | cat_strip_nulls) is not none else omit }}"
        state: "{{ feature_templates.state if feature_templates.state is not none else omit }}"
        system_vsmart: "{{ (feature_templates.system_vsmart | cat_strip_nulls) if (feature_templates.system_vsmart | cat_strip_nulls) is not none else omit }}"
        template_description: "{{ feature_templates.template_description if feature_templates.template_description is not none else omit }}"
        template_name: "{{ feature_templates.template_name if feature_templates.template_name is not none else omit }}"
        vpn_vsmart: "{{ (feature_templates.vpn_vsmart | cat_strip_nulls) if (feature_templates.vpn_vsmart | cat_strip_nulls) is not none else omit }}"
        vpn_vsmart_interface: "{{ (feature_templates.vpn_vsmart_interface | cat_strip_nulls) if (feature_templates.vpn_vsmart_interface | cat_strip_nulls) is not none else omit }}"
      register: feature_templates_result
      tags:
        - never
        - feature_templates
