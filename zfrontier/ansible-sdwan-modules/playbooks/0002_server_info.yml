---
# Sample playbook for cisco.catalystwan.server_info (cisco.catalystwan 0.3.2)
# Build order: 2
# Retrieves server information categories from vManage
# Reads ../models/server_info.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/server_info/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.

- name: "0002 server_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/server_info.yml
  tasks:
    - name: Run server_info from its model
      cisco.catalystwan.server_info:
        information_category: "{{ server_info.information_category if server_info.information_category is not none else omit }}"
        manager_credentials: "{{ (server_info.manager_credentials | cat_strip_nulls) if (server_info.manager_credentials | cat_strip_nulls) is not none else omit }}"
      register: server_info_result
