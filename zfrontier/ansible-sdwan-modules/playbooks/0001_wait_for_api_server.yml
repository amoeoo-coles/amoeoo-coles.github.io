# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.

- name: "0001 wait_for_api_server"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/wait_for_api_server.yml
  tasks:
    - name: Run wait_for_api_server from its model
      cisco.catalystwan.wait_for_api_server:
        name: "{{ wait_for_api_server.name if wait_for_api_server.name is not none else omit }}"
        new: "{{ wait_for_api_server.new if wait_for_api_server.new is not none else omit }}"
      register: wait_for_api_server_result
