---
# Sample playbook for cisco.catalystwan.software_repository_info (cisco.catalystwan 0.3.2)
# Build order: 11
# Get information about Software Repository
# Reads ../models/software_repository_info.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/software_repository_info/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.

- name: "0011 software_repository_info"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/software_repository_info.yml
  tasks:
    - name: Run software_repository_info from its model
      cisco.catalystwan.software_repository_info:
        category: "{{ software_repository_info.category if software_repository_info.category is not none else omit }}"
        filters: "{{ software_repository_info.filters if software_repository_info.filters is not none else omit }}"
        manager_credentials: "{{ (software_repository_info.manager_credentials | cat_strip_nulls) if (software_repository_info.manager_credentials | cat_strip_nulls) is not none else omit }}"
      register: software_repository_info_result
