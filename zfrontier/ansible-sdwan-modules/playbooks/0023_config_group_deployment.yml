---
# Sample playbook for cisco.catalystwan.config_group_deployment (cisco.catalystwan 0.3.2)
# Build order: 23
# Description
# Reads ../models/config_group_deployment.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/config_group_deployment/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags config_group_deployment.

- name: "0023 config_group_deployment"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/config_group_deployment.yml
  tasks:
    - name: Run config_group_deployment from its model
      cisco.catalystwan.config_group_deployment:
        manager_credentials: "{{ (config_group_deployment.manager_credentials | cat_strip_nulls) if (config_group_deployment.manager_credentials | cat_strip_nulls) is not none else omit }}"
      register: config_group_deployment_result
      tags:
        - never
        - config_group_deployment
