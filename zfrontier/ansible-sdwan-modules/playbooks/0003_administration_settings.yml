---
# Sample playbook for cisco.catalystwan.administration_settings (cisco.catalystwan 0.3.2)
# Build order: 3
# Manages administration settings on a vManage instance
# Reads ../models/administration_settings.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/administration_settings/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags administration_settings.

- name: "0003 administration_settings"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/administration_settings.yml
  tasks:
    - name: Run administration_settings from its model
      cisco.catalystwan.administration_settings:
        certificates: "{{ (administration_settings.certificates | cat_strip_nulls) if (administration_settings.certificates | cat_strip_nulls) is not none else omit }}"
        enterprise_root_ca: "{{ administration_settings.enterprise_root_ca if administration_settings.enterprise_root_ca is not none else omit }}"
        manager_credentials: "{{ (administration_settings.manager_credentials | cat_strip_nulls) if (administration_settings.manager_credentials | cat_strip_nulls) is not none else omit }}"
        org: "{{ administration_settings.org if administration_settings.org is not none else omit }}"
        pnp_connect_sync: "{{ administration_settings.pnp_connect_sync if administration_settings.pnp_connect_sync is not none else omit }}"
        smart_account_credentials: "{{ (administration_settings.smart_account_credentials | cat_strip_nulls) if (administration_settings.smart_account_credentials | cat_strip_nulls) is not none else omit }}"
        software_install_timeout: "{{ (administration_settings.software_install_timeout | cat_strip_nulls) if (administration_settings.software_install_timeout | cat_strip_nulls) is not none else omit }}"
        validator: "{{ (administration_settings.validator | cat_strip_nulls) if (administration_settings.validator | cat_strip_nulls) is not none else omit }}"
      register: administration_settings_result
      tags:
        - never
        - administration_settings
