---
# Sample playbook for cisco.catalystwan.device_templates_recovery (cisco.catalystwan 0.3.2)
# Build order: 19
# Backup and restore Device Templates
# Reads ../models/device_templates_recovery.yml (vars_files). Docs: https://galaxy.ansible.com/ui/repo/published/cisco/catalystwan/content/module/device_templates_recovery/?version=0.3.2
# Connection placeholders come from inventory.yml: {{ manager_url }} {{ manager_username }} {{ manager_password }} {{ manager_port }}.
# DISRUPTIVE or state-changing on the controller: tagged 'never' - runs only with --tags device_templates_recovery.

- name: "0019 device_templates_recovery"
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../models/device_templates_recovery.yml
  tasks:
    - name: Run device_templates_recovery from its model
      cisco.catalystwan.device_templates_recovery:
        backup_dir_path: "{{ device_templates_recovery.backup_dir_path if device_templates_recovery.backup_dir_path is not none else omit }}"
        filters: "{{ (device_templates_recovery.filters | cat_strip_nulls) if (device_templates_recovery.filters | cat_strip_nulls) is not none else omit }}"
        manager_credentials: "{{ (device_templates_recovery.manager_credentials | cat_strip_nulls) if (device_templates_recovery.manager_credentials | cat_strip_nulls) is not none else omit }}"
        mode: "{{ device_templates_recovery.mode if device_templates_recovery.mode is not none else omit }}"
      register: device_templates_recovery_result
      tags:
        - never
        - device_templates_recovery
