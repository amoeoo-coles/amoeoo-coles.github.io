---
# YAML model for cisco.mso.ndo_ipsla_track_list
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_ipsla_track_list:
  description: Example track list
  host: '{{ mso_host }}'
  ipsla_track_list: ansible_test_ipsla_track_list
  ipsla_track_list_uuid: null
  login_domain: null
  members:
  - destination_ip: 192.0.2.10
    scope_type: bd
    scope:
      name: ansible_test_bd
      template: ansible_test_template
      schema: ansible_test_schema
    ipsla_monitoring_policy:
      name: ansible_test_ipsla_monitoring_policy
  - destination_ip: 2001:0000:130F:0000:0000:09C0:876A:130B
    scope_type: l3out
    scope:
      name: ansible_test_l3out
      template: ansible_test_template
    ipsla_monitoring_policy_uuid: '{{ ipsla_mon_pol.current.uuid }}'
  - destination_ip: 192.0.2.10
    scope_type: l3out
    scope_uuid: '{{ l3out.current.uuid }}'
    ipsla_monitoring_policy:
      name: ansible_test_ipsla_monitoring_policy
  output_level: null
  password: '{{ mso_password }}'
  port: null
  state: present
  template: ansible_tenant_template
  template_id: null
  threshold_down: 2
  threshold_up: 10
  timeout: null
  type: percentage
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
