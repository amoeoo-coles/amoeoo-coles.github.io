---
# YAML model for cisco.mso.ndo_ptp_policy_profiles
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_ptp_policy_profiles:
  announce_interval: 4
  announce_timeout: 3
  delay_interval: 2
  host: '{{ mso_host }}'
  login_domain: null
  output_level: null
  override_node_profile: null
  password: '{{ mso_password }}'
  port: null
  profile_template: aes67_2015
  ptp_policy_profile_name: ansible_profile
  ptp_policy_profile_uuid: null
  state: present
  sync_interval: 1
  template: ansible_fabric_policy_template
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
