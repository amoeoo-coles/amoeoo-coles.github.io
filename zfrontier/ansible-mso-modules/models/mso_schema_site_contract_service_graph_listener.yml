  listener: nlb_li_tcp
  listener_port: 80
  listener_protocol: tcp
  login_domain: null
  output_level: null
  password: '{{ mso_password }}'
  port: null
  rules:
  - name: rule1
    priority: 1
    action_type: forward
    port: 80
    protocol: tcp
    health_check:
      port: 80
      protocol: tcp
      interval: 5
      unhealthy_threshold: 2
      success_code: 200-399
  schema: mso_schema
  security_policy: default
  service_node_index: 0
  site: mso_site
  ssl_certificates: null
  state: present
  template: ansible_template1
  tenant: mso_tenant
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
