---
# YAML model for cisco.mso.ndo_ntp_policy
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_ntp_policy:
  admin_state: enabled
  authentication_state: enabled
  description: Example object managed by cisco.mso sample data
  host: '{{ mso_host }}'
  login_domain: null
  master_mode: enabled
  name: ntp_policy_1
  ntp_keys:
  - id: 1
    key: my_key
    authentication_type: md5
    trusted: true
  ntp_providers:
  - host: '{{ mso_host }}'
    minimum_poll_interval: 4
    maximum_poll_interval: 16
    management_epg_type: oob
    management_epg: default
    preferred: true
    authentication_key_id: 1
  output_level: null
  password: '{{ mso_password }}'
  port: null
  server_state: enabled
  state: present
  stratum: 4
  template: fabric_policy_template
  template_id: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  uuid: null
  validate_certs: null
