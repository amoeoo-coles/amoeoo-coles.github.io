---
# YAML model for cisco.mso.mso_site
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

mso_site:
  apic_login_domain: null
  apic_password: '{{ site_apic_password }}'
  apic_site_id: 12
  apic_username: '{{ site_apic_username }}'
  host: '{{ mso_host }}'
  labels:
  - NEDC
  - Europe
  - Diegem
  location:
    latitude: 50.887318
    longitude: 4.447084
  login_domain: null
  output_level: null
  password: '{{ mso_password }}'
  port: null
  site: north_europe
  state: present
  timeout: null
  urls:
  - 10.2.3.4
  - 10.2.4.5
  - 10.3.5.6
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
