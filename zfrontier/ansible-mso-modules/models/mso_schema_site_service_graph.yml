    provider_connector_type: destination_nat
    consumer_connector_type: redirect
  host: '{{ mso_host }}'
  login_domain: null
  output_level: null
  password: '{{ mso_password }}'
  port: null
  schema: Schema1
  service_graph: SG1
  site: site1
  state: present
  template: Template1
  tenant: tenant1
