---
# YAML model for cisco.mso.ndo_l3out_routed_sub_interface
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_l3out_routed_sub_interface:
  encapsulation_type: vlan
  encapsulation_value: 100
  host: '{{ mso_host }}'
  interface_group_policy: interface_group_policy_name
  ipv4_address: 10.0.0.1/24
  ipv6_address: 2::101/16
  ipv6_dad: enabled
  ipv6_link_local_address: FE80::10
  l3out: l3out_name
  l3out_uuid: null
  login_domain: null
  mac: 00:22:BD:F8:19:FF
  mtu: inherit
  node_group_policies: null
  node_group_policy: node_group_policy_name
  node_id: 101
  node_loopback_ip: null
  node_router_id: 192.0.2.10
  output_level: null
  password: '{{ mso_password }}'
  path: eth1/1
  port: null
  port_channel: null
  ptp:
    user_profile:
      uuid: '{{ ptp_profile.current.uuid }}'
  state: present
  target_dscp: null
  template: l3out_template
  template_id: null
  timeout: null
  use_proxy: null
  use_router_id_as_loopback: true
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
