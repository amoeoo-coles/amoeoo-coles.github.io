---
# YAML model for cisco.mso.ndo_template
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_template:
  host: '{{ mso_host }}'
  login_domain: null
  output_level: null
  password: '{{ mso_password }}'
  port: null
  sites:
  - name: ansible_test_site
  state: present
  template: ansible_tenant_policy
  template_id: null
  template_type: tenant
  tenant: ansible_test_tenant
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
