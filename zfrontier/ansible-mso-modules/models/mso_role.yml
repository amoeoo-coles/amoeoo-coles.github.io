---
# YAML model for cisco.mso.mso_role
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

mso_role:
  description: Read-only access for troubleshooting
  display_name: Read Only
  host: '{{ mso_host }}'
  login_domain: null
  output_level: null
  password: '{{ mso_password }}'
  port: null
  read_permissions:
  - view-roles
  - view-schemas
  - view-sites
  - view-tenants
  - view-tenant-schemas
  - view-users
  role: readOnly
  state: present
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  validate_certs: null
  write_permissions:
  - manage-roles
  - manage-schemas
  - manage-sites
  - manage-tenants
  - manage-tenant-schemas
  - manage-users
