---
# YAML model for cisco.mso.ndo_set_rule_policy
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_set_rule_policy:
  description: Ansible Set Rule Policy
  host: '{{ mso_host }}'
  login_domain: null
  name: set_rule_policy_1
  output_level: null
  password: '{{ mso_password }}'
  port: null
  set_additional_community:
  - '{{ set_additional_community_placeholder }}'
  - '{{ set_additional_community_placeholder }}'
  set_as_path:
    last_asn_count: 10
    path_asn_list:
    - order: 11
      asn: 1
    - order: 10
      asn: 2
  set_community:
    community: '{{ community_placeholder }}'
    criteria: replace
  set_dampening:
    half_life: 15
    reuse_limit: 750
    suppress_limit: 2000
    max_suppress_time: 60
  set_metric: 100
  set_metric_type: type2
  set_multi_path: null
  set_next_hop: 'aa::'
  set_next_hop_propagate: null
  set_preference: 200
  set_route_tag: 500
  set_weight: 50
  state: present
  template: tenant_template
  template_id: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  uuid: null
  validate_certs: null
