---
# YAML model for cisco.mso.ndo_service_device_cluster
# Collection: cisco.mso 3.0.0
# Class: not collected
# DN: not collected
# Source: plugin DOCUMENTATION / EXAMPLES. Options are only those documented
# for this module. null means omit the parameter (use the module default).
# Connection options host / username / password use inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Do not commit real credentials.

ndo_service_device_cluster:
  description: Example object managed by cisco.mso sample data
  device_mode: layer3
  device_type: firewall
  host: '{{ mso_host }}'
  interface_properties:
  - name: interface1
    external_epg:
      name: ansible_test_epg
      template: ansible_template
      schema: ansible_test
    ipsla_monitoring_policy:
      name: ansible_test_ipsla_monitoring_policy
      template: ansible_tenant_template
    qos_policy:
      name: ansible_custom_qos_policy
      template: ansible_tenant_template
    preferred_group: true
    rewrite_source_mac: false
    config_static_mac: false
    is_backup_redirect_ip: true
    load_balance_hashing: source_ip
    pod_aware_redirection: false
    resilient_hashing: true
    tag_based_sorting: false
    min_threshold: 10
    max_threshold: 100
    threshold_down_action: permit
  login_domain: null
  name: device1
  output_level: null
  password: '{{ mso_password }}'
  port: null
  state: present
  template: ansible_device_template
  template_id: null
  timeout: null
  use_proxy: null
  use_ssl: null
  username: '{{ mso_username }}'
  uuid: null
  validate_certs: null
