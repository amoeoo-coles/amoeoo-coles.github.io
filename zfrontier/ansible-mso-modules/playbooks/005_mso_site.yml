---
# Sample playbook for cisco.mso.mso_site
# Build order: 005
# Manage sites
# Reads models/mso_site.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "005 mso_site"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_site.yml
  tasks:
    - name: Ensure mso_site is present
      cisco.mso.mso_site: "{{ mso_site | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_site.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_site
      cisco.mso.mso_site: "{{ mso_site | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_site.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_site (only when model state is absent)
      cisco.mso.mso_site: "{{ mso_site | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_site.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
