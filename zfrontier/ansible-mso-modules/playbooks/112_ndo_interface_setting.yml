---
# Sample playbook for cisco.mso.ndo_interface_setting
# Build order: 112
# Manage Interface Policy Groups on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_interface_setting.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "112 ndo_interface_setting"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_interface_setting.yml
  tasks:
    - name: Ensure ndo_interface_setting is present
      cisco.mso.ndo_interface_setting: "{{ ndo_interface_setting | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_interface_setting.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_interface_setting
      cisco.mso.ndo_interface_setting: "{{ ndo_interface_setting | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_interface_setting.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_interface_setting (only when model state is absent)
      cisco.mso.ndo_interface_setting: "{{ ndo_interface_setting | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_interface_setting.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
