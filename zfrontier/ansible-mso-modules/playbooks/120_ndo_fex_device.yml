---
# Sample playbook for cisco.mso.ndo_fex_device
# Build order: 120
# Manage FEX Devices on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_fex_device.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "120 ndo_fex_device"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_fex_device.yml
  tasks:
    - name: Ensure ndo_fex_device is present
      cisco.mso.ndo_fex_device: "{{ ndo_fex_device | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_fex_device.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_fex_device
      cisco.mso.ndo_fex_device: "{{ ndo_fex_device | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_fex_device.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_fex_device (only when model state is absent)
      cisco.mso.ndo_fex_device: "{{ ndo_fex_device | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_fex_device.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
