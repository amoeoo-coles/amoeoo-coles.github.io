---
# Sample playbook for cisco.mso.ndo_schema_template_contract_service_chain
# Build order: 078
# Manage the Schema Template Contract Service Chaining workflow on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_schema_template_contract_service_chain.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "078 ndo_schema_template_contract_service_chain"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_schema_template_contract_service_chain.yml
  tasks:
    - name: Ensure ndo_schema_template_contract_service_chain is present
      cisco.mso.ndo_schema_template_contract_service_chain: "{{ ndo_schema_template_contract_service_chain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_schema_template_contract_service_chain.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_schema_template_contract_service_chain
      cisco.mso.ndo_schema_template_contract_service_chain: "{{ ndo_schema_template_contract_service_chain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_schema_template_contract_service_chain.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_schema_template_contract_service_chain (only when model state is absent)
      cisco.mso.ndo_schema_template_contract_service_chain: "{{ ndo_schema_template_contract_service_chain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_schema_template_contract_service_chain.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
