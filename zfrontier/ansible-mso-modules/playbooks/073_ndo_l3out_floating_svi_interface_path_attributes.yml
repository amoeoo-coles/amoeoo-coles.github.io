---
# Sample playbook for cisco.mso.ndo_l3out_floating_svi_interface_path_attributes
# Build order: 073
# Manage L3Out Floating SVI Interface Path Attributes on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_l3out_floating_svi_interface_path_attributes.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "073 ndo_l3out_floating_svi_interface_path_attributes"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_l3out_floating_svi_interface_path_attributes.yml
  tasks:
    - name: Ensure ndo_l3out_floating_svi_interface_path_attributes is present
      cisco.mso.ndo_l3out_floating_svi_interface_path_attributes: "{{ ndo_l3out_floating_svi_interface_path_attributes | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_floating_svi_interface_path_attributes.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_l3out_floating_svi_interface_path_attributes
      cisco.mso.ndo_l3out_floating_svi_interface_path_attributes: "{{ ndo_l3out_floating_svi_interface_path_attributes | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_floating_svi_interface_path_attributes.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_l3out_floating_svi_interface_path_attributes (only when model state is absent)
      cisco.mso.ndo_l3out_floating_svi_interface_path_attributes: "{{ ndo_l3out_floating_svi_interface_path_attributes | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_floating_svi_interface_path_attributes.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
