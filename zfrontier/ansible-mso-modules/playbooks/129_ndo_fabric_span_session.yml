---
# Sample playbook for cisco.mso.ndo_fabric_span_session
# Build order: 129
# Manage Fabric SPAN Sessions on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_fabric_span_session.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "129 ndo_fabric_span_session"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_fabric_span_session.yml
  tasks:
    - name: Ensure ndo_fabric_span_session is present
      cisco.mso.ndo_fabric_span_session: "{{ ndo_fabric_span_session | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_fabric_span_session.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_fabric_span_session
      cisco.mso.ndo_fabric_span_session: "{{ ndo_fabric_span_session | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_fabric_span_session.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_fabric_span_session (only when model state is absent)
      cisco.mso.ndo_fabric_span_session: "{{ ndo_fabric_span_session | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_fabric_span_session.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
