---
# Sample playbook for cisco.mso.ndo_tenant_netflow_exporter
# Build order: 103
# Manage NetFlow Exporter on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_tenant_netflow_exporter.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "103 ndo_tenant_netflow_exporter"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_tenant_netflow_exporter.yml
  tasks:
    - name: Ensure ndo_tenant_netflow_exporter is present
      cisco.mso.ndo_tenant_netflow_exporter: "{{ ndo_tenant_netflow_exporter | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_exporter.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_tenant_netflow_exporter
      cisco.mso.ndo_tenant_netflow_exporter: "{{ ndo_tenant_netflow_exporter | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_exporter.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_tenant_netflow_exporter (only when model state is absent)
      cisco.mso.ndo_tenant_netflow_exporter: "{{ ndo_tenant_netflow_exporter | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_exporter.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
