---
# Sample playbook for cisco.mso.ndo_route_map_policy_multicast
# Build order: 100
# Manage Multicast Route Map Policies on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_route_map_policy_multicast.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "100 ndo_route_map_policy_multicast"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_route_map_policy_multicast.yml
  tasks:
    - name: Ensure ndo_route_map_policy_multicast is present
      cisco.mso.ndo_route_map_policy_multicast: "{{ ndo_route_map_policy_multicast | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_route_map_policy_multicast.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_route_map_policy_multicast
      cisco.mso.ndo_route_map_policy_multicast: "{{ ndo_route_map_policy_multicast | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_route_map_policy_multicast.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_route_map_policy_multicast (only when model state is absent)
      cisco.mso.ndo_route_map_policy_multicast: "{{ ndo_route_map_policy_multicast | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_route_map_policy_multicast.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
