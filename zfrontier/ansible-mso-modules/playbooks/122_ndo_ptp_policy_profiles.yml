---
# Sample playbook for cisco.mso.ndo_ptp_policy_profiles
# Build order: 122
# Manage PTP Policy Profiles on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_ptp_policy_profiles.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "122 ndo_ptp_policy_profiles"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_ptp_policy_profiles.yml
  tasks:
    - name: Ensure ndo_ptp_policy_profiles is present
      cisco.mso.ndo_ptp_policy_profiles: "{{ ndo_ptp_policy_profiles | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_ptp_policy_profiles.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_ptp_policy_profiles
      cisco.mso.ndo_ptp_policy_profiles: "{{ ndo_ptp_policy_profiles | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_ptp_policy_profiles.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_ptp_policy_profiles (only when model state is absent)
      cisco.mso.ndo_ptp_policy_profiles: "{{ ndo_ptp_policy_profiles | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_ptp_policy_profiles.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
