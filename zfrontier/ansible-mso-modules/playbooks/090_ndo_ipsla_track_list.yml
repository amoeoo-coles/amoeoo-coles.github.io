---
# Sample playbook for cisco.mso.ndo_ipsla_track_list
# Build order: 090
# Manage IPSLA Track Lists on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_ipsla_track_list.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "090 ndo_ipsla_track_list"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_ipsla_track_list.yml
  tasks:
    - name: Ensure ndo_ipsla_track_list is present
      cisco.mso.ndo_ipsla_track_list: "{{ ndo_ipsla_track_list | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_ipsla_track_list.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_ipsla_track_list
      cisco.mso.ndo_ipsla_track_list: "{{ ndo_ipsla_track_list | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_ipsla_track_list.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_ipsla_track_list (only when model state is absent)
      cisco.mso.ndo_ipsla_track_list: "{{ ndo_ipsla_track_list | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_ipsla_track_list.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
