---
# Sample playbook for cisco.mso.mso_service_node_type
# Build order: 075
# Manage Service Node Types
# Reads models/mso_service_node_type.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "075 mso_service_node_type"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_service_node_type.yml
  tasks:
    - name: Ensure mso_service_node_type is present
      cisco.mso.mso_service_node_type: "{{ mso_service_node_type | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_service_node_type.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_service_node_type
      cisco.mso.mso_service_node_type: "{{ mso_service_node_type | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_service_node_type.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_service_node_type (only when model state is absent)
      cisco.mso.mso_service_node_type: "{{ mso_service_node_type | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_service_node_type.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
