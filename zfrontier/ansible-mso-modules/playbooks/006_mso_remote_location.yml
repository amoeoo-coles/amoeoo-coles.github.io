---
# Sample playbook for cisco.mso.mso_remote_location
# Build order: 006
# Manages remote locations
# Reads models/mso_remote_location.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "006 mso_remote_location"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_remote_location.yml
  tasks:
    - name: Ensure mso_remote_location is present
      cisco.mso.mso_remote_location: "{{ mso_remote_location | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_remote_location.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_remote_location
      cisco.mso.mso_remote_location: "{{ mso_remote_location | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_remote_location.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_remote_location (only when model state is absent)
      cisco.mso.mso_remote_location: "{{ mso_remote_location | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_remote_location.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
