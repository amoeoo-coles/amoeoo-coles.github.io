---
# Sample playbook for cisco.mso.mso_schema_template_anp_epg_selector
# Build order: 038
# Manage EPG selector in schema templates
# Reads models/mso_schema_template_anp_epg_selector.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "038 mso_schema_template_anp_epg_selector"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_template_anp_epg_selector.yml
  tasks:
    - name: Ensure mso_schema_template_anp_epg_selector is present
      cisco.mso.mso_schema_template_anp_epg_selector: "{{ mso_schema_template_anp_epg_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg_selector.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_template_anp_epg_selector
      cisco.mso.mso_schema_template_anp_epg_selector: "{{ mso_schema_template_anp_epg_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg_selector.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_template_anp_epg_selector (only when model state is absent)
      cisco.mso.mso_schema_template_anp_epg_selector: "{{ mso_schema_template_anp_epg_selector | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg_selector.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
