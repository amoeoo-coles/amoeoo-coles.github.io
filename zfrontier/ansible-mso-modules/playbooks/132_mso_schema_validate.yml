---
# Sample playbook for cisco.mso.mso_schema_validate
# Build order: 132
# Validate the schema before deploying it to site
# Reads models/mso_schema_validate.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "132 mso_schema_validate"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_validate.yml
  tasks:
    - name: Query mso_schema_validate
      cisco.mso.mso_schema_validate: "{{ mso_schema_validate | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_validate.state | default('present')) in ['present', 'query']
      register: query_result
