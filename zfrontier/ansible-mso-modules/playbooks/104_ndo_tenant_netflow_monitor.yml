---
# Sample playbook for cisco.mso.ndo_tenant_netflow_monitor
# Build order: 104
# Manage NetFlow Monitor on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_tenant_netflow_monitor.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "104 ndo_tenant_netflow_monitor"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_tenant_netflow_monitor.yml
  tasks:
    - name: Ensure ndo_tenant_netflow_monitor is present
      cisco.mso.ndo_tenant_netflow_monitor: "{{ ndo_tenant_netflow_monitor | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_monitor.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_tenant_netflow_monitor
      cisco.mso.ndo_tenant_netflow_monitor: "{{ ndo_tenant_netflow_monitor | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_monitor.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_tenant_netflow_monitor (only when model state is absent)
      cisco.mso.ndo_tenant_netflow_monitor: "{{ ndo_tenant_netflow_monitor | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_monitor.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
