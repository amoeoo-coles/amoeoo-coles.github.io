---
# Sample playbook for cisco.mso.mso_version
# Build order: 001
# Get version of MSO
# Reads models/mso_version.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "001 mso_version"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_version.yml
  tasks:
    - name: Query mso_version
      cisco.mso.mso_version: "{{ mso_version | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_version.state | default('present')) in ['present', 'query']
      register: query_result
