---
# Sample playbook for cisco.mso.ndo_physical_domain
# Build order: 110
# Manage Physical Domains on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_physical_domain.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "110 ndo_physical_domain"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_physical_domain.yml
  tasks:
    - name: Ensure ndo_physical_domain is present
      cisco.mso.ndo_physical_domain: "{{ ndo_physical_domain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_physical_domain.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_physical_domain
      cisco.mso.ndo_physical_domain: "{{ ndo_physical_domain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_physical_domain.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_physical_domain (only when model state is absent)
      cisco.mso.ndo_physical_domain: "{{ ndo_physical_domain | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_physical_domain.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
