---
# Sample playbook for cisco.mso.mso_schema_template_anp_epg_subnet
# Build order: 039
# Manage EPG subnets in schema templates
# Reads models/mso_schema_template_anp_epg_subnet.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "039 mso_schema_template_anp_epg_subnet"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_template_anp_epg_subnet.yml
  tasks:
    - name: Ensure mso_schema_template_anp_epg_subnet is present
      cisco.mso.mso_schema_template_anp_epg_subnet: "{{ mso_schema_template_anp_epg_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg_subnet.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_template_anp_epg_subnet
      cisco.mso.mso_schema_template_anp_epg_subnet: "{{ mso_schema_template_anp_epg_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg_subnet.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_template_anp_epg_subnet (only when model state is absent)
      cisco.mso.mso_schema_template_anp_epg_subnet: "{{ mso_schema_template_anp_epg_subnet | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg_subnet.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
