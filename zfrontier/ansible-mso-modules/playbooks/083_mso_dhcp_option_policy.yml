---
# Sample playbook for cisco.mso.mso_dhcp_option_policy
# Build order: 083
# Manage DHCP Option policies.
# Reads models/mso_dhcp_option_policy.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "083 mso_dhcp_option_policy"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_dhcp_option_policy.yml
  tasks:
    - name: Ensure mso_dhcp_option_policy is present
      cisco.mso.mso_dhcp_option_policy: "{{ mso_dhcp_option_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_option_policy.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_dhcp_option_policy
      cisco.mso.mso_dhcp_option_policy: "{{ mso_dhcp_option_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_option_policy.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_dhcp_option_policy (only when model state is absent)
      cisco.mso.mso_dhcp_option_policy: "{{ mso_dhcp_option_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_option_policy.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
