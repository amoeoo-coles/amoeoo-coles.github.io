---
# Sample playbook for cisco.mso.mso_label
# Build order: 004
# Manage labels
# Reads models/mso_label.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "004 mso_label"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_label.yml
  tasks:
    - name: Ensure mso_label is present
      cisco.mso.mso_label: "{{ mso_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_label.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_label
      cisco.mso.mso_label: "{{ mso_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_label.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_label (only when model state is absent)
      cisco.mso.mso_label: "{{ mso_label | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_label.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
