---
# Sample playbook for cisco.mso.ndo_match_rule_community_term
# Build order: 097
# Manage Match Community Terms on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_match_rule_community_term.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "097 ndo_match_rule_community_term"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_match_rule_community_term.yml
  tasks:
    - name: Ensure ndo_match_rule_community_term is present
      cisco.mso.ndo_match_rule_community_term: "{{ ndo_match_rule_community_term | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_match_rule_community_term.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_match_rule_community_term
      cisco.mso.ndo_match_rule_community_term: "{{ ndo_match_rule_community_term | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_match_rule_community_term.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_match_rule_community_term (only when model state is absent)
      cisco.mso.ndo_match_rule_community_term: "{{ ndo_match_rule_community_term | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_match_rule_community_term.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
