---
# Sample playbook for cisco.mso.mso_schema_template_anp_epg
# Build order: 034
# Manage Endpoint Groups (EPGs) in schema templates
# Reads models/mso_schema_template_anp_epg.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "034 mso_schema_template_anp_epg"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_template_anp_epg.yml
  tasks:
    - name: Ensure mso_schema_template_anp_epg is present
      cisco.mso.mso_schema_template_anp_epg: "{{ mso_schema_template_anp_epg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_template_anp_epg
      cisco.mso.mso_schema_template_anp_epg: "{{ mso_schema_template_anp_epg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_template_anp_epg (only when model state is absent)
      cisco.mso.mso_schema_template_anp_epg: "{{ mso_schema_template_anp_epg | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_anp_epg.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
