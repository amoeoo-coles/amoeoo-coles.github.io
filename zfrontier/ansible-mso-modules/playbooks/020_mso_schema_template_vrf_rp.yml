---
# Sample playbook for cisco.mso.mso_schema_template_vrf_rp
# Build order: 020
# Manage VRF Rendezvous Points (RP) in schema templates.
# Reads models/mso_schema_template_vrf_rp.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "020 mso_schema_template_vrf_rp"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_template_vrf_rp.yml
  tasks:
    - name: Ensure mso_schema_template_vrf_rp is present
      cisco.mso.mso_schema_template_vrf_rp: "{{ mso_schema_template_vrf_rp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_vrf_rp.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_template_vrf_rp
      cisco.mso.mso_schema_template_vrf_rp: "{{ mso_schema_template_vrf_rp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_vrf_rp.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_template_vrf_rp (only when model state is absent)
      cisco.mso.mso_schema_template_vrf_rp: "{{ mso_schema_template_vrf_rp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_vrf_rp.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
