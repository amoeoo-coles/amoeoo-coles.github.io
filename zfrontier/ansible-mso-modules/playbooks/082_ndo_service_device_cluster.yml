---
# Sample playbook for cisco.mso.ndo_service_device_cluster
# Build order: 082
# Manage Service Device Clusters on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_service_device_cluster.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "082 ndo_service_device_cluster"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_service_device_cluster.yml
  tasks:
    - name: Ensure ndo_service_device_cluster is present
      cisco.mso.ndo_service_device_cluster: "{{ ndo_service_device_cluster | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_service_device_cluster.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_service_device_cluster
      cisco.mso.ndo_service_device_cluster: "{{ ndo_service_device_cluster | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_service_device_cluster.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_service_device_cluster (only when model state is absent)
      cisco.mso.ndo_service_device_cluster: "{{ ndo_service_device_cluster | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_service_device_cluster.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
