---
# Sample playbook for cisco.mso.mso_backup_schedule
# Build order: 008
# Manages backup schedules
# Reads models/mso_backup_schedule.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "008 mso_backup_schedule"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_backup_schedule.yml
  tasks:
    - name: Ensure mso_backup_schedule is present
      cisco.mso.mso_backup_schedule: "{{ mso_backup_schedule | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_backup_schedule.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_backup_schedule
      cisco.mso.mso_backup_schedule: "{{ mso_backup_schedule | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_backup_schedule.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_backup_schedule (only when model state is absent)
      cisco.mso.mso_backup_schedule: "{{ mso_backup_schedule | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_backup_schedule.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
