---
# Sample playbook for cisco.mso.mso_schema_site_vrf_region_hub_network
# Build order: 025
# Manage site-local VRF region hub network in schema template
# Reads models/mso_schema_site_vrf_region_hub_network.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "025 mso_schema_site_vrf_region_hub_network"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_site_vrf_region_hub_network.yml
  tasks:
    - name: Ensure mso_schema_site_vrf_region_hub_network is present
      cisco.mso.mso_schema_site_vrf_region_hub_network: "{{ mso_schema_site_vrf_region_hub_network | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_vrf_region_hub_network.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_site_vrf_region_hub_network
      cisco.mso.mso_schema_site_vrf_region_hub_network: "{{ mso_schema_site_vrf_region_hub_network | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_vrf_region_hub_network.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_site_vrf_region_hub_network (only when model state is absent)
      cisco.mso.mso_schema_site_vrf_region_hub_network: "{{ mso_schema_site_vrf_region_hub_network | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_vrf_region_hub_network.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
