---
# Sample playbook for cisco.mso.mso_role
# Build order: 003
# Manage roles
# Reads models/mso_role.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "003 mso_role"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_role.yml
  tasks:
    - name: Ensure mso_role is present
      cisco.mso.mso_role: "{{ mso_role | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_role.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_role
      cisco.mso.mso_role: "{{ mso_role | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_role.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_role (only when model state is absent)
      cisco.mso.mso_role: "{{ mso_role | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_role.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
