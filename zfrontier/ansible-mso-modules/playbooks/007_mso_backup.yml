---
# Sample playbook for cisco.mso.mso_backup
# Build order: 007
# Manages backups
# Reads models/mso_backup.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "007 mso_backup"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_backup.yml
  tasks:
    - name: Ensure mso_backup is present
      cisco.mso.mso_backup: "{{ mso_backup | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_backup.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_backup
      cisco.mso.mso_backup: "{{ mso_backup | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_backup.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_backup (only when model state is absent)
      cisco.mso.mso_backup: "{{ mso_backup | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_backup.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
