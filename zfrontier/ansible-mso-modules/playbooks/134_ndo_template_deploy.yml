---
# Sample playbook for cisco.mso.ndo_template_deploy
# Build order: 134
# Deploy templates to sites on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_template_deploy.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "134 ndo_template_deploy"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_template_deploy.yml
  tasks:
    - name: Query ndo_template_deploy
      cisco.mso.ndo_template_deploy: "{{ ndo_template_deploy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_template_deploy.state | default('present')) in ['present', 'query']
      register: query_result
