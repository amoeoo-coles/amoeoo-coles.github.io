---
# Sample playbook for cisco.mso.mso_schema
# Build order: 011
# Manage schemas
# Reads models/mso_schema.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "011 mso_schema"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema.yml
  tasks:
    - name: Ensure mso_schema is present
      cisco.mso.mso_schema: "{{ mso_schema | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema
      cisco.mso.mso_schema: "{{ mso_schema | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema (only when model state is absent)
      cisco.mso.mso_schema: "{{ mso_schema | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
