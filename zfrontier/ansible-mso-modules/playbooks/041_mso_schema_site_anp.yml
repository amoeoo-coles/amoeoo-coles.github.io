---
# Sample playbook for cisco.mso.mso_schema_site_anp
# Build order: 041
# Manage site-local Application Network Profiles (ANPs) in schema template
# Reads models/mso_schema_site_anp.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "041 mso_schema_site_anp"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_site_anp.yml
  tasks:
    - name: Ensure mso_schema_site_anp is present
      cisco.mso.mso_schema_site_anp: "{{ mso_schema_site_anp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_anp.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_site_anp
      cisco.mso.mso_schema_site_anp: "{{ mso_schema_site_anp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_anp.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_site_anp (only when model state is absent)
      cisco.mso.mso_schema_site_anp: "{{ mso_schema_site_anp | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_anp.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
