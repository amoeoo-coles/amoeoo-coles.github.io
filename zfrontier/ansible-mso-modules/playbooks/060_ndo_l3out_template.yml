---
# Sample playbook for cisco.mso.ndo_l3out_template
# Build order: 060
# Manage L3Outs on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_l3out_template.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "060 ndo_l3out_template"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_l3out_template.yml
  tasks:
    - name: Ensure ndo_l3out_template is present
      cisco.mso.ndo_l3out_template: "{{ ndo_l3out_template | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_template.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_l3out_template
      cisco.mso.ndo_l3out_template: "{{ ndo_l3out_template | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_template.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_l3out_template (only when model state is absent)
      cisco.mso.ndo_l3out_template: "{{ ndo_l3out_template | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_template.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
