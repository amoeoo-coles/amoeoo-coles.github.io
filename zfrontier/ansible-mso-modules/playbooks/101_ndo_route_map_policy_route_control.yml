---
# Sample playbook for cisco.mso.ndo_route_map_policy_route_control
# Build order: 101
# Manage Route Map Policy for Route Control on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_route_map_policy_route_control.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "101 ndo_route_map_policy_route_control"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_route_map_policy_route_control.yml
  tasks:
    - name: Ensure ndo_route_map_policy_route_control is present
      cisco.mso.ndo_route_map_policy_route_control: "{{ ndo_route_map_policy_route_control | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_route_map_policy_route_control.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_route_map_policy_route_control
      cisco.mso.ndo_route_map_policy_route_control: "{{ ndo_route_map_policy_route_control | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_route_map_policy_route_control.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_route_map_policy_route_control (only when model state is absent)
      cisco.mso.ndo_route_map_policy_route_control: "{{ ndo_route_map_policy_route_control | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_route_map_policy_route_control.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
