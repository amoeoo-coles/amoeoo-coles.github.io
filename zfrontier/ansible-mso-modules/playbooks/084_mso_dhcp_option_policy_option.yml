---
# Sample playbook for cisco.mso.mso_dhcp_option_policy_option
# Build order: 084
# Manage DHCP options in a DHCP Option policy.
# Reads models/mso_dhcp_option_policy_option.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "084 mso_dhcp_option_policy_option"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_dhcp_option_policy_option.yml
  tasks:
    - name: Ensure mso_dhcp_option_policy_option is present
      cisco.mso.mso_dhcp_option_policy_option: "{{ mso_dhcp_option_policy_option | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_option_policy_option.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_dhcp_option_policy_option
      cisco.mso.mso_dhcp_option_policy_option: "{{ mso_dhcp_option_policy_option | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_option_policy_option.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_dhcp_option_policy_option (only when model state is absent)
      cisco.mso.mso_dhcp_option_policy_option: "{{ mso_dhcp_option_policy_option | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_option_policy_option.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
