---
# Sample playbook for cisco.mso.ndo_pod_settings
# Build order: 115
# Manage Pod Settings on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_pod_settings.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "115 ndo_pod_settings"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_pod_settings.yml
  tasks:
    - name: Ensure ndo_pod_settings is present
      cisco.mso.ndo_pod_settings: "{{ ndo_pod_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_pod_settings.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_pod_settings
      cisco.mso.ndo_pod_settings: "{{ ndo_pod_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_pod_settings.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_pod_settings (only when model state is absent)
      cisco.mso.ndo_pod_settings: "{{ ndo_pod_settings | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_pod_settings.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
