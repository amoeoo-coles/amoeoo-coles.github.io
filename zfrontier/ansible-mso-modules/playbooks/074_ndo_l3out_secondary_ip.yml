---
# Sample playbook for cisco.mso.ndo_l3out_secondary_ip
# Build order: 074
# Manage L3Out Secondary IP Address on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_l3out_secondary_ip.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "074 ndo_l3out_secondary_ip"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_l3out_secondary_ip.yml
  tasks:
    - name: Ensure ndo_l3out_secondary_ip is present
      cisco.mso.ndo_l3out_secondary_ip: "{{ ndo_l3out_secondary_ip | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_secondary_ip.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_l3out_secondary_ip
      cisco.mso.ndo_l3out_secondary_ip: "{{ ndo_l3out_secondary_ip | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_secondary_ip.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_l3out_secondary_ip (only when model state is absent)
      cisco.mso.ndo_l3out_secondary_ip: "{{ ndo_l3out_secondary_ip | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_secondary_ip.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
