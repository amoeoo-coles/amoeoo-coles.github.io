---
# Sample playbook for cisco.mso.ndo_tenant_netflow_record
# Build order: 105
# Manage NetFlow Record on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_tenant_netflow_record.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "105 ndo_tenant_netflow_record"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_tenant_netflow_record.yml
  tasks:
    - name: Ensure ndo_tenant_netflow_record is present
      cisco.mso.ndo_tenant_netflow_record: "{{ ndo_tenant_netflow_record | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_record.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_tenant_netflow_record
      cisco.mso.ndo_tenant_netflow_record: "{{ ndo_tenant_netflow_record | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_record.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_tenant_netflow_record (only when model state is absent)
      cisco.mso.ndo_tenant_netflow_record: "{{ ndo_tenant_netflow_record | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_tenant_netflow_record.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
