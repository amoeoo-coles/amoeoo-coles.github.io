---
# Sample playbook for cisco.mso.mso_schema_template_deploy_status
# Build order: 133
# Check query of objects before deployment to site
# Reads models/mso_schema_template_deploy_status.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "133 mso_schema_template_deploy_status"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_template_deploy_status.yml
  tasks:
    - name: Query mso_schema_template_deploy_status
      cisco.mso.mso_schema_template_deploy_status: "{{ mso_schema_template_deploy_status | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_template_deploy_status.state | default('present')) in ['present', 'query']
      register: query_result
