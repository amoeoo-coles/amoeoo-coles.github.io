---
# Sample playbook for cisco.mso.ndo_l3out_node_static_route_next_hop
# Build order: 067
# Manage L3Out Node Static Route Next Hops on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_l3out_node_static_route_next_hop.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "067 ndo_l3out_node_static_route_next_hop"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_l3out_node_static_route_next_hop.yml
  tasks:
    - name: Ensure ndo_l3out_node_static_route_next_hop is present
      cisco.mso.ndo_l3out_node_static_route_next_hop: "{{ ndo_l3out_node_static_route_next_hop | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_node_static_route_next_hop.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_l3out_node_static_route_next_hop
      cisco.mso.ndo_l3out_node_static_route_next_hop: "{{ ndo_l3out_node_static_route_next_hop | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_node_static_route_next_hop.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_l3out_node_static_route_next_hop (only when model state is absent)
      cisco.mso.ndo_l3out_node_static_route_next_hop: "{{ ndo_l3out_node_static_route_next_hop | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_node_static_route_next_hop.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
