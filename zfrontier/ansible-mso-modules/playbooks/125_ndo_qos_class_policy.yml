---
# Sample playbook for cisco.mso.ndo_qos_class_policy
# Build order: 125
# Manage QoS Class Policies on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_qos_class_policy.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "125 ndo_qos_class_policy"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_qos_class_policy.yml
  tasks:
    - name: Ensure ndo_qos_class_policy is present
      cisco.mso.ndo_qos_class_policy: "{{ ndo_qos_class_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_qos_class_policy.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_qos_class_policy
      cisco.mso.ndo_qos_class_policy: "{{ ndo_qos_class_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_qos_class_policy.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_qos_class_policy (only when model state is absent)
      cisco.mso.ndo_qos_class_policy: "{{ ndo_qos_class_policy | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_qos_class_policy.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
