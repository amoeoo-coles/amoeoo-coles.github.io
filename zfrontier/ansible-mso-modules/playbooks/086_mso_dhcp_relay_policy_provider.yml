---
# Sample playbook for cisco.mso.mso_dhcp_relay_policy_provider
# Build order: 086
# Manage DHCP providers in a DHCP Relay policy.
# Reads models/mso_dhcp_relay_policy_provider.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "086 mso_dhcp_relay_policy_provider"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_dhcp_relay_policy_provider.yml
  tasks:
    - name: Ensure mso_dhcp_relay_policy_provider is present
      cisco.mso.mso_dhcp_relay_policy_provider: "{{ mso_dhcp_relay_policy_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_relay_policy_provider.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_dhcp_relay_policy_provider
      cisco.mso.mso_dhcp_relay_policy_provider: "{{ mso_dhcp_relay_policy_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_relay_policy_provider.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_dhcp_relay_policy_provider (only when model state is absent)
      cisco.mso.mso_dhcp_relay_policy_provider: "{{ mso_dhcp_relay_policy_provider | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_dhcp_relay_policy_provider.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
