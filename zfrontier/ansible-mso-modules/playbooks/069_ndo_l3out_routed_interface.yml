---
# Sample playbook for cisco.mso.ndo_l3out_routed_interface
# Build order: 069
# Manage L3Out Routed Interfaces on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_l3out_routed_interface.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "069 ndo_l3out_routed_interface"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_l3out_routed_interface.yml
  tasks:
    - name: Ensure ndo_l3out_routed_interface is present
      cisco.mso.ndo_l3out_routed_interface: "{{ ndo_l3out_routed_interface | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_routed_interface.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_l3out_routed_interface
      cisco.mso.ndo_l3out_routed_interface: "{{ ndo_l3out_routed_interface | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_routed_interface.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_l3out_routed_interface (only when model state is absent)
      cisco.mso.ndo_l3out_routed_interface: "{{ ndo_l3out_routed_interface | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_l3out_routed_interface.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
