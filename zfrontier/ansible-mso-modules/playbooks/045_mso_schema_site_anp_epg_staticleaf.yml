---
# Sample playbook for cisco.mso.mso_schema_site_anp_epg_staticleaf
# Build order: 045
# Manage site-local EPG static leafs in schema template
# Reads models/mso_schema_site_anp_epg_staticleaf.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "045 mso_schema_site_anp_epg_staticleaf"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/mso_schema_site_anp_epg_staticleaf.yml
  tasks:
    - name: Ensure mso_schema_site_anp_epg_staticleaf is present
      cisco.mso.mso_schema_site_anp_epg_staticleaf: "{{ mso_schema_site_anp_epg_staticleaf | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_anp_epg_staticleaf.state | default('present')) == 'present'
      register: present_result

    - name: Query mso_schema_site_anp_epg_staticleaf
      cisco.mso.mso_schema_site_anp_epg_staticleaf: "{{ mso_schema_site_anp_epg_staticleaf | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_anp_epg_staticleaf.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove mso_schema_site_anp_epg_staticleaf (only when model state is absent)
      cisco.mso.mso_schema_site_anp_epg_staticleaf: "{{ mso_schema_site_anp_epg_staticleaf | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (mso_schema_site_anp_epg_staticleaf.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
