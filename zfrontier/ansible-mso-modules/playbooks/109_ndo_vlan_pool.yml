---
# Sample playbook for cisco.mso.ndo_vlan_pool
# Build order: 109
# Manage VLAN Pools on Cisco Nexus Dashboard Orchestrator (NDO).
# Reads models/ndo_vlan_pool.yml and uses inventory placeholders
# {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# Default model state is present: the present and query tasks run.
# The absent task runs only when the model state is set to absent.

- name: "109 ndo_vlan_pool"
  hosts: mso
  gather_facts: false
  collections:
    - cisco.mso
  vars_files:
    - ../models/ndo_vlan_pool.yml
  tasks:
    - name: Ensure ndo_vlan_pool is present
      cisco.mso.ndo_vlan_pool: "{{ ndo_vlan_pool | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'present'}) }}"
      delegate_to: localhost
      when: (ndo_vlan_pool.state | default('present')) == 'present'
      register: present_result

    - name: Query ndo_vlan_pool
      cisco.mso.ndo_vlan_pool: "{{ ndo_vlan_pool | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'query'}) }}"
      delegate_to: localhost
      when: (ndo_vlan_pool.state | default('present')) in ['present', 'query']
      register: query_result

    - name: Remove ndo_vlan_pool (only when model state is absent)
      cisco.mso.ndo_vlan_pool: "{{ ndo_vlan_pool | dict2items | rejectattr('value', 'none') | list | items2dict | combine({'state': 'absent'}) }}"
      delegate_to: localhost
      when: (ndo_vlan_pool.state | default('present')) == 'absent'
      register: absent_result
      tags:
        - absent
