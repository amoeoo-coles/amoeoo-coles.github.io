# Combined sample MSO data model for cisco.mso 3.0.0.
# Every module's documented options appear under groups.<id>.modules.<module>.
# Placeholders: {{ mso_host }} {{ mso_username }} {{ mso_password }}.
# null means omit the parameter (use the module default).
# Do not commit real credentials. Addresses use documentation/example ranges.
