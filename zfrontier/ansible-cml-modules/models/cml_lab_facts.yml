---
# Data model for cisco.cml.cml_lab_facts (cisco.cml 1.2.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.cml.cml_lab_facts
  collection: cisco.cml
  collection_version: 1.2.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/cml/cml_lab_facts_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/cml/
  module_type: info (read-only)
  build_order: 2
  group: 1. Labs and nodes
  sample_values_from: module EXAMPLES

cml_lab_facts:
  host: cml.example.com
  lab: '{{ cml_lab }}'
  password: '{{ cml_password }}'
  timeout: null
  username: '{{ cml_username }}'
  validate_certs: true
