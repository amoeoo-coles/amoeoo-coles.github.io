---
# Data model for cisco.cml.cml_node (cisco.cml 1.2.0)
# Keys are only the options documented by the module. Values come from the module's
# own EXAMPLES where available; null means omit. Credentials are placeholders only.

references:
  module: cisco.cml.cml_node
  collection: cisco.cml
  collection_version: 1.2.0
  doc_url: https://docs.ansible.com/projects/ansible/latest/collections/cisco/cml/cml_node_module.html
  galaxy_url: https://galaxy.ansible.com/ui/repo/published/cisco/cml/
  module_type: config (state)
  build_order: 3
  group: 1. Labs and nodes
  sample_values_from: module EXAMPLES

cml_node:
  config: '{{ day0_config | default(omit) }}'
  host: cml.example.com
  image_definition: '{{ cml_image_definition | default(omit) }}'
  lab: '{{ cml_lab }}'
  name: '{{ inventory_hostname }}'
  node_definition: null
  password: '{{ cml_password }}'
  state: started
  tags: null
  timeout: null
  username: '{{ cml_username }}'
  validate_certs: true
  wait: null
  x: null
  y: null
