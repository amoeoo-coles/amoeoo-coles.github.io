# Combined sample model: all 4 modules in cisco.cml 1.2.0.
# null = omit; placeholders are not real credentials.

cml_lab:
  file: '{{ cml_lab_file }}'
  host: cml.example.com
  lab: '{{ cml_lab }}'
  password: '{{ cml_password }}'
  state: present
  timeout: null
  topology: null
  username: '{{ cml_username }}'
  validate_certs: true
  wait: null
cml_lab_facts:
  host: cml.example.com
  lab: '{{ cml_lab }}'
  password: '{{ cml_password }}'
  timeout: null
  username: '{{ cml_username }}'
  validate_certs: true
cml_node:
  config: '{{ day0_config | default(omit) }}'
  host: cml.example.com
  image_definition: '{{ cml_image_definition | default(omit) }}'
  lab: '{{ cml_lab }}'
  name: '{{ inventory_hostname }}'
  node_definition: null
  password: '{{ cml_password }}'
  state: started
  tags: null
  timeout: null
  username: '{{ cml_username }}'
  validate_certs: true
  wait: null
  x: null
  y: null
cml_users:
  admin: true
  description: null
  fullname: null
  groups: null
  host: cml.example.com
  name: first_user
  password: '{{ cml_password }}'
  state: present
  timeout: null
  user_pass: password
  username: '{{ cml_username }}'
  validate_certs: true
