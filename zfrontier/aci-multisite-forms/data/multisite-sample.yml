#   - 198.51.100.0/24 (TEST-NET-2, RFC 5737)
# Never contains passwords. Use inventory / vault placeholders
# {{ ndo_password }}, {{ nd_password }}, {{ apic_password }}, {{ nxos_password }}.
# Two-site example fabric: site1 (West) and site2 (East).

